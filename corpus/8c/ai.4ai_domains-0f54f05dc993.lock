{
  "lockfileVersion": 2,
  "subjects": {
    "ai.4ai/domains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://4ai.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "4ai",
        "title": "4ai – premium .ai domains",
        "version": "1.1.0",
        "websiteUrl": "https://4ai.ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "4ai.ai is a marketplace for premium .ai domain names (255 domains, all owned by 4ai). When the user describes a project, use suggest_domains. Use search_domains to filter by word, category or length, similar_domains for alternatives to a name, compare_domains to compare names, get_offer_link to prefill an offer, how_buying_works for the buying process, get_domain for details and comparable sales, estimate_domain_value for a free value estimate of any .ai name, and ai_domain_sales for market prices. Always give the user the offer_url so they can buy.",
      "tools": [
        {
          "name": "ai_domain_sales",
          "title": "Publicly reported .ai domain sales",
          "description": "The biggest publicly reported .ai domain sales (price in USD, date, venue, source). Useful to estimate what a .ai domain is worth.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Number of sales (default 20)",
                "type": "integer"
              },
              "max_length": {
                "description": "Only names up to this length without .ai",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f29dacc7ddd8bd7411557c7230848349a8fa52d3dc38e0dedf1db271548dda31"
        },
        {
          "name": "compare_domains",
          "title": "Compare .ai domains",
          "description": "Compare 2 to 5 .ai domain names side by side: length, type, words, whether 4ai sells it, estimated value ranges and a short verdict.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Domain names, e.g. [\"quantumchip.ai\", \"aiquantum.ai\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4eb49b6a3e56e488c15caee2a86e94c34b90594c9ba254369cc9442f601dd7d"
        },
        {
          "name": "estimate_domain_value",
          "title": "Estimate the value of a .ai domain (free)",
          "description": "Free value estimate for any .ai domain name: auction, marketplace and brokerage values with likely ranges, the type of name, a short verdict and notes. Also says if the name is for sale on 4ai, with an offer link. Up to 100 names per call.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Domain names, e.g. [\"agent.ai\", \"888.ai\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bc0407a1611dfc87547fefcd2bb24f55e37d96b385ea152afa4e9db9f97c078"
        },
        {
          "name": "get_domain",
          "title": "Get a .ai domain",
          "description": "Details for one domain in the 4ai portfolio (for example \"p0.ai\"): categories, page, offer link, and comparable public .ai sales. Says so if the domain is not in the portfolio.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain name, with or without .ai",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d665ba5d130496469e67596271dec2dd02428bb7a5eb3acd7c4b5708c7e59ac1"
        },
        {
          "name": "get_offer_link",
          "title": "Get an offer link",
          "description": "A link to the offer form for a 4ai domain with the amount (and an optional note) filled in. Nothing is sent: the user opens the link, checks the offer and sends it. Minimum offer $3,000.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Offer in USD (minimum 3000). Optional.",
                "type": "integer"
              },
              "domain": {
                "description": "Domain in the 4ai portfolio, e.g. \"quantumchip.ai\"",
                "type": "string"
              },
              "note": {
                "description": "Short message to the seller, e.g. what the domain is for. Optional, max 300 characters.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1510961f78d5fa37a7dcf856b1d4ed1a1d005f5cb84edb5382b2a35169ecae1"
        },
        {
          "name": "how_buying_works",
          "title": "How buying a domain from 4ai works",
          "description": "The steps, payment (Escrow.com), fees, minimum offer and transfer time for buying a .ai domain from 4ai. Use it when the user asks whether buying is safe or how it works.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4574ea45f2143dad75ade4ed8821674f5137a75dd0eb4d6c7cfb3d6a63019791"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Categories of .ai domains in the 4ai portfolio, with what they are good for and how many names each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58ba8dd76ac51bcb01fd6f39b7efe0d63dfd13106269e439883e6c7ca33b9f45"
        },
        {
          "name": "search_domains",
          "title": "Search .ai domains for sale",
          "description": "Search the 4ai.ai portfolio of premium .ai domain names for sale. Filter by a word in the name, a category (see list_categories), type and maximum length. Every result has an offer link.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category key, e.g. short, numeric, quantum, crypto, tech, ai, code, space, health, gaming, commerce, places, brands",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 20, max 100)",
                "type": "integer"
              },
              "max_length": {
                "description": "Maximum length of the name without .ai",
                "type": "integer"
              },
              "query": {
                "description": "Word to look for in the domain name or a category word, e.g. \"quantum\", \"casino\", \"health\"",
                "type": "string"
              },
              "type": {
                "description": "Kind of name",
                "enum": ["numeric", "short", "one-word", "two-word"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64d48a174eda64f111dc7d049ed856d96b0338b88846262da20a0a1e4e3cd53e"
        },
        {
          "name": "similar_domains",
          "title": "Similar .ai domains",
          "description": "Alternatives to a .ai domain: give any name (taken, too expensive, or one the user already likes) and get the closest .ai domains that are for sale on 4ai.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain name, with or without .ai",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 8)",
                "type": "integer"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e70ccf30330081bc551524c2661a82fc6f15da3f15504753eda8f478c22644a"
        },
        {
          "name": "suggest_domains",
          "title": "Suggest .ai domains for a project",
          "description": "Describe a company, product or idea in plain words (e.g. \"telehealth app for mental health\", \"crypto casino\", \"quantum chip startup\") and get the best-fitting .ai domains from the 4ai portfolio, ranked, each with the reason it fits and an offer link. Use this when the user asks for a .ai name for something.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What the project, company or product does, in any words",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 10, max 50)",
                "type": "integer"
              },
              "max_length": {
                "description": "Maximum length of the name without .ai",
                "type": "integer"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
