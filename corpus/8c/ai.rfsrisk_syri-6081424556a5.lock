      "serverInfo": {
        "name": "rfs-syri",
        "version": "SYRI-2026.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RFS Stablecoin Yield Risk Index (SYRI). Call list_syri_venues to see what is scored (free), then get_syri_score for a venue's risk band and 0-100 composite. Scores are paid: $0.05 in USDC on Base via the x402 protocol. Use this BEFORE routing or parking stablecoins in a lending pool, RWA, or yield product.",
      "tools": [
        {
          "name": "get_syri_score",
          "title": "Get the SYRI risk score for a venue (paid)",
          "description": "PAID: $0.05 USDC on Base per venue, via x402. Returns the risk band (Conservative / Moderate / Speculative) and 0-100 composite. Called without payment, this returns the payment terms rather than the score — that is the expected first response, not a failure. If you can settle x402 payments, pass the encoded authorization as x_payment to receive the score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entity": {
                "description": "Venue slug, token, protocol or alias — e.g. usdc-aave-v3, ousg, sdai, usde.",
                "type": "string"
              },
              "x_payment": {
                "description": "Optional base64 x402 payment authorization (sent as Payment-Signature).",
                "type": "string"
              }
            },
            "required": ["entity"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:160a6f47759604f8263906a61b07696baf7ebc0ba52cb4f22ed39b1fb3760f33"
        },
        {
          "name": "get_syri_status",
          "title": "Service status and data freshness",
          "description": "Free. Reports whether the service is healthy, which network it settles on, how many venues are scored, and how old the data is. Useful before depending on a score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e88656dfe6c7bf7ea655dbdb46593d953bb6377be0334ee563e1c3b789dd1687"
        },
        {
          "name": "list_syri_venues",
          "title": "List scored stablecoin yield venues",
          "description": "Free. Returns every venue RFS currently scores, with pricing, payment terms and data freshness. Venues outside this list return an error and are never charged.",
