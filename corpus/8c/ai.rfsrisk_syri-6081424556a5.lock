      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rfs-syri",
        "version": "SYRI-2026.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RFS Stablecoin Yield Risk Index (SYRI). Call list_syri_venues to see what is scored (free), then get_syri_score for a venue's risk band and 0-100 composite, optionally with its current APY/TVL (data point `market`) and the market-wide index (`index`), or get_syri_index for the index alone. Paid per data point in USDC on Base via x402: score $0.05, market $0.02, index $0.05. Use this BEFORE routing or parking stablecoins in a lending pool, RWA, or yield product.",
      "tools": [
        {
          "name": "get_syri_index",
          "title": "Get the SYRI market index (paid)",
          "description": "PAID: $0.05 USDC on Base per call, via x402. The TVL-weighted SYRI risk score and band across every stablecoin yield venue on sale, with the equal-weighted composite, the band mix, the weighted APY and total TVL, refreshed hourly. Needs no venue. Called without payment, this returns the payment terms rather than the index — the expected first response. Pass the encoded x402 authorization as x_payment to receive it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "x_payment": {
                "description": "Optional base64 x402 payment authorization (sent as Payment-Signature).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9a966fb1972261bf358aecc8f3d5961c1c0027c312ee35865999efa7f09d98bf"
        },
        {
          "name": "get_syri_sample",
          "title": "Free sample score for one venue",
          "description": "Free. Returns the live SYRI summary for one fixed sample venue, identical in shape and freshness to a paid get_syri_score response, so you can judge the data before paying. The venue is fixed; use get_syri_score for any other venue.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0a22e35ffa753f050fb969dbaeb4186a4d1824c3c28bcae43bf0348c86cd0b69"
        },
        {
          "name": "get_syri_score",
          "title": "Get the SYRI risk score for a venue (paid)",
          "description": "PAID, per data point, USDC on Base via x402: score $0.05 (the risk band Conservative / Moderate / Speculative and 0-100 composite), market $0.02 (the venue's current APY, TVL, basis and measured_at, refreshed hourly), index $0.05 (the TVL-weighted SYRI market index across every venue on sale). Choose any with `data`; the default is score and market together. Called without payment, this returns the payment terms for the chosen points rather than the data — that is the expected first response, not a failure. If you can settle x402 payments, pass the encoded authorization as x_payment to receive them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "Data points to buy: any of score, market, index. Default [\"score\", \"market\"]. Priced per point and summed.",
                "items": {
                  "enum": ["score", "market", "index"],
                  "type": "string"
                },
                "type": "array"
              },
              "entity": {
                "description": "Venue slug, token, protocol or alias — e.g. usdc-aave-v3, ousg, sdai, usde.",
                "type": "string"
              },
              "x_payment": {
                "description": "Optional base64 x402 payment authorization (sent as Payment-Signature).",
                "type": "string"
              }
            },
            "required": ["entity"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:daede7d903d88409b10c874652825937837079e72567d7e7270c17e70bd457fb"
        },
        {
          "name": "get_syri_status",
          "title": "Service status and data freshness",
          "description": "Free. Reports whether the service is healthy, which network it settles on, how many venues are scored, and how old the data is. Useful before depending on a score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
