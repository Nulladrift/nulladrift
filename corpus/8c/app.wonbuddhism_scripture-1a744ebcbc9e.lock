      "instructions": "원불교 교서를 찾아 읽는 서버다.\n\n경전 원문·좌표·성가 번호를 기억으로 쓰지 말고, 반드시 도구로 확인한 것만 쓴다.\n확인되지 않으면 \"찾지 못했다\"고 말한다 — 그럴듯하게 지어내는 것이 여기서 가장 큰 잘못이다.\n\nsearch_scripture는 뜻이 아니라 글자를 맞추는 부분 문자열 검색이다(띄어쓰기는 무시한다).\n본문에 없는 말로는 한 건도 걸리지 않으니, 안 나오면 경전이 쓰는 말로 바꿔 다시 찾는다.\n확인된 예: \"기도\" → 심고 · \"분노\" → 성내 또는 탐진치 · \"원망\" → 감사·보은.\n\n인용은 get_passage로 확인한 원문만 쓴다. 검색 결과의 발췌는 앞뒤가 잘려 있다.\n좌표와 웹 주소는 도구가 준 것을 그대로 옮긴다 — 기억으로 쓰면 자주 틀린다.\n\n한 절을 찾았으면 get_related로 옆을 훑는다. 글자가 겹치지 않아 검색으로는 못 닿는 절이\n거기서 나온다.\n\n각주에 「※자동 생성·감수 전 초안」이 붙은 것은 기계가 붙인 초안이다. 참고만 하고 인용하지 않는다.\n대사전 해설을 경전 원문처럼 섞어 쓰지 않는다 — 인용할 때 출처를 밝힌다.\n\n정본은 hub.won.or.kr이다.",
      "tools": [
        {
          "name": "get_outline",
          "title": "책 차례",
          "description": "책의 차례. part 없이 부르면 편/품 목록, part를 주면 그 편에 든 절 목록(id 포함). 특정 자리를 알고 찾아갈 때 쓴다.",
          "inputSchema": {
            "properties": {
