          "name": "search_scripture",
          "title": "경전 원문 검색",
          "description": "경전 원문 전문 검색. 띄어쓰기를 무시한 부분 문자열 일치라 '상시일기'와 '상시 일기'가 같은 결과를 준다. 글자가 겹치지 않는 뜻 검색은 안 된다 — 실제 본문에 나오는 말로 찾을 것. '전망품 12'처럼 품·편 이름에 절 번호를 붙여 적으면 그 절이 맨 앞에 온다. 인용하려면 결과의 id로 get_passage를 불러 원문 전체를 확인한다.",
