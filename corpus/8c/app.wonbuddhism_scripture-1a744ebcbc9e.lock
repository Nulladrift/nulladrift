        {
          "name": "lookup_dictionary",
          "title": "원불교대사전",
          "description": "원불교 대사전 4,523항목. q로 표제어·한자·정의문을 찾는다(표제어가 정확히 하나 걸리면 곧바로 본문). id를 주면 그 항목. get_passage의 각주에 붙은 [대사전 ****]가 그 id다. 긴 항목(일원상·사은·법위등급 등)은 첫 절만 내주고 나머지 절 목록을 알려 준다 — 필요한 절을 section으로 다시 부른다.",
