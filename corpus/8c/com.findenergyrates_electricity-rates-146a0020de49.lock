      },
      "instructions": "FindEnergyRates: current US home electricity plans and rates. No sign-in.\n\nRead-only tools: electricity_search_plans, electricity_get_price_to_compare, electricity_find_utility_by_zip, electricity_list_utilities, electricity_about, electricity_compare_my_plan, electricity_estimate_annual_cost.\nNothing here writes, enrolls, submits or quotes a bill.\nTypical flow: ZIP code -> utility -> plans, and in states that have one, the\nutility's price to compare.\n\nRead `status` before answering:\n  ok                  use the data in the response\n  no_matches          we hold current plans there, but the filters excluded\n                      them all; suggest relaxing one\n  no_data_for_scope   our data does not cover that market right now. NEVER say\n                      the market has no plans or is not deregulated.\n\nRates are cents per kWh. Plans are ranked by price only. FindEnergyRates is a\nregistered broker in Texas only (PUCT registration BR250242); outside Texas\nresults are listings of published offers. Plans that pay FindEnergyRates on enrollment are marked `referral: true`. This never affects ranking.\nDo not present a plan with `bill_credit: true` or `anchor_shape` 'v' as the cheapest or best plan: its price depends on usage. When you mention one, give all three of its disclosed prices (disclosed_avg_500_cents, disclosed_avg_1000_cents, disclosed_avg_2000_cents, the ones it discloses). Ask for the user's monthly usage before recommending any plan.\n",
      "tools": [
        {
          "name": "electricity_about",
          "description": "Use this when someone asks what FindEnergyRates is, where its electricity data comes from, which states it covers, how plans are ranked, how fresh the data is, whether FindEnergyRates is paid, or how to cite it. Returns that, with the referral and broker disclosure and links to the privacy policy and terms. Takes no input. Do not use it for plans or rates (use electricity_search_plans or electricity_get_price_to_compare).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About FindEnergyRates and its data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7a10605b029ec48b4b92a1c1487e9df708f1dfac559e340c518310f7e40e74c"
        },
        {
          "name": "electricity_compare_my_plan",
          "description": "Use this when someone gives the rate they pay now and asks whether they could pay less, or how much they would save by switching. Returns how many current plans for their utility are cheaper at their monthly usage, the cheapest of them with estimated monthly and yearly savings, and the utility's price to compare where one exists. In Texas current_rate_cents is the all-in average price per kWh (total bill divided by kWh, delivery included); elsewhere it is the supply (generation) rate per kWh. Savings are estimates at a flat monthly usage, ranked by price only. Do not use it to switch or sign anyone up: it only compares. Plans that pay FindEnergyRates on enrollment are marked `referral: true`. This never affects ranking. Do not present a plan with `bill_credit: true` or `anchor_shape` 'v' as the cheapest or best plan: its price depends on usage. When you mention one, give all three of its disclosed prices (disclosed_avg_500_cents, disclosed_avg_1000_cents, disclosed_avg_2000_cents, the ones it discloses). Ask for the user's monthly usage before recommending any plan. `status` `no_data_for_scope` means our data does not cover that market right now, never that it has no plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_monthly_fee_dollars": {
                "description": "Outside Texas only: the user's current supplier's fixed monthly charge, if any. Texas all-in rates already include fees. Optional, default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "current_rate_cents": {
                "description": "The user's current rate in cents per kWh, e.g. 14.2. Texas: all-in average (bill total / kWh). Elsewhere: the supply rate. Required.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "state": {
                "description": "Two-letter US state code. Required.",
                "type": "string"
              },
              "term_months": {
                "description": "Only compare plans of this contract length. Optional.",
                "minimum": 1,
                "type": "integer"
              },
              "usage_kwh": {
                "description": "Monthly use in kWh from the bill. Optional; 1000 is assumed and said so.",
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "utility": {
                "description": "The electric utility (in Texas, the delivery company), as electricity_list_utilities or electricity_find_utility_by_zip names it. Required.",
                "type": "string"
              }
            },
            "required": ["current_rate_cents", "state", "utility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare my current electricity rate with current plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a4f1ae5125903c76c14cc88df0ac9d10dc4c3e4d17bd7e860045f635c218d23"
        },
        {
          "name": "electricity_estimate_annual_cost",
          "description": "Use this when someone asks what electricity plans would cost them over a year, or which plan is cheapest for their usage across the seasons. Needs the user's usage: 12 monthly kWh figures from their bills (monthly_kwh), or an annual total (annual_kwh) that is spread over the months with the state's typical monthly profile; it never assumes a usage, so ask the user first. Returns up to 5 plans ranked by estimated annual cost (price only), each with its average cents per kWh. In Texas each month's bill comes from the plan's Electricity Facts Label (delivery included); elsewhere it is the supply rate plus the plan's monthly fee, set against the utility's price to compare. A Texas bill credit counts only in months at or above its threshold: the one the facts label states (credit_threshold_source efl or efl_twin), or an assumed one where we do not hold it (assumed). Plans shorter than 12 months are left out unless include_short_terms is true. Estimates, not quotes. Do not use it to sign anyone up, or to check one current rate against plans (use electricity_compare_my_plan). Plans that pay FindEnergyRates on enrollment are marked `referral: true`. This never affects ranking. `status` `no_data_for_scope` means our data does not cover that market right now, never that it has no plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_kwh": {
                "description": "The user's total kWh for a year; spread over the months by the state profile.",
                "maximum": 60000,
                "minimum": 1200,
                "type": "number"
              },
              "detail": {
                "description": "Add each plan's 12 monthly bills. Default false.",
                "type": "boolean"
              },
              "include_short_terms": {
                "description": "Include plans under 12 months, priced as if they renewed at the same price for the rest of the year (each is marked). Default false.",
                "type": "boolean"
              },
              "monthly_kwh": {
                "description": "The user's kWh for each month, January to December, from their bills. Give this, or annual_kwh, or usage_kwh.",
                "items": {
                  "maximum": 10000,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 12,
                "minItems": 12,
                "type": "array"
              },
              "state": {
                "description": "Two-letter US state code. Required.",
                "type": "string"
              },
              "term_months": {
                "description": "Only plans of this contract length. Optional.",
                "minimum": 1,
                "type": "integer"
              },
              "usage_kwh": {
                "description": "One typical month's kWh; treated as 12 times that and spread the same way.",
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "utility": {
                "description": "The electric utility (in Texas, the delivery company), as electricity_list_utilities or electricity_find_utility_by_zip names it. Required.",
                "type": "string"
              }
            },
            "required": ["state", "utility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate what electricity plans would cost over a year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:944821e91efe8f889d61ef245036f11114881cc19821ced48f18b47c5d8b65d0"
        },
        {
          "name": "electricity_find_utility_by_zip",
          "description": "Use this first when someone gives a ZIP code and wants electricity plans, rates or to know their electric company. Returns the electric utility for a 5-digit US ZIP code and, in Texas, the delivery company (TDSP). A boundary ZIP code can have more than one: show them all and never pick one. Do not use it for gas utilities, street addresses or non-US postal codes. `status` `no_data_for_scope` means the ZIP code is not in our map, not that it is unserved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "description": "5-digit US ZIP code, e.g. '75201'.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the electric utility for a ZIP code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:14e0d3acf7c263218aa4381fc5fb9128698d514104036179e679b11c2e87f62c"
        },
        {
          "name": "electricity_get_price_to_compare",
          "description": "Use this when someone asks what their electric utility's default rate is (the 'price to compare' or default service supply rate on the electric bill), or whether a plan's rate beats it. Returns the current rate in cents per kWh, supply only. Do not use it for Texas (Texas has no price to compare), for a whole electric bill (delivery charges are not included), or for past rates (only the current rate is held). `status` `no_data_for_scope` means we hold no rate for that state, never that the utility has none; never invent one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter US state code, e.g. 'PA'. Required.",
                "type": "string"
              },
              "utility": {
                "description": "Utility name, full or partial: 'Eversource' matches 'Eversource - NSTAR' and 'Eversource - WMECO'. Required.",
                "type": "string"
              }
            },
            "required": ["state", "utility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the utility's price to compare"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a2b63c80c15c1476f01e1fa20095a5cfa87085d9b76ed2a7eaaa1164e48231a"
        },
        {
          "name": "electricity_list_utilities",
          "description": "Use this when someone asks which electric utilities or Texas delivery companies we have plans for in a state, or when you need the exact utility name to pass to electricity_search_plans or electricity_get_price_to_compare. Returns each utility with its current plan count, the newest data date, whether a price to compare is held, and the other names electricity_find_utility_by_zip may use for it (zip_lookup_names). Do not use it to find the utility for a ZIP code (use electricity_find_utility_by_zip). `status` `no_data_for_scope` means we hold no utilities for that state, never that it has none.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter US state code, e.g. 'TX', 'OH'. Required.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the electric utilities we cover in a state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ce4185b6d2d7d68cebbdad76e78755a05adb4538c3ece87d80cb5f2eca26d1e"
        },
        {
          "name": "electricity_search_plans",
          "description": "Use this when someone wants to compare electricity plans or rates for their home: to lower an electric bill, find a cheaper rate per kWh, or see fixed-rate or renewable options for their utility. Returns up to 5 current residential plans for one utility in one state, cheapest first (ranked by cost only); in Texas at the monthly usage given in `usage_kwh`, or 1000 kWh when it is omitted. Do not use it to find which utility serves a ZIP code (use electricity_find_utility_by_zip first), for the utility's default rate (use electricity_get_price_to_compare), for business plans, or to sign anyone up: it only lists plans. Plans that pay FindEnergyRates on enrollment are marked `referral: true`. This never affects ranking. Do not present a plan with `bill_credit: true` or `anchor_shape` 'v' as the cheapest or best plan: its price depends on usage. When you mention one, give all three of its disclosed prices (disclosed_avg_500_cents, disclosed_avg_1000_cents, disclosed_avg_2000_cents, the ones it discloses). Ask for the user's monthly usage before recommending any plan. Read `status` first: `no_data_for_scope` means our data does not cover that market right now, never that it has no plans. Plans are those seen in the last 7 days. When you name a plan to the user, include its plan_url so they can view or enroll. Outside Texas results are listings of published offers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "green": {
                "description": "true = 100% renewable plans only; false = 0% renewable only. Plans whose renewable content is unknown are left out by both.",
                "type": "boolean"
              },
              "state": {
                "description": "Two-letter US state code, e.g. 'TX', 'OH', 'PA'. Required.",
                "type": "string"
              },
              "term_months": {
                "description": "Contract length in months, e.g. 12. Optional.",
                "minimum": 1,
                "type": "integer"
              },
              "usage_kwh": {
                "description": "Monthly electricity use in kWh (100-5000), from the electric bill. Optional. In Texas, if omitted, 1000 is assumed (the EFL comparison point) and the result says so in `usage_assumed_kwh`; pass the user's own usage when known. Outside Texas plans disclose no usage-based prices, so omit it there and plans are ranked by rate_kwh_cents. Texas plans are priced and ranked at the disclosed EFL usage (500, 1000 or 2000 kWh) nearest it, ties to 1000; each plan reports which (pricing_basis_kwh, rate_at_usage_cents, the label's price there, verbatim; anchor_distance_kwh). Ranking uses credit_aware_rate_cents: that price, but with a bill credit counted only when the usage reaches the credit's threshold (credit_threshold_source, credit_applied). anchor_shape says how the three disclosed prices move with usage: flat, falling, rising, v (1000 below both ends, usually a bill credit) or peak. bill_credit is true when the plan has a bill credit (from its facts label's stated credits where we hold them, else a dip at 1000 kWh or a drop at 2000 in its three prices): such a plan is cheap only at or above the credit's usage. Plans that disclose no price at any usage come last as 'unpriced'. est_monthly_cost_dollars is always null.",
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "utility": {
                "description": "The electric utility (in Texas, the delivery company) exactly as electricity_find_utility_by_zip returns it, e.g. 'ONCOR', 'AEP Columbus', 'PECO Energy'. Required. A wrong name returns the list of utilities we hold for that state.",
                "type": "string"
              }
            },
            "required": ["state", "utility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search electricity plans and rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33c420dacc3561391c2c1e2d05362627fe2bf1c6aefa782b3f4d5b9efbb43350"
        }
      ],
      "digest": "sha256:cf323f2119b8d537ba969da6c4c377310e697a50c540c0737568983a09e16295"
    }
  }
