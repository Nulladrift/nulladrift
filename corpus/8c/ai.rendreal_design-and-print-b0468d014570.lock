        {
          "name": "order_create_payment_link",
          "title": "Create a payment link",
          "description": "Create a Stripe embedded-checkout link for an existing order, only when the customer asks to pay.\n\nThe link locks the order to its design for good, so never create it just\nbecause the customer picked or finished a design.\n\nOnly for orders created in this session (`OrderNotInSessionError`\notherwise) — an order someone mentions or that `order_lookup` found\ncannot be paid here, so offer to escalate rather than retrying.\n\nAttaches each item's design to its own item once every item is covered.\nEach item needs a design or artwork with a submitted page mapping.\nUses each design's latest snapshot, so the customer gets the version they\nlast refined. Do NOT call `order_attach_design` yourself, even on an order\nwith several items. Attaching is irreversible upstream, and doing it earlier\nlocks the order onto a draft the customer has since edited. A file uploaded\nfor an item after its design, before the attach, replaces that design.\n\nEvery line must carry artwork before the order can be paid\n(`ArtworkRequiredError` otherwise) — either a design (attached\nhere, at `order_create` time, or via `order_attach_design`) or a\nfinished artwork file uploaded through `order_get_artwork_upload_page`. A\nmulti-item order is one Stripe checkout, so a multi-line cart is payable\nonce each line is covered. `DesignRenderFailedError` means an attached\ndesign's print file failed to render. The design on this order cannot be\nchanged, so no retry here helps; the reason says how to place a new order. `NoSnapshotError` means the\nsession's design is not saved yet; a photo book can take a few minutes\nafter it resolves. Wait a little and call this again. After 5 tries\nwithout a saved design it becomes `ArtworkStillRequiredError`.\n\nReturns a job — poll until SUCCEEDED for the `checkout_url`. Put\n`checkout_url` in your reply as a markdown hyperlink (never the raw URL),\nand call `order_get` yourself to confirm payment. When the payment card is\ndisplayed, it shows a \"Pay securely\" button wired to the link and polls\n`order_get` itself once clicked, so just confirm the payment step is ready\nand share the link again only if the customer asks for it.",
