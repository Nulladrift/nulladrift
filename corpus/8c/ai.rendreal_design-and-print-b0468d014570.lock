        {
          "name": "prepress_confirm",
          "title": "Record the mapping answer",
          "description": "Record the customer's approval of a `PROPOSED` mapping. The mapping\ncarries an `APPROVE_MAPPING` confirmation in `pending_confirmations`, and\nanswering it here with the `approve` option is what unlocks\n`prepress_submit_mapping`.\n\n`confirmation_id` and `option_id` must both be copied verbatim from the\nconfirmation — `option_id` is the listed option, never a phrase the\ncustomer typed and never a value you compose. If the customer does not\nwant this mapping, do not answer the confirmation: call\n`prepress_map_pages` with the `positions` they ask for, or ask for\ncorrected files.\n\nReturns a `job_id`. The result is the same shape as `prepress_map_pages`.\nJob errors: `ConfirmationNotFoundError` (already answered, or wrong id),\n`InvalidAnswerError` (option not on that confirmation), `AlreadyMappedError`\n(this item already went through the one-way door), or `ItemHasDesignError`\n(the item holds an attached design, which is what prints).",
          "inputSchema": {
