        {
          "name": "design_generate_candidates",
          "title": "Generate design candidates",
          "description": "Generate several candidate designs for ONE brief so the user can pick.\n\nA design usually starts here: the user describes what they want and gets\nthree options back. For a single design, or to refine one they already\npicked, use `design_start_for_order`.\n\n`prompt` MUST be the user's own description of the piece. Never synthesise a\nbrief, and never treat their choice of the design route as a description of\nthe artwork: if they have not said what they want, ask before calling this.\nEach call spends `count` real generations, so a guessed brief wastes them all\nand shows the user designs for something they never asked for.\n\nPass the order_id and the design brief; it provisions `count` designs\n(default 3) against the order's\nreal geometry, generates each in parallel, and returns them as `candidates`\n— each with a `design_id`, a short `summary`, a `design_url`, and\n`thumbnails`. Pass `item_id` to design one item; it is required when the\norder has several items (`OrderItemRequiredError` lists them). Each item\nkeeps its own design, so the items of an order can be designed side by side.\nOn an order with several items, an item whose design is already attached\nfails with `DesignAttachedError`, because that design is final. An item\nwhose uploaded file has a submitted page mapping fails with\n`UploadMappingSubmittedError`, because that file prints.\n\nPresent every candidate to the user as a numbered markdown link to its\nthumbnail (and `design_url`) so they SEE each option — never only the text\nsummary — and use those URLs EXACTLY as returned (never build or guess one).\nNumber them in the order returned: the user may reply by position (\"design\nnr 2\"), so map that number back to `candidates[n-1].design_id` yourself.\nA candidate with `thumbnails_pending: true` has no preview yet: its image is\nstill rendering, and it may not become available. Still offer it and link its\n`design_url`. Tell the user that the preview is still rendering and may not be\navailable, and that they can choose the design or open it in the editor anyway.\nDo not say that the preview will appear.\nThen let the USER choose and call `design_pick_candidate` with their chosen\n`design_id` before any `design_chat`; the unpicked candidates are dropped.\nWhile a batch is unpicked, a new call fails with `CandidatePendingError`.\nIf the customer rejected every candidate, offer a new batch. Call again with\n`discard_unpicked=true` only after they say yes: it drops the unpicked batch.\nEach order item gets at most 3 batches (`CandidateBatchLimitError`).\n\nReturns a job — poll with poll_job until SUCCEEDED.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 3,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "discard_unpicked": {
                "default": false,
                "type": "boolean"
              },
              "item_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
