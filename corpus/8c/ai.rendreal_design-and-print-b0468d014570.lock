        {
          "name": "order_attach_design",
          "title": "Attach a design to an order",
          "description": "Pin a design to an existing order ahead of checkout.\n\nUsually unnecessary: `order_create_payment_link` attaches the session's\ndesign itself. Prefer that — attaching locks that item's design, and the\npayment link will not replace it, so an early attach freezes the order\nonto a version the customer may still be editing. Call this only when the customer explicitly wants a design locked\nto the order now. On an order with several items, each item keeps its own\ndesign, and the payment link attaches each one. An attached design is\nfinal for its item: `design_chat` then fails with `DesignAttachedError`.\n\nNormally omit `design_snapshot_id`: Compass attaches\nthe design's latest snapshot automatically (resolved from RendReal 360,\nretried briefly to let it sync after resolve),\nraising `NoSnapshotError` when the design still has no snapshot after\nthose retries. A `design_snapshot_id` you pass in is accepted only when\nit matches that resolved latest snapshot — it can't inject an arbitrary\nsnapshot — so there is rarely a reason to pass one. Once the order's\nartwork is settled, call `order_create_payment_link` only when the\ncustomer asks to pay.\n\nPass `item_id` to attach to one item; it is required when the order has\nseveral items (`OrderItemRequiredError` lists them). The session's active\ndesign goes to the item it was made for when `item_id` is omitted, and\nanother item fails with `DesignItemMismatchError`. An item whose uploaded\nfile has a submitted page mapping fails with `UploadMappingSubmittedError`,\nbecause that file prints. Only valid for orders\ncreated in this session (`OrderItemsUnknownError` otherwise — item ids\nexist nowhere else). Returns a job — poll until SUCCEEDED for the order's\nnew status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
