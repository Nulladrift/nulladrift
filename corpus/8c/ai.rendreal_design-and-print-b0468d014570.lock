        {
          "name": "prepress_submit_mapping",
          "title": "Submit the page mapping",
          "description": "Apply the proposed mapping to the order — the print suppliers' record.\n\nCall only after the customer's approval has been recorded: answer the\n`APPROVE_MAPPING` confirmation with `prepress_confirm` first, unless the\nmapping card already did (the item is `approved`). This is the step that\ncommits. Requires a `PROPOSED` mapping, approved.\n\nReturns a `job_id`. This waits for page management to finish, so the\nresult usually reports `configured: true` and no follow-up is needed. If\nit reports `configured: false` the mapping is applied and still\nprocessing — call `prepress_check_configuration` later, and never\nre-submit.\n\nJob errors: `OrderNotMappableError` (the order has moved past awaiting\nartwork — mapping is no longer possible), `MappingNotApprovedError` (the\ncustomer hasn't approved yet — answer the `APPROVE_MAPPING` confirmation\nwith `prepress_confirm`), `MappingNotProposedError`, `MappingRejectedError`\n(a file changed since\nthe proposal — re-run `prepress_map_pages`), or\n`UnrepresentableMappingError`, or `ItemHasDesignError` (the item holds an\nattached design, and the design is what prints).\n\nA submitted mapping is what prints for the item, so the design and\ncandidates made for it are released: the next item can be designed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "type": "string"
              },
              "order_id": {
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["item_id", "order_id", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "description": "The Runner's response to a `@runner.job` invocation.\n\nOn the fast path (work completed within budget), `status` is SUCCEEDED\nor FAILED and `result` / `error` is populated. On the slow path,\n`status` is RUNNING and `job_id` is the handle the host LLM uses for\n`poll()`.\n\nOn FAILED, `error` is the safe class-name code; `reason` / `detail` are\npopulated only when the failure carries a host-safe explanation (e.g. a\nRendReal rejection's server message + body), else they stay None.\n\nOn RUNNING, `note` carries model-facing guidance: it tells the host LLM whether\na widget is already polling the job, or whether it must call `poll_job` itself.",
                    "properties": {
                      "detail": {
                        "anyOf": [
                          {},
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      },
                      "error": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      },
                      "job_id": {
                        "type": "string"
                      },
                      "note": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      },
                      "reason": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
