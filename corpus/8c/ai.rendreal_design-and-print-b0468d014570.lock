          "name": "order_request_artwork_upload",
          "title": "Request an artwork upload slot",
          "description": "Step 1 of attaching the customer's finished artwork file to an order line: get a presigned upload URL.\n\nReturns a presigned `url`, `method` (PUT), `headers`, and `object_key`.\nGet `item_id` from `order_get_artwork_spec`.\nPUT the raw file bytes straight to `url` with the `headers` verbatim (the\nbytes never pass through Compass), then call `order_confirm_artwork_upload`\nwith the same `object_key`. Use for a line that has finished artwork and\nneeds no design from us; prefer `order_get_artwork_upload_page` when the\nuser has the file but you don't. Only works for orders created in this\nsession. Refused with `ItemDesignAttachedError` when the item of a\nmulti-item order already holds an attached design: that design is what\nprints, and changed artwork for the item needs a new order.",
