        {
          "name": "order_cancel",
          "title": "Cancel an order",
          "description": "Cancel an order this session created, or a paid order from another conversation, while RendReal still allows it.\n\nIrreversible — the order and any artwork work on it are gone. An order is\ncancelled whole: there is no per-item cancel, so when the customer names one\nproduct of an order with several items, tell them the cancel ends every item\nin it. Call it as soon\nas the customer asks to cancel: an unpaid order is cancelled on that call when\nCompass reads their `customer_words` as a request to cancel it. Any other call,\nsuch as for a paid order or on words that ask for something else, takes two\ncalls: the first fails with `OrderCancelConfirmationRequiredError` and sends\nnothing. Then quote the\norder's `reference_id` back to the customer and wait for a clear yes. Only after\nthey agree, call again with `confirmed=true` and the brief cancellation\nquestion plus their exact answer in `customer_words`. `confirmed=true` on a\ncall Compass has not refused yet, or with no new customer words since the\nrefusal, is refused the same way.\n`customer_words` is an exact quote of only the customer's request to cancel\nthis order on the first call. On the confirming call, include only the brief\ncancellation question and the customer's exact answer, even if they repeat\nthe same words, such as \"yes\". Exclude the rest of their message and all\nconversation history. Never paraphrase. Never cancel on a hint, and never pick\nthe order yourself when the session has several — ask.\n\nFor an order this session created, pass its `order_id`. For an order from\nanother conversation, pass instead the `reference_id` and `email` the customer\ngives you — the order reference and the email it was paid with, exactly as typed,\nnever guessed — on both calls. `ForeignOrderNotFoundError` means the pair matched\nno order: ask them to re-check both. Only a paid order from another conversation\ncan be cancelled here: `ForeignOrderNotPaidError` means it is unpaid; give the\ncustomer its reason as written. A foreign `order_id` alone fails with\n`OrderNotInSessionError` and no upstream call. RendReal decides\nwhat is cancellable: an unpaid order, or a paid order in the short window\nafter payment, before production starts. A refusal (`OrderNotCancellableError`)\nmeans production has started and no retry will help: tell the customer and\noffer customer support. After a confirmed cancel, read `refund`: for\n`refunded`, tell the customer the payment is refunded to the card they paid\nwith; for `requested`, give them `refund_note` as written; for `none`, say\nnothing about a refund. Promise no timing for a refund,\nand never tell the customer they were not charged.\n\nReturns a job — poll until SUCCEEDED. `status` is the order's live status\nafter the cancel, read back from RendReal: only `CANCELLED` there means it\nis cancelled. `already_cancelled: true` means it was cancelled before this\ncall and nothing was sent. `OrderCancelNotConfirmedError` means RendReal\naccepted the request but the order has not changed state yet — say the\nrequest went through but is unconfirmed, and re-check with `order_get` on\nthe customer's next message. `OrderCancelOutcomeUnknownError` means the\nrequest reached RendReal but its outcome could not be confirmed: say neither that\nit is cancelled nor that nothing changed; say you could not confirm it, and\ncheck `order_get` on their next message; for an order from another conversation,\nre-check with `order_lookup` instead. After a confirmed cancel the cart line the\norder came from is orderable again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmed": {
                "default": false,
                "type": "boolean"
              },
              "customer_words": {
                "description": "Exact customer cancellation request on the first call. On the confirming call, include only the brief cancellation question and the customer's exact answer. Exclude unrelated message text and conversation history.",
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "order_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "reference_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "session_id": {
                "type": "string"
              }
            },
