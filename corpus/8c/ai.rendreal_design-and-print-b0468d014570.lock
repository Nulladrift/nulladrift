                        "anyOf": [
                          {
                            "additionalProperties": {},
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      },
                      "status": {
                        "enum": ["PENDING", "RUNNING", "SUCCEEDED", "FAILED"],
                        "type": "string"
                      }
                    },
                    "required": ["job_id", "status"],
                    "type": "object"
                  },
                  {
                    "description": "Canonical short-circuit response shape.\n\n`status` is always `\"error\"` — acts as a discriminator for LLM consumers.\n`error` is a machine-readable code (e.g. `session_not_found`).\n`reason` is a human-readable explanation of why the call failed.\n`detail` carries structured extra context (ids, available values, etc.).",
