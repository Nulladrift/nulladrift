        {
          "name": "design_pick_candidate",
          "title": "Pick a design candidate",
          "description": "Pick one of the candidates from `design_generate_candidates`.\n\nPass the `design_id` the USER chose. It binds that design as the active\none and drops the rest; the next `design_chat` continues refining it. Returns\nthe picked design's `design_url` + `thumbnails` — share them verbatim. With\n`thumbnails_pending: true` the preview is still rendering and may not become\navailable: say so, give the `design_url` so the user can see the design in\nthe editor, and call `design_status` for the preview later. Do not say that\nthe preview will appear.\n\nThe picked design is ALREADY resolved (`design_resolved: true`) and stays\nbound to `order_id` and its item. Do NOT call `order_attach_design`: the payment\nlink attaches the design of each item. The pick fails with `DesignAttachedError` when the\ncandidates' item already holds an attached design, and with\n`UploadMappingSubmittedError` when that item's uploaded file has a submitted\npage mapping. Do not call `order_create_payment_link` unless the customer asked\nto pay: the payment link attaches the design and locks the order to it for\ngood. If they did not ask, show the customer the design and ask whether they\nwant changes; call `design_chat` if they do.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["design_id", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "properties": {
                      "design_id": {
                        "type": "string"
                      },
                      "design_resolved": {
                        "const": true,
                        "default": true,
                        "type": "boolean"
                      },
                      "design_url": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      },
                      "next_step": {
                        "default": "The customer chose this design and can still change it. On an order with several items, the payment link is refused until every item is covered. Each item needs a design or artwork with a submitted page mapping. If they already asked to pay and every item is covered, create the payment link now. If another item is not covered, complete its design or artwork first. If they have not asked to pay, ask whether they want changes. Create the link only when they ask to pay: the link locks each item to its own design.",
                        "description": "What to do after the pick.",
                        "type": "string"
                      },
                      "order_id": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "The order the candidates were generated for. The payment link attaches the picked design to this order."
                      },
                      "thumbnails": {
                        "items": {
                          "description": "One position's rendered thumbnail from Artifex's getDesign response.",
                          "properties": {
                            "page_or_side_number": {
                              "anyOf": [
                                {
                                  "type": "integer"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "default": null
                            },
                            "position": {
                              "type": "string"
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["position", "url"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "thumbnails_pending": {
                        "default": false,
                        "description": "The picked design's preview is still rendering and may not become available: call `design_status` for it later, and never promise the user that it will appear.",
                        "type": "boolean"
                      }
                    },
                    "required": ["design_id"],
                    "type": "object"
                  },
                  {
                    "description": "Canonical short-circuit response shape.\n\n`status` is always `\"error\"` — acts as a discriminator for LLM consumers.\n`error` is a machine-readable code (e.g. `session_not_found`).\n`reason` is a human-readable explanation of why the call failed.\n`detail` carries structured extra context (ids, available values, etc.).",
