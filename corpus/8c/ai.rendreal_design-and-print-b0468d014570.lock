          "name": "design_get_image_upload_page",
          "title": "Get the image upload page",
          "description": "Return a browser page for uploading the user's own logo or photo.\n\nCall when the user wants to add an image and this client cannot receive its bytes;\nnever ask for a local file path or claim images cannot be accepted.\nPass `design_id` for an existing design. Otherwise pass `order_id` for an order\nalready created in this session, before `design_generate_candidates`, and\n`item_id` when that order has several items. On an\norder with several items, an item whose design is already attached fails with\n`DesignAttachedError`, because that design is final. An item whose uploaded file\nhas a submitted page mapping fails with `UploadMappingSubmittedError`.\nCompass reuses a design for that order or creates an upload-only target;\na newly created target must not be used with `design_chat`.\nThe page attaches the image to the session for the next `design_chat` or\n`design_generate_candidates` call.\n\nPut the returned `url` in your reply as a markdown hyperlink (never the raw URL) and\ntell the customer to open it and drop their image. When the upload card is displayed,\nit shows an \"Open upload page\" button wired to the `url`, so just tell the customer to\nopen it and share the `url` again only if the customer asks for it.",
