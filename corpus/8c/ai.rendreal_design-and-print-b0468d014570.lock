        {
          "name": "order_create",
          "title": "Place the order",
          "description": "Create an order from the session cart (starts unpaid — PENDING_ARTWORK\nor PENDING_PAYMENT depending on the server).\n\nFor a one-line cart, pass that line's `offer_id` alone. For a cart with\nseveral lines, pass `selections=[{line_id, offer_id}, ...]`, one per line,\nto order them together as one order with one item per line; a bare\n`offer_id` against such a cart is rejected (`MultiLineCartError`) rather\nthan silently ordering just one line.\nEach item re-sends the sku + configuration its quote priced and binds the\nchosen offer; the server recomputes price, so no money is sent. Every\n`offer_id` must belong to the cart (`OfferNotFoundError` / `LineNotFoundError`\notherwise — re-run `order_get_quote`). If RendReal refuses the chosen offer, the\njob fails with `OfferRefusedError` and no order is placed: quote again and let the\ncustomer choose. If RendReal refuses the order itself, the job fails with\n`OrderRefusedError`: the refusal is permanent, so offer a change to the setup or\ncustomer support, never a retry.\n\nShipping and tax are filled by Stripe at checkout. Attach artwork per line:\nwith `selections`, set each entry's `design_id` + `design_snapshot_id`; with a\nbare `offer_id`, pass the top-level `design_id` + `design_snapshot_id`. Both\nids are required for a design to attach, and the snapshot must be the owned\ndesign's latest. Every line needs artwork — a design, or a finished artwork file\nuploaded via `order_get_artwork_upload_page` — before the order can be paid\n(`order_create_payment_link` enforces it).\n\nA line already ordered in this session is refused (`LineAlreadyOrderedError`)\nbefore any upstream order is placed, so the same still-quoted line can't be\nbought twice; `order_view_cart` marks such a line `already_ordered=true`.\nStart a new line to buy it again.\n\nIf `catalog_configure_product` reported an Unmet Constraint for any selected\nline, the order is refused (`UnmetConstraintUnansweredError`; `detail.lines`\nlists every such line with its asks in `unmet`) until the customer answers for\neach listed line. Tell the customer, per line, what they asked for and what the\noption accepts. If they accept every listed line as configured, call again with\n`unmet_accepted=true`, which orders all the selected lines. If they want a change\non any line, call `catalog_configure_product` with their answer for that line\ninstead.\n\nReturns a job — poll until SUCCEEDED for the `order_id` and each line's\n`item_id`. Then get any missing artwork: design it against the order, or have\nthe customer upload a finished file. Call `order_create_payment_link`\nonly when the customer asks to pay.\nAn item with `designable: false` cannot be designed here: for that item offer\nonly the upload of a finished print file, never a design.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "design_snapshot_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "offer_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "selections": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "design_id": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        },
                        "design_snapshot_id": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        },
                        "line_id": {
                          "type": "string"
                        },
                        "offer_id": {
                          "type": "string"
                        }
                      },
                      "required": ["line_id", "offer_id"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "session_id": {
                "type": "string"
              },
              "unmet_accepted": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "description": "The Runner's response to a `@runner.job` invocation.\n\nOn the fast path (work completed within budget), `status` is SUCCEEDED\nor FAILED and `result` / `error` is populated. On the slow path,\n`status` is RUNNING and `job_id` is the handle the host LLM uses for\n`poll()`.\n\nOn FAILED, `error` is the safe class-name code; `reason` / `detail` are\npopulated only when the failure carries a host-safe explanation (e.g. a\nRendReal rejection's server message + body), else they stay None.\n\nOn RUNNING, `note` carries model-facing guidance: it tells the host LLM whether\na widget is already polling the job, or whether it must call `poll_job` itself.",
                    "properties": {
                      "detail": {
