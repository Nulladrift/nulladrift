        {
          "name": "knowledgebase_list",
          "title": "List help topics",
          "description": "List every question the customer knowledge base can answer — how the service\nworks, what we offer, design, artwork files, ordering, payment, delivery, privacy.\n\nCall this before answering a question about how the service works or what its\npolicies are — even one that sounds obvious (\"do I need an account?\", \"can I cancel\nafter paying?\", \"what resolution should my images be?\"). The entry is the source for\nthis business's policies. Read the `index`, pick the entry whose question\nmatches theirs, then call `knowledgebase_get` with its `entry_id` and answer from that\nentry. If no question matches, say you don't have that information — never state a\npolicy the corpus does not contain.\n\nThe test is whether answering needs a LIVE LOOKUP. If the true answer would differ per\nproduct, per job or per order, it is not in here: what sizes or options a product comes\nin, whether you print a particular thing, what a configured job costs, the turnaround on\nan offer you already quoted, where a given order stands, the exact bleed measurement for\nan order's artwork (a general bleed question — \"do I need bleed?\", \"what bleed?\" — is a\nquestion for here). Those come from `catalog_search`/`catalog_get_schema`, `order_get_quote`,\n`order_get_artwork_spec` and `order_get`/`order_lookup`. Everything that is the same\nanswer for every customer — delivery, refunds, design ownership, whether they can supply\ntheir own logo or artwork, what file formats we take — is a question for here, even when\nthe answer involves numbers. A general question that names no order or product yet (how\nto track a parcel or check an order, whether a sample is possible, the smallest order) is\na question for here too, even when it reads like a request to look one up: read the entry\nfirst, then offer the lookup or ask which product. But an order the customer names by its\nreference is a live lookup, however general it sounds: look that order up and read no\nentry. Read at most ONE entry per question —\nthe index gives you\nenough to pick the right one — and don't look it up again later in the conversation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "properties": {
                      "count": {
                        "type": "integer"
                      },
                      "index": {
