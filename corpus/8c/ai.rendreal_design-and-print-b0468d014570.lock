        {
          "name": "order_list",
          "title": "List this session's orders",
          "description": "List the orders created in this session, each with its live status.\n\nScoped to this session's own Order Records: an order placed\nin another session, or by another caller, is not listed here — it is\nreached through `order_lookup` with the customer's reference + email.\nWhenever you tell the customer that only this conversation's orders can be\nshown, also tell them they can see any other order of theirs by giving its\norder reference and the email they used at checkout.\n`last` is false when the session has more orders than one call shows\n(only the most recent are returned); `total_elements` is the session's\ntrue order count, so a false `last` means older orders exist beyond the\nlist.\n\nReturns a job — poll until SUCCEEDED. On failure the job error is\n`RendrealNotConfiguredError` (no client) or a `Rendreal*Error` — the\nlatter only when every listed order's status read fails (a systemic\noutage); one failed read degrades that row to a null status and the job\nstill succeeds. An order deleted upstream is omitted from the list\nentirely (and from `total_elements`), never shown as a pickable row.\n\nThe widget's picker commits an ordinal reference with the order's status\nattached for disambiguation (e.g. \"Nr 2 - Complete, please.\") rather\nthan an id — 1-indexed against this same call's `orders` list, in\norder. Map the number back to that list position's `order_id` before\ncalling `order_get` (these are this session's own orders, so no email is\nneeded); don't match on status alone (several orders can share one).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
