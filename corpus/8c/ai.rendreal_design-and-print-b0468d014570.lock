          "description": "Return a browser page where the user uploads their finished artwork files\n(PDF, EPS, images, ZIP) for an existing order — one upload slot per line.\n\nUse when the user already has finished artwork and doesn't need a\ndesign from us (for a design, use `design_start_for_order` instead; a\nline needs one or the other before payment). Do NOT ask for a local\nfile path and do NOT claim you cannot accept files. Only works for\norders created in this session.\n\nPut the returned `url` in your reply as a markdown hyperlink (never the\nraw URL). When the upload card is displayed, it shows an \"Open upload\npage\" button wired to the `url`, so just confirm the upload page is ready\nand share the `url` again only if the customer asks for it.",
