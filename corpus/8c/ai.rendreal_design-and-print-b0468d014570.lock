        {
          "name": "order_get_quote",
          "title": "Quote the cart",
          "description": "Price the session cart, returning each line's offers (price + days).\n\nPrices every line that changed since its last quote; pass a `line_id` to\nre-price just one. Each line's translated configuration + offers are\nsnapshotted so `order_create` re-sends the priced line and binds an offer\nby `offer_id`. A line with a `pricing_error` was refused by RendReal: on\n`invalid_configuration` re-run `catalog_configure_product` for that\n`line_id` using the reason, then quote again; on `unparseable_response`\nRendReal's response was unusable — retry later. The other lines still\npriced. A line with an empty `offers` list and no `pricing_error` didn't\nprice — relay that, don't treat it as an error. Returns offers for the\nwhole cart.\nList the offers in your reply as short plain text, never as a markdown\ntable. When the quote card is displayed, it shows each offer with an\n\"Order this\" button, so a short summary is enough.\n\nThe widget's picker commits an ordinal reference with price and\nproduction days attached for disambiguation (e.g. \"Nr 2 - £58.00\n(3-day production), please.\") rather than an id — 1-indexed against\nthat same line's `offers` list from this call, in order. Map the\nnumber back to that list position's `offer_id`; don't match on price\nor production days alone (two offers can coincide on either).\n\nReturns a job — poll until SUCCEEDED. On failure the job error is\n`EmptyCartError` (nothing configured yet), `LineNotFoundError` (bad\n`line_id`), `ProductNotFoundError` (catalog entry gone),\n`RendrealNotConfiguredError`, a `ConfigurationMismatchError` /\n`UnmappableComponentError`, or a `Rendreal*Error`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "line_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "description": "The Runner's response to a `@runner.job` invocation.\n\nOn the fast path (work completed within budget), `status` is SUCCEEDED\nor FAILED and `result` / `error` is populated. On the slow path,\n`status` is RUNNING and `job_id` is the handle the host LLM uses for\n`poll()`.\n\nOn FAILED, `error` is the safe class-name code; `reason` / `detail` are\npopulated only when the failure carries a host-safe explanation (e.g. a\nRendReal rejection's server message + body), else they stay None.\n\nOn RUNNING, `note` carries model-facing guidance: it tells the host LLM whether\na widget is already polling the job, or whether it must call `poll_job` itself.",
                    "properties": {
