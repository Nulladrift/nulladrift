        {
          "name": "design_status",
          "title": "Get design status",
          "description": "Report whether a design is ready to attach and whether it was\nlocked in the editor.\n\n`attachable=true` means RendReal has saved a version of the design, so you\ncan call `order_attach_design` and go to checkout NOW. That holds for a\nresolved design (a `design_chat` turn with `design_resolved=true`) once\nRendReal saves it, which takes seconds for most products and a few minutes\nfor a photo book. Until then `attachable=false` with `thumbnails_pending=true`:\npoll again. It also holds for a design saved in the editor. Do NOT wait for\n`completed`.\n\n`completed=true` is the narrower signal that the user saved/finished the\ndesign in the editor (after which `design_chat` is refused). It is set by\nthis tool's own 360 editor-save poll; if the poll has not observed the\nsave yet the design can still be attachable, so gate checkout on\n`attachable`, never on `completed`. When present,\n`design_url` + `thumbnails` are AUTHORITATIVE — share `design_url` as a\nmarkdown hyperlink and show the thumbnails; never invent or guess a URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "type": "string"
              },
