          "description": "Step 2 of attaching artwork: report the completed PUT to register the file.\n\nCall after PUTting the bytes to the presigned `url`. `object_key` is the\none `order_request_artwork_upload` returned; `size` is the byte count you\nPUT. The filename and content type are the ones you presigned with.\nMarks the line covered, clears the payment refusal, and arms prepress,\nso the order can then reach page mapping and a payment link. Refused with\n`ItemDesignAttachedError` when the item of a multi-item order already holds\nan attached design, which is what prints.",
