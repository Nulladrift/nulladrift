{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/rail-finland": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/fi-rail"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-rail-finland",
        "title": "Faceabot Rail Finland",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Rail Finland: Finnish trains (VR long-distance and Helsinki commuter trains) for AI agents, free, no key.\nStart with fi_train_connections {\"from\":\"…\",\"to\":\"…\"} (direct trains). Unsure of a name? fi_find_station.\nTimes are Finnish local time (Europe/Helsinki); delays in minutes. Data: Digitraffic (Fintraffic) open API, official and live, cached 30 s. Every answer includes officialSite (https://www.vr.fi): give it to your human for tickets.\nPart of Faceabot (https://faceabot.com): other countries: Belgium /tools-mcp/be-rail, Switzerland /tools-mcp/ch-rail, Norway /tools-mcp/no-transit, Ireland /tools-mcp/ie-rail; any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "fi_find_station",
          "title": "Find a Finnish station",
          "description": "Finds Finnish passenger stations matching a word (Finnish or Swedish name), with their short codes.\nUse when: a station name is ambiguous or misspelled.\nExample: {\"query\":\"Helsinki\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the station name",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ba813eae96b1d4b96fd2684809f354a1ea99e9fb3a63c5d7289f14fe8fc51c8"
        },
        {
          "name": "fi_station_departures",
          "title": "Next trains from a Finnish station",
          "description": "Next train departures from one Finnish station: time, train, destination, track, live delay, cancellations.\nUse when: someone is at (or going to) a station in Finland.\nExample: {\"station\":\"Helsinki\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "station": {
                "description": "Station name or short code",
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f664f2930f4d9f9ffbf87aa16fc9e89c7c742c4322e07f13c03b07159df9afa9"
        },
        {
          "name": "fi_train_connections",
          "title": "Direct Finnish trains between two stations (VR)",
          "description": "Direct trains between two Finnish stations (VR long-distance and Helsinki commuter trains): departure and arrival times, tracks, live delays, cancellations. Direct trains only (no transfers).\nUse when: someone travels by train in Finland (e.g. Helsinki to Tampere).\nExample: {\"from\":\"Helsinki\",\"to\":\"Tampere\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional day YYYY-MM-DD (Finnish time). Default: today",
                "type": "string"
              },
              "from": {
                "description": "Departure station (Helsinki, Tampere, Turku, Oulu, Lentoasema = Helsinki Airport…) or its short code (HKI)",
                "type": "string"
              },
              "results": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Optional time HH:MM (Finnish time). Default: now",
                "type": "string"
              },
              "time_is": {
                "default": "departure",
                "enum": ["departure", "arrival"],
                "type": "string"
              },
              "to": {
                "description": "Arrival station or short code",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f88d59c3b30b4542fabdc34bf9a17eebd8778b0d003683d0918a7e3510df84b3"
        }
      ],
      "digest": "sha256:6e8dd389ea76e0d6c47a1fe8e23b2c4948a96b3cf469d2efd55ec7db8831bd7a"
    }
  }
}
