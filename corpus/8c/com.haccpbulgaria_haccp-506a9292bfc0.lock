      },
      "serverInfo": {
        "name": "haccp-bulgaria",
        "title": "HACCP Bulgaria",
        "version": "1.0.0",
        "websiteUrl": "https://haccpbulgaria.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HACCP Bulgaria prepares HACCP food-safety systems for food businesses in Bulgaria. Call haccp_options for the allowed answers, haccp_check to show the person the modules and price, and haccp_prepare_order to give them a link to finish, check the answers and pay themselves. Talk to the person in their language; all values and texts for them are in Bulgarian.",
      "tools": [
        {
          "name": "haccp_check",
          "title": "Check a facility: modules and price",
          "description": "For a food business in Bulgaria, returns which modules its HACCP system will contain (with the reason for each, in Bulgarian), the approximate number of pages and the final one-time price. Free, no personal or company data needed, creates nothing. Ask the person about their facility and food first; do not guess the assortment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facility": {
                "additionalProperties": false,
                "properties": {
                  "consistsOf": {
                    "description": "Rooms the facility has. A kitchen adds a module, so ask; do not assume.",
                    "items": {
                      "enum": ["Търговска зала", "Кухненско помещение", "Складово помещение", "Санитарен възел за клиенти", "Санитарен възел за служители", "Стая за преобличане"],
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "coolingUnits": {
                    "description": "Every fridge, display fridge and freezer with the room it stands in. They fill the cooling equipment table; the person can add them in the draft if you leave this out.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "location": {
                          "enum": ["Търговска зала", "Кухненско помещение", "Складово помещение"],
                          "type": "string"
                        },
                        "type": {
                          "enum": ["Хладилник", "Хладилна витрина", "Фризер"],
                          "type": "string"
                        }
                      },
                      "required": ["location", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "eggs": {
                    "description": "Does the kitchen work with raw eggs? (Only selling packed eggs is false.)",
                    "type": "boolean"
                  },
                  "exits": {
                    "description": "Number of exits.",
                    "enum": [1, 2, 3, 4, 5],
                    "type": "integer"
                  },
                  "fridges": {
                    "description": "Number of fridges and freezers (5 means 5 or more).",
                    "enum": [1, 2, 3, 4, 5],
                    "type": "integer"
                  },
                  "fried": {
                    "description": "Are fried foods offered?",
                    "type": "boolean"
                  },
                  "hotWater": {
                    "description": "Is there running hot water?",
                    "type": "boolean"
                  },
                  "locatedIn": {
                    "description": "Where the facility is located.",
                    "enum": ["Самостоятелна сграда", "Търговски център", "Жилищна сграда", "Павилион"],
                    "type": "string"
                  },
                  "processingFood": {
                    "description": "Is food technologically processed (cutting, portioning, cooking, packing)?",
                    "type": "boolean"
                  },
                  "producedProducts": {
                    "description": "Food and drinks made or prepared on site. See haccp_options for the groups.",
                    "items": {
                      "enum": ["Готвени ястия", "Аламинути", "Супи", "Ястия на скара", "Пържени храни", "Гарнитури", "Вегетариански салати", "Месни салати", "Рибни салати и салати с морски дарове", "Салати с яйца и млечни продукти", "Разядки и дипове", "Студени предястия и платà", "Сосове и дресинги", "Хлебни изделия", "Сандвичи", "Принцеси", "Пици", "Бургери", "Дюнери", "Закуски", "Торти и пасти", "Сладкиши и печива", "Кремове и мусове", "Сладоледи и сорбета", "Плодови десерти", "Палачинки, гофрети и понички", "Шоколадови и захарни изделия", "Млечни десерти", "Кафе и чай", "Горещ шоколад", "Мляко и млечни напитки", "Студено пресовани сокове", "Домашни лимонади"],
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "sequence": {
                    "description": "Work steps that happen in the facility, from ordering to selling.",
                    "items": {
                      "enum": ["Даване на заявка", "Приемане на стоката", "Разпределение на стоката", "Приготвяне на продуктите", "Съхранение на готовата продукция", "Продажба на готовата продукция"],
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "soldProducts": {
                    "description": "Food only sold as bought (not made on site).",
                    "items": {
                      "enum": ["Мляко и млечни продукти", "Месо и месни продукти", "Риба и морски дарове", "Яйца и продукти от яйца", "Готови ястия и полуфабрикати", "Тестени изделия и теста", "Готови десерти", "Пакетирани солени изделия", "Пакетирани захарни изделия", "Консервирани изделия", "Пакетирани ядки и семена", "Пакетирани сосове и подправки", "Плодове", "Зеленчуци"],
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "status": {
                    "description": "Facility type. Sets the price. Pick the closest one; a pizzeria or bistro is \"Ресторант\".",
                    "enum": ["Ресторант", "Заведение за бързо хранене", "Пекарна", "Хранителен магазин", "Магазин за бързооборотни стоки", "Сладкарница", "Кафене", "Нощен бар", "Кетъринг", "Производствен цех", "Склад за хранителни стоки", "Мобилен обект"],
                    "type": "string"
                  }
                },
                "required": ["consistsOf", "producedProducts", "soldProducts", "status"],
                "type": "object"
              }
            },
            "required": ["facility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
