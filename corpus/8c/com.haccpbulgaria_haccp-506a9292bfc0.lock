          "title": "Prepare a HACCP order for the person",
          "description": "Saves the answers as a draft for 7 days and returns a link. Give the link to the person: it opens the questionnaire already filled in, where they check every answer, add what is missing, see a free preview and pay themselves. You cannot order or pay; the payment and the legal consents are the person's. Never send the manager's personal number (ЕГН). Show the person the \"message\" field of the result.",
