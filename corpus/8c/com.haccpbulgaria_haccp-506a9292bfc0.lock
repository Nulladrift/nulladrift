            "additionalProperties": false,
            "properties": {
              "company": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "Registered seat: address.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "city": {
                    "description": "Registered seat: city.",
                    "maxLength": 100,
                    "type": "string"
                  },
                  "eik": {
                    "description": "Bulgarian company ID (ЕИК/БУЛСТАТ), 9 or 13 digits.",
                    "pattern": "^[0-9]{9}([0-9]{4})?$",
                    "type": "string"
                  },
                  "molName": {
                    "description": "Manager or qualified person, full name.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "description": "Company name, e.g. \"Кафе Слънце ЕООД\".",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
