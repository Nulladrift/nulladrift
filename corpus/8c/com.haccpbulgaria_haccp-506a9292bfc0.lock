          "name": "haccp_options",
          "title": "HACCP questionnaire options",
          "description": "Lists every allowed answer of the HACCP Bulgaria questionnaire (facility types with prices, rooms, work steps, food groups). Call it first and use only these exact Bulgarian values in haccp_check and haccp_prepare_order.",
