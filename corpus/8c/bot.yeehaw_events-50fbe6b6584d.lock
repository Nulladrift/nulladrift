{
  "lockfileVersion": 2,
  "subjects": {
    "bot.yeehaw/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://yeehaw.bot/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "yeehaw",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "find_events",
          "description": "Find upcoming Austin events from Yeehaw's sourced, deduplicated store. Structured filter over the events table; events more than 24h past are filtered. Every record carries a `source` attribution and a `confidence` score. Pass `id` to fetch one event by id; it ignores date_range and all other filters.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug (e.g. music, sports, civic).",
                "type": "string"
              },
              "date_range": {
                "description": "Required unless `id` is set. e.g. today, tonight, this_weekend, next_7_days, or an ISO date range.",
                "type": "string"
              },
              "id": {
                "description": "Fetch one event by id; ignores date_range and other filters when set.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results, default 20, clamped to 50.",
                "type": "integer"
              },
              "neighborhood": {
                "description": "Austin neighborhood slug. One of: downtown, east-austin, hyde-park, mueller, rainey-street, south-congress, the-domain, zilker. Common shorthands (east, domain, soco, rainey) are accepted.",
                "type": "string"
              },
              "price_max": {
                "description": "Maximum ticket price in USD. price_max=0 returns only events with a known $0 price. Most events have no listed price (sparse upstream data) — for price_max>0 those are still returned and the response states how many were not price-filtered.",
                "type": "number"
              },
              "query": {
                "description": "Free-text keyword match against event titles.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03ae499a61396b5c36c1017967952342a78d90ceb70b902b6add33ffa3cda8bb"
        },
        {
          "name": "overview",
          "description": "Inspectable State: report Yeehaw's operational state in one call (no input) — event counts, last successful ingest per source vs cadence, cron health, open circuit breakers, recent error tail, and coverage gaps.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2dbaf34359970c466951a984b15efa744448773caeb078cf43875f097ab718d"
        }
      ],
      "digest": "sha256:ba8de4dad141fc8ef001f76bf603b0a26903ed6cb9dffa28b790b6267cc6b202"
    }
  }
