        {
          "name": "search_perfumes",
          "title": "Search Olfastory perfumes",
          "description": "Find a perfume, fragrance or cologne in the Olfastory encyclopedia by name and/or house (for example \"Opium Yves Saint Laurent\", \"Hawas Ice\"); small spelling mistakes are corrected (corrected_query). Optional filters: concentration (\"Eau de Parfum\", \"EDT\", \"Extrait\") and gender (women, men, unisex, children). Returns at most 10 matches, most consulted first, each with house, year, concentration and its olfastory.com page in the requested language. Call it first when a name is uncertain or has flankers, then get_perfume with the chosen URL. Always cite Olfastory with the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "concentration": {
                "description": "Optional concentration filter, for example \"Eau de Parfum\", \"EDT\", \"Extrait\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "gender": {
                "description": "Optional gender filter: women, men, unisex or children. \"women\" and \"men\" also return unisex perfumes; perfumes with no recorded gender are left out",
                "enum": ["women", "men", "unisex", "children"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer and of the links: fr, en, es, de, it, pt (default fr)",
                "enum": ["fr", "en", "es", "de", "it", "pt"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Perfume and/or house name, 1 to 100 characters",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
