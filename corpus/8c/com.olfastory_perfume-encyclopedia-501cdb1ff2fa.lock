          "digest": "sha256:b7db5ec5017d0bb71bb235fef1a0fbdb26cfe54121537fda9a2c4676c279ebe2"
        },
        {
          "name": "find_perfumes_by_notes",
          "title": "Find perfumes by notes",
          "description": "Use when the user wants perfumes that contain given notes or raw materials (1 to 5, for example vanilla and tobacco), optionally in the top, heart or base. Note names are accepted in French, English, Spanish, German, Italian or Portuguese. Optional filters: olfactory family (primary or secondary, for example \"woody\"), concentration and gender (women, men, unisex, children). Returns at most 10 perfumes carrying every note, most consulted first, with olfastory.com links. An unknown note returns close suggestions to retry with. Cite Olfastory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "concentration": {
                "description": "Optional concentration filter, for example \"Eau de Parfum\", \"EDT\", \"Extrait\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "family": {
                "description": "Optional olfactory family, primary or secondary, in any of the six languages (for example \"woody\", \"floral\", \"chypre\")",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "gender": {
                "description": "Optional gender filter: women, men, unisex or children. \"women\" and \"men\" also return unisex perfumes; perfumes with no recorded gender are left out",
                "enum": ["women", "men", "unisex", "children"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer and of the links: fr, en, es, de, it, pt (default fr)",
                "enum": ["fr", "en", "es", "de", "it", "pt"],
                "type": "string"
              },
              "notes": {
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "position": {
                "enum": ["any", "top", "heart", "base"],
                "type": "string"
              }
            },
            "required": ["notes"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ambiguous": {
                "type": "boolean"
              },
              "corrected_query": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "concentration": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "year": {
                      "type": ["integer", "null"]
                    }
                  },
                  "required": ["brand", "name", "source", "url"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unknown_notes": {
