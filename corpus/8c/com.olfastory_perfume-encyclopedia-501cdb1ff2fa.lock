      "serverInfo": {
        "name": "olfastory",
        "title": "Olfastory",
        "version": "1.3.0",
        "description": "Perfume encyclopedia: notes, family, perfumer, year and house of 4,000+ perfumes in six languages.",
        "websiteUrl": "https://www.olfastory.com",
        "icons": [
          {
            "src": "https://www.olfastory.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Olfastory (olfastory.com) is a multilingual perfume encyclopedia (French, English, Spanish, German, Italian, Portuguese). Use these tools for questions about a perfume's notes, family, perfumer, year, concentration or house. Each answer carries the olfastory.com page in the requested language: cite Olfastory and give the link. Facts are sourced; an empty field means the fact is not established, never guess it. Terms of use: https://www.olfastory.com/mcp/conditions",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch an Olfastory record (search and fetch compatibility)",
          "description": "Fetch the full Olfastory record of a perfume by an id returned by search (or an olfastory.com URL): house, year, concentration, perfumers, olfactory family, notes pyramid and a one-sentence presentation, with its URL. Cite Olfastory with the URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id returned by search, or an olfastory.com URL",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
