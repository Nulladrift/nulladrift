        {
          "name": "get_perfume",
          "title": "Get a perfume record",
          "description": "Use when the user asks about one perfume: its notes pyramid (top, heart, base), olfactory family, perfumer, year, concentration or house. Accepts an olfastory.com URL (best), a slug, or \"name house\". If several perfumes match (flankers, concentrations), the result lists the candidates with ambiguous=true: pick one and call again with its URL. Returns facts only; an empty field means the fact is not established, never guess it. Cite Olfastory with the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer and of the links: fr, en, es, de, it, pt (default fr)",
                "enum": ["fr", "en", "es", "de", "it", "pt"],
                "type": "string"
              },
              "perfume": {
                "description": "olfastory.com URL, slug, or \"name house\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["perfume"],
            "type": "object"
