{
  "lockfileVersion": 2,
  "subjects": {
    "com.dmthefounder/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dmthefounder.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dmthefounder",
        "title": "DMtheFounder startup jobs",
        "version": "1.0.0",
        "websiteUrl": "https://dmthefounder.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Early-stage startup jobs that founders post themselves on X and Hacker News, each checked by a person before it is listed. Engineering, design, product, growth & marketing, sales and operations.\n\nUse search_jobs to find live roles, get_job for one role, get_company for a company and its open roles. Every result has a url: link the person to it. To contact a founder, the person opens that page and signs in; this server never returns founder emails.\n\nWithout an API key, each call returns up to 10 roles and paging stops at page 5. With a key (x-api-key header) calls go through the Jobs API and use its credits: https://dmthefounder.com/jobs-api",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a startup",
          "description": "A company by its slug: what it does, website and X account, funding stage, its open roles and its newest SEC Form D filings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The company's slug: the last part of its URL, e.g. converge.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a startup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e53b7d711f9165d5684ac9fe9d8a0058506e40d1ffc2d2e9a46b2c4b4a9015c6"
        },
        {
          "name": "get_job",
          "title": "Get a startup job",
          "description": "One role in full by its slug (from search_jobs or the role URL): title, company, location, pay and equity when stated, funding stage, the founder’s original post and who wrote it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The role's slug: the last part of its URL, e.g. converge-founding-platform-engineer-1e1c32.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a startup job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03921ba368147bc6408d291ecedfb25c90bd450f1117a6ca59a36217cc6976fa"
        },
        {
          "name": "search_jobs",
          "title": "Search startup jobs",
          "description": "Live roles at early-stage startups, posted by their founders and checked by hand, newest first. Filter by function, engineering sub-category, funding stage, remote and location.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "function": {
                "description": "Job function. Default: all.",
                "enum": ["engineering", "design", "product", "growth", "sales", "operations", "all"],
                "type": "string"
              },
              "limit": {
                "description": "Roles to return. Default 10; at most 10 without an API key, 20 with one.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or country, e.g. \"San Francisco\", \"London\", \"India\".",
                "maxLength": 80,
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1. Without an API key, up to 5.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in the role title or location.",
                "maxLength": 80,
                "type": "string"
              },
              "remote": {
                "description": "Only remote roles.",
                "type": "boolean"
              },
              "role": {
                "description": "Engineering sub-category (implies engineering).",
                "enum": ["founding", "ml", "infra", "backend", "frontend", "fullstack", "mobile", "engineering"],
                "type": "string"
              },
              "stage": {
                "description": "Funding stage of the company.",
                "enum": ["pre-seed", "seed", "series-a", "series-b-plus", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search startup jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f436c96c077b2eeb9e26acdeb19dd2f8cacd8a69c0fb5e9bbad2aba36645cf3"
        }
      ],
      "digest": "sha256:c2df05e7e5cbec01a4b123994ac258cc2e1cab6300b0fd53394e98fdccd73add"
    }
  }
}
