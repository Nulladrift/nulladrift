      },
      "serverInfo": {
        "name": "codepostalpro",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Postal and ZIP code reference. Curated tier (full sourced records with US demographics, climate, area codes…): United States, Germany, Austria, Spain, France, Algeria, Tunisia, Morocco. Bulk tier (place, admin areas, coordinates from GeoNames): ~115 more countries — every populated country with postal codes in GeoNames. Every record carries `sources`, `verification` and its tier; when you relay a value, say where it came from. Data page: https://codepostalpro.com/data-sources/",
      "tools": [
        {
          "name": "area_code_lookup",
          "title": "US area code lookup",
          "description": "Where a US telephone area code is used: the state(s) it serves, the cities with the most ZIPs listing it, total ZIP and city counts, and `overlay_codes` — codes assigned to the same territory (e.g. 310 and 424 in west Los Angeles). Use it for \"where is area code 310\", \"what area code is Denver\" (via the city’s ZIPs instead), or to sanity-check a phone number’s geography. Caveat to relay: NANPA assigns codes to rate centres, matched here to cities — city-level accuracy, not a legal boundary, and a mobile number keeps its code when its owner moves.",
          "inputSchema": {
            "properties": {
              "area_code": {
                "description": "Three-digit NANPA area code, e.g. \"310\"",
                "type": "string"
              }
            },
            "required": ["area_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US area code lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83d50aa44e5aeae6a1167acaff1bcb5277e075f1af42dd3df62710ae731f593f"
        },
        {
          "name": "get_group",
          "title": "City & district details",
          "description": "A city (US), département (France), province (Morocco), post office (Algeria) or delegation (Tunisia) with all its localities / ZIP codes. For a US city this is the complete list of its ZIP codes with coordinates, time zone and area codes. Needs the region slug and the group slug (both from get_region or from any record's `region.slug` / `group.slug`).",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "group": {
                "type": "string"
              },
              "region": {
                "type": "string"
              }
            },
            "required": ["country", "group", "region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "City & district details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe0807f7f40dad64bfab55900dae683fb356515e98db582f2003fd9b6492e3b0"
        },
        {
          "name": "get_region",
          "title": "Region details",
          "description": "A state, région, wilaya or governorate with the list of its cities / départements / delegations (names, slugs and their postal codes), plus for US states every telephone area code in use. Use the slugs it returns to call get_group or get_place. Region slugs are lower-case hyphenated names: \"texas\", \"ile-de-france\", \"alger\".",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "region": {
                "description": "Region slug",
                "type": "string"
              }
            },
            "required": ["country", "region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Region details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e0a2747dd076a805cf917e8f9d857f48e4578ceaa3f596b8bf0691be9017771"
        },
        {
          "name": "list_countries",
          "title": "Covered countries",
          "description": "Coverage overview: the eight curated countries with postal-code format, hierarchy labels (e.g. state › city › ZIP), key facts (capital, population, area, currency, calling code) and time zones — plus `bulk_tier` with per-country postal-code counts for the ~115 additional countries served from GeoNames. Call it once if unsure whether a country is covered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Covered countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7823f197d3aa5fd9b704b0d18cffb23cba25495fbdc89b156bfb42310eb00a59"
        },
        {
          "name": "lookup_postal_code",
          "title": "Postal code lookup",
          "description": "Look up a postal code or US ZIP code. Returns every locality that carries the code with its city, county/administrative division, region (state, département, wilaya…), coordinates, IANA time zone, US telephone area codes, USDA 2023 plant hardiness / planting zone (e.g. 7b with its temperature band), and US Census demographics (population, density and land area, median household and per-capita income, median age, households, housing units, median home value, median gross rent — measured for the ZCTA, the Census approximation of the ZIP area). Each record lists its `sources` and a `verification` status (cross-checked | source-single | conflict | unverified); on `conflict`, `alternate_codes` gives the competing values and their sources — never pick one silently; tell the user both. Curated coverage (full records): United States (ZIP), Germany, Austria, Spain, France, Algeria, Tunisia, Morocco. All other countries (~115 more: GB, CA, IN, JP, MX, BR…) return bulk-tier records — place name, admin areas and coordinates from GeoNames, marked `tier: \"bulk\"` and single-source, without demographics.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The postal / ZIP code exactly as written, e.g. \"90210\", \"75001\", \"16000\"",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code: US, FR, DZ, TN or MA",
                "type": "string"
              }
            },
            "required": ["code", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Postal code lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5871586a10e356cf2bab9f074df075d42cdb9d3232025b2648c39c918c3937de"
        },
        {
          "name": "nearby_places",
          "title": "Nearby postal codes",
          "description": "List localities around a latitude/longitude, nearest first, each with `distance_km`. Use it for \"what ZIP codes are near…\", \"postal codes within 10 km of…\", or to resolve coordinates to the closest postal code (the first result). Distances are to the locality centroid from the source data, not to a boundary.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO code filter",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "description": "1–100, default 20",
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "radius_km": {
                "description": "0.5–200, default 25",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Nearby postal codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bfea86dd37cbea9ce3e9eb9198faf7545c3ba92ab52b4646009507563b3e9ab"
        },
        {
          "name": "search_places",
          "title": "Place search",
          "description": "Find localities by name, city name, or the beginning of a postal code. Use this when the user gives a place name and wants its postal code(s), or has a partial code. Results are ranked exact-name-first, then by population. Returns the same full records as lookup_postal_code. Restrict with `country` whenever it is known — names repeat across countries and states (there are many Springfields). With a non-curated `country` (GB, CA, JP…), searches the bulk GeoNames tier by place name or postal-code prefix.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO code to restrict the search (US, FR, DZ, TN, MA)",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1–100 (default 20)",
                "type": "integer"
              },
              "query": {
                "description": "Place name or postal-code prefix, at least 2 characters",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Place search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:805465cff0ca5cd3787329588488822647f644922a671e3698f2167a51b15550"
        }
      ],
      "digest": "sha256:cc6acebf7c7ad424dd9103ea937eaa836e5a2b48a9fc79850d65f7dff4b1ba93"
    }
  }
