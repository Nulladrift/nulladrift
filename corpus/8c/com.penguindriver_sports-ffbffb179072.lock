{
  "lockfileVersion": 2,
  "subjects": {
    "com.penguindriver/sports": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sports.penguindriver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tw-sports-schedule",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "運動即時比分賽事行程（繁體中文）：中職、MLB、NBA、TPBL、亞運、世界 12 強、奧運等賽事日期、重要日期、中華隊資訊與台灣轉播，每筆附來源；另可用 Wikidata 查任何賽事。",
      "tools": [
        {
          "name": "event_countdown",
          "description": "距離賽事開始還有幾天（預設 2027 世界 12 強）。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7c3cfb3fdef0d256d97b2c871c2ca71c47a61752eb008c5df1977867a6aee63"
        },
        {
          "name": "get_sports_event",
          "description": "查單一賽事：日期、地點、主辦、重要日期、中華隊資訊、台灣轉播平台與來源；中文或英文名稱皆可（如 世界12強、台灣大賽、TPBL、LA28）。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7ece876c6e5701c2410700a6adc025d3fb85ab4d5ae71c683f6d87565e79245"
        },
        {
          "name": "list_sports_events",
          "description": "列出台灣關注的 2026–2028 運動賽事（中職、MLB、NBA、TPBL、亞運、世界 12 強、奧運等），含日期、地點、狀態、台灣轉播；可依項目、狀態、日期篩選。",
          "inputSchema": {
            "properties": {
              "from": {
                "type": "string"
              },
              "sport": {
                "enum": ["baseball", "basketball", "multi", "badminton", "running", "football", "soccer"],
                "type": "string"
              },
              "status": {
                "enum": ["upcoming", "ongoing", "completed"],
                "type": "string"
              },
              "taiwan": {
                "description": "只看有中華隊或台灣相關資訊的賽事",
                "type": "boolean"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f872fba5d93460bb12287ed925466324af13bd7fe02b8af4cd9c144dbc43b3a2"
        },
        {
          "name": "lookup_any_sports_event",
          "description": "用 Wikidata 公開資料查任何運動賽事的日期、地點、項目、冠軍與官方網站。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:080cc4eb1c8b2e6546341a84d20219b91d505d1a20fe69dcd782c000db10219d"
        },
        {
          "name": "sports_calendar",
          "description": "依月份列出各賽事的開幕、決賽與關鍵日期。",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "YYYY-MM",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3bd0b718cf9afbb5b3c484adff70a57abfe9172515b322799e2196ebe05b3d25"
        },
        {
          "name": "taiwan_broadcast",
          "description": "賽事在台灣的電視與網路轉播平台（亞運、中職等），附來源。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de1bf7fbea73d90559b277580d90b38e31fd06e76ad09667f4e63e672b1e88cd"
        },
        {
          "name": "whats_on",
          "description": "某一天起幾天內進行中的賽事與重要日期（預設今天起 7 天，台灣時間）。",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "days": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87246ebbcd20b8d114466b0ae728dc1a30587b4169ce8aca6d414b8fb59421f4"
        }
      ],
      "digest": "sha256:e502ce47c5cc54b0ac6dad55950c452fde5f1ebbde84268d86ccfdfe7663790c"
    }
  }
}
