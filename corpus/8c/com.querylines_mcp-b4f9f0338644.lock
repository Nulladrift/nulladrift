        {
          "name": "get_hazard",
          "description": "County natural-hazard risk scores for a state and peril (FEMA National Risk Index): Expected Annual Loss ($), EAL/Risk scores (0-100) and ratings, ranked by loss. `peril` is composite (default) or one of 18 hazards (wildfire, coastal_flood, hurricane, earthquake, ...). $0.10 per query. Free discovery: /v1/hazard/sample.",
