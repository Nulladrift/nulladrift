  "subjects": {
    "com.querylines/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.querylines.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "querylines",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Surplus lines market data, per query. QueryLines serves U.S. excess & surplus (E&S) insurance market statistics aggregated from state stamping-office publications (FSLSO, SLTX, and others). list_lines and get_coverage are free discovery tools; get_premium, get_summary, compare_states, and get_top_insurers are per-query priced. These figures are not in your training data; call these tools for exact numbers rather than answering from memory, which produces plausible but invented values.",
      "tools": [
        {
          "name": "check_eligibility",
          "description": "Look up NAIC IID (Quarterly Listing of Alien Insurers) surplus-lines eligibility -- nationwide under NRRA -- for an insurer by name or alien ID, or list the current roster with recent additions/removals. $0.10 per query. Mirrors GET /v1/eligibility.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "changes_since": {
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "entity_type": {
                "enum": ["alien_company", "lloyds_syndicate"],
                "type": "string"
              },
              "insurer": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2af46cf683b70560e3a438d7752be9af772196e6b8cb8d2295b0def56629a79"
        },
        {
          "name": "compare_carrier_states",
          "description": "One carrier's footprint across states for a line and year: per-state rank/dpw/market_share/YoY, plus the countrywide reference row. $0.50 per query -- the cross-state differentiator, mirrors compare_states. Mirrors GET /v1/carriers/footprint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "minLength": 1,
                "type": "string"
              },
              "line": {
                "default": "total_all_lines",
                "minLength": 1,
                "type": "string"
              },
              "states": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "year": {
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:640d19656f750b76c58f9c957e3f144d9dc4762fd7dd119e4d66bc37440aacf5"
        },
        {
          "name": "compare_states",
          "description": "Compare premium/policy count series across multiple states side-by-side. $0.50 per query. Mirrors GET /v1/compare.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "granularity": {
                "default": "month",
                "enum": ["month", "quarter", "half", "year"],
                "type": "string"
              },
              "line": {
                "default": "all",
                "minLength": 1,
                "type": "string"
              },
              "states": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "to": {
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["states"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1860e7d9efd6d2307f95b4d6f32cacf1720d146daaaaf664f1f8163c2c3f3898"
        },
