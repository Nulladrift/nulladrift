            "properties": {
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "peril": {
                "default": "composite",
                "enum": ["composite", "avalanche", "coastal_flood", "cold_wave", "drought", "earthquake", "hail", "heat_wave", "hurricane", "ice_storm", "riverine_flood", "landslide", "lightning", "strong_wind", "tornado", "tsunami", "volcanic_activity", "wildfire", "winter_weather"],
