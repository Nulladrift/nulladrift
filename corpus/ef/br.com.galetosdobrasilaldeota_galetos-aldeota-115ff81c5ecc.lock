      "serverInfo": {
        "name": "galetos-aldeota",
        "title": "Galetos do Brasil Aldeota — loja (product)",
        "version": "1.0.0",
        "websiteUrl": "https://galetosdobrasilaldeota.com.br/developers/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Servidor MCP da loja Galetos do Brasil Aldeota (galeto assado na brasa, Fortaleza/CE; só delivery e retirada no balcão). Use para saber se está aberto, se entrega num bairro, o link para pedir (cardápio digital ou WhatsApp) e a rota até a loja. Somente leitura, sem autenticação: o pedido em si é feito pela pessoa no link devolvido. Preços e itens ficam só no cardápio digital — não estime valores. Read-only, no auth.",
      "tools": [
        {
          "name": "galetos_aldeota_check_delivery",
          "description": "Use antes de prometer entrega: confere se a loja Aldeota entrega num bairro de Fortaleza. Devolve atende (sim/não), prazo, pedido mínimo, frete grátis e, se não entrega, a alternativa de retirada. Check delivery coverage for a Fortaleza neighborhood.",
          "inputSchema": {
            "properties": {
              "bairro": {
                "description": "Bairro de entrega em Fortaleza (ex.: Meireles)",
                "type": "string"
              }
            },
            "required": ["bairro"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternativa": {
                "description": "Só quando não entrega: retirada no balcão",
                "properties": {
                  "endereco": {
                    "description": "Endereço da retirada",
                    "type": "string"
                  },
                  "prazoRetiradaMin": {
                    "description": "Prazo da retirada, em minutos",
                    "type": "number"
                  },
                  "rota": {
                    "description": "Link de rota",
                    "type": "string"
                  },
                  "tipo": {
                    "description": "retirada",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "atende": {
                "description": "true se a loja entrega no bairro",
                "type": "boolean"
              },
              "bairro": {
                "description": "Bairro como foi consultado",
                "type": "string"
              },
              "bairroAtendido": {
                "description": "Nome do bairro atendido que casou, ou null",
                "type": ["string", "null"]
              },
              "cardapio": {
                "description": "URL do cardápio digital",
                "type": "string"
              },
              "freteGratisAcima": {
                "description": "Valor a partir do qual o frete é grátis, em reais",
                "type": "number"
              },
              "moeda": {
                "description": "Código da moeda (BRL)",
                "type": "string"
              },
              "pedidoMinimo": {
                "description": "Pedido mínimo, em reais",
                "type": "number"
              },
              "prazoEntregaMin": {
                "description": "Prazo estimado de entrega, em minutos",
                "type": "number"
              },
              "texto": {
                "description": "Resposta em frase",
                "type": "string"
              }
            },
            "required": ["atende", "bairro", "texto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6f42ed833e4342bd7c1232314099e364b27964fe5358b269277e4faa063e321"
        },
        {
          "name": "galetos_aldeota_como_chegar",
          "description": "Use quando a pessoa for retirar no balcão: devolve o endereço da loja Aldeota (Av. Antônio Sales, Fortaleza) e o link de rota do Google Maps a partir de uma origem opcional. Directions to the store for pickup.",
          "inputSchema": {
            "properties": {
              "origem": {
                "description": "Endereço de partida (opcional)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "endereco": {
                "description": "Endereço da loja",
                "properties": {
                  "linha": {
                    "description": "Endereço em uma linha",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "origem": {
                "description": "Origem informada, ou null",
                "type": ["string", "null"]
              },
              "texto": {
                "description": "Resposta em frase",
                "type": "string"
              },
              "url": {
                "description": "Link de rota no Google Maps",
                "type": "string"
              }
            },
            "required": ["endereco", "texto", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61a7379f733194fe23a6129be0fdd710e119705089be1b4cded8705d7ca926e7"
        },
        {
          "name": "galetos_aldeota_dados_da_loja",
          "description": "Use para fatos gerais da loja Aldeota que os outros tools não cobrem: endereço, contato, horário, entrega (bairros, prazos, mínimo) ou pagamento, inteiros ou por grupo. Devolve um objeto JSON por campo. Store facts, optionally filtered by group.",
          "inputSchema": {
            "properties": {
              "campo": {
                "default": "tudo",
                "description": "Qual grupo de fatos devolver (padrão: tudo)",
                "enum": ["tudo", "endereco", "contato", "horario", "entrega", "pagamento"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Fatos da loja; os campos presentes dependem do grupo pedido em \"campo\"",
            "properties": {
              "bairros": {
                "description": "Bairros atendidos pelo delivery",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "campo": {
                "description": "Grupo devolvido; ausente quando \"tudo\"",
                "type": "string"
              },
              "cardapio": {
                "description": "URL do cardápio digital",
                "type": "string"
              },
              "consumoNoLocal": {
                "description": "false: a loja não tem salão, só delivery e retirada",
                "type": "boolean"
              },
              "descricao": {
                "description": "Descrição da loja",
                "type": "string"
              },
              "endereco": {
                "description": "Endereço da loja",
                "properties": {
                  "linha": {
                    "description": "Endereço em uma linha",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "fuso": {
                "description": "Fuso horário",
                "type": "string"
              },
              "instagram": {
                "description": "Perfil do Instagram",
                "type": "string"
              },
              "nome": {
                "description": "Nome da loja",
                "type": "string"
              },
              "pagamentos": {
                "description": "Formas de pagamento",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resumo": {
                "description": "Resumo do horário",
                "type": "string"
              },
              "site": {
                "description": "URL do site",
                "type": "string"
              },
              "telefone": {
                "description": "Telefone",
                "type": "string"
              },
              "whatsapp": {
                "description": "Link do WhatsApp",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ffb097a88c402294fe339f56f7139bb800f860fd2a72703849088dc2e0f4ac9"
        },
        {
          "name": "galetos_aldeota_get_hours",
          "description": "Use quando perguntarem se a loja Galetos do Brasil Aldeota está aberta agora ou a que horas abre numa data. Devolve aberto/fechado, abre, fecha e o fuso de Fortaleza. Abre de quarta a segunda, 10h às 15h; fecha às terças. Opening hours and open-now status.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Data AAAA-MM-DD; vazio = agora",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aberto": {
                "description": "true se a loja está aberta neste instante; só quando a consulta é \"agora\"",
                "type": "boolean"
              },
              "abre": {
                "description": "Horário de abertura HH:MM, ou null se fechado",
                "type": ["string", "null"]
              },
              "data": {
                "description": "Data consultada, AAAA-MM-DD (Fortaleza)",
                "type": "string"
              },
              "dia": {
                "description": "Dia da semana",
                "type": "string"
              },
              "fecha": {
                "description": "Horário de fechamento HH:MM, ou null se fechado",
                "type": ["string", "null"]
              },
              "fechado": {
                "description": "true se a loja não abre neste dia",
                "type": "boolean"
              },
              "fuso": {
                "description": "Fuso horário",
                "type": "string"
              },
              "hora": {
                "description": "Hora atual HH:MM; só quando a consulta é \"agora\"",
                "type": "string"
              },
              "resumo": {
                "description": "Resumo do horário semanal",
                "type": "string"
              },
              "texto": {
                "description": "Resposta em frase",
                "type": "string"
              }
            },
            "required": ["data", "dia", "fechado", "texto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4511d005c6e5faac3dbc09881d47334d7befae7201ea0b885eebcd82f6679a9"
        },
        {
          "name": "galetos_aldeota_get_order_link",
          "description": "Use quando a pessoa quiser pedir: devolve o link do cardápio digital (itens, preços, pagamento) ou do WhatsApp com a mensagem já citando a unidade e o pedido. Não faz o pedido; a pessoa conclui no link. Get the ordering link.",
          "inputSchema": {
            "properties": {
              "canal": {
                "description": "Canal do pedido",
                "enum": ["cardapio", "whatsapp"],
                "type": "string"
              },
              "pedido": {
                "description": "Texto opcional do pedido para a mensagem do WhatsApp",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["canal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canal": {
                "description": "Canal escolhido",
                "enum": ["cardapio", "whatsapp"],
                "type": "string"
              },
              "mensagem": {
                "description": "Mensagem pré-preenchida; só no WhatsApp",
                "type": "string"
              },
              "pagamentos": {
                "description": "Formas de pagamento; só no cardápio",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "texto": {
                "description": "Resposta em frase",
                "type": "string"
              },
              "url": {
                "description": "Link para a pessoa abrir e fazer o pedido",
                "type": "string"
              }
            },
            "required": ["canal", "texto", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb0cc78a0490e7eaa9c6b6ce7228eec8926211ea9e9e6b46580c929ca198c2bb"
        }
