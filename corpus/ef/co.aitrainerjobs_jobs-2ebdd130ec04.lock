        {
          "name": "search_jobs",
          "title": "Search AI trainer jobs",
          "description": "Search open remote AI trainer jobs: paid work that trains and tests AI models, in coding, STEM, medicine, law, finance, languages, creative work, and more. Returns the newest jobs first, with pay, location, a short summary, and links. All filters are optional.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Job area.",
                "enum": ["coding", "stem", "medical", "legal", "finance", "languages", "voice-video", "creative", "generalist", "robotics"],
                "type": "string"
              },
              "eligible_country": {
                "description": "Two-letter country code (ISO 3166-1 alpha-2) where the worker is allowed to work. Drops jobs that exclude that country.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of jobs to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_hourly_pay": {
                "description": "Keep jobs that can pay at least this many US dollars an hour.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Number of jobs to skip, for the next page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "pay_type": {
                "description": "hour: hourly rate. task: paid per task. once: one payment.",
                "enum": ["hour", "task", "once"],
                "type": "string"
              },
              "query": {
                "description": "Words to find in the job title, company, or skills. Examples: \"Python\", \"Spanish\", \"nurse\", \"Mercor\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "apply_url": {
                      "description": "Opens the company's application page.",
                      "type": ["string", "null"]
                    },
                    "category": {
                      "enum": ["coding", "stem", "medical", "legal", "finance", "languages", "voice-video", "creative", "generalist", "robotics"],
                      "type": "string"
                    },
                    "commitment": {
                      "type": ["string", "null"]
                    },
                    "company": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "languages": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "level": {
                      "anyOf": [
                        {
                          "enum": ["entry", "experienced", "expert"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "location": {
                      "additionalProperties": false,
                      "properties": {
                        "countries": {
                          "description": "ISO 3166-1 alpha-2 codes. Empty: open worldwide.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "label": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["countries", "label"],
                      "type": "object"
                    },
                    "pay": {
                      "additionalProperties": false,
                      "properties": {
                        "currency": {
                          "type": ["string", "null"]
                        },
                        "label": {
                          "description": "Human-readable pay, for example $35–45/hr.",
                          "type": ["string", "null"]
                        },
                        "max": {
                          "type": ["number", "null"]
                        },
                        "min": {
                          "type": ["number", "null"]
                        },
                        "period": {
                          "anyOf": [
                            {
                              "enum": ["hour", "task", "once"],
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "hour: hourly rate. task: paid per task. once: one payment."
                        }
                      },
                      "required": ["currency", "label", "max", "min", "period"],
