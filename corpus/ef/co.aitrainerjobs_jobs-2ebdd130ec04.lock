      },
      "transport": {
        "type": "http",
        "url": "https://aitrainerjobs.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aitrainerjobs",
        "title": "AI Trainer Jobs",
        "version": "1.0.0",
        "description": "Find remote AI trainer jobs and compare the companies that hire for them.",
        "websiteUrl": "https://aitrainerjobs.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI Trainer Jobs lists open, remote, paid jobs that train and test AI models (AI trainer, AI tutor, data annotation, RLHF, model evaluation), from companies such as micro1, Mercor, Anyone AI, Terac, Vetto, Meridial, DataAnnotation, Prolific, xAI, Appen, RWS TrainAI, Innodata, Mindrift, Kaya, CloudFactory, Perle, OneForma, HumanSignal, Welo Data, Handshake AI, Rise Data Labs, DataForce, LXT, DATAmundi, Ethos. The data updates every 5 minutes.\n- Use search_jobs to find jobs, get_job for one job's full details, and list_companies or get_company to compare how companies pay, hire, and what workers say.\n- Pay is in USD. Show the pay label as given.\n- Link each job with its `url` (the job page). To apply, use `apply_url`.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get company profile",
          "description": "Get one AI training company's profile: what it does, how and when it pays, how hiring works, what workers say (good and bad), and common questions such as \"Is it legit?\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Company name, one of: micro1, Mercor, Anyone AI, Terac, Vetto, Meridial, DataAnnotation, Prolific, xAI, Appen, RWS TrainAI, Innodata, Mindrift, Kaya, CloudFactory, Perle, OneForma, HumanSignal, Welo Data, Handshake AI, Rise Data Labs, DataForce, LXT, DATAmundi, Ethos.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "about": {
                "type": "string"
              },
              "checked": {
                "description": "Date the profile facts were last checked, YYYY-MM-DD.",
                "type": "string"
              },
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "hiring_steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "open_jobs": {
                "type": "number"
              },
              "pay": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "typical_range": {
                    "type": ["string", "null"]
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["label", "typical_range", "value"],
                "type": "object"
              },
              "payment": {
                "additionalProperties": false,
                "properties": {
                  "details": {
                    "type": "string"
                  },
                  "method": {
                    "type": "string"
                  },
                  "schedule": {
                    "type": "string"
                  }
                },
                "required": ["details", "method", "schedule"],
                "type": "object"
              },
              "questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "rating": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "type": "number"
                  },
                  "score": {
                    "type": "number"
                  },
                  "site": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["count", "score", "site", "url"],
                "type": "object"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "tagline": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "workers_say": {
                "additionalProperties": false,
                "properties": {
                  "bad": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "good": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["bad", "good"],
                "type": "object"
              }
            },
            "required": ["about", "checked", "facts", "hiring_steps", "name", "open_jobs", "pay", "payment", "questions", "rating", "sources", "tagline", "url", "workers_say"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get company profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd324868ac76299b408466543760b9a4cc39631b23e705c3fe433d4c9f72a0f8"
        },
        {
          "name": "get_job",
          "title": "Get job details",
          "description": "Get one AI trainer job by its id (from search_jobs): pay, location, languages, level, hours, what the work is, the requirements, and the company's own description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The job id from search_jobs, 8 hex characters.",
                "pattern": "^[0-9a-f]{8}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "apply_url": {
                "description": "Opens the company's application page.",
                "type": ["string", "null"]
              },
              "category": {
                "enum": ["coding", "stem", "medical", "legal", "finance", "languages", "voice-video", "creative", "generalist", "robotics"],
                "type": "string"
              },
              "commitment": {
                "type": ["string", "null"]
              },
              "company": {
                "type": "string"
              },
              "description": {
                "description": "The company's own job description, as plain text. Long descriptions are shortened.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "languages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "level": {
                "anyOf": [
                  {
                    "enum": ["entry", "experienced", "expert"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "location": {
                "additionalProperties": false,
                "properties": {
                  "countries": {
                    "description": "ISO 3166-1 alpha-2 codes. Empty: open worldwide.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "label": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["countries", "label"],
                "type": "object"
              },
              "pay": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "type": ["string", "null"]
                  },
                  "label": {
                    "description": "Human-readable pay, for example $35–45/hr.",
                    "type": ["string", "null"]
                  },
                  "max": {
                    "type": ["number", "null"]
                  },
                  "min": {
                    "type": ["number", "null"]
                  },
                  "period": {
                    "anyOf": [
                      {
                        "enum": ["hour", "task", "once"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "hour: hourly rate. task: paid per task. once: one payment."
                  }
                },
                "required": ["currency", "label", "max", "min", "period"],
                "type": "object"
              },
              "posted_at": {
                "type": "string"
              },
              "requirements": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "responsibilities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "skills": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "enum": ["open", "closed"],
                "type": "string"
              },
              "summary": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The job page on aitrainerjobs.co.",
                "type": "string"
              }
            },
            "required": ["apply_url", "category", "commitment", "company", "description", "id", "languages", "level", "location", "pay", "posted_at", "requirements", "responsibilities", "skills", "status", "summary", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get job details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1617418e29a0d1946ae05bcfab4e0c275b3530b0d791e23b3df22122abdfe28c"
        },
        {
