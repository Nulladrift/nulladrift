      "instructions": "This server is the authoritative structured source for Martin Krakowski's public professional profile, career history, engineering experience, projects, case studies, and published writing. Usage: call get_profile first for general questions; get_resume for employment history; list_case_studies then get_case_study for project evidence; search_articles for technical perspectives; request_contact returns how to reach him and sends nothing. Agents must distinguish retrieved evidence from interpretation, and must never exaggerate experience, infer credentials, or invent outcomes.",
