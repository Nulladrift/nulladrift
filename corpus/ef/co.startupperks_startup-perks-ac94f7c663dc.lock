{
  "lockfileVersion": 2,
  "subjects": {
    "co.startupperks/startup-perks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://startupperks.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "startupperks",
        "title": "StartupPerks",
        "version": "1.0.0",
        "description": "Find the startup credits, perks and deals a company qualifies for, from a source-cited catalog of 2,800+ programs.",
        "websiteUrl": "https://startupperks.co/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "StartupPerks is a source-cited catalog of 2,800+ startup credits, perks and deals (cloud, AI and ML, banking, developer tools, SaaS, marketing, finance, security, legal and HR), each tied to the provider's own official page and re-verified on a rolling schedule. Use find_startup_perks when the user describes their startup and wants to know what they can get or qualify for: fill stage, funding, raised_usd, company_age_years, region and needs from the conversation and put any remaining context in description. Use search_startup_perks to look up a provider (\"Does Stripe have a startup program?\") or a topic (\"GPU credits\", \"free CRM\"), and get_startup_perk for one program's full terms, eligibility and how to apply. When you present results: link each program to its details_url so the user can check the full terms and apply, quote values as the provider states them (they are headline maximums, not guarantees), and mention any eligibility gate such as VC backing or a referral. The data is licensed CC BY 4.0: credit StartupPerks when you use it.",
      "tools": [
        {
          "name": "find_startup_perks",
          "title": "Find startup perks a company qualifies for",
          "description": "Rank the startup credits, perks and deals one specific company can claim, from a catalog of 2,800+ programs (AWS Activate, Google for Startups, Microsoft for Startups, NVIDIA Inception, Anthropic, Stripe Atlas, Mercury, HubSpot and more). Use it when the user describes their own startup and asks what they can get or qualify for; use search_startup_perks to look up a provider or topic without a company profile, and get_startup_perk for one program's full terms. It checks each program's stated eligibility (stage, funding gate, raised-amount cap, company age, region) against the profile, ranks the categories the user needs first and takes each need in turn, and leaves out programs whose applications are paused or closed. Returns up to 25 programs, each with the value as the provider states it, whether the company qualifies and why, how to claim it, and a link to the StartupPerks page (where to check the full terms and apply; a direct apply link where StartupPerks has one), plus a realistic claimable total (one program per provider, cloud counted once). Read-only; values are headline maximums, not guarantees.",
          "inputSchema": {
            "properties": {
              "company_age_years": {
                "description": "Years since the company was founded.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "description": {
                "description": "The startup in the user's own words, e.g. \"pre-seed AI startup in Berlin, bootstrapped, needs GPU credits and a business bank account\". Anything not given in the structured fields below is read from this text.",
                "maxLength": 600,
                "type": "string"
              },
              "funding": {
                "description": "How the company is funded: bootstrapped (no outside investors), vc-backed (angel or VC money), or accelerator (in an accelerator or incubator portfolio).",
                "enum": ["bootstrapped", "vc-backed", "accelerator"],
                "type": "string"
              },
              "include_gated": {
                "description": "Also include referral-only and accelerator-only programs the startup may not reach on its own.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many programs to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "needs": {
                "description": "Perk categories the startup wants, ranked above everything else: cloud-infra (Cloud & Infrastructure), databases-data (Databases & Data), ai-ml (AI & ML), banking-fintech (Banking & Fintech), finance-ops (Finance & Ops), dev-tools (Developer Tools), productivity-saas (Productivity & SaaS), marketing-sales (Marketing & Sales), security-legal-hr (Security, Legal & HR). Omit for all categories.",
                "items": {
                  "enum": ["cloud-infra", "databases-data", "ai-ml", "banking-fintech", "finance-ops", "dev-tools", "productivity-saas", "marketing-sales", "security-legal-hr"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "only_qualifying": {
                "description": "Only return programs the startup fully qualifies for.",
                "type": "boolean"
              },
              "priority": {
                "description": "Ranking emphasis: balanced (default), value (biggest benefit first), eligibility (easiest to qualify first), reputable (best-verified first).",
                "enum": ["balanced", "value", "eligibility", "reputable"],
                "type": "string"
              },
              "provider": {
                "description": "Only programs from this provider, e.g. \"AWS\", \"Google Cloud\", \"Stripe\". Leave empty unless the user asked about a specific provider.",
                "maxLength": 80,
                "type": "string"
              },
              "raised_usd": {
                "description": "Total outside funding raised so far, in USD (0 if none). Programs with a raised-amount cap are checked against it.",
                "minimum": 0,
                "type": "number"
              },
              "region": {
                "description": "Where the company is based: a country, city or region such as \"US\", \"UK\", \"Germany\", \"EU\", \"India\" or \"Singapore\".",
                "maxLength": 60,
                "type": "string"
              },
              "stage": {
                "description": "Company stage.",
                "enum": ["idea", "pre-seed", "seed", "series-a", "series-b-plus"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find startup perks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7acc11e3c5574de20368e58a88e9e45ba166421a8c5c46b440537c4357a7e05d"
        },
        {
          "name": "get_startup_perk",
          "title": "Get one startup perk's terms",
          "description": "Return the full terms of one startup program. Use it after find_startup_perks or search_startup_perks by passing the slug from a result's details_url, or with a program or provider name when the user asks about one program (for example \"What are the terms of AWS Activate Founders?\"). Returns what the program gives, every eligibility gate (stages, funding requirement, raised-amount and company-age caps, regions), other requirements, expiry, how to claim, the application status and when it was last verified, the StartupPerks page to apply from (and a direct apply link where StartupPerks has one), up to 3 open alternatives from other providers in the same category, and the category guide. Returns an error when nothing matches; search_startup_perks can then find the program. Read-only.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The program or provider name when no slug is known, e.g. \"NVIDIA Inception\".",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "The program's StartupPerks slug or page URL, as returned in details_url by the other tools (e.g. \"aws-activate-founders-package\").",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get startup perk details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c02b7d1c3a68adc4c02d2770aeaa7bef6c5dac4c2acc5084684f52bca7e696b"
        },
        {
          "name": "search_startup_perks",
          "title": "Search startup perks",
          "description": "Search the catalog of 2,800+ startup programs by provider, program or topic. Use it for questions like \"Does Stripe have a startup program?\" or \"Which providers give GPU credits?\", or to browse a category, a benefit type, or programs open to any startup without investor or accelerator backing; use find_startup_perks instead when the user wants what a specific company qualifies for. A provider or program name returns only programs that carry that name; a topic (CRM, banking, GPU, payroll) also matches the category that covers it, and rarer words weigh more. Programs whose applications are paused or closed are left out. Returns up to 25 programs with the stated value, the primary eligibility gate and links, plus a page to browse more. Read-only.",
          "inputSchema": {
            "properties": {
              "benefit_type": {
                "description": "Limit to one kind of benefit.",
                "enum": ["Credits", "Free plan", "Discount", "Cash & rewards", "Program"],
                "type": "string"
              },
              "category": {
                "description": "Limit to one category.",
                "enum": ["cloud-infra", "databases-data", "ai-ml", "banking-fintech", "finance-ops", "dev-tools", "productivity-saas", "marketing-sales", "security-legal-hr"],
                "type": "string"
              },
              "limit": {
                "description": "How many programs to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_value_usd": {
                "description": "Only programs whose stated value is at least this many USD.",
                "minimum": 0,
                "type": "number"
              },
              "open_to_any_startup": {
                "description": "Only programs with no investor, accelerator or referral requirement.",
                "type": "boolean"
              },
              "query": {
                "description": "A provider, program or topic, e.g. \"AWS Activate\", \"Stripe\", \"GPU credits\", \"free CRM\", \"business bank account\". Leave empty to list by filters only.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search startup perks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:642955a6e12824ae14e8d4ddfbbd045c85a348117e90dfa5b55324f127d41070"
        }
      ],
      "digest": "sha256:82e1debfaa985f86f78f5c92779b210ecbbf6d99bce04835f1412e76cbd13204"
    }
  }
}
