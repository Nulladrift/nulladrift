{
  "lockfileVersion": 2,
  "subjects": {
    "com.firmtape/geopolitical-osint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geo.firmtape.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "firmtape-geo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FirmTape Geo: dated public records of what is happening in the world, each with its source, measured against its own normal. Start with geo_snapshot for one country, geo_coverage to choose one, or geo_records for the rows themselves. geo_activity and geo_series give counts and measured series against their normal; geo_sources and geo_latency say which feeds answered and how late their records arrived. geo_sites covers named energy sites and ports watched from orbit. Cite the source and link of every record you use. A quiet window is not a calm world until geo_sources shows the feeds were answering.",
      "tools": [
        {
          "name": "geo_activity",
          "description": "Records per UTC day for a filter, and the median of the complete days before the last one, so a window can be read against its own normal. The day still being filled is returned apart and never averaged. Any feed that was switched on inside the window is named, because a rise that is only new feeds is not a busier world.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. IR",
                "type": "string"
              },
              "days": {
                "description": "days back from until, instead of since; default 30, at most 365",
                "type": "number"
              },
              "feed": {
                "description": "feed id, or several separated by commas; the ids are listed by geo_sources",
                "type": "string"
              },
              "min_severity": {
                "description": "1 keeps everything, 2 is notable and above, 3 is critical only",
                "type": "integer"
              },
              "sector": {
                "description": "gov, air, gps, sea, internet, ground, space or attention",
                "enum": ["gov", "air", "gps", "sea", "internet", "ground", "space", "attention"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 UTC start",
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 UTC end; default now",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31f5d9ff5bc4202b40fedf556968df532962f409d4d58237e78684f0aade0a07"
        },
        {
          "name": "geo_coverage",
          "description": "Which countries the archive names in a window, with record and notable counts and the time of the last one, most notable first. Use it to pick a country before calling geo_snapshot or geo_records, instead of guessing one. A record naming several countries counts in each of them.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "days back from until, instead of since; default 30, at most 365",
                "type": "number"
              },
              "limit": {
                "description": "how many countries, 1 to 250, default 50",
                "type": "integer"
              },
              "min_severity": {
                "description": "1 keeps everything, 2 is notable and above, 3 is critical only",
                "type": "integer"
              },
              "sector": {
                "description": "gov, air, gps, sea, internet, ground, space or attention",
                "enum": ["gov", "air", "gps", "sea", "internet", "ground", "space", "attention"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 UTC start",
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 UTC end; default now",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:210ee368174ebf7a7a17f295718676e29890c72d936a710d117e4f7ffdda0ef7"
        },
        {
          "name": "geo_latency",
          "description": "How long after a source published a record it reached us, per feed: the median, the 90th percentile and the worst case in seconds, over a window of up to 90 days. Rows found later in a source's own history are stamped backfill and counted apart rather than averaged in. Where publication_time_is_ours is true the source publishes no time of its own, so the record is stamped when we read it and the lag is zero by construction, not by speed. This measures our collection, not the news: almost every record here is public the minute it is published, and this product never claims to be ahead of the market.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. IR",
                "type": "string"
              },
              "days": {
                "description": "days back from until, instead of since; default 7, at most 90",
                "type": "number"
              },
              "feed": {
                "description": "feed id, or several separated by commas; the ids are listed by geo_sources",
                "type": "string"
              },
              "sector": {
                "description": "gov, air, gps, sea, internet, ground, space or attention",
                "enum": ["gov", "air", "gps", "sea", "internet", "ground", "space", "attention"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 UTC start",
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 UTC end; default now",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:927f3d8985e162b9067fe1e37d71953d0cf18ef74769e38fd674130ca4863e37"
        },
        {
          "name": "geo_records",
          "description": "The records themselves, newest first: government advisories and sanctions, flight restrictions, maritime warnings, internet and grid outages, conflict, disaster and attention records. Up to a year back, each with its source, its link, its publication time and the time we first saw it, all UTC. Ask for one exact record with uid. For how many rather than which, call geo_activity; for one country in one call, geo_snapshot. Context, never a trading signal.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. IR",
                "type": "string"
              },
              "cursor": {
                "description": "the next_cursor of a previous call",
                "type": "integer"
              },
              "feed": {
                "description": "feed id, or several separated by commas; the ids are listed by geo_sources",
                "type": "string"
              },
              "limit": {
                "description": "1 to 200, default 50",
                "type": "integer"
              },
              "min_severity": {
                "description": "1 keeps everything, 2 is notable and above, 3 is critical only",
                "type": "integer"
              },
              "q": {
                "description": "words in the title",
                "type": "string"
              },
              "sector": {
                "description": "gov, air, gps, sea, internet, ground, space or attention",
                "enum": ["gov", "air", "gps", "sea", "internet", "ground", "space", "attention"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 UTC start; default 7 days ago",
                "type": "string"
              },
              "uid": {
                "description": "one record id, or several separated by commas; ignores the time window",
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 UTC end; default now",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25d4a84313dd1831f799981a2918c5d160b42d3fb3a0a208e6a6f1c0f15cd2e5"
        },
        {
          "name": "geo_series",
          "description": "The measured series for one country: aircraft overhead, military aircraft and degraded GPS by theatre, ships at sea in the Baltic and Norwegian areas our own AIS collectors watch hourly, ship transits through its chokepoints, routed IPv4 address space, fire clusters, night lights, PLA sorties around Taiwan and reading attention. Each carries its recent points, its own normal, the ratio between them, and normal_ready, which is false while the baseline is still too short to mean anything. A ratio is withheld with ratio_note where the normal is too small to divide by, as it is for the chokepoints that pass two or three ships a day.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, required, e.g. IR",
                "type": "string"
              },
              "id": {
                "description": "one series id from a previous answer, to return only that one",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c60c2f897caed9c08455596dcb680d393524ebfaeb995c715be16e4a51f8848"
        },
        {
          "name": "geo_sites",
          "description": "Named energy sites and ports watched from orbit: refineries, oil terminals, LNG plants and fuel depots in Russia, Crimea and the Middle East, and ten oil ports. Without id, every site with its last thermal anomaly, its latest dated Sentinel-2 view and, for a port, its latest week of radar vessel counts. With id, one site in full: its thermal anomalies, its views (latest, and before and after each anomaly), 90 days of NASA FIRMS readings, and a port's weekly occupancy against its own normal. A thermal anomaly says a site read hotter than its own normal, never what caused it; a view is not evidence of damage.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. IR",
                "type": "string"
              },
              "id": {
                "description": "one site id from a previous answer, e.g. ru-tuapse-refinery; omit to list every site",
                "type": "string"
              },
              "kind": {
                "description": "list only this kind of site",
                "enum": ["refinery", "terminal", "lng", "depot", "port"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:364bef108970a81167415673b9ac6d5e44262519ee79f70e670ca4dfa4f0bd80"
        },
        {
          "name": "geo_snapshot",
          "description": "One country in one call: its record counts by sector and by feed, its notable records, and every measured series that speaks about it against its own normal. This is geo_records, geo_activity and geo_series for a single country, counted, not written: no narrative, no score and no forecast.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, required, e.g. IR",
                "type": "string"
              },
              "days": {
                "description": "days back from until, instead of since; default 7, at most 365",
                "type": "number"
              },
              "limit": {
                "description": "how many records to return, 1 to 50, default 10",
                "type": "integer"
              },
              "since": {
                "description": "ISO 8601 UTC start",
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 UTC end; default now",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0d0aa7a0b34aca397db53ce38379e7b8a1d68d67d123471e49eee46c9cf24c9"
        },
        {
          "name": "geo_sources",
          "description": "Every feed behind the records: its id, its sector, when it last answered, its failure streak, and how many records it has in the served history. Read this before trusting a quiet window, because a feed that stopped answering is not a world that went calm. For how late each feed's records arrive, call geo_latency.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:938f1877c0b9e00e89abb309d3bc422185cd6c1fdfe4404ed257b1bd56d58770"
        }
      ],
      "digest": "sha256:25da12c705d1b54789427113b49f3b01707dea6dc12916fd2bee5f5e89e4741d"
    }
  }
}
