        {
          "name": "create_image",
          "description": "Create or transform an image using AirGallery's core multi-modal image pipeline (powers the Create page). Accepts up to 5 reference images plus a custom prompt and/or style preset, and supports multiple image models. Every model accepts reference images. Returns { image }. Cost depends on the model, in credits: nano-banana-2 3, nano-banana-pro 6, nano-banana-2-lite 2, nano-banana 3, gpt-image-2.6-flare 8, gpt-image-2.6-sunburst 8, gpt-image-2.5-flare 8, gpt-image-2.5-sunburst 8, gpt-image 8, gpt-image-mini 3, flux-3 3, flux-3-klein 1, mai-image-2.6 3, grok-imagine-2 4, seedream-5-pro 2, muse-image 1, minimax-h3 2, recraft-v4.1 2. Requires 'ai' scope.",
          "inputSchema": {
            "properties": {
              "customPrompt": {
                "description": "Free-form description of what to create (max 2000 chars). Required when no images are given.",
                "type": "string"
              },
              "images": {
                "description": "Optional: 0–5 reference images, each as a base64 data URI or HTTPS image URL. Omit for pure text-to-image (customPrompt is then required).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "model": {
                "description": "Image model: 'nano-banana-2' (Gemini 3.1 Flash Image, default), 'nano-banana-pro' (Gemini 3 Pro Image), 'nano-banana-2-lite' (Gemini 3.1 Flash-Lite Image, fast and cheap), 'nano-banana' (Gemini 2.5 Flash Image), 'gpt-image-2.6-flare' (OpenAI GPT Image 2.6 Flare, newest, fast), 'gpt-image-2.6-sunburst' (OpenAI GPT Image 2.6 Sunburst, careful edits, about 50s), 'gpt-image-2.5-flare' and 'gpt-image-2.5-sunburst' (OpenAI GPT Image 2.5, previous generation), 'gpt-image' (OpenAI GPT Image 2), 'gpt-image-mini' (OpenAI GPT Image 1 Mini), 'flux-3' (Black Forest Labs FLUX 3), 'flux-3-klein' (FLUX 3 Klein, fastest and cheapest), 'mai-image-2.6' (Microsoft MAI-Image 2.6, precise edits), 'grok-imagine-2' (xAI Grok Imagine Image 2.0), 'seedream-5-pro' (ByteDance Seedream 5.0 Pro, slower), 'muse-image' (Meta Muse Image 1.0, blends photos), 'minimax-h3' (MiniMax H3 Image, open weights, many references), 'recraft-v4.1' (Recraft V4.1, design and illustration; text only, no reference images).",
                "enum": ["nano-banana-2", "nano-banana-pro", "nano-banana-2-lite", "nano-banana", "gpt-image-2.6-flare", "gpt-image-2.6-sunburst", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst", "gpt-image", "gpt-image-mini", "flux-3", "flux-3-klein", "mai-image-2.6", "grok-imagine-2", "seedream-5-pro", "muse-image", "minimax-h3", "recraft-v4.1"],
                "type": "string"
              },
              "plugins": {
                "description": "Optional effects (the Create page's Plugins & Effects).",
                "properties": {
                  "caption": {
                    "description": "Handwritten caption added at the bottom of the image",
                    "type": "string"
                  },
                  "frameColor": {
                    "description": "Polaroid frame color (polaroid preset only; default white)",
                    "type": "string"
                  },
                  "grainIntensity": {
                    "description": "'heavy' adds pronounced film grain",
                    "type": "string"
                  },
                  "vignetteStrength": {
                    "description": "'strong' adds a dramatic vignette",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "preset": {
                "description": "Style preset applied to the images and/or prompt (default none).",
                "enum": ["none", "polaroid", "vintage", "watercolor", "oilpainting", "sketch", "popart", "cyberpunk", "anime"],
                "type": "string"
              }
            },
            "type": "object"
          },
