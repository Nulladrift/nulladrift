        {
          "name": "studio_add_elements",
          "description": "Add text, rectangles, ellipses or SVG paths to a frame of a Design Studio file. Positions are px from the frame's top-left. Text wraps inside its width; use align center with x 0 and the frame's width to center it. Changes are saved to the cloud file; an editor tab that already has the file open must be reloaded to see them (and would overwrite them if it saves first). Requires auth (write).",
          "inputSchema": {
            "properties": {
              "document_id": {
                "description": "Studio document UUID",
                "type": "string"
              },
              "elements": {
                "items": {
                  "properties": {
                    "align": {
                      "description": "text: alignment inside the box (default left)",
                      "enum": ["left", "center", "right", "justify"],
                      "type": "string"
                    },
                    "color": {
                      "description": "Fill hex (default #000000)",
                      "type": "string"
                    },
                    "corner_radius": {
                      "description": "rect: corner radius in px",
                      "type": "number"
                    },
                    "d": {
                      "description": "path: SVG path data; x/y place the path's top-left",
                      "type": "string"
                    },
                    "font_family": {
                      "description": "text: any Google Fonts family, a system font, or a family added with studio_add_font (default Inter)",
                      "type": "string"
                    },
                    "font_size": {
                      "description": "text: size in px (default 48). At 300 DPI, 1 pt = 4.17 px",
                      "type": "number"
                    },
                    "font_style": {
                      "enum": ["normal", "italic"],
                      "type": "string"
                    },
                    "font_weight": {
                      "description": "text: 100–900 (default 400)",
                      "type": "number"
                    },
                    "height": {
                      "description": "Shape height (rect, ellipse)",
                      "type": "number"
                    },
                    "letter_spacing": {
                      "description": "text: extra spacing in px",
                      "type": "number"
                    },
                    "line_height": {
                      "description": "text: line height multiple (default 1.16)",
                      "type": "number"
                    },
                    "name": {
                      "description": "Layer name",
                      "type": "string"
                    },
                    "opacity": {
                      "description": "0–1 (default 1)",
                      "type": "number"
                    },
                    "rotation": {
                      "description": "Degrees",
                      "type": "number"
                    },
                    "scale": {
                      "description": "path: uniform scale (default 1)",
                      "type": "number"
                    },
                    "stroke": {
                      "description": "Stroke hex (rect, ellipse, path)",
                      "type": "string"
                    },
                    "stroke_width": {
                      "description": "Stroke width in px",
                      "type": "number"
                    },
                    "text": {
                      "description": "text: the content; \\n breaks lines",
                      "type": "string"
                    },
                    "type": {
                      "description": "Element kind (default text)",
                      "enum": ["text", "rect", "ellipse", "path"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Text box width (text wraps inside it; default: to the frame's right edge), or shape width",
                      "type": "number"
                    },
                    "x": {
                      "description": "Left edge, px from the frame's left",
                      "type": "number"
                    },
                    "y": {
                      "description": "Top edge, px from the frame's top",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "frame_id": {
                "description": "Frame id from studio_get_document / studio_create_document",
                "type": "string"
              }
            },
            "required": ["document_id", "elements", "frame_id"],
            "type": "object"
          },
