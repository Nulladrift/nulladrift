      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cosasguapas-com-gifts",
        "title": "Cosas Guapas gift finder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Finds original, fun and unusual gift ideas from Cosas Guapas (cosasguapas.com), a hand-picked catalogue for shoppers in Spain. Results are in Spanish. Results give the product name, why it works as a gift, a price range and the link to its page, where the photos, the current price and the store button are. Always show each suggestion with its link so the user can see it.",
      "tools": [
        {
          "name": "find_gifts",
          "title": "Find gift ideas",
          "description": "Search original, funny and unusual gift ideas. Describe the person or the occasion (e.g. \"coffee lover dad\", \"white elephant\", \"cat owner\") and optionally a budget. Returns up to 10 products with why they fit, a price range and the link to the product page (photos, current price and where to buy are on that page), plus gift guides on the same topic.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many products (default 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in euros.",
                "type": "number"
              },
              "query": {
                "description": "Who the gift is for, their interests or the occasion. Any language.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bafdde7526859875ca41cc4293220eeac11aa6297d635080812bb433e27e53e5"
        },
        {
          "name": "get_gift_guide",
          "title": "Get a gift guide",
          "description": "The products of one gift guide (by the slug from list_gift_guides): name, why it fits, price range and link to each product page.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Guide slug, as returned by list_gift_guides.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
