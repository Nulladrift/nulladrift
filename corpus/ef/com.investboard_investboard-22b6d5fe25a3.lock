        {
          "name": "get_policy",
          "title": "Read the investment policy",
          "description": "Read the signed original mandate or the current structured policy export as Markdown. Large documents return exact chunks: use page.next_offset with page.document_sha256 until null, then concatenate markdown in order. The signature applies to the complete original, never one chunk. A changed snapshot requires restarting. Investor-authored originals do not claim the generated export schema or instrument neutrality. Generated sections are instrument-neutral; attributed additions may be free-form. Supplying setup_id records this read and binds the setup receipt to the verified AI agent; it does not change the mandate.",
