                "description": "Optional. The investor's own remark on the decision.",
                "maxLength": 1000,
                "type": "string"
              },
              "outcome": {
                "description": "What the investor did: proceeded (carried it out), abandoned (dropped it) or deferred (put it off). Tell the investor in those words, not the code. Final once saved, so confirm it with them first.",
                "enum": ["proceeded", "abandoned", "deferred"],
