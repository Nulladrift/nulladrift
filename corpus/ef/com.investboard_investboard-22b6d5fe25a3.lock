          "name": "preview_rebalance",
          "title": "Compare contribution and rebalance alternatives",
          "description": "Use when an investor wants to compare holding, buying or selling under the signed policy for the whole portfolio. Use the supplied amount and currency. Include a cash limit only for partial_cash. Returns feasibility, fees, reserve, tax coverage, drift and trades. Page 20 rows with detail, offset and the first revision on the same request. Saves no check or plan and places no order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
