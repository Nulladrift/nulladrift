          "name": "preview_rebalance",
          "title": "Compare contribution and rebalance alternatives",
          "description": "Compare what the investor could do next with their whole wealth: keep it as it is, invest new money, invest only part of it, or sell. Use when the investor asks how to invest a contribution or how to get back to their target. The amount they named and its currency are enough: run it with those instead of asking for more. Name a cash limit only when they want to invest part of the amount now (the partial_cash alternative). Returns each alternative's feasibility, fees, reserve, tax coverage and remaining drift in full, with its trades, from one snapshot under the signed policy. A large book returns 20 rows per list; read more with detail, offset, the first result's revision and the same request. It saves no check or plan and places no order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
