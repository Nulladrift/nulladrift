                    "name": {
                      "description": "Security label supplied by the investor.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Units held, not market value.",
                      "maximum": 1000000000,
                      "minimum": 1e-8,
                      "type": "number"
