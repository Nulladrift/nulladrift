                "maxLength": 64,
                "minLength": 64,
                "type": "string"
              },
              "reasoning": {
                "additionalProperties": false,
                "description": "The investor's own words for this review. Ask them for each; never write these on their behalf.",
                "properties": {
                  "conversationExcerpt": {
                    "default": "",
                    "description": "Optional. The part of this conversation the wording came from.",
                    "maxLength": 12000,
                    "type": "string"
                  },
                  "expectedObservation": {
                    "description": "What the investor expects to observe next, in their own words.",
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "falsifier": {
                    "description": "What observable result would change the investor's view, in their own words. With the investor, ask it as that question; do not call it a falsifier.",
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "reviewDueDate": {
                    "description": "The investor's next review date, YYYY-MM-DD, in the future.",
                    "format": "date",
                    "type": "string"
                  },
                  "statement": {
                    "description": "The investor's reasoning, in their own words: why they keep or reconsider their strategy.",
                    "maxLength": 5000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "strategyDecision": {
                    "description": "keep when the investor keeps their strategy, explore when they want to look into a change.",
                    "enum": ["keep", "explore"],
                    "type": "string"
                  }
                },
                "required": ["expectedObservation", "falsifier", "reviewDueDate", "statement", "strategyDecision"],
                "type": "object"
              },
              "request_id": {
                "description": "A new UUID you make up for this request. Send the same one again only to repeat the identical request. It is plumbing: never show it to the investor or ask them for it.",
                "format": "uuid",
                "type": "string"
