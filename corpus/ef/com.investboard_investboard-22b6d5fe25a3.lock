          "name": "record_decision",
          "title": "Record a stated decision",
          "description": "Record what the investor decided after a check: proceeded, abandoned or deferred, with an optional note and their own broker reference. Write-once per check. This only writes a record of a decision the investor already made: Investboard never places, changes or transmits an order.",
