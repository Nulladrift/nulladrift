        {
          "name": "get_portfolio_correlations",
          "title": "Read historical correlations",
          "description": "Read observed weekly EUR return correlations for the investor's holdings. Includes sample dates, pair observations, intervals, price-only exceptions and coverage. Insufficient or expired evidence returns unavailable. Page with computed_at. Requires portfolio:read and performance depth entitlement.",
