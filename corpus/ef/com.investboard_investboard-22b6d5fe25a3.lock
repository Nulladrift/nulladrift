        {
          "name": "check_action",
          "title": "Check an intended change",
          "description": "Check an intended change against the connected investor's mandate and return a rule-level verdict: ok, breach, cooling_off, no_rule, unavailable or unclassified. Accepts legs, each naming an ISIN or an asset class with an amount in euros or in percent of the portfolio; a single asset-class action (action_type, asset_class, amount_pct_of_portfolio) is also accepted. Every touched rule includes its current and projected state, plus evidence coverage and freshness. The verdict cites asset classes, the investor's rules and leg indices, never an instrument name. Each call saves a new check and verdict in the investor's history and returns its check_id, the identifier for that saved record. Stale or missing portfolio data produces an unavailable verdict with evidence recovery guidance and an optional next_step_href relative to the connected Investboard origin. A repeated call evaluates the then-current evidence and creates another saved check. Investboard never places, changes or transmits an order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action_type": {
                "enum": ["buy", "sell", "rebalance", "hold", "contribute", "withdraw"],
                "type": "string"
              },
              "amount_pct_of_portfolio": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "asset_class": {
                "enum": ["equities", "bonds", "crypto", "alternatives", "gold", "cash", "real_estate", "commodities"],
                "type": "string"
              },
              "funding": {
                "description": "Where the money for the buy legs comes from. within_book (what the check uses when this field is left out): the book keeps its size and each leg moves only its own class, so a purchase paid from cash names its cash side as a sell leg of its own. new_money: money from outside the book, so the book grows by the buy legs; every class and position share is measured over the grown book, and an issuer's share over the equity book grown by the equity buys. The action_type does not set it: a contribute action is measured within the book unless funding is new_money. When the investor names no source for the money, use new_money, tell them the check took the money as coming from outside the book, and offer to run it again if it comes from a sale or from cash in the book.",
                "enum": ["within_book", "new_money"],
                "type": "string"
              },
              "legs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "eur": {
                              "exclusiveMinimum": 0,
                              "maximum": 1000000000,
                              "type": "number"
                            }
                          },
                          "required": ["eur"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "pct_of_portfolio": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["pct_of_portfolio"],
                          "type": "object"
                        }
                      ]
                    },
                    "side": {
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "subject": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "isin": {
                              "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                              "type": "string"
                            }
                          },
                          "required": ["isin"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "asset_class": {
                              "enum": ["equities", "bonds", "crypto", "alternatives", "gold", "cash", "real_estate", "commodities"],
                              "type": "string"
                            }
                          },
                          "required": ["asset_class"],
                          "type": "object"
                        }
                      ]
                    }
                  },
                  "required": ["amount", "side", "subject"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "rationale": {
                "maxLength": 2000,
                "type": "string"
              },
              "setup_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["action_type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "Use this saved check id in record_decision or get_reflection_history.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "checked_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
