          "description": "Estimate a named crisis's impact on supplied holdings using sector and asset-class shocks. Returns portfolio and position impacts, methods, sources and missing coverage. Scenarios: gfc_2008, covid_2020, rate_hike_2022, euro_crisis_2011, dotcom_2000. Needs no sign-in. For a strategy's historical path use backtest_holdings.",
          "inputSchema": {
