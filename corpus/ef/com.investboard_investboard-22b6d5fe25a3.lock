                "description": "Portfolio reporting currency.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "holdings": {
                "description": "Supplied holdings snapshot; empty for a transaction-only import.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assetClass": {
                      "description": "Investor-supplied asset classification.",
                      "enum": ["stock", "etf", "fund", "bond", "other"],
                      "type": "string"
                    },
                    "costBasisPerUnit": {
                      "description": "Acquisition cost per unit in currency; never guess missing costs.",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "currency": {
                      "description": "Currency of the holding's per-unit amounts.",
                      "pattern": "^[A-Za-z]{3}$",
                      "type": "string"
                    },
                    "currentPrice": {
                      "anyOf": [
                        {
                          "maximum": 1000000000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Source price per unit in currency, or null if unknown."
                    },
                    "exchange": {
                      "anyOf": [
                        {
                          "maxLength": 10,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Listing venue, or null if unknown."
                    },
                    "isin": {
                      "anyOf": [
                        {
                          "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Investor-supplied ISIN, or null when only a symbol is known."
