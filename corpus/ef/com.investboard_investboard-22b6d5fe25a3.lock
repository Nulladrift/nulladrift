          "title": "Check an intended change",
          "description": "Check intended changes against the mandate. Give legs with an ISIN or asset class and an amount in euros or portfolio percent. A single asset-class action is also accepted. Returns each affected rule's current and projected state, evidence coverage and a verdict. Every call saves a new check_id. Missing or stale evidence returns unavailable and may include a recovery link. Verdicts cite rules, classes and leg indices. Investboard places no orders.",
