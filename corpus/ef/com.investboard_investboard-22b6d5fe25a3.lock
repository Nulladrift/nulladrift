          "name": "prepare_review",
          "title": "Prepare a portfolio review for approval",
          "description": "Use when an investor wants to prepare a review after get_review_changes. Use the investor's statement, expectation, falsifier, future review date and keep or reconsider choice. Ask for missing parts only. Pass the comparison's expected_revision and a new request_id. The investor opens native_url to approve, save or complete it. Preparation changes no baseline. Expires in one day. AI agents may start at most 8 new stress tests and prepared reviews a day for one investor, counted together.",
