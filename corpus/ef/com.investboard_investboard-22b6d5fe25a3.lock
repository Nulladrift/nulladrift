                      "type": "string"
                    },
                    "correlation": {
                      "maximum": 1,
                      "minimum": -1,
                      "type": "number"
                    },
                    "interval": {
                      "anyOf": [
                        {
                          "additionalItems": false,
                          "items": [
                            {
                              "type": "number"
                            },
                            {
                              "type": "number"
                            }
                          ],
                          "maxItems": 2,
                          "minItems": 2,
                          "type": "array"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "n": {
                      "maximum": 9007199254740991,
                      "minimum": 2,
                      "type": "integer"
                    }
                  },
                  "required": ["a", "b", "band", "correlation", "interval", "n"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "reason": {
                "type": ["string", "null"]
              },
              "returnCurrency": {
                "const": "EUR",
                "type": "string"
              },
              "scope": {
                "const": "whole_portfolio",
                "type": "string"
              },
              "status": {
                "enum": ["available", "partial", "unavailable", "gated", "snapshot_changed"],
                "type": "string"
              },
              "to": {
                "type": ["string", "null"]
              },
              "total": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "weeks": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
