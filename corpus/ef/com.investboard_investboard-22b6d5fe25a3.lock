                "type": "string"
              },
              "before_id": {
                "description": "An entry id from this journal. A marker this journal does not recognize answers an empty page, which is not the end of the journal; restart from the newest page.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "reviews_due_only": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
