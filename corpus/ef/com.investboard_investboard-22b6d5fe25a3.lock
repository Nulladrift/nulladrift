        {
          "name": "get_review_changes",
          "title": "Read what changed since the last review",
          "description": "Read what changed in the investor's portfolio since their last approved review: opening and closing value, what was funding and what was investment result, late or corrected records, a changed mandate, which goals changed (their figures stay in Investboard), and rules newly breached or cleared. Use when the investor asks what changed since their last review, or before preparing one. Covers every owned portfolio unless portfolio_ids names some; the answer lists the owned portfolios. Reads only: it saves nothing and moves no baseline. A first review has nothing to compare with and says so. Lists are bounded; read more of one with detail, offset and the first result's revision.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Optional. The currency to report in, three letters. Leave it out to use the first portfolio's.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "detail": {
                "default": "items",
                "description": "Which list to read more of: what changed (items), late or corrected records, changed rules, rules newly breached or cleared, or the sources behind one item.",
                "enum": ["items", "corrections", "rule_changes", "rule_observations", "item_sources"],
                "type": "string"
              },
              "item_index": {
                "description": "Only with item_sources: which item's sources to read.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "How many rows of the chosen list to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where the page of the chosen list starts. Leave it out for the first answer.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "portfolio_ids": {
                "description": "Optional. Review only these portfolios of the investor. Leave it out to review all of them.",
