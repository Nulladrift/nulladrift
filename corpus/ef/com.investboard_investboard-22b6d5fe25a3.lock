        {
          "name": "get_own_record",
          "title": "Read the investor's own thesis",
          "description": "Read the investor's thesis by ISIN or ticker and optional exchange. Useful for recalling an investor's premise before discussing their own recorded instrument or when the investor asks what they thought about it. Attribute the words to the investor. Resolve ambiguity from the returned candidates. Only resolved=true, found=false without gated means absent. gated=true requires Premium. Uses the current record and a matched identifier. A draft is inactive and an open verdict is undecided.",
