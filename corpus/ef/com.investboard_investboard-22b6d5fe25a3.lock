        {
          "name": "get_own_record",
          "title": "Read the investor's own thesis",
          "description": "Read the investor's own recorded investment thesis for one instrument, identified by ISIN, or by ticker with an optional exchange: their statement and falsifier, recording and review dates, conviction and their own later verdict. Useful for recalling an investor's premise before discussing their own recorded instrument or when the investor asks what they thought about it. Statement and falsifier are the investor's verbatim words, attributed to that investor, not an AI agent's opinion, advice or mandate verdict. resolved=false means no instrument was identified among their holdings or recorded theses and no thesis lookup occurred; ambiguous matches return candidates without selecting one. gated=true indicates Premium entitlement is required and reveals no record details; it does not establish that a record is absent. An absent record is indicated only by resolved=true, found=false and no gated flag. The subject echoes supplied or owner-matched identifiers, never a security name. A different echoed ISIN identifies a different instrument or share class. This is the current projection, not a historical version lookup; a draft is not an activated version. An open verdict records an undecided review.",
