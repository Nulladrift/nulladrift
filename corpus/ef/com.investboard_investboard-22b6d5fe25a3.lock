                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Age of `fetchedAt` in milliseconds, as the server measured it for this answer. Use it instead of comparing `fetchedAt` against the device clock, which can be wrong. The X-Ray serve surfaces re-derive it on every request, so a stale-while-revalidate answer ages honestly. Null exactly when `fetchedAt` is null. Guard the comparison rather than trusting the arm: `null < n` is true in JavaScript, so read `stalenessMs !== null && stalenessMs < n`, or the null arm reads as freshly fetched."
                          }
