                "type": "string"
              },
              "funding": {
                "description": "Where the money for the buy legs comes from. within_book (what the check uses when this field is left out): the book keeps its size and each leg moves only its own class, so a purchase paid from cash names its cash side as a sell leg of its own. new_money: money from outside the book, so the book grows by the buy legs; every class and position share is measured over the grown book, and an issuer's share over the equity book grown by the equity buys. A withdraw action removes net sale proceeds from the portfolio and uses the remaining balance. A contribute action is measured within the book unless funding is new_money. When the investor names no source for the money, use new_money, tell them the check took the money as coming from outside the book, and offer to run it again if it comes from a sale or from cash in the book.",
