        {
          "name": "start_stress_test",
          "title": "Start a portfolio stress test",
          "description": "Start a stress test: replay one historical crisis over everything the investor holds today. Use when the investor asks how their portfolio would have done in a crisis. Pass a scenario_id from list_stress_scenarios and a new request_id. It returns at once while the calculation runs; read the result with get_stress_test and the same request_id after retry_after_seconds. Repeating a request_id returns the same run, never a second one. The run appears in the investor's stress test history in Investboard. AI agents may start at most 8 new stress tests and prepared reviews a day for one investor, counted together. It changes nothing about the portfolio and is hypothetical, not a forecast or advice.",
