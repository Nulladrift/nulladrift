          "name": "get_policy",
          "title": "Read the investment policy",
          "description": "Read the signed mandate or structured policy export as Markdown. Reassemble chunks with page.next_offset and page.document_sha256. Restart if the snapshot changes. The signature applies to the full original. Generated sections are instrument-neutral. Investor-authored additions can be free-form. setup_id binds a read receipt to the verified AI agent.",
