                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where the page of the chosen list starts. Leave it out for the first answer.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "request": {
                "additionalProperties": false,
                "description": "What to compare: the investor's contribution and its currency. Everything else is optional.",
                "properties": {
                  "accounts": {
                    "description": "Optional. Broker limits the investor has stated for a depot. Never assume them; without them the comparison says which plans depend on them.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "feePerTrade": {
                          "description": "The broker's fee per order, in the contribution's currency.",
                          "maximum": 1000000000000,
