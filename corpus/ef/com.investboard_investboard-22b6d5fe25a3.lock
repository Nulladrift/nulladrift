              "portfolio": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "baseCurrency": {
                        "default": "EUR",
                        "description": "Value currency (default EUR).",
                        "pattern": "^[A-Za-z]{3}$",
                        "type": "string"
                      },
                      "basis": {
                        "const": "weights",
                        "default": "weights",
                        "description": "Fractions summing to 1.",
                        "type": "string"
                      },
                      "holdings": {
                        "description": "Supplied positions.",
                        "items": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "isin": {
                                  "description": "Supplied ISIN.",
                                  "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                                  "type": "string"
                                },
                                "weight": {
                                  "description": "Portfolio fraction (0.6 = 60%).",
                                  "exclusiveMinimum": 0,
                                  "maximum": 1,
                                  "type": "number"
                                }
                              },
                              "required": ["isin", "weight"],
                              "type": "object"
                            },
                            {
                              "additionalProperties": false,
                              "properties": {
                                "assetClass": {
                                  "const": "cash",
                                  "description": "Cash position.",
                                  "type": "string"
                                },
                                "currency": {
                                  "description": "Cash denomination.",
                                  "pattern": "^[A-Za-z]{3}$",
                                  "type": "string"
                                },
                                "weight": {
                                  "description": "Portfolio fraction (0.6 = 60%).",
                                  "exclusiveMinimum": 0,
                                  "maximum": 1,
                                  "type": "number"
                                }
                              },
                              "required": ["assetClass", "currency", "weight"],
                              "type": "object"
                            }
                          ]
                        },
                        "maxItems": 25,
                        "minItems": 1,
                        "type": "array"
                      },
                      "limit": {
                        "default": 50,
                        "description": "Top positions per list (1–100). tailWeight sums the named rows beyond the list. No paging.",
