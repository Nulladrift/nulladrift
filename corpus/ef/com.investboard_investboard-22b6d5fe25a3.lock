            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "exchange": {
                "description": "Listing venue qualifying the ticker.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "isin": {
                "description": "Trimmed and uppercased before matching.",
                "pattern": "^[A-Za-z]{2}[A-Za-z0-9]{9}[0-9]$",
                "type": "string"
              },
              "ticker": {
                "description": "Investor-supplied ticker; qualify with exchange when ambiguous.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
