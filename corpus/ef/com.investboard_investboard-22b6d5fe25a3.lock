                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "max_characters": {
                "description": "Maximum UTF-16 characters per page.",
                "maximum": 24000,
                "minimum": 2,
                "type": "integer"
              },
              "offset": {
                "description": "UTF-16 offset from page.next_offset.",
                "maximum": 1048576,
                "minimum": 0,
                "type": "integer"
              },
              "setup_id": {
                "description": "Optional setup UUID; records this read as setup proof.",
                "format": "uuid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
