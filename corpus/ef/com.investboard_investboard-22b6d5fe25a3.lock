          "description": "Prepare a portfolio review for the investor to approve in Investboard. Use when the investor has seen get_review_changes and given the wording: their statement, what they expect next, what would change their view, a future review date and whether they keep or reconsider the strategy. Their words are the agreement: ask only for a missing part, never for a second yes; they approve the wording on the review page. Pass that result's revision as expected_revision and a new request_id. Returns a link (native_url) the investor must open to save a draft or complete the review. It approves and completes nothing and moves no baseline; never say the review is done. It expires after a day. AI agents may start at most 8 new stress tests and prepared reviews a day for one investor, counted together.",
