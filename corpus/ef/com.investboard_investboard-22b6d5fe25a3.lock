            "required": ["anchor", "basis", "commonWeeks", "computedAt", "coverage", "definitions", "frequency", "from", "largestGroupShare", "limitations", "method", "nextOffset", "omitted", "pairs", "reason", "returnCurrency", "scope", "status", "to", "total", "weeks", "weightedMeanCorrelation", "window"],
