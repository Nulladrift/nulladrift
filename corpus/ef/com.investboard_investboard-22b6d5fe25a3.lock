                              "type": "string"
                            }
                          },
                          "required": ["verdict", "written_at"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["agent_reflection_id", "conviction", "created_at", "falsifier", "id", "memo", "mood", "review_due_at", "verdict"],
                  "type": "object"
