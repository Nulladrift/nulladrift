                        "maxItems": 50,
                        "type": "array"
                      },
                      "omittedExclusions": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "omittedPriceBasisIsins": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "priceBasisIsins": {
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "totalCount": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
