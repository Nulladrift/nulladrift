                            "description": "The provider that supplied the price, and when it did. A provenance is the provider AND the moment, or nothing, so this is null on every answer whose `fetchedAt` is null, and also on a dated answer whose provider is not recorded: the X-Ray surfaces read a two-value price-source column that cannot separate the scheduled batch from the realtime feed, so they date the envelope and decline to attribute it."
                          },
                          "source": {
                            "description": "How the price reached us: `live` from the realtime feed, `batch` from the scheduled refresh, `manual` from a value the user entered, and `none` exactly when no row behind this answer carries a price. On an aggregate the most degraded row source wins. Do not read a source other than `none` as evidence of a fetch: a manual-only book reports `manual`, which is a figure the user typed rather than one anybody fetched.",
