                "type": "string"
              },
              "limit": {
                "description": "How many rows of the chosen list to return. Leave it out: a comparison that fits comes whole.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where the page of the chosen list starts. Leave it out for the first answer.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "request": {
                "additionalProperties": false,
                "description": "What to compare: the investor's contribution and its currency. Everything else is optional.",
                "properties": {
                  "accounts": {
                    "description": "Optional. Broker limits the investor has stated for a depot. Never assume them; without them the comparison says which plans depend on them.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "feePerTrade": {
                          "description": "The broker's fee per order, in the contribution's currency.",
                          "maximum": 1000000000000,
                          "minimum": 0,
                          "multipleOf": 0.01,
                          "type": "number"
                        },
                        "increment": {
                          "description": "The step an order amount moves in, for example 1 for whole euros.",
                          "maximum": 1000000000000,
                          "minimum": 0.01,
                          "multipleOf": 0.01,
                          "type": "number"
                        },
                        "maximum": {
                          "description": "The largest order amount the broker accepts.",
                          "maximum": 1000000000000,
                          "minimum": 0,
                          "multipleOf": 0.01,
                          "type": "number"
                        },
                        "minimum": {
                          "description": "The smallest order amount the broker accepts.",
                          "maximum": 1000000000000,
                          "minimum": 0,
                          "multipleOf": 0.01,
                          "type": "number"
                        },
                        "portfolioId": {
                          "description": "The depot these limits belong to.",
                          "format": "uuid",
                          "type": "string"
                        },
                        "quantityIncrement": {
                          "description": "Optional. The smallest fraction of a share the broker trades.",
                          "exclusiveMinimum": 0,
                          "maximum": 1000000,
                          "type": "number"
                        }
                      },
                      "required": ["feePerTrade", "increment", "maximum", "minimum", "portfolioId"],
                      "type": "object"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "cashLimit": {
                    "description": "Optional. Only when the investor wants to invest just part of the contribution now: the most they would invest. Leave it out when they invest all of it. Never more than the contribution.",
                    "maximum": 1000000000000,
                    "minimum": 0,
                    "multipleOf": 0.01,
                    "type": "number"
                  },
                  "contribution": {
                    "description": "New money the investor adds now, in `currency`. 0 when they add nothing and only ask how to get back to their target.",
                    "maximum": 1000000000000,
                    "minimum": 0,
                    "multipleOf": 0.01,
                    "type": "number"
                  },
                  "currency": {
                    "description": "The contribution's currency, three letters, for example EUR.",
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "priority": {
                    "description": "Optional. minimize_sales prefers new money to selling; target_alignment gets closest to the target weights. Leave it out to follow the investor's own recorded rule.",
                    "enum": ["minimize_sales", "target_alignment"],
                    "type": "string"
