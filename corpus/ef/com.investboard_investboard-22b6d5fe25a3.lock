              "coverage": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "analyzedCount": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "coveredValueShare": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "exclusions": {
                        "items": {
                          "additionalProperties": false,
