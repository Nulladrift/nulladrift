        {
          "name": "get_journal",
          "title": "Read the decision journal",
          "description": "Read the investor's decision journal, newest first. Useful when the investor asks what they decided or wrote, or when a review is due. Page with before and before_id. reviews_due_only selects due entries without verdicts whose linked thesis version, if present, is active. Attribute verbatim text to the investor. Follow agent_reflection_id via get_reflection_history({ id }). Ask for the investor's observation before quoting the original in a due review. Reviews are saved in Investboard.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "before": {
                "description": "A timestamp alone resumes at millisecond precision and may skip rows sharing that millisecond: send before_id with it.",
                "format": "date-time",
                "type": "string"
              },
              "before_id": {
                "description": "An entry id from this journal. A marker this journal does not recognize answers an empty page, which is not the end of the journal; restart from the newest page.",
                "format": "uuid",
                "type": "string"
              },
              "limit": {
                "description": "Maximum journal entries per page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "reviews_due_only": {
                "description": "Only overdue entries still awaiting the investor's review.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "agent_reflection_id": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "conviction": {
                      "anyOf": [
                        {
                          "maximum": 5,
                          "minimum": 1,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "created_at": {
                      "format": "date-time",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                      "type": "string"
                    },
                    "falsifier": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "memo": {
                      "type": "string"
                    },
                    "mood": {
                      "anyOf": [
                        {
                          "enum": ["calm", "tense", "euphoric", "fearful"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "review_due_at": {
                      "anyOf": [
                        {
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "verdict": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "verdict": {
                              "enum": ["confirmed", "refuted", "open"],
                              "type": "string"
                            },
                            "written_at": {
                              "format": "date-time",
                              "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                              "type": "string"
                            }
                          },
                          "required": ["verdict", "written_at"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["agent_reflection_id", "conviction", "created_at", "falsifier", "id", "memo", "mood", "review_due_at", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_before": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "next_before_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["items", "next_before", "next_before_id"],
            "type": "object"
          },
