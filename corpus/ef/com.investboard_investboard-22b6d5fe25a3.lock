        {
          "name": "start_stress_test",
          "title": "Start a portfolio stress test",
          "description": "Use when an investor asks to replay a historical crisis against their current portfolio. Use a scenario_id from list_stress_scenarios and a new request_id. After retry_after_seconds, call get_stress_test with the same request_id. Retries reuse the run and it appears in Investboard history. AI agents may start at most 8 new stress tests and prepared reviews a day for one investor, counted together. The result is hypothetical and leaves the portfolio unchanged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "A new UUID you make up for this request. Send the same one again only to repeat the identical request. It is plumbing: never show it to the investor or ask them for it.",
                "format": "uuid",
                "type": "string"
              },
              "scenario_id": {
                "description": "The id of one scenario from list_stress_scenarios.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["request_id", "scenario_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "computed_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "data": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "retry_after_seconds": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "run": {
                        "additionalProperties": false,
                        "properties": {
                          "baseCurrency": {
                            "enum": ["EUR", "USD", "GBP", "CHF", "JPY"],
                            "type": "string"
                          },
                          "jobId": {
                            "format": "uuid",
                            "type": "string"
                          },
                          "scope": {
                            "const": "whole_wealth",
                            "type": "string"
                          },
                          "status": {
                            "const": "queued",
                            "type": "string"
                          }
                        },
                        "required": ["baseCurrency", "jobId", "scope", "status"],
                        "type": "object"
                      }
                    },
                    "required": ["retry_after_seconds", "run"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "native_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reason": {
                "type": ["string", "null"]
              },
              "revision": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
