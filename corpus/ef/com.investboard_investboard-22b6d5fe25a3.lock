        {
          "name": "prepare_portfolio_import",
          "title": "Prepare a portfolio import",
          "description": "Prepare a portfolio import for investor review. Supply currency, valuation date and costs. Limits: 200 holdings and 200 transactions. Transaction-only histories need ISINs for trades, transfers and splits. For ticker-only history, request a holdings snapshot. Use supplied values only. Share review_url for confirmation in Investboard. Retry with the same request_id and payload. Requires portfolio:import.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
