        {
          "name": "city_permit_rules",
          "description": "Likely permits and inspections for an address or city plus project type. Price $0.02 (20000 atomic USDC on Base). Pays via x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address or city name. Required unless city is set. Max 200 characters. Alias: location.",
                "type": "string"
              },
              "city": {
                "description": "City name. Alias of address.",
                "type": "string"
              },
              "location": {
                "description": "Alias of address.",
                "type": "string"
              },
              "project": {
                "description": "Project type: deck, fence, kitchen, bathroom, adu, electrical, plumbing, roof, driveway, solar, window, general. Defaults to general.",
                "enum": ["deck", "fence", "kitchen", "bathroom", "adu", "electrical", "plumbing", "roof", "driveway", "solar", "window", "general"],
                "type": "string"
              },
              "project_type": {
                "description": "Alias of project.",
                "enum": ["deck", "fence", "kitchen", "bathroom", "adu", "electrical", "plumbing", "roof", "driveway", "solar", "window", "general"],
                "type": "string"
