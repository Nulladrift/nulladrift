      "instructions": "Eleven paid tools plus unpaid listseat_claim_status. listseat_claim_status never charges. Other unpaid tools/call returns isError PaymentRequired until _meta[\"x402/payment\"] is set. Price is in each paid tools/list description. listed=true is never invented.",
