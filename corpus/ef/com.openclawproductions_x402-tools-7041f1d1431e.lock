          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact": {
                "description": "Optional contact string. Not required for enqueue.",
                "type": "string"
              },
              "origin": {
                "description": "Public origin URL to enqueue for ping-verify.",
                "type": "string"
              }
