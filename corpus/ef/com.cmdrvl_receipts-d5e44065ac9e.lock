        {
          "name": "verify_loan_status_counts",
          "title": "Verify a deal's loan-status counts (derived)",
          "description": "Verify count claims over loan status ('N in special servicing / paid off / defeased') for a deal. Counts are DERIVED from the ABS-EE tape, not reported by any filing. Three grains, never mixed: activity (active, resolved_paid_off, defeased); servicing: in_special_servicing = loans CURRENTLY with the special servicer (the count for 'N in special servicing'; it OVERLAPS active, never sum); resolution reason (resolved_via_special_servicing and other payoff reasons) = loans that already LEFT the pool, NOT current counts. Pass `claimed` for exact per-status adjudication. Uncovered deal: UNVERIFIED.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claimed": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Optional claimed per-status counts, e.g. {\"in_special_servicing\": 10, \"defeased\": 2}. Each is adjudicated by EXACT match against the derived count.",
                "propertyNames": {
                  "enum": ["active", "resolved_paid_off", "defeased", "in_special_servicing", "resolved_via_special_servicing", "voluntary_prepayment", "payoff_unclassified", "liquidated_loss", "matured_balloon", "repurchased"]
                },
                "type": "object"
              },
              "deal": {
                "description": "Deal name or alias, e.g. 'WFCM 2020-C58'.",
                "type": "string"
              }
            },
            "required": ["deal"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "claim_verdict": {
                "enum": ["CONFIRM", "DENY", "CONFLICT", "UNVERIFIED", "OUT_OF_COVERAGE"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "resolved_deal": {
                "additionalProperties": true,
