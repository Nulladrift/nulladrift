      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Claim in, receipt out: a VERIFICATION MCP over the dual-source SEC CMBS confirmation ledger, not a data MCP. A claim is required; you get a verdict and a receipt, never the underlying value. Route by question: verify_loan_field (7 loan fields), verify_deal_field (4 pool fields), verify_counterparty (master or special servicer; verify_servicer is the old name), verify_loan_status_counts, verify_fund_holding_coupon (NPORT), verify_building_size and verify_appraised_value (issuance, as of securitization; OUT_OF_COVERAGE when the deal or loan is outside coverage). For a pasted paragraph call verify_claims. Resolve names with find_deals; call coverage FIRST to learn what is in scope; covered_deals is the full list. claim_verdict (CONFIRM / DENY / CONFLICT / UNVERIFIED / OUT_OF_COVERAGE; DENY only here) judges the caller's claim; receipt.confirmation says whether the two filings agree with each other. OUT_OF_COVERAGE means nothing is held for the ask; UNVERIFIED means held but not confirmable. Neither is a denial. Serving is CURRENT-ONLY and the receipt stamps its as-of. New or short on context: call quickstart. Deeper coverage, history, bonds, entitlements: cairn@cmdrvl.com.",
