        {
          "name": "verify_counterparty",
          "title": "Verify a deal counterparty (roster)",
          "description": "Adjudicate 'who is the <role> on deal X' against the SEC 10-D counterparty roster (today: master and special servicer). A SINGLE-SOURCE roster fact. Master is the roster party, NOT the ABS-EE tape's primary servicer. Pass claimed_name: CONFIRM/DENY under the ledger's name normalization, never fuzzy. Says WHO the party is, not that a loan is in special servicing. Unknown deal or role: OUT_OF_COVERAGE.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claimed_name": {
                "description": "Name to adjudicate (normalized comparison).",
                "type": "string"
              },
              "deal": {
                "description": "Deal name or alias, e.g. 'WFCM 2020-C58'.",
                "type": "string"
              },
              "role": {
                "description": "Default special_servicer. Full definitions ride each receipt's field_definition.",
                "enum": ["master_servicer", "special_servicer"],
                "type": "string"
              }
            },
            "required": ["deal"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
