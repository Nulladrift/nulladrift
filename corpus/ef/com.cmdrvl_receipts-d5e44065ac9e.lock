                "type": ["number", "string"]
              },
              "deal": {
                "description": "Deal name or alias, e.g. 'WFCM 2020-C58' or 'Wells Fargo 2020-C58'.",
                "type": "string"
              },
              "field": {
                "description": "The loan-grain field to verify. One of (full definitions: coverage, or the receipt's field_definition):\n• beginning_balance — trust-level SCHEDULED balance at period start\n• ending_balance — trust-level SCHEDULED balance at period end (not the actual/as-paid balance)\n• scheduled_principal — principal applied: scheduled amortization plus unscheduled (curtailments, payoffs)\n• scheduled_interest — scheduled interest, trust-level\n• note_rate — current note rate in percent (not origination rate, not pool WAC)\n• servicer_advances — Taxes & Insurance (escrow) advances outstanding, not P&I advances\n• paid_through_date — paid-through date (a date; exact match)",
                "enum": ["beginning_balance", "ending_balance", "scheduled_principal", "scheduled_interest", "note_rate", "servicer_advances", "paid_through_date"],
                "type": "string"
              },
              "loan_id": {
                "description": "Loan / entity id within the deal, e.g. '25'.",
