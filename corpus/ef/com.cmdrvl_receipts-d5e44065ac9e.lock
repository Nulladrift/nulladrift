        {
          "name": "verify_claims",
          "title": "Verify every checkable claim in a text (bulk)",
          "description": "Bulk verifier: paste text, get per-claim statuses. ASSERTIONS ONLY: a QUESTION ('is it $9.4M?') binds nothing and returns total 0; single-value questions are not claims and are not checked here. Deterministic grammar, four families: loan fields, pool fields, servicer identity, loan-status counts. Unparsed text is listed in unchecked_spans, never dropped. EXACT deal references (id, alias, CIK) work best; matching is never fuzzy. Statuses (verified / contradicted / insufficient_evidence / out_of_scope) are answers, not errors. Each claim has a claim_id, citations and a confidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "deal_hint": {
                "description": "Fallback deal context when a sentence names no deal (exact resolution only).",
                "type": "string"
              },
              "period_hint": {
                "description": "YYYY-MM annotation only — latest-only server; a mismatch is noted and drops confidence one tier.",
                "type": "string"
              },
              "risk_tolerance": {
                "description": "Default normal = max(ledger tolerance, stated precision); strict = ledger only; lenient = 2x stated precision. Counts and names are always exact.",
                "enum": ["strict", "normal", "lenient"],
                "type": "string"
              },
              "text": {
                "description": "The paragraph / memo excerpt to check.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claims": {
                "description": "Per claim: normalized_claim, citations, notes, recommended_language.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "claim_id": {
                      "type": "string"
                    },
                    "claim_text": {
                      "type": "string"
                    },
                    "confidence": {
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["verified", "contradicted", "insufficient_evidence", "out_of_scope"],
                      "type": "string"
                    }
                  },
                  "required": ["claim_id", "claim_text", "confidence", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "material_issues": {
                "items": {
                  "additionalProperties": true,
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "search_backend": {
                "$ref": "#/properties/material_issues/items"
              },
              "summary": {
                "additionalProperties": true,
                "description": "Counts: total, verified, contradicted, insufficient_evidence, out_of_scope.",
                "properties": {},
                "type": "object"
              },
              "tool_version": {
                "type": "string"
              },
              "unchecked_spans": {
                "description": "Text no grammar rule could check, with reason and hint.",
                "items": {
                  "$ref": "#/properties/material_issues/items"
                },
                "type": "array"
              }
            },
            "required": ["claims", "material_issues", "search_backend", "summary", "tool_version", "unchecked_spans"],
            "type": "object"
          },
          "annotations": {
