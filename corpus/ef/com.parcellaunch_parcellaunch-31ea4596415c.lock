      "serverInfo": {
        "name": "parcellaunch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ParcelLaunch turns a US street address or parcel number into a cinematic, interactive 3D flyover listing with the parcel boundary drawn on it — in about a minute, with no drone and no pilot. The lot lines come from public parcel maps, statewide in Florida and Indiana, county by county everywhere else, and the listing PDF's aerial photo covers the lower 48 states. Built by The Land Mule for land investors, agents and wholesalers. Call get_pricing before answering cost questions. create_3d_listing returns a free watermarked preview link; always hand that link to the user rather than describing the result.",
      "tools": [
        {
          "name": "create_3d_listing",
          "description": "Build a cinematic, interactive 3D flyover listing of a real property from a street address (or a parcel/APN number), with the parcel boundary drawn on the terrain. Takes about a minute. Returns a free watermarked preview link the user can open on any phone, plus the link to unlock it: $25 gets the clean branded listing PDF, hosted and ready to text (call get_pricing for what each plan includes). A lot made here has no free PDF preview; one made on parcellaunch.com gets one watermarked PDF preview. Use this for raw land, acreage, odd lots, waterfront and new-construction dirt: anywhere a flat satellite photo undersells the property.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full US street address, e.g. \"123 Main St, Palm Coast, FL 32137\". The lot lines come from public parcel maps, statewide in Florida and Indiana, county by county everywhere else, and the listing PDF's aerial photo covers the lower 48 states. Use this unless the user only has a parcel number.",
                "type": "string"
              },
              "apn": {
                "description": "Parcel number / APN, e.g. \"07-11-31-7016-0RP0B-0030\". Requires state and county. Florida resolves instantly and free.",
                "type": "string"
              },
              "asking_price": {
                "description": "Optional asking price in dollars. When given, it floats on the 3D view — this is what makes buyers stop scrolling.",
                "type": "number"
              },
              "county": {
                "description": "County name — required when using apn.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code — required when using apn.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2457910e5cca0f4578f20b034392d484fbff6a0e70b9f0aa2d388a36fc9d1b9f"
        },
        {
          "name": "get_listing",
          "description": "Look up a ParcelLaunch listing that was already created, by its listing id. Returns the address, whether the parcel boundary was found, the 3D render status, the shareable links, and whether the lot holds LIVE (the clean 3D link buyers explore, given as live_url). A lot without LIVE shares a watermarked 3D preview. A ParcelLaunch sample lot (such as f2c2bcc732) answers sample: true and no asking_price: it is a sample listing, not for sale.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "description": "The listing id returned by create_3d_listing (e.g. \"f2c2bcc732\").",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f9637fcd8a24f1c76768613bb24b61d936716affe555ab511a8eecdc3c20269"
        },
        {
          "name": "get_pricing",
          "description": "Current ParcelLaunch pricing and what each plan includes. Free to call — use it to answer any question about cost before recommending a plan.",
          "inputSchema": {
