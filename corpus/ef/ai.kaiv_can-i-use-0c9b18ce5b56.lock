      "serverInfo": {
        "name": "Can I Use",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"Can I Use\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_feature_support",
          "title": "Check Feature Support",
          "description": "Can I use this feature, and from which browser version?\n\nAccepts a loose name (\":has()\", \"container queries\", \"css-grid\") and resolves it to a caniuse feature, then returns the earliest continuously-supported version per major browser, global usage percentage, and a conservative safe_to_use flag. Use this first; it answers the whole question in one call.",
          "inputSchema": {
            "properties": {
              "feature": {
                "description": "Feature name or caniuse id. Loose names are resolved, e.g. \"has selector\" finds \"css-has\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["feature"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "description": {
                "nullable": true,
                "type": "string"
              },
              "feature": {
                "description": "Resolved caniuse feature id.",
                "type": "string"
              },
              "global_partial_percent": {
                "nullable": true,
                "type": "number"
              },
              "global_support_percent": {
                "description": "Percentage of tracked global users on a browser version that fully supports it.",
                "nullable": true,
                "type": "number"
              },
              "meaning": {
                "description": "One sentence, safe to show a user verbatim.",
                "type": "string"
              },
              "other_matches": {
                "description": "Other features the query could have meant.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "resolved_from": {
                "description": "The query that was matched, so a caller can see what it actually asked about.",
                "type": "string"
              },
              "safe_to_use": {
                "description": "True only when global support is at least 90% AND no major browser is missing it. A conservative single answer.",
                "type": "boolean"
              },
              "spec": {
                "nullable": true,
                "type": "string"
              },
              "support": {
                "additionalProperties": {
                  "properties": {
                    "browser": {
                      "description": "Human browser name.",
                      "type": "string"
                    },
                    "current": {
                      "description": "State in the newest release: supported, partial support, not supported, supported behind a vendor prefix, disabled by default.",
                      "type": "string"
                    },
                    "latest_version": {
                      "description": "Newest released version caniuse tracks for this browser.",
                      "nullable": true,
                      "type": "string"
                    },
                    "since": {
                      "description": "Earliest version from which support has held continuously to the newest release. Null when never supported.",
                      "nullable": true,
                      "type": "string"
                    },
                    "supported_now": {
                      "description": "Whether the newest released version supports it.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "description": "Per-browser detail, keyed by caniuse browser id.",
                "type": "object"
              },
              "title": {
                "type": "string"
              },
              "unsupported_in": {
                "description": "Major browsers whose newest release still does not support it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["feature", "meaning", "support", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Feature Support"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:be515a5df1da6030d05b5467bb53284375d820b42f2ffe319dae9af80aa78b16"
        },
