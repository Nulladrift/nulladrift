      "serverInfo": {
        "name": "Can I Use",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This is an MCP server managed by Kaiva Bridge. Each tool carries a JSON Schema for its input: read inputSchema before calling rather than guessing argument names. Check readOnlyHint and destructiveHint before calling; a tool without them may change data. When Kaiva Bridge refuses or cannot complete a call, it returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_feature_support",
          "title": "Check Feature Support",
          "description": "Can I use this feature, and from which browser version?\n\nAccepts a loose name (\":has()\", \"container queries\", \"css-grid\") and resolves it to a caniuse feature, then returns the earliest continuously-supported version per major browser, global usage percentage, and a conservative safe_to_use flag. Use this first; it answers the whole question in one call.",
          "inputSchema": {
            "properties": {
              "feature": {
                "description": "Feature name or caniuse id. Loose names are resolved, e.g. \"has selector\" finds \"css-has\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["feature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Feature Support"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:71737f03fb964611e24fe0265e1549e9b5eadafe8120545f802985f0b4693a8c"
        },
        {
          "name": "get_feature_by_id",
          "title": "Get Feature By Id",
          "description": "Support table for an exact caniuse feature id.\n\nUse when the id is already known, for example from a previous search. No fuzzy matching is applied.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Exact caniuse feature id, e.g. \"css-has\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Feature By Id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2869f3b4f47f898c7a2e8651b619d48aea7f4a380a95a7bc52705855eed37979"
        },
        {
          "name": "search_features",
          "title": "Search Features",
          "description": "Find the caniuse feature id for a loose query.\n\nUse when a query is ambiguous and you want to choose between candidates before checking support.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Free-text query, e.g. \"grid\" or \"web share\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Features"
          },
