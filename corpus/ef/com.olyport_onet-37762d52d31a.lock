        {
          "name": "get_career_outlook",
          "description": "Get employment projections and career outlook for an O*NET occupation.\n\n    Returns projected job growth rate, employment numbers, projected openings,\n    and an outlook summary (bright, average, or below average).\n\n    Args:\n        soc_code: The O*NET-SOC code (e.g. '15-1252.00' for Software Developers).\n    ",
          "inputSchema": {
            "properties": {
              "soc_code": {
                "title": "Soc Code",
                "type": "string"
              }
            },
            "required": ["soc_code"],
            "title": "get_career_outlookArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_career_outlookOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e692b659c315d0725f46a51e6ee868f127f7b77ef38fc53e688e6f9d839b2b10"
        },
        {
          "name": "get_occupation_detail",
          "description": "Get detailed information about an O*NET occupation.\n\n    Returns comprehensive data including description, skills, knowledge areas,\n    abilities, work activities, technology skills, and education requirements.\n\n    Args:\n        soc_code: The O*NET-SOC code (e.g. '15-1252.00' for Software Developers,\n            '29-1141.00' for Registered Nurses).\n    ",
          "inputSchema": {
            "properties": {
              "soc_code": {
                "title": "Soc Code",
                "type": "string"
              }
            },
            "required": ["soc_code"],
            "title": "get_occupation_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_occupation_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f37768d10578a0bcd0dc10d103b6afffe4e8d8004eeaa00b0e2248e1e262ffb4"
        },
        {
          "name": "get_occupation_wages",
          "description": "Get wage and salary estimates for an O*NET occupation.\n\n    Returns median, 10th, 25th, 75th, and 90th percentile wages,\n    both hourly and annual. Can be filtered by location.\n\n    Args:\n        soc_code: The O*NET-SOC code (e.g. '15-1252.00' for Software Developers).\n        location: Optional location filter — state name or 'National' (default: national).\n    ",
          "inputSchema": {
            "properties": {
              "location": {
                "default": null,
                "title": "Location",
                "type": "string"
              },
              "soc_code": {
                "title": "Soc Code",
                "type": "string"
              }
            },
            "required": ["soc_code"],
            "title": "get_occupation_wagesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_occupation_wagesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f77d62504f616694668012aa357b1271774b3d5e05188a6086de06964503a8f1"
        },
        {
          "name": "search_occupations",
          "description": "Search O*NET occupations by keyword.\n\n    Returns a list of occupations matching the keyword with their SOC codes,\n    titles, and relevance scores. Use the SOC code from results with other\n    O*NET tools to get detailed information.\n\n    Args:\n        keyword: Search term (e.g. 'software developer', 'nurse', 'electrician').\n        limit: Maximum number of results to return (default 25).\n    ",
          "inputSchema": {
            "properties": {
              "keyword": {
                "title": "Keyword",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "title": "search_occupationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
