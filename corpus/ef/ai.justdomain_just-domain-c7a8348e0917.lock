            "additionalProperties": false,
            "properties": {
              "classes": {
                "anyOf": [
                  {
                    "items": {
                      "maximum": 45,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 45,
                    "minItems": 1,
                    "type": "array"
                  },
