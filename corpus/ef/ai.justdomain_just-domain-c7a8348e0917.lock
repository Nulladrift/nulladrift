                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "URL on the Just Domain website where the user completes payment. Set for available domains we can actually register; null for unavailable ones, for premium names (the checkout API refuses them), and for endings whose registry requires registrant data we cannot supply yet. The MCP tool handler fills this in after the bare service call so the UI widget's Buy button can open checkout directly in one click."
                    },
                    "fqdn": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "premium": {
                      "default": false,
                      "type": "boolean"
                    },
                    "price": {
