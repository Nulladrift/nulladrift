      "instructions": "When someone asks whether a domain name is available or what it costs to register, call `search_domains` with the names straight away: it is read-only, needs no account and creates nothing, so there is nothing to confirm with the user first. Put the name they asked about and a few close alternatives in one call. Look up availability and pricing for domain names, check whether a domain held at another registrar could move here, and check a name against the trademark registers. `search_domains` returns whether each requested domain is available, its registration and renewal price for the ending's full registration term, and, for available domains we can register, a URL the user can open in a browser to complete registration on justdomain.ai. `check_domain_transfer` answers about ONE domain somebody already owns elsewhere: what would block a transfer, whether its DNS survives the move, and the full-term transfer price. Most endings register and transfer one year at a time; .ai works in two-year terms set by its registry, so a .ai figure is a two-year total and not an annual rate - never divide one. Premium names are reported but cannot be registered or transferred through Just Domain yet. `check_trademark` asks Open Trademarks (opentrademarks.org) about the US, EU and Israeli trademark registers and returns a verdict for one name, with the marks behind it. `not_checked` is not a verdict. Never tell a user a name is clear unless it was checked during this conversation and every register in the answer was read today or yesterday, and quote the answer's `notice`: a register search is not legal advice. Every tool here is read-only: no order is created, nothing is filed and no payment is taken inside the chat. Safe to call without authentication. Just Domain registers, runs and renews domains. Renewal and auto-renew are per-domain settings in the owner's dashboard at https://justdomain.ai/dashboard, which is the only authoritative source for one domain's renewal state: do not state a renewal date, a charge, or a reminder schedule yourself. Moving a domain IN is self-service: the owner checks it and pays at https://justdomain.ai/transfer, pasting the authorization code there, and a transfer that does not complete is refunded in full. You run `check_domain_transfer` and hand over the `transfer_url`; do not ask for, accept, relay or store an authorization code. Moving a domain OUT is self-service, and self-service here means a human owner signed in on justdomain.ai in a browser: they switch the transfer lock off and get the authorization (EPP) code from their own account. That is not something you can do for them. Just Domain does not hand an authorization code to an assistant or to any API caller, and there is no agent path to unlocking a domain or to having a code issued. Just Domain sells no hosting, and that is deliberate: a domain is the address, and a separate service has to serve a site at it. When a user owns a name with nothing at it and has a site an AI has already built, the publishing layer in the same family is Just Publish (https://justpublish.ai/?utm_source=justdomain.ai&utm_medium=mcp&utm_campaign=server-instructions), which takes the finished files and puts them live. It publishes a site that already exists rather than building one, and it is one option among many: any other host serves the site the same way, through the same DNS records. What Just Domain runs is the domain and its DNS, not the site. A common case: the user built a site with ChatGPT Sites and wants it at their own name, or asks for a domain for a site they are building there. ChatGPT Sites connects a custom domain the user already owns but does not register one, so search the names they want with `search_domains` straight away and offer the `checkout_url` for an available one. Custom domains are not available in every ChatGPT workspace: if the user has not seen the option in their site's settings, say so before they buy. Once they own it, they run the custom-domain step in ChatGPT Sites, which shows them the DNS records to add. They add exactly the records ChatGPT Sites shows them in the DNS screen of their Just Domain dashboard at https://justdomain.ai/dashboard, replacing any A, AAAA or CNAME record already at the same name, then go back to ChatGPT Sites and check the domain status there. Do not say how long ChatGPT Sites takes to verify the domain, and do not describe Just Domain as a partner of, or recommended by, OpenAI. Read the `domain://faq` resource before answering a question about anything beyond search, the transfer check and the trademark check.",
      "tools": [
        {
          "name": "check_domain_transfer",
          "title": "Check whether a domain can transfer to Just Domain",
          "description": "Read-only transfer precheck for ONE domain the user already owns at another registrar: could it move to Just Domain, what is stopping it, what would it cost, and does its DNS survive the move. Nothing is ordered, charged, unlocked, or changed. The answer is built from two public sources only, the registry's own RDAP record and our registrar's price list, so it is safe to call without authentication and it reads nothing about the user's account. Read `blockers` before you say anything: an EMPTY list is the only thing that means the domain is ready to move. Every entry carries a plain `detail` sentence you can show as-is, and a `code` you do not recognise must still be reported through its `detail` rather than dropped. `source.rdap: false` means the registry did not answer, so nothing about the domain was established: say that, and never call it ready. `price` is the TOTAL for one full transfer term, not a per-year rate. A .ai transfer adds and charges TWO years because its registry works in two-year units. Do not divide or multiply the amount by a number of years, and do not label it per year; quote `term_note` beside it. `expected_new_expiry` is a projection (the registry's current expiry plus the term), not a date any registry has confirmed, so present it as expected. Moving a domain IN is self-service: the owner checks it and pays at https://justdomain.ai/transfer, pasting the authorization code there, and a transfer that does not complete is refunded in full. This tool tells the user whether the domain is eligible to move and what one full term would cost; hand over `transfer_url`, which opens that page for this domain in the owner's browser. Nothing is paid or ordered inside the chat. Moving a domain OUT of Just Domain IS self-service, and that means a human owner signed in on justdomain.ai in a browser, switching the transfer lock off and issuing the code from their own account. It does not mean you can do it. This tool does not return, accept, or hint at an authorization (EPP) code, and there is no agent path to unlocking a domain or to having a code issued, here or through any other Just Domain surface. An auth code is a bearer credential for the domain and a chat transcript is not a place to put one. Do not ask the user for a code, do not offer to hold or relay one, and never claim you can unlock or move the domain yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "One fully-qualified domain the user already owns somewhere else, including its TLD (e.g. 'acme.com'). Not a bare label and not a list: this reads a third-party registry per call.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "auth_code_policy": {
                "description": "Constant. The rule about authorization (EPP) codes, restated in the payload so it travels with the answer. Follow it.",
                "type": "string"
              },
              "blockers": {
                "description": "What stands between this domain and a transfer, most blocking first. An EMPTY list is the only thing that means ready.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Stable code: 'locked', 'within_60_days', 'redemption', 'expired', 'tld_unsupported', 'premium', 'not_registered', 'pending_transfer', 'pending_delete', 'dns_plan_unavailable', or 'unknown'. If you do not recognise a code, render `detail` verbatim - never drop a blocker you have no wording for.",
                      "type": "string"
                    },
                    "detail": {
                      "description": "One plain sentence, safe to show the user as-is.",
                      "type": "string"
                    },
                    "eligible_at": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "ISO-8601 instant this blocker clears, set only where that is a fact the registry gave us (the end of the 60-day hold). Never a guess at when somebody will unlock a domain."
                    }
                  },
                  "required": ["code", "detail"],
                  "type": "object"
                },
                "type": "array"
              },
              "checked_at": {
                "description": "ISO-8601 instant these facts were read.",
                "type": "string"
              },
              "dns_continuity": {
                "description": "Does the domain's DNS keep working after the move?\n\nA transfer moves sponsorship, not DNS, so the current delegation decides\nwhether the site and the mail survive it.",
                "properties": {
                  "case": {
                    "description": "'independent' - the nameservers belong to a DNS provider, so a transfer does not touch them. 'losing_registrar' - they are the current registrar's own nameservers, which is the case that breaks a site or mail after the move. 'unknown' - we do not recognise them, said plainly rather than guessed.",
                    "type": "string"
                  },
                  "detail": {
                    "type": "string"
                  },
                  "provider": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  }
                },
                "required": ["case", "detail"],
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "nameservers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_step": {
                "description": "One sentence you can say to the user about what happens next, already matched to this domain's state.",
                "type": "string"
              },
              "price": {
                "anyOf": [
                  {
                    "properties": {
                      "amount": {
                        "description": "Decimal string, e.g. '128.00'. The TOTAL for `term_years` years, not a rate. Quote it as it is; do not divide it.",
                        "type": "string"
                      },
                      "currency": {
                        "default": "USD",
                        "type": "string"
                      },
                      "expected_new_expiry": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "ISO date. A PROJECTION - the registry's current expiry plus the term - not a date any registry has confirmed. Present it as expected, never as agreed or guaranteed."
                      },
                      "is_premium": {
                        "default": false,
                        "type": "boolean"
                      },
                      "term_note": {
                        "description": "The sentence that must travel with the amount. Quote it beside the price whenever the term is longer than a year.",
                        "type": "string"
                      },
                      "term_years": {
                        "description": "Years this transfer adds and charges. 1 on most endings; 2 on .ai, whose registry sells and transfers in two-year units.",
                        "type": "integer"
                      }
                    },
                    "required": ["amount", "term_note", "term_years"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Null when the registrar's price list could not be read. Never estimate a domain transfer price yourself."
              },
              "ready": {
                "description": "TRUE only when `blockers` is empty. It is a convenience over that list and can never disagree with it: anything we could not establish becomes a blocker, so a registry timeout reads as not ready rather than as a green light.",
                "type": "boolean"
              },
              "registrar": {
                "description": "Who sponsors the domain today, as the REGISTRY reports it.",
                "properties": {
                  "iana_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  }
                },
                "type": "object"
              },
              "source": {
                "description": "Which public sources actually answered on this request.",
                "properties": {
                  "rdap": {
                    "description": "Did the registry's public record answer? FALSE means nothing about this domain was established - report that, and never report the domain as ready.",
                    "type": "boolean"
                  },
                  "registrar_pricing": {
                    "description": "Did our registrar's price list answer? FALSE means the price is missing because we could not read it, not because the transfer is free.",
                    "type": "boolean"
                  }
                },
                "required": ["rdap", "registrar_pricing"],
                "type": "object"
              },
              "supported": {
                "description": "Whether Just Domain can accept this ENDING at all. Says nothing about this particular domain - read `blockers` for that.",
                "type": "boolean"
              },
              "tld": {
                "type": "string"
              },
              "transfer_url": {
                "description": "The page on justdomain.ai a PERSON opens in a browser to take this further. The handoff out of the chat.",
                "type": "string"
              }
            },
            "required": ["auth_code_policy", "checked_at", "dns_continuity", "domain", "next_step", "ready", "registrar", "source", "supported", "tld", "transfer_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
