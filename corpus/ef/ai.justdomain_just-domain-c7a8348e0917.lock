                      ],
                      "default": null,
                      "description": "Registration price: the total for ONE full registration term of this ending, not a per-year rate. One year on most endings; two years on .ai, whose registry mandates a two-year term."
                    },
                    "renewal_price": {
                      "anyOf": [
