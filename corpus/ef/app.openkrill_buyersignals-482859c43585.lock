        {
          "name": "find_buyer_signals",
          "title": "Find companies with buyer signals",
          "description": "Use this when the user wants companies that recently raised money or have long-open roles, such as \"which software companies in Texas filed a Form D this month?\" or \"find companies with a bookkeeper role open 60+ days\". Pass the industry, and optionally the region, the role the user's service replaces, lookback_days (1 to 60, default 14) and limit (1 to 15, default 10). Example: {\"industry\": \"software_it\", \"region\": \"California\"}. Returns companies ranked by score, each with a one-line why and dated signals linking to the SEC filing or job posting. Covers only companies that file a US SEC Form D, based in a US state or in the UK, Canada, Israel, Ireland, Singapore, Australia or Hong Kong. Funds are left out. Roles are checked only when a role is given, on the public job boards of the companies found. A Form D shows funding, not intent to buy. Not for people, contact details or a lookup of one named company, and not for public posts (use find_buying_intent).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "industry": "software_it",
                "lookback_days": 14,
                "region": "Texas"
              }
            ],
            "properties": {
              "industry": {
                "description": "The buyer's industry. Example call: {\"industry\": \"software_it\", \"region\": \"California\"}. software_it covers software, SaaS, IT and AI; business_services covers agencies, consultancies and staffing",
                "enum": ["software_it", "telecom", "biotech_pharma", "healthcare", "business_services", "manufacturing", "retail_consumer", "construction", "real_estate", "energy", "environmental", "agriculture", "mining", "travel_hospitality"],
                "type": "string"
              },
              "industry_text": {
                "description": "Leave it out. The server fills it with your own industry words when it read a key out of them, and the answer's message then says which key they were read as",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "How many companies to return (default 10)",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "lookback_days": {
                "description": "How many days back to look for filings (default 14)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Where the company is based, such as \"California\" or \"TX\". Accepts any US state (name or two-letter code), \"US\", United Kingdom, Canada, Israel, Ireland, Singapore, Australia, Hong Kong, in any case. Anything else returns unknown_region with the list. Leave out to search everywhere",
                "examples": ["California", "TX", "US", "United Kingdom"],
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "role": {
                "description": "The job your service replaces or supports, such as \"bookkeeper\" or \"customer support\". When given, the public Greenhouse, Lever and Ashby boards of the companies found are checked for matching roles open 60 or more days",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "companies_checked": {
                "description": "Filings whose offering document was read, at most 15, the newest of each day first so they cover the window. Say this number in the answer",
                "type": "integer"
              },
              "filings_found": {
                "description": "Form D filings the SEC search matched in the window, before funds were left out",
                "type": "integer"
              },
              "industry": {
                "type": "string"
              },
              "leads": {
                "items": {
                  "properties": {
                    "company": {
                      "description": "Company name as filed with the SEC",
                      "type": "string"
                    },
                    "location": {
                      "description": "City and state or country from the filing",
                      "type": "string"
                    },
                    "rank": {
                      "description": "Position by score, 1 is the strongest",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "score": {
                      "description": "50 to 115, higher is a stronger signal: 50 for the filing, up to 20 for a fresh filing, up to 15 for a large raise, 5 for a company 2 years old or less, up to 25 for long-open roles",
                      "maximum": 115,
                      "minimum": 50,
                      "type": "integer"
                    },
                    "signals": {
                      "description": "The form_d filing first, then any open roles",
                      "items": {
                        "properties": {
                          "date": {
                            "description": "Day the filing was made or the role was first published (YYYY-MM-DD)",
                            "type": "string"
                          },
                          "detail": {
                            "description": "One line on the signal: the raise and amount sold for a form_d, or the job title, days open and location for an open_role",
                            "type": "string"
                          },
                          "type": {
                            "description": "form_d: an SEC Form D filing. open_role: a matching job posting open 60 or more days",
                            "enum": ["form_d", "open_role"],
                            "type": "string"
                          },
                          "url": {
                            "description": "Link to the SEC filing or the job posting. Give it with the company",
                            "type": "string"
                          }
                        },
                        "required": ["date", "detail", "type", "url"],
                        "type": "object"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "why": {
                      "description": "One line on why the company is listed: the filing date, the offering size and any open roles",
                      "type": "string"
                    }
                  },
                  "required": ["company", "location", "rank", "score", "signals", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "Present when status is not ok, when fewer companies than limit came back (and why), or when a role search found no job board: what happened and the next step, such as a longer lookback_days, a wider region or another tool",
                "type": "string"
              },
              "notice": {
                "description": "What a Form D does and does not show. Pass it on",
                "type": "string"
              },
              "off_industry": {
                "description": "Filers left out because the name says a holding or investment vehicle, or, for software_it, another trade such as logistics or medical",
                "type": "integer"
              },
              "open_roles": {
                "description": "What the job-board check covered. role is null when no role was given and no board was read",
                "properties": {
                  "boards_found": {
                    "description": "Public boards found for those companies",
                    "type": "integer"
                  },
                  "companies_checked": {
                    "description": "Companies whose boards were read, at most 6",
                    "type": "integer"
                  },
                  "min_days": {
                    "description": "Days a role must have been open to count",
                    "type": "integer"
                  },
                  "role": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["boards_found", "companies_checked", "min_days", "role"],
                "type": "object"
              },
              "region": {
                "description": "The region searched, by its full name, or null for everywhere",
                "type": ["string", "null"]
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "sources": {
                "description": "Sources read for this answer",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "ok: leads found. no_data: no operating company matched; message says what to widen. unavailable: SEC EDGAR could not be read; retry in a few minutes",
                "enum": ["ok", "no_data", "unavailable"],
                "type": "string"
              },
              "window": {
                "description": "Filing dates searched (YYYY-MM-DD)",
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              }
            },
            "required": ["as_of", "companies_checked", "filings_found", "industry", "leads", "notice", "open_roles", "region", "source", "sources", "status", "window"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Funded companies ranked",
            "openai/toolInvocation/invoking": "Reading new SEC Form D filings..."
          },
          "digest": "sha256:df0563200d48d1089f9cd3220a259a91b4c72d1aa9b138cd4f6146a350ad6c9f"
        },
        {
          "name": "find_buying_intent",
          "title": "Find people asking for a service",
          "description": "Use this when the user sells a service and wants public posts that ask for it, such as \"who is asking for an SEO audit?\" or \"which companies on Hacker News are hiring for MCP work?\". Pass service, for example {\"service\": \"SEO audit\"}, and optionally keywords, sources, lookback_days (7 to 365, default 30) and limit (1 to 15, default 10). Returns Hacker News posts, company posts from the newest \"Who is hiring?\" thread, GitHub issues and Stack Exchange posts, each with link, date, short quote, 0 to 100 intent score, label, reason, reply_angle and lead_source, by plain rules, no AI model. Use this, not weekly_brief, for a lookback other than 7 days or a set limit. Not for funded companies (use find_buyer_signals) or who wrote a post. A lead to read, not a sure sale. No usernames or contact details; Reddit is not searched. Free, no key: 4 lookups a day per network, shared with weekly_brief, reset at 00:00 UTC; a repeat within 6 hours comes from the cache and counts nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "lookback_days": 30,
                "service": "SEO audit"
              }
            ],
            "properties": {
              "former_customers": {
                "description": "Up to 3 companies that were your customers, such as [\"Salesforce\"]: company names, never people. job_changes finds US public companies whose officer-change filings name them, a hint that someone you served moved there",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "keywords": {
                "description": "Optional extra words a post must also contain, such as \"shopify\" or \"small business\" (up to 5). Every keyword must appear in a post, so a long list returns little. Leave it out for a first look and add one word only to narrow",
                "items": {
                  "maxLength": 30,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "limit": {
                "description": "How many posts to return (default 10)",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "lookback_days": {
                "description": "How many days of posts to read (default 30). This is 7 to 365, not the 1 to 60 of find_buyer_signals or the 30 to 365 of stack_pains",
                "maximum": 365,
                "minimum": 7,
                "type": "integer"
              },
              "service": {
                "description": "The service you sell, not a company or person. Example call: {\"service\": \"SEO audit\"}. \"alternative\" alone, with no keywords, finds asks to replace any tool. Also try the person form (bookkeeper)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "sources": {
                "description": "Which public sources to read: hackernews (comments and Ask HN), hn_hiring (company posts in the newest monthly Hacker News \"Who is hiring?\" thread), github (open and closed issues) and stackexchange; also job_changes (SEC 8-K officer changes that name a former customer, needs former_customers) and partners (WordPress.org plugin listings in the service's space, as partner leads). Default is the first four, plus job_changes when former_customers is given. Leave one out to skip it, for example stackexchange when it is rate limited",
                "items": {
                  "enum": ["hackernews", "hn_hiring", "github", "stackexchange", "job_changes", "partners"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "attribution": {
                "description": "CC BY-SA attribution for Stack Exchange text, or a line saying the answer holds none",
                "type": "string"
              },
              "company_leads": {
                "description": "Filings and listings found by job_changes and partners; they are companies, not posts, so posts_read leaves them out",
                "type": "integer"
              },
              "complaint_count": {
                "description": "Posts labelled casual_complaint",
                "type": "integer"
              },
              "dropped": {
                "description": "Posts left out: seller posts and posts that ask for nothing",
                "properties": {
                  "not_asks": {
                    "type": "integer"
                  },
                  "sellers": {
                    "type": "integer"
                  }
                },
                "required": ["not_asks", "sellers"],
                "type": "object"
              },
              "how_scored": {
                "description": "The scoring rules, so the user can see why a post scored as it did",
                "type": "string"
              },
              "intent_count": {
                "description": "Posts labelled intent",
                "type": "integer"
              },
              "message": {
                "description": "The next step when status is not ok, a source was skipped or there are fewer than 3 results: the sources searched, then a longer lookback_days, the person form of the service, a source that fits and was not read, or leaving stackexchange out of sources",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "description": "What a score does and does not mean. Pass it on",
                "type": "string"
              },
              "posts_about_service": {
                "description": "Posts that name the service",
                "type": "integer"
              },
              "posts_read": {
                "description": "Posts read from all sources",
                "type": "integer"
              },
              "reddit": {
                "properties": {
                  "status": {
                    "enum": ["skipped"],
                    "type": "string"
                  },
                  "terms_url": {
                    "type": "string"
                  },
                  "why": {
                    "type": "string"
                  }
                },
                "required": ["status", "terms_url", "why"],
                "type": "object"
              },
              "results": {
                "items": {
                  "properties": {
                    "company": {
                      "description": "The company: for hn_hiring the one the post names in its first line, for job_changes the filer, for partners the plugin",
                      "type": "string"
                    },
                    "date": {
                      "description": "Day the post or filing was made, or the listing last updated (YYYY-MM-DD)",
                      "type": "string"
                    },
                    "intent_score": {
                      "description": "0 to 100 from the rules in how_scored. 40 or more is intent; a casual complaint scores 15",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "label": {
                      "description": "intent or casual_complaint for a post; job_change for an officer change naming a former customer; partner_fit for a partner listing",
                      "enum": ["intent", "casual_complaint", "job_change", "partner_fit"],
                      "type": "string"
                    },
                    "lead_source": {
                      "description": "Which buying-signal source this lead is, to store with the lead: hiring-for-supported-roles (a company job post), tool-recommendation-asks (asks for a pick or an alternative), solution-complaints (only complains), community-questions (any other ask), former-customers-moved (job_changes) or partnerships (partners)",
                      "enum": ["tool-recommendation-asks", "solution-complaints", "hiring-for-supported-roles", "community-questions", "former-customers-moved", "partnerships"],
                      "type": "string"
                    },
                    "quote": {
                      "description": "A quote of the ask under 15 words; for hn_hiring the first whole sentence that names the service, else the clauses that name it with … where cut, else the post's first line; for job_changes the filer and the former customer it names, for partners the listing's own summary",
