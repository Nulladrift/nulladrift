        {
          "name": "weekly_brief",
          "title": "Weekly brief of buying asks",
          "description": "Use this when the user asks for a weekly brief or for this week only, such as \"weekly brief for SEO audit\" or \"did anyone ask for bookkeeping this week?\". Pass service, for example {\"service\": \"bookkeeping\"}, and optionally keywords and sources. Returns one summary line, counts by source and by day, and the top 10 posts with link, date, short quote, score, label, reason and reply_angle. The window is fixed to the last 7 days, with the same rules and sources as find_buying_intent. Not for a longer lookback or a set limit: use find_buying_intent for those. A quiet week returns no_data. Reddit is not searched. Free, no key: 4 lookups a day per network, shared with find_buying_intent, reset at 00:00 UTC; a repeat within 6 hours comes from the cache and counts nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "service": "bookkeeping"
              }
            ],
            "properties": {
              "keywords": {
                "description": "Optional extra words a post must also contain, such as \"shopify\" or \"small business\" (up to 5). Every keyword must appear in a post, so a long list returns little. Leave it out for a first look and add one word only to narrow",
                "items": {
                  "maxLength": 30,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "service": {
                "description": "The service you sell, not a company or person. Example call: {\"service\": \"SEO audit\"}. \"alternative\" alone, with no keywords, finds asks to replace any tool. Also try the person form (bookkeeper)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "sources": {
                "description": "Which public sources to read: hackernews (comments and Ask HN), hn_hiring (company posts in the newest monthly Hacker News \"Who is hiring?\" thread), github (open and closed issues) and stackexchange. Default is all four. Leave one out to skip it, for example stackexchange when it is rate limited",
                "items": {
                  "enum": ["hackernews", "hn_hiring", "github", "stackexchange"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "attribution": {
                "description": "CC BY-SA attribution for Stack Exchange text, or a line saying the answer holds none",
                "type": "string"
              },
              "by_day": {
                "description": "Intent posts per day, oldest first",
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "intent": {
                      "type": "integer"
                    }
                  },
                  "required": ["date", "intent"],
                  "type": "object"
                },
                "type": "array"
              },
              "by_source": {
                "items": {
                  "properties": {
                    "complaint": {
                      "description": "Casual complaints",
                      "type": "integer"
                    },
                    "intent": {
                      "description": "Intent posts",
                      "type": "integer"
                    },
                    "source": {
                      "enum": ["hackernews", "hn_hiring", "github", "stackexchange"],
                      "type": "string"
                    }
                  },
                  "required": ["complaint", "intent", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "company_leads": {
                "description": "Filings and listings found by job_changes and partners; they are companies, not posts, so posts_read leaves them out",
                "type": "integer"
              },
              "complaint_count": {
                "description": "Posts labelled casual_complaint",
                "type": "integer"
              },
              "how_scored": {
                "description": "The scoring rules, so the user can see why a post scored as it did",
                "type": "string"
              },
              "intent_count": {
                "description": "Posts labelled intent",
                "type": "integer"
              },
              "message": {
                "description": "The next step when status is not ok, a source was skipped or there are fewer than 3 results: the sources searched, then a longer lookback_days, the person form of the service, a source that fits and was not read, or leaving stackexchange out of sources",
                "type": "string"
              },
              "note": {
                "type": "string"
