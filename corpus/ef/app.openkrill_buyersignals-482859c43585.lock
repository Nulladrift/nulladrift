      "instructions": "Buyer Signals: Funded firms and service asks. Call find_buyer_signals with the buyer's industry, plus region and role when given. role is the job the user's service replaces or supports, such as bookkeeper. Each lead has a score, a one-line why, and dated signals with a source url: form_d is an SEC Form D filing, open_role is a job posting open 60 or more days. Give the date and source link with each company. A Form D shows the company raised money, not that it wants to buy: say so and never claim intent. Say how many companies were checked (companies_checked). When status is not ok, or an answer is short, the message field gives the next step: no_data means nothing matched, so suggest a longer lookback_days, a wider region or fewer keywords; unavailable means a source could not be read: say so and invent nothing. A daily_limit or network_daily_limit error means the daily allowance is used up until 00:00 UTC: tell the user, do not retry before then, and offer what the error says still works. Call stack_pains for an aggregate of the tools, complaints, alternatives and switching triggers in a category, such as monitoring. Say it counts public posts, not a survey. Call find_buying_intent when the user sells a service and wants posts that ask for it, with a chosen lookback or limit. Call weekly_brief only when the user asks for a brief or for this week. Give each post's link, date, quote, score, label and reply_angle. A buyer-like post is a lead to read, not a sure sale. Scores come from plain rules (how_scored), not an AI model. Stack Exchange text is CC BY-SA: give the link as the attribution. Quote no more than the quote field. Reddit is not searched: say so, and invent no Reddit results. When the user names companies that were their customers, pass them as former_customers: a job_change lead is a filing to open, not a named person. For partner ideas pass sources [\"partners\"]. Call draft_follow_up with one result, passed whole, when the user wants a reply to it. Show the draft and the reason, say it was not sent, and never add a name or address to it. These tools return companies and aggregates only. Decline requests for emails, phone numbers, usernames, profiles, naming or de-anonymizing posters, LinkedIn matching, or scraping Y Combinator. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "draft_follow_up",
          "title": "Draft a follow-up with a reason to reply",
          "description": "Use this when the user wants a reply to one buying signal, such as \"draft a reply to the first post\" after find_buying_intent. Pass service and signal, one find_buying_intent or weekly_brief result whole, as it came, for example {\"service\": \"SEO audit\", \"signal\": {\"source\": \"hackernews\", \"url\": \"https://news.ycombinator.com/item?id=1\", \"date\": \"2026-10-20\", \"label\": \"intent\", \"signals\": [\"looking for\"], \"quote\": \"Looking for an SEO audit for our shop\"}}. Returns a 3-line draft built from the result's company, role, stack or quote, the reason to reply and checks before sending; a result without its company or quote is refused. Plain rules, no AI model. Draft only: it sends nothing, opens no link, has no recipient and fills in no name. Not for finding leads (use find_buying_intent).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "service": "SEO audit",
                "signal": {
                  "company": "Ubersuggest SEO Tools",
                  "date": "2026-10-21",
                  "label": "partner_fit",
                  "source": "partners",
                  "url": "https://wordpress.org/plugins/ubersuggest-seo-tools/"
                }
              }
            ],
            "properties": {
              "service": {
                "description": "The service you sell, as in find_buying_intent, such as \"SEO audit\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "signal": {
                "description": "One result from find_buying_intent or weekly_brief, passed as it came. Its source, url, date, label, signals, company, role, stack and quote are read. hn_hiring, job_changes and partners results need their company, and post results their quote: the draft names them, and a signal without one is refused",
                "properties": {
                  "company": {
                    "description": "The result's company: needed for hn_hiring, job_changes and partners",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "date": {
                    "description": "YYYY-MM-DD",
                    "type": "string"
                  },
                  "label": {
                    "enum": ["intent", "casual_complaint", "job_change", "partner_fit"],
                    "type": "string"
                  },
                  "quote": {
                    "description": "The result's quote: needed for hackernews, github and stackexchange",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "role": {
                    "description": "The result's role, for hn_hiring",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "signals": {
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "source": {
                    "enum": ["hackernews", "hn_hiring", "github", "stackexchange", "job_changes", "partners"],
                    "type": "string"
                  },
                  "stack": {
                    "description": "The result's stack, for hn_hiring",
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "url": {
                    "description": "The https link of the result",
                    "maxLength": 500,
                    "type": "string"
                  }
                },
                "required": ["date", "label", "source", "url"],
                "type": "object"
              }
            },
            "required": ["service", "signal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Date of this answer (UTC, YYYY-MM-DD)",
                "type": "string"
              },
              "based_on": {
                "properties": {
                  "company": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "quote": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["date", "label", "source", "url"],
                "type": "object"
              },
              "checks": {
                "description": "What to do before sending",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "draft": {
                "description": "The three lines joined by line breaks, to edit and send yourself",
                "type": "string"
              },
              "lead_source": {
                "description": "The buying-signal source to store with a reply sent from this draft",
                "enum": ["reason-to-reply-followups"],
                "type": "string"
              },
              "lines": {
                "description": "The draft in three lines: the opener, the useful line, the disclosure or easy close",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "notice": {
                "description": "What the draft is and is not. Pass it on",
                "type": "string"
              },
              "reason": {
                "description": "One line on why this lead has a reason to reply now",
                "type": "string"
              },
