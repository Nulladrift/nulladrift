                "enum": [false],
                "type": "boolean"
              },
              "service": {
                "type": "string"
              },
              "status": {
                "enum": ["ok"],
                "type": "string"
              }
            },
            "required": ["as_of", "based_on", "checks", "draft", "lead_source", "lines", "notice", "reason", "sent", "service", "status"],
