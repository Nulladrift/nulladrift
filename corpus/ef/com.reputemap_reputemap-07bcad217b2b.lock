{
  "lockfileVersion": 2,
  "subjects": {
    "com.reputemap/reputemap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.reputemap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "reputemap",
        "title": "ReputeMap",
        "version": "1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ReputeMap manages Google reviews for local businesses. Tools cover the workspace you connected (by signing in, or with an API key): list locations, read reviews (filterable), get review stats, draft AI replies, publish an approved reply to Google, send a review-request email, and check API credit usage. publish_reply is public and customer-visible - only call it with text the user has explicitly approved. Billable tool calls share the org's monthly API credits (default 1000/month) with the REST API. Docs: https://reputemap.com/docs/mcp",
      "tools": [
        {
          "name": "draft_reply",
          "title": "Draft reply variants",
          "description": "Generate 2-3 reply drafts for one review using ReputeMap's tuned generator (the same one the app uses, with the business's saved voice and sign-off), and save the draft so it appears in the app's editor. NEVER publishes anything - drafts only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "instructions": {
                "description": "optional one-off guidance for this draft, e.g. 'mention the new units' or 'keep it under 40 words'",
                "maxLength": 300,
                "type": "string"
              },
              "review_id": {
                "description": "UUID from list_reviews",
                "type": "string"
              }
            },
            "required": ["review_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Draft reply variants"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c3b0c0ffb4b212487541cbc7e70267b9af586d4f904893bbcd558df55f3fa6e7"
        },
        {
          "name": "get_review_stats",
          "title": "Get review stats",
          "description": "Review stats per location and org totals: review counts, average rating, 1-5 star breakdown, unanswered count, and activity in the trailing window (default 30 days).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "location_id": {
                "description": "UUID from list_locations; omit for all locations",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get review stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c102a6b136622e1146fe97f81092f5807b9bebd094fadcb39dc9b9df243b6e51"
        },
        {
          "name": "get_usage",
          "title": "Get API usage",
          "description": "Current month's API credit usage for this org (shared between the REST API and MCP tools).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get API usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d81efae058160b9cd4d318e8d2692acde65d980dc1813837e1845d8f3a9116fb"
        },
        {
          "name": "list_locations",
          "title": "List locations",
          "description": "List every business location this ReputeMap org manages, with ids to use in the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List locations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b62c51ffd678eb2965fc42cf02aa3a7adbaed1b1fcebf31d73c820ea974a19de"
        },
        {
          "name": "list_reviews",
          "title": "List reviews",
          "description": "List Google reviews for the org (newest first) with the published reply text inlined. Filter by location, star-rating range, replied/unreplied, or a trailing day window. Google moderates owner replies: reply_state is approved, pending (Google is checking it) or rejected (not shown on Google - has_reply is false and reply_policy_violation says why; write a new reply).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location_id": {
                "description": "UUID from list_locations; omit for all locations",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "rating_max": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "rating_min": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "since_days": {
                "description": "only reviews from the last N days",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "unanswered_only": {
                "description": "true = only reviews without an owner reply on Google (a reply Google rejected counts as none)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb65cb001540d1221d05c2f357ebd7ae9c1abd4670157daf9bb53dbebf61099d"
        },
        {
          "name": "publish_reply",
          "title": "Publish reply to Google",
          "description": "PUBLISH a reply to this review's public Google profile. This is a public, customer-visible action - call it ONLY when the user has explicitly approved this exact text (Google's policy: a person approves every reply; one call per approved reply, never in bulk). If Google refuses the request, the text is preserved in ReputeMap with a manual fallback (status 'manual_required') - words are never lost. Google also moderates replies: google_state 'pending' = it is checking the reply before showing it; status 'rejected_by_google' = it will not show it (policy_violation and detail say why) - write a different reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "review_id": {
                "description": "UUID from list_reviews",
                "type": "string"
              },
              "text": {
                "description": "the exact reply text the user approved",
                "type": "string"
              }
            },
            "required": ["review_id", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish reply to Google"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e9c9bf869f3456085b0169b5679b83c8dc4f0a1a0d739d46933417ff8934e5b"
        },
        {
          "name": "send_review_request",
          "title": "Send review request email",
          "description": "Send ONE review-request email to a real customer, through ReputeMap's campaign engine (respects unsubscribes and the suppression list). This emails a real person - only use it when the user explicitly asks to request a review. Returns status 'sent', 'skipped' (opted out or suppressed), 'already_requested' (this location already asked this address - no second email is sent and no credit is spent) or 'failed'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "customer email address",
                "type": "string"
              },
              "location_id": {
                "description": "UUID from list_locations",
                "type": "string"
              },
              "name": {
                "description": "customer name (optional)",
                "type": "string"
              }
            },
            "required": ["email", "location_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send review request email"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0fc27e6043b617bc60ea28a63fe4c9691ce2fa031e789666941af1af0886017"
        }
      ],
      "digest": "sha256:012d52e89316967e29e64b7adbbebd0e81e94b0423dbd2d3ab305f3f29168a0b"
    }
  }
}
