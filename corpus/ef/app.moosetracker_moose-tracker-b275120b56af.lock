        {
          "name": "song",
          "title": "Plan, check and analyze a song",
          "description": "Plans and analyzes a song (render checks too); returns a share link that plays it in the browser (90 days, no render). Stages: plan, write, light analysis loop, one deep analysis, fix; then the share link to listen, or one render to embed. analyze:true: light; deep:true: measured. Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "alts": {
                "description": "Other MTL versions to rank by score",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "analyze": {
                "description": "Light analysis: no audio, instant, free. Suited to every edit",
                "type": "boolean"
              },
              "check": {
                "description": "Same as analyze",
                "type": "boolean"
              },
              "compare": {
                "description": "With analyze: A/B against an earlier songId, asset id or share link",
                "type": "string"
              },
              "compose": {
                "additionalProperties": true,
                "description": "Instead of mtl: {bpm, form, chords, parts:[{id,gen}]}. describe(topic=\"generators\")",
                "type": "object"
              },
              "deep": {
                "description": "With analyze: deep analysis, a measured analysis-only render. Suited to once or twice when the song is nearly done",
                "type": "boolean"
              },
              "energy": {
                "description": "Planned 1-5 per order entry, for check:true",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "genre": {
