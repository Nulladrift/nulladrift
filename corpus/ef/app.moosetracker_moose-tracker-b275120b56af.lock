        {
          "name": "sfx",
          "title": "Make sound effects",
          "description": "Produces sound-effect files (up to 16 per call) to embed in an app, game, UI or video, or auditions an instrument. Recipes are starting points: tailor pitch, bright, dur or seed, pairs alike. Reports design_mode. Files last 2 h; https://moosetracker.app/acceptable-use.html Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "detail": {
                "description": "Add per-file diagnostics",
                "type": "boolean"
              },
              "family": {
                "additionalProperties": false,
                "description": "Shared identity for a set",
                "properties": {
                  "character": {
                    "items": {
                      "enum": ["warm", "soft", "woody", "crisp", "glassy", "digital"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "root": {
                    "description": "Note name, e.g. D",
                    "type": "string"
                  },
                  "scale": {
                    "enum": ["pentatonic", "major", "minor", "fifths"],
                    "type": "string"
                  },
                  "seed": {
                    "maximum": 99999,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "variation": {
                    "description": "0 tight .. 1 loose (0.25)",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "format": {
                "description": "Default wav; ogg = Vorbis 44.1 kHz; opus = Ogg Opus 48 kHz",
                "enum": ["wav", "ogg", "opus"],
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dur": {
                      "description": "Length in seconds, fitted within 8% or 30 ms",
                      "maximum": 10,
                      "minimum": 0.05,
                      "type": "number"
                    },
                    "instrument": {
                      "description": "Audition one voice: text after iN, e.g. - wave=saw cutoff=45 or sample \"upright-bass\" (describe topic=instrument)",
                      "type": "string"
                    },
                    "mtl": {
                      "description": "Custom effect as a tiny MTL song (<= 2048 bytes)",
                      "type": "string"
                    },
                    "name": {
                      "description": "File name, e.g. coin",
                      "type": "string"
                    },
                    "play": {
                      "description": "Notes for instrument: C3 E3, chord C3+E3, C3:4 = 4 beats, . = rest",
                      "type": "string"
                    },
                    "recipe": {
                      "description": "Starting point (describe topic=recipes)",
                      "enum": ["click", "tick", "blip", "select", "confirm", "cancel", "error", "buzz", "alert", "chime", "notify", "coin", "pickup", "powerup", "jump", "land", "hit", "hurt", "laser", "shoot", "explosion", "whoosh", "riser", "drop", "win", "lose", "door", "step"],
                      "type": "string"
                    },
                    "role": {
                      "description": "UI role (describe topic=sfx)",
                      "enum": ["press", "release", "toggle_on", "toggle_off", "continuous_tick", "success", "warning", "notify", "complete"],
                      "type": "string"
                    },
                    "seed": {
                      "description": "0 = plain recipe; others shift pitch, length and tone repeatably (reproducible, not unique)",
                      "maximum": 9999,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "spec": {
                      "additionalProperties": false,
                      "properties": {
                        "bright": {
                          "description": "-50 dull to 50 bright",
                          "maximum": 50,
                          "minimum": -50,
                          "type": "number"
                        },
                        "pitch": {
                          "description": "Semitones; 12 = octave. Lower is heavier, higher lighter",
