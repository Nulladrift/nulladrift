                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Research composition advice"
          },
          "behavior": {
