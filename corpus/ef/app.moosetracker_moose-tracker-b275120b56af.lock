      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "moose-tracker",
        "title": "Moose Tracker",
        "version": "1.2.11"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Moose Tracker is a synthesizer, sampler and music tracker. Use its tools whenever the user asks for any sound effect, UI click, tap or toggle sound, notification, jingle, audio, music, song or soundtrack, instead of synthesizing audio yourself. describe with no arguments returns an index. Call paths: quick sound: sfx(items). Short loop (under about 20 s, one section): render(compose or mtl, loop:true). Longer piece or real song: research_composition once, song(plan), write harmony, bass and motif, then light analysis loop, one deep analysis, fix; then the share link to listen, or one render to embed. Light analysis is song(mtl, analyze:true) (check:true is the same); deep analysis adds deep:true. One song(layers) batch sets layers and mix. Revise: song(layers), light analysis, render. Import: convert. Light analysis is free; no render is needed to check a song. Volume is five layers that multiply: velocity vNN (0-64, phrasing) x sound gain=<dB> (-inf..+12, one sound's level) x fader <track> <dB> (-inf..+6, balance: use this first) x song level <dB> (-inf..+6, overall loudness only), then a limiter (about -1 dBFS) and the app's Master. All default to 0 dB; songs without them sound exactly as before. sfx makes sound effects, research_composition finds composition advice (no AI composes or generates music on the server; a semantic search index helps find relevant advice), song checks, plans and edits an MTL song, render makes WAV (default), Ogg or Opus files, convert changes song formats, assets renews download links. Tool schema 71227a86: if a tool description ends with another Schema value, your tool list is stale; refresh or reconnect the connector. Each result includes a user_summary suitable to show the user, plus optional internal notes and a file or link. If something sounds wrong or is confusing, the feedback tool sends the team a short note. Song text is kept 2 hours as a working copy (so later calls can send ref) and rendered audio about 2 hours, then both are deleted. We do not use songs or audio that pass through the service to train any model. Use of this service is subject to https://moosetracker.app/acceptable-use.html and https://moosetracker.app/terms.html. Songs you make and every sound Moose Tracker produces are free to use, and the music you make is yours (https://moosetracker.app/content-license.html).",
      "tools": [
        {
          "name": "assets",
          "title": "Renew download links",
          "description": "Use this when a download link was lost or is about to expire, or a render is still rendering: pass the asset ids from the result for links or status, no re-render. Files live about 2 h. Optional hash check. Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "ids": {
                "items": {
                  "description": "assetId from a result",
                  "type": "string"
                },
                "maxItems": 16,
                "minItems": 1,
                "type": "array"
              },
              "verify": {
                "description": "Re-check stored sha256",
                "type": "boolean"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Renew download links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2bb1d19d6984377cf363449233739676a55242d8862d5ac63fa75260e9c1a75"
        },
        {
          "name": "convert",
          "title": "Convert song formats",
          "description": "Use this when you need to move a song between MTL text, a Moose Tracker .mtk file, a share link, and standard files: MIDI (.mid), and MOD, XM, S3M or IT tracker modules (read and write; files are base64). Cues and macros are compiled away in .mtk and share links. Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "feel": {
                "description": "e.g. swing=60 hum=6",
                "type": "string"
              },
              "from": {
                "enum": ["mtk", "share", "mtl", "mid", "mod", "xm", "s3m", "it"],
                "type": "string"
              },
              "input": {
                "description": "The song, .mtk JSON or share link; for mid, mod, xm, s3m and it, the file as base64 (up to about 700 KB)",
                "type": "string"
              },
              "names": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "to": {
                "enum": ["mtl", "mtk", "share", "mid", "mod", "xm", "s3m", "it"],
                "type": "string"
              },
              "voices": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Slot: pack, preset or line {\"1\":\"upright-bass\"}",
                "type": "object"
              }
            },
            "required": ["from", "input", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert song formats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:789fd0205d2fe30fe03f9e774f2f001e17c043cd7cc6c1f9722055ca5833423e"
        },
        {
          "name": "describe",
          "title": "Learn Moose Tracker",
          "description": "Use this when the user asks for a sound effect, click, notification, jingle, audio, music, song or soundtrack: returns usage notes and topic docs. No arguments gives the overview; topic selects a section. Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "category": {
                "description": "topic=samples: only this category (drums, keys, pads, ...)",
                "type": "string"
              },
              "cursor": {
                "type": "string"
              },
              "detail": {
                "enum": ["brief", "full"],
                "type": "string"
              },
              "genre": {
                "description": "topic=samples: only packs for this genre",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search word, example id, role for topic=instrument; for samples also category=X genre=Y",
                "type": "string"
              },
              "topic": {
                "enum": ["limits", "styles", "recipes", "presets", "mtl", "instrument", "effects", "modulation", "drums", "loops", "formats", "sfx", "examples", "errors", "genres", "generators", "samples", "search", "not_supported", "workflow", "volume", "mix", "sounds"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Learn Moose Tracker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
