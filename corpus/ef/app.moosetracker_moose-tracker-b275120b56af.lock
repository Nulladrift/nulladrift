        {
          "name": "feedback",
          "title": "Send feedback",
          "description": "Sends a note to the Moose Tracker team about a bug, a confusing tool, or a missing feature. Up to 20000 characters per call; longer reports can be split into parts. Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "message": {
                "description": "What happened or what is needed; no personal details. Up to 20000 characters; longer reports go in parts (ref, part, parts).",
                "maxLength": 20000,
                "type": "string"
              },
              "mtl": {
                "description": "Optional: the song or sound involved, only if relevant",
                "type": "string"
              },
              "part": {
                "description": "Which part this is (1 based)",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "parts": {
                "description": "How many parts in all",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "ref": {
                "description": "Optional label shared by every part of one long report; parts with the same ref count as one submission",
                "maxLength": 40,
                "type": "string"
              },
              "type": {
                "enum": ["bug", "request", "other"],
                "type": "string"
              }
            },
            "required": ["message", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:adfb99b9b504146c488294b74b249fa2205a4c8f2d791a457885eafc7180d66c"
        },
        {
          "name": "render",
          "title": "Render a song to audio",
          "description": "Produces WAV, Ogg or Opus files (≤180 s, loops, stems) to download and embed in a game, app, presentation or video. To listen, song's share link plays it, no render. Send mtl, ref or compose; it checks the song itself. Files last 2 h; https://moosetracker.app/acceptable-use.html Schema 71227a86.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Schema 71227a86",
            "properties": {
              "audition": {
                "additionalProperties": false,
                "description": "Hear one channel alone as a preview; try swaps its sound: {ch:3, try:\"i3 \\\"Warm Pad\\\"\"}",
                "properties": {
                  "ch": {
                    "maximum": 16,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "try": {
                    "type": "string"
                  }
                },
                "required": ["ch"],
                "type": "object"
              },
              "bits": {
                "default": 16,
                "description": "WAV bits",
                "enum": [16, 24],
                "type": "integer"
              },
              "compose": {
                "additionalProperties": true,
                "description": "Instead of mtl: {bpm, form, chords, parts:[{id,gen}]}. describe(topic=\"generators\")",
                "type": "object"
              },
              "cue": {
                "type": "string"
              },
              "cues": {
                "description": "One file per cue",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "detail": {
                "description": "Adds score, per-section loudness and MIX flags with fixes",
                "type": "boolean"
              },
              "format": {
                "description": "Default wav; ogg = Vorbis 44.1 kHz; opus = Ogg Opus 48 kHz",
                "enum": ["wav", "ogg", "opus"],
                "type": "string"
              },
              "genre": {
                "description": "For the score check",
                "enum": ["chiptune", "chip-battle", "game-overworld", "game-battle", "game-town", "game-dungeon", "game-menu", "game-victory", "game-racing", "game-horror", "jrpg", "classical", "baroque", "fugue", "minuet", "romantic", "march", "waltz", "nocturne", "lullaby", "hymn", "carol", "jazz", "bebop", "cool-jazz", "swing", "big-band", "dixieland", "ragtime", "bossa-nova", "smooth-jazz", "fusion", "jazz-ballad", "gypsy-jazz", "blues", "slow-blues", "jump-blues", "shuffle", "soul", "gospel", "rnb", "funk", "disco", "rock", "hard-rock", "blues-rock", "punk", "pop-punk", "metal", "prog-rock", "ska", "pop", "synth-pop", "power-pop", "dance-pop", "power-ballad", "kpop", "musical-theater", "country", "bluegrass", "folk", "celtic", "sea-shanty", "polka", "reggae", "salsa", "samba", "tango", "latin-pop", "house", "techno", "trance", "edm", "synthwave", "vaporwave", "dubstep", "drum-and-bass", "breakbeat", "trap", "hip-hop", "boom-bap", "lofi", "chillout", "ambient", "drone", "new-age", "industrial", "cinematic", "epic", "suspense", "horror", "fantasy", "western", "spy", "sci-fi", "world", "afrobeat", "klezmer", "bollywood"],
                "type": "string"
              },
              "len": {
                "description": "Exact seconds: a short song repeats its order (said in the result), a long one fades out; never silence",
                "maximum": 180,
                "minimum": 1,
                "type": "number"
              },
              "loop": {
                "description": "Seamless loop plus loop points",
                "type": "boolean"
              },
              "loudness": {
                "enum": ["raw", "game"],
                "type": "string"
              },
              "mtl": {
                "description": "Song in MTL text (describe topic=mtl). Kept 2 hours as a working copy: later calls can send ref (the songId) instead.",
                "type": "string"
              },
              "peak": {
                "description": "Peak dBFS",
                "maximum": 0,
                "minimum": -30,
                "type": "number"
              },
              "preview": {
                "description": "One section (range, default 1), ≤20 s Opus, light quota, MIX flags",
                "type": "boolean"
              },
              "range": {
                "description": "Order positions only, e.g. \"2-4\"",
                "type": "string"
              },
              "rate": {
                "default": 44100,
                "description": "Hz",
                "enum": [44100, 48000],
                "type": "integer"
              },
              "ref": {
                "description": "Instead of mtl: a songId from an earlier reply (kept 2 hours), a render asset id, or a share link",
                "type": "string"
              },
              "stems": {
                "description": "One file per role",
                "type": "boolean"
              },
              "style": {
                "description": "Voice palette; default chip",
                "enum": ["chip", "fm", "analog", "clean"],
                "type": "string"
              },
              "tail": {
                "description": "Ring-out seconds",
                "maximum": 4,
                "minimum": 0,
                "type": "number"
              },
              "zip": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Render a song to audio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:71e230ede61dca84b7ae138bdbff2a2c1287d48975db28ba03e904f58b911e1a"
        },
