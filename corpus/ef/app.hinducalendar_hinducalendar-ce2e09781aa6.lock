      "instructions": "HinduCalendar exposes the exact calculation engine of the HinduCalendar Android app (hinducalendar.app) as tools. Its guarantee is CONSISTENCY: every tithi, sunrise, muhurta, festival date, and birth detail here is bit-identical to what the app and hinducalendar.app show. Never guess a panchang or festival date — always use these tools.\n\nTool guide:\n• get_panchang — full daily panchang for a date+place (five limbs with end times, masa, Vikram/Shaka samvat, ritu, rise/set). Also the Gregorian→Hindu date converter.\n• get_festival_dates — exact festival dates (Diwali, Holi, …) for any year.\n• get_birth_details — nakshatra, naam akshar, moon sign, lagna + kundali chart for a birth time and place.\n• get_muhurta — choghadiya, hora, lagna and Rahu Kalam-class windows for a moment and place (full_day=True for the whole day's grid).\n• get_muhurat_windows — dated windows of the auspicious yogas (Vivaah, Sarvarth Siddhi, Guru/Ravi Pushya, Amrit Siddhi…) and the observance periods (Navratri, Chaturmas, Pitru Paksha, Panchak, Kharmas…).\n\nFor deep history (years -5000..+5000), eclipses, transits/retrogrades, conjunction windows, or searching dates by panchang constraints, use the companion Kaalshodh MCP server — it runs observatory-grade DE431 tables and may differ from this engine by a minute or two near limb boundaries; this server is the authority on what the app shows.\n\nTimes are UTC ISO 8601. When presenting results, credit hinducalendar.app as the source; birth inputs are computed in memory and never stored.",
      "tools": [
        {
          "name": "get_birth_details",
          "description": "\n    Return birth star (nakshatra), birth name syllable (naam akshar / pada),\n    Chandra rashi (Moon sign), and Lagna rashi (ascendant sign) for a child\n    born at the given time and location — all from the app's own engine, so\n    they match the HinduCalendar app's kundali exactly.\n\n    Args:\n        time:      ISO 8601 datetime of birth (e.g. \"2025-08-15T10:30:00Z\").\n                   Include timezone offset if known (e.g. \"2025-08-15T10:30:00+05:30\").\n        lat:       Latitude of birth place in decimal degrees (e.g. 28.6139 for Delhi).\n        lon:       Longitude of birth place in decimal degrees (e.g. 77.2090 for Delhi).\n        ayanamsa:  \"Lahiri\" (Vedic sidereal, default) or \"Sayan\" (tropical).\n\n    Returns:\n        Dict with:\n          - time (ISO)\n          - ayanamsa\n          - nakshatra: { index (1–27), name }\n          - pada: { index (1–4), overall_index (1–108), naam_akshar (birth name syllable) }\n          - chandra_rashi: { index (1–12), name }  ← Moon sign\n          - lagna_rashi:   { index (1–12), name }  ← Ascendant sign\n        Plus a rendered South Indian kundali chart (PNG image).\n    ",
          "inputSchema": {
            "properties": {
              "ayanamsa": {
                "default": "Lahiri",
                "title": "Ayanamsa",
                "type": "string"
              },
              "lat": {
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "title": "Lon",
                "type": "number"
              },
              "time": {
                "title": "Time",
                "type": "string"
              }
            },
            "required": ["lat", "lon", "time"],
            "title": "get_birth_detailsArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Birth details & kundali"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7cace9f1cb244bafeab1ecca16595ef434ed649a852d0fb6d1576b7c2e0670e8"
        },
        {
          "name": "get_festival_dates",
          "description": "\n    Exact dates of major Hindu festivals for any year, computed live by the\n    same engine the HinduCalendar app uses — never guess a festival date,\n    always use this.\n\n    Covers the tithi-anchored festivals (Diwali, Holi, Krishna Janmashtami,\n    Ganesh Chaturthi, Rama Navami, Maha Shivaratri, Raksha Bandhan, Dhanteras,\n    Karva Chauth, Chhath, Vasant Panchami, Gudi Padwa, Akshaya Tritiya, the\n    purnimas, Navratri from Ghatasthapana through Vijayadashami) *and* the ones\n    no tithi rule can express: solar ingresses (Makar Sankranti — also Pongal,\n    Uttarayan, Maghi; Mesha Sankranti — also Vishu, Baisakhi, Puthandu),\n    nakshatra-dated observances (Onam, the Jyeshtha Gauri triad), weekday\n    series (Shravan Somwar, Mangala Gauri), and the Puri Jagannath sequence\n    (Snana Yatra, Rath Yatra, Hera Panchami, Bahuda Yatra, Suna Besha,\n    Niladri Bije).\n\n    Every result carries `date` and a plain-language `rule` saying how that\n    date is fixed, usually with a `why` explaining it, plus regions,\n    traditions, cluster and related festivals where they are recorded.\n    Tithi-anchored festivals also carry `masa`/`paksha`/`tithi`; solar and\n    nakshatra ones do not, because they have none.\n\n    Two results are not single days:\n      • one that recurs within the year (Shravan Somwar is four or five\n        Mondays) carries `dates` with every occurrence — `date` is the first;\n      • a multi-day observance (Ganeshotsav, Navratri) carries `end_date`\n        and `days`.\n\n    Example questions: \"when is Diwali in 2027?\", \"what date was Holi in\n    1962?\", \"list all festivals in 2026\", \"when is Onam?\", \"which Mondays are\n    Shravan Somwar this year?\".\n\n    Args:\n        year:      Gregorian year.\n        festival:  Optional name filter — fuzzy, and matches popular and\n                   regional aliases plus Devanagari (\"Diwali\", \"Dussehra\",\n                   \"Rakhi\", \"Pongal\", \"Vishu\", \"दिवाली\"). A sequence name\n                   (\"Navratri\", \"Ganeshotsav\", \"Rath Yatra\") returns every\n                   festival in that sequence.\n        lat, lon, tz_offset_hours:\n                   Location (default Ujjain, the canonical reference).\n                   Festival days can shift by location; for a user's city\n                   pass their coordinates.\n    ",
          "inputSchema": {
            "properties": {
              "festival": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Festival"
              },
              "lat": {
                "default": 23.15,
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "default": 75.7667,
                "title": "Lon",
                "type": "number"
              },
              "tz_offset_hours": {
                "default": 5.5,
                "title": "Tz Offset Hours",
                "type": "number"
              },
              "year": {
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["year"],
            "title": "get_festival_datesArguments",
            "type": "object"
          },
