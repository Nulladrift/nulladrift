                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Muhurat"
              },
              "tz_offset_hours": {
                "default": 5.5,
                "title": "Tz Offset Hours",
                "type": "number"
              },
              "year": {
                "title": "Year",
                "type": "integer"
              }
            },
