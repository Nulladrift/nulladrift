      "instructions": "nyna is an AI wedding planner. This server exposes a public wedding-provider directory and gift catalogue, a couple's own wedding behind OAuth, and the listing of a provider (vendor) who connected their own account.\n\nWHAT NEEDS NO ACCOUNT. list_provider_categories, list_cities, search_providers, get_provider, list_gift_categories, search_gift_ideas and quote_cost answer without a token. search_providers takes ANY city or place name in the world as city: a featured city costs nothing to place, any other name is geocoded once and cached 30 days; only a name Google cannot place is refused (unknown_city; adding the country fixes most). category is a slug from list_provider_categories (anything else is refused); without one, q is searched across every category. Results stay within radius_km (default 25) and carry distance_km; sort is relevance, rating or reviews. The gift catalogue grows from couples' registries and is thin outside France (see catalogue_size).\n\nWHAT NEEDS A CONNECTED ACCOUNT. Every tool labelled [Sign-in required] or [Partner] needs a bearer token minted by nyna's OAuth 2.1 server (dynamic client registration, PKCE S256, consent at https://nyna.ai/connect). A call without a token answers HTTP 401 with a WWW-Authenticate header naming https://nyna.ai/.well-known/oauth-protected-resource; the body carries authorization_url for a human to open. A token reads and writes only the wedding or listing of the person who approved it.\n\nCOSTS. No tool on this server spends credits today; quote_cost confirms it per tool. A tool that starts charging will open its description with [Credits: N], accept the same idempotency_key, refund on failure and say \"charged\" in its result. Every result carries changed and charged (credits actually taken), on success and on error alike.\n\nRATE LIMITS. 300 requests an hour per IP address, 120 calls a minute per connected account, and 10 a minute per account for the tools that start a model generation (suggest_menu, suggest_day_schedule, parse_guest_list). A refused call answers rate_limited with retry_after_seconds; nothing is charged.\n\nIDEMPOTENCY. update_wedding, set_checklist_item, add_guests, set_run_sheet and update_provider_profile accept idempotency_key: the first result under a key is kept 10 minutes per account and replayed (idempotent_replay: true) for the same arguments; the same key with other arguments is refused (idempotency_conflict).\n\nERRORS. Every refusal is JSON with code, message and next_step (what to do), plus changed: false and charged: 0. invalid_parameter lists every problem at once with the accepted parameters and, for closed sets, the allowed values. conflict on update_wedding means the value contradicts the couple's chat: check with them; the same value sent again within 15 minutes confirms it. forbidden carries your_role: a wedding member's rights are set by the couple.\n\nWRITES. Batch writes (add_guests, set_run_sheet) validate everything before writing anything: an invalid item means no item is written. Generated menus, schedules and parsed guest lists are returned for review, never saved on their own; add_guests and set_run_sheet are the saves. The couple's share settings (public wedding page) are never readable or writable here.\n\nLIMITS. nyna never types a person's details into a third-party site, never posts or sends messages on the user's behalf from this server, and never clones a voice or a person. Provider ratings are Google's as last indexed, not nyna's. Provider prices and availability are not held. Some gift links carry an affiliate tag; it never changes the ordering.\n\nTYPICAL FLOWS. Finding a provider: search_providers with a category and the couple's city (any city), then get_provider for one record and its nyna page. Updating the wedding: get_wedding, then update_wedding with the changed field only. Building the day: suggest_day_schedule, review with the couple, set_run_sheet. Pasted guest list: parse_guest_list, confirm the names, add_guests.",
      "tools": [
        {
          "name": "add_guests",
          "title": "Add guests to the list",
          "description": "[Sign-in required] Appends up to 100 named guests to the guest list in one write — costs no credits and returns the names added, the names skipped as duplicates and the new total. Existing guests are left untouched, the whole batch is validated before anything is written, and a member whose role only proposes guests gets proposals recorded for the couple instead of additions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guests": {
                "description": "up to 100 guests per call",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "rsvp": {
                      "enum": ["confirmed", "declined", "maybe", "pending"],
                      "type": "string"
                    },
                    "side": {
                      "enum": ["bride", "groom", "both"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "idempotency_key": {
                "description": "any string of your choosing; the first result under it is returned again for 10 minutes",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["guests"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
