        {
          "name": "search_providers",
          "title": "Search wedding providers around any city",
          "description": "[Free] Searches wedding providers — venues, caterers, photographers, florists and more — around any city or place in the world, by category and free text — costs no credits and returns up to 50 providers with address, distance from the city centre, Google rating, review count and nyna page, plus how old the index is. `city` is any city, town or place name (\"Aix-en-Provence\", \"Gardanne\", \"Bouc-Bel-Air 13320\", \"Istanbul\"), resolved once and cached; only a name Google cannot place is refused. `category` is a slug from list_provider_categories; without one, the free text `q` is searched across every category. `q` matches names, specialities and cuisines (\"halal\", \"turkish\", \"bastide\", \"château\"): it is matched against indexed names, claimed listings (description, services) and the live Google search. `radius_km` (5–100, default 25) bounds the results; `sort` is relevance (claimed listings first, then nyna’s index, then live results), rating or reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "a slug from list_provider_categories; omitted = every category",
                "enum": ["venues", "caterers", "photographers", "florists", "dj-music", "videographers", "wedding-planners", "cake-pastry", "hair-makeup", "officiants", "transportation", "stationery", "jewelry", "decoration-rental"],
                "type": "string"
              },
              "city": {
                "description": "any city, town or place name in the world, e.g. \"Gardanne\" or \"Bouc-Bel-Air 13320\"; adding the country helps for small towns",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_rating": {
                "description": "only providers rated at or above this",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "free text: a name, a speciality or a cuisine, e.g. \"halal\", \"turkish\", \"bastide\"",
                "maxLength": 120,
                "type": "string"
              },
              "radius_km": {
                "description": "search radius around the city centre in km, 5–100, default 25",
                "maximum": 100,
                "minimum": 5,
                "type": "number"
              },
              "sort": {
                "description": "relevance (default) | rating | reviews",
                "enum": ["relevance", "rating", "reviews"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "changed": {
                "description": "whether anything was written",
