                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "radius_km": {
                "type": "number"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
