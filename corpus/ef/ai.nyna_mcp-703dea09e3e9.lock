                "description": "whether anything was written",
                "type": "boolean"
              },
              "charged": {
                "description": "credits actually spent; 0 today for every tool",
                "type": "number"
              },
              "links": {
                "description": "pages the user can open",
                "items": {
                  "additionalProperties": true,
                  "properties": {
