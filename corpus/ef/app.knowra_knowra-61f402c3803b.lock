{
  "lockfileVersion": 2,
  "subjects": {
    "app.knowra/knowra": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.knowra.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Knowra",
        "version": "0.9.1",
        "websiteUrl": "https://knowra.app",
        "icons": [
          {
            "src": "https://mcp.knowra.app/assets/logo-light.jpeg",
            "mimeType": "image/jpeg",
            "sizes": ["256x256"],
            "theme": "light"
          },
          {
            "src": "https://mcp.knowra.app/assets/logo-dark.jpeg",
            "mimeType": "image/jpeg",
            "sizes": ["256x256"],
            "theme": "dark"
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Knowra helps discover arXiv papers and examine them in more depth. Search returns titles, authors and abstracts; Scout provides paper-based analysis of methods, evidence, assumptions and verification points when available. Scout requires a Knowra account via OAuth or a personal API key; free accounts include 5 new Scout reports per day (resets at 00:00 UTC). Choose the breadth of search and depth of reading according to the research question and evidence needed. Decompose broad questions into distinct research dimensions when useful. Results can complement findings from other research tools and sources for broader coverage. Independent searches can run concurrently; 5-10 concurrent requests are recommended for larger batches. Independent Scout requests can also run concurrently, with up to five recommended per batch. If needed, consult source_url for the original paper. For timeouts or other retryable errors, wait at least retry_after_seconds when supplied before retrying.",
      "tools": [
        {
          "name": "get_scout",
          "title": "Get Scout report",
          "description": "Read a structured paper-based analysis of key signals, methodology, evidence,\nexperimental conditions and verification points, with author-stated limitations\nwhere available. Use it when these details help assess a candidate, compare findings,\nor understand the context of a claim beyond the abstract.\nSearch results mark supported papers with scout_available=true.\nReturns text including figure captions and descriptions. If needed, consult the\noriginal paper through source_url for further verification.\nIndependent papers can be requested concurrently; up to five concurrent requests\nare recommended per batch. For a timeout, wait as indicated and retry the same paper.",
          "inputSchema": {
            "properties": {
              "paper_id": {
                "description": "Paper identifier from search results; scout_available indicates Scout availability.",
                "examples": ["arxiv:2508.12345"],
                "maxLength": 128,
                "minLength": 1,
                "title": "Paper Id",
                "type": "string"
              }
            },
            "required": ["paper_id"],
            "title": "get_scoutArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "paper_id": {
                "title": "Paper Id",
                "type": "string"
              },
              "scout": {
                "description": "Paper-based Scout analysis with evidence, verification points and figure descriptions.",
                "title": "Scout",
                "type": "string"
              },
              "source_url": {
                "title": "Source Url",
                "type": "string"
              }
            },
            "required": ["paper_id", "scout", "source_url"],
            "title": "ScoutResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Scout report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["scout:access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:87270149d58808390b228ba40507b4341a506d29c60e4f621aeb302b3d36ad59"
        },
        {
          "name": "get_usage",
          "title": "Get usage",
          "description": "Check Scout quota, usage, remaining allowance and reset time, along with plan and\nentitlement details. Entitlement expiry and quota reset time describe different events.",
          "inputSchema": {
            "properties": {},
            "title": "get_usageArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "billing_owner": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Billing Owner"
              },
              "entitlement_expires_at": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Entitlement Expires At"
              },
              "entitlement_source": {
                "default": "free",
                "title": "Entitlement Source",
                "type": "string"
              },
              "hard_limit": {
                "title": "Hard Limit",
                "type": "boolean"
              },
              "limit": {
                "title": "Limit",
                "type": "integer"
              },
              "plan_tier": {
                "title": "Plan Tier",
                "type": "string"
              },
              "remaining": {
                "title": "Remaining",
                "type": "integer"
              },
              "resets_at": {
                "format": "date-time",
                "title": "Resets At",
                "type": "string"
              },
              "subscription_expired": {
                "title": "Subscription Expired",
                "type": "boolean"
              },
              "used": {
                "title": "Used",
                "type": "integer"
              },
              "user_id": {
                "title": "User Id",
                "type": "string"
              }
            },
            "required": ["hard_limit", "limit", "plan_tier", "remaining", "resets_at", "subscription_expired", "used", "user_id"],
            "title": "ScoutUsage",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["usage:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1669e4970b6f6095be28ba6c84a5cc760663b5fcc5dccaffdc4799456ef31076"
        },
        {
          "name": "search_papers",
          "title": "Search papers",
          "description": "Discover indexed arXiv papers using titles, authors and abstracts to assess relevance.\nPrefer an English research topic or question, preserving important entities and phrases.\nFor broad questions, consider distinct research dimensions and query each as useful.\nIndependent queries can run concurrently; 5-10 concurrent requests are recommended\nfor larger batches. Results can complement findings from other research tools and\nsources for broader coverage.\nscout_available indicates whether deeper paper-based analysis can be requested\nwith get_scout; choose further reading according to the evidence needed.\nUse from/to as YYYY-MM-DD UTC dates with both days included.\nProvide both or neither; each dated query covers at most one calendar month,\nwith dates available from 2025-08-01 onward. Omit both for all indexed dates.\nFor timeouts, wait at least retry_after_seconds when supplied before retrying.",
          "inputSchema": {
            "properties": {
              "from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First included UTC date, YYYY-MM-DD. The database supports 2025-08-01 onward. Provide both from and to, or omit both to search all supported content.",
                "examples": ["2026-09-26"],
                "title": "From"
              },
              "limit": {
                "default": 20,
                "examples": [10, 20, 50],
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "Prefer English natural-language research topics or questions; keep important entities and technical phrases.",
                "examples": ["dense passage retrieval reranking BEIR"],
                "maxLength": 2000,
                "minLength": 1,
                "pattern": "\\S",
                "title": "Query",
                "type": "string"
              },
              "to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last included UTC date, YYYY-MM-DD; the entire day is included. Provide both from and to. At most one calendar month after from; same-day queries valid.",
                "examples": ["2026-10-02"],
                "title": "To"
              }
            },
            "required": ["query"],
            "title": "search_papersArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Paper": {
                "properties": {
                  "abstract": {
                    "title": "Abstract",
                    "type": "string"
                  },
                  "authors": {
                    "items": {
                      "type": "string"
                    },
                    "title": "Authors",
                    "type": "array"
                  },
                  "date": {
                    "description": "Paper date in UTC.",
                    "format": "date-time",
                    "title": "Date",
                    "type": "string"
                  },
                  "paper_id": {
                    "title": "Paper Id",
                    "type": "string"
                  },
                  "scout_available": {
                    "default": false,
                    "title": "Scout Available",
                    "type": "boolean"
                  },
                  "source_url": {
                    "title": "Source Url",
                    "type": "string"
                  },
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "version": {
                    "default": 1,
                    "title": "Version",
                    "type": "integer"
                  }
                },
                "required": ["abstract", "authors", "date", "paper_id", "source_url", "title"],
                "title": "Paper",
                "type": "object"
              }
            },
            "properties": {
              "papers": {
                "items": {
                  "$ref": "#/$defs/Paper"
                },
                "title": "Papers",
                "type": "array"
              },
              "query_hint": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query Hint"
              },
              "returned": {
                "title": "Returned",
                "type": "integer"
              }
            },
            "required": ["papers", "returned"],
            "title": "SearchResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search papers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:686d07099e1d18b16c9e738eac2a5b057e06132508a989df7e4376b068f13ad1"
        }
      ],
      "digest": "sha256:e7b5683ede88d7d587e251038b39d5122aa0ed1ef6ee0cad3422464e6914a404"
    }
  }
}
