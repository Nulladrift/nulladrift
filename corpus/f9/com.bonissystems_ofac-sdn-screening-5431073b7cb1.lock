      "serverInfo": {
        "name": "knox-ofac-sdn-screening",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Screen a name against the public U.S. Treasury OFAC Specially Designated Nationals (SDN) list. get_sdn_list_meta says which copy of the list the checks use and how current it is; screen_sdn returns ranked matches with a verdict. Only the verdict no_match means the name was compared with every entry and nothing came close. A verdict of not_screened means the name was NOT compared with the list (it is missing, is too long, is in letters or characters the screen does not read, or is only initials): say that a person must screen the name by hand, and never report it as no match or as clear. A verdict of list_behind_schedule means the copy of the list is out of date: say it is not a current screening, and never report it as no match or as clear. This plugin screens one name at a time and keeps nothing. If the user asks to keep a dated record of a screening, say in one sentence that a dated record needs a signed-in Bonis account and give https://bonissystems.com/ofac-screening#record. Do not raise it otherwise. Sanctions screening is informational; a potential match requires human review and is not a legal determination.",
      "tools": [
        {
          "name": "get_sdn_list_meta",
          "title": "Which copy of the sanctions list",
          "description": "Shows which copy of the US Treasury OFAC sanctions list (the SDN list) the checks use: the date Treasury published it, how many entries it holds, when it was copied from Treasury and how many days old that copy is, with a warning if the last daily refresh failed or the copy is more than 14 days old. Takes no input. Use it to tell someone how current a check is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which copy of the sanctions list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:214c197491fbe5aadb71ee297e16e8eb7598075073e2ba203d5380ade5774e07"
        },
        {
          "name": "screen_sdn",
          "title": "Check a name on the sanctions list",
          "description": "Checks a name against the latest copy of the US Treasury OFAC sanctions list (the SDN list). Returns match, possible_match, no_match, not_screened or list_behind_schedule, and each listed entry that came close: its name, type, the part that matched, its sanctions programs, and any addresses and ID numbers Treasury published. no_match means the name was compared with every entry on the list and none came close. not_screened means the name was NOT compared: it is missing, is written in whole or in part in letters or characters this screen does not read (it reads Latin letters, the digits 0 to 9 and ordinary punctuation), is only initials, or is longer than 256 characters (a name is never cut to fit; a country over 64 or an identifier over 64 characters is refused the same way); notScreenedReason says which, and a person must screen that name by hand. not_screened is never a no-hit result. list_behind_schedule means nothing came close on the copy held, but that copy is behind its refresh schedule: it is not a current screening and never a no-hit result. A country or sdnType does not remove any entry from the check: every entry's name is compared, entries tied to that country or type are listed first among equally close ones, and a match outside them is marked outsideFilter, which changes only its place in the list: it is still a match and a person must still review it. The name is not stored. A match means the name is close to a listed name, not that it is the same person or company; a person must compare the details. Information from public Treasury data, not legal advice, a compliance decision or a clearance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country. It orders the matches (entries tied to it first among equally close ones); it never removes a match.",
                "type": "string"
              },
              "identifier": {
                "description": "Optional government/registration identifier. An entry with exactly this number is a match whatever the name.",
                "type": "string"
              },
              "name": {
                "description": "The name to screen (person, entity, vessel, or aircraft).",
                "type": "string"
              },
              "sdnType": {
                "description": "Optional SDN record type. It orders the matches; it never removes a match of another type.",
                "enum": ["Entity", "Individual", "Vessel", "Aircraft"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a name on the sanctions list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8a4f044af3bd175bb4adce6463727d32905f447ba5e0af4f00d10c0f0e22084"
        }
      ],
      "digest": "sha256:c757ce0cac7f6cd176c14da8947f039d09f312fdc4cde1c2f7beff18622c9cbe"
    }
