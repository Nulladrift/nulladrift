{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/ofac-sdn-screening": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bonissystems.com/api/knox/agents/ofac-sdn-screening/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "knox-ofac-sdn-screening",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Screen a name against the public U.S. Treasury OFAC Specially Designated Nationals (SDN) list. get_sdn_list_meta returns the loaded list's provenance; screen_sdn returns ranked matches with a verdict. This MCP path does not store or anchor the query. Sanctions screening is informational; a positive match requires human review and is not a legal determination.",
      "tools": [
        {
          "name": "get_sdn_list_meta",
          "description": "Return the provenance AND the freshness of the loaded OFAC SDN list: source URL, publish date, record count, fetch time, the source + index content hashes, and how many days old the snapshot is against a 14-day staleness threshold (the flag keys on fetch age, not publish age). No input, no PII. Use this to confirm which list version a screening ran against, and how current it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:599ef9962468ba6f2f2f62d2aed7fa92dc1625243f5c4d3b0c3732fa8f2f841d"
        },
        {
          "name": "screen_sdn",
          "description": "Screen a name against a dated snapshot of the public OFAC SDN list. Returns one of three verdicts — match, possible_match, or no_match — and ranked matches with the OFAC list entry and the field that matched. The query is NOT stored or anchored on this path. A potential match requires human review — it is information, not a legal or compliance determination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country to narrow matches.",
                "type": "string"
              },
              "identifier": {
                "description": "Optional government/registration identifier.",
                "type": "string"
              },
              "name": {
                "description": "The name to screen (person, entity, vessel, or aircraft).",
                "type": "string"
              },
              "sdnType": {
                "description": "Optional SDN record type.",
                "enum": ["Entity", "Individual", "Vessel", "Aircraft"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ffa8ebb2e33249eadf2dde2d4947c9b188aff0dab1b8881d0471aa603ba68b94"
        }
      ],
      "digest": "sha256:6924c2875bfc1a48e844da1ac8a00385aebda1021c3d3355e75ebb917674007d"
    }
  }
