{
  "lockfileVersion": 2,
  "subjects": {
    "com.morsemoney/morse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.morsemoney.com/v1"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "morse-public-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_exchange_rate",
          "description": "Returns the current mid-market exchange rate between two currencies as the number of units of to_currency per one unit of from_currency, with the time it was read. Use it to answer how much one currency is worth in another. It does not say whether Morse can send money in either currency; use list_send_destinations for that. The rate is indicative; show get_started_url as the way to continue in the Morse app, where the rate applied to a transfer is shown before the user confirms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_currency": {
                "description": "ISO 4217 code of the currency to convert from, e.g. USD.",
                "type": "string"
              },
              "to_currency": {
                "description": "ISO 4217 code of the currency to convert to, e.g. MXN.",
                "type": "string"
              }
            },
            "required": ["from_currency", "to_currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Exchange rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:464cf0c0df627ff0ad0c9b8ef393800819d295f2a38e323debf09149d76da037"
        },
        {
          "name": "list_send_destinations",
          "description": "Returns the countries, currencies and payment rails a person living in from_country can send money to with Morse when paying someone else's bank account, with the typical delivery time for each. Use it to answer whether Morse can send from one country to another. An empty destinations list means sending to other people's bank accounts is not offered from that country. When the result includes get_started_url, show it to the user as the way to continue in the Morse app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_country": {
                "description": "ISO 3166-1 alpha-2 code of the country the sender lives in, e.g. US. If the user has not said where they live, ask them before quoting; do not assume.",
                "type": "string"
              }
            },
            "required": ["from_country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Where Morse can send"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ace363d58ab49bf0270af9b4124d292fec0ccb3e1367fa823d3d5136b4a4a90e"
        },
        {
          "name": "quote_send",
          "description": "Returns an indicative quote for sending money with Morse from a person living in from_country to someone else's bank account in to_country: the amount sent, the fee, the mid-market exchange rate and what the recipient gets. The result includes the total cost of the transfer and the typical delivery time. Use it to answer how much a transfer costs or how much will arrive. Use list_send_destinations first to check the destination is offered. Present the figures as indicative and tell the user to check the final rate and fees in the Morse app, using get_started_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount to send, in from_currency, e.g. 250 or 99.50.",
                "type": "number"
              },
              "from_country": {
                "description": "ISO 3166-1 alpha-2 code of the country the sender lives in, e.g. US. If the user has not said where they live, ask them before quoting; do not assume.",
                "type": "string"
              },
              "from_currency": {
                "description": "ISO 4217 code of the currency the sender pays in. Defaults to the currency of from_country.",
                "type": "string"
              },
              "to_country": {
                "description": "ISO 3166-1 alpha-2 code of the country of the recipient's bank account, e.g. MX.",
                "type": "string"
              },
              "to_currency": {
                "description": "ISO 4217 code of the currency the recipient receives. Defaults to the currency Morse pays out in to_country.",
                "type": "string"
              }
            },
            "required": ["amount", "from_country", "to_country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a transfer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d30b49a9f8835a7dfdf5588355b184779348c893ee30b82995a6c0bb2d85870e"
        }
      ],
      "digest": "sha256:ab6050018ea8f09d15185dc0935383481ff1be2a555e426be9459f00fb636456"
    }
  }
}
