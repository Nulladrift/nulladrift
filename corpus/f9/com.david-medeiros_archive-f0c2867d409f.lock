{
  "lockfileVersion": 2,
  "subjects": {
    "com.david-medeiros/archive": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.david-medeiros.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "david-medeiros-archive-readonly",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only archive tools. A filing is not a finding. Verify against the linked primary record.",
      "tools": [
        {
          "name": "get_federal_authorities",
          "title": "Federal authorities cited by the archive",
          "description": "Read-only static list of federal citations with official .gov URLs, each labeled VERIFIED (text opened on the official source), plus one entry labeled as an untested legal question. No arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f83d5fe03fc45101d9c5512622490036ebd078723ad626f31485df217e0f829e"
        },
        {
          "name": "query_jurisdiction",
          "title": "Look up one jurisdiction in the Care vs Code ledger",
          "description": "Read-only. Returns the published record for one of the 56 U.S. jurisdictions (states, DC, territories) from the site's Care vs. Code ledger: brain-injury waivers, requests sent, funding rates, claims-system and program-integrity holders, each with its source URL and VERIFIED / NOT FOUND ONLINE / NOT CHECKED YET label. A filing is not a finding.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Postal code (CT) or name (Connecticut)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9500001e198971373742c5f9f9084e4b039e1cd40858b9fe42a27e9a9c2a3a48"
        },
        {
          "name": "trace_proof_chain",
          "title": "Search the Nov 23, 2026 proof chain",
          "description": "Read-only. Searches the published proof-chain dataset (what was reported, received and done, office by office) by office name, record id (for example pc-24a5451606ab) or agency control number. Returns at most 20 rows. A receipt is not an investigation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b492aa6059c4d310dbd99a69e1557e2abe89861bf2633bdfd8af3034cee0f5c6"
        },
        {
          "name": "verify_archive_sha256",
          "title": "Check a SHA-256 against the archive manifest",
          "description": "Read-only. Looks a SHA-256 (64 hex characters) up in the site's published manifest (/for-ai/manifest.json). A match means the file is listed in the manifest; no match does not prove a file is not authentic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sha256": {
                "maxLength": 64,
                "minLength": 64,
                "pattern": "^[0-9a-fA-F]{64}$",
                "type": "string"
              }
            },
            "required": ["sha256"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f631ca0ffd8cd1ebf0599454ff6071e56faec2bfeef8dfaab5492659cd3a2721"
        }
      ],
      "digest": "sha256:b22c44c7f30e803c8705c5d90691f758f5f85fbea25892505e08e208510367db"
    }
  }
}
