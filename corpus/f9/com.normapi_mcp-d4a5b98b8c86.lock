                          "type": "string"
                        },
                        "reasonCode": {
                          "description": "UNTDID 5189 for an allowance (95 discount), UNTDID 7161 for a charge (FC freight)",
                          "pattern": "^[0-9A-Z]{1,3}$",
                          "type": "string"
                        },
                        "vatCategory": {
                          "description": "UNTDID 5305: S standard, Z zero-rated, E exempt, AE reverse charge, K intra-community supply, G export, O outside scope, L Canary Islands, M Ceuta/Melilla",
