      "serverInfo": {
        "name": "normapi",
        "title": "NormAPI — German e-invoices",
        "version": "1.3.2",
        "description": "Validate, generate and read XRechnung and ZUGFeRD e-invoices against the official KoSIT rules, with a plain-language explanation for every business-rule finding.",
        "websiteUrl": "https://normapi.com/en/docs/mcp",
        "icons": [
          {
            "src": "https://normapi.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "NormAPI checks, produces and reads German e-invoices (XRechnung in UBL or CII, ZUGFeRD/Factur-X PDF) against the official KoSIT rule set, and states the rule set version with every result.\n\nvalidate_invoice needs no account. Its verdict is `acceptable`; every business-rule finding carries a plain-language explanation (meaning, cause, fix) — quote the fix rather than paraphrasing the rule text.\n\nparse_invoice needs no account either. It reads a received invoice into data: `invoice` in the shape generate_invoice takes, `stated` with the totals as the document wrote them, and `notMapped` naming every value it did not carry. Answer questions about an invoice from this data rather than from the raw XML, and say so when notMapped lists something relevant.\n\ngenerate_invoice turns invoice data into a document that passed validation before it was returned. It needs the user's NormAPI account and counts against their monthly allowance, so build the invoice from data the user gave you and do not retry blindly: a refusal names the rules the data breaks.\n\nPick its profile by the recipient: xrechnung (the default) for a public-sector buyer, en16931 for a business, which then needs no Leitweg-ID, contact person or electronic addresses.\n\nWhen the user's account has a letterhead (uploaded at normapi.com/konto/briefkopf), zugferd PDFs are printed on it automatically; pass letterhead \"none\" only when the user asks for NormAPI's standard layout.\n\nexplain_rule explains a rule code (e.g. BR-DE-15) the user already has.\n\nInvoices are processed in memory and never stored. This is technical validation, not tax or legal advice.",
      "tools": [
        {
          "name": "explain_rule",
          "title": "Explain an e-invoice rule",
          "description": "Explain one EN 16931 / XRechnung / Peppol business rule by its code (e.g. BR-DE-15, BR-CO-10, PEPPOL-EN16931-R010): what it requires, why invoices typically break it, and how to fix it, with a link to the full page. Case does not matter. Schema findings (cvc-*) have no explanation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The rule code, e.g. BR-DE-15",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the plain-language explanations: en (default) or de",
                "enum": ["en", "de"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cause": {
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "fix": {
                "type": "string"
              },
              "language": {
                "enum": ["de", "en", "fr"],
                "type": "string"
              },
              "meaning": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["cause", "code", "fix", "language", "meaning", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an e-invoice rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:f551fe8b625724e6bb193effa3cc44bcf0c72b409255d18d2736dc5ff32a6792"
        },
        {
          "name": "generate_invoice",
          "title": "Generate an e-invoice",
          "description": "Produce an e-invoice as `ubl` or `cii` XML or a ZUGFeRD hybrid PDF (`zugferd`) from invoice data: an XRechnung for a public-sector buyer (profile `xrechnung`, the default), a plain EN 16931 invoice for a business (profile `en16931`). Totals are computed server-side in decimal arithmetic, and the document is validated against the official rules before it is returned. Data the rules do not permit is refused with the broken rules and how to fix each. Needs the user's NormAPI account; each generated document counts against that account's monthly allowance.",
