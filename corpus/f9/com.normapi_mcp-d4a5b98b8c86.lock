                        },
                        "percent": {
                          "anyOf": [
                            {
                              "type": "number"
                            },
                            {
                              "pattern": "^-?\\d+(\\.\\d+)?$",
                              "type": "string"
                            }
                          ],
                          "description": "Give amount or percent, exactly one."
                        },
                        "reason": {
                          "description": "This or reasonCode is required",
