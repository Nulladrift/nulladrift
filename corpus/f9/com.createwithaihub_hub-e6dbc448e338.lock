            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f87100229405fd0a43d7835131cc0c6e6a05c0f8a88955ded8b05a046dac7de"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Directory categories and subcategories with counts and URLs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6a40eb4008c6b81a28966ad0891fe7ff61d1e5d31f01f4643c3eefabd13fe22"
        },
        {
          "name": "list_collections",
          "title": "List collections",
          "description": "Editor-curated collections of resources, e.g. starter kits.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02d0c0611f8fbdb75630668dba361e846a45b23d39de278118f855ec0e49eddd"
        },
        {
          "name": "list_platforms",
          "title": "List platforms",
          "description": "Platforms you can filter by: the agents and apps a resource works with, and where it runs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1dad2cef32125e4af7f0a859e3cc581350302b6c8327040fe2b05d381dbd6e36"
        },
        {
          "name": "plan_project",
          "title": "Find the resources for a project",
          "description": "Use this first whenever the user is building something (\"build me a CRM\", \"make a landing page\", \"add a chatbot to my app\"). It returns the directory's AI tools, MCP servers, skills, templates and APIs for the project, grouped by the job each one does, each linking to its official source. This server matches words; it does not interpret the request, so you do: read what the user wants and fill in kinds, steps and keywords yourself. kinds and steps are documented here: kinds (pick all that apply): mcp = MCP server or connector (default steps: mcpbuild, agent, docs, testing, code); ai-app = AI app or agent (default steps: framework, modelapi, vector, template, agent, evals, inference, docs, data, payments); web-app = web app (default steps: agent, nocode, data, design, docs, testing, code, monitoring, integrations, payments); website = website (default steps: nocode, agent, design, testing, code); automation = automation or integration (default steps: integrations, agent, docs); media = with images, video or audio (default steps: media, modelapi, local); data = data or research project (default steps: scrape, modelapi, agent); local = that runs locally (default steps: local, inference). steps (pick only what this project needs, in the order you want them): agent = a coding agent to write the code; nocode = an AI app/site builder, for no-code; template = a starter template or quickstart; data = database, user accounts, backend; design = UI design skills, Figma; docs = current library docs for the agent; testing = browser testing and debugging; code = GitHub repos, issues, PRs; monitoring = error monitoring in production; payments = checkout, subscriptions, in-app purchases, usage-based billing; integrations = email, Slack, CRMs, spreadsheets, workflows; framework = a library for agents/LLM apps; modelapi = an AI model API to call; inference = hosted open models, inference APIs; mcpbuild = MCP SDKs and server templates; skills = agent skills; media = image/video/voice models and tools; local = local/offline model runners; vector = vector DB for RAG, semantic search, memory; evals = trace, evaluate and monitor LLM calls; scrape = browsing/scraping for the agent. Put real search terms in keywords, including synonyms and the parts the project is made of (for a CRM: \"crm\", \"customer database\", \"sales pipeline\", \"contacts\", \"email\"). For needs not in the steps list (payments, maps, SMS, …) add extra_steps with your own title and keywords. The answer lists steps that have no listings yet; cover those from your own knowledge. Then call get_setup to install the MCP servers the user picks.",
          "inputSchema": {
            "properties": {
              "extra_steps": {
                "description": "Your own steps for needs the steps list does not cover",
                "items": {
                  "properties": {
                    "keywords": {
                      "description": "e.g. [\"payments\", \"stripe\", \"checkout\"]",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 8,
                      "type": "array"
                    },
                    "title": {
                      "description": "e.g. \"Payments\"",
                      "type": "string"
                    }
                  },
                  "required": ["keywords", "title"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "goal": {
                "description": "What the user is building, in one line, e.g. \"a CRM for a small sales team\"",
                "type": "string"
              },
              "keywords": {
                "description": "Search terms for the project itself: synonyms, components, related tools. One word or a short phrase each.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "kinds": {
                "description": "The kinds of project, chosen by you (see the description). Sets the default steps.",
                "items": {
                  "enum": ["mcp", "ai-app", "web-app", "website", "automation", "media", "data", "local"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "per_role": {
                "default": 3,
                "description": "Suggestions per step",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "steps": {
                "description": "The steps this project needs, in order, chosen by you. Overrides the defaults from kinds.",
                "items": {
                  "enum": ["agent", "nocode", "template", "data", "design", "docs", "testing", "code", "monitoring", "payments", "integrations", "framework", "modelapi", "inference", "mcpbuild", "skills", "media", "local", "vector", "evals", "scrape"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "works_with": {
                "description": "The agent or app the user works in, as a platform slug from list_platforms (e.g. \"claude-code\", \"cursor\"), to rank compatible resources first",
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64ce20b062dfc627896de85ae3f51711a643ec36947012a92028f0ee6eee859d"
        },
        {
          "name": "search_resources",
          "title": "Search the directory",
          "description": "Search CreateWithAI Hub for AI tools, MCP servers, skills, coding agents, models, APIs and libraries by keyword. Use short keywords for a building block (\"database\", \"browser testing\", \"design skill\", \"email\"), not a whole request; for a whole project use plan_project. By default every word must match, falling back to any word when nothing has them all; set match to \"any\" to search several synonyms at once (\"crm customer database contacts\"). Every result links to its page and official sources.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories, e.g. \"mcp-servers\" or \"skills\"",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "match": {
                "default": "all",
                "description": "\"all\": every word must match (falls back to any when nothing does). \"any\": results with any of the words, best matches first.",
                "enum": ["all", "any"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page of results, for when there are more matches than the limit",
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "enum": ["free", "freemium", "paid"],
                "type": "string"
              },
              "query": {
                "description": "A few keywords, e.g. \"browser automation\" or \"postgres\"",
                "type": "string"
              },
              "use_case": {
                "description": "Use case slug, e.g. \"coding\", \"video\", \"automation\"",
                "type": "string"
              },
              "works_with": {
                "description": "Platform slug from list_platforms, e.g. \"claude-code\", \"cursor\", \"vscode\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e73c6305a48aeeb14a8195ee00be1107fd66d133e112b5a8ccef370343ed8cd8"
        }
      ],
      "digest": "sha256:9aee7df90baf24161471b39ef2379bf61d8ead9fe38c243215a1293460a905ab"
    }
  }
