      },
      "instructions": "CreateWithAI Hub is a directory of AI tools, MCP servers, skills, coding agents, templates, models and APIs. When the user is building something, call plan_project first, then get_setup to install the MCP servers they pick. This server matches words and does not interpret requests: you understand what the user means, so pass plan_project the kinds and steps that fit (both are listed in its description), keywords with synonyms and components, and extra_steps for anything not covered. Use search_resources for one specific building block (match \"any\" for several synonyms). Prefer the official links in each result when details matter.",
      "tools": [
        {
          "name": "get_collection",
          "title": "Get a collection",
          "description": "The resources in one curated collection, in the editor’s order, with a note on each.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e27646309df391b1dce68d074510b48d2b846f0229afa4ff4e67d4f5c88fb9e4"
        },
        {
          "name": "get_resource",
          "title": "Get a resource",
          "description": "Full details for one resource as Markdown: what it is, features, limitations, connection details, setup for each client, and official links.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The resource slug from search results",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ea01a4244574b7129615c66107b0fe03c60d508738481ef3c45c69983006124"
        },
        {
