        {
          "name": "request_commercial_access",
          "title": "Request commercial access",
          "description": "For a company that wants to use Loker Dollar job, talent or market data commercially or in bulk (beyond the free per-IP limits). Sends the request to a person at Loker Dollar, who replies to the work email within one business day. Requires a work email on the company domain (personal webmail is rejected). Only call this when the user asks for it and supplied these details. Self-serve paid access per call is on Apify (see paid_access.url).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name.",
                "type": "string"
              },
              "use_case": {
                "description": "What the company wants to build or do with the data (max 1000 chars).",
                "type": "string"
              },
              "volume": {
                "description": "Optional expected volume, e.g. '50k job rows/month' or '200 talent searches/month'.",
                "type": "string"
              },
              "work_email": {
                "description": "Work email on the company domain; the reply goes here.",
                "type": "string"
              }
            },
            "required": ["company", "use_case", "work_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request commercial access"
          },
          "behavior": {
            "destructive": false,
