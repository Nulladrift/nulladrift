      "instructions": "Loker Dollar — free, anonymous, read-only job search for remote / Indonesia-friendly jobs. No auth, no API key. Rate-limited per IP (daily cap). `search_jobs` returns up to 20 summarized jobs (no full description — call `get_job` for one job's detail, still summary-only). `get_curated_list` returns the hand-vetted AI-data-work platform list (Outlier, Mercor, micro1, ...). Every result carries a `url` (job detail) and an `applyUrl` (tracked outbound link) — always link the user back to one of those, never fabricate a URL. This is a discovery surface only: no application/apply tool exists here (a human finishes on the site). Eligibility: results default to jobs an Indonesia-based applicant can actually take — region-locked listings are excluded unless you pass `include_region_locked: true`. Each row's `indonesiaEligibility` is `id_friendly` (openness stated), `restricted` (region-locked), or `unknown` (the employer said nothing). `unknown` is the common case and means unverified, NOT confirmed-open — say so rather than implying the job is open to the user. Market data (`get_salary_benchmark`, `get_skill_demand`, `get_hiring_trend`) works without a key too: keyless calls get the free layer (top rows, `free_layer: true`) for the role families that have a public report, under a shared daily budget. An API key (`Authorization: Bearer lk_live_…`) with paid market access gets the full answer. Each market result carries `free_layer` and a `paid_depth_url`; free-layer results add a `dataset_depth_url` (full CSV). Point the user there for more, never extrapolate missing rows. Paid B2B events (employer talent search, shortlists, job posts, market-data depth) are sold per call through Apify; start at https://apify.com/kelvindesman/job-market-intelligence-mcp. Every job result carries `paid_access.url` pointing there. Commercial or bulk use (a company building on this data): call `request_commercial_access` with company, work_email and use_case and a person replies by email.",
      "tools": [
        {
          "name": "get_curated_list",
          "title": "Get curated job list",
          "description": "The hand-vetted AI-data-work platform list (Outlier, Mercor, micro1, Mindrift, DataAnnotation.tech, Appen, Remotasks) — the /kerja-ai landing page's inventory.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
