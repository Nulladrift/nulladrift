          },
          "digest": "sha256:cdbebcc1e4b8b5008f7b2eab0da83b344d2f1f7a267994ad648f55dc3bea2846"
        },
        {
          "name": "search_jobs",
          "title": "Search remote jobs",
          "description": "Search active, worldwide-remote, non-partner job listings. Returns up to 20 summarized rows (no full description). Jobs that are region-locked away from Indonesia are excluded by default; every row carries `indonesiaEligibility` (id_friendly | restricted | unknown) plus the raw `geoFit`/`applicantRegion` it was derived from.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug filter.",
                "type": "string"
              },
              "freshness": {
                "description": "fresh | active | stale_risk (W5 tier; omit for no filter).",
                "type": "string"
              },
              "geo_verified_only": {
                "description": "Only jobs classified geo_fit = id_friendly (W2).",
                "type": "boolean"
              },
              "include_region_locked": {
                "description": "Default false. When true, also return jobs restricted to a region an Indonesia-based applicant cannot work from (geo_fit = restricted, or applicant_region in US/UK/EU/Canada/North America). Check each row's `indonesiaEligibility` before recommending one.",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text query matched against title/company.",
                "type": "string"
              },
              "remote_usd_only": {
                "description": "Only worldwide-remote jobs paid in USD.",
                "type": "boolean"
              }
            },
            "type": "object"
