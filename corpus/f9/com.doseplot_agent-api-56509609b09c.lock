{
  "lockfileVersion": 2,
  "subjects": {
    "com.doseplot/agent-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.doseplot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "doseplot-agent-api",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Mathematical planning aid. Not medical advice. DosePlot is an informational tool, not a healthcare provider, and using it creates no provider-patient relationship. Do not start, stop, or change any protocol without the approval of a licensed healthcare professional. Outputs are for relay to a human decision-maker; not for autonomous administration.",
      "tools": [
        {
          "name": "get_compound",
          "description": "Full published record for one compound, looked up by canon id, slug or alias (slug and alias matching is case-insensitive). Outputs are for relay to a human decision-maker; not for autonomous administration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Canon id, slug, or alias.",
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compound": {
                "description": "The published canon record, verbatim.",
                "type": "object"
              },
              "disclaimer": {
                "description": "Fixed disclaimer. Relay it with any output.",
                "type": "string"
              },
              "editorial": {
                "type": ["object", "null"]
              },
              "intended_use": {
                "description": "Fixed intended-use statement. Relay it too.",
                "type": "string"
              },
              "reconstitutable": {
                "type": "boolean"
              }
            },
            "required": ["compound", "disclaimer", "editorial", "intended_use", "reconstitutable"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:063976c28fb3eab245888402de9cb95255c20ced628e8ef0f79e82a5441b3b33"
        },
        {
          "name": "list_compounds",
          "description": "List every published compound with its class, terminal half-life in days, administration routes and whether reconstitution math is available for it. Takes no arguments. Outputs are for relay to a human decision-maker; not for autonomous administration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compounds": {
                "items": {
                  "properties": {
                    "class": {
                      "type": ["string", "null"]
                    },
                    "half_life_days": {
                      "type": ["number", "null"]
                    },
                    "id": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "reconstitutable": {
                      "type": "boolean"
                    },
                    "routes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["class", "half_life_days", "id", "name", "reconstitutable", "routes", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "disclaimer": {
                "description": "Fixed disclaimer. Relay it with any output.",
                "type": "string"
              },
              "intended_use": {
                "description": "Fixed intended-use statement. Relay it too.",
                "type": "string"
              }
            },
            "required": ["compounds", "count", "disclaimer", "intended_use"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1b8bdf0d9ec088227eeec376a29cdc97fbcba00bced00044d6a6d247b0734d1"
        },
        {
          "name": "recon_calc",
          "description": "Paid: $0.01 USDC per call via x402 (payment in _meta[\"x402/payment\"]). Reconstitution math for one vial and one target dose: the concentration to reconstitute to, the bacteriostatic water to add, what one dose reads on a U-100 syringe, and how many doses the vial yields. Exactly one target-dose field must be present; unknown fields are rejected. Outputs are for relay to a human decision-maker; not for autonomous administration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost_usd": {
                "description": "Vial cost, zero or more. Omitted, cost_per_dose_usd is null.",
                "type": "number"
              },
              "draw_ml": {
                "description": "The volume you want to DRAW for one dose, in mL -- not the vial fill. Accepted range is one hundredth of a mL up to ten mL. The fill needed to make that true comes back as bac_water_ml.",
                "type": "number"
              },
              "frequency_days": {
                "description": "Days between doses, positive. Feeds days_per_vial only. Defaults to one.",
                "type": "number"
              },
              "target_dose_mcg": {
                "description": "Target dose, mcg. Positive.",
                "type": "number"
              },
              "target_dose_mg": {
                "description": "Target dose, mg. Positive.",
                "type": "number"
              },
              "vial_mg": {
                "description": "Total mass in the vial, mg. Positive.",
                "type": "number"
              }
            },
            "required": ["draw_ml", "vial_mg"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bac_water_ml": {
                "type": "number"
              },
              "concentration_mg_per_ml": {
                "type": "number"
              },
              "cost_per_dose_usd": {
                "type": ["number", "null"]
              },
              "days_per_vial": {
                "type": "number"
              },
              "disclaimer": {
                "description": "Fixed disclaimer. Relay it with any output.",
                "type": "string"
              },
              "doses_per_vial": {
                "type": "integer"
              },
              "intended_use": {
                "description": "Fixed intended-use statement. Relay it too.",
                "type": "string"
              },
              "meta": {
                "properties": {
                  "frequency_days": {
                    "type": "number"
                  },
                  "more": {
                    "type": "string"
                  },
                  "network_note": {
                    "type": "string"
                  }
                },
                "required": ["frequency_days", "more"],
                "type": "object"
              },
              "residual_mg": {
                "type": "number"
              },
              "syringe_marks": {
                "properties": {
                  "u100": {
                    "type": "number"
                  }
                },
                "required": ["u100"],
                "type": "object"
              },
              "units_per_dose": {
                "type": "number"
              }
            },
            "required": ["bac_water_ml", "concentration_mg_per_ml", "cost_per_dose_usd", "days_per_vial", "disclaimer", "doses_per_vial", "intended_use", "meta", "residual_mg", "syringe_marks", "units_per_dose"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0365dcfc079e533bf01a9a3401cc552d2da10415b971c74dd5fa71fab01e1a44"
        },
        {
          "name": "recon_suggest",
          "description": "Paid: $0.01 USDC per call via x402 (payment in _meta[\"x402/payment\"]). Ranked reconstitution suggestions for one published reconstitutable compound: bacteriostatic-water presets that put the published per-administration dose range's clean steps on whole U-100 syringe marks. Vial defaults to the compound's first published strength. Compounds whose published range is denominated per period are refused rather than guessed at. Unknown fields are rejected. Outputs are for relay to a human decision-maker; not for autonomous administration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Canon id, slug, or alias. Must be a reconstitutable compound.",
                "type": "string"
              },
              "vial_iu": {
                "description": "Your actual vial's total activity, IU, positive. Only for compounds whose published vials are IU-quantified. Omitted, the first published vial strength is used.",
                "type": "number"
              },
              "vial_mg": {
                "description": "Your actual vial's total mass, mg, positive. Only for compounds whose published vials are mg-quantified. Omitted, the first published vial strength is used.",
                "type": "number"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compound": {
                "properties": {
                  "id": {
                    "type": "integer"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["id", "name", "slug"],
                "type": "object"
              },
              "disclaimer": {
                "description": "Fixed disclaimer. Relay it with any output.",
                "type": "string"
              },
              "intended_use": {
                "description": "Fixed intended-use statement. Relay it too.",
                "type": "string"
              },
              "meta": {
                "properties": {
                  "more": {
                    "type": "string"
                  },
                  "network_note": {
                    "type": "string"
                  }
                },
                "required": ["more"],
                "type": "object"
              },
              "rows": {
                "description": "Ranked presets, best first, at most 3 rows. An empty array means no clean-graduation preset exists for this vial -- a real answer, not a refusal.",
                "items": {
                  "properties": {
                    "bac_water_ml": {
                      "type": "number"
                    },
                    "concentration_per_ml": {
                      "description": "Denominated in vial.unit per mL.",
                      "type": "number"
                    },
                    "preset_doses": {
                      "items": {
                        "properties": {
                          "dose": {
                            "type": "number"
                          },
                          "dose_unit": {
                            "enum": ["mg", "mcg", "IU"],
                            "type": "string"
                          },
                          "doses_per_vial": {
                            "type": "integer"
                          },
                          "syringe_marks": {
                            "properties": {
                              "u100": {
                                "type": "integer"
                              }
                            },
                            "required": ["u100"],
                            "type": "object"
                          },
                          "units_per_dose": {
                            "type": "number"
                          }
                        },
                        "required": ["dose", "dose_unit", "doses_per_vial", "syringe_marks", "units_per_dose"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["bac_water_ml", "concentration_per_ml", "preset_doses"],
                  "type": "object"
                },
                "type": "array"
              },
              "vial": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "source": {
                    "description": "Whether the vial came from the request or from the published strengths.",
                    "enum": ["request", "canon"],
                    "type": "string"
                  },
                  "unit": {
                    "description": "What amount is denominated in, and what concentration_per_ml is per mL of.",
                    "enum": ["mg", "IU"],
                    "type": "string"
                  }
                },
                "required": ["amount", "source", "unit"],
                "type": "object"
              }
            },
            "required": ["compound", "disclaimer", "intended_use", "meta", "rows", "vial"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:23c7aea2b2943d30c5062a9c6e26f733acf577bf413b5f6214323970e7c99c7a"
        },
        {
          "name": "simulate",
          "description": "Paid: $0.01 USDC per call via x402 (payment in _meta[\"x402/payment\"]). Pharmacokinetic serum curve for one compound at one dose and one cadence, over a requested horizon. Exactly one dose field must be present; unknown fields are rejected rather than ignored. Outputs are for relay to a human decision-maker; not for autonomous administration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Canon id, slug, or alias.",
                "type": "string"
              },
              "dose_iu": {
                "description": "Dose per injection in the compound's activity unit. Positive. Requires a published conversion for that compound.",
                "type": "number"
              },
              "dose_mcg": {
                "description": "Dose per injection, micrograms. Positive.",
                "type": "number"
              },
              "dose_mg": {
                "description": "Dose per injection, milligrams. Positive.",
                "type": "number"
              },
              "duration_weeks": {
                "description": "Length of the dosing window, whole weeks, from one to two hundred and sixty. The model always adds a sixty-day washout tail.",
                "type": "integer"
              },
              "injections_per_week": {
                "description": "Injections per WEEK -- not per day; the name is the contract. Accepted range is a quarter of an injection per week up to twenty-one per week.",
                "type": "number"
              },
              "route": {
                "description": "One of the compound's published routes. Omitted, its primary route is used.",
                "type": "string"
              },
              "samples_per_day": {
                "description": "Sample resolution of the returned series, whole samples, from one to twenty-four. Defaults to twenty-four.",
                "type": "integer"
              }
            },
            "required": ["compound", "duration_weeks", "injections_per_week"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compound": {
                "properties": {
                  "id": {
                    "type": "integer"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["id", "name", "slug"],
                "type": "object"
              },
              "disclaimer": {
                "description": "Fixed disclaimer. Relay it with any output.",
                "type": "string"
              },
              "intended_use": {
                "description": "Fixed intended-use statement. Relay it too.",
                "type": "string"
              },
              "meta": {
                "properties": {
                  "duration_weeks": {
                    "type": "integer"
                  },
                  "injections_per_week": {
                    "description": "Echoed back as REQUESTED, not as the walk quantized it.",
                    "type": "number"
                  },
                  "more": {
                    "type": "string"
                  },
                  "network_note": {
                    "type": "string"
                  },
                  "samples_per_day": {
                    "type": "integer"
                  }
                },
                "required": ["duration_weeks", "injections_per_week", "more", "samples_per_day"],
                "type": "object"
              },
              "series": {
                "items": {
                  "properties": {
                    "day": {
                      "description": "Cycle day, 1-indexed.",
                      "type": "number"
                    },
                    "level": {
                      "description": "Modelled serum level, in `units`.",
                      "type": "number"
                    }
                  },
                  "required": ["day", "level"],
                  "type": "object"
                },
                "type": "array"
              },
              "units": {
                "description": "The ONLY correct label for the numbers in `level`.",
                "enum": ["ng/dL", "mcg", "mg"],
                "type": "string"
              }
            },
            "required": ["compound", "disclaimer", "intended_use", "meta", "series", "units"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad604cc7a3436fb033aea28e2b0746a463f7c62124cae93ed4fa878fb4eb9313"
        }
      ],
      "digest": "sha256:89cb6b69ecb3b7e3c48793d0d13970f9878c12cf38a2f0e3407f5ffc390605a5"
    }
  }
}
