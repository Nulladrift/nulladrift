      "serverInfo": {
        "name": "ai.nimblebrain/careers",
        "title": "NimbleBrain Careers",
        "version": "0.1.3",
        "websiteUrl": "https://nimblebrain.ai/careers"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {},
          "io.modelcontextprotocol/ui": {}
