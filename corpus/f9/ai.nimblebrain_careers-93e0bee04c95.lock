          "listChanged": true
        }
      },
      "instructions": "Helps a person apply for a job at NimbleBrain. Read the skill://apply-to-nimblebrain/SKILL.md resource before calling a tool.",
      "tools": [
        {
          "name": "careers_list_roles",
          "title": "List NimbleBrain's open roles",
          "description": "List NimbleBrain's open roles and how to apply.\n\nCall this first whenever someone wants to apply to NimbleBrain or asks what NimbleBrain is\nhiring for, before calling careers_submit_application. It returns who NimbleBrain is, each\nopen role (id, title, location, type, summary), the question every applicant\nanswers, and what an application needs. When no role is open, say so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "description": "Who is hiring, in their own words.",
                "type": "string"
              },
              "how_to_apply": {
                "description": "What an application needs and what happens after.",
                "type": "string"
              },
              "question": {
                "description": "The question every applicant answers in `note`.",
                "type": "string"
              },
              "roles": {
                "description": "The open roles. Empty when none are open.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Pass this as `role` to careers_submit_application.",
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Such as contract to hire. Null when not set."
                    }
                  },
                  "required": ["id", "location", "summary", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["about", "how_to_apply", "question", "roles"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ebb08f44d467b70a4dc189109b12fff16e16c025929acb65a2ad318dcac977bd"
        },
        {
          "name": "careers_submit_application",
          "title": "Send an application to NimbleBrain",
          "description": "Send a NimbleBrain job application for the person to confirm.\n\nCall this only after the person has seen exactly what will be sent and said to send it.\nDo not use it to ask questions about a role; careers_list_roles answers those. It checks\nevery field and either refuses with a list of what to fix (`bad_input`), or holds the\napplication and returns a `confirm_url`. Nothing reaches NimbleBrain until the person\nopens that link within an hour and passes a quick human check, so always give them the\nlink. One application per email address every 60 days (`conflict`). If a required field\nis missing, ask the person for it rather than guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The applicant's email address. NimbleBrain replies here.",
                "type": "string"
              },
              "name": {
                "description": "The applicant's full name, one line.",
                "type": "string"
              },
              "note": {
                "description": "Required. The applicant's answer to the `question` that careers_list_roles returns, 50 to 300 words, in their own words. Ask it word for word. Help them tighten an answer they wrote; never write one for them.",
                "type": "string"
              },
              "profile_url": {
                "default": "",
                "description": "Optional. An https link to the applicant's LinkedIn, GitHub, or personal site. Leave empty if they have none.",
                "type": "string"
              },
              "resume_url": {
                "description": "An https link to the applicant's resume, a PDF or a document. It must open for someone who is not signed in: a public document, not a private file.",
                "type": "string"
              },
              "role": {
                "description": "The `id` of an open role, from careers_list_roles.",
                "type": "string"
              }
            },
            "required": ["email", "name", "note", "resume_url", "role"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirm_url": {
                "description": "Give this to the person; nothing is sent until they open it.",
                "type": "string"
              },
              "expires_in_minutes": {
                "type": "integer"
              },
              "next_step": {
                "type": "string"
              },
              "status": {
                "const": "awaiting_confirmation",
                "type": "string"
              }
            },
            "required": ["confirm_url", "expires_in_minutes", "next_step", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
