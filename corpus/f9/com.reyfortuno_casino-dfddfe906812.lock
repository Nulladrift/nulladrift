      "instructions": "Casino online argentino (reyfortuno.com). Servidor público de sólo lectura: lista los juegos del lobby, la cartelera de pronósticos deportivos (Prode) con sus cuotas, y verifica jugadas \"provably fair\" (HMAC-SHA256). No permite apostar ni ver cuentas. Juego sólo para mayores de 18 años; jugá con responsabilidad.",
      "tools": [
        {
          "name": "juegos",
          "title": "Juegos",
          "description": "Lista los juegos disponibles en Rey Fortuno (slots, mesas, crash, deportes…), con su categoría, descripción y link. Filtro opcional por categoría o texto.",
          "inputSchema": {
            "properties": {
              "buscar": {
                "description": "Texto a buscar en el nombre o la descripción.",
                "type": "string"
              },
              "categoria": {
                "description": "Categoría exacta, por ejemplo \"slots\".",
                "type": "string"
              },
              "idioma": {
                "description": "Idioma de las descripciones (default es).",
                "enum": ["es", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Juegos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd477696dcff1415048e53bf0be40a694203bf24cf5f9cdb185e03ecd343d3fa"
        },
        {
          "name": "prode",
          "title": "Prode",
          "description": "Cartelera de pronósticos deportivos (Prode) de Rey Fortuno: partidos apostables con sus cuotas 1X2/ganador. Sin `deporte` devuelve los deportes con partidos.",
          "inputSchema": {
            "properties": {
              "deporte": {
                "description": "Id del deporte (66 fútbol, 68 tenis, 67 básquet…). Sin él, lista los deportes.",
                "type": "integer"
              },
              "liga": {
                "description": "Filtra por nombre de liga (contiene).",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de partidos (1-100, default 30).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Prode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ebdb87a70d75353f39a45f8b959ecde33883e2bcf6446056795334975da6cce6"
        },
        {
          "name": "verificar-jugada",
          "title": "Verificar Jugada",
          "description": "Verifica una jugada \"provably fair\" de Rey Fortuno: comprueba que SHA-256(semilla del servidor) coincide con el hash publicado y devuelve los números aleatorios [0,1) que salen de HMAC-SHA256(servidor, \"cliente:nonce:cursor\").",
          "inputSchema": {
            "properties": {
              "cantidad": {
                "description": "Cuántos floats devolver (1-64, default 8).",
                "type": "integer"
              },
              "hash_publicado": {
                "description": "Hash SHA-256 que se mostraba antes de jugar (opcional, para comprobarlo).",
                "type": "string"
              },
              "nonce": {
                "description": "Nonce de la jugada.",
                "type": "integer"
              },
              "semilla_cliente": {
                "description": "Semilla del cliente.",
                "type": "string"
              },
              "semilla_servidor": {
                "description": "Semilla del servidor revelada (después de rotarla).",
                "type": "string"
              }
            },
            "required": ["nonce", "semilla_cliente", "semilla_servidor"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Verificar Jugada"
          },
