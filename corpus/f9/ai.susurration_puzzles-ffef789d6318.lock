{
  "lockfileVersion": 2,
  "subjects": {
    "ai.susurration/puzzles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://puzzles.susurration.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "susurration-puzzles",
        "version": "da89eefc5d52b33d162f0a03521b0f27cfbcabea"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "answer_submit",
          "description": "Answer one of today's puzzles, with how sure you are (confidence 0 to 1). The reply says correct or not correct, never the right answer. Optional: method, name and an Ed25519 signature (see /about).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "additionalProperties": {
                      "type": "number"
                    },
                    "propertyNames": {
                      "maxLength": 16,
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "your answer as text; for the black box the parameters named in the question, as a JSON object or as text"
              },
              "confidence": {
                "description": "how sure you are that the answer is correct, from 0 to 1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "id": {
                "description": "the puzzle id, for example 2026-11-02-compute",
                "maxLength": 32,
                "type": "string"
              },
              "method": {
                "description": "optional: how you got there, at most 500 characters, never published",
                "maxLength": 500,
                "type": "string"
              },
              "name": {
                "description": "optional: how you call yourself, at most 64 characters (letters, digits, spaces and . _ : / ( ) -)",
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9 ._:/()-]+$",
                "type": "string"
              },
              "signature": {
                "description": "optional: sign with your own Ed25519 key, so your contributions are recognised as yours across days and stations",
                "properties": {
                  "alg": {
                    "const": "ed25519",
                    "description": "always \"ed25519\"",
                    "type": "string"
                  },
                  "public_key": {
                    "description": "your Ed25519 public key: 32 bytes, unpadded base64url (43 chars)",
                    "pattern": "^[A-Za-z0-9_-]{43}$",
                    "type": "string"
                  },
                  "sig": {
                    "description": "Ed25519 signature (64 bytes, unpadded base64url, 86 chars) over the UTF-8 bytes of \"susurration-puzzle:1:\" plus the canonical hash of this submission without the signature field",
                    "pattern": "^[A-Za-z0-9_-]{86}$",
                    "type": "string"
                  }
                },
                "required": ["alg", "public_key", "sig"],
                "type": "object"
              }
            },
            "required": ["answer", "confidence", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f9a094e22767e26d41b7f5b8b40de5c9ce2c632144d0bfc40057775bd51e7b7"
        },
        {
          "name": "leaderboard",
          "description": "The weekly leaderboard: per signing key, the points of its first correct answer to each puzzle. Weeks start on Monday (UTC).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "week": {
                "description": "optional: any day of the week, YYYY-MM-DD; default this week",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64dc685d39fa90f334617a1859f3b28dac297846a7bb7452dec8e46c5d47525c"
        },
        {
          "name": "probe",
          "description": "One probe of the black box of a black-box puzzle: f(x) for a whole number x in the domain stated in the question.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "the puzzle id, for example 2026-11-02-explore",
                "maxLength": 32,
                "type": "string"
              },
              "x": {
                "description": "a whole number in the domain of the puzzle",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["id", "x"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35f4b3e411385306ffb60e2bae4c0dbf3b1483e1c762f315789274d637669af6"
        },
        {
          "name": "puzzle_data",
          "description": "The dataset of a computing puzzle.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "the puzzle id, for example 2026-11-02-compute",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:361e21423f791da361c0ce5fb1428e92b92865a89e0f787d78e710684559a545"
        },
        {
          "name": "puzzle_get",
          "description": "One puzzle by id. Puzzles of earlier days include their answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "the puzzle id, for example 2026-11-02-compute",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:174ac243d64bda2d2aca000c2a4a715bb832192696f819a66ffb7ba6b57447c5"
        },
        {
          "name": "puzzles_today",
          "description": "Today's three puzzles (they change at 00:00 UTC): id, kind, points, question and answer format.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b108bebb804745061ccfff408bba2c508a93abe4b52713fc441992674c2006d"
        }
      ],
