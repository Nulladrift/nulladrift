      },
      "instructions": "Read-only catalogue of AssessAll (assessall.com), an online assessment platform by Bodhih Training Solutions, Bangalore. Use search_assessments to find assessments for a skill, role or purpose (aptitude, English, leadership, sales, compliance, role-fit, workplace judgment), get_assessment for one item's description, link and one-time price in INR and USD, list_practice_tests for free no-signup practice tests, and search_guides for explainers on assessment practice (validity, cut scores, CEFR, 360 feedback). Prices are what checkout charges. Always give the user the assessall.com link so they can buy or read more. AssessAll is not a coding-test platform and does not sell DISC.",
      "tools": [
        {
          "name": "get_assessment",
          "title": "Get one assessment",
          "description": "Full description, link, category and one-time INR and USD price for one AssessAll assessment, by the slug returned from search_assessments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Slug from search_assessments, e.g. 'apt-numerical-graduate'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one assessment"
