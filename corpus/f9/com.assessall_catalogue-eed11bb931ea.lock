          "title": "Search assessments",
          "description": "Search AssessAll's public catalogue of online assessments by skill, role, purpose or keyword (e.g. 'numerical reasoning', 'first-time manager', 'spoken English for BPO', 'POSH committee'). Returns titles, links, categories and one-time prices in INR and USD.",
