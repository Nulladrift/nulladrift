      },
      "transport": {
        "type": "http",
        "url": "https://inpc.rigolco.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "inpc-mexico",
        "title": "INPC y factor de actualización (México)",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Datos del Índice Nacional de Precios al Consumidor (INPC) de México, publicados por el INEGI en el DOF, de enero de 1969 a octubre de 2026. Úsalo para consultar el INPC de un mes, la inflación entre dos meses o el factor de actualización fiscal del Art. 17-A del CFF. Cita la fuente y los avisos que devuelva cada herramienta, e indica siempre que el resultado es orientativo y debe comprobarse.",
      "tools": [
        {
          "name": "calcular_factor_actualizacion_fiscal",
          "title": "Factor de actualización fiscal (Art. 17-A CFF)",
          "description": "Calcula el factor de actualización de una contribución, devolución o saldo pagado fuera de plazo, aplicando el Art. 17-A del CFF: usa el INPC del mes anterior a cada extremo del periodo, el último INPC publicado si el que toca aún no sale, trunca al diezmilésimo y aplica el piso de 1. Con importe, devuelve también el importe actualizado. No calcula recargos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "importe": {
                "description": "Importe en pesos a actualizar (opcional).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "mes_de_pago": {
                "description": "Mes en que se paga o se recibe la devolución, AAAA-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "mes_en_que_debio_pagarse": {
                "description": "Mes en que vencía el pago (o en que nació el saldo a favor), AAAA-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["mes_de_pago", "mes_en_que_debio_pagarse"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Factor de actualización fiscal (Art. 17-A CFF)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08d6de02807bea4db6b5b9a92ae147a26dfa2fbe9c4b634dd5312d52167df29c"
        },
        {
          "name": "calcular_variacion_inpc",
          "title": "Inflación entre dos meses",
          "description": "Calcula la variación del INPC (inflación acumulada) y el cociente entre dos meses concretos, sin las reglas fiscales del Art. 17-A: sirve para ajustar rentas, pensiones o contratos indexados.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mes_final": {
                "description": "Mes más reciente, AAAA-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "mes_inicial": {
                "description": "Mes más antiguo, AAAA-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["mes_final", "mes_inicial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inflación entre dos meses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ff97e5185281de3484d0311f13250e192750868ed1a7eaf1ad5ff531b7b639ee"
        },
        {
          "name": "consultar_inpc",
          "title": "Consultar el INPC de un mes",
          "description": "Devuelve el valor del INPC publicado por el INEGI (base 2a quincena de julio de 2018 = 100) de un mes. Sin mes, devuelve el último publicado. Úsalo cuando pregunten «¿cuál es el INPC de agosto de 2026?» o «¿cuál es el último INPC?».",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mes": {
                "description": "Mes AAAA-MM. Si se omite, el último INPC publicado.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Consultar el INPC de un mes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e26064b93c7e18770e5ff887aeb087450722650b165b72bb5cc2c640cd751ff5"
        }
      ],
      "digest": "sha256:9676dd619cf737f11a1ff14b4a785ede7836f1f9c02ee794ab9b1a7b4e64d283"
    }
  }
}
