      },
      "instructions": "Easyparser gives you real-time, structured Amazon data across 22 marketplaces: product details, seller offers, search results, sales history, seller identities, and logistics data.\n\nDecision rules:\n1. ASIN or product URL in hand → call the specific tool directly, never search first.\n2. Only a barcode (UPC/EAN/GTIN/ISBN) → lookup_product to get the ASIN, then the specific tool.\n3. Only a product name or category → search_products to find ASINs, then drill down.\n4. Cost awareness: most tools cost 1 credit. get_sales_history costs 5+ credits, so confirm the history depth with the user before calling. Paginated tools cost 1 credit per page, so prefer filters over extra pages.\n5. Every response includes credits_remaining. If it drops low or a call returns a rate-limit error, tell the user to get a free key at https://app.easyparser.com/signup.\n6. If unsure which tool fits, call list_operations: it is free and works without a key.\n7. Bulk jobs: use list_bulk_jobs to see the user's bulk extraction jobs (including ones started from the Easyparser web app), get_bulk_job_items to debug failed items inside a job, get_bulk_item_result to fetch an item's parsed data (results expire; regenerate via the matching real-time tool if expired), and get_bulk_webhook_logs when a completed job's webhook never arrived. These monitoring tools are free.",
      "tools": [
        {
          "name": "check_credits",
          "description": "Check the Easyparser account: current plan, credit balance (used/remaining/limit), credit reset date, per-minute rate limits, and this month's daily usage breakdown by operation. FREE: this calls the Account API and consumes no credits.\n\nUse this before running expensive multi-page or 12-month-history jobs, when the user asks about their quota or plan, or to analyze usage patterns (e.g. 'which operation consumed the most credits this month?'). Requires an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "JSON response from the Easyparser Data Service or Account API. Non-object payloads are wrapped as { result }.",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16c69b5d74a1381c6afb3b67a1dfed7311122949841f17547eec6cb433bf285c"
        },
        {
          "name": "get_bestseller_rank",
          "description": "Get a product's current Best Sellers Rank (BSR): its numerical rank in main categories and sub-category node identifiers. A lightweight, single-purpose tool for popularity and demand tracking.\n\nUse this tool when you only need the rank, e.g. 'Is this product selling well?' or daily rank monitoring. Lower rank number means higher sales velocity. If you also need price, rating or content, use get_product_detail instead (it includes BSR along with everything else). For historical rank trends, use get_sales_history. Costs 1 credit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "Amazon Standard Identification Number, a 10-character alphanumeric product identifier (e.g. B0CJB6V2L5). Found in the product URL after /dp/ or /gp/product/.",
                "pattern": "^[A-Z0-9]{10}$",
                "type": "string"
              },
              "domain": {
                "default": ".com",
                "description": "Amazon marketplace domain extension. Determines the regional Amazon site the data is fetched from. Use the domain that matches the user's market, because prices, availability and rankings differ across marketplaces.",
                "enum": [".com", ".co.uk", ".de", ".fr", ".it", ".es", ".ca", ".com.mx", ".com.br", ".co.jp", ".in", ".com.au", ".ae", ".sa", ".nl", ".pl", ".se", ".com.be", ".com.tr", ".sg", ".ie", ".eg"],
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "credits_remaining": {
                "description": "Credits left on the account after this request.",
                "type": "number"
              },
              "credits_used": {
                "description": "Credits charged for this request.",
                "type": "number"
              },
              "data": {
                "description": "Parsed Amazon data for the operation."
              },
              "operation": {
                "description": "Easyparser operation that ran, e.g. DETAIL or OFFER.",
                "type": "string"
              },
              "request_id": {
                "description": "Easyparser request ID, useful for support and error logs.",
                "type": "string"
              },
              "success": {
                "description": "True when the request completed.",
                "type": "boolean"
              }
            },
            "required": ["operation", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1fd93f837f34d8b04b7e8aaaea583005cf1d535adc21df71e979bb08debd4836"
        },
        {
          "name": "get_bulk_item_result",
          "description": "Fetch the parsed result data of a single bulk job item: the actual Amazon data that item produced (product detail, search results, seller profile, etc., depending on the job's operation). This is the same data shown in the item result modal on the Bulk Requests page of the web app.\n\nUse this tool after get_bulk_job_items, when the user wants to see the DATA behind a specific item, not just its status. Typical flow: list_bulk_jobs → get_bulk_job_items → get_bulk_item_result.\n\nIMPORTANT: bulk results are retained for 24 HOURS after the job completes, then they expire. If the item's data has expired, the tool returns a clear message; suggest re-running that item through the matching real-time tool (e.g. get_product_detail for a DETAIL item) to regenerate the data. This tool is free of per-call credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "item_id": {
                "description": "The item_id of a bulk job item. Get it from get_bulk_job_items (each item row has one). This is the same ID the Data Service calls a query ID.",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "JSON response from the Easyparser Data Service or Account API. Non-object payloads are wrapped as { result }.",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5b59bb4d50b897c472db783a41466945495888a1e23980c71c0030fc4e02706"
        },
        {
          "name": "get_bulk_job_items",
          "description": "Inspect the individual items inside a bulk job: each item's input value (ASIN, keyword, seller ID...), its status (success/failed/invalid/pending/processing), error message if it failed, credit cost, and completion time.\n\nUse this tool to debug a job after list_bulk_jobs shows failed_items or invalid_items > 0: filter with status='failed' or status='invalid' to see exactly which inputs failed and why. Use search_key to locate one specific ASIN inside a large job. The item's item_id can be used with the Data Service (GET /v1/queries/{id}) to fetch its parsed result.\n\nThis tool is free of per-call credits (monitoring endpoints do not consume credits).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "ISO date lower bound, e.g. 2026-08-01.",
                "type": "string"
              },
              "date_to": {
                "description": "ISO date upper bound.",
                "type": "string"
              },
              "group_id": {
                "description": "The job's group_id. Get it from list_bulk_jobs (each job row has one). Identifies which job's items to inspect.",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Items per page (max 1000). Default 100.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "search_key": {
                "description": "Search within item values (e.g. a specific ASIN) to find one item in a large job.",
                "type": "string"
              },
              "sort_direction": {
                "default": "desc",
                "description": "Sort by creation time. 'desc' (newest first) is default.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "status": {
                "description": "Filter items by outcome. Use 'failed' or 'invalid' to debug a partial_success job; omit to see everything.",
                "enum": ["success", "invalid", "failed", "accepted", "pending", "processing"],
                "type": "string"
              }
            },
            "required": ["group_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "JSON response from the Easyparser Data Service or Account API. Non-object payloads are wrapped as { result }.",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac7c78a05ff319e3a9df2f8bbf026369624f2e7887d52dc3d8d1083db0b8fd87"
        },
        {
          "name": "get_bulk_webhook_logs",
          "description": "Check webhook delivery logs for bulk jobs: whether the completion notification was delivered to the user's callback_url, delivery status, and timestamps. Use this when a job shows as completed but the user's system never received the webhook. This is the classic \"job finished but my integration didn't fire\" debugging case.\n\nScope to one job with group_id (from list_bulk_jobs), or omit it to scan recent deliveries across all jobs. This tool is free of per-call credits.",
