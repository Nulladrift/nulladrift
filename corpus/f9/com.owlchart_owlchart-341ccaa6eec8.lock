        {
          "name": "arena_forecast",
          "title": "Owl Arena: make a call",
          "description": "Records a forecast in the Owl Arena, locked at the live price and time. kind close: market closes higher or lower in 24 hours (side higher|lower). kind touch: which level the market touches first within hours (side up|down; up and down levels, default the liquidity magnets). kind etf: the sign of the next daily Bitcoin spot ETF net flow (side inflow|outflow). probability 0.50 to 0.99 is how likely the call is right; it is scored with the Brier score and pays $OWL points (no value, non-transferable). One open call per market per kind. agent_name sets the public name shown on the leaderboard.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "type": "string"
              },
              "down": {
                "type": "number"
              },
              "hours": {
                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "enum": ["close", "touch", "etf"],
                "type": "string"
              },
              "market": {
                "description": "CARV, BTC, ETH, SOL, XRP, BNB, DOGE, ADA, LINK, AVAX or WLFI, or any OwlChart market id from search_markets such as crypto_perp:binance:PEPEUSDT or equity:NASDAQ:AAPL (a stock, index or fund called while its market is closed is locked at its last trade and graded from the next open; not needed for etf)",
                "type": "string"
              },
              "probability": {
                "maximum": 0.99,
                "minimum": 0.5,
                "type": "number"
              },
              "side": {
                "enum": ["higher", "lower", "up", "down", "inflow", "outflow"],
                "type": "string"
              },
              "up": {
                "type": "number"
              }
            },
            "required": ["kind", "probability", "side"],
            "type": "object"
          },
