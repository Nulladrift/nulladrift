        {
          "name": "get_agent_knowledge",
          "title": "Agent knowledge",
          "description": "Platform rules for the agent, as short lines to put into your prompt. Call it once and cache it by `rev`; re-read when the platform pokes you or when your fallback poll comes due. Without `ids` you get ALL active rules for the audience, short form only — YOU pick which ones belong in a given answer (no more than three fit a prompt). With `ids` you get the full text of those rules instead, including RETIRED ones, flagged `retired: true` — so your log of «which rules were in this answer» stays readable after a rule is switched off weeks later. Ask for up to 50 ids at once: three is what fits a PROMPT, a review screen needs more. off. A retired rule must never go back into a prompt. If this door is silent, answer without rules: that is the normal state and must change nothing in your behaviour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Which agent asks. Defaults to widget. Rules marked for both arrive in either case.",
                "enum": ["widget", "cabinet"],
                "type": "string"
              },
              "ids": {
                "description": "Ids of rules whose FULL text you need — up to 50 per call (that is a review screen, not the whole knowledge base; call without `ids` for all active rules). Retired rules are returned too, flagged. An id that is a valid uuid but no longer exists is simply ABSENT from the answer — compare lengths, one dead id never costs you the other texts. A string that is NOT a uuid is different: it fails the whole call with `validation_failed` naming its position (`ids.1`), so filter your ids by uuid shape before calling if they come from a log.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a390b590477318d81fbf36bf8681bfa1749f5ccf179039d1491133c3375087e"
        },
        {
          "name": "get_buyer_search_offer",
          "title": "Buyer-search packages and prices",
          "description": "Read the buyer-search package offer — what the person buys in the «find buyers» order window: plans with prices in USD, company quotas, country limits, top-up rules, roles, the order stages and — for an HS code — the clarifying question and the buyer segments that fit each answer. These are prices of the BUYER-SEARCH PACKAGE, shown openly in the order window; they are not Gemalli subscription plans, so the get_subscription_plans rule about never stating prices does not apply here. Use it in the sales chat to answer questions and to suggest a plan and segments. You only suggest: the person chooses and pays in the order window, never through you. Right now it is a demo — payment is a test with no charge, company search and emails are switched off — say so plainly and never promise buyers: a company becomes a buyer only by answering. Texts come in the call locale (uk, ru, en; others fall back to en).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hs_code": {
                "description": "HS code of the product from the page context (2 to 10 digits) — picks the clarifying question and the segments.",
                "type": "string"
              },
              "locale": {
                "description": "Language of the texts: uk, ru or en (others fall back to en).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:707a59afc44ece9dd8fd8fdef61a513c26939b7c964f8a056192eab9c35e6941"
        },
        {
          "name": "get_feedback_reasons",
          "title": "Feedback reasons",
          "description": "Reasons a person can pick after rating the agent. Call it once when the widget opens and cache it; re-read when the platform says the dictionary changed, or lazily by the `rev` value. Two lists: `reasons` are the live ones to draw in the window, `retired` are switched off and are only there so old feedback stays readable. 🔴 `label` is the best text WE have for the asked language and may fall back (`lang` says to what). `source_label` is what the admin actually WROTE and `source_lang` is the language they wrote it in — translate from THAT, never from `label`: translating our fallback would make a translation of a translation, losing a little at every step. When a card is shown untranslated, send `reason_shown_lang` with the rating so a reason picked blindly can be told from one picked on purpose. If this door is silent, show the free-text field anyway and still count the thumb — never drop a rating.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the person, e.g. ru / uk / de-AT. Falls back exact → base → English, never Russian.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
