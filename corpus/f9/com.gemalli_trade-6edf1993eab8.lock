        {
          "name": "create_feedback_ticket",
          "title": "Send feedback",
          "description": "Record a feedback ticket for the Gemalli team: a question, a problem or a suggestion. Call it ONCE, only after the person confirmed the wording you read back to them. Identity is taken from the visitor pass — never pass a user id. For a visitor who is not signed in, contact_email is required: without it there is no way to tell them it was fixed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact_email": {
                "description": "Required when the visitor is not signed in",
                "type": "string"
              },
              "kind": {
                "description": "question = asks something · bug = something is broken · idea = suggestion",
                "enum": ["question", "bug", "idea"],
                "type": "string"
              },
              "locale": {
                "description": "Language to answer in, e.g. ru / uk / en",
                "type": "string"
              },
              "message": {
                "description": "The request in the person’s own words",
                "maxLength": 4000,
                "type": "string"
              },
              "page_url": {
                "description": "Platform page the person was on",
                "type": "string"
              },
              "subject": {
                "description": "Short summary as you understood it",
                "maxLength": 200,
                "type": "string"
              },
              "transcript": {
                "description": "Last turns of the conversation (max 20 turns / 8000 chars; longer is trimmed, not rejected)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "at": {
                      "description": "ISO timestamp of the turn. Send it: without timestamps we cannot tell this topic from an earlier conversation and simply take the last turns.",
                      "type": "string"
                    },
                    "role": {
                      "enum": ["user", "agent"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["kind", "locale", "message", "subject"],
            "type": "object"
          },
