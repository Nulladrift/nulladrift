        {
          "name": "check_dual_use",
          "title": "Dual-use check",
          "description": "Check whether an HS customs code falls under EU dual-use export controls (Regulation 2021/821 and equivalents), optionally for a specific destination country. A match means the goods may need an export licence. Use it after lookup_hs_code, before the person commits to a shipment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Destination country (ISO-2).",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "hs_code": {
                "description": "HS code from lookup_hs_code.",
                "pattern": "^[0-9]{2,10}$",
                "type": "string"
              },
              "locale": {
                "enum": ["en", "uk", "ru"],
                "type": "string"
              }
            },
            "required": ["hs_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b4bb51067c5048d75da802593594860b7572178da989dce9974ccd0e0d887be"
        },
        {
          "name": "check_sanctions",
          "title": "Sanctions screening",
          "description": "Screen a company or a person against consolidated sanctions, politically-exposed-person and law-enforcement lists (EU, US, UK, UN, Ukraine), sourced from OpenSanctions. Returns possible matches with a similarity score. Use it before the person commits to a counterparty. Treat a match as a reason to verify further, not as proof.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, alias, or company string to screen.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "enum": ["sanction", "pep", "crime", "export", "other"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
