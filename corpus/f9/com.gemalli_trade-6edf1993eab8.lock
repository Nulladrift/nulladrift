        {
          "name": "rate_agent_result",
          "title": "Rate the agent",
          "description": "Record what a person thought of something the agent produced — a reply, an export, a report, an email. Send it as soon as they press the thumb: the reason and their words are optional and may follow in a second call, which replaces the first. Pick `reason_code` from get_feedback_reasons; an unknown code is dropped and the rating is still saved (`reason_dropped: true`). For `target_kind: \"report\"` the `target_ref` is the view_key, NOT the report_key — one report is read by many country pages and only the view_key tells them apart. `target_ref` is verified against your own message log: the answer carries `ref_check` saying whether it matched (`verified`), did not (`mismatch`), could not be checked (`unchecked`) or was never sent (`absent`). A rating is never dropped because the check failed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "comment": {
                "description": "Their own words. Optional. Trimmed at 2000 characters.",
                "type": "string"
              },
              "knowledge_ids": {
                "description": "Ids of the platform rules that were in the prompt for this answer, up to 50. This is how a harmful rule gets noticed from a single complaint.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "model": {
                "description": "Which model produced the rated answer.",
                "type": "string"
              },
              "probe": {
                "description": "True when the call comes from a test run rather than a person. 🔴 Derive it from the process you run in — do not set it by hand: a flag someone has to remember is a flag someone forgets. The rating is still STORED; it is hidden behind a switch on the triage screen, because dropping it on arrival would lose what later needs explaining. Omit the field when you cannot tell — absent means \"not stated\", never \"a person\".",
                "type": "boolean"
              },
              "reason_code": {
                "description": "A code from get_feedback_reasons.",
                "type": "string"
              },
              "reason_shown_lang": {
                "description": "Language the person actually SAW the reason card in — send it together with `reason_code`, never alone. It exists so that \"they picked this reason\" can be told apart from \"they tapped something they could not read\": when the card had not been translated yet, the language differs from the visitor locale. Omit the field entirely rather than sending an empty string — absent means \"not stated\", which is a different answer from \"in their own language\".",
                "type": "string"
              },
              "signal": {
                "description": "thumb (default) for a pressed thumb; undone when they cancelled the result; rephrased or left for the quiet signals. The weight is set by the platform, not by you.",
                "enum": ["thumb", "undone", "rephrased", "left", "note"],
                "type": "string"
              },
              "surface": {
                "description": "Where it happened, e.g. widget.",
                "type": "string"
              },
              "target_kind": {
                "description": "What was rated: answer | export | report | email | any future kind.",
                "type": "string"
              },
              "target_ref": {
                "description": "Your identifier of the rated work: the message id for an answer, the view_key for a report. Omit it only when the kind has none.",
                "type": "string"
              },
              "topic": {
                "description": "What the exchange was about, one short phrase.",
                "type": "string"
              },
              "verdict": {
                "description": "The thumb the person pressed. Send \"retracted\" (or an empty string) when they pressed the same thumb again and took the rating back — it then stops counting and leaves the triage queue. Retracting needs the same target_ref as the rating it undoes.",
                "enum": ["up", "down", "retracted", ""],
                "type": "string"
              }
            },
            "required": ["surface", "target_kind", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf939965f35b6babaf7851ab883955adc7c2a73a4aa7daf3792bd7c401fe4e6e"
        },
        {
          "name": "remember_about_person",
          "title": "Remember about the person",
          "description": "Remember something stable about THIS person, so the next conversation does not start from zero. Allowed keys, and only these: role, industry, delivery_place, language, price_attitude, doc_requirements. An unknown key is reported back by name and the other facts in the same call are still stored. `source` must say where it came from: `human` if the person stated it, `model` if you inferred it. 🔴 It is not a label: it decides whether the write lands. What the person stated outright overwrites anything; an inference overwrites only another inference. A `model` write onto a trait the person stated themselves comes back with `why: \"person_said_it\"` and `current` holding what they said — ask them about the discrepancy instead of deciding for them. Within one source the newer value always wins, so a person who changed where they ship stops being remembered with the old place. the person stated it, `model` if you inferred it. `recall` is the one-line outcome of this conversation (\"looked for 500 m of cable to Berlin, left no enquiry\"). Do NOT send name, email or phone — they are not kept here: a copy that never updates would have the agent writing to a stale address. Do NOT send the product, volume, deadline or spec either — those belong to the enquiry and change every time. The person is taken from the visitor token; a guest gets `sign_in_required`. The answer says per key whether it was stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facts": {
                "description": "Stable traits of the person. Up to six distinct keys.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "description": "role | industry | delivery_place | language | price_attitude | doc_requirements",
                      "type": "string"
                    },
                    "source": {
                      "description": "`human` — the person said it outright; `model` — you inferred it.",
                      "enum": ["human", "model"],
                      "type": "string"
                    },
                    "value": {
                      "description": "A few words, not a paragraph — anything beyond 200 characters is cut, not rejected.",
                      "type": "string"
                    }
                  },
                  "required": ["key", "source", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "recall": {
                "description": "One line on how this conversation ended. Cut at 300 characters.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
