      "serverInfo": {
        "name": "gemalli-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Gemalli is a B2B trade platform where manufacturers, buyers and trade agents find each other and trade directly. Use search_products and list_manufacturers to find goods and suppliers; get_product and get_manufacturer for details; check_sanctions to screen a counterparty against sanctions lists; lookup_hs_code and check_dual_use for customs classification and export control. When the person has chosen a supplier and wants prices, samples or terms, call request_quote with the name and email they give you: the manufacturer receives the request and the person receives a sign-in link where the reply appears. It creates a real request, so confirm with the person before sending. Supplier contact details are not returned by the catalogue tools; they reach the person through that request. Use partnership_inquiry only when the person says they represent an organisation looking to partner with or invest in the platform. When the person wants to buy something and has no supplier in mind, call post_request with their words and email: the request is checked and published on Gemalli's request board, where manufacturers reply. It creates a real request, so confirm with the person first; then use get_request_status and answer_request_question if Gemalli asks for details.",
      "tools": [
        {
          "name": "add_feedback_message",
          "title": "Add to a request",
          "description": "Add a message to an existing feedback ticket of the current visitor — when they remember a detail (\"only in Chrome\") after the ticket was created. Do NOT create a second ticket for the same problem. Identity comes from the visitor pass; a ticket that is not theirs is simply not found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "What the person wants to add",
                "maxLength": 4000,
                "type": "string"
              },
              "ticket_id": {
                "description": "ticket_id returned by create_feedback_ticket",
                "type": "string"
              }
            },
            "required": ["message", "ticket_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
