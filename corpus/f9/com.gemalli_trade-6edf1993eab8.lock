        {
          "name": "get_product",
          "title": "Product details",
          "description": "Fetch one product's trade terms: minimum order quantity, lead time, Incoterms, HS code, packaging, price range, photos and the supplier it belongs to. `delivery_terms` lists the delivery bases the seller confirmed as {incoterm, place_kind, place_city}: place_kind is seller_site | port | border | buyer_site (null when not stated), place_city is the city name in the requested language (English fallback) or null; an empty list means Incoterms on request. `specs_display` carries the product characteristics ALREADY IN THE REQUESTED LANGUAGE ({key, label, value}) — retell those, never copy the raw `specs` tokens. Use it once the person has picked a product from search_products and wants the terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
