        {
          "name": "search_products",
          "title": "Search products",
          "description": "PARTIAL RESULTS: `count` is how many came back, `total` how many match in all. If `has_more` is true you are looking at a slice — raise `limit` (up to 50), page with `offset`, or say you checked the first N of M. Do NOT report that nothing matches based on a partial slice. Search wholesale products published on Gemalli. Narrow by free text, category, manufacturer, country of origin, maximum minimum-order quantity, maximum price or delivery basis (Incoterms 2020 codes the seller confirmed). Returns product cards in the requested language with price range, minimum order and the supplier. Use it when the person is looking for GOODS to buy or source. When the question is about the COMPANIES themselves — who makes something, which factories or producers are on the platform — use list_manufacturers instead: this tool returns goods, and a list of goods is not an answer about companies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
