                "description": "The email the request was posted with.",
                "format": "email",
                "type": "string"
              },
              "request_code": {
                "description": "The request_code returned by post_request.",
                "type": "string"
              }
            },
            "required": ["answer", "request_code"],
            "type": "object"
          },
