        {
          "name": "add_tracked_keywords",
          "description": "Add one or more SERP keywords to a brand's rank tracking. Idempotent on the SERP identity (domain+keyword+device+location). Defaults to the active brand. Requires TRADITIONAL_SEO_ENABLED / DataForSEO credentials and the platform:write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand_name": {
                "description": "Brand to add keywords to. Defaults to active brand.",
                "type": "string"
              },
              "device": {
                "description": "Default device. 'desktop'.",
                "enum": ["desktop", "mobile"],
                "type": "string"
              },
              "keywords": {
                "description": "Keywords to track - plain strings or {keyword, device?, location?} objects.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "device": {
                          "enum": ["desktop", "mobile"],
                          "type": "string"
                        },
                        "keyword": {
                          "type": "string"
                        },
                        "location": {
                          "type": "string"
                        }
                      },
                      "required": ["keyword"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "location": {
                "description": "Default location (2-letter code or name). 'us'.",
                "type": "string"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add Tracked Keywords"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
