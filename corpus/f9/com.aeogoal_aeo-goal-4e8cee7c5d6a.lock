        },
        {
          "name": "add_tracked_prompts",
          "description": "Add one or more AI prompts to a brand's tracking so AEO Goal starts monitoring brand citations for them. Idempotent - an already-tracked prompt is re-activated, not duplicated. Defaults to the active brand when brand_name is omitted. Requires the platform:write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand_name": {
                "description": "Brand to add prompts to. Defaults to the active brand.",
                "type": "string"
              },
              "prompts": {
                "description": "Prompts to track. Each item is either a plain string or an object {text, funnel_stage?, persona?, platforms?}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "funnel_stage": {
                          "enum": ["top", "mid", "bottom", "unknown"],
                          "type": "string"
                        },
                        "persona": {
                          "type": "string"
                        },
                        "platforms": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "source": {
                "description": "Optional provenance tag stored on each new prompt (e.g. 'mcp', 'keyword_research').",
                "type": "string"
              }
            },
            "required": ["prompts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
