        {
          "name": "generate_content",
          "description": "Generate AEO/blog content DRAFTS from a brand's data. Provide any of: titles (explicit topics), from_prompt_ids (tracked prompts to answer), from_keyword_gaps=true (auto-draft for prompts where competitors are cited but the brand isn't), and reference_urls (evidence to ground the draft). Drafts are queued async and saved UNPUBLISHED - poll with get_content_job and review at /app/blogs. Requires the content:write scope and an active paid plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aeo_instructions": {
                "description": "Optional extra AEO guidance applied to every draft in this call.",
                "type": "string"
              },
              "brand_name": {
                "description": "Brand to generate for. Defaults to the active brand.",
                "type": "string"
              },
              "from_keyword_gaps": {
                "description": "If true, auto-draft for the brand's zero-rank citation gaps.",
                "type": "boolean"
              },
              "from_prompt_ids": {
                "description": "Tracked-prompt ids to turn into drafts (must belong to the brand).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reference_urls": {
                "description": "Up to 5 HTTP(S) URLs used as grounding evidence for title-based drafts.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "titles": {
                "description": "Explicit article titles/topics to draft.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "web_grounding": {
                "description": "Opt-in premium: verify each draft's citations against live web sources (costs extra AI credits per draft). Degrades to the ungrounded base draft at no extra charge if the user is over their AI-query cap. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate content drafts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
