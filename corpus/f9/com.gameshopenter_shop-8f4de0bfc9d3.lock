{
  "lockfileVersion": 2,
  "subjects": {
    "com.gameshopenter/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gameshopenter.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gameshop-enter",
        "title": "Gameshop Enter — retro Nintendo & Pokémon TCG shop (ships worldwide)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live catalog access for Gameshop Enter (gameshopenter.com). Use search_products to find games/consoles/TCG with EUR prices and buy URLs (pass the buyer's country for that country's store, currency and language), get_product for one SKU, get_quote for an all-in delivered price to any country we ship to (EU and 191 non-EU), store_info for shipping/returns/payment. Read-only; checkout happens on the returned URLs.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get one product by SKU",
          "description": "Fetch current price, stock and details for one Gameshop Enter product by its SKU (as returned by search_products). Includes the product-page URL (url) and a direct checkout link (checkoutUrl) that puts the item in the cart and opens checkout; with the buyer's country, url and local follow that country as in search_products.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO-2 country of the buyer, e.g. \"SG\", \"US\", \"AU\", \"DE\". A country with its own store (US, CA, AU, NZ, SG, HK, CH, IL, AE, SA …) gets url on that store and, where that store charges in its own currency, local with the price in it (SGD for SG); another country gets url in its own language (German for DE). Omit for the Dutch product page in EUR.",
                "type": "string"
              },
              "sku": {
                "description": "Product SKU, e.g. \"GBA-177714825902\"",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a4015b8df1367ac7e48af343fa9d3a667e112c34048b03ac42ec605f1632605"
        },
        {
          "name": "get_quote",
          "title": "All-in price quote, delivered to any country we ship to",
          "description": "Answer \"what does this cost in total, delivered?\" — items, the exact checkout shipping tier, any running promotion and the total in EUR, for any of the 219 destination countries (all 27 EU countries plus Monaco, US, CH, AU, NZ, HK, SG, LI, IL, AE, SA, QA, KW, CA, PR, CL, GB, MX, NO, PH, MY, CO, PE and 169 more countries worldwide; for the US the import duties are included). Pass the same SKU twice for quantity 2. Includes a checkoutUrl. For a country with its own store and currency (US → USD, CH → CHF, AU → AUD, NZ → NZD, HK → HKD, SG → SGD, IL → ILS, AE → AED) the quote also carries `local` (the same amounts in that currency at the fixed shop rate the store charges) and `storeUrl` (that country's store); item URLs then point to the product pages in that store.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-2 destination country, e.g. \"NL\", \"BE\", \"DE\" (default \"NL\")",
                "type": "string"
              },
              "skus": {
                "description": "Product SKUs from search_products; repeat a SKU for quantity",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["skus"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a0eaac890770272ea1ec655fd208b553a81b3bcc317f070c08770b638d2962a"
        },
        {
          "name": "search_products",
          "title": "Search the Gameshop Enter catalog",
          "description": "Search the live catalog of Gameshop Enter — original retro Nintendo games, consoles, PlayStation 4/5 games and Pokémon TCG, all personally tested, shipping to all 27 EU countries plus Monaco, to 22 countries outside the EU with their own store (US, CH, AU, NZ, HK, SG, LI, IL, AE, SA, QA, KW, CA, PR, CL, GB, MX, NO, PH, MY, CO, PE) and to 169 more countries worldwide. Understands abbreviations (\"gba\"), Dutch and English game names, typos, and Pokémon version names in German, French, Italian and Spanish (\"pokemon feuerrot\", \"pokémon rubis\"). Returns products with price in EUR, stock status, the product-page URL (url) and a direct checkout link (checkoutUrl) that puts the item in the cart and opens checkout. Pass the buyer's country to get the product pages of that country's own store with the price in its currency (local), or the product pages in the buyer's language.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO-2 country of the buyer, e.g. \"SG\", \"US\", \"AU\", \"DE\". A country with its own store (US, CA, AU, NZ, SG, HK, CH, IL, AE, SA …) gets url on that store and, where that store charges in its own currency, local with the price in it (SGD for SG); another country gets url in its own language (German for DE). Omit for the Dutch product page in EUR.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, cap 25)",
                "type": "integer"
              },
              "maxPrice": {
                "description": "Optional maximum price in EUR",
                "type": "number"
              },
              "platform": {
                "description": "Optional platform filter, e.g. \"Game Boy Advance\", \"N64\", \"Switch\"; abbreviations work too (ds, 3ds, gba, gbc, snes, nes, wii, wii u, gamecube, ps4, ps5, tcg). \"ds\" means Nintendo DS only (not 3DS), \"wii\" means Wii only (not Wii U).",
                "type": "string"
              },
              "query": {
                "description": "Game title, character, franchise or SKU",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de1cc33274bd84e17b9259862d266c5ceb1c0a2f4d679536e9edae44a1dff48f"
        },
        {
          "name": "store_info",
          "title": "Store, shipping and returns information",
          "description": "Shipping costs and delivery times per country (EU and 191 non-EU destinations), free-shipping thresholds (EU only), customs rules outside the EU, 30-day return policy, payment methods, languages and the public profiles where Gameshop Enter can be verified. Pass the buyer's country to get a `country` block with that destination's store, shipping tiers (EUR), delivery time, customs rule, payment methods, currency, return rule, the market profile in the buyer's language and that market's pages on reviews (is the shop legit), the 6-point authenticity check and who runs the shop.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO-2 country of the buyer, e.g. \"AU\", \"DE\", \"US\", \"JP\" — any country we ship to.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:518bdde2a54c4f4334453c2573bcdacbc1801ccd007da2d07bd34bdfb568af55"
        }
      ],
      "digest": "sha256:6d66b122b5a942ea2e73445c7baf3f3bd7f330369e00f3129b1bb74d7736bbf9"
    }
  }
