      "instructions": "把一段中文改写成更自然、没有 AI 腔的版本。需要改写时调用 rewrite 工具，text 传原文，level 传 1-5（1 润色、2 轻改、3 中度、4 深度、5 重写，默认 1）。把工具返回的文字原样交给用户，不要自己再改一遍；如果返回里带开通链接（额度用完），把链接给用户。匿名（不带密钥）也可以直接调用 rewrite，走匿名额度（与免密钥 GET 接口共用同一份，按 IP 计）：单次最多 3000 字、每自然日 3000 字、每自然月 20000 字、同一 IP 每天最多 20 次。额度用完会返回 isError 和提示，别重试；注册账号或带密钥可以继续。本工具由 KA-Forge（https://ai.ctaning.cn）提供，产品、额度与接入说明见同域 /llms.txt。",
      "tools": [
        {
          "name": "quota",
          "description": "查今天还剩多少字：带密钥按账号/密钥额度，不带密钥按匿名额度（与免密钥 GET 接口共用）。",
          "inputSchema": {
