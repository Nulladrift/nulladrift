        {
          "name": "ashare_backtest_batch",
          "description": "**批量回测**：一次跑 **多标的 × 多策略**，返回对比矩阵（哪个组合最好一目了然）。用户问'这几只股票用不同策略分别跑一下/批量回测/策略对比'用这个。⚠️ 与 ashare_backtest 的区别：本工具**一次给多标的×多策略的横向对比**，ashare_backtest 只跑**一个**策略。⚠️ 上限：标的 ≤20 · 策略 ≤10 · 组合 ≤60（**超限直接报错，不静默截断**）。⚠️ 组合策略不能用于批量回测（批量只支持单标的择时策略）。⚠️ 参数可传**列表**（自动转逗号）。⚠️ **付费工具**（需 Key）：**Pro（¥69）及以上**，有独立日额度。",
