        {
          "name": "ashare_auction",
          "description": "**集合竞价**：个股 9:15–9:25 集合竞价数据，含**「竞价触及涨停 / 触及跌停」判定**。用户问'竞价分时 / 竞价怎么走的 / 集合竞价买了多少 / 哪些票竞价就涨停了 / 哪些竞价跌停'用这个。`mode` 取值：`stock` **当日竞价分时**（默认，分钟级逐笔）· `stock-history` **历史竞价分时**（秒级逐笔，需 `date`）· `volume` **当日竞价量 / 资金净额**（单点）。⭐ `is_limit_up` = 「竞价触及涨停」判定（竞价段最高价 ≥ 涨停价，涨停价取自行情源原始值）；⭐ `is_limit_down` = 「竞价触及跌停」判定（竞价段最低价 ≤ 跌停价，跌停价同样取自行情源原始值）。另含 `up_px` 涨停价 / `down_px` 跌停价 / `hprice` 竞价段最高价 / `lprice` 竞价段最低价 / `open_px` 09:25 撮合价 / `preclose_px` 昨收。⚠️ `mode=stock` 仅当日；历史请用 `mode=stock-history` 且必传 `date`（真实交易日）。只读查询。⚠️ **付费工具**：**专业版（¥99）及以上**，标准版不可用。",
