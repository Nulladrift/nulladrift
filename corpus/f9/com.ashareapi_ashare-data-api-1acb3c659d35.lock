          "description": "**L2 大单成交明细**（当日逐笔，成交额 ≥ 阈值）：每一笔都标**主动/被动 × 买/卖**。行字段 `time` / `direction`（1 被动卖 · 2 主动买 · 3 被动买 · 4 主动卖）/ `direction_cn` / `volume`(**手**) / `amount`(**元**) / `avg_price`。顶层 `meta` 有 `money_threshold`、`total`（当日总笔数）、`truncated`、`summary`（四方向金额合计）。用户问'这票是谁在主动买/有没有人在扫货/大单是主动还是被动成交'用这个。⭐ 与 `ashare_bigorder` 的分工：bigorder 给**每分钟净额曲线**（看节奏），本工具给**逐笔明细 + 四方向拆分**（看谁打谁）。⚠️ **仅当日**（非交易日/盘前返回最近交易日，日期看行里的 `time`）。⚠️ **单次最多约 200 笔**（`total` > `returned` = 被截断）：要**全天全量**（算金额、算净流入）请用 `ashare_bigorder_flow_full`；只要最新一段（看方向）用本工具，配合 `money` 抬高阈值缩小范围。⚠️ 这是**成交口径**，不是逐笔委托、也不是十档盘口。⚠️ **机构版专属**：其他档位返回明确说明 + 升级链接。",
