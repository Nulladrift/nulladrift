          "description": "**L2 大单成交·全天完整**：把当日**全部**成交额 ≥ 阈值的大单一次拿全，不受「单次最多 200 笔」限制。用于**算全天金额**（主力净流入多少、四方向各多少）。行字段与 `ashare_bigorder_flow` 完全一致；顶层 `meta` 有 `total`（当日总笔数）/ `returned` / `deduped`（合并掉的重复条数）/ `pages` / `complete`（是否已拿全）/ `summary`（四方向金额合计，`summary_scope=all_rows`，拿全时即当日全量）。用户问'今天主力净流入多少 / 主动买和主动卖各多少 / 大单金额合计'用这个。⭐ 与 `ashare_bigorder_flow` 的分工：flow 只给最新 200 笔（快，看方向）；本工具给全天全量（慢，算金额）。**只拿 200 笔去算全天金额会算错。**⚠️ **比 flow 慢**（内部逐页取，每页约 0.8 秒）：30 万档活跃票约 20~30 秒，100 万档约 10 秒，300 万档约 2 秒 ⇒ 只要结论时建议 `money=2`（100 万）以上。⚠️ 返回量大（5000 行约 600 KB）：只要方向不要金额时，用 `ashare_bigorder_flow` 更省；确实需要全量但上下文紧张时，可用 `max_rows` 调小。⚠️ **仅当日**。⚠️ 这是**成交口径**，不是逐笔委托、也不是十档盘口。⚠️ **机构版专属**：其他档位返回明确说明 + 升级链接。",
