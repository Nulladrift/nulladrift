        {
          "name": "ashare_agent_search",
          "description": "**一句话取数 + 证据链**：把「宁德时代最近资金流入怎么样」这种自然语言问题，直接映射到**我们自己的数据端点**，返回**一行结构化数据 + 完整证据**（`value_hash` / `source_endpoint` / `params` / `as_of`），并可核验。\n⭐ **与 `ashare_evidence` 的分工**：`ashare_evidence` 是**公告/资讯/研报原文检索**（关键词搜）；本工具是**把问句变成数据查询**（资金流 / 行情 / 公告）。问'多少/怎么样/是什么'用这个；问'发了什么公告/有什么新闻'用 evidence。\n⭐ **返回 = 行数组（`data`）+ 顶部 `citations[]` + `verification[]`**：\n· `data[]` 是**扁平表**，一行 = 一条证据（`rank` / `source_endpoint` / `field_path` / `value` / `value_hash` / `as_of` / `authority_score`）\n· `citations[]` 是**完整引用**（含 `params` 原对象，可拿它 + `field_path` 重新取值核对）\n· `verification.claims[]` 是**逐条裁决**（`supported` / `unverified` 等）—— ⭐ 这是本产品与同类最大的差别：**明确告诉你哪些已验、哪些没验**\n⚠️ **`interpreted.intent_source` 必须看**：`llm` = 模型理解；`rules_fallback` / `local_rules` = 退回规则（此时能力受词表限制，复杂问法可能判不出）。\n⭐ **`readable`（可读值）**：资金流/成交额/成交量这类大数值，每行额外给 `readable`（如 `-14.26 亿元`）+ `unit` + `rule`（换算规则，可反算回原值）—— **直接引用它，别自己换算**（实测 LLM 换算 5 次错 1 次，`-1524347183` 会算成 1.52 亿）。⚠️ `value` 仍是**数据源原值、一字不改**；价格/点位类不换算（`readable=null`）。\n⭐ **`number_gate`（数字自查）**：你要据此写一段话时，按其中 `rules` 自查 —— `verbatim`（原值）/ `unit_convert`（换单位）可；`derived`（涨跌幅/同比/占比这类**自行计算的派生量**）**不可**，派生量必须来自数据源。\n⚠️ **覆盖边界（如实告知用户，别乱承诺）**：支持 **A股/港股/美股** 的**资金流（含 5/10/20 日累计）/ 行情价格 / 公告资讯 / 研报观点 / 龙虎榜 / 大宗交易 / 融资融券**，以及**多标的对比**（「宁德时代和比亚迪哪个资金流入更多」）。⛔ 不支持：板块、大盘统计、技术面（K线/指标/支撑位）、基本面（市盈率/ROE/分红/股东人数）、**归因分析**（「为什么跌」）、预测与荐股 —— 这些会**明确拒答**（`ok:false` + 原因），⛔ 不会拿别的字段凑数。\n⚠️ 取不到对应字段时**直接拒答并说明**，⛔ 绝不返回'看起来像'的其它指标。\n⭐ **`scope`（数据源范围，可选）**：`ashare`（自有数据）· `notice,news,report`（公告/资讯/研报）· `web`（网页检索，需 `X-LLM-Key`）· `wechat`（微信公众号，同 `web` + 限定公众号）。网页/微信检索可覆盖我们数据库之外的内容（行业政策、宏观解读、非 A 股公司等），⚠️ 但要客户自己的模型 key（费用由客户承担）。⚠️ 显式传 `web`/`wechat` 时**只在该通道内找**，取不到会如实 `ok:false`（⛔ 不会退回别的通道凑答案）；⛔ 暂不支持 `a2b`（浏览器渲染）/ `xhs` / `local`。\n⭐ **网页/微信检索的行**（`source_type=web_search`）：除通用字段外还给 `rerank_score`（相关性 0~3，**≥1.5 为优质**）+ `quality`（`good` / `fair`）—— 用它判断这批结果够不够好，**别只看条数**。\n⭐ **句级定位**：网页正文类证据带 `start_char` / `end_char`（字符区间），可精确回答'哪一句、第几个字符'；`end_char` 与 `value` 长度一致，**可对账**。\n⭐ **`replay=true`（重放对账，可选）**：额外调一次模型比对输出，结果标 `match` / `non_deterministic` / `not_replayable` / `skipped_no_client`。⚠️ 模型路径下通常为 `non_deterministic`（同一输入、输出字节可能不同）—— **这不代表结论不可靠**（确定性 ≠ 判断质量）。默认关闭。",
