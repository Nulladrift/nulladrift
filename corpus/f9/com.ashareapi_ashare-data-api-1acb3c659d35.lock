      "instructions": "A 股数据查询。用户问行情/财务/资金/板块/宏观/转债/ETF/新股等，用对应工具取真实数据，不要凭记忆回答。",
      "tools": [
        {
          "name": "ashare_abnormal",
          "description": "**异动 / 偏离值**（短线监管异动体系）：触发「严重异动」、「10日100% 偏离」、异动盯盘名单。用户问'今天有哪些异动股/偏离值/触发严重异动/被监控的票/短线风险股'用这个。`mode` 取值：`deviation` 偏离值热门榜（今日，默认）· `deviation_hist` 偏离值历史（需 date）· `deviation_plan` 偏离值（今日+明日两组，`group` 字段区分）· `abnormal` 异动频率+异动原因（需 date，每日全量）· `watch` 异动盯盘名单（今日）· `watch_hist` 盯盘历史（需 date）· `alert` **严重异动提醒**（今日，⭐ `reason` 为人读提醒原因，如「10日内3次异动个股」「10日内偏离值临近100%」）。⚠️ 历史类 mode 的 `date` 须为真实交易日（YYYY-MM-DD，非交易日返空）。字段：`reason` 触发规则说明 · `pct` 涨跌幅% · `board_desc` 连板 · `concepts` 概念 · `trigger_pct` 触发阈值% · `limit_price` 参考价 · `status` 异动状态 · `price` 现价 · `abn_start` 异动起始日 · `date` 数据日期。只读查询。",
