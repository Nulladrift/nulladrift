        {
          "name": "ashare_ask_user",
          "description": "**歧义时向用户提问**（结构对齐 Claude Code `AskUserQuestion`）。\\n⭐ **什么时候用**：用户只给了**模糊名称**（「平安」「腾讯」），你不确定指哪家公司时。\\n   本工具**不会替你选**，而是返回 **1–4 个带说明的选项**（如「中国平安 · 沪市主板·保险龙头」），由你转成问题问用户。\\n⚠️ **选项说明由模型生成**（需要语义：\"中国平安\"和\"平安银行\"差在哪，规则写不出来） ⇒ 带 `X-LLM-Key` 时质量最好；不带则只返回原始候选（无说明）。\\n⚠️ 返回 `needs_clarification=false` 表示**歧义已消**（模型判断只有一家可能），此时 `chosen_code` 就是答案，直接用它继续。\\n⛔ 本工具不查数据，只做消歧。拿到 code 后再调 `ashare_agent_search` / `ashare_quote`。",
          "inputSchema": {
