{
  "lockfileVersion": 2,
  "subjects": {
    "com.greetigo/birthday-reminders": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://greetigo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Greetigo",
        "title": "Greetigo",
        "version": "1.0.0",
        "websiteUrl": "https://greetigo.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Greetigo plans reminders for birthdays, work anniversaries and anniversaries. Use plan_birthday_reminders when the user gives names with dates and wants to know what is coming up or wants reminders; it returns each next date with the days until it, and a link that opens the list in Greetigo, where one press of Save makes a free account that emails the user before each date. Nothing is stored by this server. Use about_greetigo when the user asks what Greetigo is or what it costs.",
      "tools": [
        {
          "name": "about_greetigo",
          "title": "About Greetigo",
          "description": "Describes Greetigo: what it does, what the free plan holds, what the paid plan costs, and links to the home page, the employee birthday tracker and the privacy policy. Takes no input.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "free_plan": {
                "type": "string"
              },
              "links": {
                "properties": {
                  "assistants_page": {
                    "type": "string"
                  },
                  "home": {
                    "type": "string"
                  },
                  "privacy_policy": {
                    "type": "string"
                  },
                  "tracker": {
                    "type": "string"
                  }
                },
                "required": ["assistants_page", "home", "privacy_policy", "tracker"],
                "type": "object"
              },
              "paid_plan": {
                "type": "string"
              },
              "what_it_does": {
                "type": "string"
              }
            },
            "required": ["free_plan", "links", "paid_plan", "what_it_does"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Greetigo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b97866e6814628cee85e8212b5967ca01694afe17cb8d1efbddf1a26560b14f"
        },
        {
          "name": "plan_birthday_reminders",
          "title": "Plan birthday and anniversary reminders",
          "description": "For a list of people with a birthday, work anniversary or anniversary (month and day, year optional), returns each next date, the days until it, and the age or number of years it marks when a year is given, soonest first. Also returns a link that opens this list in Greetigo; nothing is saved until the user presses Save there. A Feb 29 date falls on Feb 28 in years without Feb 29. Dates that do not exist are refused with a message. Up to 100 people per call. Reads nothing and stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "people": {
                "description": "The people and their dates, 1 to 100.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "day": {
                      "description": "Day of the month, 1 to 31.",
                      "maximum": 31,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "kind": {
                      "default": "birthday",
                      "description": "birthday (default), work_anniversary or anniversary.",
                      "enum": ["birthday", "work_anniversary", "anniversary"],
                      "type": "string"
                    },
                    "month": {
                      "description": "Month, 1 to 12.",
                      "maximum": 12,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "name": {
                      "description": "The person's name, as the user says it.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "year": {
                      "description": "Optional: the year of birth, of the start date or of the wedding.",
                      "maximum": 2100,
                      "minimum": 1900,
                      "type": "integer"
                    }
                  },
                  "required": ["day", "month", "name"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "today": {
                "description": "Optional: the user's own date today, YYYY-MM-DD. Defaults to today in UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["people"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dates": {
                "items": {
                  "properties": {
                    "day": {
                      "type": "integer"
                    },
                    "days_until": {
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["birthday", "work_anniversary", "anniversary"],
                      "type": "string"
                    },
                    "marks": {
                      "description": "The age they turn (birthday) or the years it marks (anniversaries), when a year was given.",
                      "type": ["integer", "null"]
                    },
                    "month": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "next_date": {
                      "type": "string"
                    },
                    "year": {
                      "type": ["integer", "null"]
                    }
                  },
                  "required": ["day", "days_until", "kind", "marks", "month", "name", "next_date", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "save_link": {
                "type": "string"
              },
              "save_note": {
                "type": "string"
              },
              "today": {
                "type": "string"
              }
            },
            "required": ["dates", "save_link", "save_note", "today"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan birthday and anniversary reminders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56aad495c953b36fcd642e783a090882187d0a564420297dde29e72b557a59d8"
        }
      ],
      "digest": "sha256:2c5e7373cb3613784731defe79a1c75467110d5fb2d99a84c4c0b80b661c0532"
    }
  }
}
