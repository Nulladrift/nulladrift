                "description": "Include attributed global listings in addition to redistributable ATS jobs",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Results per page (1-100)",
                "type": "number"
              },
              "posted_after": {
                "description": "ISO-8601 date filter (e.g. \"2026-10-15\")",
