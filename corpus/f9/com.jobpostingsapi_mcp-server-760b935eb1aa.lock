              "country": {
                "description": "ISO-2 country code (e.g. \"US\", \"GB\", \"DE\", \"CA\")",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor for next page",
                "type": "string"
              },
              "employment_type": {
