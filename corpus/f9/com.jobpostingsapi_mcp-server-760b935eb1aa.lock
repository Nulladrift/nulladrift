          "name": "company_open_jobs",
          "description": "List all active job postings for a specific company slug or domain, with optional live ETag refresh from Greenhouse, Lever, or Ashby.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Max jobs to return (1-100)",
                "type": "number"
              },
              "refresh": {
                "default": false,
                "description": "Set to true to trigger a live ETag check against the company ATS board",
                "type": "boolean"
              },
              "slug": {
                "description": "Company slug or domain (e.g. \"stripe\", \"anthropic\", \"openai.com\", \"linear\")",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Company Open Jobs"
          },
