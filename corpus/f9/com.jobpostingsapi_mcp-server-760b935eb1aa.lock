      "instructions": "Query 19.8M+ active ATS & corporate career-site job postings across 434 sources (Greenhouse, Workday, Lever, Ashby, iCIMS, SmartRecruiters, etc.). Pass your JobPostings API key via x-api-key header, Authorization: Bearer <jp_key>, or ?apiKey=<jp_key> when calling tools/call. Claim 1,500 Free Credits ($1.50, no card required) + $2.00 Sandbox Streak bonus instantly at https://jobpostingsapi.com/signup.",
