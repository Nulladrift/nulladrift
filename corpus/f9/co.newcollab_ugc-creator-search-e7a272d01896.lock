      "serverInfo": {
        "name": "newcollab-creators",
        "title": "Newcollab Creator Search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "search_ugc_creators",
          "title": "Search vetted UGC creators",
          "description": "Searches Newcollab's directory of vetted UGC (user-generated content) creators by niche, with optional platform and country filters. Returns up to 8 creators with platform, niches, follower band, engagement and gifting preference, a handle and profile link for creators with a public profile, and a link to start a gifted creator roster on Newcollab. Use when the user wants to find UGC creators or micro-influencers for product seeding, PR packages, or TikTok or Instagram ads.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter creator country code, e.g. 'US', 'FR', 'UK'.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of preview creators to return.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "Primary vertical or category, e.g. 'skincare', 'fitness', 'supplements', 'pet products'.",
                "type": "string"
              },
              "platform": {
                "default": "tiktok",
                "description": "Target social channel.",
                "enum": ["tiktok", "instagram", "all"],
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search vetted UGC creators"
          },
          "behavior": {
