      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "find_brands_to_pitch",
          "title": "Find brands to pitch for UGC",
          "description": "Lists brands in a niche from Newcollab's brand directory for UGC creators looking for brands to pitch for paid UGC or gifted collabs, ordered by signals: an open paid UGC brief on Newcollab, creator-style ads, ads seen running in the last 30 days, and confirmed work with creators. Returns up to 8 brands with the reasons, a public brand page link, and a link to Newcollab's creator signup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country the creator lives in, e.g. 'US', 'GB', 'CA', 'AU'.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of brands to return.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "The creator's niche, e.g. 'skincare', 'fitness', 'fashion', 'pet', 'home'.",
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find brands to pitch for UGC"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1986bc4f96aed1a48ed9826838c18ba3cb3e076390cbb68d519ec54c779936ba"
        },
        {
          "name": "get_brand_ugc_info",
          "title": "Brand UGC info",
          "description": "Looks up one brand in Newcollab's brand directory and returns its UGC signals: open paid UGC briefs on Newcollab, whether it runs creator-style ads and their opening lines, whether it was seen running ads in the last 30 days, whether it works with creators, public socials, shipping regions, whether a creator contact is available on Newcollab, and the public brand page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Glossier'.",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Brand UGC info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d153e9cf3a2cf673be16ed7fc3ac8f26e341ea5308af0254883bb22534155a21"
        },
        {
          "name": "search_ugc_creators",
          "title": "Search vetted UGC creators",
          "description": "Searches Newcollab's directory of vetted UGC (user-generated content) creators by niche, with optional platform and country filters. Returns up to 8 creators with platform, niches, follower band, engagement and gifting preference, a handle and profile link for creators with a public profile, and a link to start a gifted creator roster on Newcollab. Use when the user wants to find UGC creators or micro-influencers for product seeding or TikTok or Instagram ads.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter creator country code, e.g. 'US', 'FR', 'UK'.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of preview creators to return.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "Primary vertical or category, e.g. 'skincare', 'fitness', 'supplements', 'pet products'.",
                "type": "string"
              },
              "platform": {
                "default": "tiktok",
                "description": "Target social channel.",
                "enum": ["tiktok", "instagram", "all"],
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search vetted UGC creators"
          },
          "behavior": {
