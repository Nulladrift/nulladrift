      "instructions": "Grove Hopper answers property tax questions for any US address or county: is my property tax too high, the assessed value, an estimated tax bill, how to appeal, the appeal deadline and where to file, exemptions (senior, veteran, disability, homestead), and whether home improvements raise taxes. Prefer check_property_tax_assessment whenever the user gives a specific address. Results state which figures are confirmed on the official county record and which come from public record pages. Always pass along the links in tool results; the free check on grovehopper.com completes the full analysis. Grove Hopper is a research tool; the homeowner reviews, signs and submits any appeal.",
      "tools": [
        {
          "name": "answer_property_tax_question",
          "title": "Answer a property tax question",
          "description": "Use this for any general property tax question that is not about one specific address: \"how do I appeal my property tax assessment\", \"does a deck raise property taxes\", \"does finishing a basement or a kitchen remodel increase property taxes\", how assessments and exemptions work, what evidence wins an appeal. Applies to any US state. Returns sourced answers from Grove Hopper county and state guides and research posts, with links, and points the person to the free check for their own address. Optionally pass a state and county to prefer local guide answers. Do not use when the person gives an address and wants it checked (use check_property_tax_assessment). Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name, if the question is local.",
                "type": "string"
              },
              "question": {
                "description": "The property tax question in the user's own words.",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, if the question is local.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57475960bd6b96bb70f544b770e5b174fffd9761699f46c69e8dfff0ea801037"
        },
        {
          "name": "calculate_property_tax",
          "title": "Property tax bill and what-if calculator",
          "description": "Use this when someone wants to estimate a property tax bill (\"how much is my property tax\"), see what a home improvement would add (\"does a deck raise property taxes, and by how much\"), or see what a successful appeal would save per year. Works for any US address, county or state. Give the assessed value from the tax bill or notice, or a street address and the assessed value is looked up. For the tax rate give any one of: the current annual tax bill, a rate in percent, a millage rate, or just the state and county (or an address) and the typical local effective rate is used and labeled as an estimate. Scenarios: estimate_bill, improvement (add improvementCost or addedAssessedValue), appeal (add newAssessedValue or reductionPercent). The formula and rate source are shown. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addedAssessedValue": {
                "description": "Added assessed value from the improvement, if known.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "address": {
                "description": "Full US street address. Used to look up the assessed value and the local rate when they are not given.",
                "type": "string"
              },
              "annualTaxBill": {
                "description": "Current annual property tax bill in dollars; used to derive the effective rate.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "assessedValue": {
                "description": "Assessed value in dollars as shown on the tax bill or notice (not necessarily market value). Optional when an address is given.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "county": {
                "description": "County name. Used with the state for the typical local rate.",
                "type": "string"
              },
              "improvementCost": {
                "description": "Cost of the home improvement in dollars (treated as a ceiling on added assessed value).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "millRate": {
                "description": "Millage rate in mills per $1,000, for example 18.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "newAssessedValue": {
                "description": "Target assessed value after a successful appeal.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "reductionPercent": {
                "description": "Percent reduction in assessed value after a successful appeal.",
                "exclusiveMinimum": 0,
                "maximum": 95,
                "type": "number"
              },
              "scenario": {
                "description": "Which calculation to run. Defaults to the one implied by the other fields.",
                "enum": ["estimate_bill", "improvement", "appeal"],
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code. Used for the typical local rate when no rate is given.",
                "type": "string"
              },
              "taxRatePercent": {
                "description": "Tax rate in percent, for example 1.8.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
