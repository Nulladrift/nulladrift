        },
        {
          "name": "check_property_tax_assessment",
          "title": "Check my property tax assessment",
          "description": "Use this when someone asks \"is my property tax too high\", \"is my home over-assessed\", \"what is my home assessed at\", or wants to know if they can appeal the property tax assessment on a specific US address. Works for any US address. Takes a full street address, confirms the property and county, and returns the assessed value with its tax year and source link (read from the official county record where we connect to it directly, otherwise found by a live search of county and public record pages, and it says which), an estimated annual tax bill with the rate used, what a 10% lower value would save, the appeal deadline with days left, who hears the appeal and how to file, and a result card with a button to the free Grove Hopper report (comparable sales and assessments, strongest appeal angle, unclaimed exemptions). Can take up to about 25 seconds for addresses that need the live search. Do not use for general questions with no address (use answer_property_tax_question) or for non-US properties. Read-only; nothing is filed or submitted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Full US street address with city and state, for example \"745 N 24th St, Philadelphia, PA 19130\".",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/grove-hopper-card-v1.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Checking the record...",
            "ui": {
              "resourceUri": "ui://widget/grove-hopper-card-v1.html"
            }
          },
          "digest": "sha256:cac8c4e12454dcc7961f55a8f1e8f885107fb953a03a5c881dee7ffbfa01b2fc"
        },
        {
          "name": "find_property_tax_exemptions",
          "title": "Find property tax exemptions",
          "description": "Use this when someone asks about \"property tax exemptions for seniors\", veteran or disabled-veteran property tax exemptions, disability exemptions, a homestead exemption, or a senior property tax freeze. Works for any US state and county. Takes a state, optionally a county, and the situation (senior, veteran, disabled, homestead). Returns each program with what it does, who qualifies, how and by when to apply, and source links, from Grove Hopper county research, our 50-state roundups and a live search of official pages where needed. Do not use for appealing an assessment (use get_property_tax_appeal_deadline). Can take up to about 25 seconds when the live search is needed. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name if known, for example \"Broward County\".",
                "type": "string"
              },
              "situation": {
                "description": "One of: senior, veteran, disabled, homestead. Free text is fine, for example \"65 and retired\".",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, for example \"Florida\" or \"FL\".",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:21271b5a1670482ba7d15c0070484db8d6478c44bd38958296c85e070520547a"
        },
        {
          "name": "get_property_tax_appeal_deadline",
          "title": "Property tax appeal deadline and where to file",
          "description": "Use this when someone asks for the \"property tax appeal deadline\", \"when is the last day to appeal my property tax assessment\", or where and how to file a property tax appeal. Works for any US address or county. Give a street address, or a county and state. Returns the exact deadline date with days left, the board or office that hears the appeal, the filing method, form and steps, and source links. Where a county sets deadlines per township or town (for example in Illinois, New York, New Jersey, Massachusetts and Michigan), a street address returns the date for that parcel's township or town. Where the deadline runs from the date on the assessment notice (for example in Texas, Florida, Georgia and Washington), it returns the rule and computes the exact day when given the notice date. Can take up to about 25 seconds for counties that need the live search. Do not use for exemption applications (use find_property_tax_exemptions). Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address with city and state. Optional if county and state are given. Needed to resolve a township or town.",
                "type": "string"
              },
              "county": {
                "description": "County name, for example \"Cook County\". Optional if an address is given.",
                "type": "string"
              },
              "noticeDate": {
                "description": "Mailing date printed on the assessment notice, as YYYY-MM-DD, for places where the deadline runs from the notice date.",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, for example \"IL\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
