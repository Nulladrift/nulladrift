{
  "lockfileVersion": 2,
  "subjects": {
    "com.appin60.onekeyaway/control": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://onekeyaway.appin60.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "onekeyaway",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OneKeyAway answers 'who can change this smart contract?'. Use control_map before depositing into a vault, integrating a token or bridge, listing collateral, or signing for a Safe. It reads on-chain state only: an EOA may be MPC/HSM-backed off-chain, so report 'single on-chain signer, no delay' rather than 'hot wallet'.",
      "tools": [
        {
          "name": "control_map",
          "title": "Who controls this contract",
          "description": "On-chain control path of an EVM contract or Safe: proxy type and implementation; proxy admin, beacon owner, owner(), DEFAULT_ADMIN_ROLE holders, Aave PoolAddressesProvider owner, Morpho vault curator/guardian/timelock; each resolved through ProxyAdmin, Safe threshold and signers, timelock delay or Avocado wallet; plus a verdict (SINGLE KEY, MULTISIG NO TIMELOCK, TIMELOCKED, UNRESOLVED). For a Safe address: signers, threshold, modules, guard, fallback handler, singleton. Chains: ethereum (1), optimism (10), bsc (56), unichain (130), polygon (137), sonic (146), zksync (324), hyperevm (999), base (8453), arbitrum (42161), avalanche (43114), linea (59144), berachain (80094), blast (81457), katana (747474). Free, 100 calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Contract or Safe address, 0x + 40 hex",
                "type": "string"
              },
              "chain": {
                "description": "Chain name or id, e.g. base, ethereum, arbitrum, 8453",
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:529d82bc681ab989ffba77283c3c12c47493bf262b73e4b2ed4c13fd078ff139"
        },
        {
          "name": "watch_contract",
          "title": "Email me if control of this contract changes",
          "description": "Free alerts (up to 3 contracts per email): sends a confirmation email, then an alert when the implementation, proxy admin, owner, DEFAULT_ADMIN_ROLE holders, Safe signers/threshold/modules/guard or Morpho vault timelock change. Checked about every 15 minutes. Only use with the user's own email address and their explicit consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "type": "string"
              },
              "chain": {
                "type": "string"
              },
              "email": {
                "description": "The user's own email address (they must confirm by link)",
                "type": "string"
              }
            },
            "required": ["address", "chain", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:539471cc2af46e490e443586b122d0b66aaf2904bae57fc5342f00c8c1263d39"
        }
      ],
      "digest": "sha256:4841181a1dc8456df7d15dd89c8b9938d15fbb1d9b5a6a63162d0d13cfe8599b"
    }
  }
}
