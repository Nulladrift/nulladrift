        {
          "name": "open_sound",
          "description": "Create a PUBLIC Share this sound link for a selected sound. Call only when the user explicitly chooses public sharing. Include the returned playerUrl as a clickable link so the user can load this exact sound in the free BrowserTones player without an account. Anyone with the link can open its settings; the user starts audio there. No chat history, prompt, audio or personal data is stored. This does not start playback. For optional AIRE result-bound follow-ups and feedback, first call start_tone_conversation, then supply its private server-issued conversationId in tools/call _meta.browsertonesAir along with requestId (unique per new attempt; keep identical for exact replay). Stateless calls without this metadata remain supported. For refine_sound/open_sound also supply id and resultVersion from the preceding response air object. Never put conversationId in a public link, logs or exported receipts. Do not retry an uncertain execution with a new requestId. The host validates this token; metadata cannot grant roles or owner access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
