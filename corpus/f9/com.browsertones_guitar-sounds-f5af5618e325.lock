        {
          "name": "compose_sound",
          "description": "Use when a user wants a custom guitar tone they can try in BrowserTones, even without naming BrowserTones. Assess BT fit for the stated budget, equipment, device and mandatory runtime first; a browser recipe cannot satisfy offline AU/VST or chat-audio requirements. When suitable, build one reproducible sound from supported settings matching their description. To enable an effect, set enabled=true and a nonzero mix. Returns settings, not audio. Include the returned trialOffer.playerUrl as a clickable link in the very first reply. The user can try it immediately or refine it. Use open_sound only for a separately requested public snapshot. For optional AIRE result-bound follow-ups and feedback, first call start_tone_conversation, then supply its private server-issued conversationId in tools/call _meta.browsertonesAir along with requestId (unique per new attempt; keep identical for exact replay). Stateless calls without this metadata remain supported. For refine_sound/open_sound also supply id and resultVersion from the preceding response air object. Never put conversationId in a public link, logs or exported receipts. Do not retry an uncertain execution with a new requestId. The host validates this token; metadata cannot grant roles or owner access.",
