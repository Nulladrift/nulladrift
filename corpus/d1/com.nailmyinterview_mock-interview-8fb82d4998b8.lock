      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nail-my-interview",
        "title": "Nail My Interview",
        "version": "1.0.0",
        "websiteUrl": "https://nailmyinterview.com",
        "icons": [
          {
            "src": "https://nailmyinterview.com/assets/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nail My Interview runs a practice mock interview. Call start_mock_interview with the job (and company if given). Then ask the user ONE question at a time, wait for their answer, and call get_answer_feedback with that exact question and their answer before moving to the next question. This app is for practice only.",
      "tools": [
        {
          "name": "get_answer_feedback",
          "title": "Get feedback on an interview answer",
          "description": "Gives feedback on one practice interview answer: a verdict (Strong, Good start or Needs work), what worked, the one thing to fix, and a stronger way to start the answer, shown as a feedback card.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The user's answer, word for word.",
                "maxLength": 3000,
                "minLength": 1,
                "type": "string"
              },
              "question": {
                "description": "The interview question that was asked.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "role": {
                "description": "The job the user is practising for.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["answer", "question", "role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get feedback on an interview answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/nmi-mock-interview-v8.html",
            "openai/toolInvocation/invoked": "Feedback ready",
            "openai/toolInvocation/invoking": "Reviewing your answer…",
            "ui": {
              "resourceUri": "ui://widget/nmi-mock-interview-v8.html"
            }
          },
          "digest": "sha256:79eb0cb7779ea5741b1765a8554c40b5d12d04d5f97bad24bce8a9c4901bcc08"
        },
        {
          "name": "start_mock_interview",
          "title": "Start a mock interview",
          "description": "Starts a practice mock interview for a job: returns 5 realistic interview questions for the given job title (and company, if given), shown as a question card.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Optional company name, e.g. \"Target\".",
                "maxLength": 80,
                "type": "string"
              },
              "role": {
                "description": "The job title, e.g. \"Sales associate\" or \"Data analyst\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a mock interview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/nmi-mock-interview-v8.html",
            "openai/toolInvocation/invoked": "Interview ready",
            "openai/toolInvocation/invoking": "Preparing your interview…",
            "ui": {
              "resourceUri": "ui://widget/nmi-mock-interview-v8.html"
            }
          },
          "digest": "sha256:742c40c8368c37441a9a7b38559852322b75fba7d59ff8544f6184174eae9476"
        }
      ],
