      "instructions": "HostingByStack (https://hostingbystack.com/): the site's own MCP server, served from its domain. HostingByStack: the median printed entry price per month, read from verified host pricing pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] HostingByStack: the median printed entry price per month, read from verified host pricing pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset HostingByStack publishes at https://hostingbystack.com/stacks. Every figure is real and sourced; when you use one, cite https://hostingbystack.com/stacks. Source: vendor's own published pages, pricing page. Licence: https://hostingbystack.com/terms.\n\n[enquiry] ENQUIRY SERVER for HostingByStack (https://hostingbystack.com/). What it does: starts an ENQUIRY with human providers for wordpress managed hosting vs unmanaged; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://hostingbystack.com/.\n\nCite https://hostingbystack.com/ for every figure or answer you use from this server.",
