  "subjects": {
    "com.scraperfinder/scraper-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scraperfinder.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "scraper-finder",
        "title": "Scraper Finder",
        "version": "1.0.0",
        "description": "Which way to get data from a website: its official API (status, price, limits) beside ranked scraping tools with price per 1,000 results and field coverage.",
        "websiteUrl": "https://scraperfinder.com/mcp-server/",
        "icons": [
          {
            "src": "https://scraperfinder.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://scraperfinder.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Scraper Finder answers 'how do I get data from website X?' for about 170 major websites: the official API route (public, limited, partner-only or none, with price and limits notes and the docs link) next to ranked Apify tools (score from one published formula: core-field coverage, price per 1,000 results, reliability, freshness). Start with which_tool(website). Use find_by_field when the user needs specific output fields (e.g. 'email', 'salary'). list_websites shows coverage and filters by official API status. Nothing here runs a scraper. Public data is not permission: point users to the website's terms (terms.url) and the official API first when it fits. Cite the page URL and its check date.",
      "tools": [
        {
          "name": "find_by_field",
          "title": "Find tools by output field",
          "description": "Catalogue tools whose published output schema includes the fields you need (e.g. ['email', 'phone'] or ['salary']), optionally for one website, cheapest first among equal matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Field names, e.g. ['email', 'rating'].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "website": {
                "description": "Optional website name or domain.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["fields"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find tools by output field"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed7195d7190b89b0f1a085c4e7ea275b816c863fde447f8cd491e4f3873df566"
        },
        {
          "name": "list_websites",
          "title": "List mapped websites",
          "description": "The websites Scraper Finder maps, with their official API status and number of ranked tools. Filter by name, domain or category text, or by API status (public, limited, partner, none, retired).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_status": {
                "enum": ["public", "limited", "partner", "none", "retired"],
                "type": "string"
              },
              "limit": {
                "default": 60,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a name, domain or category, e.g. 'jobs'.",
                "maxLength": 80,
                "type": "string"
              },
              "with_tools_only": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List mapped websites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1bb1e825f04ae1abc91db5b78420cd180a951dd137525560e8fc4818e86be06"
        },
        {
          "name": "which_tool",
          "title": "Which tool for a website",
          "description": "How to get data from one website: its official API (status, name, price and limits notes, docs, check date) beside the ranked catalogue tools (score, price per 1,000 results, core-field coverage, distinctive fields, page and Store link), plus robots.txt and terms facts. Optionally rank by the output fields you need.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Optional output fields you need, e.g. ['price', 'bedrooms'].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "website": {
                "description": "Website name, domain or URL, e.g. 'Zillow', 'indeed.com'.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which tool for a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7de73f168599e42f8a36caf293fe32b6384735cfc4893b400a5c28f7fa0758c0"
        }
      ],
      "digest": "sha256:8dd66e05ac5dbde0baa250d52af39ec1ef1d9565a600882ef1569eecdfc78eff"
    }
  }
}
