{
  "lockfileVersion": 2,
  "subjects": {
    "com.blinkcodes/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blinkcodes.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "blinkcodes-catalog",
        "title": "BlinkCodes catalog",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Catalog of BlinkCodes (blinkcodes.com): gift cards, service top-ups, travel eSIM. Prices in USD. Search with search_catalog, read denominations with get_product, then buy with buy_product — call it once to get x402 payment requirements (USDC on Base), sign them, and call it again with the same order_id and the signed payment_payload. Full API: https://blinkcodes.com/llms.txt.",
      "tools": [
        {
          "name": "buy_product",
          "description": "Buy a gift card, service top-up or travel eSIM and receive the delivery. Paid in USDC on Base (x402), no account and no browser. Call it twice: first with the order arguments to get payment requirements and an order_id (nothing is charged), then with that order_id plus the signed x402 payment payload to settle and receive the code.",
          "inputSchema": {
            "properties": {
              "account_number": {
                "description": "Only for products where get_product reported requires_account: the recipient account the top-up credits.",
                "type": "string"
              },
              "amount": {
                "description": "Only for products where get_product reported requires_amount; send instead of item_id.",
                "type": "number"
              },
              "email": {
                "description": "Delivery address. The code, eSIM profile or number is emailed here, and it is the only identity the order has. Required on the first call.",
                "type": "string"
              },
              "item_id": {
                "description": "Denomination id from get_product items[].",
                "type": "integer"
              },
              "order_id": {
                "description": "Second call only: the order_id returned by the first call.",
                "type": "string"
              },
              "payment_payload": {
                "description": "Second call only: the signed x402 PaymentPayload built from the requirements the first call returned.",
                "type": "object"
              },
              "product_id": {
                "description": "Product id from search_catalog.",
                "type": "integer"
              },
              "product_type": {
                "description": "giftcard = voucher, topup = service recharge. eSIM data plans from search_catalog are bought as giftcard too — the value names the order shape, not the goods.",
                "enum": ["giftcard", "topup"],
                "type": "string"
              },
              "quantity": {
                "description": "Copies to buy. Defaults to 1 — send it only to buy several.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c405be8b0beb1fdc94e1c2ea02e83e75a98448783f0f890839324c362c8b44a8"
        },
        {
          "name": "get_product",
          "description": "Get one catalog product by id: available denominations with prices, required order inputs, and any countries where the code cannot be redeemed.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id from search_catalog.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ada902e0a630efca3b0a7442cd5063722cbd977078c6ff1db17c6533c8ce1f43"
        },
        {
          "name": "search_catalog",
          "description": "Search the store catalog of gift cards, service top-ups and eSIM data plans. Returns matching products with their price, availability and product page URL.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-3166-1 alpha-2 country code the product is issued for, e.g. US, TR.",
                "type": "string"
              },
              "limit": {
                "description": "Max products to return (default 10, max 50).",
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against product name and brand, e.g. \"steam\" or \"playstation\".",
                "type": "string"
              },
              "type": {
                "description": "voucher = gift card, recharge_fixed / recharge = top-up, e_sim = eSIM data plan.",
                "enum": ["voucher", "recharge_fixed", "recharge", "e_sim"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b5c8294bfeaea248e33913d38fd6321f803823a7833fcd1147a2def17ff7b8a"
        }
      ],
      "digest": "sha256:bc1404c30515ae98ce3713e265d1d935eebdbd1938edc0493806ca3515fb31fb"
    }
  }
}
