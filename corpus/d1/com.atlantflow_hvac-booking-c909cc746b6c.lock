        {
          "name": "request_service",
          "title": "Request a service callback",
          "description": "Ask AtlantFlow to call a customer back about service. ONLY call when the person explicitly asked to be contacted and gave their name, phone and ZIP. Side effect: creates a lead in AtlantFlow's Housecall Pro CRM and notifies the office; nothing is deleted or overwritten. Not idempotent but protected: repeated identical requests are de-duplicated and rate-limited, so do not retry on success. This is a callback request, not a confirmed appointment. For emergencies the person should call (561) 510-9414 directly.",
          "inputSchema": {
            "properties": {
              "email": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Customer's email (optional).",
                "title": "Email"
              },
              "issue": {
                "description": "What is wrong or what is needed, e.g. 'AC blowing warm air', 'quote for new system'. 3-600 characters.",
                "maxLength": 600,
                "title": "Issue",
                "type": "string"
              },
              "name": {
                "description": "Customer's name.",
                "maxLength": 80,
                "minLength": 2,
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "description": "Customer's US phone number, e.g. '561-555-0142'.",
                "maxLength": 30,
                "title": "Phone",
                "type": "string"
              },
              "preferred_time": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Preferred callback or visit time, free text (optional).",
                "title": "Preferred Time"
              },
              "urgency": {
                "description": "How soon service is needed.",
                "enum": ["emergency", "today", "this_week", "flexible"],
                "title": "Urgency",
                "type": "string"
              },
              "website": {
                "anyOf": [
