                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Anti-spam honeypot. Leave EMPTY. Never fill this field.",
                "title": "Website"
              },
              "zip": {
                "description": "5-digit ZIP code of the property.",
                "maxLength": 10,
                "title": "Zip",
                "type": "string"
              }
