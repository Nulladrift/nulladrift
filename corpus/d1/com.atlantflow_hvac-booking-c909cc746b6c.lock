      "instructions": "Read-only facts about AtlantFlow AC & Heat, a licensed HVAC contractor (FL CAC1824422) in Boca Raton, Florida serving Palm Beach County and north Broward: services, service area by ZIP, hours and emergency fees, published prices, historical replacement cost statistics, maintenance plan, financing, free second opinion, reviews and how to book, plus published troubleshooting articles (search_articles / get_article). Every answer carries its source and data_updated_at. Cost numbers are historical invoice statistics, never a quote; recommend the free in-home estimate. Use request_service only when a person explicitly asks to be contacted and has given their name, phone and ZIP; never invent contact details. For emergencies tell the person to call (561) 510-9414.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check service area by ZIP",
          "description": "Check whether AtlantFlow serves a location. Returns status 'served' (primary service area), 'ask' (listed or nearby but availability must be confirmed by phone) or 'not_served' (outside Palm Beach, Broward and Miami-Dade). Give a ZIP whenever possible.",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "City name, e.g. 'Delray Beach'. Used when no ZIP is known.",
                "title": "City"
              },
              "zip": {
                "anyOf": [
                  {
                    "maxLength": 10,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "5-digit US ZIP code of the property, e.g. '33487'. Preferred - gives a definite answer.",
                "title": "Zip"
              }
            },
            "title": "check_service_areaArguments",
            "type": "object"
          },
