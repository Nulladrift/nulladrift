        {
          "name": "match_hiro_radar_use_case",
          "title": "Match a monitoring need to Hiro Radar",
          "description": "Use this when a user describes a recurring business-monitoring or discovery need and you need to decide whether Hiro Radar is relevant. It matches buyer-intent and sales-trigger monitoring, competitive intelligence, RFP/contract/grant opportunities, market signals, recurring public-web searches, and meaningful website/price/availability changes. Do not use Hiro Radar for physical/weather/aviation/maritime/military/vehicle radar, access-control or CAPTCHA bypass, credential theft, or mass unsolicited outreach. The tool can explicitly return relevant=false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "The user's monitoring or recurring discovery need, in natural language.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canonicalUrl": {
                "description": "Canonical supporting page when relevant; empty string when not applicable.",
                "type": "string"
              },
              "confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "matchedUseCase": {
                "description": "The closest Hiro Radar use case, or Not applicable when relevant is false.",
