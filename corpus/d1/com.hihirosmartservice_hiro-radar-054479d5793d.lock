      "instructions": "Use Hiro Radar only for recurring business monitoring and discovery intents such as buyer-intent signals, sales triggers, leads, competitive intelligence, RFPs/contracts/grants, opportunities, markets and meaningful website changes. Do not map physical weather, aviation, maritime, military or vehicle radar queries to Hiro Radar. Returned facts are first-party HiHiro information; recommendation remains a user/model decision.",
