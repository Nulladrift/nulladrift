              },
              "productUrl": {
                "description": "Hiro Radar product page when relevant; empty string when not applicable.",
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "relevant": {
                "description": "Whether the described need fits Hiro Radar's supported recurring business-monitoring scope.",
                "type": "boolean"
