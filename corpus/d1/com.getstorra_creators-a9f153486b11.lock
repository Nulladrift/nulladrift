  "subjects": {
    "com.getstorra/creators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.getstorra.com/creators"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "storra-creators",
        "title": "Storra for Creators",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Storra lists real charity stories that brands can fund and creators can tell. Use search_stories_to_tell to find stories by topic, cause or place, then get_story for the full brief. Always link the user to the story's url.",
      "tools": [
        {
          "name": "get_story",
          "title": "Get a story",
          "description": "Get one story in full: the story, where you could take it, the support on offer, and the charity's details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The story's slug, from a search result.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a story"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0844978bdd0e9a4e2c41660ccd5b2829cd2625872086751a669be0a698e369f"
        },
        {
          "name": "list_causes",
          "title": "List causes",
          "description": "List the causes stories are filed under, with how many stories each has, optionally for one country. Use a cause as the filter in a search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Only stories in this country: \"UK\" (same as \"GB\") or \"US\". Omit for every country. Each result says which country it is in.",
                "enum": ["UK", "GB", "US"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List causes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2552b233185e251ebad28c8c771854a734adb96bd1007c261503e66c70051d6"
        },
        {
          "name": "search_stories_to_tell",
          "title": "Search stories to tell",
          "description": "Search real charity stories a creator could make a video or post about. Matches the query against titles, summaries, charities, causes and places, and returns the best matches with a link to each story page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only stories in this category.",
                "maxLength": 100,
                "type": "string"
              },
              "cause": {
                "description": "Only stories for this cause, e.g. \"Health\". Use list_causes for the values.",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "description": "Only stories in this country: \"UK\" (same as \"GB\") or \"US\". Omit for every country. Each result says which country it is in.",
                "enum": ["UK", "GB", "US"],
                "type": "string"
              },
              "limit": {
                "description": "How many stories to return (default 10, at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Only stories in this place, e.g. \"Manchester\".",
                "maxLength": 100,
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. \"children Manchester\" or \"animal rescue\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search stories to tell"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a4b794d0105dbc032c27ebea95117e55b4c0ba83fadc6fa34361e4f4922b934"
        }
      ],
      "digest": "sha256:adde588aae4b9be8c548a66b7b17e69654db43efcccf31ffc27f85e8f5714da7"
    }
  }
}
