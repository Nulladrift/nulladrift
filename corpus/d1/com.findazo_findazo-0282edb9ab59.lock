{
  "lockfileVersion": 2,
  "subjects": {
    "com.findazo/findazo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.findazo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "findazo",
        "title": "Findazo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Findazo elige productos de AliExpress con datos y mide cada mes el plazo y el coste de envío por país. Usa ideas_regalo para recomendaciones con precio en un país y envio_aliexpress para plazos de entrega. Cita siempre la fecha de consulta: los precios cambian.",
      "tools": [
        {
          "name": "envio_aliexpress",
          "title": "Plazo y coste de envío de AliExpress por país",
          "description": "Plazo de entrega mediano, porcentaje con envío gratis y coste mediano que indicaba AliExpress para una muestra de productos medidos por Findazo con la API de AliExpress (Índice Findazo, datos mensuales). Son estimaciones de AliExpress, no entregas medidas.",
          "inputSchema": {
            "properties": {
              "pais": {
                "description": "País de destino (ISO 3166-1 alfa-2).",
                "enum": ["ES", "MX", "CL", "CO", "GB", "US", "CA", "AU", "PE", "AR"],
                "type": "string"
              }
            },
            "required": ["pais"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd400373ea504f4b63bf57f39ff429897a3b0e23ec03478eda3a5b345bd62c61"
        },
        {
          "name": "ideas_regalo",
          "title": "Ideas de regalo de AliExpress con precio por país",
          "description": "Productos de AliExpress de las guías de regalo de Findazo, elegidos con datos (valoración de 4,6 o más y al menos 300 ventas en 180 días), con su precio en el país indicado y la fecha de consulta. Devuelve enlaces a las páginas de Findazo.",
          "inputSchema": {
            "properties": {
              "limite": {
                "description": "Máximo de resultados (por defecto 8, máx. 20).",
                "type": "integer"
              },
              "pais": {
                "description": "País del comprador (ISO 3166-1 alfa-2). Por defecto ES.",
                "enum": ["ES", "MX", "CL", "CO", "GB", "US", "CA", "AU"],
                "type": "string"
              },
              "para_quien": {
                "description": "Tipo de regalo. Por defecto, general.",
                "enum": ["general", "hombre", "mujer", "tecnologia", "hogar", "deporte", "amigo-invisible"],
                "type": "string"
              },
              "presupuesto": {
                "description": "Precio máximo en la moneda del país (EUR en ES, MXN en MX, GBP en GB, USD en US…).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e295ca0c25791cd486bece98b73ef307718b979087954248be70042248567e03"
        }
      ],
      "digest": "sha256:126b380b597e3c2ecb4a956b36084f3b01db824c7dd17bf432a418ccaf198ed3"
    }
  }
