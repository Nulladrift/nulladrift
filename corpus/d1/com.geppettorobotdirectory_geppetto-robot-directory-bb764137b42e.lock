        {
          "name": "search_datasets",
          "title": "Search Robot Training Datasets",
          "description": "Search Geppetto's directory of 1,000+ robot training datasets by platform, modality, license, or commercial-use. Returns name, slug, platforms, sensor modalities, episode count, hours, license, access type, and URL.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Dataset type: real-robot, human-video, or sim",
                "type": "string"
              },
              "commercialUse": {
                "description": "If true, only datasets cleared for commercial use",
                "type": "boolean"
              },
              "embodiment": {
                "description": "Robot platform used to collect the data, e.g. unitree-g1, franka, aloha, humanoid",
                "type": "string"
              },
              "license": {
                "description": "License identifier, e.g. apache-2.0, cc-by-4.0, mit",
                "type": "string"
              },
              "modality": {
                "description": "Sensor modality, e.g. rgb, depth, tactile, imu, lidar, force-torque",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over dataset name, description, and source",
                "type": "string"
              }
            },
            "type": "object"
          },
