{
  "lockfileVersion": 2,
  "subjects": {
    "com.fpv-db/fpv-db": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fpv-db.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fpv-db",
        "title": "FPV-DB",
        "version": "1.0.2",
        "websiteUrl": "https://fpv-db.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spec sheets of FPV drone parts (motors, quads, batteries, props, stacks, cameras, VTX) and the Betaflight and INAV CLI settings of each release (Betaflight from settings.c with defaults read off SITL builds, INAV from settings.yaml resolved by its own generator). Parts data CC BY 4.0, firmware data GPL-3.0; cite the page URL each result carries. Spec sheets only - no reviews or rankings.",
      "tools": [
        {
          "name": "fw_check_cli",
          "title": "Check a Betaflight or INAV diff",
          "description": "Checks a pasted `diff all` / `dump` against a release: every `set` line whose setting does not exist, was renamed or removed, or whose value is out of range or not in the value list, plus lines that only repeat the firmware default. The release of the paste is read from its `# Betaflight / ... X.Y.Z` or `# INAV/<target> X.Y.Z` header, which also picks the firmware when none is given. Other commands (aux, serial, resource) are counted, not checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firmware": {
                "default": "betaflight",
                "description": "Firmware (fw_check_cli: default is the one the paste's header names)",
                "enum": ["betaflight", "inav"],
                "type": "string"
              },
              "text": {
                "description": "The CLI text, up to 100 KB",
                "type": "string"
              },
              "version": {
                "description": "Release to check against (default: latest)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:007028ad91145d75b8b72e87bab3c6257a63cf5703307dd8f1c5a50b578eeb51"
        },
        {
          "name": "fw_diff",
          "title": "Betaflight / INAV settings diff",
          "description": "What changed in the CLI settings between two releases: added, removed, renamed (only sourced renames) and changed (range, values, default) settings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firmware": {
                "default": "betaflight",
                "description": "Firmware (fw_check_cli: default is the one the paste's header names)",
                "enum": ["betaflight", "inav"],
                "type": "string"
              },
              "from": {
                "description": "Older release, e.g. 4.5",
                "type": "string"
              },
              "to": {
                "description": "Newer release (default: latest)",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce7a46eed22a960f57edf23889d7fd49fe3805f4ca092665bfad0d2151d11638"
        },
        {
          "name": "fw_param",
          "title": "Betaflight / INAV CLI setting",
          "description": "One CLI setting of a firmware release: type, allowed range or values, firmware default (with no board config), the source line (settings.c or settings.yaml), and its history across releases (renames, range and default changes). Old names are followed through sourced renames.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firmware": {
                "default": "betaflight",
                "description": "Firmware (fw_check_cli: default is the one the paste's header names)",
                "enum": ["betaflight", "inav"],
                "type": "string"
              },
              "name": {
                "description": "Setting name, as in `set <name> = ...`",
                "type": "string"
              },
              "version": {
                "description": "Release, e.g. 2026.6.2 or 4.5 (default: latest)",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7227f121e3c1b65ec334236b7f19dd5ccaaed5f224691eb9953254c2af07ce31"
        },
        {
          "name": "part_specs",
          "title": "FPV part spec sheet",
          "description": "The full spec sheet of one part by its slug (the last segment of its fpv-db.com URL, e.g. iflight-xing2-2207 for /motors/iflight-xing2-2207/): specs, bench thrust table where measured, VTX table where published, the sources the specs were verified against, and caveats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Part slug, e.g. iflight-xing2-2207 (from search_parts or the page URL)",
                "type": "string"
              },
              "type": {
                "description": "Part type, if known",
                "enum": ["motor", "quad", "battery", "prop", "stack", "camera", "vtx"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc63e298b26416f02393dc53231819e57f3f4e8234e146ffd0d4a0d5bd54d3a0"
        },
        {
          "name": "search_parts",
          "title": "Search FPV parts",
          "description": "Finds published parts of one type by spec. `filters` maps a spec field to a number (equals, or any element of a list), a string (case-insensitive substring) or {min, max} (numeric range). `query` matches brand and model. An unknown field returns the type's field list. Example: type=motor, filters={\"stator\": \"2207\", \"weight_g\": {\"max\": 33}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": true,
                "description": "Spec field -> number, list, substring or {min, max}, e.g. {\"stator\": \"2207\"}",
                "type": "object"
              },
              "limit": {
                "default": 20,
                "description": "Most results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must appear in brand + model",
                "type": "string"
              },
              "type": {
                "description": "Part type to search",
                "enum": ["motor", "quad", "battery", "prop", "stack", "camera", "vtx"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d43380fb96235f03770c0cbf4df6ad997ba8f598b73f5403cfc1448860b492db"
        }
      ],
      "digest": "sha256:9b9c38cd4d621489a93affaf94d4bd0497eef37286592a4f82a1b0f2573619ae"
    }
  }
}
