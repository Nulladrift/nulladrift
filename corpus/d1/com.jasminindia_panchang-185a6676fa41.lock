{
  "lockfileVersion": 2,
  "subjects": {
    "com.jasminindia/panchang": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jasminindia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jasminindia-panchang",
        "title": "jasminindia.com festival dates and panchang",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only festival dates and panchang timings, plus the daily Sikku kolam puzzle (sikku_today, sikku_check; stateless checker), computed by an AI-run experiment at jasminindia.com. No accounts, no user data stored. Where sources disagree (e.g. Pongal 2027), the answer says so and cites each. Not an authority.",
      "tools": [
        {
          "name": "festival_dates",
          "description": "Dates for Makar Sankranti / Thai Pongal 2027, each with the named source that gives it. Official lists differ (14 vs 15 January 2027); this returns every date with who uses it and why, rather than one answer. Only Pongal 2027 is covered so far.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58b4e5d4b79c44aa1b9b20f132cea4a2d7f0e1b4dba357f8d69580a4b4d1d790"
        },
        {
          "name": "panchang_at",
          "description": "Sunrise, sunset, and the tithi and nakshatra in force at sunrise (with their end times) for a place on a local date. Sidereal, Lahiri. Moon-based values are checked against only a few published references; see the method page. Not a muhurat tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name from the built-in list of 310 cities, e.g. \"Chennai\", \"Toronto\".",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code to disambiguate the city, e.g. \"IN\".",
                "type": "string"
              },
              "date": {
                "description": "Local date, YYYY-MM-DD",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "longitude": {
                "type": "number"
              },
              "timezone": {
                "description": "IANA timezone, e.g. \"Asia/Kolkata\". Needed with latitude/longitude.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58023867f44a05a9d91ee43750a1965797b4312e479b3764d0235f47af693b1a"
        },
        {
          "name": "sankranti_moment",
          "description": "The instant the Sun enters sidereal Makara (Makar Sankranti) in a Gregorian year (Lahiri ayanamsa). With a place, also says which local day the festival is kept (the day the Sun has entered Makara by local sunset), with sunrise and sunset. Checked against Drik Panchang for 2024-2027 only; the engine runs about 2 minutes early.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name from the built-in list of 310 cities, e.g. \"Chennai\", \"Toronto\".",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code to disambiguate the city, e.g. \"IN\".",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "longitude": {
                "type": "number"
              },
              "timezone": {
                "description": "IANA timezone, e.g. \"Asia/Kolkata\". Needed with latitude/longitude.",
                "type": "string"
              },
              "year": {
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc96a6e51e4ff9e642c119980d8cad87aa358befa5955399885117591613eac9"
        },
        {
          "name": "sikku_check",
          "description": "Checks a full board for a Sikku puzzle. Stateless: nothing is stored and there is no leaderboard. Returns solved true/false and how many separate closed lines the board makes (1 means solved, if no locked tile was changed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "puzzle": {
                "description": "Puzzle id from sikku_today. Defaults to today's puzzle.",
                "type": "string"
              },
              "tiles": {
                "description": "n*n characters, each 0 or 1, row by row, including the locked tiles unchanged.",
                "type": "string"
              }
            },
            "required": ["tiles"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e385b8ff2d2e67c34ee31ca1ccd70f57f1667cd9419dbd470ba0132d7c873142"
        },
        {
          "name": "sikku_today",
          "description": "Today's Sikku puzzle (a kolam logic puzzle: set tiles so the arcs form one closed line). Returns the start board, locked tiles, rules and the puzzle id. Before the daily series starts on 16 Dec 2026 (India time) it returns a practice puzzle. Daily puzzles are released on their own India-time day. Optional: puzzle id for an earlier daily or a practice puzzle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "puzzle": {
                "description": "Optional id, e.g. \"practice-4-1\" or \"daily-2026-12-16\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92b2afc6d9e3d2d0a26094680a6c01376d7d1691832e9d880feeb27801286697"
        }
      ],
      "digest": "sha256:6c9ac3b711032899c8450491ccd86c4cabe245b982bb85e3785e1a449199a367"
    }
  }
