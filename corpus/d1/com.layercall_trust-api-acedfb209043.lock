{
  "lockfileVersion": 2,
  "subjects": {
    "com.layercall/trust-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.layercall.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "layercall",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Trust and fraud signals for IPs, emails, phone numbers, domains and whole signups. Every tool returns a 0-100 risk_score (higher is riskier) and a verdict of allow, review or block. Prefer score_user when judging a person: it weights the components together and will not average away a hard block on one of them — it bills one lookup per component supplied, and returns billable_lookups so you can see what each call cost. Requires a LayerCall API key sent as `Authorization: Bearer <key>`; a free key covers 1,000 lookups a month — 1,000 single-value calls, or around 250 four-component score_user calls.",
      "tools": [
        {
          "name": "lookup_phone",
          "title": "Validate a phone number",
          "description": "Validate a phone number worldwide against its national numbering plan. Returns E.164, country, line type (mobile/fixed/VoIP/toll-free/premium) and a risk score. Works globally, not US-only.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, required only for national-format numbers",
                "type": "string"
              },
              "phone": {
                "description": "Number in international form (+14155552671) or national form with country set",
                "type": "string"
              },
              "strictness": {
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c72583446dd7c7e576947089892cb0a74707e118d12994e5cdd94d09d1b785f"
        },
        {
          "name": "score_device",
          "title": "Score a device fingerprint",
          "description": "Judge a browser fingerprint from /fp.js: headless detection, automation frameworks (Selenium, Puppeteer, Playwright), timezone-versus-IP mismatch and repeat-device history. Note the ceiling honestly — the declared signals it relies on are the first thing stealth tooling patches, so a clean result is weaker evidence than a dirty one.",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Hex fingerprint from /fp.js",
                "type": "string"
              },
              "ip": {
                "description": "Visitor IP, so timezone-vs-country can be checked",
                "type": "string"
              }
            },
            "required": ["device_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b79d6ba59f6ebb3a956d6e93cb2af9428d5ef56a17fc94d3670a7a51e8019b4"
        },
        {
          "name": "score_domain",
          "title": "Score a domain",
          "description": "Profile a domain: registration date from RDAP, registrar, MX/SPF/DMARC configuration, disposable-mail and risky-TLD detection. newly_registered is null when the age genuinely could not be determined — treat that as unknown, not as 'established'.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66d92c3059e08376e279160a873a745a60e2c6f3bcc01174b633a847f542ee19"
        },
        {
          "name": "score_ip",
          "title": "Score an IP address",
          "description": "Risk-score an IPv4 or IPv6 address. Detects commercial VPNs (naming the provider where its own published list confirms it), proxies, Tor exit nodes and datacenter hosting, and returns geolocation, ASN and a 0-100 risk score with an allow/review/block verdict.",
          "inputSchema": {
            "properties": {
              "ip": {
                "description": "IPv4 or IPv6 address, e.g. 8.8.8.8",
                "type": "string"
              },
              "strictness": {
                "description": "0 lenient, 1 balanced (default), 2 strict, 3 paranoid. Moves the verdict thresholds only; the score is unchanged.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09d85451b20f8cf4fd7346648e161fc0ae79c0f20b780faa07d18c821f799cb8"
        },
        {
          "name": "score_user",
          "title": "Score a whole signup",
          "description": "Score an entire signup in one call — any combination of IP, email, phone and domain — returning a single weighted risk score, a verdict, and the top contributing signals. A hard block on any component is never averaged away. This is the tool to use when judging a person rather than a value. Costs one lookup PER COMPONENT supplied, not one per call, so four identifiers cost four; the response reports the exact figure as billable_lookups, and cached components are refunded.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "ip": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "phone_country": {
                "description": "ISO 3166-1 alpha-2 for national-format numbers",
                "type": "string"
              },
              "strictness": {
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:027827b5b4fe443ff10647fae226d5c32bcd595f42b8dc2abb6a74811cd4df2f"
        },
        {
          "name": "verify_agent",
          "title": "Verify a signed AI agent (Web Bot Auth)",
          "description": "Cryptographically verify a Web Bot Auth signature (RFC 9421) — proof of WHICH agent is calling, not a guess from the user-agent. Returns verified true/false plus the agent's identity and declared purpose. This is the only check here that proves rather than infers, so it carries no score and no verdict: a verified assistant acting for a real user is usually welcome, a verified scraper usually is not, and that policy is the caller's. Pass the request the agent made to YOU — the signature covers its method, authority and path.",
          "inputSchema": {
            "properties": {
              "headers": {
                "description": "Request headers, including signature, signature-input and signature-agent",
                "type": "object"
              },
              "method": {
                "description": "HTTP method, default GET",
                "type": "string"
              },
              "url": {
                "description": "Absolute URL the agent requested from you",
                "type": "string"
              }
            },
            "required": ["headers", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3ee9cd32acfa134e832e02b3a3445ea9dfd44dd6de4dbdbad3741b901dbaa1a"
        },
        {
          "name": "verify_email",
          "title": "Verify an email address",
          "description": "Check an email for syntax, MX records, disposable/throwaway providers, role accounts (info@, admin@), homograph lookalikes and domain age. Returns a 0-100 risk score and an allow/review/block verdict.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Full email address",
                "type": "string"
              },
              "strictness": {
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62e0b0e6dec88e63e3465ccf80cd7f9bfb8b2c3663bd38c5f69c23a827b86ff4"
        }
      ],
      "digest": "sha256:98adf427533b95c7ab6bb4c86e3a7580ec52de523b4e6dd29febc99c0fac59aa"
    }
  }
}
