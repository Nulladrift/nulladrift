          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fcfc7c97aead4f594293a697a35e4d4cc51bc8321d7606b7406575b1622f8f9a"
        },
        {
