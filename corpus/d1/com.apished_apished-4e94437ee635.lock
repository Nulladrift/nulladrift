              "colorB": {
                "type": "string"
              }
            },
            "required": ["colorA", "colorB"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "type": "string"
              },
              "ratio": {
                "type": "number"
              }
            },
            "required": ["formula", "ratio"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eabdd4194047c49eeb37924422efa6ed5e3f89c3311e6af14fba4b49eefae063"
        },
        {
          "name": "color_convert",
          "description": "Converts a color between hex, rgb, hsl, and hsv. value's shape depends on from/to: a string for hex, an object ({r,g,b,a?} etc.) otherwise.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "hex, rgb, hsl, or hsv",
                "type": "string"
              },
              "to": {
                "description": "hex, rgb, hsl, or hsv",
                "type": "string"
              },
              "value": {
                "description": "a hex string, or an {r,g,b,a?}/{h,s,l,a?}/{h,s,v,a?} object per from"
              }
            },
            "required": ["from", "to", "value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": true
            },
            "required": ["value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26254d6ded1cc799a54a33da3bec5d63d947dcdaa2380e88051ef4d237ea40c1"
        },
        {
