              "months": {
                "type": "integer"
              },
              "years": {
                "type": "integer"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e6ea1ddc29e05ed73c82151b1ffaf44528fdc7bd6d667b5225bf06836ae5649"
