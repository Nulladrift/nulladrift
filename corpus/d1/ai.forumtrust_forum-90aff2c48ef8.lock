      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FORUM publishes signed, Merkle-anchored trust records for MCP servers listed in the official MCP Registry. Three read-only tools: trust_lookup (record + proof + verify instructions), get_proof (Merkle audit path), get_method (method metadata and document pointers). Every result carries as_of_input_date and content_sha256. What a score is NOT: Not a security guarantee, not a penetration test, not certification of code correctness. It is a longitudinal behavioral-reputation summary with full evidence disclosure: scanners answer \"is this safe to install today\"; FORUM answers \"what has this thing done since everyone installed it\". Verify, do not trust.",
      "tools": [
        {
          "name": "get_method",
          "title": "FORUM scoring method metadata",
          "description": "Return the metadata of the scoring method behind the current FORUM release: method_version, as_of_input_date, record_count, merkle_root, the record hash_recipe and freshness thresholds (the same object as GET /v1/method on the FORUM HTTP API), plus pointers with SHA-256 to the full method document (/v1/method/doc; section 10 holds the verification recipes), the weights file and the release manifest, and the path of the signing keys. The method is public and versioned; weights live in a published config file. What a score is NOT: Not a security guarantee, not a penetration test, not certification of code correctness. It is a longitudinal behavioral-reputation summary with full evidence disclosure: scanners answer \"is this safe to install today\"; FORUM answers \"what has this thing done since everyone installed it\". Scores are flags, not verdicts: the band is derived only from the documented sub-scores, and a sub-score FORUM could not observe is reported as null with a reason, not estimated. Takes no arguments. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "FORUM scoring method metadata"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c0d2c9cf1c1d2d5673f65773e7aa6707b5dd08e95fefe5a988d5b4e1d1129b7"
        },
        {
          "name": "get_proof",
          "title": "FORUM Merkle proof",
          "description": "Return the Merkle audit path that ties one FORUM trust record to the daily release root: leaf, index (0-based leaf position), path (sibling hashes, leaf level first) and root. Same object as GET /v1/trust/{registry_name}/proof on the FORUM HTTP API. Verification recipe: (1) h = the 32 bytes of `leaf` (hex-decoded; `leaf` is the record's content_sha256), i = `index`. (2) For each hex sibling s in `path`, in order: if i is even, h = sha256(h + s_bytes); if i is odd, h = sha256(s_bytes + h); then i = i // 2. (3) hex(h) must equal `root`. Then compare root with merkle_root from get_method and with the on-chain anchor (method doc section 10.2); a root taken only from this response shows internal consistency, not publication. A valid proof shows that the record is part of the published release; it says nothing about whether the scored server is safe. A score is: Not a security guarantee, not a penetration test, not certification of code correctness. An unknown name returns isError with error=not_in_registry. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "registry_name": {
                "description": "MCP Registry server name, exactly as the registry spells it: owner/name, e.g. io.github.pipeworx-io/19hz. Contains a slash; pass it raw (no URL-encoding). Case-sensitive.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["registry_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "FORUM Merkle proof"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a09d8ddd4873a99681b7e87fd3a7408288ac566f261109d125b954e06cfbb1e3"
        },
        {
          "name": "trust_lookup",
          "title": "FORUM trust record lookup",
          "description": "Look up the FORUM trust record for one MCP server listed in the official MCP Registry. Returns, in one response: the ed25519-signed record (sub-scores for provenance, static scan, drift and incidents; a derived band; evidence pointers; a null score with a stated reason wherever coverage is missing), the record's Merkle proof, and a paragraph of verify instructions. record_json is byte-identical to the body of GET /v1/trust/{registry_name} on the FORUM HTTP API; record_content_sha256 is the record hash and Merkle leaf. Records are rebuilt daily; as_of_input_date is the input date of this one. An unknown name returns isError with error=not_in_registry: the name is not in the current registry snapshot, which is absence of a record, not a negative finding. What a score is NOT: Not a security guarantee, not a penetration test, not certification of code correctness. It is a longitudinal behavioral-reputation summary with full evidence disclosure: scanners answer \"is this safe to install today\"; FORUM answers \"what has this thing done since everyone installed it\". Verify, do not trust: recompute the hash, check the signature, and check the proof against a root obtained independently. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "registry_name": {
                "description": "MCP Registry server name, exactly as the registry spells it: owner/name, e.g. io.github.pipeworx-io/19hz. Contains a slash; pass it raw (no URL-encoding). Case-sensitive.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["registry_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
