{
  "lockfileVersion": 2,
  "subjects": {
    "com.srclog/srclog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://srclog.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "srclog",
        "title": "SrcLog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and inspect open-source GitHub repositories, topics and top developers indexed by SrcLog.com. No auth required. Tool calls are limited to 30 per minute per IP.",
      "tools": [
        {
          "name": "get_owner",
          "title": "Get developer or organization",
          "description": "Profile, totals, ranking positions and most-starred repositories of a GitHub user or organization.",
          "inputSchema": {
            "properties": {
              "login": {
                "description": "GitHub login, e.g. \"sindresorhus\".",
                "type": "string"
              },
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["login"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5231f5437cd941ce3c0cd7136c0517cbd999e95de5ee8e191e2445e3223f39c9"
        },
        {
          "name": "get_repo",
          "title": "Get repository",
          "description": "Details for one repository: stars, forks, language, license, topics, SrcLog score, dates and links.",
          "inputSchema": {
            "properties": {
              "repo": {
                "description": "GitHub full name, e.g. \"laravel/framework\".",
                "type": "string"
              }
            },
            "required": ["repo"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b7098eb67bdd41e7e9fd8747b5e749d499da9c40a11e607ba39a723e5b71edf"
        },
        {
          "name": "list_topics",
          "title": "List topics",
          "description": "All curated topics (slug, title, description).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d2752da60499a8450f98ecdd0e842e840f753ad734c10aa9cf26fb787a6628f"
        },
        {
          "name": "search_repos",
          "title": "Search repositories",
          "description": "Search open-source GitHub repositories by keywords (hybrid keyword + semantic search) with optional language, topic and star filters.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Primary language as GitHub names it, e.g. \"Rust\", \"TypeScript\".",
                "type": "string"
              },
              "min_stars": {
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words, e.g. \"vector database\". May be empty if a filter is given.",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "stars", "recent"],
                "type": "string"
              },
              "topic": {
                "description": "Topic slug, e.g. \"machine-learning\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:123f5279c9be652479750fb61ed5bc12689035ecf267b3f497f4f5be0a08d307"
        },
        {
          "name": "similar_repos",
          "title": "Similar repositories",
          "description": "Repositories semantically similar to the given one — useful for finding alternatives.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "GitHub full name, e.g. \"laravel/framework\".",
                "type": "string"
              }
            },
            "required": ["repo"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdd2887fb542cf7c7c9f33bf2be3329fea83a1830ec88e20dc7c8b7493f2a603"
        },
        {
          "name": "top_developers",
          "title": "Top developers",
          "description": "Ranking of GitHub developers or organizations by total stars (or forks, watchers, repos), optionally by language and country.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code, e.g. \"UA\".",
                "type": "string"
              },
              "language": {
                "description": "Primary language, e.g. \"Go\".",
                "type": "string"
              },
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "enum": ["stars", "forks", "watchers", "repos"],
                "type": "string"
              },
              "type": {
                "description": "Default \"developers\".",
                "enum": ["developers", "organizations"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b1d77a3b142d639e85ea59519e3547b909a6aeff90f37f49cd195b8fa25727c"
        },
        {
          "name": "topic_repos",
          "title": "Repositories in a topic",
          "description": "Most-starred repositories tagged with a topic.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Topic slug, e.g. \"rust\" or \"machine-learning\".",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
