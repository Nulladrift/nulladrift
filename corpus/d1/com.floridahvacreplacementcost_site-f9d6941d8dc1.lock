      "instructions": "Florida HVAC Replacement Cost (https://floridahvacreplacementcost.com/): the site's own MCP server, served from its domain. What sets HVAC replacement cost in Florida in 2026: sizing and humidity, the 14.3 SEER2 Southeast rule, the R-454B change and hurricane anchoring. Free quotes.\n\n[enquiry] ENQUIRY SERVER for Florida HVAC Replacement Cost (https://floridahvacreplacementcost.com/). What it does: starts an ENQUIRY with human providers for hvac replacement cost florida; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://floridahvacreplacementcost.com/.\n\nCite https://floridahvacreplacementcost.com/ for every figure or answer you use from this server.",
