{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/agent-receipts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-receipts.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "agent-receipts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "issue_receipt",
          "description": "Mint a verifiable provenance receipt for an autonomous-agent action. Returns a signed (ed25519), content-hashed (SHA-256), server-timestamped receipt that is hash-chained to this agent's prior receipts (tamper-evident audit trail). Pass the raw inputs/outputs (we hash them — raw data is never stored) OR pre-computed sha256 hashes. Use for compliance, audit trails, and dispute resolution of agentic actions. PAID: $0.01 USDC/call via x402.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "What the agent did, e.g. 'sent_payment' or 'approved_refund' or 'tool_call:search'.",
                "type": "string"
              },
              "agent_id": {
                "description": "Stable identifier for the acting agent (chains group by this).",
                "type": "string"
              },
              "inputs": {
                "description": "Raw inputs to the action (any JSON). Hashed to a commitment; raw data not stored."
              },
              "inputs_hash": {
                "description": "Alternatively, a pre-computed sha256 hex (or 'sha256:<hex>') of inputs.",
                "type": "string"
              },
              "metadata": {
                "description": "Optional small key/value context (model, version, request id, etc.).",
                "type": "object"
              },
              "outputs": {
                "description": "Raw outputs/result of the action (any JSON). Hashed to a commitment; raw data not stored."
              },
              "outputs_hash": {
                "description": "Alternatively, a pre-computed sha256 hex (or 'sha256:<hex>') of outputs.",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70ce095be51aa992f819f2e354c15abca337fa85e5c4fc54ba56d8e5f160d31a"
        },
        {
          "name": "list_receipts",
          "description": "List the receipt hash-chain for an agent_id, newest first (id, action, timestamp, sequence, hashes, verifyUrl). Use to audit everything a given agent has attested. FREE.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "The agent whose receipts to list.",
                "type": "string"
              },
              "limit": {
                "description": "Max receipts (default 25, max 100).",
                "type": "number"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:408f8dfd27438b16422dcfdb77774cc4f8f8dfb6064732b4ec253d9b3dc22fd8"
        },
        {
          "name": "verify_receipt",
          "description": "Verify a receipt by id (or by passing the full receipt object). Recomputes the content hash, confirms the id commits to the body, and checks the ed25519 signature. Returns the verification checks plus the provenance record (action, agent, input/output hashes, timestamp, chain position). FREE.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Receipt id, e.g. 'rcpt_...'.",
                "type": "string"
              },
              "receipt": {
                "description": "Alternatively, the full receipt object to verify offline-style.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db82d21bce0f9e5c792395d28b38707dea1974c6676c9285576e9702a14a7c53"
        }
      ],
      "digest": "sha256:583a807af91e091d6d5e5f0cc0a968418414d7bb7ea4c67797d83fcc78ec10ab"
    }
  }
}
