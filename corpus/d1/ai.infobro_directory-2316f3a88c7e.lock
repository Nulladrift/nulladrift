            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your infobro API key, if it is not set as the Authorization header of this connection.",
                "type": "string"
              },
              "method": {
                "description": "Payment method id; leave empty for the default.",
                "type": "string"
              },
              "order_id": {
                "description": "From submit_tool or my_tools.",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get the payment link"
