{
  "lockfileVersion": 2,
  "subjects": {
    "com.safemerchantsolutions.walnbot/sms-assistant": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://walnbot.safemerchantsolutions.com/mcp/sms-assistant"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Walnbot.Mcp",
        "version": "1.0.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "get_service",
          "description": "Look up one service by name, as returned by list_services, with a short excerpt of the page describing it. If no such service exists this says so plainly and suggests the nearest names — treat that as authoritative: the business does not offer it.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The service name, exactly as returned by list_services. Matching is case-insensitive.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:78134dfa53ea0ac52596dc42ab64b7610a0dd4f42707533835834ee2470f432b"
        },
        {
          "name": "list_services",
          "description": "List this business's services from its extracted catalogue. This is a complete, enumerable list with a total count — unlike `services`, which is a semantic search returning only the closest matches. Use `filter` to narrow by name and `offset` to page.",
          "inputSchema": {
            "properties": {
              "filter": {
                "default": null,
                "description": "Optional words to narrow the list; case-insensitive. Each word must appear in the name or summary, in any order — so fewer, more distinctive words match more. Omit it to list the whole catalogue.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1-100). Default 25.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many to skip. Pass the nextOffset from the previous call to get the next page.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:71739905709452042e3d01fb1b1adab297bc7b4e22a1f1aed82b12b633a9e727"
        },
        {
          "name": "search",
          "description": "Search this knowledge base for content relevant to a natural-language query. Returns the closest-matching snippets with their source, not an exhaustive list.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The natural-language query to search for.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:6acec4a5c5a3874182371d335d765092386353c18b1fe5565c1d6469102a2e0f"
        },
        {
          "name": "services",
          "description": "Find service offerings relevant to a natural-language query. Returns the closest matches, not a complete list — use `list_services` for the complete catalogue.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants — describe the service they're looking for.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:058052d4bbec2845e26ddd797ba121f1014d526470d47eafb5fc4339c9f24f5d"
        },
        {
          "name": "submit_contact",
          "description": "Get someone from safe merchant solutions to contact you. At least one of these is required: what_is_your_phone_number_include_country_code, can_you_provide_your_whatsapp_or_telegram_for_easier_communicati. Ask for the others as well and include any the visitor is happy to give — only the group as a whole is mandatory, so never refuse to submit over one they declined.",
          "inputSchema": {
            "properties": {
              "can_you_provide_your_whatsapp_or_telegram_for_easier_communicati": {
                "description": "Can you provide your whatsapp or telegram for easier communication? Always offer this, even after what_is_your_phone_number_include_country_code has been given — at that point it is optional, so take it if the visitor is willing and move on if they are not.",
                "type": "string"
              },
              "what_is_your_name": {
                "description": "What is your name?",
                "type": "string"
              },
              "what_is_your_phone_number_include_country_code": {
                "description": "What is your phone number ? (include country code) Always offer this, even after can_you_provide_your_whatsapp_or_telegram_for_easier_communicati has been given — at that point it is optional, so take it if the visitor is willing and move on if they are not.",
                "type": "string"
              }
            },
            "required": ["what_is_your_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:046db2e667c5ca4129413cd310a7463dcf7f05985f9380ffb62aba8c710ad15c"
        }
      ],
      "digest": "sha256:e87d1092b7be5758a2c7aa4c65a69fecd526324fd9fb9d07ad8701f91655f877"
    }
  }
}
