    "ai.kaiv/dns-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/dns-check-e159a722"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "dns-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"dns-check\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "resolve_dns",
          "title": "Resolve Dns",
          "description": "Resolve any DNS record live via Google Public DNS. Answers: is DNS propagated? What are the MX/TXT/SPF/DKIM records? Where does this CNAME point? For reverse lookup pass name=<reversed-ip>.in-addr.arpa with type=PTR (e.g. 90.57.149.3.in-addr.arpa for 3.149.57.90). Returns Status (0 = NOERROR, 3 = NXDOMAIN), Answer records with TTLs, and the AD flag for DNSSEC validation.",
          "inputSchema": {
            "properties": {
              "do": {
                "description": "Set 'true' to include DNSSEC records (RRSIG) in the response",
                "type": "string",
                "x-in": "query"
              },
              "name": {
                "description": "Domain name to resolve, e.g. 'kaiv.ai' (or reversed IP + .in-addr.arpa for PTR)",
                "type": "string",
                "x-in": "query"
              },
              "type": {
                "default": "A",
                "description": "Record type: A, AAAA, MX, TXT, NS, CNAME, SOA, CAA, PTR, SRV. Default A.",
                "enum": ["A", "AAAA", "MX", "TXT", "NS", "CNAME", "SOA", "CAA", "PTR", "SRV"],
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Resolve Dns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4e3e0a2165c40288aa403ff5e4e32ea6938c77182a5f75448100dca6c64f1b4"
        }
      ],
      "digest": "sha256:4f2bcdf9d88a093d6069b64e6c1fcb0b3b26fd4a8f9002f51996dd2104c707c0"
    }
  }
