{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentposhq.safepay/check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://safepay.agentposhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "safepay",
        "title": "SafePay Check",
        "version": "0.8.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SafePay Check judges planned payments and verifies SafePay seals and attestations. No tool moves money.",
      "tools": [
        {
          "name": "safepay_check_payment",
          "title": "Check a payment before paying",
          "description": "Checks a planned payment before it is made. Judges the merchant, amount and task against the account's payment rules, the payee's payment history, a live web check of the merchant and an intent check, and returns allow, hold or block with the reasons, a check id and a signed attestation valid for 15 minutes. Moves no money and stores no payee address or task text, only their hashes.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Total to pay",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "category": {
                "description": "e.g. software, travel, groceries",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code, or a dollar stablecoin: PYUSD or USDC",
                "type": "string"
              },
              "invoice_ref": {
                "description": "Invoice or order number, if any",
                "type": "string"
              },
              "merchant_name": {
                "description": "Who is being paid, as shown at checkout",
                "type": "string"
              },
              "merchant_url": {
                "description": "The store or checkout URL",
                "type": "string"
              },
              "network": {
                "description": "For PYUSD or USDC: the network (stellar, ethereum, solana, arbitrum, base, polygon); payee is then the wallet address",
                "type": "string"
              },
              "payee": {
                "description": "The payee account if known (email, PayPal id, or wallet address for a stablecoin)",
                "type": "string"
              },
              "purpose": {
                "description": "What this payment is for",
                "type": "string"
              },
              "task": {
                "description": "What the user asked the agent to do, in their words",
                "type": "string"
              }
            },
            "required": ["amount", "merchant_name", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a payment before paying"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:492ce789eb1c178d105952c5ee05a8ad4f146c76cdf77004a77bd5b8b6de91b3"
        },
        {
          "name": "safepay_policy",
          "title": "Show the payment rules",
          "description": "Returns the payment rules this account is judged under, in plain words, with their fingerprint.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show the payment rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:447c6dd3bc90e73d86c3c2f2ecc9e962ac74f7762ffb2eb1e1c845a37f24b962"
        },
        {
          "name": "safepay_recent_checks",
          "title": "Recent checks",
          "description": "Returns this account's latest payment checks: verdict, merchant, amount and time.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8409a4c5b38db68edf9388e7fbe86018d60e349c552f07486dab355fca59d542"
        },
        {
          "name": "safepay_verify",
          "title": "Verify a SafePay seal or attestation",
          "description": "Verifies a SafePay seal id (SP-XXXXXXXXXX), a signed receipt or a precheck attestation against SafePay's published Ed25519 key. Returns whether it is genuine and intact, and what it states.",
          "inputSchema": {
            "properties": {
              "attestation": {
                "description": "A {body, hash, signature} SafePay document",
                "type": "object"
              },
              "seal": {
                "description": "A seal id such as SP-3F9A0C21BE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a SafePay seal or attestation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:750a2e092317a01252575f5eba14926fb1d91fa4698bae5bb108f0bf32ff3577"
        },
        {
          "name": "safepay_verify_settlement",
          "title": "Check a stablecoin settlement against its SafePay check",
          "description": "Reads a Stellar transaction from the public ledger (Horizon) and compares it with a SafePay precheck attestation: whether it succeeded, paid the approved payee, in Circle's USDC, no more than the approved amount, while the check was valid. Returns the findings and a signed result. Reads the ledger only.",
          "inputSchema": {
            "properties": {
              "attestation": {
                "description": "The precheck attestation safepay_check_payment returned",
                "type": "object"
              },
              "network": {
                "default": "stellar:pubnet",
                "enum": ["stellar:pubnet", "stellar:testnet"],
                "type": "string"
              },
              "tx_hash": {
                "description": "The 64-character Stellar transaction hash",
                "type": "string"
              }
            },
            "required": ["attestation", "tx_hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a stablecoin settlement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:348ccfe1de9590acde9266d86f436ef9553056892bf152f06ed43d9c83d99723"
        }
      ],
      "digest": "sha256:dceeb1a5fe545ed4510e13d4cac2de4fe50d0f50cd49cbcea57387fb8c5be733"
    }
  }
}
