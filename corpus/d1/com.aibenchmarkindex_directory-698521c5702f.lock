        {
          "name": "search_listings",
          "description": "Search published benchmarks by text, place and category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug, from /categories. A parent slug also matches its children.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "city": {
                "description": "City slug, from /places.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, any case. A country the directory does not cover, as listed in /places, gives 400.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "cursor": {
                "description": "`page.nextCursor` from the previous response. Opaque. Send the same filters and `limit`.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Items per page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search text, with at least one letter or digit. Matches name, categories, attributes, description and place. Typos fall back to close matches.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Region slug, from /places.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "sort": {
                "description": "`relevance` needs `q` and is the default with it. `name` is the default without `q`. `recent` is newest first.",
                "enum": ["relevance", "name", "recent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
