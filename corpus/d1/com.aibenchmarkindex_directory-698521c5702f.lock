      "serverInfo": {
        "name": "aibenchmarkindex",
        "title": "AI Benchmark Index",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Benchmark Index lists benchmarks. Call list_places and list_categories first to learn the place and category slugs. Then call search_listings, and get_listing for one record. Every result has meta.attribution and meta.sources. Show the credit line, and keep the license of each source. A benchmark is a record, not an endorsement. list_product_categories, list_products and get_product read the affiliate products. A price is the one seen on price_as_of, not a live price; buy_url is an affiliate link. list_courses and get_course read the published academy courses. Exam questions and answers are never returned. With a service token in the Authorization header, tools/list also offers the write tools that the token's scopes allow.",
      "tools": [
        {
          "name": "get_course",
          "description": "Get one published academy course by its slug, with its objectives, lessons and FAQ. Exam questions and answers are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The course slug.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c96da86e9d6e0767ee35817932cc9476347b9dad021ab779b001f49922a258da"
        },
        {
          "name": "get_listing",
