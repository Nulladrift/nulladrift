          "description": "Get an exact, itemized price quote for one My San Felipe Vacation rental in San Felipe, Baja California, for specific dates and guest count. Returns nightly rates, required fees, the total due, and the refundable security deposit. Prices are in USD and come live from the booking system. Identify the home by property_id or by its name (property_name).",
