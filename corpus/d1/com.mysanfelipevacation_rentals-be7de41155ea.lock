      },
      "instructions": "Live availability, prices and property information for vacation rentals in San Felipe, Baja California, Mexico, managed by My San Felipe Vacation (mysanfelipevacation.com). All tools are read-only and prices are in USD. Use search_properties to find homes for given dates and party size, get_property_details for bed setup, amenities and house rules, check_availability for a specific stay, and get_quote for an itemized price. Each result includes a booking_url to the home's page on mysanfelipevacation.com, where guests complete their booking. Photos of each home are included in the results (photo in search results, photos in property details); photos of similarly named units found elsewhere online may show a different home. These tools have no access to reservation records, so they can't find, verify, change or cancel an existing booking. Cancellations are made by email to inquiries@mysanfelipevacation.com, and the email must include the guest's full name as on the reservation, the reservation number, the arrival date and the departure date. For other changes to an existing booking, guests contact the office at +1 760 592 1261, WhatsApp +52 686 187 2399 or inquiries@mysanfelipevacation.com.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability for one property",
          "description": "Check whether one My San Felipe Vacation rental can be booked for specific dates and party size. If not, explains why (already booked, minimum-night stay, too many guests, pets not allowed) and suggests nearby open dates when it can. Identify the home by property_id or by its name (property_name). Use get_quote for the price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "description": "Number of adult guests",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Number of child guests",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "language": {
                "description": "Language of the booking link: en (default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "pets": {
                "description": "Number of pets",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "property_id": {
                "description": "The property's ID, from search results",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "property_name": {
                "description": "The home's name, e.g. Jerry's Beach Club Condo 4 (use instead of property_id when you don't have the ID)",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
