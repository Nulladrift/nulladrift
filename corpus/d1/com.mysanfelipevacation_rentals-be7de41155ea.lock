        {
          "name": "search_properties",
          "title": "Search available vacation rentals",
          "description": "Search My San Felipe Vacation rentals in San Felipe, Baja California, Mexico that are available for the given dates and party size. Returns live total prices in USD for the whole stay (rent plus required fees, excluding the refundable security deposit). Default sort is best fit for the party size (homes that sleep closest to the number of guests first, then cheapest); use sort=price_low for cheapest first. Page through all matches with offset. Unsupported parameters are rejected. Use get_quote with a property_id for the itemized price, and get_property_details for beds, amenities and house rules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "description": "Number of adult guests",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "beachfront": {
                "description": "true to return only beachfront / ocean-front homes",
                "type": "boolean"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Number of child guests",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "community": {
                "description": "Community or development name, e.g. El Dorado Ranch, La Hacienda, Las Palmas, Playa de Oro, Rancho Percebu, Pete's Camp (partial names match)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "heated_pool": {
                "description": "true to return only homes with a heated pool (combine with pool_type, e.g. private + heated)",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the booking links: en (default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_total_price": {
                "description": "Maximum total price for the whole stay, in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_bedrooms": {
                "description": "Minimum number of bedrooms",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "ocean_view": {
                "description": "true to return only homes with an ocean, sea or beach view",
                "type": "boolean"
              },
              "offset": {
                "description": "Skip this many results, to page through all matches (use next_offset from the previous call)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "pets": {
                "description": "Number of pets; only pet-friendly homes are returned",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "pool": {
                "description": "true to return only homes with a private, indoor, or communal pool",
                "type": "boolean"
              },
              "pool_type": {
                "description": "Narrow the pool requirement: private, communal (shared), or heated. Implies pool=true.",
                "enum": ["any", "private", "communal", "heated"],
                "type": "string"
              },
              "sort": {
                "description": "best_fit (default: homes sized closest to the party first, then cheapest), price_low (cheapest first) or price_high",
                "enum": ["best_fit", "price_low", "price_high"],
                "type": "string"
              },
              "zone": {
                "description": "Area of San Felipe: north (Norte), central (Centro, near town and the malecon), or south (Sur)",
                "enum": ["north", "central", "south"],
                "type": "string"
              }
            },
            "required": ["adults", "check_in", "check_out"],
            "type": "object"
          },
