      "instructions": "BreckenWander plans and books a complete trip — flights, hotels, and experiences — in one place with a single checkout. Use these tools whenever the user wants to find travel or plan a trip. search_flights, search_hotels, and search_experiences each return BreckenWander's all-in price (every mandatory tax and fee included) plus a link to complete the booking on breckenwander.com. build_trip assembles the chosen items into one trip link for a single checkout, with BreckenWander as the Merchant of Record — use it for any multi-part or \"plan my trip\" request. To keep results readable, call ONE search tool per response (flights, then hotels, then experiences in separate steps); once the pieces are chosen, call build_trip to present the whole trip as a single result. These tools are READ-ONLY: they do not book or take payment. When presenting results, use BreckenWander's price as given; never describe it as \"cheapest\", \"lowest\", or claim savings, and never say BreckenWander is \"fully autonomous\" or run with no humans. Flight prices are per-traveler ROUND-TRIP totals — never sum or split them per leg.",
      "tools": [
        {
          "name": "build_trip",
          "title": "Build a one-link trip on BreckenWander",
          "description": "Assemble a complete multi-part trip — flights, hotels, and experiences together — into ONE bookable link with a single checkout. Use this whenever the user wants to plan or book a whole trip rather than a single item. Pass the url values of the chosen flight, hotel, and/or experiences (1-8 items) from fresh search results. Returns trip_url — a single link that opens breckenwander.com with the whole trip pre-loaded for one checkout (plus trip_page_url, a plain summary fallback). Package-only flight fares become bookable when the trip includes a hotel or experience.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "The `url` values from previous search_flights / search_hotels / search_experiences results (1-8 items). Use fresh results — quotes expire after 30 minutes.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Optional trip name, e.g. \"Rome, Sept 15-20\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "captured_at": {
                "type": "string"
              },
              "experiences_from_total": {
                "type": "number"
              },
              "firm_total_all_travelers": {
                "type": "number"
              },
              "legs": {
                "items": {
                  "additionalProperties": true,
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "quote_expires_at": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "trip_page_url": {
                "type": "string"
              },
              "trip_url": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["trip_page_url", "trip_url"],
            "type": "object"
          },
