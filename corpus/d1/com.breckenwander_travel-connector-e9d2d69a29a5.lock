        {
          "name": "search_flights",
          "title": "Search flights on BreckenWander",
          "description": "Search round-trip flights between two airports for given dates and travelers. Returns BreckenWander's per-traveler round-trip price with taxes and carrier-imposed fees included, plus a link that opens the same search on breckenwander.com to complete the booking. Read-only: does not book or take payment. Combine with hotels and experiences into one trip using build_trip.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 1,
                "description": "Number of adult travelers.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "cabin": {
                "default": "economy",
                "description": "Cabin class.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of child travelers (2-11).",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "depart_date": {
                "description": "Departure date in YYYY-MM-DD.",
                "type": "string"
              },
              "destination": {
                "description": "Destination IATA airport or metro code, e.g. \"LAX\" or \"CUN\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "infants": {
                "default": 0,
                "description": "Number of infant travelers (under 2).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "max_results": {
                "default": 8,
                "description": "How many flight options to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_stops": {
                "description": "Maximum stops on the outbound leg. 0 returns nonstop flights only.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Origin IATA airport or metro code, e.g. \"JFK\" or \"LON\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "return_date": {
                "description": "Return date in YYYY-MM-DD. Round-trip only for now.",
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "Result ordering. 'best' (default) balances price, travel time, and stops; 'price' is strictly lowest fare first; 'duration' is shortest outbound travel time first.",
                "enum": ["best", "price", "duration"],
                "type": "string"
              }
            },
            "required": ["depart_date", "destination", "origin", "return_date"],
            "type": "object"
          },
