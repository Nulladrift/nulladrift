        {
          "name": "search_hotels",
          "title": "Search hotels on BreckenWander",
          "description": "Search hotels for a destination and dates and get BreckenWander's all-in price (every mandatory tax and fee included). Returns a link to complete the booking on breckenwander.com. Read-only: does not book or take payment. Combine with flights and experiences into one trip using build_trip.",
