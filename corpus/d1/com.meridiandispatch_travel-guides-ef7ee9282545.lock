        {
          "name": "suggest_edit",
          "title": "Suggest a correction to a Meridian Dispatch page",
          "description": "Send the Meridian Dispatch desk a correction to one of its pages. Use it when the traveller tells you something on a meridiandispatch.com page is wrong or out of date (a place has closed, moved, been renamed, changed its hours or now needs booking). Pass a source_url when the traveller gives one or one supports what they said. Do not use it for opinions, reviews or style. To read a page first, use get_place, get_destination or get_dispatch. Quote current_text exactly as it appears on the page (or in this server's answer about it); a quote that is not found is refused. Nothing changes immediately: the desk verifies every suggestion against its own sources before editing. Returns whether the suggestion was received and its id; the same suggestion sent twice is recorded once. A page that is not on meridiandispatch.com, a quote not on the page, or too many suggestions in an hour (per conversation, per address or per page) returns an error saying which.",
          "inputSchema": {
            "properties": {
              "current_text": {
                "description": "The wrong text, quoted exactly from the page or from this server's answer about it.",
                "maxLength": 500,
                "minLength": 8,
                "type": "string"
              },
              "field": {
                "description": "What kind of fact is wrong: status (closed, reopened), hours, location, access (booking, tickets, transport), dates (an event), name, description, or other.",
                "enum": ["status", "hours", "location", "access", "dates", "name", "description", "other"],
                "type": "string"
              },
              "proposed_text": {
                "description": "What it should say instead, as plain text. Facts only, no prices.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "reason": {
                "description": "Why it is wrong, e.g. \"The traveller says it closed in spring 2026\" or \"The official site lists new hours\".",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              },
              "source_url": {
                "description": "Optional: a page that supports the correction, ideally the place's own website. It speeds review.",
                "maxLength": 300,
                "type": "string"
              },
              "url": {
                "description": "The meridiandispatch.com page to correct, as returned in source.url or canonical_url.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["current_text", "proposed_text", "reason", "url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duplicate": {
                "type": "boolean"
              },
              "id": {
                "type": "string"
              },
              "next": {
                "description": "What happens to the suggestion now.",
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "received": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Suggest a correction to a Meridian Dispatch page"
          },
          "behavior": {
