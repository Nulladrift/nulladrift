        {
          "name": "search_guides",
          "title": "Search the travel guides",
          "description": "Search every Meridian Dispatch travel guide by keyword: long-form dispatches, multi-day itineraries, country and town guides, venues (sights, museums, beaches, parks), trails and scenic drives, events and ski resorts. Use it first when you do not know the exact page. Once you know the place, read it in full with get_destination (a country or town), get_place (one sight, trail, event or ski resort) or get_dispatch (a dispatch or itinerary); for ranked top-ten lists use list_best_places, for a month use get_best_time. Returns up to `limit` pages ranked by relevance, each with its type, title, country, town, a one-line summary, a citable URL and when it was last updated. Ranking is keyword-based with travel synonyms; a country or month named in the query is honoured. Read-only. When nothing matches it returns an error message; retry with a broader query or a place name.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Return only pages in this country, by English name, e.g. \"Iceland\". Omit to search worldwide.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Most results to return, 1 to 20. Defaults to 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the traveller wants, in plain words: a place name (\"Kotor\"), an activity and a place (\"glacier hike Iceland\") or a theme (\"festivals in Japan\").",
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Only this part of the world. Use it for asks like \"festivals in Europe\"; country is more precise when the traveller names one.",
                "enum": ["Europe", "Asia", "Middle East", "Africa", "North America", "Central America and the Caribbean", "South America", "Oceania"],
                "type": "string"
              },
              "type": {
                "description": "Return only one kind of page: dispatch (a reported long-form piece), itinerary (a multi-day country route), country or town (destination guides), town_compare (the towns of one country compared as places to stay, by need), venue (one sight), trail (a hike or scenic drive), event (a festival), ski_resort, museum (must-see works with their rooms and floors) or airport (how to get from the terminal to each town, airlines and routes, security, food, layovers). Omit to search all kinds.",
                "enum": ["dispatch", "itinerary", "country", "town", "town_compare", "venue", "trail", "event", "ski_resort", "museum", "airport"],
                "type": "string"
