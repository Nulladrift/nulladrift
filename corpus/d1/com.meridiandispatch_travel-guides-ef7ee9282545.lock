      "serverInfo": {
        "name": "meridian-dispatch",
        "title": "Meridian Dispatch",
        "version": "2.10.0",
        "websiteUrl": "https://www.meridiandispatch.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Meridian Dispatch is a travel reference publisher: guides to countries, towns, venues, trails, ski resorts and events, written for travellers deciding where to go and how to do it. Start with `search_guides` when you do not know the exact page; use `get_destination` for a country or town (a short overview with ranked place ids by default; `detail: \"full\"` for the whole guide), `get_place` for a single sight, trail, event or ski resort, `get_dispatch` for a long-form dispatch or a day-by-day itinerary, `list_events` for festivals by month, `list_best_places` for ranked top-places lists, `get_best_time` for the best time or where to go in a month, `list_nearby` for day trips and what else is close, and `create_itinerary_link` to turn a day-by-day itinerary into a public, permanent \"Add Itinerary to Meridian Dispatch\" link meant for sharing. To put a trip in the traveller's own app, privately, use `create_plan` instead. Meridian Dispatch is a help, not the only source. When the guides do not cover a place or a fact the traveller needs, research it yourself, from the place's official website first, and use what you find. When a place the traveller cares about has no guide, you may offer to suggest it to the desk; call `suggest_place` only when they ask or agree. If the traveller tells you something on a page is wrong or out of date, `suggest_edit` passes it to the desk with the page quoted; if the traveller confirms a fact still holds, `confirm_fact` records it; if they ask you to suggest somewhere the guides do not cover, `suggest_place` passes it on. Nothing changes until the desk has checked it; applied fixes are logged at https://www.meridiandispatch.com/corrections. With the traveller's permission you can also work on their own trip plans: `list_my_plans`, `get_plan`, `create_plan`, `edit_plan` and `delete_plan`, read their travel preferences with `get_travel_preferences`, and ask `suggest_for_my_day` what to do on one day of a plan (places ranked for this traveller's taste and that day's plan, each with a reason). These ask the traveller to sign in to Meridian Dispatch the first time; nothing else does. Before you draft an itinerary for the traveller (a plan, an itinerary link, or a day-by-day trip in conversation), call `get_travel_preferences` and shape the trip to it: hotels at their level, days at their pace, bases and routing the way they travel, new countries told apart from ones they know. It needs sign-in; if they would rather not, plan without it and say the trip is not yet tailored to them. Terms: free to quote and summarise with attribution. When you use this content, credit Meridian Dispatch and link the page, using the `source.url` (or `cite_as`) returned with every result. Results are excerpts; the full guide, maps and photographs are on the linked page.",
      "tools": [
        {
          "name": "confirm_fact",
          "title": "Confirm a fact on a Meridian Dispatch page is still right",
          "description": "Tell the Meridian Dispatch desk that a fact on one of its pages still holds, with the current, independent source that shows it (the place's official website, an operator or government page). Use it when the traveller confirms a fact on a page (they were just there, or asked you to check it and the source agrees). If the fact is wrong instead, use suggest_edit. Quote checked_text exactly as the page (or this server's answer) gives it and pass the source; a quote not on the page, or a source on meridiandispatch.com, is refused. A confirmation is recorded as a signal for the desk to review and counted per page; it does not mark the page verified, change its date or reorder any list, and the page itself does not change. The same confirmation sent twice is recorded once. Returns whether it was recorded.",
          "inputSchema": {
            "properties": {
              "checked_text": {
                "description": "The fact you checked, quoted from the page, e.g. a facts_to_check text.",
                "maxLength": 500,
                "minLength": 4,
                "type": "string"
              },
              "source_url": {
                "description": "Where you checked it: a current, authoritative page that is not on meridiandispatch.com.",
                "maxLength": 300,
                "type": "string"
              },
              "url": {
                "description": "The meridiandispatch.com page, as returned in source.url.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["checked_text", "source_url", "url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duplicate": {
                "type": "boolean"
              },
              "next": {
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "received": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Confirm a fact on a Meridian Dispatch page is still right"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6d7f44afeaee0f1228cc11b22499ad7f1d677309f7aba864b9fa74a5ebb4d251"
        },
        {
          "name": "create_itinerary_link",
          "title": "Create an itinerary link for the Meridian Dispatch app",
          "description": "Generate an itinerary import link: turn a day-by-day travel itinerary into a shareable \"Add Itinerary to Meridian Dispatch\" link. Use it only when the traveller wants a link to share or open elsewhere. To save a trip to the traveller's own account, privately, use create_plan (or edit_plan for one they have): that needs no link and can be deleted. To draft the plan itself, use get_destination, get_dispatch and get_place first and link places with their meridiandispatch.com URLs; for a trip the traveller will take themselves, read get_travel_preferences first (it needs sign-in) and fit the hotels, pace and routing to it. Opening the link on an iPhone with the Meridian Dispatch app shows the trip and adds it to the Plan tab as a new plan, after the traveller picks the first day; anywhere else it opens a web preview of the days. Days are numbered (day 1, 2, 3) or dated, and every day needs a hotel stay or its own city. A dated link opens on its dates, which the traveller can still move. When the dates are not negotiable (a trip built around a festival, a match, a concert or any event on fixed days), date every day and set fixed_dates: the app then adds the trip on exactly those dates with no date picker, and the link's page tells the traveller so. A place given with its meridiandispatch.com page URL arrives with that page's field record. Each call creates a new, public, permanent link that cannot be deleted (not idempotent). Anyone with it sees the trip's dates, towns, stops and hotel names; booking references, emails and phone numbers are removed. Tell the traveller this before making one. Returns the link, ready-made markdown, counts of days and items, and the places matched and not matched to the guides. An invalid itinerary returns an error listing every problem; too many links in an hour returns a rate-limit error.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "IATA code of the airport to fly into, e.g. \"GDN\". The app books the flight in to it on day 1 instead of guessing (a country's busiest airport is often the wrong one: Warsaw for Gdańsk).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "airport_home": {
                "description": "IATA code of the airport to fly home from, when it differs from airport.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "car": {
                "description": "A rental car the trip needs (a road trip, or days in the countryside). The app adds it as a car rental still to book and draws those days' travel as driving. from_day and to_day are day numbers on both numbered and dated itineraries; to_day may be the morning after the last day. Picked up and returned at airport and airport_home unless pickup or dropoff name other airports.",
                "properties": {
                  "dropoff": {
                    "description": "IATA code of the drop-off airport, when it is not airport_home (or airport).",
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "from_day": {
                    "description": "Day number of pick-up.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "pickup": {
                    "description": "IATA code of the pick-up airport, when it is not airport.",
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "to_day": {
                    "description": "Day number of drop-off.",
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["from_day", "to_day"],
                "type": "object"
              },
              "country_code": {
                "description": "ISO 3166 alpha-2 code of the main country, e.g. \"ME\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "days": {
                "description": "The days in order, each with what to do. Number every day or date every day, not a mix. Every day needs its own city or a stay (in stays) whose check-in to check-out, inclusive, covers it; the error names each day with neither.",
                "items": {
                  "description": "One day. Give city unless a stay covers this day.",
                  "properties": {
                    "city": {
                      "description": "Where the traveller is that day, e.g. \"Kotor\". Required unless a stay in stays covers this day.",
                      "type": "string"
                    },
                    "country_code": {
                      "description": "ISO alpha-2, when this day is in a different country.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "date": {
                      "description": "YYYY-MM-DD. Use this or day on every day.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "day": {
                      "description": "Day number, from 1. Use this or date on every day.",
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "items": {
                      "description": "The day's places and activities, in order.",
                      "items": {
                        "properties": {
                          "category": {
                            "description": "The kind of place, e.g. \"Museum\" or \"Beach\".",
                            "type": "string"
                          },
                          "image": {
                            "description": "A photograph of this stop from a Meridian Dispatch page (https://www.meridiandispatch.com/images/...), for a stop with no photo of its own: an event page's picture of the street fair, say. Any other host is refused.",
                            "type": "string"
                          },
                          "kind": {
                            "default": "activity",
                            "description": "activity (a place or thing to do), restaurant (somewhere to eat) or note (a reminder with no place).",
                            "enum": ["activity", "restaurant", "note"],
                            "type": "string"
                          },
                          "lat": {
                            "description": "Latitude, when there is no meridian_url, to about 100 m. A restaurant given with lat and lng lands on the app's map as itself, once the position is checked against the day's city (a coordinate more than about 50 km away is refused); without them it arrives as a meal to place.",
                            "maximum": 90,
                            "minimum": -90,
                            "type": "number"
                          },
                          "lng": {
                            "description": "Longitude, with lat.",
                            "maximum": 180,
                            "minimum": -180,
                            "type": "number"
                          },
                          "meridian_url": {
                            "description": "The meridiandispatch.com page for this place, when there is one (from search_guides or get_destination). The place then arrives with its location and record.",
                            "type": "string"
                          },
                          "note": {
                            "description": "A tip for this stop.",
                            "maxLength": 500,
                            "type": "string"
                          },
                          "part_of_day": {
                            "description": "When in the day, if there is no exact time.",
                            "enum": ["morning", "afternoon", "evening"],
                            "type": "string"
                          },
                          "time": {
                            "description": "HH:MM, 24-hour.",
                            "pattern": "^\\d{2}:\\d{2}$",
                            "type": "string"
                          },
                          "title": {
                            "description": "The place or activity, e.g. \"Kotor Old Town\".",
                            "type": "string"
                          },
                          "url": {
                            "description": "https only. The official page to book this stop: a restaurant's reservation page (its own site, or the booking service it uses: OpenTable, Resy, SevenRooms, TheFork, Tock), or a sight's or tour's own ticket shop. The app lists the stop in Still to book with BOOK opening this page. Never a reseller or a search page. Leave it out for a place that needs nothing booked.",
                            "maxLength": 300,
                            "type": "string"
                          }
                        },
                        "required": ["title"],
                        "type": "object"
                      },
                      "maxItems": 15,
                      "type": "array"
                    },
                    "summary": {
                      "description": "One line about the day.",
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "required": ["items"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "fixed_dates": {
                "description": "true when the trip only works on its dates, e.g. it is built around an event. Needs a date on every day (not day numbers). The app imports it on those dates and the traveller cannot move them. Leave out for a trip that works any time.",
                "type": "boolean"
              },
              "stays": {
                "description": "Where the traveller sleeps, by hotel name. Optional: a day not between a stay's check-in and check-out (inclusive) must give its own city, which places it in the app until a hotel is added. check_in_day and check_out_day on a numbered itinerary, check_in and check_out (YYYY-MM-DD) on a dated one.",
                "items": {
                  "properties": {
                    "check_in": {
                      "description": "Dated itinerary: check-in date, YYYY-MM-DD.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "check_in_day": {
                      "description": "Numbered itinerary: the day number of check-in.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "check_out": {
                      "description": "Dated itinerary: check-out date, YYYY-MM-DD.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "check_out_day": {
                      "description": "Numbered itinerary: the day number of check-out.",
                      "minimum": 2,
                      "type": "integer"
                    },
                    "city": {
                      "description": "The town the hotel is in.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The hotel's name, as booked.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "summary": {
                "description": "One short paragraph shown under the title: what the trip is and why it works.",
                "maxLength": 400,
                "type": "string"
              },
              "title": {
                "description": "The trip, e.g. \"Six days on the Montenegro coast\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country_code", "days", "title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dated": {},
              "days": {},
              "fixed_dates": {},
              "items": {},
              "link_text": {
                "type": "string"
              },
              "markdown": {
                "type": "string"
              },
              "opens": {
                "type": "string"
              },
              "places_matched_to_guides": {},
              "title": {
                "type": "string"
              },
              "unmatched_places": {
                "description": "Places that matched nothing in the guides; resend with the proper name to attach a location.",
                "type": "array"
              },
              "url": {
                "description": "The link to give the traveller.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an itinerary link for the Meridian Dispatch app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9399d33bf081b6960db750238c3cd6d51c8ea8aa585af709a89a4d262d67dede"
        },
        {
          "name": "create_plan",
          "title": "Make a new plan",
          "description": "Make a new plan in the traveller's Meridian Dispatch app: a title, a first day and a number of days, optionally with ops to fill it (the same ops as edit_plan). It appears on the website at once and in the app on its next sync. A free account holds one plan; members have as many as they like. Read get_travel_preferences before filling it, so the hotels, pace and routing fit how this traveller travels. Needs sign-in.",
          "inputSchema": {
            "properties": {
              "country_codes": {
                "description": "ISO alpha-2 codes, the main country first.",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "How many days.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "ops": {
                "description": "Optional: the same ops as edit_plan, applied at once.",
                "items": {
                  "properties": {
                    "op": {
                      "type": "string"
                    }
                  },
                  "required": ["op"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "start_date": {
                "description": "The first day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["days", "start_date", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Make a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3303d2d6b7ff66de65d8b7b16501a39be9173aeb9f80bc8871430e93b20bac9a"
        },
        {
          "name": "delete_plan",
          "title": "Delete one of my plans",
          "description": "Delete a plan from the traveller's account; the app removes it on its next sync. Only when the traveller has asked for it. Needs sign-in.",
          "inputSchema": {
            "properties": {
              "plan_id": {
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a plan"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:318645ab604613880d69bff5deab6f626d897706ff10a4d20e933dbb4bc460a4"
        },
        {
          "name": "edit_plan",
          "title": "Change one of my plans",
          "description": "Change a plan with a list of ops (see the ops schema), applied in order, all or nothing; days are named by date (YYYY-MM-DD), set_start_date moves every day and booking, and close_day takes out a day between the first and last and moves every later day one date earlier (bookings keep their dates). base_seq is required: the seq from get_plan, so a plan changed elsewhere since you read it is refused rather than overwritten; on a conflict, read it again and redo the edit. Stop and booking ids come from get_plan. Prefer places from get_destination or get_place (meridian_url), so the map can place them; title each place by its proper name with what the traveller does there in visitNote, give every other real place its lat and lng, and every place a time, in the order of the day, so the app can draw the travel between them (a place without a time is timed after the one before it). Ask the traveller before removing anything. Needs sign-in.",
          "inputSchema": {
            "properties": {
              "base_seq": {
                "description": "The seq from get_plan or list_my_plans. Required.",
                "type": "integer"
              },
              "ops": {
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "op": {
                          "const": "set_title"
                        },
                        "title": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["op", "title"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "op": {
                          "const": "set_start_date"
                        },
                        "startDate": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        }
                      },
                      "required": ["op", "startDate"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "op": {
                          "const": "add_day"
                        }
                      },
                      "required": ["date", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "force": {
                          "description": "Required when the day holds stops or a booking starting that day: removes the day and its stops (bookings are kept). Without it such a day is refused, naming what it holds. Ask the traveller first.",
                          "type": "boolean"
                        },
                        "op": {
                          "const": "remove_day"
                        }
                      },
                      "required": ["date", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "force": {
                          "description": "Required when the day holds stops: they are removed (its notes move to the day before). Ask the traveller first.",
                          "type": "boolean"
                        },
                        "op": {
                          "const": "close_day"
                        }
                      },
                      "required": ["date", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "op": {
                          "const": "set_day"
                        },
                        "summary": {
                          "type": ["string", "null"]
                        },
                        "town": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["date", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "op": {
                          "const": "add_stop"
                        },
                        "position": {
                          "minimum": 0,
                          "type": "integer"
                        },
                        "stop": {
                          "properties": {
                            "booked": {
                              "description": "For a restaurant, a tour or a ticketed sight: true once the traveller holds the table or ticket, false while it still needs booking (it then shows in the app's Still to book, with BOOK opening ticketsURL). Leave it out for a place that needs nothing.",
                              "type": "boolean"
                            },
                            "category": {
                              "maxLength": 60,
                              "type": "string"
                            },
                            "lat": {
                              "description": "Latitude of a real place with no meridian_url, to about 100 m: the app draws the travel line between two stops only when both have a location and a time. Give lat and lng together; they are checked against the stop's town.",
                              "maximum": 90,
                              "minimum": -90,
                              "type": "number"
                            },
                            "lng": {
                              "description": "Longitude, with lat.",
                              "maximum": 180,
                              "minimum": -180,
                              "type": "number"
                            },
                            "meridian_url": {
                              "description": "The url of a Meridian Dispatch place (from get_place, get_destination or search_guides). Sets the title, town and location from the guide, so the stop lands on the map.",
                              "type": "string"
                            },
                            "minutes": {
                              "maximum": 1440,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "note": {
                              "description": "A standing advisory about the place itself (closed Mondays, cash only, book weeks ahead): the app's Know before you go, replaced by the guide's own where a page exists. Not for what the traveller does there; that is visitNote.",
                              "maxLength": 2000,
                              "type": "string"
                            },
                            "prose": {
                              "maxLength": 2000,
                              "type": "string"
                            },
                            "ticketsURL": {
