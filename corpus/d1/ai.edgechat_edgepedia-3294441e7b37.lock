          "digest": "sha256:93363db6da542b7ead069b3c43b18fd584bd74267c579cc7c32205bd1fe34f80"
        },
        {
          "name": "resolve",
          "title": "Resolve a name to an Edgepedia article",
          "description": "Find which encyclopedia article a name means: Edgepedia's best match for a person, place, thing, or concept named in a text, with a confidence, whether the name is ambiguous, and the alternatives. Pass the name (\"Mercury\"), and optionally words from the text around it (`context`: \"planet orbit\") or a topic id the article must sit under (`type`). Returns `result` (id, title, url) and `alternatives`; pass an id to `fetch`.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Words from the text around the name, which favor the article they fit.",
                "type": "string"
              },
              "limit": {
                "description": "Candidates to return, 1 to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "The name as the text gives it.",
                "type": "string"
              },
              "type": {
                "description": "Only articles under this topic id (as `fetch` topic:… names it, without \"topic:\").",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "items": {
                  "properties": {
                    "canonical_id": {
                      "type": "string"
                    },
                    "confidence": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "match": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "ambiguous": {
                "type": "boolean"
              },
              "confidence": {
                "type": "number"
              },
              "match": {
                "enum": ["exact", "alias", "anchor", "partial", "none"],
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "result": {
                "anyOf": [
                  {
                    "properties": {
                      "canonical_id": {
                        "type": "string"
                      },
                      "confidence": {
                        "type": "number"
                      },
                      "id": {
                        "type": "string"
                      },
                      "match": {
                        "type": "string"
                      },
                      "text": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["id", "title", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["alternatives", "ambiguous", "confidence", "match", "query", "result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
