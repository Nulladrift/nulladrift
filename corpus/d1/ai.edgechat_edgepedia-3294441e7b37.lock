              "mimeType": "image/png",
              "sizes": ["512x512"]
            }
          ],
          "digest": "sha256:fd3bcb45d63713c17852b57741b7bbc60f8d2ed4f5fff8dc5258267028bf847c"
        },
        {
          "name": "search",
          "title": "Search Edgepedia",
          "description": "Search an encyclopedia for facts about a person, place, thing, event, or concept: Edgepedia, more than 500,000 articles with citations. Pass the subject's name (\"Mount Fuji\", \"photosynthesis\"), not a question; other names and misspellings match, and when no title matches, articles whose text does follow, marked `match: fulltext`. Returns results with id, title, url, and preview text, plus a `topic:` result when the query names a topic (\"painters\"); pass an id to `fetch`. `limit` and `page` reach further results.",
          "inputSchema": {
            "properties": {
              "first": {
                "description": "true = only the best match.",
                "type": "boolean"
              },
              "limit": {
                "description": "Results a page, 1 to 30 (default 10).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Which page of results, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The name of a subject, or words from an article title.",
                "type": "string"
              },
              "sort": {
                "description": "central = the most-linked subjects first.",
                "enum": ["relevance", "central"],
                "type": "string"
              },
              "topic": {
                "description": "Only articles under this topic id (as `fetch` topic:… names it, without \"topic:\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "did_you_mean": {
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "pages": {
                "description": "Pages of results at this limit; pass `page` for the next.",
                "type": "integer"
              },
              "results": {
                "items": {
                  "properties": {
                    "articles": {
                      "description": "A topic only: the articles under it.",
                      "type": "integer"
                    },
                    "canonical_id": {
                      "description": "The article's permanent id (ep…); `fetch` takes it, and it outlives an address change.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "text": {
                      "description": "The corpus snippet when available, otherwise the article opening; for a topic its article count and place in the tree.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Edgepedia"
