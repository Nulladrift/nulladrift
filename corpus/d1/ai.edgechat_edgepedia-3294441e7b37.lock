            }
          ],
          "digest": "sha256:51ab2a4e7ad8671d99ef2d07cf8ae85b75f9a7fdff0a8c6e44fab4efe8a85028"
        },
        {
          "name": "related",
          "title": "Related Edgepedia articles",
          "description": "Find encyclopedia articles related to an Edgepedia article: its topic-mates, a few from each neighboring topic, and its geography neighbors. Pass its id, as for `fetch`. Returns groups of results; `fetch` a group's `topic` id for more.",
          "inputSchema": {
            "properties": {
              "by": {
                "description": "\"links\" = articles cited together with it, and articles linking to what it links to.",
                "enum": ["links"],
                "type": "string"
              },
              "id": {
                "description": "An article's id, as `search` returns it (such as \"mount-fuji\").",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["cousins", "geo", "id", "siblings", "title", "url"]
              },
              {
                "required": ["by", "cocited", "coupled", "id", "title", "url"]
              }
            ],
            "properties": {
              "by": {
                "enum": ["links"],
                "type": "string"
              },
              "cocited": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "coupled": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "cousins": {
                "type": "array"
              },
              "geo": {
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "siblings": {
                "type": ["object", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Related Edgepedia articles"
