      "instructions": "Edgepedia is a free encyclopedia for facts about people, places, events, and concepts: more than 500,000 articles with citations, by EdgeChat. Call `search` with a subject's name (\"Mount Fuji\"), not a question; a result's `text` often answers a simple fact. Call `fetch` with a result's id for the whole article, or with a `topic:` id for a topic's articles. Link each article you use; show its `credit` line with any text you quote. Corpus release metadata: {\"corpus_version\":\"1.9.2\",\"corpus_updated\":\"2026-11-11\",\"release_notes\":\"https://www.edgepedia.org/edgepedia/updates#1.9.2\"}. These fields describe the published General corpus, not the MCP server software version. Reference cards for websites: https://www.edgepedia.org/developers#reference-cards.",
      "tools": [
        {
          "name": "connect",
          "title": "Connect two Edgepedia articles",
          "description": "Find the shortest chain of in-text links from one Edgepedia article to another (at most 6 hops), with the sentence that makes each hop; pass two ids as `search` returns them.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "The starting article's id (such as \"koala\"), its ep… id, or its title.",
                "type": "string"
              },
              "to": {
                "description": "The target article, named the same ways.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "from": {
                "type": "string"
              },
              "hops": {
                "type": "integer"
              },
              "path": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "type": "string"
              },
              "steps": {
                "items": {
                  "properties": {
                    "anchor": {
                      "type": ["string", "null"]
                    },
                    "from": {
                      "type": "string"
                    },
                    "sentence": {
                      "type": ["string", "null"]
                    },
                    "to": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["found", "from", "text", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect two Edgepedia articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://www.edgepedia.org/assets/edgepedia-mark-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            }
          ],
          "digest": "sha256:4b90e54ac47845754ba485bf816d910149838de95f43113e8c8de2fadc5f324e"
        },
        {
          "name": "fetch",
          "title": "Fetch an Edgepedia article",
          "description": "Read an encyclopedia article in full: one Edgepedia article as Markdown with its citations, by a `search` result's id. Returns id, title, text, url, and metadata (topic path, license, credit). A `topic:` id lists that topic's parent, narrower topics, and articles, 120 a page; `topic:root` is the top of the tree, `topic:geo` the geography tree. `citations: false` gives [n] markers instead of inline source links. Show the `credit` line with any text you quote.",
          "inputSchema": {
            "properties": {
              "chunks": {
                "description": "true = the text as paragraphs with stable ids, in `chunks`.",
                "type": "boolean"
              },
              "citations": {
                "description": "Default true. false = [n] markers instead of inline source links; the numbered reference list stays.",
                "type": "boolean"
              },
              "cite": {
                "description": "Add a reference in this format (csl, bibtex, ris, apa, mla, chicago, harvard).",
                "enum": ["csl", "bibtex", "ris", "apa", "mla", "chicago", "harvard"],
                "type": "string"
              },
              "cursor": {
                "description": "Where to continue, from a cut text's `next_cursor`.",
                "type": "string"
              },
              "format": {
                "description": "The text as plain text, HTML, JSON-LD, or Turtle instead of Markdown.",
                "enum": ["text", "html", "jsonld", "turtle"],
                "type": "string"
              },
              "id": {
                "description": "The id of a search result (the last part of the article's address, such as \"mount-fuji\", or a topic's \"topic:…\" id).",
                "type": "string"
              },
              "ids": {
                "description": "More ids to fetch with `id` in one call, up to 10 in all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "The article in this language, by its code (\"es\", \"zh\"): the translation when one is stored; otherwise the English, with how to have it translated.",
                "enum": ["en", "zh", "ar", "hi", "es", "fr", "bn", "pt", "id", "ur", "ru", "de", "ja", "pa", "mr", "vi", "te", "tr", "tl", "ta", "fa", "ko", "th", "it", "gu", "kn", "my", "pl", "uk", "or", "ml"],
                "type": "string"
              },
              "length": {
                "description": "snippet or lead for a short text; full (default) for the whole article.",
                "enum": ["snippet", "lead", "full"],
                "type": "string"
              },
              "links": {
                "description": "Add the articles linking here (in), the links it makes (out), or both.",
                "enum": ["in", "out", "both"],
                "type": "string"
              },
              "links_page": {
                "description": "With links \"in\" or \"both\": which 30 articles linking here, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "max_tokens": {
                "description": "Cut the text at a section boundary to about this many tokens; pass `next_cursor` as `cursor` for the rest.",
                "type": "integer"
              },
              "outline": {
                "description": "true = add the list of the article's headings.",
                "type": "boolean"
              },
              "page": {
                "description": "A topic only: which page of its articles, from 1.",
                "type": "integer"
              },
              "query": {
                "description": "Only the 3 passages that best match these words, each with a `cite_url`.",
                "type": "string"
              },
              "quote": {
                "description": "A sentence from the article, or a chunk id: adds a `cite_url` that opens the page at it.",
                "type": "string"
              },
              "section": {
                "description": "Only this section, by its heading (\"Etymology\", \"History\").",
                "type": "string"
              },
              "tables": {
                "description": "true = add the article's tables as JSON and CSV.",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["id", "text", "title", "url"]
              },
              {
                "required": ["results"]
              }
            ],
            "properties": {
              "canonical_id": {
                "description": "The article's permanent id (ep…); `fetch` takes it, and it outlives an address change.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "moved_from": {
                "description": "The id asked for, when the article has since moved; store `id` or `canonical_id` instead.",
                "type": "string"
              },
              "results": {
                "description": "With `ids`: one entry per id, in order: that fetch's answer, or { id, error: { code, message } }.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch an Edgepedia article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
