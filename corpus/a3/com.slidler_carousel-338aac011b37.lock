{
  "lockfileVersion": 2,
  "subjects": {
    "com.slidler/carousel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://slidler.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "slidler",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_carousel",
          "description": "Create a branded carousel and temporary PDF from a public URL or text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "n": {
                "default": 6,
                "description": "Signed decimal integer n is clamped to 6..8; non-integer n defaults to 6. The response reports effective n.",
                "type": "integer"
              },
              "source": {
                "description": "Source text; at least 40 printable non-whitespace characters. Or a public HTTP(S) URL. Text cap: 1800 UTF-8 bytes; URL cap: 2048 UTF-8 bytes.",
                "type": "string"
              },
              "title": {
                "description": "Optional title, allowed only with text.",
                "type": "string",
                "x-max-utf8-bytes": 100
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_version": {
                "const": "1"
              },
              "caption_status": {
                "type": ["string", "null"]
              },
              "kind": {
                "enum": ["text", "url", "youtube-transcript", "youtube-description"]
              },
              "n": {
                "maximum": 8,
                "minimum": 6,
                "type": "integer"
              },
              "page_count": {
                "maximum": 10,
                "minimum": 2,
                "type": "integer"
              },
              "pdf": {
                "additionalProperties": false,
                "properties": {
                  "byte_length": {
                    "maximum": 262144,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "mime_type": {
                    "const": "application/pdf"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["byte_length", "expires_at", "mime_type", "url"],
                "type": "object"
              },
              "point_count": {
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "renderer_version": {
                "const": "helvetica-3"
              },
              "slides": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "b": {
                      "type": "string"
                    },
                    "h": {
                      "type": "string"
                    },
                    "k": {
                      "enum": ["cover", "point", "cta"]
                    }
                  },
                  "required": ["b", "h", "k"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["api_version", "caption_status", "kind", "n", "page_count", "pdf", "point_count", "renderer_version", "slides", "title", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create carousel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:418239b6c865802ebfc0caa48aca1fa65f55592001160ea4d01ba5635a38cb75"
        }
      ],
      "digest": "sha256:9b0872238397dca058a022b0ed23ffa887b87798d47d762b2e7d74c2a08d527c"
    }
  }
}
