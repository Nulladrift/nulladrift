        {
          "name": "generate_photo",
          "title": "Generate AI photos",
          "description": "Generate AI photos from face images, using a preset theme or a custom prompt. Costs 100 credits per photo. Upload the face photos with upload_image first, and find theme slugs with browse_themes.\n\nRequires a connected Photo AI Studio account. Calling this tool starts the sign-in flow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Output aspect ratio",
                "enum": ["1:1", "2:3", "3:2", "16:9", "9:16"],
                "type": "string"
              },
              "category": {
                "description": "Theme slug from browse_themes, required when type is themed",
                "type": "string"
              },
              "gender": {
                "description": "Gender category for theme selection",
                "enum": ["male", "female", "groups", "pets", "product"],
                "type": "string"
              },
              "images": {
                "description": "CDN URLs of face photos (1-9), from upload_image",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "num_images": {
                "description": "Number of variations to generate (1-4)",
                "type": "number"
              },
              "prompt": {
                "description": "Custom prompt, required when type is custom",
                "type": "string"
              },
              "style": {
                "description": "Style override, for example \"realistic\"",
                "type": "string"
              },
              "type": {
                "description": "themed uses a preset style, custom uses your prompt",
                "enum": ["themed", "custom"],
                "type": "string"
              },
              "wait_for_result": {
                "description": "Wait up to 55 seconds for the result before returning. Defaults to false: the tool returns a prediction_id immediately and you poll get_prediction, which is the reliable pattern for photos and videos.",
                "type": "boolean"
              }
            },
            "required": ["gender", "images"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate AI photos"
          },
          "behavior": {
            "destructive": false,
