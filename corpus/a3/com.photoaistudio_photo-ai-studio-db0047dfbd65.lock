          "description": "Upload an image to the Photo AI Studio CDN and get back a URL. generate_photo, edit_image, and create_video all take CDN URLs, so start here. Accepts a public image URL or base64 data, up to 10 MB.\n\nRequires a connected Photo AI Studio account. Calling this tool starts the sign-in flow.",
          "inputSchema": {
