        {
          "name": "browse_themes",
          "title": "Browse photo themes",
          "description": "Browse the photo themes available for generation, optionally filtered by gender category or a keyword. Returns the theme slugs that generate_photo expects.\n\nRequires a connected Photo AI Studio account. Calling this tool starts the sign-in flow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gender": {
                "description": "Filter themes by gender category",
                "enum": ["male", "female", "groups", "pets", "product"],
                "type": "string"
              },
              "tag": {
                "description": "Search themes by name or keyword",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse photo themes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fbbedff57ec7cf68c1990983ba5fc0f6cc6bb8fc539b3a521a99b9588c7a04d"
        },
        {
          "name": "create_video",
          "title": "Create a video",
          "description": "Create an AI video. Costs 500 credits for a video, or 100 credits for a product_holder image.\n\nTypes:\n- image_to_video: animate an image (image_url, prompt)\n- ugc: a spokesperson video from a script (script, voice_id)\n- product_holder: a person presenting a product (product_image_url)\n\nRequires a connected Photo AI Studio account. Calling this tool starts the sign-in flow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Output aspect ratio",
                "type": "string"
              },
              "duration": {
                "description": "Duration in seconds, default 4",
                "type": "number"
              },
              "emotion": {
                "description": "UGC emotion, default neutral",
                "type": "string"
              },
              "gender": {
                "description": "UGC model gender",
                "type": "string"
              },
              "image_url": {
                "description": "CDN URL of the image to animate",
                "type": "string"
              },
              "language": {
                "description": "UGC language, default English",
                "type": "string"
              },
              "output_type": {
                "description": "product_holder output: image costs 100 credits, video costs 500",
                "enum": ["image", "video"],
                "type": "string"
              },
              "person_image_url": {
                "description": "Person image for product_holder",
                "type": "string"
              },
              "person_prompt": {
                "description": "Person description for product_holder",
                "type": "string"
              },
              "product_image_url": {
                "description": "Product image, required for product_holder",
                "type": "string"
              },
              "prompt": {
                "description": "Animation prompt, required for image_to_video",
                "type": "string"
              },
              "resolution": {
                "description": "Video resolution, default 720p",
                "type": "string"
              },
              "script": {
                "description": "UGC script, up to 150 characters",
                "type": "string"
              },
              "type": {
                "description": "Type of video to create",
                "enum": ["image_to_video", "ugc", "product_holder"],
                "type": "string"
              },
              "voice_id": {
                "description": "Voice ID for UGC",
                "type": "string"
              },
              "wait_for_result": {
                "description": "Wait up to 55 seconds for the result before returning. Defaults to false: the tool returns a prediction_id immediately and you poll get_prediction, which is the reliable pattern for photos and videos.",
                "type": "boolean"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:42b0daff61608ed3eaab5323ea2d35b38cc3152f7a92143f4fcb42ed20ffb2a5"
        },
        {
          "name": "edit_image",
          "title": "Edit a photo",
          "description": "Edit a photo with one of 19 AI operations. Credit costs: remove_background 10, replace_background 3, everything else 100.\n\nOperations and their required arguments:\n- remove_background (image_url)\n- replace_background (image_url, prompt)\n- retouch (image_url, prompt)\n- skin (image_url)\n- hair (image_url, plus hairstyle or reference_image_url)\n- makeup (image_url)\n- age (image_url, target_age)\n- expression (image_url, target_expression)\n- body_type (image_url, target_body_type)\n- eye_color (image_url, target_eye_color)\n- color_correction (image_url)\n- custom (image_url, prompt)\n- clothes (image_url, clothes_image_url)\n- try_on (image_url, clothes_image_url)\n- product (image_url, product_image_url)\n- upscale (image_url)\n- restore (image_url)\n- face_swap (source_image_url, target_image_url)\n- extend (image_url)\n\nEvery image argument must be a CDN URL from upload_image.\n\nRequires a connected Photo AI Studio account. Calling this tool starts the sign-in flow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clothes_image_url": {
                "description": "Clothes image for clothes and try_on",
                "type": "string"
              },
              "hair_color": {
                "description": "Target hair color for the hair operation",
                "type": "string"
              },
              "hairstyle": {
                "description": "Target hairstyle for the hair operation",
                "type": "string"
              },
              "image_url": {
                "description": "CDN URL of the image to edit, required for every operation except face_swap",
                "type": "string"
              },
              "num_images": {
                "description": "Number of variations for try_on (1-4)",
                "type": "number"
              },
              "operation": {
                "description": "The edit operation to perform",
                "enum": ["remove_background", "replace_background", "retouch", "skin", "hair", "makeup", "age", "expression", "body_type", "eye_color", "color_correction", "custom", "clothes", "try_on", "product", "upscale", "restore", "face_swap", "extend"],
                "type": "string"
              },
              "product_image_url": {
                "description": "Product image for the product operation",
                "type": "string"
              },
              "prompt": {
                "description": "Text prompt for replace_background, retouch, and custom",
                "type": "string"
              },
              "reference_image_url": {
                "description": "Reference image for hair or custom",
                "type": "string"
              },
              "source_image_url": {
                "description": "Source face image for face_swap",
                "type": "string"
              },
              "target_age": {
                "description": "Target age for the age operation",
                "type": "number"
              },
              "target_body_type": {
                "description": "Target body type",
                "type": "string"
              },
              "target_expression": {
                "description": "Target expression, for example \"happy\"",
                "type": "string"
              },
              "target_eye_color": {
                "description": "Target eye color",
                "type": "string"
              },
              "target_image_url": {
                "description": "Target image for face_swap",
                "type": "string"
              },
              "wait_for_result": {
                "description": "Wait up to 55 seconds for the result before returning. Defaults to false: the tool returns a prediction_id immediately and you poll get_prediction, which is the reliable pattern for photos and videos.",
                "type": "boolean"
              }
            },
            "required": ["operation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit a photo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
