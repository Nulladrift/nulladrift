          "name": "estimate_sending_engine",
          "title": "Estimate Sending Engine capacity",
          "description": "What a monthly budget buys in the managed SLSBMB AI Sending Engine — sending domains, inboxes, campaign emails a day and a month, new people a month, cost per email and per planned reply, and the month-by-month ramp — or the smallest budget that reaches a number of new people a month, with what agencies charge around that budget. Use it for questions like \"how many cold emails does $3,000 a month buy?\" or \"what budget reaches 5,000 new people a month?\". It covers one budget at a time; the whole price list is get_pricing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monthly_budget_usd": {
                "description": "Monthly budget in US dollars; the public ladder runs from 800 to 100000.",
