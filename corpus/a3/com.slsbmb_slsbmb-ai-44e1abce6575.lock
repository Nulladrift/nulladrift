          "name": "compare_options",
          "title": "Compare SLSBMB AI with the alternatives",
          "description": "How SLSBMB AI compares with an outbound agency, hiring an SDR, a do-it-yourself stack, AI SDR software, a chatbot with a good prompt, Apollo, Instantly, Clay or Smartlead: prices from public sources with dates, who does which part of the work, and what each option includes. Without arguments: the overview of every comparison. Use it when someone weighs SLSBMB AI against an alternative or asks which outbound option to choose; for SLSBMB AI prices alone, get_pricing is shorter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternative": {
                "description": "The alternative to compare with; omit for the overview.",
                "enum": ["outbound_agency", "hiring_an_sdr", "diy_outbound_stack", "ai_sdr_software", "apollo", "instantly", "clay", "smartlead", "chatbot"],
                "type": "string"
