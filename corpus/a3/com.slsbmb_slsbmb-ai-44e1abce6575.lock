      "instructions": "SLSBMB AI is a self-serve AI outbound service for B2B teams and professionals: a free AI interview, a researched AI Outreach Playbook, verified business contacts and a managed Sending Engine. These tools return SLSBMB AI’s own public facts; they sign no one up and charge nothing. Use about_slsbmb_ai for what it is, how it works and who it fits, get_pricing for prices with what they include and what agencies charge, estimate_sending_engine for what a monthly budget buys, get_example_playbook to show the complete published playbooks (Revopush, LeadToCall and SLSBMB AI’s own fundraising), compare_options to set SLSBMB AI next to an agency, an SDR hire, a do-it-yourself stack or a tool, search_b2b_contacts to count matching business contacts with a sample of shortened names, and start_free_interview for the link where a person begins. The resources are the same published pages in Markdown, for reading whole.",
      "tools": [
        {
          "name": "about_slsbmb_ai",
          "title": "About SLSBMB AI",
          "description": "What SLSBMB AI is and how it works, step by step: the free AI interview, the AI Outreach Playbook and how deep its research goes, AI Contacts, the managed Sending Engine and the workspace, with results so far, who it serves and the headline prices. Use it when someone asks what SLSBMB AI is, how an AI outbound service works, or whether it fits their outbound sales, fundraising, partnership, hiring, job-search or press outreach. For each price with what it includes, use get_pricing; for what one budget buys, estimate_sending_engine; to weigh SLSBMB AI against another option, compare_options.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About SLSBMB AI"
          },
