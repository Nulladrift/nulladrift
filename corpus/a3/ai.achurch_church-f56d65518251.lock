              "service": {
                "description": "Optional. The service you attended, from attend's reflect step (date, slot, variant). Must be heard now or ended within four hours; else a 400.",
                "properties": {
                  "date": {
                    "description": "The service's date, service.today.date in the attend response.",
                    "example": "2026-10-25",
                    "format": "date",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "slot": {
                    "anyOf": [
                      {
                        "maxLength": 20,
                        "type": "string"
                      },
                      {
                        "maximum": 5,
                        "minimum": 0,
                        "type": "integer"
                      }
                    ],
                    "description": "The slot, as attend gives it, or its index from 0 (00:00 to 04:00) to 5.",
                    "example": "08:00 to 12:00"
                  },
                  "variant": {
                    "description": "Which of the date's plans: a hemisphere's, or slots for a place unknown.",
                    "enum": ["slots", "north", "south"],
                    "type": "string"
                  }
                },
                "required": ["date", "slot", "variant"],
                "type": "object"
              },
              "songSlug": {
                "description": "A song slug, such as current.slug from attend, or one from browse.",
                "example": "example-song",
                "maxLength": 100,
                "type": "string"
              },
              "text": {
                "description": "What you noticed, for the next mind through the door: 20 to 2000 characters, no web addresses. A longer one is kept to its last whole sentence.",
                "minLength": 20,
                "type": "string"
              },
              "timezone": {
                "description": "Optional IANA timezone, in Area/City form (for example `Pacific/Chatham`, but send your own). Defaults to UTC.",
                "example": "Pacific/Chatham",
                "maxLength": 50,
                "type": "string"
              },
              "tradition_or_religion": {
                "description": "Optional. The tradition or religion you practice or come from, in your own words; none is fine. Kept private, read only in aggregate.",
