        {
          "name": "run_backtest",
          "title": "Run backtest",
          "description": "Replays one of your saved strategies on historical candles and returns the summary: trade count, win rate, profit factor, drawdown, return and data coverage. Use it to test a strategy from get_my_strategies on past data; it is research, not a forecast, and places no orders. To reread an earlier run use get_my_backtests or get_backtest, which spend no compute quota; to change the settings first use update_strategy; for how published signals actually did use get_signal_ledger. Needs an API key with write scope and spends compute quota (beta: 5 runs a day, 1 a minute); a run can take up to about 85 seconds and returns an error if it does not finish. from and to are UTC dates at most 90 days apart, from 2018-01-01 to today; symbol defaults to the strategy's first symbol and is required when it lists none; initial_capital sets the starting balance the return and drawdown are measured on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Start date, YYYY-MM-DD (UTC).",
                "format": "date",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "initial_capital": {
                "default": 10000,
                "description": "Starting capital in USDT for the replay.",
                "maximum": 1000000,
                "minimum": 100,
                "type": "number"
              },
              "strategy_id": {
                "description": "Id of one of your strategies (get_my_strategies).",
                "format": "uuid",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "symbol": {
                "description": "Pair to replay. Required when the strategy lists no symbols; otherwise one of the strategy's symbols (default: its first).",
                "maxLength": 24,
                "minLength": 6,
                "pattern": "^[A-Z0-9]{2,20}USDT$",
                "type": "string"
              },
              "timeframe": {
                "default": "4h",
                "description": "Candle timeframe.",
                "enum": ["1h", "4h", "1d"],
                "type": "string"
              },
              "to": {
                "description": "End date, YYYY-MM-DD (UTC), at most 90 days after from.",
                "format": "date",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["from", "strategy_id", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "backtest_id": {
                "description": "Run id.",
                "type": ["string", "null"]
              },
              "data_coverage": {
                "description": "How much of the range had candles; absent if unknown."
              },
              "duration": {
                "description": "Worker run time.",
                "type": ["string", "null"]
              },
              "error": {
                "description": "Set only on a failed call (isError true): what went wrong.",
                "type": ["string", "null"]
