        {
          "name": "delete_strategy",
          "title": "Delete strategy",
          "description": "Archives one of your strategies, as Delete does on the website: it turns inactive, stops counting toward the tier limit, and cannot be reactivated here. Use it to retire a strategy; to change one use update_strategy. strategy_id comes from get_my_strategies, which keeps listing the row with active false; repeating the call succeeds, and another account's id reads as not found. A bot already deployed from it keeps running on its own copy. Needs a write-scope key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "strategy_id": {
                "description": "Id of your strategy to archive, from get_my_strategies.",
                "format": "uuid",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archived": {
                "description": "True: inactive, row kept.",
                "type": ["boolean", "null"]
              },
              "error": {
                "description": "Set only on a failed call (isError true): what went wrong.",
                "type": ["string", "null"]
              },
              "strategy_id": {
                "description": "The archived strategy.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete strategy"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8b884a32e53f19167cc532155138a39ffd59f708853b58ca09567cecba68fc51"
        },
        {
          "name": "get_backtest",
          "title": "Backtest",
          "description": "Returns one of your stored backtest runs with the trades get_my_backtests leaves out: up to the first 100, each with entry and exit time and price, direction, P&L percent and exit type, plus trades_total. Use it to see why a run won or lost after run_backtest or get_my_backtests; the equity curve is not returned. backtest_id is the id run_backtest returns and get_my_backtests lists; a run older than the account's newest 200 is no longer kept, and another account's id reads as not found. Needs an API key; read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "backtest_id": {
                "description": "Id of your run, from run_backtest or get_my_backtests.",
                "format": "uuid",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["backtest_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "backtest": {
                "description": "One run with its trades.",
                "properties": {
                  "created_at": {
                    "description": "When it ran (RFC 3339).",
                    "type": ["string", "null"]
                  },
                  "data_coverage": {
                    "description": "How much of the range had candles; absent if unknown."
                  },
                  "direction": {
                    "description": "all, long or short.",
                    "type": ["string", "null"]
                  },
                  "duration": {
                    "description": "Worker run time.",
                    "type": ["string", "null"]
                  },
                  "engines": {
                    "description": "Engines used.",
                    "items": {
                      "description": "Engine.",
                      "type": ["string", "null"]
                    },
                    "type": "array"
                  },
                  "from": {
                    "description": "Start date (UTC).",
                    "type": ["string", "null"]
                  },
                  "id": {
                    "description": "Run id: pass it to get_backtest as backtest_id.",
                    "type": ["string", "null"]
                  },
                  "initial_capital": {
                    "description": "Starting balance, USDT.",
                    "type": ["number", "null"]
                  },
                  "min_confidence": {
                    "description": "Minimum confidence used, percent.",
                    "type": ["number", "null"]
                  },
                  "mode": {
                    "description": "Engine mode used.",
                    "type": ["string", "null"]
                  },
                  "source": {
                    "description": "Where it ran: web (the website) or mcp (run_backtest).",
                    "type": ["string", "null"]
                  },
                  "stats": {
                    "description": "Win rate, profit factor, drawdown, return and related figures; absent if none were stored."
                  },
                  "status": {
                    "description": "Run status.",
                    "type": ["string", "null"]
                  },
                  "symbol": {
                    "description": "Pair replayed.",
                    "type": ["string", "null"]
                  },
                  "timeframe": {
                    "description": "Candle timeframe.",
                    "type": ["string", "null"]
                  },
                  "to": {
                    "description": "End date (UTC).",
                    "type": ["string", "null"]
                  },
                  "trades": {
                    "description": "The first trades, at most 100: entry_time, exit_time, symbol, direction, entry, exit, pnl_pct, exit_type.",
                    "items": {
                      "description": "One trade."
                    },
                    "type": "array"
                  },
                  "trades_returned": {
                    "description": "Trades in this answer.",
                    "type": ["integer", "null"]
                  },
                  "trades_total": {
                    "description": "Trades in the run.",
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              },
              "error": {
                "description": "Set only on a failed call (isError true): what went wrong.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
