        {
          "name": "update_strategy",
          "title": "Update strategy",
          "description": "Changes fields of one of your saved strategies and returns the updated strategy. Use it to adjust a strategy between run_backtest runs; to make a new one use create_strategy. Only the fields you pass change; engines and symbols replace the whole list. The same tier rules as create_strategy apply to the result. A bot already deployed from the strategy keeps its own copy and is not changed. Needs an API key with write scope; another account's id reads as not found.",
