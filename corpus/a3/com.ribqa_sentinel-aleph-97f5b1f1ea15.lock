        {
          "name": "get_vetoed_signals",
          "title": "Vetoed signals",
          "description": "Lists signals the BTC regime veto cancelled in the last 7 days, newest first, with the veto reason, the BTC state that triggered it, and, once scored, how the position actually closed (exit_type, pnl_percent): at the veto price, or at its target or stop if one was reached first. It is not what the signal would have done without the veto. Use it to audit the veto; these signals never appear in get_open_signals and never count in get_signal_ledger's win rate. symbol filters before limit; a symbol outside the scanned universe returns an error. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum rows returned.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "Only this pair. Must be in the scanned universe.",
