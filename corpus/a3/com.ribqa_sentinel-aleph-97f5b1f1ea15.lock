                "type": ["string", "null"]
              },
              "note": {
                "description": "Information only; untrusted-text notice.",
                "type": ["string", "null"]
              },
              "track": {
                "description": "Hit record at +4h, +12h, +24h.",
                "properties": {
                  "bar": {
                    "description": "Pre-registered veto bar, evaluated once at its first min_n graded 24h reads.",
                    "properties": {
                      "evaluated_at": {
                        "description": "read_at of the min_n-th graded read; null while open.",
                        "type": ["string", "null"]
                      },
                      "evaluation": {
                        "description": "The frozen numbers: n, ai_hits, ai_hit_pct, rule_hit_pct, persist_hit_pct, margins, always_range; null while open."
                      },
                      "graded_reads": {
                        "description": "Graded 24h reads on prompt_version so far.",
                        "type": ["integer", "null"]
                      },
                      "min_hit_pct": {
                        "description": "Required AI 24h hit rate.",
                        "type": ["number", "null"]
                      },
                      "min_margin_pp": {
                        "description": "Required margin over the rule and persistence baselines.",
                        "type": ["number", "null"]
                      },
                      "min_n": {
                        "description": "Reads at which the bar is evaluated.",
                        "type": ["integer", "null"]
                      },
                      "prompt_version": {
                        "description": "Prompt version the bar counts.",
                        "type": ["string", "null"]
                      },
                      "status": {
                        "description": "open, met, not_met or unavailable.",
                        "type": ["string", "null"]
                      },
                      "text": {
                        "description": "The bar as pre-registered.",
                        "type": ["string", "null"]
                      },
                      "verdict": {
                        "description": "One line, e.g. 'Veto bar not met: 56.7% at n=60 (needed 60% and +5 pp over both baselines)'.",
                        "type": ["string", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "model": {
                    "description": "Model reads, all prompt versions: h4, h12, h24, each {n, hits}."
                  },
                  "note": {
                    "description": "How to read the record.",
                    "type": ["string", "null"]
