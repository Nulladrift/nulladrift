        {
          "name": "get_signal_ledger",
          "title": "Signal ledger",
          "description": "Summarises the public ledger's track record. matured_book is the settled record: one row per Zurich month past the 96-hour maturity guard, with published, entered, take-profit and stop-loss counts, net P&L after the market-aware cost model for every entered position (BTC veto closes included) and without the veto closes, and the veto closes' own gross and net. The counters (headline, pnl, by_engine) start at metric_epoch; when stats_epoch_daily is true they restart every day at 00:00 Zurich, so their matured win rate is usually empty and the track record is matured_book. Use it to judge how signals have performed; for what is open now use get_open_signals, and for vetoed signals use get_vetoed_signals. win_rate is null until n reaches 20 (the same floor per engine); P&L fields are null when no position was entered; P&L is percentage points summed per trade, not an account return; vetoed and scratched signals are not in the win rate. recent_limit adds that many latest settled outcomes (0 skips them; the full history is the CSV at export_path). No key needed.",
