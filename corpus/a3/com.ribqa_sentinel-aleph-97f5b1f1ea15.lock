                "description": "Research, not a forecast.",
                "type": ["string", "null"]
              },
              "stats": {
                "description": "Win rate, profit factor, drawdown, return and related figures from the worker; absent if it returned none."
              },
              "status": {
                "description": "Run status.",
                "type": ["string", "null"]
              },
              "strategy_id": {
                "description": "Strategy replayed.",
                "type": ["string", "null"]
              },
              "strategy_name": {
                "description": "Its name.",
                "type": ["string", "null"]
