{
  "lockfileVersion": 2,
  "subjects": {
    "com.ribqa/sentinel-aleph": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ribqa.com/api/v1/mcp"
