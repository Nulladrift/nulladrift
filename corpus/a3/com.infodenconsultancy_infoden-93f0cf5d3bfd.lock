        {
          "name": "list_jurisdictions",
          "title": "List jurisdictions Infoden operates in",
          "description": "Public, no sign-in required. List the jurisdictions (countries) Infoden serves, with an honest status per jurisdiction: 'live' (fully operational, e.g. Zimbabwe) or 'pilot' (intake is collected but delivered through a licensed local filing agent, with a human handling every step — never automated filing). Each entry also carries an `availability` of 'bookable' or 'enquiry_only'. 'enquiry_only' means Infoden's published requirements for that jurisdiction are an unconfirmed draft: you may take an enquiry, but must not present it as something the user can book or as settled fact. Call get_registration_requirements for the detail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activeOnly": {
                "default": true,
                "type": "boolean"
              }
            },
            "type": "object"
          },
