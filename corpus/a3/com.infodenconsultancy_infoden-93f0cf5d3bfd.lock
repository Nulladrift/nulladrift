        "title": "Infoden Consultancy (Public)",
        "version": "1.0.0",
        "description": "Public Infoden Consultancy tools: where and how to register a company, prices, open tenders and help guides. No sign-in.",
        "websiteUrl": "https://infodenconsultancy.com/developers",
        "icons": [
          {
            "src": "https://infodenconsultancy.com/images/mcp-icon.png?v=3",
            "mimeType": "image/png",
