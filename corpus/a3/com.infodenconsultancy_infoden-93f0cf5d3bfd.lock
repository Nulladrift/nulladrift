        {
          "name": "get_registration_requirements",
          "title": "Get company registration requirements for a jurisdiction",
          "description": "Public, no sign-in required. Returns exactly what a company registration in this jurisdiction requires: how many proposed names, the minimum number of directors and shareholders, every role that must be named, and the precise field list for each person — plus whether identity is by national ID or passport, whether a passport copy upload is needed, whether signatures are required, and whether the business activity is free text or must come from an approved list. Use the `checklist` array to walk someone through it conversationally, and `roles` when you need the exact fields. Check `bookable`: when it is false the jurisdiction is enquiry-only and its requirements are an unconfirmed draft, so tell the user Infoden will confirm the final list rather than presenting it as settled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Jurisdiction code or name, e.g. 'ZW', 'zimbabwe', 'ZA', 'AE'. Call list_jurisdictions for the current list.",
