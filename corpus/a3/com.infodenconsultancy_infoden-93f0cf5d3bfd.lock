        {
          "name": "request_registration_quote",
          "title": "Request an indicative company registration quote",
          "description": "Public, no sign-in. Like Infoden's 'get a quote' form: returns an indicative quote, the requirement checklist and a secure single-use link to send full details later, and creates a lead for a consultant. It creates no company, charges nothing and approves nothing. Before calling, get the person's explicit consent (Infoden will use their name, email and phone to answer the enquiry) and pass consentAccepted only if they agree. Never pass ID or passport numbers, dates of birth, addresses or documents. With an email, a code is emailed and verify_registration_interest must be called with it before a consultant is told; phone-only enquiries go straight through.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businessActivity": {
                "description": "A short description of what the business will do.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "consentAccepted": {
                "description": "Must be true, and must reflect the user actually agreeing to Infoden processing their contact details. Never assume it.",
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "description": "A single point of contact. Do not pass details for anyone else here.",
                "properties": {
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "minLength": 6,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "directorCount": {
                "description": "How many directors the company will have.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "entityType": {
                "description": "Entity/company type code, e.g. 'private_limited', 'pty_ltd', 'mainland_llc'. Required for some jurisdictions — get_registration_requirements says which via entityType.required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "jurisdiction": {
                "description": "Jurisdiction code or name, e.g. 'ZW', 'zimbabwe', 'ZA'. Call list_jurisdictions first.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "proposedNames": {
                "description": "Proposed company names in order of preference, up to 5.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "shareholderCount": {
                "description": "How many shareholders the company will have.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["businessActivity", "consentAccepted", "contact", "directorCount", "jurisdiction", "proposedNames", "shareholderCount"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bookable": {
                "type": "boolean"
              },
