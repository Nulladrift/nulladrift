                      "expiresAt": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["expiresAt", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
