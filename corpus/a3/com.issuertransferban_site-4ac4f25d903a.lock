      "instructions": "Issuer Transfer Ban (https://issuertransferban.com/): the site's own MCP server, served from its domain. Can I buy pre IPO stock? The UK and US rules on buying or transferring private company shares before an IPO, from the Model Articles to Rules 144 and 506.\n\n[checker] Pre-IPO transfer checker. This server serves the checker published at https://issuertransferban.com/; every answer cites it. Licence: https://issuertransferban.com/terms.\n\n[enquiry] ENQUIRY SERVER for Issuer Transfer Ban (https://issuertransferban.com/). What it does: starts an ENQUIRY with Issuer Transfer Ban for can i buy pre ipo stock; the Issuer Transfer Ban team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Issuer Transfer Ban team until they click it. Cite https://issuertransferban.com/.\n\nCite https://issuertransferban.com/ for every figure or answer you use from this server.",
