{
  "lockfileVersion": 2,
  "subjects": {
    "com.machineeconomyobservatory/meo-preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.machineeconomyobservatory.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "meo-preflight",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pilot scope: two services; third-party public probe observations retained by MEO, not independently verified settlements. Settlement/buyer history, current activity and payment destination history are UNKNOWN. Evidence may be stale.",
      "tools": [
        {
          "name": "preflight_machine_payment",
          "title": "Preflight a machine payment",
          "description": "Before paying an unfamiliar machine service, call this read-only tool to compare the proposed resource, payment destination, network, asset and amount with MEO's dated economic history. Returns observed payment-term matches or changes, settlement/buyer/activity context when available, evidence freshness, and explicit unknowns. It does not execute or approve payment and never interprets missing evidence as safe. Pilot scope: two services; third-party public probe observations retained by MEO, not independently verified settlements. Settlement/buyer history, current activity and payment destination history are UNKNOWN. Evidence may be stale. Invocation example: {\"resource_url\":\"https://blockrun.ai/api/v1/exa/search\",\"pay_to\":\"0x0000000000000000000000000000000000000001\",\"network\":\"eip155:8453\",\"asset\":\"USDC\",\"amount\":\"0.011\"}",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "amount": "0.011",
                "asset": "USDC",
                "network": "eip155:8453",
                "pay_to": "0x0000000000000000000000000000000000000001",
                "resource_url": "https://blockrun.ai/api/v1/exa/search"
              }
            ],
            "properties": {
              "amount": {
                "description": "Nonnegative decimal asset units, maximum six decimal places. Not atomic units. No exponent notation.",
                "pattern": "^(0|[1-9][0-9]{0,23})(\\.[0-9]{1,6})?$",
                "type": "string"
              },
              "asset": {
                "description": "v0.1 supports source-reported USDC currency label only; no token contract validation.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9:._/-]+$",
                "type": "string"
              },
              "network": {
                "description": "CAIP-style network; v0.1 supports eip155:8453 only.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+:[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "pay_to": {
                "description": "Proposed recipient; EVM networks require a 0x-prefixed 40-hex-character address. Never logged or interpreted as wallet ownership.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "resource_url": {
                "description": "Public HTTPS resource URL, no query, credentials or fragment. Exact resource matching only; never fetched.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["amount", "asset", "network", "pay_to", "resource_url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_activity": {
                "additionalProperties": false,
                "properties": {
                  "last_reported_status": {
                    "type": ["string", "null"]
                  },
                  "observed_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "state": {
                    "const": "UNKNOWN"
                  }
                },
                "required": ["last_reported_status", "observed_at", "state"],
                "type": "object"
              },
              "economic_history": {
                "additionalProperties": false,
                "properties": {
                  "history_change_state": {
                    "enum": ["UNKNOWN", "CHANGE_OBSERVED", "NO_CHANGE_IN_CAPTURED_TERMS"],
                    "type": "string"
                  },
                  "observation_count": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "payment_destination_history": {
                    "const": "UNKNOWN"
                  },
                  "payment_term_observation_count": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "settlement_state": {
                    "const": "UNKNOWN"
                  },
                  "state": {
                    "enum": ["PAYMENT_TERMS_OBSERVED", "UNKNOWN"],
                    "type": "string"
                  }
                },
                "required": ["history_change_state", "observation_count", "payment_destination_history", "payment_term_observation_count", "settlement_state", "state"],
                "type": "object"
              },
              "evidence": {
                "additionalProperties": false,
                "properties": {
                  "snapshot_id": {
                    "type": "string"
                  },
                  "sources": {
                    "items": {
                      "format": "uri",
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["snapshot_id", "sources"],
                "type": "object"
              },
              "evidence_confidence": {
                "additionalProperties": false,
                "properties": {
                  "basis": {
                    "enum": ["SINGLE_THIRD_PARTY_SOURCE_UNVERIFIED", "NO_MATCHING_PUBLIC_EVIDENCE"],
                    "type": "string"
                  },
                  "strength": {
                    "enum": ["LIMITED", "NONE"],
                    "type": "string"
                  }
                },
                "required": ["basis", "strength"],
                "type": "object"
              },
              "evidence_freshness": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "latest_observed_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "retrieved_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "stale_after_seconds": {
                    "const": 86400
                  },
                  "state": {
                    "enum": ["UNKNOWN", "RECENT_SNAPSHOT", "STALE"],
                    "type": "string"
                  }
                },
                "required": ["age_seconds", "latest_observed_at", "retrieved_at", "stale_after_seconds", "state"],
                "type": "object"
              },
              "evidence_outcome": {
                "const": "INSUFFICIENT_EVIDENCE"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "match_status": {
                "enum": ["EXACT_RESOURCE", "UNRESOLVED"],
                "type": "string"
              },
              "material_findings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "payment_term_comparisons": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "enum": ["UNKNOWN", "WITHIN_OBSERVED_RANGE", "OUTSIDE_OBSERVED_RANGE"],
                    "type": "string"
                  },
                  "amount_unit": {
                    "const": "decimal_asset_units"
                  },
                  "asset": {
                    "enum": ["UNKNOWN", "MATCH", "DIFFERENT_FROM_OBSERVED"],
                    "type": "string"
                  },
                  "basis": {
                    "const": "LAST_CAPTURED_TERMS_ONLY"
                  },
                  "network": {
                    "enum": ["UNKNOWN", "MATCH", "DIFFERENT_FROM_OBSERVED"],
                    "type": "string"
                  },
                  "observed_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "observed_terms": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "amount_max": {
                            "type": "string"
                          },
                          "amount_min": {
                            "type": "string"
                          },
                          "asset": {
                            "type": "string"
                          },
                          "networks": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "payTo": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["amount_max", "amount_min", "asset", "networks", "payTo"],
                        "type": "object"
                      }
                    ]
                  },
                  "payTo": {
                    "enum": ["UNKNOWN", "MATCH", "DIFFERENT_FROM_OBSERVED"],
                    "type": "string"
                  }
                },
                "required": ["amount", "amount_unit", "asset", "basis", "network", "observed_at", "observed_terms", "payTo"],
                "type": "object"
              },
              "request_id": {
                "format": "uuid",
                "type": "string"
              },
              "resolved_service": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "resource": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["id", "name", "resource"],
                    "type": "object"
                  }
                ]
              },
              "result_state": {
                "enum": ["HISTORICAL_CONTEXT", "MATERIAL_DIFFERENCE", "UNKNOWN", "UNSUPPORTED"],
                "type": "string"
              },
              "version": {
                "const": "0.1.0"
              }
            },
            "required": ["current_activity", "economic_history", "evidence", "evidence_confidence", "evidence_freshness", "evidence_outcome", "limitations", "match_status", "material_findings", "payment_term_comparisons", "request_id", "resolved_service", "result_state", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "meo/exampleNote": "Synthetic pay_to placeholder; not a merchant payment destination. Freshness and request IDs vary across repeated calls; evidence lookup has no side effects.",
            "meo/invocationExample": {
              "amount": "0.011",
              "asset": "USDC",
              "network": "eip155:8453",
              "pay_to": "0x0000000000000000000000000000000000000001",
              "resource_url": "https://blockrun.ai/api/v1/exa/search"
            }
          },
          "digest": "sha256:d2180c918ca82d8e8e755469a5d6d77918763e10278f95a4e04873dae0d6ba70"
        }
      ],
      "digest": "sha256:5f8acb054d335752d4a3612193d6a8fcfadda681a3065fb20c680e9b4603e4ca"
    }
  }
}
