{
  "lockfileVersion": 2,
  "subjects": {
    "ai.torgix/free-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.torgix.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "torgix-free-tools",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free equipment tools from Torgix (torgix.ai). No account needed. Use them for equipment cost per hour, repair-or-replace decisions, US state and federal compliance requirements, fleet list health checks, inspection checklists, VIN decoding, NHTSA recalls, and finding equipment manuals in the Discount Equipment library.",
      "tools": [
        {
          "name": "decode_vin",
          "title": "Decode a VIN",
          "description": "Decodes a 17-character VIN with NHTSA's free vPIC database: year, make, model, body class, GVWR class, engine and more. On-road vehicles only; off-highway equipment uses serial numbers instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vin": {
                "description": "The 17-character VIN",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Decode a VIN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad2a4125ad55f036ca5b547bc2a87a4349316a4310bec476ff75a8301a003e95"
        },
        {
          "name": "equipment_cost_per_hour",
          "title": "Equipment cost per hour",
          "description": "Calculates what a machine really costs per hour to own and operate: depreciation, cost of capital, insurance/taxes/storage, fuel, lubricants, repairs and wear parts. Same math as the Torgix calculator at torgix.ai/learn. Purchase price and hours per year are required; anything else left out uses the calculator's defaults, which the answer lists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fuel_gallons_per_hour": {
                "description": "Fuel burn in gallons per hour (default 4.5)",
                "minimum": 0,
                "type": "number"
              },
              "fuel_price_per_gallon": {
                "description": "Fuel price per gallon (default 4.10)",
                "minimum": 0,
                "type": "number"
              },
              "hours_per_year": {
                "description": "Hours the machine runs per year",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "insurance_tax_storage_pct": {
                "description": "Insurance, taxes and storage as percent of average value per year (default 3)",
                "minimum": 0,
                "type": "number"
              },
              "interest_rate_pct": {
                "description": "Cost of capital, percent per year (default 8)",
                "minimum": 0,
                "type": "number"
              },
              "lube_pct_of_fuel": {
                "description": "Lubricants and filters as percent of fuel cost (default 15)",
                "minimum": 0,
                "type": "number"
              },
              "operator_wage_per_hour": {
                "description": "Operator wage per hour; leave out for a machine-only rate",
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "description": "Purchase price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "repairs_per_hour": {
                "description": "Repairs and parts per hour (default 18)",
                "minimum": 0,
                "type": "number"
              },
              "residual_value": {
                "description": "Expected resale value at the end of ownership (default 30% of price)",
                "minimum": 0,
                "type": "number"
              },
              "wear_parts_cost": {
                "description": "Cost of a set of tires, tracks or undercarriage (default 18,000)",
                "minimum": 0,
                "type": "number"
              },
              "wear_parts_life_hours": {
                "description": "Hours a set of tires or tracks lasts (default 4,000)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "years_owned": {
                "description": "Years you expect to own it (default 7)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["hours_per_year", "purchase_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Equipment cost per hour"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e30d3448ae304d0a3f07669bfe7b465945e8f622e8a8de2408fe3a82de85ff23"
        },
        {
          "name": "find_equipment_manual",
          "title": "Find an equipment manual",
          "description": "Finds an operator, service or parts manual (or spec sheet) for a make and model in the Discount Equipment library and returns its title and link. Searches that library only; if it has nothing for the machine, the answer says so.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "make": {
                "description": "Manufacturer, e.g. Bobcat",
                "minLength": 2,
                "type": "string"
              },
              "model": {
                "description": "Model, e.g. T590",
                "type": "string"
              }
            },
            "required": ["make"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find an equipment manual"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0eb531c582927d6a38d6861f81b61a17c2c6cb9d8f7f63db46ee2ee0bc7200e9"
        },
        {
          "name": "fleet_health_check",
          "title": "Fleet health check",
          "description": "Reviews a pasted fleet list (one machine per line: make, model, year, hours; a header row and CSV or tab-separated text both work, up to 200 rows) and flags old machines, high hours, possibly underused units, missing information and duplicate unit IDs, with a fleet summary. Plain rules, nothing stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fleet_list": {
                "description": "The fleet list as text, one machine per line",
                "maxLength": 40000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["fleet_list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fleet health check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7b7ca4e89fbc3624e026800f0b277731dd0f0802cd25a262a11f8a4fa655a325"
        },
        {
          "name": "inspection_checklist",
          "title": "Inspection checklist",
          "description": "Returns a ready-to-use inspection checklist for a type of equipment or inspection: daily pre-use, DOT pre-trip, DOT annual, forklift, aerial and scissor lifts (ANSI A92), telehandler (ANSI/ITSDF B56.6), crane, trench, scaffold, harness, ladder, rigging, fire extinguisher, skid steer, excavator, backhoe, wheel loader, dozer, compactor, compressor, generator and more.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "equipment": {
                "description": "Equipment or inspection type, e.g. 'telehandler', 'skid steer', 'dump truck pre-trip'",
                "minLength": 2,
                "type": "string"
              },
              "when": {
                "description": "Optional timing, e.g. daily, pre-trip, weekly, monthly, annual",
                "type": "string"
              }
            },
            "required": ["equipment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inspection checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2585be054cde5511ac50f00fcd29a554cc83ba5b5c5b33f913bbd0baee6e00c7"
        },
        {
          "name": "recall_lookup",
          "title": "NHTSA recall lookup",
          "description": "Lists the safety recalls NHTSA has issued for a vehicle's year, make and model, or for a VIN (decoded first). Shows campaign number, component, summary and remedy. It cannot say whether a recall is still open on one specific vehicle; that is checked by VIN at nhtsa.gov/recalls or with the dealer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "make": {
                "description": "Make, e.g. Ford",
                "type": "string"
              },
              "model": {
                "description": "Model, e.g. F-550",
                "type": "string"
              },
              "vin": {
                "description": "A 17-character VIN (used instead of year, make and model)",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Model year"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "NHTSA recall lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:54279748fdf7e06857861498afddd43b89939a6d30fbe1ae8304287c6e61f118"
        },
        {
          "name": "repair_rebuild_or_replace",
          "title": "Repair, rebuild or replace",
          "description": "Decides whether to repair (or rebuild) a machine or replace it, by comparing cost per hour. The repair is priced by the hours it buys before the next major event. Uses the method on torgix.ai/learn/repair-rebuild-or-replace. Give the replacement either as a cost per hour or as a purchase price. For a rebuild, enter the rebuild cost and the much larger hours it buys.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "current_operating_cost_per_hour": {
                "description": "What it costs to operate per hour today (fuel, repairs, wear)",
                "minimum": 0,
                "type": "number"
              },
              "current_value": {
                "description": "What the machine is worth today",
                "minimum": 0,
                "type": "number"
              },
              "hours_per_year": {
                "description": "Hours it runs per year (default 1,200)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "hours_repair_buys": {
                "description": "Hours the repair should run before the next major event (use the low end of the shop's range)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "insurance_tax_storage_pct": {
                "description": "Insurance, taxes and storage percent (default 3)",
                "minimum": 0,
                "type": "number"
              },
              "interest_rate_pct": {
                "description": "Cost of capital, percent (default 8)",
                "minimum": 0,
                "type": "number"
              },
              "repair_cost": {
                "description": "Repair or rebuild quote in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "replacement_cost_per_hour": {
                "description": "Total cost per hour of the replacement, if known",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "replacement_operating_cost_per_hour": {
                "description": "Replacement's operating cost per hour (default: same as today's machine)",
                "minimum": 0,
                "type": "number"
              },
              "replacement_price": {
                "description": "Purchase price of the replacement, if the cost per hour is not known",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "replacement_residual_value": {
                "description": "Replacement's expected resale value (default 30% of price)",
                "minimum": 0,
                "type": "number"
              },
              "replacement_years_owned": {
                "description": "Years you'd keep the replacement (default 7)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "value_after_those_hours": {
                "description": "What it would be worth after those hours",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["current_operating_cost_per_hour", "current_value", "hours_repair_buys", "repair_cost", "value_after_those_hours"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Repair, rebuild or replace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e577f392bec97eafe251dde8563d36ba81187410c83b940d34b6c913629711c2"
        },
        {
          "name": "state_compliance_requirements",
          "title": "State and federal compliance requirements",
          "description": "Lists registration, IFTA, IRP, DOT inspection, emissions, permit and highway-use-tax requirements for a US state (or DC) plus the federal items, each with its official source link and the date it was checked. Give a GVWR (and axles, and whether it crosses state lines) to also check CDL, USDOT, IFTA, IRP and Form 2290 weight thresholds. From Torgix's rulebook of 355 cited items. Not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "axles": {
                "description": "Number of axles on the power unit",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "category": {
                "description": "Limit to one category",
                "enum": ["registration", "ifta", "irp_apportioned", "dot_inspection", "emissions", "weight_distance_tax", "permit", "other"],
                "type": "string"
              },
              "gvwr_lbs": {
                "description": "Gross vehicle weight rating in pounds, to check weight thresholds",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "interstate": {
                "description": "True if the vehicle crosses state lines",
                "type": "boolean"
              },
              "state": {
                "description": "US state name or two-letter code, or DC",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "State and federal compliance requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3198eb48a93e0d5f25a1de1ca5a1934dc01ff04d1a703ec1c394ee719a50bc95"
        }
      ],
      "digest": "sha256:762c9ab193897e080e5034f5afffc7558f18b008a20e108b5e4550f93643196a"
    }
  }
}
