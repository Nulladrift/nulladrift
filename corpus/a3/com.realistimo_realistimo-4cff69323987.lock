        {
          "name": "realistimo_estimate_price",
          "title": "Estimate what a Bulgarian property would sell or rent for",
          "description": "An estimate of what a property in an oblast capital (София, Пловдив, Варна, Бургас, …) or one of its квартали would ask on sale and on rent: the median asking price per m² of Realistimo's live listings there — the figures of its price statistics pages — times the area. With askingPrice it also says where that price sits among the listings' prices per m² (below the cheapest 10%, under or over the median, above the dearest 10%). Use for „колко струва апартаментът ми\", „колко наем да искам\", „скъпа ли е тази обява\". Not an appraisal.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "areaSqm": {
                "description": "Floor area in m² (plot area for a plot).",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "askingPrice": {
                "description": "A price in euros to check against the listings.",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "language": {
                "description": "Language of the answer's labels and of the realistimo.com link: bg, en, tr, de, ru, ro, el or uk. Default bg.",
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "location": {
                "description": "A place in Bulgaria — city, квартал (neighbourhood) or village — in Bulgarian or Latin letters, e.g. \"София\", \"Лозенец, София\", \"Varna\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "propertyType": {
                "description": "Default APARTMENT.",
                "enum": ["APARTMENT", "HOUSE", "FLOOR_HOUSE", "OFFICE", "PLOT_FOR_CONSTRUCTION"],
                "type": "string"
              },
              "rooms": {
                "description": "Rooms, for APARTMENT, HOUSE or FLOOR_HOUSE; four or more are one group, as on the statistics pages.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["areaSqm", "location"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "areaSqm": {
                "type": "number"
              },
              "askingPriceCheck": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "askingPerM2Eur": {
                        "type": "number"
                      },
                      "listingsCompared": {
                        "type": "number"
                      },
                      "medianPerM2Eur": {
                        "type": "number"
                      },
                      "p10PerM2Eur": {
                        "type": "number"
                      },
                      "p90PerM2Eur": {
                        "type": "number"
                      },
                      "position": {
                        "type": "string"
                      }
                    },
                    "required": ["askingPerM2Eur", "listingsCompared", "medianPerM2Eur", "p10PerM2Eur", "p90PerM2Eur", "position"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "figuresFor": {
                "description": "The place the figures describe — the квартал, or its city when the квартал has none of its own.",
                "type": ["string", "null"]
              },
              "language": {
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "monthlyRentEstimateEur": {
                "type": ["number", "null"]
              },
              "notes": {
                "description": "How to read the figures; repeat the relevant ones to the user.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "place": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "enum": ["city", "neighbourhood", "village", "other"],
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "otherMatches": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "subAreas": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["kind", "name", "otherMatches", "subAreas"],
                "type": "object"
              },
              "propertyType": {
                "type": "string"
              },
              "rentListingsUsed": {
                "type": ["number", "null"]
              },
              "rentPricePerM2Eur": {
                "type": ["number", "null"]
              },
              "rooms": {
                "type": ["number", "null"]
              },
              "saleEstimateEur": {
                "type": ["number", "null"]
              },
              "saleListingsUsed": {
                "type": ["number", "null"]
              },
              "salePricePerM2Eur": {
                "type": ["number", "null"]
              },
              "url": {
                "description": "The realistimo.com page this answer comes from.",
                "type": "string"
              }
            },
            "required": ["areaSqm", "askingPriceCheck", "figuresFor", "language", "monthlyRentEstimateEur", "notes", "place", "propertyType", "rentListingsUsed", "rentPricePerM2Eur", "rooms", "saleEstimateEur", "saleListingsUsed", "salePricePerM2Eur", "url"],
            "type": "object"
          },
