      "instructions": "Realistimo (Реалистимо) is a Bulgarian real-estate portal. These tools answer questions about the Bulgarian property market from Realistimo's own data and calculators. Amounts are in euros. Market prices are asking prices from listings, not transaction prices. Every answer carries `url`, the realistimo.com page it comes from, and `notes` on how to read it.",
      "tools": [
        {
          "name": "realistimo_deal_cost",
          "title": "Cost of buying or selling a property in Bulgaria",
          "description": "What a property purchase or sale in Bulgaria costs on top of the price: notary fee, registration, the municipality's local acquisition tax, broker commission, certificates, the seller's income tax, and — with a mortgage — the bank's fees, the loan and the monthly payment. For an apartment with a place and an area it adds the likely rent, yield and payback. Use for „колко струва покупката/продажбата\", „такси при покупка на имот\", „нотариални такси\", „местен данък\", „колко пари ми трябват за апартамент за 120 000 евро\". Amounts in euros.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "areaSqm": {
                "description": "Floor area in m²; with an apartment and a location it adds rent and yield.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "broker": {
                "description": "false when no broker is involved (no commission). Default true.",
                "type": "boolean"
              },
              "downPaymentPercent": {
                "description": "Own funds as a percent of the price; default 20, banks lend at most 85%.",
                "maximum": 100,
                "minimum": 15,
                "type": "number"
              },
              "inherited": {
                "description": "true when the seller inherited the property (no income tax).",
                "type": "boolean"
              },
              "interestRatePercent": {
                "description": "Annual interest rate; default is Realistimo's current average rate.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "description": "Language of the answer's labels and of the realistimo.com link: bg, en, tr, de, ru, ro, el or uk. Default bg.",
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "loanYears": {
                "description": "Loan term in years; default 30.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Where the property is; sets the municipality's local tax rate. Without it the legal maximum of 3% is used.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "mortgage": {
                "description": "true when the buyer takes a mortgage (ипотечен кредит).",
                "type": "boolean"
              },
              "price": {
                "description": "The price in euros.",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "propertyKind": {
                "description": "Default apartment. commercial = shop, office or other business property.",
                "enum": ["apartment", "house", "plot", "garage", "commercial"],
                "type": "string"
              },
              "purchasePrice": {
                "description": "What the seller paid for the property, in euros — the base of a taxable gain.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "role": {
                "description": "Whose costs: buyer (default), seller, or both sides.",
                "enum": ["buyer", "seller", "both"],
                "type": "string"
              },
              "saleIncomeTax": {
                "description": "For a seller: exempt (default, ЗДДФЛ чл. 13) or taxable. A taxable sale needs purchasePrice.",
                "enum": ["exempt", "taxable"],
                "type": "string"
              },
              "taxAssessment": {
                "description": "The данъчна оценка in euros, if known; fees are charged on the higher of it and the price.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["price"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "cashNeededEur": {
                        "description": "Price (or down payment with a loan) plus the buyer's fees.",
                        "type": "number"
                      },
                      "feesEur": {
                        "type": "number"
                      },
                      "feesPercentOfPrice": {
                        "type": "number"
                      }
                    },
                    "required": ["cashNeededEur", "feesEur", "feesPercentOfPrice"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "feesAsOf": {
                "type": "string"
              },
              "language": {
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amountEur": {
                      "type": "number"
                    },
                    "indicative": {
                      "description": "A typical market fee rather than an amount set by law.",
                      "type": "boolean"
                    },
                    "item": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "law": {
                      "type": "boolean"
                    },
                    "paidBy": {
                      "enum": ["buyer", "seller"],
                      "type": "string"
                    },
                    "paidTo": {
                      "type": "string"
                    },
                    "stage": {
                      "type": "string"
                    }
                  },
                  "required": ["amountEur", "indicative", "item", "label", "law", "paidBy", "paidTo", "stage"],
                  "type": "object"
                },
                "type": "array"
              },
              "mortgage": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "downPaymentEur": {
                        "type": "number"
                      },
                      "interestRatePercent": {
                        "type": "number"
                      },
                      "loanEur": {
                        "type": "number"
                      },
                      "monthlyPaymentEur": {
                        "type": "number"
                      },
                      "termYears": {
                        "type": "number"
                      }
                    },
                    "required": ["downPaymentEur", "interestRatePercent", "loanEur", "monthlyPaymentEur", "termYears"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "municipality": {
                "additionalProperties": false,
                "properties": {
                  "localTaxPercent": {
                    "type": "number"
                  },
                  "localTaxRateListed": {
                    "description": "false when the 3% legal maximum stood in for an unknown municipal rate.",
                    "type": "boolean"
                  },
                  "name": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["localTaxPercent", "localTaxRateListed", "name"],
                "type": "object"
              },
              "notes": {
                "description": "How to read the figures; repeat the relevant ones to the user.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "place": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "enum": ["city", "neighbourhood", "village", "other"],
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "otherMatches": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "subAreas": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["kind", "name", "otherMatches", "subAreas"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "priceEur": {
                "type": "number"
              },
              "rentalInvestment": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "grossYieldPercent": {
                        "type": "number"
                      },
                      "likelyMonthlyRentEur": {
                        "type": "number"
                      },
                      "monthlyCashflowAfterLoanEur": {
                        "type": ["number", "null"]
                      },
                      "netMonthlyRentEur": {
                        "description": "After 9% tax and 8% upkeep.",
                        "type": "number"
                      },
                      "netYieldPercent": {
                        "type": "number"
                      },
                      "paybackYears": {
                        "type": "number"
                      }
                    },
                    "required": ["grossYieldPercent", "likelyMonthlyRentEur", "monthlyCashflowAfterLoanEur", "netMonthlyRentEur", "netYieldPercent", "paybackYears"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "role": {
                "enum": ["buyer", "seller", "both"],
                "type": "string"
              },
              "seller": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "feesEur": {
                        "type": "number"
                      },
                      "feesPercentOfPrice": {
                        "type": "number"
                      },
                      "netProceedsEur": {
                        "type": "number"
                      }
                    },
                    "required": ["feesEur", "feesPercentOfPrice", "netProceedsEur"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "taxBaseEur": {
                "type": "number"
              },
              "url": {
                "description": "The realistimo.com page this answer comes from.",
                "type": "string"
              }
            },
            "required": ["buyer", "feesAsOf", "language", "lines", "mortgage", "municipality", "notes", "place", "priceEur", "rentalInvestment", "role", "seller", "taxBaseEur", "url"],
            "type": "object"
          },
