        {
          "name": "realistimo_market_stats",
          "title": "Asking prices in a Bulgarian city or квартал",
          "description": "Asking-price statistics from Realistimo's live listings for an oblast capital (София, Пловдив, Варна, Бургас, …) or one of its квартали: price and price per m² (P10–P90, median), how many listings, the share with a price cut, the city's 12-month trend per m², the gross rental yield for apartments, and the city's quarterly count of registered sales and mortgages. Use for „колко струва квадратен метър в Лозенец\", „цени на апартаменти във Варна\", „наеми в Пловдив\", „доходност от наем\". Prices in euros.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer's labels and of the realistimo.com link: bg, en, tr, de, ru, ro, el or uk. Default bg.",
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "location": {
                "description": "A place in Bulgaria — city, квартал (neighbourhood) or village — in Bulgarian or Latin letters, e.g. \"София\", \"Лозенец, София\", \"Varna\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offerType": {
                "description": "SALE (продажба, default) or RENT (наем).",
                "enum": ["SALE", "RENT"],
                "type": "string"
              },
              "propertyType": {
                "description": "Default APARTMENT. FLOOR_HOUSE = етаж от къща; PLOT_FOR_CONSTRUCTION = парцел за строеж.",
                "enum": ["APARTMENT", "HOUSE", "FLOOR_HOUSE", "OFFICE", "PLOT_FOR_CONSTRUCTION"],
                "type": "string"
              },
              "rooms": {
                "description": "Rooms, for APARTMENT, HOUSE or FLOOR_HOUSE only; 4 means four or more.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "askingPriceEur": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "p10": {
                        "type": "number"
                      },
                      "p25": {
                        "type": "number"
                      },
                      "p50": {
                        "type": "number"
                      },
                      "p75": {
                        "type": "number"
                      },
                      "p90": {
                        "type": "number"
                      }
                    },
                    "required": ["p10", "p25", "p50", "p75", "p90"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "askingPricePerM2Eur": {
