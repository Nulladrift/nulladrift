        {
          "name": "realistimo_market_index",
          "title": "Realistimo monthly property market index",
          "description": "„Индекс Realistimo\": the monthly edition of average asking prices per m² in Bulgaria's largest cities, with the change on the previous month (and on the year where the edition shows it) and the квартали whose prices rose and fell most. Use for „как се движат цените на имотите\", „пазарен индекс\", „цени на имоти за септември\". The latest edition unless a month is asked for.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer's labels and of the realistimo.com link: bg, en, tr, de, ru, ro, el or uk. Default bg.",
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "period": {
                "description": "A month, YYYY-MM. Default: the latest edition.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "avgEurPerM2": {
                      "type": "number"
                    },
                    "listingsSampled": {
                      "type": "number"
                    },
                    "monthOnMonthPercent": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "yearOnYearPercent": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["avgEurPerM2", "listingsSampled", "monthOnMonthPercent", "name", "yearOnYearPercent"],
                  "type": "object"
                },
                "type": "array"
              },
              "fallingNeighbourhoods": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "avgEurPerM2": {
                      "type": "number"
                    },
                    "city": {
                      "type": "string"
                    },
                    "monthOnMonthPercent": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["avgEurPerM2", "city", "monthOnMonthPercent", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "language": {
                "enum": ["bg", "en", "tr", "de", "ru", "ro", "el", "uk"],
                "type": "string"
              },
              "notes": {
                "description": "How to read the figures; repeat the relevant ones to the user.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "period": {
                "type": ["string", "null"]
              },
              "publishedEditions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "risingNeighbourhoods": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "avgEurPerM2": {
                      "type": "number"
                    },
                    "city": {
                      "type": "string"
                    },
                    "monthOnMonthPercent": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["avgEurPerM2", "city", "monthOnMonthPercent", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "The realistimo.com page this answer comes from.",
                "type": "string"
              }
            },
            "required": ["cities", "fallingNeighbourhoods", "language", "notes", "period", "publishedEditions", "risingNeighbourhoods", "url"],
            "type": "object"
