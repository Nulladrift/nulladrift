        {
          "name": "post_preflight",
          "title": "Preflight post",
          "description": "For creation, validate the complete post payload. For updates, supply postId, expectedUpdatedAt and the same partial fields as post_update (flattened, without the post wrapper). Checks ownership, required scopes, concurrency, slug/category conflicts and content against the resulting access and publication state. Use operation:update_draft to check the legacy draft-only restriction. This is read-only; saving rechecks everything.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["translations"]
              },
              {
                "required": ["expectedUpdatedAt", "postId"]
              }
            ],
            "properties": {
              "access": {
                "description": "Article access. PAID requires a public excerpt when published. Omit to preserve the current access.",
                "enum": ["FREE", "PAID"],
                "type": "string"
              },
              "categoryId": {
                "type": ["string", "null"]
              },
              "expectedUpdatedAt": {
                "description": "The updatedAt value returned by post_get, used to detect concurrent edits.",
                "format": "date-time",
                "type": "string"
              },
              "operation": {
                "description": "With postId, validates the selected update operation and its required scopes.",
                "enum": ["update", "update_draft"],
                "type": "string"
              },
              "postId": {
                "description": "For an update, supply the existing post ID. Every omitted field, including publication, is preserved. Validates the same patch as post_update.",
                "type": "string"
              },
              "primaryLocale": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "publication": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "enum": ["draft", "now", "schedule"],
                    "type": "string"
                  },
                  "scheduledAt": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "relatedSaasIds": {
                "description": "SaaS products associated with the post. Mention or link them naturally only when editorially relevant; do not create a product directory in contentHtml.",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "sources": {
                "description": "Structured references rendered automatically after the article. Do not duplicate them as a Sources/References section in contentHtml; use data-post-source-id only for contextual citations.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "translations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "contentHtml": {
                      "type": "string"
                    },
                    "excerpt": {
                      "maxLength": 400,
                      "type": "string"
                    },
                    "locale": {
                      "enum": ["fr", "en"],
                      "type": "string"
                    },
                    "seoImage": {
                      "additionalProperties": false,
                      "description": "Optional SEO image reference. Use mediaId returned by media_import; the server resolves its canonical URL. In a draft patch, omit this field to preserve the current image or send mode:auto to clear it.",
                      "properties": {
                        "mediaId": {
                          "type": "string"
                        },
                        "mode": {
                          "enum": ["auto", "manual"],
                          "type": "string"
                        },
                        "showInArticle": {
                          "description": "Show the SEO image above the article body; omitted preserves the current setting.",
                          "type": "boolean"
                        },
                        "sync": {
                          "enum": ["linked", "detached"],
                          "type": "string"
                        },
                        "syncGroupId": {
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "slug": {
                      "description": "Optional explicit URL slug for this locale. Omit to preserve the current slug; changing it creates a redirect from the old URL. Conflicting slugs are rejected.",
                      "maxLength": 180,
                      "minLength": 1,
                      "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 180,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["locale"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "blockingIssues": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "warningIssues": {
