      "instructions": "Use mysaas.blog for authenticated editorial work on a builder account.\nFor a new post, clarify audience, angle, locale (fr, en, or both), sources, SEO, and images before creating a draft.\nRead before editing, run post_preflight, and ask for explicit approval before publish or schedule.\nFor bilingual work, preserve both locale variants and image placement. An explicit request to replace a named translation authorizes that edit; do not ask the same confirmation again. Use post_update for published posts without unpublishing; claim success only from its saved result.\nMutating tools accept an idempotencyKey; reuse it only with the same payload.\nFull guide: https://mysaas.blog/docs/agents.txt (also the use_mysaas_blog prompt).\nEvery call is visible to the account owner on the AI access page, where they can revoke this connection.",
