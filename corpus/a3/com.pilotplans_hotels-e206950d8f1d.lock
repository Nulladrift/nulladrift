            "taskSupport": "forbidden"
          },
          "digest": "sha256:be0180cb8e65311e8e3215706878228d2c7d24b3d256a7c5c5200f3694789a71"
        },
        {
          "name": "get_room_rates_for_hotel",
          "title": "Get room rates",
          "description": "Get room rates for a hotel id from search_hotels. Each offer includes a price, board type and refundability. Booking is not available through this connector; send the user to Pilot to book.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "check_in": {
                "description": "Override check-in, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Override check-out, YYYY-MM-DD",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "hotel_id": {
                "description": "Hotel id from search_hotels",
                "type": "string"
              }
            },
            "required": ["hotel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a28ea4ee0692b760344b0b815d00ae5d9139fd51a9dc146fdcc1b9a2168ed482"
        },
        {
          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Search bookable hotels by location and dates. Returns hotels with nightly prices, photos, coordinates, a `url` linking to the hotel on Pilot, and an opaque id to pass to get_hotel_details and get_rates. Booking is not available through this connector, so link the user to a hotel's `url` when they want to book. Narrow with the rating, amenity and radius filters rather than requesting a large limit, and page with offset using next_offset from the previous result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ai_search": {
                "description": "Free-text preference, e.g. 'boutique hotel near the old town'. Ignored when it matches no inventory.",
                "type": "string"
              },
              "amenity_ids": {
                "description": "Supplier facility ids the hotel must offer",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "type": "array"
              },
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "children_ages": {
                "description": "Ages of children sharing the room",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "currency": {
                "default": "USD",
                "description": "ISO-4217 currency for returned prices",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "guest_nationality": {
                "default": "US",
                "description": "ISO-2 country of the guest; affects rate eligibility",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "guests": {
                "default": 2,
                "description": "Number of adults",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Maximum hotels to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, address, or place name",
                "type": "string"
              },
              "min_guest_rating": {
                "description": "Only hotels at or above this guest review score, out of 10",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "min_star_rating": {
                "description": "Only hotels at or above this star rating",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Hotels to skip, for paging",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "property_type_ids": {
                "description": "Supplier hotel-type ids to restrict to",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "type": "array"
              },
              "radius_meters": {
                "description": "Restrict to this radius around the location",
                "maximum": 9007199254740991,
                "minimum": 1000,
                "type": "integer"
              },
              "rooms": {
                "default": 1,
                "description": "Rooms required",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["check_in", "check_out", "location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://pilot/hotel-results.html",
            "ui": {
              "resourceUri": "ui://pilot/hotel-results.html"
            },
            "ui/resourceUri": "ui://pilot/hotel-results.html"
          },
          "digest": "sha256:b627b81169b7d32368ef968c6f6f3eceab6df4a667449c3d8d09e9255a062e2f"
        }
      ],
