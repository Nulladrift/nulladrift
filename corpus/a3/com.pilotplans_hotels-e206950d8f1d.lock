      "tools": [
        {
          "name": "get_hotel_details",
          "title": "Get hotel details",
          "description": "Get static details (description, amenities, photos, address) for a hotel id returned by search_hotels.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hotel_id": {
                "description": "Hotel id from search_hotels",
                "type": "string"
              }
            },
            "required": ["hotel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
