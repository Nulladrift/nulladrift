        {
          "name": "criar_pedido",
          "title": "Criar pedido (pagamento PIX)",
          "description": "Cria um pedido REAL na BitVisual e retorna o link da página do pedido em bitvisual.com.br, onde o cliente conclui o pagamento por PIX. Só funciona para produtos cotáveis (use cotar() antes). Pedidos até R$ 1.000 entram direto; acima disso viram orçamento com atendimento humano. Retirada GRÁTIS na loja (Vila Mariana/SP) ou ENTREGA em todo o Brasil: informe o endereço completo com CEP e o frete real entra no total. Passe em opcoes os acabamentos escolhidos (eles mudam preço e frete). ANTES de chamar, confirme com o cliente: produto, medidas em cm, quantidade, acabamento, total, nome, e-mail e WhatsApp. A produção só começa após o pagamento e o envio da arte. EFEITO COLATERAL: cria um pedido real e gera a cobrança PIX no provedor de pagamento (Mercado Pago); com CEP, cota o frete em transportadora. Não cancela nem altera pedidos — para mudar ou desistir, o cliente fala com o atendimento humano. Limite de 5 pedidos por hora por cliente.",
          "inputSchema": {
            "properties": {
              "agente": {
                "description": "Identifique-se: nome do assistente/plataforma que está criando o pedido (ex.: ChatGPT, Claude, Gemini, Copilot). Serve para a BitVisual saber por qual canal de IA o pedido entrou. Não é dado do cliente.",
                "type": "string"
              },
              "altura_cm": {
                "description": "altura em CENTÍMETROS (produtos por m²)",
                "type": "number"
              },
              "arte_url": {
                "description": "link https do arquivo de arte, se o cliente já tiver (opcional — também pode enviar depois)",
                "type": "string"
              },
              "bairro": {
                "description": "bairro de entrega",
                "type": "string"
              },
              "cep": {
                "description": "CEP de ENTREGA — informe junto com endereço/numero para receber em casa; sem CEP = retirada grátis na loja",
                "type": "string"
              },
              "cidade": {
                "description": "cidade de entrega",
                "type": "string"
              },
              "complemento": {
                "description": "complemento (opcional)",
                "type": "string"
              },
              "email": {
                "description": "e-mail do cliente (recebe o pedido e acompanha o status)",
                "type": "string"
              },
              "endereco": {
                "description": "rua/avenida de entrega (obrigatório se informou CEP)",
                "type": "string"
              },
              "estado": {
                "description": "UF de entrega, 2 letras (ex.: SP)",
                "type": "string"
              },
              "largura_cm": {
                "description": "largura em CENTÍMETROS (produtos por m²)",
                "type": "number"
              },
              "nome": {
                "description": "nome completo do cliente",
                "type": "string"
              },
              "numero": {
                "description": "número do endereço de entrega",
                "type": "string"
              },
              "observacoes": {
                "description": "detalhes do pedido: acabamento escolhido, cores, instruções (opcional)",
                "type": "string"
              },
              "opcoes": {
                "description": "Opções/acabamentos escolhidos pelo cliente, pelos nomes que o cotar() devolve (ex.: [chassis_esticado] para o canvas esticado em chassi de madeira). MUITO IMPORTANTE: a opção muda o PREÇO e o FRETE — não basta escrever em observacoes. Sem informar, vale o padrão da loja (para o canvas: apenas a impressão refilada, que vai enrolada no tubo).",
                "items": {
                  "type": "string"
