        {
          "name": "cotar",
          "title": "Cotação de preço real",
          "description": "Cota o preço oficial de um produto. Para produtos por m² informe largura_cm e altura_cm EM CENTÍMETROS (nunca assuma a unidade — confirme com o cliente antes). Para tiragem informe quantidade. Retorna preço unitário, total, as opções/acabamentos disponíveis com o preço de cada uma e o link do produto. Para cotar COM acabamento (ex.: canvas esticado em chassi de madeira), repita a chamada passando opcoes. Não cria pedido.",
          "inputSchema": {
            "properties": {
              "altura_cm": {
                "description": "altura em CENTÍMETROS (obrigatório p/ produtos por m²)",
                "type": "number"
              },
              "largura_cm": {
                "description": "largura em CENTÍMETROS (obrigatório p/ produtos por m²)",
                "type": "number"
              },
              "opcoes": {
                "description": "Opções/acabamentos escolhidos pelo cliente, pelos nomes que o cotar() devolve (ex.: [chassis_esticado] para o canvas esticado em chassi de madeira). MUITO IMPORTANTE: a opção muda o PREÇO e o FRETE — não basta escrever em observacoes. Sem informar, vale o padrão da loja (para o canvas: apenas a impressão refilada, que vai enrolada no tubo).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "produto": {
                "description": "slug do produto (campo 'slug' do catalogo)",
                "type": "string"
              },
              "quantidade": {
