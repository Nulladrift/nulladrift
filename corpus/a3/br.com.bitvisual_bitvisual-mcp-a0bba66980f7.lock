      "instructions": "Você está falando com o balcão digital da BIT VISUAL, gráfica de impressão digital e comunicação visual em São Paulo (bitvisual.com.br). Fluxo: listar_catalogo() para descobrir produtos → cotar() para preço real (medidas SEMPRE em centímetros — nunca assuma a unidade, confirme com o cliente) → Acabamentos vão no parâmetro opcoes de cotar/consultar_prazo/criar_pedido, NUNCA só em observacoes: eles mudam o preço e o frete (canvas esticado em chassi de madeira custa +R$ 350/m² e viaja em caixa rígida; só a impressão vai enrolada no tubo). consultar_requisitos_arte() para os requisitos do arquivo → criar_pedido() para fechar (somente PIX; pedidos até R$ 1.000 entram direto, acima disso viram orçamento com atendimento humano) → status_pedido() para acompanhar. Produtos 'sob consulta' exigem atendimento humano: https://bitvisual.com.br/orcamento ou WhatsApp +55 11 97216-0864. Antes de criar_pedido SEMPRE confirme com o cliente: produto, medida, quantidade, total, nome, e-mail e WhatsApp. Não peça documentos pessoais na conversa: o que a nota fiscal precisar o cliente informa direto à BitVisual, fora do chat. e identifique-se no parâmetro `agente` (ex.: ChatGPT, Claude) para a BitVisual saber de qual IA veio o pedido. / This is BIT VISUAL's digital counter — a print shop in São Paulo, Brazil. Flow: listar_catalogo() → cotar() (dimensions ALWAYS in centimeters) → consultar_requisitos_arte() → criar_pedido() (PIX only; orders above R$ 1,000 become human-assisted quotes) → status_pedido(). Always confirm order details with the customer first.",
      "tools": [
        {
          "name": "consultar_prazo",
          "title": "Prazo de produção e entrega",
          "description": "Prazo de produção do produto e opções de entrega/retirada em São Paulo. Informe o CEP de destino para o frete real. Passe as mesmas opcoes do pedido: um canvas esticado em chassi viaja em caixa rígida e custa muito mais frete que a impressão enrolada no tubo.",
          "inputSchema": {
            "properties": {
              "altura_cm": {
                "description": "altura em cm (melhora o cálculo do frete)",
                "type": "number"
              },
              "cep": {
                "description": "CEP de destino — com ele retorno as opções REAIS de frete (transportadora, preço, prazo)",
                "type": "string"
              },
              "largura_cm": {
                "description": "largura em cm (melhora o cálculo do frete)",
                "type": "number"
