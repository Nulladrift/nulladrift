                "type": "number"
              },
              "whatsapp": {
                "description": "WhatsApp/telefone do cliente com DDD",
                "type": "string"
              }
            },
            "required": ["email", "nome", "produto", "quantidade", "whatsapp"],
            "type": "object"
          },
