                        "type": "string"
                      },
                      "status": {
                        "type": "integer"
                      }
                    },
                    "required": ["code", "status"],
                    "type": "object"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
