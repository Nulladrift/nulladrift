{
  "lockfileVersion": 2,
  "subjects": {
    "com.agilegrowthlabs/agency-capacity": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://connect.agilegrowthlabs.com/capacity"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agl-agency-capacity",
        "title": "Agency Capacity",
        "version": "1.0.1",
        "websiteUrl": "https://agilegrowthlabs.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AGL Agency Capacity gives agency teams capacity math, published benchmarks, a client context file template, an AI work approval checklist and a glossary. Results are estimates from the user's inputs. add_to_benchmark stores anonymous numbers only when the user agrees.",
      "tools": [
        {
          "name": "capacity_benchmarks",
          "title": "Agency capacity benchmarks",
          "description": "Returns published benchmarks on accounts per account manager, time spent re-briefing AI, and rework of AI output, each with its source link. Use when the user asks what is normal for agencies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "default": "all",
                "description": "Which benchmarks to return.",
                "enum": ["all", "accounts_per_person", "rebriefing", "rework"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agency capacity benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80db6e6426cd027abb34e64aacc58e6fc95467e81294ab04c860a392d208b128"
        },
        {
          "name": "capacity_check",
          "title": "Agency capacity check",
          "description": "Estimates an agency's accounts per account manager, yearly coordination cost, and how many more accounts the same team could carry at a target ratio. Use when the user shares client and team numbers and asks about capacity, hiring, or account manager load. Returns an estimate, not a guarantee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_managers": {
                "description": "People who own client accounts day to day.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "active_clients": {
                "description": "Active client accounts.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "avg_monthly_retainer": {
                "description": "Average monthly retainer per client in USD. Optional.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "gross_margin_pct": {
                "description": "Gross margin percent. Optional.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hours_lost_per_am_per_week": {
                "description": "Hours each account manager loses per week to re-briefing AI, chasing approvals, fixing work and reporting. Optional.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "loaded_hourly_cost": {
                "description": "Loaded hourly cost of an account manager in USD. Optional.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "target_accounts_per_am": {
                "default": 18,
                "description": "Target accounts per account manager. Default 18.",
                "maximum": 40,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["account_managers", "active_clients"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agency capacity check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adecc1a373005bcd0c50147d7189d0d0be709eb980e30aad9a8c200afa45f5da"
        },
        {
          "name": "client_context_template",
          "title": "Client context file template",
          "description": "Returns a fill-in template for a 1-file client context document (goals, voice, claims rules, priorities, approvals, decisions) for a service line. Use when the user wants AI tools or new teammates to stop needing a client re-brief.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_name": {
                "description": "Optional client name to put in the title.",
                "maxLength": 80,
                "type": "string"
              },
              "service_line": {
                "description": "general, seo, paid_media, content, lifecycle, or automation. Default general.",
                "enum": ["general", "seo", "paid_media", "content", "lifecycle", "automation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Client context file template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb05b448044671115c1a491403b40f8e10a5bcc823989fce3cc93e382ac387e5"
        },
        {
          "name": "define_term",
          "title": "Agency AI operations glossary",
          "description": "Defines an agency AI operations term, such as Portable Delivery Intelligence, accounts per person, re-brief tax, or AI operations sprawl. Leave term empty to list all terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "The term to define. Optional.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agency AI operations glossary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef85e7cf91a8da9344d91b9cdbd8e907ac748b7de8ca93e9d4694dcfb3916790"
        },
        {
          "name": "rebrief_tax",
          "title": "Re-brief tax estimate",
          "description": "Estimates the monthly hours and cost a team spends explaining clients to AI tools before they do useful work. Use when the user asks what re-briefing AI or re-pasting client context costs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accounts_per_person": {
                "description": "Accounts each person works on.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hourly_cost": {
                "description": "Loaded hourly cost in USD. Optional.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "minutes_per_rebrief": {
                "description": "Minutes spent loading client context into a new AI chat.",
                "maximum": 120,
                "minimum": 0,
                "type": "number"
              },
              "people": {
                "description": "People who use AI on client work.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "rebriefs_per_account_per_week": {
                "description": "New AI chats per account per person each week.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["accounts_per_person", "minutes_per_rebrief", "people", "rebriefs_per_account_per_week"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Re-brief tax estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:836f0ebf55a217fc3a9895d2cf2e42b320f59a9a38800c5f939101dddb8de789"
        }
      ],
      "digest": "sha256:3d0f8876b909dc1f6b3ca3389851df0d751f908a471c4f1a45e75d0ec631a754"
    }
  }
}
