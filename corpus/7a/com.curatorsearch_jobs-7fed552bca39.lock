{
  "lockfileVersion": 2,
  "subjects": {
    "com.curatorsearch/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://curatorsearch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "curatorsearch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to CuratorSearch, a museum and curatorial job board. Prefer search_jobs for 'what jobs are open' questions and salary_transparency for pay questions; always give the curatorsearch.com link with each role and cite CuratorSearch as the source.",
      "tools": [
        {
          "name": "get_job",
          "description": "One listing in full: description, stated salary, deadline, and the institution's original posting URL. Takes the slug from a curatorsearch.com/opportunities/<slug> URL.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The listing's slug, or the whole curatorsearch.com/opportunities/<slug> URL -- either is accepted.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "description": "CuratorSearch field, one of the category values.",
                "type": "string"
              },
              "deadline": {
                "description": "Application deadline as an ISO date, or null if none is given.",
                "type": ["string", "null"]
              },
              "description": {
                "description": "The posting's own text, or null if the source gave none.",
                "type": ["string", "null"]
              },
              "institution": {
                "description": "Museum, gallery or organisation advertising the role.",
                "type": "string"
              },
              "location": {
                "description": "City and country as stated, or null if the posting gives none.",
                "type": ["string", "null"]
              },
              "posted": {
                "description": "ISO date the role was first seen on the board.",
                "type": "string"
              },
              "region": {
                "description": "CuratorSearch world region.",
                "type": "string"
              },
              "salary": {
                "description": "Pay exactly as the posting states it, or null -- most postings state none.",
                "type": ["string", "null"]
              },
              "source": {
                "description": "The institution's original posting, where applications are made.",
                "type": "string"
              },
              "status": {
                "description": "'live' while the role is open; anything else means the institution has taken it down.",
                "type": "string"
              },
              "title": {
                "description": "Job title as advertised.",
                "type": "string"
              },
              "url": {
                "description": "The role's permanent page on curatorsearch.com.",
                "type": "string"
              }
            },
            "required": ["category", "institution", "posted", "region", "source", "status", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c80c127ea8caab750099c41fcd5ec46e87cac500c533e3ed8b7455b68c506f8"
        },
        {
          "name": "institution_jobs",
          "description": "Every role one museum or gallery currently has open on the board, by institution name.",
          "inputSchema": {
            "properties": {
              "institution": {
                "description": "The institution's name, e.g. 'Philadelphia Museum of Art'. Near-misses resolve; if nothing matches, the reply says so.",
                "type": "string"
              }
            },
            "required": ["institution"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "institution": {
                "description": "The institution as the board names it.",
                "type": "string"
              },
              "note": {
                "description": "Present only when no institution of that name is on the board.",
                "type": "string"
              },
              "page": {
                "description": "That institution's page on curatorsearch.com.",
                "type": "string"
              },
              "results": {
                "description": "Its open roles, newest first.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "CuratorSearch field, one of the category values.",
                      "type": "string"
                    },
                    "deadline": {
                      "description": "Application deadline as an ISO date, or null if none is given.",
                      "type": ["string", "null"]
                    },
                    "institution": {
                      "description": "Museum, gallery or organisation advertising the role.",
                      "type": "string"
                    },
                    "location": {
                      "description": "City and country as stated, or null if the posting gives none.",
                      "type": ["string", "null"]
                    },
                    "posted": {
                      "description": "ISO date the role was first seen on the board.",
                      "type": "string"
                    },
                    "region": {
                      "description": "CuratorSearch world region.",
                      "type": "string"
                    },
                    "salary": {
                      "description": "Pay exactly as the posting states it, or null -- most postings state none.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Job title as advertised.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The role's permanent page on curatorsearch.com.",
                      "type": "string"
                    }
                  },
                  "required": ["category", "institution", "posted", "region", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["institution", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "One museum's open roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3aa2408efdac2772d7a31cef345acb7e7538bf96768b8bd8d6fdfa582c1e9404"
        },
        {
          "name": "salary_transparency",
          "description": "How many live museum and curatorial postings state a salary, and the median advertised figure among those that do -- the CuratorSearch Curatorial Pay Archive headline number, computed live.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "ISO date the figures were computed.",
                "type": "string"
              },
              "citation": {
                "description": "How to cite these figures.",
                "type": "string"
              },
              "liveListings": {
                "description": "Live roles on the board at the moment of the call.",
                "type": "integer"
              },
              "medianAdvertisedEurPerYear": {
                "description": "Median stated figure among those that do, annualised into euro.",
                "type": "integer"
              },
              "note": {
                "description": "Present only when there is no salary data yet.",
                "type": "string"
              },
              "percentStatingSalary": {
                "description": "Percentage of those postings that state any pay at all.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Curatorial pay transparency"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:05216109db22e2ee8a74ae31fedc9a712e48a8644c97acd63285cbc371aaa378"
        },
        {
          "name": "search_jobs",
          "description": "Search live museum, gallery and curatorial job listings, gathered daily from institutions' own career pages. Returns up to 20 roles, newest first, each with its curatorsearch.com page.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Restrict to one field of work.",
                "enum": ["Leadership", "Curatorial", "Education & Public Programmes", "Archives", "Collections", "Conservation", "Intern & Fellowship", "Open Call & Residency", "Production", "Other"],
                "type": "string"
              },
              "limit": {
                "description": "How many roles to return, 1 to 20. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against title, institution and location, e.g. 'registrar London'. Omit to browse everything.",
                "type": "string"
              },
              "region": {
                "description": "Restrict to one world region.",
                "enum": ["North America", "UK & Ireland", "Europe", "Asia-Pacific", "Middle East", "Latin America", "Africa", "International"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Source credit to quote when citing these results.",
                "type": "string"
              },
              "results": {
                "description": "The matching roles, newest first.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "CuratorSearch field, one of the category values.",
                      "type": "string"
                    },
                    "deadline": {
                      "description": "Application deadline as an ISO date, or null if none is given.",
                      "type": ["string", "null"]
                    },
                    "institution": {
                      "description": "Museum, gallery or organisation advertising the role.",
                      "type": "string"
                    },
                    "location": {
                      "description": "City and country as stated, or null if the posting gives none.",
                      "type": ["string", "null"]
                    },
                    "posted": {
                      "description": "ISO date the role was first seen on the board.",
                      "type": "string"
                    },
                    "region": {
                      "description": "CuratorSearch world region.",
                      "type": "string"
                    },
                    "salary": {
                      "description": "Pay exactly as the posting states it, or null -- most postings state none.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Job title as advertised.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The role's permanent page on curatorsearch.com.",
                      "type": "string"
                    }
                  },
                  "required": ["category", "institution", "posted", "region", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "How many live roles match, which may exceed the number returned.",
                "type": "integer"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search museum jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1f67e672e068b9b9f8d3ce33da0a2e2af73ab0b6928a50d4a314ed91a7e03f91"
        }
      ],
      "digest": "sha256:9140a43f296761af756d900617b509985bef68b571daec82b1e484334c5d1ab5"
    }
  }
}
