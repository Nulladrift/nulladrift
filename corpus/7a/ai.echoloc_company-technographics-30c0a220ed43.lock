{
  "lockfileVersion": 2,
  "subjects": {
    "ai.echoloc/company-technographics": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.echoloc.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "echoloc",
        "title": "echoloc — company intelligence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "echoloc company intelligence: technographics with direction of change (adopting / replacing / evaluating), hiring signals, and firmographics for 760,000+ companies, built from public job posts. Without an API key you get an anonymous preview (5 tool calls/day, trimmed results). For full data send an echoloc API key in the 'X-API-Key' header. Free beta key (100 requests/month, instant): sign up at https://echoloc.ai/auth?mode=signup&returnTo=%2Fapp%2Fapi and copy the key from https://echoloc.ai/app/api. Production keys: hello@echoloc.ai. Details: https://echoloc.ai/for-agents/",
      "tools": [
        {
          "name": "get_company_by_domain",
          "title": "Get company profile by domain",
          "description": "Resolve a company domain (e.g. 'walgreens.com') to its full profile: firmographics, hiring stats, and the technology stack with adoption context (using / adopting / replacing / evaluating). Matches the primary domain first, then known aliases (regional TLDs, legacy brands, subdomains).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Company domain — primary or any known alias",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get company profile by domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee1bf6af2612bdbfc782256dc1fd30cf6b0371458a540b5e7edf7f8e8f57a920"
        },
        {
          "name": "list_technologies",
          "title": "List tracked technologies",
          "description": "Catalog of all technologies in the dataset with per-technology company counts. sort='count' (most used first) or 'name'.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 50,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "count",
                "enum": ["count", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List tracked technologies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bcf40e413f89638a373a4e086dc74d0ed835c70a5f25771ccc5d61c249c8bf0"
        },
        {
          "name": "search_companies_by_technologies",
          "title": "Search companies by technologies",
          "description": "Find companies using the given technologies, ranked by usage. Names are case-insensitive ('snowflake' == 'Snowflake'); 10,000+ technologies are tracked (use list_technologies to explore). match='any' needs at least one technology, 'all' needs every one.",
          "inputSchema": {
            "properties": {
              "match": {
                "default": "any",
                "enum": ["any", "all"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "technologies": {
                "description": "Technology names, e.g. [\"Snowflake\", \"dbt\"]",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["technologies"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search companies by technologies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:00df4c7eca08f50e59dab659e9ef6d3af42462aebf2feaa9068c88b3cb5f44ff"
        }
      ],
      "digest": "sha256:85b5486bb764c4b42d72ace011a83a36eafe3d1dadf26a6e40ef1499589c6d18"
    }
  }
}
