      "serverInfo": {
        "name": "freightfa",
        "title": "FreightFA",
        "version": "0.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Freight intelligence tools from FreightFA, an independent rate-benchmark service (not a broker or carrier). Start with get_freight_brief: it takes no inputs and returns today's national truck rates, next week's outlook, capacity, rail, ocean, air, and barge readings, and the newest stories, each with its date and source. For a lane given as places, call recommend_mode to rank modes and get the distance, then estimate_truckload_rate, estimate_ltl_rate, estimate_rail_rate, estimate_intermodal_rate, or estimate_barge_rate for a price; each signed-in account has a tool-call allowance (5 a day and 50 a month on a free account), and ask_freight_analyst questions also count toward the website chat allowance. Market detail: get_market_snapshot (today's national truck rates and diesel), get_market_outlook (next week's truck forecast), get_rail_market_outlook, get_freight_index_outlook (ocean and air), get_barge_outlook; the first four work with no inputs and then return every option. News: get_freight_news (FreightFA's newest market stories, newsletter articles, videos, and podcast episodes, with links). Carriers and planning: lookup_carrier (FMCSA), find_intermodal_hubs, explain_freight_term, calculate_margin, check_freight_bill (read the amounts off a truckload or LTL bill the user shares, then compare them with today's market for the lane; pass the fields, not the document), draft_pushback_email, create_rfp, estimate_network_cost (multi-leg supply chains). The user's RFPs, rate alerts, and recent searches are also available. Without a FreightFA sign-in, the first few calls work as a guest; after that, and for the account tools, FreightFA shows its sign-in, where the user can create a free account. Results may list one or two related FreightFA tools; offer them only when they fit what the user is doing. All rates are directional benchmarks for planning; cite FreightFA with the date, and confirm binding quotes with a carrier or broker.",
      "tools": [
        {
          "name": "ask_freight_analyst",
          "title": "Ask Freight Flow AI",
          "description": "Ask FreightFA's AI freight analyst a question in plain language: lane rates, mode choice, capacity, fuel, carrier vetting, market news, or drafting an RFP. Answers cite their sources and can include a priced rate card. Pass session_id from a previous answer to continue the same conversation. Each question counts toward the account's monthly FreightFA allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "question": {
                "description": "The question, up to 2,000 characters.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "session_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "session_id returned by an earlier answer to continue that conversation, or null to start a new one."
              }
            },
            "required": ["question", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:118d3ace382fa6ce14fc0911a12d9efb2b48b2eec47c649654c43ac55bd92de7"
        },
        {
          "name": "calculate_margin",
          "title": "Calculate freight margin",
          "description": "Margin on a load from the buy rate (carrier cost) and sell rate (what the shipper pays): margin in dollars and percent of sell, the per-mile spread when miles are given, and the sell price needed to hit a target margin. Pure arithmetic; does not count toward the allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buy": {
                "description": "Carrier cost (buy rate) for the load, all-in, in dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "miles": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Loaded miles, or null."
              },
              "sell": {
                "description": "Shipper price (sell rate) for the load, all-in, in dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "target_margin_pct": {
                "anyOf": [
                  {
                    "maximum": 90,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Target margin as a percent of sell, e.g. 15, or null."
              }
            },
            "required": ["buy", "miles", "sell", "target_margin_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:008d43e4828b0a1d11c1f4ad7128ef574552ed798cdcfe134c5aecae064a36ce"
        },
        {
          "name": "check_freight_bill",
          "title": "Check a freight bill against the market",
          "description": "Compare what a shipper was billed (or quoted) for one truckload or LTL load with today's market price for the same lane. Use it when the user uploads, pastes, or describes a freight bill, carrier or broker invoice, or rate confirmation and asks whether the price is fair. Read the fields off the document yourself and pass only those; never send the document, its text, company or people's names, street addresses, or invoice, PRO, BOL, or account numbers. If the document doesn't say what kind of truck moved the load, ask the user. Dry Van and LTL return a verdict (above_market, at_market, good_price, below_floor) against FreightFA's market quote, negotiation target, and walk-away floor, plus what negotiating would have saved. Reefer and Flatbed return FreightFA's estimate and the gap with no verdict (no_call). The comparison is all-in with fuel; put detention, lumper, liftgate and other extras in accessorials so they are left out. Bills older than 90 days are not judged. Takes places, not miles. Each call counts as one estimate toward the account's monthly FreightFA allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accessorials": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The part of billed_total that is extras (detention, lumper, liftgate, residential, layover), in dollars. Null or 0 when there are none."
              },
              "billed_total": {
                "description": "Everything on the bill, in U.S. dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "destination": {
                "description": "Where the load delivered: city and state, or ZIP.",
                "minLength": 2,
                "type": "string"
              },
              "freight_class": {
                "description": "LTL only: NMFC freight class from the bill such as '70' or '92.5', or null.",
                "type": ["string", "null"]
              },
              "mode": {
                "description": "What moved. A plain truckload or FTL bill is 'Dry Van'.",
                "enum": ["Dry Van", "Reefer", "Flatbed", "LTL"],
                "type": "string"
              },
              "origin": {
                "description": "Where the load picked up: city and state, or ZIP. Example: 'Chicago, IL 60601'. Not the bill-to or remit-to address.",
                "minLength": 2,
                "type": "string"
              },
              "pallets": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "LTL only: pallet count, or null."
              },
              "ship_date": {
                "description": "Ship or pickup date as YYYY-MM-DD, or null if the bill doesn't say.",
                "type": ["string", "null"]
              },
              "weight_lbs": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "LTL only: shipment weight in pounds. Null for truckload."
              }
            },
            "required": ["accessorials", "billed_total", "destination", "freight_class", "mode", "origin", "pallets", "ship_date", "weight_lbs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
