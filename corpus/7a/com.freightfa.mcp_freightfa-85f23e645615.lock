        {
          "name": "estimate_network_cost",
          "title": "Cost a multi-leg supply chain (Network Builder)",
          "description": "Price a supply chain of up to 10 legs (factory to port to warehouse to store, domestic or international) and total it, with each leg's mode, cost, and transit time. Saved to the user's Network Builder. Full costs are included with FreightFA Desk; other accounts can spend a one-time trial run by setting use_trial_run to true, otherwise legs come back without costs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "legs": {
                "description": "Legs in order.",
                "items": {
                  "properties": {
                    "commodity_type": {
                      "description": "What is shipped, e.g. 'Packaged Goods'.",
                      "minLength": 2,
                      "type": "string"
                    },
                    "destination": {
                      "description": "Leg destination.",
                      "minLength": 2,
                      "type": "string"
                    },
                    "origin": {
                      "description": "Leg origin: city and state or country.",
                      "minLength": 2,
                      "type": "string"
                    },
                    "weight_lbs": {
                      "description": "Weight moved on this leg, in pounds.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["commodity_type", "destination", "origin", "weight_lbs"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "A name for the network, e.g. 'Shenzhen to Dallas stores'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "use_trial_run": {
                "description": "true to spend the account's one-time trial run if it has no Desk plan.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["legs", "name", "use_trial_run"],
            "type": "object"
          },
          "annotations": {
