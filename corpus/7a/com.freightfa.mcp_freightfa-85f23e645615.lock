        },
        {
          "name": "draft_pushback_email",
          "title": "Draft an email pushing back on a freight quote",
          "description": "Draft an email to a broker or carrier pushing back on a truckload quote, using the market benchmark for the lane and this week's market direction. Set want_counter to true to also draft a counter-offer. If no benchmark is given, the national all-in rate for the equipment is used. Included with FreightFA Pro and Desk accounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "benchmark_per_mile": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "All-in market benchmark in $/mi (e.g. from estimate_truckload_rate), or null to use the national rate."
              },
              "destination": {
                "description": "Destination city and state.",
                "minLength": 2,
                "type": "string"
              },
              "distance_miles": {
                "description": "Lane miles.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "equipment": {
                "description": "Equipment type.",
                "enum": ["Dry Van", "Reefer", "Flatbed"],
                "type": "string"
              },
              "origin": {
                "description": "Origin city and state.",
                "minLength": 2,
                "type": "string"
              },
              "quoted_total": {
                "description": "The all-in quote being pushed back on, in dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "want_counter": {
                "description": "true to include a counter-offer.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["benchmark_per_mile", "destination", "distance_miles", "equipment", "origin", "quoted_total", "want_counter"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
