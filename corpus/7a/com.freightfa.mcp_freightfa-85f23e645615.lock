        {
          "name": "estimate_truckload_rate",
          "title": "Estimate truckload (FTL) rate",
          "description": "Estimate a full-truckload freight rate for a lane using FreightFA's rate engine. Returns a directional benchmark for planning. Each call counts as one estimate toward the account's monthly FreightFA allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "anyOf": [
                  {
                    "maxLength": 160,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "destination_zip": {
                "anyOf": [
                  {
                    "pattern": "^[0-9]{5}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "distance": {
                "description": "Lane distance in miles. recommend_mode returns it for a city or ZIP pair.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "equipment_type": {
                "description": "Equipment type, e.g. 'Dry Van', 'Reefer', 'Flatbed', 'Dump Truck'.",
                "type": "string"
              },
              "origin": {
                "anyOf": [
                  {
                    "maxLength": 160,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Origin city and state; provide with destination, or use both ZIPs."
              },
              "origin_zip": {
                "anyOf": [
                  {
                    "pattern": "^[0-9]{5}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "pickup_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pickup date YYYY-MM-DD; omitted uses the calculator default."
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "request_id from recommend_mode for this lane, or null. Links the price to that search."
              },
              "weight": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Shipment weight in pounds, or null."
              }
            },
            "required": ["distance", "equipment_type", "weight"],
            "type": "object"
          },
