        {
          "name": "estimate_barge_rate",
          "title": "Estimate barge rate",
          "description": "Estimate an inland waterway barge freight rate for a bulk commodity, origin, destination, distance, and weight, from USDA's weekly downbound grain barge rates. Only priced when both ends are Mississippi/Illinois/Ohio River ports, the lane runs downriver, and the shipment is at least one barge-load (~1,500 short tons, 3,000,000 lb); otherwise returns available: false with the reason. Priced on river miles. Returns a directional benchmark for planning. Each call counts as one estimate toward the account's monthly FreightFA allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "commodity_type": {
                "description": "Commodity being shipped, e.g. 'grain', 'corn', 'coal'. Barge only carries bulk commodities.",
                "type": "string"
              },
              "destination": {
                "description": "Destination city and state, e.g. 'New Orleans, LA'.",
                "type": "string"
              },
              "distance": {
                "description": "Lane distance in miles. recommend_mode returns it for a city or ZIP pair.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "origin": {
                "description": "Origin city and state, e.g. 'Minneapolis, MN'.",
                "type": "string"
              },
              "weight": {
                "description": "Shipment weight in pounds.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["commodity_type", "destination", "distance", "origin", "weight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
