          "digest": "sha256:dc9f644fcffca57946db0eee46952a36d76cd718b6b127b99e71b183bb41a88b"
        },
        {
          "name": "create_rate_alert",
          "title": "Create rate alert",
          "description": "Create a lane rate alert for the signed-in user. Notifies them when the benchmark crosses the threshold.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "description": "Destination city/state or ZIP.",
                "minLength": 2,
                "type": "string"
              },
              "direction": {
                "anyOf": [
                  {
                    "enum": ["above", "below"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Trigger when the rate goes above or below the threshold. Defaults to 'below'."
              },
              "mode": {
                "description": "Freight mode: 'FTL' (Dry Van), 'FTL Reefer', 'FTL Flatbed', 'LTL', 'Rail' or 'Intermodal'. Saved as one of those.",
                "type": "string"
              },
              "origin": {
                "description": "Origin city/state or ZIP.",
                "minLength": 2,
                "type": "string"
              },
              "threshold_rate": {
                "description": "Rate threshold in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["destination", "direction", "mode", "origin", "threshold_rate"],
            "type": "object"
          },
          "annotations": {
