      "instructions": "Search Odile Machine Access with gate_search_access. Each result is a domain-verified contract: its allowed calls, the owner's price for each in credits (1 credit = USD 0.10; 0 is free), limits and a connect URL. POST {\"label\": \"<your agent>\"} to that URL for a gateway URL and a key (shown once); priced calls need credits first, and only a 2xx answer is charged. Every call that reaches the API answers with x-odile-receipt, a receipt anyone can check.",
      "tools": [
        {
          "name": "gate_search_access",
          "title": "Search Machine Access contracts",
          "description": "Search APIs listed in Odile Machine Access. Each is a domain-verified access contract: the calls an AI agent may make, the owner's price for each in credits (1 credit = USD 0.10; 0 is free), rate and daily limits, and a connect URL. Read-only; connecting is an HTTP POST to the connect URL.",
