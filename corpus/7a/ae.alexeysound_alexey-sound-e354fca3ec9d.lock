          "description": "Everything about Alexey Sound, a production sound mixer / location sound recordist in Dubai: services, price (from AED 2,500/day), kit, FAQ, credits, reviews, contacts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:736b066d4f77e02d7dd56546b072e0f23bf0093e3a90282c9292bd4e004aac2d"
        },
        {
          "name": "request_booking",
          "description": "Send a booking request to Alexey for the client. It is NOT a confirmation: Alexey replies to the client personally. Ask the client for every required field first.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company / production",
                "type": "string"
              },
              "contact": {
                "description": "Email or phone of the client",
                "type": "string"
              },
              "dates": {
                "description": "Shooting dates (e.g. 2026-11-20, or 20–21 Nov 2026)",
                "type": "string"
              },
              "details": {
                "description": "Anything else: hours, crew, cameras, budget",
                "type": "string"
              },
              "location": {
                "description": "City / venue",
                "type": "string"
              },
              "name": {
                "description": "Client name",
                "type": "string"
              },
              "people_on_camera": {
                "description": "How many people speak on camera",
                "type": "string"
              },
              "shoot_type": {
                "description": "Commercial, documentary, interview, corporate, podcast, film, TV…",
                "type": "string"
              }
            },
            "required": ["contact", "dates", "location", "name", "shoot_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
