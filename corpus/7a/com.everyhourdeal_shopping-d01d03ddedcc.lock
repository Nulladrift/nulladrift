{
  "lockfileVersion": 2,
  "subjects": {
    "com.everyhourdeal/shopping": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://everyhourdeal-checkout.everyhourdeal-store.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "everyhourdeal",
        "title": "EveryHourDeal shopping",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search and recommend products from EveryHourDeal, a US store with free shipping from US warehouses and 30-day returns. Share the product url so the shopper can buy.",
      "tools": [
        {
          "name": "compare_products",
          "description": "Compare 2-5 EveryHourDeal products side by side (price, highlights, delivery days); says which is cheapest and fastest.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74a6425a329ed73d935df21320332cd6051def48983a0adcce0c3624420318cd"
        },
        {
          "name": "deal_of_the_hour",
          "description": "The product featured as EveryHourDeal's Deal of the Hour right now, and when the next one starts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:463356150ced743427ca9d42df391e0a746b5e79825434fd3df65f638f20fcee"
        },
        {
          "name": "get_product",
          "description": "Get one EveryHourDeal product by id (from search_products).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e90724a1adfb1945f2490863c7bbb4d43c4646bcbef8ebd5ec9bd58d8eec5607"
        },
        {
          "name": "list_departments",
          "description": "EveryHourDeal's departments and how many products each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8255ad565acbb87b7bf88b8674683fb5e03cb42e72947cbbd63ef70067a68d5b"
        },
        {
          "name": "search_products",
          "description": "Search EveryHourDeal's US catalog (furniture, patio, grills, home gym, e-bikes, appliances, pets and more). Every item ships free from a US warehouse with 30-day returns. Returns name, price (USD), link, image and delivery days.",
          "inputSchema": {
            "properties": {
              "department": {
                "description": "Optional department, e.g. patio, home-gym, bedroom, grill, pets",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "type": "number"
              },
              "min_price": {
                "type": "number"
              },
              "query": {
                "description": "What the shopper wants, e.g. 'ergonomic office chair'",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:535acb4192072b822549b5d3a668ae1fdd206487f969cd455aa1dbf3b86024f1"
        }
      ],
      "digest": "sha256:1a7e9926e34d9c6d1458f9927df9d7bc51af62648582224fdd728a4977d88644"
    }
  }
}
