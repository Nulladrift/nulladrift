      "instructions": "Read-only Amsterdam city information from Essentially Amsterdam (essentiallyamsterdam.com): events, English-language jobs, local businesses, markets, conferences, practical guides, local news, and the answers of our free tools (Dutch net salary, rent points, Museumkaart, meet in the middle, nearest public toilet or playground, bike theft by neighbourhood). Each call returns at most 10 results; every result links to a page on essentiallyamsterdam.com where the reader can see more.",
