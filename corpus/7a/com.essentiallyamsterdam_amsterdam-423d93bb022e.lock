        {
          "name": "rent_points",
          "title": "Dutch rent points calculator (WWS)",
          "description": "Dutch rent points (WWS, independent homes) and the maximum legal basic rent, as on our rent points calculator: total, sector, maximum rent and points per category. Every input is optional; defaults are the page example. Example: rooms=[{area_m2:24},{area_m2:11}].",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "baths": {
                "description": "Baths (default 0)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "build_year": {
                "description": "Build year, when energy_source is \"year\" (no valid label)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "cooling_rooms": {
                "description": "Rooms with fixed cooling that also heats: 0, 1 or 2 (2 or more)",
                "enum": ["0", "1", "2"],
                "type": "string"
              },
              "energy_index": {
                "description": "Energy index (EI), when energy_source is \"ei\"",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "energy_label": {
                "description": "Energy label A++++ to G (default C)",
                "enum": ["A++++", "A+++", "A++", "A+", "A", "B", "C", "D", "E", "F", "G"],
                "type": "string"
              },
              "energy_source": {
                "description": "label (default), ei (energy index) or year (no valid label: build year)",
                "enum": ["label", "ei", "year"],
                "type": "string"
              },
              "home_type": {
                "description": "apartment (homes above or below it, default) or house (single-family)",
                "enum": ["apartment", "house"],
                "type": "string"
              },
              "kitchen_appliances": {
                "description": "Built-in kitchen extras present. Default: extractor_hood, fridge, electric_oven, single_lever_tap.",
                "items": {
                  "enum": ["extractor_hood", "induction_hob", "ceramic_hob", "gas_hob", "fridge", "freezer", "electric_oven", "gas_oven", "microwave", "dishwasher", "single_lever_tap", "thermostatic_tap", "boiling_water_tap"],
                  "type": "string"
                },
                "maxItems": 13,
                "type": "array"
              },
              "kitchen_countertop": {
                "description": "Countertop length incl. sink and hob: under_1m, 1_to_2m or 2m_or_more (default)",
                "enum": ["under_1m", "1_to_2m", "2m_or_more"],
                "type": "string"
              },
              "newly_built_after_july_2024": {
                "description": "First lived in after 1 July 2024, construction started before 2028 (default false)",
                "type": "boolean"
              },
              "other_spaces": {
                "description": "Other spaces (storage, attic, utility room) with area in m2; heated defaults to false. Default: one 4 m2 storage.",
                "items": {
                  "properties": {
                    "area_m2": {
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "heated": {
                      "type": "boolean"
                    }
                  },
                  "required": ["area_m2"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "private_outdoor_m2": {
                "description": "Private outdoor space in m2: garden, balcony, roof terrace (default 0)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "protected_status": {
                "description": "none (default), national_monument, municipal_or_provincial_monument or protected_townscape_pre_1965",
                "enum": ["none", "national_monument", "municipal_or_provincial_monument", "protected_townscape_pre_1965"],
                "type": "string"
              },
              "rooms": {
                "description": "Rooms (living room, bedrooms, kitchen, bathroom...) with their floor area in m2; heated defaults to true. Default: the page example 24, 11, 7 and 4 m2.",
                "items": {
                  "properties": {
                    "area_m2": {
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "heated": {
                      "type": "boolean"
                    }
                  },
                  "required": ["area_m2"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "shared_outdoor_addresses": {
                "description": "Number of addresses sharing it (default 1)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "shared_outdoor_m2": {
                "description": "Shared outdoor space in m2 (default 0)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "showers": {
                "description": "Showers (default 1)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "toilets_separate_room": {
                "description": "Toilets in a separate toilet room (default 1)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "washbasins_bathroom": {
                "description": "Washbasins in the bathroom (default 1)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "woz_value": {
                "description": "WOZ value in EUR (page default 400000)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
