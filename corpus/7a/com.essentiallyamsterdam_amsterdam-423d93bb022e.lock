        {
          "name": "net_salary",
          "title": "Dutch net salary calculator 2026",
          "description": "Dutch gross-to-net pay for 2026 (Belastingdienst tables), with or without the 30% ruling, as on our net salary calculator: net per month and year plus the tax breakdown. Example: gross=60000, period='yearly', ruling_30=true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gross": {
                "description": "Gross salary in euros, e.g. 60000 a year or 4500 a month",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "includes_holiday_allowance": {
                "description": "The amount already includes the 8% holiday allowance (vakantiegeld). Default false, as most Dutch job ads quote salary without it.",
                "type": "boolean"
              },
              "period": {
                "description": "Whether the gross amount is per year or per month",
                "enum": ["yearly", "monthly"],
                "type": "string"
              },
              "ruling_30": {
                "description": "Has the 30% ruling (expat scheme). Default false.",
                "type": "boolean"
              },
              "under_30_with_masters": {
                "description": "With the 30% ruling: under 30 with a Dutch (or equivalent) master's degree (lower salary minimum). Default false.",
                "type": "boolean"
              }
            },
            "required": ["gross", "period"],
            "type": "object"
          },
          "annotations": {
