            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "neighbourhood": {
                "description": "Optional neighbourhood (e.g. \"Jordaan\", \"Oude Pijp\") or district (e.g. \"Centrum\", \"Noord\")",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
