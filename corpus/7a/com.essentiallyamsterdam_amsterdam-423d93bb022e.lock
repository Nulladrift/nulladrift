          "title": "Bike theft in Amsterdam by neighbourhood",
          "description": "Bicycle and moped thefts per Amsterdam neighbourhood (police open data), latest year against the year before, per 1,000 residents and ranked; no input gives the top 10. Example: neighbourhood='Oude Pijp'.",
