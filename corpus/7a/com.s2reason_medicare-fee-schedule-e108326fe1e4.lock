        {
          "name": "medicare_get_physician_fee",
          "title": "Medicare physician fee lookup",
          "description": "Use this when you need what Medicare's Physician Fee Schedule allows for a CPT or HCPCS code on a given date of service, for the nation or for one state or locality, in the office or facility setting. It takes up to 25 lines (code, modifier, date of service) and returns one answer per line, in order: CMS's allowed amount (national figure, plus the state range or one locality's figure when a state is given), the CMS release in force on that date, its source files with SHA-256 checksums, and the release catalog URL. It covers dates of service from Jan 1, 2023 through Dec 31, 2026; each date is priced under the quarterly CMS release in force that day, and a date outside that span gets a reason instead of a figure. A code with no national rate on this schedule (bundled, carrier-priced, laboratory, drug, anesthesia, ambulance, supplies, or absent from that release) returns a result_kind and a reason, not an error, and a malformed line returns an error for that line only. Do not use it for hospital outpatient or inpatient facility payments, ambulatory surgery center fees, Medicaid, commercial or workers' compensation rates, CPT code descriptions, or opinions on whether a charge is reasonable. It is read-only; amounts are Medicare-allowed amounts per unit, before sequestration and multiple-procedure reductions.",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "Optional, applies to every line. concise (default) returns the national figure and the state range. detailed lists every locality in the state, with the geographic indexes used, and needs state.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "lines": {
                "description": "One to 25 service lines to price. The answers come back in this order.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "CPT or HCPCS code: five digits, four digits and a letter, or a letter and four digits. Case and spaces do not matter, and a trailing modifier is accepted. Example: 12345.",
                      "maxLength": 16,
                      "type": "string"
                    },
                    "date_of_service": {
                      "description": "Date the service was provided: YYYY-MM-DD, or MM/DD/YYYY with the month first, or a written date. The year has four digits. Example: 2025-06-17.",
                      "maxLength": 24,
                      "type": "string"
                    },
                    "modifier": {
                      "description": "Optional. none or empty for the whole (global) service, 26 for the professional component, TC for the technical component, or 53 for a discontinued procedure. Example: 26.",
                      "maxLength": 8,
                      "type": "string"
                    }
                  },
                  "required": ["code", "date_of_service"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "locality": {
                "description": "Optional, applies to every line, needs state. CMS locality number inside that state. Leave it out to get the state's range. Example: 01.",
                "maxLength": 4,
                "type": "string"
              },
              "setting": {
                "description": "Optional, applies to every line. Which setting the headline figure reports: office (non-facility) or facility (hospital). Both settings are always in the figures. Leave it out for the setting CMS shows first.",
                "enum": ["office", "facility"],
                "type": "string"
              },
              "state": {
                "description": "Optional, applies to every line. Two-letter key or full name of a state, DC, Puerto Rico or the Virgin Islands. Leave it out for the national figure only. Example: NJ.",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
