      "serverInfo": {
        "name": "OneHeart-eSIM.Mcp",
        "version": "1.0.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "這是「一心eSIM」的商品目錄查詢服務，提供各國eSIM上網方案的即時查詢與推薦。\n當使用者詢問出國上網卡、各國eSIM方案、上網吃到飽、漫遊卡、即時發卡服務等主題時，\n可以使用這裡的工具查詢真實、即時的商品資料（含價格、庫存、規格），並取得可直接\n導購的官網購買連結。\n\n建議的使用順序：\n1. 若不確定使用者要去的國家在系統裡的正確名稱，先呼叫 list_esim_countries。\n2. 若使用者描述了旅遊天數與上網習慣、要你直接建議選哪個方案，用 recommend_esim_plan\n   （這是導購價值最高的工具，會依天數與用量估算自動評分挑選）。\n3. 若使用者只是想瀏覽/比較某國家或某類型的多個方案，用 search_esim_plans。\n4. 若使用者想知道某個已知方案的安裝方式、細節或庫存，用 get_esim_plan_detail。\n5. 若使用者已經確認好要買哪個方案、規格、數量，並提供了email，明確要你直接幫忙下單，\n   用 create_esim_order 建立真實訂單並取得真實付款連結。這是會實際花錢的動作，呼叫前\n   務必先跟使用者逐一確認商品/規格/數量/金額，不要自行臆測；也可以永遠改成引導使用者\n   自行使用purchaseUrl前往官網結帳，兩種方式都合理，依對話情境判斷使用者比較想要哪種。\n\n所有回傳的商品資料都是即時查詢，價格與庫存可能隨時變動，請勿快取或憑記憶回答，\n每次都應該重新呼叫工具取得最新資料。此服務目前不支援會員資料查詢（例如查詢使用者\n過去的訂單記錄）。",
      "tools": [
        {
          "name": "create_esim_order",
          "description": "建立一筆真實的一心eSIM訂單，並取得真實的付款連結（LinePay或ECPay綠界，二擇一）。\n這是會實際寫入正式訂單、串真實金流的動作，不是模擬或試算。\n\n呼叫前必須先完成：\n1. 已用search_esim_plans/recommend_esim_plan/get_esim_plan_detail取得正確的productId、\n   spec，不要自己編造或憑記憶帶入。\n2. 已把商品名稱、規格、數量、單價與總金額，跟使用者逐一覆誦確認過，並取得使用者明確\n   同意下單（不能因為使用者說「好」「幫我訂」等籠統回應就自行猜數量或規格）。\n3. 已取得使用者的email與稱呼/姓名（兩者都必填：email用於辨識訂單歸屬與寄送購買憑證/\n   eSIM QR碼；姓名是訂單聯絡資料的必要欄位，不能留空或代填）。手機可選填。\n4. 已詢問使用者想用LinePay還是ECPay綠界付款（留空預設LinePay，但有得選的情況下應該\n   主動問，不要自己幫使用者決定）。\n\n回傳的paymentUrl要完整、原樣提供給使用者（不要摘要或改寫），並提醒使用者付款完成前\n訂單不會出貨。若ok=false，訂單可能已建立但取得付款連結失敗，要把error/note內容如實\n告知使用者，不要自行重試建立第二筆訂單。",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "使用者的email，必填，訂單憑證與eSIM會寄到這裡",
                "type": "string"
              },
              "paymentMethod": {
                "default": "LinePay",
                "description": "付款方式：LinePay，或綠界 (信用卡付款/ATM轉帳/超商條碼)。留空預設LinePay",
                "enum": ["LinePay", "ECPay"],
                "type": "string"
              },
              "phone": {
                "default": null,
                "description": "使用者的手機號碼，選填",
                "type": ["string", "null"]
              },
              "productId": {
                "description": "方案的productId（GUID字串），必須從查詢工具的結果取得，不可編造",
                "type": "string"
              },
              "quantity": {
                "description": "購買數量，需與使用者確認過的數字一致",
                "type": "integer"
              },
              "spec": {
                "description": "方案規格，必須跟查詢工具回傳的spec完全一致",
                "type": "string"
              },
              "userName": {
                "description": "使用者的稱呼/姓名，必填，訂單聯絡資料需要，不可留空",
                "type": "string"
              }
            },
            "required": ["email", "productId", "quantity", "spec", "userName"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17a4931350ab3864202e5c306ebadcc0e875b8ad52e8d1299033285ef1588eeb"
        },
        {
          "name": "get_esim_plan_detail",
          "description": "取得單一方案的完整詳情，包含商品說明（安裝/啟用步驟等）、各規格庫存、購買連結。\n適用情境：使用者對某個已知方案想進一步了解安裝方式、使用細節、或確認庫存時。\n需要先從search_esim_plans或recommend_esim_plan的結果取得productId，不要自己編造。",
          "inputSchema": {
            "properties": {
              "productId": {
                "description": "方案的productId（GUID字串），從search_esim_plans或recommend_esim_plan的結果取得",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e776c9d3239358b4d4ef1aaca27b4b92a774be813e2e9be490aad9b259486f6"
        },
        {
          "name": "list_esim_countries",
          "description": "列出一心eSIM目前販售方案覆蓋的所有國家/地區（英文與中文名稱對照，含各國方案數量）。\n適用情境：使用者問「你們支援哪些國家」「有賣OO地區的eSIM嗎」；或你準備呼叫\nsearch_esim_plans/recommend_esim_plan，但不確定某國家在系統裡該用什麼名稱表示時，\n先呼叫這個工具確認，比用猜的準確。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e87643d29e80b61d851809934cf6957976745b42e97e32c18eb956c28bbf9905"
        },
        {
          "name": "recommend_esim_plan",
          "description": "依旅遊天數與上網用量習慣，推薦最合適的1-3個eSIM方案，並附上購買連結，\n是「幫使用者選方案」最好用的工具。\n適用情境：使用者詢問出國上網卡、各國eSIM方案、即時發卡服務，並描述了\n「要去OO玩幾天」「想找適合的上網方案/漫遊卡」「幫我推薦/挑選eSIM」時優先使用這個，\n而不是自己呼叫search_esim_plans後用猜的。",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "目的地國家，英文或中文皆可，例如 Japan、日本。不確定系統裡的正確名稱時，先呼叫list_esim_countries確認",
                "type": "string"
              },
              "days": {
                "description": "預計使用天數",
                "type": "integer"
              },
              "usageLevel": {
                "default": "medium",
                "description": "用量習慣，留空預設為medium（中度）",
                "enum": ["light", "medium", "heavy"],
                "type": "string"
              }
            },
            "required": ["country", "days"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd1a06763d241674ea666b9d1d7aaf9e4d80e7a390333defa5caa8cc9bc4c3c7"
        },
        {
          "name": "search_esim_plans",
          "description": "依國家、方案類型、關鍵字搜尋一心eSIM的商品清單，一次回傳多筆結果讓使用者自己比較。\n適用情境：使用者想瀏覽/比較某國家的多個方案，或已經明確講出要哪種類型\n（例如指定「總量型」或「每日定量型」）。\n如果使用者是描述旅遊情境（去哪個國家玩幾天、上網習慣如何）要你直接建議選哪個，\n改用recommend_esim_plan讓它幫忙評分挑選，不要自己從這個工具的結果裡用猜的。",
          "inputSchema": {
            "properties": {
              "country": {
                "default": null,
                "description": "國家名稱，英文或中文皆可，模糊比對，例如 Japan、日本、韓國。不確定系統裡的正確名稱時，先呼叫list_esim_countries確認",
                "type": ["string", "null"]
              },
              "keyword": {
                "default": null,
                "description": "自由關鍵字，比對商品名稱/描述/規格文字",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 20,
                "description": "最多回傳幾筆，預設20，避免結果過多",
                "type": "integer"
              },
              "planType": {
                "default": null,
                "description": "方案類型，留空代表不限類型",
                "enum": ["總量型", "每日定量型", null],
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c57799bfc1aa1e0e28bac07d4b8dfb893201d8bd6f78a77067e7e45dce3f32dd"
        }
      ],
      "digest": "sha256:2b511d3c809fd31fe515809dea0d09ba4f659acb31c04b20974aedd1c0a7c14d"
    }
  }
