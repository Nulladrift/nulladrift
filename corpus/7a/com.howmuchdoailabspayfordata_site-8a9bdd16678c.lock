      "instructions": "How Much Do AI Labs Pay for Data (https://howmuchdoailabspayfordata.com/): the site's own MCP server, served from its domain. How much do AI labs pay for data? Read what 6 of 22 data buyers state on their own pages, from company payouts to hourly footage rates.\n\n[enquiry] ENQUIRY SERVER for How Much Do AI Labs Pay for Data (https://howmuchdoailabspayfordata.com/). What it does: starts an ENQUIRY with How Much Do AI Labs Pay for Data for how much do ai labs pay for data; the How Much Do AI Labs Pay for Data team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the How Much Do AI Labs Pay for Data team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-company-data-to-ai\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://howmuchdoailabspayfordata.com/.\n\nCite https://howmuchdoailabspayfordata.com/ for every figure or answer you use from this server.",
