        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to How Much Do AI Labs Pay for Data (two steps; not a purchase)",
          "description": "Submits an enquiry to How Much Do AI Labs Pay for Data: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the How Much Do AI Labs Pay for Data team sees it. Consent means the person has read and agreed to: \"I agree that the person running this AI data pay site may read my answers and reply to me by email.\" (with form, that guide's own consent line, which enquiry_fields returns)",
