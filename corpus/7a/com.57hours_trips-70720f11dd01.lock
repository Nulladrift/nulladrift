      },
      "instructions": "57hours (57hours.com) is a marketplace for guided outdoor trips: hiking, backcountry and resort skiing, mountaineering, climbing, cycling and mountain biking, sailing, surfing, kayaking and more, run by local guides around the world. These tools return its live trips, open departure dates, spots left and prices.\n\nTOOLS\n- search_trips returns trips that can be booked now. `query` takes plain keywords (\"volcanoes\", \"hut to hut\", \"northern lights\"); the other parameters filter by activity, country, dates, skill level, budget and group size. list_facets returns the activity and country names on offer.\n- get_trip returns one trip's description, highlights, guides and next open dates, by tripId or by a 57hours.com trip link.\n- list_departures returns all open dates of one trip, page by page.\n\nBOOKING\n- The tools don't book or take payment; booking and payment happen on 57hours.com.\n- A departure's `bookingUrl` opens 57hours.com checkout with that option, date and party size (from `group_size`) already selected. A trip's `url` is its page on 57hours.com, which lists every option and date.\n\nPRICES\n- `price` is the listing price in the trip's own currency, per person unless `perPerson` is false (then it is for the whole group). It is a \"from\" price: optional add-ons and fees are extra, and the final price is shown at checkout.\n- `approx`, returned when `currency` is passed, is the price converted at the rate 57hours.com checkout uses today, so it is approximate.\n\nDATES\n- An early-bird departure (`isEarlyBird`) is a deposit for a trip in that MONTH at an early price, not a trip lasting the whole month. The exact dates are arranged after booking.\n- `spotsLeft` is the number of places still open. When it is absent, the departure has no fixed limit.",
      "tools": [
        {
          "name": "get_trip",
          "title": "Get a 57hours trip",
          "description": "One trip in detail: description, highlights, location, length, skill\nlevel, rating, guides and its next open departures with spots and prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Also show prices converted to this currency (approximate)."
              },
              "departures_limit": {
                "default": 10,
                "description": "How many upcoming open dates to include.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "group_size": {
                "anyOf": [
                  {
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
