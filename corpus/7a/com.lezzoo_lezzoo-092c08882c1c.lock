        {
          "name": "place_order",
          "title": "Place order",
          "description": "Place the order from the current cart. Call review_order first so the customer can confirm the total. Set confirm:true to actually place the order — without it, this returns a preview only. Requires sign-in and a non-empty cart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addressId": {
                "description": "Address ID to deliver to. Defaults to your first saved address.",
                "type": "integer"
              },
              "confirm": {
                "description": "Must be true to place the order. If false, returns a preview (same as review_order).",
                "type": "boolean"
              },
              "confirmActiveOrder": {
                "description": "Set true to place even though you have an active order — only after the user acknowledges.",
                "type": "boolean"
