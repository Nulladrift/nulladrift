        {
          "name": "search_merchant_products",
          "title": "Show a merchant's menu / products",
          "description": "Show the menu for a merchant/restaurant by merchant_id (from a `search` result). The result includes the menu's `categories` (sections); pass a `categoryId` to browse that section's items (paged via `page`, with `has_more`). Omit both to show the top items; provide `query` to search within the menu. Renders as cards with category tabs and Prev/Next when the host supports MCP Apps. Results are paginated — a single response is only part of the menu. To locate a specific item, call this with `query=\"<item name>\"`, which searches the entire menu across pages and sections (more reliable than paging for finding a named item).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categoryId": {
                "description": "Menu section id (from the result's `categories`) to browse.",
                "type": "integer"
              },
              "city": {
                "description": "City scope. Defaults server-side.",
                "enum": ["Erbil", "Duhok", "Sulaymaniyah", "Zakho", "Kirkuk", "Baghdad", "Massif", "Shaqlawa", "Akre", "Koye", "Soran", "Halabja", "Said_Sadq", "Khanaqin", "Sharazwr", "Kalar"],
                "type": "string"
              },
              "language": {
                "description": "Result language: en, ar, kr, bd.",
                "enum": ["en", "ar", "kr", "bd"],
                "type": "string"
              },
              "merchantId": {
                "description": "Merchant id, e.g. from a `search` result's merchant_id.",
                "type": "integer"
              },
              "page": {
                "description": "1-based page within the category (default 1).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional search term within this merchant; omit for the menu.",
                "type": "string"
              }
            },
            "required": ["merchantId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Menu sections (id, name).",
