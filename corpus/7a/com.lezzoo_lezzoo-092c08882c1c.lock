        {
          "name": "search",
          "title": "Search restaurants & products",
          "description": "Search Lezzoo for restaurants/stores near a location. Results are ranked by relevance and proximity, so location matters: pass the user's latitude/longitude when known. If location is unknown, the user's area/address can be used to derive it; otherwise a configured default location applies. Returns restaurants as cards (when the host supports MCP Apps). Use a returned merchant's `merchant_id` with `search_merchant_products` to open its menu. Anonymous — no sign-in or account is required. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City to scope results. Defaults server-side.",
                "enum": ["Erbil", "Duhok", "Sulaymaniyah", "Zakho", "Kirkuk", "Baghdad", "Massif", "Shaqlawa", "Akre", "Koye", "Soran", "Halabja", "Said_Sadq", "Khanaqin", "Sharazwr", "Kalar"],
                "type": "string"
              },
              "departmentId": {
                "description": "Optional department id to scope to one vertical (e.g. Food, Grocery, Pharmacy).",
                "type": "integer"
              },
              "language": {
                "description": "Result language: en, ar, kr, bd.",
                "enum": ["en", "ar", "kr", "bd"],
                "type": "string"
              },
              "latitude": {
                "description": "User latitude (-90..90). Ask the user if unknown; falls back to the server default.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "User longitude (-180..180). Falls back to the server default.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "page": {
                "description": "1-based result page (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search term, e.g. 'burger', 'pharmacy', 'pizza'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "merchants": {
