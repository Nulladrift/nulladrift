      "serverInfo": {
        "name": "lezzoo-mcp",
        "title": "Lezzoo",
        "version": "0.15.0",
        "description": "Lezzoo food delivery — search nearby restaurants and stores, browse menus, and build a cart (all anonymous). After a phone sign-in you can place orders with digital payment (Lezzoo Pay wallet, card, FIB and more), and view your profile, addresses and orders with live delivery tracking.",
        "websiteUrl": "https://lezzoo.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Browsing is fully ANONYMOUS and NEVER requires sign-in: `search`, `search_merchant_products`, `get_product_details`, `get_full_menu`, `get_top_searches`. If you don't know the user's location for `search`, just ASK for their area/address (do NOT ask them to sign in for that). Use `search` to find restaurants/stores near a location, then `search_merchant_products` with a returned `merchant_id` to show that merchant's menu; prefer `get_full_menu` to fetch the whole menu at once over paging. Use `get_product_details` with a `product_id` for an item's image/description/price/addon options. Cart: browsing is anonymous, but ADDING to the cart (`add_to_cart` with option_value_ids from a product's options, plus `update_cart_item`, `remove_cart_item`, `clear_cart`) requires sign-in — the host prompts the user on the first add. `view_cart` is anonymous. One merchant per cart, no order placed. Checkout: when the user wants to check out, call `review_order` IMMEDIATELY with NO arguments — it renders a widget where the user picks their DELIVERY ADDRESS and PAYMENT METHOD as tappable options. Do NOT ask for, or list, the address or payment method in chat — the widget shows them as options and the user picks there. NEVER offer or mention cash on delivery — only digital methods are supported (Lezzoo Pay wallet, FIB, Card, Asia Pay, FastPay, Qi Card, NassWallet), all chosen in the widget. After the user confirms in the widget, call `place_order` with `confirm:true` and the chosen `paymentTypeId` (+ `addressId` if known). Online methods return a `payment_url` to open in the browser; `get_payment_link` regenerates it. `get_wallet_balance` shows the balance. Account data (`get_profile`, `get_addresses`, `get_order_history`, `track_order`) and checkout require a signed-in customer. Just call the relevant tool — if the user is NOT signed in, the HOST will prompt them to sign in (OAuth) and then the call proceeds. Do NOT ask for a phone number or OTP code, and do not look for a request_otp/verify_otp tool — there is none here; sign-in is handled by the host and persists across sessions.",
      "tools": [
        {
          "name": "add_to_cart",
          "title": "Add to cart",
          "description": "Add one or more products to the cart in a single call (put a whole request's items in one call). For several of the SAME item use `quantity` (e.g. \"2 Chili Boxes\" → quantity: 2). For DIFFERENT products use `items` (an array of { productId, quantity?, optionValueIds? }), each with its own `quantity`. For a single product, pass `productId`/`quantity`/`optionValueIds` directly. product_id comes from search_merchant_products/get_product_details; optionValueIds are addon/size value ids from the product's options. One merchant per cart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Add multiple items in one call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "optionValueIds": {
                      "description": "Selected option value ids (size/extras).",
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "productId": {
                      "description": "Product id to add.",
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "Quantity (default 1).",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["productId"],
                  "type": "object"
                },
                "type": "array"
              },
              "language": {
                "description": "Language for item names (en, ar, kr, bd).",
                "enum": ["en", "ar", "kr", "bd"],
                "type": "string"
              },
              "optionValueIds": {
                "description": "Option value ids for the single product.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "productId": {
                "description": "Single product id to add (when not using `items`).",
                "type": "integer"
              },
              "quantity": {
                "description": "Quantity for the single product (default 1).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "item_count": {
                "type": "number"
              },
              "items": {
                "description": "Cart line items (line_id, product_id, name, quantity, prices, options).",
                "items": {},
                "type": "array"
              },
              "merchant_city": {
                "type": "string"
              },
              "merchant_id": {
                "type": "number"
              },
              "merchant_name": {
                "type": "string"
              },
              "message": {
                "description": "Present on an empty cart.",
                "type": "string"
              },
              "subtotal": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add to cart"
