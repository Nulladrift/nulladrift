          "description": "Funding rate history of one coin on one exchange (default Hyperliquid; or Bybit, dYdX, Gate, Kraken, Deribit, OKX), up to 30 days: every past funding print with interval, 8h rate and APR, plus avg/min/max/% positive and the window covered. Historical perpetual swap funding for backtests and carry studies on BTC, ETH, SOL and more. Data only. Bad input is free; a venue that fails is not charged. Price: $0.003 per successful call, paid over x402 (USDC on Base); pass the payment in _meta[\"x402/payment\"].",
