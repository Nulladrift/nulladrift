      "instructions": "Crypto derivatives data for agents: perp funding rates, open interest, futures basis, implied volatility, liquidations and order book depth across 8 exchanges. tools/list is free; each tools/call costs $0.003-$0.005 in USDC on Base, paid with x402 v2. Call a tool without payment to get its PaymentRequired, then repeat the call with the signed payment in _meta[\"x402/payment\"] (any x402 MCP client such as @x402/mcp does this); bad arguments are answered free.",
      "tools": [
        {
          "name": "derivatives_snapshot",
          "title": "Crypto derivatives snapshot (one coin, one call)",
          "description": "Crypto derivatives snapshot of one coin in one call: perp funding rates per exchange with predicted funding, open interest (OI) per venue, perp premium and the nearest futures basis, 24h liquidations and the long/short ratio. Venues: Bybit, Hyperliquid, dYdX, Gate, Kraken, Bitfinex, Deribit, OKX. The derivatives data bundle for trading agents on BTC, ETH, SOL and more. Data only. Bad input is free; under 3 venues not charged. Price: $0.005 per successful call, paid over x402 (USDC on Base); pass the payment in _meta[\"x402/payment\"].",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "Coin symbol: BTC, ETH, SOL, PEPE ... (also BTCUSDT, BTC-PERP, XBT, 1000PEPE, kPEPE).",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["coin"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
