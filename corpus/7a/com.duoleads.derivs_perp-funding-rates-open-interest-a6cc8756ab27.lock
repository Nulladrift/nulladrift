                "minimum": 0,
                "type": "number"
              },
              "holding_days": {
                "description": "Holding period used to amortise fees in net_apr_pct. Default 30.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Opportunities returned, 1-100. Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_apr": {
                "description": "Minimum gross spread in APR percent. Default 10.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "min_volume_usd": {
                "description": "Both legs need at least this 24 h volume (USD). Default 0.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
