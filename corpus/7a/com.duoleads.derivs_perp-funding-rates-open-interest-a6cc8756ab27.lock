        },
        {
          "name": "funding_arbitrage_scan",
          "title": "Funding arbitrage scanner (all coins)",
          "description": "Funding arbitrage scanner across 8 exchanges (Bybit, Hyperliquid, dYdX, Gate, Kraken, Bitfinex, Deribit, OKX): for every coin the widest cross-venue perp funding spread, the long and short venue, both funding rates, gross and fee-adjusted net APR and breakeven days, with a 24h volume liquidity filter. Funding rate arbitrage, basis trade and carry screening of perpetual swaps. Data only, no advice. Bad input is free; under 3 venues not charged. Empty filter results are still charged. Price: $0.005 per successful call, paid over x402 (USDC on Base); pass the payment in _meta[\"x402/payment\"].",
