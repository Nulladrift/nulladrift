      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hypnotic-patterns",
        "title": "Learn Python with Hypnotic Patterns",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hypnotic Patterns teaches Python with glowing math animations: each lesson builds one pattern (the golden angle of a sunflower, the Galton board, the chaos game, Turing patterns, three-body orbits…) in a short numpy and matplotlib script, line by line. Good when someone wants to learn or teach Python, numpy or matplotlib through a small visual project, or asks about the math of one of these patterns. learning_path gives the course in order, get_lesson a lesson step by step (exercises and quiz without their answers), get_code the script, check_answer checks a quiz answer or gives an exercise’s hint and reference answer, explain_concept finds an idea in the lessons. Every answer links the lesson and its video; English or Polish (lang \"pl\"), the patterns and lessons also in Spanish, Portuguese, French and German. The prompt \"tutor\" teaches one lesson the way the site does: a question first, then a hint, the code last.",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check an answer",
          "description": "For a quiz question of a lesson: says whether the answer is right, which option is, and why. For an exercise: gives its hint and its reference answer to compare the learner’s attempt with (this server does not grade free text and never runs code); offer the hint first and the reference only after a try.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The learner’s answer: for the quiz the option’s text or its number (1 to 3); for an exercise optional",
                "maxLength": 2000,
                "type": "string"
              },
              "kind": {
                "description": "A quiz question or an exercise",
                "enum": ["quiz", "exercise"],
                "type": "string"
              },
              "lang": {
                "description": "The language of the answer: en (the default), pl; es, pt, fr, de, ja and ko for patterns and lessons (the course stays in English there)",
                "enum": ["en", "pl", "es", "pt", "fr", "de", "ja", "ko"],
                "type": "string"
              },
              "number": {
                "description": "Its number in the lesson, from 1",
                "minimum": 1,
                "type": "integer"
              },
              "pattern": {
                "description": "The pattern (its slug), as list_patterns gives it",
                "enum": ["golden-angle", "galton-board", "times-table", "chaos-game", "pendulum-wave", "turing-patterns", "sorting-race", "three-body-orbits", "spinning-ring"],
                "type": "string"
              }
            },
            "required": ["kind", "number", "pattern"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d70a61fffec2c1df62dfaa3df438ddc2c94aea62298678605e31633074c383e0"
        },
        {
          "name": "explain_concept",
          "title": "Explain a concept from the lessons",
          "description": "Finds a Python or math idea in the lessons (e.g. \"np.roll\", \"recursion\", \"golden ratio\", \"binomial\", \"leapfrog\", \"attractor\") and gives what the lessons say about it, with the lesson and video that show it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "concept": {
                "description": "The idea to look up",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "lang": {
                "description": "The language of the answer: en (the default), pl; es, pt, fr, de, ja and ko for patterns and lessons (the course stays in English there)",
                "enum": ["en", "pl", "es", "pt", "fr", "de", "ja", "ko"],
                "type": "string"
              }
            },
            "required": ["concept"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36cbf304dde2cfebdea2d6ca21bc1870d0bde6d4e30f0c2dd3d6f518e6f4a8fb"
        },
        {
          "name": "get_code",
          "title": "The Python script of a pattern",
          "description": "The whole Python script of a pattern (numpy and matplotlib, under 80 lines), as the lesson and the site show it and as the site’s tests run it, with how to run it, what to change to see something new, and a Google Colab notebook to run it in a browser.",
          "inputSchema": {
