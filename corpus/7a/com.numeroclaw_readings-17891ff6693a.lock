{
  "lockfileVersion": 2,
  "subjects": {
    "com.numeroclaw/readings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.numeroclaw.com/mcp/connect"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "numeroclaw",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "NumeroClaw writes personalized English numerology readings (Theme, Name Analysis and Birthday Portrait) for adults, for themselves or as a gift; a reading is for reflection and is not a prediction or advice. Readings are bought one at a time with no account, checked on a NumeroClaw page, paid on a secure checkout page, and delivered by email as a private link with a PDF. This app creates reading orders and reports their status; it holds no account data.",
      "tools": [
        {
          "name": "create_order",
          "title": "Create a NumeroClaw reading order",
          "description": "Creates an unpaid order for one NumeroClaw reading and returns a link to a NumeroClaw page where the person checks the order and pays. It is for when the person has seen and confirmed the product, the price, the email address and the details below. Creating the order charges nothing, and an unpaid order expires after 24 hours. Payment is taken at purchase and the reading is written afterwards. It is emailed to the address given: usually within a few hours and always within 6 hours. Readings are written for adults, so this is not for a reading about a child. One order covers one reading for one person, so a second order for the same person and reading is a second purchase. If a paid reading has not arrived in that time, the person can write to hello@numeroclaw.com with the order id. Inputs by product. theme: firstNames and lastNames exactly as on the birth record (middleNames optional), dateOfBirth and subjectGender. birthday_portrait: dateOfBirth, and optionally firstName to address the reading to. name_analysis: the birth name (firstNames, lastNames, middleNames optional) and no dateOfBirth; if the person uses a different name today, it goes in currentFirstNames, currentLastNames and currentMiddleNames, with currentNameContexts and currentNameScope. Every product needs email. Dates are YYYY-MM-DD. Names with the letter Y need yClassifications, one value per Y anywhere in the name, including at the end of a name, in reading order: first names, then middle names, then last names, and for name_analysis the birth name before the current name. A Y is a vowel sound when it sounds like the Y in Amy or Kelly, and a consonant sound when it starts a syllable and sounds like the Y in yes, as in Yolanda. The sound decides, not the position: Yvonne is said ee-von, so its Y is a vowel sound, and \"Yolanda Kelly\" gives [\"consonant\", \"vowel\"]. Each Y is worked out from how the name sounds and confirmed by the person in plain words, because most people cannot say whether a Y is a vowel or a consonant without an example. The classification changes the numbers in the reading. Returns orderId and orderToken (a private value that is the only key to the order), product, amount, currency, paymentLink, expiresAt and charged: false. During a sale, amount is the sale price and priceNote says until when. Invalid details return a list of issues and create no order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currentFirstNames": {
                "description": "name_analysis (optional): first names of the name used today, when it differs from the birth name.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "currentLastNames": {
                "description": "name_analysis (optional): surnames of the name used today.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "currentMiddleNames": {
                "description": "name_analysis (optional): middle names of the name used today.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "currentNameContexts": {
                "description": "name_analysis, with a current name: where that name is used.",
                "items": {
                  "enum": ["professional", "social", "legal", "household", "other"],
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "currentNameScope": {
                "description": "name_analysis, with a current name: how much it is used.",
                "enum": ["primary", "frequent", "context-specific", "occasional"],
                "type": "string"
              },
              "currentNameUsedSinceYear": {
                "description": "name_analysis (optional): the year the current name came into use.",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "dateOfBirth": {
                "description": "Date of birth as YYYY-MM-DD. Required for theme and birthday_portrait; not used by name_analysis.",
                "type": "string"
              },
              "email": {
                "description": "The buyer's own email address, also for a gift. The payment confirmation and the private reading link are sent there.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "firstName": {
                "description": "birthday_portrait (optional): the name the reading is addressed to.",
                "maxLength": 80,
                "type": "string"
              },
              "firstNames": {
                "description": "theme and name_analysis: every birth first name, in order.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "lastNames": {
                "description": "theme and name_analysis: every birth surname.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "middleNames": {
                "description": "theme and name_analysis (optional): any additional birth names.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "openingNote": {
                "description": "Optional short personal note, up to 280 characters, printed at the start of the reading. It never changes the interpretation.",
                "maxLength": 280,
                "type": "string"
              },
              "product": {
                "description": "Which reading to buy: \"theme\", \"birthday_portrait\" or \"name_analysis\".",
                "enum": ["theme", "birthday_portrait", "name_analysis"],
                "type": "string"
              },
              "subjectGender": {
                "description": "theme only, where it is required: \"female\" or \"male\". Sets only the grammatical agreement in the written reading and changes no number.",
                "enum": ["female", "male"],
                "type": "string"
              },
              "yClassifications": {
                "description": "theme and name_analysis: one \"vowel\" or \"consonant\" per letter Y in the name, in reading order, confirmed by the person. Omitted when the name has no Y.",
                "items": {
                  "enum": ["vowel", "consonant"],
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "required": ["email", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a NumeroClaw reading order"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:108974a28275a5cb36aeaf816a86069479b81c35e2179d7843987e374db6c22e"
        },
        {
          "name": "get_order",
          "title": "Get a NumeroClaw order",
          "description": "Returns the status of a NumeroClaw reading order. Use it when the person asks whether their order is paid or their reading is ready. Inputs: orderId and orderToken, both returned when the order is created. Returns the status (awaiting_payment, expired, paid, queued, processing, completed or failed), the amount, the payment link while the order is unpaid, how long it usually takes while it is being written, and a short message for the person. The reading itself is sent only by email, to the address given with the order. A reading that is still being written has not failed: it is usually ready within a few hours and always within 6 hours. A failed status means the reading could not be produced and the payment will be refunded after a person at NumeroClaw reviews it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "orderId": {
                "description": "The order id returned when the order was created.",
                "type": "string"
              },
              "orderToken": {
                "description": "The private order token returned when the order was created.",
                "type": "string"
              }
            },
            "required": ["orderId", "orderToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a NumeroClaw order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c53c323b25aa6d63d2635eada2e0f3c7eeac743ba0a3e3b295784a06053b9c6c"
        },
        {
          "name": "list_products",
          "title": "List NumeroClaw readings",
          "description": "Lists the numerology readings available from NumeroClaw: Theme, Name Analysis and Birthday Portrait. Use it when someone asks which readings are available, what they cost, or what details a reading needs. Takes no input. Returns, for each reading, its product id (theme, name_analysis or birthday_portrait), name, description, price in US dollars and any running sale, delivery time, refund terms, links to read about it and to a complete sample where one exists, whether it can be ordered now, and the details it requires.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List NumeroClaw readings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8109f5edb6f1d9c57e43d57896cd53d0835ccb73958c67b0fdf7b1897696ba4"
        }
      ],
      "digest": "sha256:499ecf20c7792e7c84ec16195e51d68f67efbbde1789b1e9e1444f7841ad2b48"
    }
  }
