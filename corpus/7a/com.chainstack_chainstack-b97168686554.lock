        {
          "name": "get_doc_page",
          "title": "Get docs page",
          "description": "Get the full content of a Chainstack documentation page.\n\nUse after search_docs to fetch the complete page when a snippet isn't enough.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "Page path from search results — pass the `page` field from\n  a search_docs result (e.g., \"docs/ethereum-tooling\").\n  The leading slash, the `.mdx` extension, and the\n  docs.chainstack.com URL prefix are all optional and stripped\n  if present.",
