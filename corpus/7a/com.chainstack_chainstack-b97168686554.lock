      "instructions": "Chainstack MCP server — deploy and manage blockchain nodes, search protocol docs and RPC references, check platform status, get pricing, request testnet funds, and contact the Chainstack team.\n\nKey behaviors:\n- If the user needs a node, DEPLOY IT with create_node. Never send them to the console — they're using MCP to stay in their IDE.\n- For a protocol's features or RPC methods, SEARCH DOCS first.\n- Not in the API but self-serve at https://console.chainstack.com: warp transactions, Solana Geyser, MEV protection, and the unlimited node add-on.\n- request_testnet_funds tops an address up to the per-network cap; it doesn't send a fixed amount.\n- For custom node configuration (gas caps, txpool, tracers, private networking, anything else), offer a contact_chainstack request.\n- For pricing (plan fit, overage math, dedicated nodes, add-ons), call get_chainstack_pricing and do the arithmetic from it; don't quote prices from memory.\n- To migrate from QuickNode, Alchemy, or another provider, follow get_doc_page('docs/migrate-to-chainstack-with-ai').\n- Node access rules (IP and Origin allowlists, Global nodes only) do nothing until activated. Active IP and Origin rules are both enforced: a request must pass each, or it gets 403. Before activating, confirm the IP rules cover every client. Origin rules block servers and scripts (no Origin header), even from allowed IPs.\n\nAuthentication:\n- search_docs, get_doc_page, get_platform_status, contact_chainstack, and get_chainstack_pricing need no API key. Other tools need a Chainstack API key as Authorization: Bearer <key> in the MCP client config.\n- On a 401, explain instead of dumping the error: no key is set yet (node management needs a free key), or the key is invalid or expired. Point to https://console.chainstack.com/user/settings/api-keys. Never ask the user to paste the key into the chat.\n\nNode tiers:\n- Global (CC-0016): load-balanced, instant, all plans. Deploy these.\n- Trader: regional nodes; don't deploy new ones.\n- Dedicated: ordered from Chainstack, not via the API.",
      "tools": [
        {
          "name": "contact_chainstack",
          "title": "Contact Chainstack",
          "description": "Submit a message to Chainstack's sales and support team.\n\nUse when the user wants to ask about pricing, get a custom quote,\nrequest a plan upgrade, request node customizations (Enterprise),\nreport a problem, or reach Chainstack for any reason. Posts to the\nsame contact form as chainstack.com/contact/.\n\n## Before calling this tool\n\nCRITICAL — follow these steps EVERY time:\n\n1. Draft the message based on your conversation context.\n2. Show the user the EXACT message, email, and name you will send.\n3. If the user has a Chainstack API key configured, tell them their\n   org name and ID will be included so the team can find their\n   account and reply faster.\n4. Ask: \"Shall I send this to Chainstack? Please confirm there's\n   no sensitive information you'd like removed.\"\n5. Only call this tool after the user explicitly confirms.\n\nNEVER include in the message:\n- API keys, tokens, passwords, private keys, wallet seeds, mnemonics\n- RPC endpoint URLs (Chainstack or any other provider)\n- Wallet addresses, transaction hashes, on-chain account details, or\n  anything else the user hasn't explicitly approved sharing\n\n## Writing an effective message\n\nInclude what you know: what they're building and at what scale,\ncurrent plan and usage, what they need, what they've tried, and\nspecific numbers.\n\nBad:  \"I have a question about pricing.\"\nGood: \"Pro plan user running 200M RU/month across Base and Ethereum,\n       evaluating Business plan for archive access and higher RPS.\n       Looking for annual pricing or a trial.\"\n\nNot for incidents or urgent outages — point users to\nhttps://support.chainstack.com/hc/en-us/requests/new and\nhttps://status.chainstack.com. Not for feature requests — point\nusers to https://ideas.chainstack.com (product) or\nhttps://github.com/chainstacklabs/mcp-server/issues/new (MCP server).\n\nWorks with or without an API key; with one, the org info is attached.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "default": "general",
                "description": "Routing hint. One of:\n- sales — pricing, quotes, plan upgrades, custom terms.\n- support — errors, bugs, how-to, \"something isn't working\".\n- general — everything else.\nCase-insensitive. Unknown values fall back to \"general\".\nDefault: \"general\".",
                "type": "string"
              },
              "email": {
                "description": "User's contact email. Required. Ask the user if you don't\nalready have it.",
                "type": "string"
              },
              "message": {
                "description": "The full message to send. Compose from\nconversation context — what the user is building, their plan\nand usage, what they need — so the Chainstack team can respond\nwith a tailored answer instead of a generic one.",
                "type": "string"
              },
              "name": {
                "description": "User's name (full name is fine, will be split on first space).\nRequired. Ask the user if you don't have it on hand.",
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
