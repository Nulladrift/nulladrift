        {
          "name": "request_testnet_funds",
          "title": "Request testnet funds",
          "description": "Top up a testnet address from Chainstack's faucet.\n\nThe faucet does not send a fixed amount — it tops the address up to the\nper-network maximum (e.g. 0.5 ETH for sepolia). If the address already\nsits above the cap, the call fails with an insufficient-balance error.\nDescribe the behavior to the user as \"top up\" not \"give\", and surface\nthe returned `amountSent` so they see the actual delta.\n\nOne top-up per network every 24 hours: a repeat call for the same network\nis refused (429) if the same organization or the same address got funds\nthere in the last 24 hours, and the error says when the next top-up is\navailable. Other networks have separate cooldowns. A success is final even\nif the balance hasn't updated yet; track the returned `transaction`\ninstead of calling again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Destination address. EVM hex address for EVM networks,\na TON address for `ton`, or a base58 Solana public key for\n`solana`. Validated server-side — format errors surface as 400.",
                "type": "string"
              },
              "network": {
                "description": "Testnet to fund. Must be one of the canonical ids in `enum`. Common aliases (ethereum-sepolia, base-sepolia, solana-devnet, ...) are accepted and normalized to the canonical id.",
                "enum": ["sepolia", "hoodi", "base", "amoy", "bnb-testnet", "zksync-testnet", "robinhood", "hyperevm", "plasma", "monad", "ton", "solana"],
                "examples": ["sepolia", "base", "solana"],
                "type": "string"
              }
            },
            "required": ["address", "network"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amountSent": {
                "type": "string"
              },
              "network": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "transaction": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request testnet funds"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
