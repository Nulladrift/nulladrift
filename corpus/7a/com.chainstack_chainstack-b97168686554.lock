        {
          "name": "set_node_access_rules_status",
          "title": "Activate or deactivate all node access rules",
          "description": "Activate or deactivate every access rule on a node at once.\n\nActivating enforces every rule within about 10 seconds: active IP rules\nlimit which IPs can call the node, active origin rules limit which Origin\nheaders it accepts, and a request must pass both kinds. Others get HTTP\n403. First confirm with the user that the IP rules cover every IP that\ncalls the node (servers, CI, their own machine); you can't check this.\nOrigin rules block every request without an Origin header (servers,\nscripts, curl), even from an allowed IP. Deactivating opens the node to\nany IP and origin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "node_id": {
                "description": "Node ID (e.g., ND-123-456-789).",
                "type": "string"
              },
              "status": {
                "description": "activated or deactivated.",
                "enum": ["activated", "deactivated"],
                "type": "string"
              }
