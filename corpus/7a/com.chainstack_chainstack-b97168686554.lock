        {
          "name": "get_chainstack_pricing",
          "title": "Get Chainstack pricing",
          "description": "Fetch Chainstack's public pricing and return a normalized snapshot.\n\nUse this to answer pricing questions before quoting the user: plan fit,\noverage math, per-chain dedicated-node costs, and add-on pricing\n(Unlimited Node flat-fee tiers, Yellowstone gRPC streams, Warp\ntransactions, dedicated-node base rates).\n\nThis tool returns the menu, not the bill — the calling agent does the\narithmetic. All prices are list prices in USD; disclaimers are surfaced\nin the `disclaimers` field.\n\nPer-method RU billing rules are NOT in these sources. Plan-level rates\n(Full Node = 1 RU, Archive Node = 2 RU) are in the markdown, but some\nEVM archive-state methods (eth_getBalance, eth_call, eth_getProof,\neth_getStorageAt, eth_getCode, eth_getTransactionCount, eth_callMany,\neth_createAccessList) and all debug_* / trace_* methods are billed at\n2 RU on a full node when called against old blocks. For method-level\ndetail, call `search_docs` with \"request units\" or\n`get_doc_page(\"docs/request-units\")`.\n\nNo API key required — sources are fully public. Each call fetches both\nsources fresh (no caching), so a stale result isn't possible.\n\nReturns:\n    A dict with fields:\n    - `pricing_markdown`: raw markdown from chainstack.com/pricing.md.\n      Read this for plan tiers, feature matrix, add-on pricing, support\n      levels, PAYG details, and provider comparisons.\n    - `dedicated_catalog`: user-orderable per-chain dedicated-node SKUs\n      with flavor, regions (as infra slugs like \"sgp1\"), hourly and\n      monthly prices in USD.\n    - `region_legend`: slug → city name for every region slug in\n      `dedicated_catalog`; use it for display.\n    - `disclaimers`: list-price caveats (Enterprise \"from\" pricing, etc.).\n    - `sources`, `warnings`: per-source status; warnings are set when a\n      source failed and the result is best-effort.\n    - `fetched_at`: UTC timestamp of this call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dedicated_catalog": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "disclaimers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fetched_at": {
                "type": "string"
              },
              "pricing_markdown": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "region_legend": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sources": {
                "additionalProperties": true,
                "type": "object"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["dedicated_catalog", "disclaimers", "fetched_at", "pricing_markdown", "region_legend", "sources", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Chainstack pricing"
