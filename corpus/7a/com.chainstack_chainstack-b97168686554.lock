        {
          "name": "create_node_access_rule",
          "title": "Create node access rule",
          "description": "Add an IP or Origin allowlist rule to a Global node.\n\nNew rules are deactivated and do nothing until activated. Active IP rules\nlimit which client IPs can call the node; active origin rules limit which\nOrigin headers it accepts. With both kinds active, a request must pass\nboth. Everything else gets HTTP 403 within about 10 seconds. Rules don't\naffect the Chainstack API, so they can always be changed or deactivated\nwith these tools.\n\nBefore activating, confirm with the user that the IP rules cover every IP\nthat calls the node (servers, CI, their own machine); you can't check\nthis. Origin rules are for browser-only access: once one is active, every\nrequest without an Origin header (servers, scripts, curl) is blocked, even\nfrom an allowed IP.\n\nIf an identical rule exists, it is returned instead of a duplicate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activate": {
                "default": false,
                "description": "Also activate the rule. Only after the user confirms the\nallowlist.",
                "type": "boolean"
              },
              "node_id": {
                "description": "Node ID (e.g., ND-123-456-789).",
                "type": "string"
              },
              "rule_type": {
                "description": "ip or origin.",
                "enum": ["ip", "origin"],
                "type": "string"
              },
              "value": {
                "description": "For ip, one IPv4 or IPv6 address (no CIDR ranges). For origin,\na host name without scheme or path: example.com, *.example.com\n(the domain and its subdomains), or * (any origin). Up to 65\ncharacters.",
                "type": "string"
              }
            },
            "required": ["node_id", "rule_type", "value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "created": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "rule": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  },
                  "type": {
                    "type": "string"
                  },
                  "updated_at": {
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["id", "status", "type", "value"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["message", "rule"],
            "type": "object"
          },
