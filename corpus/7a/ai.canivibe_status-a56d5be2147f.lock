{
  "lockfileVersion": 2,
  "subjects": {
    "ai.canivibe/status": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canivibe.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "canivibe",
        "title": "Can I Vibe? AI provider status",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Live availability for AI coding providers. Use check_provider_health before work that depends on a provider; use ai_provider_status for details.",
      "tools": [
        {
          "name": "ai_provider_status",
          "description": "Get the live status of AI coding providers (Claude, OpenAI, Copilot, Cursor, OpenRouter and more). Returns status, how long each provider has been in its current state, and last check time. Pass service_id for one provider, omit it for all.",
          "inputSchema": {
            "properties": {
              "service_id": {
                "description": "Optional provider id, e.g. claude, openai, github_copilot, cursor, openrouter",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d7d5b5fc6ecdb09f17ef74fafd0fb07514030023d51b9a0934d0ae9531b96d3"
        },
        {
          "name": "check_provider_health",
          "description": "Check whether one or more AI coding providers are healthy enough to use right now. Returns healthy=true only when every requested provider is operational (or within the allowed statuses). Use this before starting work that depends on a provider, or to decide which provider to route to.",
          "inputSchema": {
            "properties": {
              "allow_degraded": {
                "description": "Treat degraded performance as healthy (default false)",
                "type": "boolean"
              },
              "services": {
                "description": "Provider ids to check, e.g. [\"claude\", \"openrouter\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["services"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8bf8504bd4b131503debc56b4c2c1f3d9e61564dbad655bc4767fb486817531b"
        }
      ],
      "digest": "sha256:f22b96b2c51a93bdd50b8ee8564681659d89930c8a0c6f207c0b41ca98189738"
    }
  }
}
