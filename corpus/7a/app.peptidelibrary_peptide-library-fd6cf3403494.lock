                        "type": "string"
                      },
                      "peptide_name": {
                        "type": "string"
                      },
                      "source_url": {
                        "type": "string"
                      }
                    },
                    "required": ["iu_per_mg", "peptide_id", "peptide_name", "source_url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "result": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "type": "string"
                      },
