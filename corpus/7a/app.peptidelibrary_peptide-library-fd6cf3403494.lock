        {
          "name": "cost_per_amount",
          "title": "Cost per amount",
          "description": "Price arithmetic for a purchase: total cost (price plus optional shipping) and cost per mg, per mcg and (with a peptide's documented factor) per IU. Uses only the numbers given; it never estimates prices or shipping and converts no currencies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount_per_package": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 32,
                    "type": "string"
                  }
                ],
                "description": "Amount in each vial or package. A number; \"2,5\" and \"2.5\" both work."
              },
              "amount_unit": {
                "description": "Unit of the amount per package (mg, mcg or IU).",
                "enum": ["mg", "mcg", "IU"],
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO currency code of the price (no conversion is done).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "package_count": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 32,
                    "type": "string"
                  }
                ],
                "description": "Number of vials or packages bought for that price. A number; \"2,5\" and \"2.5\" both work."
              },
              "peptide": {
                "description": "Optional: peptide whose documented IU factor to use for cost per IU.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\u0000-\\u001f\\u007f]*$",
                "type": "string"
              },
              "price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 32,
                    "type": "string"
                  }
                ],
                "description": "Price paid for the product, in major units (e.g. 49.99). A number; \"2,5\" and \"2.5\" both work."
              },
              "shipping": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 32,
                    "type": "string"
                  }
                ],
                "description": "Optional one-time shipping cost, same currency. A number; \"2,5\" and \"2.5\" both work."
              }
            },
            "required": ["amount_per_package", "amount_unit", "price"],
            "type": "object"
          },
