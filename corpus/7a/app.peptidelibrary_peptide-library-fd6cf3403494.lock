                            },
                            "type": "array"
                          },
                          "shared": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "status": {
                            "enum": ["same", "partial", "different", "not-comparable", "incomplete", "empty"],
                            "type": "string"
                          },
                          "values": {
                            "items": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "items": {
                                      "items": {
                                        "type": "string"
                                      },
                                      "type": "array"
                                    },
