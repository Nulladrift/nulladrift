        {
          "name": "convert_units",
          "title": "Convert peptide amount units",
          "description": "Convert an amount between mg and mcg exactly. IU ↔ mass conversion only works with a peptide whose profile documents an IU-per-mg factor (pass `peptide`); otherwise the result is an iu_factor_missing issue, never an assumed factor. Pure arithmetic: not a dosing recommendation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 32,
                    "type": "string"
                  }
                ],
                "description": "The amount to convert. A number; \"2,5\" and \"2.5\" both work."
              },
              "from": {
                "description": "Unit of the amount (mg, mcg or IU).",
                "enum": ["mg", "mcg", "IU"],
                "type": "string"
              },
              "peptide": {
                "description": "Peptide whose documented IU factor to use (only needed for IU).",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\u0000-\\u001f\\u007f]*$",
                "type": "string"
              },
              "to": {
                "description": "Unit to convert to (mg, mcg or IU).",
                "enum": ["mg", "mcg", "IU"],
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "input": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "type": "string"
                  },
                  "unit": {
                    "enum": ["mg", "mcg", "IU"],
                    "type": "string"
                  }
                },
                "required": ["amount", "unit"],
                "type": "object"
              },
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "field": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "message": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning", "info"],
                      "type": "string"
                    }
                  },
                  "required": ["code", "field", "message", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "iu_factor": {
                "anyOf": [
                  {
