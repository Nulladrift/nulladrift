                                    }
                                  },
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "type": "array"
                          }
                        },
                        "required": ["key", "label", "missing_label", "shared", "status", "values"],
                        "type": "object"
