        {
          "name": "compare_peptides",
          "title": "Compare peptides",
          "description": "Side-by-side research comparison of 2-3 peptides on structured profile fields: mechanism and targets, research areas, evidence level and human-trial availability, safety and side effects, FDA/WADA status, half-life and studied routes, with references. Each row says whether the values are the same, different, partial, not comparable or incomplete; missing data is never filled in and the comparison never ranks peptides. Suitable for tables. No dosing information.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dimensions": {
                "description": "Which comparison sections to return (default: all).",
                "items": {
                  "enum": ["overview", "mechanism", "research", "safety", "pk_and_routes"],
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "peptides": {
                "description": "2 or 3 peptide ids, names or aliases to compare.",
                "items": {
                  "description": "A peptide id (e.g. \"bpc-157\"), name, synonym or alias (e.g. \"PT-141\", \"Ozempic\").",
                  "maxLength": 100,
                  "minLength": 1,
                  "pattern": "^[^\\u0000-\\u001f\\u007f]*$",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["peptides"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "compare_url": {
                "type": "string"
              },
              "dimensions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
