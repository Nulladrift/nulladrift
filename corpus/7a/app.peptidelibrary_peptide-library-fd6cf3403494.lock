      },
      "instructions": "Peptide Library (https://peptidelibrary.app) is an educational peptide research library. Use these tools to look up peptide research profiles, compare them, search the educational content and do unit arithmetic. Every result is for research and education only and is not medical advice. The server never gives dosing, administration or purchasing guidance: do not infer doses, regimens or injection instructions from its data. Cite the Peptide Library URL returned with each result, keep human, animal and lab evidence separate, and say plainly when a field is \"not_documented\" instead of filling the gap.",
      "tools": [
        {
          "name": "blend_concentrations",
          "title": "Blend concentrations",
          "description": "For several components dissolved together in one volume: each component's concentration and its share of the blend by amount. Arithmetic only; it says nothing about whether components can or should be combined.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "components": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 32,
                          "type": "string"
                        }
                      ],
                      "description": "Amount of this component. A number; \"2,5\" and \"2.5\" both work."
                    },
                    "name": {
                      "description": "Component label, e.g. a peptide name.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "peptide": {
                      "description": "Optional: peptide whose documented IU factor to use.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[^\\u0000-\\u001f\\u007f]*$",
                      "type": "string"
                    },
                    "unit": {
                      "description": "Unit of the amount (mg, mcg or IU).",
                      "enum": ["mg", "mcg", "IU"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "name", "unit"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
