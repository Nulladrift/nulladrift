        {
          "name": "get_system",
          "title": "Sistema de automatización por sector",
          "description": "Devuelve el plano completo de un sistema de agentes de IA por sector (p. ej. restaurante, clinica-dental, inmobiliaria): agentes con disparador, herramientas, regla de aprobación humana y prompt, fases, KPIs y checklist en 3 pistas.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
