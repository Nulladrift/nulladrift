      },
      "serverInfo": {
        "name": "1vr-skill-store",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_skill",
          "description": "Look up the factual pre-install audit signals recorded for one skill: audit tier, when checked, and findings by category (permissions, network, credentials, suspicious patterns, dependencies). Facts only; this tool makes no judgement about any skill and certifies nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_id": {
                "description": "Numeric id of the skill, as returned by search_skills.",
                "type": "integer"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80e54205820eb3e7c3a8a075df79ade28cf1a3e8ab491e5d5db5f58d571e7fa9"
        },
        {
          "name": "get_install_info",
          "description": "Get ready-to-run install information for one skill: exact install text, source link, short description. If the request carries your 1VR agent API key (Authorization: Bearer), the fetch is also recorded in the store install log; without a key, public install info only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_id": {
                "description": "Numeric id of the skill, as returned by search_skills.",
                "type": "integer"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a0c572f4b862946c310e2714aed6c2c4884ba1e16c66425e4ddd9039413d766"
        },
        {
          "name": "search_skills",
          "description": "Search the 1VR Skill Store (3,000+ agent skills, each with factual pre-install audit signals) by task or keyword. Returns matching skills with install commands and audit summaries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "type": "string"
              },
              "lang": {
                "description": "Optional language filter.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Task, keyword or phrase to search for.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a6f7e0aa8d06f1c6c073cea77b561d564f767d0a649f384f2fe0e34d9d1c7122"
        }
      ],
      "digest": "sha256:654906f12f8ca7ad7e06dbda60a6ae3234f444e92a4530eea610f777ef6116ff"
    }
