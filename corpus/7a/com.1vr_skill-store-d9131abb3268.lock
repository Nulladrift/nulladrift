{
  "lockfileVersion": 2,
  "subjects": {
    "com.1vr/skill-store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://1vr.com/mcp/skill-store"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "1vr-skill-store",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_skill",
          "description": "Look up the factual pre-install audit signals recorded for one skill: audit tier, when checked, and findings by category (permissions, network, credentials, suspicious patterns, dependencies). Facts only; this tool makes no judgement about any skill and certifies nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_id": {
                "description": "Numeric id of the skill, as returned by search_skills.",
                "type": "integer"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80e54205820eb3e7c3a8a075df79ade28cf1a3e8ab491e5d5db5f58d571e7fa9"
        },
        {
          "name": "get_install_info",
          "description": "Get ready-to-run install information for one skill: exact install text, source link, short description. If the request carries your 1VR agent API key (Authorization: Bearer), the fetch is also recorded in the store install log; without a key, public install info only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_id": {
                "description": "Numeric id of the skill, as returned by search_skills.",
                "type": "integer"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a0c572f4b862946c310e2714aed6c2c4884ba1e16c66425e4ddd9039413d766"
        },
        {
          "name": "get_skill",
          "description": "Get one skill's full store record: complete description and install text, source link, plus the same audit fields check_skill returns (tier, check time, findings, rules version, latest tier flip). Facts only; this tool makes no judgement about any skill and certifies nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Exact skill name. Give either skill_id or name, not both.",
                "type": "string"
              },
              "skill_id": {
                "description": "Numeric id of the skill. Give either skill_id or name, not both.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9a1cd24b0de73192ac19b302271b4d60b7c61c254cd23254cc1178ce61f3aa14"
        },
        {
          "name": "search_skills",
          "description": "Search the 1VR Skill Store (82,000+ agent skills, each with factual pre-install audit signals) by task or keyword. Returns matching skills with install commands and audit summaries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "type": "string"
              },
              "lang": {
                "description": "Optional language filter.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Task, keyword or phrase to search for.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3e4a32f674c6380eb4a93351419bf93922d0c90800ce8475134f073644a6e658"
        },
        {
          "name": "skill_status_feed",
          "description": "List recorded tier changes from the store audit log, newest first: which skills had their recorded audit tier change, the old and new tier, and whether a source change was rechecked at the same timestamp. Groups more than ten changes that share one timestamp into a single bulk entry. Facts only; this tool makes no judgement about any skill and certifies nothing. Also lists recall notices: recorded cases where a skill's source changed and its recorded tier flipped or new high-risk audit signals appeared, marked with type recall.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of feed entries to return, counted after bulk aggregation.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11c53ccd870c503435127c89034b8414f5081b2467846403cd560d6263741a3c"
        },
        {
          "name": "top_skills",
          "description": "List the store's most-looked-up skills, ranked by recorded lookups: authenticated install fetches plus audit checks in the store API log (all-time counts, internal calls included). Each entry carries the skill's current audit tier and check time. Facts only; this tool makes no judgement about any skill and certifies nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter (exact match).",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of skills to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d8c30b182b9829cb409ee2b912d0b9c0f7c47a1c9e30da56b32bd05fed8fd59"
        }
      ],
      "digest": "sha256:804f60c127ff15ea490eb57816de6d603db965acb586c65db151b60b77493f9b"
    }
  }
}
