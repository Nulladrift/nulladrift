{
  "lockfileVersion": 2,
  "subjects": {
    "com.ogstamp/og": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ogstamp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ogstamp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OG Stamp hosts Open Graph PNGs. render_og_image and og_image_from_url require api_key (ogs_… from https://ogstamp.com/pricing/, credits never expire, one credit per image) and return https://ogstamp.com/i/{id}.png. They do not return a free hotlink. Call og_pricing for pack prices.",
      "tools": [
        {
          "name": "og_image_from_url",
          "description": "Build a hosted Open Graph card from a public page (title, description, favicon, theme-color) and return https://ogstamp.com/i/{id}.png. Requires api_key. One credit. Does not return a free hotlink.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "ogs_… key from https://ogstamp.com/pricing/. Required. One credit is spent.",
                "type": "string"
              },
              "font": {
                "enum": ["inter", "manrope", "playfair", "space", "dm", "lora", "mono", "figtree", "bitter"],
                "type": "string"
              },
              "layout": {
                "enum": ["classic", "center", "split", "minimal", "quote", "terminal"],
                "type": "string"
              },
              "size": {
                "enum": ["og", "square", "linkedin", "story", "wide"],
                "type": "string"
              },
              "theme": {
                "enum": ["midnight", "paper", "forest", "coral", "slate"],
                "type": "string"
              },
              "url": {
                "description": "HTTPS URL of the page to build a card for",
                "type": "string"
              }
            },
            "required": ["api_key", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de48f82daf379e3cef0e8509463cff463ca6c4bf0b7c52f9b771dd2d88566c22"
        },
        {
          "name": "og_pricing",
          "description": "Return OG Stamp credit packs. Credits never expire. PayPal one-time, not a subscription.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd3a5bad2d57e3d8abec4fbfaf716c3080da8ab2127e7374108625b272b2b702"
        },
        {
          "name": "render_og_image",
          "description": "Build a hosted Open Graph PNG and return a stable https://ogstamp.com/i/{id}.png URL for og:image. Requires api_key (ogs_… from https://ogstamp.com/pricing/). One credit per image. Does not return a free hotlink.",
          "inputSchema": {
            "properties": {
              "accent": {
                "description": "Accent bar / badge hex",
                "type": "string"
              },
              "api_key": {
                "description": "ogs_… key from https://ogstamp.com/pricing/. Required. One credit is spent.",
                "type": "string"
              },
              "badge": {
                "description": "Optional small label",
                "type": "string"
              },
              "bg": {
                "description": "Background hex, e.g. #0b1220",
                "type": "string"
              },
              "fg": {
                "description": "Text hex",
                "type": "string"
              },
              "font": {
                "description": "Typeface for brand fit",
                "enum": ["inter", "manrope", "playfair", "space", "dm", "lora", "mono", "figtree", "bitter"],
                "type": "string"
              },
              "layout": {
                "description": "Card composition",
                "enum": ["classic", "center", "split", "minimal", "quote", "terminal"],
                "type": "string"
              },
              "logo_url": {
                "description": "HTTPS URL of a square logo/PNG",
                "type": "string"
              },
              "site": {
                "description": "Small site/domain label on the card",
                "type": "string"
              },
              "size": {
                "description": "Output dimensions preset",
                "enum": ["og", "square", "linkedin", "story", "wide"],
                "type": "string"
              },
              "subtitle": {
                "description": "Optional second line",
                "type": "string"
              },
              "theme": {
                "description": "Base theme; override with bg/fg/accent hex",
                "enum": ["midnight", "paper", "forest", "coral", "slate"],
                "type": "string"
              },
              "title": {
                "description": "Main headline on the card",
                "type": "string"
              }
            },
            "required": ["api_key", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc7ed58a5dc084cd4790f2763342adb4e908e3598c5596900879b71094ac58d3"
        }
      ],
      "digest": "sha256:4dacf2e9866ed8f7b40c3b1f69ce79eb6d0c68cc4cce4835e5d315e0cf216bdd"
    }
  }
