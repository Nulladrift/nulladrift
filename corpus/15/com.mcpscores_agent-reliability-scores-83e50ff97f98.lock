      "serverInfo": {
        "name": "com.mcpscores/agent-reliability-scores",
        "title": "MCPFax Reliability",
        "version": "1.1.5",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "You are about to pay an endpoint you cannot vouch for, and a rotated payTo looks exactly like a compromised server from your side. TOOL CALLS ARE x402-PAID in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request (PAYMENT-SIGNATURE is accepted as an equivalent alias; send only one). An unpaid call answers with a valid x402 accepts array and settles nothing, and initialize, ping, tools/list and GET /health are free. Use this service before trusting or paying an unfamiliar endpoint, and use mcpfax_integration_drift before paying one you already integrated — a rotated payTo is indistinguishable from a compromised server from the caller's side. COVERAGE IS YOUNG AND STATED HONESTLY: GET /health publishes, free and unprompted, exactly how many subjects each paid route can answer today, so you can decide whether a call is worth making before you make it. Routes refuse with HTTP 422 and settle nothing rather than bill for an answer they cannot support; a refusal is not a failure and costs you nothing. Grades rank observed risk and are not calibrated failure probabilities, not validated over any forward horizon, and not a security audit.",
      "tools": [
        {
          "name": "mcpfax_endpoint_credit_score",
          "title": "Endpoint credit score",
          "description": "Creditworthiness grade for one x402 endpoint or MCP server: letter grade A-E (or NR when unrated), a 0-1000 score, per-component subscores, a confidence level, flags, and the dated evidence each figure rests on. Use this before trusting or paying an unfamiliar endpoint. The grade ranks observed risk; it is not a calibrated probability of failure, not validated over any forward horizon, and not a security audit. Coverage is young: the response carries archive_coverage (measured archive span), most listings grade NR, and payer-concentration risk is reported as \"not rated\" until a listing's own payment record clears the published coverage floor. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Observatory listing id. Use 'host:<hostname>' for an x402 endpoint, e.g. 'host:api.example.com', or 'mcp:<publisher>/<name>' for a registry-listed MCP server, e.g. 'mcp:acme/weather'.",
                "examples": ["host:api.example.com"],
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb17d24cdc0a8d1a2e412a5137b30c649a06459c26415d04fe17a79179ea05df"
        },
        {
          "name": "mcpfax_endpoint_revenue_estimate",
          "title": "Endpoint revenue estimate",
          "description": "Observed on-chain revenue signals for one listing: total USDC inflow, how many distinct payers, the modal transfer size, payment rate, 7- and 30-day trend windows, and where it sits in its cohort by percentile. Use this to size a seller's real traction. Inflow is observed on-chain and is not proven to be x402 sales revenue. Trend windows are only as wide as the wallet's real scanned span, which the response reports as trends.scanned_days with per-window backed-by-scan flags; a 30-day window is not yet backed by 30 days of scanning. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Observatory listing id. Use 'host:<hostname>' for an x402 endpoint, e.g. 'host:api.example.com', or 'mcp:<publisher>/<name>' for a registry-listed MCP server, e.g. 'mcp:acme/weather'.",
                "examples": ["host:api.example.com"],
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e324ac50fec88b4800c8ef22f92dec4b41f438a7b8cd12d0f776a29b7806b058"
        },
        {
          "name": "mcpfax_integration_drift",
          "title": "Integration drift",
          "description": "What changed under an x402 endpoint or MCP server you have ALREADY integrated: payTo rotations, price, asset and network changes, terms added or removed, and tool-schema changes. This is not a discovery tool and will not help you choose a server; it tells you whether the one you wired in still matches what you wired in. Pass up to 50 subjects and the `since` watermark returned by your last call, and you receive only what changed after it plus a fresh watermark, so repeat checks stay cheap. A subject with no changes is reported as observed-unchanged with the date that is true as of — that is a real answer and is billed. A subject MCPFax has never observed is named in `not_observed` and given NO verdict, because reporting \"no changes\" about something we never watched is indistinguishable from a genuine all-clear. The watermark is the last date MCPFax actually observed, never the current clock, so no window is skipped between sweeps. Coverage is young and every response carries its archive span. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "The watermark from your previous call (YYYY-MM-DD). Omit on a first call to receive the whole archive.",
                "examples": ["2026-08-28"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "subjects": {
                "description": "Comma-separated endpoint URLs or host identifiers to check, at most 50, e.g. 'https://x402.browserbase.com/browser/session/create,host:api.example.com'.",
                "examples": ["host:api.example.com"],
                "type": "string"
              }
            },
            "required": ["subjects"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4821242bbef2e5dcf09c5923e0eff590bd6cc56db3c2dabfb4833bdf744fbd1e"
        },
        {
          "name": "mcpfax_payer_wallet_profile",
          "title": "Payer wallet profile",
          "description": "Know-your-agent profile for a paying wallet: how many distinct services it pays, total observed spend, whether the address is a contract or an externally owned account, and coverage-gated screening signals. Use this to vet a counterparty that is paying you. Screening signals are withheld with status \"not_rated\" until the observed record for the address clears the published coverage floor (14 days, 20 payments); the measured graph facts are always returned and carry no inference about intent. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The paying EVM wallet address, 0x followed by 40 hex characters.",
                "examples": ["0x9a07CeA7ed111c93a233d1d12BbB68a511B59Eea"],
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:235453689db509add104cc2711cb69a49e289b4421d570e1637bf5740fbac77b"
        },
        {
          "name": "mcpfax_payto_change_feed",
          "title": "Rating action and payTo change feed",
          "description": "Chronological feed of rating actions since a date: grade upgrades and downgrades, payTo wallet changes (a seller redirecting payment), listing removals, and returns. Use this to monitor a portfolio of endpoints for adverse changes rather than re-scoring each one. The feed cannot return events from before the observatory archive started; the response reports coverage.archive_since, coverage.rating_actions_recorded, and whether the requested window predates the archive. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "Inclusive UTC start date in YYYY-MM-DD form, e.g. '2026-07-01'. Defaults to 30 days ago, but the feed cannot return events from before the archive start reported by GET /health; the response echoes effective_since and coverage.archive_since.",
                "examples": ["2026-08-01"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:703f1539c14b89de0ee83a7739e44a35628d3cf758e6ae177bb61f8235e79efb"
        },
        {
          "name": "mcpfax_preflight_check",
          "title": "Preflight an endpoint before a consequential call",
          "description": "Check that an endpoint is live and that its terms have not changed, BEFORE you send it an expensive request. A $15 call with a hypothetical 2% loss rate carries $0.30 of expected loss; a reachability check cannot promise to prevent it. Compare the quoted fee with the value of the pending call and the failures this check can actually detect. For a cheap $0.001 lookup, the $0.008 fee is eight times the call price. Returns two halves. LIVE: one unpaid bounded probe (~2.2s cap) giving reachability, HTTP status, latency, whether an MCP server still answers initialize, and the price and payTo it is serving right now. HISTORICAL: reliability over our OBSERVED window (stated in days, never implied), payTo changes, price changes, tool-schema changes, first-seen date, and credit grade or an honest not-rated. Supply expected_price, expected_payto or expected_schema_hash and each is compared with old to new and the date we first observed the change. The verdict is ALLOW, WARN or UNKNOWN and is ADVISORY: it reports evidence, it is not a warranty, an audit, or a promise your call will succeed. UNKNOWN is a real answer and is returned whenever the evidence does not support the other two. If we have never observed the target AND cannot reach it, you get UNKNOWN and are charged nothing. Otherwise $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_payto": {
                "description": "The payment destination you believe you are paying — an EVM address or a base58 Solana address. A mismatch is the strongest signal this tool produces.",
                "examples": ["0x1831f336585a6C67B6A954d28f3E07F44C4EEBbd"],
                "type": "string"
              },
              "expected_price": {
                "description": "What you believe the call costs. A decimal such as '0.01' is read as USD; a bare integer such as '10000' is read as atomic units.",
                "examples": ["0.01"],
                "type": "string"
              },
              "expected_schema_hash": {
                "description": "The schema hash a previous call to this tool returned in live.schema_hash. It covers tool names and input/output schemas, not titles or descriptions.",
                "examples": ["sha256:3b2d23d6e1a3b10024abd164368e5a1cd38c8400fca7bf10a84bab99eeeed8e0"],
                "type": "string"
              },
              "max_age_seconds": {
                "description": "Your freshness bar, default 300. A stored observation older than this is still reported but may not support an ALLOW verdict. A stored observation newer than this can stand in for the live half if the live probe does not finish in time, and is labelled as recorded rather than live.",
                "examples": [300],
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "probe_method": {
                "description": "HTTP method for the unpaid probe of a non-MCP endpoint, default GET. Only side-effect-free methods are accepted; this tool never sends a request that could change state at the target. A POST-only resource answers 404/405 here, which is reported as a property of the probe method.",
                "enum": ["GET", "HEAD", "OPTIONS"],
                "type": "string"
              },
              "target": {
                "description": "The endpoint you are about to call. Preferred form is the absolute https:// URL of the exact resource you will pay for, e.g. 'https://api.example.com/v1/search'. An observatory id also works: 'host:<hostname>' or 'mcp:<publisher>/<name>'.",
                "examples": ["https://api.example.com/v1/search"],
                "pattern": "^(?:https://[^\\s]+|host:[^\\s]+|mcp:[^\\s]+)$",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83a0249ad1c2934974d1b10e497550378a8a9f75c8060265abadae702051f2ec"
        },
        {
          "name": "mcpfax_wallet_authenticity",
          "title": "Wallet authenticity and wash-risk",
          "description": "Payer-concentration and wash-risk assessment for a receiving wallet: how concentrated its observed payers are, the measured coverage of that observation, an explicit wash-risk haircut ONLY when coverage is sufficient, how many listings declare the same address, and observed USDC inflow. Use this to judge whether a seller's apparent revenue reflects real independent demand. The haircut and the adjusted-inflow figure are withheld as null with status \"not_rated\" until the wallet's own record covers at least 14 days and 20 payments, because below that a thin payer count is a property of our observation window, not of the wallet. Concentration is not proof of common control. Costs $0.01 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "wallet": {
                "description": "The receiving EVM wallet address, 0x followed by 40 hex characters, e.g. '0x1831f336585a6C67B6A954d28f3E07F44C4EEBbd'.",
                "examples": ["0x1831f336585a6C67B6A954d28f3E07F44C4EEBbd"],
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d64da548515ebebec2c44801e53ebba838aac9be989fa8828740e713ea0a347"
        }
      ],
      "digest": "sha256:31aa810180f4d2c2579adc006680dd7ee40dcb1ff0196706d7cdbe8801b2f97a"
    }
  }
