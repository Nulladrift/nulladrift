{
  "lockfileVersion": 2,
  "subjects": {
    "ai.law.mcp/lawyer-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.law.ai/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "law-ai",
        "version": "0.2.0",
        "description": "Verified lawyer and attorney search, discovery, and matching for AI — 991K+ US profiles."
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_lawyer_by_name",
          "description": "Look up a lawyer by name to verify they exist and are licensed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Lawyer name to search",
                "type": "string"
              },
              "state": {
                "description": "US state to narrow results",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:876a1cc334f65aea8ce3f505fbc16fcb742c599b5c0545bf30000ef6dba41097"
        },
        {
          "name": "get_jurisdictions",
          "description": "List US states with lawyer counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eafa1d6d599c28ac762ae3636b93d3a933e32c578ea3ea68c80d669375031963"
        },
        {
          "name": "get_lawyer_profile",
          "description": "Get full profile for a specific lawyer by their Law.AI ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Lawyer ID from Law.AI",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79445636d113e3a569dee1028338fcb1596d191318f6ade0240d46adae83ec90"
        },
        {
          "name": "get_practice_areas",
          "description": "List all practice areas with lawyer counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c158493efaf73eb92f9d4188b4b81dd387fed8a3780ac242b014270af858ca36"
        },
        {
          "name": "search_lawyers",
          "description": "Search verified lawyer profiles by practice area, state, city, and bar status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bar_status": {
                "description": "\"Active\" (default), \"Inactive\", or \"Any\"",
                "type": "string"
              },
              "city": {
                "description": "City name",
                "type": "string"
              },
              "limit": {
                "description": "Results (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "description": "Pagination offset",
                "minimum": 0,
                "type": "number"
              },
              "practice_area": {
                "description": "Practice area, e.g. \"Criminal Defense\"",
                "type": "string"
              },
              "state": {
                "description": "US state (name or abbreviation)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acad06a51bb429f4e9c6ddbea23acca76d9dc6e1c558e5d8315e3af5d7a51512"
        }
      ],
      "digest": "sha256:e646d06b24a6f92cf334ca1a35b001fecf5d00fe07b113f91c6cfc9c5d991870"
    }
  }
}
