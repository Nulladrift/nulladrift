{
  "lockfileVersion": 2,
  "subjects": {
    "com.atlasipholdingsllc.app/atlas-data-exchange": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.atlasipholdingsllc.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "atlas-data-exchange",
        "title": "Atlas Data Exchange",
        "version": "2026-09-11.2",
        "description": "Measured, provenance-aware, multi-source infrastructure and hazard intelligence with explicit spatial confidence and machine-readable quality contracts.",
        "websiteUrl": "https://app.atlasipholdingsllc.com/intelligence"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Atlas sells manufactured views over one graph: cells x days x infrastructure x hazard history x denominators x signals. Start with search_products or answer_question; inspect_product returns the contract; quote_request prices a need in credits; buy_product / create_watch return the exact call. Atlas ships through risk indicator, never a predictive model.",
      "tools": [
        {
          "name": "answer_question",
          "description": "Ask a question Atlas can answer live (seismic unusual in a region, wave energy, commodity regimes, logistics safety, what cells are alert-worthy). Returns verdict, evidence, datasets and the purchase path.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "[south, west, north, east]; used exactly. Without it a named region uses its preset box, stated in bbox_source",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "question": {
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31da2335662bd9c56eb9293c9d0e052a00a43f8a562102ca941b91c89fa27076"
        },
        {
          "name": "buy_product",
          "description": "The exact purchase call for a product and tier (one-time pack via POST /api/datapacks/buy, subscription via POST /api/feeds/subscribe), with terms, idempotency and what is metered. Does not move money: purchases need a session (or Stripe checkout).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              },
              "tier": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:873fffe228ec0d817c1d1fbc6bed6ea58e78f107c26656f66b8a5b960a981df2"
        },
        {
          "name": "create_watch",
          "description": "The exact subscribe call for a watch (mode=watch) with the filters given, its tier, price and metering, plus the webhook contract. Does not move money.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "[south, west, north, east] in decimal degrees, e.g. Texas [25.8, -106.7, 36.5, -93.5]",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "cohorts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "min_confidence": {
                "type": "number"
              },
              "min_severity": {
                "description": "change-event severity floor (info < elevated < high < critical); other scales such as NWS Moderate/Severe are refused",
                "enum": ["info", "elevated", "high", "critical"],
                "type": "string"
              },
              "signals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "tier": {
                "type": "string"
              },
              "webhook_url": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fbdcc3b1338239e09b703650f7c5a925744ba6b2b939774966eae33531c4ee9"
        },
        {
          "name": "get_changes",
          "description": "Change events since a cursor. Anonymous: the latest-day preview, at most 10 events (limit_applied/limit_max in the response). With api_key: the metered signal feed for that subscription (GET /api/feeds/{slug}/changes).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "dry_run": {
                "type": "boolean"
              },
              "since": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49435378cce581b74858dab9ed77cbeccc13f5db422d87ed5d5e9b9c44f34227"
        },
        {
          "name": "get_entitlement",
          "description": "What an api_key is entitled to and has used: tier, credits quota, used, remaining, projected cost of a request, reset date.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "resolution": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["api_key", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2312f89e9b3bca96bb0f45b4faa2f55a1a1e60f1fa8bcf42b3690360fd1c01e8"
        },
        {
          "name": "inspect_product",
          "description": "The full machine-readable commercial contract of one product: pricing ladder, credit multipliers, views, schema, measured quality, SLOs, provenance, join quality, semantics (ships through risk indicator), limitations.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aca9b674ff65a838c9059ca66c60c757b5b52cc5a6dcef8eeb9b5383ec579006"
        },
        {
          "name": "quote_request",
          "description": "Quote a dataset need: text / keywords / category, max_age_hours, budget_usd, resolution, window_days, records, region or bbox. Returns ranked products with the cheapest fitting tier, estimated records and credits, cost, and the exact purchase call.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "[south, west, north, east] in decimal degrees, e.g. Texas [25.8, -106.7, 36.5, -93.5]",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "budget_usd": {
                "type": "number"
              },
              "category": {
                "type": "string"
              },
              "keywords": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_age_hours": {
                "type": "number"
              },
              "records": {
                "type": "integer"
              },
              "region": {
                "type": "string"
              },
              "resolution": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "window_days": {
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd6c10758f74ebd4ab7d6c288d7bb555db0a8007be81457620383b9b701d450e"
        },
        {
          "name": "quote_watch",
          "description": "Quote a watch (signal feed): need text plus filters (bbox, cohorts, signals, min_severity, min_confidence) -> product (ranked like quote_request, among packs with the cell layer), cheapest tier that meets the need, best tier within budget, estimated events per month and credits (watch events cost 5 credits).",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "[south, west, north, east] in decimal degrees, e.g. Texas [25.8, -106.7, 36.5, -93.5]",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "budget_usd": {
                "type": "number"
              },
              "cohorts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "min_confidence": {
                "type": "number"
              },
              "min_severity": {
                "description": "change-event severity floor (info < elevated < high < critical); other scales such as NWS Moderate/Severe are refused",
                "enum": ["info", "elevated", "high", "critical"],
                "type": "string"
              },
              "signals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a79eb0ecd8e9d4e822cb8e26b4b5d36cd1d4ad61b806535785b32c9fd18c994"
        },
        {
          "name": "sample_product",
          "description": "Free sample rows of a product (k-anonymised where applicable) with data_through and contract version.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e80133d4104be328b0958a9cd1d5a582268785aeeee207f4634af099824d2f82"
        },
        {
          "name": "search_products",
          "description": "SEMANTIC product discovery: describe the need in plain words (industry, infrastructure type, hazard, question) and get products ranked by profile match (answers_questions, use_cases, industries, infrastructure_types, hazard_classes, example_questions), with the matched terms, what each product is NOT for, its temporal/spatial coverage, the cheapest satisfying tier, quality status and contract URL.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "flagships_only": {
                "type": "boolean"
              },
              "limit": {
                "type": "integer"
              },
              "text": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10c276f4b16dc7fc3f8b516631739617799b0a8262cefa30025d8e7d025361d8"
        }
      ],
      "digest": "sha256:784721b0581d722ab746086b65e7401a27271c4595cb8198a71091b609dad693"
    }
  }
}
