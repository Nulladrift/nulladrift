{
  "lockfileVersion": 2,
  "subjects": {
    "com.songupai/songup-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.songupai.com/mcp/agents"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "songup-ai",
        "title": "SongUp AI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SongUp AI makes songs with vocals in 76 languages. Use find_songs to get songs from the SongUp AI library (24 languages) with a link to each song's audio, start_custom_song for a link that opens the SongUp AI song maker with the user's own song idea filled in, and find_audio_tool when the user wants a browser tool for their own audio (stem separation, vocal removal, mashups, noise removal, mastering, chords, MIDI, auto-tune, editing).",
      "tools": [
        {
          "name": "find_audio_tool",
          "title": "Find a SongUp AI audio tool",
          "description": "Finds the SongUp AI browser audio tool for a task the user describes, such as splitting a song into vocals and music, removing vocals for karaoke, making a mashup of two songs, removing background noise, mastering a track, finding chords, converting audio to MIDI, auto-tune or editing audio. Returns the matching tools with what each one does and a link to open it on songupai.com, where the user uploads their audio. This tool does not process audio itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "What the user wants to do with their audio, in a few words (e.g. \"separate vocals\", \"mashup maker\", \"audio editor\").",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "kind": {
                "enum": ["tools"],
                "type": "string"
              },
              "matched": {
                "type": "boolean"
              },
              "task": {
                "type": "string"
              },
              "tools": {
                "items": {
                  "properties": {
                    "does": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["does", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["kind", "matched", "task", "tools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a SongUp AI audio tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25124dd5b07ca919856fe4b49329fd97cf02e651a44ed60330a001fe0c05e78c"
        },
        {
          "name": "find_songs",
          "title": "Find songs in the SongUp AI library",
          "description": "Finds ready-made AI songs from the SongUp AI library and returns each one with a direct link to its audio (MP3). Use it when the user wants to hear AI songs or example songs in a language, genre, mood or for an occasion (for example \"an Arabic love song\", \"Hindi lo-fi\", \"upbeat birthday pop\"). Songs are pre-made library tracks, not made from the user's own words; for a song from their own idea use start_custom_song.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language the songs are sung in, or \"Instrumental\" for songs without vocals. Defaults to English.",
                "enum": ["English", "Hindi", "Spanish", "French", "German", "Japanese", "Korean", "Portuguese", "Arabic", "Urdu", "Turkish", "Persian", "Indonesian", "Malay", "Tamil", "Punjabi", "Bengali", "Italian", "Russian", "Chinese", "Vietnamese", "Thai", "Filipino", "Swahili", "Instrumental"],
                "type": "string"
              },
              "limit": {
                "description": "How many songs to show (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional genre, mood or occasion to match, in a few words (e.g. \"romantic\", \"lo-fi\", \"birthday\", \"rap\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "createUrl": {
                "type": "string"
              },
              "kind": {
                "enum": ["songs"],
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "songs": {
                "items": {
                  "properties": {
                    "about": {
                      "type": "string"
                    },
                    "audioUrl": {
                      "type": "string"
                    },
                    "cover": {
                      "type": "string"
                    },
                    "genre": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "vocal": {
                      "type": "string"
                    }
                  },
                  "required": ["about", "audioUrl", "cover", "genre", "id", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["createUrl", "kind", "language", "query", "songs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find songs in the SongUp AI library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:973255ef49baae5e1206f3167e541a4c272e067189089f57b89240a569c4cb54"
        },
        {
          "name": "start_custom_song",
          "title": "Start a custom song on SongUp AI",
          "description": "Prepares a link that opens the SongUp AI song maker on songupai.com with the user's song idea already filled in, so they can turn it into a full song with vocals there. Use it when the user wants a song made from their own idea, story, names or lyrics (birthday, anniversary, love song, etc.). Nothing is created or charged by this tool; the song is made on songupai.com, which needs a free account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idea": {
                "description": "What the song is about, in the user's words: occasion, names, story, mood and style. Up to 500 characters.",
                "type": "string"
              },
              "language": {
                "description": "Language to sing in, if the user said one.",
                "enum": ["English", "Hindi", "Spanish", "French", "German", "Japanese", "Korean", "Portuguese", "Arabic", "Urdu", "Turkish", "Persian", "Indonesian", "Malay", "Tamil", "Punjabi", "Bengali", "Italian", "Russian", "Chinese", "Vietnamese", "Thai", "Filipino", "Swahili"],
                "type": "string"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "createUrl": {
                "type": "string"
              },
              "idea": {
                "type": "string"
              },
              "kind": {
                "enum": ["create"],
                "type": "string"
              },
              "language": {
                "type": ["string", "null"]
              }
            },
            "required": ["createUrl", "idea", "kind", "language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a custom song on SongUp AI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:331fbd5c1ec2c09a76a02156f3cb602d8a6067a7f455566c784b2760881e672c"
        }
      ],
      "digest": "sha256:a3feb9ad169b101dfa5eb6e9a07b4e6772c2731e2554b430b51803748085fdf0"
    }
  }
