        {
          "name": "call",
          "description": "Run one tool of a listing you chose, through our gateway, after checking its current schema. Only tools classified read-only are relayed; destructive tools and tools that need the provider's own credentials are refused. A paid listing runs only with a payment proof you supply. Do not retry an uncertain outcome automatically. Use when you have chosen a listing and want this gateway to run one of its admitted tools. Example arguments: {\"resource_id\": 133020, \"tool\": \"get_country_profile\", \"arguments\": {\"country_code\": \"US\"}}",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "Optional credit account ID for paid tools (defaults to your visitor ID)",
                "type": "string"
              },
              "arguments": {
                "description": "Key-value arguments to pass to the tool",
                "type": "object"
              },
              "idempotency_key": {
                "description": "Stable caller key for supported ticketed delivery while its execution record is retained. Reuse with identical input; uncertain execution stays paused for review.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "payment": {
                "description": "Optional payment details (tx_hash, signature, headers) for paid endpoints",
                "type": "object"
              },
              "resource_id": {
                "description": "The resource_id of the agent, MCP server, or API to call",
                "type": "integer"
              },
              "task": {
                "description": "The task query (optional; used to find immediate alternatives if execution fails)",
                "type": "string"
              },
              "tool": {
                "description": "The specific tool name to execute",
                "type": "string"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
