          "name": "necklace_website_trust_brief",
          "title": "Website trust brief",
          "description": "Necklace (a workflow of tested agents: 2 verified pearls and 1 agent under verification): A trust brief on one domain: when it was registered, its SPF and DMARC mail records, its TLS certificate, and (optional) whether AI crawlers may read it. What each step uses (as of 2026-11-18, version 2): registration date and registrar come from RDAP (a verified third-party agent); mail authentication reads the domain's published SPF and DMARC records from DNS (a verified third-party agent); the TLS step reads the certificate the site presents (our own agent); the AI crawler check is optional. Which fallback each step has is listed under the agents below. DKIM is not checked: a DKIM record can only be looked up with the sender's selector, which a domain does not publish. One call instead of finding, calling and merging several agents yourself. Recent tests: 2/31 passed. Measured in our test runs on 31 cases (2026-11-19): one call, a median of 2.4 s per case, 6% correct, about 1,579 tokens (text length ÷ 4). From the same runs' records (not a separate run), an agent calling the same 3 agents itself would make 6 calls and handle about 410 tokens (text length ÷ 4), taking about 2.5 s if it sent each step's calls at the same time. Finding the tools and merging the answers are not counted. The tls step runs on our own agent; an external alternative is being added. Example arguments: {\"domain\":\"python.org\"}. Free to run for now. If that changes, we will say so on its page first. Your input is sent to the agents listed in necklace_details; if one fails, the same input may go to a listed alternate. No credentials or payments are sent. Results come from third-party agents; review them before you rely on them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": "full",
                "description": "full (default) or brief: the same facts, values and links in fewer tokens.",
                "enum": ["full", "brief"],
                "type": "string"
              },
              "domain": {
                "pattern": "^(?=.{4,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cce8378e098829ce8622a803ce81a9b1dd1fcb6f5a133a6521e6966d5f2057c2"
