        {
          "name": "adapt_rest",
          "description": "Universal Adapter: dynamically convert any OpenAPI/Swagger REST API specification into MCP tools and execute them. Use when the API you need has an OpenAPI document but no MCP server. Example arguments: {\"spec_url\": \"https://api.example.org/openapi.json\", \"action\": \"list_tools\"}",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Action: 'list_tools' to discover executable tools, 'call' to invoke an endpoint.",
                "enum": ["list_tools", "call"],
                "type": "string"
              },
              "arguments": {
                "description": "Arguments for the tool invocation.",
                "type": "object"
              },
              "base_url": {
                "description": "Optional override for API base URL.",
                "type": "string"
              },
              "spec": {
                "description": "Inline OpenAPI JSON specification object.",
                "type": "object"
              },
              "spec_url": {
                "description": "URL of the OpenAPI/Swagger JSON specification.",
                "type": "string"
              },
              "tool": {
                "description": "Tool name to execute when action='call'.",
                "type": "string"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured tool result. Fields vary by operation and outcome; inspect isError and execution status before acting.",
            "properties": {
              "execution": {
                "type": "object"
