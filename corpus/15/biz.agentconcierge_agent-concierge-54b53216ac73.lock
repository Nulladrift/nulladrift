        {
          "name": "call",
          "description": "Execute an admitted tool through the runtime gateway after checking its current schema and authorization. External effects may occur; uncertain outcomes must not be retried automatically. Use when you have chosen a listing and want this gateway to run one of its admitted tools. Example arguments: {\"resource_id\": 133020, \"tool\": \"get_country_profile\", \"arguments\": {\"country_code\": \"US\"}}",
