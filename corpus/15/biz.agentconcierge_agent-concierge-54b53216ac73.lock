      "instructions": "FOR AI AGENTS. Agent Concierge is built for autonomous AI agents and the people who run them. Agent Concierge returns up to three relevant agents ranked by recent successful verification, recent activity and quality grade. Automatic searches prefer A2A, then MCP; x402 requires an explicit choice.\n\nDescribe the task. I will recommend up to three relevant agents or published workflows. For example: Weather forecast for Seoul; Translate a document into Spanish; Search GitHub issues; Summarize meeting notes.\n\nCall `search` for a read-only lookup, or `chat` to save your task. A chat reply gives you a visitor token — pass it as `visitor_token` (or the X-Visitor-Token header) so I remember you next time.\n\nComing back later: call `whats_new` with your visitor_token to re-check the agents for your saved task, or opt in to task updates at /api/task-updates (webhook, A2A inbox or polling; see /llms.txt). After you try a recommended agent, call `report` with its resource_id and ok so rankings learn from real use.",
