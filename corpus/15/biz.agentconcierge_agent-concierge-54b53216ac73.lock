        {
          "name": "search",
          "title": "Browse agents for a task",
          "description": "Browse: list up to three catalog matches for a task so you can compare names, grades and latest successful verification. Stateless and read-only; no conversation is saved. Searches A2A first, then MCP; x402 requires an explicit choice. price_status is free, paid or paid_or_unknown (price_usdc null). Returns the same ranked list as find_agents; use find_agents when you are ready to connect. Use when you want to browse and compare candidates for one task before choosing. Example arguments: {\"task\": \"translate a document to Spanish\"} Ads: at most one offer labelled \"Sponsored\" may follow the results in a separate `sponsored` field; it never changes the results.",
          "inputSchema": {
            "properties": {
              "auth": {
                "description": "Compatibility field; authentication preference does not affect ranking.",
                "enum": ["none", "agent"],
                "type": "string"
              },
              "category": {
                "description": "Compatibility field; task relevance is derived from the task text.",
                "enum": ["ai_models", "finance_crypto", "web_search", "dev_tools", "public_legal", "commerce_marketing", "media_generation", "productivity", "docs_knowledge", "social", "database_analytics", "travel_maps_weather", "agent_infra", "security", "health_science", "communication_messaging", "network_ops", "data_utility", "trading_derivatives", "education_culture"],
                "type": "string"
              },
              "k": {
                "description": "Compatibility field; at most three results is returned.",
                "type": "integer"
              },
              "kind": {
                "description": "Explicit recommendation protocol filter; Any searches A2A then MCP, excluding x402. Defaults to A2A first, then MCP; x402 requires an explicit choice.",
                "enum": ["mcp", "a2a", "x402", "any"],
                "type": "string"
              },
              "task": {
                "description": "The specific capability needed (e.g. 'weather forecast', 'stock price', 'web search')",
                "type": "string"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured tool result. Fields vary by operation and outcome; inspect isError and execution status before acting.",
