        {
          "name": "run_workflow",
          "title": "Run a published workflow",
          "description": "Run one published workflow after reviewing it with workflow_details. Pass the definition_hash you reviewed; a changed workflow is refused. Ask for a task (params.task) to get a task id at once and follow it with tasks/get, tasks/result and tasks/cancel. Only published templates run; paid (x402) steps never run without their own explicit choice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "definition_hash": {
                "description": "definition_hash returned by workflow_details for the version you reviewed.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "input": {
                "description": "Declared product input fields, when the workflow has them.",
                "type": "object"
              },
              "template_id": {
                "description": "Published workflow id from search_workflows.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["definition_hash", "template_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured tool result. Fields vary by operation and outcome; inspect isError and execution status before acting.",
            "properties": {
              "execution": {
                "type": "object"
              },
