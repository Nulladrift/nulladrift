        {
          "name": "search",
          "description": "Browse: list up to three catalog matches for a task so you can compare names, grades and latest successful verification. Stateless and read-only; no conversation is saved. Searches A2A first, then MCP; x402 requires an explicit choice. price_status is free, paid or paid_or_unknown (price_usdc null). Returns the same ranked list as find_agents; use find_agents when you are ready to connect. Use when you want to browse and compare candidates for one task before choosing. Example arguments: {\"task\": \"translate a document to Spanish\"} Ads: at most one offer labelled \"Sponsored\" may follow the results in a separate `sponsored` field; it never changes the results. Send ads=\"none\" to leave it out.",
          "inputSchema": {
            "properties": {
