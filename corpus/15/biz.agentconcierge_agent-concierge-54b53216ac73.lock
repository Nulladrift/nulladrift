        {
          "name": "best_for_role",
          "title": "Verified pearls for a role",
          "description": "Read-only: the verified pearls (agents that passed our tests for this role) and the necklaces that run this job to the end, from our latest tests. Roles look like weather.forecast.v1. Ads: at most one offer labelled \"Sponsored\" may follow the results in a separate `sponsored` field; it never changes the results. Send ads=\"none\" to leave it out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ads": {
                "description": "Send \"none\" to leave out the Sponsored offer that may follow the results.",
                "enum": ["none"],
                "type": "string"
              },
              "role": {
                "maxLength": 80,
                "pattern": "[a-z][a-z0-9_]*(?:\\.[a-z0-9_]+)*\\.v[0-9]{1,3}",
