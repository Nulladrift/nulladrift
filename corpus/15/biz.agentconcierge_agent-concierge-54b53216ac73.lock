      "instructions": "Search public agents, verified Public Pearls (85+ role-task pass), and live Public Pearl Necklaces or published workflows. This interface only reads catalog records.",
      "tools": [
        {
          "name": "find_agents",
          "title": "Find agents to connect",
          "description": "Get up to three recently verified agents for your task, with what you need to call each one (endpoint, verification evidence, calling details). Stateless and read-only; no conversation is saved. price_status is free, paid (price_usdc per call in micro-USDC) or paid_or_unknown (the provider states a price or none is known; price_usdc is null). A listing our gateway can run has connection_available (same as gateway_ready) and run_here: only when ready is true, pass its arguments to this server's call tool; otherwise ask for required_arguments before calling; mcp_config is a settings entry for an MCP host. Each result shows when the agent was last checked; before a later call, run check_agent on its endpoint, and if a call fails, call report with ok false for alternatives. Use when you want to connect to one of them now or run it here with call. Example arguments: {\"task\": \"extract text from a PDF\", \"kind\": \"mcp\"} Ads: one \"Advertisement\" in a separate `sponsored` array, also in `_meta[\"biz.agentconcierge/sponsored\"]` and a last \"Advertisement:\" text line; results unchanged.",
          "inputSchema": {
            "properties": {
              "auth": {
                "description": "Compatibility field; authentication preference does not affect ranking.",
                "enum": ["none", "agent"],
                "type": "string"
              },
              "category": {
                "description": "Compatibility field; task relevance is derived from the task text.",
                "enum": ["ai_models", "finance_crypto", "web_search", "dev_tools", "public_legal", "commerce_marketing", "media_generation", "productivity", "docs_knowledge", "social", "database_analytics", "travel_maps_weather", "agent_infra", "security", "health_science", "communication_messaging", "network_ops", "data_utility", "trading_derivatives", "education_culture"],
                "type": "string"
              },
              "free_only": {
                "description": "Only listings that are free to call.",
                "type": "boolean"
              },
              "has_fallback": {
                "description": "Only listings with an alternate in a public Pearl Necklace role.",
                "type": "boolean"
              },
              "kind": {
                "description": "Explicit recommendation protocol filter; Any searches A2A then MCP, excluding x402. Defaults to A2A first, then MCP; x402 requires an explicit choice.",
                "enum": ["mcp", "a2a", "x402", "any"],
                "type": "string"
              },
              "max_latency_ms": {
                "description": "Only listings whose mean successful run through us is at most this (never timed: left out).",
                "maximum": 120000,
                "minimum": 1,
                "type": "integer"
              },
              "no_credentials": {
                "description": "Only listings that need no authentication.",
                "type": "boolean"
              },
              "read_only": {
                "description": "Only tools that declare readOnlyHint.",
                "type": "boolean"
              },
              "task": {
                "description": "What you need done",
                "type": "string"
              },
              "verified_only": {
                "description": "Only listings run by us in the last 24 hours or with a passed task test.",
                "type": "boolean"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Fields vary by operation; check isError and status first.",
            "properties": {
              "direct_only": {
                "description": "Not run by this gateway; not a recommendation.",
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "execution": {
                "type": "object"
              },
              "intent": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "recommendations": {
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "sponsored": {
                "description": "One labelled Advertisement, apart from the results; `disclosure` says paid or house. It does not affect ranking, selection or test results.",
                "items": {
                  "type": "object"
                },
                "maxItems": 1,
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "visitor": {
                "additionalProperties": false,
                "description": "Session transport only; never put it in answer text.",
                "properties": {
                  "id": {
                    "type": "string",
                    "x-sensitive": true
                  },
                  "session_status": {
                    "type": "string"
                  },
                  "token": {
                    "type": "string",
                    "x-sensitive": true
                  }
                },
                "type": ["object", "null"]
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find agents to connect"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8544e5845d6a31754698b111ec8bd1db81354948368b2242a5da1c5f5bbd483"
        },
