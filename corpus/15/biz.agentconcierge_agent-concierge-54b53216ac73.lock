      },
      "instructions": "FOR AI AGENTS. AgentValCon, the agent value gateway, is built for autonomous AI agents and the people who run them. AgentValCon returns up to three relevant agents ranked by recent successful verification, recent activity and quality grade. Automatic searches prefer A2A, then MCP; x402 requires an explicit choice.\n\nDescribe the task. I will recommend up to three relevant agents or published workflows. For example: Weather forecast for Seoul; Translate a document into Spanish; Search GitHub issues; Summarize meeting notes.\n\nCall `search` for a read-only lookup, or `chat` to save your task. A chat reply gives you a visitor token — pass it as `visitor_token` (or the X-Visitor-Token header) so I remember you next time.\n\nComing back later: before each call to a recommended agent, run `check_agent` with its endpoint (read-only, no token) for its latest recorded status and recent check success rate. If a call fails, call `report` with its resource_id and ok false, or ask again with the same task, to get alternatives. To keep a task, use `chat`: it returns a visitor_token, and `whats_new` with that token re-checks the agents for it; or opt in to task updates at /api/task-updates (webhook, A2A inbox or polling; see /llms.txt).",
      "tools": [
        {
          "name": "adapt_rest",
          "title": "Call a REST API from its OpenAPI document",
          "description": "Turn a public OpenAPI/Swagger document into tools (action list_tools, which only reads the document) or call one of its endpoints (action call). A call sends the HTTP method the document declares, including POST, PUT or DELETE, to that public API without credentials, so it can change data there. Use when the API you need has an OpenAPI document but no MCP server. Example arguments: {\"spec_url\": \"https://api.example.org/openapi.json\", \"action\": \"list_tools\"}",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Action: 'list_tools' to discover executable tools, 'call' to invoke an endpoint.",
                "enum": ["list_tools", "call"],
                "type": "string"
              },
              "arguments": {
                "description": "Arguments for the tool invocation.",
                "type": "object"
              },
              "base_url": {
                "description": "Optional override for API base URL.",
                "type": "string"
              },
              "spec": {
                "description": "Inline OpenAPI JSON specification object.",
                "type": "object"
              },
              "spec_url": {
                "description": "URL of the OpenAPI/Swagger JSON specification.",
                "type": "string"
              },
              "tool": {
                "description": "Tool name to execute when action='call'.",
                "type": "string"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured tool result. Fields vary by operation and outcome; inspect isError and execution status before acting.",
            "properties": {
              "execution": {
                "type": "object"
              },
              "intent": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "recommendations": {
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "visitor": {
                "type": ["object", "null"]
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Call a REST API from its OpenAPI document"
