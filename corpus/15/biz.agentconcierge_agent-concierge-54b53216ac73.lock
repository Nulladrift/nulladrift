                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "visitor": {
                "type": ["object", "null"]
              }
            },
