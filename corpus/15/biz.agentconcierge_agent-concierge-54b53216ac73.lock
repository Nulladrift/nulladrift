      },
      "instructions": "Search public agents, verified Public Pearls (85+ role-task pass), and live Public Pearl Necklaces or published workflows. This interface only reads catalog records.",
      "tools": [
        {
          "name": "find_agents",
          "title": "Find agents to connect",
          "description": "Get up to three recently verified agents for your task, with what you need to call each one (endpoint, verification evidence, calling details). Stateless and read-only; no conversation is saved. price_status is free, paid (price_usdc per call in micro-USDC) or paid_or_unknown (the provider states a price or none is known; price_usdc is null). A listing our gateway can run has connection_available (same as gateway_ready) and run_here: only when ready is true, pass its arguments to this server's call tool; otherwise ask for required_arguments before calling; mcp_config is a settings entry for an MCP host. Each result shows when the agent was last checked; before a later call, run check_agent on its endpoint, and if a call fails, call report with ok false for alternatives. Use when you want to connect to one of them now or run it here with call. Example arguments: {\"task\": \"extract text from a PDF\", \"kind\": \"mcp\"} Ads: at most one offer labelled \"Sponsored\" may follow the results in a separate `sponsored` field; it never changes the results.",
          "inputSchema": {
            "properties": {
              "auth": {
                "description": "Compatibility field; authentication preference does not affect ranking.",
                "enum": ["none", "agent"],
                "type": "string"
              },
              "category": {
                "description": "Compatibility field; task relevance is derived from the task text.",
                "enum": ["ai_models", "finance_crypto", "web_search", "dev_tools", "public_legal", "commerce_marketing", "media_generation", "productivity", "docs_knowledge", "social", "database_analytics", "travel_maps_weather", "agent_infra", "security", "health_science", "communication_messaging", "network_ops", "data_utility", "trading_derivatives", "education_culture"],
                "type": "string"
              },
              "kind": {
                "description": "Explicit recommendation protocol filter; Any searches A2A then MCP, excluding x402. Defaults to A2A first, then MCP; x402 requires an explicit choice.",
                "enum": ["mcp", "a2a", "x402", "any"],
                "type": "string"
              },
              "task": {
                "description": "What you need done",
                "type": "string"
              },
              "visitor_token": {
                "description": "Your visitor token (vt_…) so I remember you. Omit on first contact.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured tool result. Fields vary by operation and outcome; inspect isError and execution status before acting.",
            "properties": {
              "execution": {
                "type": "object"
              },
              "intent": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "recommendations": {
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "sponsored": {
                "description": "At most one offer labelled Sponsored, after and apart from the results. Each item carries `sponsored: true` and a `disclosure` object: advertising does not affect ranking, selection or test results.",
                "items": {
                  "type": "object"
                },
                "maxItems": 1,
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "visitor": {
                "additionalProperties": false,
                "description": "Session transport only. Never include identity or tokens in answer text.",
                "properties": {
                  "id": {
                    "type": "string",
                    "x-sensitive": true
                  },
                  "session_status": {
                    "type": "string"
                  },
                  "token": {
                    "description": "Opaque continuation credential; send only in the session transport.",
                    "type": "string",
                    "x-sensitive": true
                  }
                },
                "type": ["object", "null"]
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find agents to connect"
          },
          "behavior": {
            "destructive": false,
