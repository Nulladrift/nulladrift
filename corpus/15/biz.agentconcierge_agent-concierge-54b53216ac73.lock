        {
          "name": "necklace_quakes_near_airport",
          "title": "Earthquakes near an airport",
          "description": "Necklace (a workflow of tested agents: 2 verified pearls and 1 agent under verification): Where an airport is (from its IATA or ICAO code) and the M4.5+ earthquakes within 1,000 km of it in the last 7 days (USGS data), each with magnitude, time, place and distance, and the local time there now. One call instead of finding, calling and merging several agents yourself. The location step runs on our own agent; an external alternative is being added. Example arguments: {\"code\":\"LAX\"}. Free to run for now. If that changes, we will say so on its page first. Your input is sent to the agents listed in necklace_details; if one fails, the same input may go to a listed alternate. No credentials or payments are sent. Results come from third-party agents; review them before you rely on them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "pattern": "^[A-Za-z]{3,4}$",
                "type": "string"
              },
              "detail": {
                "default": "full",
                "description": "full (default) or brief: the same facts, values and links in fewer tokens.",
                "enum": ["full", "brief"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
