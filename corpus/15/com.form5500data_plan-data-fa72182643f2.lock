        {
          "name": "list_prospects",
          "title": "Bulk list of plans by industry, place and size: address, industry, participants, assets, inception date, recordkeeper",
          "description": "A list of plans for prospecting or research, many per call: plan and sponsor name, mailing address,\nEIN and plan number, industry, plan type, effective (inception) date, participants and net assets at the\nend of the latest plan year, form type, recordkeeper and primary advisor last seen on Schedule C, and the\nfiling's ACK ID.\n\nFilter by industry, place (state, city, ZIP), size, plan type, effective date or recordkeeper. Large\n(long-form) filers only unless `filer_size` says otherwise. Use `search_plans` instead to find one company's\nplan by name, and `get_plan` for everything about one plan. Paging stops at offset 500: narrow the\nfilters to see more.\n\nPrice: $0.25 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /prospects of the Plan Data API.",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sponsor's city, as on the filing (case doesn't matter). Best with `state`.",
                "title": "City"
              },
              "effective_after": {
