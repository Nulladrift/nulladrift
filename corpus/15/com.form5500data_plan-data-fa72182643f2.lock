        {
          "name": "get_plan_insurance",
          "title": "An employer's insured benefits from Schedule A: carriers, benefit types, covered lives, renewal dates, premiums, and the brokers paid",
          "description": "An employer's insured benefits, from Schedule A of its Form 5500: for each plan, every insured contract\nwith the carrier (brand and parent group, NAIC code), the benefit types (health, dental, vision, life,\ndisability, stop loss, HMO/PPO...), persons covered, the policy year and renewal month, premiums (and, for\nexperience-rated contracts, claims), commissions and fees, and each agent or broker the insurer paid, by name.\nAlso the plan's benefits as listed on the main form, how they're funded (line 9), totals, and what changed\nfrom the prior year (carriers added or dropped, a new top broker).\n\nWithout `pn`: every plan of the EIN that is a health and welfare plan or filed a Schedule A (a retirement\nplan's annuity or guaranteed contracts are on Schedule A too). Find the EIN with `search_plans` (kind=welfare for\nan employer with no retirement plan here). A plan year with no insured contracts still answers, with\n`contracts` empty, and isn't charged. Self-funded benefits, stop-loss the employer buys itself, and broker fees\nthe employer pays directly aren't on Schedule A: see `meta.coverage_notes`.\n\nPrice: $0.10 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /insurance of the Plan Data API.",
