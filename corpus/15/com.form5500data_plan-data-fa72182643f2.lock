        {
          "name": "get_plan_lineup",
          "title": "Investment lineup: every fund on the plan's Schedule of Assets, with ticker, name and dollars",
          "description": "Every holding on the plan's Schedule of Assets (the list of investments attached to the Form 5500 as a\nPDF), largest first: each fund's ticker and name, share class, fund family, vehicle type (mutual fund,\ncollective trust, separate account...), year-end dollars and share of the holdings. `fields` asks for\ntickers only or names only.\n\nFund names and tickers are matched to the SEC's fund list, each with a `certainty`: sure, less sure or much\nless sure (check before relying on it). Collective trusts and other non-registered holdings have no ticker\n(`why_no_ticker` says why). A pooled separate account shows the fund it invests in, with `held_through`.\n`check` says how the reading tied to Schedule H and the schedule's printed total; `asset_mix` gives the\nSchedule H totals for context.\n\nLineups so far cover about 1,040 large plans (plan year 2024), chiefly plans with $1 billion or more. Other\nplans answer `lineup_not_available`, which isn't charged. Nor is a lineup whose `check.status` is review (the\nautomatic checks didn't fully confirm it), or a master trust plan's, which lists only the master trust\ninterest. For fees use `get_plan_fees`.\n\nPrice: $0.25 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /lineup of the Plan Data API.",
          "inputSchema": {
            "properties": {
              "ein": {
                "description": "Sponsor EIN (9 digits, dashes allowed).",
                "title": "Ein",
                "type": "string"
              },
              "fields": {
                "default": "both",
                "description": "What each fund carries: both (the default) = ticker and name; ticker = tickers only (the name fields are null); name = names only (the ticker is null).",
