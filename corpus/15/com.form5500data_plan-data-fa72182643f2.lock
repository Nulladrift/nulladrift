          "description": "For each large plan year: Schedule C pay by role (recordkeeping, advisory, participant advice, TPA,\ninvestment management, trustee, other) in dollars and basis points of average net assets; every provider\non the Schedule C with names as filed, codes, direct and indirect pay; Schedule H line 2i expenses as a\nsecond view; and a completeness rating with the reasons.\n\nSmall plans file no Schedule C: the response still succeeds, with `schedule_c_available: false` and the\nplan-paid expenses that small plans do report. Years with no Schedule C return no breakdown and aren't\ncharged. Fees are floors: see `meta.coverage_notes`.\n\nPrice: $0.10 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /fees of the Plan Data API.",
