      "instructions": "Plan Data API: clean, multi-year data on U.S. employers' retirement plans (401(k), 403(b), pension and other plans)\nand health and welfare plans, built from the Department of Labor's public Form 5500 filings, plan years 2021 onward.\nA plan is identified by its sponsor's EIN plus its 3-digit plan number (pn). It answers questions about one employer\n(who serves its plans, what they pay, who insures its benefits, what changed) and builds lead lists across many.\n\nTypical flow: search_plans (by company name) -> get_plan with a result's ein and pn -> get_plan_history or\nget_plan_fees for detail. get_plan_lineup lists the plan's funds with tickers, for about 1,040 large plans so far.\nfind_plan_changes lists recordkeeper switches, new plans, mergers and terminations across\nplans; a recordkeeper move caused by a sale of the old recordkeeper's business is its own event type\n(recordkeeper_sold), not a switch. list_prospects lists many plans at once by industry, place (including within so many miles of a town) and size, with sponsor address, participants,\nassets and inception date. get_coverage (free) lists what the data covers and every limitation.\n\nHealth and welfare plans: get_plan_insurance lists an employer's insured contracts\nfrom Schedule A, with the carrier, benefit types, covered lives, renewal month, premium and the agents and brokers\npaid (wholesale general agencies and enrollment firms we know of are marked in role); list_insurance_prospects\nlists welfare plans by carrier, benefit, renewal month, broker, industry, place and size;\nsearch_plans with kind=welfare finds them by name. Schedule A lists insured contracts only: self-funded benefits, the\nemployer's own stop-loss and broker fees the employer pays directly aren't there, and insured welfare plans under 100\nparticipants don't file.\n\nEvery answer is JSON with `data` and `meta`; `meta.coverage_notes` says what that record can't show. In general: small\nplans (about 9 in 10) file no Schedule C, so they have no recordkeeper, advisor or fee breakdown; Schedule C omits\nproviders paid under $5,000, fees the employer pays directly (so many advisors don't appear) and fund expense ratios;\nthe investment lineup isn't in DOL's structured data, so get_plan_lineup reads it from the filing's PDF, for about\n1,040 large plans so far (plan year 2024); participant counts use a new definition from plan year 2023; governmental\nplans (public universities, school districts, state pensions) and most church plans don't file a Form 5500, so\nthey aren't here. Each tool\nreturns what the Plan Data API's HTTP endpoint named in its description returns: hints that mention an endpoint\n(GET /search...) mean the matching tool here.\n\nNothing here is investment, legal, tax or fiduciary advice; the terms of use are at the API's /terms.\n\nPayments: each paid tool costs a fixed price per call (search_plans $0.01, get_plan $0.03, get_plan_history $0.25, get_plan_fees $0.10, get_plan_lineup $0.25, find_plan_changes $0.25, list_prospects $0.25, get_plan_insurance $0.10, list_insurance_prospects $0.25; get_coverage free), in USDC on Base (mainnet) (eip155:8453), with x402 over MCP. Called without payment, a paid tool returns isError with the x402 PaymentRequired object; an x402 MCP client signs the payment, sends it in _meta[\"x402/payment\"] and repeats the call. Errors and empty results aren't charged: the receipt in _meta[\"x402/payment-response\"] then shows amount 0 and no transaction. No crypto wallet? Buy prepaid credits by card at https://api.form5500data.com/buy and connect with the header 'Authorization: Bearer <key>': each paid tool then takes its price from the key's balance (same prices and rules), with no x402 needed. Simplest, in an app with MCP sign-in (Claude and others): add https://api.form5500data.com/connect instead of /mcp; the app opens a page where the person pays by card and is then connected, with no key. An app connected that way pays each tool from that balance automatically (nothing to send), and get_account (free) shows the balance and a link to add credit.",
      "tools": [
        {
          "name": "find_plan_changes",
          "title": "Change events across plans: recordkeeper switches, new plans, mergers, terminations...",
          "description": "Change events detected by comparing each plan's consecutive filings, newest filing first. Each event\nhas before/after values, a confidence, the year compared against, a plain-English detail and the ACK ID\nof the filing that shows it.\n\nProviders are compared by family, so a rebrand (Great-West → Empower) isn't a change. A move caused by a\nsale of the old recordkeeper's business (Securian → The Standard, Prudential → Empower; the list is at\n`get_coverage` `book_sales`) is a `recordkeeper_sold` event, not a `recordkeeper_change` switch: the sponsor\ndidn't choose it. Each event also has the plan's size around the event (`net_assets_at_event`), which\n`min_assets` and `sort=assets` use. The newest plan year is still being filed, so its counts grow month to\nmonth.\n\nPrice: $0.25 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /changes of the Plan Data API.",
          "inputSchema": {
            "properties": {
              "ein": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this sponsor's plans (EIN, 9 digits, dashes allowed): what changed at one company.",
                "title": "Ein"
              },
              "event_type": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Event type(s); repeat the parameter or separate with commas. One of: recordkeeper_change, recordkeeper_sold, advisor_added, advisor_removed, advisor_changed, auditor_change, audit_opinion_change, late_deposits_appeared, new_plan, plan_merged_in, plan_merged_out, plan_terminated, termination_resolution, filings_stopped, large_asset_jump. Meanings at `get_coverage`.",
                "title": "Event Type"
              },
              "filer_size": {
                "anyOf": [
                  {
                    "enum": ["large", "small"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "large or small, in the event's plan year.",
                "title": "Filer Size"
              },
              "from_recordkeeper": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 3,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only recordkeeper_change events (switches) away from this recordkeeper family (any brand name). Combine with `to_recordkeeper` for one move, e.g. Empower to Fidelity. Add event_type=recordkeeper_sold to see moves caused by a sale too.",
                "title": "From Recordkeeper"
              },
              "limit": {
                "default": 25,
                "description": "Events per page (1-50). Each event is about 200 tokens of JSON, so the default 25 keeps an answer compact; narrow the filters rather than asking for more.",
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_assets": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum net assets around the event (`net_assets_at_event`: the larger of the event year's start and end).",
                "title": "Min Assets"
              },
              "min_confidence": {
                "default": "low",
                "description": "Lowest confidence to include: high = high only, medium = high and medium, low = all.",
                "enum": ["high", "medium", "low"],
                "title": "Min Confidence",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Events to skip (0-500).",
                "maximum": 500,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "plan_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Plan type, as in `search_plans` (e.g. 401k, dc, db).",
                "title": "Plan Type"
              },
              "plan_year_from": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 2000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest plan year of the event.",
                "title": "Plan Year From"
              },
              "plan_year_to": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 2000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest plan year of the event.",
                "title": "Plan Year To"
              },
              "pn": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With `ein`: only this plan number.",
                "title": "Pn"
              },
              "recordkeeper": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 3,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only recordkeeper_change events (switches) to or from this recordkeeper family (any brand name works). Add event_type=recordkeeper_sold to see moves caused by a sale too.",
                "title": "Recordkeeper"
              },
              "since": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only events whose filing DOL received on or after this date (YYYY-MM-DD): \"what's new since I last checked\". Excludes filings_stopped, which no filing reveals.",
                "title": "Since"
              },
              "sort": {
                "default": "newest",
                "description": "newest (the default: newest filing first) or assets (largest plan first, by `net_assets_at_event`).",
                "enum": ["newest", "assets"],
                "title": "Sort",
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter state of the sponsor (latest filing).",
                "title": "State"
              },
              "to_recordkeeper": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 3,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only recordkeeper_change events (switches) to this recordkeeper family (any brand name): plans it won. Moves caused by a sale aren't wins; add event_type=recordkeeper_sold to see them.",
                "title": "To Recordkeeper"
              }
            },
            "title": "find_plan_changesArguments",
            "type": "object"
          },
