        {
          "name": "list_insurance_prospects",
          "title": "Bulk list of health and welfare plans by carrier, benefit, renewal month, broker, industry, place and size",
          "description": "A list of health and welfare plans for prospecting, many per call, from each plan's latest filing: plan and\nsponsor name, mailing address, EIN and plan number, industry, participants, benefits listed, how they're\nfunded, the insured carriers (and which carry medical), renewal months, total premium, commissions and fees,\nand the best-paid broker.\n\nFilter by insurance (carrier, benefit type, renewal month, broker, funding, no insured medical contract,\npremium) and by industry, place (state, city, ZIP, or within a number of miles of a town or ZIP code) and\nsize. carrier, benefit and renewal_month together must match the same contract. Use `get_plan_insurance` for one\nplan's full detail. Paging stops at offset 500: narrow the filters to see more.\n\nPrice: $0.25 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /insurance/prospects of the Plan Data API.",
          "inputSchema": {
            "properties": {
              "benefit": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Insured benefit type (Schedule A line 8). Separate several with commas to match any: health, medical, dental, vision, life, std, temporary_disability, ltd, long_term_disability, rx, prescription_drug, stop_loss, hmo, ppo, indemnity, supplemental_unemployment, other. medical = health, or an HMO or PPO contract that isn't dental or vision; std / ltd = short- and long-term disability; rx = prescription drug. Only insured contracts match: self-funded benefits aren't on Schedule A.",
                "title": "Benefit"
              },
              "broker": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 3,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Agent or broker the insurer paid on the latest filing, as filed (\"Lockton\", \"Gallagher\"); matched like carrier. Lists that broker's book of filed business.",
                "title": "Broker"
              },
              "carrier": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 3,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Insurance carrier: a brand, parent or company name (\"UnitedHealthcare\", \"Kaiser\", \"Blue Cross\", \"Delta Dental\") or a 5-digit NAIC code. Matches from the start of a word; spaces, \"and\" and punctuation don't matter.",
                "title": "Carrier"
              },
              "city": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sponsor's city, as on the filing (case doesn't matter). Best with `state`.",
                "title": "City"
              },
              "exclude_multiemployer": {
                "default": false,
                "description": "true = leave out multiemployer (union) and multiple-employer plans, whose sponsor is a board or association rather than one employer.",
                "title": "Exclude Multiemployer",
                "type": "boolean"
              },
              "funding": {
                "anyOf": [
                  {
                    "enum": ["insured", "self_funded", "mix"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How benefits are paid, from Form 5500 line 9b: insured (insurance only), self_funded (trust or general assets, no insurance) or mix.",
                "title": "Funding"
              },
              "include_ended": {
                "default": false,
                "description": "Include plans whose latest filing was final or that stopped filing. Off by default.",
                "title": "Include Ended",
                "type": "boolean"
              },
              "industry": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The sponsor's industry: words (\"restaurants\", \"car dealers\", \"law firms\") or a NAICS business code or its start (\"62\" = health care, \"5411\" = legal services). Separate several with commas. `meta.query.industry` lists the codes each one matched.",
                "title": "Industry"
              },
              "limit": {
                "default": 50,
                "description": "Plans per page (1-100). The price is per call, whatever the limit.",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "max_participants": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum participants at the end of the latest plan year.",
                "title": "Max Participants"
              },
              "max_premium": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum total premium on the latest filing, dollars.",
                "title": "Max Premium"
              },
              "miles": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With `near`: how far to look, in miles (1-100, default 25). A straight line, not driving distance.",
                "title": "Miles"
              },
              "min_participants": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum participants at the end of the latest plan year (line 6d; the start of the year when the year-end count looks like a typo).",
                "title": "Min Participants"
              },
              "min_premium": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum total premium on the latest filing, dollars.",
                "title": "Min Premium"
              },
              "near": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A town and state (\"Mandeville, LA\") or a 5-digit ZIP code: only plans whose sponsor address is within `miles` of it. Each plan then shows `distance_miles`; sort=distance lists the nearest first.",
                "title": "Near"
              },
              "no_insured_medical": {
                "default": false,
                "description": "true = only plans that list health benefits but have no insured medical contract on file: usually self-funded medical (stop-loss and TPA prospects).",
                "title": "No Insured Medical",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "description": "Plans to skip (0-500).",
                "maximum": 500,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "renewal_month": {
                "anyOf": [
                  {
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Month a contract renews, 1-12 (the month after its policy year ended on the latest filing). With carrier or benefit, the same contract must match all of them: benefit=medical&renewal_month=7 = medical renewing in July.",
                "title": "Renewal Month"
              },
              "sort": {
                "default": "participants",
                "description": "participants (most first, the default), premium (largest first), commissions (largest first), renewal (next renewal of any of the plan's contracts, from this month on, first), name (A-Z by sponsor) or distance (nearest first; needs `near`).",
                "enum": ["participants", "premium", "commissions", "renewal", "name", "distance"],
                "title": "Sort",
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter state of the sponsor's address, e.g. OH.",
                "title": "State"
              },
              "zip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sponsor's ZIP code or its start (3-5 digits), e.g. 432 for the Columbus, OH area.",
                "title": "Zip"
              }
            },
            "title": "list_insurance_prospectsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bulk list of health and welfare plans by carrier, benefit, renewal month, broker, industry, place and size"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
