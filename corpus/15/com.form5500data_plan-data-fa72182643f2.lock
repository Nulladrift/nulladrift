        {
          "name": "get_plan_fees",
          "title": "Schedule C fee breakdown in dollars and bps, with completeness notes",
          "description": "For each large plan year: Schedule C pay by role (recordkeeping, advisory, participant advice, TPA,\ninvestment management, trustee, other) in dollars and basis points of average net assets; every provider\non the Schedule C with names as filed, codes, direct and indirect pay; Schedule H line 2i expenses as a\nsecond view; and a completeness rating with the reasons.\n\nSmall plans file no Schedule C: the response still succeeds, with `schedule_c_available: false` and the\nplan-paid expenses that small plans do report. Check `get_plan` `availability.fee_years` first to see\nwhich years have a breakdown. Fees are floors: see `meta.coverage_notes`.\n\nPrice: $0.10 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /fees of the Plan Data API.",
