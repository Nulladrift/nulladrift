          "description": "Find plans. Give at least one of `name`, `ein`, `state` or `recordkeeper`; the other filters narrow\nthe list. Each result is a short summary: call `get_plan` with its `ein` and `pn` for the profile.\n\nWith `name`, results are ordered by match score, then size; without it, largest plans first. Plans\nthat ended are hidden unless `include_ended=true`. Paging stops at offset 500: narrow the filters to\nsee more.\n\nPrice: $0.01 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /search of the Plan Data API.",
