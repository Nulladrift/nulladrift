                "title": "Effective Before"
              },
              "filer_size": {
                "default": "large",
                "description": "large (the default) = long-form filers: Form 5500 with Schedule H, generally 100+ participants, with providers on Schedule C. small = 5500-SF or Schedule I. any = both.",
                "enum": ["large", "small", "any"],
                "title": "Filer Size",
                "type": "string"
              },
