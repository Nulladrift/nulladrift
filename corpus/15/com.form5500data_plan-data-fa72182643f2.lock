        {
          "name": "search_plans",
          "title": "Find plans by company name, EIN, state, size, recordkeeper or plan type",
          "description": "Find plans. Give at least one of `name`, `ein`, `state` or `recordkeeper`; the other filters narrow\nthe list. Each result is a short summary: call `get_plan` with its `ein` and `pn` for the profile.\n\nWith `name`, results are ordered by match score, then size; without it, largest plans first. Plans\nthat ended are hidden unless `include_ended=true`. Paging stops at offset 500: narrow the filters to\nsee more.\n\nRetirement plans by default. `kind=welfare` finds health and welfare plans instead (call `get_plan_insurance` with\nthe result's `ein` and `pn`), and `kind=any` both.\n\nPrice: $0.01 per call, paid in USDC on Base (mainnet) with x402 (MCP transport), or from card credits (an app signed in at /connect, or an 'Authorization: Bearer <key>' header). Without payment the tool returns the payment requirements. Errors and empty results aren't charged.\n\nSame data as GET /search of the Plan Data API.",
          "inputSchema": {
            "properties": {
              "ein": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sponsor EIN (9 digits, dashes allowed). Lists every retirement plan under it.",
                "title": "Ein"
              },
              "filer_size": {
                "anyOf": [
                  {
                    "enum": ["large", "small"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "large = files Schedule H (generally 100+ participants; has providers and fees); small = 5500-SF or Schedule I.",
                "title": "Filer Size"
              },
              "include_ended": {
                "default": false,
                "description": "Include plans that are terminated, merged into another plan, or stopped filing. Off by default.",
                "title": "Include Ended",
                "type": "boolean"
              },
              "kind": {
                "default": "retirement",
                "description": "Which plans: retirement (the default: pension and retirement plans), welfare (health and welfare plans, for `get_plan_insurance`) or any (both, best match first). Each result says its `kind`. With welfare, only name, ein, state and the participant filters apply.",
                "enum": ["retirement", "welfare", "any"],
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page (1-50).",
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "max_assets": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum end-of-year net assets in dollars.",
                "title": "Max Assets"
              },
              "max_participants": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum end-of-year total participants.",
                "title": "Max Participants"
              },
              "min_assets": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum end-of-year net assets in dollars, latest plan year.",
                "title": "Min Assets"
              },
              "min_participants": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum end-of-year total participants.",
                "title": "Min Participants"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Company or plan name, as you know it. Fuzzy: typos, missing suffixes (Inc, LLC), DBA names and former names all match, and the last word can be a prefix (\"acm\" for Acme). Results come best match first with a `match` score.",
                "title": "Name"
              },
              "offset": {
                "default": 0,
                "description": "Results to skip (0-500).",
                "maximum": 500,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "plan_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Plan type: 401k, 403b, cash_balance, db_and_dc, defined_benefit, esop, ira_based, money_purchase, other_dc, profit_sharing, stock_bonus, target_benefit, type_not_coded, db, dc. `dc` = any defined contribution plan, `db` = any defined benefit plan.",
                "title": "Plan Type"
              },
              "recordkeeper": {
