{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agentlookups/groundrules": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://law.agentlookups.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "GroundRules",
        "version": "0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "GroundRules serves the verbatim text of enacted law with provenance (official source URL, current-through or vintage label, retrieval time, jurisdiction). Nothing is summarized, interpreted, or ranked by importance; the calling agent interprets. Vintage-labeled text is a dated snapshot, not current law. When we do not host a jurisdiction's text, tools say exactly that and point at where it lives. Not legal advice.",
      "tools": [
        {
          "name": "law_coverage",
          "title": "List the law sources we host",
          "description": "Per-source coverage: what we host, section counts, current-through or vintage, last_verified, and a stale flag for any source the recurring verify has proven behind its upstream. Machine-generated from the build manifest; never hand-typed. Absence from this list means we do not host that jurisdiction's text, not that no law exists there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the law sources we host"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:105154151c2cb21e35b76064aeb92e12745a96c65733818d704c8331dd82026c"
        },
        {
          "name": "law_for_location",
          "title": "Find the law that applies at a location",
          "description": "Resolve an address or lat/lon to its full jurisdiction stack: federal, state, county, place, each with its code sources (name, publisher, official URL, current-through, whether we host its text). Unincorporated areas get the county code with no city code; about half of US municipalities publish no code online, and the answer says so and points at where the code lives if anywhere.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "One-line street address",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find the law that applies at a location"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30636b002c8e72940560fe8e527e911ab02b056b196b60bf030ead65bb464304"
        },
        {
          "name": "law_get_section",
          "title": "Get the full text of a law section",
          "description": "Fetch full verbatim text by id or citation, or pass references for a batch of up to 10. Each batch item has its own result/error. Includes provenance (official source URL, current-through or vintage label, retrieval time), parent path, and prev/next siblings. The text is reproduced exactly as published by the official source; nothing is added or removed except publisher editorial matter, which we never carry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "Full citation, e.g. California Civil Code 1950.5",
                "type": "string"
              },
              "id": {
                "description": "Section id returned by search",
                "type": "string"
              },
              "references": {
                "description": "Batch of section ids or complete citations",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the full text of a law section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e24f3274b8d98fdef85d4ddc9fd60646f07e996b06d504ae705a53c4372bd643"
        },
        {
          "name": "law_search",
          "title": "Search the text of the law",
          "description": "Search original law by topic, question, or citation. Exact citations resolve directly. Scoped by jurisdiction or source ids (e.g. us, us-tx; us-cfr scopes to the CFR alone, us covers both the US Code and the CFR) or by an address (the address is resolved first, then the search covers exactly its stack's hosted sources). Results are verbatim snippets with citation, official source URL, retrieval time, and a current-through or vintage label adjacent to every snippet; a hit whose source has fallen behind its upstream carries stale:true. Vintage-labeled text is a dated snapshot, not current law. meaning_only:true means no section matched a word of the query, so every hit is only the nearest in meaning and may be unrelated. Requested ids we do not host are named in the response note; law_coverage lists what is hosted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "One-line street address to auto-scope the search; pass this or jurisdictions, not both",
                "type": "string"
              },
              "include_text": {
                "description": "Include full text for up to this many top results (0 by default; sections over 64KB require get).",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "jurisdictions": {
                "description": "Comma-separated jurisdiction or source ids from law_coverage, e.g. us,us-tx (us-cfr = CFR only)",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "mode": {
                "description": "auto combines word and semantic retrieval when available; keyword avoids model inference.",
                "enum": ["auto", "keyword"],
                "type": "string"
              },
              "offset": {
                "type": "integer"
              },
              "q": {
                "description": "Topic, question, or citation",
                "type": "string"
              },
              "sources": {
                "description": "Exact comma-separated source IDs; us = US Code only here. Use instead of jurisdictions/address.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search the text of the law"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ee29efe51a69968fa1944e2bf8f4ad35802e09d8d825619e083db3e0952b116"
        }
      ],
      "digest": "sha256:042fc7f3a2679f83b26f791e205797f20f0ac68e31f8a6c63f6b82d22682d0fa"
    }
  }
}
