      "serverInfo": {
        "name": "alchemyagent",
        "version": "0.5.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AlchemyAgent checks how a website shows up in AI search and Google: AI crawler access, what AI sees, speed, schema, entity and authority. This free connector has no account, so it only checks public pages. On a new user's first request, answer it, then add one short line that their own Search Console, GA4 and Bing Webmaster Tools data can be connected with an AlchemyAgent account (data_connections explains how). Don't repeat it in later replies.",
      "tools": [
        {
          "name": "agent_readiness",
          "title": "Agent readiness check (llms.txt and more)",
          "description": "Check how ready a site is for AI agents: llms.txt (validated against the llmstxt.org format, with broken-link check) and llms-full.txt, Markdown versions of pages, agent and API discovery files (MCP, A2A agent card, RFC 9727 API catalog, OpenAPI), RSS/Atom feeds, sitemap size and freshness, and Organization/WebSite schema. Gives a starter llms.txt when missing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website or page URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Agent readiness check (llms.txt and more)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:82c1d44fa8adbc14f3c9d98f69b753d9f4d89bd62e81d7f3f55452eb08e485d7"
        },
        {
          "name": "ai_crawler_check",
          "title": "AI crawler access check",
          "description": "Check whether AI and search crawlers (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, PerplexityBot, Googlebot, Google-Extended, Bingbot, CCBot and more) can reach a page: robots.txt rules per bot, noindex/X-Robots-Tag directives, a user-agent probe for firewall/CDN blocks, sitemap and llms.txt presence, which bots publish IP ranges for allowlisting, and AI usage preferences (Cloudflare Content-Signal, IETF Content-Usage, TDMRep, noai). Use when someone asks why they don't show up in ChatGPT/Perplexity/AI answers, or whether they block AI bots. Follows RFC 9309 robots.txt rules and the operators' published crawler docs, e.g. https://developers.openai.com/api/docs/bots and https://docs.perplexity.ai/guides/bots.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public page URL or domain",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AI crawler access check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f3ae5c9f95d91cbef18eb0fe98a51cf0404b8f6f795af3f7aaed4de8bac53d68"
        },
        {
          "name": "ai_render_check",
          "title": "What AI crawlers see (raw HTML check)",
          "description": "Show what AI crawlers that don't run JavaScript (GPTBot, ClaudeBot, PerplexityBot, CCBot) actually see on a page: readable words in the raw HTML, title, meta description, H1 and headings, JSON-LD, images without alt text, and whether the page is a JavaScript app shell that looks empty to them. Use when someone asks why AI assistants don't mention or cite a page, or whether a React/Next/Webflow/Shopify page is readable by AI.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public page URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What AI crawlers see (raw HTML check)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f61262a0e79abd58cadf532cc1af22f3636b7d8b6765308dee51ba799c3d2fd9"
        },
        {
          "name": "authority_check",
          "title": "Authority and popularity (Tranco, Open PageRank)",
          "description": "Compare up to 10 domains (a site and its competitors) by Tranco popularity rank (top 1M sites). A free stand-in for domain authority. Uses the Tranco API (https://tranco-list.eu).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "Domains to compare, e.g. [\"example.com\", \"competitor.com\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Authority and popularity (Tranco, Open PageRank)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a4988a6dac9c235a0dfc66cc92bfc22ccf37379577c115a9ae8f3bed70c11a9e"
        },
        {
          "name": "cwv_trend",
          "title": "Core Web Vitals trend (last 40 weeks)",
          "description": "Show how a site's real-user Core Web Vitals (LCP, INP, CLS, FCP, TTFB) changed over the last ~40 weeks, from the Chrome UX Report History API. Use for 'are we getting faster?', before/after a redesign or migration, or comparing then vs now. Pass a homepage for the whole site (origin) or a deeper URL for that page; falls back to the origin when the page has too little traffic. Uses the Chrome UX Report History API (https://developer.chrome.com/docs/crux/history-api).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "device": {
                "default": "phone",
                "enum": ["phone", "desktop", "all"],
                "type": "string"
              },
              "url": {
                "description": "Public URL or domain, e.g. example.com or https://example.com/pricing/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Core Web Vitals trend (last 40 weeks)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b26688b2f2f33eae7b30ccab941a449c5e85ff179710b2b1601236acdb11b656"
        },
        {
          "name": "data_connections",
          "title": "Connect your data (setup status)",
          "description": "Explain how to connect the user's own Google Search Console, GA4 and Bing Webmaster Tools data to AlchemyAgent. This free connector has no account, so it can't hold connections; use this when someone asks about their own search traffic, queries or analytics.",
