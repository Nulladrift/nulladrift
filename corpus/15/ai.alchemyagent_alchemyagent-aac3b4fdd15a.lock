          "digest": "sha256:d36c0955e8e502ef6ad851ceaa00c3a964d727c05fe28839f8fd536ec3ddabf1"
        },
        {
          "name": "entity_check",
          "title": "Brand entity check (Wikidata)",
          "description": "Check how a brand appears in Wikidata, the open knowledge base that Google's Knowledge Graph and AI assistants draw brand facts from. Finds the item by the site's official website (or by brand name), lists its facts (description, type, founding date, headquarters, social profiles, Wikipedia article), flags gaps, and checks whether the homepage's Organization schema links to it in sameAs. Uses the Wikidata API and query service (https://www.wikidata.org/wiki/Wikidata:Data_access).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand_name": {
                "description": "Brand name, used if no Wikidata item lists the website",
                "type": "string"
              },
              "url": {
                "description": "The brand's website, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Brand entity check (Wikidata)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bed07e4fd51d34066e597bc4224b19786e4919ea008eb53c85208816c12bc772"
        },
        {
          "name": "gsc_query_classifier",
          "title": "Find AI-assistant queries in Search Console",
          "description": "Classify a Google Search Console queries export to find AI-assistant traffic: conversational prompts, follow-up pivots, AI-visibility tracker probes, agent prompts, pasted strings and chat reply artefacts, with impressions per bucket. Export from Search Console > Performance > Export > CSV and pass the contents of Queries.csv as csv_text. Processed in memory and not stored. Also returns candidate queries that the rules can't classify on their own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "csv_text": {
                "description": "The contents of Queries.csv from a Search Console export",
                "type": "string"
              }
            },
            "required": ["csv_text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find AI-assistant queries in Search Console"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:666e39f684d65e8796d016c832299e80e7f6c2739b3ea704ac474447acf647e0"
        },
        {
          "name": "pagespeed_check",
          "title": "PageSpeed and Core Web Vitals check",
          "description": "Run Google PageSpeed Insights on a public URL. Returns real-user Core Web Vitals (LCP, INP, CLS from the Chrome UX Report), the Lighthouse performance score, lab metrics and the biggest speed opportunities. Use when someone asks if a site is slow, about Core Web Vitals, or for a PageSpeed score. Uses the Google PageSpeed Insights API v5 (https://developers.google.com/speed/docs/insights/v5/get-started).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "strategy": {
                "default": "mobile",
                "description": "Device to test. Google indexes mobile-first, so mobile is the default.",
                "enum": ["mobile", "desktop", "both"],
                "type": "string"
              },
              "url": {
                "description": "Public page URL, e.g. https://example.com/ or example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "PageSpeed and Core Web Vitals check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8163c4314e078259126a9fe8a77421bd25c445da3f71ace0a239accddd15c0fc"
        },
        {
          "name": "schema_check",
          "title": "Structured data (schema) check",
          "description": "Check a page's JSON-LD structured data against Google's rich-result requirements for common types (Organization, LocalBusiness, Product, Article, FAQPage, BreadcrumbList, Review, Event, VideoObject, Service, JobPosting and more). Flags invalid JSON, missing required properties, relative URLs, non-ISO dates, dangling @id references, duplicate entities from two plugins, and self-serving reviews. Rules follow Google Search structured data docs (https://developers.google.com/search/docs/appearance/structured-data/search-gallery).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public page URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Structured data (schema) check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d5e257fcc34bdc1e3030e2a8c725c8b369906e6edbaee1b5095558fdc0b4abc1"
        },
        {
          "name": "security_headers",
          "title": "Security headers check",
          "description": "Grade a site's security headers with Mozilla HTTP Observatory and list exactly which headers are missing or weak (HSTS, Content-Security-Policy, X-Content-Type-Options, frame protection, Referrer-Policy, Permissions-Policy), plus HTTPS and cookie flags. Uses the Mozilla HTTP Observatory API v2 (https://developer.mozilla.org/en-US/observatory/docs/faq).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public URL or domain",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Security headers check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7bd8245cfa03eebcc7e8c26722a745e7be3fe404ca41ef372a53ed266f9b366c"
        },
        {
          "name": "wikipedia_presence",
          "title": "Wikipedia presence",
          "description": "Find Wikipedia articles (in the 10 largest language editions) that link to a domain, and the brand's own Wikipedia article page views over the last 12 months (found through Wikidata). Use for brand authority, digital PR and 'are we cited on Wikipedia?' questions. Uses the MediaWiki API and Wikimedia Pageviews API (https://www.mediawiki.org/wiki/API:Exturlusage).",
          "inputSchema": {
