                  "additionalProperties": false,
                  "properties": {
                    "symbol_exchange": {
                      "pattern": "^[A-Z0-9][A-Z0-9.-]{0,31}-[NQABTI]$",
                      "type": "string"
                    },
                    "weight": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["symbol_exchange", "weight"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "right": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "symbol_exchange": {
                      "pattern": "^[A-Z0-9][A-Z0-9.-]{0,31}-[NQABTI]$",
                      "type": "string"
                    },
                    "weight": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["symbol_exchange", "weight"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
