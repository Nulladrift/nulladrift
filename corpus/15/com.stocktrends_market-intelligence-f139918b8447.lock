        {
          "name": "stocktrends_compare_portfolios",
          "title": "Compare Stock Trends Portfolios",
          "description": "Purchase the API's analytical comparison of two supplied portfolios. It does not execute trades or manage assets.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "left": {
