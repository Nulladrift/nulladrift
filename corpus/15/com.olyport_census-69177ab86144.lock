        {
          "name": "get_tract_data",
          "description": "Get tract-level ACS data for any variables within a county.\n\n    This is a flexible tool for querying any ACS 5-year estimate variables at\n    the census tract level. Automatically batches requests if more than 50\n    variables are requested.\n\n    Common variable examples:\n    - B01001_001E: Total population\n    - B19013_001E: Median household income\n    - B17001_002E: Population below poverty level\n    - B25077_001E: Median home value\n    - B02001_002E-008E: Race breakdown\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County, WA).\n        variables: Comma-separated ACS variable codes (e.g. 'B01001_001E,B19013_001E').\n                   NAME is always included automatically.\n        year: ACS 5-year estimate year (default 2022).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "variables": {
                "title": "Variables",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["county_fips", "state", "variables"],
            "title": "get_tract_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_tract_dataOutput",
            "type": "object"
          },
