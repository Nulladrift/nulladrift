        {
          "name": "get_commuting_data",
          "description": "Get means of transportation to work data for counties.\n\n    Returns worker counts and percentages for: drove alone, carpooled,\n    public transit, walked, bicycle, taxi/motorcycle/other, and worked from home.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'CA') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County).\n                     Omit to get all counties in the state.\n        year: ACS 5-year estimate year (default 2022).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_commuting_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_commuting_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2515fb421611fc1d11330573829927dd7c3dbfb7fb6f3bfea2e4d57b376d196"
        },
        {
          "name": "get_county_demographics",
          "description": "Get demographic data for counties: population, median age, race, Hispanic origin, income, and poverty.\n\n    Returns one record per county with total population, median age, racial breakdown\n    (White, Black, American Indian, Asian, Pacific Islander, Other, Two+),\n    Hispanic/Latino percentage, median household income, and poverty rate.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'CA') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County).\n                     Omit to get all counties in the state.\n        year: ACS 5-year estimate year (default 2022). Data covers year-4 through year.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_county_demographicsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_demographicsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ae8a83f32e62f83449f5304f16295f415f4e447930fcec136ad79f22fcf6685"
        },
        {
          "name": "get_county_economics",
          "description": "Get economic data for counties: income, poverty, home values, rent, and health insurance.\n\n    Returns median household income, poverty rate, median home value, median gross rent,\n    and health insurance coverage rates (insured vs uninsured).\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'CA') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County).\n                     Omit to get all counties in the state.\n        year: ACS 5-year estimate year (default 2022).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
