{
  "lockfileVersion": 2,
  "subjects": {
    "com.fixedqr/fixedqr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fixedqr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fixedqr",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_dynamic_code",
          "description": "Create an editable (dynamic) QR code that redirects via fixedqr.com/r/<id>. Requires a FixedQR API key (Authorization: Bearer fq_...) and an active plan. The redirect keeps working even if the plan lapses.",
          "inputSchema": {
            "properties": {
              "label": {
                "type": "string"
              },
              "target": {
                "description": "Destination URL (https)",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a68c973d79a066de516dabf32bb11146c367c601321e63ace328a65250ac9e92"
        },
        {
          "name": "generate_qr",
          "description": "Generate a static QR code (never expires; content encoded directly, no redirect). Returns an image (PNG) or SVG text.",
          "inputSchema": {
            "properties": {
              "bg": {
                "default": "#ffffff",
                "type": "string"
              },
              "data": {
                "description": "URL or text (for url/text types)",
                "type": "string"
              },
              "ec": {
                "default": "M",
                "enum": ["L", "M", "Q", "H"],
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "encryption": {
                "enum": ["WPA", "WEP", "nopass"],
                "type": "string"
              },
              "fg": {
                "default": "#000000",
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "format": {
                "default": "png",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "hidden": {
                "type": "boolean"
              },
              "last_name": {
                "type": "string"
              },
              "org": {
                "type": "string"
              },
              "password": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "size": {
                "default": 512,
                "maximum": 2048,
                "minimum": 64,
                "type": "integer"
              },
              "ssid": {
                "type": "string"
              },
              "type": {
                "default": "url",
                "enum": ["url", "text", "wifi", "vcard"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b1fb6257b1cd33a1ba5984b1d158d3ac31bed6584b7ac3dcd933c9a0bb8d7ea"
        },
        {
          "name": "update_dynamic_code",
          "description": "Change the destination or label of an editable QR code you own. Requires a FixedQR API key and an active plan.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "label": {
                "type": "string"
              },
              "target": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d9f2b519e378899ae13c24ff5bfe246bf94eace259a88449e88d99bf3d8c6d1"
        }
      ],
      "digest": "sha256:a800d3884433f81c81ba4a19d0d3faaa9da2761627fc54f73889a22b391bb730"
    }
  }
}
