      "serverInfo": {
        "name": "invest-like",
        "version": "4.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "invest-like explains 21,000+ stocks in 60+ countries in plain English, from its own daily data: is the company profitable, growing, fairly priced and carrying debt, each from a fixed published rule with the real number shown. Use explain_stock when one company comes up, check_value when the user asks if it is a good buy, undervalued or expensive, compare_stocks for 2 to 4, score_portfolio for holdings the user owns, find_stocks for lists by a rule, check_rulebook for a famous investor's published rules, and check_halal for halal questions. Use only the figures the tools return. The seven investors appear only as published rules applied by invest-like, never as their own opinion. It is educational research, not investment advice: describe what the numbers say and what the price assumes, and never tell the user to buy, sell or hold.",
      "tools": [
        {
          "name": "check_halal",
          "title": "Check if stocks are halal",
          "description": "Use this when the user asks whether one or more stocks are halal, Shariah-compliant or permissible for a Muslim investor. Takes 1 to 10 tickers or company names and shows invest-like's AAOIFI-based screen for each: halal, questionable or not halal, the reason in plain words, the business test and interest-bearing debt as a share of market value. A screen, not a fatwa.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stocks": {
                "description": "1 to 10 tickers or company names",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["stocks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Halal screen done",
            "openai/toolInvocation/invoking": "Running the halal screen…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:522fff438ce3f8068d443dc825027becae3d31f86ce721ecf4329ea7de3110ed"
        },
        {
          "name": "check_rulebook",
          "title": "Check a stock against investors' published rules",
          "description": "Use this when the user asks whether a stock fits a famous investor's style or rules ('would Buffett like X', 'does X pass Graham's rules', 'Lynch checklist for X'). Shows how the company does against seven investors' published rulebooks as applied by invest-like (Warren Buffett, Charlie Munger, Benjamin Graham, Philip Fisher, Peter Lynch, Joel Greenblatt, Terry Smith): a fit from 0 to 100 for each, and, for one named investor, each rule with the company's real value and whether it is met. These are published rules applied by invest-like, never the investor's own opinion of the stock.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "investor": {
                "description": "Show this investor's rules one by one",
                "enum": ["buffett", "munger", "graham", "fisher", "lynch", "greenblatt", "smith"],
                "type": "string"
              },
              "stock": {
                "description": "Ticker or company name, e.g. 'NVDA', 'Coca-Cola' or 'SAP.DE'",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Rulebooks checked",
            "openai/toolInvocation/invoking": "Checking the rulebooks…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:467b43349679b1160d700f2c62876b19681c0998c2cf193887ec3648895ca8cd"
        },
        {
          "name": "check_value",
          "title": "Check if a stock looks undervalued",
          "description": "Use this when the user asks whether a stock is a good buy, a good investment, worth buying, undervalued, overvalued, cheap, expensive, or worth it at today's price. Shows invest-like's answer to 'Is it undervalued?' from a fixed, published rule, with the numbers behind it (P/E against its peers, price to free cash flow, earnings yield, sales growth), short answers on financial health, moat and dividend safety, and, when a stored AI analysis exists, what today's price expects. It never says buy or sell: use it to explain what the price assumes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stock": {
                "description": "Ticker or company name, e.g. 'NVDA', 'Coca-Cola' or 'SAP.DE'",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Price checked",
            "openai/toolInvocation/invoking": "Checking the price…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:69ae49d994aa2be501b58b7e7cc875a05b83c34c04510a9227bba7ba7066a937"
        },
        {
          "name": "compare_stocks",
          "title": "Compare stocks side by side",
          "description": "Use this when the user names 2 to 4 stocks and asks which is better, to compare them, or writes 'X or Y' / 'X vs Y' (e.g. 'Visa or Mastercard?', 'Apple vs Microsoft'). Shows them side by side: the four plain checks (profit, growth, price, debt), sales growth, net margin, return on capital, P/E, debt, dividend, one-year price change and market value, with the stronger figure marked, plus the halal result and the rulebooks met.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stocks": {
                "description": "2 to 4 tickers or company names",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["stocks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Comparison ready",
            "openai/toolInvocation/invoking": "Putting them side by side…",
