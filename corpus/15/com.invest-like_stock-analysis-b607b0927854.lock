            }
          },
          "digest": "sha256:ccdc41754ff3e85fdffeb65f7b9311b20cf6c951720bd148dfb00da4ecc1c029"
        },
        {
          "name": "explain_stock",
          "title": "Explain a stock in plain English",
          "description": "Use this when the user asks about one company or ticker in general: 'tell me about X', 'what does X do', 'how is X doing', 'explain X stock', its price, chart or business. Shows invest-like's stock page in a card: price and one-year chart, one plain sentence, four checks with the numbers behind them (is it profitable, growing, fairly priced, carrying debt), strengths, risks, what to watch, the halal result, how many of seven investors' published rulebooks it meets, and invest-like's stored AI analysis when one exists. Covers 21,000+ stocks in 60+ countries, refreshed daily. For 'is X a good buy' or 'is X undervalued' use check_value instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stock": {
                "description": "Ticker or company name, e.g. 'NVDA', 'Coca-Cola' or 'SAP.DE'",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Stock explained",
            "openai/toolInvocation/invoking": "Reading the stock page…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:097d00768ed11768eb9dbed18e4af13bbc060d5c3e3e44e1ca903602c968cafe"
        },
        {
          "name": "find_stocks",
          "title": "Find stocks by a rule",
          "description": "Use this when the user asks for stock ideas or a list by a rule: stocks that meet an investor's published rules (rulebook: buffett (Warren Buffett), munger (Charlie Munger), graham (Benjamin Graham), fisher (Philip Fisher), lynch (Peter Lynch), greenblatt (Joel Greenblatt), smith (Terry Smith)), one of invest-like's published daily lists (list), or number filters such as P/E below 15, net margin above 20%, dividend yield above 3%, sales growth above 10%, with an optional sector, country and halal-only. Use exactly one of rulebook, list or filters. Lists come only from invest-like's data, never from memory. Results are screen results, not recommendations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code, e.g. US, DE, GB",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "filters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "metric": {
                      "enum": ["market_value", "pe", "net_margin", "gross_margin", "sales_growth", "return_on_capital", "dividend_yield", "net_debt_to_ebitda", "return_1y"],
                      "type": "string"
                    },
                    "op": {
                      "enum": ["above", "below"],
                      "type": "string"
                    },
                    "value": {
                      "description": "Percent metrics in percent (20 = 20%), market value in USD, P/E and net debt / EBITDA as plain numbers",
                      "type": "number"
                    }
                  },
                  "required": ["metric", "op", "value"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "halal_only": {
                "description": "Only stocks that pass the halal screen",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to show (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "description": "One of invest-like's published lists: strongest-moat, highest-roic, cheapest-pe, cheapest-peg, highest-fcf-yield, safest-dividend, lowest-debt, highest-gross-margin, highest-buyback-yield, halal-top-picks, magic-formula-top-30, consistent-compounders",
                "enum": ["highest-roic", "cheapest-pe", "highest-fcf-yield", "safest-dividend", "strongest-moat", "lowest-debt", "highest-gross-margin", "cheapest-peg", "highest-buyback-yield", "halal-top-picks", "magic-formula-top-30", "consistent-compounders"],
                "type": "string"
              },
              "order": {
                "enum": ["highest", "lowest"],
                "type": "string"
              },
              "rulebook": {
                "description": "Stocks that meet this investor's published rules, e.g. 'graham' for 'stocks that pass Benjamin Graham's rules'",
                "enum": ["buffett", "munger", "graham", "fisher", "lynch", "greenblatt", "smith"],
                "type": "string"
              },
              "sector": {
                "enum": ["technology", "financials", "healthcare", "consumer-staples", "consumer-discretionary", "communication-services", "industrials", "energy", "utilities", "real-estate", "materials"],
                "type": "string"
              },
              "sort": {
                "description": "For filters: the figure to sort by (default market value)",
                "enum": ["market_value", "pe", "net_margin", "gross_margin", "sales_growth", "return_on_capital", "dividend_yield", "net_debt_to_ebitda", "return_1y"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Screen ready",
            "openai/toolInvocation/invoking": "Screening 21,000+ stocks…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:67dea096947cbea5b5ad6c9cb1fb5213482da352f5f1ac750910b95bdf655c7a"
        },
        {
          "name": "score_portfolio",
          "title": "Score a portfolio",
          "description": "Use this when the user shares the stocks or funds they own (a portfolio, holdings, 'my stocks', a broker list) and wants to know how it looks, a score, or what to watch. Takes up to 60 holdings, each a ticker or company name with optional shares or money amount. Returns invest-like's portfolio score from 0 to 100 (quality, value, growth, safety, spread), a plain read of the whole portfolio, its weights, how its P/E, margin, growth and dividend compare with the 500 largest US companies, one strength and one thing to watch. ETFs such as VOO or VWCE are supported. No login or personal data needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of the amounts and the report (default USD)",
                "enum": ["USD", "EUR", "GBP", "CHF", "CAD", "AUD", "JPY", "INR", "SEK", "NOK", "DKK", "HKD", "SGD"],
                "type": "string"
              },
              "halal": {
                "description": "true when the user cares whether the holdings are halal",
                "type": "boolean"
              },
              "holdings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Money in this holding, in the portfolio currency, if the user gave it",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "shares": {
                      "description": "Number of shares, if the user gave it",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "stock": {
                      "description": "Ticker, fund or company name",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["stock"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://invest-like/card-v14.html",
            "openai/toolInvocation/invoked": "Portfolio scored",
            "openai/toolInvocation/invoking": "Scoring your portfolio…",
            "ui": {
              "resourceUri": "ui://invest-like/card-v14.html"
            }
          },
          "digest": "sha256:1a37f67f2084b7e1f9ffc61fcde6b4e88bfd7600c3c5577c6b6b41c822630e93"
        }
