        },
        {
          "name": "buffett_value",
          "title": "Buffett Value Scan",
          "description": "Find high-quality US public companies trading below intrinsic value:\nthe Quality Score (see buffett_scan) combined with a value score from the\nprevious close (FCF yield, 10-year owner-earnings DCF margin of safety,\nP/E), ranked by combined_score, the mean of the two (0-100 each). Rows\nalso carry market cap, owner-earnings yield and intrinsic value. Use\nbuffett_scan for quality alone; it needs no price data. Foreign private\nissuers (20-F filers, e.g. Chinese ADRs) are excluded by default: they\nscreen cheap for structural reasons fundamentals cannot see. Methodology\nv3; heuristic screen, not investment advice.\nCost: $0.25 per call; unpaid calls return a payment-required error.",
          "inputSchema": {
            "properties": {
              "exclude_foreign": {
                "default": true,
                "description": "Exclude foreign private issuers (20-F filers); set false to include them.",
                "title": "Exclude Foreign",
                "type": "boolean"
              },
              "fy": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Fiscal year of the published Quality Scores; omit for the latest. A year that isn't published returns an error listing the published years.",
                "title": "Fy"
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "2-digit SIC industry group, e.g. 73 (business services, including software); omit for every industry.",
                "title": "Industry"
              },
              "limit": {
                "default": 25,
                "description": "Maximum companies to return, 1-200.",
                "title": "Limit",
                "type": "integer"
              },
              "min_margin_of_safety": {
                "default": 0,
                "description": "Minimum DCF margin of safety (1 - market cap / intrinsic value), e.g. 0.2 for a price 20% below intrinsic value; 0 keeps companies at or below intrinsic value.",
                "title": "Min Margin Of Safety",
                "type": "number"
              },
              "min_revenue": {
                "default": 1000000000,
                "description": "Minimum annual revenue in USD, e.g. 1e9.",
