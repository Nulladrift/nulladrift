      },
      "instructions": "SEC Fundamentals API — normalized SEC EDGAR financial data on 20,000+ US public companies, refreshed nightly. Paid per call: company lookups $0.005-$0.05; aggregates/screens $0.05-$0.10; curated insights, standard scores and signal screens $0.15; Buffett quality/value scans and top_signals $0.25. Pass your API key as the X-API-Key header on this MCP connection, or use the self-paying stdio server (https://sec.multyplylabs.com/mcp-server.py) to pay in USDC via x402. Company tools take an SEC CIK: when you only have a ticker or company name, call lookup_company first (free), e.g. AAPL -> 320193. To discover companies by criteria rather than by name, call screen_companies or market_insight with top_companies.",
      "tools": [
        {
          "name": "buffett_scan",
          "title": "Buffett Quality Scan",
          "description": "Rank US public companies by Quality Score (0-100) over a 10-year\nwindow from five components: return on invested capital (30 points,\nblended 60/40 with the company's industry percentile), durability\nthrough the cycle (20), cash conversion (20), balance-sheet strength (15)\nand capital discipline (15). Every component is explainable from the\nreturned row (roic_median, fcf_conversion, net_debt_to_ebit, ...); a\ncomponent with no usable data is dropped and the rest renormalized.\nCompanies that stopped filing (4,313), have fewer than five fiscal years\non file (1,702), lack the tags to measure returns on capital in enough of\nthose years -- missing EBIT tags, or an unclassified balance sheet,\ncommon among homebuilders and industrials with captive finance arms\n(1,612) -- or are balance-sheet financials (banks, insurers, REITs;\n1,539) are not scored and do not appear: 2,885 of 12,051 companies\n(roughly a quarter of all filers, ~37% of active ones) are scored today.\nUse it for price-independent quality; use buffett_value to add\nvaluation. Methodology v3; heuristic screen, not investment advice.\nCost: $0.25 per call; unpaid calls return a payment-required error.",
          "inputSchema": {
            "properties": {
              "exclude_foreign": {
                "default": true,
                "description": "Exclude foreign private issuers (20-F filers); set false to include them.",
                "title": "Exclude Foreign",
                "type": "boolean"
              },
              "fy": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Fiscal year of the published Quality Scores; omit for the latest. A year that isn't published returns an error listing the published years.",
                "title": "Fy"
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "2-digit SIC industry group, e.g. 73 (business services, including software); omit for every industry.",
                "title": "Industry"
              },
              "limit": {
                "default": 25,
                "description": "Maximum companies to return, 1-200.",
                "title": "Limit",
                "type": "integer"
              },
              "min_revenue": {
                "default": 1000000000,
                "description": "Minimum annual revenue in USD, e.g. 1e9.",
                "title": "Min Revenue",
                "type": "number"
              },
              "min_score": {
                "default": 60,
                "description": "Minimum Quality Score, 0-100.",
                "title": "Min Score",
                "type": "integer"
              }
            },
            "title": "buffett_scanArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "buffett_scanOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
