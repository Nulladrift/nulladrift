        {
          "name": "standard_score",
          "title": "Standard Fundamental Scores",
          "description": "Academic fundamental scores across US public companies, chosen by\nname: piotroski (F-Score 0-9, financial strength), altman_z\n(bankruptcy-risk zones), beneish_m (elevated M-Score: an\naccounting-quality screen, not evidence of manipulation), magic_formula\n(Greenblatt rank on earnings yield and return on capital) or accruals\n(Sloan earnings quality). Each company is scored on its own latest fiscal\nyear (fiscal_year per row); fy selects the cohort whose latest scored\nyear is fy -- it does not re-score companies on an earlier year. Use\ncompany_signal for one company's quality, value and sentiment factors\ntogether. Peer-reviewed formulas; not investment advice.\nCost: $0.15 per call; unpaid calls return a payment-required error.",
          "inputSchema": {
            "properties": {
              "exclude_foreign": {
                "default": true,
                "description": "Exclude foreign private issuers (20-F filers); set false to include them.",
                "title": "Exclude Foreign",
                "type": "boolean"
              },
              "flagged_only": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "beneish_m only: omit or true for elevated M-Scores only; false for every score.",
                "title": "Flagged Only"
              },
              "fy": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cohort to return: companies whose latest scored fiscal year is fy (they are not re-scored on an earlier year). Omit for every company on its own latest year. A year no company is scored on returns an error listing the available years.",
                "title": "Fy"
              },
              "limit": {
                "default": 25,
                "description": "Maximum companies to return, 1-200.",
                "title": "Limit",
                "type": "integer"
              },
              "min_revenue": {
                "default": 1000000000,
                "description": "Minimum annual revenue in USD, e.g. 1e9.",
                "title": "Min Revenue",
                "type": "number"
              },
              "min_score": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "piotroski only: minimum F-Score, 0-9; omit for 7.",
                "title": "Min Score"
              },
              "name": {
                "description": "Score to rank by: piotroski, altman_z, beneish_m, magic_formula or accruals.",
                "title": "Name",
                "type": "string"
              },
              "worst": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "accruals only: true ranks the highest accrual ratios (lowest earnings quality) first; omit or false ranks the lowest first.",
                "title": "Worst"
              },
              "zone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "altman_z only: safe, grey or distress; omit for every zone, most distressed first.",
                "title": "Zone"
              }
            },
            "required": ["name"],
            "title": "standard_scoreArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "standard_scoreOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Standard Fundamental Scores"
          },
          "behavior": {
