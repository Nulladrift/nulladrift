        {
          "name": "market_insight",
          "title": "Market-Wide Insight",
          "description": "Curated analysis computed live across all US public companies, chosen\nby name: top_companies (rank by a metric, optionally within an\nindustry), movers (largest change in a metric between fy_from and fy_to),\nsector_landscape (margin medians per industry), metric_trend (yearly sum,\nmedian or mean of a metric), capital_returns (buybacks vs dividends by\nsize bucket) or filing_velocity (monthly filing counts for a form type).\nEach parameter's description says which analyses read it; the response\nreports the fiscal year(s) used. Use screen_companies for your own\ncriteria and standard_score for F-Score, Z-Score and similar scores.\nCost: $0.15 per call; unpaid calls return a payment-required error.",
          "inputSchema": {
            "properties": {
              "agg": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "metric_trend only: sum (the default), median or mean.",
                "title": "Agg"
              },
              "form": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "filing_velocity only: form type to count, e.g. 8-K (the default).",
                "title": "Form"
              },
              "fy": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Fiscal year for top_companies, sector_landscape and capital_returns, and the default end year for movers and metric_trend; omit for the current fiscal year.",
                "title": "Fy"
              },
              "fy_from": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Start year for movers (default fy - 2) and metric_trend (default 2015).",
                "title": "Fy From"
              },
              "fy_to": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "End year for movers and metric_trend (default fy).",
                "title": "Fy To"
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "top_companies only: 2-digit SIC industry group, e.g. 73; omit for every industry.",
                "title": "Industry"
              },
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum rows for top_companies and movers, 1-200 (default 25).",
                "title": "Limit"
              },
              "metric": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Metric for top_companies, movers and metric_trend, e.g. revenue (the default), gross_margin, research_development.",
                "title": "Metric"
              },
              "min_revenue": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum annual revenue in USD for movers (default 1e9) and sector_landscape (default 1e8).",
                "title": "Min Revenue"
              },
              "months": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "filing_velocity only: months of history, default 18, up to 120.",
                "title": "Months"
              },
              "name": {
                "description": "Analysis to run: top_companies, movers, sector_landscape, metric_trend, capital_returns or filing_velocity.",
                "title": "Name",
                "type": "string"
              }
