      },
      "transport": {
        "type": "http",
        "url": "https://direct.allpaintingsstore.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "allpaintingsstore-art-search",
        "title": "AllPaintingsStore Trade Art Catalog",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search the AllPaintingsStore art catalog and get reproduction price quotations. Tools: search_artworks (artwork title / artist name / description), search_artists (name, place, optionally a year the artist was alive), search_museums (name, city, country), search_articles (text, optional category), search_fts (a name or keywords across all four models at once, max 10 results each), get_detail_artwork / get_detail_artist / get_detail_museum / get_detail_article (the full data of one object by pk, with useful page links — call after a search), get_quotation (price for a print or hand-painted oil reproduction of an artwork at a given size and currency; optional frame_code includes the frame in the price), and get_custom_reproduction_quotation (same price quotation from only size, type and currency — for the customer's own image, or an artwork the catalog does not have), and get_artwork_availability (is this artwork itself for sale NOW, and at what price: ready-made oil paintings in stock, auction lots, originals sold by their owner, studio collectibles — with stock quantity, size and order link; or list the objects of one of those channels). All URLs returned are absolute on the website you are querying; each search result carries a \"score\" relevance value. search_sections_semantically returns the whole passages of our texts (articles, and the museum / artist / artwork descriptions indexed on this server) closest in meaning to a question - use it to ground an answer in what our site says.",
      "tools": [
        {
          "name": "find_artwork_in_catalog",
          "title": "Is this artwork in the catalog? (title from memory, artist, description)",
          "description": "ONE call that says whether a work is in our catalog, for a visitor who cannot name it exactly: a half-remembered or translated title, an artist, a description of the picture — or several of them. It matches the title words against EVERY work of the artist (not only 10 search results) and runs the full-text search in the visitor's language and English; a description goes through the meaning index. Returns verdict (\"found\", \"candidates\", \"possible_matches_by_meaning\", \"artist_works_listed\" or \"not_in_catalog\"), next_step (what to do now — follow it), candidates (at most 5, best first: pk, artist_name, title, year, url, image_url), and, when an artist was recognised, artist (pk, url, artworks_count, all_artworks_page) and artist_works (the titles of his works, to spot the same work under another title). Use it FIRST, instead of a series of search_artworks with title variants. When you learn the work's real title (from the encyclopedia or the visitor), call it once more with alternative_titles; after that, do not search again.",
          "inputSchema": {
            "properties": {
              "alternative_titles": {
                "description": "Other titles of the same work: the English title, the real title found in the encyclopedia (e.g. \"Pêcheur à la coquille\" for \"le sourire napolitain\").",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "artist": {
                "description": "Artist name, when the visitor gave one.",
                "type": "string"
              },
              "description": {
                "description": "What the picture shows, when the visitor describes it.",
                "type": "string"
              },
              "language": {
                "description": "Site language code (2 letters, e.g. \"en\", \"fr\"). Default \"en\".",
                "type": "string"
              },
              "title": {
                "description": "The title as the visitor gave it (from memory, any language).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this artwork in the catalog? (title from memory, artist, description)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6452dc88e0c329daf5035f329f63b256f77db7e378cdac7d19911552ac6d0271"
        },
        {
          "name": "get_artwork_availability",
          "title": "Is this artwork available now, and at what price (stock, auction, originals, collectibles)",
          "description": "Every way to buy ONE artwork right now, on every sales channel it sells: the physical objects first — a ready-made oil painting in stock (\"Stock Discount Oil Painting\", a real canvas that ships within 48 hours), an auction lot (current bid, minimum next bid, closing time), an original sold by its owner, a studio collectible — each with available_now, stock_quantity, price (fixed, shipping included) in your currency, size, buy_url and offer_text (one ready-to-paste line: give it to the customer as is, numbers and link untouched); then the made-to-order channels (hand-painted oil reproduction, art print: price by size through get_quotation) and the digital image licence. available_now is true only when the artwork ITSELF can be bought or bid on today; available_now_summary says it in one sentence. Call it whenever a customer asks whether something is available, in stock, ready to ship, discounted, on auction, or what it costs as a real object — and before any \"yes, it is available\". Identify the artwork by pk, or by title and/or artist_name (exact title first, then a surname-guarded search whose relevance comes back in \"score\"; a \"warning\" means check the returned title). Without pk or title, give channel to LIST the objects of that channel for sale now (cheapest first; optional artist_name, query words from the title, max_price in your currency, limit 1-10): \"what do you have in stock under 200 euros?\", \"which auctions are open?\". Prices follow the strict no-fallback currency rule of the quotation tools.",
          "inputSchema": {
            "properties": {
              "artist_name": {
                "description": "Artist name: with title/pk it identifies the artwork; in the list mode it filters the objects by artist.",
                "type": "string"
              },
              "channel": {
                "description": "List mode (no pk, no title): which physical channel to list — PaintingReady (ready-made oil paintings in stock), ProductAuction (auction lots), SellerProduct (originals sold by their owner), FactoryProduct (studio collectibles). With pk/title it narrows the offers to that channel.",
                "enum": ["ProductAuction", "SellerProduct", "FactoryProduct", "PaintingReady"],
                "type": "string"
              },
              "currency": {
                "description": "ISO currency code, e.g. \"USD\", \"EUR\", \"GBP\".",
                "type": "string"
              },
              "language": {
                "description": "Site language code (2 letters, e.g. \"en\", \"fr\"). Default \"en\".",
                "type": "string"
              },
              "limit": {
                "description": "List mode: how many objects (default 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "List mode: highest price, in the given currency.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "pk": {
                "description": "Artwork pk (from a search tool or the page).",
                "type": "integer"
              },
              "query": {
                "description": "List mode: words from the title (e.g. \"flowers\", \"sunset\").",
                "type": "string"
              },
              "title": {
                "description": "Artwork title (used when pk is not given).",
                "type": "string"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this artwork available now, and at what price (stock, auction, originals, collectibles)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe53d6e3337cbb8e676469176c2a670fd3e60d075089ba33f1679ed4ee464fba"
        },
        {
          "name": "get_custom_reproduction_quotation",
          "title": "Get a custom reproduction price quotation (no catalog artwork needed)",
          "description": "Price quotation for a CUSTOM reproduction — one made from an image the customer supplies (their own photo, or an artwork that is not in the catalog) — as an art print or a hand-painted oil painting. No artwork identification is needed or accepted: the price depends only on the size, the reproduction type and the currency. Use this whenever the artwork cannot be found in the catalog (the search tools return nothing relevant, or get_quotation fails with artwork_not_found), or the customer wants their own picture reproduced. Optional frame_code (\"WhiteWrap\" = stretched on stretcher bars, \"default\" = a decorative frame chosen for you, or a catalog code) adds the frame price to quotation_price; optional senior_artist (oil painting only) adds the \"Elite Senior Artist\" upgrade — more detail and finesse, extra production time. Each side must be 25-250 cm (about 10-98 inches). Returns quotation_price (the base price: options chosen on the order form, like varnish or urgent delivery, cost extra — see \"notes\"), currency, frame_code (+ frame_description, frame_delivery), width_cm/height_cm, notes, and order_page_url — the page where the customer uploads their image and orders the reproduction. Give order_page_url to the user as the link to place this order. For a hand-painted portrait the price covers up to 3 faces; the per-extra-face surcharge is stated in notes.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "ISO currency code, e.g. \"USD\", \"EUR\", \"GBP\".",
                "type": "string"
              },
              "frame_code": {
                "description": "Optional frame; when set, quotation_price includes it. Omit it (or \"NoFrame\") for the canvas rolled in a tube. \"WhiteWrap\" = the canvas stretched on wooden stretcher bars, white edges, no outer frame (use it for any request for a stretcher, stretcher bars, a stretched canvas or a canvas ready to hang without a frame); \"BlurSideWrap\" / \"ExtendedWrap\" = the same with the image blurred / continued around the edges. \"default\" = a decorative outer frame chosen for you (the frame recommended for the artwork when it has one, else our best-selling frame) — use it to quote a framed option without knowing the catalog. Any other catalog code (e.g. \"P118B\", \"P919G\", \"W316G\", \"H24-GOLD-Portrait\") is that specific decorative frame. The result then carries frame_description, frame_delivery (assembled, or a disassembled kit over 105 cm) and, for \"default\", frame_chosen_by. The customer selects that frame on the order form (notes says which).",
                "type": "string"
              },
              "height": {
                "description": "Height in the given unit.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "language": {
                "description": "Site language code (2 letters, e.g. \"en\", \"fr\"). Default \"en\".",
                "type": "string"
              },
              "senior_artist": {
                "description": "Oil painting only: have an Elite Senior Artist paint it (more detail, finesse and extra production time). When true, quotation_price includes the upgrade; the customer selects the option on the order form.",
                "type": "boolean"
              },
              "type": {
                "description": "Reproduction type: \"print\" (art print) or \"oil painting\" (hand-painted).",
                "enum": ["print", "oil painting"],
                "type": "string"
              },
              "unit": {
                "description": "Unit of width/height.",
                "enum": ["inches", "cm"],
                "type": "string"
              },
              "width": {
                "description": "Width in the given unit.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["currency", "type", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a custom reproduction price quotation (no catalog artwork needed)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ec5403e4dab0dd08374da7504cb4e291d08139cc5068756f1e20fb9f7932093"
        },
