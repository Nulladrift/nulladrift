        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Keyword search of ONE model, the articles of the website, with a category filter no other keyword search has. Use it to LIST the articles on a subject; to get the passages that answer a question, use search_sections_semantically. Returns pk, title, url, image_url (absolute URL of the large article image, null when there is none), category_code, meta_description and relevance score.",
          "inputSchema": {
            "properties": {
              "category_code": {
                "description": "Optional article category filter.",
                "enum": ["Video", "Blog", "Testimonial", "Top10", "Top25", "Top10Versus", "Top", "Ebook", "Support", "Misc", "Menu", "Website", "Compare", "QuestionAnswer", "ArtVsArt"],
                "type": "string"
              },
              "language": {
                "description": "Site language code (2 letters, e.g. \"en\", \"fr\"). Default \"en\".",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-10, default 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search in the article texts.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:597919358df53e226a8be7a89505a2b118f20e866080b21853653eb621c3d831"
        },
        {
          "name": "search_artists",
          "title": "Search artists",
