          "title": "Find artworks, artists, museums or articles by meaning",
          "description": "Search by MEANING that returns OBJECTS, not passages: the artworks, artists, museums or articles whose texts are closest in meaning to a text (a description, a paragraph, a section of an article), e.g. \"a woman reading by a window in soft morning light\". The query is a text, not a name. Each result: model, object_pk (use it with the matching get_detail_* tool), object_title, object_url, best_score (cosine of the object's single best passage; higher is closer), score_sum (its matching passages added up) and matched_vectors_count. rank_by \"score_sum\" (default) favours objects matching in many passages; \"best_score\" favours the one passage closest to the text - use it to find the exact work a text is about. Any language works (the texts are in English). Use it when you have a text and want the objects it is about; with a name or keywords, use search_fts; for the passages that answer a question, use search_sections_semantically. Error index_unavailable: fall back to the search_* full-text tools.",
