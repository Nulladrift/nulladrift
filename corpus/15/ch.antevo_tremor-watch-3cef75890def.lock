      "instructions": "Tremor Watch, by Antevo. How many market relationships stopped behaving this week.\n\nEvery Saturday morning the Antevo Tremor Index is written for the week that ended on Friday. It follows 753 pairs of markets in seven families: equity regions, US sectors, credit, bonds, commodities, FX and crypto, and volatility. A pair has stopped behaving when its correlation is two standard deviations away from its own previous two years. The index is the share of pairs doing so, each family weighing the same, read against a normal Friday since 2001 and banded Calm, Elevated, High or Severe. With it: the links coming apart and the links moving closer, the new breaks of the last four weeks, every pair of a week, and every reading since 1997.\n\nUse it when someone asks whether markets are under strain, which relationships are breaking, whether the usual links between markets are holding, or how this week compares with past episodes such as 2008 or 2020.\n\nDescriptive, not a forecast: it measures how many relationships are breaking at once and says nothing about where prices go next. Not investment advice. Public, no account, no personal data.",
      "tools": [
        {
          "name": "get_tremor_breaks",
          "title": "Get tremor breaks",
          "description": "New breaks in the last four weeks of the Antevo Tremor Index, newest first and most unusual first: pairs whose correlation crossed two standard deviations from its own previous two years for the first time after thirteen weeks without a break the same way. Each with its week, the two markets, the family, the direction (strengthening: moving closer; weakening: coming apart), z and the correlation. family narrows to one of Equity regions, US sectors, Credit, Bonds, Commodities, FX and crypto, Volatility; direction to strengthening or weakening.",
          "inputSchema": {
