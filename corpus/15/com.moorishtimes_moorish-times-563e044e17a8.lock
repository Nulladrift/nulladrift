      "instructions": "The Moorish Times (moorishtimes.com) is a bilingual magazine on Moroccan history, heritage, culture and current affairs: French first, with an English edition. Find pieces with search (filters for section, tags and dates), whats_new for a digest, timeline or series to follow a story, site_map and list_tags to browse. Read one with fetch. send_to_newsroom passes a tip or correction to the newsroom, only with the user's consent. Every result carries its page url and publication date, and get_sources gives a piece's own references. A piece with no English edition comes back in French, marked english_edition: false. When search finds nothing close, the magazine has not covered the topic.",
