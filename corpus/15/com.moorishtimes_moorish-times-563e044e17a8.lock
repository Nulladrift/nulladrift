        {
          "name": "search",
          "title": "Search articles and news",
          "description": "Search every article and news brief by words, section, tags, author and date range, in French or English. Accent-insensitive keyword match first, then pieces close in meaning (match: semantic) when keywords find few. An empty query lists the newest pieces first. Returns JSON {results: [{id, title, url, summary, published, ...}], next, total}; next is the cursor for the following page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "author": {
                "description": "An author's slug or name, e.g. amerruki.",
                "type": "string"
              },
              "category": {
                "description": "Section: hist history, cult culture, pol politics, actu current affairs, sport, eco economy.",
                "enum": ["hist", "cult", "pol", "actu", "sport", "eco"],
                "type": "string"
              },
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "fr",
                "description": "Edition: fr (primary) or en.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. zellige, Tanger Med, Guerre des Sables.",
                "type": "string"
              },
              "since": {
                "description": "today, week, month, year, or a date (2026-09-01).",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "newest", "oldest"],
                "type": "string"
              },
              "tags": {
                "description": "Every tag must be present, in French or English, e.g. [\"Casablanca\", \"Finance\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "type": {
                "description": "article for long-form features, news for briefs.",
                "enum": ["article", "news"],
                "type": "string"
              },
              "until": {
                "description": "A date, inclusive.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
