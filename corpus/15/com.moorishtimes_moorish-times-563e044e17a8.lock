        {
          "name": "send_to_newsroom",
          "title": "Message the newsroom",
          "description": "Send the newsroom a story tip, a correction, a rights or advertising request, or another message, on the user's behalf and with their consent. message holds the user's own words; reply_to is their email, for when they want an answer. Without a Bearer token (scope newsroom:send) sends are limited per network.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "story (a tip), correction (an error in a piece, named in page), rights, ads or other.",
                "enum": ["story", "correction", "rights", "ads", "other"],
                "type": "string"
              },
              "language": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "message": {
                "description": "The message, in French or English.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "The moorishtimes.com page it is about, if any.",
                "format": "uri",
                "type": "string"
              },
              "reply_to": {
