        {
          "name": "color_crossmatch",
          "title": "Match a colour across wig brands",
          "description": "Closest equivalent colours in ONE target brand for a known colour from a DIFFERENT brand, using MyHairMail's cross-brand colour mapping. Answers 'what is my shade called in brand X' — relevant when a colour is discontinued or out of stock, or when a shopper knows their shade in one brand and is shopping another. Returns up to 3 matches ranked by similarity (closest > close > approximate) with short tone notes, and when available an example_in_stock_style + product_url in the target brand. Same-brand requests are refused. One source colour and one target brand per call; 'all brands' and wildcards are not supported. Unknown brand: supported_brands is returned. Terms: https://mcp.myhairmailtools.com/terms",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "source_brand": {
                "description": "Brand of the known color, e.g. 'Jon Renau'",
                "type": "string"
              },
              "source_color": {
                "description": "Color code or name, e.g. '12FS8' or 'Shaded Praline'",
                "type": "string"
              },
              "target_brand": {
                "description": "Single brand to match into, e.g. 'Belle Tress'. Wildcards and 'all brands' are not supported.",
                "type": "string"
              }
            },
            "required": ["source_brand", "source_color", "target_brand"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "match": {
                "type": "boolean"
              },
              "matches": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "example_in_stock_style": {
                      "type": "string"
                    },
                    "product_url": {
                      "type": "string"
                    },
                    "similarity": {
                      "enum": ["closest", "close", "approximate"],
                      "type": "string"
                    },
                    "target_brand": {
                      "type": "string"
                    },
                    "target_color": {
                      "type": "string"
                    },
                    "tone_notes": {
                      "type": "string"
                    }
                  },
                  "required": ["similarity", "target_brand", "target_color", "tone_notes"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "retailer": {
                "type": "string"
              },
              "source_brand": {
                "type": "string"
              },
