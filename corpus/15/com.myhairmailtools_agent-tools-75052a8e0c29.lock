      },
      "instructions": "MyHairMail (myhairmail.com) wig retailer tools. Use them for what the Shopify catalog cannot answer: live factory-feed availability per colour (in_stock / backordered / preorder / out_of_stock / discontinued — the catalog reports backordered colours as simply 'available' and omits discontinued ones), the ISO week a colour is expected back, and the closest equivalent shade in another brand. Always pass a specific brand and style (and colour when known) — there are no search, list or bulk tools. If a colour is discontinued or out of stock, follow `next_step` (usually color_crossmatch) to offer an alternative. If a brand is not recognised, the response lists supported_brands. Each colour includes available_quantity (units available now). Read-only: purchase via product_url on myhairmail.com (or Shopify/UCP checkout). Fair-use limits apply: https://mcp.myhairmailtools.com/terms",
      "tools": [
        {
          "name": "check_stock",
          "title": "Check wig stock by colour",
          "description": "Live availability of one wig or hairpiece style at MyHairMail, per colour, from the manufacturer's factory feed (not a nightly sync). Distinguishes backordered and discontinued colours, which the Shopify catalog reports as 'available' or omits. available_quantity is the exact number of units available now (0 when none). availability is one of in_stock | backordered (orderable now, ships when restocked; restock_eta_week given when known) | preorder (new style taking pre-orders: ships when it arrives; available_quantity is 0) | out_of_stock | discontinued (will not restock). Returns price_usd, compare_at_price_usd and a product_url to buy on myhairmail.com. With color: one product; without color: up to 12 colours (has_more=true means query a specific colour). Not found: did_you_mean styles, or supported_brands if the brand is not carried. When a colour is not buyable now, the response includes next_step naming the tool that finds an equivalent. Terms: https://mcp.myhairmailtools.com/terms",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Jon Renau', 'Raquel Welch', 'Belle Tress'",
                "type": "string"
              },
              "color": {
                "description": "Color code or name, e.g. '12FS8' or 'Shaded Praline'. Optional; if omitted, returns per-color availability for up to 12 colors.",
                "type": "string"
              },
              "style": {
                "description": "Style name, e.g. 'Luna', 'Vesper'",
                "type": "string"
              }
            },
            "required": ["brand", "style"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
