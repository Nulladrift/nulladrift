        {
          "name": "get_restock_eta",
          "title": "Get restock week for a colour",
          "description": "Expected back-in-stock week for one colour of a MyHairMail wig that is backordered or out of stock, from live factory availability. restock_eta_week is the Monday (YYYY-MM-DD) of the ISO week of expected arrival; eta_display is human phrasing ('week of Nov 9'). preorder_available=true means it can be ordered now and ships when restocked (for availability=preorder: the new style is open for pre-orders; false means not open yet). discontinued means it will not restock; the response then includes next_step naming the tool that finds an equivalent. For an in_stock colour this confirms availability; available_quantity gives the units available now. Terms: https://mcp.myhairmailtools.com/terms",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Envy', 'Jon Renau'",
                "type": "string"
              },
              "color": {
                "description": "Colour name or code exactly as listed on the product, e.g. 'Prosecco' or 'FS26/31S6'",
                "type": "string"
              },
              "style": {
                "description": "Style name, e.g. 'Charlotte Hand-Tied'",
                "type": "string"
              }
            },
