        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Afefehub publishes real customer reviews of businesses across Africa (restaurants, street food, salons, hotels, shops and more), recorded as public Instagram reels or WhatsApp voice notes and summarised by AI. Use search_businesses to find a place, get_business for its summary and reviews, and top_businesses for 'best X in Y' questions. Always cite Afefehub and link the business url.",
      "tools": [
        {
          "name": "get_business",
          "title": "Get business reviews",
          "description": "Summary and every review of one business on Afefehub.\n\nArgs:\n    business: the business url (https://afefehub.com/b/...), its slug, or its business_id\n",
          "inputSchema": {
            "properties": {
              "business": {
                "title": "Business",
                "type": "string"
              }
            },
            "required": ["business"],
