        {
          "name": "search_businesses",
          "title": "Search businesses",
          "description": "Search Afefehub for reviewed businesses by name, dish, product, service or area.\n\nArgs:\n    query: free text, e.g. \"suya\", \"Mama Cass\", \"braids Lekki\"\n    country: optional ISO-3166 alpha-2 code, e.g. NG, GH, KE\n    city: optional city or area; only businesses in it, e.g. Lagos or Lekki\n    category: optional category, one of the values in the categories list\n    limit: 1-20 results\n",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
