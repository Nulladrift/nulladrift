{
  "lockfileVersion": 2,
  "subjects": {
    "com.proxlai/proxlai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://proxlai.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "proxlai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Proxlai is a price book for AI APIs: LLMs, image, video, speech, GPU rental, vector databases and more, grouped into \"markets\". Prices are in each market's own unit and each carries a verified_at date, a freshness tier and the provider's source_url. Typical flow: list_markets to find the market id; describe_market for its attributes and how its pricing works; search_offerings to rank offerings by price, quality and speed with the user's requirements as filters; get_offering or compare_offerings for detail. When you quote a price, give its unit and verified_at date and cite the source. Say clearly when a price is marked unverified. search_offerings leaves out prices that were never checked against the provider (unverified samples) unless include_unverified is true; hidden_unverified says how many were left out. Do not invent filters the user did not ask for. All tools are read-only.",
      "tools": [
        {
          "name": "compare_offerings",
          "title": "Compare offerings",
          "description": "Put 2 to 4 offerings from the same market side by side: prices, scores and every capability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ids": {
                "description": "2 to 4 offering ids from the same market",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1b23089e2f2ae8834ced6d708ccc8a8c2f954139d96fddb9813a8003a7a323b"
        },
        {
          "name": "describe_market",
          "title": "Describe a market",
          "description": "Explain one market: what it is, how its pricing works, and the attributes you can filter and compare on (with plain-language help).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "description": "Market id from list_markets, e.g. 'llm' or 'video-generation'",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55f248c90d957ee09f4ab04a5856de156eeffc973f93cb584f01784b48e3dec9"
        },
        {
          "name": "get_offering",
          "title": "Get one offering",
          "description": "Full detail for one offering: description, capabilities, current price with its source, and price history.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Offering id from search_offerings, e.g. 'openai/gpt-6-luna'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5260e26613324afe90bc94a386cb4a237de5a217849faca54d7ae02ffabdbd4"
        },
        {
          "name": "list_markets",
          "title": "List AI markets",
          "description": "List every market (kind of AI API) that has prices, with its id and pricing unit. Start here to find the market id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4ae6c688425c9a25a35e2394e9f454e28356fedaa4ceee8e93c81a4b5469036"
        },
        {
          "name": "search_offerings",
          "title": "Search and rank offerings",
          "description": "Rank the offerings in one market by price, quality and speed, with optional requirements and a maximum price. Returns prices with their verification date and source.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filters": {
                "description": "Requirements. Attribute keys come from describe_market. Do not add filters the user did not ask for.",
                "items": {
                  "properties": {
                    "attr": {
                      "description": "Attribute key from the category's attribute list",
                      "type": "string"
                    },
                    "op": {
                      "description": "eq: equals; lte/gte: numeric bounds; in: value is one of a list; has: boolean is true or tag list contains value",
                      "enum": ["eq", "lte", "gte", "in", "has"],
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "string"
                        },
                        {
                          "type": "boolean"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ]
                    }
                  },
                  "required": ["attr", "op", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "include_unverified": {
                "description": "Also rank offerings whose price is an unverified sample, never checked against the provider (default false: left out)",
                "type": "boolean"
              },
              "limit": {
                "description": "How many results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Market id from list_markets",
                "type": "string"
              },
              "maxPrice": {
                "description": "Upper bound in the market's pricing unit (USD)",
                "minimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "score (default): best match for the weights; price: cheapest first; quality: best first",
                "enum": ["score", "price", "quality"],
                "type": "string"
              },
              "weights": {
                "description": "What matters, each 0..1. Default: cost 0.5, quality 0.4, speed 0.1",
                "properties": {
                  "cost": {
                    "description": "How much a lower price matters (0..1)",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "quality": {
                    "description": "How much output quality matters (0..1)",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "speed": {
                    "description": "How much speed / low latency matters (0..1)",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["cost", "quality", "speed"],
                "type": "object"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:720fe4c684453a0bb2c776636d6186a74aaac9c572c5dc3bd636dd81da45ac60"
        }
      ],
      "digest": "sha256:1da2c27b477c1401daec8676003a920bf486981bafaa98cde652e17871c9e803"
    }
  }
}
