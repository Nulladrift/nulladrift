        {
          "name": "qualify_check",
          "description": "Eligibility-navigator: given a household situation (income, size, filing status), return which federal/state benefits & credits the person LIKELY qualifies for but may be missing — each with a confidence tier (LIKELY/VERIFY/UNLIKELY), the exact governing rule cited inline, the verify-date, and the administering body to claim it FREE. Never a guarantee; never files for you.",
          "inputSchema": {
            "properties": {
              "filingStatus": {
                "description": "Tax filing status.",
                "enum": ["single", "mfj", "married"],
                "type": "string"
              },
              "hasAffordableEmployerCoverage": {
                "type": "boolean"
              },
              "householdIncome": {
                "description": "Annual household income (USD).",
                "type": "number"
              },
              "householdSize": {
                "description": "People in household.",
                "type": "number"
              },
              "onQualifyingProgram": {
                "description": "Already on SNAP/Medicaid/SSI/etc.",
                "type": "boolean"
              },
              "retirementContribution": {
                "description": "IRA/401k contributed this year (USD).",
                "type": "number"
              }
            },
            "required": ["householdIncome", "householdSize"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77313d85fcf84d72e7f57625f60b5f8853e77f2977f7ada9b5b05055e035ec83"
        },
