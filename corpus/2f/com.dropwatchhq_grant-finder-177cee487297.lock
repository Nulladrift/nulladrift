              },
              "filingStatus": {
                "type": "string"
              },
              "firstTimeBuyer": {
                "type": "boolean"
              },
              "hasFederalStudentLoans": {
                "type": "boolean"
              },
              "householdIncome": {
                "type": "number"
              },
              "householdSize": {
                "type": "number"
              }
