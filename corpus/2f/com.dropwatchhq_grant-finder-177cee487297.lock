        },
        {
          "name": "charity_care_check",
          "description": "Detect likely eligibility for a nonprofit hospital's charity-care / financial-assistance (501(r)) + state charity-care law + No Surprises Act, from income vs the Federal Poverty Level. FREE PATIENT INFORMATION — this care is free if you qualify; we never charge a patient to access it. Hands off to the hospital's financial-assistance office.",
          "inputSchema": {
            "properties": {
              "billExceedsEstimate": {
                "type": "boolean"
              },
              "gotSurpriseBill": {
                "type": "boolean"
              },
              "hospitalIsNonprofit": {
                "type": "boolean"
              },
              "householdIncome": {
                "type": "number"
              },
              "householdSize": {
                "type": "number"
              },
              "state": {
                "type": "string"
              },
              "wasEmergency": {
                "type": "boolean"
              }
            },
            "required": ["householdIncome", "householdSize"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d876db93f5fe1fd397fc3f8ef7dc87dbb3241303222479ff74d16bfc64129881"
        },
        {
          "name": "citizenship_descent",
          "description": "Detect eligibility for a second citizenship by ancestry (Italy / Ireland / Poland / Germany), citing each country's descent rule + generational limit + the cut-off that most often breaks a claim. INFORMATION + DOCUMENT-CHECKLIST ONLY — recognition is decided by the foreign government; hands off to the consulate / a citizenship attorney.",
          "inputSchema": {
            "properties": {
              "ancestorEmigratedYear": {
                "type": "number"
              },
              "ancestorNaturalizedYear": {
                "description": "Year ancestor naturalized abroad, or 'never'.",
                "type": "string"
              },
              "ancestorPersecuted1933to1945": {
                "description": "Germany Art. 116(2) restoration.",
                "type": "boolean"
              },
              "ancestryCountry": {
                "enum": ["italy", "ireland", "poland", "germany"],
                "type": "string"
              },
              "bornBeforeAncestorNaturalized": {
                "type": "boolean"
              },
              "lineThroughFemaleBefore1948": {
                "description": "Italy 1948-rule: line passes through a woman before 1948.",
                "type": "boolean"
              },
              "nearestQualifyingAncestor": {
                "enum": ["parent", "grandparent", "great-grandparent"],
                "type": "string"
              },
              "parentWasOnForeignBirthsRegister": {
                "description": "Ireland great-grandparent line.",
                "type": "boolean"
              }
            },
            "required": ["ancestryCountry"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6839a7fd0cb73f6725b1243da70b51baeb642ca047efd25daa8fc41562baa6f5"
        },
