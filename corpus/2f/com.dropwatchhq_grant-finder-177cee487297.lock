            "properties": {
              "creditScore": {
                "type": "number"
              },
              "dependents": {
                "type": "number"
              },
              "employerType": {
                "type": "string"
              },
              "event": {
                "enum": ["new-baby", "bought-a-house", "lost-a-job", "moved-states", "started-a-business"],
