        {
          "name": "missed_credits_scan",
          "description": "Detect federal tax credits a household LIKELY qualifies for but commonly never claims — EITC (26 USC 32), Saver's Credit (25B), education AOTC/LLC (25A), Child & Dependent Care (21), and home energy (25C/25D) — each confidence-tiered with the exact IRS pub cited and the FREE IRS Free File / VITA hand-off. Detection & explanation only; never files a return.",
