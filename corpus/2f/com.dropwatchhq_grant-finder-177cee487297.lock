        {
          "name": "life_event_scan",
          "description": "PREMIUM. The reversal mechanic: one life-event trigger (new-baby / bought-a-house / lost-a-job / moved-states / started-a-business) fans out across ALL relevant spine verticals (benefits, missed credits, student-loan relief, DPA) and returns every finding at once — each rule-cited with a free authority hand-off. Pay-per-call via x402 (USDC on Base).",
