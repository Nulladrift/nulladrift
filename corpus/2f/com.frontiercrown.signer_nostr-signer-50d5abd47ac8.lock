        {
          "name": "prepare_event",
          "title": "Prepare exact Nostr event",
          "description": "Validate and bind an exact unsigned Nostr event for user review. This does not sign or publish. Show the user every field before requesting a signature.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "maxLength": 65536,
                    "type": "string"
                  },
                  "created_at": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "kind": {
                    "maximum": 65535,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tags": {
                    "items": {
                      "items": {
                        "maxLength": 4096,
                        "type": "string"
                      },
                      "maxItems": 16,
                      "minItems": 1,
                      "type": "array"
                    },
                    "maxItems": 128,
                    "type": "array"
                  }
                },
                "required": ["content", "created_at", "kind", "tags"],
                "type": "object"
              }
            },
            "required": ["event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57c273dd3a35369b756754bdf0f5fb35ab40328210365cc1998e7570580a2ad5"
        },
        {
          "name": "prepare_grynvault_nip05_invoice",
          "title": "Prepare Frontier Crown NIP-05 invoice",
          "description": "Check and normalize a name@frontiercrown.com identifier, then prepare its exact 2,000-sat invoice authorization. Does not sign, reserve the name, create, pay, or settle an invoice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "maxLength": 32,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bc60949f2efe185f0d8aa35a2e761645ee524ff62f68b03cddf247f7266ff8bb"
        },
        {
          "name": "prepare_grynvault_supporter_invoice",
          "title": "Prepare Grynvault supporter invoice",
          "description": "Prepare an exact, short-lived signed-authorization request for a one-time donation of 21 to 1,000,000 sats or the fixed 2,100-sat 30-day membership. Does not sign, create, pay, or settle an invoice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "donation_sats": {
                "maximum": 1000000,
                "minimum": 21,
                "type": "integer"
              },
              "plan": {
                "enum": ["basic_once", "member_monthly"],
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:41f6eb0c42b6652ba71fee111f5eb2ba731170c52333a39ed76e1513bab99a43"
        },
        {
          "name": "prepare_note",
          "title": "Prepare Nostr note",
          "description": "Prepare and bind an exact unsigned kind:1 note for user review. This does not sign or publish.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "maxLength": 65536,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
