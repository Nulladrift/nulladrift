          "digest": "sha256:980373466dc398f0e29206e1165bc6a34c588ccb056fe8be5cb1efeea1206487"
        },
        {
          "name": "publish_event",
          "title": "Publish signed event",
          "description": "Publish a previously verified signed event to configured relays. Requires separate explicit user intent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_publish": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "intent_id": {
                "format": "uuid",
                "type": "string"
              },
              "relays": {
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["confirm_publish", "intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29addfd89faf9fab4de5f9267522757d4abd77b61514cec645bc9ee7d24eb5a0"
        },
        {
          "name": "query_events",
          "title": "Read Nostr events",
          "description": "Read a bounded set of verified public profile or note events from selected relays.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "authors": {
                "items": {
                  "pattern": "^[0-9a-f]{64}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "kinds": {
                "items": {
                  "enum": [0, 1],
                  "type": "number"
                },
                "maxItems": 2,
                "type": "array"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "relays": {
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "since": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:405b8e30766983326a194365cb235ed03a2fcb7625808da56b82c865c4d023f6"
        },
        {
          "name": "sign_event",
          "title": "Request event signature",
          "description": "Ask the paired signer to approve and sign the exact event bound to a fresh intent. Requires explicit user intent and never publishes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_signature": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "intent_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["confirm_signature", "intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
