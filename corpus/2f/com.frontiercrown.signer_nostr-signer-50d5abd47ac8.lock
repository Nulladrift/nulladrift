{
  "lockfileVersion": 2,
  "subjects": {
    "com.frontiercrown.signer/nostr-signer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signer.frontiercrown.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nostr-signer-chatgpt",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Never ask for or accept an nsec/private key. Prefer the local NIP-07 setup page with Alby, nos2x, or another browser extension; NIP-46 is an advanced fallback. Before signing, prepare an exact event and show it to the user. Call sign_event only after explicit user intent; approval still happens in the user's signer. Publish only after separate explicit publication intent. Never claim a post is live unless at least one relay acknowledgement is returned. Grynvault account access and in-app browser handoffs are read-only but still require signed-access confirmation. A handoff code lets only the browser holding its separate secret claim the dashboard. Grynvault invoice preparation never creates an invoice; only the separate create tool may do so after explicit confirmation. A pending invoice or checkout redirect is never payment, settlement, entitlement, or NIP-05 activation evidence.",
      "tools": [
        {
          "name": "approve_grynvault_browser_handoff",
          "title": "Approve Grynvault in-app browser sign-in",
          "description": "Sign a short-lived, read-only Grynvault account handoff code so the browser tab that created it can receive its own dashboard. This does not create an invoice, publish a Nostr event, change settlement, or grant wallet custody.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The one-time code displayed by the Grynvault portal, for example ABCD-EFGH-JKLM.",
                "maxLength": 20,
                "minLength": 12,
                "type": "string"
              },
              "confirm_browser_sign_in": {
                "const": true,
                "description": "Must be true only after the user asked to sign the displayed Grynvault browser code.",
                "type": "boolean"
              }
            },
            "required": ["code", "confirm_browser_sign_in"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bee606af0e771fb5ef739c0bcc3eb6910f2b696191bf894275251f7d5d86e9d"
        },
        {
          "name": "begin_nostrconnect_pairing",
          "title": "Begin signer pairing",
          "description": "Advanced fallback: create a nostrconnect:// URI for the user to scan or open in a remote signer. Never accepts an nsec.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "relays": {
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b284a8fc7dfb3fe9fa09a9b86cb8c7627339cd6960faa919afb54cecb315922e"
        },
        {
          "name": "connect_bunker",
          "title": "Connect bunker signer",
          "description": "Connect a bunker:// URI only when the user knowingly supplied it. Prefer the local setup page so connection secrets are not placed in chat. Never accepts an nsec.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connection_uri": {
                "maxLength": 8192,
                "type": "string"
              }
            },
            "required": ["connection_uri"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c076a46bc693c18f674b4bac5e06b27fe00f6e2ba18396d47ad3933b43842c5"
        },
        {
          "name": "create_grynvault_nip05_invoice",
          "title": "Create Frontier Crown NIP-05 invoice",
          "description": "After separate explicit user confirmation, sign the prepared authorization and create exactly one pending 2,000-sat name@frontiercrown.com invoice. Does not pay, settle, activate, or prove identity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_invoice_creation": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "operation_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["confirm_invoice_creation", "operation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bad4b9fbf24577ff1a0ea86c0b901bc454f036227aaed13d26fa20c025e985fd"
        },
        {
          "name": "create_grynvault_supporter_invoice",
          "title": "Create Grynvault supporter invoice",
          "description": "After separate explicit user confirmation, sign the prepared authorization and create exactly one pending Grynvault supporter invoice. Does not pay it and never treats a redirect as settlement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_invoice_creation": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "operation_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["confirm_invoice_creation", "operation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba9788a756b61136454a1e933af73e5b66d70924d6dc7a26005b23d6af25c917"
        },
        {
          "name": "disconnect_signer",
          "title": "Disconnect signer",
          "description": "Forget the in-memory signer session and all prepared events.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_disconnect": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              }
            },
            "required": ["confirm_disconnect"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:86c5bca2e3542ba0e972c524737fc8e4cb3e432a6c31d317f658a870695578b3"
        },
        {
          "name": "get_grynvault_account_dashboard",
          "title": "Get signed Grynvault account dashboard",
          "description": "Read the connected Nostr identity's Grynvault supporter, payment, and NIP-05 dashboard using a short-lived signed authorization. This does not create an invoice or change settlement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_account_access": {
                "const": true,
                "description": "Must be true only after the user approved signing a read-only Grynvault account request.",
                "type": "boolean"
              }
            },
            "required": ["confirm_account_access"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
