        {
          "name": "prepare_event",
          "title": "Prepare exact Nostr event",
          "description": "Validate and bind an exact unsigned Nostr event for user review. This does not sign or publish. Show the user every field before requesting a signature.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "maxLength": 65536,
                    "type": "string"
                  },
                  "created_at": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "kind": {
                    "maximum": 65535,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tags": {
                    "items": {
                      "items": {
                        "maxLength": 4096,
                        "type": "string"
                      },
                      "maxItems": 16,
                      "minItems": 1,
                      "type": "array"
                    },
                    "maxItems": 128,
                    "type": "array"
                  }
                },
                "required": ["content", "created_at", "kind", "tags"],
                "type": "object"
              }
            },
            "required": ["event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:141db9a42d806717831b4c61a785b94136a8cef20d358bb64d4b3432a013e2d5"
        },
        {
          "name": "prepare_grynvault_nip05_invoice",
          "title": "Prepare Frontier Crown NIP-05 invoice",
          "description": "Check and normalize a name@frontiercrown.com identifier, then prepare its exact 2,000-sat invoice authorization. Does not sign, reserve the name, create, pay, or settle an invoice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "maxLength": 32,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b5e0a62ddf16f11b52be34a491b02bc362f17234fff2ad5615a8125d403abcd6"
        },
        {
          "name": "prepare_grynvault_supporter_invoice",
          "title": "Prepare Grynvault supporter invoice",
          "description": "Prepare an exact, short-lived signed-authorization request for a one-time donation of 21 to 1,000,000 sats or the fixed 2,100-sat 30-day membership. Does not sign, create, pay, or settle an invoice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "donation_sats": {
                "maximum": 1000000,
                "minimum": 21,
                "type": "integer"
              },
              "plan": {
                "enum": ["basic_once", "member_monthly"],
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e03aa4857608e933c841ece79bf3a75fc0b54be54b8033de4b09353ef9668462"
        },
        {
          "name": "prepare_note",
          "title": "Prepare Nostr note",
          "description": "Prepare and bind an exact unsigned kind:1 note for user review. This does not sign or publish.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "maxLength": 65536,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b77c32fb1db77b09666cb86f2b755f2e10067d7cc32028029f3f96549d5609ff"
        },
        {
          "name": "publish_event",
          "title": "Publish signed event",
          "description": "Publish a previously verified signed event to configured relays. Requires separate explicit user intent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_publish": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "intent_id": {
                "format": "uuid",
                "type": "string"
              },
              "relays": {
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["confirm_publish", "intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efb72b234a1c9c0253da8cca84a68cd83c4d169c7016a2a09c45d95db9292b92"
        },
        {
          "name": "query_events",
          "title": "Read Nostr events",
          "description": "Read a bounded set of verified public profile or note events from selected relays.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "authors": {
                "items": {
                  "pattern": "^[0-9a-f]{64}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "kinds": {
                "items": {
                  "enum": [0, 1],
                  "type": "number"
                },
                "maxItems": 2,
                "type": "array"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "relays": {
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "since": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f867951d60fca44e3eed563984ce0a996fa66b43ac9af47cdb99fcaec495817e"
        },
        {
          "name": "sign_event",
          "title": "Request event signature",
          "description": "Ask the paired signer to approve and sign the exact event bound to a fresh intent. Requires explicit user intent and never publishes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm_signature": {
                "const": true,
                "description": "Must be true only after the user explicitly approved this action.",
                "type": "boolean"
              },
              "intent_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["confirm_signature", "intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ee050c0c1f68ce58f101219573a1ddbf841864195e5282b08b6aab76c1ddf64"
        }
      ],
      "digest": "sha256:ba7ed167ecad0a2c9abdf8ce6a3028608f73df840c9ca552392c4bc87576f4ca"
    }
