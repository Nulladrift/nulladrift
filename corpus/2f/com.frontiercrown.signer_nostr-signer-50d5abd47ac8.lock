        },
        {
          "name": "get_setup_url",
          "title": "Get signer setup URL",
          "description": "Return the loopback-only page used to connect a NIP-07 browser extension or an advanced NIP-46 signer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac8b515203884054f8ef8e3aafd8f3a0cf2357e25a76f3afacbce7f9a8691740"
        },
        {
          "name": "get_signer_status",
          "title": "Get signer status",
          "description": "Check whether a user-controlled NIP-07 or NIP-46 signer is connected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
