{
  "lockfileVersion": 2,
  "subjects": {
    "com.store-api/store-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://store-api.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "store-api",
        "title": "Store API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Store API даёт доступ к моделям OpenAI, Anthropic, Google, DeepSeek, xAI, Qwen и Z.ai по одному ключу с оплатой картой РФ. Спросить другую модель — ask_model, список с ценами — list_models, картинка — generate_image, остаток — get_balance, траты — get_usage, сравнить несколько моделей — compare_models.",
      "tools": [
        {
          "name": "ask_model",
          "title": "Спросить модель",
          "description": "Ask any model from the Store API catalog — GPT, Claude, Gemini, DeepSeek, Grok, Qwen, GLM — and get the answer as text. Lets you consult a second model from inside the current chat. — Задать вопрос любой модели каталога и получить ответ текстом.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "description": "Answer length limit, 1024 by default",
                "type": "number"
              },
              "model": {
                "description": "Model slug, e.g. openai/gpt-6-sol or anthropic/claude-sonnet-5. Get the list from list_models",
                "type": "string"
              },
              "prompt": {
                "description": "Question or task for the model",
                "type": "string"
              },
              "system": {
                "description": "System instruction, optional",
                "type": "string"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "input_tokens": {
                "type": "number"
              },
              "model": {
                "type": "string"
              },
              "output_tokens": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Спросить модель"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e260373e60c2962b01199d583e922ac30db90cc21e88c78b5ec3d5e64773b7f5"
        },
        {
          "name": "compare_models",
          "title": "Сравнить модели",
          "description": "Ask 2 to 4 models the same question at once and get their answers side by side with token counts. Every model is billed separately. — Задать один вопрос нескольким моделям сразу и сравнить ответы.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "description": "Answer length limit for each model, 600 by default",
                "type": "number"
              },
              "models": {
                "description": "2 to 4 model slugs from list_models, e.g. openai/gpt-6-sol and anthropic/claude-sonnet-5",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "prompt": {
                "description": "Question or task, the same for every model",
                "type": "string"
              },
              "system": {
                "description": "System instruction, optional",
                "type": "string"
              }
            },
            "required": ["models", "prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    },
                    "input_tokens": {
                      "type": "number"
                    },
                    "model": {
                      "type": "string"
                    },
                    "output_tokens": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Сравнить модели"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7456046d02ae0eca1b086c862ee1e4f97ecf2d81218b64447317e4c008856d97"
        },
        {
          "name": "generate_image",
          "title": "Нарисовать картинку",
          "description": "Generate an image from a text prompt and return a link to it. — Сгенерировать изображение по описанию, возвращает ссылку.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Image model, fal-ai/flux/schnell by default",
                "type": "string"
              },
              "prompt": {
                "description": "Image description",
                "type": "string"
              },
              "size": {
                "description": "Size, e.g. 1024x1024",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Нарисовать картинку"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fd4493c47201c7553a0a9a32e2183357c7408be82c8338e73fe5bf034bb62a8"
        },
        {
          "name": "get_balance",
          "title": "Остаток на ключе",
          "description": "Remaining balance on your Store API key, in rubles. — Остаток средств на ключе в рублях.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "balance_rub": {
                "type": "number"
              },
              "top_up_url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Остаток на ключе"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78263381228bedbd2c937c0f62d284e1e589ebdc107fc10e4db33000918b3046"
        },
        {
          "name": "get_usage",
          "title": "История трат",
          "description": "Spending history for this key: how much went to each model over the last N days, with request counts. — История трат по ключу: сколько ушло на каждую модель за последние N дней.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days back to look, 1 to 90, 7 by default",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "by_model": {
                "items": {
                  "properties": {
                    "cost_rub": {
                      "type": "number"
                    },
                    "input_tokens": {
                      "type": "number"
                    },
                    "model": {
                      "type": "string"
                    },
                    "output_tokens": {
                      "type": "number"
                    },
                    "requests": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "days": {
                "type": "number"
              },
              "total_rub": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "История трат"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:063d11546ed779f8b0f93ed1318875eb4cbd68d661aebbf6fce5cbdcf3d9a8e0"
        },
        {
          "name": "list_models",
          "title": "Каталог моделей",
          "description": "List available Store API models with prices in rubles per 1M tokens. Use it before ask_model to pick a model. — Список моделей Store API с ценами в рублях за 1 млн токенов.",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "Filter by provider: openai, anthropic, google, deepseek, qwen, mistral, xai, zai",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "images": {
                "description": "Image models with the price of one image in rubles",
                "items": {
                  "properties": {
                    "display_name": {
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    },
                    "price_rub": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "models": {
                "description": "Text models with prices in rubles per 1M tokens",
                "items": {
                  "properties": {
                    "display_name": {
                      "type": "string"
                    },
                    "input_per_1m_rub": {
                      "type": "number"
                    },
                    "model": {
                      "type": "string"
                    },
                    "output_per_1m_rub": {
                      "type": "number"
                    },
                    "provider": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Каталог моделей"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17fd4893bb3104f7be0d6d349de1522544d02b24eb6de22239c08e93a9c07577"
        }
      ],
      "digest": "sha256:5658d626ac745efcc6235ea456768a6229959b53d2765fb0997869d5a78379fb"
    }
  }
