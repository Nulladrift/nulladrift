      "instructions": "GTA 6 release date: November 19, 2026, on PS5 and Xbox Series X|S; a PC version is not announced. Rockstar Support says the game releases at midnight local time on November 19 in all regions, on both consoles; each country’s exact moment comes from its PlayStation Store listing, and the Xbox Store catalog entries record the same moments. Rockstar said on November 10, 2026 that the game targets 30 frames per second on PS5 and Xbox Series X|S, and it named no other mode. Each fact carries a status: confirmed (Rockstar, Take-Two, an official store listing or a rating board said it), reported (a named person or company said it on the record) or not-announced (Rockstar and Take-Two have said nothing on it). The site publishes no rumors or leaks. GTA6 Times is an independent fan site, not affiliated with Rockstar Games or Take-Two. Fact and price answers carry the status, the source and the date last checked, and every answer gives the page URL.",
      "tools": [
        {
          "name": "check_claim",
          "title": "Check a GTA 6 claim",
          "description": "Use this when someone asks whether one specific GTA 6 claim is confirmed (use get_facts to browse the whole database instead). Looks the claim up and returns the closest entries with their status (confirmed, reported or not-announced), the reason and the source. A status describes the entry as written, not the claim in the question. Returns no match rather than guessing when nothing is close.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "The claim in plain words, for example \"GTA 6 is coming to PC at launch\"",
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
