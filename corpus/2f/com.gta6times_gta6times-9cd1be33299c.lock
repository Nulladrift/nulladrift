        {
          "name": "get_facts",
          "title": "GTA 6 facts with their status",
          "description": "Use this when someone wants to browse the fact database: what Rockstar and Take-Two have confirmed about GTA 6 and what named people have said on the record, rather than a ruling on one claim (use check_claim for that). Returns every matching claim with its status (confirmed, reported or not-announced), why, when it was last checked and its source. Optional filters: status, or a keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many facts to return, 1 to 50 (default 25)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords every returned fact must contain in its claim or reason, for example \"PC\" or \"open world\"",
                "type": "string"
              },
              "status": {
                "description": "Only facts with this status. Leave out to include every status.",
                "enum": ["confirmed", "reported", "not-announced"],
                "type": "string"
              }
            },
            "type": "object"
