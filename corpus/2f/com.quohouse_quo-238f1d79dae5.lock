            "readOnly": true
          },
          "digest": "sha256:2fea75b8bb5873a11ab0ea4aa7bb2f57d199bc051cb0d6c57d54f3b91db68171"
        },
        {
          "name": "link_payment_method",
          "title": "Link a card for agentic checkout",
          "description": "Start linking a card for agentic checkout, with a guest-chosen spending cap. Returns a Stripe-hosted URL, hand this URL to the guest and have THEM open it and enter their own card there. Never ask the guest for their card number, expiry, or CVC in this conversation, and never pass card details as tool input; this app never accepts them. Requires session_token from verify_code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cap_dollars": {
                "description": "The guest's own chosen spending cap in dollars, suggest $150 as a sane default, but the guest picks the real number on the Stripe page.",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "session_token": {
                "type": "string"
              }
            },
            "required": ["cap_dollars", "session_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9681dd357f2fb6cc84aec39439f82e2213162000702d6a2d7ba7cd49d715acd"
        },
