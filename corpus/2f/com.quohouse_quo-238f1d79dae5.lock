        {
          "name": "get_quote",
          "title": "Get a fare quote",
          "description": "Get a transparent, all-in fare quote for a Quo black-car ride in Florida. No account needed, the same price shown on the public site. Returns a line-item breakdown and the total. Pass pickup and dropoff to have the trip routed and priced by distance exactly as a reservation is; without them the total is an estimate before routing, and a longer trip costs more when it is reserved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dropoff": {
                "description": "Destination, for service=transfer.",
                "minLength": 3,
                "type": "string"
              },
              "eventSlug": {
                "description": "Slug of an event on the Quo calendar (see list_events) if this ride is tied to one, affects demand pricing",
                "type": "string"
              },
              "hours": {
                "description": "Hours booked, for service=hourly (minimum 2); defaults to 3 if omitted. Ignored for service=transfer.",
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup address, airport, or hotel. With dropoff (or for hourly, alone), the trip is routed and the quote includes distance, as a reservation's would.",
                "minLength": 3,
                "type": "string"
              },
              "service": {
                "default": "transfer",
                "description": "transfer = point-to-point; hourly = by the hour, as directed",
                "enum": ["transfer", "hourly"],
                "type": "string"
              },
              "vehicle": {
                "description": "Vehicle class: sedan (Executive Sedan), suv (Luxury SUV), sprinter (Executive Sprinter), flagship (Flagship)",
                "enum": ["sedan", "suv", "sprinter", "flagship"],
                "type": "string"
              }
            },
            "required": ["vehicle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
