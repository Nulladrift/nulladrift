      "serverInfo": {
        "name": "quo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Quo is a private chauffeured black-car service in Florida (expanding to Colombia soon). Use get_quote before reserve_ride so the person knows the price. reserve_ride never charges anything, it creates a request a human concierge confirms. Tools that touch a specific guest's ride history or let them cancel a ride require phone verification first: call request_verification_code, then verify_code, then pass the returned session_token to list_my_rides / get_ride_status / cancel_ride / redeem_gift. To complete payment automatically instead of just requesting a ride, first call get_payment_method, an assistant can only complete payment automatically if the guest has already linked a card with a cap covering the fare (via link_payment_method, which sends them to Stripe's own hosted page, never collect card details yourself), then call reserve_and_pay. If no card is linked, or the fare exceeds the guest's cap, fall back to reserve_ride, which always works and never charges anything.",
      "tools": [
        {
          "name": "ask_concierge",
          "title": "Ask the Quo concierge",
          "description": "Ask a natural-language question and get a grounded answer from Quo's own concierge, the same AI that answers the site's chat widget. Strictly grounded in real Quo information; never invents a price or a policy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
