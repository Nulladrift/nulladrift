        {
          "name": "request_verification_code",
          "title": "Request a phone verification code",
          "description": "Send a 6-digit SMS code to a phone number, to verify the caller owns it before showing ride history or allowing a cancellation. Required before calling list_my_rides, get_ride_status, cancel_ride, or redeem_gift.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phone": {
                "description": "Any common format is fine (e.g. \"305-555-0100\"); non-digit characters other than a leading + are stripped server-side.",
                "minLength": 7,
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bed2f2f9785f2c7ac2dd7fee2585f9884b9d2b8b06c2a94fc508fb0057d56f62"
        },
        {
          "name": "reserve_and_pay",
          "title": "Reserve a ride and pay for it automatically",
          "description": "Reserve a Quo ride and complete payment immediately, using the guest's already-linked card, only works if get_payment_method shows a linked card whose remaining 24-hour cap covers this fare. The fare is computed server-side from real pricing, never trusted from the caller. If the fare exceeds what is left of the guest's rolling 24-hour cap, or no card is linked, this refuses and suggests reserve_ride instead (a human-confirmed request with no charge). If the ride is created but the charge fails, the ride is NOT lost, it stays reserved and unpaid, and the response explains next steps. Requires session_token from verify_code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "additionalRiders": {
                "description": "Other named riders on this same booking, for a group/split-fare trip, the verified phone above stays the sole booking owner and the only one charged. Purely for the driver's manifest and, if a phone is given, that rider's own SMS ride updates.",
                "items": {
                  "properties": {
                    "name": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "phone": {
                      "description": "Any common format is fine (e.g. \"305-555-0100\"); non-digits other than a leading + are stripped server-side.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "dropoff": {
                "description": "Destination, omit for an hourly/as-directed booking",
                "type": "string"
              },
              "flightNumber": {
                "description": "For an airport pickup, Quo tracks the flight and the captain waits if it's delayed",
                "type": "string"
              },
              "hours": {
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional. A unique string for this request (e.g. a UUID). If the call is retried with the same key, the original answer is returned instead of reserving and charging a second ride.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "pickup": {
                "description": "Pickup address, airport, or hotel",
                "minLength": 3,
                "type": "string"
              },
              "service": {
                "default": "transfer",
                "enum": ["transfer", "hourly"],
                "type": "string"
              },
              "session_token": {
                "type": "string"
              },
              "specialRequests": {
                "items": {
                  "enum": ["carSeatInfant", "carSeatToddler", "boosterSeat", "wheelchairAccessible", "serviceAnimal"],
                  "type": "string"
                },
                "type": "array"
              },
              "stops": {
                "description": "Ordered intermediate stops between pickup and dropoff within this one reservation. Up to 3. Each stop adds a flat surcharge, and the trip is routed through the stops; both are included in the charged amount.",
                "items": {
                  "properties": {
                    "address": {
                      "minLength": 3,
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "vehicle": {
                "default": "sedan",
                "enum": ["sedan", "suv", "sprinter", "flagship"],
                "type": "string"
              },
              "when": {
                "description": "Pickup date and time, ISO 8601 (e.g. 2026-12-04T14:30:00-05:00)",
                "type": "string"
              }
            },
            "required": ["pickup", "session_token", "when"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16919b03a1dc46d5abdd6ffdb28a1fdc5907fe80a18fe26d0be1a9a7b4526e4b"
        },
        {
          "name": "reserve_ride",
          "title": "Reserve a Quo ride",
          "description": "Request a Quo captain reservation. No account or payment needed to request, a concierge confirms every ride by phone, text, or email before it's finalized, exactly like the public booking form. Nothing is charged by this call. If the guest has already linked a card with a spending cap (see get_payment_method), reserve_and_pay can also complete payment in the same call instead of just requesting.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "additionalRiders": {
                "description": "Other named riders on this same booking, for a group/split-fare trip, the caller above stays the sole booking owner (auth, cancel rights, and payment all stay with them). Purely for the driver's manifest and, if a phone is given, that rider's own SMS ride updates. Not a separate payment, the organizer's card is still charged the full fare.",
                "items": {
                  "properties": {
                    "name": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "phone": {
                      "description": "Any common format is fine (e.g. \"305-555-0100\"); non-digits other than a leading + are stripped server-side.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "dropoff": {
                "description": "Destination, omit for an hourly/as-directed booking",
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "flightNumber": {
                "description": "For an airport pickup, Quo tracks the flight and the captain waits if it's delayed",
                "type": "string"
              },
              "hours": {
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional. A unique string for this reservation request (e.g. a UUID). If the call is retried with the same key, the original reservation is returned instead of creating a second ride.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Guest's full name",
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "phone": {
                "description": "Guest's mobile number, required, the concierge confirms by phone/text. Any common format is fine (e.g. \"305-555-0100\", \"(305) 555-0100\"); non-digit characters other than a leading + are stripped server-side.",
                "minLength": 7,
                "type": "string"
              },
              "pickup": {
                "description": "Pickup address, airport, or hotel",
                "minLength": 3,
                "type": "string"
              },
              "service": {
                "default": "transfer",
                "enum": ["transfer", "hourly"],
                "type": "string"
              },
              "specialRequests": {
                "items": {
                  "enum": ["carSeatInfant", "carSeatToddler", "boosterSeat", "wheelchairAccessible", "serviceAnimal"],
                  "type": "string"
                },
                "type": "array"
              },
              "stops": {
                "description": "Ordered intermediate stops between pickup and dropoff within this one reservation (e.g. a hotel stop to grab a bag before continuing to the airport). Up to 3. Pricing here isn't distance-based, so each stop adds a flat surcharge to the fare, reflected in the confirmation.",
                "items": {
                  "properties": {
                    "address": {
                      "minLength": 3,
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "vehicle": {
                "default": "sedan",
                "enum": ["sedan", "suv", "sprinter", "flagship"],
                "type": "string"
              },
              "when": {
                "description": "Pickup date and time, ISO 8601 (e.g. 2026-12-04T14:30:00-05:00)",
                "type": "string"
              }
            },
            "required": ["name", "phone", "pickup", "when"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
