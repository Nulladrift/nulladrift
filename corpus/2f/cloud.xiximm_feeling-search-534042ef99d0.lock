          "digest": "sha256:e1d6f77f2ac29ecb6bb6f70bc7476a793488885a645f17756f83b72c0ba4809f"
        }
      ],
      "digest": "sha256:b129f1b36b4b9f3fe0c8a189a576fd52783ddcf0c9297ef8a7fef2383d934440"
    }
  }
