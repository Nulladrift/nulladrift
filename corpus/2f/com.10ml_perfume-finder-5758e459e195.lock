        {
          "name": "get_house",
          "title": "Get perfume house",
          "description": "Profile of a perfume house or fragrance brand: country, founded year, style (designer, niche, Middle Eastern, indie), what it is known for, its signature perfumes in the index and a link to explore it at 10ML. Understands nicknames (YSL, MFK, PDM, Paco Rabanne). Use for 'tell me about Creed', 'what is Amouage known for' or 'best Dior perfumes'. Not for browsing all houses (use list_houses) and not for one perfume (use get_perfume).",
          "inputSchema": {
            "properties": {
              "house": {
                "description": "The house. Examples: \"Creed\", \"YSL\", \"Maison Francis Kurkdjian\", \"Parfums de Marly\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language of the 10ml.com links and labels.",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl", "nl", "pt", "sv", "da", "fi", "bg", "hr"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) or detailed (adds pyramid, seasons, occasions, longevity).",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["house"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "house": {
