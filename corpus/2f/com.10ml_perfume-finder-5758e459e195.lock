                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl", "nl", "pt", "sv", "da", "fi", "bg", "hr"],
                "type": "string"
              },
              "loves": {
                "description": "Perfumes they already wear or love, e.g. [\"Delina\"]",
