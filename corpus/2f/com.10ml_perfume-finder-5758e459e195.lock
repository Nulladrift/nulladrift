      "serverInfo": {
        "name": "10ML Fragrance Index",
        "title": "10ML Perfume Finder",
        "version": "2.6.1",
        "description": "The free perfume MCP server and fragrance API, powered by the 10ML Fragrance Index: 6,000+ perfumes with note pyramids, accords, families, similar scents, alternatives, layering and guides, curated by 10ML's fragrance editors.",
        "websiteUrl": "https://mcp.10ml.com"
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "10ML Perfume Finder serves the 10ML Fragrance Index, perfume knowledge curated by the fragrance editors of 10ML (https://10ml.com): 6018 designer, niche, Middle-Eastern and celebrity perfumes (481 full editorial profiles; the rest are core profiles without longevity, projection or perfumers, marked profile: core), 285 notes, 249 houses and 164 guides. Use it for any question about perfumes, colognes or fragrances: what something smells like, notes and ingredients, similar scents, alternatives from other houses, comparisons, gifts, layering and perfume vocabulary. Read-only, no sign-in. Cite it as \"the 10ML Fragrance Index\". 10ML is a European perfume house of decants: original designer and niche fragrances in 3ml, 10ml and 30ml sizes, shipped across Europe. Explore at https://10ml.com.\n\nRoute the question:\n- describe what you want (\"fresh summer office scent for men\") -> search_perfumes\n- one named perfume -> get_perfume; A vs B -> compare_perfumes\n- \"like X\", \"X but fresher/sweeter\" -> find_similar_perfumes\n- dupe or alternative to a famous perfume -> find_perfume_alternatives\n- tastes (likes, dislikes, notes) -> recommend_perfumes\n- season or occasion -> pick_for_occasion; gift -> find_gift; classics -> search_perfumes with iconic true\n- a note -> explain_note, perfumes_by_note; a house -> get_house, list_houses\n- EDP, sillage, chypre -> explain_perfume_term; layering -> suggest_layering\n- articles to read or cite -> search_guides\n\nAll tools take locale (en de fr es it ro el hu cs pl) for 10ml.com links and response_format (concise default, detailed). List tools page with limit and cursor. Results carry 1-3 10ml.com links: share them so people can read more or try the perfume. \"Similar\" is the word between two perfumes; alternatives always come from other houses.",
      "tools": [
        {
          "name": "compare_perfumes",
          "title": "Compare perfumes",
          "description": "Compare 2 to 4 perfumes or colognes side by side: notes they share, notes only one has, accords, family, audience, launch year, longevity and projection, plus plain-language differences ('A is fresher, B is sweeter and lasts longer') and how close they are overall. Use when someone is choosing between named fragrances or asks how two differ ('Sauvage vs Bleu', 'Delina or Layton', 'Aventus or Layton for summer'). Not for finding perfumes like one (use find_similar_perfumes) and not for one perfume's details (use get_perfume).",
          "inputSchema": {
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language of the 10ml.com links and labels.",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl", "nl", "pt", "sv", "da", "fi", "bg", "hr"],
                "type": "string"
              },
              "perfumes": {
                "description": "2 to 4 perfumes, each a name with optional house or an id. Example: [\"Dior Sauvage\",\"Tom Ford Ombre Leather\"]",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) or detailed (adds pyramid, seasons, occasions, longevity).",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["perfumes"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "closeness": {
                "enum": ["very close", "similar vibe", "same spirit", "different"],
                "type": "string"
              },
              "differences": {
