        {
          "name": "find_perfume_alternatives",
          "title": "Find perfume alternatives",
          "description": "The editors' alternatives (dupes) to a famous perfume or cologne, from other houses: for each, why it is close and how close (very close, similar vibe, same spirit), plus the 10ML guide that compares them. Covers about 100 iconic originals such as Creed Aventus, Baccarat Rouge 540, Delina, Sauvage, Black Opium or Santal 33. For other fragrances in the index the closest options from different houses are computed from notes and accords. Use for 'dupe of X', 'alternative to X', 'what smells like X from another house'. Not for general similarity inside the index (use find_similar_perfumes) and not for free-text discovery (use search_perfumes).",
          "inputSchema": {
            "properties": {
              "closeness": {
                "description": "Only alternatives at this closeness",
                "enum": ["very close", "similar vibe", "same spirit"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 64,
                "type": "string"
              },
              "house": {
                "description": "House of the original when the name is ambiguous, e.g. \"Parfums de Marly\"",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "default": 6,
                "description": "Results per page.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the 10ml.com links and labels.",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl", "nl", "pt", "sv", "da", "fi", "bg", "hr"],
                "type": "string"
              },
              "perfume": {
                "description": "The famous perfume to find alternatives for. Examples: \"Creed Aventus\", \"Baccarat Rouge 540\", \"Delina\"",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["perfume"],
            "type": "object"
