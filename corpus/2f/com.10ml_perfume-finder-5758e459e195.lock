        {
          "name": "find_similar_perfumes",
          "title": "Find similar perfumes",
          "description": "Find perfumes and colognes that smell like one the person already likes, ranked by shared notes, accords and style, each saying exactly what it shares and how close it is (very close, similar vibe, same spirit). Works from a perfume in the index (name and house, or id) OR from free notes/accords for any other fragrance. Steer the result: fresher, sweeter, darker, lighter, longer_lasting or more_projection. Use for 'something like Baccarat Rouge 540', 'smells like Sauvage but fresher' or 'a scent with saffron and cedar'. Not for editorial dupes of a famous perfume from other houses (use find_perfume_alternatives) and not for free-text discovery (use search_perfumes).",
          "inputSchema": {
            "properties": {
              "accords": {
                "description": "Known accords of the starting perfume. Example: [\"amber\",\"woody\",\"sweet\"]",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 64,
                "type": "string"
              },
              "gender": {
                "description": "Only return perfumes for this audience (men and women include unisex)",
                "enum": ["men", "women", "unisex"],
                "type": "string"
              },
              "house": {
                "description": "House of the perfume when the name alone is ambiguous, e.g. \"Maison Francis Kurkdjian\"",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Results per page.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the 10ml.com links and labels.",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl", "nl", "pt", "sv", "da", "fi", "bg", "hr"],
                "type": "string"
              },
              "notes": {
                "description": "Known notes of the starting perfume, for perfumes outside the index. Example: [\"jasmine\",\"saffron\",\"ambergris\",\"cedar\"]",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "other_houses_only": {
                "default": false,
                "description": "True to leave out perfumes from the same house as the starting perfume",
                "type": "boolean"
              },
              "perfume": {
                "description": "A perfume by name, optionally with its house, e.g. \"Baccarat Rouge 540\", \"Dior Sauvage\", \"Delina\". Or pass an id from another tool.",
                "maxLength": 120,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) or detailed (adds pyramid, seasons, occasions, longevity).",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "steer": {
                "description": "Move away from the starting point in one direction: fresher, sweeter, darker, lighter, longer_lasting (needs a perfume in the index) or more_projection (same).",
                "enum": ["fresher", "sweeter", "darker", "lighter", "longer_lasting", "more_projection"],
                "type": "string"
              }
            },
            "type": "object"
          },
