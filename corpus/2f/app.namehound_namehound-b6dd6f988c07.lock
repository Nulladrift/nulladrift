{
  "lockfileVersion": 2,
  "subjects": {
    "app.namehound/namehound": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://namehound.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "namehound",
        "title": "NameHound",
        "version": "1.0.0",
        "websiteUrl": "https://namehound.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NameHound checks whether one specific brand, business or project name is free as a domain name (.com, .net, .org, .app) and as a handle on Bluesky, Mastodon, GitLab, npm and PyPI, using each service's own public lookup, and gives the NameHound Brand Name Score. One name per call. Results are a snapshot with the time they were checked; availability can change, the registrar or platform has the final say, and nothing here is legal or trademark advice. It does not suggest names, check lists of names, or check Instagram, X, TikTok, YouTube, GitHub or other platforms that block automated checks.",
      "tools": [
        {
          "name": "check_name_availability",
          "title": "Check a name: domains, handles and Brand Name Score",
          "description": "Use this when someone asks whether one specific brand, business, product or project name is free as a domain name (.com, .net, .org, .app) and as a handle on Bluesky, Mastodon, GitLab, npm and PyPI, and wants the NameHound Brand Name Score (0-100) for it. Send one name per call, for example \"Blue Fern Studio\". The name is made into a handle (lowercase letters and numbers). Returns up to 4 rows, each with the check time, the official source and a link to the NameHound page for that name. Results are a snapshot: availability can change, the registrar or platform has the final say, and this is not legal or trademark advice (the score leaves out the trademark part until the person runs the free USPTO search themselves). Do not use it to brainstorm names, to check a list of names, for trademark clearance, or for Instagram, X, TikTok, YouTube, GitHub or other platforms it does not check. It has a small daily limit, so call it only for names the person actually cares about.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "A specific name, e.g. \"Blue Fern Studio\". 2-40 characters. Wildcards and \"all\" are not accepted.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "more_available": {
                "type": "boolean"
              },
              "more_info": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "result_count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expires": {
                      "type": "string"
                    },
                    "link": {
                      "description": "Page on our site with details.",
                      "type": "string"
                    },
                    "observed": {
                      "description": "Date the fact was observed or verified (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "source": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["name", "url"],
                      "type": "object"
                    },
                    "stale": {
                      "const": true,
                      "type": "boolean"
                    },
                    "stale_note": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "values": {
                      "additionalProperties": {
                        "type": ["string", "number", "boolean", "null"]
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["link", "observed", "source", "title"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["attribution", "more_available", "more_info", "result_count", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a name: domains, handles and Brand Name Score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Name check ready",
            "openai/toolInvocation/invoking": "Checking the name",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:5cfb1dc476dd9339c482796d4edc4a779785c4646b08c733916e44b8ebe36633"
        }
      ],
      "digest": "sha256:e280f7a9652e4a093f4a0b929d2c7a0df72cadaa217c1b29cbb02dd71f359469"
    }
  }
}
