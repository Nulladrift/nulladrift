          "name": "platform_ai_optimize",
          "title": "AI 优化策略",
          "description": "【策略】AI 多轮优化策略（写操作，需用户确认）：输入 prompt 描述策略目标，自动生成→回测→分析→改进（最多 maxRounds 轮，1-5，默认 3）。耗时较长。给了 initialCode 时第 1 轮不生成：直接回测这份既有代码作基线，第 2 轮起在其上改进（A3）。strategyParams 为指标参数覆盖（对齐 /api/cex/indicator/backtest 的 params）。context 为可选结构化学徒上下文（B2-a，失败因子/评审结论/目标指标），独立注入 LLM。每轮回传 rounds[].params（本轮实际生效参数）与 rounds[].errorCode（失败原因可判定）；全轮未产出代码时返回 502/429 + errorCode，不再返回空 finalCode。（cost: ≈ 34–38 credits/轮（按实际 tokens 结算））（写操作，外部调用将以 apikey 身份直接执行）",
