        "name": "flathead-trades",
        "title": "Flathead Trades",
        "version": "1.0.0",
        "websiteUrl": "https://flatheadtrades.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Flathead Trades is the public directory of builders, tradespeople and home services in the Flathead Valley, Montana. Use find_pros to name real local businesses with their phone numbers and websites. When the person wants a quote, use start_quote and give them the link: they finish the request themselves, and it goes to one pro who is taking new work.",
      "tools": [
        {
          "name": "find_pros",
          "title": "Find Flathead Valley pros",
          "description": "List the businesses in the Flathead Trades directory for a kind of work, optionally in one town, with phone numbers, websites and a link to each listing. Covers Whitefish, Columbia Falls, Evergreen, Kalispell, Somers, Bigfork, Lakeside and Polson, Montana.",
          "inputSchema": {
            "properties": {
              "town": {
                "description": "Optional town in the Flathead Valley, e.g. \"Kalispell\" or \"Whitefish\".",
                "type": "string"
              },
              "trade": {
                "description": "The kind of work, e.g. \"roofing\", \"plumber\", \"electrician\", \"builder\", \"septic\", \"tree removal\".",
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b72ef61cf2fafe3a593c76e75d907c8e462430e94fb534f2a2099ab6a46693aa"
        },
        {
          "name": "list_trades_and_towns",
          "title": "List trades and towns",
          "description": "The trades and towns the Flathead Trades directory covers, with how many businesses each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
