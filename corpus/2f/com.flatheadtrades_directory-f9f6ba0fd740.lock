        {
          "name": "start_quote",
          "title": "Start a quote request",
          "description": "Make a link that opens the Flathead Trades quote form already filled with the work, the town and the description. The person finishes it and agrees to be contacted themselves; the request is then offered live to one local pro at a time who is on right now, the first to take it calls them, and they follow it on a private request page. Free for homeowners.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What needs doing, in the person’s words.",
                "type": "string"
              },
              "town": {
                "description": "The town in the Flathead Valley.",
                "type": "string"
              },
              "trade": {
                "description": "The kind of work.",
                "type": "string"
              }
            },
