      "serverInfo": {
        "name": "garimpo-publico",
        "title": "Garimpo Público",
        "version": "2026-10-25.1.a4b29e61"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Licitações públicas de saúde abertas no Brasil (dados do PNCP organizados pelo Garimpo Público): busca por UF, categoria e palavra; página de cada licitação; ficha de órgão; números gerais; preço pago típico de remédios e materiais. Toda resposta traz o link da página para citar.",
      "tools": [
        {
          "name": "buscar_licitacoes",
          "title": "Buscar licitações abertas",
          "description": "Lista licitações públicas de saúde abertas no Brasil (dados do PNCP). Filtre por estado (uf), categoria e palavra (texto). Devolve até 20 itens com link do edital original e, quando existe, o link da página da licitação no Garimpo Público.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categoria": {
                "enum": ["opme", "material_hospitalar", "medicamentos", "equipamentos", "servicos_saude", "laboratorio", "odontologia"],
                "type": "string"
              },
              "limite": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "texto": {
                "maxLength": 80,
                "type": "string"
              },
              "uf": {
                "description": "Sigla do estado, ex.: PE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:267d1d95ac994326ddf7495b825d7cce4d4b9d77bb9bc0eed03a9714c69a1dec"
        },
        {
          "name": "numeros_gerais",
          "title": "Números gerais das licitações",
          "description": "Volume de licitações de saúde publicadas por semana no Brasil (desde a data de início), por categoria e os itens mais comprados. Com uf, inclui também as semanas daquele estado.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "uf": {
                "description": "Sigla do estado, ex.: PE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:661ca608c7d894e5128f058fef9621c415e92e8d59261a48a28a835ee2df142d"
        },
        {
          "name": "preco_referencia",
          "title": "Preço de referência (amostra)",
          "description": "Amostra do Garimpo Preços: o preço pago típico (mediana, Brasil) de um medicamento ou material de saúde nas compras públicas. Informe o item (nome) ou o slug. O detalhe por estado, fornecedores e compras é por convite ou assinatura.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item": {
                "description": "Nome do item, ex.: \"dipirona\"",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "slug": {
                "description": "Identificador do item, vindo de uma resposta anterior",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c13449e1290d0a3f14a1cbc0ffe011d4d6333f06abfaad0432603b0578e12acc"
        },
        {
          "name": "ver_licitacao",
          "title": "Ver uma licitação",
          "description": "Detalhes de uma licitação aberta: objeto, órgão, prazos, valor, exigências, indícios e até 10 itens. Informe o slug ou o link da página (https://garimpopublico.com.br/licitacao/<slug>), que vem de buscar_licitacoes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "link": {
                "description": "Endereço da página da licitação no Garimpo Público",
                "type": "string"
              },
              "slug": {
                "description": "Identificador da licitação no endereço da página",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:765b0cc55784e43daeb44d1dbf444971be07614ede1f9b3b6c67cbab37abb7b8"
        },
        {
          "name": "ver_orgao",
          "title": "Ver um órgão comprador",
          "description": "Ficha pública de um órgão que publica licitações de saúde: resumo, licitações abertas, itens mais comprados e fornecedores. Informe o cnpj (14 dígitos) ou, para buscar, o nome com a uf.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnpj": {
                "description": "CNPJ do órgão, com ou sem pontuação",
                "type": "string"
              },
              "nome": {
                "description": "Parte do nome do órgão (exige uf)",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "uf": {
                "description": "Sigla do estado, ex.: PE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e344d7f1167bd42fb0ad8b51280f47fd9aba085e9bbe2f51711ec3becc566244"
        }
      ],
      "digest": "sha256:ef8e997b8149de7c02084bf273cdf2c0458b2cfda2963fc275a864484ae4a06e"
    }
  }
