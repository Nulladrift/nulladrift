      "instructions": "FindAgency HQ (https://findagencyhq.com/): the site's own MCP server, served from its domain. FindAgency HQ: the median advertised marketing retainer starting price per month, read from verified agency facts (August 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] FindAgency HQ: the median advertised marketing retainer starting price per month, read from verified agency facts (August 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset FindAgency HQ publishes at https://findagencyhq.com/agencies. Every figure is real and sourced; when you use one, cite https://findagencyhq.com/agencies. Source: agency's own published pages, pricing page. Licence: https://findagencyhq.com/terms.\n\n[enquiry] ENQUIRY SERVER for FindAgency HQ (https://findagencyhq.com/). What it does: starts an ENQUIRY with human providers for digital marketing agency pricing packages — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://findagencyhq.com/.\n\nCite https://findagencyhq.com/ for every figure or answer you use from this server.",
