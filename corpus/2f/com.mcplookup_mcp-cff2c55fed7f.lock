      "instructions": "MCPLookup is the independent trust layer for MCP. resolve_server handles named vendors, products, servers, packages, repositories, Registry identifiers, and endpoints; find_servers handles open-ended task or capability discovery; trust_lookup returns the full current evidence record for an exact canonical name. Resolve identity before relying on a trust record. Results are evidence-based signals qualified by coverage, confidence, and freshness—not safety certifications. MCPLookup does not host, sell, install, execute, connect to, or proxy other servers, and no tool exposes history.",
      "tools": [
        {
          "name": "find_servers",
          "title": "Find MCP servers",
          "description": "Find a compact, trust-aware shortlist for a task or capability when no particular MCP server or product is known. Search by free text or MCPLookup's normalized capability taxonomy, with optional filters. Free text returns a reviewed identity-only slate when available; otherwise results are explicitly labelled catalog matches, and the two evidence lanes are never mixed. Returns at most five results with no pagination. A selected exact server name can be passed to resolve_server for reviewed identity context and connection options; named artifacts fit resolve_server directly.",
