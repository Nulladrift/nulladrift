            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "capability": {
                "description": "Normalized capability category; required when query is omitted.",
                "enum": ["search-retrieval", "data-access", "knowledge-memory", "web-extraction", "software-development", "infrastructure-devops", "content-creation", "media-processing", "communication", "productivity", "automation-orchestration", "analytics-monitoring", "payments-commerce", "security-identity", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Optional normalized industry category.",
                "enum": ["horizontal-general", "financial-services", "crypto-web3", "healthcare-life-sciences", "retail-ecommerce", "media-entertainment", "real-estate-property", "travel-hospitality", "manufacturing-industrial", "logistics-transportation", "energy-utilities", "agriculture-materials", "legal-regulatory", "government-public-sector", "education", "marketing-advertising", "other-vertical"],
                "type": "string"
              },
              "kind": {
                "description": "Optional deployment kind.",
                "enum": ["package", "remote", "hybrid", "neither"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of results; hard maximum 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "order_by": {
