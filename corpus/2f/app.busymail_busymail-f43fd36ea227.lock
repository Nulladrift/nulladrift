        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List the nine categories Busymail sorts mail into, with what each one holds. Use this to pick a valid category for list_feed's 'category' argument or for search's 'in:' operator.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "behavior": {
