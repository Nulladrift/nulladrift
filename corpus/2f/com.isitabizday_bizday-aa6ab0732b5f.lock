      "instructions": "Bizday 0.3.23. Verified US business calendars for agents. First call: GET /v1/business-days/check?date=2026-07-03 or MCP tools/call is_business_day with date 2026-07-03. Skill: /skills/SKILL.md. The default calendar is us-federal-opm. us-fed-banking is the Federal Reserve Banks schedule: a Saturday holiday does not close Friday. us-nyse is NYSE full-day holidays for 2026 through 2028. Good Friday 2026-04-03 is not a business day on us-nyse. us-sifma is SIFMA recommended U.S. full closes for 2026 and 2027. Good Friday 2026-04-03 is a business day on us-sifma. us-ca is California state offices for 2026. Farmworkers Day 2026-03-31 is not a business day. Friday 2026-07-03 is a business day. us-ny is New York State executive-branch offices for 2026 and 2027. Friday 2026-07-03 is a business day. Election Day 2026-11-03 is a business day. us-nyc is New York City offices for 2026 and 2027. Friday 2026-07-03 is not a business day. Election Day 2026-11-03 is not a business day. 2026-07-03 is not a business day on us-federal-opm and a business day on us-fed-banking. Tool results are the same JSON as the HTTP API and include calendar, sources, and disclaimer. add matches Excel WORKDAY (start is day 0). count matches Excel NETWORKDAYS (both ends count). roll stays on a business day and otherwise moves to the nearest one. roll does not decide whether a filing is timely. frcp_6a_deadline counts every calendar day under FRCP 6(a)(1) and rolls only the last day. It takes trigger, days, and direction, and it rejects calendar. It is not Excel WORKDAY and it does not decide whether a filing is timely. report_discrepancy stores calendar, date, claim, and source_url for review and does not change either calendar. Not legal, payroll, or financial advice. Contract: /openapi.json. Manifest: /.well-known/mcp.json. Server card: /.well-known/mcp/server-card.json. Skill: /skills/SKILL.md.",
      "tools": [
        {
          "name": "add_business_days",
          "title": "Add business days",
          "description": "The date that is days business days after start. The start date is day 0, matching Excel WORKDAY, so days=1 always leaves the start date. days is an integer from -3660 to 3660. Omit calendar for us-federal-opm. us-fed-banking keeps Reserve Banks open on the Friday before a Saturday holiday.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "Calendar id. Omit for us-federal-opm. Unknown ids are an error. us-fed-banking keeps Reserve Banks open on the Friday before a Saturday holiday. us-nyse is NYSE full-day holidays for 2026 through 2028. us-sifma is SIFMA recommended U.S. full closes for 2026 and 2027. An early close stays open. us-ca is California state offices for 2026. A Saturday holiday does not close Friday. us-ny is New York State executive-branch offices for 2026 and 2027. A floating holiday stays open. us-nyc is New York City offices for 2026 and 2027. A Saturday holiday closes Friday.",
                "enum": ["us-federal-opm", "us-fed-banking", "us-nyse", "us-sifma", "us-ca", "us-ny", "us-nyc"],
                "type": "string"
              },
              "days": {
                "description": "Business days to add. Negative counts backward. Zero returns the start date.",
                "maximum": 3660,
                "minimum": -3660,
                "type": "integer"
              },
              "start": {
                "description": "Civil date, YYYY-MM-DD. Not a timestamp.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["days", "start"],
            "type": "object"
