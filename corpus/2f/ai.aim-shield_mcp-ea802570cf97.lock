          "name": "repetir_foto_de_mi_empresa",
          "title": "Repetir la foto de seguridad de mi empresa",
          "description": "Con la clave del panel de empresa: vuelve a mirar el dominio de la empresa y guarda la nota nueva en el panel (queda en el registro).",
          "inputSchema": {
