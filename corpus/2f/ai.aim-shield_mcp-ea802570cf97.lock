        },
        {
          "name": "preguntar_al_copiloto",
          "title": "Preguntar al copiloto de la empresa",
          "description": "Con la clave del panel de empresa: responde preguntas como «¿qué arreglo primero?», «¿cómo está el vigía?» o «¿quién tiene acceso?».",
          "inputSchema": {
