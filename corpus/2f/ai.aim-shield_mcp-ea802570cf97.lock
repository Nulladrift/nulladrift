      "serverInfo": {
        "name": "aim-shield",
        "version": "0.159.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AIM SHIELD dice si un mensaje, un enlace o una cuenta bancaria tiene señales de estafa, y da la nota de seguridad de un dominio. Si eres un agente que va a pagar, dar datos o descargar algo, llama antes a «antes_de_actuar» y respeta su decisión. Si eres el chatbot de una empresa, «cortafuegos_de_ia» revisa lo que entra y lo que sale. Para conectar un servidor MCP a un agente, «revisar_servidor_mcp» mira antes sus herramientas. Con la clave del panel de una empresa, responde sobre su seguridad. Las respuestas son en español. Nunca pidas al usuario contraseñas ni códigos.",
      "tools": [
        {
          "name": "antes_de_actuar",
          "title": "Antes de actuar: pagar, dar datos o descargar",
          "description": "Para agentes de IA que actúan en nombre de una persona. Antes de pagar, rellenar datos, iniciar sesión o descargar algo, pásanos el enlace y, si los tienes, el texto de la página y la cuenta (IBAN) a la que vas a pagar. Devuelve «parar», «preguntar» (a la persona) o «seguir», con los motivos. Detecta también instrucciones escondidas en la página dirigidas a la IA. Si vas a pagar y tienes el mandato de pago (AP2), pásalo en «mandato»: comprobamos importe, comercio, dominio, caducidad y beneficiario, pero no la firma. No guardamos nada.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accion": {
                "description": "Lo que vas a hacer.",
                "enum": ["pagar", "dar_datos", "iniciar_sesion", "descargar", "otra"],
                "type": "string"
              },
              "enlace": {
                "description": "La dirección de la página (https://…).",
                "maxLength": 2000,
                "type": "string"
              },
              "iban": {
                "description": "La cuenta a la que vas a pagar, si la hay.",
                "maxLength": 64,
                "type": "string"
              },
              "iban_habitual": {
                "description": "La cuenta de siempre de ese destinatario, si la sabes.",
                "maxLength": 64,
                "type": "string"
              },
              "idioma": {
                "description": "Opcional. La lengua de la respuesta.",
                "enum": ["es", "ca", "gl", "eu"],
                "type": "string"
              },
              "mandato": {
                "description": "Opcional: el mandato de pago del agente (AP2), con «intencion» y/o «carrito». Comprobamos importe, comercio, dominio, caducidad y beneficiario; la firma no la comprobamos.",
                "type": "object"
              },
              "texto_de_la_pagina": {
                "description": "El texto de la página, tal cual, si lo tienes.",
                "maxLength": 40000,
                "type": "string"
              }
            },
            "required": ["accion", "enlace"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a0badbfe0f1950b4c7d388fbc687d0d59eab4cccf577db8c03d8497a8f89cca"
        },
        {
          "name": "comprobar_cuenta_bancaria",
          "title": "Comprobar una cuenta bancaria (IBAN)",
          "description": "Dice si un IBAN es válido, de qué país y banco es y, si das la cuenta de siempre, si el cambio es sospechoso. Úsalo antes de pagar a una cuenta nueva.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "antes": {
                "description": "La cuenta de siempre, si la sabes.",
                "maxLength": 64,
                "type": "string"
              },
              "nueva": {
                "description": "La cuenta nueva (IBAN).",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["nueva"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31eb3f556eb347be651d0d916d445e7730d962c1c4d29455e894f62f53e55a17"
        },
        {
          "name": "comprobar_mensaje",
          "title": "Comprobar un mensaje",
          "description": "Dice si un mensaje (SMS, correo, WhatsApp), un enlace o un texto tiene señales de estafa, por qué y qué hacer. Pega el texto tal cual lo recibiste. No guardamos el mensaje.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idioma": {
                "description": "Opcional. La lengua de la respuesta.",
                "enum": ["es", "ca", "gl", "eu"],
                "type": "string"
              },
              "texto": {
                "description": "El mensaje o el enlace.",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["texto"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:122a2844d9512a38cacd0aa4011f2a25c4415550c371aeb3e3b64d847d7210ef"
        },
        {
          "name": "cortafuegos_de_ia",
          "title": "Cortafuegos de IA: revisar lo que entra o sale de un chatbot",
          "description": "Para chatbots y agentes de una empresa. Con «entrada», pásanos lo que escribió una persona antes de dárselo a la IA: detecta intentos de saltarse sus instrucciones, datos personales y enlaces de estafa. Con «salida», pásanos lo que el chatbot va a responder: detecta datos personales, enlaces peligrosos y peticiones de claves, códigos o pagos. Devuelve «permitir», «revisar» o «bloquear», los motivos y el texto con los datos tapados. No guardamos nada.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contexto": {
                "description": "Opcional, solo con «salida»: la respuesta de un modelo que llegó por un relé. Puede llevar «base_url», «base_urls_conocidas» (lista), «cabeceras» (objeto de texto) y «campos» (lista de nombres de campo). Solo sirve para avisar más.",
                "type": "object"
              },
              "direccion": {
                "description": "«entrada»: lo que escribió la persona. «salida»: lo que va a responder el chatbot.",
                "enum": ["entrada", "salida"],
                "type": "string"
              },
              "idioma": {
                "description": "Opcional. La lengua de la respuesta.",
                "enum": ["es", "ca", "gl", "eu"],
                "type": "string"
              },
              "texto": {
                "description": "El texto, tal cual.",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["direccion", "texto"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7640f010810e98e63819094ac48eb6a4c98d2ad00bd5619a71cd9f642a595786"
        },
        {
          "name": "estado_de_mi_empresa",
          "title": "Estado de seguridad de mi empresa",
          "description": "Con la clave del panel de empresa: la nota y las mejoras pendientes, el vigía del dominio, quién tiene acceso al panel y lo comprobado en Teams.",
