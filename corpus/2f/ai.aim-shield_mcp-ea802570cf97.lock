        },
        {
          "name": "foto_de_seguridad",
          "title": "Foto de seguridad de un dominio",
          "description": "La nota de 0 a 100 del correo, la web y el dominio de una empresa, mirando solo lo público, con las tres mejoras que más la protegen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dominio": {
                "description": "Por ejemplo, empresa.es.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["dominio"],
            "type": "object"
          },
          "annotations": {
