  "lockfileVersion": 2,
  "subjects": {
    "com.apished/token-counter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/tokens"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-tokens",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "tokens_count",
          "description": "Counts tokens under an OpenAI-compatible (tiktoken) encoding. Provide exactly one of model (e.g. \"gpt-4o\") or encoding (\"o200k_base\" or \"cl100k_base\"). No Claude/Anthropic tokenizer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "encoding": {
                "description": "o200k_base or cl100k_base; exactly one of model/encoding",
                "type": "string"
              },
              "model": {
                "description": "e.g. gpt-4o; exactly one of model/encoding",
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "encoding": {
                "type": "string"
              },
              "tokens": {
                "type": "integer"
              }
            },
            "required": ["tokens"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85b74f3030d0d63eac52207daa7fe388b631f51b6f17b1f3f5c077e5df571c7f"
        }
      ],
      "digest": "sha256:cc945980480dd570e2c4195fe5242501c52e40a8fe8e1ee572ae6134e3a396e1"
    }
  }
