        {
          "name": "AI-Abs-Filter",
          "title": "Ai Abs Filter",
          "description": "The **AI Abs Filter API** lets you add realistic abdominal definition to a photo and generate an athletic body-shaping result with minimal effort. Upload a full-body or upper-body image, select the desired enhancement mode, set the intensity level, and receive an edited output image.\nSupported modes:\n- `Six-pack`: Adds visible six-pack abs for a more muscular torso appearance.\n- `Vest-line`: Enhances central abdominal muscle definition for a fit, athletic look.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
                "default": true,
                "description": "If true (default), keep polling until the task finishes, returning the final result. If false, return immediately without waiting for the task to finish.",
                "type": "boolean"
              },
              "request": {
                "anyOf": [
                  {
                    "properties": {
                      "intensity": {
                        "anyOf": [
                          {
                            "enum": [1, 2],
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": 1,
                        "description": "The intensity the users wish to adjust their abs, 2 is the stronger intensity.\n",
                        "examples": [1]
                      },
                      "mode": {
                        "anyOf": [
                          {
                            "enum": ["Six-pack", "Vest-line"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": "Six-pack",
                        "description": "The abs effect user to choose.\n",
                        "examples": ["Six-pack"]
                      },
                      "src_file_url": {
                        "description": "Url of the file to run task. The url should be publicly accessible.",
                        "examples": ["https://example.com/selfie.jpg"],
                        "type": "string"
                      }
                    },
                    "required": ["src_file_url"],
                    "type": "object"
                  },
                  {
                    "properties": {
