        {
          "name": "AI-Hair-Color-Virtual-Try-On",
          "title": "Ai Hair Color Virtual Try On",
          "description": "Explore a wide range of hair colors with our hair color changer! Try the hair color you've always dreamed of and experiment with new shades you’ve never tried before. Easily adjust the intensity of your chosen color with sliders for a customized look.\n   * Upload Your Image\nUpload the photo you want to change hair color for.\n   * Choose Preset Colors or Customize by Pattern and Palettes\nChoose from predefined color presets or fine tune by adjusting the ombre coverage and blend for unlimited possibilities!\n> **Warning:** If both a preset and pattern + palettes are specified, the preset will take priority.\n> **Warning:** Your source image needs to contain the hair section for dyeing, so double-check before applying. Make sure your source image includes the hair area you want to dye — it's your responsibility to get it right.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
                "default": true,
                "description": "If true (default), keep polling until the task finishes, returning the final result. If false, return immediately without waiting for the task to finish.",
                "type": "boolean"
              },
              "request": {
                "anyOf": [
                  {
                    "properties": {
                      "palettes": {
                        "anyOf": [
                          {
                            "items": {
                              "properties": {
                                "color": {
                                  "description": "Hex color code",
                                  "pattern": "^#([A-Fa-f0-9]{6})$",
                                  "type": "string"
                                },
                                "color_intensity": {
                                  "anyOf": [
                                    {
                                      "maximum": 100,
                                      "minimum": 0,
                                      "type": "integer"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "default": null,
                                  "description": "Color intensity (0–100)"
                                },
                                "shine_intensity": {
                                  "anyOf": [
                                    {
                                      "maximum": 100,
                                      "minimum": 0,
                                      "type": "integer"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "default": null,
                                  "description": "Shine intensity (0–100)"
                                }
                              },
                              "required": ["color"],
                              "type": "object"
                            },
                            "maxItems": 2,
                            "minItems": 1,
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "(optional; required if \"preset\" is not provided)   Array length 1 for full mode, 2 for ombre mode\n"
                      },
                      "pattern": {
                        "anyOf": [
                          {
                            "properties": {
                              "blend_strength": {
                                "anyOf": [
                                  {
                                    "maximum": 100,
                                    "minimum": 0,
                                    "type": "integer"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "default": null,
                                "description": "(optional; required for ombre) Blend strength (0–100)"
                              },
                              "coloring_section": {
                                "anyOf": [
                                  {
                                    "enum": ["top"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "default": null,
                                "description": "(optional; required for ombre) Section to color"
                              },
                              "line_offset": {
                                "anyOf": [
                                  {
                                    "maximum": 0.99,
                                    "minimum": -0.99,
                                    "type": "number"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "default": null,
                                "description": "(optional; required for ombre) Vertical offset (–0.99 to 0.99). 0.99: top color covers 99% of bottom half;   –0.99: bottom color covers 99% of top half\n"
                              },
                              "name": {
                                "description": "Pattern type (required)",
                                "enum": ["ombre", "full"],
                                "type": "string"
                              }
                            },
                            "required": ["name"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "(optional; required if \"preset\" is not provided)"
                      },
                      "preset": {
                        "anyOf": [
                          {
                            "enum": ["Jet Black", "Chocolate Brown", "Honey Blonde", "Platinum Blonde", "Ash Gray", "Rose Gold", "Burgundy", "Copper Red", "Lavender", "Teal Blue", "Dark Brown/Caramel Blonde", "Jet Black/Silver Gray", "Ash Brown/Lavender", "Rose Gold/Peach Blonde", "Burgundy/Magenta Pink", "Deep Blue/Teal Green", "Plum Purple/Pastel Lilac", "Copper Red/Golden Blonde", "Dark Gray/Ice Blonde", "Midnight Blue/Denim Blue"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
