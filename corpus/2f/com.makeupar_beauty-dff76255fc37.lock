          "name": "AI-Skin-Analysis-with-Product-Recommendation",
          "title": "Ai Skin Analysis With Product Recommendation",
          "description": "**What it is.** Your product catalog, matched against a precise skin analysis. Upload the skincare products you sell with their descriptions, pass the catalog's id, and the endpoint returns the best-matching products for each detected concern in `llm_results.json`.\nThe difference from a general LLM recommendation is the input. A general LLM recommends from probability and priors. Perfect AI Skin Analysis first produces **scientific, quantified skin metrics and real detection masks**, so the model matches products against measured skin conditions — reliable, fast, and explainable, not a statistical guess.\n**Parameters**\n| Field | Type | Required | Default | Notes |\n||||||\n| `catalog_id` | string | **Yes** | — | From Upload a product catalog. Must be `ready` and belong to your account. |\n| `top_n` | integer | No | `3` | Products recommended **per concern**. Min `1`; must not exceed the catalog's `sku_count`. |\n* Prerequisite — Upload Your Product Catalog\nA product catalog is the list of products Skin Analysis recommends from. Upload it once, keep its `catalog_id`, and pass that id on every analysis call. Catalogs belong to your **account**, not to one API key — every key of the account, project keys included, sees the same catalogs, and rotating or deleting a key does not affect them. Uploading and storing catalogs is free.\n**Catalog file requirements**\n| Item | Value |\n|||\n| Format | CSV with a header row |\n| Encoding | UTF-8, with or without BOM (Excel's \"CSV UTF-8\" adds one) |\n| Maximum file size | 5 MB |\n| Maximum SKU count | No limit other than file size |\n| Required columns | `product_id`, `product_name`, `product_description` |\nExtra columns are ignored but still count toward the 5 MB limit. Quote values containing commas or line breaks. Each non-empty data row counts as one SKU.\n```csv\nproduct_id,product_name,product_description\nSKU-001,Hydrating Serum,\"A lightweight serum for dry skin.\"\nSKU-002,Brightening Cream,\"Evens out skin tone, for daily use.\"\nSKU-003,Barrier Repair Cream,\"Rich cream for dry, redness-prone skin.\"\n```\n```bash\n# Upload a catalog — validated in the same request\ncurl -sS -X POST \"$BASE_URL/s2s/v2.1/product-catalog\" \\\n  -H \"Authorization: Bearer $API_KEY\" \\\n  -F \"file=@catalog.csv\" \\\n  -F \"name=Summer skincare\"\n```\nA valid file answers `status: ready` with its `catalog_id` and `sku_count` — keep that id:\n```json\n{\n  \"status\": 200,\n  \"data\": {\n    \"catalog_id\": \"1662043585118399001\",\n    \"name\": \"Summer skincare\",\n    \"status\": \"ready\",\n    \"created_time\": 1760256000000,\n    \"sku_count\": 3\n  }\n}\n```\n```bash\n# List every catalog of your account, newest first (ready and failed alike)\ncurl -sS -H \"Authorization: Bearer $API_KEY\" \"$BASE_URL/s2s/v2.1/product-catalog\"\n# Delete a catalog — immediate and permanent\ncurl -sS -X DELETE -H \"Authorization: Bearer $API_KEY\" \\\n  \"$BASE_URL/s2s/v2.1/product-catalog/1662043585118399001\"\n```\n**Catalog states and limits**\n| Status | Meaning | Usable in Skin Analysis |\n||||\n| `ready` | Uploaded and validated | Yes |\n| `failed` | Uploaded, file failed validation | No |\nAn upload that fails validation answers an error and is **still recorded as a `failed` catalog**, visible in List catalogs; the error body never carries its `catalog_id`. Each account keeps up to **10 catalogs**, `ready` and `failed` together — delete one before uploading another. To update a catalog, upload a new file: every upload creates a new `catalog_id`, and the old catalog stays usable until you delete it, so you can verify the new one before switching.",
