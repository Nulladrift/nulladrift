                      "src_file_url": {
                        "description": "Url of the file to run task. The url should be publicly accessible.",
                        "examples": ["https://example.com/selfie.jpg"],
                        "type": "string"
                      }
                    },
                    "required": ["features", "src_file_url"],
                    "type": "object"
                  },
