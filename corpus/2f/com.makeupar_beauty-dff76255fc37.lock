        {
          "name": "AI-Skin-Analysis-(Standard)",
          "title": "Ai Skin Analysis (Standard)",
          "description": "**What it is.** Standard Skin Analysis provides objective, quantitative scores for selected skin concerns, along with precise detection masks and heatmaps. \nPowered by advanced AI deep learning and facial region segmentation, Perfect Corp AI Skin Analysis evaluates visible skin conditions from digital images without physical contact. The solution delivers quantitative scores, detection masks, heatmaps, and AR overlays to provide personalized skincare insights to help users better understand their skin and tailor their skincare routines.\n* Supported skin concerns include:\n  * Wrinkles\n  * Moisture\n  * Firmness\n  * Droopy Upper Eyelids\n  * Droopy Lower Eyelids\n  * Pores\n  * Texture\n  * Acne\n  * Oiliness\n  * Spots\n  * Dark Circles\n  * Radiance\n  * Redness\n  * Eye Bags\n  * Tear Trough\nAdditional outputs include Skin Type, Estimated Skin Age, and an Overall Skin Condition Score. All results are image-based indicators intended for skincare insights only and do not constitute clinical measurements, diagnoses, or medical assessments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
                "default": true,
                "description": "If true (default), keep polling until the task finishes, returning the final result. If false, return immediately without waiting for the task to finish.",
                "type": "boolean"
              },
              "request": {
                "anyOf": [
                  {
                    "properties": {
                      "dst_actions": {
