        {
          "name": "AI-Smile",
          "title": "Ai Smile",
          "description": "Introducing Generative AI Smile API, the easy way to turn that frown upside down. This convenient AI smile generator transforms sad or neutral facial expressions into happy, natural looking smiles in just moments. Powered by advanced generative AI, it helps bring warmth and positivity to any photo with a simple and effortless process. Upload an image, let the AI work its magic, and instantly convert your sad face into a cheerful smiley face that spreads happiness everywhere it's shared.\nThe AI Smile generator supports two distinct smile styles, giving users more control over the final expression.\n1.  **smile_with_teeth_visible**  \n    This option creates a bright, joyful smile with naturally visible teeth. It is ideal for upbeat portraits, social media photos, and situations where a warm and expressive look is desired.\n2.  **closed_mouth_smile**  \n    This option produces a subtle, gentle smile with lips closed. It works well for professional photos, formal profiles, or when a calm and natural expression is preferred.\nUsers can easily choose the smile type that best matches their photo, mood, or intended use, ensuring realistic and appealing results every time.\nWhether you're editing photos, creating fun content, or simply want to add a touch of positivity, Generative AI Smile makes it easy to spread happiness, one smile at a time.\nUpload a face. Click once. Smile instantly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
