        {
          "name": "AI-Skin-Analysis-with-Advanced-Report",
          "title": "Ai Skin Analysis With Advanced Report",
          "description": "**What it is.** A full-dimension skin report written in natural language, generated by a large language model fed your **precision AI skin analysis** together with a **professional skincare reference database**. The model does not guess at your skin — it interprets measured, quantified skin metrics and real detection masks, compares them against professional skincare data, and returns a complete report in `llm_results.json`.\n**Which `dst_actions` feed each dimension of the report.** The report is only as rich as the features you request. `dst_actions` is required, and **HD and SD features cannot be mixed in one request** — pick one family.\n| Report dimension | V2.1 feature | Regions returned |\n||||\n| Face outline and feature localization | `pf_camera_kit: true` | — |\n| Skin type | `hd_skin_type` | `whole`, `t_zone`, `u_zone` |\n| T-zone vs. U-zone comparison | `hd_skin_type` | `t_zone`, `u_zone` |\n| Forehead lines and frown lines | `hd_wrinkle` | `forehead`, `glabellar` |\n| Crow's feet and smile lines | `hd_wrinkle` | `crowfeet`, `nasolabial` |\n| Pore distribution | `hd_pore` | `forehead`, `nose`, `cheek`, `whole` |\n| Skin smoothness | `hd_texture` | `whole` |\n**Parameters**\n| Field | Type | Default | Notes |\n|||||\n| `language` | string enum | `enu` | `enu` `cht` `jpn` `kor` `fra` `deu` `esn` `ita` `ptb` `ind` `ara` |\n| `tone` | string enum | `warm` | `warm` \\| `direct` — both tones stay professional |\n| `country` | string | — | Adds climate and seasonal context to the report |\n| `city` | string | — | Adds climate and seasonal context to the report |\nSend `\"advanced_report\": {}` to accept every default. Omit the object entirely for no report.",
