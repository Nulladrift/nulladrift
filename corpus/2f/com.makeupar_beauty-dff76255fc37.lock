        {
          "name": "AI-Face-Attributes-and-Ratio-Analyzer",
          "title": "Ai Face Attributes And Ratio Analyzer",
          "description": "The AI Face Attributes & Ratio Analyzer examines face structure, identifying features like face, eye, eyebrow, lip, nose, cheekbone shapes, designed to provide personalized recommendations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
                "default": true,
                "description": "If true (default), keep polling until the task finishes, returning the final result. If false, return immediately without waiting for the task to finish.",
                "type": "boolean"
              },
              "request": {
                "anyOf": [
                  {
                    "properties": {
                      "face_angle_strictness_level": {
                        "anyOf": [
                          {
                            "enum": ["strict", "high", "medium", "low", "flexible"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "The strictness level of face angle detection (pitch, yaw, roll).\nA stricter level ensures more accurate face attribute results.\nDefault is 'high'.\noptoins:\n  - strict: pitch <= 4 degrees, yaw <= 6 degrees, roll <= 4 degrees\n  - high: pitch, yaw, roll <= 10 degrees\n  - medium: pitch, yaw, roll <= 15 degrees\n  - low: pitch, yaw, roll <= 20 degrees\n  - flexible: pitch, yaw, roll <= 30 degrees\n",
                        "examples": ["high"]
                      },
                      "features": {
                        "description": "AI Face Analysis categories\n* Face Analysis\n  - FACE: faceShape\n  - EYES: eyeShape eyeSize eyeAngle eyeDistance eyelid\n  - BROWS: eyebrowShape eyebrowThickness eyebrowDistance eyebrowShortness\n  - LIPS: lipShape\n  - NOSE: noseWidth noseLength\n  - CHEEKBONES: cheekbones\n  - AGE & GENDER: age gender\n  - COLORS: eyeColor hairColor eyebrowColor lipColor\n\n* Facial Ratios\n  - horizontalThird\n  - verticalFifth\n  - faceAspectRatio\n  - eyeAspectRatio\n  - eyebrowPosition\n  - eyebrowArch\n  - eyeHeightToEyebrowDistance\n  - noseAspectRatio\n  - noseWidthToMouthWidth\n  - noseToLipToChin\n  - upperLipToLowerLip\n",
                        "items": {
                          "enum": ["eyeShape", "eyeSize", "eyeAngle", "eyeDistance", "eyelid", "eyebrowShape", "eyebrowThickness", "eyebrowDistance", "eyebrowShortness", "cheekbones", "faceShape", "lipShape", "noseWidth", "noseLength", "age", "gender", "eyeColor", "lipColor", "eyebrowColor", "hairColor", "horizontalThird", "verticalFifth", "faceAspectRatio", "eyeAspectRatio", "eyebrowPosition", "eyebrowArch", "eyeHeightToEyebrowDistance", "noseAspectRatio", "noseWidthToMouthWidth", "noseToLipToChin", "upperLipToLowerLip"],
                          "type": "string"
                        },
