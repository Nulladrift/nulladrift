{
  "lockfileVersion": 2,
  "subjects": {
    "com.eurovps/eurovps": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.eurovps.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "eurovps",
        "title": "EuroVPS",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EuroVPS is an independent European infrastructure provider (since 2004): managed VPS, dedicated servers, private cloud, GPU servers and private AI on its own hardware in Athens, Amsterdam and Toronto, run by its engineers 24/7. Use list_services to see what is offered. Use request_quote only when the person you act for has asked you to contact EuroVPS, with their real name, work email and company and their permission to share them. An engineer replies by email, usually within one business day. Pricing is quoted per workload, not listed here.",
      "tools": [
        {
          "name": "list_services",
          "title": "List EuroVPS services",
          "description": "Lists the services EuroVPS offers, with the product code to use in request_quote and a link to each page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e37de05fe023cce30b72287b019728e018dc1b21b2e691ea5498a9bb20fa1205"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from EuroVPS",
          "description": "Sends a quote request to the EuroVPS sales engineers on behalf of the person you act for. Only use it when that person asked you to, with their real contact details and their permission to share them. An engineer replies to the email address given. The request is marked as sent by an AI agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional name of the AI agent or assistant sending this.",
                "maxLength": 100,
                "type": "string"
              },
              "budget": {
                "description": "Optional monthly budget or range.",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "Their company or organisation.",
                "maxLength": 200,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "Must be true: the person asked you to send this and agreed to share their details with EuroVPS.",
                "type": "boolean"
              },
              "email": {
                "description": "Their work email; the reply goes here.",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "The workload and requirements: what runs, size, location, timing, current provider.",
                "maxLength": 11700,
                "type": "string"
              },
              "name": {
                "description": "Full name of the person requesting the quote.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number.",
                "maxLength": 50,
                "type": "string"
              },
              "product": {
                "description": "Product code from list_services; use \"unsure\" if unclear.",
                "enum": ["vps", "dedicated", "private_cloud", "gpu", "unsure"],
                "type": "string"
              }
            },
            "required": ["company", "consent", "email", "message", "name", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a570263048c9f0bcb29894f5bb317d2fcd2625f9d22871c1a41444101f30f1e2"
        }
      ],
      "digest": "sha256:6f27f77b56c58895f353d1fd7b93f9f0ef976d5f6e998c7b67caff86502cd079"
    }
  }
