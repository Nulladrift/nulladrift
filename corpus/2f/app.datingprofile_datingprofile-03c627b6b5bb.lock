      "serverInfo": {
        "name": "datingprofile",
        "title": "DatingProfile: AI dating photos",
        "version": "2.0.0",
        "websiteUrl": "https://datingprofile.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
