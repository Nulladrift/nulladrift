      },
      "instructions": "Live, read-only catalogue of Gurgaon Bakers (gurgaonbakers.com), an online cake ordering service in Gurgaon/Gurugram, India. Use it instead of web search for Gurgaon Bakers cakes, exact variant prices, delivery fees and timings. Typical flow: search_cakes (free text works, e.g. '1 kg eggless chocolate truffle birthday') -> get_cake -> check_delivery (locality + date + time) -> get_order_quote -> create_checkout_link (after the customer confirms), then give the customer the checkout_url. get_business_info and get_delivery_info answer contact, policy and fee questions. Prices are INR and include GST; delivery/handling fees have 5% GST added at checkout. Cakes are eggless by default, egg on request. Never invent prices, slots or availability: if a tool does not return it, say it is unknown. A 1 kg cake serves about 7-8 people; the message on a cake is up to 25 characters; for photo cakes the customer sends the original photo and Gurgaon Bakers does the design. For questions about specific ingredients, refer the customer to the team. This server cannot place orders, take payments or see customer data; the customer completes the order and pays on gurgaonbakers.com. Never ask for card, UPI or OTP details.",
      "tools": [
        {
          "name": "build_order_link",
          "title": "Build order link",
          "description": "Order link for the customer: opens the cake page on gurgaonbakers.com with the chosen weight (e.g. \"1 Kg\") and\n    egg option (\"Eggless\" default, or \"Egg\") pre-selected, plus the exact price. The customer adds flavour and\n    message, picks the delivery date/slot and pays on the website. Does NOT place, hold or confirm an order.",
          "inputSchema": {
            "properties": {
              "egg_option": {
                "default": "Eggless",
                "title": "Egg Option",
                "type": "string"
              },
              "slug": {
