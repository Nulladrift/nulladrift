        {
          "name": "search_cakes",
          "title": "Search cakes",
          "description": "Search Gurgaon Bakers' live cake catalogue. Use for any request to find, compare or price cakes.\n    query: free text, e.g. \"1 kg eggless chocolate truffle birthday\" - weight, egg/eggless and budget words in the\n    text are understood. Optional filters: category slug (e.g. \"cakes-for-kids\"), eggless (true = eggless,\n    false = with egg), max_price (INR, incl. GST), weight (e.g. \"1 Kg\", \"500 g\").\n    Returns at most 10 cakes (no pagination). Each result has match.variant = the exact price and order link for the\n    requested weight/egg option. Constraints are never relaxed silently: status \"no_match\" comes with clearly\n    labelled alternatives that do NOT meet the request. Read-only; places no order.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "",
                "title": "Category",
                "type": "string"
