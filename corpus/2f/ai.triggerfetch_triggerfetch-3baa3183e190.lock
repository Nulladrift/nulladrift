          "title": "Sign In",
          "description": "Sign in the brand's agent with its claim_seat identity: give the card address the brand claimed its seat with and one of its barcodes. Returns a token to place at https://<card domain>/.well-known/triggerfetch.txt or in DNS TXT _triggerfetch.<domain>; then call sign_in_verify.",
