          "name": "correct_product",
          "title": "Correct Product",
          "description": "Corrected: the signed-in brand gives the words it wants its product found by (name, brand, size) for one barcode and one country. Writes a new match record on matchfetch and issues a new receipt on rco.wefetch.ai that supersedes the last one for that barcode. The next index edition shows whether the answer changed.",
          "inputSchema": {
            "properties": {
              "barcode": {
