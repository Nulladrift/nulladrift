      "instructions": "Is your product in the answer when a shopper asks? For one barcode in one country: found (whether ChatGPT, Claude, Gemini and Grok name it, and where in the four it sits), likely why (the most probable reason from what the record shows: wrong name, missing barcode, not in the catalogue the AI reads, not verified, not orderable) and corrected (the brand's own words bound to its barcode, with a new receipt). One free check a day; then the brand's agent signs in.",
      "tools": [
        {
          "name": "check_product",
          "title": "Check Product",
          "description": "Is your product in the answer when a shopper asks? For one barcode in one country: found (whether ChatGPT, Claude, Gemini and Grok name it, and where in the four it sits), likely why (the most probable reason from what the record shows: wrong name, missing barcode, not in the catalogue the AI reads, not verified, not orderable) and corrected (the brand's own words bound to its barcode, with a new receipt). One free check a day; then the brand's agent signs in.",
