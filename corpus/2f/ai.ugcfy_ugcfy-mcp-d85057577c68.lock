{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ugcfy/ugcfy-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ugcfy.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ugcfy",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "breakdown_ad",
          "title": "Break down a short-form video ad",
          "description": "Reverse-engineer a competitor TikTok or Instagram Reels ad: hook type and why it works, the segment-by-segment structure, selling points, call to action, and 2-3 copywriting moves worth reusing. Pass a public video link, or paste the ad text if you already have it. Returns a breakdown_id you can hand to rewrite_ad_for_product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "notes": {
                "description": "Optional context, e.g. \"skincare brand, US market\".",
                "maxLength": 500,
                "type": "string"
              },
              "transcript": {
                "description": "The ad caption or voiceover text. Use this when you already have the text or when transcription is unavailable.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "video_url": {
                "description": "Public TikTok or Instagram Reels ad URL.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3fd9542105dc98ead69d0562da6440b0042c11024836cb07251b74186a3d60e3"
        },
        {
          "name": "estimate_ad_cost",
          "title": "Solve ad budget, impressions, or CPM",
          "description": "Give any two of budget (USD), impressions, and CPM, and get the third. Free and unlimited.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Ad spend in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cpm": {
                "description": "Cost per 1,000 impressions in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "impressions": {
                "description": "Number of impressions.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:50db91dd0fc96d54bcb083461165b59b8152eb52ecd8d68935a157a3a47c831c"
        },
        {
          "name": "generate_hooks",
          "title": "Generate UGC ad hooks",
          "description": "Write 8 scroll-stopping opening lines for a UGC-style video ad, each labelled with its hook type (problem, curiosity, social proof, POV, before-after, negativity) and the psychology behind it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "tiktok, reels, or meta. Default tiktok.",
                "enum": ["tiktok", "reels", "meta"],
                "type": "string"
              },
              "product": {
                "description": "Product page URL, or a short description of the product (what it is, who it is for, the main benefit).",
                "maxLength": 2000,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59d4c50a0ee362b6b9d93e341d63e79bd441fd838bc24d028ce4b86287b351b4"
        },
        {
          "name": "rewrite_ad_for_product",
          "title": "Rewrite a proven ad for your product",
          "description": "Take a reference ad (a breakdown_id from breakdown_ad, a video link, or pasted ad text) and write 1-3 scene-by-scene UGC script variants for a different product that keep the same hook type and structure without copying the competitor. Returns an open_url that loads the scripts into UGCfy AI, where the user can render them as videos with AI actors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "breakdown_id": {
                "description": "Reuse a breakdown from breakdown_ad (saves time; valid 7 days).",
                "maxLength": 40,
                "type": "string"
              },
              "platform": {
                "description": "Target placement. Default tiktok.",
                "enum": ["tiktok", "reels", "meta"],
                "type": "string"
              },
              "product": {
                "description": "Product page URL, or a short description of the product (what it is, who it is for, the main benefit).",
                "maxLength": 2000,
                "minLength": 4,
                "type": "string"
              },
              "reference_transcript": {
                "description": "Reference ad text, if you have no breakdown_id or video link.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "reference_video_url": {
                "description": "Reference TikTok or Instagram ad URL, if you have no breakdown_id.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "variants": {
                "description": "How many script variants to write (1-3). Default 2.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fec5bdc6610a73d15fd2114393d99e738303ab5b9a1eb4ac4678e30c3455724a"
        },
        {
          "name": "write_ugc_script",
          "title": "Write UGC ad scripts from a product",
          "description": "Analyze a product (link or description) and write 4 complete 20-30 second UGC video ad scripts with different angles, scene by scene, plus the product profile used (benefits, proof points, objections). Use this when there is no reference ad to copy. Returns an open_url that loads the scripts into UGCfy AI to render as videos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product page URL, or a short description of the product (what it is, who it is for, the main benefit).",
                "maxLength": 2000,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:45aa98fba8b843ed2243bedd583e5e3506c0093b007d0d82918c61131df60a1e"
        }
      ],
      "digest": "sha256:c6e8302dfdca7116d16c4a11c25195e5a91c38ee5528c04b8f25d2884c19c378"
    }
  }
}
