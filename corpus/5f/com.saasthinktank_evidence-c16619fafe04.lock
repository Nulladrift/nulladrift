      "instructions": "SaaS Think Tank is a software research publication. This MCP edition exposes only the app-builder findings listed in the coverage resource. Use search_findings to find published evidence, get_finding for a record ID, and compare_products for covered products and questions. Read the coverage resource for scope. Preserve original check dates, conditions, limits, source links and attribution. A dataset release date is not a new product check. Unknown is not no. Findings are dated and do not establish current prices, overall rankings, full app portability or repository import support. This service reads a released dataset and never performs live vendor checks.",
