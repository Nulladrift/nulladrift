        {
          "name": "watch_sailing",
          "title": "Watch a cruise price",
          "description": "Start a price alert for the signed-in user on one sailing (id from search_sailings or get_sailing), for a party and cabin: we email them when the all-in price drops by 3% and at least $25, or below target_total_usd if given. Offer it after showing a sailing the user likes (\"Want me to watch this price?\"); call it only when they say yes. Needs the user's Cruise Register account: if they aren't connected yet, the result asks them to connect. Never tell the user a watch is set unless this call succeeded.",
