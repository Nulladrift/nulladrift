      "instructions": "Cruise Register: cruise prices, itineraries, ports and ships for US travellers, from cruise lines' own data.\n\nHow to answer:\n- Call find first to turn a ship, port, line or destination name into an id; the other tools take ids.\n- Prices: quote only numbers a tool returned, with who they are for (for example \"for two adults sharing, inside cabin\") and\n  what it includes (each price's includes field). Never estimate, add up or convert a price yourself.\n  A price marked fare_only may be low: say so.\n- Ratings: every ship, port, line and sailing carries our passenger rating (score out of 5, review count, source). Give it\n  with its review count; when the rating is null, give the reason instead of leaving it out.\n- Travellers outside the US: on a departure from Australia, New Zealand or the UK, local_price (local_prices, local_lead)\n  is the line's own price in A$, NZ$ or £, never converted. When leads is true (or local_lead is set), quote that all-in\n  first, then the US$ total. Write US dollar amounts as US$ for those travellers.\n- Link the user to the page in each row's url for details. To book, give book_url: it is our link and forwards to the\n  booking site; never name or guess a booking site. Results show at most 10 rows: narrow the search rather than asking for more.\n- Deals: find_deals gives a port's picks with why each was picked; say the reason and the evidence it returned.\n- Cabin availability: quote prices only from the fresh prices returned. For STALE give the last checked date.\n  For UNAVAILABLE say “Not available”. A different cabin can still have a current price.\n- Getting from the airport to the ship: call get_transfers; give the ways with their prices for two and times as returned, with\n  the Best for most pick and its reason. An estimate stays \"about\"; a part-of-the-way fare says what's extra.\n- Price alerts: after you show sailings or deals, end with one short offer to watch a price: \"Want me to watch the price and\n  email you if it drops?\" (the result's price_alert field carries it). Offer it once per conversation, not after every answer, and\n  not again once they decline. Call watch_sailing only when they say yes, for the sailing they mean:\n  price alerts go through watch_sailing after the OAuth sign-in. Never say a watch is set unless watch_sailing returned it.\n  Without their Cruise Register account connected it asks them to connect. Never ask the user to paste an email into chat for\n  the site's form. my_watches lists their watches.\n- Shore excursions come as figures across tours (how many, typical length and price per person, average rating) and how many\n  fit a call (tours_that_fit); the tours themselves are on our page in see_tours_url: link it. Never name, price or link a\n  single tour from memory.\n- Commission: wherever you give a result's booking links (cruises or a private car), add its disclosure line as written, when\n  present.\n- Port days and ship positions are scheduled from the lines' itineraries, not live tracking. Climate is monthly normals,\n  not a forecast.",
      "tools": [
        {
          "name": "excursion_activity",
          "title": "One kind of excursion at a port",
          "description": "One category of excursion at a port by its slug: how many tours, how many fit a usual morning or afternoon call, typical length and price per person, the review-weighted average rating, and what these tours involve, in our words. Also how many of that kind fit one call (as port_excursions picks it), with see_tours_url, our page listing them; no single tour. Take the slug from port_excursions' categories for that port (map the user's words, such as \"snorkelling\" or \"kayaking\", to one of them yourself). An unknown slug returns an error listing the port's categories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "call_type": {
                "description": "Fit the tours to a usual morning or afternoon call, when there's no ship and date",
                "enum": ["morning", "afternoon"],
                "type": "string"
              },
              "category": {
                "description": "A category slug from port_excursions' categories for this port, e.g. snorkeling or whale-watching. Once our own set is live the slugs are: beach-and-snorkel (Beach and snorkel), scuba (Scuba), glaciers-and-wildlife (Glaciers and wildlife), whale-watching (Whale watching), food-and-drink (Food and drink), history-and-sightseeing (History and sightseeing), adventure (Adventure), private-and-small-group (Private and small group), passes-and-self-guided (Passes and self-guided)",
                "maxLength": 60,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "date": {
                "description": "A call date to fit the tours to",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "port_id": {
                "description": "Port id from find",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              },
              "ship_id": {
                "description": "With date: fit the tours to this ship's call (id from find or get_sailing)",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["category", "port_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
