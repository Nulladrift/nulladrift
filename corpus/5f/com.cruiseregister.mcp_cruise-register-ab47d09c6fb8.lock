              "port_id": {
                "description": "Port id from find",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              },
              "ship_id": {
                "description": "With date: fit the tours to this ship's call (id from find or get_sailing)",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["port_id"],
            "type": "object"
