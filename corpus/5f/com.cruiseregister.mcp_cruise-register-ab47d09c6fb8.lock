        {
          "name": "search_sailings",
          "title": "Search cruises",
          "description": "Compare sailings that match a traveller’s dates, party and cabin. Filter by destination, departure port, line, ship, dates, length, party and cabin. Returns up to 10 sailings with the all-in total for the party (fare, taxes, required charges and gratuities, as our sailing pages show it) and a link to each sailing page. On a departure from Australia, New Zealand or the UK, local_price is the line's own fare in that currency; when local_price.leads is true, quote its all_in_for_two first, then the US$ total. book_url is our booking link: link that, never a booking site by name. Use find first to turn names into ids. Quote prices only from the returned rows.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cabin": {
                "default": "any",
                "description": "Cabin class; any = the cheapest cabin",
                "enum": ["any", "inside", "oceanview", "balcony", "suite"],
                "type": "string"
              },
              "calls_at": {
                "description": "A port id (from find) the sailing calls at",
                "maxLength": 40,
                "type": "string"
              },
              "depart_after": {
                "description": "Earliest departure date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "depart_before": {
                "description": "Latest departure date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "A cruise region the sailing visits",
                "enum": ["Europe", "Caribbean", "Alaska", "Mediterranean", "Northern Europe", "Bahamas", "Hawaii", "Mexico", "Bermuda", "Japan", "Australia", "New Zealand"],
                "type": "string"
              },
              "from_port": {
                "description": "Departure port id (from find)",
                "maxLength": 40,
                "type": "string"
              },
              "line": {
                "description": "Cruise line id (from find), e.g. carnival-cruise-line",
                "maxLength": 60,
                "type": "string"
              },
              "max_total_usd": {
                "description": "Highest all-in total for the whole party",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "nights_max": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "nights_min": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "party": {
                "default": "2A",
                "description": "Who travels: 2A two adults (default), 1A one adult, 2A2C two adults and two children",
                "enum": ["2A", "1A", "2A2C"],
                "type": "string"
              },
              "ship": {
                "description": "Ship id (from find)",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "default": "price",
                "description": "Order: price (Lowest price: the all-in price for two (the total the row shows)); price_high (Highest price: the all-in price for two, highest first); night (Lowest per night: the all-in price for two divided by the nights); saving (Biggest saving: furthest below the ship's usual price for similar dates); date (Soonest: the departure date); short (Shortest: the number of nights); long (Longest: the number of nights); ship (Best-rated ship: the ship's passenger score out of 5); ports (Best-rated ports: the average passenger score of the itinerary's scored ports). per_night is the same as night. saving, ship and ports order the 200 cheapest matches; sailings without the figure come last.",
                "enum": ["price", "price_high", "night", "saving", "date", "short", "long", "ship", "ports", "per_night"],
                "type": "string"
              }
            },
            "type": "object"
