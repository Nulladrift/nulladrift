        {
          "name": "port_excursions",
          "title": "Excursions at a port",
          "description": "Shore excursions at a cruise port as figures across tours: how many, how many fit a ship's time ashore (for a date, or a usual morning or afternoon call), typical length and price per person (middle half), the review-weighted average rating, and the categories, plus how many tours fit one call (a ship on a date, the first call that date, or a usual morning or afternoon call; default: the port's most common) with see_tours_url, our page listing them. Figures across tours only: no single tour, price or booking link; send the user to see_tours_url for the tours themselves.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
