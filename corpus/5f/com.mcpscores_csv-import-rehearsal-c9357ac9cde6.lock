      "serverInfo": {
        "name": "com.mcpscores/csv-import-rehearsal",
        "title": "CSV Import Rehearsal",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Simulate a CSV import against a supplied typed column contract and return exact accepted rows, rejected rows, proposed normalizations and formula-risk cells. The rehearsal never writes an import destination. Tool calls cost 0.03 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Explicit delimiter only: comma, semicolon or tab; no delimiter or encoding sniffing. Typed contracts support string, integer, decimal, boolean and date; no business-rule inference. Bounded at 128 KiB serialized input, 16 KiB contract, 1000 rows, 50 columns and 4096 characters per cell. Proposed normalizations are reviewable output, not an import or safety certification. Completed reports can contain supplied CSV values needed for the requested rehearsal; admission/parse failures expose structural facts only. Result artifacts are retained for 24 hours and bounded at 96 KiB.",
      "tools": [
        {
          "name": "rehearse_csv_import",
          "description": "Simulate a CSV import against a supplied typed column contract and return exact accepted rows, rejected rows, proposed normalizations and formula-risk cells. The rehearsal never writes an import destination. Price: 0.03 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_extra_columns": {
                "type": "boolean"
              },
              "columns": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "enum": {
                      "items": {
                        "type": "string"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "name": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "required": {
                      "type": "boolean"
                    },
                    "trim": {
                      "type": "boolean"
                    },
                    "type": {
                      "enum": ["string", "integer", "decimal", "boolean", "date"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "type"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "csv": {
                "type": "string"
              },
              "delimiter": {
                "enum": [",", ";", "\t"],
                "type": "string"
              }
            },
            "required": ["columns", "csv"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
