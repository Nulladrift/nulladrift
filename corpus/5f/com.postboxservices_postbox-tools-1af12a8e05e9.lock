          },
          "digest": "sha256:5fbfb7f8ea25c52c2a79579eaf13098e561b83a22a17deb5de5c63552b556edf"
        },
        {
          "name": "get_domain_age",
          "title": "Domain age lookup",
          "description": "Get a domain's registration date and age (young domains have weak sending reputation).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
