          },
          "digest": "sha256:7b65c6bc177b9c37275a2a2692c4f0217ff88c627dfd93b3e0bee9845411edf1"
        },
        {
          "name": "trace_redirect",
          "title": "URL redirect chain tracer",
          "description": "Follow a URL server-side through every HTTP redirect hop to its real final destination - per-hop status, IP, TLS and timing, plus phishing/deliverability flags (cross-domain jumps, https downgrades, meta/JS redirects). Fetching is SSRF-hardened (private ranges blocked, HTTPS-only, per-hop validation); how it works: https://redirect.postboxservices.com/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Absolute http:// or https:// URL to trace",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
