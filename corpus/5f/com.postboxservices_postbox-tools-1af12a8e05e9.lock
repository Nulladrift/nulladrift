        "name": "postbox-tools",
        "title": "Postbox Services - Email Deliverability & Security Tools",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free email deliverability and security checks by Postbox Services: check whether a domain or IP is on an email blacklist (DNSBL), grade a domain's spoofing/BEC exposure (SPF, DKIM, DMARC), trace a URL's redirect chain, run a full deliverability/spam test on a real message, analyze a raw .eml, look up domain age and WHOIS, check a domain's BIMI record and logo, and grade a website's AI discoverability (robots.txt access for AI crawlers, sitemap, llms.txt). Each tool checks the exact target given and returns structured results plus a link to the full web report.",
      "tools": [
        {
          "name": "analyze_eml",
          "title": "Analyze a raw email file (.eml)",
          "description": "Run a deliverability/content analysis on a raw RFC 822 email (.eml source: full headers + body). IMPORTANT LIMITS: with no live SMTP session, SPF, blacklist and reverse-DNS cannot be verified from a file - for the authoritative score use create_mailtest instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "eml": {
                "description": "The complete raw email source (headers + body), as exported via \"Show original\" / \"Download message\"",
                "type": "string"
              }
            },
            "required": ["eml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze a raw email file (.eml)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3f682d072fba94f7d2e30fbb4b94ab902cc02f2bbf30bef17791e95501f4a745"
        },
        {
          "name": "check_ai_discoverability",
          "title": "AI discoverability check (A-F grade)",
          "description": "Grade how discoverable a website is to AI answer engines (ChatGPT search, Perplexity, Claude, Google AI Overviews, Copilot and others) from its public files: robots.txt access for each major AI crawler (answer-engine vs training), sitemap.xml, plus llms.txt and ai.txt as informational signals. Returns an A-F grade, per-crawler access and findings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Website domain to grade, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AI discoverability check (A-F grade)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0787d81609fdd0d5fcce97ac01e6bc89819f893cb0ed85121c65755a1b6822f1"
        },
        {
          "name": "check_bimi",
          "title": "BIMI record + logo check",
          "description": "Check a domain's BIMI setup: looks up the default._bimi TXT record, fetches the logo it points to (l=) and validates the SVG against the BIMI SVG Tiny Portable/Secure profile, and reports whether a certificate (a=, VMC or CMC) is referenced. Does not verify the certificate itself or the DMARC policy (BIMI also needs DMARC at enforcement - use check_spoofability for that).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "BIMI record + logo check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:903945a4506986d10fc87552cb536b768f745a7e5b0de19afe6a664bb2a394d5"
        },
        {
          "name": "check_blacklist",
          "title": "Email blacklist check",
          "description": "Check a domain against domain blacklists (Spamhaus DBL, SURBL, URIBL and others), or an IP address against 24 IP blacklists including Spamhaus ZEN, Barracuda and SpamCop. Checks the exact target given: domains are not resolved to IPs. Returns per-list listing status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "IPv4 address (checked against IP blacklists) or domain (checked against domain blacklists)",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email blacklist check"
          },
          "behavior": {
            "destructive": false,
