          },
          "digest": "sha256:8a8225ff01578ad3f24be9a460f5e17c3b208e24be268c845b74169ae315b927"
        },
        {
          "name": "get_mailtest_result",
          "title": "Get an email deliverability test result",
          "description": "Fetch the score and breakdown of a mail test created with create_mailtest, once the user has sent their email to the disposable address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The test id returned by create_mailtest",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an email deliverability test result"
          },
          "behavior": {
            "destructive": false,
