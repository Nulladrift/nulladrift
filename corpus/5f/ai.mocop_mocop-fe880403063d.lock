        {
          "name": "search_capabilities",
          "description": "Search everything the index knows (APIs, MCP servers, A2A agents and the operations, tools and skills they expose) for what an agent needs to do. Use this first when you do not know which kind of thing you need. Supports field filters such as api:payment or op:refund method:POST.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of results to skip, for paging (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "protocol": {
                "description": "Only entities that speak this protocol, e.g. rest, graphql, mcp or a2a. Optional; the protocol: filter in the query does the same.",
                "examples": ["rest", "graphql", "mcp", "a2a"],
                "type": "string"
