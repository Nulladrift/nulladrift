        {
          "name": "search_agents",
          "description": "Search A2A agents only. Use when you need another agent to delegate a task to. Supports filters such as skill:booking.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of results to skip, for paging (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "protocol": {
                "description": "Only entities that speak this protocol, e.g. rest, graphql, mcp or a2a. Optional; the protocol: filter in the query does the same.",
                "examples": ["rest", "graphql", "mcp", "a2a"],
                "type": "string"
              },
              "query": {
                "description": "What the agent needs to do, in plain words or with filters, e.g. \"send an SMS\" or \"api:payment auth:oauth\". Free words plus optional field filters. Words match names, descriptions and capability names (all words must match; falls back to any word). Filters: api:/mcp:/agent:<words> (scope to that kind and also match its operations/tools/skills), op:/endpoint:/tool:/skill:<words> (search inside operations, tools or skills), method:GET|POST|..., path:/v1/charges, group:<name>, domain:example.com, org:<slug or name>, auth:oauth|api_key|bearer|none, protocol:rest|graphql|mcp|a2a, verification:declared|observed|protocol_verified, verified:true, lang:fr, tag:<tag>. Prefix a word or filter with - to exclude it; use \"quotes\" for a phrase. Examples: `payment`, `api:payment auth:oauth`, `op:refund method:POST`, `mcp:calendar -auth:none`, `tool:search domain:github.com`. Searching agents only.",
                "examples": ["send an SMS", "api:payment auth:oauth", "op:refund method:POST"],
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
