        {
          "name": "get_capabilities",
          "description": "List the operations, tools and skills of one API, MCP server or agent (paged). Use to find the exact call to make. Filter by group, kind, HTTP method or text; can show older versions or removed items.",
          "inputSchema": {
            "properties": {
              "group": {
                "description": "Only items in this group or tag, exactly as listed in the response `groups`, e.g. \"Billing\".",
                "type": "string"
              },
              "kind": {
                "description": "Only this kind of item.",
                "enum": ["rest_operation", "graphql_operation", "mcp_tool", "mcp_resource", "mcp_prompt", "a2a_skill"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum items to return (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "method": {
                "description": "Only REST operations with this HTTP method.",
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip, for paging (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to find in item names, summaries, groups and paths, e.g. \"refund\".",
                "maxLength": 100,
                "type": "string"
              },
              "removed": {
                "default": false,
                "description": "Include items that were removed in the latest crawl (default false).",
                "type": "boolean"
              },
              "slug": {
                "description": "The entity's slug, as returned in search results (field `slug`), e.g. \"mcp-hundily-com-63b5e97c\".",
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "group",
                "description": "Sort order: group (default, as published), name (A to Z) or method.",
                "enum": ["group", "name", "method"],
                "type": "string"
              },
              "version": {
                "description": "Show the items as they were at this older version number (see get_entity_versions). Omit for the latest.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
