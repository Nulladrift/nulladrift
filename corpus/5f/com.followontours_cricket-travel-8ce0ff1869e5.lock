          },
          "digest": "sha256:d775f9493c74b65ca136d67026a26525f87067d55fd2e81ef98a3f557cce161e"
        }
      ],
      "digest": "sha256:36d7754d04d1fcb3d190252d5fbee2d03d05a4172d8e5e335ea65c9ab40e4ad2"
