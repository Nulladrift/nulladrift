        {
          "name": "list_cape_town_experiences",
          "title": "Cape Town experiences",
          "description": "List the Cape Town day experiences Follow On Tours arranges — city and peninsula tours, the Winelands, whale watching, Marine Big 5, shark cage diving, safari and a scenic helicopter flight — with what each day covers and what is included. Use this for any Cape Town or South Africa enquiry. Enquiry-led: no price is quoted and nothing is charged online. Follow On Tours also builds a full Cape Town week around these on request.",
