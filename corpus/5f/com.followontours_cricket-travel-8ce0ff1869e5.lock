      "instructions": "Bespoke sports travel: cricket, golf, rugby, polo and playing tours. List what is on sale, get indicative prices for published tours (get_price), and request a quote for a traveller (they confirm by email).",
      "tools": [
        {
          "name": "get_about",
          "title": "About Follow On Tours",
          "description": "Get information about Follow On Tours — who we are, what we sell (bespoke cricket, golf, rugby, polo and playing tours), our experience, our financial protection, and how the service works. Use this when someone asks who Follow On Tours is, whether they cover a sport or destination, or how the service operates.",
