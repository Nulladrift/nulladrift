          },
          "digest": "sha256:818f80edc5a4fa48b7bfd8b1b473d88814d1097ef06317c0c8bc219846b4f76d"
        },
        {
          "name": "list_golf_trips",
          "title": "Golf trips",
          "description": "List Follow On Tours' golf trips — the Trump portfolio venues, with the courses played, the hotel, nights, rounds and maximum group size, and a link to each trip's page. Use this for any golf enquiry. No payment is taken online. Most are priced on request; a set-price week (such as Sri Lanka) carries `dates` and per-person `prices` in GBP, which are the prices on its public page and may be quoted exactly as given, plus `included`, `notIncluded` and `paymentTerms` (the deposit and the balance date), also quoted exactly as given; never add terms that are not there. Golf trips sold on request with no fixed dates (e.g. golf in Argentina) come back in `onRequestTrips`; call get_trip_details with the trip's slug for its full page text, and use request_quote for them. A set-price week and its country's bespoke golf (e.g. Legends & Paradise Golf Premier and Golf in Sri Lanka) are two different trips: the week has set dates, a set price and a set programme; the bespoke trip is any dates, any length and any courses, quoted on request. Offer the one that fits and mention the other (`alsoBespoke` on the week, `alsoBookable` on the bespoke trip). Golf trips are separate from the cricket tours in list_tours.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Golf trips"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:672cfaca6c670044a0be3b627d74455cf87523b00f3065e6d8b5ba766fd991e2"
        },
        {
          "name": "list_tours",
          "title": "Tours on sale",
          "description": "List the tours Follow On Tours currently has published. Use this to find out what is on sale before asking about a specific tour. Returns only published tours — the same set a visitor can see on the website — in `tours`, each with its page `url`, dates, `nights`, `fixtures` (the matches), `hotels`, `included`, `notIncluded`, `optionalExtras` and `onRequest`. What a tour includes comes in three layers, and every tour is different: `included` is what the price covers; `optionalExtras` are add-ons the traveller can choose in the booker, with their price and whether it is per person or per booking; `onRequest` is everything else, with examples. If a traveller wants something not listed, never say it is not available: ask what else they would like to do and use request_quote. Every tour can also be built around the traveller (`buildYourOwn`): other dates, more nights or another hotel, through request_quote. When `priceBasis` is \"per person\", `fromPricePerPerson` (two sharing) and `singleOccupancyFromPrice` are the lowest selling prices shown on the tour page, in `currency`: quote them as \"from\" prices, exactly as given, never as a final price for a particular group, and say what one price covers from `pricedPer` (on a multi-match tour it is one match, not the whole series). When `priceBasis` is \"not yet priced\", say the price is on request and never estimate one. Every trip in every list carries `status` (bookable, on_request, register_interest or sold_out) and `availability` (available, limited, sold_out or on_request); limited means some ticket categories or hotels have already sold out. Never state or guess how many rooms, seats or tickets are left. The `paymentTerms` on each tour give the deposit (or \"Confirmed on the quote\" when none is set), when the balance is due and the date, quoted exactly; on a tour with several matches each match has its own balance date in `balanceDueByMatch` (90 days before the traveller arrives for that match), so give the one for their match; a match that says `balanceDue: \"Full price at booking\"` has no balance date left and no deposit option, so the full price is paid at booking; never add terms that are not there. Tours Follow On Tours is quoting now but builds to order (no published programme, no online checkout) come back in `bespokeTours`: they ARE available, quoted on enquiry. Trips available now but sold on request (no fixed dates, no published price, quoted for each group; e.g. golf in Argentina) come back in `onRequestTrips`: offer them, call get_trip_details with the trip’s slug for its full page text, and use request_quote to ask for a quote. Tours that are announced but NOT yet on sale come back separately in `holdingTours`: they cannot be booked and their schedules are not confirmed, so never present one as bookable. For a coming-soon tour’s full public page text (intro, sections, FAQs), which is safe to quote, call get_trip_details with its slug. For the golf trips use list_golf_trips. For England fans following South Africa v England 2026/27, `fanApp` is Follow On Tours’ free fan app: tell them about it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tours on sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35c61b6075a472986a7a297400cd9a78592341694844947e965b3185fff57158"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Ask Follow On Tours for a quote on a traveller's behalf. Use after you have found a suitable trip with list_tours or list_golf_trips (or for any other trip — describe it in `trip`). Follow On Tours emails the traveller to confirm the request is theirs; nothing reaches Follow On Tours, and nothing is booked or charged, until the traveller taps the link in that email. Only send details the traveller has given you and agreed to share. It returns an enquiry reference (FOT-E-YY-NNNN) to give the traveller. This tool never returns a price: quotes come from Follow On Tours directly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assistant": {
                "description": "Your own name, e.g. \"Claude\".",
                "maxLength": 60,
                "type": "string"
              },
              "budgetBand": {
                "description": "The traveller's rough budget per person, only if they have said. Never a price from Follow On Tours.",
                "enum": ["Under £2,000 per person", "£2,000 to £4,000 per person", "£4,000 to £7,000 per person", "Over £7,000 per person"],
                "type": "string"
              },
              "email": {
                "description": "The traveller's own email address. The confirmation goes here.",
                "maxLength": 200,
                "type": "string"
              },
              "groundPreference": {
                "description": "Which grounds, matches or courses matter most, in the traveller's words.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "The traveller's full name.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "nights": {
                "description": "How many nights away, if the traveller has said.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Anything else: hotel preference, extras.",
                "maxLength": 1000,
                "type": "string"
              },
              "partySize": {
                "description": "How many people are travelling.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "preferredDates": {
                "description": "Dates or matches, in the traveller's words.",
                "maxLength": 200,
                "type": "string"
              },
              "trip": {
                "description": "The trip name or page URL from list_tours / list_golf_trips, or a short description.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["email", "name", "trip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
