{
  "lockfileVersion": 2,
  "subjects": {
    "co.youraitools/pkgguard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/pkgguard/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pkgguard",
        "title": "PkgGuard",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Before installing or running code, call check_package (one package) or scan_dependencies (a manifest or lockfile) to see whether it has known vulnerabilities or is a confirmed-malicious package. Data from OSV.dev.",
      "tools": [
        {
          "name": "check_package",
          "title": "Is this package version vulnerable or malicious?",
          "description": "Checks one package version (npm, PyPI, Go, crates.io, Packagist, RubyGems, Maven, NuGet) against OSV.dev: advisory ids, severity, CVSS, fixed-in versions and malicious flags. Free tier: 30 calls/day per IP with full results, then $0.001 per call in USDC over x402 (/v1/package).",
          "inputSchema": {
            "properties": {
              "ecosystem": {
                "description": "One of npm, PyPI, Go, crates.io, Packagist, RubyGems, Maven, NuGet, Pub, Hex (default npm)",
                "type": "string"
              },
              "name": {
                "description": "Package name, e.g. lodash",
                "type": "string"
              },
              "version": {
                "description": "Exact version, e.g. 4.17.15",
                "type": "string"
              }
            },
            "required": ["name", "version"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a29c782ad0a59157e695725026617f7a75eee5e92dd7d23cc10f8d1fdc5a565"
        },
        {
          "name": "scan_dependencies",
          "title": "Scan a dependency manifest for vulnerable and malicious packages",
          "description": "Checks a package.json, lockfile, requirements.txt, go.mod, Cargo.lock, poetry.lock or composer.lock (or a list of packages) against OSV.dev for known vulnerabilities and confirmed-malicious packages. Returns per-package advisory ids (CVE/GHSA/MAL), severity, CVSS and fixed-in versions. Free tier: 30 calls/day per IP with full results, up to 100 packages; then $0.003 per scan (up to 500) in USDC over x402 (/v1/scan).",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Optional file name, helps type detection",
                "type": "string"
              },
              "include_dev": {
                "description": "Include devDependencies (default true)",
                "type": "boolean"
              },
              "manifest": {
                "description": "Manifest or lockfile contents (package.json, package-lock.json, requirements.txt, Pipfile.lock, poetry.lock, go.mod, Cargo.lock, composer.lock)",
                "type": "string"
              },
              "packages": {
                "description": "Alternative to manifest: [{ecosystem, name, version}], up to 500",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3283a1b473a23451daef0560363805432c0511ece1a1d1eedea5ed4d02e5e40"
        }
      ],
      "digest": "sha256:156d5c62d26847e7dde84d21c84230abd29a44d893fefe18172b96530a00ee84"
    }
  }
}
