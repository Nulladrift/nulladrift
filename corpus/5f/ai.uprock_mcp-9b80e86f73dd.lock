      "instructions": "UpRock fetches web pages and searches the web from real devices in real locations worldwide (phones and desktops). Use it as a second provider: when other fetch or search tools are blocked, rate-limited, or return bot-check pages, or when you need to see a page or search results as a real person in a specific country or on a specific device type sees them.\n\n- crawl_fetch: fetch a page, optionally from a specific country or device type.\n- web_research: search several engines across regions and get deduplicated results.\n- verify: check that a site works, with load speed and screenshots, from several regions (sweep is its deprecated old name).\n- resource_fetch: read the full content behind resource links returned by the other tools.\n\nOne UpRock API key covers crawl, research and verify. Pass it in the URL (https://mcp.uprock.ai/<API_KEY>/mcp) or in the X-Crawl-Api-Key header.",
      "tools": [
        {
          "name": "crawl_fetch",
          "description": "Use when other fetch/search tools are blocked, rate-limited, return bot-check pages, or when you need results as a real person in a specific country or on a specific device type sees them.\n\nFetches a URL from real devices in real locations (phones and desktops) on the UpRock\nnetwork. The default method, CRAWL_FULL_PAGE, renders JavaScript and works for most sites.\n\nReturns page metadata (url, status_code, title, content_type, time_ms), a short \"summary\"\nof the page, and resource links under \"content\": \"content.markdown\" holds the full page as\ncompact markdown (prefer it for reading) and \"content.html\" the raw HTML. If your client\ncannot open resource links, read them with resource_fetch. A \"screenshots.viewport\" link\nis included when a screenshot is available. meta.status_code is the HTTP status the device\nreported for the page, or null when it reported none.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Request body for POST/PUT methods. Provide as plain text.",
                "type": "string"
              },
              "country": {
                "description": "Where to execute the crawl FROM (device geographic placement). This controls the device's physical location, NOT the content topic — a crawl from Germany fetches the same URL but may see region-specific content (e.g., cookie banners, localized pricing). Accepts meta-regions (NA, EU, APAC, LATAM, MEA) or ISO country codes (US, DE, JP). PREFER meta-regions — they give the placement algorithm more flexibility to find available devices. Use specific country codes only when you need exact country-level placement (e.g., to see local pricing, comply with regional regulations, or access geo-restricted content).",
                "enum": ["NA", "EU", "APAC", "LATAM", "MEA", "US", "GB", "CA", "AU", "DE", "FR", "JP", "CN", "IN", "BR", "MX", "ES", "IT", "NL", "SE", "NO", "DK", "FI", "PL", "RU", "KR", "SG", "HK", "TW", "TH", "VN", "ID", "MY", "PH", "ZA", "AE", "SA", "IL", "TR", "AR", "CL", "CO", "NZ", "IE", "CH", "AT", "BE", "PT", "CZ", "RO", "HU", "GR", "UA", "EG", "RS", "AM", "AL", "BG", "CY", "DZ", "IQ", "KE", "NG", "PA", "SK", "TT", "LK", "AG"],
                "type": "string"
              },
              "device_type": {
                "description": "Device type to use (default: no constraint)",
                "enum": ["mobile", "desktop"],
                "type": "string"
              },
              "method": {
                "description": "HTTP method to use (default: CRAWL_FULL_PAGE). CRAWL_FULL_PAGE renders JavaScript and is the most reliable. GET is faster; use it only for static pages or API endpoints that need no JavaScript. POST and PUT send the body parameter.",
                "enum": ["GET", "POST", "PUT", "CRAWL_FULL_PAGE"],
                "type": "string"
              },
              "retries": {
                "description": "Number of speculative retries (default: 2, max: 3). When > 0, a new attempt starts every 7s using a separate device session. First success wins. Default of 2 means up to 3 concurrent sessions per call. Set to 0 for a single attempt.",
                "type": "number"
              },
              "timeout_sec": {
                "description": "Timeout in seconds (default: 60, max: 300). For CRAWL_FULL_PAGE, values below 60 are silently raised to 60.",
                "type": "number"
              },
              "url": {
                "description": "Target URL to fetch. Auto-prefixed with https:// if no scheme is provided.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8f81e654847e8a3191af63c47a96bc27e529206f26e9a5964b7ed08086df738"
        },
        {
          "name": "resource_fetch",
          "description": "Fetch the full content of an MCP resource URI. Use this when you need to read the actual content from a prior tool result and cannot resolve resource URIs natively (most hosted AI environments do not yet support native MCP resource fetching).\n\nThis tool accepts crawl:// URIs from crawl_fetch responses, sweep:// URIs from verify results, and sitemaps:// URIs from sitemaps_generate results. For crawl_fetch, responses include a summary for quick analysis, plus crawl:// resource URIs pointing to the full content in markdown and HTML formats. When the summary is sufficient, you do not need this tool. When you need the complete page text — to extract specific data, parse tables, read full articles, etc. — pass the resource URI here to get the full content.\n\nFor crawl_fetch results, use the markdown resource URI unless you specifically need raw HTML structure. Markdown is significantly more compact and easier to work with. For verify results, pass a sweep:// screenshot URI to retrieve the screenshot for visual inspection. For sitemaps_generate results, pass a sitemaps:// URI to read the llms.txt content for a domain or section.",
          "inputSchema": {
            "properties": {
              "uri": {
                "description": "A crawl://, sweep://, or sitemaps:// resource URI from a prior tool response (e.g. crawl://jobId/markdown, sweep://sweepId/region/jobIndex/screenshot, or sitemaps://domainId/llms.txt).",
                "type": "string"
              }
            },
            "required": ["uri"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b3c3685925fa138a075ff0c4ebf6f3747a8ea3b09b82b28f5f37c212487db1b"
        },
        {
          "name": "sweep",
          "description": "Deprecated: use the verify tool instead. sweep is the old name of verify, kept so\nexisting setups keep working, and will be removed in a later release. It takes the same\ninputs and returns the same output.\n\nVerify a site works: load a URL on real devices in many regions and return status,\nload speed (Core Web Vitals) and screenshots, plus a shareable report link.\n\nUse this after deploying a website or service to verify it is up, responsive, and\nperforming well from different parts of the world.\n\nLoads the target URL from multiple regions simultaneously, capturing performance metrics\nfrom each check. All checks (regions x tries) run concurrently, so the total operation\ntime is approximately equal to the timeout value.\n\nEach completed check returns Core Web Vitals (TTFB, FCP, LCP, CLS), load times, transfer\nsize, and HTTP protocol. Screenshots are captured and available as resource links in the\nresponse for visual verification if needed, but can be ignored if you only need the metrics.\n\nA run may complete with some failed checks. Inspect the failed_jobs count and per-job\nerror fields in the response to identify issues. If the timeout passes before every\nregion finishes, the checks that did finish are still returned with status \"partial\";\neach region without a completed check has a status (\"no_device\" when no device in that\nregion was available, otherwise \"incomplete\") and an \"error\" saying why.\n\nThe response includes a \"report_url\" field with a link to a human-readable report page\nthat can be shared with others for visual review of the results.",
          "inputSchema": {
            "properties": {
              "device": {
                "description": "Device type (default: mobile). Options: mobile, desktop.",
                "enum": ["mobile", "desktop"],
                "type": "string"
              },
              "regions": {
                "description": "Geographic regions to test from: NA (North America), EU (Europe), APAC (Asia Pacific), LATAM (Latin America), MEA (Middle East & Africa). Default: [NA, EU, APAC] — these three regions have the fastest and most reliable device pools.",
                "items": {
                  "enum": ["NA", "EU", "APAC", "LATAM", "MEA"],
                  "type": "string"
                },
                "type": "array"
              },
              "timeout": {
                "description": "Global timeout in seconds for the entire run (default: 60). All checks run concurrently, so total wall-clock time is approximately this value.",
                "type": "number"
              },
              "tries": {
                "description": "Number of checks per region (default: 5). All checks across all regions run concurrently.",
                "type": "number"
              },
              "url": {
                "description": "Target URL to test.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d26a779b02d89c98d43f1152566bd477dc56e6c6f3bb1f819feda8399ad5818"
        },
        {
          "name": "verify",
          "description": "Verify a site works: load a URL on real devices in many regions and return status,\nload speed (Core Web Vitals) and screenshots, plus a shareable report link.\n\nUse this after deploying a website or service to verify it is up, responsive, and\nperforming well from different parts of the world.\n\nLoads the target URL from multiple regions simultaneously, capturing performance metrics\nfrom each check. All checks (regions x tries) run concurrently, so the total operation\ntime is approximately equal to the timeout value.\n\nEach completed check returns Core Web Vitals (TTFB, FCP, LCP, CLS), load times, transfer\nsize, and HTTP protocol. Screenshots are captured and available as resource links in the\nresponse for visual verification if needed, but can be ignored if you only need the metrics.\n\nA run may complete with some failed checks. Inspect the failed_jobs count and per-job\nerror fields in the response to identify issues. If the timeout passes before every\nregion finishes, the checks that did finish are still returned with status \"partial\";\neach region without a completed check has a status (\"no_device\" when no device in that\nregion was available, otherwise \"incomplete\") and an \"error\" saying why.\n\nThe response includes a \"report_url\" field with a link to a human-readable report page\nthat can be shared with others for visual review of the results.",
