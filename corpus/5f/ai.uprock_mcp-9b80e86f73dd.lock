        {
          "name": "video_moment",
          "description": "Fetch transcribed, time-stamped moments for a specific video URL. This is a CURSOR over the video pre-computed sliding-window moments (~30s windows on a ~25s grid, ~5s overlap) -- NOT a summary or sample of a time range. A call returns up to max_moments consecutive windows starting at start_s, in chronological order. To cover a long span you PAGINATE: read a page, then call again with start_s = next_start_s until has_more is false. If the video is not yet indexed, indexing starts automatically and the response tells you how long to wait. Moment text is model-generated from video frames plus verbatim ASR and may contain transcription artifacts. The response includes has_more / next_start_s for pagination and a stable moment_key per moment for dedupe. When following a video_search hit, pass its url, t0, and t1 as the url, start_s, and end_s of this tool.\n\nWhen include_images is set (not \"none\"), decoded keyframe IMAGES for each moment are returned inline as base64 ImageContent blocks, downscaled to 448px and re-encoded (WebP by default; JPEG if the server is configured with VIDEO_FRAME_FORMAT=jpeg -- the actual format is reported in the frame_format field). The frames_returned / frames_truncated / frame_format fields describe what was delivered so you can narrow scope (fewer moments, or a lower tier) for full fidelity. Frames always follow their moments in order. Only request images if you can view them.",
          "inputSchema": {
            "properties": {
              "end_s": {
                "description": "Upper bound of the range. <=0 (default) = a single moment at start_s; >0 = consecutive windows overlapping [start_s, end_s].",
                "type": "number"
              },
              "include_images": {
                "description": "Return decoded keyframe IMAGES for each moment inline (base64, downscaled to 448px; re-encoded as WebP by default or JPEG per server config -- check frame_format in the response for the actual format). Frames follow their moments in order. Only request images if you can view them.\n- none (default): text moments only.\n- hero: 1 anchoring frame per moment (the keyframe near its start).\n- summary: ~3 evenly-sampled frames per moment.\n- full: all available frames per moment.\nFor ANY non-none tier, the total number of frames across the whole response is capped to 8 (after per-tier selection). When the cap trims frames, frames_truncated is set -- narrow scope (fewer moments or a lower tier) for true full fidelity.",
                "enum": ["none", "hero", "summary", "full"],
                "type": "string"
              },
              "max_moments": {
                "description": "PAGE SIZE -- max windows returned per call (default 5; hard cap 10). Bounds how far FORWARD you read (~max_moments x 25s); it does NOT sample the whole range -- paginate for more.",
                "type": "number"
              },
              "start_s": {
                "description": "Where to start reading / the pagination cursor (default 0).",
                "type": "number"
              },
              "url": {
                "description": "Required. Video URL (https:// auto-added).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32bf6524597e2f7779c86081a600d7178e89ecf0a987a0307f4ac2c09e87b878"
        },
        {
          "name": "video_search",
          "description": "Semantic search over indexed video moments.\n\nFinds the most relevant moments (time-stamped segments) across indexed videos for a\nnatural-language query. Each result includes the source video, the moment's start/end\ntimestamps, a relevance score, and the moment transcript when available.\n\nResults are ordered best-first and limited to the top 10 moments. Each result's url, t0, and t1 are the exact inputs to video_moment (pass them as its url, start_s, and end_s).",
          "inputSchema": {
            "properties": {
              "order_by_recency": {
                "description": "Sort results newest-first by publish date, with relevance as the tiebreak (default: false).",
                "type": "boolean"
              },
              "published_after": {
                "description": "Only include moments published at or after this unix timestamp (seconds, UTC).",
                "type": "number"
              },
              "published_before": {
                "description": "Only include moments published at or before this unix timestamp (seconds, UTC).",
                "type": "number"
              },
              "query": {
                "description": "Natural-language search query.",
                "type": "string"
              },
              "tags": {
                "description": "Optional key/value facet filters.",
                "properties": {},
                "type": "object"
              },
              "unique_videos": {
                "description": "Return one (best) result per distinct video instead of per-moment hits (default: true).",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:871232f6713ae3899667378575f5c6d5ba4bb41f4c8d9ccb7f34ee81f1c707e1"
        },
        {
          "name": "web_research",
          "description": "Use when other fetch/search tools are blocked, rate-limited, return bot-check pages, or when you need results as a real person in a specific country or on a specific device type sees them.\n\nSearches the web with several engines (Bing, DuckDuckGo, Yahoo, plus regional engines) from\nreal devices in real locations, and returns deduplicated results with url, title and\ndescription.\n\nsuggested_countries sets where the search runs FROM, not what it is ABOUT:\n- Geography is the topic ('Paris hotels', 'history of the Berlin Wall') → keep it in the\n  query and omit suggested_countries.\n- Geography is the perspective (what Europeans see when searching for beach holidays) →\n  query='best beach destinations', suggested_countries=['EU'].\n- Both ('what Germans think about Italian food') → query='Italian food',\n  suggested_countries=['EU'].\nTo compare regions, make one call per region; do not combine them in one call.\n\nDeduplication can return fewer results than max_results; request 2-3x your target.\nResults are ordered by relevance, best first: pages ranked highly by several engines or\nregions come first. Each result has a \"score\" and the engine/country \"sources\" that\nreturned it.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "description": "Maximum number of results to return (default: 12, max: 50). Actual count may be lower due to cross-source deduplication.",
                "type": "number"
              },
              "num_sources": {
                "description": "Maximum number of countries to query (default: 5, max: 20). Each country generates sources for all eligible providers, so the actual number of provider+country combinations may be higher. When suggested_countries expands to more countries than this value, the list is sampled down using daylight-aware selection. The server independently sizes the fan-out based on max_results; this parameter controls geographic diversity, not total source count.",
                "type": "number"
              },
              "query": {
                "description": "Search query terms. Include geographic terms only when they describe the TOPIC you are searching for (e.g., 'Tokyo tourist spots,' 'Brazilian coffee'). Do NOT add geographic terms to target a search location — use suggested_countries for that. Query language does not imply search location.",
                "type": "string"
              },
              "suggested_countries": {
                "description": "Where to search FROM (the searcher's geographic perspective), NOT what to search ABOUT. When omitted, the server automatically selects optimal countries for broad global coverage — this is the correct default for most queries that do not require a specific regional perspective. Only set this parameter when you need results from a particular region's point of view. Accepts meta-regions (NA, EU, APAC, LATAM, MEA) or ISO country codes. ALWAYS PREFER meta-regions for regional perspectives — they give the scheduler more flexibility and better cache hit rates. Only use specific country codes when the query demands country-level precision (e.g., country-specific law, language-specific content, or data that varies within a region). Do NOT mix meta-regions and country codes in a single call.",
                "items": {
                  "enum": ["NA", "EU", "APAC", "LATAM", "MEA", "US", "GB", "CA", "AU", "DE", "FR", "JP", "CN", "IN", "BR", "MX", "ES", "IT", "NL", "SE", "NO", "DK", "FI", "PL", "RU", "KR", "SG", "HK", "TW", "TH", "VN", "ID", "MY", "PH", "ZA", "AE", "SA", "IL", "TR", "AR", "CL", "CO", "NZ", "IE", "CH", "AT", "BE", "PT", "CZ", "RO", "HU", "GR", "UA", "EG", "RS", "AM", "AL", "BG", "CY", "DZ", "IQ", "KE", "NG", "PA", "SK", "TT", "LK", "AG"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f02d10113f21e5c92be36a67eeb30ff387a8b7c34bd92f8b218ce82a20075afa"
        }
