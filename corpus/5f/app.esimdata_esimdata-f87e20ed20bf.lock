{
  "lockfileVersion": 2,
  "subjects": {
    "app.esimdata/esimdata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://esimdata.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "esimdata",
        "title": "esimdata: neutral travel eSIM comparison",
        "version": "0.1.0",
        "websiteUrl": "https://esimdata.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "esimdata is a neutral travel eSIM comparison. Plans come from each provider's own public catalogue and are ranked only by the numbers (price, price per GB, validity) — never by commission. Every price carries the time it was checked; quote it. Give the traveller the buy_url: it opens the provider's own page, where they buy. A field that is null means the provider doesn't state it — say \"not stated\", never guess. esimdata sells nothing itself.",
      "tools": [
        {
          "name": "check_phone",
          "title": "Does this phone support eSIM?",
          "description": "Check whether a phone, tablet or watch model supports eSIM, from the manufacturer's own published list (with regional exceptions, e.g. models sold in mainland China), with the source link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "e.g. \"iPhone 15 Pro\", \"Pixel 8\", \"Galaxy S24\".",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Does this phone support eSIM?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e7f94c1c8f9bb7ff5ea706a6856ddfe80934d44dcb2f4d2198731c2a1ef2ae6"
        },
        {
          "name": "compare_plans",
          "title": "Compare eSIM plans",
          "description": "Put 2 to 10 plans (ids from search_plans) side by side with the same fields, in the order given, to help a traveller choose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["plan_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6a6f8e15fe023d51350951b46e7b2a5e07a9a2882e9c2892734e14fe81b6307"
        },
        {
          "name": "country_overview",
          "title": "eSIM market for a country",
          "description": "A destination at a glance: how many plans and providers, the cheapest plan, the cheapest per GB, which mobile networks the providers say they use there, and pay-as-you-go eSIMs billed per MB (no bundle).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Destination: English name (\"Japan\"), ISO code (\"JP\") or common alias (\"UK\").",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "eSIM market for a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3671a5b73aa3ac613cd52fa36d424845ce59ae1c46477eb61eb94948d587c60"
        },
        {
          "name": "get_plan",
          "title": "Get one eSIM plan",
          "description": "Everything esimdata knows about one plan (by the id search_plans returned): all countries it covers, networks, policies, the provider's own page, the buy link and its price history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "A plan id such as \"airalo:jp-3gb\".",
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one eSIM plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d95d84d3d28e7585345a1d0a7fa0f4cdbb14ab70bdbffc9c50865e8ce25b21e"
        },
        {
          "name": "list_providers",
          "title": "eSIM providers tracked",
          "description": "Every eSIM provider esimdata compares, with its website and whether esimdata earns a commission when a traveller buys through it (ranking never depends on it).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "eSIM providers tracked"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dacd31497f80a97b6501991f652529bd172dc22e16c5fa02d345dba66bb49b65"
        },
        {
          "name": "search_plans",
          "title": "Search travel eSIM plans",
          "description": "Find travel eSIM data plans for a destination from every provider esimdata tracks, ranked neutrally by price (or price per GB, or validity). Filter by trip length, data, unlimited, needs (hotspot, 5G, phone number, top-up, no ID check) and budget. Each result has a buy_url to the provider's page and the time the price was checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "also_countries": {
                "description": "More destinations on the same trip; only plans covering all of them are returned.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Destination: English name (\"Japan\"), ISO code (\"JP\") or common alias (\"UK\").",
                "type": "string"
              },
              "days": {
                "description": "Trip length: the plan must last at least this many days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "gb": {
                "description": "Data needed in GB (unlimited plans always qualify).",
                "maximum": 1000,
                "minimum": 0.1,
                "type": "number"
              },
              "limit": {
                "description": "How many plans to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Budget in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "needs": {
                "description": "Plans must state these; plans that don't say are left out.",
                "items": {
                  "enum": ["hotspot", "five_g", "phone_number", "topup", "no_kyc"],
                  "type": "string"
                },
                "type": "array"
              },
              "single_country_only": {
                "description": "Leave out regional and global plans.",
                "type": "boolean"
              },
              "sort": {
                "description": "price (default), price_per_gb or validity (longest first).",
                "enum": ["price", "price_per_gb", "validity"],
                "type": "string"
              },
              "unlimited": {
                "description": "true = unlimited plans only, false = no unlimited plans.",
                "type": "boolean"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a1ae9f66751330ed19d0193d8a45bf660991b2138a3822df032dfe554958f26"
        }
      ],
      "digest": "sha256:7866ccbc77d3e4624e55a23110e3d251a02038884d3cdc6200350d764f239a7e"
    }
  }
}
