  "subjects": {
    "com.penguindriver/twostroke": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://twostroke.penguindriver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "twostroke-db",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "二行程經典機車規格、零件對照、保養資料與成交行情（繁體中文）。",
      "tools": [
        {
          "name": "find_part",
          "description": "用零件型號或名稱（例如火星塞 BR9ES）反查適用的二行程車款。",
          "inputSchema": {
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ef2dd13f34d9219eee0936a7ecd9ad3a2ca6439f63d399f59002444663c612e"
        },
        {
          "name": "get_maintenance",
          "description": "取得某個二行程車款的保養資料（混合比、齒輪油、火星塞間隙、化油器設定等）。",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d58aec9e4e55c44d98e802fb708715b10634a6edda672a20bf948752dbdd620b"
        },
        {
          "name": "get_model_specs",
          "description": "取得二行程經典車款的規格（附維基百科出處）、零件對照、保養資料與成交行情。",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "車款代號，可先用 search_models 取得",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2a39f7596ca9fe41965cb421c3abf570990b3554c7fbe832ca0fcec5f2cd09d"
        },
        {
          "name": "search_models",
          "description": "搜尋二行程經典機車車款（本田、山葉、鈴木、川崎等），回傳車款代號。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "車款名稱，例如 NSR250、RZ350",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0ea9cd2c0ba12dbf9de48def3405673509687f7940788abce09924f3cdf794d"
        }
      ],
      "digest": "sha256:bad17dd83c1e971f74235c7e32d1b78d44ef430dc6508b2dba6d36b29c6a591f"
    }
  }
}
