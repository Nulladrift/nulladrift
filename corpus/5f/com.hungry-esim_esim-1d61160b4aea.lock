{
  "lockfileVersion": 2,
  "subjects": {
    "com.hungry-esim/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.hungry-esim.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hungry-esim",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_destination_coverage",
          "title": "Check destination coverage",
          "description": "Check whether we cover a destination before choosing a plan — answers \"do you work in X?\", \"can I get mobile data / a SIM card in X?\", \"is X supported?\". Returns yes/no, how many plans cover it, and the cheapest unlimited and fixed-data plan as examples. Use search_esim_plans or find_cheapest_plan for the full list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code of the destination, e.g. 'JP', 'US'",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "ISO currency for prices, default the store currency",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95f12dd18bd19407bb3618121b6054f4bb51a5ba14d7e58d0392fdef96ebc815"
        },
        {
          "name": "create_checkout",
          "title": "Create eSIM checkout link",
          "description": "Buy the chosen eSIM data plan: builds a cart and returns a checkout URL the traveller opens to pay by credit card on hungry-esim.com — no crypto wallet and no API key needed. Use once a plan is picked. Does NOT charge — the user completes payment on the website. For unlimited plans, period_num (how many days of data the traveller wants) is required. If the customer is signed in, the order is linked to their account automatically.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "count": {
                "description": "Number of eSIMs, default 1",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "Customer's CHECKOUT country (ISO alpha-2) — sets checkout region/currency and URL locale. NOT the eSIM's coverage country. If the store doesn't serve it, the store's default region is used.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "Guest email — prefills checkout so it skips the details step. Ignored when the customer is signed in (their account email is used). Never determines which account the order belongs to.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "period_num": {
                "description": "Days for unlimited plans (1-90; each plan states its own maximum). Required for unlimited, ignored otherwise.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "variant_id": {
                "description": "Variant id from search_esim_plans",
                "type": "string"
              }
            },
            "required": ["country", "variant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bcc39db527800bcca84f1d9865fafb14b59619b257c13495db50999fe8c7a1ca"
        },
        {
          "name": "find_cheapest_plan",
          "title": "Find the cheapest eSIM plan",
          "description": "Find the lowest-priced eSIM data plan for a destination — for \"what's the cheapest\", \"budget option\", \"cheapest SIM / data plan for X\". Pass days (trip length) to rank by what the traveller actually pays for the whole trip: unlimited plans are priced per day with a multi-day discount, fixed-data plans by their sticker price, and plans that expire before the trip ends are dropped. Without days it ranks by daily rate. Returns up to 3 options with variant_id for create_checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code of the destination, e.g. 'JP', 'US'",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "ISO currency for prices, default the store currency",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "days": {
                "description": "Trip length in days. When given, plans are ranked by total trip cost.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "How many options to return, default 3",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "min_data_gb": {
                "description": "Minimum data in GB (applies to fixed-data plans; unlimited always qualifies)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7f7f83a6fe6f45aaa4d41b2870ca21b11a378bd9d4e433e6bec35300f433ea8"
        },
        {
          "name": "get_order_status",
          "title": "Get eSIM order status",
          "description": "Look up an eSIM order and return its status plus the SIM install details: install link, LPA activation code, QR image URL, and ICCID. Use for \"where is my eSIM\", \"resend my QR code\", or \"did my order go through\" when an order number is known. Signed-in customers can look up their own orders by number without an email. Otherwise, a short order number MUST be paired with the email used for the order — the eSIM install details are only returned to the buyer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email used for the order. Required when 'order' is a short order number and the customer is not signed in.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "order": {
                "description": "Order number (e.g. '32') or Medusa order id (order_01K...) from the confirmation email",
                "type": "string"
              }
            },
            "required": ["order"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d195c0b1fe626e484ba0ed533b8e3a134ac687ba5509d09832387a978222c784"
        },
        {
          "name": "get_plan_details",
          "title": "Get eSIM plan details",
          "description": "Get everything about one eSIM data plan: which countries the SIM roams in, data volume, validity in days, speed and fair-use throttling, and price. Use after search_esim_plans or find_cheapest_plan when the traveller asks what exactly a plan includes before buying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "ISO currency, default USD",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "variant_id": {
                "description": "Variant id from search_esim_plans",
                "type": "string"
              }
            },
            "required": ["variant_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9022bdd879b1311c8ff9ca2c80fc1b3d40de2149bd0046041bdc22ec3ee1294b"
        },
        {
          "name": "list_esim_topups",
          "title": "List eSIM top-up options",
          "description": "List the data top-up (recharge / refill) packages that can be added to an eSIM the customer already owns. Use when the traveller ran out of mobile data or wants more days on a SIM they already bought — topping up reuses the installed SIM, so no new QR code is needed. Pass the ICCID from my_esims. Returns package_code values to pass to topup_esim.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "iccid": {
                "description": "ICCID of the eSIM, from my_esims",
                "type": "string"
              }
            },
            "required": ["iccid"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8efbeeed562cc25d112f47ca8de018dc4b0d301a8594c3c402f8f8b361edc05f"
        },
        {
          "name": "my_esims",
          "title": "My eSIMs",
          "description": "List the SIM cards (eSIMs) already on the signed-in Hungry eSIM account: ICCID, status, data package, expiry, and install link. Use for \"my eSIM\", \"my SIM card\", \"how much data do I have left\", or before topping up a SIM the traveller already owns. Requires connecting the Hungry eSIM account (OAuth) — no API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09945e26381bcca06eb8c140cd8ce36eac8466a52ffeaa29f9240e71efaf906d"
        },
        {
          "name": "my_orders",
          "title": "My orders",
          "description": "List the signed-in customer's recent eSIM purchases with payment and provisioning status. Use for \"what did I buy\" or \"did my order go through\" when no order number is at hand. For the install QR and activation code of one order, use get_order_status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fddca92d6289db5a4c0594723c659ca9bb8a205ba08a5e168f922394423c25c7"
        },
        {
          "name": "search_esim_plans",
          "title": "Search eSIM plans",
          "description": "Search prepaid travel eSIM data plans for a destination — the SIM card / mobile data / roaming option for a trip. Use this first for any \"data plan for my trip to X\" request. Includes unlimited plans where the traveller picks the number of days, and fixed-data plans. Filter by unlimited vs fixed-data, minimum data, and validity. Unlimited plans are quoted per day, fixed-data plans as a one-off total — never compare those two numbers directly. The unlimited total is the per-day price × days, with a volume discount from 7 days, so pass days (trip length) to get that total quoted alongside the daily rate. Price differences between similar plans come from the routing IP country (routing_ip_country) and the supported networks (speed) — quote both when comparing plans. Results are grouped: fixed-data plans first, then unlimited; each group sorted by price. Returns variant_id values to pass to create_checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. 'JP', 'US'",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "ISO currency for prices, default USD",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "days": {
                "description": "Trip length in days (1-90; each unlimited plan states its own maximum). When given, unlimited plans also quote the total for that many days.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Max results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_validity_days": {
                "description": "Maximum validity in days (fixed-data plans)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "min_data_gb": {
                "description": "Minimum data in GB (fixed-data plans)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unlimited": {
                "description": "If set, return only unlimited (true) or only fixed-data (false) plans",
                "type": "boolean"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb3437eaf79b6cd47a25bb506aa2d3251ccae2610df5814c08ae111a17546bd2"
        },
        {
          "name": "topup_esim",
          "title": "Create eSIM top-up checkout link",
          "description": "Recharge an eSIM the customer already owns with more data: builds a cart and returns a checkout URL to pay by credit card on hungry-esim.com. The installed SIM keeps working — no new QR code is issued. Use this instead of create_checkout when the traveller already has one of our eSIMs. Does NOT charge — the user completes payment on the website. Get iccid from my_esims and package_code from list_esim_topups.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Customer's CHECKOUT country (ISO alpha-2) — sets checkout region/currency and URL locale. Defaults to US.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "iccid": {
                "description": "ICCID of the eSIM to top up, from my_esims",
                "type": "string"
              },
              "package_code": {
                "description": "Top-up package code from list_esim_topups",
                "type": "string"
              }
            },
            "required": ["iccid", "package_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e4f0a324f4c5ae87a885954ed5f2b4786e4196fd78cc43e8ef7ab7ea8b07b627"
        }
      ],
      "digest": "sha256:53162975bc4af430e5c9fd11912b0553681aafd93a788561a1f5cd8660cce403"
    }
  }
}
