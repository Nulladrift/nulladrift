        },
        {
          "name": "mark_lead_replied_outside",
          "description": "Mark an outreach lead as having replied outside LinkedIn (by email or phone), so future reports stop flagging it as awaiting a reply. Requires the can-mark-leads permission; an own-leads-only key can only mark its own conversations. Idempotent: an already-marked lead returns unchanged:true with no notification; a real change notifies the Fractional Teams team.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contact_name": {
                "description": "The lead's name, for the audit trail",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation id from a report lead card or get_lead_status",
                "type": "string"
              }
            },
            "required": ["conversation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:49a55ab44bd62000460cbda3871993f799a11b9fec40311e50b1298df11ce99a"
        },
        {
          "name": "unmark_lead",
          "description": "Undo a replied-outside-LinkedIn mark, returning the lead to \"awaiting reply\". Same permission rules as mark_lead_replied_outside.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contact_name": {
                "description": "The lead's name, for the audit trail",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation id from a report lead card or get_lead_status",
