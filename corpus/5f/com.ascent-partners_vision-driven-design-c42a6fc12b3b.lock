                "description": "One line per failed check, naming the id to fix",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resultType": {
                "const": "complete",
                "type": "string"
              },
              "status": {
                "enum": ["PASS", "FAIL"],
                "type": "string"
              }
