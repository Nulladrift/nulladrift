          "digest": "sha256:32b557ee599bbdf9f5a2574827a23142750a40774ea2a220510fbadeca8b4f05"
        },
        {
          "uri": "skill://vdd-tactics/SKILL.md",
          "name": "vdd-tactics",
          "description": "Turn a validated strategy into tactics.md — action items that each serve one strategic pillar, with one dedicated action per pillar. Use for VDD phase 3, after the strategy passes vdd_check.",
          "mimeType": "text/markdown",
          "digest": "sha256:4973a1111ec1fea04b724e3f253b31d805abf75f16b8a15885db86c278203eae"
        },
        {
          "uri": "skill://vdd-tasks/SKILL.md",
          "name": "vdd-tasks",
          "description": "Write tasks.md for a plan — atomic tasks that each serve one component, one dedicated task per component, each with its files, dependencies and acceptance criteria. Use for VDD phase 6.",
          "mimeType": "text/markdown",
          "digest": "sha256:0e5e7f449fea0f27a9d835044604dd09b32b0df0f61d205effc21383ea861c72"
        },
        {
          "uri": "skill://vdd-validate/SKILL.md",
          "name": "vdd-validate",
          "description": "Validate a finished chain — every vision goal has a dedicated descendant path down to a task, and every task traces back to a goal. Use at the end of a VDD cycle, over all six artifacts at once.",
          "mimeType": "text/markdown",
          "digest": "sha256:52f09ee67ce3296a3a7c5ec967aa1fd43ef8b577e479e1e6985efe347d63b4c5"
        },
        {
          "uri": "skill://vdd-vision/SKILL.md",
