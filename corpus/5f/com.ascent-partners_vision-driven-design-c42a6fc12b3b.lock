        {
          "name": "vdd_check",
          "title": "Check one VDD artifact",
          "description": "Judge one VDD artifact against the coverage invariants: A every parent has a child, B every child names a known parent, C every parent has a dedicated child. Pass the artifact text and, for any phase with a parent, the parent artifact. Returns PASS or FAIL with one reason per failure and the coverage matrix. The procedure for writing the artifact is the skill of the same phase — see skill://vdd-<phase>/SKILL.md.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "The whole artifact text",
                "type": "string"
              },
              "declaredCounts": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Counts you declared before generating, keyed goals / pillars / actions / specs / components / tasks. Each phase compares only the keys it consumes; omit it and no count is checked.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "phase": {
                "description": "Phase of the artifact you are submitting",
                "enum": ["constitution", "vision", "strategy", "tactics", "specs", "plan", "tasks", "validate"],
                "type": "string"
              },
              "priorArtifacts": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Phase name → artifact text. The parent artifact supplies the parent ids this phase must serve.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["content", "phase"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
