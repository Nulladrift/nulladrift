      "resources": [
        {
          "uri": "skill://vdd-constitution/SKILL.md",
          "name": "vdd-constitution",
          "description": "Write constitution.md — the immutable stack, conventions, security constraints and banned patterns every later VDD phase obeys. Use when starting a project with VDD, before any vision work.",
          "mimeType": "text/markdown",
          "digest": "sha256:d79fffdad8e458032dabf70a5b440b24a4816f81c23f75f769c05fcda38477a7"
        },
        {
          "uri": "skill://vdd-implement/SKILL.md",
          "name": "vdd-implement",
          "description": "Implement one task from tasks.md against its acceptance criteria, with a commit that names the chain. Use when a task is ready to build; this phase has no MCP tool and uses the host agent's own tools.",
          "mimeType": "text/markdown",
          "digest": "sha256:cb7559df6cf071591ad5e842ff85de881a9f97c13ed07137fce05ea58af4b0eb"
        },
        {
          "uri": "skill://vdd-plan/SKILL.md",
          "name": "vdd-plan",
          "description": "Write plan.md for a spec — components that each serve the spec, one dedicated component per spec, plus the data model and the interface contracts. Use for VDD phase 5.",
