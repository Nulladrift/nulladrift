      },
      "instructions": "Vision Driven Design (VDD): an 8-phase, spec-driven development methodology with bi-directional traceability. Start with vdd_init, then vdd_vision (pass a freeform statement). Before each implementation session call vdd_get_next_task. Read-only tools that write nothing are vdd_inspect, vdd_detect_environment, vdd_get_next_task, vdd_clarify, vdd_implement, and vdd_amend; other write tools overwrite their target artifacts unless their description says otherwise (vdd_validate writes only a new vdd/impact-report.generated.md without clobbering a hand-authored report). For a guided run, use the prompts start_vdd_project, init, vision, strategize, tactics, specify, clarify, plan, tasks, get-next-task, implement, validate, inspect, trace, analyze, amend, detect-environment, clone, e2e, implement_next_task or change_requirement.",
      "tools": [
        {
          "name": "vdd_amend",
          "title": "Amend Requirements",
          "description": "VDD Cross-phase: Plan a requirement-change cascade through the whole chain — identifies the highest affected level and returns the ordered steps to update downward V→S→T→SP→PL→TK and re-run affected gates (G1–G7). Read-only; returns the cascade plan without editing artifacts (the host agent applies the edits and commits). Pass the change as description. Use when a requirement changes after artifacts already exist; to build a phase from scratch the first time, run that phase's own tool instead of vdd_amend. The plan is an ordered step list naming the affected gates, not rewritten artifacts. Parameter relationships: description is the requirement change to cascade through the artifact chain; projectRoot must match the root used by earlier phases.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Description of the requirement change",
                "type": "string"
              },
              "projectRoot": {
                "default": ".",
                "description": "Project root: directory that constitution.md and the vdd/ folder are written to and resolved against. Relative paths resolve from the current working directory; keep the same value across every phase (default \".\")",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_phase": {
                "description": "VDD phase that produced this result",
                "type": "string"
              },
              "artifact": {
                "description": "Primary artifact produced or returned",
                "type": "string"
              },
              "error": {
                "description": "Error message when the phase fails",
                "type": "string"
              },
              "gateResult": {
                "description": "Quality-gate result, when the phase runs a gate",
                "properties": {
                  "checks": {
                    "description": "Number of checks run",
                    "type": "number"
                  },
                  "passed": {
                    "description": "Whether the quality gate passed",
                    "type": "boolean"
                  },
                  "total": {
                    "description": "Total number of checks",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "output": {
                "additionalProperties": true,
                "description": "Additional structured phase output",
                "type": "object"
              },
              "success": {
                "description": "Whether the phase completed successfully",
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
