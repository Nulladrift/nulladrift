        {
          "name": "vdd_inspect",
          "title": "Inspect Project",
          "description": "VDD Cross-phase: Read-only inspection of the current project in one call — scope selects the view. scope=\"project\" (default) returns the bidirectional V→S→T→SP→PL→TK traceability matrix across all vdd/ artifacts; scope=\"feature\" returns per-feature spec metrics (acceptance-criteria count, unresolved [NEEDS CLARIFICATION] markers, [e.g.] placeholder density, and whether plan.md/tasks.md exist). Never modifies files. Pass feature for the feature scope; for release-readiness validation with gates use vdd_validate, and to author a spec use vdd_specify. Output is a structured matrix/metrics object, not prose. Parameter relationships: scope=\"feature\" requires feature, while scope=\"project\" (the default) ignores it; projectRoot must match the root used by earlier phases. On the hosted (stateless) endpoint, pass artifactFiles (path→content for the vdd/ artifacts) so the tool computes the real matrix/metrics; without it the tool returns a delegation envelope.",
          "inputSchema": {
            "properties": {
              "artifactFiles": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Map of vdd/-relative artifact path → full file text, for the hosted (stateless) endpoint, which cannot read the caller filesystem; without it the tool returns a delegation envelope",
                "type": "object"
              },
              "feature": {
                "description": "Feature name: the vdd/specs/<feature>/ directory, kebab-case (e.g., \"user-auth\"); must reference a directory created earlier by vdd_specify",
                "type": "string"
              },
              "projectRoot": {
                "default": ".",
                "description": "Project root: directory that constitution.md and the vdd/ folder are written to and resolved against. Relative paths resolve from the current working directory; keep the same value across every phase (default \".\")",
                "type": "string"
              },
              "scope": {
                "description": "Inspect scope: \"project\" (default) returns the traceability matrix; \"feature\" returns per-feature spec metrics (requires feature)",
                "enum": ["project", "feature"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_phase": {
                "description": "VDD phase that produced this result",
                "type": "string"
              },
              "artifact": {
                "description": "Primary artifact produced or returned",
                "type": "string"
              },
              "error": {
