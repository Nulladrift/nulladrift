        {
          "name": "vdd_clone",
          "title": "Clone Website",
          "description": "Crawl and capture a target domain into a clone dataset + manifest — WordPress-aware schema inference, Payload collections, and a Next.js + Payload + Postgres scaffold manifest (vdd/clone-manifest.json). Pass the domain as description. Writes vdd/clone-dataset.json, vdd/clone-manifest.json, and vdd/clone.md, overwriting any existing versions in place. Open-world: makes network requests to the target site and reads its sitemap and same-origin links. Use for cloning an external site; it is not part of the VDD phase pipeline, so for the normal init→validate flow call those phase tools instead. Parameter relationships: description is the target domain and statement is the desired outcome (both optional); maxPages, timeoutMs, concurrency, crawl, and browser tune the crawl and refresh=true bypasses a cached dataset.",
          "inputSchema": {
            "properties": {
              "browser": {
                "description": "Clone: run browser/static capture (default true). Local stdio server only; ignored by the hosted endpoint",
                "type": "boolean"
              },
              "concurrency": {
                "description": "Clone: concurrent crawl workers, 1-16 (default 8). Local stdio server only; ignored by the hosted endpoint",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "crawl": {
                "description": "Clone: run the crawl (default true). Local stdio server only; ignored by the hosted endpoint",
                "type": "boolean"
              },
              "description": {
                "description": "Freeform description input",
                "type": "string"
              },
              "maxPages": {
                "description": "Clone: max pages to crawl, 1-5000 (default 200). Local stdio server only; ignored by the hosted endpoint",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "projectRoot": {
                "default": ".",
                "description": "Project root: directory that constitution.md and the vdd/ folder are written to and resolved against. Relative paths resolve from the current working directory; keep the same value across every phase (default \".\")",
                "type": "string"
              },
              "refresh": {
                "description": "Clone: force re-crawl, ignore a fresh cached dataset. Local stdio server only; ignored by the hosted endpoint",
