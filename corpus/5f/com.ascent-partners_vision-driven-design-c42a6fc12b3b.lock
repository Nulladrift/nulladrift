                "type": "array"
              },
              "reasons": {
                "description": "One line per failed check, naming the id to fix",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resultType": {
                "const": "complete",
                "type": "string"
              },
              "status": {
                "enum": ["PASS", "FAIL"],
                "type": "string"
              }
            },
            "required": ["actual_counts", "coverage", "declared_counts", "phases", "reasons", "resultType", "status"],
            "type": "object"
