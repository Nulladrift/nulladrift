      "tools": [
        {
          "name": "vdd_amend",
          "title": "Analyse an amendment",
          "description": "Judge the amended artifact, then list the downstream artifacts that still reference an id it no longer declares. The phase is inferred from the artifact itself. Use it before editing a vision, strategy, tactics, spec, plan or tasks file that other artifacts already depend on.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "changeDescription": {
                "description": "What changed, for the human reading the impact list",
                "type": "string"
              },
              "content": {
                "description": "The amended artifact text",
                "type": "string"
              },
              "declaredCounts": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Counts you declared before generating, keyed goals / pillars / actions / specs / components / tasks. Each phase compares only the keys it consumes; omit it and no count is checked.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "priorArtifacts": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Phase name → the text that phase had before the change, including the amended phase itself",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["content", "priorArtifacts"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "actual_counts": {
                "additionalProperties": {
                  "type": "number"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "changeDescription": {
                "type": ["string", "null"]
              },
              "coverage": {
                "additionalProperties": false,
                "properties": {
                  "backward_sound": {
                    "description": "Children whose serves value names a known parent (invariant B)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "dedicated": {
                    "description": "Parents with a child no other parent shares (invariant C)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "forward_covered": {
                    "description": "Parents with at least one child (invariant A)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "matrix": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "Parent id → child ids that declare it",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "required": ["backward_sound", "dedicated", "forward_covered", "matrix"],
                "type": "object"
              },
              "declared_counts": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "number"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "impactedArtifacts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "phase": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["phase", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "phase": {
                "type": ["string", "null"]
              },
              "reasons": {
                "description": "One line per failed check, naming the id to fix",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resultType": {
                "const": "complete",
                "type": "string"
              },
              "status": {
                "enum": ["PASS", "FAIL"],
                "type": "string"
              }
            },
            "required": ["actual_counts", "changeDescription", "coverage", "declared_counts", "impactedArtifacts", "phase", "reasons", "resultType", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86e863b0ab24fbf7e3742ceb799f2f964c535bec809692dea652d21d54500a7c"
        },
