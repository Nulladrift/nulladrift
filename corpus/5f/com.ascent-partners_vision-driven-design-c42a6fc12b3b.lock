        {
          "name": "vdd_clarify",
          "title": "Clarify Spec",
          "description": "VDD Phase 4b: Clarify an existing spec — scans vdd/specs/<feature>/spec.md and returns the items to resolve: every [NEEDS CLARIFICATION] marker, [e.g.] placeholder, and happy-path acceptance criterion (AC) still needing an edge-case counterpart (AC-E*). Read-only; returns the list without editing the file (the host agent then applies the resolutions). Pass feature (spec directory name). Run after vdd_specify when a spec has unresolved markers; to author a brand-new spec use vdd_specify instead. Parameter relationships: feature must be the exact spec directory name created by vdd_specify. On the hosted (stateless) endpoint, pass artifactFiles ({\"vdd/specs/<feature>/spec.md\": \"...\"}) so the tool can scan the spec and return the real markers; without it the tool returns a delegation envelope.",
          "inputSchema": {
            "properties": {
              "artifactFiles": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Map of vdd/-relative artifact path → full file text, for the hosted (stateless) endpoint, which cannot read the caller filesystem; without it the tool returns a delegation envelope",
                "type": "object"
              },
              "feature": {
                "description": "Feature name: the vdd/specs/<feature>/ directory, kebab-case (e.g., \"user-auth\"); must reference a directory created earlier by vdd_specify",
                "type": "string"
