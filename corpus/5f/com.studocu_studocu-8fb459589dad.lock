                "type": "string"
              },
              "course_id": {
                "description": "Numeric course id from search-courses (the course_id field). Example: 1581710. Prefer this: it pins the course and overrides the course name or code. Omit if you only have a name or code.",
                "exclusiveMinimum": 0,
                "maximum": 2147483647,
                "type": "integer"
              },
              "institution": {
                "description": "School name only. Example: \"University of Amsterdam\". Not an id. This tool has no institution_id. Use the name from the user or from search-institutions. Omit if unknown. If course_id is also set, course_id wins and the result school is that course's school, not this name.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many Studocu documents to return. Integer from 1 to 50. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic keywords only. Example: \"supply and demand\" or \"microeconomics midterm 2025\". Do not put a course name, course id, or school name here. Use institution, course, and course_id for those.",
                "minLength": 1,
                "type": "string"
              },
              "use_no_course_as_fallback": {
                "description": "Only used with course_id. When true and that course has no matching Studocu documents, search again without the course, so results may come from other courses. Check each result's course_id. Default false. Omit for false.",
                "type": "boolean"
