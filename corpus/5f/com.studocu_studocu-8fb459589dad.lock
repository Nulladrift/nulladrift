        {
          "name": "delete-memory",
          "title": "Delete Studocu Agent Memory",
          "description": "Delete one saved memory for this learner, chosen by project_id and kind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Kind of the memory to delete. Example: \"study_preference\" or \"project_learning_context\".",
                "minLength": 1,
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "UUID of the project memory to delete, or null. Example: 11111111-1111-4111-8111-111111111111. Omit or null to delete a learner-wide memory."
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "deleted": {
                "const": true,
                "description": "Always true when the delete succeeds.",
                "type": "boolean"
              },
              "kind": {
                "description": "Memory kind that was deleted.",
                "type": "string"
              },
              "projectId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Owning project UUID, or null for global memory."
              },
              "userId": {
                "description": "Owner of the deleted memory document.",
                "type": "string"
              }
            },
            "required": ["deleted", "kind", "projectId", "userId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
