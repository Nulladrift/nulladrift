  "subjects": {
    "com.studocu/studocu": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-os-mcp.alpha.studocu.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-os-service",
        "version": "0.0.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search Studocu and, after the learner signs in, work with their projects. search-documents, search-institutions, search-courses, and get-course-syllabus need no login, and neither does previewing Studocu documents; every other tool needs a signed-in Studocu account. Leave the Authorization header off when the learner is not signed in: a bad or expired token is rejected, even for the no-login tools. Do not call search-institutions or search-courses before every search-documents.",
      "tools": [
        {
          "name": "add-document-sources",
          "title": "Add Studocu Document Sources",
          "description": "Attach up to 10 Studocu documents from search-documents to a project as project sources. Returns the added sources with their studocu:// ids; compare with document_ids if some are missing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document_ids": {
                "description": "1 to 10 different positive integer Studocu document ids from search-documents (documents[].id). Example: [17, 42].",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991,
                  "type": "integer"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "project_id": {
                "description": "UUID of the project that should receive the Studocu documents. Example: 11111111-1111-4111-8111-111111111111. From create-project or get-context.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["document_ids", "project_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "project_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "document_id": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "source_id": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "status": {
                      "const": "completed",
                      "type": "string"
                    },
                    "title": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "description": "Studocu web link that opens this source in its project. Share it with the user.",
                      "type": "string"
                    }
                  },
                  "required": ["document_id", "source_id", "status", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["project_id", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
