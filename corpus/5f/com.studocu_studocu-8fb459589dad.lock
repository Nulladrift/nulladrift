        {
          "name": "request-creation",
          "title": "Generate Quiz or Mock Exam",
          "description": "Ask Studocu to generate a quiz or mock exam from 1 to 10 project sources. Can take about 3 minutes. If status is creating or outcome_unknown, check get-project-state before calling again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "artifact_ids": {
                "description": "1 to 10 different project source ids to generate from. Each id looks like studocu://project/{project_id}/source/{uuid} and must belong to project_id. Get them from add-document-sources or get-project-state. Do not pass creation ids.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Optional retry key, 1-256 characters. Send the same key when you retry the same request. A different request body with a used key is rejected. Omit to let Studocu derive a key from the request; identical retries still count as the same request.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "instruction": {
                "description": "Optional hint, 1-6000 characters. Example: \"focus on chapter 3\". Omit for a general quiz or mock exam.",
                "maxLength": 6000,
                "minLength": 1,
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project that owns the project sources. Example: 11111111-1111-4111-8111-111111111111. From create-project or get-context.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "type": {
                "description": "What to generate: quiz or mockExam.",
                "enum": ["quiz", "mockExam"],
                "type": "string"
              }
            },
            "required": ["artifact_ids", "project_id", "type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "description": "Agent OS artifact ID of the new creation. Present when status is created.",
                "minLength": 1,
                "type": "string"
              },
              "external_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "Quiz id or mock-exam id. Present when status is created or creating. Match it on get-project-state. Omitted when the call times out."
              },
              "status": {
                "description": "created: saved, with artifact_id and external_id. creating: generation finished but the new creation is not linked yet; match external_id on get-project-state. outcome_unknown: the call timed out or a duplicate is still running; check get-project-state and do not send a new retry key. Failures come back as errors, not as a status.",
                "enum": ["created", "creating", "outcome_unknown"],
                "type": "string"
              },
              "type": {
                "enum": ["quiz", "mockExam"],
                "type": "string"
              },
              "url": {
                "description": "Studocu web link for the user: the creation when status is created, otherwise its project. Share it with the user.",
                "type": "string"
              }
            },
            "required": ["status", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:use"],
                "type": "oauth2"
              }
            ]
          },
