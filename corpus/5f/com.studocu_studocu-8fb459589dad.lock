        {
          "name": "create-project",
          "title": "Create Studocu Project",
          "description": "Create a new project. Every field is optional. Returns project_id for add-document-sources, write-artifact, and request-creation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "course_id": {
                "description": "Positive integer course id from search-courses. Example: 1581710. The course is checked before the project is created; an unknown id creates nothing. Omit to leave the project unlinked.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "emoji": {
                "description": "Icon text, usually an emoji. Example: \"📚\". Omit to leave the icon unset.",
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Name, 1-255 characters, with at least one non-space character. Example: \"Biology midterm\". Omit to create the project without a name; the returned title is then \"Untitled project\".",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "course_id": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "emoji": {
                "minLength": 1,
                "type": "string"
              },
              "institution_id": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "is_mobile": {
                "type": "boolean"
              },
              "project_id": {
                "description": "UUID string in 8-4-4-4-12 hexadecimal form. Example: 11111111-1111-4111-8111-111111111111.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "title": {
                "description": "Agent-displayable project title. Null Alpha names become \"Untitled project\".",
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Studocu web link to the project, for the user to open. Returned to external MCP clients only.",
                "type": "string"
              }
            },
            "required": ["course_id", "emoji", "institution_id", "is_mobile", "project_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
