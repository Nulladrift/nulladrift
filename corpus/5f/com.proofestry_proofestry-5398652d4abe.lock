            "proofestry/paid_endpoint": "/mcp/scan_file",
            "proofestry/price_usdc": "0.01",
            "proofestry/rest": "POST /v1/scan/file"
          },
          "digest": "sha256:81e45aefb6f048526e22b7bbe503fc098afea44b93dc1e61599d9f86fca58037"
