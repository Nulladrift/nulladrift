        {
          "name": "detect_provenance",
          "title": "Detect provenance and AI-generation signals",
          "description": "Reads and validates C2PA manifests (signature and hashes), IPTC DigitalSourceType, and generator metadata. Flags stripped, invalid or conflicting credentials. Reports signals and confidence, never a definitive 'not AI-generated'; the C2PA signer is not yet checked against the trust list. C2PA manifests are read and validated in images, PDF, Office and OpenDocument files, audio and video (see supported-formats.json). IPTC, XMP, EXIF and generator-name signals are read for JPEG, PNG, HEIC/HEIF, WebP, TIFF, AVIF and MP4/QuickTime; `checks_run` says what ran for each file. MCP tool: `detect_provenance`. Price: 0.002 USDC per image.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes (max 4 MiB).",
                "title": "File Base64",
                "type": "string"
              }
            },
            "required": ["file_base64"],
            "title": "FileRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
