        {
          "name": "clean_metadata",
          "title": "Remove private metadata from an image and return the cleaned copy",
          "description": "Removes EXIF (GPS, device, timestamps), XMP, IPTC and text metadata from a JPEG, PNG or WebP and returns the cleaned file, with a list of what was removed and what was kept (the picture, the color profile, the display orientation and the IPTC digital source type). The pixels are not re-encoded. A file that carries Content Credentials (C2PA) is refused with 409, since cleaning it would break their signature. Images up to 1 MiB inline; larger files use the upload job routes. Failed calls are never charged. MCP tool: `clean_metadata`. Price: 0.01 USDC per file.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes (max 4 MiB).",
