        {
          "name": "timestamp",
          "title": "Timestamp a hash",
          "description": "Obtains an RFC 3161 timestamp token for a SHA-256 hash from a public timestamp authority and stores it, so the hash can be shown to have existed at that time. Only the hash is sent: Proofestry never sees the content. Returns the token (verifiable with `openssl ts -verify`) and a record id. A timestamp proves the hash existed then, not who made the content or that it is true. A failure at the authority is a 5xx and is never charged. Price: 0.01 USDC per hash. MCP tool: `timestamp`.",
          "inputSchema": {
            "properties": {
              "label": {
                "default": "",
                "description": "An optional note stored with the timestamp.",
                "maxLength": 100,
                "title": "Label",
                "type": "string"
              },
              "sha256": {
                "description": "The SHA-256 of your content, as 64 hexadecimal characters. Only this hash is sent; Proofestry never sees the content.",
                "pattern": "^[0-9a-fA-F]{64}$",
                "title": "Sha256",
                "type": "string"
              }
            },
            "required": ["sha256"],
            "title": "TimestampCreateRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Timestamp a hash"
