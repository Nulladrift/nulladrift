        {
          "name": "snapshot_citation",
          "title": "Snapshot a citation",
          "description": "Fetches a public web page and records what it served: the final URL, the time, the HTTP status, the content type, the SHA-256 of the bytes and the title. The record is timestamped (RFC 3161) and gets a permanent proof link. Proofestry does not store the page; set `include_content` to get the bytes back to keep. Only public http(s) pages on ports 80 and 443 are fetched; pages that need a login or JavaScript are captured as served to a plain request. A page that cannot be fetched, or answers with an error status, is a 4xx/5xx and is never charged. Price: 0.02 USDC per URL. MCP tool: `snapshot_citation`.",
          "inputSchema": {
            "properties": {
              "include_content": {
                "default": false,
                "description": "Also return the fetched bytes (base64, up to 1 MiB) so you can keep them. Proofestry never stores the content.",
                "title": "Include Content",
                "type": "boolean"
              },
              "url": {
                "description": "A public http(s) page, on port 80 or 443. Addresses on private networks are refused.",
                "maxLength": 2048,
                "minLength": 8,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "SnapshotRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Snapshot a citation"
