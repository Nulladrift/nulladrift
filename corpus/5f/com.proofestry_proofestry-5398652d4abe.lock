        {
          "name": "scan_file",
          "title": "Scan a file for hidden content, active content and prompt-injection text",
          "description": "Looks inside a PDF, Word, Excel or PowerPoint file, an image or a text/HTML file for what a reader does not see: scripts and launch actions, hidden or invisible text, embedded files, trailing data, and phrases that try to instruct an AI that reads the file. Reports each finding's kind, severity and location; for an injection phrase it quotes only the matched phrase (up to 80 characters), never other content. Not an antivirus and not a guarantee: `checks_run` lists what was inspected, and a file type with no checks returns `overall_risk: unknown`. Price: 0.01 USDC per file. MCP tool: `scan_file`.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes (max 4 MiB).",
                "title": "File Base64",
                "type": "string"
