        {
          "name": "mark_content",
          "title": "Apply a compliance profile to an image",
          "description": "Marks an AI-generated or human-made image with a compliance profile: a signed C2PA manifest with the profile's disclosure, an invisible watermark (the AI profiles), an ISCC fingerprint registered with Proofestry, and a trusted timestamp when the signing provider has one. Returns the marked file (base64 in the REST response; a short-lived download link over MCP). Marking the same image again is idempotent: it returns the same asset id and never creates a second record. Profiles help meet obligations and do not guarantee compliance; they are in beta until the signer is on the C2PA trust list. Images up to 1 MiB inline (JPEG, PNG, WebP, HEIC); larger files use the upload job routes. Failed calls are never charged. MCP tool: `mark_content`. Price: 0.01 USDC per image.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes (max 4 MiB).",
                "title": "File Base64",
                "type": "string"
              },
              "invisible_watermark": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "provenance-only: also embed the invisible watermark. The AI profiles always do.",
                "title": "Invisible Watermark"
              },
              "ledger_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Add the asset to this ledger for the compliance report. Needs `Authorization: Bearer <ledger token>`.",
                "title": "Ledger Id"
              },
              "profile": {
                "description": "Compliance profile (see GET /v1/provenance/profiles).",
                "enum": ["eu-ai-act-art50", "ca-ai-transparency-act", "provenance-only"],
                "title": "Profile",
                "type": "string"
              },
              "provider_name": {
                "default": "",
                "description": "Who provides the AI system. Required for the AI profiles.",
                "maxLength": 100,
                "title": "Provider Name",
                "type": "string"
              },
              "source_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "provenance-only only: digitalCapture, digitalCreation, humanEdits or screenCapture (default digitalCreation).",
                "title": "Source Type"
              },
              "strip_metadata": {
                "default": false,
                "description": "Remove EXIF metadata (for example GPS) from the marked file.",
                "title": "Strip Metadata",
                "type": "boolean"
              },
              "system_name": {
                "default": "",
                "description": "The AI system that generated the content. Required for the AI profiles.",
                "maxLength": 100,
                "title": "System Name",
                "type": "string"
              },
              "system_version": {
                "default": "",
                "maxLength": 50,
                "title": "System Version",
                "type": "string"
              },
              "visible_label": {
                "default": false,
                "description": "Draw a visible 'AI-generated' label on the image (AI profiles only).",
                "title": "Visible Label",
                "type": "boolean"
              }
            },
            "required": ["file_base64", "profile"],
            "title": "MarkRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply a compliance profile to an image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
