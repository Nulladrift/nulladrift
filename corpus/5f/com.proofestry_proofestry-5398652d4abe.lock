        {
          "name": "compliance_report",
          "title": "Compliance report for a ledger",
          "description": "An audit record of what was marked, when, with which layers and standard versions, for one ledger. Counts unique assets (a retry never adds one). Up to 5,000 assets per call: a larger ledger returns `next_cursor`, and each further page is a separate call and charge. Requires `Authorization: Bearer <ledger token>`; unknown ledgers and wrong tokens get the same 404, which is not charged. Price: 0.10 USDC. MCP tool: `compliance_report`.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Continue a large ledger: the `next_cursor` of the previous page. Omit for the first page.",
                "title": "Cursor"
              },
              "ledger_id": {
                "title": "Ledger Id",
                "type": "string"
              },
              "limit": {
                "anyOf": [
                  {
                    "maximum": 5000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Assets in this page (default and maximum 5,000). Each call is one priced report.",
                "title": "Limit"
              }
            },
            "required": ["ledger_id"],
            "title": "ReportRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
