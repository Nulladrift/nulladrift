{
  "lockfileVersion": 2,
  "subjects": {
    "ai.beexcellent/reference": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://beexcellent.ai/api/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "excellent-mcp-free",
        "title": "Excellent Reference (free)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free, no-login reference server for Excellent, the operating platform for restaurant groups (private dining and events, staff training, marketing). excellent_help answers how to do something in Excellent from its own help text; search_excellent_pages finds Excellent's published feature, comparison, blog and guide pages. Neither reads any restaurant group's data. start_excellent_workspace creates a sample workspace and returns a one-time link the person opens to make it theirs; it takes no personal data. For a diner, find_event_venues lists the venues that chose to accept private-event inquiries from AI assistants, and send_event_inquiry sends one of them an inquiry the person asked for, which lands as a lead the venue reviews and answers itself; neither reads any venue's data. A group's own events, leads, guests, invoices, documents and drafts need the signed-in Excellent connector (https://beexcellent.ai/api/mcp, OAuth with an Excellent account).",
      "tools": [
        {
          "name": "excellent_help",
          "title": "How Excellent works",
          "description": "Excellent's own help text (the passages its in-app assistant answers from): how to do a task in Excellent — proposals, e-signed contracts, deposits and invoices, banquet event orders, floor plans, menus, staff training (Craft), marketing drafts, connecting an AI assistant. Returns up to 3 passages, best match first, each with the in-app page it starts on. No account needed; it reads no restaurant group's data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What to look up, in plain words (e.g. \"deposit schedule\", \"banquet event order\", \"Tripleseat\").",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Excellent works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82feccbcbc5a6d3a7b5418e6f0e69d7fcca9b78166d77cf9d38e78fe45b27508"
        },
        {
          "name": "find_event_venues",
          "title": "Find venues that take inquiries from assistants",
          "description": "Finds restaurants and venues on Excellent that accept private-event and group-dining inquiries from AI assistants, by the restaurant group's or the venue's name. Returns up to 10, each with the group, the venue, who replies, a handle for send_event_inquiry and the venue's public inquiry page. Only venues that opted in are listed, and only what their public inquiry page shows. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The restaurant group's or venue's name, e.g. \"Lumière\" or \"Harbor Room\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find venues that take inquiries from assistants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2c94a17bb81ef15ba42a19b52980f477654f1efb46ae772fe0618c5b964ebd1"
        },
        {
          "name": "search_excellent_pages",
          "title": "Search Excellent's public pages",
          "description": "Search Excellent's published pages: feature pages (what each part of the product does), comparison pages (Excellent vs another events or private-dining platform, with where each one wins and the date the comparison was last reviewed), the blog, and guides (how to connect Claude, with 15 things to ask it). Returns up to 5 pages with their URL and the page's own summary text. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional: only one kind of page.",
                "enum": ["feature", "comparison", "blog", "guide"],
                "type": "string"
              },
              "query": {
                "description": "What to look up, in plain words (e.g. \"deposit schedule\", \"banquet event order\", \"Tripleseat\").",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Excellent's public pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae107463630142e9100c594a5e11af23aa048b7e2cc3cad9b43a659707bad6f0"
        },
        {
          "name": "send_event_inquiry",
          "title": "Send a private-event inquiry to a venue",
          "description": "Sends a private-event or group-dining inquiry, on behalf of the person you are helping, to a venue that accepts inquiries from AI assistants (its handle comes from find_event_venues). Use it only when the person asked you to contact the venue, with the details they gave you. It lands in the venue's inbox as a new lead for the venue's team to review and answer directly; it books, holds and pays for nothing, and Excellent sends the guest no email. Give an email or a phone so the venue can reply. Answers only whether it was filed. At most 5 an hour and 20 a day per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_date": {
                "description": "Optional: the date they want, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Optional: the occasion, e.g. \"birthday dinner\", \"rehearsal dinner\", \"team offsite\".",
                "maxLength": 80,
                "type": "string"
              },
              "guest_email": {
                "description": "The guest's email, for the venue's reply. Give this or guest_phone.",
                "maxLength": 254,
                "type": "string"
              },
              "guest_name": {
                "description": "The guest's name, as they gave it.",
                "maxLength": 120,
                "type": "string"
              },
              "guest_phone": {
                "description": "The guest's phone, for the venue's reply. Give this or guest_email.",
                "maxLength": 40,
                "type": "string"
              },
              "message": {
                "description": "Optional: anything else they want the venue to know, in their words.",
                "maxLength": 2000,
                "type": "string"
              },
              "party_size": {
                "description": "Optional: how many guests.",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "venue": {
                "description": "The venue's handle from find_event_venues (org/form), or its inquiry_url.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["guest_name", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send a private-event inquiry to a venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0306e60e588241f93fba64fbb477fe1a70efb2e687ca300ac923864d5fa91cb2"
        },
        {
          "name": "start_excellent_workspace",
          "title": "Start a sample Excellent workspace",
          "description": "Creates a new Excellent workspace filled with sample data (a fictional restaurant group with two venues, bookings, proposals, invoices, staff training and marketing drafts) and returns a one-time link for the person you are helping. Opening the link while signed in to Excellent, or after creating a login there, makes the workspace theirs. Nobody can use it before then, and an unclaimed workspace is deleted when its link expires after 7 days. Takes no arguments and no personal data. At most 3 a day per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a sample Excellent workspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cfe8757f927db5cf6e1196cccf0827ed2cde041e100f13202b71c2b6d8aec0c3"
        }
      ],
      "digest": "sha256:a504df370f19d277ab367f280489c13e7804d4436f5a45c75e1562a3767252a5"
    }
  }
