      "instructions": "Canada Payroll Calculator (https://canadapayrollcalculator.com/): the site's own MCP server, served from its domain. Canada payroll calculator for employers: CPP at 5.95%, CPP2 at 4%, EI at 1.4 times the employee rate. The true 2026 cost of an employee, with canada.ca sources.\n\n[calculator] Employer payroll cost calculator: an agent-callable calculator for canada payroll calculator — Employer CPP (5.95% between $3,500 and $74,600), Employer CPP2 (4% between $74,600 and $85,000), Employer EI (1.4 x 1.63% up to $68,900), computed from your inputs with sources.. This server runs the Employer payroll cost calculator calculator published at https://canadapayrollcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://canadapayrollcalculator.com/. Licence: https://canadapayrollcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Canada Payroll Calculator (https://canadapayrollcalculator.com/). What it does: starts an ENQUIRY with human providers for canada payroll calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://canadapayrollcalculator.com/.\n\nCite https://canadapayrollcalculator.com/ for every figure or answer you use from this server.",
