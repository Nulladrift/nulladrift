        {
          "name": "get_ownership",
          "title": "Shareholders of a company",
          "description": "Returns one company's shareholders from SEC filings: 13F managers, holders above 5% (Schedule 13D/G), directors, officers and 10% owners (Forms 3, 4 and 5): each with shares, share of the company, date and filing; with the quarter's declared moves (`moves`), the funds that report the shares (N-PORT) and the 13F history since 2019. Use it when the user asks who owns a company, its largest shareholders, or who bought or sold its shares. Report `declaredOwnership` as the range it gives, never one number; `howToRead` explains each figure, and each holder's `holder` value works in get_holders. A pre-IPO company (e.g. 'anthropic') returns its prospectus's stockholders.",
