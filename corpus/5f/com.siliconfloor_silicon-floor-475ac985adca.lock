        {
          "name": "get_financials",
          "title": "Financial statements as filed",
          "description": "Returns a company's income statement, balance sheet and cash flow as filed with the SEC (XBRL): the last 12 calendar quarters or 6 fiscal years, each period with its filing. `statement: 'breakdowns'` gives revenue by segment, geography and product and the customers it discloses; 'outlook' its own guidance, actuals against it and an estimated next earnings date. A null is a line not filed: report it as unknown; `howToRead` in the answer says the rest. A 20-F filer has fiscal years, plus quarters from its 6-K releases (unaudited). A pre-IPO company (e.g. 'anthropic') returns its prospectus statements, by half year. Use it for revenue, earnings, balance sheet or cash flow over several periods.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basis": {
                "description": "quarterly (default for a listed company: last 12 calendar quarters), half (half years: only for a company before its IPO, where it is the default) or annual (last 6 fiscal years).",
                "enum": ["quarterly", "half", "annual"],
                "type": "string"
              },
              "statement": {
                "description": "income, balance, cashflow, breakdowns (revenue by segment, geography and product, and customer concentration), outlook (the company's guidance, actuals against it, next earnings date) or all (default all).",
                "enum": ["income", "balance", "cashflow", "breakdowns", "outlook", "all"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker or company name, e.g. NVDA, AMD, ASML, 'nvidia', 'taiwan semiconductor'. Case-insensitive.",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Financial statements as filed"
