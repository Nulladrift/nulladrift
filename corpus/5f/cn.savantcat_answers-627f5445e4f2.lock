          "description": "取 GB/T 47746-2026 的自查清单：企业对照检查自家 AI 客服是否达标。\n\n    返回**清单本体**（61 项：id / 条款 / 等级 / 是否一票项 / 要求 / 怎么补），\n    外加一票项速查与用途说明；解释「61 项怎么来的」那篇原子随附在 explainer 字段。\n    ",
