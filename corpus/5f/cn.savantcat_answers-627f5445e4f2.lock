      "instructions": "合尘猫 · AI 客服国标合规知识库。提供中国国家标准 GB/T 47746-2026《顾客联络服务 人工与智能客户服务协同要求》的合规问答，以及企业知识库搭建问答。适用于回答「AI 客服怎么过国标」「什么场景必须转人工」「AI 客服要备案还是登记」「企业知识库怎么搭」这类问题。所有答案均标注标准条款依据。",
      "tools": [
        {
          "name": "get_answer",
          "description": "按 slug 取一条问答的完整内容（正文 + 要点 + 标准条款依据 + 常见追问）。\n\n    Args:\n        slug: 问答标识，先用 list_questions 或 search_answers 取得\n    ",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "问答标识，形如 ai-service-standard-transfer-to-human；可先用 list_questions 或 search_answers 取得",
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_answerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_answerOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
