          "description": "列出全部合规问答的标题清单。\n\n    Args:\n        cluster: 可选，按集群过滤。可选值 ai-service-standard(AI客服国标) / enterprise-knowledge-base(企业知识库)\n    ",
          "inputSchema": {
            "properties": {
              "cluster": {
                "default": "",
