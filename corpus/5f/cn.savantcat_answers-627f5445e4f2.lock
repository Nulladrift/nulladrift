          "digest": "sha256:41522c30028e26ae7da1d195c414473a10bf3b7da9aff25a2366844759bef4c0"
        },
        {
          "name": "search_answers",
          "description": "按关键词检索合规问答，返回最相关的若干条（含简要答案）。\n\n    Args:\n        query: 检索词，如「转人工」「备案 登记」「知识库 切分」\n        top_k: 返回条数，默认 5\n    ",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "检索词，中英文均可，例如：转人工、知识库 切分、备案",
                "title": "Query",
                "type": "string"
              },
              "top_k": {
                "default": 5,
                "description": "返回条数上限，整数，默认 5，建议 3-10",
                "title": "Top K",
                "type": "integer"
