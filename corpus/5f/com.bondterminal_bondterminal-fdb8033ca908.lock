        {
          "name": "bondterminal_get_bonds",
          "title": "Bond prices and analytics",
          "description": "Bond rows include stored optionAdjustedSpread and oasStatus when available. Resolve and compare reference data, live analytics, and optional cashflows for up to 10 bonds: future flows by default, or every flow from the first coupon with schedule full. For many bonds, send up to 10 identifiers per call instead of one search per issuer. Identifiers: ISIN, ticker, or local ticker. Argentine sovereign local tickers work in every species spelling (AL30, AL30C, AL30D all mean the same bond). The identifier never selects the price lane: Argentine bonds price off cable USD by default and the market block reports which lane (quoteBasis) produced the price. YTM is percent, semi-annual bond-equivalent (S.A.) for every bond; spreads are basis points on the same basis, except EUR bonds, whose spreads are over the Bund curve on the annual basis (spreads.benchmark BUND, yields.ytmAnnual); and prices are per 100 face. Yield conventions: https://bondterminal.com/methodology/yields Concise is the default response format. Rows give the G-spread as gSpread; oas is a deprecated alias with the same value, not an option-adjusted spread. Billing: 1 calculation unit per identifier when analytics is included; otherwise 1 read unit for this 10-bond cap.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "identifiers": {
                "description": "Up to 10 bonds. Each: ISIN, CUSIP, ticker or Argentine local ticker (for example AL30 or GD30).",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "include": {
                "description": "reference: terms and issuer; analytics: price, yields, spreads and duration; cashflows: coupons and principal, future only unless schedule is full. Default: reference and analytics.",
                "items": {
                  "enum": ["reference", "analytics", "cashflows"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "response_format": {
                "default": "concise",
                "description": "concise returns the main analytics fields; detailed returns every field.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "schedule": {
                "default": "remaining",
                "description": "With cashflows. remaining: flows after settlement. full: every flow the catalog holds, from the first coupon, each with amountStatus. A coupon the terms do not prove is blank when past (amountStatus unavailable). Takes no settlement.",
                "enum": ["remaining", "full"],
                "type": "string"
              },
              "settlement": {
                "description": "Settlement date, YYYY-MM-DD, years 2020 to 2100. Omitted, each bond uses its standard settlement.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["identifiers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bonds": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "missing": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requestable": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bonds", "count", "missing"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bond prices and analytics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://bondterminal/bond-card.html"
            },
            "ui/resourceUri": "ui://bondterminal/bond-card.html"
          },
          "digest": "sha256:d2e356cd6c2f829e0f1477531a6fe12c9eae0ec80e1bf7c5392ed0a4ade076ca"
        },
        {
          "name": "bondterminal_get_history",
          "title": "Bond history",
          "description": "Return daily price, YTM, YTW, and spread history for one bond using a named range or explicit dates. YTM is percent, semi-annual bond-equivalent (S.A.) for every bond; spreads are basis points on the same basis, except EUR bonds, whose spreads are over the Bund curve on the annual basis (spreads.benchmark BUND, yields.ytmAnnual); and prices are per 100 face. Yield conventions: https://bondterminal.com/methodology/yields Explicit ranges are capped at 730 days and responses at 750 points. Billing: 10 read units per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "end": {
                "description": "Last day, YYYY-MM-DD. Needs start; at most 730 days after it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "identifier": {
                "description": "One bond: ISIN, CUSIP, ticker or Argentine local ticker (for example AL30 or GD30).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "range": {
                "default": "1m",
                "description": "Named window: 1w, 1m, 3m, ytd, 1y or 2y. start and end replace it when both are given.",
                "enum": ["1w", "1m", "3m", "ytd", "1y", "2y"],
                "type": "string"
              },
              "start": {
                "description": "First day, YYYY-MM-DD. Needs end.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "isin": {
                "type": "string"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "end": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "points": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "start": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["end", "points", "start"],
                "type": "object"
              },
              "series": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "price": {
                      "description": "Clean price per 100 face value.",
                      "type": "number"
                    },
                    "spread": {
                      "description": "G-spread in basis points, on the ytm basis; spreadBenchmark names its curve (BUND spreads are on the annual basis).",
                      "type": "number"
                    },
                    "spreadBasis": {
                      "const": "dm_flat_sofr",
                      "description": "dm_flat_sofr on a SOFR floater: spread is the discount margin over flat SOFR, not a curve spread.",
                      "type": "string"
                    },
                    "spreadBenchmark": {
                      "description": "The curve spread is over: UST for USD bonds, BUND for EUR bonds.",
                      "enum": ["UST", "BUND"],
                      "type": "string"
                    },
                    "yieldBasis": {
                      "description": "What ytm is measured to on that date: first_call for AT1/T2 capital whose first call is at least six months away, worst_call for a dated callable whose yield to worst runs to a call at least six months away (ytm then equals ytw), perpetuity for perpetuals, maturity otherwise.",
                      "enum": ["maturity", "perpetuity", "first_call", "worst_call"],
                      "type": "string"
                    },
                    "ytm": {
                      "description": "The quoted (headline) yield in percent, S.A.; yieldBasis names what it is measured to.",
                      "type": "number"
                    },
                    "ytw": {
                      "description": "Yield to worst in percent, S.A.",
                      "type": "number"
                    }
                  },
                  "required": ["date"],
                  "type": "object"
                },
                "maxItems": 750,
                "type": "array"
              },
              "ticker": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "url": {
                "description": "The bond page on bondterminal.com.",
                "type": "string"
              }
            },
            "required": ["isin", "range", "series"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bond history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://bondterminal/history.html"
            },
            "ui/resourceUri": "ui://bondterminal/history.html"
          },
          "digest": "sha256:b820e8774d6806371156d0c85fa5417ed334bd4e349cfe253e36d295798e5c3c"
        },
        {
          "name": "bondterminal_get_terms",
          "title": "Bond terms",
          "description": "Pro only. Return the terms of up to 10 bonds as read from their offering documents: calls and make-whole, change of control, covenants, events of default, amendment votes, ranking, governing law, payments and coupon terms. Ask for topics or single fields to keep the answer short. Every confirmed value carries its verbatim quote and the document page; other states are not_confirmed, not_found, does_not_apply or not_read, and never mean \"no\". These are what the documents say; bondterminal_get_bonds gives the terms BondTerminal prices with. When they differ, show both. Quote the page when you state a term. Billing: 5 read units per bond; at most 10 bonds per call; 60 distinct term sheets a day per account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "description": "Single terms to return (for example makeWhole, cocPut, governingLaw); with topics, only terms in both.",
                "items": {
                  "enum": ["ranking", "security", "guarantors", "bailIn", "makeWhole", "parCall", "callNotice", "firstCall", "cleanUpCall", "specialMandatoryRedemption", "crossDefault", "paymentGrace", "accelerationVote", "cocPut", "cocTrigger", "capitalTrigger", "lossAbsorption", "negativePledge", "negativePledgeScope", "covenantPackage", "lmeBlockers", "couponDeferral", "amendmentVote", "governingLaw", "jurisdiction", "recordDate", "trustee", "payingAgent", "additionalAmounts", "couponReset", "benchmarkFallback", "slbTerms", "greenLabel"],
                  "type": "string"
                },
                "maxItems": 33,
                "minItems": 1,
                "type": "array"
              },
              "identifiers": {
                "description": "Up to 10 bonds. Each: ISIN, CUSIP, ticker or Argentine local ticker (for example AL30 or GD30).",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "topics": {
                "description": "Topics to return, in any order; omitted returns every topic.",
                "items": {
                  "enum": ["call", "default", "coc", "covenants", "amendments", "ranking", "law", "payments", "coupon", "bank"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["identifiers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bonds": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "coverage": {
                      "additionalProperties": false,
                      "properties": {
                        "current": {
                          "description": "False when a document was added or changed after the terms were read.",
                          "type": "boolean"
                        },
                        "documents": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "dated": {
                                "type": ["string", "null"]
                              },
                              "pages": {
                                "anyOf": [
                                  {
                                    "maximum": 9007199254740991,
                                    "minimum": -9007199254740991,
                                    "type": "integer"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "title": {
                                "type": "string"
                              },
                              "type": {
                                "type": "string"
                              }
                            },
                            "required": ["dated", "pages", "title", "type"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "readAt": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["current", "documents", "readAt"],
                      "type": "object"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "link": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "topics": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "fields": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "citation": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "document": {
                                      "type": "string"
                                    },
                                    "label": {
                                      "type": "string"
                                    },
                                    "page": {
                                      "description": "The printed page number, when the document prints one.",
                                      "type": ["string", "null"]
                                    },
                                    "pdfPage": {
                                      "anyOf": [
                                        {
                                          "maximum": 9007199254740991,
                                          "minimum": -9007199254740991,
                                          "type": "integer"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ]
                                    }
                                  },
                                  "required": ["document", "label", "page", "pdfPage"],
                                  "type": "object"
                                },
                                "differsFromMost": {
                                  "type": "string"
                                },
                                "key": {
                                  "type": "string"
                                },
                                "label": {
                                  "type": "string"
                                },
                                "programme": {
                                  "description": "Set in the base prospectus; the bond's own final terms can change it.",
                                  "type": "boolean"
                                },
                                "quote": {
