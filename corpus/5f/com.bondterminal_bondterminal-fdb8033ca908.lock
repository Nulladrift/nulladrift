                "type": "object"
              },
              "q": {
                "description": "Free text: issuer, ticker, ISIN, CUSIP or words in the bond name.",
                "maxLength": 256,
                "type": "string"
              },
              "sector": {
                "description": "Issuer sectors, for example [\"Sovereign\",\"Energy\"]. Same as filters.sector.",
                "items": {
