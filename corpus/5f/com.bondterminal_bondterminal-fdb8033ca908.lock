        {
          "name": "bondterminal_get_usage",
          "title": "API usage",
          "description": "Return the authenticated plan, calculation/read usage, remaining quotas, and reset time. YTM conventions are percent, spreads are basis points, and bond prices are per 100 face; this tool returns no bond data and has no batch input. Billing: free; consumes no calculation or read units.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calculations": {
                "additionalProperties": false,
                "properties": {
                  "limit": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "remaining": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "used": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["limit", "remaining", "used"],
                "type": "object"
              },
              "plan": {
                "type": "string"
              },
              "reads": {
                "additionalProperties": false,
                "properties": {
                  "limit": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
