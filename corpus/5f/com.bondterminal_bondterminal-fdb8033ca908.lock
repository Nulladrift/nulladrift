                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "message": {
                "description": "What happened, written so a person without this conversation understands it.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "severity": {
                "description": "blocked: the user could not go on; workaround: they got there another way; minor: small issue.",
                "enum": ["blocked", "workaround", "minor"],
                "type": "string"
              },
              "tool": {
                "description": "The BondTerminal tool involved, if any.",
                "enum": ["bondterminal_search_bonds", "bondterminal_get_bonds", "bondterminal_calculate", "bondterminal_get_history", "bondterminal_riesgo_pais", "bondterminal_treasury_curve", "bondterminal_get_usage", "bondterminal_request_bond", "bondterminal_get_terms", "bondterminal_search_documents", "bondterminal_report_gap"],
                "type": "string"
              }
            },
            "required": ["category", "message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
