      "instructions": "Bond data is read-only; one tool files bond requests and one records feedback on gaps. Two Pro tools read offering documents, every answer cited to its page. Each bond result carries its bondterminal.com page in url; cite it when you quote our numbers. YTM/rates are percent, bond yields are semi-annual bond-equivalent (S.A.), spreads are bps on the same basis (EUR bonds: over the Bund curve, annual basis, spreads.benchmark BUND), and prices are per 100 face. Yield conventions: https://bondterminal.com/methodology/yields",
      "tools": [
        {
          "name": "bondterminal_calculate",
          "title": "Calculate yield or price",
          "description": "Results include live optionAdjusted OAS with model assumptions when a curve is available. Run what-if bond analytics from exactly one supplied price, YTM, G-spread, or Z-spread for each bond. YTM is percent, semi-annual bond-equivalent (S.A.) for every bond; spreads are basis points on the same basis, except EUR bonds, whose spreads are over the Bund curve on the annual basis (spreads.benchmark BUND, yields.ytmAnnual); and prices are per 100 face. Yield conventions: https://bondterminal.com/methodology/yields Maximum 50 bonds per call. Billing: 1 calculation unit per bond.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bonds": {
                "description": "Up to 50 bonds, each with an identifier and exactly one of price, ytm, gSpread or zSpread.",
                "items": {
                  "properties": {
                    "gSpread": {
                      "description": "G-spread in basis points.",
                      "maximum": 100000,
                      "minimum": -20000,
                      "type": "number"
                    },
                    "identifier": {
                      "description": "ISIN, CUSIP, ticker or Argentine local ticker (for example AL30 or GD30).",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "description": "Clean price per 100 face value.",
                      "maximum": 500,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "ytm": {
                      "description": "Yield to maturity in percent, semi-annual bond-equivalent (S.A.).",
                      "maximum": 463,
                      "minimum": -180,
                      "type": "number"
                    },
                    "zSpread": {
                      "description": "Z-spread in basis points.",
                      "maximum": 100000,
                      "minimum": -20000,
                      "type": "number"
                    }
                  },
                  "required": ["identifier"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "settlement": {
                "description": "Settlement date, YYYY-MM-DD, years 2020 to 2100. Omitted, each bond uses its standard settlement.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["bonds"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "errors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "error": {
                      "type": "string"
                    },
                    "identifier": {
                      "type": "string"
                    },
                    "index": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["error", "identifier", "index", "message"],
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": false,
                "properties": {
                  "failed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "requested": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "successful": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["failed", "requested", "successful"],
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["meta", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate yield or price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
