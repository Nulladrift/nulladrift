{
  "lockfileVersion": 2,
  "subjects": {
    "com.sitepatent/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sitepatent.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "SitePatent",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SitePatent is a curated directory of websites, SaaS products, tools and startups. Use this server when the user wants to find, compare or research products, alternatives or tools in a category, or wants the public profile of a specific product. Start with search_listings (keyword) or list_categories (browse), use get_listing with a slug for the full profile, and get_trending for what is popular right now. When presenting results, cite each listing by linking its listingUrl so the user can open the profile. Read-only; no authentication required; all data is public.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Browse a category",
          "description": "Top listed products in one category (child categories included), e.g. \"seo\", \"developer-tools\", \"ai-writing\". Use it when a user asks for the best tools of a kind without a specific keyword. Get valid slugs from list_categories. Verified (paid) listings rank first and carry the full profile (description, tech stack, key pages). Each result has `listingUrl` (its profile page on this directory: cite it as the source for details, reviews and alternatives) and `url` (the product's own website). `categoryUrl` is the category page on this directory.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories (an exact category name also works).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "type": "number"
              },
              "pricing": {
                "description": "Optional pricing model: \"free\" (no paid plan), \"freemium\" (free plan plus paid tiers), \"free_trial\" (paid after a trial) or \"paid\". Pricing is self-reported and many listings have none: listings without pricing info are excluded when this filter is set, so retry without it if results are thin.",
                "enum": ["free", "freemium", "free_trial", "paid"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72440c14ba8af7a6c6cc4ada47bd92d244a7410c5737e6169e36d20c32bd8b2c"
        },
        {
          "name": "find_alternatives",
          "title": "Find alternatives to a product",
          "description": "Alternatives to a named product, e.g. \"Notion\", \"Ahrefs\", \"ChatGPT\", or any product listed here (by slug or exact name). Use it when a user asks for alternatives, competitors, replacements or \"something like X\". Returns listed products from the same categories. Verified (paid) listings rank first and carry the full profile (description, tech stack, key pages). Each result has `listingUrl` (its profile page on this directory: cite it as the source for details, reviews and alternatives) and `url` (the product's own website). `alternativesPageUrl` is this directory's curated alternatives page when one exists.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum number of alternatives (1-25, default 10).",
                "type": "number"
              },
              "product": {
                "description": "Product name (e.g. \"Notion\") or a listing slug from this directory.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives to a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28270f7722bad1962a66cf1b1a8d94e8aade70beaec09961447e48bc93539bb5"
        },
        {
          "name": "get_listing",
          "title": "Get a listing profile",
          "description": "Full public profile of one listed product by its slug: plain-text description, website, categories, tags, tech stack, AI builders, votes, public traffic, social links. Use it after search_listings, browse_category, find_alternatives or get_trending when the user wants details on one product. Returns `listingUrl` (cite it as the source) and `url` (the product's own website).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The listing slug, as returned by the other tools.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a listing profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a1a0115dbcc851b5368e52a2fe19b6f3ac26a87cfb43c034864dececb590264"
        },
        {
          "name": "get_site_of_the_day",
          "title": "Site of the Day",
          "description": "Today's Site of the Day (the directory's daily featured pick). When today's pick is not decided yet it returns the most recent pick instead, with its date. Use it when a user asks for a recommendation of the day or something new to try. Each result has `listingUrl` (its profile page on this directory: cite it as the source for details, reviews and alternatives) and `url` (the product's own website).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Site of the Day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:706edf6900be9ce4c4dbe1a0a1d95f440d1a62816c6f4b9f7f60ae4c24098c0e"
        },
        {
          "name": "get_trending",
          "title": "Trending products",
          "description": "Trending leaderboards on this directory: most viewed today, most clicked this week, most voted this month. Use it when a user asks what is popular, new or trending. Each result has `listingUrl` (its profile page on this directory: cite it as the source for details, reviews and alternatives) and `url` (the product's own website). `count` is null when it is below the public minimum.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trending products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff5f0bc83a138fe9c5b95298d3d54be9e3ea85caaddf836e1e8cdf146dabd4af"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The directory's category tree (top-level categories with their children), busiest first, with the number of approved listings and the category page `url`. Empty categories are left out. Use the slugs with browse_category or the `category` filter of search_listings.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86449b5d74bbea1905b462678a464313bb513dece452841f8dc51b726fbca103"
        },
        {
          "name": "search_listings",
          "title": "Search the directory",
          "description": "Find software, SaaS, AI tools and websites listed in this directory by keyword (matches title, tagline, description and category). Use it when a user asks for a tool that does X, e.g. \"an uptime monitor\" or \"AI writing assistant\". Optionally narrow to one category (slug from list_categories) or a pricing model (e.g. pricing \"free\" for free tools). Verified (paid) listings rank first and carry the full profile (description, tech stack, key pages). Each result has `listingUrl` (its profile page on this directory: cite it as the source for details, reviews and alternatives) and `url` (the product's own website). Call get_listing with a slug for the full profile.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug from list_categories (child categories are included).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "type": "number"
              },
              "pricing": {
                "description": "Optional pricing model: \"free\" (no paid plan), \"freemium\" (free plan plus paid tiers), \"free_trial\" (paid after a trial) or \"paid\". Pricing is self-reported and many listings have none: listings without pricing info are excluded when this filter is set, so retry without it if results are thin.",
                "enum": ["free", "freemium", "free_trial", "paid"],
                "type": "string"
              },
              "query": {
                "description": "Keywords or a short phrase, e.g. \"analytics\" or \"open-source uptime monitor\" (case-insensitive). Listings matching every word rank first, then those matching some.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3a9862623ce82d089ea479332696a29b0b8ce86a1e4a7840766befbb0cfb2c3"
        }
      ],
      "digest": "sha256:8d03b3779102ed7be1198524ec6e1bd031d061c3e622f09baa72cd5719fe453c"
    }
  }
