{
  "lockfileVersion": 2,
  "subjects": {
    "box.how/howtoolbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://how.box/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "HowToolbox",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Run read-only calculations (results are in structuredContent and as JSON text), including cached reference rates. Call a known tool directly by its agent-tools.json name with its input as arguments, or discover utilities and run them with catalog_run_tool. Give the person the returned answer url to check or change the answer.",
      "tools": [
        {
          "name": "catalog_describe_tool",
          "title": "Describe a tool",
          "description": "Returns one utility tool's description and JSON input schema, so it can be run from this page with catalog_run_tool without opening the utility.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              },
              "name": {
                "description": "Tool name from catalog_get_utility (agentTools), e.g. \"length_convert\".",
                "maxLength": 80,
                "pattern": "^[a-z][a-z0-9_]*$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db46de09dddfdf01c240637373b82cd996154e62ab0f79bc94c16e3085a67b53"
        },
        {
          "name": "catalog_get_utility",
          "title": "Get a utility",
          "description": "Returns one utility's details: what it answers, category, tags, the countries it is specific to (none = everywhere), page URL, the WebMCP tools its page offers, its server API actions, `privacy` (`local`: what the visitor enters never leaves their browser; `server`: it is sent to the site's server to run a check, not stored), and `related`: slugs of the most relevant other utilities, closest first (alternatives if this one is not quite right, then what people often need next).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              },
              "slug": {
                "description": "Utility slug, e.g. \"mortgage\".",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:761b23572435e7104c30b08914e83c8c3c31ebcce19179125476ef2aea27bf42"
        },
        {
          "name": "catalog_list_facets",
          "title": "List categories and tags",
          "description": "Lists every filter of the catalog search with counts: categories (home and also-in), tags, and countries a utility is specific to. Each item has its id (category and tag ids, ISO 3166-1 alpha-2 country codes), its name in the page language and its number of utilities; `everywhere` counts utilities that are not specific to any country. Use the ids with catalog_search_utilities.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b172ee32b29ce563dcf7c78148bb7a48ffd511e8c80d3a25511789e58507d34"
        },
        {
          "name": "catalog_run_tool",
          "title": "Run a tool",
          "description": "Runs any utility tool from this page, without opening the utility: `name` from catalog_get_utility, `input` matching the schema from catalog_describe_tool. Returns the tool's own result (locale-neutral data) or a structured error; for a tool with a deep link, the result includes `url`, a link to the answer on the tool page in this language, to give the person. Read-only; the call is shown on the page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "input": {
                "description": "The tool's input object.",
                "properties": {},
                "required": [],
                "type": "object"
              },
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              },
              "name": {
                "description": "Tool name from catalog_get_utility (agentTools), e.g. \"length_convert\".",
                "maxLength": 80,
                "pattern": "^[a-z][a-z0-9_]*$",
                "type": "string"
              }
            },
            "required": ["input", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bed686d96e769594871a18db8b57d11b26d2df52e42c137fbf8284de956b333"
        },
        {
          "name": "catalog_search_utilities",
          "title": "Search utilities",
          "description": "Searches the utility catalog (calculators, converters, checks) by free text in any supported language, optionally within one category, with one tag and/or for one country. Returns up to `limit` matches with slug, title, tagline, category, tag ids, country codes (empty = applies everywhere) and page URL. Ids for the filters come from catalog_list_facets; use catalog_get_utility for details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category id from catalog_list_facets.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, case-insensitive (e.g. \"FI\"): keeps utilities specific to that country plus those that apply everywhere.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for, e.g. \"mortgage\" or \"miles to km\". Empty lists everything.",
                "maxLength": 200,
                "type": "string"
              },
              "tag": {
                "description": "Tag id from catalog_list_facets, e.g. \"loans\".",
                "enum": ["calculator", "converter", "checker", "generator", "reference", "practice", "loans", "interest", "savings", "housing", "tax", "salary", "costs", "currency", "length", "distance", "area", "volume", "weight", "temperature", "speed", "pressure", "energy", "metric", "imperial", "sound", "frequency", "weather", "fitness", "color", "encoding", "network", "geometry", "statistics", "flight"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6dbc86c663de924af4c5562f2f2f686b6f1d20315bc386b42dab441e5a94519b"
        },
        {
          "name": "feedback_send",
          "title": "Send feedback",
          "description": "Sends anonymous feedback to the people who run HowToolbox. Use it only when the person asks you to, or when a HowToolbox tool clearly failed or gave a wrong answer. In `message`, describe the tool, the input, the expected result and the actual result. Never include personal data (names, email addresses, phone numbers, street addresses, account or payment details). Nothing identifying is stored and there is no reply. Returns { ok: true } when received; error code rate_limited when the daily limit is reached.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "bug: a tool failed or gave a wrong answer; idea: a missing tool or feature; other: anything else.",
                "enum": ["bug", "idea", "other"],
                "type": "string"
              },
              "locale": {
                "enum": ["en", "fi", "de", "es", "fr", "sv", "it", "et"],
                "type": "string"
              },
              "message": {
                "description": "What happened, in a few sentences: the tool, the input used, the expected result and the actual result. No personal data.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "module": {
                "description": "Slug of the utility it is about, e.g. \"mortgage\" (from catalog_search_utilities).",
                "pattern": "^[a-z0-9-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8fe92ba42287f11ad581bd336f3b27d6781d995309bf83fba233b3736f017c6a"
        }
      ],
      "digest": "sha256:68acb01242921a8bed47c12b4babe17bac9289fd7725d6c0e4b5e61d1d5c7f3f"
    }
  }
}
