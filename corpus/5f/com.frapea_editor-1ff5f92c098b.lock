        },
        {
          "name": "create_motion_composition",
          "title": "Create motion composition",
          "description": "Creates a MOTION COMPOSITION — an animated graphic (infographic, title, promo end-card, chart…) written as a React TSX component. Read the 'motion' skill (read_skill {topic:'motion'}) for the exact API surface, available fonts/icons and golden examples before writing one. files maps file names to TSX source; the entry must `export default` the component. schema declares the editable props (type string|number|color|boolean|select|mediaRef + default) — they become Inspector controls the user can tweak, so parameterize colors, copy and media slots. The composition is compiled and test-rendered BEFORE saving; on failure the error returns verbatim — fix the code and retry. Returns the mediaRef to place with add_clips. Creative guidance is in read_skill {topic:'motion'}. With UI-like parts (buttons, pills, progress bars, cards), write them in their own file with a partsBoard prop (default false) and look at the board first: preview:true, previewProps:{partsBoard:true} returns one large frame with the reply.",
          "inputSchema": {
            "properties": {
              "durationInFrames": {
                "description": "Length in frames (default 150).",
                "type": "number"
              },
              "entry": {
                "description": "Entry file (default composition.tsx); must export default.",
                "type": "string"
              },
              "files": {
                "description": "File name → TSX source. Relative imports between them work.",
                "type": "object"
              },
              "fps": {
                "description": "Composition fps (default 30).",
                "type": "number"
              },
              "height": {
                "description": "Composition height px (default 1080).",
                "type": "number"
              },
              "name": {
                "description": "Display name, e.g. 'Pink promo end card'.",
                "type": "string"
              },
              "preview": {
                "description": "Return one large frame (≤1560 px) with the reply. Media is not loaded in a preview: media slots draw empty and the reply says how many.",
                "type": "boolean"
              },
              "previewFrame": {
                "description": "Frame to preview (default 0).",
                "type": "number"
              },
              "previewProps": {
                "description": "Merged over the schema defaults for the preview picture only, e.g. {partsBoard:true}. Nothing saved changes.",
                "type": "object"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "schema": {
                "description": "Editable props: {key: {type, default, label?, min?, max?, options?, multiline?}}. type mediaRef makes a media-pool slot.",
                "type": "object"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              },
              "width": {
                "description": "Composition width px (default 1920).",
                "type": "number"
              }
            },
            "required": ["files", "name", "projectId", "token"],
            "type": "object"
          },
