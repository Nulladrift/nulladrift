        {
          "name": "cut_to_angle",
          "title": "Cut to camera angle",
          "description": "MULTICAM angle switch. The angles are ordinary video tracks stacked over each other (sync them beforehand — clips of the same take on V1..Vn); this razors the whole angle stack at `atFrame` and keeps only `chosenTrackId` live from there to the next cut — the other angles' clips are DISABLED, not deleted, so every switch stays re-decidable (cut again with a different angle to change your mind). Linked audio follows the video by default (audioFollowsVideo: false keeps audio untouched — the usual choice when one good mic carries the sound). angleTrackIds defaults to every video track with a clip under the frame. Refused when the chosen track has no clip at the frame.",
          "inputSchema": {
            "properties": {
              "angleTrackIds": {
                "description": "Optional explicit angle set (video track ids).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "atFrame": {
                "description": "The switch point (timeline frame).",
                "type": "number"
              },
              "audioFollowsVideo": {
                "description": "Default true: linked audio toggles with its angle.",
                "type": "boolean"
              },
              "chosenTrackId": {
                "description": "The angle to show from atFrame on.",
                "type": "string"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "timelineId": {
                "description": "Target timeline.",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              }
            },
            "required": ["atFrame", "chosenTrackId", "projectId", "timelineId", "token"],
            "type": "object"
          },
