        {
          "name": "set_clip_properties",
          "title": "Set clip properties",
          "description": "Adjusts a clip. Only the provided fields change. Mix: volume (0–4, 1 = unity; volume keyframes, when the clip has any, override it), fadeInFrames / fadeOutFrames (gain or opacity ramps at the edges). Look: opacity (0–1), blend (normal | multiply | screen | overlay | darken | lighten | color-dodge | color-burn | hard-light | soft-light | difference | exclusion | add), transform, crop and speed. transform.fit picks how the picture meets the frame before scaling: contain (letterbox, default) | cover (fill + crop overflow) | fill (stretch, ignores aspect). Identity = contain fit; position is offset from centre in timeline pixels (y down), scale multiplies the fitted size, rotationDeg is clockwise about the anchor (a fraction of the cropped picture, 0.5/0.5 = centre). Crop takes fractions off each edge of the source. Retiming: `speed` (constant rate/direction) and `speedKeyframes` (source-anchored rate curve; reflows length). Shape masks: `masks` (full-list replace). `disabled` parks a clip (it stays but neither renders nor sounds — DaVinci's D). `text` restyles text clips (mediaRef 'text:'). `motion` customizes MOTION clips (mediaRef 'motion:<id>') per clip.",
          "inputSchema": {
            "properties": {
              "blend": {
                "description": "Optional blend mode (see description).",
                "type": "string"
              },
              "bypass": {
                "description": "Optional section switches, true = section OFF (its values are kept but not applied) — the inspector's per-section toggles.",
                "properties": {
                  "composite": {
                    "type": "boolean"
                  },
                  "crop": {
                    "type": "boolean"
                  },
                  "denoise": {
                    "type": "boolean"
                  },
                  "lens": {
                    "type": "boolean"
                  },
                  "masks": {
                    "type": "boolean"
                  },
                  "speed": {
                    "type": "boolean"
                  },
                  "stabilize": {
                    "type": "boolean"
                  },
                  "transform": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "clipId": {
                "description": "Clip to modify.",
                "type": "string"
              },
              "crop": {
                "description": "Optional partial crop, fractions 0–1 of the SOURCE off each edge (the inspector shows source pixels). Crop is a window: it cuts pixels away without moving or re-fitting the picture; edges may meet (the picture vanishes).",
                "properties": {
                  "bottom": {
                    "type": "number"
                  },
                  "left": {
                    "type": "number"
                  },
                  "right": {
                    "type": "number"
                  },
                  "top": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "cropRetain": {
                "description": "Optional. True = Resolve's 'Retain Image Position': the crop window stays fixed in the frame while transforms move the picture underneath it.",
                "type": "boolean"
              },
              "cropSoftness": {
                "description": "Optional crop-edge feather, fraction of the source width 0–0.5 (the inspector shows source pixels). Keyframable as 'cropSoftness'.",
                "type": "number"
              },
              "denoise": {
                "description": "AI voice denoise (dry/wet). Setting it (or enabling the section) queues the cached background render for the clip's source file.",
                "properties": {
                  "mix": {
                    "description": "Wet share 0-1 (default 0.6).",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "disabled": {
                "description": "Optional. True disables the clip (and its A/V link partners): it stays on the timeline but neither renders nor sounds. False re-enables. The multicam angle switch is built on this.",
                "type": "boolean"
              },
              "dynamicZoom": {
                "description": "Optional Ken Burns move (Resolve's Dynamic Zoom): animates the framing from `start` to `end` over the clip's WHOLE duration (retimes when the clip is trimmed). Rects: centre x/y as picture fractions (0.5/0.5 = middle) and scale (1 = whole picture, 0.5 = half → 2× zoom). Setting framing or ease switches it on.",
                "properties": {
                  "ease": {
                    "description": "linear | ease-in | ease-out | ease-in-out",
                    "type": "string"
                  },
                  "enabled": {
                    "type": "boolean"
                  },
                  "end": {
                    "properties": {
                      "scale": {
                        "type": "number"
                      },
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "start": {
                    "properties": {
                      "scale": {
                        "type": "number"
                      },
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "fadeInFrames": {
                "description": "Optional fade-in length in frames.",
                "type": "number"
              },
              "fadeOutFrames": {
                "description": "Optional fade-out length in frames.",
                "type": "number"
              },
              "lensDistortion": {
                "description": "Optional Lens Correction Distortion, -1–1. Positive straightens wide-angle barrel distortion, negative adds it. 0 = none.",
                "type": "number"
              },
              "masks": {
                "description": "Optional shape masks, FULL-LIST replace (empty array removes all). Masks UNION (Resolve's additive Power Windows); `invert` flips one mask's coverage. Geometry in fractions of the SOURCE picture, centre 0.5/0.5 — masks ride the clip's transform. Each: {shape: rect|ellipse, center{x,y}, size{x,y}, rotationDeg, feather (fraction of source width), opacity 0–1, invert}.",
                "items": {
                  "properties": {
                    "center": {
                      "properties": {
                        "x": {
                          "type": "number"
                        },
                        "y": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "feather": {
                      "type": "number"
                    },
                    "invert": {
                      "type": "boolean"
                    },
                    "opacity": {
                      "type": "number"
                    },
                    "rotationDeg": {
                      "type": "number"
                    },
                    "shape": {
                      "description": "rect | ellipse",
                      "type": "string"
                    },
                    "size": {
                      "properties": {
                        "x": {
                          "type": "number"
                        },
                        "y": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "required": ["shape"],
                  "type": "object"
                },
                "type": "array"
              },
              "motion": {
                "description": "Optional MOTION clip customization (clips with mediaRef 'motion:<id>'). props: partial patch over the composition's schema-declared props ({key: value}; a key set to null resets it to the composition default). get_motion_composition lists the schema; per-clip values override its defaults.",
                "properties": {
                  "props": {
                    "description": "Prop values keyed by the composition schema's keys.",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "motionBlur": {
                "description": "Optional SHUTTER MOTION BLUR from the clip's own movement: each frame is the average of `samples` sub-frame renders spread over the open shutter, each at the position/scale/rotation (keyframes, dynamic zoom, tracking) the clip has at that instant — so a fast move streaks along its path and a still clip stays sharp (and costs nothing extra). {enabled: true} (or just true) turns it on — 6 samples at 180°, the film look, unless the clip already has its own; {enabled: false} (or false) turns it off; a partial setting changes only what it names. Costs one extra draw per sample on frames where the clip moves. Movement INSIDE the picture (footage, a motion composition's own animation) is not blurred — only the clip's transform. Not to be confused with the 'motionBlur' EFFECT (manage_effects): that is a fixed directional blur filter, the same on every frame; use this setting for blur that comes from the clip actually moving.",
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "samples": {
                    "description": "Sub-frame samples, integer 2–8 (default 6).",
                    "type": "number"
                  },
                  "shutterAngle": {
                    "description": "Degrees, >0–360 (default 180; 360 = open the whole frame).",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "opacity": {
                "description": "Optional static opacity 0–1.",
                "type": "number"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "solidColor": {
                "description": "Optional, solid-colour matte clips only: recolour the matte (#rrggbb). Mattes are created by add_clips/insert_clips with mediaRef 'solid:#rrggbb'.",
                "type": "string"
              },
              "speed": {
                "description": "Optional retiming (Resolve's Speed Change). rate 1 = 100 % (0.01–50); direction forward | reverse | freeze; freezeFrame = held source frame (offset from trim-in) while frozen; pitchCorrection keeps the audio's pitch. Keyframes stay glued to the pictures (they are source-anchored). Combine with speedRipple: true to rescale the clip so the same source range plays at the new rate and shift everything downstream.",
                "properties": {
                  "direction": {
                    "description": "forward | reverse | freeze",
                    "type": "string"
                  },
                  "freezeFrame": {
                    "type": "number"
                  },
                  "pitchCorrection": {
                    "type": "boolean"
                  },
                  "rate": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "speedKeyframes": {
                "description": "Optional source-anchored speed keyframes (forward-direction clips only): [{atSourceFrame, rate}], rate 1 = 100 %. Rate is CONSTANT between points (held outside). Present, it replaces `speed.rate` AND REFLOWS the clip's timeline length to keep the same source window (slower ⇒ longer); the A/V link group retimes together. EMPTY array clears the curve (back to the constant rate).",
                "items": {
                  "properties": {
                    "atSourceFrame": {
                      "type": "number"
                    },
                    "rate": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "speedRipple": {
                "description": "Ripple Timeline for this speed edit (see `speed`).",
                "type": "boolean"
              },
              "stabilization": {
                "description": "Optional stabilization knobs (Resolve's Stabilization). The expensive motion tracking is a per-media analysis — run it with the stabilizer; these values post-process its cached path instantly. mode perspective | similarity | translation; cameraLock kills ALL motion (ignores ratio/smooth); zoom scales up to hide blanking; croppingRatio 0.25–1 (1 allows no correction); smooth 0.25–1; strength -1–1 (negative inverts).",
                "properties": {
                  "cameraLock": {
                    "type": "boolean"
                  },
                  "croppingRatio": {
                    "type": "number"
                  },
                  "mode": {
                    "description": "perspective | similarity | translation",
                    "type": "string"
                  },
                  "smooth": {
                    "type": "number"
                  },
                  "strength": {
                    "type": "number"
                  },
                  "zoom": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "Optional TEXT clip restyle (clips with mediaRef 'text:'; create them with add_clips). Partial patch: content (\n breaks lines), fontFamily (Inter | DM Sans | Space Grotesk | Bebas Neue | Playfair Display | Caveat), sizeFraction (of frame height), bold, italic, color (#rrggbb), align (left|center|right), outlineColor (#rrggbb or null), outlineWidth, backgroundFill (#rrggbb[aa] or null), box {x,y,w,h in frame fractions, centre-based}, animation. wholeCaptionGroup: true restyles every caption sharing the clip's caption group in one edit (content stays per-clip).",
                "properties": {
                  "align": {
                    "type": "string"
                  },
                  "animation": {
                    "description": "Text animation. type: none | fadeIn | popIn | slideUp | typewriter | wordReveal | wordSlide | wordPop | wordCycle | highlightPop | highlightBlock. Word-timed styles (word*/highlight*) follow caption word timings when present, else perWordFrames. Partial patch — {type} alone keeps the other values.",
                    "properties": {
                      "highlightColor": {
                        "description": "#rrggbb the highlight styles paint the active word with.",
                        "type": "string"
                      },
                      "perWordFrames": {
                        "description": "Frames each word takes to enter (word-timed styles).",
                        "type": "number"
                      },
                      "type": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "backgroundFill": {
                    "description": "#rrggbb[aa]; empty string = no fill.",
                    "type": "string"
                  },
                  "bold": {
                    "type": "boolean"
                  },
                  "box": {
                    "properties": {
                      "h": {
                        "type": "number"
                      },
                      "w": {
                        "type": "number"
                      },
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "color": {
                    "type": "string"
                  },
                  "content": {
                    "type": "string"
                  },
                  "fontFamily": {
                    "type": "string"
                  },
                  "italic": {
                    "type": "boolean"
                  },
                  "outlineColor": {
                    "description": "#rrggbb; empty string = no outline.",
                    "type": "string"
                  },
                  "outlineWidth": {
                    "type": "number"
                  },
                  "sizeFraction": {
                    "type": "number"
                  },
                  "wholeCaptionGroup": {
                    "description": "Restyle the clip's whole caption group, not just this clip.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "timelineId": {
                "description": "Timeline containing the clip.",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              },
              "transform": {
                "description": "Optional partial transform; provided keys replace, others stay.",
                "properties": {
                  "anchor": {
                    "properties": {
                      "x": {
                        "type": "number"
                      },
                      "y": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "fit": {
                    "description": "contain | cover | fill",
                    "type": "string"
                  },
