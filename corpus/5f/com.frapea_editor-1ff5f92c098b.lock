        {
          "name": "search_stock_media",
          "title": "Search Pexels stock",
          "description": "Searches the Pexels stock library (photos or videos) with the user's connected API key. Returns items with id, dimensions, duration (videos), author, thumbnail url, available video qualities, and a `downloaded` flag telling whether the asset is already in the project's media pool. If no key is connected it errors with PERMISSION_REQUIRED, whose message says where the user connects one (Library → Generators → Stock Library). Results are subject to the Pexels license; keep the author attribution when asked about provenance.\nResults match the uploader's keywords, not the picture — a search for 'earth from space' also returns the Moon and artists' renders; `thumbnail` shows the actual subject. See read_skill {topic:'verify'}.",
