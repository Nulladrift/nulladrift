      "capabilities": {
        "tools": {}
      },
      "instructions": "Frapea is a video editor that runs in the user's browser; their source files never leave their machine — only what tools return (frames, transcripts, timeline data) reaches you. Start with connect: if Frapea is already open, ask them for the pairing code (the Connect MCP button); if not, call connect with no arguments and send them the link it gives you. Then pass the token on every call. read_skill with no topic returns the editing workflow and lists the guides (read_skill {topic:'core'} for cutting, {topic:'motion'} for motion compositions). Media itself never travels over this connection: frames come from inspect_timeline, not files. get_projects also reports which stock and voice providers have keys in this browser; `providersAdvice`, when present, is a note meant for the user. Links that tools return (a pairing link, where to get an API key) are meant for the user: show them as clickable links — markdown where it renders, the bare URL in a terminal.",
      "tools": [
        {
          "name": "add_clips",
          "title": "Add clips",
          "description": "Places media segments on a timeline. Each clip: mediaRef (from get_media, 'timeline:<id>' to NEST another timeline as a clip, 'solid:#rrggbb' , 'motion:<id>' for a MOTION composition (create_motion_composition) for a generated solid-colour matte, 'adjustment:' for an adjustment clip — no picture of its own, its effects/masks/opacity grade everything below it — or 'text:' for a title, restyled via set_clip_properties' `text`), atFrame (timeline position), sourceInSec/sourceOutSec (the segment of the source to use — align these with transcript words or sceneSamples), and optional trackId (from get_timeline) to target a specific same-kind track — without it clips land on V1/A1 with overwrite semantics. A spare empty track always exists above the highest used one, so V2/A2 is available before anything sits on it. Video sources with audio get a linked audio clip automatically (on the matching A track: V2 ⇒ A2). Returns the created clip ids in order. Frames are in the target timeline's fps.",
          "inputSchema": {
            "properties": {
              "clips": {
                "description": "[{mediaRef, atFrame, sourceInSec, sourceOutSec, trackId?}] — segments in playback order; trackId targets a specific track (default V1/A1).",
                "type": "array"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "timelineId": {
                "description": "Target timeline id from get_timeline.",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              }
            },
            "required": ["clips", "projectId", "timelineId", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
