        {
          "name": "apply_layout",
          "title": "Apply layout",
          "description": "Arranges clips into a screen layout by writing ordinary transform + crop values (first clipId → first cell). layout: full | side-by-side | top-bottom | pip-top-left | pip-top-right | pip-bottom-left | pip-bottom-right | grid-2x2 | main-sidebar | three-up. mode 'fit' letterboxes each source in its cell, 'cover' fills the cell and crops the overflow (bias 0–1 picks the surviving part; 0.5/0.5 = centre). Replaces the clips' geometry animation. The clips should overlap in time on different tracks — a layout of clips that never share a frame arranges nothing visible.",
          "inputSchema": {
            "properties": {
              "bias": {
                "description": "Cover-crop bias 0–1 per axis (default 0.5/0.5).",
                "properties": {
                  "x": {
                    "type": "number"
                  },
                  "y": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "clipIds": {
                "description": "Clips to arrange, in cell order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "layout": {
                "description": "Layout id (see description).",
                "type": "string"
              },
              "mode": {
                "description": "fit | cover (default fit).",
                "type": "string"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "timelineId": {
                "description": "Timeline containing the clips.",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              }
            },
            "required": ["clipIds", "layout", "projectId", "timelineId", "token"],
            "type": "object"
