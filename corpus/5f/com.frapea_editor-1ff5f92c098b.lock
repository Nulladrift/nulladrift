        {
          "name": "organize_pool",
          "title": "Organize media bins",
          "description": "THE MEDIA POOL'S SHAPE — bins (the pool's folders) and what sits in them. Use it to tidy a project: group the footage, the voice-over, the music and the graphics instead of leaving eighty files at the root.\nBins are VIRTUAL and live in the project, not on disk. Moving an item between bins NEVER touches the file or its mediaRef, so it cannot break a clip's link or make the app ask the user to relocate anything — organise freely.\nactions: 'list' returns the bin tree and every item with the bin it shows in (call it first — you need the ids). 'create_bin' {name, parentBinId?}. 'rename_bin' {binId, name}. 'move_bin' {binId, toBinId} nests one bin inside another. 'delete_bin' {binId} — its children and items reparent, nothing is lost, no file is deleted. 'move_items' {itemKeys[], toBinId} moves files, timelines and motion compositions alike.\nItem keys: a media file's mediaRef, 'timeline:<id>', 'motion:<id>'. The Library root is the empty-string bin id.\nBins that MIRROR a real folder (mirrorsFolder: true) can be RENAMED — a mirror is matched by the folder it tracks, not by its name — but they cannot be moved or deleted, because their place in the tree follows the folder. Move the items out instead, or make your own bins alongside.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "list | create_bin | rename_bin | move_bin | delete_bin | move_items",
                "type": "string"
              },
              "binId": {
                "description": "Target bin (rename/move/delete).",
                "type": "string"
              },
              "itemKeys": {
                "description": "move_items: mediaRefs / 'timeline:<id>' / 'motion:<id>' to move together.",
                "type": "array"
              },
              "name": {
                "description": "Bin name (create_bin, rename_bin).",
                "type": "string"
              },
              "parentBinId": {
                "description": "Parent for create_bin. Omit or '' = Library root.",
                "type": "string"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "toBinId": {
                "description": "Destination bin for move_bin / move_items. Omit or '' = Library root.",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              }
            },
            "required": ["action", "projectId", "token"],
            "type": "object"
          },
