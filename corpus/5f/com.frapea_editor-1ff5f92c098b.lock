          "description": "Searches the Freesound library (SFX, ambience, foley) with the user's connected API key. Every item carries what you need to JUDGE the sound without hearing it: the uploader's full description, tags, duration, community rating and download count, format/samplerate, and — when analyzed — AudioCommons descriptors (acAnalysis: ac_loudness LUFS, ac_dynamic_range, ac_tempo, ac_tonality, ac_single_event, plus 0-100 timbre scales like ac_brightness, ac_warmth, ac_hardness, ac_depth, ac_roughness, ac_boominess, ac_sharpness, ac_reverb). A `downloaded` flag says the sound is already in the pool. Licenses: CC0 needs nothing, BY needs attribution, BY-NC excludes commercial use — prefer cc0/by via the license arg when the project may be commercial. If no key is connected it errors with PERMISSION_REQUIRED, whose message says where the user connects one (Library → Generators → Sound Library).",
          "inputSchema": {
            "properties": {
              "license": {
                "description": "Optional: cc0 | by | by-nc",
                "type": "string"
              },
              "maxDurationSeconds": {
                "description": "Optional upper duration bound.",
                "type": "number"
              },
              "minDurationSeconds": {
                "description": "Optional lower duration bound.",
                "type": "number"
              },
              "page": {
                "description": "1-based page, 40 items per page.",
                "type": "number"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "query": {
                "description": "Search phrase (e.g. 'door slam', 'jungle ambience').",
                "type": "string"
              },
              "sort": {
                "description": "Optional: score (default) | rating_desc | downloads_desc | created_desc",
                "type": "string"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              }
            },
            "required": ["projectId", "query", "token"],
            "type": "object"
          },
          "annotations": {
