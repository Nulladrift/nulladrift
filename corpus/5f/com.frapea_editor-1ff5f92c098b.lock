        {
          "name": "bind_face",
          "title": "Bind clip to a face",
          "description": "Makes a clip FOLLOW a tracked face — the way to stick a mask, label or blur onto somebody's head. Movement is relative to where the face was first seen, so the clip keeps the framing it already had and only inherits the motion. Pick what to copy with channels, and what happens while the face is missing with gap. Pass trackId: null to unbind.",
          "inputSchema": {
            "properties": {
              "channels": {
                "description": "What to copy: {position, scale, pitch, yaw, roll} booleans. Default position and scale on, the three rotations off.",
                "type": "object"
              },
              "clipId": {
                "description": "The clip that should follow the face.",
                "type": "string"
              },
              "faceId": {
                "description": "Which person in that run.",
                "type": "string"
              },
              "gap": {
                "description": "While the face is missing: 'hold' stays put then jumps, 'hide' disappears, 'glide' travels smoothly to where it reappears. One of: hold | hide | glide.",
                "type": "string"
              },
              "maxGlideSeconds": {
                "description": "Longest gap 'glide' will cross before hiding instead (default 1.8).",
                "type": "number"
              },
              "projectId": {
                "description": "Project id from get_projects.",
                "type": "string"
              },
              "smooth": {
                "description": "Jitter filtering 0–1 (default 0.25).",
                "type": "number"
              },
              "token": {
                "description": "The session token `connect` returned. Pass it on every call — it says which browser to drive.",
                "type": "string"
              },
              "trackId": {
                "description": "The run; null unbinds this clip.",
                "type": "string"
              }
            },
            "required": ["clipId", "projectId", "token"],
            "type": "object"
