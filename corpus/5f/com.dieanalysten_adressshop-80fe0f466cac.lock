      "serverInfo": {
        "name": "dieanalysten-adressshop-kunden",
        "title": "dieAnalysten Adressshop",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Adressshop der dieAnalysten GmbH – Firmenadressen in Deutschland, Zugang für ein Kundenkonto.\nLanguage: German and English; answer in the user's language. Public tools need no login, orders need the customer account.\nAblauf: Branche mit branchen_suchen finden → zielgruppe_zaehlen → preis_berechnen → nach ausdrücklicher Zustimmung des Kunden bestellung_anlegen.\nOhne Anmeldung sind Branchensuche, Zählen und Preisberechnung möglich; Bestellungen abrufen und bestellen erfordern die Anmeldung mit dem Kundenkonto.\nBestellen ist verbindlich: nur mit Zustimmung, AGB-Bestätigung und Nutzungsbestätigung. Preise in Euro. Antworten auf Deutsch.",
      "tools": [
        {
          "name": "bestellung_anlegen",
          "title": "Bestellung anlegen / Place order",
          "description": "Legt eine verbindliche Bestellung an. Erfordert die Anmeldung mit dem Kundenkonto und die ausdrückliche Zustimmung des Kunden zu Zielgruppe, Anzahl, Preis, Zahlart und AGB sowie die Bestätigung der rechtmäßigen Datennutzung (Parameter bestaetigt, agb, rechtmaessig = true). Ergebnis: Bestellnummer und ggf. Zahlungslink. (erfordert die Anmeldung mit dem Kundenkonto) / Places a binding order. Requires login with the customer account and the customer’s explicit consent to the order and the terms (AGB), plus confirmation of lawful use of the data.",
          "inputSchema": {
            "properties": {
              "agb": {
                "description": "true nur, wenn der Kunde die AGB bestätigt hat",
                "type": "boolean"
              },
              "auswahl": {
                "description": "Zielgruppe. Alle Angaben optional und UND-verknüpft (Regionen untereinander ODER). Werte für „merkmale“ liefert das Tool „kriterien“, Branchen das Tool „branchen_suchen“.",
                "properties": {
                  "branchen": {
                    "description": "Branchen oder ganze Branchengruppen, z. B. [\"Steuerberater\", \"Tischler\"]. Genaue Bezeichnung aus branchen_suchen; eindeutige Kurzbezeichnungen werden automatisch aufgelöst.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "branchen_ohne": {
                    "description": "Branchen, die NICHT enthalten sein sollen",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "bundeslaender": {
                    "description": "z. B. [\"Bayern\", \"Nordrhein-Westfalen\"]",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "firmenname": {
                    "description": "Teil des Firmennamens",
                    "items": {
                      "type": "string"
                    },
                    "type": ["string", "array"]
                  },
                  "kreise": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "merkmale": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "Merkmal-Schlüssel → Liste von Werten (einer genügt), z. B. {\"webmodern\":[\"hoch\"],\"cms\":[\"WordPress\"],\"mitarbeiterklasse\":[\"5–9\"]}",
                    "type": "object"
                  },
                  "nicht_handy_optimiert": {
                    "description": "nur Websites, die nicht für Handys gebaut sind",
                    "type": "boolean"
                  },
                  "nur_mit": {
                    "description": "nur Firmen mit diesen Daten (entscheider = namentlicher Ansprechpartner)",
                    "items": {
                      "enum": ["telefon", "email", "website", "entscheider"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "ohne": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "wie merkmale, aber ausschließen",
                    "type": "object"
                  },
                  "ohne_https": {
                    "description": "nur Websites ohne HTTPS",
                    "type": "boolean"
                  },
                  "orte": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "plz": {
                    "description": "PLZ-Bereiche als Text „80-85, 90, 01067“ oder Liste von PLZ/Präfixen",
                    "items": {
                      "type": "string"
                    },
                    "type": ["string", "array"]
                  },
                  "umkreis": {
                    "description": "Umkreis um eine PLZ oder Koordinate",
                    "properties": {
                      "km": {
                        "type": "integer"
                      },
                      "lat": {
                        "type": "number"
                      },
                      "lon": {
                        "type": "number"
                      },
                      "plz": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "veraltete_software": {
                    "description": "nur Websites mit sehr alter WordPress-/jQuery-Version",
                    "type": "boolean"
                  },
                  "website_alter_min": {
                    "description": "Website mindestens so viele Jahre nicht aktualisiert (laut ©-Jahr)",
                    "type": "integer"
                  },
                  "website_jahr_ab": {
                    "description": "Copyright-Jahr der Website mindestens …",
                    "type": "integer"
                  },
                  "website_jahr_bis": {
                    "description": "Copyright-Jahr der Website höchstens … (z. B. 2018 = seit 2018 nicht aktualisiert)",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "bestaetigt": {
                "description": "true = der Kunde hat ausdrücklich zugestimmt",
                "type": "boolean"
              },
              "gutschein": {
                "description": "Gutscheincode, falls vorhanden",
                "type": "string"
              },
              "kunde": {
                "description": "optionale Rechnungsadresse: firma, name, strasse, plz, ort, land, telefon, uid",
                "type": "object"
              },
              "limit": {
                "description": "nur so viele Firmen (Standard: alle passenden)",
                "type": "integer"
              },
              "optionen": {
                "description": "Zusatzangaben wie im Shop (z. B. Telefon, E-Mail, Ansprechpartner)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rechtmaessig": {
                "description": "true nur, wenn der Kunde bestätigt hat, die Daten rechtmäßig zu nutzen",
                "type": "boolean"
              },
              "verwendungszweck": {
                "description": "wofür die Adressen genutzt werden, z. B. Neukundenakquise per Brief",
                "type": "string"
              },
              "zahlart": {
                "enum": ["stripe", "vorkasse", "rechnung", "raten"],
                "type": "string"
              }
            },
            "required": ["agb", "auswahl", "bestaetigt", "rechtmaessig", "verwendungszweck"],
            "type": "object"
          },
