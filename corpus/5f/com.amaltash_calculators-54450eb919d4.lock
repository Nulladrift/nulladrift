        {
          "name": "safe_spending",
          "title": "Retirement Withdrawal Calculator",
          "description": "Retirement withdrawal calculator with an interactive chart. Finds the highest monthly spending that lasted in at least a chosen share of real US market history since 1928. Use it when the spending amount is the unknown, for retirement income questions, and to check the 4% rule.",
