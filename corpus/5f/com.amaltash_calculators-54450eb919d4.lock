            "additionalProperties": false,
            "properties": {
              "calculator": {
                "description": "The tool whose card it was.",
                "pattern": "^[a-z][a-z0-9_]{0,63}$",
                "type": "string"
              },
              "control": {
                "description": "Which card control was clicked.",
                "enum": ["expand", "change_stock", "how_it_works"],
