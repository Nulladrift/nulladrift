              },
              "retire_age": {
                "description": "Age when saving stops and spending starts. It cannot be below age.",
                "maximum": 110,
                "minimum": 18,
                "type": "integer"
              },
              "save_monthly": {
                "description": "Dollars added each month until retirement.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "savings": {
                "description": "Money saved so far, in US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "share": {
                "description": "Share of past periods the money must last in, from 0.5 to 1.",
                "maximum": 1,
                "minimum": 0.5,
