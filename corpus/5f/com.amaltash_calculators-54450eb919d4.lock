        },
        {
          "name": "calculate_rmd",
          "title": "Required Minimum Distribution (RMD) Calculator",
          "description": "Required Minimum Distribution (RMD) Calculator with a chart, the same math as the web page. What is your 2026 RMD? Enter your age and your balance. See the least you must take out this year. It divides your balance at the end of last year by the IRS life-expectancy number for your age. It is not tax advice. Ask a tax professional about your own case. People ask for it as \"required minimum distribution calculator\", \"rmd calculator\" or \"how do i calculate my rmd\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acct": {
                "description": "Type of account. Default: ira.",
                "enum": ["ira", "plan"],
                "type": "string"
              },
              "age": {
                "description": "Your age at the end of 2026. In years. Default: 75.",
                "maximum": 9007199254740991,
                "minimum": 18,
                "type": "integer"
              },
              "balance": {
                "description": "Money in the account on Dec 31, 2025. US dollars. It is on your year-end statement. Default: 500000.",
                "minimum": 0,
                "type": "number"
              },
              "grow": {
                "description": "Growth each year, to see future RMDs. A percent: 5 means 5%. Your own guess. Blank shows the IRS share by age. Empty if left out.",
                "type": "number"
              },
              "spouse": {
                "description": "Is your spouse your only heir and over 10 years younger?. \"Yes\" asks for their age and uses the IRS joint table. Default: no.",
                "enum": ["no", "yes"],
                "type": "string"
              },
              "spouseAge": {
                "description": "Your spouse's age at the end of 2026. In years. Default: 60.",
                "maximum": 9007199254740991,
                "minimum": 18,
                "type": "integer"
              },
              "working": {
                "description": "Do you still work for this 401(k)'s company?. Some plans let you wait until you retire. Default: no.",
                "enum": ["no", "yes"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Required Minimum Distribution (RMD) Calculator"
          },
          "behavior": {
