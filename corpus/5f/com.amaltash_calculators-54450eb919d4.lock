        {
          "name": "net_worth_check",
          "title": "Net Worth Calculator",
          "description": "Net worth calculator with an interactive chart. Subtracts debts from assets and, when an age is given, shows the median net worth for that age group from a US government survey. Use it for a net worth total or a net worth by age comparison.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age in whole years, from 18 to 110, to compare with others that age.",
                "maximum": 110,
                "minimum": 18,
                "type": "integer"
              },
              "assets": {
                "description": "Total value of everything owned, in US dollars.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "debts": {
                "description": "Total of everything owed, as a positive number of US dollars.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["assets", "debts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Net Worth Calculator"
