                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "cadence": {
                "description": "How often the money goes in: day, week, month, year, or once.",
                "enum": ["day", "week", "month", "year", "once"],
                "type": "string"
              },
              "from_year": {
                "description": "First year, from 1928 to 2025.",
                "maximum": 2025,
                "minimum": 1928,
                "type": "integer"
              },
              "to_year": {
                "description": "Last year, included, from 1928 to 2025. Cannot be before from_year.",
                "maximum": 2025,
                "minimum": 1928,
                "type": "integer"
              }
            },
            "required": ["amount", "cadence", "from_year", "to_year"],
            "type": "object"
