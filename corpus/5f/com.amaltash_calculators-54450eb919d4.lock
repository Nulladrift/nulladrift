            },
            "ui/resourceUri": "ui://amaltash/calculator-card"
          },
          "digest": "sha256:d54f5eead0248ced4b1ef5dc2b583fbb37a54ad0e272895d27289dc4dd0a773e"
        },
        {
          "name": "position_size",
          "title": "Position Size Calculator",
          "description": "Position size calculator with an interactive chart. Works out the dollar size of one position at a percent cap the person chooses, how many positions of that size fit, and the amount at risk. It does not pick investments or judge whether a size is suitable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_position_pct": {
                "description": "The cap per position or theme, in percent of the portfolio, the person chose.",
                "maximum": 100,
                "minimum": 0.01,
                "type": "number"
              },
              "portfolio_value": {
                "description": "Total portfolio value in US dollars.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "stop_distance_pct": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional stop distance below entry, in percent. Leave null if there is none."
              }
            },
            "required": ["max_position_pct", "portfolio_value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Position Size Calculator"
