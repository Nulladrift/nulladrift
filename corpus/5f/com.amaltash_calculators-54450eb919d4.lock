        },
        {
          "name": "calculate_apy",
          "title": "APY Calculator",
          "description": "APY Calculator with a chart, the same math as the web page. What is my APY? APY is what a rate really pays in a year. It counts interest earned on interest. It turns a rate into its APY by counting interest on interest as often as you pick. It also shows a year of interest. It does not look up the rates banks pay today. People ask for it as \"apy calculator\", \"how is apy calculated\" or \"how do i calculate apy\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fed": {
                "description": "Your federal tax rate. Shows what you keep after tax. Default: 0.",
                "enum": ["0", "10", "12", "22", "24", "32", "35", "37"],
                "type": "string"
              },
              "money": {
                "description": "Money you put in. US dollars. Optional. Shows one year of interest. Default: 10000.",
                "minimum": 0,
                "type": "number"
              },
              "n": {
                "description": "How often interest is added. Default: 365.",
                "enum": ["1", "4", "12", "365"],
                "type": "string"
              },
              "rate": {
                "description": "Interest rate each year. A percent: 5 means 5%. The rate before interest on interest. Your bank lists it. Default: 4.",
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Your state tax rate. A percent: 5 means 5%. Empty if left out.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
