        },
        {
          "name": "drawdown_recovery",
          "title": "Loss Recovery Calculator",
          "description": "Drawdown and loss recovery calculator with an interactive chart. Works out the percentage gain needed to get back to even after a loss, and how many years that takes at a yearly return the person enters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_return_pct": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional yearly return, in percent, used to estimate years to recover. Leave null to skip the estimate."
              },
              "loss_pct": {
                "description": "The loss, in percent, from 0 up to but not including 100.",
                "exclusiveMaximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["loss_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loss Recovery Calculator"
          },
