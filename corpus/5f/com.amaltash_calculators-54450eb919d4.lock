        {
          "name": "project_dividend_income",
          "title": "Dividend Calculator",
          "description": "Dividend Calculator with a chart, the same math as the web page. How much do my shares pay in dividends? A dividend is cash a company pays the people who own its shares. The yield is how much it pays each year, as a share of the price. It starts at 4%, a made-up example. It multiplies your money by the yield you type, year by year. Dividends can be reinvested or taken as cash. It does not know what any company will pay. Dividends can be cut. People ask for it as \"dividend calculator\", \"how to calculate dividends\" or \"how much to live off dividends\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "add": {
                "description": "Money you add each month. US dollars. Default: 0.",
                "type": "number"
              },
              "amount": {
                "description": "Money in it now. US dollars. Default: 20000.",
                "type": "number"
              },
              "growth": {
                "description": "Dividend growth each year. A percent: 5 means 5%. How much the dividend rises each year. Default: 0.",
                "type": "number"
              },
              "payout": {
                "description": "What each dividend does. Default: reinvest.",
                "enum": ["reinvest", "cash"],
                "type": "string"
              },
              "perYear": {
                "description": "How often it pays. Default: 4.",
                "enum": ["1", "2", "4", "12"],
                "type": "string"
              },
              "priceGrowth": {
                "description": "Share price growth each year. A percent: 5 means 5%. 0% keeps the price flat. Default: 0.",
                "type": "number"
              },
              "tax": {
                "description": "Tax on dividends. A percent: 5 means 5%. The share of each dividend paid in tax. Default: 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Years. In years. Default: 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "yield": {
                "description": "Dividend yield. A percent: 5 means 5%. Yearly dividend ÷ share price. Default: 4.",
                "type": "number"
              }
            },
            "type": "object"
          },
