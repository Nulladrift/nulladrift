        {
          "name": "tbill_ladder",
          "title": "T-Bill Ladder Calculator",
          "description": "Treasury bill ladder calculator with an interactive timeline chart. Lays out how much goes in each same-term bill, how far apart to buy them, and the first and last dates. Shows simple interest only if a rate is given.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Total dollars to split across the bills, from 0 to 1,000,000,000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "rate_pct": {
                "anyOf": [
                  {
                    "maximum": 25,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "An annual interest rate the person chooses, in percent, from 0 to 25. Leave out to skip interest."
              },
              "rungs": {
                "description": "How many bills to stagger, a whole number no larger than the term in weeks (13 at most for 52-week bills).",
                "maximum": 26,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "allOf": [
                  {
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "pattern": "^20\\d{2}-",
                    "type": "string"
                  }
                ],
                "description": "The first purchase date, as YYYY-MM-DD.",
                "type": "string"
              },
              "term_weeks": {
                "anyOf": [
                  {
                    "const": 4,
                    "type": "number"
                  },
                  {
                    "const": 8,
                    "type": "number"
                  },
                  {
                    "const": 13,
                    "type": "number"
                  },
                  {
                    "const": 17,
                    "type": "number"
                  },
                  {
                    "const": 26,
                    "type": "number"
                  },
                  {
                    "const": 52,
                    "type": "number"
                  }
                ],
                "description": "Length of each bill in weeks: 4, 8, 13, 17, 26 or 52."
              }
            },
            "required": ["amount", "rungs", "start_date", "term_weeks"],
            "type": "object"
          },
