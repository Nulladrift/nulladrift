          "name": "list_assets",
          "title": "List investments and how each can be used",
          "description": "Lists the long-run market rates, which can be used for future plans, and common stocks and funds, which can only be used to look at the past. Stock questions work for any US stock or fund we hold history for, past only. Use it to find a valid long-run rate id.",
