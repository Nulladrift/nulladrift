        {
          "name": "find_coast_fire_number",
          "title": "Coast FIRE Calculator",
          "description": "Coast FIRE Calculator with a chart, the same math as the web page. When can you stop saving for retirement? Save enough early, and your money can grow on its own until you retire. That amount is your Coast number. It finds the amount that could grow to your retirement goal by your retirement age with no new deposits. It does not say what your money will earn. The growth rate is one you pick. People ask for it as \"coast fire calculator\", \"how to calculate coast fire number\" or \"when can i stop saving for retirement\".",
