                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "now": {
                "description": "Your tax rate now. A percent: 5 means 5%. Empty if left out.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Growth each year. A percent: 5 means 5%. A guess, not a promise. Default: 6.",
