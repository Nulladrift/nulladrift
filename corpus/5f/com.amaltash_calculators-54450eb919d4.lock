        {
          "name": "calculate_average_cost",
          "title": "Stock Average Calculator",
          "description": "Stock Average Calculator with a chart, the same math as the web page. What did your shares cost on average? Bought the same stock more than once? Type each buy. You get your average cost for one share. It adds up what you paid for every buy and divides by your total shares. It also shows what one more buy would do. It does not say whether to buy more. People ask for it as \"stock average calculator\", \"average down calculator\" or \"how to calculate average stock price\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "now": {
                "description": "Price per share now. US dollars. Shows your profit or loss. Default: 30.",
                "type": "number"
              },
              "p1": {
                "description": "Price per share, buy 1. US dollars. Default: 40.",
                "type": "number"
              },
              "p2": {
                "description": "Price per share, buy 2. US dollars. Default: 52.",
                "type": "number"
              },
              "p3": {
                "description": "Price per share, buy 3. US dollars. Default: 34.",
                "type": "number"
              },
              "s1": {
                "description": "Shares bought, buy 1. Default: 20.",
                "type": "number"
              },
              "s2": {
                "description": "Shares bought, buy 2. Default: 10.",
                "type": "number"
              },
              "s3": {
                "description": "Shares bought, buy 3. Default: 30.",
                "type": "number"
              },
              "target": {
                "description": "Average you want to reach. US dollars. Shares to buy at the price now. Default: 36.",
                "type": "number"
              }
            },
            "type": "object"
          },
