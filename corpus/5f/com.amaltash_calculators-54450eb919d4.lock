        {
          "name": "replay_past_investing",
          "title": "Stock Return and DCA Calculator",
          "description": "Stock return and dollar-cost averaging (DCA) calculator with an interactive chart. Shows what investing in a US stock or fund would have become, using real past prices, as regular deposits, a lump sum, or both. Use it for what-if-I-had-invested and DCA questions about a ticker such as AAPL or VOO, over the last 120 months or fewer. It covers the past only and gives no estimate of the future.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Dollars invested each time. Can be 0 if there is a starting amount.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "cadence": {
                "default": "month",
                "description": "How often the amount goes in: day, week or month. Defaults to month.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "months_back": {
                "description": "How many months before the latest data to begin, from 1 to 120.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "starting_amount": {
                "default": 0,
                "description": "Dollars invested once at the start. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "ticker": {
                "description": "A US stock or fund ticker, such as AAPL or SPY.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["amount", "months_back", "ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stock Return and DCA Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://amaltash/calculator-card"
            },
            "ui/resourceUri": "ui://amaltash/calculator-card"
          },
          "digest": "sha256:bb030525644d4d146d352894416fd802e1ae6ada74f548b427a4926356565a8e"
        },
        {
          "name": "retirement_plan",
          "title": "Retirement Calculator",
          "description": "Retirement calculator with an interactive chart of the balance by age. Replays a plan through every complete stretch of real US market history since 1928 and reports how often the money lasted. Use it when the monthly spending is known, for questions like can I retire at 60, or how long will my savings last.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age today, in whole years, from 18 to 100.",
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "end_age": {
                "description": "Age the money must last to. It must be above retire_age, and the span from age must fit in the data since 1928.",
                "maximum": 120,
                "minimum": 19,
                "type": "integer"
              },
              "other_income": {
                "description": "Monthly income in retirement from other sources, such as Social Security, in today's dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "retire_age": {
                "description": "Age when saving stops and spending starts. It cannot be below age.",
                "maximum": 110,
                "minimum": 18,
                "type": "integer"
              },
              "save_monthly": {
                "description": "Dollars added each month until retirement.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "savings": {
                "description": "Money saved so far, in US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "spend_monthly": {
                "description": "Monthly spending in retirement, in today's dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "stock": {
                "description": "Share held in stocks, from 0 to 1. The rest is in 10-year US Treasuries.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["age", "end_age", "other_income", "retire_age", "save_monthly", "savings", "spend_monthly", "stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Retirement Calculator"
          },
