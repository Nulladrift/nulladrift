        {
          "name": "sp500_since_date",
          "title": "S&P 500 Return Calculator",
          "description": "S&P 500 return calculator with an interactive chart. Shows what a set amount in the S&P 500 would have become between two years from 1928 to 2025, using real yearly returns. It also gives the amount put in after inflation and the worst year in the span. People ask for it as \"s&p 500 calculator\", \"s&p 500 investment calculator\" or \"s&p 500 return calculator\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
