        {
          "name": "estimate_capital_gains_tax",
          "title": "Capital Gains Tax Calculator",
          "description": "Capital Gains Tax Calculator with a chart, the same math as the web page. What is the tax on your gain? Enter what you paid, what you sold it for and your income. See the 2026 federal tax, long term and short term. It estimates 2026 US federal tax on one sale, long term and short term, using IRS figures. It is not tax advice. Ask a tax professional about your own return. People ask for it as \"capital gains tax calculator\", \"how much is capital gains tax\" or \"capital gains calculator\".",
