          "description": "T-Bill Calculator with a chart, the same math as the web page. What does a Treasury bill cost and pay? A Treasury bill, or T-bill, is a short loan to the US government. You pay a little less now and get the full amount back later. It prices a bill from the rate you type, using the Treasury’s discount math. It can also lay out a ladder of bills with dates. It does not buy bills or show live auction results. People ask for it as \"t bill calculator\", \"treasury bill calculator\" or \"how do treasury bills work\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Money you get back. US dollars. You pay a little less now. Default: 40000.",
                "type": "number"
              },
              "bills": {
                "description": "Number of bills. 2 or more pay you back in turns. Default: 4.",
                "maximum": 26,
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "description": "Kind of rate. Treasury results list both. Default: investment.",
                "enum": ["investment", "discount"],
                "type": "string"
              },
              "rate": {
                "description": "Interest rate each year. A percent: 5 means 5%. Use today’s rate. 3-month bills averaged 3.4%, 1928–2025. Default: 3.4.",
                "type": "number"
              },
              "term": {
                "description": "Weeks each bill lasts. Default: 13.",
                "enum": ["4", "6", "8", "13", "17", "26", "52"],
                "type": "string"
              }
            },
            "type": "object"
          },
