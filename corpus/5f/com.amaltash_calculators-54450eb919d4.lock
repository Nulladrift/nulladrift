        {
          "name": "calculate_simple_interest",
          "title": "Simple Interest Calculator",
          "description": "Simple Interest Calculator with a chart, the same math as the web page. How much interest on a loan or deposit? Simple interest is worked out only on the amount you start with. The interest never earns interest of its own. It works out interest on the starting amount only: amount times rate times time. It does not add interest on interest. People ask for it as \"simple interest calculator\", \"how to calculate interest on a loan per day\" or \"how to calculate simple interest on a loan\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "basis": {
                "description": "Days in a year. Only for days. Some banks use 360. Default: 365.",
                "enum": ["360", "365"],
                "type": "string"
              },
              "p": {
                "description": "Amount. US dollars. The amount lent, borrowed or saved. Default: 6000.",
                "type": "number"
              },
              "per": {
                "description": "The rate is for. Default: year.",
                "enum": ["year", "month"],
                "type": "string"
              },
              "r": {
                "description": "Interest rate. A percent: 5 means 5%. Use the rate on your loan or account. Default: 3.4.",
                "type": "number"
              },
              "t": {
                "description": "How long. Default: 4.",
                "type": "number"
              },
              "unit": {
                "description": "Count the time in. Default: years.",
                "enum": ["years", "months", "weeks", "days"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Simple Interest Calculator"
