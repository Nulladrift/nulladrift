        {
          "name": "compound_interest",
          "title": "Compound Interest Calculator",
          "description": "Compound interest calculator with an interactive chart. Works out what a starting amount and monthly deposits grow to at a fixed rate, compounded daily, monthly or yearly, and gives the APY. Use it for savings growth, CD and high-yield savings balances, future value at a fixed rate, and questions like what $10,000 becomes in 10 years at 5%.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Yearly interest rate as a percent, so 5 means 5%.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "compounding": {
                "description": "How often interest is added to the balance.",
                "enum": ["yearly", "half-yearly", "quarterly", "monthly", "daily"],
                "type": "string"
              },
              "per_month": {
                "description": "Dollars added at the end of each month.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "principal": {
                "description": "Starting amount, in US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Whole years, from 1 to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annual_rate_percent", "compounding", "per_month", "principal", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compound Interest Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://amaltash/calculator-card"
            },
            "ui/resourceUri": "ui://amaltash/calculator-card"
          },
          "digest": "sha256:8913c35db70976ba155a5ea5c92df4972f7be3da89f6881c66d85f5bcaef011a"
        },
        {
          "name": "crash_impact",
          "title": "Stock Market Crash Calculator",
          "description": "Portfolio stress test with an interactive chart. Works out how much a portfolio would lose if stocks fell by a chosen percent, given its mix of stocks, bonds and cash, with an optional loss limit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bonds_pct": {
                "description": "Share of the portfolio in bonds, in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "cash_pct": {
                "description": "Share of the portfolio in cash, in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "drawdown_limit_pct": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional limit on the portfolio loss, in percent of the portfolio. Leave null for no limit."
              },
              "portfolio_value": {
                "description": "Total portfolio value in US dollars.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "stock_crash_pct": {
                "description": "How far stocks fall, in percent, from 0 to 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "stocks_pct": {
                "description": "Share of the portfolio in stocks, in percent. Stocks, bonds and cash must add up to 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["bonds_pct", "cash_pct", "portfolio_value", "stock_crash_pct", "stocks_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stock Market Crash Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://amaltash/calculator-card"
            },
            "ui/resourceUri": "ui://amaltash/calculator-card"
          },
          "digest": "sha256:e924a582f08e7021c2c598e9a937d8eb32f26165522955071fba8fe322823fbe"
        },
        {
          "name": "dca_vs_lump_sum",
          "title": "DCA vs Lump Sum Calculator",
          "description": "Dollar-cost averaging vs lump sum calculator with an interactive chart. Compares investing a fixed amount at each price in a list with investing the same total at the first price, both valued at the last price. Use it when the person provides the price series.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount_per_period": {
                "description": "Dollars invested at each price, from 0 to 1,000,000,000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "prices": {
                "description": "One price per period, oldest first, from 1 to 120 prices.",
                "items": {
                  "description": "The price for one period, above 0.",
                  "maximum": 1000000000,
                  "minimum": 1e-8,
                  "type": "number"
                },
                "maxItems": 120,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["amount_per_period", "prices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DCA vs Lump Sum Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
