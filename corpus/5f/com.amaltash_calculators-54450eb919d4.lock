        {
          "name": "project_401k",
          "title": "401(k) Calculator",
          "description": "401(k) Calculator with a chart, the same math as the web page. What could your 401(k) grow to? See what your 401(k) could grow to by the time you retire. A 401(k) is a savings plan you get through work. It grows your deposits and your employer’s match at the rate you pick, within the IRS limits. It does not say what your money will earn. The growth rate is one you pick. People ask for it as \"401k calculator\", \"401k contribution calculator\" or \"how much will my 401k be worth\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "Your age. In years. Default: 30.",
                "maximum": 99,
                "minimum": 14,
                "type": "integer"
              },
              "bal": {
                "description": "Money in your 401(k) now. US dollars. Default: 20000.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "grow": {
                "description": "Grow like. Each is a real past average, 1928–2025. Default: own.",
                "enum": ["sp", "m80", "m60", "bond", "bill", "lost", "own"],
                "type": "string"
              },
              "match": {
                "description": "Your boss adds. A percent: 5 means 5%. This is called a match. Default: 50.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "pay": {
                "description": "Your pay each year. US dollars. Default: 100000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "raise": {
                "description": "Pay raise each year. A percent: 5 means 5%. Default: 0.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Growth each year. A percent: 5 means 5%. A guess, not a promise. Default: 6.",
                "maximum": 30,
                "minimum": -20,
                "type": "number"
              },
              "real": {
                "description": "Show money in. Today’s dollars take out rising prices: 3% a year, the 1928–2025 average. Default: future.",
                "enum": ["future", "today"],
                "type": "string"
              },
              "retire": {
                "description": "Age you want to retire. In years. Default: 65.",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "upto": {
                "description": "Your boss stops adding at. A percent: 5 means 5%. Default: 6.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "you": {
