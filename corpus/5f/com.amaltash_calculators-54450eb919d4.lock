        {
          "name": "calculate_roi",
          "title": "ROI Calculator",
          "description": "ROI Calculator with a chart, the same math as the web page. What was my return on investment? ROI is how much you made or lost compared with what you put in. It compares what you got back with what you put in. It shows the total return and the return per year. It does not say what any investment will return. People ask for it as \"roi calculator\", \"how to calculate return on investment\" or \"how do i calculate roi\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "back": {
                "description": "Money you got back. US dollars. What it is worth now, or what you sold it for. Default: 15000.",
                "minimum": 0,
                "type": "number"
              },
              "cost": {
                "description": "Extra costs. US dollars. Such as fees or repairs. They count as money you put in. Default: 0.",
                "minimum": 0,
                "type": "number"
              },
              "in": {
                "description": "Money you put in. US dollars. Default: 10000.",
                "minimum": 0,
                "type": "number"
              },
              "inc": {
                "description": "Money it paid you along the way. US dollars. Such as dividends or rent you kept as cash. Default: 0.",
                "minimum": 0,
                "type": "number"
              },
              "y": {
                "description": "Years you held it. In years. Optional. Adds the ROI per year. Default: 5.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ROI Calculator"
