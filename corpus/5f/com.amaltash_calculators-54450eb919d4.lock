        {
          "name": "calculate_cd_interest",
          "title": "CD Calculator",
          "description": "CD Calculator with a chart, the same math as the web page. How much will your CD earn? A CD, or certificate of deposit, is a bank account that pays a set rate for a set time. It adds interest at the CD rate you type, for the whole term, as often as you pick. It does not look up the rates banks pay today. People ask for it as \"cd calculator\", \"cd rate calculator\" or \"how much interest does a cd earn\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "n": {
                "description": "How often interest is added. Your bank’s terms say which. Default: 365.",
                "enum": ["1", "4", "12", "365"],
                "type": "string"
              },
              "rate": {
                "description": "CD rate each year. A percent: 5 means 5%. Your bank’s rate. Treasury bills averaged 3.4%, 1928–2025. Default: 3.4.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "start": {
                "description": "Money you put in. US dollars. Default: 10000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Years until the CD ends. In years. Whole years only. Default: 5.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CD Calculator"
