        {
          "name": "convert_apr_to_apy",
          "title": "APR to APY Calculator",
          "description": "APR to APY Calculator with a chart, the same math as the web page. What is my APR as an APY? APR is a yearly rate that leaves out interest on interest. APY counts it, so it shows what the rate adds up to in a year. It turns an APR into an APY by adding interest on interest as often as you pick. It can also go the other way. It does not count fees, which can change what a loan really costs. People ask for it as \"apr vs apy\", \"how is apy calculated\" or \"apr to apy calculator\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "balance": {
                "description": "Balance, owed or saved. US dollars. Optional. Shows one year of interest. Default: 1000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "from": {
                "description": "The rate you have. Default: apr.",
                "enum": ["apr", "apy"],
                "type": "string"
              },
              "n": {
                "description": "How often interest is added. Default: 365.",
                "enum": ["1", "4", "12", "365"],
                "type": "string"
              },
              "rate": {
                "description": "Your rate. A percent: 5 means 5%. From your statement, loan papers or bank. Default: 20.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
