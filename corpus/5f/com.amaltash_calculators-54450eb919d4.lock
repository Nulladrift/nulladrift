        },
        {
          "name": "calculate_future_value",
          "title": "Future Value Calculator",
          "description": "Future Value Calculator with a chart, the same math as the web page. What will your money be worth later? Future value is what your money grows to by a set date, at a set rate. It grows a lump sum and regular deposits at the rate you type. Deposits go in at the start or end of each period. It does not say what rate your money will earn. People ask for it as \"future value calculator\", \"what will my money be worth later\" or \"future value of investment calculator\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "add": {
                "description": "Money you add each time. US dollars. Pick how often just below. Default: 100.",
                "type": "number"
              },
              "period": {
                "description": "How often you add money. Default: 12.",
                "enum": ["1", "4", "12"],
                "type": "string"
              },
              "rate": {
                "description": "Interest rate each year. A percent: 5 means 5%. Treasury bills averaged 3.4% a year, 1928–2025. Default: 3.4.",
                "type": "number"
              },
              "start": {
                "description": "Money you start with. US dollars. Default: 5000.",
                "type": "number"
              },
              "timing": {
                "description": "When you add money. At the start earns a bit more. Default: end.",
                "enum": ["end", "start"],
                "type": "string"
              },
              "years": {
                "description": "How many years. In years. Default: 15.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
