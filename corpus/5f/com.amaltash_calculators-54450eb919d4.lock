        {
          "name": "plan_recurring_investment",
          "title": "Investment Calculator",
          "description": "Investment growth calculator with an interactive chart. Works out what regular deposits could grow to at a long-run market average or a yearly rate you choose. Use it for monthly investment plans and questions like what $10 a day or $500 a month could become in 20 or 30 years. Single stocks cannot be run forward.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Dollars put in each time, above 0.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "asset": {
                "description": "A long-run rate to use. Give this or custom_annual_percent, not both.",
                "enum": ["sp", "6040", "bonds", "bills", "lost"],
                "type": "string"
              },
              "cadence": {
                "description": "How often the amount goes in.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "custom_annual_percent": {
                "description": "Your own yearly return in percent, so 7 means 7%. Give this or asset, not both.",
                "maximum": 50,
                "minimum": -50,
                "type": "number"
              },
              "starting_amount": {
                "default": 0,
                "description": "Dollars already invested. Defaults to 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Whole years, 1 to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["amount", "cadence", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Investment Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
