        },
        {
          "name": "calculate_option_profit",
          "title": "Options Profit Calculator",
          "description": "Options Profit Calculator with a chart, the same math as the web page. When does your option make money? Enter your option. See the breakeven price and the most you can lose on the last day. It works out the profit or loss on the option’s last day at the stock price you pick, and the breakeven price. It does not say what a stock will do. Options are risky: you can lose all you paid. People ask for it as \"options profit calculator\", \"options calculator\" or \"how to calculate options profit\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "at": {
                "description": "Stock price on the last day. US dollars. Optional. Shows your profit or loss at that price. Empty if left out.",
                "minimum": 0,
                "type": "number"
              },
              "b": {
                "description": "What you paid per share for your stock. US dollars. Default: 100.",
                "minimum": 0,
                "type": "number"
              },
              "fee": {
                "description": "Fees, all together. US dollars. Default: 0.",
                "minimum": 0,
                "type": "number"
              },
              "got": {
                "description": "Price you got per share. US dollars. You get this when you sell. One contract is 100 shares. Default: 3.",
                "minimum": 0,
                "type": "number"
              },
              "k": {
                "description": "Strike price. US dollars. The share price written in the contract. Default: 100.",
                "minimum": 0,
                "type": "number"
              },
              "n": {
                "description": "Number of contracts. Default: 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "p": {
                "description": "Price you paid per share. US dollars. Option prices are per share. One contract is 100 shares. Default: 5.",
                "minimum": 0,
                "type": "number"
              },
              "sell": {
                "description": "Sold an option instead?. Covered call adds one box: what you paid per share for your stock. Default: none.",
                "enum": ["none", "covered-call", "cash-secured-put"],
                "type": "string"
              },
              "t": {
                "description": "What did you do?. A call gains if the stock goes up. A put gains if it goes down. Default: call.",
                "enum": ["call", "put"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Options Profit Calculator"
          },
          "behavior": {
