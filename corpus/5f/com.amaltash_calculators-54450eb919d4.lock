      "instructions": "These are money calculators. Each one runs the same math as a calculator page on amaltash.com. They cover compound interest, CDs, investing, retirement, 401(k), Roth IRA, RMD, loan amortization, mortgage payoff, APY, credit card payoff and more. Pick the tool whose name fits the question. Every input is optional; a missing one uses the page default, which the result shows. Percent inputs are whole numbers: 5 means 5%. Each result has a link that opens the same calculator on the same numbers. Share it so the person can change the numbers themselves. Each result ends with a disclosure. Keep it with the numbers when you repeat them. Results that look forward use rates the person picks; they are not predictions. Results from real past prices name their dates; past results do not predict future results. None of this is investment, tax or legal advice, and no tool can buy, sell or move money.",
      "tools": [
        {
          "name": "build_amortization_schedule",
          "title": "Amortization Schedule Calculator",
          "description": "Amortization Schedule Calculator with a chart, the same math as the web page. What is my monthly payment? Each payment pays the interest first. The rest pays down what you owe. It finds the fixed monthly payment for the loan. Each month, interest is paid first and the rest pays down the loan. It does not count taxes, insurance or fees in the payment. People ask for it as \"amortization schedule calculator\", \"mortgage amortization calculator\" or \"loan amortization calculator\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount you borrow. US dollars. Default: 300000.",
                "minimum": 0,
                "type": "number"
              },
              "extra": {
                "description": "Extra each month. US dollars. For more ways to pay early, use the mortgage payoff calculator. Default: 0.",
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Interest rate. A percent: 5 means 5%. Default: 6.5.",
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Years to pay it back. In years. Home loans are often 15 or 30 years. Car loans are often 5. Default: 30.",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Amortization Schedule Calculator"
          },
