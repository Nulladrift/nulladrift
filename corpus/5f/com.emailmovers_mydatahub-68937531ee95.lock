                    "suppression_status": "none",
                    "tps_ctps_screened_at": "2026-09-12",
                    "tps_ctps_status": "clear",
                    "tps_ctps_valid_until": "2026-10-10"
                  }
                ],
                "properties": {
                  "article14_notified_at": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "article14_status": {
                    "description": "Article 14 notice status: notified, publicly_notified_disproportionate_effort, pending_within_window.",
                    "enum": ["notified", "publicly_notified_disproportionate_effort", "pending_within_window"],
                    "type": "string"
                  },
                  "attribution": {
                    "description": "The OGL v3.0 attribution for Companies House company data. Officer names are personal data outside the OGL, so they carry article14_status instead.",
                    "type": ["string", "null"]
                  },
                  "corporate_subscriber": {
                    "description": "True for companies, LLPs, Scottish partnerships and public bodies, where the PECR regulation 22 consent rule does not apply.",
                    "type": "boolean"
                  },
                  "email_marketing_basis": {
                    "enum": ["pecr_corporate_subscriber", "consent_required"],
