        {
          "name": "search_filter_values",
          "title": "Search filter values",
          "description": "Searches the values of one field by text, such as towns matching leeds, and returns each code with its contact and company counts plus did_you_mean for near misses. Use the returned code in a filter rather than guessing one. Free and needs no account; results are paged with next_cursor. Call count_audience once the filters are chosen. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "An opaque cursor from next_cursor. Pass it back unchanged.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "dataset": {
                "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                "type": "string"
              },
              "dimension": {
                "description": "A field name from list_filters, such as site.town or company.sic_2007.",
                "pattern": "^(company|site|contact|email|phone|signal)\\.[a-z0-9_]+$",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Items per page, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Text to search for.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["dimension"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CellCount": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "const": "under 10",
                    "type": "string"
                  },
                  {
                    "const": "suppressed",
                    "type": "string"
                  }
                ],
                "description": "A whole number; \"under 10\" when disclosure control withholds a small cell; or \"suppressed\" when secondary suppression hides a cell of 10 or more in a cross-tab or breakdown, so totals cannot be differenced. Anonymous and trial callers see cells rounded to the nearest 5.",
                "examples": [4120, "under 10", "suppressed"]
              },
              "Disclosure": {
                "description": "Whether these numbers are exact or protected: \"under 10\" cells, rounding to 5 and secondary suppression for anonymous and trial callers.",
                "properties": {
                  "level": {
                    "description": "exact for authenticated paid callers; rounded for anonymous and trial callers, whose counts under 100 and every cell are rounded to the nearest 5.",
                    "enum": ["exact", "rounded"],
                    "type": "string"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rounded_to": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "5 when numbers are rounded; null when they are exact."
                  },
                  "secondary_suppression": {
                    "description": "True when cross-tab or breakdown cells of 10 or more were hidden as \"suppressed\" so totals cannot be differenced.",
                    "type": "boolean"
                  }
                },
                "required": ["level", "notes", "rounded_to", "secondary_suppression"],
                "type": "object"
              },
              "FilterValue": {
                "description": "One value of a field, with its counts.",
                "properties": {
                  "code": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "boolean"
                      }
                    ],
                    "description": "The value to use in a filter."
                  },
                  "companies": {
                    "$ref": "#/$defs/CellCount"
                  },
                  "contacts": {
                    "$ref": "#/$defs/CellCount"
                  },
                  "label": {
                    "type": "string"
                  },
                  "parent": {
                    "description": "The parent code for hierarchical fields, such as SIC division 62 under J.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["code", "companies", "contacts", "label"],
                "type": "object"
              }
            },
            "description": "A page of values in one field, best match first when q is given.",
            "properties": {
              "data": {
                "items": {
                  "$ref": "#/$defs/FilterValue"
                },
                "type": "array"
              },
              "dataset_version": {
                "description": "The immutable weekly build a count is bound to, such as 2026-W39. The last 52 stay queryable.",
                "examples": ["2026-W39"],
                "pattern": "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$",
                "type": "string"
              },
              "did_you_mean": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "disclosure": {
                "$ref": "#/$defs/Disclosure"
              },
              "field": {
                "type": "string"
              },
              "has_more": {
                "type": "boolean"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "description": "An opaque cursor from next_cursor. Pass it back unchanged.",
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["data", "dataset_version", "disclosure", "field", "has_more", "next_cursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search filter values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a58f8a2473bd85c9b1dbd4dbb6160ae0a77b40cd1351b39658e0f9ee5dec1d8"
        }
