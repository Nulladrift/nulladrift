                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 500,
                    "type": "array"
                  },
                  "expand": {
                    "description": "Expansion sets to apply, each once: plural_singular, department_synonyms, ampersand_and, abbreviations, permutations. Left out, the first four apply; an empty list applies none. Not used with mode exact.",
                    "items": {
                      "enum": ["plural_singular", "department_synonyms", "ampersand_and", "abbreviations", "permutations"],
