          "name": "save_audience",
          "title": "Save an audience",
          "description": "Saves an audience definition under a name, shared across the organisation, or updates a saved one when audience_id is given. Use it when the user wants to keep, share or recount a list later; saving is free and needs audiences:write. Repeating the same call returns the same saved audience. Call list_audiences to find it again, or count_audience with its aud_ id. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "$defs": {
              "AllGroup": {
                "additionalProperties": false,
                "description": "AND: every node inside must match.",
                "properties": {
                  "all": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["all"],
                "type": "object"
              },
              "AnyGroup": {
                "additionalProperties": false,
                "description": "OR: at least one node inside must match.",
                "properties": {
                  "any": {
