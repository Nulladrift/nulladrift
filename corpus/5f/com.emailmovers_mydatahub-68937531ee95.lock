                    "type": "integer"
                  },
                  "subscriber_class": {
                    "description": "PECR subscriber class: ltd, plc, llp, scottish_partnership, public_body, charity_incorporated, sole_trader, ordinary_partnership, unknown.",
                    "enum": ["ltd", "plc", "llp", "scottish_partnership", "public_body", "charity_incorporated", "sole_trader", "ordinary_partnership", "unknown"],
                    "type": "string"
                  },
                  "subscriber_evidence": {
                    "description": "The register entry behind subscriber_class.",
