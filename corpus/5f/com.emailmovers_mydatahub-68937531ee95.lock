                    "type": "string"
                  },
                  "where": {
                    "$ref": "#/$defs/WhereNode",
                    "description": "The filters. Left out, the audience is the whole dataset after the defaults."
                  }
                },
                "required": ["schema"],
                "title": "MyDataHub audience definition (mydatahub.audience/1)",
                "type": "object"
              },
