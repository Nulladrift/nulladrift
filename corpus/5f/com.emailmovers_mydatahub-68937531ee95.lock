                    "email_marketing_basis": "pecr_corporate_subscriber",
                    "lawful_basis": "legitimate_interests_art6_1_f",
                    "lia_ref": "EM-LIA-2026-03",
                    "notice_version": "2026-02",
                    "provenance": {
                      "company": {
                        "as_of": "2026-09-21",
                        "source": "companies_house"
                      },
                      "contact": {
                        "compiled_at": "2026-05-02",
                        "last_verified_at": "2026-08-30",
                        "method": "telephone",
