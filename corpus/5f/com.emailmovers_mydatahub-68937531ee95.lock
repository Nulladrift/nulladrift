        {
          "name": "lookup_company",
          "title": "Look up a company",
          "description": "Looks up one company by Companies House number, domain or name and returns its Companies House fields and compliance facts, and for a signed-in caller the contacts held there by job level. It returns no contact details: use enrich_contact for one known person, or count_audience for everyone at the company. Free and needs no account, though the contacts held are a single company count that needs an account (null when signed out). Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "A company by exactly one of number, domain or name.",
            "oneOf": [
              {
                "properties": {
                  "company_number": true
                },
                "required": ["company_number"],
                "type": "object"
              },
              {
                "properties": {
                  "domain": true
                },
                "required": ["domain"],
                "type": "object"
              },
              {
                "properties": {
                  "name": true
                },
                "required": ["name"],
                "type": "object"
              }
            ],
            "properties": {
              "company_number": {
                "description": "Eight characters in upper case, such as 05046417 or SC123456.",
                "pattern": "^[A-Z0-9]{8}$",
                "type": "string"
              },
              "domain": {
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "description": "Narrows a name search.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CellCount": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "const": "under 10",
                    "type": "string"
                  },
                  {
                    "const": "suppressed",
                    "type": "string"
                  }
                ],
                "description": "A whole number; \"under 10\" when disclosure control withholds a small cell; or \"suppressed\" when secondary suppression hides a cell of 10 or more in a cross-tab or breakdown, so totals cannot be differenced. Anonymous and trial callers see cells rounded to the nearest 5.",
                "examples": [4120, "under 10", "suppressed"]
              },
              "CompanyCompliance": {
                "description": "The company facts of the compliance object, for results with no contact.",
                "properties": {
                  "attribution": {
                    "type": ["string", "null"]
                  },
                  "corporate_subscriber": {
                    "type": "boolean"
                  },
                  "email_marketing_basis": {
                    "enum": ["pecr_corporate_subscriber", "consent_required"],
                    "type": "string"
                  },
                  "lawful_basis": {
                    "enum": ["legitimate_interests_art6_1_f"],
                    "type": "string"
                  },
                  "provenance": {
                    "properties": {
                      "company": {
                        "properties": {
                          "as_of": {
                            "format": "date",
                            "type": "string"
                          },
                          "source": {
                            "enum": ["emailmovers_research", "companies_house", "onspd", "ukbizdirectory", "partner_rampedup"],
                            "type": "string"
                          }
                        },
                        "required": ["as_of", "source"],
                        "type": "object"
                      }
                    },
                    "required": ["company"],
                    "type": "object"
                  },
                  "subscriber_class": {
                    "enum": ["ltd", "plc", "llp", "scottish_partnership", "public_body", "charity_incorporated", "sole_trader", "ordinary_partnership", "unknown"],
                    "type": "string"
                  },
                  "subscriber_evidence": {
                    "properties": {
                      "companies_house_number": {
                        "type": ["string", "null"]
                      },
                      "company_type": {
                        "type": "string"
                      }
                    },
                    "required": ["companies_house_number", "company_type"],
                    "type": "object"
                  }
                },
                "required": ["attribution", "corporate_subscriber", "email_marketing_basis", "lawful_basis", "provenance", "subscriber_class", "subscriber_evidence"],
                "type": "object"
              },
              "Disclosure": {
                "description": "Whether these numbers are exact or protected: \"under 10\" cells, rounding to 5 and secondary suppression for anonymous and trial callers.",
                "properties": {
                  "level": {
                    "description": "exact for authenticated paid callers; rounded for anonymous and trial callers, whose counts under 100 and every cell are rounded to the nearest 5.",
                    "enum": ["exact", "rounded"],
                    "type": "string"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rounded_to": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "5 when numbers are rounded; null when they are exact."
                  },
                  "secondary_suppression": {
                    "description": "True when cross-tab or breakdown cells of 10 or more were hidden as \"suppressed\" so totals cannot be differenced.",
                    "type": "boolean"
                  }
                },
                "required": ["level", "notes", "rounded_to", "secondary_suppression"],
                "type": "object"
              },
              "LevelCount": {
                "description": "Contacts at one job level.",
                "properties": {
                  "contacts": {
                    "$ref": "#/$defs/CellCount"
                  },
                  "level": {
                    "type": "string"
                  }
                },
                "required": ["contacts", "level"],
                "type": "object"
              },
              "SicCode": {
                "description": "A SIC 2007 code and its label, such as 25620 Machining.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  }
                },
                "required": ["code", "label"],
                "type": "object"
              }
            },
            "description": "Companies House fields for one company and, for signed-in callers, the contacts held there. No contact details.",
            "properties": {
              "company": {
                "properties": {
                  "companies_house_number": {
                    "type": ["string", "null"]
                  },
                  "employee_band": {
                    "type": ["string", "null"]
                  },
                  "incorporation_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "type": "string"
                  },
                  "registered_office": {
                    "properties": {
                      "postcode": {
                        "type": ["string", "null"]
                      },
                      "town": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["postcode", "town"],
                    "type": "object"
                  },
                  "sic_2007": {
                    "items": {
                      "$ref": "#/$defs/SicCode"
                    },
                    "type": "array"
                  },
                  "status": {
                    "type": "string"
                  },
                  "subscriber_class": {
                    "enum": ["ltd", "plc", "llp", "scottish_partnership", "public_body", "charity_incorporated", "sole_trader", "ordinary_partnership", "unknown"],
                    "type": "string"
                  },
                  "turnover_band": {
                    "type": ["string", "null"]
                  },
                  "type": {
                    "type": "string"
                  },
                  "website_domain": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["companies_house_number", "employee_band", "incorporation_date", "name", "registered_office", "sic_2007", "status", "subscriber_class", "turnover_band", "type", "website_domain"],
                "type": "object"
              },
              "compliance": {
                "$ref": "#/$defs/CompanyCompliance"
              },
              "contacts_by_level": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/LevelCount"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The same count by job level, most senior first, with Level not known last; null when signed out."
              },
              "contacts_held": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/CellCount"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Contacts we hold at the company: a single-company count, so signed-in callers only (null otherwise) and logged. Trial callers see it rounded."
              },
              "credits_charged": {
                "const": 0,
                "type": "number"
              },
              "dataset_version": {
                "description": "The immutable weekly build a count is bound to, such as 2026-W39. The last 52 stay queryable.",
                "examples": ["2026-W39"],
                "pattern": "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$",
                "type": "string"
              },
              "disclosure": {
                "$ref": "#/$defs/Disclosure"
              },
              "match_confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["company", "compliance", "contacts_by_level", "contacts_held", "credits_charged", "dataset_version", "disclosure", "match_confidence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
