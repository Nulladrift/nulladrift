        {
          "name": "report_objection",
          "title": "Report an objection",
          "description": "Records an objection to direct marketing for one record, by record id or email hash. Scope licensee suppresses it for your organisation at once; scope emailmovers suppresses it database-wide within one working day and tells every licensee holding it. Free; it needs suppressions:write, and repeating the same objection returns the same suppression. Call it whenever a contact objects, in any channel. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "An objection to direct marketing, to record and propagate: exactly one of record_id or email_sha256.",
            "oneOf": [
              {
                "properties": {
                  "record_id": true
                },
                "required": ["record_id"],
                "type": "object"
              },
              {
                "properties": {
                  "email_sha256": true
                },
                "required": ["email_sha256"],
                "type": "object"
              }
            ],
            "properties": {
              "channel": {
                "enum": ["email", "telephone", "post", "web_form", "other"],
                "type": "string"
              },
              "email_sha256": {
                "description": "SHA-256 of the trimmed, lower cased address, when the record id is not known.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "note": {
                "maxLength": 2000,
                "type": "string"
              },
              "received_at": {
                "description": "RFC 3339 date and time, with Z or an offset such as +01:00.",
                "format": "date-time",
                "type": "string"
              },
              "record_id": {
                "description": "Format: a contact id: contact_ followed by a 26 character ULID in upper case Crockford base32, such as contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8.",
                "examples": ["contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8"],
                "pattern": "^contact_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "scope": {
                "description": "licensee suppresses the record for your organisation at once; emailmovers suppresses it database-wide within one working day.",
                "enum": ["licensee", "emailmovers"],
                "type": "string"
              }
            },
            "required": ["channel", "received_at", "scope"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The suppression an objection created. Database-wide objections reach every licensee holding the record through the suppression.created webhook.",
            "properties": {
              "effective_by": {
                "format": "date-time",
                "type": "string"
              },
              "record_id": {
                "anyOf": [
                  {
                    "description": "Format: a contact id: contact_ followed by a 26 character ULID in upper case Crockford base32, such as contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8.",
                    "examples": ["contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8"],
                    "pattern": "^contact_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scope": {
                "enum": ["licensee", "emailmovers"],
                "type": "string"
              },
              "status": {
                "description": "suppressed now, or pending until the database-wide overlay applies.",
                "enum": ["suppressed", "pending"],
                "type": "string"
              },
              "suppressed_at": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "suppression_id": {
                "description": "The list the record now sits on.",
                "examples": ["sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA"],
                "pattern": "^sup_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              }
            },
            "required": ["effective_by", "record_id", "scope", "status", "suppressed_at", "suppression_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report an objection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f42aa3759ab8af75511527bfad2ee7b394567147d53637defa8937fb94dfb1a1"
        },
        {
          "name": "resolve_location",
          "title": "Resolve a location",
          "description": "Turns free text such as 20 miles of Leeds, Yorkshire or LS1 into region, county, town, postcode or radius filters, each with a count and a ready filter. Ambiguous places come back as candidates with a question, so ask the user which they meant rather than choosing. Free and needs no account, though a radius under 5 miles needs an account. Add the chosen filter to the audience, then call count_audience. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "A place to resolve into geography filters.",
            "properties": {
              "dataset": {
                "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                "type": "string"
              },
              "radius_miles": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "text": {
                "description": "Free text such as \"20 miles of Leeds\", \"Yorkshire\" or \"SW1\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "BetweenFilter": {
                "additionalProperties": false,
                "description": "The field lies from one value to another inclusive, over the field's order.",
                "examples": [
                  {
                    "field": "company.employee_band",
                    "from": "10-19",
                    "op": "between",
                    "to": "200-349"
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.employee_band", "company.turnover_band", "company.fleet_band", "contact.job_level_rank", "email.deliverability_score"],
                    "type": "string"
                  },
                  "from": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  },
                  "op": {
                    "const": "between",
                    "type": "string"
                  },
                  "to": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  }
                },
                "required": ["field", "from", "op", "to"],
                "type": "object"
              },
              "CellCount": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "const": "under 10",
                    "type": "string"
                  },
                  {
                    "const": "suppressed",
                    "type": "string"
                  }
                ],
                "description": "A whole number; \"under 10\" when disclosure control withholds a small cell; or \"suppressed\" when secondary suppression hides a cell of 10 or more in a cross-tab or breakdown, so totals cannot be differenced. Anonymous and trial callers see cells rounded to the nearest 5.",
                "examples": [4120, "under 10", "suppressed"]
              },
              "Disclosure": {
                "description": "Whether these numbers are exact or protected: \"under 10\" cells, rounding to 5 and secondary suppression for anonymous and trial callers.",
                "properties": {
                  "level": {
                    "description": "exact for authenticated paid callers; rounded for anonymous and trial callers, whose counts under 100 and every cell are rounded to the nearest 5.",
                    "enum": ["exact", "rounded"],
                    "type": "string"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rounded_to": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "5 when numbers are rounded; null when they are exact."
                  },
                  "secondary_suppression": {
                    "description": "True when cross-tab or breakdown cells of 10 or more were hidden as \"suppressed\" so totals cannot be differenced.",
                    "type": "boolean"
                  }
                },
                "required": ["level", "notes", "rounded_to", "secondary_suppression"],
                "type": "object"
              },
              "Filter": {
                "description": "One criterion: a field from GET /v1/catalogue/filters, an operator and its operands. Exclusions nest under not.",
                "oneOf": [
                  {
                    "$ref": "#/$defs/InFilter"
                  },
                  {
                    "$ref": "#/$defs/BetweenFilter"
                  },
                  {
                    "$ref": "#/$defs/GteFilter"
                  },
                  {
