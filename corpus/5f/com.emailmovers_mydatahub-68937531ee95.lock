                    "pattern": "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$",
                    "type": "string"
                  },
                  "dedupe": {
                    "description": "none keeps every matching contact, one_per_company keeps one contact per company, one_per_site keeps one per site. Default none.",
