                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Filter by name.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AllGroup": {
                "additionalProperties": false,
                "description": "AND: every node inside must match.",
                "properties": {
                  "all": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["all"],
