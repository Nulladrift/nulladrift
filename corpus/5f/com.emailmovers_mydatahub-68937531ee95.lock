{
  "lockfileVersion": 2,
  "subjects": {
    "com.emailmovers/mydatahub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mydatahub.emailmovers.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "capabilities": {
        "extensions": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Count first, preview second, quote third, then create_order. Counting, previewing and quoting are free; one credit buys one complete UK record. create_order needs a quote_id from quote_order.",
      "tools": [
        {
          "name": "check_suppression",
          "title": "Check suppression",
          "description": "Checks the suppression status of up to 1,000 delivered records by record id, as of now, and names the lists that suppress each. Use it before every send, because objections reach records after delivery. Free; it needs suppressions:read. Leave suppressed records out of the send, and call report_objection when someone objects. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Records to check before a send.",
            "properties": {
              "record_ids": {
                "items": {
                  "description": "Format: a contact id: contact_ followed by a 26 character ULID in upper case Crockford base32, such as contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8.",
                  "examples": ["contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8"],
                  "pattern": "^contact_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["record_ids"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Suppression status per record, as of now.",
            "properties": {
              "checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "list_ids": {
                      "items": {
                        "description": "Format: a suppression list id: sup_ followed by a 26 character ULID in upper case Crockford base32, such as sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA.",
                        "examples": ["sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA"],
                        "pattern": "^sup_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "record_id": {
                      "description": "Format: a contact id: contact_ followed by a 26 character ULID in upper case Crockford base32, such as contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8.",
                      "examples": ["contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8"],
                      "pattern": "^contact_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                      "type": "string"
                    },
                    "suppressed": {
                      "type": "boolean"
                    },
                    "suppression_status": {
                      "enum": ["none", "objected_to_emailmovers", "objected_to_licensee", "deceased", "left_company"],
                      "type": "string"
                    }
                  },
                  "required": ["list_ids", "record_id", "suppressed", "suppression_status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["checked_at", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check suppression"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f83139b9957bb03943a82208f00b8381b330a791fe2984745daa012342ae999"
        },
        {
          "name": "compile_audience",
          "title": "Compile a brief",
          "description": "Compiles a plain English brief, such as 300 finance directors at law firms in Manchester, into an audience definition with a one-sentence readback, editable chips and any questions to answer first. Use it first for a request in words, read the readback to the user and settle the questions before counting. Words that match no filter come back in unrecognised, never guessed. Free and needs no account; pass the audience to count_audience next. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "A brief to compile into an audience definition.",
            "properties": {
              "brief": {
                "description": "A plain English brief, such as \"300 finance directors at law firms in Manchester\".",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              },
              "dataset": {
                "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AllGroup": {
                "additionalProperties": false,
                "description": "AND: every node inside must match.",
                "properties": {
                  "all": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["all"],
                "type": "object"
              },
              "AnyGroup": {
                "additionalProperties": false,
                "description": "OR: at least one node inside must match.",
                "properties": {
                  "any": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["any"],
                "type": "object"
              },
              "Audience": {
                "additionalProperties": false,
                "description": "Who you want, as filters grouped by entity (company., site., contact., email., phone., signal.). The server fills its defaults (active companies, named emails, corporate subscribers, the current dataset_version) and returns the effective definition with every count.",
                "properties": {
                  "dataset": {
                    "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                    "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                    "type": "string"
                  },
                  "dataset_version": {
                    "description": "The weekly build to count against, such as 2026-W39. Left out, the current version is filled in and returned.",
                    "examples": ["2026-W39"],
                    "pattern": "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$",
                    "type": "string"
                  },
                  "dedupe": {
                    "description": "none keeps every matching contact, one_per_company keeps one contact per company, one_per_site keeps one per site. Default none.",
                    "enum": ["none", "one_per_company", "one_per_site"],
                    "type": "string"
                  },
                  "email_policy": {
                    "$ref": "#/$defs/EmailPolicy"
                  },
                  "schema": {
                    "const": "mydatahub.audience/1",
                    "description": "The definition's namespace and version. Older versions are upgraded by a pure function.",
                    "type": "string"
                  },
                  "where": {
                    "$ref": "#/$defs/WhereNode",
                    "description": "The filters. Left out, the audience is the whole dataset after the defaults."
                  }
                },
                "required": ["schema"],
                "title": "MyDataHub audience definition (mydatahub.audience/1)",
                "type": "object"
              },
              "BetweenFilter": {
                "additionalProperties": false,
                "description": "The field lies from one value to another inclusive, over the field's order.",
                "examples": [
                  {
                    "field": "company.employee_band",
                    "from": "10-19",
                    "op": "between",
                    "to": "200-349"
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.employee_band", "company.turnover_band", "company.fleet_band", "contact.job_level_rank", "email.deliverability_score"],
                    "type": "string"
                  },
                  "from": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  },
                  "op": {
                    "const": "between",
                    "type": "string"
                  },
                  "to": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  }
                },
                "required": ["field", "from", "op", "to"],
                "type": "object"
              },
              "BriefQuestion": {
                "description": "An ambiguity to answer before counting.",
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "options": {
                    "items": {
                      "properties": {
                        "filter": {
                          "$ref": "#/$defs/Filter"
                        },
                        "label": {
                          "type": "string"
                        }
                      },
                      "required": ["filter", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["id", "options", "text"],
                "type": "object"
              },
              "BundleNode": {
                "additionalProperties": false,
                "description": "A title bundle, resolved to its filters in the effective definition: sdm (senior decision makers), manager_and_above (managers and above), owner_managed (owner managed).",
                "properties": {
                  "bundle": {
                    "enum": ["sdm", "manager_and_above", "owner_managed"],
                    "type": "string"
                  }
                },
                "required": ["bundle"],
                "type": "object"
              },
              "Chip": {
                "description": "One visible, editable filter compiled from the brief.",
                "properties": {
                  "from_brief": {
                    "description": "The words of the brief it came from.",
                    "type": "string"
                  },
                  "label": {
                    "description": "What the chip reads, such as Within 20 miles of Leeds.",
                    "type": "string"
                  },
                  "pointer": {
                    "description": "JSON pointer to the filter inside audience.",
                    "type": "string"
                  }
                },
                "required": ["from_brief", "label", "pointer"],
                "type": "object"
              },
              "EmailPolicy": {
                "additionalProperties": false,
                "description": "Email quality floor. Defaults: min_deliverability_score 70, allow_catch_all false.",
                "properties": {
                  "allow_catch_all": {
                    "description": "Whether catch-all addresses count. Default false.",
                    "type": "boolean"
                  },
                  "min_deliverability_score": {
                    "description": "Lowest deliverability score counted, 0 to 100. Default 70.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "Filter": {
                "description": "One criterion: a field from GET /v1/catalogue/filters, an operator and its operands. Exclusions nest under not.",
                "oneOf": [
                  {
                    "$ref": "#/$defs/InFilter"
                  },
                  {
                    "$ref": "#/$defs/BetweenFilter"
                  },
                  {
                    "$ref": "#/$defs/GteFilter"
                  },
                  {
                    "$ref": "#/$defs/LteFilter"
                  },
                  {
                    "$ref": "#/$defs/MatchesFilter"
                  },
                  {
                    "$ref": "#/$defs/WithinRadiusFilter"
                  },
                  {
                    "$ref": "#/$defs/InListFilter"
                  },
                  {
                    "$ref": "#/$defs/SinceFilter"
                  }
                ]
              },
              "GteFilter": {
                "additionalProperties": false,
                "description": "The field is at or after the value in its order: for bands, the band and every larger one.",
                "examples": [
                  {
                    "field": "company.employee_band",
                    "op": "gte",
                    "value": "50-99"
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.employee_band", "company.turnover_band", "company.fleet_band", "contact.job_level_rank", "email.deliverability_score"],
                    "type": "string"
                  },
                  "op": {
                    "const": "gte",
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  }
                },
                "required": ["field", "op", "value"],
                "type": "object"
              },
              "InFilter": {
                "additionalProperties": false,
                "description": "The field holds one of the listed codes.",
                "examples": [
                  {
                    "field": "company.sic_2007",
                    "op": "in",
                    "values": ["C"]
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.sic_2007", "company.business_class", "company.employee_band", "company.turnover_band", "company.fleet_band", "company.type", "company.status", "company.subscriber_class", "company.companies_house_number", "site.region", "site.county", "site.town", "site.postcode", "contact.title_family", "contact.job_function", "contact.job_level_rank", "contact.premium", "email.exists", "email.type", "phone.exists", "phone.tps_ctps_status"],
                    "type": "string"
                  },
                  "op": {
                    "const": "in",
                    "type": "string"
                  },
                  "values": {
                    "items": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "boolean"
                        }
                      ],
                      "description": "A code, a rank or a boolean, as the field's catalogue lists it."
                    },
                    "maxItems": 10000,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["field", "op", "values"],
                "type": "object"
              },
              "InListFilter": {
                "additionalProperties": false,
                "description": "The record's hashed email, domain, phone, company number or title term is on a suppression list. Usually nested under not; each list reports the records it removed.",
                "examples": [
                  {
                    "field": "email.address_sha256",
                    "list_id": "sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA",
                    "op": "in_list"
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.companies_house_number", "contact.title", "email.address_sha256", "email.domain_sha256", "phone.e164_sha256"],
                    "type": "string"
                  },
                  "list_id": {
                    "description": "Format: a suppression list id: sup_ followed by a 26 character ULID in upper case Crockford base32, such as sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA.",
                    "examples": ["sup_01JB4H7Q2V7XN3M9R6T1Y5W8ZA"],
                    "pattern": "^sup_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                    "type": "string"
                  },
                  "op": {
                    "const": "in_list",
                    "type": "string"
                  }
                },
                "required": ["field", "list_id", "op"],
                "type": "object"
              },
              "LteFilter": {
                "additionalProperties": false,
                "description": "The field is at or before the value in its order. Rank 1 is the most senior, so Director and above is contact.job_level_rank lte 6.",
                "examples": [
                  {
                    "field": "contact.job_level_rank",
                    "op": "lte",
                    "value": 6
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.employee_band", "company.turnover_band", "company.fleet_band", "contact.job_level_rank", "contact.company_contact_rank", "email.deliverability_score"],
                    "type": "string"
                  },
                  "op": {
                    "const": "lte",
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  }
                },
                "required": ["field", "op", "value"],
                "type": "object"
              },
              "MatchesFilter": {
                "additionalProperties": false,
                "allOf": [
                  {
                    "if": {
                      "properties": {
                        "mode": {
                          "const": "exact"
                        }
                      },
                      "required": ["mode"],
                      "type": "object"
                    },
                    "then": {
                      "properties": {
                        "exclude_terms": {
                          "maxItems": 0,
                          "type": "array"
                        },
                        "expand": {
                          "maxItems": 0,
                          "type": "array"
                        }
                      },
                      "type": "object"
                    }
                  }
                ],
                "description": "Job title keyword match. mode contains (the default) or starts_with expands each term with the expansion sets; mode exact matches verbatim titles. Every expanded term is returned with the count.",
                "examples": [
                  {
                    "expand": ["plural_singular", "department_synonyms", "ampersand_and", "abbreviations"],
                    "field": "contact.title",
                    "mode": "contains",
                    "op": "matches",
                    "terms": ["marketing manager"]
                  }
                ],
                "properties": {
                  "exclude_terms": {
                    "description": "Expanded terms removed by hand. Kept in the definition so the count stays reproducible when the title dictionary changes.",
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 500,
                    "type": "array"
                  },
                  "expand": {
                    "description": "Expansion sets to apply, each once: plural_singular, department_synonyms, ampersand_and, abbreviations, permutations. Left out, the first four apply; an empty list applies none. Not used with mode exact.",
                    "items": {
                      "enum": ["plural_singular", "department_synonyms", "ampersand_and", "abbreviations", "permutations"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "field": {
                    "enum": ["contact.title"],
                    "type": "string"
                  },
                  "mode": {
                    "description": "contains (the default) matches titles containing a term, starts_with matches titles beginning with it, exact takes verbatim titles with no expansion.",
                    "enum": ["contains", "starts_with", "exact"],
                    "type": "string"
                  },
                  "op": {
                    "const": "matches",
                    "type": "string"
                  },
                  "terms": {
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 500,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["field", "op", "terms"],
                "type": "object"
              },
              "NotGroup": {
                "additionalProperties": false,
                "description": "Negation: the single node inside must not match.",
                "properties": {
                  "not": {
                    "$ref": "#/$defs/WhereNode"
                  }
                },
                "required": ["not"],
                "type": "object"
              },
              "PlaceCentre": {
                "additionalProperties": false,
                "description": "A named place. Ambiguous names come back from resolve_location as candidates, never a silent choice.",
                "properties": {
                  "code": {
                    "description": "The ONS geography code of the chosen candidate when resolve_location found more than one, such as E08000035 for the Leeds district.",
                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  },
                  "place": {
                    "description": "A place name, resolved with resolve_location, such as Leeds.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["place"],
                "type": "object"
              },
              "PointCentre": {
                "additionalProperties": false,
                "description": "A latitude and longitude in WGS84 degrees.",
                "properties": {
                  "lat": {
                    "maximum": 61,
                    "minimum": 49,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 2,
                    "minimum": -9,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "PostcodeCentre": {
                "additionalProperties": false,
                "description": "A postcode centroid from ONSPD.",
                "properties": {
                  "postcode": {
                    "description": "The centroid of a postcode unit, sector, district or area, such as LS1 4AP.",
                    "pattern": "^[A-Za-z]{1,2}([0-9][0-9A-Za-z]?( [0-9]([A-Za-z]{2})?| ?[0-9][A-Za-z]{2})?)?$",
                    "type": "string"
                  }
                },
                "required": ["postcode"],
                "type": "object"
              },
              "RadiusCentre": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/PlaceCentre"
                  },
                  {
                    "$ref": "#/$defs/PostcodeCentre"
                  },
                  {
                    "$ref": "#/$defs/PointCentre"
                  }
                ],
                "description": "The centre of a radius: a place, a postcode or a latitude and longitude."
              },
              "SinceFilter": {
                "additionalProperties": false,
                "description": "Within the last N days: a date field, or a Companies House signal of the listed types on signal.type.",
                "examples": [
                  {
                    "days": 90,
                    "field": "signal.type",
                    "op": "since",
                    "values": ["company.incorporated"]
                  }
                ],
                "properties": {
                  "days": {
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "field": {
                    "enum": ["contact.last_validated_at", "email.last_verified_at", "signal.type", "signal.observed_at"],
                    "type": "string"
                  },
                  "op": {
                    "const": "since",
                    "type": "string"
                  },
                  "values": {
                    "description": "For signal.type only: the signal types to look for, such as company.incorporated.",
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10000,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["days", "field", "op"],
                "type": "object"
              },
              "WhereNode": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/AllGroup"
                  },
                  {
                    "$ref": "#/$defs/AnyGroup"
                  },
                  {
                    "$ref": "#/$defs/NotGroup"
                  },
                  {
                    "$ref": "#/$defs/BundleNode"
                  },
                  {
                    "$ref": "#/$defs/Filter"
                  }
                ],
                "description": "A group (all, any, not), a title bundle or a filter. Groups nest up to 32 deep, and a where tree holds up to 1,000 filters, groups and bundles."
              },
              "WithinRadiusFilter": {
                "additionalProperties": false,
                "description": "Sites within radius_miles of the centre. The count reports the centroid used and the postcodes matched.",
                "examples": [
                  {
                    "centre": {
                      "place": "Leeds"
                    },
                    "field": "site.location",
                    "op": "within_radius",
                    "radius_miles": 20
                  }
                ],
                "properties": {
                  "centre": {
                    "$ref": "#/$defs/RadiusCentre"
                  },
                  "field": {
                    "enum": ["site.location"],
                    "type": "string"
                  },
                  "op": {
                    "const": "within_radius",
                    "type": "string"
                  },
                  "radius_miles": {
                    "description": "Radius in miles, 1 to 100. Under 5 miles needs an account.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "required": ["centre", "field", "op", "radius_miles"],
                "type": "object"
              }
            },
            "description": "An audience definition from a brief, with its chips and any questions.",
            "properties": {
              "audience": {
                "$ref": "#/$defs/Audience"
              },
              "chips": {
                "items": {
                  "$ref": "#/$defs/Chip"
                },
                "type": "array"
              },
              "quantity": {
                "anyOf": [
                  {
                    "minimum": 0,
