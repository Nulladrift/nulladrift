                    "description": "5 when numbers are rounded; null when they are exact."
                  },
                  "secondary_suppression": {
                    "description": "True when cross-tab or breakdown cells of 10 or more were hidden as \"suppressed\" so totals cannot be differenced.",
                    "type": "boolean"
