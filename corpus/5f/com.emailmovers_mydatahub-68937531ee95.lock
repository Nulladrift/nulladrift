                      "companies_house_number": {
                        "type": ["string", "null"]
                      },
                      "company_type": {
                        "type": "string"
                      }
                    },
                    "required": ["companies_house_number", "company_type"],
                    "type": "object"
                  },
                  "suppression_status": {
                    "enum": ["none", "objected_to_emailmovers", "objected_to_licensee", "deceased", "left_company"],
                    "type": "string"
                  },
                  "tps_ctps_screened_at": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The date of the screen the status is as of; null when not screened."
                  },
                  "tps_ctps_status": {
                    "description": "Telephone screen: clear, tps_registered, ctps_registered, tps_or_ctps_registered, not_screened. The result of the screen on tps_ctps_screened_at, valid until tps_ctps_valid_until. In a sample, an order's records (each time they are fetched, downloaded or pushed) and an enrichment, a clear number reads not_screened, with no dates, once that screen is more than 28 days before the day the record is served; a registered number stays registered.",
                    "enum": ["clear", "tps_registered", "ctps_registered", "tps_or_ctps_registered", "not_screened"],
                    "type": "string"
                  },
                  "tps_ctps_valid_until": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
