                  "default": {
                    "type": ["string", "null"]
                  },
                  "description": {
                    "type": "string"
                  },
                  "examples": {
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "boolean"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  "facet": {
                    "description": "Usable in breakdown_by.",
                    "type": "boolean"
                  },
                  "field": {
                    "description": "The field name, also the dimension slug.",
                    "type": "string"
                  },
                  "group": {
                    "enum": ["company", "site", "contact", "email", "phone", "signal"],
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "operators": {
                    "items": {
                      "enum": ["in", "between", "gte", "lte", "matches", "within_radius", "in_list", "since"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "type": {
                    "enum": ["enum", "text", "number", "date", "geo", "hashed_list", "boolean", "band"],
                    "type": "string"
                  },
                  "value_count": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Distinct values in this dataset version; null for free text and numbers."
