        {
          "name": "fetch_order_records",
          "title": "Fetch order records",
          "description": "Returns a page of an order's delivered records (50 by default, up to 100) with the licence block on every page, as JSON or, on request, as CSV. Pages stay under about 8,000 tokens, with approx_tokens on each; pass next_cursor to continue. Fetching again under licence costs 0 credits; it needs records:read. Call check_suppression before any send, and get_compliance_receipt for proof of screening. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "An opaque cursor from next_cursor. Pass it back unchanged.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "fields": {
                "description": "Columns to return; default the order's field set.",
                "items": {
                  "pattern": "^[a-z0-9_]+$",
                  "type": "string"
                },
                "type": "array"
              },
              "format": {
                "default": "json",
                "description": "json (default) or csv.",
                "enum": ["json", "csv"],
                "type": "string"
              },
              "limit": {
                "default": 50,
