        {
          "name": "push_to_crm",
          "title": "Push an order to a CRM",
          "description": "Pushes an order's records to a connected CRM such as HubSpot or Salesforce, keyed on mydatahub_record_id, as record operations only: nothing is ever sent to the contacts. dry_run defaults to true and reports what would be created, updated or skipped; a live push needs the user's confirmation or an agent key allowed push_to_crm on that connection, or it returns confirmation-required. Free; it needs pushes:write and a connection made in the app. Show the dry run to the user before a live push. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "The token the approval page on mydatahub.emailmovers.com returns once the signed-in person approves. It is bound to that person (their sub), this spend (the machine quote_id, or the enrichment or push) and an expiry no later than the quote's, and it is redeemable once.",
                "maxLength": 2000,
                "minLength": 16,
                "type": "string"
              },
              "connection_id": {
                "description": "Format: a CRM connection id: conn_ followed by a 26 character ULID in upper case Crockford base32, such as conn_01JB3Y2X6Y7Z8A1B2C3D4E5F6G.",
                "examples": ["conn_01JB3Y2X6Y7Z8A1B2C3D4E5F6G"],
                "pattern": "^conn_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "dry_run": {
                "default": true,
                "description": "Default true: report what would change without writing. A live push needs approval: a person's confirmation, or an agent key allowed push_to_crm on this connection.",
                "type": "boolean"
              },
              "order_id": {
                "description": "The order whose records to push.",
                "examples": ["ord_01JB4N9S3W2X6Y7Z8A1B2C3D4E"],
                "pattern": "^ord_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "update_existing": {
                "default": true,
                "description": "Update records already in the CRM, matched on mydatahub_record_id. Default true.",
                "type": "boolean"
              }
            },
            "required": ["connection_id", "order_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CrmPropertyGroup": {
                "description": "The MyDataHub property group written on every pushed record, so licence expiry and suppression are enforced in the CRM by field flags.",
                "properties": {
                  "article14_status": {
                    "enum": ["notified", "publicly_notified_disproportionate_effort", "pending_within_window"],
                    "type": "string"
                  },
                  "compliance_receipt_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "lawful_basis": {
                    "enum": ["legitimate_interests_art6_1_f"],
                    "type": "string"
                  },
                  "licence_expires_at": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "mydatahub_record_id": {
                    "description": "The record id: a Salesforce External ID, a HubSpot unique property, a Pipedrive custom field.",
                    "examples": ["contact_01JA9X2V7XN3M9R6T1Y5W8ZAK8"],
                    "pattern": "^contact_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                    "type": "string"
                  },
                  "subscriber_class": {
                    "enum": ["ltd", "plc", "llp", "scottish_partnership", "public_body", "charity_incorporated", "sole_trader", "ordinary_partnership", "unknown"],
                    "type": "string"
                  },
                  "suppression_status": {
                    "description": "Kept current: an objection reaching the record updates it in the CRM.",
                    "enum": ["none", "objected_to_emailmovers", "objected_to_licensee", "deceased", "left_company"],
                    "type": "string"
                  },
                  "tps_ctps_screened_at": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
