        {
          "name": "expand_job_titles",
          "title": "Expand job titles",
          "description": "Expands title keywords into every matching title (plurals, department synonyms, ampersands, abbreviations such as CEO), each with a count, or shows what a bundle such as sdm resolves to. Use it before counting so the user can see and edit which titles a keyword covers; nothing is expanded silently. Free and needs no account. Put the returned filter into the audience, then call count_audience. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Keywords or a bundle to expand into an editable title list: exactly one of terms or bundle.",
            "oneOf": [
              {
                "properties": {
                  "terms": true
                },
                "required": ["terms"],
                "type": "object"
              },
              {
                "properties": {
                  "bundle": true
                },
                "required": ["bundle"],
                "type": "object"
              }
            ],
            "properties": {
              "bundle": {
                "description": "A title bundle to show: sdm, manager_and_above or owner_managed.",
                "enum": ["sdm", "manager_and_above", "owner_managed"],
                "type": "string"
              },
              "dataset": {
                "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                "type": "string"
              },
              "expand": {
                "description": "Expansion sets to apply, each once. Left out, the four default sets apply.",
                "items": {
                  "enum": ["plural_singular", "department_synonyms", "ampersand_and", "abbreviations", "permutations"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "mode": {
                "description": "contains (the default) matches titles containing a term, starts_with matches titles beginning with it, exact takes verbatim titles with no expansion.",
                "enum": ["contains", "starts_with", "exact"],
                "type": "string"
              },
              "terms": {
                "description": "Title keywords to expand, such as marketing manager.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AllGroup": {
                "additionalProperties": false,
                "description": "AND: every node inside must match.",
                "properties": {
                  "all": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["all"],
                "type": "object"
              },
              "AnyGroup": {
                "additionalProperties": false,
                "description": "OR: at least one node inside must match.",
                "properties": {
                  "any": {
                    "items": {
                      "$ref": "#/$defs/WhereNode"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["any"],
                "type": "object"
              },
              "BetweenFilter": {
                "additionalProperties": false,
                "description": "The field lies from one value to another inclusive, over the field's order.",
                "examples": [
                  {
                    "field": "company.employee_band",
                    "from": "10-19",
                    "op": "between",
                    "to": "200-349"
                  }
                ],
                "properties": {
                  "field": {
                    "enum": ["company.employee_band", "company.turnover_band", "company.fleet_band", "contact.job_level_rank", "email.deliverability_score"],
                    "type": "string"
                  },
                  "from": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  },
                  "op": {
                    "const": "between",
                    "type": "string"
                  },
                  "to": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "description": "A band code or a number from the field's order."
                  }
                },
                "required": ["field", "from", "op", "to"],
                "type": "object"
              },
              "BundleNode": {
                "additionalProperties": false,
                "description": "A title bundle, resolved to its filters in the effective definition: sdm (senior decision makers), manager_and_above (managers and above), owner_managed (owner managed).",
                "properties": {
                  "bundle": {
                    "enum": ["sdm", "manager_and_above", "owner_managed"],
                    "type": "string"
                  }
                },
                "required": ["bundle"],
                "type": "object"
              },
              "CellCount": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "const": "under 10",
                    "type": "string"
                  },
                  {
                    "const": "suppressed",
                    "type": "string"
                  }
                ],
                "description": "A whole number; \"under 10\" when disclosure control withholds a small cell; or \"suppressed\" when secondary suppression hides a cell of 10 or more in a cross-tab or breakdown, so totals cannot be differenced. Anonymous and trial callers see cells rounded to the nearest 5.",
                "examples": [4120, "under 10", "suppressed"]
              },
              "Disclosure": {
                "description": "Whether these numbers are exact or protected: \"under 10\" cells, rounding to 5 and secondary suppression for anonymous and trial callers.",
                "properties": {
                  "level": {
                    "description": "exact for authenticated paid callers; rounded for anonymous and trial callers, whose counts under 100 and every cell are rounded to the nearest 5.",
                    "enum": ["exact", "rounded"],
                    "type": "string"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rounded_to": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
