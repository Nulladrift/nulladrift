        {
          "name": "quote_order",
          "title": "Quote an order",
          "description": "Creates a machine quote for a count: the records you would receive after removing ones already held and suppressed, the credits and GBP price, the licence, the warranty and any blockers. The quote_id lasts 24 hours and is bound to the dataset version; it is not a human sales quote, which is a 14 day PDF made in the app. Free and needs no account, and nothing is charged. Show the credits and price to the user, then call create_order with the quote_id. Lawful basis is UK GDPR Article 6(1)(f) legitimate interests; email audiences include corporate subscribers only by default (PECR), so sole traders and ordinary partnerships are left out unless the toggle is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "dedupe_against": {
                      "enum": ["crm", "previous_orders_and_crm"]
                    }
                  },
                  "required": ["dedupe_against"],
                  "type": "object"
                },
                "then": {
                  "properties": {
                    "connection_id": true
                  },
                  "required": ["connection_id"],
                  "type": "object"
                }
              },
              {
                "if": {
                  "properties": {
                    "connection_id": true
                  },
                  "required": ["connection_id"],
                  "type": "object"
                },
                "then": {
                  "properties": {
                    "dedupe_against": {
                      "enum": ["crm", "previous_orders_and_crm"]
                    }
                  },
                  "required": ["dedupe_against"],
                  "type": "object"
                }
              }
            ],
            "description": "What to price: a count, a field set, how many records and the licence. Free, and needs no account.",
            "properties": {
              "connection_id": {
                "description": "The CRM connection to check, only with dedupe_against crm or previous_orders_and_crm.",
                "examples": ["conn_01JB3Y2X6Y7Z8A1B2C3D4E5F6G"],
                "pattern": "^conn_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "count_id": {
                "description": "A count id from POST /v1/counts or count_audience. Either case is accepted; responses use upper case.",
                "examples": ["cnt_7K2PQ4MAXN3R6TBY5WDZ"],
                "pattern": "^cnt_[A-Za-z2-7]{20}$",
                "type": "string"
              },
              "dedupe_against": {
                "default": "previous_orders",
                "description": "Remove records you already hold: from earlier orders, from a connected CRM, or both. Default previous_orders when signed in. crm and previous_orders_and_crm need connection_id.",
                "enum": ["none", "previous_orders", "crm", "previous_orders_and_crm"],
                "type": "string"
              },
              "field_set": {
                "description": "A field set id from GET /v1/field-sets, such as standard.",
                "pattern": "^[a-z0-9]+(_[a-z0-9]+)*$",
                "type": "string"
              },
              "licence": {
                "default": "multi_use_12m",
                "description": "multi_use_12m (12 month multi-use, every plan) or outright (1.8 credits a record, proposed).",
                "enum": ["multi_use_12m", "outright"],
                "type": "string"
              },
              "limit": {
                "description": "Records to buy; left out, the whole count.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["count_id", "field_set"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Licence": {
                "description": "Licence terms as data, on every quote, order, records page and receipt. Records stay usable, pushable and re-downloadable free until reuse_until.",
                "properties": {
                  "permitted_channels": {
                    "description": "email, telephone and post on standard terms.",
                    "items": {
                      "enum": ["email", "telephone", "post"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "resale_prohibited": {
                    "type": "boolean"
                  },
                  "reuse_until": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Order date plus 12 months; null for outright."
                  },
                  "terms_url": {
                    "description": "Where that version of the Data Licence and Sharing Agreement is published.",
                    "format": "uri",
                    "type": "string"
                  },
                  "terms_version": {
                    "description": "The version of the Data Licence and Sharing Agreement the licence is under, such as 1.0.",
                    "type": "string"
                  },
                  "type": {
                    "description": "multi_use_12m (12 month multi-use, every plan) or outright (1.8 credits a record, proposed).",
                    "enum": ["multi_use_12m", "outright"],
                    "type": "string"
                  },
                  "warranty_url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["permitted_channels", "resale_prohibited", "reuse_until", "terms_version", "type", "warranty_url"],
                "type": "object"
              },
              "Purchase": {
                "description": "How to buy the credits the order needs, worked out by one function (cheapestPurchase) everywhere a price is shown. The caller's own, like the balance: read fresh on every read of the quote.",
                "properties": {
                  "cheapest": {
                    "anyOf": [
                      {
                        "pattern": "^[a-z0-9]+(_[a-z0-9]+)*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The id of the cheapest option; null when nothing needs buying."
                  },
                  "credits_to_buy": {
                    "description": "credits_required less the balance: all of it when signed out, 0 when the balance covers the order.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "gbp_ex_vat": {
                    "description": "What the cheapest option costs, excluding VAT; 0 when nothing needs buying.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "options": {
                    "description": "Cheapest first: the per-contact scale, and the credit pack (with any rest at the scale) when it is on sale. At the same price, the option that buys more credits comes first.",
                    "items": {
                      "$ref": "#/$defs/PurchaseOption"
                    },
                    "type": "array"
                  }
                },
                "required": ["cheapest", "credits_to_buy", "gbp_ex_vat", "options"],
                "type": "object"
              },
              "PurchaseLine": {
                "description": "One thing bought: credit packs, or credits at the scale.",
                "properties": {
                  "credits": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "gbp_ex_vat": {
                    "description": "Pounds sterling excluding VAT, to two decimal places.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "id": {
                    "description": "A credit pack id, or per_contact_scale.",
                    "pattern": "^[a-z0-9]+(_[a-z0-9]+)*$",
                    "type": "string"
                  },
                  "quantity": {
                    "description": "Credit packs bought, or credits bought at the scale.",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["credits", "gbp_ex_vat", "id", "quantity"],
                "type": "object"
              },
              "PurchaseOption": {
                "description": "One way to buy the credits the order needs.",
                "properties": {
                  "credits": {
                    "description": "Credits the option buys.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "credits_left_over": {
                    "description": "Credits that stay in the balance after the order.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "gbp_ex_vat": {
                    "description": "Pounds sterling excluding VAT, to two decimal places.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "id": {
                    "description": "per_contact_scale, or the id of the credit pack the option is built on (with any rest at the scale). The same between quotes, so a choice survives a fresh quote.",
                    "pattern": "^[a-z0-9]+(_[a-z0-9]+)*$",
                    "type": "string"
                  },
                  "label": {
                    "description": "Such as 12,000 records at 22p.",
                    "type": "string"
                  },
                  "lines": {
                    "items": {
                      "$ref": "#/$defs/PurchaseLine"
                    },
                    "type": "array"
                  }
                },
                "required": ["credits", "credits_left_over", "gbp_ex_vat", "id", "label", "lines"],
                "type": "object"
              },
              "QuoteBlocker": {
                "description": "Something that stops create_order until it is fixed.",
                "properties": {
                  "code": {
                    "enum": ["insufficient_credits", "account_required", "agent_budget_exceeded", "dataset_unavailable", "count_expired"],
                    "type": "string"
                  },
                  "detail": {
                    "type": "string"
                  },
                  "top_up_url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["code", "detail"],
                "type": "object"
              },
              "QuoteSignature": {
                "description": "The signature over the machine quote's price, so an agent can hand the quote to another agent and both can check it. Verify it with the key at jwks_url.",
                "properties": {
                  "alg": {
                    "const": "ES256",
                    "type": "string"
                  },
                  "jwks_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "jws": {
                    "description": "A compact JWS whose payload is the quote's id, organisation_id, count_id, dataset_version, records, credits_required, gbp_ex_vat, licence, expires_at.",
                    "pattern": "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
                    "type": "string"
                  },
                  "kid": {
                    "description": "The signing key id in jwks_url.",
                    "type": "string"
                  }
                },
                "required": ["alg", "jwks_url", "jws", "kid"],
                "type": "object"
              },
              "Warranty": {
                "allOf": [
                  {
                    "else": {
                      "not": {
                        "properties": {
                          "threshold_percent": true
                        },
                        "required": ["threshold_percent"],
                        "type": "object"
                      },
                      "type": "object"
                    },
                    "if": {
                      "properties": {
                        "policy": {
                          "const": "replace_over_threshold_hard_bounce"
                        }
                      },
                      "required": ["policy"],
                      "type": "object"
                    },
                    "then": {
                      "properties": {
                        "threshold_percent": true
                      },
                      "required": ["threshold_percent"],
                      "type": "object"
                    }
                  }
                ],
                "description": "The bounce warranty that covers delivered records, with the threshold it was issued under.",
                "properties": {
                  "policy": {
                    "description": "replace_over_threshold_hard_bounce is the current policy: records are replaced when hard bounces exceed threshold_percent of an order. replace_any_hard_bounce_30d is proposed and not yet in force. The current policy's id replaced one that named the threshold, a change to this public enum made before v2 went live.",
                    "enum": ["replace_over_threshold_hard_bounce", "replace_any_hard_bounce_30d"],
                    "type": "string"
                  },
                  "threshold_percent": {
                    "description": "replace_over_threshold_hard_bounce only, and required there: the share of an order, in percent, that hard bounces must exceed before records are replaced. It is the threshold the document was issued under.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["policy", "url"],
                "type": "object"
              }
            },
            "description": "A machine quote: a signed price, valid 24 hours, bound to a dataset version and an organisation. create_order needs its id plus a human confirmation or a pre-authorised agent key; a confirmed flag set by a model is never consent.",
            "properties": {
              "balance_after": {
                "description": "credits_available less credits_required; negative means a top-up is needed; null when signed out.",
                "type": ["number", "null"]
              },
              "blockers": {
                "items": {
                  "$ref": "#/$defs/QuoteBlocker"
                },
                "type": "array"
              },
              "count_id": {
                "description": "The count the quote was priced from.",
                "examples": ["cnt_7K2PQ4MAXN3R6TBY5WDZ"],
                "pattern": "^cnt_[A-Z2-7]{20}$",
                "type": "string"
              },
              "created_at": {
                "format": "date-time",
                "type": "string"
              },
              "credits_available": {
                "anyOf": [
                  {
                    "description": "Credits, to one decimal place: whole at 1 credit a record, fractional only where a rule is (0.1 company-only, 1.8 outright, both proposed).",
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Your balance; null when signed out."
              },
              "credits_per_record": {
                "description": "1 for a complete UK record; 1.8 outright (proposed).",
                "minimum": 0,
                "type": "number"
              },
              "credits_required": {
                "description": "records times credits_per_record (creditsFor).",
                "minimum": 0,
                "type": "number"
              },
              "dataset": {
                "description": "The dataset an audience draws from. uk_contacts is live; ie_contacts and global_contacts are listed but not yet served.",
                "enum": ["uk_contacts", "ie_contacts", "global_contacts"],
                "type": "string"
              },
              "dataset_version": {
                "description": "The immutable weekly build a count is bound to, such as 2026-W39. The last 52 stay queryable.",
                "examples": ["2026-W39"],
                "pattern": "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$",
                "type": "string"
              },
              "expires_at": {
                "description": "24 hours after creation.",
                "format": "date-time",
                "type": "string"
              },
              "field_set": {
                "pattern": "^[a-z0-9]+(_[a-z0-9]+)*$",
                "type": "string"
              },
              "gbp_ex_vat": {
                "description": "What credits_required cost bought the cheapest way, at the per-contact scale or with credit packs, excluding VAT. The same for every caller; purchase says what this caller needs to buy.",
                "minimum": 0,
                "type": "number"
              },
              "id": {
                "description": "Format: a quote id: qte_ followed by a 26 character ULID in upper case Crockford base32, such as qte_01JB4M2R6T1Y5W8ZAK8Q2V7XN3.",
                "examples": ["qte_01JB4M2R6T1Y5W8ZAK8Q2V7XN3"],
                "pattern": "^qte_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "kind": {
                "const": "machine",
                "type": "string"
              },
              "licence": {
                "$ref": "#/$defs/Licence"
              },
              "organisation_id": {
                "anyOf": [
                  {
                    "description": "Format: an organisation id: org_ followed by a 26 character ULID in upper case Crockford base32, such as org_01JA0Q2V7XN3M9R6T1Y5W8ZAK8.",
                    "examples": ["org_01JA0Q2V7XN3M9R6T1Y5W8ZAK8"],
                    "pattern": "^org_[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The organisation the quote belongs to; create_order settles it only there. null for a quote made without an account, which the first organisation to confirm it takes."
              },
              "purchase": {
                "$ref": "#/$defs/Purchase"
              },
              "records": {
                "description": "Records after overlap and suppression; what you would receive.",
                "minimum": 0,
                "type": "integer"
              },
              "removed": {
                "description": "Records left out and never charged.",
                "properties": {
                  "already_held": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "suppressed": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["already_held", "suppressed"],
                "type": "object"
              },
              "signature": {
                "$ref": "#/$defs/QuoteSignature"
              },
              "warranty": {
                "$ref": "#/$defs/Warranty"
              }
            },
            "required": ["balance_after", "blockers", "count_id", "credits_available", "credits_per_record", "credits_required", "dataset_version", "expires_at", "gbp_ex_vat", "id", "kind", "licence", "organisation_id", "purchase", "records", "removed", "signature", "warranty"],
            "type": "object"
          },
