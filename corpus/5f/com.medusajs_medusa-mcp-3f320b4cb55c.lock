                "description": "Snake_case or kebab-case name for the new data model and module — derive it from the noun the user wants to attach to products. Examples: user says \"set the brand of a product\" → \"brand\"; \"add a preorder window\" → \"preorder\"; \"store the supplier per product\" → \"supplier\"; \"product reviews and ratings\" → \"review\"; \"B2B quote per variant\" → \"b2b_quote\"; \"downloadable digital asset\" → \"digital_asset\". Pick a name whose Medusa-pluralized form reads naturally if the link will be one-to-many. If the user has not named the extension explicitly, infer the most natural noun from their request and proceed.",
                "type": "string"
              }
            },
            "required": ["extension_name"],
            "type": "object"
