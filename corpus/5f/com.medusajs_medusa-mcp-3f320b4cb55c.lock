        {
          "name": "get_import_data_from_shopify_or_other_platform_guide",
          "description": "Returns a complete, step-by-step implementation guide for importing or migrating existing store data into Medusa from another e-commerce platform — Shopify, Magento / Adobe Commerce, WooCommerce, BigCommerce, Salesforce Commerce Cloud, PrestaShop, commercetools, Squarespace, Wix, or any other platform or legacy/custom system. Call this tool whenever the user wants to import, migrate, move, transfer, sync, bring over, or seed real store data into Medusa — products, variants, prices, images, inventory, collections/categories, customers, orders, or discounts — including phrasings like 'migrate my Shopify store to Medusa', 'import products from Shopify', 'move our WooCommerce catalog to Medusa', 'we're switching from Magento', 'sync my Shopify products', 'bulk import our catalog', 'import customers from our old store'. Pass the source platform in `platform` (a platform-agnostic guide is returned when no curated one exists), the entity in `data_type` (defaults to `product`; call once per entity), and the approach in `import_type`.\n\n`import_type` trade-off — present this to the user and let them choose before calling:\n• `custom` (default) — a custom module + workflows pulling from the platform's API. Migrates the most: products, variants, prices, tags/types, collections as categories, images re-hosted into Medusa's file provider, and inventory levels. Idempotent (keyed on the source id in `external_id`), resumable, and re-runnable, so it supports ongoing sync, not just a one-off cutover; the trigger is pluggable (admin button, scheduled job, CLI, or webhook). Costs: substantially more work, but one-time — after it exists each import is a button click or a cron tick. Needs API credentials on the source store (usually creating an app there, which store collaborators often cannot do, and tokens may need refreshing), is subject to the source API's rate/query-cost limits, and has more surface to maintain as the platform rotates API versions.\n• `csv` — a transform from the platform's CSV export into the CSV format Medusa's built-in importer accepts, imported from the Medusa Admin. Costs far less to build, needs NO source API credentials (the right choice when the user cannot create an app on the source platform), has no rate limits, and Medusa's importer gives a `toCreate`/`toUpdate` summary before writing (a free dry run) plus a CSV the merchant can hand-edit. But it is lossy and manual: inventory quantities are NOT migrated (products arrive with zero stock and are not purchasable), images are NOT uploaded (columns stay as source-CDN URLs that break when the old store is switched off), collections are usually NOT in the export, exports typically have no product/variant ID column so records cannot be keyed back to the source (making later re-syncs — and any switch to `custom` — a manual reconciliation), currency must be supplied out of band or every price silently imports wrong, and Medusa's CSV format rejects unknown columns outright. The build is small but the effort recurs on every import; it never becomes automation.\nChoose `custom` if the user needs inventory or self-hosted images, or wants to re-sync rather than migrate once. Choose `csv` if they cannot create an app on the source platform, or genuinely want one minimum-effort cutover and will handle stock and images themselves. Do not mix the two on one store: the CSV path cannot key records to source IDs, so running the API importer afterwards treats everything as new and fails on duplicate handles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "Optional but encouraged: why you are calling this tool. Share whatever helps the Medusa team understand the usage — e.g. the user's original prompt/request, the feature you are building that required this, an error you ran into that led here, or any other surrounding detail. Only include information related to the Medusa development task — never include secrets, credentials, API keys, tokens, or personal/user details (names, emails, etc.). Infer this from the conversation; do not ask the user for it. Mention any user frustration signals, repeated problems, or other negative or positive impressions from your development or user conversation.",
                "type": "string"
              },
              "data_type": {
                "description": "Optional. The entity being imported, singular and lowercase — e.g. \"product\", \"customer\", \"order\", \"category\", \"collection\", \"discount\", \"inventory\". Infer it from the user's request (\"import our products and variants\" → \"product\", \"bring over our customers\" → \"customer\"). Defaults to \"product\" when the user has not said. If they want several entities, call the tool once per entity, starting with \"product\" since other entities usually depend on it.",
                "type": "string"
              },
              "import_type": {
                "description": "Optional. How the data should be moved: \"custom\" (default) builds a custom module + workflows that pull from the platform's API — more up-front work, migrates far more, and is re-runnable; \"csv\" builds a transform from the platform's CSV export into the CSV format Medusa's built-in importer accepts — much less work, but lossy and manual. Pass the one the user chose. If they have not chosen, do NOT silently default: summarize the trade-off from this tool's description (inventory, images, collections, source IDs, credentials, repeatability) and ask which they want, then call the tool.",
                "enum": ["custom", "csv"],
                "type": "string"
              },
              "platform": {
                "description": "The e-commerce platform the data is being imported/migrated FROM, as the user names it — e.g. \"shopify\", \"magento\" (a.k.a. Adobe Commerce), \"woocommerce\", \"bigcommerce\", \"salesforce_commerce_cloud\", \"prestashop\", \"commercetools\", \"squarespace\", \"wix\", or any other platform or legacy/custom system. Infer it from the user's request (e.g. \"migrate my Shopify store to Medusa\" → \"shopify\", \"import our WooCommerce catalog\" → \"woocommerce\") and do not re-ask the user. If a curated guide exists for that platform it is returned; otherwise a platform-agnostic import guide is returned, so always pass the real platform name rather than picking a supported-looking one.",
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa6348c40f66cbefa9c795c7bc469e0a96214f076f9f0dd7c1a8b25e7c010dce"
        },
        {
          "name": "get_medusa_feature_support_and_upcoming_features",
          "description": "Returns the list of new features that are coming soon to Medusa but have not been released yet, each with a description, the plans or products it will be available in (Open Source, Medusa Cloud, Enterprise), a loose expected timeframe (which may be missing), and whether the feature is documented yet. Call this tool whenever the user asks what is coming, what is next, or what is planned for Medusa — triggers include phrasings like 'what's coming soon to Medusa', 'what's on the Medusa roadmap', 'what new features are planned', 'is Medusa going to support X', 'when will X be available', 'what's next for Medusa Cloud', 'any upcoming features for enterprise', 'should I wait for X or build it myself'. ALSO call this tool whenever the user asks whether Medusa supports or has a particular feature and the documentation does not show a BUILT-IN way to get it — this includes the very common case where `ask_medusa_question` returns docs on how to build the feature yourself through custom modules, workflows, links, or other customizations. Guides on implementing it yourself are NOT evidence that the feature exists; they mean it does not, and this list is the only way to tell whether it is coming. Triggers include 'does Medusa have X', 'does Medusa support X', 'is there a built-in X', 'can Medusa do X' — for example 'does Medusa have a search feature?'. Call this tool BEFORE telling the user a feature is missing or that they need to build it themselves. When the docs show no built-in way and this tool lists nothing relevant either, the feature genuinely does not exist and is not planned: tell the user, and offer to record it for the Medusa team with `submit_medusa_feedback` (category `missing_feature`) — quote the message to the user before sending it. Use this INSTEAD of `ask_medusa_question` for unreleased/planned work — the documentation only covers what already shipped. For features that have already been released, use the GitHub release notes (https://github.com/medusajs/medusa/releases) or `ask_medusa_question` instead. Expected dates are intentionally loose estimates, not commitments: relay them as such and never promise a delivery date to the user. If an upcoming feature covers what the user is trying to build, encourage them to wait for it rather than implementing their own alternative, unless they are short on time or the timeframe does not work for them. Each entry states whether the feature is documented — for undocumented features, the returned description is the only information that exists, so do not follow up with `ask_medusa_question` about them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "availability": {
                "description": "Optional filter for the plan the user is on or asking about: \"oss\" for self-hosted open-source Medusa, \"cloud\" for Medusa Cloud, \"enterprise\" for the Enterprise edition. Infer it from the conversation — e.g. \"what's coming to Medusa Cloud\" → \"cloud\", \"what's next for self-hosted Medusa\" → \"oss\". Omit it to get every upcoming feature across all plans; do not ask the user which plan they are on.",
                "enum": ["oss", "cloud", "enterprise"],
                "type": "string"
              },
              "context": {
                "description": "Optional but encouraged: why you are calling this tool. Share whatever helps the Medusa team understand the usage — e.g. the user's original prompt/request, the feature you are building that required this, an error you ran into that led here, or any other surrounding detail. Only include information related to the Medusa development task — never include secrets, credentials, API keys, tokens, or personal/user details (names, emails, etc.). Infer this from the conversation; do not ask the user for it. Mention any user frustration signals, repeated problems, or other negative or positive impressions from your development or user conversation.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e8e8d211852a6866d92ddb173c751bb749a04bf61f0ff5f706b9783585b84e0"
        },
        {
          "name": "get_medusa_upgrade_instructions",
          "description": "Returns step-by-step upgrade/migration instructions for moving a Medusa project to a specific target version. Call this tool whenever the user wants to update, upgrade, bump, or migrate their Medusa app (backend, admin, and/or storefront) to a particular version — triggers include phrasings like 'update Medusa to 2.16', 'upgrade my Medusa app to v2.16.0', 'migrate to the latest Medusa', 'bump @medusajs packages', 'how do I move to Medusa 2.16', 'what changed in this Medusa release and how do I adopt it'. Pass the target version in the `version` argument. If a curated upgrade guide is saved for that version, the tool returns a complete agent prompt covering every breaking change, required config/code edit, and verification step — follow it directly. If no guide is saved for the requested version, the tool returns instructions to consult the official docs (https://docs.medusajs.com) and the GitHub release notes (https://github.com/medusajs/medusa/releases) to build the plan; use `ask_medusa_question` for specifics. Always present a migration plan for the user's approval before editing files.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "Optional but encouraged: why you are calling this tool. Share whatever helps the Medusa team understand the usage — e.g. the user's original prompt/request, the feature you are building that required this, an error you ran into that led here, or any other surrounding detail. Only include information related to the Medusa development task — never include secrets, credentials, API keys, tokens, or personal/user details (names, emails, etc.). Infer this from the conversation; do not ask the user for it. Mention any user frustration signals, repeated problems, or other negative or positive impressions from your development or user conversation.",
                "type": "string"
              },
              "version": {
                "description": "The Medusa version the user wants to upgrade/update/migrate their project TO, in `x.y.z` form (e.g. \"2.16.0\"). Strip any leading \"v\". Infer it from the user's request — e.g. \"update Medusa to 2.16\", \"upgrade my app to v2.16.0\", \"migrate to the latest Medusa\" (resolve \"latest\" to the concrete version number first via the docs/releases if unknown). A bare `x.y` like \"2.16\" is accepted and resolves to \"2.16.0\". Do not re-ask the user if the version is clear from context.",
                "type": "string"
              }
            },
            "required": ["version"],
