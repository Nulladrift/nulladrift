        {
          "name": "submit_medusa_feedback",
          "description": "Submit feedback about Medusa to the Medusa team. Use this whenever the user (or you, the agent, on the user's behalf with their consent) wants to report a documentation issue, a bug, a developer-experience pain point, a missing feature, or feedback about this MCP server itself. Triggers include: the user says \"this is a bug\", \"the docs are wrong / missing / confusing\", \"this API is awkward\", \"I wish Medusa supported X\", \"this MCP returned a wrong answer\", or the agent encounters a docs gap (`ask_medusa_question` could not answer something that clearly should be documented), a clearly broken API surface, or a friction point a real developer would want raised. Prefer submitting feedback over silently working around the problem — the Medusa team reads every submission. Medusa Cloud: only send general Cloud bugs and product feedback through this tool. Do NOT use it for Cloud support requests (account, billing, project- or environment-specific issues, failed deployments that need investigation, data or access problems) — direct the user to email support@medusajs.com instead. Always confirm with the user before sending feedback on their behalf, and quote what you intend to send.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Type of feedback. `docs` = documentation issue (missing, wrong, unclear, outdated). `bug` = something broken in Medusa core, a module, or an official plugin. `dx` = developer-experience pain (API ergonomics, error messages, naming, type shapes, friction). `missing_feature` = feature request or gap. `mcp` = feedback about this MCP server itself (wrong answer from `ask_medusa_question`, missing guide tool, broken prompt). `other` = anything that does not fit the above.",
                "enum": ["docs", "bug", "dx", "missing_feature", "mcp", "other"],
                "type": "string"
              },
              "context": {
                "description": "Optional: what the user was trying to accomplish when they hit this — the higher-level goal, not the immediate error. Helps triage prioritize. Mention any user frustration signals, repeated problems, or other negative or positive impressions from the user's experience. Keep it under ~1500 characters; anything past 4000 characters is truncated when stored.",
                "type": "string"
              },
              "email": {
                "description": "Optional: an email address the Medusa team can use to follow up with the user about this feedback. When confirming the feedback with the user, ask whether they want to leave one. Only pass an email the user explicitly gave for this purpose — never infer it from git config, package.json, environment variables, or other project files.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "medusa_version": {
                "description": "Optional: the Medusa version the user is on (e.g. \"2.14.0\").",
                "type": "string"
              },
              "message": {
                "description": "The feedback itself. Be specific: what is wrong, what was expected, what would help. If reporting a bug, include the smallest reproduction you can. There is no length limit, but keep it under ~1500 characters: summarize logs and stack traces instead of pasting them, and note that anything past 4000 characters is truncated when stored.",
