        {
          "name": "calculate_physical_ai_roi",
          "title": "Calculate the ROI and TCO of a robot fleet",
          "description": "Run the Physical AI calculator's own 36-month model: manual vs robotic TCO, annual savings, upfront investment, payback month, ROI, coverage, supervision and incidents, plus payback sensitivity to hourly cost, capex, coverage, integration, maintenance and uptime. Every input is optional; use_case applies a published preset first. The response lists the assumptions with their evidence level and the fields_to_validate that are still editorial defaults — tell the user to replace them. Orientative, undiscounted, single currency; not a quote. Use this for the cost, savings or payback of a robot fleet; for an AI-agent business case use calculate_agent_economics.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cost_per_incident": {
                "description": "Average cost of one incident, in the chosen currency.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "days_per_year": {
                "description": "Operating days per year.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "error_rate_pct": {
                "description": "% of tasks (≈ one per labour hour) that end in an incident.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "fleet": {
                "additionalProperties": false,
                "description": "Per robot class; any field omitted keeps its default.",
                "properties": {
                  "humanoid": {
                    "additionalProperties": false,
                    "properties": {
                      "capex": {
                        "description": "Purchase price per unit, incl. dock or base station.",
                        "maximum": 100000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "count": {
                        "description": "Units of this class in the fleet.",
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "hours_per_day": {
                        "description": "Labour hours per day one unit can take over, before uptime.",
                        "maximum": 24,
                        "minimum": 0,
                        "type": "number"
                      },
                      "maintenance_pct": {
                        "description": "Annual maintenance as % of capex.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "software_per_year": {
                        "description": "Software / fleet-management subscription per unit and year.",
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "quadruped": {
