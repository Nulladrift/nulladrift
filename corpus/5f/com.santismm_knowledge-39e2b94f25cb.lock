          "title": "La terre des Cyclopes",
          "description": "Là où Ulysse perd six hommes et aveugle Polyphème. Deux traditions la situent sur des côtes volcaniques — la Sicile et la Campanie — et le poème ne la situe nulle part en particulier, de manière délibérée.",
          "mimeType": "application/json",
          "digest": "sha256:85f0bedd6d8c5f67acfab8e4c61c681275baaad53addf0da00cd70ec999dacc6"
