          "name": "homeric/places/mount-ida@pt",
          "title": "Monte Ida",
          "description": "A montanha de onde os deuses observam a guerra e uma peça de topografia real que ancora a paisagem da Ilíada: é visível de Hisarlık, e dela descem os rios da planície.",
          "mimeType": "application/json",
          "digest": "sha256:172630c55e2449aefda1048e35bc3f69196ccc9c49337d214fb937fc14943e75"
        },
        {
