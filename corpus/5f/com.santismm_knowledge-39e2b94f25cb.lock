          "name": "homeric/places/aeaea@de",
          "title": "Aiaia",
          "description": "Kirkes Insel, auf der die Gefährten in Schweine verwandelt werden und auf der Odysseus erfährt, wie er das Reich der Toten erreicht. Die römische Tradition verortete sie auf einer Landzunge, die nur wie eine Insel aussieht.",
