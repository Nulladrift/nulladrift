          "title": "O cavalo de madeira e a queda de Troia",
          "description": "O episódio mais conhecido da guerra não é narrado em nenhum dos dois poemas: a Odisseia faz um aedo cantá-lo em vinte versos. Sua localização é a mais segura do atlas; sua historicidade, a menos.",
          "mimeType": "application/json",
          "digest": "sha256:add456623dc37005d28da7ac676c01e4ce7d643c7dc0c588e3642da294fe3556"
