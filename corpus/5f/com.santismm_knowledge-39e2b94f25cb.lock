          "uri": "santismm://knowledge/de/context-engineering",
          "name": "knowledge/context-engineering@de",
          "title": "Was ist Context Engineering?",
          "description": "Context Engineering ist die Disziplin der Entscheidung, welche Informationen in jedem Schritt in das begrenzte Kontextfenster eines Modells gelangen – und welche draußen bleiben. Da Agenten über viele Schritte hinweg laufen, verschlechtert das naive Einfügen aller Daten in den Ko",
          "mimeType": "application/json",
          "digest": "sha256:1aacaf5041faa1e6f47f400ab195c31f229a6b7fa5b94b2219c5772f4844e555"
        },
        {
          "uri": "santismm://knowledge/en/context-engineering",
          "name": "knowledge/context-engineering@en",
          "title": "What is Context Engineering?",
          "description": "Context engineering is the discipline of deciding what information enters a model's limited context window at each step — and what stays out. As agents run over many steps, naively stuffing everything into context degrades quality and cost. Context engineering curates the right i",
          "mimeType": "application/json",
          "digest": "sha256:bbef81e7cb601d79651c270decb8cf503c8233aefe865a8bd2a1c3994d75d7b5"
        },
        {
          "uri": "santismm://knowledge/es/context-engineering",
          "name": "knowledge/context-engineering@es",
          "title": "¿Qué es la Ingeniería de Contexto (Context Engineering)?",
          "description": "La ingeniería de contexto es la disciplina de decidir qué información entra en la ventana de contexto limitada de un modelo en cada paso, y qué se queda fuera. Como los agentes se ejecutan en muchos pasos, meter todo ingenuamente en el contexto degrada calidad y coste. La ingenie",
          "mimeType": "application/json",
          "digest": "sha256:7c0fd7705957af0f540065871663153f772946c613fb5be5112c9a7378ce6b88"
        },
        {
          "uri": "santismm://knowledge/fr/context-engineering",
          "name": "knowledge/context-engineering@fr",
          "title": "Qu'est-ce que l'ingénierie de contexte ?",
          "description": "L'ingénierie de contexte est la discipline qui consiste à décider quelles informations entrent dans la fenêtre de contexte limitée d'un modèle à chaque étape — et lesquelles en sont exclues. À mesure que les agents enchaînent les étapes, intégrer naïvement toutes les données dans",
          "mimeType": "application/json",
          "digest": "sha256:aeb9bf364ff5437fa3e5c30c85fe81c23e21a7c02a9699b272af45237aa60f27"
        },
        {
          "uri": "santismm://knowledge/ja/context-engineering",
          "name": "knowledge/context-engineering@ja",
          "title": "コンテキストエンジニアリングとは何ですか？",
          "description": "コンテキストエンジニアリングとは、モデルの限られたコンテキストウィンドウに各ステップでどの情報を入れ、どの情報を除外するかを決定する技術分野です。エージェントが多くのステップを実行する際、単純にすべてをコンテキストに詰め込むと、品質が低下しコストが増大します。コンテキストエンジニアリングは、適切な指示、取得された知識、ツールの結果、およびメモリを厳選し、モデルが必要な時に必要なものを正確に得られるようにします。これはハーネスエンジニアリングの中核となる部分です。",
          "mimeType": "application/json",
          "digest": "sha256:6331fe672c04176ed72261c7222e3da74bab1b23226f91690185fefbcf9fad96"
        },
        {
          "uri": "santismm://knowledge/pt/context-engineering",
          "name": "knowledge/context-engineering@pt",
          "title": "O que é Engenharia de Contexto (Context Engineering)?",
          "description": "A engenharia de contexto é a disciplina de decidir qual informação entra na janela de contexto limitada de um modelo a cada passo, e o que fica de fora. Como os agentes rodam em muitos passos, enfiar tudo ingenuamente no contexto degrada qualidade e custo. A engenharia de context",
          "mimeType": "application/json",
          "digest": "sha256:29e801fc4ccbe83331580d2dfc059027a7ea783d7795932f5f14d6a0d30735dc"
        },
        {
          "uri": "santismm://knowledge/zh/context-engineering",
          "name": "knowledge/context-engineering@zh",
          "title": "什么是上下文工程？",
          "description": "上下文工程是一门决定在每一步中哪些信息进入模型有限的上下文窗口，以及哪些信息被排除在外的学科。随着智能体运行多个步骤，盲目地将所有内容塞入上下文中会降低质量并增加成本。上下文工程通过策划正确的指令、检索到的知识、工具结果和记忆，使模型在需要时恰好拥有其所需的内容。它是 Harness Engineering 的核心部分。",
          "mimeType": "application/json",
          "digest": "sha256:2acc7e299c2790452a5da2f4802392ac5a89470335262f556f54587d011e1adc"
        },
        {
