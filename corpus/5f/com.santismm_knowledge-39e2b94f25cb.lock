          "mimeType": "application/json",
          "digest": "sha256:7f096d832a3bf6fcfb5f70095b3ac1cca9feb4b50cd7cd38a35c382268cdbc7e"
        },
        {
          "uri": "santismm://knowledge/en/embeddings",
          "name": "knowledge/embeddings@en",
          "title": "What are Embeddings & Vector Search?",
