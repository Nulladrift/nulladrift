          "description": "La montagne depuis laquelle les dieux observent la guerre, et un élément de topographie réelle qui ancre le paysage de l'Iliade : elle est visible depuis Hisarlık, et les fleuves de la plaine y prennent leur source.",
          "mimeType": "application/json",
          "digest": "sha256:42be63b49eda1184640416a3fd499e2ffe6a8cc8fd4ef75d64878c97f6ca0919"
