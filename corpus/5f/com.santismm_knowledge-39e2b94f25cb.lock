          "name": "homeric/places/egypt@pt",
          "title": "Egito",
          "description": "A borda distante do mundo real dos poemas. Menelau é levado para lá pelo vento e volta rico; as vidas inventadas de Odisseu também passam por ali, porque é para onde iria uma mentira verossímil sobre viagens duras.",
