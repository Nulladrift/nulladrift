        {
          "name": "calculate_agent_economics",
          "title": "Calculate the operational economics of an AI agent",
          "description": "Calculate monthly operating cost, cost per verified outcome, manual baseline, savings, ROI and break-even success rate from explicit assumptions. Use this for an agent business case or scenario comparison; keep every monetary input in the same currency and cite the returned canonical_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hourlyCost": {
                "description": "Fully loaded human hourly cost, in the chosen currency.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "inputPrice": {
                "description": "Model input price per million tokens, in the chosen currency.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "inputTokens": {
                "description": "Input tokens per agent attempt.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "locale": {
                "description": "Language for interpretations, assumptions, formulas and warnings. The Labs execution service currently resolves fr/de/ja/zh to English and reports that fallback.",
                "enum": ["en", "es", "pt", "fr", "de", "ja", "zh"],
                "type": "string"
              },
              "manualMinutes": {
                "description": "Manual handling time per case.",
                "maximum": 10080,
                "minimum": 0,
                "type": "number"
              },
              "monthlyVolume": {
                "description": "Cases attempted per month.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "outputPrice": {
                "description": "Model output price per million tokens, in the chosen currency.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "outputTokens": {
                "description": "Output tokens per agent attempt.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "retryRate": {
                "description": "Extra attempts as a percentage of initial volume.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "reviewMinutes": {
                "description": "Human review minutes per reviewed case.",
                "maximum": 10080,
                "minimum": 0,
                "type": "number"
              },
              "reviewRate": {
                "description": "Share of cases reviewed by a person.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "reworkMinutes": {
                "description": "Human rework minutes per failed case.",
                "maximum": 10080,
                "minimum": 0,
                "type": "number"
              },
              "successRate": {
                "description": "Correctly verified outcomes as a percentage of cases.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "toolCost": {
