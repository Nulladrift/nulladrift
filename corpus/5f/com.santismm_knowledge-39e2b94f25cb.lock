          "digest": "sha256:9d0e3fa4c617d9ed9bbda54b23272b95c6c542a996e3ca4f766f99910e5d3c8e"
        },
        {
          "uri": "santismm://homeric/places/de/mycenae",
          "name": "homeric/places/mycenae@de",
          "title": "Mykene",
          "description": "Die Stadt Agamemnons und die einzige homerische Hauptstadt, die nie gesucht werden musste: Die Zitadelle war während der gesamten Antike oberirdisch sichtbar und gibt der gesamten bronzezeitlichen Zivilisation ihren Namen.",
          "mimeType": "application/json",
          "digest": "sha256:a13e017fa24f3b81a6255807e0d8ffea4f2c4e0e6b37b44636113e46c122cde1"
        },
        {
          "uri": "santismm://homeric/places/en/mycenae",
          "name": "homeric/places/mycenae@en",
          "title": "Mycenae",
          "description": "Agamemnon's city, and the one Homeric capital that never had to be found: the citadel was visible above ground throughout antiquity and gives its name to the entire Bronze Age civilisation.",
          "mimeType": "application/json",
          "digest": "sha256:a2b1b3145932ba13130d6ec32133aa720fb2ac79f57fde9269b55229645566b5"
        },
        {
          "uri": "santismm://homeric/places/es/mycenae",
          "name": "homeric/places/mycenae@es",
          "title": "Micenas",
          "description": "La ciudad de Agamenón y la única capital homérica que nunca hubo que encontrar: la ciudadela estuvo siempre visible sobre el terreno y da nombre a toda la civilización de la Edad del Bronce.",
