        {
          "uri": "santismm://knowledge/ja/reasoning-models",
          "name": "knowledge/reasoning-models@ja",
          "title": "推論モデルとは？",
          "description": "推論モデルとは、回答する前に「思考」するために追加の計算処理を行うようトレーニングされた言語モデルです。数学、コーディング、論理におけるより困難な問題を解決するために、内部的な推論ステップを生成します。複雑で複数ステップに及ぶタスクにおいて、レイテンシーとコストを引き換えに精度を向上させます。重要なアイデアは「テスト時計算（test-time compute）」です。モデルのサイズを大きくするだけでなく、推論時により長く推論を行わせることで、結果を大幅に改善できます。",
          "mimeType": "application/json",
          "digest": "sha256:edb22b53c94d6fc0f10bfb8e1f70e74aa62cb065a90f647716cf9214bfc16608"
