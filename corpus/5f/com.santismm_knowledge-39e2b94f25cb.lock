          "description": "Die bekannteste Episode des Krieges wird in keinem der beiden Epen direkt erzählt: In der Odyssee lässt ein Sänger sie in zwanzig Versen besingen. Ihr Schauplatz ist der sicherste im Atlas, ihre Historizität der unsicherste.",
