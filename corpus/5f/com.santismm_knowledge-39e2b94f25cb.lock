          "name": "homeric/places/mount-ida@de",
          "title": "Berg Ida",
          "description": "Der Berg, von dem aus die Götter den Krieg beobachten, und ein Stück realer Topografie, das die Landschaft der Ilias verankert: Er ist von Hisarlık aus sichtbar, und die Flüsse der Ebene entspringen dort.",
