          "name": "search_all",
          "title": "Search every SANTISMM knowledge surface",
          "description": "Search the core corpus, first-party essays, executable Labs, epistemic claims, the Homeric Atlas, the AI benchmarks (professions and benchmark catalogue) and Physical AI (robot platforms, documented deployments, deployment guide) in one call. Use this first when a natural-language question might require a calculation, a long-form essay, a claim audit or a model choice rather than only a core knowledge unit. Results name the next tool to call; calculator-shaped questions are routed toward Labs, 'which AI model for…' questions toward the benchmarks, and robotics questions toward Physical AI.",
