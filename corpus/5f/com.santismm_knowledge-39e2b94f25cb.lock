          "description": "Agentic AIとは、単一の回答を生成するのではなく、計画、ツールの呼び出し、環境への働きかけ、フィードバックへの対応など、複数のステップにわたって目標を追求するシステムを指す。これにより、言語モデルはテキスト生成器から、タスクを完了できる実行者へと変化する。これが表すシフトは、人間がすべてのステップを主導する「DIY（Do-It-Yourself）ソフトウェア」から、システムが作業を実行して報告する「DIFM（Do-It-For-Me）ソフトウェア」への移行である。",
