          "name": "homeric/places/mount-ida@zh",
          "title": "伊达山",
          "description": "众神观看战争的山峰，也是奠定《伊利亚特》景观基础的真实地形：从希萨尔利克（Hisarlık）可以看到它，平原上的河流也发源于此。",
