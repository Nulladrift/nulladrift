          "description": "Onde Odisseu perde seis homens e cega Polifemo. Duas tradições a situam em costas vulcânicas — Sicília e Campânia — e o poema não a situa em parte alguma concreta, de propósito.",
          "mimeType": "application/json",
          "digest": "sha256:910d85b0d1d24b55bcd310c2888e149b05b30659a93c586f7e81cabc8380fe92"
        },
        {
