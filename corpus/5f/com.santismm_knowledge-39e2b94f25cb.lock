          "name": "homeric/episodes/the-sirens@de",
          "title": "Die Sirenen",
          "description": "Die einzige Gefahr, die Odysseus durch vorausschauende Planung überlebt: Wachs in den Ohren der Mannschaft, sein eigener Körper an den Mast gefesselt und der Gesang, den ein Mann hört, der nicht danach handeln kann.",
