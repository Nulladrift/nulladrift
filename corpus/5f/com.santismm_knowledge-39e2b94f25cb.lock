        {
          "uri": "santismm://knowledge/pt/reasoning-models",
          "name": "knowledge/reasoning-models@pt",
          "title": "O que são Modelos de Raciocínio (Reasoning Models)?",
          "description": "Os modelos de raciocínio são modelos de linguagem treinados para gastar computação extra 'pensando' antes de responder, gerando passos de raciocínio internos para resolver problemas mais difíceis de matemática, código e lógica. Trocam latência e custo por precisão em tarefas comp",
          "mimeType": "application/json",
          "digest": "sha256:81875b9eb44f9a267bb7c78d978fd51a757381bb7d2e6d7bfebf8e38cc863f47"
        },
        {
          "uri": "santismm://knowledge/zh/reasoning-models",
          "name": "knowledge/reasoning-models@zh",
          "title": "什么是推理模型？",
          "description": "推理模型是经过训练的语言模型，在回答前会消耗额外的计算资源进行“思考”——生成内部推理步骤以解决数学、代码和逻辑方面的更难问题。它们在复杂的多步任务中以延迟和成本换取准确性。其核心思想是测试时计算（test-time compute）：让模型在推理时进行更长时间 of 推理，而不仅仅是把模型做大，这可以显著改善结果。",
          "mimeType": "application/json",
          "digest": "sha256:55c33ffce8713923fe95660ac52af706d1a79766be8b06e69bf139f609dd2942"
