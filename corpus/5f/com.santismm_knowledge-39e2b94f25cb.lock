          "name": "homeric/places/land-of-the-lotus-eaters@en",
          "title": "The land of the Lotus-eaters",
          "description": "The first stop after the storm, and the first temptation: a people whose fruit makes visitors forget the way home. Ancient geography put them on the Libyan coast, at Djerba.",
          "mimeType": "application/json",
