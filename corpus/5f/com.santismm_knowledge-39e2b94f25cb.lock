          "title": "El caballo de madera y la caída de Troya",
          "description": "El episodio más conocido de la guerra no se narra en ninguno de los dos poemas: la Odisea hace que un aedo lo cante en veinte versos. Su localización es la más segura del atlas; su historicidad, la menos.",
