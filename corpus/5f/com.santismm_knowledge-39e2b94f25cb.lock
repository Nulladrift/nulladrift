          "title": "The land of the Cyclopes",
          "description": "Where Odysseus loses six men and blinds Polyphemus. Two traditions place it on volcanic coasts — Sicily and Campania — and the poem places it nowhere in particular, on purpose.",
          "mimeType": "application/json",
          "digest": "sha256:33f182c5cf4f84771951880293355040c244cac68da0673f65b8b53ad60fa8f7"
        },
        {
