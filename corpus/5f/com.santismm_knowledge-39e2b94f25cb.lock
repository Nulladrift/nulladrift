          "title": "エジプト",
          "description": "詩篇における現実世界の最果て。メネラオスは風に流されてそこへ至り、富を得て帰郷する。オデュッセウスの作り話の経歴もそこを舞台にしている。過酷な旅に関するもっともらしい嘘の行き先として、そこが最適だからである。",
