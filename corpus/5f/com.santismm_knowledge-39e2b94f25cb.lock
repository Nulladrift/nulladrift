          "title": "独眼巨人之地",
          "description": "奥德修斯在此失去了六名部下并刺瞎了波吕斐摩斯。两种传统将其置于火山海岸——西西里和坎帕尼亚——而诗作则故意没有将其置于任何具体的地点。",
          "mimeType": "application/json",
          "digest": "sha256:916ea4a30a8ba96919eb6a27bdead1b01f0c0bb20bf1fe177ac79ce052fd8da6"
        },
        {
