          "description": "冥界の噂を持つ実在の川であり、ホメロスのハデス（冥界）の入り口と最も頻繁に混同される場所。この地図帳では両者を区別している。この場所はここにあり、あちらの場所はここにはない。",
          "mimeType": "application/json",
          "digest": "sha256:96b05797abc1946ded39cd2ba0aba6e9278deacd9d04d22e6f851147949ba299"
        },
        {
          "uri": "santismm://homeric/places/pt/ephyra-acheron",
          "name": "homeric/places/ephyra-acheron@pt",
          "title": "Éfira e o Aqueronte",
          "description": "Um rio real com fama de submundo e o sítio mais confundido com a entrada do Hades homérico. O atlas os mantém separados: este lugar está aqui; aquele, não.",
          "mimeType": "application/json",
          "digest": "sha256:f9511e26ab12976a4aeda5b143e16b9865fe7a4b3d2a8e31e5e2badb847a46f6"
        },
        {
          "uri": "santismm://homeric/places/zh/ephyra-acheron",
          "name": "homeric/places/ephyra-acheron@zh",
          "title": "埃菲拉与阿刻戎河",
          "description": "一条拥有冥界名声的真实河流，也是最常与荷马史诗中哈迪斯（Hades）入口混淆的遗址。本图册将它们区分开来：这个地方在这里，而那个地方不在这里。",
          "mimeType": "application/json",
          "digest": "sha256:11249e683537a9cbe9318d2475888cb5cfe3e92ca9842f4069bccaee70e0dd3d"
        },
        {
          "uri": "santismm://homeric/places/de/hellespont",
          "name": "homeric/places/hellespont@de",
          "title": "Der Hellespont",
          "description": "Die Meerenge neben dem Krieg. Die Schiffe der Achäer sind dort am Strand aufgereiht, Achilleus' Leichenspiele werden dort abgehalten, und ihre Strömung ist der plausibelste wirtschaftliche Grund dafür, dass Troja überhaupt existierte.",
          "mimeType": "application/json",
          "digest": "sha256:77d3c363d0b30314be8829d53bba95c7e2174a6e93c74755e72841fd28f6675d"
        },
        {
          "uri": "santismm://homeric/places/en/hellespont",
          "name": "homeric/places/hellespont@en",
          "title": "The Hellespont",
          "description": "The strait beside the war. The Achaean ships are beached on it, Achilles' funeral games are held by it, and its current is the most plausible economic reason for Troy to have existed at all.",
          "mimeType": "application/json",
          "digest": "sha256:0c9e4484022efbd0d7ec52fb5d0ee4713590fe8b284620e83b275d7dba0e79eb"
        },
        {
          "uri": "santismm://homeric/places/es/hellespont",
          "name": "homeric/places/hellespont@es",
          "title": "El Helesponto",
          "description": "El estrecho junto a la guerra. Las naves aqueas están varadas en él, los juegos fúnebres de Aquiles se celebran a su lado y su corriente es la razón económica más plausible de que Troya existiera.",
          "mimeType": "application/json",
          "digest": "sha256:61a0d35ed3db48a721194d260c7c9bc6e3d1addf70f6425efa3aeefac626ac59"
        },
        {
          "uri": "santismm://homeric/places/fr/hellespont",
          "name": "homeric/places/hellespont@fr",
          "title": "L'Hellespont",
          "description": "Le détroit au cœur de la guerre. Les navires achéens y sont échoués, les jeux funéraires d'Achille s'y déroulent, et son courant est la raison économique la plus plausible de l'existence même de Troie.",
          "mimeType": "application/json",
          "digest": "sha256:3ee733153b6954dad3a556c02f0a7865b6410caf2dfbdb46925bcec00650aaeb"
        },
        {
          "uri": "santismm://homeric/places/ja/hellespont",
          "name": "homeric/places/hellespont@ja",
          "title": "ヘレスポントス",
          "description": "戦争の傍らにある海峡。アカイア人の船がその岸辺に引き揚げられ、アキレウスの葬儀の競技がその傍らで開催される。その潮流こそが、トロイがそもそも存在したことに対する最も説得力のある経済的理由である。",
          "mimeType": "application/json",
          "digest": "sha256:5c7de55548ce6cf22b62cb17842880fdf706d3d64b1ee2d1005a4eb146f1e9d5"
        },
        {
          "uri": "santismm://homeric/places/pt/hellespont",
          "name": "homeric/places/hellespont@pt",
          "title": "O Helesponto",
          "description": "O estreito ao lado da guerra. As naus aqueias estão encalhadas nele, os jogos fúnebres de Aquiles acontecem à sua margem e sua corrente é a razão econômica mais plausível para Troia ter existido.",
          "mimeType": "application/json",
          "digest": "sha256:40121833d1a79261ac8b9c763f4786896dfe5f4fd6e27232bb436d8690ff1ff3"
        },
        {
          "uri": "santismm://homeric/places/zh/hellespont",
          "name": "homeric/places/hellespont@zh",
          "title": "赫勒斯滂",
          "description": "战争旁的海峡。阿开亚人的船只停泊在岸边，阿喀琉斯的葬礼竞技在其旁举行，而它的洋流是特洛伊之所以存在的最合理的经济原因。",
          "mimeType": "application/json",
          "digest": "sha256:644695f8c5a251f4ce42fb07659d628ab72389d3037623ccf55a48fccdca7113"
        },
        {
          "uri": "santismm://homeric/places/de/house-of-hades",
          "name": "homeric/places/house-of-hades@de",
          "title": "Das Haus des Hades",
          "description": "Wohin Odysseus reist, um die Toten zu befragen. Das Epos gibt Wegbeschreibungen dorthin – und diese führen über den Rand der Welt hinaus, weshalb dieser Eintrag keinerlei Koordinaten enthält.",
          "mimeType": "application/json",
          "digest": "sha256:24d95b8c49ad9eaea7a9647c4615eb35aa6e62a5092551679173b834049f4cf5"
        },
        {
          "uri": "santismm://homeric/places/en/house-of-hades",
          "name": "homeric/places/house-of-hades@en",
          "title": "The house of Hades",
          "description": "Where Odysseus goes to question the dead. The poem gives sailing directions to it — and they lead past the edge of the world, which is why this entry carries no coordinates at all.",
          "mimeType": "application/json",
          "digest": "sha256:e7c43bca406968d0448a7e6ac4a21b62e48283d07fbe42e584701ee7993c3ede"
        },
        {
          "uri": "santismm://homeric/places/es/house-of-hades",
          "name": "homeric/places/house-of-hades@es",
          "title": "La morada de Hades",
          "description": "Adonde va Odiseo a interrogar a los muertos. El poema da instrucciones de navegación para llegar y conducen más allá del borde del mundo: por eso esta ficha no lleva coordenada alguna.",
          "mimeType": "application/json",
          "digest": "sha256:9327cf9035762d1698934e555db448d800fad5d35470f97647185ec6ce559a99"
        },
        {
          "uri": "santismm://homeric/places/fr/house-of-hades",
          "name": "homeric/places/house-of-hades@fr",
          "title": "La demeure d'Hadès",
          "description": "Là où Ulysse se rend pour interroger les morts. Le poème donne des instructions de navigation pour y parvenir — et elles mènent au-delà des limites du monde, c'est pourquoi cette entrée ne comporte aucune coordonnée.",
          "mimeType": "application/json",
          "digest": "sha256:89813bfd8a15440a59aa71aea41085078993ea9e259a4cd49fb416c64d84c9c6"
        },
        {
          "uri": "santismm://homeric/places/ja/house-of-hades",
          "name": "homeric/places/house-of-hades@ja",
          "title": "ハデスの館",
          "description": "オデュッセウスが死者に問いかけるために赴く場所。詩にはそこへの航海案内が記されているが、それは世界の果てを越えた先へと導いている。そのため、このエントリーには座標が一切記載されていない。",
          "mimeType": "application/json",
          "digest": "sha256:c57e27c699ff529f761b0d1f3ed5a1a8266fd4f13ebcaffe8fe3a4b98849425f"
        },
        {
          "uri": "santismm://homeric/places/pt/house-of-hades",
          "name": "homeric/places/house-of-hades@pt",
          "title": "A morada de Hades",
          "description": "Para onde Odisseu vai interrogar os mortos. O poema dá instruções de navegação até lá — e elas levam para além da borda do mundo, razão pela qual esta ficha não traz coordenada alguma.",
          "mimeType": "application/json",
          "digest": "sha256:49e42d1b4176a42ee201bdf7dd50df1a123904611492997d84994882505e1241"
        },
        {
          "uri": "santismm://homeric/places/zh/house-of-hades",
          "name": "homeric/places/house-of-hades@zh",
          "title": "哈迪斯的居所",
          "description": "奥德修斯前往询问死者的地方。史诗给出了前往那里的航行指引——而这些指引通往世界的边缘之外，这就是为什么该条目完全没有坐标的原因。",
          "mimeType": "application/json",
          "digest": "sha256:0f7ce2bd44c2f7ef5949fbc81e46dd95343b818489954bc24b44ac265f8e5efc"
        },
        {
          "uri": "santismm://homeric/places/de/ismarus",
          "name": "homeric/places/ismarus@de",
          "title": "Ismaros",
          "description": "Die erste Station nach Troja und die einzige, die Odysseus durch gewöhnliches Segeln erreicht: eine thrakische Stadt, die er plündert und in der die Weigerung seiner Mannschaft, abzureisen, sechs Männer pro Schiff das Leben kostet.",
          "mimeType": "application/json",
          "digest": "sha256:4e4225eb8879992aaf41689c0e545c015a909b2179b4143d06c66845926044b9"
        },
        {
          "uri": "santismm://homeric/places/en/ismarus",
          "name": "homeric/places/ismarus@en",
          "title": "Ismarus",
          "description": "The first stop out of Troy, and the only one Odysseus reaches by ordinary sailing: a Thracian town he sacks, and where his crew's refusal to leave costs six men per ship.",
          "mimeType": "application/json",
          "digest": "sha256:c87b61c67b3e6327cfa5969aa11e357b027279de6955cba2593eb2358d317889"
        },
        {
          "uri": "santismm://homeric/places/es/ismarus",
          "name": "homeric/places/ismarus@es",
          "title": "Ísmaro",
          "description": "La primera escala al salir de Troya y la única a la que Odiseo llega por navegación ordinaria: una ciudad tracia que saquea y donde la negativa de su tripulación a marcharse cuesta seis hombres por nave.",
          "mimeType": "application/json",
          "digest": "sha256:dfbea2d89769610bf587b879297d8bd3d7d7ba22b360991ac0b1d331661b2996"
        },
        {
          "uri": "santismm://homeric/places/fr/ismarus",
          "name": "homeric/places/ismarus@fr",
          "title": "Ismaros",
          "description": "La première étape après Troie, et la seule qu'Ulysse atteint par une navigation ordinaire : une ville thrace qu'il pille, et où le refus de son équipage de repartir coûte la vie à six hommes par navire.",
          "mimeType": "application/json",
          "digest": "sha256:77b37a54c2b9614eb93ab167021f2777e08e50f6b4ec7c215e5d4ec65306615d"
        },
        {
          "uri": "santismm://homeric/places/ja/ismarus",
          "name": "homeric/places/ismarus@ja",
          "title": "イスマロス",
          "description": "トロイを出発して最初の寄港地であり、オデュッセウスが通常の航海で到達した唯一の場所。彼が略奪したトラキアの町であり、乗組員が立ち去ることを拒んだために、船1隻につき6人の犠牲者を出すことになった。",
          "mimeType": "application/json",
          "digest": "sha256:c6a4f3a3a1f2f4a23d37faf44c33b864e4693b397046e8d64ef749ba81e0c1a3"
        },
        {
          "uri": "santismm://homeric/places/pt/ismarus",
          "name": "homeric/places/ismarus@pt",
          "title": "Ísmaro",
          "description": "A primeira escala ao sair de Troia e a única aonde Odisseu chega por navegação comum: uma cidade trácia que ele saqueia e onde a recusa da tripulação em partir custa seis homens por nau.",
          "mimeType": "application/json",
          "digest": "sha256:a68b8382e7b757c15fecfa9c10d0f62668a3cd7518fdf38ac44fdb1fe10b7cb0"
        },
        {
          "uri": "santismm://homeric/places/zh/ismarus",
          "name": "homeric/places/ismarus@zh",
          "title": "伊斯马鲁斯",
          "description": "离开特洛伊后的第一站，也是奥德修斯通过普通航行到达的唯一一站：一个被他洗劫的色雷斯城镇，在那里，他的船员因拒绝离开而导致每艘船损失了六个人。",
          "mimeType": "application/json",
          "digest": "sha256:aff4521dc414dc2228e8752c93c09058d5a6adbd365623dcbb14f9223e4eb239"
        },
        {
          "uri": "santismm://homeric/places/de/ithaca",
          "name": "homeric/places/ithaca@de",
          "title": "Ithaka",
          "description": "Odysseus' Heimat und das Ziel des gesamten Epos – und unglücklicherweise einer seiner am wenigsten gesicherten Orte. Das moderne Ithaki trägt zwar den Namen, aber die Beschreibung der Insel in der Odyssee passt nur schlecht dazu.",
          "mimeType": "application/json",
          "digest": "sha256:d65043e879472ae6f2d177d9734f88ec8b4ac88192f24318b717bc6cf30899a4"
        },
        {
          "uri": "santismm://homeric/places/en/ithaca",
          "name": "homeric/places/ithaca@en",
          "title": "Ithaca",
          "description": "Odysseus' home and the destination of the whole poem — and, awkwardly, one of its least secure locations. Modern Ithaki carries the name; the Odyssey's own description of the island fits it poorly.",
          "mimeType": "application/json",
          "digest": "sha256:d56062bf978d0febd1824a8a40309871f061576af7331638816b3055c1835bd9"
        },
        {
          "uri": "santismm://homeric/places/es/ithaca",
          "name": "homeric/places/ithaca@es",
          "title": "Ítaca",
          "description": "La casa de Odiseo y el destino de todo el poema y, de forma incómoda, una de sus localizaciones menos seguras. La Ítaca moderna lleva el nombre; la descripción que la Odisea hace de la isla le encaja mal.",
          "mimeType": "application/json",
          "digest": "sha256:3178be7106062c2f8da8c7384da2cb4c12c361ddfae663018f0ff38645ab205f"
        },
        {
          "uri": "santismm://homeric/places/fr/ithaca",
          "name": "homeric/places/ithaca@fr",
          "title": "Ithaque",
          "description": "La patrie d'Ulysse et la destination de tout le poème — et, paradoxalement, l'un de ses emplacements les moins assurés. L'Ithaque moderne porte ce nom, mais la description de l'île par l'Odyssée elle-même lui correspond mal.",
          "mimeType": "application/json",
          "digest": "sha256:8eb08b9f4051d0515c00336ebdbd919a3bdee10cfc09d0479f26d5fd8f930eaa"
        },
        {
          "uri": "santismm://homeric/places/ja/ithaca",
          "name": "homeric/places/ithaca@ja",
          "title": "イタカ",
          "description": "オデュッセウスの故郷であり、詩全体の目的地。しかし厄介なことに、最も位置の不確かな場所の1つでもある。現代のイサキ島がその名を冠しているが、『オデュッセイア』自体における島の描写は、この島にほとんど適合しない。",
          "mimeType": "application/json",
          "digest": "sha256:5175903ff5e6257d8a249ca93871506a0c270d42cca1c9edac2eced719099c66"
        },
        {
          "uri": "santismm://homeric/places/pt/ithaca",
          "name": "homeric/places/ithaca@pt",
          "title": "Ítaca",
          "description": "A casa de Odisseu e o destino de todo o poema — e, de modo incômodo, uma de suas localizações menos seguras. A Ítaca moderna carrega o nome; a descrição que a Odisseia faz da ilha encaixa mal nela.",
          "mimeType": "application/json",
          "digest": "sha256:d52ce1eb7a205e0cae42fc37b715de6efcd8f0f39216fea271f72971c038ea76"
        },
        {
          "uri": "santismm://homeric/places/zh/ithaca",
          "name": "homeric/places/ithaca@zh",
          "title": "伊萨卡",
          "description": "奥德修斯的家园，也是整部史诗的目的地——然而尴尬的是，它也是最不确定的地点之一。现代的伊萨基岛（Ithaki）承载着这个名字；但《奥德赛》自身对该岛的描述与其并不相符。",
          "mimeType": "application/json",
          "digest": "sha256:96b8d234b9baf2998cd3bb419a0314b03df7b3b714e1f2e8fc6af2a535fbef37"
        },
        {
          "uri": "santismm://homeric/places/de/knossos",
          "name": "homeric/places/knossos@de",
          "title": "Knossos",
          "description": "Die Stadt des Minos in der Odyssee und der größte Palast auf Kreta – eine Identifizierung, die niemand bestreitet, verbunden mit einer Zivilisation, an die sich die Epen nur halb erinnern.",
          "mimeType": "application/json",
          "digest": "sha256:4fc4ab3497d10586e226461ce7904e84656d7e581e4e9ebd44dce9d741512492"
        },
        {
          "uri": "santismm://homeric/places/en/knossos",
          "name": "homeric/places/knossos@en",
          "title": "Knossos",
          "description": "Minos' city in the Odyssey and the largest palace on Crete — an identification nobody disputes, attached to a civilisation the poems only half remember.",
          "mimeType": "application/json",
          "digest": "sha256:24fe8e2eef90b3837f79d89ec0c08a427cf53da87da059186138d55e4606d405"
        },
        {
          "uri": "santismm://homeric/places/es/knossos",
          "name": "homeric/places/knossos@es",
          "title": "Cnosos",
          "description": "La ciudad de Minos en la Odisea y el mayor palacio de Creta: una identificación que nadie discute, adherida a una civilización que los poemas solo recuerdan a medias.",
          "mimeType": "application/json",
          "digest": "sha256:c681d35b9f803e7384786a7549e86fac6badeea9ce5d26155955216452c53ffd"
        },
        {
          "uri": "santismm://homeric/places/fr/knossos",
          "name": "homeric/places/knossos@fr",
          "title": "Cnossos",
          "description": "La cité de Minos dans l'Odyssée et le plus grand palais de Crète — une identification que personne ne conteste, rattachée à une civilisation dont les poèmes ne se souviennent qu'à moitié.",
          "mimeType": "application/json",
          "digest": "sha256:536777ddbbbf482e3ce21ee655f9d1fb307b08ac72768ecfa4d37640e0d6420d"
        },
        {
          "uri": "santismm://homeric/places/ja/knossos",
          "name": "homeric/places/knossos@ja",
          "title": "クノッソス",
          "description": "『オデュッセイア』に登場するミノスの都市であり、クレタ島最大の宮殿。この同定に異論を唱える者はいないが、詩の中で半分しか記憶されていない文明に結びついている。",
          "mimeType": "application/json",
          "digest": "sha256:1b864daeaaa00c654f65eb69abe3ae4ee2d5afdfa2b9b68e0e310af1b1aeb6be"
        },
        {
          "uri": "santismm://homeric/places/pt/knossos",
          "name": "homeric/places/knossos@pt",
          "title": "Cnossos",
          "description": "A cidade de Minos na Odisseia e o maior palácio de Creta: uma identificação que ninguém contesta, ligada a uma civilização que os poemas só lembram pela metade.",
          "mimeType": "application/json",
          "digest": "sha256:f556b172353177090187b13d0320ce01f4559580c6e983e58bdd01bfdbb072d8"
        },
        {
          "uri": "santismm://homeric/places/zh/knossos",
          "name": "homeric/places/knossos@zh",
          "title": "克诺索斯",
          "description": "《奥德赛》中米诺斯的城市，也是克里特岛上最大的宫殿——这一认定无人争议，它与诗作中仅存模糊记忆的文明相联系。",
          "mimeType": "application/json",
          "digest": "sha256:699e01294c8aafce9ba35a9b9f100ab38f2c802236892f8e1c1037705019b940"
        },
        {
          "uri": "santismm://homeric/places/de/laestrygonia",
          "name": "homeric/places/laestrygonia@de",
          "title": "Lästrygonien (Telepylos)",
          "description": "Wo Odysseus an einem einzigen Nachmittag elf seiner zwölf Schiffe verliert. Der Hafen ist der am präzisesten beschriebene Ankerplatz im Epos, und niemand kann beweisen, um welchen es sich handelt.",
          "mimeType": "application/json",
          "digest": "sha256:41d0085c5221321d3e479ce14c99d63b40898857ae6505347398fb4ef6a02704"
        },
        {
          "uri": "santismm://homeric/places/en/laestrygonia",
          "name": "homeric/places/laestrygonia@en",
          "title": "Laestrygonia (Telepylus)",
          "description": "Where Odysseus loses eleven of his twelve ships in a single afternoon. The harbour is the most precisely described anchorage in the poem, and nobody can prove which one it is.",
          "mimeType": "application/json",
          "digest": "sha256:49df4b486caa51c165537d68c4d86ef3304800a72973b3a190e2f6251180eca4"
        },
        {
          "uri": "santismm://homeric/places/es/laestrygonia",
          "name": "homeric/places/laestrygonia@es",
          "title": "Lestrigonia (Telépilo)",
          "description": "Donde Odiseo pierde once de sus doce naves en una sola tarde. El puerto es el fondeadero descrito con más precisión del poema, y nadie puede demostrar cuál es.",
          "mimeType": "application/json",
          "digest": "sha256:9ae752c5fd4d4cbd4de894acc715632d4ea4e8464b0200dc618c6da901b450f9"
        },
