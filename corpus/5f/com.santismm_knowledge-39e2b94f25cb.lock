          "digest": "sha256:e4aae0aa17261a69c4f9431fbe4a3622bf9e839c68abce98484bc5dc5a03f7db"
        },
        {
          "uri": "santismm://homeric/places/fr/mycenae",
          "name": "homeric/places/mycenae@fr",
          "title": "Mycènes",
          "description": "La cité d'Agamemnon, et la seule capitale homérique qui n'ait jamais eu besoin d'être retrouvée : la citadelle est restée visible hors de terre tout au long de l'Antiquité et donne son nom à l'ensemble de la civilisation de l'âge du bronze.",
          "mimeType": "application/json",
          "digest": "sha256:47518c16da64f236c45f35810368b316d8521db6b9f41bbd1b058fb14039ebeb"
        },
        {
