          "description": "マルチエージェントアーキテクチャとは、1つの汎用エージェントに依存するのではなく、目標を達成するために、連携、委譲、または競合する複数の特化型エージェントにタスクを分割する仕組みです。一般的な形態には、ワーカーに委譲するオーケストレーター、各エージェントがステージを担当するパイプライン、ディベートやクリティック（批評）のパターンなどがあります。複雑なタスクにおけるモジュール性と信頼性を向上させることができますが、調整のオーバーヘッドが加わるため、単一のエージェントでは明らかに不十分な場合にのみ採用すべきです。",
