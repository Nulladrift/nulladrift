          "title": "セイレンたち",
          "description": "オデュッセウスが計画によって生き延びた唯一の危機。乗組員の耳に蝋を詰め、自身の体をマストに縛り付け、行動を起こすことのできない状態で歌を聴く。",
          "mimeType": "application/json",
          "digest": "sha256:671b409296e00eb614b574950a4d2fff2839246950e205dc36adfaf9a9a5eee5"
