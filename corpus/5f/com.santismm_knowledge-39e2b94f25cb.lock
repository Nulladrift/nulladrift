          "name": "homeric/places/land-of-the-lotus-eaters@pt",
          "title": "A terra dos lotófagos",
          "description": "A primeira escala após a tempestade e a primeira tentação: um povo cujo fruto faz o visitante esquecer o caminho de volta. A geografia antiga os situou na costa líbia, em Djerba.",
          "mimeType": "application/json",
          "digest": "sha256:43e99478b70e4838f9ec203c4bbfff8de48f37925bd89acc553250d835ba7188"
