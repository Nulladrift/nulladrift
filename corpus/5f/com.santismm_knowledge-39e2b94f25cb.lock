        {
          "name": "calculate_evaluation_sample_size",
          "title": "Calculate an agent evaluation sample size",
          "description": "Calculate two different samples: how many independent evaluations are needed to detect at least one failure, and how many are needed to estimate its rate at a chosen margin. Use this when a user asks how many tests are enough; do not interpret zero observed failures as proof of zero risk.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confidence": {
                "anyOf": [
                  {
                    "const": 90,
                    "type": "number"
                  },
                  {
                    "const": 95,
                    "type": "number"
                  },
                  {
                    "const": 99,
                    "type": "number"
                  }
                ],
                "description": "Confidence level, in percent."
              },
              "failureRate": {
                "description": "Failure rate to detect, in percent.",
                "maximum": 99.9999,
                "minimum": 0.0001,
                "type": "number"
              },
              "locale": {
                "description": "Language for interpretations, assumptions, formulas and warnings. The Labs execution service currently resolves fr/de/ja/zh to English and reports that fallback.",
                "enum": ["en", "es", "pt", "fr", "de", "ja", "zh"],
                "type": "string"
              },
              "margin": {
                "description": "Margin for estimating the failure rate, in percentage points.",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "population": {
                "description": "Number of distinct evaluable cases.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["confidence", "failureRate", "margin", "population"],
            "type": "object"
          },
