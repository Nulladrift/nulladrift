          "name": "homeric/places/land-of-the-lotus-eaters@de",
          "title": "Das Land der Lotophagen",
          "description": "Die erste Station nach dem Sturm und die erste Versuchung: ein Volk, dessen Frucht Besucher den Heimweg vergessen lässt. Die antike Geografie verortete sie an der libyschen Küste, auf Djerba.",
