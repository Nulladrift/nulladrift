          "name": "homeric/places/egypt@es",
          "title": "Egipto",
          "description": "El borde lejano del mundo real de los poemas. A Menelao lo empuja allí el viento y vuelve rico; las vidas inventadas de Odiseo pasan también por allí, porque es adonde iría una mentira verosímil sobre viajes duros.",
