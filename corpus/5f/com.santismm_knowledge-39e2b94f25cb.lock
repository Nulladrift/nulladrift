          "description": "Der äußerste Rand der realen Welt der Epen. Menelaos wird dorthin verschlagen und kehrt reich nach Hause zurück; auch Odysseus' erfundene Lebensgeschichten führen dorthin, da es der Ort ist, an den eine glaubwürdige Lüge über beschwerliche Reisen führen würde.",
