          "description": "风暴过后的第一站，也是第一个诱惑：一个其果实能让游客忘记回家之路的民族。古代地理学将其置于利比亚海岸的杰尔巴岛（Djerba）。",
          "mimeType": "application/json",
          "digest": "sha256:37094560874f100231e8835078251fd40a861a9fb0aa6b6465a5d28a6e11f934"
        },
        {
