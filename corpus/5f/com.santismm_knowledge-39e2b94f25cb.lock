        {
          "name": "assess_physical_ai_fit",
          "title": "Assess readiness for a robotics deployment",
          "description": "Run the deployment guide's readiness assessment: score per area and overall, the band and its guidance, the weakest area, blockers (items answered 'no') and the questions still unanswered, plus the platforms and documented deployments that match the environment, sector and family, ordered by strength of evidence. Call with no answers first to receive every question. It never recommends a purchase; it shows what is ready, what is missing and what evidence exists. Use this when an organisation asks whether it is ready to deploy robots.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "enum": ["yes", "partial", "no"],
                  "type": "string"
                },
                "description": "Readiness item id → yes | partial | no (24 items; ids in the deployment guide's readiness.item_ids). Omit to get every question back as `unanswered`.",
                "propertyNames": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "environment": {
                "description": "Environment id, e.g. industrial, warehouse, offshore.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "family": {
                "description": "Family id: humanoid, mobile-manipulator, quadruped, ugv, uav.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "Language of the returned body. Default: en.",
                "enum": ["en", "es", "pt", "fr", "de", "ja", "zh"],
                "type": "string"
              },
              "sector": {
                "description": "Sector id, e.g. inspection, logistics, security.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "api_version": {
                "type": "string"
              },
              "dataset_version": {
                "type": "string"
              },
              "locale": {
                "type": "string"
              },
              "model_version": {
                "type": "string"
              }
            },
            "required": ["api_version", "dataset_version"],
            "type": "object"
          },
