          "title": "La tierra de los cíclopes",
          "description": "Donde Odiseo pierde a seis hombres y ciega a Polifemo. Dos tradiciones la sitúan en costas volcánicas —Sicilia y Campania— y el poema no la sitúa en ninguna parte concreta, a propósito.",
          "mimeType": "application/json",
          "digest": "sha256:d672a8fe36ace79b4e937864e359d3d155bc13916e4bd6b1efd96c569600678d"
