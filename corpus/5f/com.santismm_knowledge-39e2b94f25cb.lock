          "title": "Éphyre et l'Achéron",
          "description": "Un véritable fleuve réputé pour être lié aux enfers, et le site le plus souvent confondu avec l'entrée de l'Hadès d'Homère. L'atlas les sépare : ce lieu est ici, l'autre ne l'est pas.",
          "mimeType": "application/json",
          "digest": "sha256:dc33807c00035c68e48979462332c5062e52aa809e5569f9b3adb882fa77fee7"
