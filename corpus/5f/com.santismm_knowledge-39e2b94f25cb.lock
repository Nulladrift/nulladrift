          "uri": "santismm://knowledge/de/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@de",
          "title": "Was ist rekursive Selbstverbesserung (RSI)?",
          "description": "Rekursive Selbstverbesserung ist die Idee eines Systems, das seine eigene Fähigkeit zur Verbesserung verbessert: Jede Runde der Selbstmodifikation macht die nächste wirksamer, sodass sich Gewinne aufaddieren. Schmale Teile dieser Schleife sind real und heute gemessen — ein Modell",
          "mimeType": "application/json",
          "digest": "sha256:96d898643bf5f25defce3006952d9ef841cb1d1d9b20bfc7a531c10806a29712"
        },
        {
          "uri": "santismm://knowledge/en/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@en",
          "title": "What is Recursive Self-Improvement (RSI)?",
          "description": "Recursive self-improvement is the idea of a system that improves its own ability to improve — each round of self-modification making the next one more effective, so that gains compound. Narrow pieces of that loop are real and measured today: a model that refines its own answer, g",
          "mimeType": "application/json",
          "digest": "sha256:5d0eba4d8fcd4434d967b8cc8b5cbf1fb38cbad0bc69451ea4a43c635d33183d"
        },
        {
          "uri": "santismm://knowledge/es/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@es",
          "title": "¿Qué es la auto-mejora recursiva (RSI)?",
          "description": "La auto-mejora recursiva es la idea de un sistema que mejora su propia capacidad de mejorar: cada ronda de automodificación hace más eficaz la siguiente, de modo que las ganancias se acumulan. Partes estrechas de ese bucle son reales y están medidas hoy — un modelo que refina su ",
          "mimeType": "application/json",
          "digest": "sha256:208f940786df6a7e0dd378b12db8a0b28693038bdd68ab9bbf76538de2d2a987"
        },
        {
          "uri": "santismm://knowledge/fr/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@fr",
          "title": "Qu'est-ce que l'auto-amélioration récursive (RSI) ?",
          "description": "L'auto-amélioration récursive est l'idée d'un système qui améliore sa propre capacité à s'améliorer : chaque tour d'automodification rend le suivant plus efficace, si bien que les gains se cumulent. Des parties étroites de cette boucle sont réelles et mesurées aujourd'hui — un mo",
          "mimeType": "application/json",
          "digest": "sha256:0ce2b9790fa01828acb70379ca7cfa663ca84c9816bb33abab1c36091b4a716b"
        },
        {
          "uri": "santismm://knowledge/ja/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@ja",
          "title": "再帰的自己改善（RSI）とは何か",
          "description": "再帰的自己改善とは、自らを改善する能力そのものを改善する系という考えである。自己改変の各周回が次の周回をより有効にし、利得が積み上がる。この輪の狭い部分は現実に存在し、今日すでに測られている——自分の答えを推敲するモデル、自分の訓練データを生成するモデル、より良いプロンプトと道具立てを探索するモデル。だが、この語が本来名指す「積み上がる再帰」は実証されていない。測られた輪は頭打ちになり、動くためには外部からの正しさの信号を必要とし、自分の出力で訓練した系は改善ではなく劣化する。",
          "mimeType": "application/json",
          "digest": "sha256:127e2abaab7d6ef8e1eef1188eeae98fda1b0234c9cca16169092a5705169c2c"
        },
        {
          "uri": "santismm://knowledge/pt/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@pt",
          "title": "O que é auto-aperfeiçoamento recursivo (RSI)?",
          "description": "Auto-aperfeiçoamento recursivo é a ideia de um sistema que melhora a sua própria capacidade de melhorar: cada rodada de automodificação torna a seguinte mais eficaz, de modo que os ganhos se acumulam. Partes estreitas desse laço são reais e estão medidas hoje — um modelo que refi",
          "mimeType": "application/json",
          "digest": "sha256:a0d097ef769597549d5d96abf8872062b8a02b463809ae5c80221e50be46f73b"
        },
        {
          "uri": "santismm://knowledge/zh/recursive-self-improvement",
          "name": "knowledge/recursive-self-improvement@zh",
          "title": "什么是递归自我改进（RSI）？",
          "description": "递归自我改进指的是这样一个系统：它改进的是自己改进的能力——每一轮自我修改都让下一轮更有效，于是收益会累积。这个回路的狭窄片段是真实的，今天也已经被测量：一个模型润色自己的答案、生成自己的训练数据，或者搜索更好的提示词与工具组合。但这个词真正指称的那种累积式递归并没有被证实。已测量的回路会趋于平台，它们要运转就得依赖外部的正确性信号，而用自己的输出训练出来的系统是退化而非进步。",
          "mimeType": "application/json",
          "digest": "sha256:3880f88ef9b868e92fdca655d7d0e97f77265a4745f3c2fec7c961b9483b37ce"
        },
        {
          "uri": "santismm://knowledge/de/tool-use",
