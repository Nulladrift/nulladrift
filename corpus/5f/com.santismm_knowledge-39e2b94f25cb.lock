        {
          "uri": "santismm://knowledge/zh/ai-observability",
          "name": "knowledge/ai-observability@zh",
          "title": "什么是 AI 智能体可观测性？",
          "description": "AI 可观测性是指对 AI 系统（尤其是智能体）进行插桩的实践，以便您能够了解它们做了什么以及原因。它捕获每一步的追踪：提示词、工具调用、检索到的上下文、模型输出、Token、延迟和成本。由于智能体具有非确定性和多步骤特征，可观测性使故障诊断和系统性改进成为可能。它是为评估提供数据并闭环 Harness Engineering（智能体支撑系统工程）的层。",
