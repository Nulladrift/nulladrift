          "title": "Das Land der Kyklopen",
          "description": "Wo Odysseus sechs Männer verliert und Polyphem den Blick raubt. Zwei Traditionen verorten es an vulkanischen Küsten – Sizilien und Kampanien – und das Epos verortet es ganz bewusst an keinem bestimmten Ort.",
