          "name": "homeric/places/mount-ida@ja",
          "title": "イダ山",
          "description": "神々が戦争を見守る山であり、『イリアス』の風景を固定する実在の地形。ヒサルルクから見ることができ、平野の川はこの山から流れ出ている。",
          "mimeType": "application/json",
          "digest": "sha256:b103795c5b0f759211baa3363622f8982882fd2d2919f6c1f4b3a909e3e448a6"
