          "name": "homeric/places/mycenae@ja",
          "title": "ミケーネ",
          "description": "アガメムノンの都市であり、発見される必要のなかった唯一のホメロスの首都。その城塞は古代を通じて地上に見えており、青銅器時代文明全体の名前の由来となっている。",
          "mimeType": "application/json",
          "digest": "sha256:b6991f18796bf9596b6b47bd3fe4a98a83a5b4c9ffa030b6334f92f591903587"
        },
        {
          "uri": "santismm://homeric/places/pt/mycenae",
          "name": "homeric/places/mycenae@pt",
          "title": "Micenas",
          "description": "A cidade de Agamêmnon e a única capital homérica que nunca precisou ser encontrada: a cidadela esteve sempre visível acima do solo e dá nome a toda a civilização da Idade do Bronze.",
          "mimeType": "application/json",
          "digest": "sha256:6d95f5a1ced2ff819794b14feee6c501bd71d0eed451ca0657dd3af620516220"
        },
        {
          "uri": "santismm://homeric/places/zh/mycenae",
          "name": "homeric/places/mycenae@zh",
          "title": "迈锡尼",
          "description": "阿伽门农的城市，也是唯一一个无需寻找的荷马史诗首都：在整个古代，其卫城在地面上都清晰可见，并为整个青铜时代文明命名。",
          "mimeType": "application/json",
          "digest": "sha256:430eaa91ab67500400fa93b21a80924d1aebf4aa6c460fbea7e54b54f409a4b4"
        },
        {
          "uri": "santismm://homeric/places/de/ogygia",
          "name": "homeric/places/ogygia@de",
          "title": "Ogygia",
          "description": "Kalypsos Insel, auf der Odysseus sieben seiner zehn Jahre in der Fremde verbringt. Die Odyssee verortet sie bewusst im Nirgendwo – als „Nabel des Meeres“ –, was genau der Grund ist, warum ihre Identifizierungen so aufschlussreich sind.",
          "mimeType": "application/json",
          "digest": "sha256:9896e4d16e073787982826f75cc78201a4073f1d49e8764583b54989b8f8347c"
        },
        {
          "uri": "santismm://homeric/places/en/ogygia",
          "name": "homeric/places/ogygia@en",
          "title": "Ogygia",
          "description": "Calypso's island, where Odysseus spends seven of his ten years away. The Odyssey places it deliberately nowhere — 'the navel of the sea' — which is exactly why identifications of it are so revealing.",
          "mimeType": "application/json",
          "digest": "sha256:72e017100767f1c9a1d3a666f73f839a711bdaf60f551341c4d5c7ce9f9e51e3"
        },
        {
          "uri": "santismm://homeric/places/es/ogygia",
          "name": "homeric/places/ogygia@es",
          "title": "Ogigia",
          "description": "La isla de Calipso, donde Odiseo pasa siete de sus diez años de ausencia. La Odisea la sitúa deliberadamente en ninguna parte —«el ombligo del mar»— y por eso mismo sus identificaciones resultan tan reveladoras.",
          "mimeType": "application/json",
          "digest": "sha256:8ba25730a619d83c49ec372e5bc2fc4c164d449d7f5e1a3aa90517ecf2730212"
        },
        {
          "uri": "santismm://homeric/places/fr/ogygia",
          "name": "homeric/places/ogygia@fr",
          "title": "Ogygie",
          "description": "L'île de Calypso, où Ulysse passe sept de ses dix années d'absence. L'Odyssée la situe délibérément nulle part — « le nombril de la mer » — ce qui est précisément la raison pour laquelle ses identifications sont si révélatrices.",
          "mimeType": "application/json",
          "digest": "sha256:a2b163358f03dc07ee7fbef1d79ea803208d41bbef9e9f49c136df0ab31c3cac"
        },
        {
          "uri": "santismm://homeric/places/ja/ogygia",
          "name": "homeric/places/ogygia@ja",
          "title": "オギュギア",
          "description": "オデュッセウスが10年の放浪のうち7年を過ごしたカリュプソの島。『オデュッセイア』は意図的にこの島をどこでもない場所（「海のへそ」）に配置しており、それこそがこの島の同定が極めて示唆に富む理由である。",
          "mimeType": "application/json",
          "digest": "sha256:95e498339385208da5cbfdd5bb0afdb35901a4dedc5dc4eaa9c4f0988ab955ee"
        },
        {
          "uri": "santismm://homeric/places/pt/ogygia",
          "name": "homeric/places/ogygia@pt",
          "title": "Ogígia",
          "description": "A ilha de Calipso, onde Odisseu passa sete de seus dez anos de ausência. A Odisseia a situa deliberadamente em lugar nenhum — “o umbigo do mar” — e é justamente por isso que suas identificações são tão reveladoras.",
          "mimeType": "application/json",
          "digest": "sha256:49b9dede2ecaa651c2e695a9ad3cc7d3e4ff631407369abd12a68bbee5231b9e"
        },
        {
          "uri": "santismm://homeric/places/zh/ogygia",
          "name": "homeric/places/ogygia@zh",
          "title": "奥吉吉亚",
          "description": "卡吕普索的岛屿，奥德修斯在外流亡的十年中有七年在此度过。《奥德赛》刻意不将其置于任何具体位置——称其为“大海的肚脐”——这恰恰是为什么对该岛的认定如此耐人寻味。",
          "mimeType": "application/json",
          "digest": "sha256:ae5ebb2e613382a4fda49f6c133edbc43d98735f27d32779daf0428772e584a3"
        },
        {
          "uri": "santismm://homeric/places/de/pharos",
          "name": "homeric/places/pharos@de",
          "title": "Pharos",
          "description": "Wo Menelaos von einer Flaute aufgehalten wird und mit dem gestaltwandelnden Meeresgott Proteus ringt. Die Insel ist sicher; die Entfernung, die Homer angibt, ist einer der eindeutigsten Fehler in den Epen.",
          "mimeType": "application/json",
          "digest": "sha256:60523dd091498de4e7e8528ad6966be5ff9cbeb397cd9a7189ff5b67b908ef98"
        },
        {
          "uri": "santismm://homeric/places/en/pharos",
          "name": "homeric/places/pharos@en",
          "title": "Pharos",
          "description": "Where Menelaus is becalmed and wrestles the shape-shifting sea god Proteus. The island is certain; the distance Homer gives it is one of the clearest errors in the poems.",
          "mimeType": "application/json",
          "digest": "sha256:cf3f958d323a8d4bf7ee6622ef2b0fc17630b5de982e8a21349694cffe677adc"
        },
        {
          "uri": "santismm://homeric/places/es/pharos",
          "name": "homeric/places/pharos@es",
          "title": "Faros",
          "description": "Donde Menelao queda en calma chicha y lucha con Proteo, el dios marino que cambia de forma. La isla es segura; la distancia que le da Homero es uno de los errores más claros de los poemas.",
          "mimeType": "application/json",
          "digest": "sha256:76061e5713d595129b4476abb88dfb9dad7683b606ba2dd566a62e72a5976efd"
        },
        {
          "uri": "santismm://homeric/places/fr/pharos",
          "name": "homeric/places/pharos@fr",
          "title": "Pharos",
          "description": "Là où Ménélas est bloqué par le calme plat et lutte contre le dieu marin métamorphe Protée. L'île est certaine ; la distance qu'Homère lui attribue est l'une des erreurs les plus évidentes des poèmes.",
          "mimeType": "application/json",
          "digest": "sha256:8cd7c17c165ba7ada582435441b6a53398586440754ad076fe18de2fcbab7562"
        },
        {
          "uri": "santismm://homeric/places/ja/pharos",
          "name": "homeric/places/pharos@ja",
          "title": "ファロス",
          "description": "メネラオスが風待ちで足止めされ、姿を変える海の神プロテウスと格闘した場所。島の実在は確実だが、ホメロスが示す距離は詩の中で最も明白な誤りの一つである。",
          "mimeType": "application/json",
          "digest": "sha256:8e5f2e29610b892dd3e5ad63ef49373c3241a86034c99d7cec45073b8b5f5ece"
        },
        {
          "uri": "santismm://homeric/places/pt/pharos",
          "name": "homeric/places/pharos@pt",
          "title": "Faros",
          "description": "Onde Menelau fica em calmaria e luta com Proteu, o deus marinho que muda de forma. A ilha é certa; a distância que Homero lhe dá é um dos erros mais claros dos poemas.",
          "mimeType": "application/json",
          "digest": "sha256:c58aeb66675e3c1466f89362a8281fff990bb558c154b12e7d0df18b44d339fc"
        },
        {
          "uri": "santismm://homeric/places/zh/pharos",
          "name": "homeric/places/pharos@zh",
          "title": "法罗斯",
          "description": "墨涅拉俄斯因无风受阻并与善变的变形海神普罗透斯搏斗的地方。该岛的存在是确凿无误的；但荷马给出的距离是诗歌中最明显的错误之一。",
          "mimeType": "application/json",
          "digest": "sha256:9ee5a02ca9cfc0dbf774f8460c3353d629455a7c228e61b8c354bf6a3f498e27"
        },
        {
          "uri": "santismm://homeric/places/de/planctae",
          "name": "homeric/places/planctae@de",
          "title": "Die Irrfelsen",
          "description": "Die Route, von der Kirke Odysseus rät, sie nicht zu nehmen. Sie werden beschrieben, benannt und dann gemieden – der einzige Ort im Epos, der rein als Alternative existiert.",
          "mimeType": "application/json",
          "digest": "sha256:e2e0328aae72ae6d3b624d9c268eb189fe14415ae601662fafd4b972fc7fe7b7"
        },
        {
          "uri": "santismm://homeric/places/en/planctae",
          "name": "homeric/places/planctae@en",
          "title": "The Wandering Rocks",
          "description": "The route Circe tells Odysseus not to take. They are described, named and then avoided — the only place in the poem that exists purely as an alternative.",
          "mimeType": "application/json",
          "digest": "sha256:9ea1e811ad11b96442d677403e2204dd95f3e3dc6fae5a89af6e52e01370d9c5"
        },
        {
          "uri": "santismm://homeric/places/es/planctae",
          "name": "homeric/places/planctae@es",
          "title": "Las rocas errantes",
          "description": "La ruta que Circe le dice a Odiseo que no tome. Se las describe, se las nombra y se las evita: es el único lugar del poema que existe solo como alternativa.",
          "mimeType": "application/json",
          "digest": "sha256:401ee2072901d706b0652e390f759c6db969c8df27865ededab6167f4a81a37a"
        },
        {
          "uri": "santismm://homeric/places/fr/planctae",
          "name": "homeric/places/planctae@fr",
          "title": "Les Roches Errantes",
          "description": "La route que Circé conseille à Ulysse de ne pas prendre. Elles sont décrites, nommées, puis évitées — le seul lieu du poème qui existe purement comme une alternative.",
          "mimeType": "application/json",
          "digest": "sha256:59c302ecf59b5294ecd19eeb334d0f8176f868c2d7e91abe0dfe90be804a46f1"
        },
        {
          "uri": "santismm://homeric/places/ja/planctae",
          "name": "homeric/places/planctae@ja",
          "title": "さまよう岩々",
          "description": "キルケがオデュッセウスに進まないよう告げたルート。それらは描写され、命名され、そして回避される。詩の中で純粋に代替案としてのみ存在する唯一の場所である。",
          "mimeType": "application/json",
          "digest": "sha256:f330f06fae7cfcc483a63b5650e6bebb028100165f5c1d8ecf6c3d2bcf0a6219"
        },
        {
          "uri": "santismm://homeric/places/pt/planctae",
          "name": "homeric/places/planctae@pt",
          "title": "As rochas errantes",
          "description": "A rota que Circe diz a Odisseu para não tomar. São descritas, nomeadas e evitadas: é o único lugar do poema que existe apenas como alternativa.",
          "mimeType": "application/json",
          "digest": "sha256:00958a1a53d366bca101985c22130bc091d105cd8b500214d41dbaccf8d2e555"
        },
        {
          "uri": "santismm://homeric/places/zh/planctae",
          "name": "homeric/places/planctae@zh",
          "title": "游岩",
          "description": "喀耳刻告诫奥德修斯不要选择的路线。它们在诗中被描述、被命名，然后被避开——这是诗中唯一一个纯粹作为替代方案而存在的地点。",
          "mimeType": "application/json",
          "digest": "sha256:1d275ed1304ec867614a9b7a277185474ee5306d672ca7391e6ead434cc2d9b8"
        },
        {
          "uri": "santismm://homeric/places/de/pylos",
          "name": "homeric/places/pylos@de",
          "title": "Pylos",
          "description": "Nestors Königreich und der homerische Palast, den wir tatsächlich durchschreiten können: der spätbronzezeitliche Komplex bei Ano Englianos, dessen Linear-B-Archiv überlebte, weil das Gebäude niederbrannte.",
          "mimeType": "application/json",
          "digest": "sha256:10daca738bc5c446020bc4c867f8825e05935eb623777e648381ec82e807c415"
        },
        {
          "uri": "santismm://homeric/places/en/pylos",
          "name": "homeric/places/pylos@en",
          "title": "Pylos",
          "description": "Nestor's kingdom, and the Homeric palace we can actually walk through: the Late Bronze Age complex at Ano Englianos, whose Linear B archive survived because the building burned.",
          "mimeType": "application/json",
          "digest": "sha256:3524d32b3c9496718cc6ebbc9c1fc40236528744de3ec96ce5e79b984155f544"
        },
        {
          "uri": "santismm://homeric/places/es/pylos",
          "name": "homeric/places/pylos@es",
          "title": "Pilos",
          "description": "El reino de Néstor y el único palacio homérico por el que realmente se puede caminar: el complejo del Bronce Final de Ano Englianós, cuyo archivo en Lineal B se conservó porque el edificio ardió.",
          "mimeType": "application/json",
          "digest": "sha256:8fda81271933739a5872323d3e77329990bec9f2705e51d7ed4a9672fe695d6a"
        },
        {
          "uri": "santismm://homeric/places/fr/pylos",
          "name": "homeric/places/pylos@fr",
          "title": "Pylos",
          "description": "Le royaume de Nestor, et le palais homérique que nous pouvons réellement visiter : le complexe de l'âge du Bronze récent à Ano Englianos, dont les archives en linéaire B ont survécu parce que le bâtiment a brûlé.",
          "mimeType": "application/json",
          "digest": "sha256:c1c2388ad21261525a08e692a7db8a4a6f30775fd0c364b7b5794e1db895fe9e"
        },
        {
          "uri": "santismm://homeric/places/ja/pylos",
          "name": "homeric/places/pylos@ja",
          "title": "ピュロス",
          "description": "ネストルの王国であり、私たちが実際に歩くことができるホメロスの宮殿。アノ・エンリアノスにある青銅器時代後期の複合遺跡で、建物が焼失したために線文字Bのアーカイブが残された。",
          "mimeType": "application/json",
          "digest": "sha256:468e263e3846aa53808fb719eb072e4c2aa41297e658b52b6c292e23fe1e6cf2"
        },
        {
          "uri": "santismm://homeric/places/pt/pylos",
          "name": "homeric/places/pylos@pt",
          "title": "Pilos",
          "description": "O reino de Nestor e o único palácio homérico por onde realmente se pode caminhar: o complexo do Bronze Final de Ano Englianós, cujo arquivo em Linear B se preservou porque o edifício ardeu.",
          "mimeType": "application/json",
          "digest": "sha256:fe5b726b617b0f1e14695f7704ddd1782bda103bf755382887dd03987b5f1619"
        },
        {
          "uri": "santismm://homeric/places/zh/pylos",
          "name": "homeric/places/pylos@zh",
          "title": "皮洛斯",
          "description": "涅斯托尔的王国，也是我们真正可以漫步其中的荷马史诗宫殿：位于阿诺·恩格利亚诺斯（Ano Englianos）的青铜时代晚期建筑群，其线形文字B档案因建筑被焚毁而得以幸存。",
          "mimeType": "application/json",
          "digest": "sha256:08f0160614d1cc7486b1667d23caa62e5bc5e00722f4f414867a92d6b2bb5666"
        },
        {
          "uri": "santismm://homeric/places/de/same",
          "name": "homeric/places/same@de",
          "title": "Same",
          "description": "Die zweite Insel von Odysseus' Königreich, die allgemein mit Kefalonia gleichgesetzt wird – der größten Insel der Gruppe und derjenigen mit den meisten mykenischen Gräbern und den wenigsten mykenischen Gebäuden.",
          "mimeType": "application/json",
          "digest": "sha256:b7a1bf54ff70750be7e604fabb44c446b2e47b9a476c5b03a5c89b8910b9d3aa"
        },
        {
          "uri": "santismm://homeric/places/en/same",
          "name": "homeric/places/same@en",
          "title": "Same",
          "description": "The second island of Odysseus' kingdom, generally taken to be Kefalonia — the largest island in the group and the one with the most Mycenaean graves and the fewest Mycenaean buildings.",
          "mimeType": "application/json",
          "digest": "sha256:6e4afedd542decd7943f370f81582e8d184ada9ada1debc78dd16cecb8e2f3ce"
        },
        {
          "uri": "santismm://homeric/places/es/same",
          "name": "homeric/places/same@es",
          "title": "Same",
          "description": "La segunda isla del reino de Odiseo, tenida en general por Cefalonia: la mayor del grupo y la que más tumbas micénicas y menos edificios micénicos ha dado.",
          "mimeType": "application/json",
          "digest": "sha256:dc4afbb77da93a1320089e5a2cd08f7bc6dfdfc6738a0ae93a23e9922a588ae0"
        },
        {
          "uri": "santismm://homeric/places/fr/same",
          "name": "homeric/places/same@fr",
          "title": "Samé",
          "description": "La deuxième île du royaume d'Ulysse, généralement identifiée comme Céphalonie — la plus grande île du groupe, celle qui compte le plus de tombes mycéniennes et le moins de bâtiments mycéniens.",
          "mimeType": "application/json",
          "digest": "sha256:1803419d9ed9690d2a4336fafeec33a7cc3357eb39cdcbbad247bd0e54214c31"
        },
        {
          "uri": "santismm://homeric/places/ja/same",
          "name": "homeric/places/same@ja",
          "title": "サメ",
          "description": "オデュッセウスの王国の第2の島。一般にケファロニア島とされる。この島々の中で最大の島であり、マイケナイの墓が最も多く、マイケナイの建物が最も少ない。",
          "mimeType": "application/json",
          "digest": "sha256:dbad3f369cbe781b891a2ca0f22d70b6cdbd674f349155776826577aad3f94a7"
        },
        {
          "uri": "santismm://homeric/places/pt/same",
          "name": "homeric/places/same@pt",
          "title": "Same",
          "description": "A segunda ilha do reino de Odisseu, geralmente tida como a Cefalônia: a maior do grupo e a que deu mais túmulos micênicos e menos edifícios micênicos.",
          "mimeType": "application/json",
          "digest": "sha256:75a3c1c94ed1139a3bfe669cf8c98e595af5b91c735425941b020046512cf429"
        },
        {
          "uri": "santismm://homeric/places/zh/same",
          "name": "homeric/places/same@zh",
          "title": "萨墨",
          "description": "奥德修斯王国的第二大岛，通常被认为是凯法利尼亚岛（Kefalonia）——该群岛中最大的岛屿，拥有最多的迈锡尼墓葬和最少的迈锡尼建筑。",
          "mimeType": "application/json",
          "digest": "sha256:1b6620fc3f34abd22a4918a0692865f83c5d7e7ea5bb76e41f0c248953165cc6"
        },
        {
          "uri": "santismm://homeric/places/de/scheria",
          "name": "homeric/places/scheria@de",
          "title": "Scheria",
          "description": "Die Insel der Phäaken, die letzte Station vor der Heimat und der zivilisierteste Ort im Epos – eine Hafenstadt mit Mauern, Schiffen und einem Hofstaat, die in größerem gesellschaftlichen Detail beschrieben wird als jeder Ort, den Odysseus tatsächlich beherrscht.",
          "mimeType": "application/json",
          "digest": "sha256:eee187612ec02909b50a06fd3cf9a01100567328ae78015ed22a49800e9c6886"
        },
        {
          "uri": "santismm://homeric/places/en/scheria",
          "name": "homeric/places/scheria@en",
          "title": "Scheria",
          "description": "The island of the Phaeacians, the last stop before home and the most civilised place in the poem — a harbour city with walls, ships and a court, described in more social detail than anywhere Odysseus actually rules.",
          "mimeType": "application/json",
          "digest": "sha256:e2a29cc83c4f4247eb23c3e51ddd982809be04cb3ad4c55f8a9a794b57049aed"
        },
        {
          "uri": "santismm://homeric/places/es/scheria",
          "name": "homeric/places/scheria@es",
          "title": "Esqueria",
          "description": "La isla de los feacios, la última escala antes de casa y el lugar más civilizado del poema: una ciudad portuaria con murallas, naves y corte, descrita con más detalle social que ningún sitio que Odiseo gobierne.",
          "mimeType": "application/json",
          "digest": "sha256:1429be999334e276ac707903e8d7f25c801c9d40d109971b283c4022bebf68a3"
        },
        {
          "uri": "santismm://homeric/places/fr/scheria",
          "name": "homeric/places/scheria@fr",
          "title": "Schérie",
          "description": "L'île des Phéaciens, la dernière étape avant le retour et le lieu le plus civilisé du poème — une ville portuaire dotée de remparts, de navires et d'une cour, décrite avec plus de détails sociaux que n'importe quel endroit qu'Ulysse gouverne réellement.",
          "mimeType": "application/json",
          "digest": "sha256:82676a705e6f585091233e3fd1ff2a55eba495bd39a021815f62a3c1a0003f1d"
        },
        {
          "uri": "santismm://homeric/places/ja/scheria",
          "name": "homeric/places/scheria@ja",
          "title": "スケリア",
          "description": "パイアケス人の島。帰郷前の最後の立ち寄り地であり、詩の中で最も文明化された場所。城壁、船、宮廷を備えた港湾都市であり、オデュッセウスが実際に支配しているどの場所よりも社会的な詳細が描かれている。",
          "mimeType": "application/json",
          "digest": "sha256:263e9682730018522f5869252341e40606264ff812c86c6f37d2773e5b2dfb67"
        },
        {
          "uri": "santismm://homeric/places/pt/scheria",
          "name": "homeric/places/scheria@pt",
          "title": "Esquéria",
          "description": "A ilha dos feácios, a última escala antes de casa e o lugar mais civilizado do poema: uma cidade portuária com muralhas, naus e corte, descrita com mais detalhe social que qualquer lugar que Odisseu governe.",
          "mimeType": "application/json",
          "digest": "sha256:d629ec4e3b8ddb8769e1ca18884b16e54cb251662ee59128a0b6d7602a8ad934"
        },
        {
          "uri": "santismm://homeric/places/zh/scheria",
          "name": "homeric/places/scheria@zh",
          "title": "斯克里亚",
          "description": "费阿基亚人的岛屿，回家前的最后一站，也是诗中最文明的地方——一个拥有城墙、船只和宫廷的港口城市，其社会细节描写比奥德修斯实际统治的任何地方都要详尽。",
          "mimeType": "application/json",
          "digest": "sha256:86e472ecb366d4a2a8ff0ecdc5276f3b014efb9aaa3ba5f2cd838e44f91489f6"
        },
        {
          "uri": "santismm://homeric/places/de/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@de",
          "title": "Skylla und Charybdis",
          "description": "Die einzige Gefahr auf den Irrwegen, die sich wie ein realer Ort verhält: eine Meerenge mit einer tödlichen Gezeitenströmung auf der einen und Klippen auf der anderen Seite. Die Antike verortete sie in Messina und stellte dies nie infrage.",
          "mimeType": "application/json",
          "digest": "sha256:6bc5e3f33d705701394416394c134c68282a7b2e189205fefcdbecbe7911d01e"
        },
        {
          "uri": "santismm://homeric/places/en/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@en",
          "title": "Scylla and Charybdis",
          "description": "The one hazard in the wanderings that behaves like a real place: a narrow strait with a lethal tidal race on one side and cliffs on the other. Antiquity put it at Messina and never argued.",
          "mimeType": "application/json",
          "digest": "sha256:5561f972f7c82e5ae600f43d8c47b0fed0fc47bc719826d25c5d98bce8799e45"
        },
        {
          "uri": "santismm://homeric/places/es/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@es",
          "title": "Escila y Caribdis",
          "description": "El único peligro de las andanzas que se comporta como un lugar real: un estrecho angosto con una corriente de marea letal a un lado y acantilados al otro. La Antigüedad lo situó en Mesina y nunca lo discutió.",
          "mimeType": "application/json",
          "digest": "sha256:d0047c82d28e8969ecbbec56f0cd3996aa98328912aa1f895303b755a3c2d278"
        },
        {
          "uri": "santismm://homeric/places/fr/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@fr",
          "title": "Scylla et Charybde",
          "description": "Le seul péril des errances qui se comporte comme un lieu réel : un détroit étroit avec un courant de marée mortel d'un côté et des falaises de l'autre. L'Antiquité l'a situé à Messine sans jamais le contester.",
          "mimeType": "application/json",
          "digest": "sha256:709a6fb78efa2371dbe35b7921a52a3fb7c2d9b48b91b6a3bd05bcfc36aea66d"
        },
        {
          "uri": "santismm://homeric/places/ja/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@ja",
          "title": "スキュラとカリュブディス",
          "description": "漂流の旅における危険の中で、唯一実在の場所のように振る舞うもの：片側に致命的な激しい潮流があり、もう片側に崖がある狭い海峡。古代の人々はこれをメッシーナに比定し、異論を挟まなかった。",
          "mimeType": "application/json",
          "digest": "sha256:9e0915e5757529fe589653e575d50e17dd0b8c5aa73356766fe40843aa5dca64"
        },
        {
          "uri": "santismm://homeric/places/pt/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@pt",
          "title": "Cila e Caribdes",
          "description": "O único perigo das andanças que se comporta como um lugar real: um estreito apertado com uma corrente de maré letal de um lado e falésias do outro. A Antiguidade o situou em Messina e nunca discutiu.",
          "mimeType": "application/json",
          "digest": "sha256:1a2d749838aef03d21d4f250d688ff0d7617e0d8de950cb65222a18eda5b11b6"
        },
        {
          "uri": "santismm://homeric/places/zh/scylla-and-charybdis",
          "name": "homeric/places/scylla-and-charybdis@zh",
          "title": "斯库拉和卡律布狄斯",
          "description": "漂泊旅程中唯一表现得像个真实地点的险境：一条狭窄的海峡，一侧是致命的急流，另一侧是悬崖。古代学者将其定在美西纳，且从未有过争议。",
          "mimeType": "application/json",
          "digest": "sha256:8a2b5edb7556a3dfa6b1e3f257f250e722214e99e0c441f6452af87b88388d71"
        },
        {
          "uri": "santismm://homeric/places/de/sirens",
          "name": "homeric/places/sirens@de",
          "title": "Die Insel der Sirenen",
          "description": "Zwei Sängerinnen auf einer blühenden Wiese, umgeben von den Knochen der Männer, die anhielten, um zuzuhören. Das Epos gibt keine Koordinaten und nur eine Navigationsanweisung: Wachs in die Ohren und den Kapitän an den Mast fesseln.",
          "mimeType": "application/json",
          "digest": "sha256:4d1853a2d8c4456e2de47a29adc624d4a8360c94d72f9e73bb31ab28730c0dc7"
        },
        {
          "uri": "santismm://homeric/places/en/sirens",
          "name": "homeric/places/sirens@en",
          "title": "The Sirens' island",
          "description": "Two singers on a flowery meadow surrounded by the bones of the men who stopped to listen. The poem gives no coordinates and one navigational instruction: wax in the ears, and tie the captain to the mast.",
          "mimeType": "application/json",
          "digest": "sha256:b64b1f451113a4ba2a07eac36da27fbe2d6e0f613b88b84168495b6f1da3ebe3"
        },
        {
          "uri": "santismm://homeric/places/es/sirens",
          "name": "homeric/places/sirens@es",
          "title": "La isla de las sirenas",
          "description": "Dos cantoras en un prado florido rodeado por los huesos de quienes se detuvieron a escuchar. El poema no da coordenadas y sí una instrucción náutica: cera en los oídos y el capitán atado al mástil.",
          "mimeType": "application/json",
          "digest": "sha256:0765ef870cb4ff54278ef12519e3e437b3ac2ec83a7cac49ad4eade7e1c73212"
        },
        {
          "uri": "santismm://homeric/places/fr/sirens",
          "name": "homeric/places/sirens@fr",
          "title": "L'île des Sirènes",
          "description": "Deux chanteuses sur une prairie fleurie, entourées des ossements des hommes qui se sont arrêtés pour les écouter. Le poème ne donne aucune coordonnée et une seule consigne de navigation : de la cire dans les oreilles, et attacher le capitaine au mât.",
          "mimeType": "application/json",
          "digest": "sha256:1bfb48eccc2dfac8b4b81b3579f37d019db5b8f6294ecd600db083f9bda09235"
        },
        {
          "uri": "santismm://homeric/places/ja/sirens",
          "name": "homeric/places/sirens@ja",
          "title": "セイレーンの島",
          "description": "立ち止まって耳を傾けた男たちの骨に囲まれた、花咲く草原の上の2人の歌い手。詩には座標は示されておらず、航海上の指示が1つだけある。耳に蝋を詰め、船長をマストに縛り付けること。",
          "mimeType": "application/json",
          "digest": "sha256:2a4756ad16b078ce4ffb13cf9fb1b52b5cd39ce52256abe045c214603ec734c7"
        },
        {
          "uri": "santismm://homeric/places/pt/sirens",
          "name": "homeric/places/sirens@pt",
          "title": "A ilha das sereias",
          "description": "Duas cantoras num prado florido cercado pelos ossos de quem parou para ouvir. O poema não dá coordenadas e dá uma instrução náutica: cera nos ouvidos e o capitão amarrado ao mastro.",
          "mimeType": "application/json",
          "digest": "sha256:120278a502c16e3b26a008382bd3c5f7698dccc4d1d4cb9deb5609a75acb2637"
        },
        {
          "uri": "santismm://homeric/places/zh/sirens",
          "name": "homeric/places/sirens@zh",
          "title": "塞壬的岛屿",
          "description": "两位歌手在鲜花盛开的草地上歌唱，周围堆满了驻足倾听者的白骨。史诗没有给出坐标，只给了一条航行指示：用蜡封住耳朵，并将船长绑在桅杆上。",
          "mimeType": "application/json",
          "digest": "sha256:76acb645b63bf9e1f822be49ad07cd338577459c53a7fc3b917e52033b9a10a0"
        },
        {
          "uri": "santismm://homeric/places/de/sparta",
          "name": "homeric/places/sparta@de",
          "title": "Sparta (Lakedaimon)",
          "description": "Das Königreich von Menelaos und Helena. Das Tal ist sicher, der Palast nicht: Lakonien hat mykenische Herrenhäuser und einen frühen Kult des Menelaos hervorgebracht, aber keinen Palast, der mit Pylos oder Mykene vergleichbar wäre.",
          "mimeType": "application/json",
          "digest": "sha256:7d7edd49d76a8abc0f35786bc67267774b93025676eb4445a9ba1f3f6647c096"
        },
        {
          "uri": "santismm://homeric/places/en/sparta",
          "name": "homeric/places/sparta@en",
          "title": "Sparta (Lacedaemon)",
          "description": "Menelaus and Helen's kingdom. The valley is certain, the palace is not: Laconia has produced Mycenaean mansions and an early cult of Menelaus, but no palace to match Pylos or Mycenae.",
          "mimeType": "application/json",
          "digest": "sha256:79e744ff2d8370f888d9ac68e5b484b7d8db60347cbd5e933583530fe73f1cf7"
        },
        {
          "uri": "santismm://homeric/places/es/sparta",
          "name": "homeric/places/sparta@es",
          "title": "Esparta (Lacedemonia)",
          "description": "El reino de Menelao y Helena. El valle es seguro; el palacio, no: Laconia ha dado mansiones micénicas y un culto temprano a Menelao, pero ningún palacio comparable a Pilos o Micenas.",
          "mimeType": "application/json",
          "digest": "sha256:5f31268bb987533f2ec39d66a7b346f1980b03d40bd8e49a68cb5fb29dc35857"
        },
        {
          "uri": "santismm://homeric/places/fr/sparta",
          "name": "homeric/places/sparta@fr",
          "title": "Sparte (Lacédémone)",
          "description": "Le royaume de Ménélas et d'Hélène. La vallée est certaine, le palais ne l'est pas : la Laconie a livré des demeures mycéniennes et un culte précoce de Ménélas, mais aucun palais comparable à Pylos ou Mycènes.",
          "mimeType": "application/json",
          "digest": "sha256:7bae9dcab837ea5535ea4daac796598888042c9239323f9ebc8136b899e3d51a"
        },
        {
          "uri": "santismm://homeric/places/ja/sparta",
          "name": "homeric/places/sparta@ja",
          "title": "スパルタ（ラケダイモン）",
          "description": "メネラオスとヘレネの王国。渓谷は確実だが、宮殿は不確実である。ラコニアからはミケーネ時代の邸宅や初期のメネラオス信仰の跡が出土しているが、ピュロスやミケーネに匹敵する宮殿は見つかっていない。",
          "mimeType": "application/json",
          "digest": "sha256:0b1149a146e53f8a4fdd615bbf0a92b3d84436df1b36fe97457d50f6110335de"
        },
        {
          "uri": "santismm://homeric/places/pt/sparta",
          "name": "homeric/places/sparta@pt",
          "title": "Esparta (Lacedemônia)",
          "description": "O reino de Menelau e Helena. O vale é certo; o palácio, não: a Lacônia produziu mansões micênicas e um culto antigo a Menelau, mas nenhum palácio comparável a Pilos ou Micenas.",
          "mimeType": "application/json",
          "digest": "sha256:f4aefd6ff2636789fcbb4864d14aaefef218bbb6fd93cc9d802b3c88a25fe738"
        },
        {
          "uri": "santismm://homeric/places/zh/sparta",
          "name": "homeric/places/sparta@zh",
          "title": "斯巴达（拉刻代蒙）",
          "description": "墨涅拉俄斯和海伦的王国。山谷是确定的，但宫殿并不确定：拉科尼亚出土了迈锡尼时期的宅邸以及早期的墨涅拉俄斯崇拜遗迹，但没有发现能与皮洛斯或迈锡尼相媲美的宫殿。",
          "mimeType": "application/json",
          "digest": "sha256:e5333d68ee11c891d077e47f4f0e6f7ae5ade37b8cc73817a759822edc7989e4"
        },
        {
          "uri": "santismm://homeric/places/de/tenedos",
          "name": "homeric/places/tenedos@de",
          "title": "Tenedos",
          "description": "Die Insel vor der Küste von Troja: ein Stützpunkt in der Ilias, ein Versteck in der späteren Tradition und eine Erinnerung daran, dass die Meereslandschaft der Troas ebenso überprüfbar ist wie ihr Festland.",
          "mimeType": "application/json",
          "digest": "sha256:d246b6fd15f3162a6c43765f56b2cbfc717116bd9c799c1456aa53c32b3b1b9d"
        },
        {
          "uri": "santismm://homeric/places/en/tenedos",
          "name": "homeric/places/tenedos@en",
          "title": "Tenedos",
          "description": "The island offshore from Troy: a staging point in the Iliad, a hiding place in the later tradition, and a reminder that the Troad's seascape is as checkable as its land.",
          "mimeType": "application/json",
          "digest": "sha256:fdd3f716a282897ea35dd63c9d9bfd9d08b17534b262bef6b3f675ef980c9677"
        },
        {
          "uri": "santismm://homeric/places/es/tenedos",
          "name": "homeric/places/tenedos@es",
          "title": "Ténedos",
          "description": "La isla frente a Troya: punto de apoyo en la Ilíada, escondite en la tradición posterior y recordatorio de que el paisaje marino de la Tróade es tan comprobable como su tierra.",
          "mimeType": "application/json",
          "digest": "sha256:d0891b7061ece00987d437065fcac99a1cd2356f2c63e7a757dceaa5b4c16cd4"
        },
        {
          "uri": "santismm://homeric/places/fr/tenedos",
          "name": "homeric/places/tenedos@fr",
          "title": "Ténédos",
          "description": "L'île au large de Troie : un point d'étape dans l'Iliade, un lieu de refuge dans la tradition ultérieure, et un rappel que le paysage marin de la Troade est aussi vérifiable que sa terre.",
          "mimeType": "application/json",
          "digest": "sha256:21c14ef6a1ef7a29d6c7dc69f09b939b775ae562b9796b01c91cfc8f6f6c9683"
        },
        {
          "uri": "santismm://homeric/places/ja/tenedos",
          "name": "homeric/places/tenedos@ja",
          "title": "テネドス",
          "description": "トロイア沖の島：『イリアス』における中継地であり、後世の伝承における隠れ場所であり、トロアス地方の海景がその陸地と同様に検証可能であることを思い出させるものである。",
          "mimeType": "application/json",
          "digest": "sha256:a6ccea0257d87b6eef22bf5171521869443231dd2573bdc7aa9c687141837f93"
        },
        {
          "uri": "santismm://homeric/places/pt/tenedos",
          "name": "homeric/places/tenedos@pt",
          "title": "Tênedos",
          "description": "A ilha diante de Troia: ponto de apoio na Ilíada, esconderijo na tradição posterior e lembrete de que a paisagem marinha da Trôade é tão verificável quanto sua terra.",
          "mimeType": "application/json",
          "digest": "sha256:56c992286d95a2fdd537458919fbbc3ddad4c233355d4d9a1f300abba1e6a8e9"
        },
        {
          "uri": "santismm://homeric/places/zh/tenedos",
          "name": "homeric/places/tenedos@zh",
          "title": "特涅多斯岛",
          "description": "特洛伊近海的岛屿：在《伊利亚特》中是集结地，在后来的传统中是藏匿处，它提醒人们，特罗阿德的海景与它的陆地一样是可以考证的。",
          "mimeType": "application/json",
          "digest": "sha256:735e65daa4195465a88d197a9493acecd5d6f39bfc5db9056d89b25292747093"
        },
        {
          "uri": "santismm://homeric/places/de/thrinacia",
          "name": "homeric/places/thrinacia@de",
          "title": "Thrinakia",
          "description": "Die Insel der Rinder des Sonnengottes, auf der die Gefährten das Sakrileg begehen, das sie alle das Leben kostet. Die Antike deutete den Namen als Sizilien; das Epos beschreibt einen Ort, der nicht sicher besucht werden kann.",
          "mimeType": "application/json",
          "digest": "sha256:d59923cc907d73a26e22888d15a4594ee83884eb77dfb397e2991791416b70ef"
        },
        {
          "uri": "santismm://homeric/places/en/thrinacia",
          "name": "homeric/places/thrinacia@en",
          "title": "Thrinacia",
          "description": "The island of the Sun's cattle, where the crew commit the sacrilege that kills them all. Antiquity read the name as Sicily; the poem describes a place that cannot be visited safely.",
          "mimeType": "application/json",
          "digest": "sha256:94e340cc207a7edd068b90d449b56c0879b12c77e5db65f35f4c337316bd63f9"
        },
        {
          "uri": "santismm://homeric/places/es/thrinacia",
          "name": "homeric/places/thrinacia@es",
          "title": "Trinacia",
          "description": "La isla de las vacas del Sol, donde la tripulación comete el sacrilegio que la mata entera. La Antigüedad leyó el nombre como Sicilia; el poema describe un lugar al que no se puede llegar sin peligro.",
          "mimeType": "application/json",
          "digest": "sha256:d14eddd36f5f7aa73e6d9247ab9a65ecc3640d6091208151f41f013e7e2961c3"
        },
        {
          "uri": "santismm://homeric/places/fr/thrinacia",
          "name": "homeric/places/thrinacia@fr",
          "title": "Thrinacie",
          "description": "L'île des troupeaux du Soleil, où l'équipage commet le sacrilège qui causera leur perte à tous. L'Antiquité a assimilé ce nom à la Sicile ; le poème décrit un lieu qu'on ne peut visiter sans péril.",
          "mimeType": "application/json",
          "digest": "sha256:f467ef0ce522b222a38864085b31fca71521a8cd3ab2ff25c57d288c7cbb7676"
        },
        {
          "uri": "santismm://homeric/places/ja/thrinacia",
          "name": "homeric/places/thrinacia@ja",
          "title": "スリナキア",
          "description": "太陽神の牛の島。ここで乗組員たちは全員の死を招く冒涜を犯す。古代の人々はこの名前をシチリアと解釈したが、詩が描写しているのは安全に訪れることのできない場所である。",
          "mimeType": "application/json",
          "digest": "sha256:5bf5f11c2a75e40c3eaa65bb2f94922e332c91291fac88c7733ead53e036ffa6"
        },
        {
          "uri": "santismm://homeric/places/pt/thrinacia",
          "name": "homeric/places/thrinacia@pt",
          "title": "Trinácia",
          "description": "A ilha do gado do Sol, onde a tripulação comete o sacrilégio que a mata inteira. A Antiguidade leu o nome como Sicília; o poema descreve um lugar aonde não se pode chegar sem perigo.",
          "mimeType": "application/json",
          "digest": "sha256:7396413d274ee078fbf5d09adaad269564c9f58723c1e553ab8de733a86cf9f0"
        },
        {
          "uri": "santismm://homeric/places/zh/thrinacia",
          "name": "homeric/places/thrinacia@zh",
          "title": "斯里纳基亚岛",
          "description": "太阳神神牛的岛屿，船员们在此犯下了导致他们全部丧命的亵渎罪行。古代学者将该名称解读为西西里岛；而史诗描述的则是一个无法安全造访的地方。",
          "mimeType": "application/json",
          "digest": "sha256:0b79b95dcc615ebffa26c0d8e3d88003e4219f28e3d1780c4539a57b95096aa1"
        },
        {
          "uri": "santismm://homeric/places/de/tiryns",
          "name": "homeric/places/tiryns@de",
          "title": "Tiryns",
          "description": "Eine Stadt aus dem Schiffskatalog, deren homörisches Beiwort eine wörtliche Beschreibung dessen ist, was überdauert hat: Mauern, die so gewaltig sind, dass spätere Griechen annahmen, Riesen hätten sie erbaut.",
          "mimeType": "application/json",
          "digest": "sha256:e09206c49f908d989eaf223588a3042cb134d431d15f887ec66de6194bab47c5"
        },
        {
          "uri": "santismm://homeric/places/en/tiryns",
          "name": "homeric/places/tiryns@en",
          "title": "Tiryns",
          "description": "A Catalogue-of-Ships city whose Homeric epithet is a literal description of what survives: walls so massive that later Greeks assumed giants had built them.",
          "mimeType": "application/json",
          "digest": "sha256:3bfb6c5ed36b75d6c5a23ee0b0559e1edfb2fb4d24b3d2bd87dcc718bb109a83"
        },
        {
          "uri": "santismm://homeric/places/es/tiryns",
          "name": "homeric/places/tiryns@es",
          "title": "Tirinto",
          "description": "Una ciudad del Catálogo de las Naves cuyo epíteto homérico es una descripción literal de lo que se conserva: murallas tan macizas que los griegos posteriores dieron por hecho que las habían levantado gigantes.",
          "mimeType": "application/json",
          "digest": "sha256:381b93738780fd93dac011d82904914764e4eea2adc8e6b2df93a3361e8c1bf2"
        },
        {
          "uri": "santismm://homeric/places/fr/tiryns",
          "name": "homeric/places/tiryns@fr",
          "title": "Tirynthe",
          "description": "Une cité du Catalogue des vaisseaux dont l'épithète homérique est une description littérale de ce qui subsiste : des remparts si massifs que les Grecs des époques ultérieures pensaient que des géants les avaient bâtis.",
          "mimeType": "application/json",
          "digest": "sha256:f5766cb1db2e9478b68326963cde787f0b3504f636a2de9038cced32e0a50e2c"
        },
        {
          "uri": "santismm://homeric/places/ja/tiryns",
          "name": "homeric/places/tiryns@ja",
          "title": "ティリンス",
          "description": "『船名録』に登場する都市で、そのホメロス風の異名は、現存する遺構を文字通り描写したものである。あまりにも巨大な城壁であるため、後世のギリシャ人は巨人が建てたものと考えた。",
          "mimeType": "application/json",
          "digest": "sha256:e59e13151df729be080e68b62315eea1e98b8b797fdd8015dd18e77f4e6bbbe8"
        },
        {
          "uri": "santismm://homeric/places/pt/tiryns",
          "name": "homeric/places/tiryns@pt",
          "title": "Tirinto",
          "description": "Uma cidade do Catálogo das Naus cujo epíteto homérico é uma descrição literal do que sobreviveu: muralhas tão maciças que os gregos posteriores supuseram terem sido erguidas por gigantes.",
          "mimeType": "application/json",
          "digest": "sha256:0f72076eb8906b735e7a68d98844b2c7af5c44061b1958dcfad378446553fc05"
        },
        {
          "uri": "santismm://homeric/places/zh/tiryns",
          "name": "homeric/places/tiryns@zh",
          "title": "蒂林斯",
          "description": "《船名志》中的一座城市，其荷马史诗中的修饰语是对现存遗迹的字面描述：城墙如此雄伟，以至于后来的希腊人认为它们是由巨人建造的。",
          "mimeType": "application/json",
          "digest": "sha256:f96375ec3136dd8caffe2e95fe73ad4eede796894a1884bb235445a1e00e40f6"
        },
        {
          "uri": "santismm://homeric/places/de/troy",
          "name": "homeric/places/troy@de",
          "title": "Troja (Ilios)",
          "description": "Die von der Ilias belagerte Stadt, die seit 1822 mit dem Hügel von Hisarlık in der nordwestlichen Türkei identifiziert und seit 1870 kontinuierlich ausgegraben wird. Die Identifizierung des Ortes ist geklärt; was dort geschah, ist es nicht.",
          "mimeType": "application/json",
          "digest": "sha256:b7a512a6e2dd7d568eeffed125e3ff04210d1eecf5b6e3abb9b0ce49d817e269"
        },
        {
          "uri": "santismm://homeric/places/en/troy",
          "name": "homeric/places/troy@en",
          "title": "Troy (Ilios)",
          "description": "The city the Iliad besieges, identified since 1822 with the mound of Hisarlık in north-western Türkiye and excavated continuously since 1870. The identification of the place is settled; what happened there is not.",
          "mimeType": "application/json",
          "digest": "sha256:9ab44e3f173d94b2098c87d5111405343a497de2ca17591175f7d3928209e133"
        },
        {
          "uri": "santismm://homeric/places/es/troy",
          "name": "homeric/places/troy@es",
          "title": "Troya (Ilión)",
          "description": "La ciudad que asedia la Ilíada, identificada desde 1822 con el montículo de Hisarlık, en el noroeste de Turquía, y excavada sin interrupción desde 1870. La identificación del lugar está zanjada; lo que allí ocurrió, no.",
          "mimeType": "application/json",
          "digest": "sha256:43e301788b618faf84bfd64d90a87adbfd1d541bb6e2680a3b50174578585469"
        },
        {
          "uri": "santismm://homeric/places/fr/troy",
          "name": "homeric/places/troy@fr",
          "title": "Troie (Ilios)",
          "description": "La ville assiégée dans l'Iliade, identifiée depuis 1822 au monticule d'Hisarlık dans le nord-ouest de la Turquie et fouillée en continu depuis 1870. L'identification du lieu est établie ; ce qui s'y est passé ne l'est pas.",
          "mimeType": "application/json",
