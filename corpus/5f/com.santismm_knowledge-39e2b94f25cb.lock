          "description": "奥德修斯在一个下午便失去了十二艘船中的十一艘。该港口是诗中描述最精确的锚地，但无人能证实它究竟是哪一个。",
          "mimeType": "application/json",
          "digest": "sha256:af836869f0663cf5a9a1b338284ed8b7e16bb31731ca3265a68b9318b0bf83b7"
        },
        {
