        {
          "name": "store_delivery",
          "title": "What stores say about delivery",
          "description": "What stores' own shipping policies say: the countries they ship to, the days, the cost or a free-shipping threshold. Pass the `domain` of offers (at most 12) and the buyer's country. A fact a policy does not state is left empty; the store shows the exact cost of an order.",
          "inputSchema": {
