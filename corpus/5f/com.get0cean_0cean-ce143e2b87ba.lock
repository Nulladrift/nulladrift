      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "0cean is a shopping network of independent online stores. This connector only reads: it asks the stores and returns each store's own offer (product, price, stock, a picture and a link to the product on the store's site). Nothing is bought through it and nothing is kept for anyone (no wish, cart or product), and it needs no account: the person buys on the store's own page, from the store. Requests are only counted, without their words (/privacy). ask_stores takes a request in a few English words, with conditions as fields (a price, in stock, words a product must or must not have, the buyer's country). shop_for_wish takes what the person wants (the product or who it is for, a budget, the country) and answers with offers or with one question. store_delivery gives what the stores' own shipping policies say. list_categories names the kinds of product. about_network says where offers come from, how they are ordered and which goods this connector leaves out.",
      "tools": [
        {
          "name": "about_network",
          "title": "About 0cean",
          "description": "How this connector works: where the offers come from, how they are ordered, and which goods it leaves out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About 0cean"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adcbd99f4a9f04765b8633ecca112d2924a6943078a8f8437e1ed857a698d177"
        },
        {
          "name": "ask_stores",
          "title": "Ask the stores",
          "description": "Asks the independent online stores that sell this kind of product and returns each store's own offer: product, price, stock, a picture and a link to the product on the store's site. Write the request in a few English words (\"dark roast whole bean coffee\", \"folding e-bike under $1,500\"); a sentence or another language goes to shop_for_wish. Pass conditions as fields; to narrow results, keep the request and add fields. Nothing is bought.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional. A slug from list_categories.",
                "type": "string"
              },
              "cheapest": {
                "description": "Optional. true: the lowest price first.",
                "type": "boolean"
              },
              "country": {
                "description": "Optional. The buyer's country, two letters (ISO 3166-1): \"DE\", \"GB\".",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "Optional. The buyer's currency, three letters: \"EUR\".",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "free_shipping": {
                "description": "Optional. true: free delivery only.",
                "type": "boolean"
              },
              "in_stock": {
                "description": "Optional. true: in stock only.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many offers, best first. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_days": {
                "description": "Optional. Delivered within this many days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional. The most the buyer will pay, in the buyer's currency.",
                "type": "number"
              },
              "min_price": {
                "description": "Optional. The least, in the same currency.",
                "type": "number"
              },
              "min_rating": {
                "description": "Optional. At least this many stars, of five.",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "must": {
                "description": "Optional. Words the product must have: a colour, a size, a material.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not": {
                "description": "Optional. Words the product's name must not have.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "on_sale": {
                "description": "Optional. true: on sale only.",
                "type": "boolean"
              },
              "price_currency": {
                "description": "Optional. The currency max_price and min_price were said in, when it is not the buyer's (\"under $80\" from a buyer in Germany: max_price 80, price_currency \"USD\", country \"DE\").",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "request": {
                "description": "What the buyer needs, in a few English words. May end with \"under $50\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "ships_here": {
                "description": "Optional. true: only stores whose shipping policy names the buyer's country.",
                "type": "boolean"
              },
              "sort_by": {
                "description": "Optional. Fastest delivery, lowest total with delivery, best rated, most reliable store, or real deals first.",
                "enum": ["delivery", "total", "rating", "store", "deal"],
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask the stores"
          },
          "behavior": {
