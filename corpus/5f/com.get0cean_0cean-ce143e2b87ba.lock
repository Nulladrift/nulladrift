        },
        {
          "name": "shop_for_wish",
          "title": "Shop for a wish in the person's words",
          "description": "Takes what the person wants, in any language: the product or who it is for, a budget, the country. Returns stores' offers, or one question when it names no product. To go on, call again with the person's answer and the `record` the last answer gave. Nothing is bought.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional. The buyer's country, two letters (ISO 3166-1): \"DE\", \"GB\".",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "Optional. The buyer's currency, three letters: \"EUR\".",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "description": "How many offers, best first. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "record": {
                "description": "Optional. The `record` the last answer gave, to go on from it.",
                "type": "object"
              },
              "wish": {
                "description": "What the person wants: the product or who it is for, a budget, the country. Leave out names, addresses, cities and other personal details.",
                "maxLength": 1000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["wish"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
