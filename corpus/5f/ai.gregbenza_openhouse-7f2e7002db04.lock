            "properties": {
              "label": {
                "description": "an independent draw from the same round; both sides must use the same label",
                "type": "string"
              },
              "round": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc57b26baef26a9bb2e7880e3f314a24197fbd7cfb4542faee7f0f00b107397e"
        },
