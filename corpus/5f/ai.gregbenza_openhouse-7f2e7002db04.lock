              },
              "collection": {
                "description": "dhp, mn, dn, sn, an, snp, ud, iti, thag, thig, kp or ja",
                "type": "string"
              },
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
