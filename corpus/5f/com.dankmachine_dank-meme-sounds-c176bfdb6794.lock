{
  "lockfileVersion": 2,
  "subjects": {
    "com.dankmachine/dank-meme-sounds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dankmachine.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dank-meme-sounds",
        "title": "DankMachine meme sounds",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Meme sound buttons from dankmachine.com. Every result carries the meme's culture: about, origin (only when known), how_used, variations, moods, use_cases, good_for platforms and popularity. Get several candidates (find_reaction_sound for a moment, browse_sounds with filters from list_filters, search_sounds for names) and choose the best fit yourself; prefer well-known sounds when the user wants a recognizable meme. Every result has audio_url (MP3) and page_url; link the page when you share a sound. Catalog sounds have unverified rights: fine for personal fun and private projects; check the source before commercial use.",
      "tools": [
        {
          "name": "browse_sounds",
          "title": "Browse candidate sounds with full meme context",
          "description": "Get up to 50 candidate sounds with everything known about each one: about, origin (where the meme comes from, only when known), how_used (how people use it), variations, moods, use_cases, good_for platforms, tags and popularity. Filter by mood, use_case, category or platform (see list_filters), optionally narrow with a query, then choose the best sound yourself.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "default": 30,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "type": "string"
              },
              "platform": {
                "description": "tiktok, youtube, instagram-reels, capcut, discord, twitch, obs, zoom, video-editing, group-chats",
                "type": "string"
              },
              "query": {
                "description": "Optional words to match",
                "type": "string"
              },
              "use_case": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40b10f7f7b3dc79a023e4175a739a756cede45808edd05054818472d65d784e8"
        },
        {
          "name": "find_reaction_sound",
          "title": "Find a reaction sound for a situation",
          "description": "Describe a moment (\"my code finally compiled\", \"awkward silence\", \"plot twist\") and get candidate meme sounds with their full culture (origin, how_used, moods, use_cases, good_for platforms). Read them and pick the one that fits best yourself.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "situation": {
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0444535afc31a75cbb9f04ba55f1da3ee1930a7e8292b3d29dd81a2dce18465"
        },
        {
          "name": "get_random_sound",
          "title": "Random meme sound",
          "description": "A random sound, optionally from one category or with one mood.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "mood": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68f90306c0d835da28ce5dd2f8058c13101c8b56a558b21492ed119b69e9317b"
        },
        {
          "name": "get_sound",
          "title": "Get one sound",
          "description": "Full metadata for one sound by slug (or the best match for a query).",
          "inputSchema": {
            "properties": {
              "sound": {
                "description": "Slug like \"vine-boom-sound-70972\" or a search query",
                "type": "string"
              }
            },
            "required": ["sound"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba3bf6ea8bcde6e9b11b00d02c2246a18fa4772c03a4ea742cf1e509d8e73be5"
        },
        {
          "name": "get_trending_sounds",
          "title": "Trending sounds",
          "description": "What people are actually pressing on DankMachine right now.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "window": {
                "default": "24h",
                "enum": ["rising", "1h", "24h", "7d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cfecfb5b98dbd4c478e4e1e603a2ca7b250d6372d6491a579a1e8a842e6901f"
        },
        {
          "name": "list_categories",
