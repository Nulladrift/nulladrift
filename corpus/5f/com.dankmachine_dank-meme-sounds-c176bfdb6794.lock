        },
        {
          "name": "get_trending_sounds",
          "title": "Trending sounds",
          "description": "The sounds played most on DankMachine in a time window (rising, last hour, 24 hours or 7 days).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "window": {
