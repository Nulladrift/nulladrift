        {
          "name": "search_sounds",
          "title": "Search meme sounds",
          "description": "Search DankMachine meme sound buttons by name, alias, tag, mood or use case. Returns playable MP3 URLs, pixel-art images and pages.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug",
                "type": "string"
              },
              "limit": {
