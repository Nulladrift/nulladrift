              },
              "mood": {
                "description": "Optional mood, e.g. funny, dramatic, awkward, victory, fail, surprise, scary, hype",
                "type": "string"
              },
              "query": {
                "description": "Words to match, e.g. \"vine boom\", \"dramatic bass\", \"minecraft\"",
