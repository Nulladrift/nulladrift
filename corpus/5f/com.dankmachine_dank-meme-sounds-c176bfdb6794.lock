{
  "lockfileVersion": 2,
  "subjects": {
    "com.dankmachine/dank-meme-sounds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dankmachine.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dank-meme-sounds",
        "title": "DankMachine meme sounds",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Meme sound buttons from dankmachine.com. Every result carries the meme's culture: about, origin (only when known), how_used, variations, moods, use_cases, good_for platforms and popularity. Get several candidates (find_reaction_sound for a moment, browse_sounds with filters from list_filters, search_sounds for names) and choose the best fit yourself; prefer well-known sounds when the user wants a recognizable meme. Every result has audio_url (MP3) and page_url; link the page when you share a sound. Catalog sounds have unverified rights: fine for personal fun and private projects; check the source before commercial use.",
      "tools": [
        {
          "name": "browse_sounds",
          "title": "Browse candidate sounds with full meme context",
          "description": "Get up to 50 candidate sounds with everything known about each one: about, origin (where the meme comes from, only when known), how_used (how people use it), variations, moods, use_cases, good_for platforms, tags and popularity. Filter by mood, use case, category or platform, optionally narrowed by a query.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "default": 30,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "type": "string"
              },
              "platform": {
                "description": "tiktok, youtube, instagram-reels, capcut, discord, twitch, obs, zoom, video-editing, group-chats",
                "type": "string"
              },
              "query": {
                "description": "Optional words to match",
                "type": "string"
              },
              "use_case": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse candidate sounds with full meme context"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53a8cecd6ddb532717189e03c50f7b61b5b2777de76d4c30a776835eb994678b"
        },
        {
          "name": "find_reaction_sound",
          "title": "Find a reaction sound for a situation",
          "description": "Describe a moment (\"my code finally compiled\", \"awkward silence\", \"plot twist\") and get candidate meme sounds that fit it, each with its origin, how it is used, moods, use cases and the platforms it suits.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "situation": {
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a reaction sound for a situation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9b7e5f044e92264211d368b3483fbd95f8f5752ed2aa5e71ae8cfc15ec55328"
        },
        {
          "name": "get_random_sound",
          "title": "Random meme sound",
          "description": "A random sound, optionally from one category or with one mood.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "mood": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
