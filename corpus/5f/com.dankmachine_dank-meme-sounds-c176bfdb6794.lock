          },
          "digest": "sha256:f6f61f3c17a90811f6cfa9561a4f3b3bf6ecbbf30a9c3b7b98c553b0a8747145"
        },
        {
          "name": "get_sound",
          "title": "Get one sound",
          "description": "Full metadata for one sound by slug (or the best match for a query).",
          "inputSchema": {
            "properties": {
              "sound": {
                "description": "Slug like \"vine-boom\" or a search query",
                "type": "string"
              }
            },
            "required": ["sound"],
            "type": "object"
          },
          "annotations": {
