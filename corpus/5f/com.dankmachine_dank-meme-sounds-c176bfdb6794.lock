            "readOnly": true
          },
          "digest": "sha256:bffdb88145a192b407dad1697cd53247cd94fc0989252fa43013f0fc9e4df023"
        },
        {
          "name": "search_sounds",
          "title": "Search meme sounds",
          "description": "Search DankMachine meme sound buttons by name, alias, tag, mood or use case. Returns playable MP3 URLs, pixel-art images and pages.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug (see list_categories)",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "description": "Optional mood, e.g. funny, dramatic, awkward, victory, fail, surprise, scary, hype",
                "type": "string"
              },
              "query": {
                "description": "Words to match, e.g. \"vine boom\", \"dramatic bass\", \"minecraft\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
