        {
          "name": "search_classes",
          "title": "Find a class to drop in",
          "description": "Classes open to visitors right now at Gymmy gyms that accept drop-ins from anywhere (trial, single class or class pack), near a place or point, optionally one day or one kind of class ('hyrox', 'yoga'). Each result has the gym (address, maps link, logo), class_id, date, spots left, the cheapest price and the offers that book it (offer_id). Book one with book_dropin. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours. Never invent a logo or an address. gym, classId and memberId are internal ids for your next tool call. Never show them to the user. Call get_my_account for who is signed in (name, email, member id, gyms).",
