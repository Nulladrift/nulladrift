        {
          "name": "search_gyms",
          "title": "Search gyms and studios",
          "description": "Find gyms and studios (CrossFit, HYROX, fitness, yoga, pilates, boxing, martial arts, dance, climbing) in France and Europe, near a point or by name, city or postcode. Activity words in the query filter ('CrossFit Nice', 'yoga Lyon'); a style word (bikram, vinyasa, hatha, yin, reformer, lagree) stays on that discipline and is returned in styles. The rest is the place or the gym name. bookable: true means the gym can be booked: url is its public booking page and bookingUrl is that page with marketplace attribution. bookable: false means the gym cannot be booked on Gymmy: url is the directory listing (claimed but not ready, or not on Gymmy). Gyms not on Gymmy come from OpenStreetMap and other public sources (each with its source page and date), with address, opening hours, the gym's own booking link and prices when read on its website (each with its source and date, not verified by Gymmy), and a claim link. The `gym` value is the identifier get_gym, get_schedule, get_prices and start_trial take; get_schedule and start_trial only answer for bookable gyms. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours, and null for anything Gymmy does not have. gym, classId and memberId are internal ids, used as arguments of other Gymmy tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "Only this activity (studios not on Gymmy). Read from the query when it names one.",
                "enum": ["crossfit", "hyrox", "fitness", "yoga", "pilates", "boxing", "martial_arts", "dance", "climbing", "padel"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude to search around.",
