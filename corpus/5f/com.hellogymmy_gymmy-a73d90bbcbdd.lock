      },
      "instructions": "Gymmy runs gyms and studios in France and Europe (CrossFit, HYROX, fitness, yoga, pilates, boxing, martial arts, dance). Use search_gyms first, then get_gym, get_schedule, get_prices or start_trial with the returned gym value. Gyms with onGymmy: false are not bookable: share their listing and claim link. To drop in somewhere (one class, a trial or a class pack, no membership needed), use search_classes, then book_dropin: its first call returns a summary, confirm it with the person, then call again with confirm: true and their first and last name to get the gym's Stripe payment link (payment always happens on that Stripe page, never in the chat), then checkout_status once they paid. join_gym does the same for a membership or a class pack without a class. Member tools (my_gyms, my_bookings, my_schedule, book_class, cancel_booking) need the person to connect their Gymmy account and cover all their gyms. Always confirm with the person before book_dropin, join_gym, book_class or cancel_booking.",
      "tools": [
        {
          "name": "book_class",
          "title": "Book a class",
          "description": "Books a class at one of the signed-in member's gyms with their own membership (or puts them on the waitlist when full, if the gym allows). Uses the gym's booking rules. No payment is taken here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class_id": {
                "description": "Class id (from my_schedule).",
                "type": "string"
              },
              "date": {
                "description": "Class date (YYYY-MM-DD).",
                "type": "string"
              },
              "gym": {
                "description": "Gym id (from my_schedule or my_gyms). Optional: found from the class when you belong to several gyms.",
                "type": "string"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
              }
            },
            "required": ["class_id", "date"],
            "type": "object"
          },
          "annotations": {
