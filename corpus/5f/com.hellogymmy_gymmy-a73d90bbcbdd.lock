        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gymmy runs gyms and studios in France and Europe (CrossFit, HYROX, fitness, yoga, pilates, boxing, martial arts, dance, climbing, padel). These tools are for people looking for a gym or class. If someone asks about Gymmy’s own software for gym owners, point them to https://hellogymmy.com/en/pricing and do not quote or invent its prices or promotions. A trial class at a gym is that gym’s offer, not a Gymmy subscription. Use search_gyms first, then get_gym, get_schedule, get_prices or start_trial with the returned gym value. Every gym result includes the address, a Google Maps link (mapsUrl) and the public listing when Gymmy has them: say the address and the maps link to the person. logoUrl is the gym's own logo, or null. Gyms with bookable: false are not bookable: share url (the directory listing) and do not offer booking. onGymmy: false gyms also have a claim link. To find a free class, call search_classes with the sport (crossfit, hyrox, yoga, pilates, boxing, martial_arts, dance, climbing, padel), the city and an optional date and time. Gyms on Gymmy return real free slots (spots left and capacity) and a bookingUrl to the gym's page. Gyms not on Gymmy are listings with no slots. A hidden test gym is never listed. Then book_dropin: its first call returns a summary, confirm it with the person, then call again with confirm: true and their first and last name to get the gym's Stripe payment link (payment always happens on that Stripe page, never in the chat), then checkout_status once they paid. join_gym does the same for a membership or a class pack without a class. For who is connected (name, email, member id, which gym), call get_my_account. Member tools (get_my_account, my_gyms, my_bookings, my_schedule, book_class, cancel_booking) need the person to connect their Gymmy account and cover all their gyms. Never show gym ids, class ids or member ids to the user: they are only for your next tool call. Only state gyms, classes, times, spots, prices, addresses, logos and links that a tool returned; never invent one. Use get_schedule, get_prices and start_trial only for gyms with bookable: true. Member ids come from get_my_account; my_schedule gives the class ids for book_class and cancel_booking. Always confirm with the person before book_dropin, join_gym, book_class or cancel_booking.",
      "tools": [
        {
          "name": "book_class",
          "title": "Book a class",
          "description": "Books a class at one of the signed-in member's gyms with their own membership (or puts them on the waitlist when full, if the gym allows). Uses the gym's booking rules. No payment is taken here. The answer includes the gym's address and maps link. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours, and null for anything Gymmy does not have. gym, classId and memberId are internal ids, used as arguments of other Gymmy tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class_id": {
                "description": "Class id from my_schedule (classId).",
                "type": "string"
              },
              "date": {
                "description": "Class date (YYYY-MM-DD).",
                "type": "string"
              },
              "gym": {
                "description": "Gym id from my_schedule or get_my_account. Optional: found from the class when the person belongs to several gyms.",
                "type": "string"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
              }
            },
            "required": ["class_id", "date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "gym": {
                "description": "A gym. `gym` is its internal id, used as an argument of other Gymmy tools.",
                "properties": {
                  "address": {
                    "description": "Full postal address (street, postcode, city, country). Null when unknown.",
                    "type": "string"
                  },
                  "appleMapsUrl": {
                    "description": "Apple Maps URL for the same place.",
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "description": "Country, ISO alpha-2 when the gym stored one (FR, PT…).",
                    "type": "string"
                  },
                  "directionsUrl": {
                    "description": "Google Maps directions URL to the gym.",
                    "type": "string"
                  },
                  "email": {
                    "description": "Public contact email of the gym. Not a member email.",
                    "type": "string"
                  },
                  "geo": {
                    "description": "Coordinates when known.",
                    "properties": {
                      "lat": {
                        "type": "number"
                      },
                      "lng": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "gym": {
                    "type": "string"
                  },
                  "listingUrl": {
                    "description": "Public listing or published gym page. Null when the gym is not public.",
                    "type": "string"
                  },
                  "logoUrl": {
                    "description": "Salle logo or sourced photo. Null when the gym has none. Never invent one.",
                    "type": "string"
                  },
                  "mapsUrl": {
                    "description": "Google Maps search URL built from coordinates, or from the address.",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "openingHours": {
                    "description": "Opening hours in one line, when known.",
                    "type": "string"
                  },
                  "openingHoursLines": {
                    "items": {
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "phone": {
                    "description": "Public phone. Null when the gym has not published one.",
                    "type": "string"
                  },
                  "postalCode": {
                    "type": "string"
                  },
                  "street": {
                    "type": "string"
                  },
                  "styles": {
                    "description": "Yoga or pilates style ids (bikram, vinyasa, hatha, yin, reformer, lagree, …). The discipline stays in activities.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "website": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "kind": {
                "const": "booking"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
