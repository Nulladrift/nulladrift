        {
          "name": "book_dropin",
          "title": "Buy and book a class",
          "description": "Buys a trial, a single class or a class pack at a Gymmy gym and books the class in one go, for the signed-in person (any Gymmy account, no membership needed). First call without confirm: returns the summary (price, class) to confirm with the person. Then call with confirm: true, first_name and last_name: returns a Stripe Checkout link on the gym's own account (the spot is held 30 min), or books right away when free. Follow up with checkout_status. Nothing is charged by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class_id": {
                "description": "Class id (from search_classes). Optional with a class pack.",
                "type": "string"
              },
              "confirm": {
                "description": "true only after the person said yes to the summary returned by the first call.",
                "type": "boolean"
              },
              "date": {
                "description": "Class date (YYYY-MM-DD).",
                "type": "string"
              },
              "first_name": {
                "description": "The person's first name (asked once, needed with confirm).",
                "type": "string"
              },
              "gym": {
                "description": "Gymmy gym id (from search_classes).",
                "type": "string"
              },
              "last_name": {
                "description": "The person's last name (needed with confirm).",
                "type": "string"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
              },
              "offer_id": {
                "description": "Offer id (from search_classes offers). Default: the cheapest single entry.",
                "type": "string"
              },
              "site_id": {
                "description": "Site id when the gym has several.",
                "type": "string"
              }
            },
            "required": ["gym"],
            "type": "object"
          },
          "annotations": {
