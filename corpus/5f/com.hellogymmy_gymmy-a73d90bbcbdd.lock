        {
          "name": "get_my_account",
          "title": "My Gymmy account",
          "description": "Who is signed in on Gymmy. Call this for 'what is my Gymmy account', 'which gym am I connected to', 'what's my email', 'what's my name' or 'what's my member id'. Returns the account name, email, member id, membership status (plan and active, unpaid, paused, or coach/admin) and every linked gym with address, city, country, phone, public email, website, maps link, logo, opening hours and listing URL. A test gym hidden from the public directory is still included when it is this member's gym. If the person is not signed in, the answer asks them to connect: the sign-in page accepts an email code for an existing account or creates a Gymmy account. Never show gym ids or member ids to the user. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours. Never invent a logo or an address. gym, classId and memberId are internal ids for your next tool call. Never show them to the user. Call get_my_account for who is signed in (name, email, member id, gyms).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "email": {
                "description": "The signed-in email. You may tell the user this.",
                "type": "string"
              },
              "gyms": {
                "description": "Linked gyms. memberId and gym are internal ids: do not show them to the user.",
                "items": {
                  "description": "A gym. `gym` is the internal id for the next tool call. Do not show it to the user.",
                  "properties": {
                    "address": {
                      "description": "Full postal address (street, postcode, city, country). Null when unknown.",
                      "type": "string"
                    },
                    "appleMapsUrl": {
                      "description": "Apple Maps URL for the same place.",
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "description": "Country, ISO alpha-2 when the gym stored one (FR, PT…).",
                      "type": "string"
                    },
                    "directionsUrl": {
                      "description": "Google Maps directions URL to the gym.",
                      "type": "string"
                    },
                    "email": {
                      "description": "Public contact email of the gym. Not a member email.",
                      "type": "string"
                    },
                    "geo": {
                      "description": "Coordinates when known.",
