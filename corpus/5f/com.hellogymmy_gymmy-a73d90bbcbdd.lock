        {
          "name": "search_classes",
          "title": "Find a class to drop in",
          "description": "Classes open to visitors right now at Gymmy gyms that accept drop-ins from anywhere (trial, single class or class pack), near a place or point, optionally one day or one kind of class ('hyrox', 'yoga'). Each result has the gym, class_id, date, spots left, the cheapest price and the offers that book it (offer_id). Book one with book_dropin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Kind of class or coach to match, e.g. 'WOD', 'HYROX', 'Yoga'.",
                "type": "string"
              },
              "date": {
                "description": "Only this day (YYYY-MM-DD).",
                "type": "string"
              },
              "gym": {
                "description": "Only this gym (Gymmy id from search_gyms).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude to search around.",
                "type": "number"
              },
              "limit": {
                "description": "Max results. Default 15.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude to search around.",
                "type": "number"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
