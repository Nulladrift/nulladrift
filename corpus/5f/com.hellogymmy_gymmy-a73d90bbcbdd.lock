      "serverInfo": {
        "name": "gymmy",
        "title": "Gymmy",
        "version": "1.0.0",
        "description": "Find gyms and studios in France and Europe, see class schedules and prices, book a trial, and manage your Gymmy bookings.",
        "websiteUrl": "https://hellogymmy.com",
        "icons": [
          {
            "src": "https://hellogymmy.com/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
