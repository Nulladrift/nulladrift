              },
              "gym": {
                "description": "Gym identifier: the `gym` value from search_gyms (page slug or Gymmy id).",
                "type": "string"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
