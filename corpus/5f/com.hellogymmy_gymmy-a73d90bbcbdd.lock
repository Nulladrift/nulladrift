        {
          "name": "search_classes",
          "title": "Find a free class to book",
          "description": "Bookable aggregator: search by sport (crossfit, hyrox, yoga, pilates, boxing / boxe, martial_arts / arts martiaux, dance / danse, climbing / escalade, padel), city and optional date and time. Gyms on Gymmy that accept visitors return their real free classes (spotsLeft and capacity from the planning) and a bookingUrl that opens the gym's page on that class. Gyms not on Gymmy come back under listings, with slots empty and no booking link. A Gymmy class can be booked with its bookingUrl or with book_dropin. A hidden test gym is never returned. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours, and null for anything Gymmy does not have. gym, classId and memberId are internal ids, used as arguments of other Gymmy tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Kind of class or coach to match, e.g. 'WOD', 'HYROX', 'Yoga'.",
                "type": "string"
              },
              "date": {
                "description": "Only this day (YYYY-MM-DD).",
                "type": "string"
              },
              "gym": {
                "description": "Only this gym (Gymmy id from search_gyms).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude to search around.",
                "type": "number"
              },
              "limit": {
                "description": "Max results. Default 15.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude to search around.",
                "type": "number"
              },
              "locale": {
                "description": "Answer language: fr (default), en, pt, es or de. Pass en when the person writes in English.",
                "enum": ["fr", "en", "pt", "es", "de"],
                "type": "string"
              },
              "query": {
                "description": "City, district, postcode or address ('Lyon', 'yoga Lyon', 'padel à Bordeaux'). A sport in the text is the sport filter. Geocoded when no lat/lng is given.",
                "type": "string"
              },
              "radius_km": {
                "description": "Radius in km, 1 to 50. Default 15, or fitted to the place.",
                "type": "number"
              },
              "sport": {
                "description": "Discipline: crossfit, hyrox, yoga, pilates, boxing (boxe), martial_arts (arts martiaux), dance (danse), climbing (escalade), padel. French names are accepted too.",
                "enum": ["crossfit", "hyrox", "yoga", "pilates", "boxing", "martial_arts", "dance", "climbing", "padel"],
                "type": "string"
              },
              "time": {
                "description": "Only classes starting within 45 minutes of this time (HH:MM), on the gym clock.",
                "type": "string"
              }
            },
            "type": "object"
          },
