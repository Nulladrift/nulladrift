        {
          "name": "search_gyms",
          "title": "Search gyms and studios",
          "description": "Find gyms and studios (CrossFit, HYROX, fitness, yoga, pilates, boxing, martial arts, dance, climbing) in France and Europe, near a point or by name, city or postcode. Activity words in the query filter ('CrossFit Nice', 'yoga Lyon'); the rest is the place or the gym name. bookable: true means the gym can be booked: url is its public booking page and bookingUrl is that page with marketplace attribution. bookable: false means do not offer booking: url is the directory listing (claimed but not ready, or not on Gymmy). Gyms not on Gymmy come from OpenStreetMap and other public sources (each with its source page and date), with address, opening hours, the gym's own booking link and prices when read on its website (each with its source and date, not verified by Gymmy), and a claim link. Use the `gym` value with get_gym, get_schedule, get_prices or start_trial only when bookable is true. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours. Never invent a logo or an address. gym, classId and memberId are internal ids for your next tool call. Never show them to the user. Call get_my_account for who is signed in (name, email, member id, gyms).",
