          "title": "Start a trial class",
          "description": "Gives the link to book a trial class at a bookable Gymmy gym, with the trial offer and optionally the class already picked. The person opens it and confirms with their name and email; nothing is booked or charged by this tool. Refuses a gym with bookable: false. Each gym includes, when Gymmy has it: full address, city, country, coordinates (geo), mapsUrl (Google Maps), directionsUrl, appleMapsUrl, logoUrl (the salle logo or a sourced photo, null when there is none), listingUrl (public page, null when the gym is not public), phone, public email, website and opening hours, and null for anything Gymmy does not have. gym, classId and memberId are internal ids, used as arguments of other Gymmy tools.",
