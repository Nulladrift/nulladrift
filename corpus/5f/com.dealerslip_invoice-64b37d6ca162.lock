{
  "lockfileVersion": 2,
  "subjects": {
    "com.dealerslip/invoice": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dealerslip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "dealerslip",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Create drafts only from user-supplied facts. Show the review link and ask the user to review before downloading or issuing. There is no account access, storage or sending.",
      "tools": [
        {
          "name": "create_invoice",
          "title": "Prepare a DealerSlip invoice draft",
          "description": "Prepare a UK vehicle sales invoice draft from user-supplied facts and return calculated totals plus a private review link. Ask for all required fields and explicit VAT treatment; do not invent facts, payments or terms. No account access or storage. Human review and download are required before issuing. The link contains invoice data; share only with its intended recipient.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "pxOn": {
                      "const": true
                    }
                  },
                  "required": ["pxOn"]
                },
                "then": {
                  "required": ["pxAllowance"]
                }
              }
            ],
            "properties": {
              "address": {
                "maxLength": 700,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "balanceMethod": {
                "maxLength": 160,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "collection": {
                "description": "Full calendar date YYYY-MM-DD; blank when not supplied.",
                "pattern": "^(?:[0-9]{4}-[0-9]{2}-[0-9]{2})?$(?![\\s\\S])",
                "type": "string"
              },
              "colour": {
                "maxLength": 80,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "customer": {
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "date": {
                "description": "Full calendar date YYYY-MM-DD; blank when not supplied.",
                "minLength": 1,
                "pattern": "^(?:[0-9]{4}-[0-9]{2}-[0-9]{2})?$(?![\\s\\S])",
                "type": "string"
              },
              "derivative": {
                "maxLength": 160,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "email": {
                "maxLength": 254,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "extras": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "maximum": 10000000,
                      "minimum": 0,
                      "multipleOf": 0.01,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 160,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                      "type": "string"
                    },
                    "tax": {
                      "enum": ["20", "0"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "label", "tax"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "finance": {
                "maximum": 10000000,
                "minimum": 0,
                "multipleOf": 0.01,
                "type": "number"
              },
              "financeCompany": {
                "maxLength": 160,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "firstRegistered": {
                "description": "Full calendar date YYYY-MM-DD; blank when not supplied.",
                "pattern": "^(?:[0-9]{4}-[0-9]{2}-[0-9]{2})?$(?![\\s\\S])",
                "type": "string"
              },
              "make": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "mileage": {
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "model": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "mot": {
                "description": "Full calendar date YYYY-MM-DD; blank when not supplied.",
                "pattern": "^(?:[0-9]{4}-[0-9]{2}-[0-9]{2})?$(?![\\s\\S])",
                "type": "string"
              },
              "notes": {
                "maxLength": 3000,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "payments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "maximum": 10000000,
                      "minimum": 0,
                      "multipleOf": 0.01,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                      "type": "string"
                    },
                    "method": {
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "label", "method"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "phone": {
                "maxLength": 60,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "price": {
                "maximum": 10000000,
                "minimum": 0,
                "multipleOf": 0.01,
                "type": "number"
              },
              "pxAllowance": {
                "maximum": 10000000,
                "minimum": 0,
                "multipleOf": 0.01,
                "type": "number"
              },
              "pxDeclaration": {
                "maxLength": 3000,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "pxHistory": {
                "maxLength": 700,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "pxLender": {
                "maxLength": 160,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "pxMileage": {
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "pxModel": {
                "maxLength": 180,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "pxOn": {
                "type": "boolean"
              },
              "pxReg": {
                "maxLength": 16,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "pxSettlement": {
                "maximum": 10000000,
                "minimum": 0,
                "multipleOf": 0.01,
                "type": "number"
              },
              "pxStock": {
                "maxLength": 60,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "pxV5": {
                "maxLength": 300,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "pxVin": {
                "maxLength": 60,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "ref": {
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "registration": {
                "maxLength": 16,
                "minLength": 1,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "seller": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 700,
                    "minLength": 1,
                    "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 254,
                    "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 160,
                    "minLength": 1,
                    "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 60,
                    "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                    "type": "string"
                  },
                  "terms": {
                    "maxLength": 3000,
                    "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                    "type": "string"
                  },
                  "vat": {
                    "maxLength": 60,
                    "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                    "type": "string"
                  }
                },
                "required": ["address", "name"],
                "type": "object"
              },
              "stock": {
                "maxLength": 60,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "tax": {
                "description": "Explicit user-selected VAT treatment. Standard prices include VAT at 20%; do not infer eligibility.",
                "enum": ["margin", "standard", "none"],
                "minLength": 1,
                "type": "string"
              },
              "terms": {
                "maxLength": 3000,
                "pattern": "^[^\\r\\n]*(?:\\r?\\n[^\\r\\n]*){0,12}$(?![\\s\\S])",
                "type": "string"
              },
              "vin": {
                "maxLength": 60,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              },
              "year": {
                "maxLength": 4,
                "pattern": "^[^\\r\\n]*$(?![\\s\\S])",
                "type": "string"
              }
            },
            "required": ["address", "customer", "date", "make", "model", "price", "ref", "registration", "seller", "tax"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
