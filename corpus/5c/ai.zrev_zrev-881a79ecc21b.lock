      },
      "instructions": "zRev is an AI-powered GTM consultancy for B2B companies. Use the tools to learn what it does, run its ROI model on a company's numbers, or (only when the human explicitly asks) leave contact details or book a call.",
      "tools": [
        {
          "name": "about_zrev",
          "title": "About zRev",
          "description": "Returns a plain-text profile of zRev AI: what the firm does, the companies it is the best fit for, who it is not for, its six service lines with a link to each, and contact details. Use this first when a user asks who zRev is, what it offers, or whether it suits their company. Read-only, static content, no arguments, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
