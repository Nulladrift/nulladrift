            "readOnly": true
          },
          "digest": "sha256:17bb2d687497e966d9521e43360ace7b9a5faa5e16b2d9cac9cd8ad525843074"
        },
        {
          "name": "leave_contact",
          "title": "Ask zRev to get in touch",
          "description": "Records an email address, with optional name, company and note, so that Shivil Sahni, zRev's founder can reach out, and returns a plain-text confirmation. This is the only tool here that writes data: it creates one lead record on zRev's side and triggers no email to the address given. Use only when the human you are assisting has explicitly asked to be contacted by zRev; never call it speculatively or with an address the user has not given you for this purpose. Submitting the same email again updates the existing record rather than creating a duplicate. No authentication. Rate-limited per IP address.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Optional. Their company name",
                "type": "string"
              },
              "email": {
                "description": "The human's email address, given by them for this purpose",
                "type": "string"
              },
              "name": {
                "description": "Optional. The human's name",
                "type": "string"
              },
              "note": {
                "description": "Optional. What they want to talk about, in their words",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
