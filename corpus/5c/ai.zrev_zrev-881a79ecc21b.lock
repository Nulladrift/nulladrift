        },
        {
          "name": "grade_llms_txt",
          "title": "Grade a site's llms.txt",
          "description": "Fetches https://<domain>/llms.txt (the file that tells AI systems what a site contains) and grades it with seven deterministic checks. Returns a 0 to 100 score and the pass or miss result of each check as plain text. If the site has no llms.txt the response says so and links to zRev's free generator. Use when a user asks whether a site is readable by AI assistants or wants their llms.txt reviewed. Makes one outbound HTTP request to the public domain you pass; stores nothing about it. No authentication. Shares a fair-use limit per IP address with cold_read, and returns a plain-text notice when that limit is reached.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare domain to grade, without protocol or path, e.g. acme.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bc9c73de12417fdb726d81595de74959bde2a701895f2925ee794ece198b1fb"
        },
        {
          "name": "gtm_diligence_checklist",
          "title": "GTM due diligence checklist",
          "description": "Returns zRev's go-to-market due diligence checklist for investors and acquirers: 47 questions across ten dimensions, each with the data-room artifact that answers it and the red flag to watch for. Call with no arguments to get the list of ten dimensions; call with a dimension number from 1 to 10, or a keyword such as churn, pipeline or marketing, to get that dimension's questions in full. Use when a user is assessing a company's revenue engine before an investment or acquisition. Read-only reference content, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {
              "dimension": {
                "description": "Optional. A dimension number from 1 to 10, or a keyword such as 'churn', 'pipeline' or 'marketing'. Omit to list the ten dimensions.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
