          },
          "digest": "sha256:7b28c7997d619b5e45635244f0c4bb2e10bd7c343831273fa4821c561da1daf1"
        },
        {
          "name": "get_engagement_timeline",
          "title": "The 60-day engagement, phase by phase",
          "description": "Returns the phases of a standard 60-day zRev engagement as plain text: what happens in each phase, what is delivered, and when first results appear. Use when a user asks how an engagement works, how long it takes, or what they would receive and when. Read-only, static content, no arguments, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {},
