          },
          "digest": "sha256:0e80ab83a43c86245d4e0d0fbcd88319a930dcdb2bbe64f884eb43249a35c7f1"
        },
        {
          "name": "cold_read",
          "title": "Cold-read a homepage",
          "description": "Fetches a company's public homepage and returns, in two or three sentences, what the company appears to do and who it serves, based only on the visible text of that page and with no outside knowledge. Anything missing from the answer is missing from the homepage, which is the point: it shows what an AI assistant would tell a buyer about that company. Use when a user asks how their site, or a competitor's, reads to an AI. The summary is model-generated and can be wrong where the page is vague. Makes one outbound HTTP request to the public domain you pass; stores nothing about it. No authentication. Shares a fair-use limit per IP address with grade_llms_txt, and returns a plain-text notice when that limit is reached.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare domain to read, without protocol or path, e.g. acme.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fc1ab4d9413ab24713322e0288ee16904dd95eee43686a02048a8b58ba711b4"
        },
        {
          "name": "estimate_roi",
          "title": "Estimate the ROI of AI across a GTM motion",
          "description": "Runs zRev's ROI model on one company's numbers and returns, as plain text, the projected annual impact in USD split into pipeline lift, customer acquisition cost savings and the value of hours returned to the team, followed by the model's assumptions and a link to the interactive calculator preset to the same inputs. Use when a user wants a number for their own company; all six inputs are required, so ask for any that are missing rather than guessing. The output is an estimate from a fixed model, not a forecast or a quote. Pure calculation: nothing is stored, no external calls, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {
              "arr": {
                "description": "Annual recurring revenue in USD, e.g. 10000000",
                "type": "number"
              },
              "cac": {
                "description": "Customer acquisition cost per new customer in USD, e.g. 8000",
                "type": "number"
              },
              "close_rate_pct": {
                "description": "Close rate as a percentage, e.g. 15 for 15%",
                "type": "number"
              },
              "deal_size": {
                "description": "Average deal size in USD, e.g. 25000",
                "type": "number"
              },
              "monthly_leads": {
                "description": "Qualified leads per month, e.g. 120",
                "type": "number"
              },
              "team_size": {
                "description": "Number of people on the GTM team, account executives plus SDRs, e.g. 8",
                "type": "number"
              }
            },
            "required": ["arr", "cac", "close_rate_pct", "deal_size", "monthly_leads", "team_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4558d43887fadbb5d99adfe690c6c81d90dc40238f4f2722d8683e1573a1e484"
        },
        {
          "name": "get_benchmarks",
          "title": "Typical engagement results",
          "description": "Returns zRev's typical engagement results as plain text: 2x pipeline velocity, 20% lower customer acquisition cost, 10 hours back per rep per week, 60% of GTM busywork automated, results that start inside 30 days and mature by 60. The response always ends with the provenance caveat: these are typical results benchmarked against comparable AI-powered GTM implementations and they vary by stack, data quality and adoption, so present them as typical, not guaranteed. Use when a user asks what results to expect. For an estimate on a specific company's numbers use estimate_roi instead. Read-only, static content, no arguments, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
