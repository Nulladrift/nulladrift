          },
          "digest": "sha256:43813358b3e14c90cc5f8954cfb5cef62415801e2671e9ad6a26bdc41fba94b8"
        },
        {
          "name": "book_call",
          "title": "How to book an intro call",
          "description": "Returns the link and instructions for booking a free 30-minute intro call with Shivil Sahni, zRev's founder, plus what the call covers. It does not book anything: it only returns the scheduling link for the human to open themselves. Use when a user says they want to talk to zRev. If they would rather be contacted, use leave_contact instead. Read-only, static content, no arguments, no authentication, no rate limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
