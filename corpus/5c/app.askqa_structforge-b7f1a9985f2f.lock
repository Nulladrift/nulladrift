{
  "lockfileVersion": 2,
  "subjects": {
    "app.askqa/structforge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://structforge.askqa.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "structforge",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "extract_table",
          "description": "Extract HTML or markdown tables into JSON rows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "HTML or table content",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ccd072521b3659f0fd5cc64e30b86e6296f07e5eed2e5efc16f1290c889f51d"
        },
        {
          "name": "get_schema",
          "description": "Discover schema shapes. Pass name for one schema, or omit to list all curated schemas.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Schema name; omit to list all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a44d04d9830db0c7c4fce496f81f712028be56fabe31fe8d05929f91e4fa5ad1"
        },
        {
          "name": "normalize_data",
          "description": "Normalize data object to a named schema (invoice, receipt, contact, resume).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": {},
                "description": "Input data object",
                "type": "object"
              },
              "target_schema": {
                "description": "Target schema name",
                "type": "string"
              }
            },
            "required": ["data", "target_schema"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea8e12a29e89e49b488075e54cf1e8a659e3677e951279573e76135c2c44f83e"
        },
        {
          "name": "parse_invoice",
          "description": "Parse invoice text into vendor, amount, due_date, line_items (with math_check).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "Invoice text or PDF extract",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:786a2794be3e26048ba391920c8b125f2d635a7eb682970e8d5566c823ecca46"
        },
        {
          "name": "structure_text",
          "description": "Convert messy text to strict JSON schema. Use for emails, chat logs, unstructured input. Schemas: invoice, receipt, contact, resume.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "schema_name": {
                "default": "generic",
                "description": "Target schema: invoice, receipt, contact, resume",
                "type": "string"
              },
              "text": {
                "description": "Raw text to structure",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c4538976afa0d1c1e063ad90af07a8103aa92e9886752fbb376e1bd5fd8f85ab"
        },
        {
          "name": "validate_structure",
          "description": "Validate JSON against a schema. Enforces field presence and types (string/number/date/array).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": {},
                "type": "object"
              },
              "schema_name": {
                "type": "string"
              }
            },
            "required": ["data", "schema_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38f493b8833b3a54eef761a19b8679421c9e37408619f879d69fb70d678e0996"
        }
      ],
      "digest": "sha256:b69d462a61cd4e9b88c66d47abe01b2f440dd5b81ebba0b9cccb9314c4592700"
    }
  }
}
