{
  "lockfileVersion": 2,
  "subjects": {
    "com.gumballtools/words-in-context": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://words-in-context.gumballtools.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "words-in-context",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_answer",
          "title": "Check an answer",
          "description": "Check an answer to a practice item and get the teaching content.\n\nReturns whether the choice was correct, which option was right, why it fits the sentence specifically, why the chosen option was wrong, and the reason EVERY distractor fails.\n\nRead the distractor reasons out to the learner even when they answered correctly. Knowing why the tempting wrong answer was tempting is the part that transfers to the next question; being told \"correct\" teaches nothing.\n\nInput: `id` from a draw response, and `choice` as the zero-based index of the selected option.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "choice": {
                "description": "Zero-based index of the chosen option.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "id": {
                "description": "The item id from a draw response.",
                "type": "string"
              }
            },
            "required": ["choice", "id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ece302543bbf0267cfceef0c243e364e0c43cf54000f100df4ad5470a36898d4"
        },
        {
          "name": "draw_items",
          "title": "Draw practice questions",
          "description": "Draw words-in-context vocabulary practice questions from a curated, human-written bank.\n\nUse this to quiz a learner, build a practice set, or check what a question of this type looks like. It is free, deterministic, and costs no inference.\n\nIMPORTANT: the response deliberately contains NO answer index and NO explanations. That is so you can present the questions without leaking the answers. Call `check_answer` with the item id and the chosen option to get the answer, why it fits, and why each distractor fails.\n\nInput: `count` (1-20, default 5) — an out-of-range count is REFUSED rather than clamped, so you learn the limit. `difficulty` is foundation|core|stretch. `theme` is science|humanities|social-science|literature. `seed` makes the draw reproducible: the same seed always returns the same items, so a practice session can be replayed or shared.\n\nFormat note: these test inference from context, which is how the current digital SAT asks about vocabulary — not recall of definitions. Each item is a sentence with one word blanked and four options.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "How many items, 1-20, default 5. An out-of-range value is refused, not clamped.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "difficulty": {
                "description": "Filter by difficulty.",
                "enum": ["foundation", "core", "stretch"],
                "type": "string"
              },
              "seed": {
                "description": "Makes the draw reproducible — the same seed always returns the same items, so a session can be replayed or shared. Omit for a random set.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "theme": {
                "description": "Filter by passage flavour.",
                "enum": ["science", "humanities", "social-science", "literature"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f91cfbc2ceb94760e8e6e4db9f265f50fc5c240eb742a41715b6bdb6258f01da"
        },
        {
          "name": "generate_items",
          "title": "Generate practice questions from a passage",
          "description": "Generate new practice items from a passage the learner supplies — their own reading, or the material they got wrong.\n\nThis is the PAID tier and it costs real money per call, unlike the curated bank. Prefer `draw_items` unless the learner specifically needs questions from their own material.\n\n`model` is a priced choice: \"economy\" at $0.002 per item (Fast and cheap. Good enough for straightforward vocabulary in clear prose.); \"standard\" at $0.008 per item (Better at writing distractors that are genuinely tempting, which is the hard part of a good practice item.). Pick economy for straightforward prose and standard when the distractors need to be genuinely tempting, which is the hard part of a good question.\n\nLimits: passage 200 characters minimum, and `count` at most 5 per call. Generation is capped at 10 calls per caller per day, separately from the free quota.\n\nGenerated items are NOT reviewed by a person. Every response carries a caveat saying so. Check the answer and the distractor reasons before giving them to a learner — a generated question with two defensible answers is worse than no question.\n\nReturns 503 when generation is not enabled on the deployment; fall back to `draw_items`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "How many items, 1-5. Default 3.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "difficulty": {
                "description": "Target difficulty.",
                "enum": ["foundation", "core", "stretch"],
                "type": "string"
              },
              "model": {
                "description": "Priced choice. \"economy\" is cheaper; \"standard\" writes more tempting distractors. Default economy.",
                "enum": ["economy", "standard"],
                "type": "string"
              },
              "source": {
                "description": "A passage of at least 200 characters. The learner's own reading.",
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:609180de28f75dfbff9714af7ce029321a8c4bed029e59d2b9c4f1bb75d78c54"
        }
      ],
      "digest": "sha256:c923d403a033713fee7f2a0822e4ba25698d48ba8a1aa9d9a32f8d47ee87668d"
    }
  }
}
