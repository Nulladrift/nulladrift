            "properties": {
              "finding_id": {
                "type": "string"
              },
              "is_bookmarked": {
                "type": "boolean"
              }
            },
            "required": ["finding_id", "is_bookmarked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
