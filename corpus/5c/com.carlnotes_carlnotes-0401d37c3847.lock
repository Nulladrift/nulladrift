            "readOnlyHint": false,
            "title": "Bookmark a finding"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2adeccb1a14889a152b4fd2932963886aa7ed30c93420ae3776b51787a70be0"
        },
        {
          "name": "create_topic",
          "title": "Create a topic",
          "description": "Preview a CarlNotes Topic Draft for the connected account from a name, prompt, sources as option and value pairs, invite emails, visibility, team, tags, brew frequency, and finding limit. Set isPodcastEnabled to turn the topic's Coffee Break podcast on or off. Call only when the user chooses to start a Topic. The first call creates nothing and returns the draft and a confirmation. Show the draft and wait for the user to confirm, then repeat the same fields with that confirmation. Creation uses the existing Topic Draft limits and starts its first brew. A public or invite topic goes on the user's default team, the led team they joined first, unless team names another or is null for no team. For a new send destination, set visibility private, team null, inviteEmails empty, and default Coffee Break on when the view's account budget permits it. Other unsaid fields use the editor's defaults: shared by invite, weekly on Wednesday, ten findings. Use it when the user asks Carl or CarlNotes for a new topic, with phrases like create a topic, start a topic, or have Carl track this.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation": {
                "maxLength": 200,
                "type": "string"
              },
              "frequency": {
                "default": "weekly",
                "enum": ["daily", "weekdays", "weekly"],
                "type": "string"
              },
              "inviteEmails": {
                "default": [],
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "isPodcastEnabled": {
                "type": "boolean"
              },
              "maxTopicFindings": {
                "default": 10,
                "type": "number"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "prompt": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "scheduledDayOfWeek": {
                "default": "wednesday",
                "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                "type": "string"
              },
              "scheduledTime": {
                "default": "09:00",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "sources": {
                "default": [],
                "items": {
                  "properties": {
                    "sourceOption": {
                      "enum": ["webSearch", "url", "rss", "googleNews", "reddit", "youtube", "podcast", "bluesky", "x"],
                      "type": "string"
                    },
                    "value": {
                      "default": "",
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "required": ["sourceOption"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "tags": {
                "default": [],
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "team": {
                "anyOf": [
                  {
                    "properties": {
                      "name": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "teamId": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["name", "teamId"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "visibility": {
                "default": "invite",
                "enum": ["public", "invite", "private"],
                "type": "string"
              }
            },
            "required": ["name", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Create a topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
