        {
          "name": "rate_finding",
          "title": "Rate a finding",
          "description": "Thumb a CarlNotes finding up or down for the connected account, or clear the rating with null. Ratings tell Carl what to keep. Use it when the user rates a finding, with phrases like thumbs up, thumbs down, or more like this.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "finding_id": {
                "type": "string"
              },
              "note": {
                "maxLength": 2000,
                "type": "string"
              },
              "rating": {
                "anyOf": [
                  {
                    "enum": ["up", "down"],
                    "type": "string"
                  },
                  {
