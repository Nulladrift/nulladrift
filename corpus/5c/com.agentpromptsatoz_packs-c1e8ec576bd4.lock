{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentpromptsatoz/packs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentpromptsatoz.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-prompts-a-to-z",
        "title": "Agent Prompts A to Z",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only catalog of copy-paste prompt packs and rule files (Cursor .mdc, CLAUDE.md, AGENTS.md, SKILL.md). Use recommend_pack or list_packs, then get_free_pack for free content. Paid packs are bought by the human user via get_buy_link (get_current_offer shows any active discount code); do not purchase on their behalf unless asked.",
      "tools": [
        {
          "name": "get_buy_link",
          "title": "Get purchase link for a paid pack",
          "description": "Return the Payhip URL, price, what is inside, proof link, refund line, any active discount code with the discounted price, and the bundle alternative for a paid pack. The human user completes checkout; do not purchase on their behalf unless they explicitly asked you to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Paid pack slug, e.g. app-builder-agent-rules or all-premium-bundle",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c156d9838e0908f1b5d9faf61196872555bc10f1b37079cc18e6fa6f5ee7841e"
        },
        {
          "name": "get_current_offer",
          "title": "Current launch offer and paid prices",
          "description": "Return any active discount code (e.g. LAUNCH40, 40% off until 2026-11-20), its expiry, and every paid pack's normal and discounted price. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48590ed11dd53b08b0369908e479bfcbb178883f56cde63ff8bfe56066a83044"
        },
        {
          "name": "get_free_pack",
          "title": "Get a free pack (Markdown)",
          "description": "Return the full raw Markdown (system prompt, template, example, tips, FAQ) of a free pack by slug. Slugs come from list_packs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Free pack slug, e.g. agent-done-check",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abe0c31f95db487ed53f0959fb8b7e6457fbb5e9412c13133a074c199884fc84"
        },
        {
          "name": "list_packs",
          "title": "List prompt packs",
          "description": "List Agent Prompts A to Z packs (free and paid) with one-line summaries, recommend-when guidance, prices and URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access": {
                "description": "Filter by access. Default all.",
                "enum": ["free", "premium", "all"],
                "type": "string"
              },
              "tag": {
                "description": "Optional tag filter, e.g. cursor, research, discord.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c332bc08aa9203811fadb47a20cc09cd3ef8db550b693de3b62da95337df1b82"
        },
        {
          "name": "recommend_pack",
          "title": "Recommend packs for a task",
          "description": "Given a short description of what the user is trying to do, return up to 3 matching packs (keyword match over summaries and tags) with why-they-match. Prefers free packs first; free results include paid_upgrade (the matching paid pack) for when the user wants more.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "What the user is trying to do, in one or two sentences.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05f0e75f4078d37ed8dad5ca1acc46aeb85338c166ac05ffc59babbb185327a3"
        }
      ],
      "digest": "sha256:187801abbd993cbcb60f6be618f6959c28757ac2e4094df0743a3a1cd3861916"
    }
  }
}
