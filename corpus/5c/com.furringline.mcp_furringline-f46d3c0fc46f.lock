      },
      "transport": {
        "type": "http",
        "url": "https://mcp.furringline.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "furringline-public",
        "title": "FURRINGLINE product catalog",
        "version": "0.3.0",
        "websiteUrl": "https://furringline.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public product catalog of FURRINGLINE (Thai building materials: gypsum board, ceiling and wall framing, fixings, tools).\nUse search_products to find items (Thai or English words, or a SKU), get_product for sizes, options and per-option prices, list_categories to browse.\nEvery price is THB before 7% VAT. Indicative and may change; only a formal FURRINGLINE quotation is binding. Always tell the customer this when you quote a price.\nStock figures are read live from the website when you call a tool; the time is in stock.as_of. Stock can change before an order is confirmed.\nMaterial calculators (ceilings, walls, insulation): list_calculators, then calculate_materials with the area in square metres. The result lists what to buy, quantities, prices before VAT, and the matching website products. If complete is false or a choice matters (board type, frame model), ask the customer and call again with choices {choice id: option label} taken from the choices list.\nTo get a formal quotation, the customer opens the product url, adds items with \"ขอใบเสนอราคา\" (request a quotation) and submits the quote list, or contacts FURRINGLINE sales.",
      "tools": [
        {
          "name": "calculate_materials",
          "title": "Calculate materials for a ceiling, wall or insulation job",
          "description": "Runs one of the website calculators for an area in square metres and returns the material list: items, quantities, unit prices and amounts before VAT, subtotal, 7% VAT and total, plus the matching website product for each line. Choices not given use the calculator defaults; the result lists the choices the customer can change. Nothing is saved or ordered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area_m2": {
                "description": "Area in square metres.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "calculator": {
                "description": "Calculator key from list_calculators, e.g. \"concealed-ceiling-calculator\".",
                "maxLength": 200,
                "type": "string"
              },
              "choices": {
                "additionalProperties": {
                  "maxLength": 300,
                  "type": "string"
                },
                "description": "Optional. Choice id (from a previous result) to the option label, e.g. {\"2960\": \"แผ่นยิปซัม ตราช้าง รุ่น มาตรฐาน 9 มม. ขอบลาด\"}.",
                "maxProperties": 60,
                "type": "object"
              }
            },
            "required": ["area_m2", "calculator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate materials"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e72fcc71128ce95aad051d2a253076d21b2db5c529dd4fb16e7477927b01bff"
        },
        {
          "name": "get_product",
          "title": "Get a FURRINGLINE product",
          "description": "Full public details of one product: dimensions, attributes, and each option (variation) with its SKU, price before VAT and stock. Give exactly one of sku or url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sku": {
                "description": "Product or option SKU.",
                "maxLength": 64,
                "type": "string"
              },
              "url": {
                "description": "Product URL on furringline.com (from search_products).",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51f1a0ceac751b289009a6da21ff4329046cae13e13941de42ad46333c77ee25"
        },
        {
          "name": "list_calculators",
          "title": "List FURRINGLINE material calculators",
          "description": "The material calculators on furringline.com (ceilings, partition walls, insulation). Use a key with calculate_materials.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List calculators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fd49e927415929571ae4e2d8534f912d75169a1d6c2d5b99f9f6e0e7b6ab92d"
        },
        {
          "name": "list_categories",
          "title": "List FURRINGLINE product categories",
          "description": "All public product categories with slug, parent slug, product count and URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
