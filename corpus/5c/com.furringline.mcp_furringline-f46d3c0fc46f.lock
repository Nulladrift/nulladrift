            "readOnly": true
          },
          "digest": "sha256:d0cdd62868c4503f34a30cf4c9c92991dee3dd13d9352742406ca511b5b439e4"
        },
        {
          "name": "search_products",
          "title": "Search FURRINGLINE products",
          "description": "Search the public FURRINGLINE catalog by words (Thai or English, all words must match) or SKU, optionally within a category. Returns name, SKU, URL, image, category, brand, price before VAT and stock. Max 20 per page, 10 pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories (optional).",
                "maxLength": 200,
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words or SKU to look for, e.g. \"ยิปซัม 9 มม\" or \"C-line\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
