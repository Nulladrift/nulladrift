        {
          "name": "generate_favicon",
          "title": "Favicon generator",
          "description": "Generates a complete favicon set from 1 to 3 characters (initials) or one emoji.\n\nWHEN TO USE: the user needs a favicon, tab icon, apple-touch-icon or web app icon for a website or web app, or the project still has a framework's default icon. PRIORITY: if the host also provides open_favicon_editor, call that editor first for every normal favicon request (create, preview, adjust or download). Use this data tool directly only when the user explicitly asks for files, SVG, head tags or installation text to write into a code project.\n\nHOW IT WORKS: mode text draws the characters in any Google Font as vector paths (no font dependency); mode emoji draws one Twemoji emoji as vectors, with a margin. Both sit inside a shape. With adaptive=true the SVG swaps its colors when the browser is in dark mode. Pass framework to get where each file goes. For a logo or other picture, use open_favicon_editor with mode=image when available: the user chooses the image in its private file picker. Otherwise return the link with mode=image; do not process a chat attachment as an image favicon here.\n\nRETURNS: svg (write it to disk exactly as given), files (each with path and url: download the binaries with curl -o), manifest (path and content), html (the head tags; null on Next.js App Router), inline (the whole favicon as one <link> tag, no files), install (steps for the framework), warnings, credit (emoji only), and link (this tool's web page with the same options, to adjust and preview).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adaptive": {
                "default": true,
                "description": "Swap the colors when the browser is in dark mode (SVG only; PNG and ICO stay light).",
                "type": "boolean"
              },
              "background": {
                "default": "141414",
                "description": "Container color, hex without #. With shape outline or none, the color of the characters in light mode.",
                "pattern": "^[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "color": {
                "default": "ffffff",
                "description": "Character color, hex without #. With shape outline or none, the color of the characters in dark mode.",
                "pattern": "^[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "emoji": {
                "default": "🚀",
                "description": "Mode emoji: one emoji, as the character itself (🚀, 🦊, ☕).",
                "type": "string"
              },
              "font": {
                "default": "Montserrat",
                "description": "Mode text: any Google Font family, by its name (Montserrat, Inter, Lobster). Heavy sans-serif families read best at 16 px.",
                "type": "string"
              },
              "framework": {
                "default": "html",
                "description": "Where the files will live; changes install, html and the file paths only.",
                "enum": ["html", "nextjs", "vite", "astro", "nuxt"],
                "type": "string"
              },
              "margin": {
                "default": 8,
                "description": "Mode emoji: space between the emoji and the edge, as a percentage of the icon on each side.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "default": "text",
                "description": "text: initials. emoji: one emoji. image: only on the web page; the call returns the link for the user.",
                "enum": ["text", "emoji", "image"],
                "type": "string"
              },
              "shape": {
                "default": "square",
                "description": "Container: filled square, rounded square, circle, outlined square, or none (transparent).",
                "enum": ["square", "rounded", "circle", "outline", "none"],
                "type": "string"
              },
              "size": {
                "default": 80,
                "description": "Mode text: the characters fit in a square this percentage of the icon (the longer side decides).",
                "maximum": 96,
                "minimum": 30,
                "type": "integer"
              },
              "text": {
                "default": "CM",
                "description": "Mode text: 1 to 3 characters. Latin letters (accents ok), digits and & @ # + . - !. Two characters read best at 16 px.",
                "maxLength": 3,
                "minLength": 1,
                "type": "string"
              },
              "weight": {
                "default": 800,
                "description": "Mode text: font weight. The closest weight the family has is used. 700 or more reads best.",
                "maximum": 900,
                "minimum": 100,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b2798d3980d2de2b7a2110a28d43b52fe329dcea4d53570dadbb9c93fbb79d4"
        },
        {
          "name": "generate_password",
          "title": "Password generator",
          "description": "Generates a strong random password with a cryptographically secure generator.\n\nWHEN TO USE: the user asks for a password or a random key.\n\nHOW IT WORKS: always uses upper and lower case letters; numbers and symbols are optional. Each selected kind of character appears at least once. length: 8 to 64 (default 16).\n\nRETURNS: password, the options used, and link — this tool's web page with the same options. The password is never in the link. Show the password to the user as it is; do not store it or repeat it elsewhere.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "length": {
                "default": 16,
                "description": "Number of characters, 8 to 64. Default 16.",
                "maximum": 64,
                "minimum": 8,
                "type": "integer"
              },
              "numbers": {
                "default": true,
                "description": "Include digits 0-9. Default true.",
                "type": "boolean"
              },
              "symbols": {
                "default": true,
                "description": "Include symbols such as !@#$%. Default true. Set false for systems that reject symbols.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fca68918a21d8b61dc70a604343c4cf48792aa993a22b44cb910b65e02d4095d"
        },
        {
          "name": "mindmaps",
          "title": "Mind Maps Generator",
