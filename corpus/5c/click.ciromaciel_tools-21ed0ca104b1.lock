        {
          "name": "receive_email",
          "title": "Temporary email",
          "description": "Creates or opens a disposable, receive-only email inbox and reads what arrived — to sign up somewhere and get the verification code or confirmation link without using the user's real address.\n\nWHEN TO USE: a site or service asks for an email to send a code, a magic link or a confirmation, and the user does not want to give their own; or you need to read what was sent to an inbox created earlier.\n\nHOW IT WORKS:\n- inbox: a name (\"fulano\") or a full address on the tool's domain. Empty: a random, hard-to-guess address is created. Any name works: there is no sign-up.\n- waitSeconds (0–50, default 0): wait for a NEW message to arrive before answering. Typical flow: call once with no inbox to get an address, give it to the site, then call again with that inbox and waitSeconds 30–50 until the email shows up.\n- message: the id of one message, to read it in full (text, links, attachments).\n- The inbox is PUBLIC: anyone who knows the address can read it. Never use it for banking, government or any account the user wants to keep.\n- Receive only (it cannot send). Messages up to 10 MB; everything is deleted after 8 days. Some sites refuse disposable domains — then the user needs a real address.\n\nRETURNS: address; messages (newest first) with id, from, subject, preview, receivedAt and code — the verification code when one is found; with message, also text, links (url and text, confirmation links included) and attachments. link: this inbox on the web page, to show the user. timedOut is true when waitSeconds ended with no new message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "inbox": {
                "description": "The inbox: a name, or name@domain on this tool's domain. Empty: a new random address.",
                "maxLength": 80,
                "type": "string"
              },
              "message": {
                "description": "The id of a message in this inbox, to read it in full.",
                "maxLength": 64,
                "type": "string"
              },
              "waitSeconds": {
                "default": 0,
                "description": "How long to wait for a new message before answering, 0 to 50 seconds. 0 (default) answers at once.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1289c70e9c9bb29130ad3d14be6a2163667d1e15c4428abb698f2236e9fabf59"
        },
        {
          "name": "text_to_speech",
          "title": "Text to speech",
          "description": "Reads a text aloud in a natural Portuguese voice from Fish Audio — Rafael by default, or one of six others — and returns an MP3.\n\nWHEN TO USE: the user wants to hear a Portuguese text or needs an audio file of it — narration, audiobook, lesson, voice-over, a message read aloud. The voices speak Portuguese (Brazil, and Tomás from Portugal); a text in another language is read with their accent.\n\nHOW IT WORKS:\n- Up to 50,000 characters per call. A text over 1,000 characters is split by sentence into parts of up to 1,000; the parts are voiced three at a time and joined in order into ONE MP3. Progress is reported per part (\"Gerando áudio... 3 de 18\"), so keep waiting while it arrives.\n- It takes time: about 25 seconds per round of three parts. 1,000 characters ≈ 25 s; 5,000 ≈ 1 min; 16,000 ≈ 2.5 min; 50,000 ≈ 7 min.\n- Over 50,000 characters: split the text at paragraph boundaries into several calls with the same voice and speed, and give the user every link, in order.\n- Send the text as it should be HEARD: remove Markdown marks (**, #, list bullets), URLs, emojis and tables. Do not summarize, translate or reword unless the user asked — every word you send is read.\n- voice: rafael (default) or beatriz for clear, neutral narration; tomas for European Portuguese; narrador-propagandas for ads; rodolfo, sao-cipriano and capitao-nascimento are deep character voices.\n- speed: 1 is the voice's natural pace; 0.9 suits calm narration, 1.2 a quick read.\n\nRETURNS:\n- audioUrl: the complete MP3 to download, valid for 7 days. Always give this link to the user. If you can run commands, you can download it (e.g. curl -o audio.mp3 <audioUrl>).\n- audio: the MP3 itself, only when it is short (about a minute or less); otherwise null.\n- seconds (duration), parts, characters, voice, speed.\n- link: this tool's web page with the same voice and speed (the text is not in it).\n\nERRORS say what happened and what to do next. If a part fails, no audio is produced and a new call starts again from part 1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "speed": {
                "default": 1,
                "description": "Reading speed, 0.5 to 2. 1 is the voice's natural pace; 0.9 calm narration; 1.25 a quick read.",
                "maximum": 2,
                "minimum": 0.5,
                "type": "number"
              },
              "text": {
                "description": "The text to read aloud: 1 to 50,000 characters. Plain text as it should be heard — no Markdown, URLs or emojis. Longer texts: split into several calls.",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              },
              "voice": {
                "default": "rafael",
                "description": "The voice, from Fish Audio: rafael (Rafael, male, pt-BR: Clara e segura, para apresentações e atendimento.); beatriz (Beatriz, female, pt-BR: Clara e segura, para apresentações e atendimento.); tomas (Tomás, male, pt-PT: Clara e segura, em português de Portugal.); narrador-propagandas (Narrador Propagandas, male, pt-BR: Confiante e enérgica, para anúncios e vídeos institucionais.); rodolfo (Rodolfo, male, pt-BR: Grave e calma, para narração e oração.); sao-cipriano (São Cipriano, male, pt-BR: Grave e dramática, de personagem.); capitao-nascimento (Capitão Nascimento, male, pt-BR: Grave e rouca, séria, de personagem.). Default: rafael. All speak Portuguese; tomas is from Portugal.",
                "enum": ["rafael", "beatriz", "tomas", "narrador-propagandas", "rodolfo", "sao-cipriano", "capitao-nascimento"],
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afb49fe3a22c78bd64617603fdea3fb3eb9175db101e75aafb38bb3cc18c33a0"
        },
        {
          "name": "web_to_markdown",
          "title": "Web page to Markdown",
          "description": "Fetches a public web page and returns its content as clean Markdown.\n\nWHEN TO USE: you need to read a page — documentation, an article, a product page — to answer, summarize or quote it; or the user wants a page as Markdown.\n\nHOW IT WORKS:\n- url: a public http(s) address. Private networks, localhost and addresses with credentials are refused.\n- Reads the HTML the server sends (like a simple browser, without running JavaScript). Pages that build their content with JavaScript have no text to convert — the error says so.\n- onlyMainContent (default true) drops menus, headers, footers, sidebars, cookie banners and ads. Set false to keep the whole page.\n- pages above 1 also follows links on the same site (same folder and below), breadth-first, up to that many pages (max 20), respecting robots.txt. Slower: a few seconds per page.\n- Limits per page: 15 seconds and 5 MB. PDFs and non-HTML files are not converted.\n\nRETURNS: for each page, its Markdown with absolute links and images, plus title, description and language when the page has them; pages that failed are listed with the reason. link: this tool's web page with the same request.\n\nERRORS say why the page could not be read and whether retrying makes sense.",
