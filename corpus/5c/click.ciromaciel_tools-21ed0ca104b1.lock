        {
          "name": "compare_timezones",
          "title": "Time zone comparison",
          "description": "Converts one moment across several time zones, daylight saving time included.\n\nWHEN TO USE: \"what time is it in…\", scheduling a meeting across cities, checking whether a time falls at night or on another day somewhere.\n\nHOW IT WORKS:\n- zones: IANA time zone names in Area/City form — America/Sao_Paulo, Europe/Lisbon, Asia/Tokyo, UTC. Not city names alone, abbreviations (EST, BRT) or offsets (GMT-3). The FIRST zone is the reference for date and hour. 1 to 12 zones.\n- date (YYYY-MM-DD) and hour (0–23) are read in the first zone. Without them: the current moment. Only hour: that hour today in the first zone. Only date: that day at the current hour.\n- format: 24h (14:00) or 12h (2:00 PM).\n\nRETURNS: the moment in UTC and, for each zone, its local date, weekday, time, UTC offset and dayShift (+1 = next day, -1 = previous day, relative to the first zone). link: this tool's web page with the same comparison.\n\nERRORS name the unknown zone or the invalid date; fix it and call again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day, as YYYY-MM-DD, in the first time zone. Defaults to today there.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "format": {
                "default": "24h",
                "description": "How times are written: 24h (14:00) or 12h (2:00 PM).",
                "enum": ["24h", "12h"],
                "type": "string"
              },
              "hour": {
                "description": "The hour, 0 to 23, in the first time zone. Defaults to the current hour there.",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "zones": {
                "default": ["America/Sao_Paulo", "America/New_York", "Europe/London"],
                "description": "IANA time zone names, such as America/Sao_Paulo or Europe/London. The first one is the reference. 1 to 12.",
                "items": {
                  "description": "An IANA time zone name, such as America/Sao_Paulo or Europe/London.",
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e6623aea67b95ec3e4d99990891cfe24acc97171081262f7726c27d0ff6029ff"
        },
        {
          "name": "data_to_chart",
          "title": "Data to Chart",
          "description": "Draws a chart from a CSV table and returns it as an image.\n\nWHEN TO USE: the user wants to see data as a chart, or needs a chart image for a document, a README, a slide or a chat.\n\nHOW IT WORKS:\n- csv: a header row, then data rows. First column: the category (or x value); the next columns: numbers. Use a comma or semicolon as separator; decimals with a point, or with a comma when the separator is a semicolon. Up to 20,000 characters.\n- chartType, and what each one needs:\n  bar, horizontalBar, line, area, pie, donut, funnel — one category column + one numeric column;\n  multiline — one x column + one or more numeric columns (one line per column);\n  scatter — two numeric columns (x, y);\n  heatmap — three columns: row, column, value.\n- title: optional, drawn at the top.\n\nRETURNS:\n- image: a PNG address that IS the chart (rendered on request) — put it straight into Markdown (![title](image)) or an <img>. imageSvg: the same as SVG, sharper where SVG is accepted. Both are null when the CSV is too long to fit in an address; then use svg.\n- svg: the chart as SVG markup.\n- link: this tool's web page with the same chart, to edit it.\n\nERRORS say what is wrong with the CSV (missing columns, non-numeric values, too many rows); fix the data and call again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chartType": {
                "default": "bar",
                "description": "The kind of chart. See the tool description for the columns each kind needs.",
                "enum": ["bar", "horizontalBar", "line", "multiline", "area", "pie", "donut", "scatter", "funnel", "heatmap"],
                "type": "string"
              },
              "csv": {
                "description": "The data as CSV with a header row. First column: category or x value; next columns: numbers. Up to 20,000 characters.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "default": "",
                "description": "Optional title drawn at the top of the chart. Empty for none.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["csv"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4164e3d5d2abc289cd8cfdbcca770b08b7db0af670a4af3b68f6b2dc057b289e"
        },
        {
          "name": "generate_background",
          "title": "Background generator",
          "description": "Draws a background or wallpaper at the exact size of a place: YouTube banner, Instagram story, LinkedIn cover, desktop up to 4K here (8K on the web page), phones, video calls, slides.\n\nWHEN TO USE: the user wants a background, wallpaper, cover or banner image for a channel, profile, screen or presentation, or asks what size one of these must be.\n\nHOW IT WORKS: pick `format` (70 places, each with its size and the safe area that every device shows) and `style` (blurred petals, veils and hills; steps; geometry such as arcs, tiles, scales, rays; Hilbert curve; folds). `colors` are 3 to 7 hex colors, first one is the background. The same `seed` draws the same design in every format, so a set matches.\n\nRETURNS: width, height, format (name, ratio, safe_area in pixels of the file), files (png, jpg and webp addresses: download with curl -o; null above 4K), and link (the web page with the same options, to adjust, add a screenshot on top or download up to 8K).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "angle": {
                "default": 110,
                "description": "Direction, in degrees, for veils, hills, steps, stripes, capsules, chevrons, tides and drape.",
                "maximum": 359,
                "minimum": 0,
                "type": "integer"
              },
              "colors": {
                "default": "2e1f63,4a3a8c,6d5aa8,9682c4,bba9dd,e2d4f0",
                "description": "3 to 7 hex colors without #, comma-separated, in order: background first, then outside to inside.",
                "type": "string"
              },
              "format": {
                "default": "youtube-banner",
                "description": "Where the image goes. Examples: youtube-banner, youtube-thumbnail, instagram-story, instagram-portrait, linkedin-banner, linkedin-company, x-header, facebook-cover, meeting-background, slides-16x9, desktop-fhd, desktop-4k, iphone-pro-max, android-fhd, og-image, custom (then width and height).",
                "type": "string"
              },
              "grain": {
                "default": 10,
                "description": "Film grain, in percent. 10 to 20 hides banding in smooth gradients.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "height": {
                "default": 1080,
                "description": "Only with format custom.",
                "maximum": 7680,
                "minimum": 16,
                "type": "integer"
              },
              "scale": {
                "default": 100,
                "description": "Size of the shapes, in percent. Smaller repeats more of the pattern.",
                "maximum": 300,
                "minimum": 25,
                "type": "integer"
              },
              "seed": {
                "default": 3,
                "description": "Which variation of the design. The same seed and style give the same design in any format.",
                "maximum": 999999,
                "minimum": 0,
                "type": "integer"
              },
              "style": {
                "default": "steps",
                "description": "petals, veils, hills (soft blur, macOS-like); steps (flat color bands); arcs, rings, stripes, capsules, tiles, cubes, chevrons, rays, scales, diamonds, squares, truchet (geometry); hilbert, quadtree (fractals); tides, drape (folds).",
                "type": "string"
              },
              "width": {
                "default": 1920,
                "description": "Only with format custom.",
                "maximum": 7680,
                "minimum": 16,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
