          "description": "Free, no key: credit pack prices (100 credits for 0.05 SOL, 5 USDC, or $STILL at 20% off; Solana only, no cards) and the keyless x402 pay-per-call option (USDC on Solana: lite 0.02, full 0.08 fresh / 0.02 cached, AI +0.04). Read-only: never moves funds. Ask the user before any payment.",
