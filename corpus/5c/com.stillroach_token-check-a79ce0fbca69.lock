      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "roach-agent-api",
        "title": "Still Roach token analysis",
        "version": "agentapi-0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Solana token holder analysis. Start with check_solana_token_basic (free) or check_solana_token_lite (3 free/day); analyze_solana_token costs 1 credit for a fresh scan. Not financial advice.",
      "tools": [
        {
          "name": "alerts_since",
          "title": "Bag Watch alerts since a cursor",
          "description": "Alerts (bagwatch.alert.v1) across your watched coins and wallets, oldest first, after the given cursor. Pass next_cursor back to page. Requires a Watch plan key. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous call; omit for the start",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23585c2da182e393be275d3b368ed408e9d385d18ad5552947b144c56f79eb63"
        },
        {
          "name": "analyze_solana_token",
          "title": "Full Solana token holder analysis",
          "description": "Full Bag Check (bagcheck.v1): verdict with reasons, shell/rug checks, top-holder behaviour (never sold / sold / churn / fresh), bundles, callers. 1 credit for a fresh scan, 0 if a scan newer than max_data_age_seconds exists. Requires an API key. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "retry-safe key: a repeat returns the first result at no cost",
                "maxLength": 128,
                "type": "string"
              },
              "max_data_age_seconds": {
                "default": 600,
                "description": "reuse a cached scan up to this age (free)",
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "mint": {
                "description": "Solana token mint address (base58)",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                "type": "string"
              }
            },
            "required": ["mint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83a553200b1edee90fb906f58a85254e2466facec5e242790a345fa73a1bebeb"
        },
        {
          "name": "check_solana_token_basic",
          "title": "Basic Solana token check (free)",
          "description": "Free: verdict, token facts, shell check and holder summary for a Solana mint if it was scanned in the last hour. Returns status=not_cached otherwise. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mint": {
                "description": "Solana token mint address (base58)",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                "type": "string"
              }
            },
            "required": ["mint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
