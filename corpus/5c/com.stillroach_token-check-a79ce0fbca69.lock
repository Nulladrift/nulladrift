          },
          "digest": "sha256:112ac119b94188c5332b9e96df24f7d8488e21faa79d183a657221ac19cd4211"
        },
        {
          "name": "check_solana_token_lite",
          "title": "Lite Solana token check",
          "description": "Lite read (bagcheck.lite.v1): verdict, top-10 holder %, dev stake, launch buy / dev sold, KOL wallets holding, basic flags. Free for 3 fresh reads per day, then 1 credit; cached reads are free. Requires an API key. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_data_age_seconds": {
                "default": 600,
                "description": "reuse a cached lite read up to this age (free)",
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "mint": {
