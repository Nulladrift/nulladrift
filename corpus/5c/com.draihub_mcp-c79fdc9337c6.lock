          "digest": "sha256:728d3de29f0f1db6d5112bbebf431ef2c79334a2f77fb6c264fa62e753496dab"
        },
        {
          "name": "list_specialties",
          "title": "Medical specialties",
          "description": "Every medical specialty a doctor can list under on Dr. AI Hub, in English and Arabic, with what each one treats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Medical specialties"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f48fffa483b42957b0b311ee1c33621fc14568a9927ea65cdf204eb145fa673a"
        },
        {
          "name": "search_doctors",
          "title": "Find doctors in Egypt",
          "description": "Search doctors listed on Dr. AI Hub (draihub.com) by specialty and/or city in Egypt. Returns name, specialty, city, clinic, address, fee in EGP, clinic hours, rating and the profile URL where a patient books for free. Arabic or English words both work (e.g. \"dentist\", \"طب الأسنان\", \"Sohag\", \"سوهاج\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City in Egypt, e.g. \"Cairo\", \"Girga\", \"سوهاج\". See list_cities.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "How many doctors to return (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Part of the doctor or clinic name.",
                "maxLength": 80,
                "type": "string"
              },
              "specialty": {
                "description": "Specialty, e.g. \"Cardiology\", \"dentist\", \"أطفال\". See list_specialties.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find doctors in Egypt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f04536886c8988d26888b6f5e6abc56e6244da34f0c170763379d5483eff37f"
        },
        {
          "name": "search_health_topics",
          "title": "Find condition and medicine pages",
          "description": "Find Dr. AI Hub pages about a health condition or a medicine (including Egyptian brand names such as Panadol). Returns names and page URLs; use get_health_topic for the content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Condition or medicine name, in English or Arabic, e.g. \"diabetes\", \"السكر\", \"Panadol\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Only conditions or only medicines (default any).",
                "enum": ["any", "condition", "medicine"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find condition and medicine pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
