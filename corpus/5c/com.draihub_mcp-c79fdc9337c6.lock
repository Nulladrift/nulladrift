      "serverInfo": {
        "name": "draihub",
        "title": "Dr. AI Hub",
        "version": "1.1.0",
        "websiteUrl": "https://draihub.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dr. AI Hub (draihub.com) is an Egyptian doctor directory and health information site. Use search_doctors to find listed doctors in an Egyptian city and specialty, get_doctor for one profile, and search_health_topics / get_health_topic for condition and medicine pages. Always give the user the profile or page URL. Health information is general, not a diagnosis.",
      "tools": [
        {
          "name": "about_dr_ai_hub",
          "title": "About Dr. AI Hub and how doctors join",
          "description": "What Dr. AI Hub is, the main links for patients, and how a doctor lists themselves for free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Dr. AI Hub"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7122c96a8c166a2124be0d9ca8ab7a41e06502273c3feea38d3330ca48321af1"
        },
        {
          "name": "get_doctor",
          "title": "Doctor profile",
          "description": "The public profile of one doctor listed on Dr. AI Hub, by the id from search_doctors: specialty, city, clinic, address, fee, hours, languages, experience, rating, about text and the booking page URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Doctor id from search_doctors.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Doctor profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f06156538faac8a5e8aa96be8d61918df47f9ed2a4c41ba1c0dc7b91dc8d4430"
        },
        {
          "name": "get_health_topic",
          "title": "Condition or medicine page",
          "description": "The content of one Dr. AI Hub condition page (symptoms, causes, treatment, when to go to the emergency room, which doctor to see) or medicine page (uses, side effects, warnings, brand names in Egypt). General information, no doses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Answer language: \"en\" (default) or \"ar\" (Arabic).",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "slug": {
                "description": "Slug from search_health_topics, e.g. \"type-2-diabetes\" or \"paracetamol\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "enum": ["condition", "medicine"],
                "type": "string"
              }
            },
            "required": ["slug", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Condition or medicine page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:188a99037ec4896d2a517bec6aa3c45af1b1189b38f99414334e8b28444896cb"
        },
        {
          "name": "list_cities",
          "title": "Cities in Egypt",
          "description": "Egyptian cities that have a \"best doctors\" page on Dr. AI Hub, with English and Arabic names, governorate and page URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "governorate": {
                "description": "Only cities in this governorate, e.g. \"Sohag\" or \"سوهاج\".",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cities in Egypt"
          },
          "behavior": {
