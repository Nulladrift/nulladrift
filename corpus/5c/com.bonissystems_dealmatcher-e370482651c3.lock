{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/dealmatcher": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dealmatcherapp.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "dealmatcher",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DealMatcher answers mortgage questions from published sources: FHFA loan limits, the Fannie Mae price adjustment matrix, the FHA/VA/USDA fee schedules and the federal HMDA filings. Every answer carries its source, its edition and a DealMatcher page; cite the page. Read-only. It never quotes an interest rate and never makes a credit decision; the lender decides.",
      "tools": [
        {
          "name": "county_lending_market",
          "title": "Mortgage lending in a county (HMDA)",
          "description": "What lenders reported for a U.S. county in the latest HMDA filing year: purchase, refinance and cash-out loans and applications by loan type (conventional, FHA, VA, USDA) against the national mix, and the denial rate with its base named. Describes a market, never a person; small counts are withheld. Give a county FIPS code, or a county name with its state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "county name, e.g. \"Bexar\" or \"Los Angeles County\"; give state too",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "county_fips": {
                "description": "5-digit county FIPS code, e.g. \"48029\" for Bexar County, TX",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "state": {
                "description": "two-letter state code, needed with county",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "year": {
                "description": "optional HMDA filing year; defaults to the latest published",
                "maximum": 2100,
                "minimum": 2018,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Mortgage lending in a county (HMDA)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ffa1ae302f87b2b3931e1bae492116f60d8a61fcd284aff5dd4ba229b8ec990"
        },
        {
          "name": "government_loan_fees",
          "title": "FHA, VA or USDA loan fees",
          "description": "The published government fee a program adds to an anonymized loan: FHA upfront and annual mortgage insurance premium (MIP) and how long it runs, the VA funding fee, or the USDA guarantee fee, from the agency schedules with their effective dates. A published fee, never an interest rate and never a credit decision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "loan_amount": {
                "description": "base loan amount, e.g. \"$300,000\"",
                "pattern": "^\\s*\\$?\\s*[\\d,]{1,12}(\\.\\d{1,2})?\\s*$",
                "type": "string"
              },
              "ltv": {
                "description": "loan-to-value, e.g. \"96.5\" or \"100%\", at most two decimals",
                "pattern": "^\\s*\\d{1,3}(\\.\\d{1,3})?\\s*%?\\s*$",
                "type": "string"
              },
              "program": {
                "enum": ["FHA", "VA", "USDA"],
                "type": "string"
              },
              "term_years": {
                "description": "loan term in years; required for FHA",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "va_exempt": {
                "description": "VA only: a borrower exempt from the funding fee",
                "type": "boolean"
              },
              "va_first_use": {
                "description": "VA only: first use (default true)",
                "type": "boolean"
              },
              "va_purpose": {
                "description": "VA only",
                "enum": ["PURCHASE", "CASHOUT", "IRRRL", "ASSUMPTION"],
                "type": "string"
              }
            },
            "required": ["loan_amount", "ltv", "program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "FHA, VA or USDA loan fees"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56897fbf4a1d4b868dfedfc200297a472d2b61674a38be98d058e2b8d77f9af3"
        },
        {
          "name": "lender_lookup",
          "title": "Mortgage lender profile (HMDA)",
          "description": "A mortgage lender's own 2025 HMDA filing, by name or LEI: records, loans originated and their dollar total, the loan-type and loan-purpose mix, and its largest states. Not a rating; no per-lender approval or denial rate is given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "part of the lender's legal name, e.g. \"Wells Fargo\", or its 20-character LEI",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "state": {
                "description": "optional: only lenders with HMDA records for property in this state",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mortgage lender profile (HMDA)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62a892edf4936dedbf83e96074c8633d055a346912e43103d0d98c0e68bf5e28"
        },
        {
          "name": "llpa_cost",
          "title": "Fannie Mae price adjustment (LLPA) for a scenario",
          "description": "Fannie Mae's published loan-level price adjustment (LLPA) for an anonymized conventional scenario (Classic FICO, LTV, loan amount, purpose, occupancy, property type), the dollar price it adds, and the structuring moves that lower it, with the matrix edition. An LLPA is a one-time price adjustment, never an interest rate and never a credit decision; the lender decides. Takes numbers only, never a borrower's name or details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amortization": {
                "enum": ["FIXED", "ARM"],
                "type": "string"
              },
              "duty_to_serve": {
                "description": "true if the loan may meet a Duty to Serve category (flagged as a possible waiver, never applied)",
                "type": "boolean"
              },
              "fico": {
                "description": "representative Classic FICO score, e.g. 740. VantageScore 4.0 pricing is not loaded, so a VantageScore must not be given here: Fannie Mae's 09/30/2026 reissue of LL-2026-06 removed the separate VantageScore 4.0 grids, and DealMatcher has not encoded how a VantageScore is priced now.",
                "maximum": 850,
                "minimum": 300,
                "type": "integer"
              },
              "first_time_homebuyer": {
                "type": "boolean"
              },
              "high_balance": {
                "description": "true if the loan is above the county baseline (high-balance)",
                "type": "boolean"
              },
              "homeready": {
                "type": "boolean"
              },
              "loan_amount": {
                "description": "dollar amount, e.g. \"$360,000\"",
                "pattern": "^\\s*\\$?\\s*[\\d,]{1,12}(\\.\\d{1,2})?\\s*$",
                "type": "string"
              },
              "ltv": {
                "description": "loan-to-value, e.g. \"90\" or \"80.5%\". Read as Fannie Mae does (Selling Guide B2-1.2-01): truncated to two decimals, then rounded up to the whole percent.",
                "pattern": "^\\s*\\d{1,3}(\\.\\d{1,3})?\\s*%?\\s*$",
                "type": "string"
              },
              "mh_advantage": {
                "description": "manufactured home only: true if it meets MH Advantage (no manufactured-home charge)",
                "type": "boolean"
              },
              "minimum_mi": {
                "description": "true if the loan uses Fannie Mae's minimum mortgage insurance coverage option (adds the Minimum-MI charge)",
                "type": "boolean"
              },
              "occupancy": {
                "enum": ["PRIMARY", "SECOND_HOME", "INVESTMENT"],
                "type": "string"
              },
              "property_type": {
                "description": "DETACHED_CONDO and COOP do not pay the condo charge (matrix footnote 1)",
                "enum": ["SFR", "CONDO", "DETACHED_CONDO", "COOP", "MANUFACTURED", "UNITS_2_4"],
                "type": "string"
              },
              "purpose": {
                "enum": ["PURCHASE", "LIMITED_CASHOUT", "CASHOUT"],
                "type": "string"
              },
              "subordinate_financing": {
                "description": "true if there is a second lien (CLTV above LTV)",
                "type": "boolean"
              },
              "term_years": {
                "description": "loan term in years; defaults to 30 and the answer says so. Fannie Mae's purchase and limited cash-out score grids apply only to terms over 15 years.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["fico", "loan_amount", "ltv"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fannie Mae price adjustment (LLPA) for a scenario"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc0a4f909ac2ec96322155d23aea2f5a4245944d954ee7d63ecf693e082fb835"
        },
        {
          "name": "loan_limit",
          "title": "Conforming and FHA loan limits for a county",
          "description": "The 2026 conforming loan limit for a U.S. county (1 to 4 units) from the Federal Housing Finance Agency's county file, whether the county is above the national baseline (high-balance), the county's FHA loan limits (1 to 4 units) from HUD's county file with its year, and the DealMatcher page to cite. Give a 5-digit county FIPS code, or a county name with its two-letter state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "county name, e.g. \"Bexar\" or \"Los Angeles County\"; give state too",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "county_fips": {
                "description": "5-digit county FIPS code, e.g. \"48029\" for Bexar County, TX",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "state": {
                "description": "two-letter state code, needed with county",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Conforming and FHA loan limits for a county"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdd9e1d622e5f2a9537a3cdb510162d303c66a448b14868cd797517b7181bca3"
        }
      ],
      "digest": "sha256:339183bee3ea42bea9db77e7a1658d826e8936eb4a811f6f01ac095af2503e7c"
    }
  }
}
