      "instructions": "eKtab (ektab.com) is an Arabic ebook store, pioneering Arabic ebooks since 2012. Search its catalogue of Arabic and English ebooks and link readers to the book page, where they can read a free sample and buy. Titles are mostly Arabic: search in Arabic when the user writes Arabic.",
