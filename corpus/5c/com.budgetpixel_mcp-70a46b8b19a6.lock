          "digest": "sha256:c24f71971e735118a9afc07a8d4cb576e29522f4318b8f231b2e27775224cb14"
        },
        {
          "name": "search_wardrobe",
          "title": "Search Wardrobe",
          "description": "Use this to find clothes to put on a character: the user's own wardrobe items, the ones they saved and the free BudgetPixel library (dresses, suits, sportswear, costumes ...). To dress a character, write both @handles in the prompt of generate_image or generate_video, e.g. \"@barry wearing @camel_coat_set at a gala\": the item's picture goes with it and the person wears it. q filters by words (\"red dress\", \"winter\"); category by shelf (work, party, sport, swim, underwear ...); source narrows to mine, saved or house. fit is who the clothes are cut for: pass the character's gender (from list_characters or get_character: female or male) to get what suits them, unisex clothes included. Every item says its fit. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional: one shelf. cosplay = anime and game characters' outfits (search q for the character or franchise, e.g. \"naruto\"); influencers = the AI influencers' signature outfits.",
                "enum": ["everyday", "work", "formal", "party", "sport", "swim", "outerwear", "sleepwear", "underwear", "costume", "traditional", "seasonal", "cosplay", "influencers"],
                "type": "string"
              },
              "fit": {
                "description": "Optional: who the clothes are cut for. Pass the character's gender (female or male) to get the clothes that suit them, unisex ones included; unisex returns unisex only.",
                "enum": ["women", "men", "unisex", "female", "male"],
                "type": "string"
              },
              "limit": {
                "description": "Optional: at most this many (default 100).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Optional words that must all appear in the item's name, description or tags, e.g. \"red dress\" or \"winter\".",
                "type": "string"
              },
              "source": {
                "description": "Optional: mine (the user's own), saved, house (the free library), or all (default).",
                "enum": ["all", "mine", "saved", "house"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
