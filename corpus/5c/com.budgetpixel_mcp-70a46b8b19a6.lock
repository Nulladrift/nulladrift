        {
          "name": "search_poses",
          "title": "Search Poses",
          "description": "Use this to put a character in a specific body pose (sitting with one knee up, hand on hip, a yoga stance, mid-jump ...). It searches the shared BudgetPixel pose library: every pose is drawn on two faceless grey mannequins, a woman and a man, and every pose is one a real body can do. Then write \"@<character> in @<pose_handle>\" in the prompt of generate_image or generate_video, e.g. \"@barry in @sitting_knee_up_pose on a beach at sunset\": the woman or man mannequin is picked automatically from the character's gender, and the character takes the position while keeping their own face, body and clothes. Add an angle to the handle for another view, e.g. @sitting_knee_up_pose.three_quarter (front by default; get_pose lists the angles a pose has). query searches by words (\"knee up\", \"yoga\"); shelf narrows to one kind of pose. When nothing fits, design_pose makes a new one. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fit": {
                "description": "Optional: women or men lists the poses made for them plus the unisex ones (unisex lists them all). Every pose works for any character (the mannequin follows the character's gender), so leave it out unless the user asks.",
                "enum": ["women", "men", "unisex"],
                "type": "string"
              },
              "limit": {
                "description": "Optional: at most this many (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional words to search the poses' names, descriptions and tags, e.g. \"knee up\", \"hand on hip\" or \"yoga\".",
                "type": "string"
              },
              "shelf": {
                "description": "Optional: one shelf. half_body = waist-up poses drawn from the head to the hips (portraits, selfies, gestures); a picture made with one is framed the same way; kneeling_crouching = kneeling and crouching; walking_running = walking and running; jumping_action = jumps, landings and action; sports_fitness = sports, yoga and workouts; gestures_upper_body = gestures and upper-body poses.",
                "enum": ["standing", "half_body", "sitting", "lying", "kneeling_crouching", "walking_running", "jumping_action", "dance", "sports_fitness", "glamour", "gestures_upper_body"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
