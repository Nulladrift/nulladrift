              "end_image": {
                "description": "Optional END FRAME used together with image (the start frame) — the video interpolates between the two.",
                "type": "string"
              },
              "generate_audio": {
                "description": "Whether the model should generate audio with the video (no price impact on seedance-2.5/2.0 or flux-3-video).",
                "type": "boolean"
              },
              "image": {
                "description": "Optional START FRAME for image-to-video — a public image URL, a data URI, or raw base64. Can't be combined with reference_images or video.",
                "type": "string"
              },
              "mode": {
                "description": "p-video-2-pro ONLY: generation mode, which sets the price together with resolution — cost (cheapest AND fastest, ~20s for a 5s clip), speed (default), quality (most detail, slowest). Per-second prices per mode are in list_models. Omit for every other model.",
                "enum": ["cost", "speed", "quality"],
                "type": "string"
              },
              "model": {
                "description": "Video model id. Omit for the default (seedance-2.5 — flagship multimodal: text-to-video, image-to-video, reference images/videos/audio; pass a clip as reference_videos to edit/extend; 480p/720p/1080p, up to 30s). wan-3.0-video is the Alibaba all-in-one alternative — same modes, up to 30s, free reference images and audio (480p 60 / 720p 120 / 1080p 240 credits/sec of output, and the same rate per second of reference video; wan-3.0-video-prime is the same model generating much faster at 85/170/340). For cheaper drafts pick seedance-2.0-mini (480p 60 / 720p 120 credits/sec). Call list_models for per-resolution prices.",
                "type": "string"
              },
              "negative_prompt": {
                "description": "What to avoid in the generated video",
                "type": "string"
              },
              "prompt": {
                "description": "Text prompt describing the video to generate (or the edit to apply, when passing an input video)",
                "type": "string"
              },
              "reference_audios": {
                "description": "minimax-h3 / minimax-h3-max / seedance-2.5 / seedance-2.0 / seedance-2.0-mini / wan-3.0-video(-prime) only: reference AUDIO clips (WAV/MP3) guiding sound/voice — each a public URL (upload local files with upload_media first). Caps: minimax-h3(-max) ≤3, 15s combined; seedance-2.5 ≤10, 2-30s each, 30s combined (audio-only input works); seedance-2.0 / seedance-2.0-mini ≤3 with `audio` counted, 15s combined, and they need a reference image or video next to them; wan-3.0-video(-prime) ≤5, 15s combined (audio-only works). Free. Can't be combined with image/end_image.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reference_images": {
                "description": "Optional reference images guiding the video (subject consistency) — each a URL, data URI, or base64. seedance-2.5: up to 30; wan-3.0-video / wan-3.0-video-prime: up to 10 (free); seedance-2.0 family: up to 9, with or without an input video. Can't be combined with image/end_image.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reference_videos": {
                "description": "minimax-h3 / minimax-h3-max / seedance-2.5 / seedance-2.0 / seedance-2.0-mini / wan-3.0-video(-prime) / kling-4.0 only: reference VIDEO clips guiding motion/identity — on seedance-2.5 and wan-3.0-video(-prime) also the way to EDIT or EXTEND a clip (kling-4.0 edits through `video`). Each a public video URL (upload local files with upload_media first). Caps: minimax-h3(-max) ≤3, 15s combined; seedance-2.5 ≤10, 2-30s each, 30s combined; seedance-2.0 / seedance-2.0-mini ≤3 (a `video` to edit counts as one), 15s combined; wan-3.0-video(-prime) ≤5, 15s combined, and input + output ≤ 30s; kling-4.0 ≤5 (a `video` to edit counts as one), 3-30s each, 30s combined, 700-4553 px per side. IMPORTANT — billed per second of INPUT on top of the output: h3 160/s; seedance-2.5 80/160/375 per s at 480p/720p/1080p; the seedance-2.0 family half its output rate; wan-3.0-video(-prime) its full output rate (60/120/240, Prime 85/170/340); kling-4.0 moves every billed second to 124/186 (720p/1080p) and bills the output plus the longer of the input clips and the output. Can't be combined with image/end_image (except on kling-4.0).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resolution": {
                "description": "Output resolution — PRICING VARIES A LOT (seedance-2.5: 480p=150, 720p=330, 1080p=750 credits per SECOND, default 720p; seedance-2.0: 1080p=550/4k=1250). Prefer 480p unless asked.",
                "type": "string"
              },
              "video": {
                "description": "Optional INPUT VIDEO for video-to-video editing (2-15s) — must be a URL (upload local files with upload_media first). Can't be combined with image/end_image. On the seedance-2.0 family the INPUT seconds are billed at half the output per-second rate on top of the output, and up to 2 more reference_videos may join it (it is \"Video 1\"). On minimax-h3-max the video is EXTENDED instead (1.6-60s source; length_seconds = new footage appended; source billed 170 credits/sec, first 15s). On flux-3-video it is EXTENDED too (1s-2min source, free; length_seconds = 5-15s of new footage at the extend rate; the result is the source followed by the new footage).",
                "type": "string"
              }
