        },
        {
          "name": "generate_depth_map",
          "title": "Generate Depth Map",
          "description": "Use this to turn a video into a depth map video (Video Depth Anything, on BudgetPixel's own GPUs): a steady, flicker-free video where near is white and far is black, at the input's size (up to 1080p) and frame rate (up to 30 fps). Use it as a depth / structure / motion reference or control video for video models — grayscale (the default colormap) is what they take as a depth reference; turbo, inferno, magma and viridis colour it for viewing only. Priced per second of the INPUT video, rounded up to whole seconds, 5-second minimum, by model size: small 20 / base 30 / large 40 credits per second (a 5-second clip or shorter costs 100 / 150 / 200, a 10-second clip 200 / 300 / 400). The resolution does not change the price. small is fastest; base adds edge detail; large draws the finest detail (hair, thin poles, distant people) and is the steadiest. Input: a video URL (pass one from upload_media for local files), up to 30 seconds and 50MB. Options: size (default small), colormap (default grayscale), resolution (default auto = the input's size, never upscaled), keep_audio (copy the input's audio), side_by_side (input on the left, depth map on the right), face_mesh (no extra charge: draws each face's mesh so a video model keeps lip, eye and head movement; set it when people talk or emote), max_faces (1-4, default 4), include_face_landmarks (no extra charge: also returns a face landmarks JSON link). The price is held when the job starts and charged on success only; a failed job is never charged. Jobs take about 1-2 minutes: the tool returns a job_id — poll check_generation_status with that job_id and type \"depth\" every 15-30 seconds until it returns the finished depth video, then tell the user. The depth video is also saved to the user's BudgetPixel library.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "colormap": {
                "default": "grayscale",
                "description": "grayscale (default; near = white, far = black) is what video models take as a depth reference. turbo, inferno, magma and viridis colour the depth map for viewing — not for use as a reference.",
                "enum": ["grayscale", "turbo", "inferno", "magma", "viridis"],
                "type": "string"
              },
              "face_mesh": {
                "default": false,
                "description": "Draw a mesh over each face (eyes, brows and lips in colour) so a video model given the depth map keeps lip, eye and head movement: use it when people talk or show expressions. Faces are found automatically; a face turned to full profile gets no mesh. No extra charge (default false).",
                "type": "boolean"
              },
              "include_face_landmarks": {
                "default": false,
                "description": "Also return a link to a JSON file of per-frame face landmarks (478 3D points), 52 expression scores and head pose for each face, for animation or analysis. Works with or without face_mesh. No extra charge (default false).",
                "type": "boolean"
              },
              "keep_audio": {
                "default": false,
                "description": "Copy the input's audio into the depth video (default false).",
                "type": "boolean"
              },
              "max_faces": {
                "default": 4,
                "description": "Most faces tracked at once, 1-4, largest first (default 4). Applies to face_mesh and include_face_landmarks.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "resolution": {
                "default": "auto",
                "description": "The output's short side: auto (default) keeps the input's size, up to 1080p. It never upscales, and the price is the same at every resolution.",
                "enum": ["auto", "360p", "480p", "720p", "1080p"],
                "type": "string"
              },
              "side_by_side": {
                "default": false,
                "description": "Put the input on the left and the depth map on the right, twice the width (default false).",
                "type": "boolean"
              },
              "size": {
                "default": "small",
                "description": "Model size, which sets the price per second of input video: small 20 (default, fastest), base 30 (adds edge detail), large 40 (finest detail — hair, thin poles, distant people — and the steadiest).",
                "enum": ["small", "base", "large"],
                "type": "string"
              },
              "video": {
                "description": "The video to turn into a depth map: an http(s) URL (a generated video's URL, or one from upload_media for local files). Up to 30 seconds, ≤50MB. Required.",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Depth map started.",
            "openai/toolInvocation/invoking": "Starting depth map…",
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cb96b0ec46a130ec9def216bf6fe34ee3953b2edc28557c1e32fa7784270fb9e"
        },
        {
          "name": "generate_image",
          "title": "Generate Image",
          "description": "Use this to create or edit an AI image. Text-to-image from a prompt, OR image-to-image / editing / multi-reference by passing input_images (URLs, data URIs, or base64) — e.g. edit or restyle an image the user just generated by passing its URL. Input support is per-model: some take 1 image, some several, some none (check each model's max_input_images via list_models). Submits an async job and returns a job_id — then call check_generation_status to poll (usually ready in seconds); when complete it returns the finished image inline for you to display. Each call starts a new job that spends credits from the user's BudgetPixel balance (failed jobs aren't charged). Default model: seedream-5.0-pro; call list_models to see every available model with prices and input limits. Write @handle in the prompt to cast a character (list_characters), e.g. a free BudgetPixel AI influencer like @barry; an item's @handle (search_wardrobe) dresses them: \"@barry wearing @camel_coat_set\"; a pose's @handle (search_poses) poses them: \"@barry in @sitting_knee_up_pose\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Aspect ratio of the generated image. Omit for the default: 1:1 — except an edit with flux-3-image, flux-3-image-klein or nano-banana-2.1, which keeps the first input image's shape unless you set a ratio here.",
                "enum": ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3", "21:9"],
                "type": "string"
              },
              "background": {
                "description": "Optional output background for models that support it (see list_models). gpt-image-2.6-sunburst / gpt-image-2.6-flare: \"transparent\" makes a cut-out (a sticker, logo or product) straight from the prompt or an edit, returned as a PNG with transparency; seedream-5.5 does the same. seedream-5.0-flash / seedream-5.0-pro: \"transparent\" only keeps a transparent background when EDITING: pass exactly one input image, a PNG that already has transparent pixels. Omit (or \"opaque\") for a normal image.",
                "enum": ["opaque", "transparent"],
                "type": "string"
              },
              "google_search": {
                "description": "Optional, nano-banana-2.1 only: ground the image in live Google Search results (weather, scores, recent events, current facts). Off by default. Costs extra: 10 credits per image (list_models shows the current price). Turn it on only when the request needs current, real-world information, and tell the user it adds to the cost.",
                "type": "boolean"
              },
              "grounding": {
                "description": "Optional, flux-3-image only: let the model research the prompt with web and image search before rendering. On by default and free. Set false for faster, self-contained generation. Omit for the default.",
                "type": "boolean"
              },
              "image_search": {
                "description": "Optional, nano-banana-2.1 only: let the model look up web images as visual reference before rendering (what a real place, product or landmark looks like). Off by default. It runs a Google Search too, so it costs 20 credits per image in total, with or without google_search (list_models shows the current price). Tell the user it adds to the cost.",
                "type": "boolean"
              },
              "input_images": {
                "description": "Optional input image(s) for image-to-image / editing / multi-reference — each a public image URL, a data URI, or raw base64. Per-model support: some models take 1, some several, some none (see max_input_images in list_models). Omit for text-to-image. To edit an image the user just generated, pass its URL here.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "model": {
                "description": "AI model id. Omit for the default (seedream-5.0-pro — strong identity preservation and precise edits, up to 9 reference images; 55 credits at 1K, 110 at 2K). For fast, low-cost drafts pick flux-3-image-klein (FLUX 3 Klein: 12 credits at 1K, up to 10 free references, images in seconds) or seedream-5.0-flash (flat 25 credits, free references). By job: gpt-image-2.6-sunburst (dense text, complex layouts, precise edits; up to 16 free references), gpt-image-2.6-flare (fast, sharp text; both make transparent cut-outs), seedream-4.5 (photorealism), gpt-image-2 (text in images), nano-banana-2.1 (fast, sharp text in images, up to 9 free references; optional paid search grounding), nano-banana-2 (editing), qwen-image-3.0 (all-rounder), flux-3-image (FLUX 3: up to 10 free references, optional web grounding; priced by size, 55 credits at 768px up to 790 at 4K). Call list_models for the full catalog with prices and input limits.",
                "type": "string"
              },
              "negative_prompt": {
                "description": "What to avoid in the generated image",
                "type": "string"
              },
              "num_images": {
                "description": "Number of images to generate (1-4)",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "Text prompt describing the image to generate",
                "type": "string"
              },
              "quality": {
                "description": "Optional rendering quality for models that support it (gpt-image-2: low/medium/high; gpt-image-2.5-sunburst and gpt-image-2.5-flare: low/medium/high/xhigh/max; gpt-image-2.6-sunburst and gpt-image-2.6-flare: low 70, medium 120, high 175, xhigh 340 or max 675 credits per image at any size; grok-imagine-image-2: low/medium — no high tier). Higher costs more. On grok-imagine-image-2 quality x resolution sets the price (low 1K=50, low 2K=80, medium 1K=80, medium 2K=100 credits). Omit for default.",
                "type": "string"
              },
              "resolution": {
                "description": "Optional output size (per-model options, e.g. seedream-5.5, seedream-5.0-pro & seedream-5.0-flash: 1K/2K; gpt-image-2 & nano-banana-2: up to 4K; nano-banana-2.1: 1K/2K/4K; flux-3-image and flux-3-image-klein: 768px/1K/1.5K/2K/4K — see list_models for what each size costs). Omit for the model default. Larger costs more, sometimes far more: flux-3-image is 55/65/90/130/790 credits per image at 768px/1K/1.5K/2K/4K (flux-3-image-klein 11/12/15/19/48), so confirm with the user before choosing 4K.",
                "type": "string"
              },
              "seed": {
                "description": "Seed for reproducible generation",
                "type": "integer"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Image generation started.",
            "openai/toolInvocation/invoking": "Starting image generation…",
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fbbd10c86d67d287ee694a8c66dd444cf1f67ec1e7e1f07afac9fccf2c3d4b85"
        },
        {
          "name": "generate_music",
          "title": "Generate Music",
          "description": "Use this to create an AI music track (full songs with vocals, or instrumentals). Three models: music-3.0 (default, 200 credits — songs from a prompt and/or lyrics, lyrics optimizer on by default so a prompt alone works), mureka-v9 (60 credits — sings the user's EXACT lyrics verbatim, or instrumental/BGM), and lyria-3 (100 credits — high-fidelity from a rich prompt, can condition on up to 10 reference images), and sonilo-music (instrumental/background music of an EXACT length via duration, 5–360 s — priced PER SECOND at 4 credits/s with a 10-second minimum, no vocals). VIDEO-TO-MUSIC: pass a `video` URL (upload_media first for local files) and sonilo-video-music composes a licensed soundtrack for the clip's content, pacing and mood — priced per second of the video's measured length (15 credits/s, 10 s minimum, ≤360 s). Flat price per track (per second for the Sonilo models), charged on success only; each call starts a new paid job. Submits an async job and returns a numeric job_id — music takes a minute or three: poll check_generation_status with the job_id AND type \"music\" every 15–30 seconds, then share the finished track's listen/download link with the user (chat can't embed audio players).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "sonilo-music only: track length in seconds (5–360, default 30). Billed per second with a 10-second minimum (4 credits/s → 30 s = 120 credits). Other music models ignore length (sonilo-video-music sizes the music to the video).",
                "maximum": 360,
                "minimum": 5,
                "type": "integer"
              },
              "format": {
                "description": "music-2.6/music-3.0 only: output audio format, wav (default) or mp3.",
                "type": "string"
              },
              "images": {
                "description": "lyria-3 only: up to 10 reference images to condition the mood — each a URL, data URI, or raw base64 (upload local files with upload_media).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "instrumental": {
                "description": "Generate an instrumental track (no vocals). music-2.6/music-3.0 and mureka-v9 (mureka requires a prompt in this mode).",
                "type": "boolean"
              },
              "lyrics": {
                "description": "Lyrics to sing. mureka-v9 sings them VERBATIM ([verse]/[chorus] tags supported); music-2.6/music-3.0 polish them unless lyrics_optimizer is false; lyria-3 treats them as optional guidance.",
                "type": "string"
              },
              "lyrics_optimizer": {
                "description": "music-2.6/music-3.0 only. Write/polish lyrics from the prompt — DEFAULT TRUE (matches web/API). Set false to sing the provided lyrics as-is.",
                "type": "boolean"
              },
              "model": {
                "description": "Music model id. Omit for the default (music-3.0 — latest MiniMax, all-purpose songs, 200 credits; passing a video auto-selects sonilo-video-music). Alternatives: music-2.6 (previous generation, same price), mureka-v9 (sings exact lyrics, cheapest at 60), lyria-3 (high-fidelity, image conditioning, 100), sonilo-music (instrumental/background music of an exact length, priced per second — pass duration). Call list_models for details.",
                "type": "string"
              },
              "prompt": {
                "description": "Style/mood description of the track. Required for lyria-3 (10–2000 chars) and for instrumental tracks; optional on music-2.6/music-3.0 when lyrics are given.",
                "type": "string"
              },
              "video": {
                "description": "Video-to-music: URL of a video (≤360 s, ≤30 MB for public URLs) to compose a licensed soundtrack FOR — the music follows the clip's content, pacing and mood, and matches its length. Must be a URL — upload local files with upload_media first. Uses sonilo-video-music: 15 credits per second of the video's measured duration (10-second minimum). prompt becomes optional direction (genre/mood/instrumentation); no lyrics or duration.",
                "type": "string"
              },
              "vocal_gender": {
                "description": "mureka-v9 only: preferred vocal gender for songs (default auto).",
                "enum": ["auto", "female", "male"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Music generation started.",
            "openai/toolInvocation/invoking": "Starting music generation…",
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c6855dc6bb7a339c3f768f322c099b0acacfb3e0e10a693d1ad158a2dbc4a938"
        },
        {
          "name": "generate_sound_effect",
          "title": "Generate Sound Effect",
          "description": "Use this to create sound effects (NOT music). TEXT mode: describe the sound — Foley, ambience, UI sounds, whooshes/transitions, impacts, action sounds — with sonilo-sfx: 1–180 seconds, mp3 or wav, PRICED PER SECOND of the requested duration (5 credits/s, 3-second minimum → 5 s = 25, 10 s = 50, 30 s = 150 credits). VIDEO mode: pass a video URL (upload local files with upload_media first) to get frame-accurate effects synced to the clip's visible events with sonilo-video-sfx — billed per second of the VIDEO's measured length (15 credits/s, 3-second minimum, up to 360 s) and returns both the SFX track and the video with the effects mixed in. Each call starts a new paid job, charged on success only. Keep text clips as short as the sound needs and confirm cost for long videos. Submits an async job and returns a numeric job_id — text clips finish within ~15 seconds, video jobs can take a few minutes: poll check_generation_status with the job_id AND type \"sound_effect\" every 5–15 seconds, then share the finished link(s) with the user (chat can't embed players). For songs or background music use generate_music instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Text mode: length of the clip in seconds (1–180, default 10). Billed per second with a 3-second minimum — 10 s = 50 credits on the default model. Ignored when a video is given.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "format": {
                "description": "Output audio format: mp3 (default, small) or wav (lossless, for editing).",
                "enum": ["mp3", "wav"],
                "type": "string"
              },
              "model": {
                "description": "Sound-effect model id. Omit for the default (sonilo-sfx for text; sonilo-video-sfx is selected automatically when video is given). Call list_models for details.",
                "type": "string"
              },
              "prompt": {
                "description": "Description of the sound effect — Foley, ambience, UI sounds, transitions, impacts, action (e.g. 'heavy rain on a tin roof with distant thunder'). Up to 1000 characters.",
                "type": "string"
              },
              "video": {
                "description": "Optional INPUT VIDEO URL to sync the effects to (frame-accurate Foley/ambience/impacts for the clip's visible events). Must be a URL — upload local files with upload_media first; public URLs OK (≤30 MB, ≤360 s). Uses sonilo-video-sfx: 15 credits per second of the video (3-second minimum); returns the SFX track AND the video with the effects mixed in. prompt becomes optional direction.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Sound effect generation started.",
            "openai/toolInvocation/invoking": "Starting sound effect generation…",
            "securitySchemes": [
