        {
          "name": "generate_3d_model",
          "title": "Generate 3D Model",
          "description": "Turn one picture into a textured 3D model (image-to-3D). Always returns a GLB; meshy-7.1 also offers FBX, USDZ (iPhone AR) and STL (3D printing). Pick the model by job: tripo-h3.1 (default) is the most faithful reconstruction — including cartoons and stylized art — with PBR materials, ~4 min, 400 credits; meshy-7.1 makes lighter ~30K-triangle models in more formats and supports rigging (with a walk and a run) + animation for humanoid characters, the move chosen with animation_move (a dance, a wave, a cheer and hundreds more), ~2 min, 1600 credits. Best input is one subject on a plain background. Submits an async job and returns a job_id — 3D models take 2-5 minutes, so poll check_generation_status with this job_id and type \"3d\" every 15-30 seconds; when done it returns the thumbnail inline plus download links (GLB/FBX/USDZ/STL). Files are kept about 24 hours, so download them promptly (save_to_assets does not take 3D models). Charged on success only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "animation": {
                "description": "meshy-7.1 only, needs rigging true: add walk/run animation clips. +160 credits. Ignored on tripo-h3.1.",
                "type": "boolean"
              },
              "detailed_geometry": {
                "description": "tripo-h3.1 only: finer mesh detail, +270 credits. Ignored on meshy-7.1.",
                "type": "boolean"
              },
              "image": {
                "description": "The picture to turn into a 3D model — a public image URL, a data URI, or raw base64 (upload a local file with upload_media first). Best results: one subject, centered, on a plain background.",
                "type": "string"
              },
              "model": {
                "description": "3D model id. Omit for the default (tripo-h3.1 — most faithful reconstruction, including cartoons and stylized art, PBR materials, GLB only, ~4 min, 400 credits). meshy-7.1: lighter ~30K-triangle models, more output formats (GLB, FBX, USDZ for iPhone AR, STL for 3D printing), rigging + animation for humanoid characters, ~2 min, 1600 credits. Call list_models for exact prices.",
                "enum": ["tripo-h3.1", "meshy-7.1"],
                "type": "string"
              },
              "rigging": {
                "description": "meshy-7.1 only: add a humanoid skeleton rig (characters/figures only). +270 credits. Ignored on tripo-h3.1.",
                "type": "boolean"
              },
              "texture": {
                "description": "Generate PBR textures (default true). false makes an untextured mesh for less (tripo-h3.1 270, meshy-7.1 1080).",
                "type": "boolean"
              },
              "texture_quality": {
                "description": "tripo-h3.1 only, when texture is true: standard (default) or detailed (sharper textures, 540 credits instead of 400). Ignored on meshy-7.1.",
                "enum": ["standard", "detailed"],
                "type": "string"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
