      "instructions": "BudgetPixel creates images, video, music and sound effects with the user's own BudgetPixel account. Jobs spend credits from the user's balance; failed jobs are never charged.\n\nTools:\n- generate_image: text-to-image, or edit / image-to-image / multi-reference by passing input_images (URLs, data URIs or base64). Input support is per model (max_input_images in list_models). To edit an image the user just generated, pass its URL. Then poll check_generation_status: images are usually ready in seconds and come back inline — show the image and share its link.\n- generate_video: text-to-video; image-to-video (image start frame, optional end_image); reference-to-video (reference_images); or video-to-video editing (video: an input video URL). Video takes minutes: poll check_generation_status with the uuid job_id every 15–30 seconds, then share the video link (chat can't embed video).\n- Drafts (seedance-2.5): generate_video with draft: true makes a 480p draft at the 480p price; when the user likes it, finalize_video_draft with the draft's job_id renders the same video at 1080p (750 credits per second of the draft) within 7 days. check_generation_status on a finished draft gives the final's price and deadline.\n- generate_music: songs from a prompt and/or lyrics, or instrumentals. Pass a video URL to compose a soundtrack for that clip (15 credits per second of video, 10 s minimum, up to 360 s). Poll check_generation_status with the job_id AND type \"music\", then share the listen link.\n- generate_sound_effect: Foley, ambience, UI sounds, transitions and impacts — not music. Text mode: 1–180 s at 5 credits per second (3 s minimum). Video mode: effects synced to a video (15 credits per second of video), returning the effects track and the mixed video. Poll with type \"sound_effect\".\n- generate_3d_model: turns one picture into a textured 3D model (GLB; meshy-7.1 also FBX/USDZ/STL). tripo-h3.1 (default) is most faithful, incl. cartoons, PBR materials, ~4 min, 400 credits; meshy-7.1 makes lighter models, more formats, and supports rigging/animation for humanoid characters, ~2 min, 1600 credits. Takes 2-5 minutes: poll check_generation_status with the job_id and type \"3d\" every 15-30 seconds, then share the download links (they expire in ~24h — save_to_assets does not cover 3D models).\n- upscale_image and upscale_video: image upscaling (10–60 credits by target size) and video upscaling, up to 20 s: Topaz to 1080p or 4K (15–120 credits per second of input), or FLUX 3 Video Upscale, 1.5x–3x with precise or creative detail (95 / 135 credits per megapixel-second of output: 188 / 267 per second of 1080p output, 752 / 1068 at 4K). Upscaled results are also saved to the user's BudgetPixel library.\n- generate_depth_map: turns a video URL into a depth map video (near = white, far = black), for use as a depth / structure / motion reference or control video. 20 / 30 / 40 credits per second of input video for size small (default) / base / large, rounded up, 5 s minimum, input up to 30 s. Set face_mesh (no extra charge) when people talk or emote, so a video model keeps their lip, eye and head movement. Takes 1–2 minutes: poll check_generation_status with the job_id AND type \"depth\", then tell the user where the depth video is saved (their BudgetPixel library).\n- upload_media: turns a local file (base64; image, video or audio up to 50MB) into a short-lived URL to use as a generation input. Video and audio inputs must be URLs.\n- create_social_post: publishes to the user's PUBLIC BudgetPixel feed — only when the user explicitly asks to post. 10 credits per post, hourly cap, labeled \"via MCP\". list_my_themes lists the clan themes a post can enter (theme_id). Posts are All Rights Reserved by default; set license (cc-by / cc0) only when the user explicitly asks for a Creative Commons license — it is permanent.\n- Characters: write @handle in a generate_image or generate_video prompt to cast a character, with the same face and look in every image and video (\"@barry orders coffee like he owns the cafe\"). The BudgetPixel AI influencers (@barry, @rosa, @fifi, ...) are free for every user, and new ones join over time; the user's own and collected characters work too. list_characters lists everyone who can be cast, with the current count, get_character gives one in full (look, personality, speaking style, directing notes, every picture with a download link, usable with other tools too) and recommend_influencers picks influencers for a brief; all three are free. Influencers are never shown in explicit sexual content. When a result says who it features, pass that credit on to the user.\n- Wardrobe: dress a character by writing an item's @handle next to theirs (\"@barry wearing @camel_coat_set\"); search_wardrobe finds clothes (the user's own and the free library; pass the character's gender as fit), get_wardrobe_item reads one (free); add_wardrobe_item adds new clothes from a picture, a shop's product page or a description (a page that can't be read says so).\n- Poses: put a character in a specific body pose by writing a pose's @handle after theirs (\"@barry in @sitting_knee_up_pose\"; add an angle such as .three_quarter or .side for another view). search_poses finds poses in the shared library, each drawn on a woman and a man mannequin (the one matching the character's gender is picked automatically), and get_pose reads one with every picture; both free. A pose adds no fee: the image or video costs the model's normal price.\n- Designing poses: when no library pose fits, design_pose makes one from a description (or based_on a library pose plus what to change); library poses that already look like it come back first (confirm: true designs anyway). Poll check_pose_design every 20-30 s (a design takes about 3-6 minutes); when it is done, use the new @handle like any pose. 100 credits, charged only when the pose is made (refused or failed designs are free); paid plans, 20 a day. Every new pose joins the shared library for everyone, and poses a real body can't do, contortion, sex positions, minors, real people and violence are refused with the reason.\n- Pose views: get_pose lists every view of a pose, each picture with its place on the Camera Angles globe and the mention that asks for it (\"@barry in @seiza_pose.back\"). When the angle the user wants is missing, make_pose_view makes it for one mannequin (figure woman or man; azimuth 0 front, 45 front right, 90 right side = the figure's left side shows, 135 back right, 180 back, 225 back left, 270 left side, 315 front left; elevation 0, 30 from above or 60 from high above); poll check_pose_view every 10-15 s (usually 30-90 s). 40 credits, charged only when the view lands where asked; a place that already has a view, or one someone else is making, is free; 50 a day. Every view joins the shared library for everyone.\n- search_stock_images: searches BudgetPixel's reviewed stock library (CC BY 4.0). 10 credits per search, even with no results; it never generates. Include the returned credit line wherever an image is used.\n- search_stock_audio: searches the free sound effect library (kind \"sound_effect\") or the free background music library (kind \"music\"), both CC BY 4.0. 10 credits per search, even with no results; it never generates. Try it before generate_sound_effect or generate_music when an existing sound would do, with a query of a few plain words. Include the returned credit line wherever the audio is used.\n- list_models: the live catalog with prices, role hints and per-model input limits (it changes; don't assume a fixed list).\n- get_credit_balance, get_generation_history (images by default; type \"video\", \"music\" or \"sound_effect\" for those), save_to_assets.\n\nOutput lifecycle: generations made through this connector are temporary. Result links last about an hour and the files are deleted about 24 hours after generation; they are not added to the user's library unless you call save_to_assets with the job_id (that copy counts against their storage). Upscales and depth maps are the exception: they are saved to the library. 3D models are always ephemeral — save_to_assets does not accept them, so tell the user to download the files within 24 hours. Connector jobs also count against the user's monthly API spend limit if they set one.\n\nCosts:\n- Default image model seedream-5.0-pro (55 credits at 1K, 110 at 2K); flux-3-image-klein and seedream-5.0-flash cost less for drafts.\n- 3D models (generate_3d_model): tripo-h3.1 (default) 400 credits textured (270 untextured, 540 detailed texture, +270 detailed geometry); meshy-7.1 1600 credits textured (1080 untextured, +270 rigging, +160 animation).\n- Default video model seedance-2.5, priced per second by resolution (480p=150, 720p=330, 1080p=750 credits/s; reference-video input adds 80/160/375 per second), so 5 s at 720p ≈ 1,650 credits. seedance-2.0-mini costs less (480p=60, 720p=120 per second). Prefer 480p, and confirm the cost with the user before 1080p, long clips or more than 5 s.\n- Music: music-3.0 (default, 200 credits per track; its lyrics optimizer writes the words from a prompt — set lyrics_optimizer false to sing exact lyrics), music-2.6 (200), mureka-v9 (60; sings lyrics verbatim or makes background music), lyria-3 (100; up to 10 reference images), sonilo-music (4 credits/s, 10 s minimum; instrumental of an exact length), sonilo-video-music (15 credits per second of video).\n- Image aspect ratios: 1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3, 21:9. Videos default to 16:9.\n- Video format: videos are MP4, mostly H.264. seedance-2.5 at 1080p, seedance-2.0 at 4k and every Topaz video upscale are H.265 (HEVC) 10-bit instead (FLUX 3 Video Upscale is H.264), which some browsers show as a black frame with audio. The file is fine; tell the user when a result is H.265 (the tools say so).\n- Each generate or upscale call starts a new paid job: don't repeat a call that already returned a job_id — poll it instead.\n\nIf a tool says the account's plan doesn't include this connector, or there aren't enough credits, tell the user plainly what it said. Don't promote plans or purchases.",
      "tools": [
        {
          "name": "add_wardrobe_item",
          "title": "Add Wardrobe Item",
          "description": "Use this to add clothes to the user's wardrobe so a character can wear them. Give a picture (image_url: any picture's own address, a shop's product page, or a URL from upload_media; or image_base64) or a description. A product page is read for its product picture, but many shops (Amazon, Zara, H&M, eBay ...) don't allow automatic reading or show no product picture: the tool then says the page can't be read and what to do. Ask the user for the picture's own address (right-click the picture, Copy image address) or the picture itself, or, if you can browse, open the page yourself and pass the product picture's address. mode: photo (default for a picture: someone wears it and the clothes are taken out onto an invisible mannequin; charged at the image model's usual price, like generate_image), clean (the picture shows only the clothes: used as it is, free) or text (designed from the description, the model's usual price). note says what to take when a photo shows more (\"only the leather jacket\"). The picture takes about a minute: call get_wardrobe_item with the returned id until it is ready, then write its @handle next to a character in generate_image or generate_video.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional: its shelf.",
                "enum": ["everyday", "work", "formal", "party", "sport", "swim", "outerwear", "sleepwear", "underwear", "costume", "traditional", "seasonal"],
                "type": "string"
              },
              "description": {
                "description": "The clothes in words, to design them (mode text). A link inside is read like image_url.",
                "type": "string"
              },
              "fit": {
                "description": "Optional: who it is cut for (judged from the picture otherwise).",
                "enum": ["women", "men", "unisex", "female", "male"],
                "type": "string"
              },
              "image_base64": {
                "description": "The picture as base64 or a data URL, when you have the file.",
                "type": "string"
              },
              "image_url": {
                "description": "A picture's own address, a shop's product page (read for its product picture), one of the user's BudgetPixel picture links, or a URL from upload_media.",
                "type": "string"
              },
              "mode": {
                "description": "photo: someone wears it, the clothes are taken out onto an invisible mannequin (default for a picture). clean: the picture shows only the clothes, used as it is (free). text: designed from the description.",
                "enum": ["photo", "clean", "text"],
                "type": "string"
              },
              "model": {
                "description": "Optional: the image model that makes the picture for photo and text (default nano-banana-2.1).",
                "enum": ["nano-banana-2.1", "seedream-5.0-pro", "gpt-image-2.5-sunburst"],
                "type": "string"
              },
              "name": {
                "description": "Optional: a name (one is written for it otherwise).",
                "type": "string"
              },
              "note": {
                "description": "With a photo: what to take when it shows more, e.g. \"only the leather jacket\".",
                "type": "string"
              }
            },
            "type": "object"
          },
