        {
          "name": "search_stock_audio",
          "title": "Search Stock Sound Effects & Music",
          "description": "Use this when the user needs an existing sound effect or a piece of background music — for a video, podcast, stream, game, app or presentation — rather than a newly generated one. Searches BudgetPixel's free audio library, licensed CC BY 4.0 for commercial use, every item listened to and scored before listing. kind \"sound_effect\": whooshes, impacts, UI sounds, Foley, ambiences, animals, vehicles (a fraction of a second to about 6 s). kind \"music\": instrumental background tracks such as lofi, corporate, cinematic, acoustic (up to about a minute). Costs 10 credits per search, charged even when nothing matches. Try it before generate_sound_effect or generate_music: a search is cheaper and instant. Write the query as a few plain words naming the sound (\"door creak\", \"soft notification chime\", \"lofi study beat\"), not a generation prompt: every word counts, and a word the library does not have counts as a miss. It never generates: if nothing fits, say so. LICENCE: wherever a result is used, include its credit line exactly as returned (the `attribution` text; `attribution_html` for web pages).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter. Sound effects only; music has no categories.",
                "enum": ["transition", "impact", "stinger", "ui", "game", "human", "animals", "vehicles", "household", "nature", "ambience", "foley"],
                "type": "string"
              },
              "kind": {
                "description": "Which library: \"sound_effect\" (whooshes, impacts, UI sounds, Foley, ambiences) or \"music\" (instrumental background tracks).",
                "enum": ["sound_effect", "music"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return (default 10, max 20). The price is the same for any limit.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration": {
                "description": "Optional: longest result, in seconds (e.g. 1 for one-shot sound effects).",
                "exclusiveMinimum": 0,
                "maximum": 600,
                "type": "number"
              },
              "min_duration": {
                "description": "Optional: shortest result, in seconds (e.g. 30 for a music bed of at least half a minute).",
                "exclusiveMinimum": 0,
                "maximum": 600,
                "type": "number"
              },
              "offset": {
                "description": "For the next page: the previous offset plus the number returned. Each page is a new 10-credit search.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "The sound, in a few plain words — e.g. \"door creak\", \"soft notification chime\", \"rain on a tin roof\"; for music the genre, mood or use — \"lofi study\", \"upbeat corporate\", \"dark true crime documentary\". Max 200 characters. Name the sound itself; leave out lengths and production notes. Optional only when browsing a sound-effect category.",
                "type": "string"
              },
              "sort": {
                "description": "popular (default — best matches first when there is a query), newest, or top (highest rated).",
                "enum": ["popular", "newest", "top"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Stock audio search finished.",
            "openai/toolInvocation/invoking": "Searching stock audio…",
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3e25902d348e174d340cb11641d5dec1882c0fc4c5ff76d623693c4214c398ae"
        },
        {
          "name": "search_stock_images",
          "title": "Search Stock Images",
          "description": "Use this when the user needs an existing stock photo, illustration, background, wallpaper or texture — for a website, slide, blog post, app, video or design — rather than a newly generated image. Searches BudgetPixel's stock image library: AI-generated images, each reviewed before listing (no real people, logos or text), licensed CC BY 4.0 for commercial use. Set transparent to true for cut-outs only: PNG files with a transparent background, for stickers, overlays and compositing. Costs 10 credits per search, charged even when nothing matches, so write one specific query rather than many vague ones. It never generates: if nothing fits, say so. LICENCE: wherever an image is used, include its credit line exactly as returned (the `attribution` text; `attribution_html` for web pages). Download from the returned URLs rather than hotlinking them in production.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "enum": ["nature", "backgrounds", "wallpapers", "textures", "animals", "food", "travel", "transportation", "architecture", "business", "industry", "technology", "people", "education", "music", "art", "abstract", "holidays", "science", "health", "sports"],
                "type": "string"
              },
              "color": {
                "description": "Optional dominant-colour filter.",
                "enum": ["red", "orange", "yellow", "green", "turquoise", "blue", "purple", "pink", "white", "gray", "black", "brown"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return (default 10, max 20). The price is the same for any limit.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "For the next page: the previous offset plus the number returned. Each page is a new 10-credit search.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "orientation": {
                "description": "Optional shape filter: landscape for headers and slides, portrait for phone wallpapers and stories.",
                "enum": ["landscape", "portrait", "square"],
                "type": "string"
              },
              "query": {
                "description": "What the image should show, in plain words — e.g. \"misty pine forest at sunrise\", \"latte art on a wooden table\", \"abstract purple gradient background\". Max 200 characters. Optional only when browsing a category.",
                "type": "string"
              },
              "sort": {
                "description": "popular (default — best matches first when there is a query), newest, or top (highest rated).",
                "enum": ["popular", "newest", "top"],
                "type": "string"
              },
              "transparent": {
                "description": "Optional: true returns cut-outs only — PNG files with a transparent background, for stickers, overlays and compositing. Omit for every image.",
                "type": "boolean"
              },
              "type": {
                "description": "Optional: photos only, or illustrations (including 3D and painted art) only.",
                "enum": ["photo", "illustration"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
