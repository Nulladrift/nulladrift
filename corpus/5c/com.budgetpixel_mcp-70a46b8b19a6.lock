        {
          "name": "create_social_post",
          "title": "Post to BudgetPixel Feed",
          "description": "Publish a post to the user's PUBLIC BudgetPixel community feed — visible to everyone and labeled \"via MCP\". ONLY use this when the user EXPLICITLY asks to post/share/publish; never post proactively. Costs 10 credits per post (anti-spam, charged on publish — same as the developer API) with an hourly posting cap. media: 1–6 images, or 1 video + up to 3 images, or exactly 1 audio track — pass the URLs you got from generations (check_generation_status links) or upload_media, or any public URL/base64. Images can carry optional model/prompt generation info. Audio posts accept song_name, genre (a fixed list — see the enum), lyrics, AND cover_image (cover art goes in its own field, never as a second media item). To enter the post in one of the user's clan themes, pass theme_id (call list_my_themes to find it). Posts are All Rights Reserved by default; pass license (\"cc-by\" or \"cc0\") ONLY when the user explicitly asks for a Creative Commons license — it is permanent and cannot be changed after publishing. Returns the public post URL — share it with the user. Posts are moderated after publish (NSFW/spam rating affects feed visibility; the charge is not refunded for hidden posts).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "The post's text/caption (optional — media-only posts are fine).",
                "type": "string"
              },
              "cover_image": {
                "description": "Audio posts only: cover art — an image URL (generation link / upload_media URL), data URI, or base64 (max 15MB). Goes in THIS field, never as a media item.",
                "type": "string"
              },
              "genre": {
                "description": "Audio posts only: the track's genre — EXACTLY one of these values. Omit to have it classified automatically after publishing.",
                "enum": ["Pop", "Rock", "Hip-Hop & Rap", "R&B & Soul", "Electronic & Dance", "Lo-fi & Chill", "Ambient", "Jazz", "Classical", "Country", "Folk & Acoustic", "Metal", "Blues", "Latin", "K-Pop & J-Pop", "Reggae", "Soundtrack & Cinematic", "Other"],
                "type": "string"
              },
              "license": {
                "description": "Optional content license: \"arr\" (All Rights Reserved — the default), \"cc-by\" (CC BY 4.0) or \"cc0\" (CC0, public domain). OMIT unless the user EXPLICITLY asks for a Creative Commons license — never choose one on their behalf. Permanent: the license cannot be changed after publishing.",
                "enum": ["arr", "cc-by", "cc0"],
                "type": "string"
              },
              "lyrics": {
                "description": "Audio posts only: lyrics to show with the track.",
                "type": "string"
              },
              "media": {
                "description": "1–6 media items. Rules: 1–6 images, OR 1 video plus up to 3 images, OR exactly 1 audio track (audio can't mix).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "The media file — a URL (generation result link, upload_media URL, or any public URL), a data URI, or raw base64.",
                      "type": "string"
                    },
                    "model": {
                      "description": "Optional generation info: the model that made this image (images only).",
                      "type": "string"
                    },
                    "prompt": {
                      "description": "Optional generation info: the prompt that made this image (images only).",
                      "type": "string"
                    }
                  },
                  "required": ["file"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "song_name": {
                "description": "Audio posts only: the track's display name.",
                "type": "string"
              },
              "theme_id": {
                "description": "Optional: enter the post in a live clan theme — the id from list_my_themes (or the number in a budgetpixel.com/themes/<id> link). Works with any media type; posting to a theme of a clan the user hasn't joined joins them to it, like on the site.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["media"],
            "type": "object"
          },
