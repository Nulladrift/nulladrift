        {
          "name": "upscale_image",
          "title": "Upscale Image",
          "description": "Use this to upscale an image to a higher resolution. Default model p-image-upscale (Pruna AI) returns results in seconds and is priced by the target resolution: 4 MP = 10, 8 MP = 15, 16 MP = 30, 32 MP = 60 credits. Alternative clarity-upscaler does creative detail enhancement (steer with prompt/creativity) at a flat 30 credits and takes ~60 seconds. Pass the image as a URL (a generated image's URL, or upload_media for local files), a data URI, or base64. Charged on success only. The tool waits for the result and returns the upscaled image's URL — share it with the user. Unlike generations, the upscaled image is also saved to the user's BudgetPixel library.",
          "inputSchema": {
            "properties": {
              "creativity": {
                "description": "clarity-upscaler only: how much new detail the model may invent (0.3-0.9, default 0.35).",
                "type": "number"
              },
              "enhance_details": {
                "description": "p-image-upscale only: enhance textures and fine detail (may increase contrast).",
                "type": "boolean"
              },
              "enhance_realism": {
                "description": "p-image-upscale only: improve realism — recommended for AI-generated images.",
                "type": "boolean"
              },
              "image": {
                "description": "The image to upscale: an http(s) URL (a generated image's URL, or one from upload_media for local files), a data URI, or raw base64. Max ~20MB.",
                "type": "string"
              },
              "model": {
                "description": "Upscale model: p-image-upscale (default — Pruna AI, results in seconds, priced by target resolution 4/8/16/32 MP = 10/15/30/60 credits) or clarity-upscaler (creative detail enhancement, flat 30 credits, ~60s).",
                "type": "string"
              },
              "prompt": {
                "description": "clarity-upscaler only: optional guiding prompt describing the image content.",
                "type": "string"
              },
              "target": {
                "description": "p-image-upscale only: target output resolution in megapixels (sets the price: 4=10, 8=15, 16=30, 32=60 credits; default 4).",
                "enum": [4, 8, 16, 32],
                "type": "integer"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Upscale finished.",
            "openai/toolInvocation/invoking": "Upscaling image…",
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b4e0dbc46c64ad8878656334d25069d8f098821c9ba88daba36ee3e27bac1f4b"
        },
        {
          "name": "upscale_video",
          "title": "Upscale Video",
          "description": "Use this to upscale a video, with one of two models. Topaz (model topazlabs-video-upscale, the default): 1080p or 4K at 30 or 60 fps, priced per second of the INPUT video: 1080p = 15 (30fps) / 30 (60fps) credits/s, 4K = 60 / 120 credits/s, so a 10s clip to 1080p30 costs 150 credits; its result is an H.265 (HEVC) 10-bit MP4, which some browsers cannot play (black frame with audio) — tell the user. FLUX 3 Video Upscale (model flux-3-video-upscale): 1.5x to 3x the input frame (input up to 2560x1440), precise (keeps faces and products) or creative (adds fine detail), keeps the frame rate and audio, H.264 output; priced per megapixel-second of OUTPUT: 95 credits precise / 135 creative, so one second of 1080p output is 188 / 267 credits and of 4K 752 / 1068 — it costs far more than Topaz, so state the price and confirm with the user first. Input up to 20 seconds (pass a URL; upload_media for local files). The price is held when the job starts and charged on success only. Jobs take a few MINUTES: the tool returns a job_id — call upscale_video again with just job_id every 30-60 seconds until it returns the finished video URL, then share it. The upscaled video is also saved to the user's BudgetPixel library.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "A previously returned upscale job id — pass it alone to check progress and fetch the finished video URL.",
                "type": "integer"
              },
              "mode": {
                "description": "FLUX only: precise (default) keeps the source as it is (faces, products); creative adds fine detail and costs more (95 vs 135 credits per output megapixel-second).",
                "enum": ["precise", "creative"],
                "type": "string"
              },
              "model": {
                "description": "Upscaler: topazlabs-video-upscale (default; 1080p/4K at 30/60 fps, any input size) or flux-3-video-upscale (FLUX 3 super-resolution, 1.5x-3x the input, precise or creative detail; input up to 2560x1440). target_resolution/target_fps are Topaz's; upscale_factor/mode/prompt are FLUX's.",
                "enum": ["topazlabs-video-upscale", "flux-3-video-upscale"],
                "type": "string"
              },
              "prompt": {
                "description": "FLUX only, optional: what the clip shows, to steer the detail creative mode adds (up to 1000 characters).",
                "type": "string"
              },
              "target_fps": {
                "description": "Target frame rate (default 30). 60 fps doubles the per-second rate.",
                "enum": [30, 60],
                "type": "integer"
              },
              "target_resolution": {
                "description": "Target output resolution (default 1080p). 4K costs 4x: 1080p = 15/30 credits per input second (30/60fps), 4K = 60/120.",
                "enum": ["1080p", "4k"],
                "type": "string"
              },
              "upscale_factor": {
                "description": "FLUX only: how many times larger the output frame is (default 2). 720p at 3 is 4K.",
                "enum": [1.5, 2, 2.5, 3],
                "type": "number"
              },
              "video": {
                "description": "The video to upscale: an http(s) URL (a generated video's URL, or one from upload_media for local files). Up to 20 seconds, ≤50MB. Required unless job_id is set.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
