                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7ea8c58c98343f5fef897a584ebeb892ce1d282a2918d217ccd9952e993a2a58"
        },
        {
          "name": "generate_video",
          "title": "Generate Video",
          "description": "Use this to create or edit an AI video. Text-to-video from a prompt; image-to-video by passing image (start frame, + optional end_image); reference-to-video by passing reference_images; or video-to-video editing by passing video (an input video URL — upload local files with upload_media first). IMPORTANT — cost: video is priced per SECOND and by resolution (default model seedance-2.5: 480p=150, 720p=330, 1080p=750 credits/sec, plus 80/160/375 per second of reference-video INPUT), so e.g. 5s at 720p ≈ 1,650 credits and 5s at 1080p ≈ 3,750; confirm with the user before expensive combos (long durations or many reference clips). Each call starts a new paid job, charged on success only. Submits an async job and returns a job_id (uuid) — video takes MINUTES: poll check_generation_status every 15–30 seconds until it returns the finished video link, then share that link with the user. Default model: seedance-2.5; call list_models for available video models and prices. Write @handle in the prompt to cast a character (list_characters), e.g. a free BudgetPixel AI influencer like @barry; an item's @handle (search_wardrobe) dresses them: \"@barry wearing @camel_coat_set\"; a pose's @handle (search_poses) poses them: \"@barry in @sitting_knee_up_pose\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Aspect ratio (seedance-2.5: 16:9, 9:16, 1:1, 4:3, 3:4, 21:9 — default 16:9). On minimax-h3 it applies to TEXT-TO-VIDEO only. On seedance-2.5 it applies to t2v AND jobs with reference images/audio; a start/end frame or a reference VIDEO forces adaptive (output follows the input's frame). On wan-3.0-video (and -prime) it is honored in EVERY mode (even with a first frame or reference media) and also accepts 'adaptive' (its default — the model picks a suitable ratio from the inputs).",
                "type": "string"
              },
              "audio": {
                "description": "Optional reference audio URL (MP3/WAV/OGG; upload local files with upload_media). Must accompany reference_images, reference_videos or a video input. On the seedance-2.0 family it counts toward the 3 audio clips (pass more in reference_audios). Not for minimax-h3 / seedance-2.5 / wan-3.0-video(-prime) — use reference_audios there.",
                "type": "string"
              },
              "draft": {
                "description": "seedance-2.5 only: make a 480p DRAFT to preview cheaply, priced like any 480p video (150 credits/sec). If the user likes it, finalize_video_draft turns that same video into its 1080p final (same motion, framing and sound, sharper; 750 credits/sec) within 7 days. Leave resolution unset.",
                "type": "boolean"
              },
              "duration_seconds": {
                "description": "Video length in seconds (seedance-2.5: 4–30, default 5; seedance-2.0: 4–15). Cost scales linearly.",
