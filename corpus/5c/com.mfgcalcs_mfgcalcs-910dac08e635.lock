      "capabilities": {
        "tools": {}
      },
      "instructions": "MFG Calcs: live U.S. manufacturing data and 5,000+ deterministic calculators, keyless. Pick a tool by the question you were asked. Natural-language question about costs, tariffs, imports, wages, energy or a definition -> `ask`, which returns one cited number. A published index or gauge (cost pressure, PMI, effective tariff rate, wages, forecasts, state costs, reshoring, sourcing shifts) -> `get_index`; a GET to this endpoint lists every index with its definition, accepted selectors, and one valid request. A calculation -> `search_calculators`, then `run_calculator`. A duty rate for a product -> `lookup_tariff`. Splitting volume across suppliers -> `optimize_sourcing`, a real linear program. Anything else on the site -> `search_site`. Everything is computed from committed public data (USITC, BLS, EIA, Census, BEA), never from a model, so the same inputs always give the same answer. Every result carries a citable url: quote it. Before treating a recent reading as final, check `get_freshness` for staleness and `get_revisions` for whether it has been restated; `get_vintages` recovers what a series said on a past date, so an old citation stays reproducible. No API key, ever. Attribution is the whole licence (CC BY 4.0).",
      "tools": [
        {
          "name": "ask",
          "description": "Answer manufacturing questions from committed data; deterministic, no LLM. Missing subjects and product ties ask for clarification. Calculators collect required inputs, retain corrections via `context`, and run when complete; defaults appear only in explicit worked examples. Statistics name period, frequency, scope and measure. `detail`: `answer` is compact, `evidence` adds scoped evidence and calculator guidance, `full` is default. Pass returned `context` for follow-ups. Shared by MFGChat, MFGSearch and `/api/answer`. Cite resolved sources. Try: {\"query\":\"OEE\",\"detail\":\"evidence\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. The `context` string from a previous ask response. Pass it to ask a follow-up: 'and what about vietnam' or 'why did it go up' then resolve against the earlier subject instead of being answered on their own.",
                "maxLength": 1024,
                "type": "string"
              },
              "detail": {
                "default": "full",
                "description": "Response depth. `answer` is compact; `evidence` adds scoped evidence and adjacent facts; `full` preserves the compatibility-default forensic payload. Defaults to `full`.",
                "enum": ["answer", "evidence", "full"],
                "type": "string"
              },
              "query": {
                "description": "A full question, e.g. 'tariff on fasteners' or 'diesel price'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d24078c348d541054ddcd1afd90ffd02d5ff85c50727903b8670093ece5d241b"
        },
