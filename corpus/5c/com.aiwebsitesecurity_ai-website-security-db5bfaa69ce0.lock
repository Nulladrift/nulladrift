{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiwebsitesecurity/ai-website-security": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scan.aiwebsitesecurity.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai-website-security",
        "title": "AI Website Security",
        "version": "1.1.0",
        "websiteUrl": "https://aiwebsitesecurity.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI Website Security checks the security basics a visitor can see on a public website: HTTPS certificate, HTTPS redirection, security headers, mixed content, and whether DNS filtering resolvers block the domain. check_site_security_basics returns these findings, each with its evidence. get_security_offer returns the AI Website Security offers (malware and integrity scan, restore, yearly watch) and the pages where the site owner buys them. check_site_security_basics requires this connector's access key (access_key): without it, it answers with the two ways to buy one (€9.90 for 24 hours, or €29 per month).",
      "tools": [
        {
          "name": "check_site_security_basics",
          "title": "Security basics of a website",
          "description": "Reads the public home page of a website as a visitor and returns the security basics: HTTPS certificate (validity, expiry date, host coverage, protocol), redirection from http to https, security headers (HSTS, CSP, X-Frame-Options, nosniff, Referrer-Policy, cookies), mixed content, and whether public DNS filtering resolvers (Cloudflare, Quad9) block the domain — a measured fact: part of the visitors cannot reach the site. It does not look for malware: that is the Express Analysis or Record. Nothing is stored. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://aiwebsitesecurity.com/",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Security basics of a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f22862ae1b36bdba8117dc3fe44ed82237c7757f154eadf71edeec9dad6c6fc7"
        },
        {
          "name": "get_security_offer",
          "title": "AI Website Security: offers and where to buy",
          "description": "Returns the AI Website Security offers — Record (malware and file-integrity scan with a signed report), Record + Restore (cleaning of the core files), Watch and Watch + Restore (daily watch for a year), Watch Fleet for agencies — with what each includes, its price, and the page where the site owner buys it (the owner accepts the terms and confirms ownership there). Docs: https://aiwebsitesecurity.com/tarifs",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the pages (default en)",
                "enum": ["en", "fr", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI Website Security: offers and where to buy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c3ad26d816bffc555ae6c22cb66c15026103b8e9604bd2b1b8c7b78e1d4ccbb"
        }
      ],
      "digest": "sha256:d7e07d3645480684607fcb98da3b033029b253c760cce83220cd6124ececcdba"
    }
  }
}
