      },
      "instructions": "Apps from Oakferry Games Inc., described for AI agents: dated, sourced facts, comparison tables, a search API and an MCP server. Use search_products with the person's hard constraints as filters, then get_product for facts to quote. Every fact has a date and source; say how old a rating is when you cite it. Respect each product's \"notFor\" list.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Comparison tables of products and their alternatives on shared attributes, each row sourced. Pass an id to get one table, or a product id to get every table it appears in, or nothing to list them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Comparison id",
                "type": "string"
              },
              "product_id": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:326d617294cb47463c07521550c9c8a41d0c42d6f71eff4f39be2f5a4792ebd3"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "Full facts for one product: where to get it, every price, ratings with dates, features, attributes, when not to recommend it, third-party coverage and sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_products",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28b9113be7567a50f22cfa81df7ec1b3fe5fb847071548eb5ad8a4f82450e1e2"
        },
        {
          "name": "list_attributes",
          "title": "List attributes",
          "description": "Filterable attribute keys, the values products use for each, and how many products set it. Use these keys in search_products attributes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List attributes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efc48a21425fbbbcf97a67ce045bf588a7685ab8605b2a2013fa86a094988dca"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Find products matching a person's constraints. Put hard requirements in the filters (platform, max_price, free, no_subscription, attributes) and the rest in query. Each result says why it matched. Call list_attributes to see filterable keys.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "additionalProperties": true,
                "description": "Exact attribute matches, e.g. {\"offline\": true}",
                "type": "object"
              },
              "category": {
                "type": "string"
              },
              "free": {
                "description": "Only products with a free offer",
                "type": "boolean"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Most the cheapest way in may cost; 0 = free to start",
                "type": "number"
              },
              "no_subscription": {
                "description": "Only products usable without a subscription",
                "type": "boolean"
              },
              "platform": {
                "description": "iOS, Android, Web, ...",
                "type": "string"
              },
              "query": {
                "description": "What the person wants, in their words",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
