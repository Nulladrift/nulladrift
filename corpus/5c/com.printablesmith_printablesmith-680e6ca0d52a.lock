      "instructions": "Printablesmith makes free printable sheets: word searches, bingo cards, crosswords, word scrambles, cryptograms, spelling and tracing worksheets, math worksheets and charts, mazes, sudoku, flashcards, certificates, calendars, chore and reward charts, planners, name tags and more. Each make_* tool lays out a real print-ready sheet from your settings, exactly as printablesmith.com does, and returns its link. The link opens the sheet on the site with every setting filled in, ready to download as a PDF and print: free, no sign-up, no watermark.\n\nHow to use these tools well:\n- You write the content (the words, clues, names, chores, problems); the tool lays it out. Keep everything suitable for children and classrooms: no violence, no adult themes, no brand names, trademarked events or trademarked characters (say \"big game day\", not the trademarked name).\n- For a common theme (a holiday, a season, animals, sight words, a math skill, older adults), call find_printables first. The site's ready-made pages have hand-checked word lists and crossword clues you can use as they are or adapt.\n- Always give the person the link from the result: it is their sheet. Never paste a puzzle grid as text; the layout is the tool's job.\n- In apps that show interactive results, the person sees the sheet in the chat with Download PDF and Open to adjust, plus Shuffle for sheets with a random layout, Play on screen for word searches, crosswords, mazes and sudoku, and Full screen where the app allows it, so a short sentence is enough. Elsewhere, describe the sheet in a line and give the link.\n- Use US Letter paper unless the person is outside the US and Canada or asks for A4. Use US spelling unless the person writes otherwise.\n- Omit seed for a fresh version; pass the seed from an earlier result to keep its random layout while changing other settings.\n- Words and settings are used only to check the settings and write the sheet's link; nothing is stored. Some tools take names (one puzzle, certificate, tag or chart each): they show on the sheet in the chat but never go in the link, as on the site. Use first names only, and only names the person gave you. In apps that do not show the sheet, the names do not reach it: tell the person to type them on the page after opening the link. Never put a child's name in a title or word list to get round this.\n- If the person shuffles the sheet in the chat, you are told its new link: give that one from then on.",
