        {
          "name": "find_printables",
          "title": "Find printables",
          "description": "Search all of printablesmith.com’s ready-made printables and makers: themed word searches, bingo, crosswords and more (holidays, seasons, topics, school subjects, parties), math skill worksheets, sight words, spelling lists, large print for older adults, charts, planners, templates and paper. Each result has its link, which make_* tool makes it, and for a themed page its hand-checked word list (and crossword clues) to use as they are or adapt. Search by topic and type, e.g. \"halloween word search\", \"thanksgiving bingo\", \"2nd grade spelling\", \"graph paper\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results (default 6).",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in a few words.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "results": {
                "description": "Matching pages, best first",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find printables"
          },
          "behavior": {
