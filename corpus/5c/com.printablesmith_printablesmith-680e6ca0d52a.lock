        {
          "name": "make_activity_pack",
          "title": "Activity pack",
          "description": "Make a whole activity pack from one word list, in one PDF: word search, word scramble, crossword, tracing, spelling, a spelling test, bingo, a maze and sudoku, with answer keys at the back. The fastest way to a themed set (a holiday, a unit, a party). spelling_week makes a Monday-to-Friday spelling set instead.",
