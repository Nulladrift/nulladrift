              },
              "title": {
                "description": "The pack’s title, printed on every sheet (up to 50 characters).",
                "maxLength": 50,
                "type": "string"
              },
              "word_search_difficulty": {
                "description": "The word search’s difficulty: easy, medium or hard.",
                "enum": ["easy", "medium", "hard"],
                "type": "string"
              },
              "words": {
                "description": "The words (up to 40). Give a clue after a dash for the crossword (\"owl - A bird that hoots at night\"); words without one get the site’s checked clue where it has one.",
                "items": {
                  "description": "A word, or \"word - clue\"",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 2,
                "type": "array"
              }
            },
