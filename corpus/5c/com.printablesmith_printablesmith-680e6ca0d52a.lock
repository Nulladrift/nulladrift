        "name": "printablesmith",
        "title": "Printablesmith",
        "version": "1.0.0",
        "description": "Free printable makers: word searches, bingo cards, crosswords, math worksheets, mazes, sudoku, tracing, charts, certificates, calendars and more, laid out as real print-ready sheets.",
        "websiteUrl": "https://printablesmith.com",
