                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "decoration": {
                "description": "A themed border with matching pictures, drawn around the sheet: \"line\" for a plain border, \"none\" for nothing, or a theme such as halloween, christmas, thanksgiving, spring, dinosaurs, space, ocean, animals, birthday, back-to-school (95 themes; find_printables shows a theme’s name). Leave out for no border.",
                "type": "string"
              },
              "dyslexia_font": {
                "description": "Print in OpenDyslexic, a typeface some readers with dyslexia find easier.",
                "type": "boolean"
              },
              "large": {
                "description": "Bigger, bolder letters on every sheet for young children and beginning readers (for older eyes, use large_print).",
                "type": "boolean"
              },
              "large_print": {
                "description": "Large print for older eyes or low vision: bigger, bolder letters and roomier layouts (sizes are capped to fit). For young children, use large.",
                "type": "boolean"
              },
              "letter_case": {
                "description": "upper or lower case letters on the puzzles.",
                "enum": ["upper", "lower"],
                "type": "string"
              },
              "paper": {
                "description": "Paper size: letter (US Letter, the default; US and Canada) or a4 (everywhere else).",
                "enum": ["letter", "a4"],
                "type": "string"
              },
              "seed": {
                "description": "Which random version to make. Leave out for a fresh one; pass the seed from an earlier result to keep that version while changing other settings.",
