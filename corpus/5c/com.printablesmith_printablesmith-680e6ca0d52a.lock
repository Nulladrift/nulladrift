        {
          "name": "make_chart",
          "title": "Chart for home or class",
          "description": "Make a printable chart for children and families: chore chart, reward (sticker) chart, potty training chart, behavior chart, visual schedule, first-then board, morning or bedtime routine chart, or habit tracker. Steps and chores get matching pictures automatically. Give names to print one chart per child (chore, reward and behavior charts; in the chat only).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Chore and behavior charts: week (7 days) or school (5).",
                "enum": ["week", "school"],
                "type": "string"
              },
              "decoration": {
                "description": "A themed border with matching pictures, drawn around the sheet: \"line\" for a plain border, \"none\" for nothing, or a theme such as halloween, christmas, thanksgiving, spring, dinosaurs, space, ocean, animals, birthday, back-to-school (95 themes; find_printables shows a theme’s name). Leave out for no border.",
                "type": "string"
              },
              "dyslexia_font": {
                "description": "Print in OpenDyslexic, a typeface some readers with dyslexia find easier.",
                "type": "boolean"
              },
              "goal": {
                "description": "Reward and behavior charts: the goal, e.g. \"Use the potty\" or \"Kind hands\".",
                "maxLength": 50,
                "type": "string"
              },
              "goal_picture": {
                "description": "Reward chart: the goal’s picture.",
                "enum": ["toilet", "toothbrush", "bed", "soap", "open-book", "teddy-bear", "backpack", "pencil", "broom", "apple", "music-note", "red-heart", "star", "trophy"],
                "type": "string"
              },
