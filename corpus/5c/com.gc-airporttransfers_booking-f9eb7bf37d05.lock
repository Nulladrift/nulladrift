      "instructions": "Private (not shared-shuttle) fixed-price airport and cruise transfers in Queensland: Gold Coast (OOL) & Brisbane (BNE) airports and the Brisbane International Cruise Terminal (Portside, Pinkenba), serving the Gold Coast, Brisbane, Byron Bay and Northern Rivers NSW. Prices are per vehicle, never per person, no surge. Date/time params use Queensland time (AEST, no daylight saving). Use get_quote for exact prices (never estimate) — for cruise transfers use \"Brisbane Cruise Terminal\" or \"Pinkenba\" as the destination. request_booking lodges a pending request — the operator confirms and the customer pays by emailed link, never through this API. Access: get_service_info, get_quote and check_availability work without sign-in (public service information, quotes and bookability); request_booking requires OAuth sign-in (scope transfers) - if it returns 401, ask the user to connect/sign in, or give them the quote's website booking link. Rate limits (fixed windows): signed-in 120 JSON-RPC calls per hour per IP; without sign-in 120 requests per hour per IP, of which get_quote + check_availability together 10 per minute and 60 per hour per IP (HTTP 429 + Retry-After when exceeded; nothing is booked by a refused read); sandbox connections 30 tools/call per hour per client.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Date/time bookability in Queensland time (AEST, no daylight saving) only — not prices (use get_quote for fares). Checks the operator's live settings for private Gold Coast / Brisbane / Byron Bay transfers (after-hours window, days off and blocked dates, optionally per vehicle). Times outside standard hours are bookable as after-hours requests (surcharge may apply); same-day should phone. Not a driver calendar: the operator confirms every booking.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD in Queensland time (AEST, no daylight saving)",
                "type": "string"
              },
              "time": {
                "description": "HH:MM 24h in Queensland time (AEST, no daylight saving)",
                "type": "string"
              },
              "vehicle": {
                "description": "sedan | carnival | maxi | eqb | v300 (optional; checks that vehicle's days off)",
                "type": "string"
              }
            },
            "required": ["date", "time"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "status": {
                "enum": ["bookable", "after_hours_request", "not_bookable", "call_us"],
                "type": "string"
              },
              "unavailable_vehicles": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["note", "reason", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:0e48f4dfbb7bd86cb8a23f860caa5d7c425b4730b0b272fd96dda61eb379de90"
        },
        {
          "name": "get_quote",
          "title": "Get a fixed-price quote",
          "description": "Exact per-vehicle prices from the live fixed price list for private Queensland airport transfers (Gold Coast OOL, Brisbane BNE) and Brisbane Cruise Terminal runs (use \"Brisbane Cruise Terminal\" or \"Pinkenba\" as the place), including Byron Bay / Northern NSW. Supports optional return trips (trip=return + return_date/return_time); return totals use the operator native return discount. Deterministic — never estimates. If match is \"none\", give the customer the phone number instead of guessing.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD in Queensland time (AEST, no daylight saving) (optional)",
                "type": "string"
              },
              "dropoff": {
                "description": "Alias for to (same meaning as request_booking.dropoff)",
                "type": "string"
              },
              "flight": {
                "description": "Flight number (optional; prefills the booking form)",
                "type": "string"
              },
              "from": {
                "description": "Pick-up place, e.g. \"Broadbeach\", \"Byron Bay\" or \"OOL\" (alias: pickup)",
                "type": "string"
              },
              "luggage": {
                "description": "Large bags (optional; filters vehicles and prefills the booking form)",
                "type": "integer"
              },
              "pax": {
                "description": "Passengers 1-16 (filters vehicles; 12-16 returns the two-vehicle Carnival+Maxi combination priced as a total). Groups over 16 return match \"none\" with contact details - do not quote them a price.",
                "type": "integer"
              },
              "pickup": {
                "description": "Alias for from (same meaning as request_booking.pickup)",
                "type": "string"
              },
              "return_date": {
                "description": "YYYY-MM-DD return pick-up date in Queensland time (AEST, no daylight saving) (optional; implies trip=return)",
                "type": "string"
              },
              "return_time": {
                "description": "HH:MM 24h return pick-up time in Queensland time (AEST, no daylight saving) (optional; implies trip=return)",
                "type": "string"
              },
              "time": {
                "description": "HH:MM 24h in Queensland time (AEST, no daylight saving) (optional; flags after-hours surcharge)",
                "type": "string"
              },
              "to": {
                "description": "Drop-off place, e.g. \"Gold Coast Airport\", \"Brisbane Airport\" or a suburb (alias: dropoff)",
                "type": "string"
              },
              "trip": {
                "description": "one_way (default) or return. When return, also send return_date and return_time.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["match"]
              },
              {
                "required": ["error"]
              },
              {
                "required": ["code", "message"]
              }
            ],
            "description": "The live fixed-price list result, passed through from the booking site. match fixed_route = options carries per-vehicle prices; none / blocked / unavailable = no price, give the customer the contact details or message. If the quote service itself refused (e.g. rate limit) the object carries error instead of match.",
            "properties": {
              "book_url": {
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "match": {
                "enum": ["fixed_route", "none", "blocked", "unavailable"],
                "type": "string"
              },
              "max_pax": {
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "combo": {
                      "type": "boolean"
                    },
                    "label": {
                      "type": "string"
                    },
                    "max_pax": {
                      "type": "integer"
                    },
                    "outbound_aud": {
                      "type": "number"
                    },
                    "per": {
                      "enum": ["vehicle", "total"],
                      "type": "string"
                    },
                    "price_aud": {
                      "type": "number"
                    },
                    "return_aud": {
                      "type": "number"
                    },
                    "vehicle": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "max_pax", "per", "price_aud", "vehicle"],
                  "type": "object"
                },
                "type": "array"
              },
              "phone": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "retry_after": {
                "type": "integer"
              },
              "return": {
                "properties": {
                  "date": {
                    "type": "string"
                  },
                  "match": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "route": {
                    "type": "object"
                  },
                  "time": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
