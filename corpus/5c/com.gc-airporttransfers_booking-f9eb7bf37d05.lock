        {
          "name": "request_booking",
          "title": "Request a booking",
          "description": "Lodge a booking REQUEST for a private (not shared-shuttle) fixed-price Queensland route — Gold Coast / Brisbane airport or Brisbane Cruise Terminal, including Byron Bay / Northern NSW. It is created as pending; the operator confirms and the customer receives a payment link by email. No payment happens through this tool. Confirm all details with the customer first. Date/time use Queensland time (AEST, no daylight saving).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD in Queensland time (AEST, no daylight saving) (at least 1 hour ahead; same-day: phone instead)",
                "type": "string"
              },
              "dropoff": {
                "description": "Drop-off place",
                "type": "string"
              },
              "email": {
                "description": "Customer email (receives acknowledgement + payment link)",
                "type": "string"
              },
              "flight": {
                "description": "Flight number (optional, enables free flight tracking)",
                "type": "string"
              },
              "name": {
                "description": "Customer full name",
                "type": "string"
              },
              "notes": {
                "description": "Anything else, e.g. child seats with ages (optional)",
                "type": "string"
              },
              "pax": {
                "description": "Passengers 1-16. Over 16 cannot be booked online - give the customer the phone number.",
                "type": "integer"
              },
              "phone": {
                "description": "Customer phone",
                "type": "string"
              },
              "pickup": {
                "description": "Pick-up place",
                "type": "string"
              },
              "sandbox": {
                "description": "Not supported: true is refused (this endpoint has no test mode; a request creates a real booking). Omit it.",
                "type": "boolean"
              },
              "time": {
                "description": "HH:MM 24h in Queensland time (AEST, no daylight saving)",
                "type": "string"
              },
              "vehicle": {
                "description": "sedan | carnival | maxi | eqb (Mercedes EQB luxury SUV, up to 3) | v300 (Mercedes V300 luxury van, up to 6) - auto-upgraded if too small for pax",
                "type": "string"
              }
            },
            "required": ["date", "dropoff", "email", "name", "pax", "phone", "pickup", "time"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Lodged: ok true with the booking reference, status awaiting_payment and the payment link the customer also receives by email (duplicate true = the same request was already lodged in the last 10 minutes; nothing new was created). Sandbox connections: status sandbox_not_lodged, lodged false.",
