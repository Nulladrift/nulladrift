                    "type": "string"
                  },
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "suggest": {
                "type": "string"
              },
              "surcharges": {
                "items": {
                  "properties": {
                    "applies": {
                      "type": "boolean"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["applies", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "terms": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "trip": {
                "enum": ["one_way", "return"],
                "type": "string"
              },
              "unavailable_note": {
                "type": "string"
              },
