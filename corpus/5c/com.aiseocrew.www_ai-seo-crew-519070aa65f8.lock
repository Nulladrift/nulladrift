{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiseocrew.www/ai-seo-crew": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.aiseocrew.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-seo-crew",
        "title": "AI SEO Crew",
        "version": "1.0.0",
        "websiteUrl": "https://www.aiseocrew.com/claude"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI SEO Crew researches, writes and publishes SEO blog posts on a user's website (WordPress, Shopify, Webflow, Wix, Framer or a coded site) so it ranks on Google and gets cited by AI search. check_page_seo, find_keyword_ideas and generate_llms_txt work without an account. The other tools need the user's AI SEO Crew account: list_sites gives the site_id values, get_seo_plan shows planned articles, list_articles and get_article show written ones, and publish_article puts one live on the user's site. Account creation, connecting a website and payment happen in the web app; tools return the link when a step needs it.",
      "tools": [
        {
          "name": "add_site",
          "title": "Add a website and build its SEO plan",
          "description": "Adds a website to the user's AI SEO Crew account and starts building its SEO plan: the crew reads the site, works out what the business sells and plans articles from real Google searches. Use it when someone wants SEO done for their website, wants blog posts that bring traffic from Google, or wants to start a blog on WordPress, Shopify, Webflow, Wix, Framer or a coded site. Free, takes about three minutes. Then call get_seo_plan with the returned site_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website address, like example.com",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a website and build its SEO plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3cc74a9fa61b6556a09ab9b0f0633710f50d6d137dfc6c063b00ef5aac6aa24b"
        },
        {
          "name": "add_topic",
          "title": "Add a topic to a site's SEO plan",
          "description": "Adds a Google search the user wants to rank for to the top of a site's SEO plan, with an optional article title. The crew writes it next.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "The search to target, like 'how much does a bookkeeper cost'",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "site_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Optional article title",
                "maxLength": 140,
                "type": "string"
              }
            },
            "required": ["keyword", "site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a topic to a site's SEO plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ac293245bfdc90005b48a1c94e0c6ece914c2b0ee8dc4457e6680d5f91362880"
        },
        {
          "name": "check_page_seo",
          "title": "Check a page's SEO and AI search visibility",
          "description": "Checks one public web page the way search engines see it: HTTP status, robots.txt and meta robots rules for Googlebot, Bingbot and AI crawlers (GPTBot, OAI-SearchBot, PerplexityBot, ClaudeBot), canonical, sitemap presence, title, meta description, headings and sharing tags. Use it when someone asks why a page isn't indexed, isn't found by ChatGPT or Perplexity, or wants an SEO check of a URL. Works without an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The page address, like example.com/blog/my-post",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a page's SEO and AI search visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b852e98666a4d3b50e55f0a2d271b900f9f391594977c83cb6372cd198d63eec"
        },
        {
          "name": "find_keyword_ideas",
          "title": "Find real Google searches for a topic",
          "description": "Returns real searches people type into Google around a topic, from Google autocomplete, grouped into questions, comparisons, buying searches and others. Use it for keyword research, blog post ideas, finding what a business could rank for on Google, or seeing how customers phrase a need. No search volumes. Works without an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code, default us",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code, default en",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "description": "A short topic, like 'bookkeeping for contractors'",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find real Google searches for a topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0754f1fb51eef0c02b5d964883d27f1328f6ef307f9b7955cb8dd3407ee4f88a"
        },
        {
          "name": "generate_llms_txt",
          "title": "Generate an llms.txt file for a website",
          "description": "Reads a website's homepage, navigation and sitemap, then writes an llms.txt file (the markdown summary some AI tools read) that the owner can upload to the site root. Use it when someone wants their site understood or cited by ChatGPT, Claude or Perplexity. Returns the file content. Works without an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website address, like example.com",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate an llms.txt file for a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55eb21c39191fc53f235bb449f12c711122726d983ddb8bc576b3f27415234f7"
        },
        {
          "name": "get_article",
          "title": "Read an article",
          "description": "Returns one article: title, status, meta description, target search, the full text in Markdown, its sources and, once published, its URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["article_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ca1fc19e374f7c4882cd631eb85cbbcdca48b4a9dbb5ef94a16d5f10ee23eea"
        },
        {
          "name": "get_results",
          "title": "Get a site's search results",
          "description": "Returns Google Search Console results for a site over the last 28 days: total clicks and impressions, and the published articles with the most clicks. Use it when someone asks how their SEO or blog traffic is doing. Needs Search Console connected in the app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many top articles, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "site_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a site's search results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8a13b3c189268ef6c1cad8a1de34e3c2bf05e8fafee86b2c3a5534baac131f5"
        },
        {
          "name": "get_seo_plan",
          "title": "Get a site's SEO plan",
          "description": "Returns the SEO plan of one site: progress while the crew is still building it, then the planned articles in writing order with their target Google search, monthly search volume and intent, plus the article IDs used by write_article and skip_article.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many planned articles to return, default 15",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "site_id": {
                "description": "From list_sites or add_site",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a site's SEO plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eee55d517177ea4348f9564ad7f9f3acf2953736628e0060a0b60c4826aadbd5"
        },
        {
          "name": "list_articles",
          "title": "List a site's articles",
          "description": "Lists a site's articles by status: written (waiting for approval), in_progress, published, or failed. Published articles include their URL and Search Console clicks and impressions when connected. Paginated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "site_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "Default: written",
                "enum": ["written", "in_progress", "published", "failed"],
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a site's articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:045978c6552259dd1c14268a9daa7b09a842f2174a1e8a751f07661e1a934a14"
        },
        {
          "name": "list_sites",
          "title": "List my AI SEO Crew sites",
          "description": "Lists the websites in the user's AI SEO Crew account with their status (plan being built, ready), article counts, where the crew publishes, and the account plan status. Start here to get site IDs for the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my AI SEO Crew sites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:850a596b1876acc770dbe05be7d1f921c20f33a0f8a3f4da26bb43a85c51d4b7"
        },
        {
          "name": "publish_article",
          "title": "Publish an article to the website",
          "description": "Publishes one written article to the user's live website through its connected platform (WordPress, Webflow, Wix, Framer, Shopify, GitHub or webhook), then resubmits the sitemap. Only for articles with status written. Visible to the public once done: confirm with the user first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article_id": {
                "description": "A written article, from list_articles with status written",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["article_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish an article to the website"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c18d1bb2559735782d047ef1ad32ecd2b8ffcfc2de38ed015607fba13a0ea78d"
        },
        {
          "name": "skip_article",
          "title": "Remove an article from the plan",
          "description": "Removes a planned, failed or written (unpublished) article from a site's plan so the crew never writes or publishes it. Cannot be undone. Published articles stay on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["article_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Remove an article from the plan"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9cf74ef2a0800d90c2675a4dd260353373d68639cb0d96eaa1d1edb172d1530d"
        },
        {
          "name": "write_article",
          "title": "Write a planned article now",
          "description": "Asks the crew to research and write one SEO blog post from the site's plan right away, sourced and in the site's own style, instead of waiting for its slot. Use it when someone wants a blog article written for their website to rank on Google. Counts toward the plan's monthly articles. Needs an active plan. Writing takes two to four minutes; then read it with get_article.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article_id": {
                "description": "A planned or failed article, from get_seo_plan or list_articles",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["article_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Write a planned article now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:627ff2912f896fa8cefba6ac6b5fb268e0bc686e4858d1a39253aed06cba7a51"
        }
      ],
      "digest": "sha256:68a456c8a41e4f52bfb7716a68efcb12b9c081ef34b97f7af459d333f9f7c3dd"
    }
  }
}
