      "instructions": "get_analysis_results returns the semantic analysis of a Pro or Advanced session: scores, levels, trends, finding counts and, for Advanced, Client Conversation Audit or Relationship Deep Dive counts. Refer to it as the user's Pro or Advanced analysis (source.tier), not as paid or extended results. Its trend fields are one whole-conversation direction label per section, which you may explain; they are not a period comparison, which stays unsupported. These are Le Confidant's own results: you may explain them, but do not extend them. Call get_conversation_snapshot for counts and timing and get_analysis_results for the semantic analysis, not both for every question. Public WhatsApp utilities and the clearly fictional demo require no account. They do not access WhatsApp or send messages. Use the demo only for synthetic examples, never for a user’s real conversation. get_conversation_snapshot returns whole-session numerical statistics from the explicitly connected WhatsApp export analysis; call it only to retrieve or explain those statistics. If source.fictional is true, identify the results as fictional review data, not a personal conversation. Comparing months, date windows, trends or changes over time is unsupported: call NO tool for such a request, including get_conversation_snapshot, explain that period comparison is unavailable, and never substitute whole-session totals for it. Explain definitions and sample sizes. Do not infer intentions or relationship diagnoses. No file upload, analysis initiation, payments or message sending is available. Disconnect only for an explicit request to revoke access.",
      "tools": [
        {
          "name": "demo_whatsapp_wrapped",
          "title": "Show a fictional WhatsApp Wrapped recap",
