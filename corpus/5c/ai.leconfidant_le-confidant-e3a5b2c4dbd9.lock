                              "clarityScore": {
                                "description": "Clarity score from 0 to 1",
                                "maximum": 1,
                                "minimum": 0,
                                "type": "number"
                              },
                              "findings": {
                                "$ref": "#/properties/sections/properties/sentiment/anyOf/0/properties/result/properties/findings"
                              },
                              "overallClarity": {
                                "description": "Overall clarity",
                                "enum": ["clear", "mostly_clear", "mixed", "unclear"],
                                "type": "string"
                              },
                              "participants": {
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "communicationStyle": {
                                      "description": "Communication style",
                                      "enum": ["clear", "vague", "mixed"],
                                      "type": "string"
                                    },
                                    "label": {
                                      "$ref": "#/properties/sections/properties/sentiment/anyOf/0/properties/result/properties/participants/items/properties/label"
                                    }
                                  },
                                  "required": ["communicationStyle", "label"],
                                  "type": "object"
                                },
                                "maxItems": 2,
                                "type": "array"
                              },
                              "trend": {
                                "description": "Overall trend direction",
                                "enum": ["improving", "stable", "declining"],
                                "type": "string"
                              }
                            },
                            "required": ["clarityScore", "findings", "overallClarity", "participants", "trend"],
                            "type": "object"
