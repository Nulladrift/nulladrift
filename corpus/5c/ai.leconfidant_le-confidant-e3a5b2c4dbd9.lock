        {
          "name": "get_analysis_results",
          "title": "Read the semantic analysis",
          "description": "Use only to retrieve or explain the semantic analysis of the user's explicitly authorized Pro or Advanced WhatsApp export analysis. Pro: sentiment, engagement, conflict, clarity and relationship health. Advanced, Client Conversation Audit: the same without relationship health, plus audit counts (commitments, questions, objections, risks, next-action priorities). Advanced, Relationship Deep Dive: all of Pro plus whole-conversation responsiveness numbers per participant and counts of phases, loops, conflict episodes, repairs, strengths and plan steps. Returns scores, levels, whole-conversation trends, per-participant labels and key-finding counts. Refer to it as the user's Pro or Advanced analysis (source.tier), not as paid or extended results. The scores and levels are Le Confidant's own results; explain them, do not extend them into diagnoses. For message counts and reply timing use get_conversation_snapshot instead. DO NOT call for date-window, month-to-month or period-comparison requests. Reads stored results only and never starts analysis; sections not finished on the website are listed as pending. Returns neutral A/B labels, never names, summaries, descriptions or excerpts. Free sessions get an error. Set locale to the user's supported language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "es", "pt-br", "de", "fr", "it"],
                "type": "string"
              }
            },
            "type": "object"
          },
