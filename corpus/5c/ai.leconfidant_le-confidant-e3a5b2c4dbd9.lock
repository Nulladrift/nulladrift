                    "type": "string"
                  },
                  "clientAudit": {
                    "type": "string"
                  },
                  "deepDive": {
                    "type": "string"
                  },
                  "findings": {
                    "type": "string"
                  },
                  "labels": {
                    "type": "string"
                  },
                  "scores": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  }
                },
                "required": ["assessment", "findings", "labels", "scores", "status"],
                "type": "object"
              },
              "expiresAt": {
                "format": "date-time",
                "type": "string"
              },
              "kind": {
                "const": "paid_results",
                "type": "string"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "es", "pt-br", "de", "fr", "it"],
                "type": "string"
              },
