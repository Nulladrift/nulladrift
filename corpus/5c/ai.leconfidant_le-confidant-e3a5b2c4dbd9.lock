        {
          "name": "format_whatsapp_text",
          "title": "Format text for WhatsApp",
          "description": "Convert the user's Markdown source to text ready to paste into WhatsApp. Before calling, copy the supplied source unchanged into text: do not Markdown-escape it or pre-convert it. Example: source **Meeting tomorrow** must be passed as **Meeting tomorrow**; the tool returns *Meeting tomorrow*. Preserve backslashes the user actually supplied, but never insert extra ones. After calling, display structuredContent.formattedText verbatim in a plain-text fenced code block, without escaping or reformatting it. Supports # headings, bold, italics, strikethrough, lists and links. Preserves URL destinations, literal text and fenced/inline code. Unsupported blocks remain literal; does not render HTML, summarize or translate. Inputs are processed by this server to return the result; this tool does not store or log phone numbers or text. It does not access an account or send messages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "es", "pt-br", "de", "fr", "it"],
                "type": "string"
              },
              "text": {
                "description": "The user's original Markdown source, up to 12,000 UTF-16 code units. Copy it unchanged: do not render it, pre-convert formatting, or add backslashes before Markdown punctuation. For **Meeting tomorrow**, pass exactly **Meeting tomorrow** as the decoded text value. Preserve backslashes only when present in the user's source; normal JSON string encoding must not change the decoded text.",
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "formattedText": {
                "description": "Finished WhatsApp text, ready to copy. Display this value verbatim in a plain-text fenced code block; do not add backslash escapes, change emphasis markers, or format it again. Choose a fence that does not conflict with code already in the returned text.",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "es", "pt-br", "de", "fr", "it"],
                "type": "string"
              },
              "messageSent": {
                "const": false,
                "type": "boolean"
              }
            },
            "required": ["formattedText", "messageSent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Format text for WhatsApp"
