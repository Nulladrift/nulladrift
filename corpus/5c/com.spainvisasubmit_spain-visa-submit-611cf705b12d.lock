          "digest": "sha256:9bb0c5d5974c8d2e348125c7c14e260c4661dd17ed3314ea1749d536b3a67b52"
        },
        {
          "name": "start_application",
          "title": "Link to start the application",
          "description": "Use when the user wants to start an application with Spain Visa Submit. Returns a link that opens the application form on spainvisasubmit.com prefilled with the visa type, number of applicants and fee choice, plus what happens next on the site. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "applicants": {
                "description": "Number of applicants, 1 to 6.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "fee": {
                "description": "paid: the government fee is already paid and the receipt is in the package. assistance: we pay it for the applicant.",
                "enum": ["paid", "assistance"],
                "type": "string"
              },
              "language": {
                "description": "Site language for links, for example \"en\", \"ru\" or \"es\". Defaults to \"en\".",
                "enum": ["en", "es", "ru", "uk", "fr", "de", "it", "pt", "pl", "ja", "zh", "ko", "fa"],
                "type": "string"
              },
              "procedure": {
                "description": "digital_nomad, entrepreneur, corporate_uge (PAC / EU Blue Card, researcher, ICT or audiovisual) or other.",
                "enum": ["digital_nomad", "entrepreneur", "corporate_uge", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
