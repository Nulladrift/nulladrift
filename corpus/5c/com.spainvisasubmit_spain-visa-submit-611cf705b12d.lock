{
  "lockfileVersion": 2,
  "subjects": {
    "com.spainvisasubmit/spain-visa-submit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spainvisasubmit.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "spain-visa-submit",
        "title": "Spain Visa Submit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spain Visa Submit (spainvisasubmit.com) is a technical filing service: it submits an already-prepared Spanish UGE-CE residence application and signs it as the applicant's representative, for people without their own Spanish digital certificate or Cl@ve. Use these tools to explain the service and its steps, check whether it fits, quote the price in EUR and give a link that opens the application form on the site. Documents are never accepted in chat: the person uploads them only through the private account on the site, using the links these tools return. Payment and signing the power of attorney also happen only on the site. The service gives no legal, immigration or tax advice and does not review documents, so do not present tool results as such advice. Use my_applications and application_status only when the user asks about their own application.",
      "tools": [
        {
          "name": "application_status",
          "title": "Application status",
          "description": "Use only when the signed-in user asks about the status of their own application. Returns the stage, what they still have to do with a link to that step on the site, the UGE registration number and filing date per applicant once filed, the last UGE status and when it was checked, and where to download the filing receipts. Never returns documents or payment details. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "reference": {
                "description": "Application reference such as #1017. Defaults to the most recently updated application.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["applications:read", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:98fd1482ac2fe5bddc31b3dd7df8a437a11a869bef871d78d9dec810eac43967"
        },
        {
          "name": "check_fit",
          "title": "Check whether the service fits",
          "description": "Use when the user wants to know whether Spain Visa Submit suits their situation. Needs three answers: is the application package complete and ready, does the applicant already have a working Spanish digital certificate or Cl@ve, and which procedure. Returns fits or does not fit with plain reasons. It gives no advice on documents, eligibility or visa strategy. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hasSpanishCertificate": {
                "description": "True if the applicant already has a working Spanish digital certificate or Cl@ve to file electronically.",
                "type": "boolean"
              },
              "language": {
                "description": "Site language for links, for example \"en\", \"ru\" or \"es\". Defaults to \"en\".",
                "enum": ["en", "es", "ru", "uk", "fr", "de", "it", "pt", "pl", "ja", "zh", "ko", "fa"],
                "type": "string"
              },
              "packageReady": {
                "description": "True if the application package is complete and ready to submit as it is.",
                "type": "boolean"
              },
              "procedure": {
                "description": "digital_nomad, entrepreneur, corporate_uge (PAC / EU Blue Card, researcher, ICT or audiovisual), other (another UGE-CE procedure) or not_sure.",
                "enum": ["digital_nomad", "entrepreneur", "corporate_uge", "other", "not_sure"],
                "type": "string"
              }
            },
            "required": ["hasSpanishCertificate", "packageReady", "procedure"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:90172921eef16dba8e3e2b9df03bab9aeac5e3cb8e389c85a2c13853b1b688e8"
        },
        {
          "name": "get_quote",
          "title": "Price quote in EUR",
          "description": "Use when the user asks how much filing costs for a number of applicants, with or without us paying the government fee Modelo 790-038 for them. Returns the EUR breakdown from the current checkout pricing. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "applicants": {
                "description": "Number of applicants, 1 to 6. Each family member is a separate applicant.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "fee": {
                "description": "assistance: we pay the government fee 790-038 for every applicant and it is added at cost. paid or self: the applicant already paid it or pays it, nothing is added.",
                "enum": ["assistance", "paid", "self"],
                "type": "string"
              }
            },
            "required": ["applicants", "fee"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d2d64e4ce057fd7f864da10407c826ba8a3a9a77a68a4699b603b8020d781c1f"
        },
        {
          "name": "my_applications",
          "title": "My applications",
          "description": "Use only when the signed-in user asks about their own Spain Visa Submit applications. Lists the account's applications with reference (for example #1017), visa type, number of applicants, current stage and start date. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
