              }
            ]
          },
          "digest": "sha256:9c847097006d6f7ae93531faaacedce5b102b5a0b77ea261f4d654039e670c22"
        },
        {
          "name": "service_overview",
          "title": "Spain Visa Submit: service and process",
          "description": "Use when the user asks what Spain Visa Submit does, how filing a Spanish UGE-CE residence application (digital nomad, entrepreneur, highly qualified professional, intra-company transfer) works without their own digital certificate, what they receive, how long it takes or what it costs. Returns the scope, what is not included, the steps on the site, timing, price summary and links. It never accepts or reads documents. Uploads, payment and the power of attorney happen only on spainvisasubmit.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Site language for links, for example \"en\", \"ru\" or \"es\". Defaults to \"en\".",
                "enum": ["en", "es", "ru", "uk", "fr", "de", "it", "pt", "pl", "ja", "zh", "ko", "fa"],
                "type": "string"
              }
            },
            "type": "object"
          },
