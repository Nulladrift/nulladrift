{
  "lockfileVersion": 2,
  "subjects": {
    "com.satmarin/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://satmarin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "satmarin-catalog",
        "version": "0.7"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_compatibility",
          "title": "Check compatibility",
          "description": "Does a part fit a given antenna model? Give sku or product_id, plus antenna_model. Answers from catalog fitment data only: true or false when the part has model-level fitment data, \"unknown\" when it has none or is fitted only at series level. An unrecognised model, or a brand or series name, returns an error instead of an answer.",
          "inputSchema": {
            "properties": {
              "antenna_model": {
                "description": "One antenna model, name or slug, e.g. v100NX or v60E. Case and spacing are ignored.",
                "type": "string"
              },
              "product_id": {
                "description": "Catalog product id. Give this or sku.",
                "type": "integer"
              },
              "sku": {
                "description": "Part number. Give this or product_id.",
                "type": "string"
              }
            },
            "required": ["antenna_model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "antenna_model": {
                "description": "The resolved model slug.",
                "type": "string"
              },
              "basis": {
                "enum": ["model_subcategory", "no_fitment_data", "series_level_fitment"],
                "type": "string"
              },
              "compatible": {
                "enum": [true, false, "unknown"]
              },
              "sku": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["antenna_model", "basis", "compatible", "sku", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:334a7639b80151f5d14abdb78559ff8fe67bb6972a57444403453ccef53fc012"
        },
        {
          "name": "get_quote",
          "title": "Request a quotation",
          "description": "Request a formal quotation for catalog parts. Creates a quote request and returns its reference; Satmarin replies within one working day. This call emails nothing to the requester.",
          "inputSchema": {
            "properties": {
              "contact": {
                "properties": {
                  "billing_address": {
                    "description": "Optional postal billing address, used only if a proforma invoice is later issued. Free text, newline separated, at most 6 lines and 300 characters. Markup is removed. The country comes from contact.country, not from this field.",
                    "type": ["string", "null"]
                  },
                  "company": {
                    "type": "string"
                  },
                  "country": {
                    "description": "Optional ISO 3166-1 alpha-2 country code of the customer, e.g. BE. Case-insensitive. Used for shipping and VAT treatment on the quotation.",
                    "type": ["string", "null"]
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": ["string", "null"]
                  },
                  "vat": {
                    "description": "Optional VAT or tax registration number, e.g. BE0479944518. Letters and digits only, up to 32 characters; spaces, dots and dashes are removed. Not validated against any tax register.",
                    "type": ["string", "null"]
                  },
                  "vessel": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["company", "email", "name"],
                "type": "object"
              },
              "items": {
                "description": "1 to 20 lines. Every part number must be a live, quotable catalog product.",
                "items": {
                  "properties": {
                    "qty": {
                      "description": "Whole number, 1 or more.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Catalog part number.",
                      "type": "string"
                    }
                  },
                  "required": ["qty", "sku"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Optional free text, up to 1000 characters.",
                "type": "string"
              }
            },
            "required": ["contact", "items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "enum": ["received"],
                "type": "string"
              }
            },
            "required": ["message", "reference", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1d38a163bae7f52ee27e01bb1da2a5d5f6f0fbf883c3dc7aa5fa3a39701e9f1b"
        },
        {
          "name": "resolve_supersession",
          "title": "Resolve supersession",
          "description": "Is a part discontinued, and what replaces it? Give sku or product_id. Follows the replacement chain to the latest live product: successors lists the live replacements, supersedes lists the parts this one replaced.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "Catalog product id. Give this or sku.",
                "type": "integer"
              },
              "sku": {
                "description": "Part number. Give this or product_id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "eol": {
                "type": "boolean"
              },
              "no_replacement": {
                "type": "boolean"
              },
              "sku": {
                "type": ["string", "null"]
              },
              "successors": {
                "items": {
                  "properties": {
                    "sku": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["sku", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "supersedes": {
                "items": {
                  "properties": {
                    "sku": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["sku", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["eol", "no_replacement", "sku", "successors", "supersedes"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e121596e1c4d6598a4a14a0ca57f3c015e585a14953796eab7915922dd92b1dd"
        },
        {
          "name": "search_parts",
          "title": "Search parts",
          "description": "Search the Satmarin catalog by part number, model or free text. Order: exact SKU (case and separators ignored), SKU prefix, then words found in the title or description in any order. A word that names an antenna model, such as v100NX, also matches parts fitted to that model. Use the model filter to restrict results to one model or series.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Exact brand slug, e.g. intellian.",
                "type": "string"
              },
              "limit": {
                "description": "Default 10, maximum 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Antenna model or series, name or slug, e.g. v100NX or v-Series. Case and spacing are ignored; an unrecognised model returns an error.",
                "type": "string"
              },
              "part_type": {
                "description": "Part type slug.",
                "type": "string"
              },
              "query": {
                "description": "Part number, model or free text.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "match": {
                "enum": ["exact_sku", "prefix", "text"],
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "brand": {
                      "type": ["string", "null"]
                    },
                    "compatible_models": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "eol": {
                      "type": "boolean"
                    },
                    "part_type": {
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "The price in the currency this product is priced in, ex works, VAT excluded. No conversion is applied and there is no single catalogue currency: read `currency` on every row. null when the part is discontinued, is priced on request, or has no list price.",
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "basis": {
                          "enum": ["EXW"],
                          "type": "string"
                        },
                        "currency": {
                          "enum": ["EUR", "USD"],
                          "type": "string"
                        }
                      },
                      "required": ["amount", "basis", "currency"],
                      "type": ["object", "null"]
                    },
                    "price_on_request": {
                      "description": "true when the catalogue quotes this product rather than listing a price, so `price` is null but the product is quotable. Discontinued products are not this.",
                      "type": "boolean"
                    },
                    "product_id": {
                      "type": "integer"
                    },
                    "sku": {
                      "type": ["string", "null"]
                    },
                    "superseded_by": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "compatible_models", "eol", "part_type", "price", "price_on_request", "product_id", "sku", "superseded_by", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["match", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a81c7790dbe2e588cbcd727e60c50527e55dd52f6ac88e5d01616bf117d04de"
        }
      ],
      "digest": "sha256:1526c9551e2066187b4f88420b34d823fcb3abb4dcfca61f7342f56d752ac095"
    }
  }
}
