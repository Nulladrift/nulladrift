{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/sec-intel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://filings.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "sec-intel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "company_watch",
          "description": "Given a company CIK, return recent filings, insider activity, and a filing-velocity stat (last-90 vs prior-90 days). Live-backfilled from EDGAR so it works day one.",
          "inputSchema": {
            "properties": {
              "cik": {
                "type": "string"
              }
            },
            "required": ["cik"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5419fed883452a40fde062a6b95a500f5cca84b3ab5d1a30fa2f9c32da806968"
        },
        {
          "name": "filing_digest",
          "description": "Digest for a filter over the last N days: material 8-K events, insider (Form 4) activity, new registrations, and periodic reports. Best summary signal for a desk.",
          "inputSchema": {
            "properties": {
              "cik": {
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "days": {
                "description": "Lookback days (default 7).",
                "type": "number"
              },
              "form": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "item": {
                "type": "string"
              },
              "minEventScore": {
                "type": "number"
              },
              "ticker": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12bd43a98405115283a8cfdcea1b2cab36b2e82d31b8b512522bbcb90b7a8922"
        },
        {
          "name": "insider_activity",
          "description": "Recent Form 4/3/5 insider transactions with insider-cluster detection (multiple insiders filing on the same issuer). Optionally filter by ticker/CIK.",
          "inputSchema": {
            "properties": {
              "cik": {
                "type": "string"
              },
              "days": {
                "type": "number"
              },
              "ticker": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a11b5101761a369ea9dea07b672ad84480e0a85c7ed4ad4fc33b5ea1301a2dd"
        },
        {
          "name": "search_filings",
          "description": "Direct live search of SEC EDGAR full-text for the latest filings of a form type in a date range. Use for ad-hoc lookups.",
          "inputSchema": {
            "properties": {
              "end": {
                "type": "string"
              },
              "form": {
                "description": "Form type, e.g. '8-K'.",
                "type": "string"
              },
              "limit": {
                "description": "Default 50, max 100.",
                "type": "number"
              },
              "q": {
                "description": "Optional full-text query.",
                "type": "string"
              },
              "start": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b7f76b473e5f7f3267552bb382f017206bda7f27cd84022a33198dc605d93be"
        },
        {
          "name": "whats_new_since",
          "description": "Return SEC filings that are NEW since a cursor token (your bookmark). Pass the cursor from a prior call to get only filings since then. Filter by form type, ticker, CIK, 8-K item code, and minimum event severity. This is the fresh-filing delta feed's core lock-in primitive. Monitoring/research over public EDGAR data — not investment advice.",
          "inputSchema": {
            "properties": {
              "cik": {
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from a previous response; omit for first call.",
                "type": "string"
              },
              "form": {
                "description": "Form types, e.g. ['8-K','4'].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "item": {
                "description": "8-K item code, e.g. '5.02'.",
                "type": "string"
              },
              "limit": {
                "description": "Max filings to return (default 100).",
                "type": "number"
              },
              "minEventScore": {
                "description": "Severity floor 1-10 (material events only).",
                "type": "number"
              },
              "ticker": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00d6f22b30c932e67b47075d207fd788c805509767da81f360f6f43b6488e368"
        }
      ],
      "digest": "sha256:ab13a07bec5d96c82d443c9cc35b3266465342f9a893a279e6c7365cf6230e06"
    }
  }
}
