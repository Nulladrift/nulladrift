{
  "lockfileVersion": 2,
  "subjects": {
    "com.kasahorow/kasahorow": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nabanya.kasahorow.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kasahorow",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "lookup_word",
          "description": "Look up a word in the kasahorow dictionary (WOAKA). fl = your language, tl = the language of the word. Returns definitions with parts of speech.",
          "inputSchema": {
            "properties": {
              "fl": {
                "description": "Your language, ISO code (e.g. 'en').",
                "type": "string"
              },
              "tl": {
                "description": "The word's language, ISO code (e.g. 'ak', 'sw').",
                "type": "string"
              },
              "word": {
                "description": "The word or short phrase to look up.",
                "type": "string"
              }
            },
            "required": ["fl", "tl", "word"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a26d48b5c486ea01f2151d27e145abe2dc751a68dfebccb2b92993c27846fdab"
        },
        {
          "name": "validate_translation",
          "description": "Validate a translation with nabanya, the Connection Validator: it confirms your words transmit their feelings in the reader's language. It never rewrites your words. This is a PAID reading (N1 $15, N2 $10, N3 $5, N4 $3): the reply gives you the payment link and your report link. When the payment clears, the reading is prepared and sent to your report link and email.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Which reading. N1 ($15) validates a finished pair and needs a translation. N4 ($3) validates ONE word: put the word in `source` and leave `translation` empty. Defaults to N1.",
                "enum": ["N1", "N2", "N3", "N4"],
                "type": "string"
              },
              "reader": {
                "description": "The reader's language, ISO code (e.g. 'sw').",
                "type": "string"
              },
              "source": {
                "description": "Your original writing. For N4, the single word instead.",
                "type": "string"
              },
              "translation": {
                "description": "The translation to validate. N1 only.",
                "type": "string"
              },
              "writer": {
                "description": "The writer's language, ISO code (e.g. 'en').",
                "type": "string"
              }
            },
            "required": ["reader", "source", "writer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:900c8e0f2d6bcd0bd07c7d630285e15a0e1394e854cc420d8929c0207e521f93"
        }
      ],
      "digest": "sha256:595838b0ff088b68515c37bd4fb6c916ec9a8b70da3a98ba444be2f8aaffa182"
    }
  }
}
