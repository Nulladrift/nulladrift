          },
          "digest": "sha256:41649eb5696f1bae300ca06d28d53bce1a291cc64afdcc8de18affa51e523958"
        },
        {
          "name": "list_paid_products",
          "description": "List all InstaVeil x402 products with current prices, resource URLs, input schemas and examples.",
          "inputSchema": {
