{
  "lockfileVersion": 2,
  "subjects": {
    "com.instaveil/agent-commerce": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://instaveil.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "instaveil-agent-commerce",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Discover InstaVeil pay-per-call x402 APIs for structured public Instagram data. Free discovery never charges. To buy directly using only MCP, call execute_paid_product without payment_signature for an unpaid HTTP 402 quote. A buyer-controlled x402 Solana USDC wallet must independently authorize and sign the exact quote before retrying execute_paid_product with payment_signature and identical inputs. InstaVeil never stores buyer private keys or signs payments.",
      "tools": [
        {
          "name": "build_purchase_request",
          "description": "Build a ready-to-send InstaVeil x402 POST request for one paid product so an autonomous agent can purchase with minimal integration work.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {
                "product_id": "profile-snapshot",
                "username": "instagram"
              },
              {
                "product_id": "creator-compare",
                "usernames": ["instagram", "natgeo"]
              }
            ],
            "properties": {
              "language": {
                "description": "Requested answer language for Veil Lens",
                "type": "string"
              },
              "product_id": {
                "description": "InstaVeil x402 product identifier",
                "enum": ["profile-snapshot", "story-snapshot", "profile-intelligence", "creator-compare", "veil-lens"],
                "type": "string"
              },
              "question": {
                "description": "Research question for Veil Lens",
                "maxLength": 600,
                "minLength": 5,
                "type": "string"
              },
              "username": {
                "description": "One public Instagram username without @",
                "pattern": "^[A-Za-z0-9._]{1,30}$",
                "type": "string"
              },
              "usernames": {
                "description": "One to three public Instagram usernames without @",
                "items": {
                  "pattern": "^[A-Za-z0-9._]{1,30}$",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:291bb8fb855f41c5d408da00e6e7afb15830f48d968782300758c32904bd14de"
        },
        {
          "name": "execute_paid_product",
          "description": "Execute a real x402-protected InstaVeil Instagram data API via MCP. First call without payment returns a free x402 V2 PaymentRequired structuredContent quote (isError=true). After a buyer wallet authorizes the exact Solana USDC payment, retry tools/call with the same arguments and params._meta['x402/payment'] containing its signed PaymentPayload (or payment_signature for clients without x402-over-MCP support). Verified data and payment settlement receipt follow as structuredContent and _meta['x402/payment-response']. No keys, automatic charges or simulated sales.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {
                "product_id": "profile-snapshot",
                "username": "natgeo"
              },
              {
                "product_id": "creator-compare",
                "usernames": ["instagram", "natgeo"]
              }
            ],
            "properties": {
              "language": {
                "maxLength": 64,
                "type": "string"
              },
              "payment_signature": {
                "description": "Optional x402 V2 PAYMENT-SIGNATURE supplied by buyer's authorized Solana USDC wallet; omit to obtain a free 402 quote.",
                "maxLength": 16384,
                "type": "string"
              },
              "product_id": {
                "enum": ["profile-snapshot", "story-snapshot", "profile-intelligence", "creator-compare", "veil-lens"],
                "type": "string"
              },
              "question": {
                "maxLength": 600,
                "minLength": 5,
                "type": "string"
              },
              "username": {
                "pattern": "^[A-Za-z0-9._]{1,30}$",
                "type": "string"
              },
              "usernames": {
                "items": {
                  "pattern": "^[A-Za-z0-9._]{1,30}$",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:933b05ea2ee264c4fbe64baeeb4cc90ccb2cac1557efbbd321f60336529f4be1"
        },
        {
          "name": "get_discovery_urls",
          "description": "Return canonical machine-readable URLs for InstaVeil x402, OpenAPI, llms.txt and human fallback.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {}
            ],
            "properties": {},
            "type": "object"
          },
