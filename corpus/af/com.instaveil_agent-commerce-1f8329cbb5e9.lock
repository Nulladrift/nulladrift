          "digest": "sha256:8d1fb125fe76a12b77d66ec19a2e41a3c1af83de5853988d13b0c6723d9d4724"
        },
        {
          "name": "recommend_paid_product",
          "description": "Recommend the lowest-friction InstaVeil paid x402 product for an agent task, with exact price and resource URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {
                "task": "Compare two public Instagram creators for a campaign"
              }
            ],
            "properties": {
              "task": {
                "description": "What the agent needs to accomplish",
                "maxLength": 600,
                "minLength": 3,
                "type": "string"
              }
            },
