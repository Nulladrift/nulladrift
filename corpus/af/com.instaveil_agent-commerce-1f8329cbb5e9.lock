          },
          "digest": "sha256:0c9be14c15959486061d29ee41712c09db54ada5f1ff5c05266b1d54b323e43d"
        },
        {
          "name": "get_product",
          "description": "Get one InstaVeil x402 product in decision-ready form before an agent spends USDC.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {
                "product_id": "profile-snapshot"
              }
            ],
            "properties": {
              "product_id": {
                "description": "InstaVeil x402 product identifier",
                "enum": ["profile-snapshot", "story-snapshot", "profile-intelligence", "creator-compare", "veil-lens"],
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
