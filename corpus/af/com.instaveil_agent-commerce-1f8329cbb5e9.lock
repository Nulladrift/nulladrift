            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ac4d86243d5788bb4e3416c1049659746bbece3d1f1bc50b60f7680ccd2413b"
        },
        {
          "name": "get_purchase_instructions",
          "description": "Return exact machine purchase steps for one InstaVeil product using x402 V2 and Solana USDC.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "examples": [
              {
                "product_id": "story-snapshot"
