          "title": "List upcoming match tips",
          "description": "Returns upcoming informational match tips (pick, confidence, kickoff, page URL) for football or cricket, and renders them as cards in chat. Read-only. Does not place bets, open sportsbooks, show ads, or return affiliate links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
