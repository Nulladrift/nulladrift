          "name": "get_match_tip",
          "title": "Get one match tip",
          "description": "Returns one informational tip by match slug, including a short analysis when ready. Read-only. No wagering, ads, or affiliate links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Match slug, e.g. arsenal-vs-chelsea-2026-10-12.",
                "minLength": 1,
                "type": "string"
              },
              "sport": {
                "description": "Sport. Use soccer or football for association football.",
                "enum": ["soccer", "football", "cricket"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get one match tip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
