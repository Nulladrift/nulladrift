{
  "lockfileVersion": 2,
  "subjects": {
    "app.signsimple/signsimple": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signsimple.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "signsimple",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SignSimple is a free, unlimited e-signature service. Use send_for_signature to email a PDF to recipients for legally binding electronic signature, get_document_status to track progress, list_documents for recent sends, and list_templates for free ready-to-send legal templates. Account tools need an API key header (create one at https://signsimple.app/profile).",
      "tools": [
        {
          "name": "get_document_status",
          "description": "Check the status of a document previously sent for signature: overall state (sent/completed/declined/expired/voided), per-recipient progress (pending/viewed/signed), and the signed PDF download URL once complete. Requires a SignSimple API key.",
          "inputSchema": {
            "properties": {
              "envelope_id": {
                "description": "The envelopeId returned by send_for_signature",
                "type": "string"
              }
            },
            "required": ["envelope_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9629ea76c7a380762298745a16a2cf4b9636ceecf8bd6a809eef4041f34d0fca"
        },
        {
          "name": "list_documents",
          "description": "List the 25 most recent documents sent from the connected SignSimple account, with status and signed-PDF URLs where complete. Requires a SignSimple API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc0b269d59cad65f2c8ee0904233ee6599881da6c1e244b88007d21e012c8bd4"
        },
        {
          "name": "list_templates",
          "description": "List SignSimple's free, professionally drafted document templates (NDA, lease, contractor agreement, liability waiver, bill of sale, promissory note). Returns each template's info page and direct PDF URL — pass the PDF URL to send_for_signature as document_url to send one. No API key needed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86fa2263c165fb73673dd24835e0e2832213a0445acd84ce6f084621ddac535c"
        },
        {
          "name": "send_for_signature",
          "description": "Send a PDF document for legally binding electronic signature via SignSimple (free, unlimited). Provide the PDF as a fetchable URL or base64, plus recipient name(s) and email(s). Each recipient is emailed a secure signing link; signature and date fields are placed automatically unless custom fields are given. Works with the free templates from list_templates (pass their pdf URL as document_url). Requires a SignSimple API key (create one at https://signsimple.app/profile).",
          "inputSchema": {
            "properties": {
              "document_base64": {
                "description": "Base64-encoded PDF (alternative to document_url)",
                "type": "string"
              },
              "document_name": {
                "description": "Display name for the document, e.g. \"Consulting Agreement.pdf\"",
                "type": "string"
              },
              "document_url": {
                "description": "Publicly fetchable URL of the PDF to send",
                "type": "string"
              },
              "expires_in_days": {
                "description": "Days until the signing links expire (optional, default 30)",
                "type": "number"
              },
              "message": {
                "description": "Message included in the signing email (optional)",
                "type": "string"
              },
              "recipients": {
                "description": "People who must sign, in order",
                "items": {
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["email", "name"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "subject": {
                "description": "Email subject line (optional)",
                "type": "string"
              }
            },
            "required": ["document_name", "recipients"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da59bb1c1978a455504f795a79dee80e785bfcdb24f0a2393f922616b0fb4ef4"
        }
      ],
      "digest": "sha256:8cb641038aee46d0a8f7a670093b6d1b1d3433fc3baee6f9df20564e8ccce9cb"
    }
  }
}
