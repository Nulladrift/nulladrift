        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to AI Trainer Pay (two steps; not a purchase)",
          "description": "Submits an enquiry to AI Trainer Pay: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the AI Trainer Pay team sees it. Consent means the person has read and agreed to: \"Fine for the people behind AI Trainer Pay to email me about AI training rates.\"",
          "inputSchema": {
