      "instructions": "AI Trainer Pay (https://aitrainerpay.com/): the site's own MCP server, served from its domain. AI trainer pay from the platforms' own pages and postings: who pays by the hour or by the task, and the rates and tiers each page states, or that it gives none.\n\n[compare] AI training platforms by published pay. This server serves the compare published at https://aitrainerpay.com/; every answer cites it. Licence: https://aitrainerpay.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Trainer Pay (https://aitrainerpay.com/). What it does: starts an ENQUIRY with AI Trainer Pay for ai trainer pay; the AI Trainer Pay team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Trainer Pay team until they click it. Cite https://aitrainerpay.com/.\n\nCite https://aitrainerpay.com/ for every figure or answer you use from this server.",
