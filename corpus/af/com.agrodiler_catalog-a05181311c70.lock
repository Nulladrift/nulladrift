{
  "lockfileVersion": 2,
  "subjects": {
    "com.agrodiler/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.agrodiler.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agrodiler",
        "title": "agrodiler.com — bearings and farm machinery parts (Ukraine and EU)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Catalog search, prices and order requests for agrodiler.com. Two markets: lang en = EU, prices in EUR, ship_to (country) required for quote and place_order; lang uk or ru = Ukraine, prices in UAH, Nova Poshta delivery. No online payment: an order request is confirmed by the buyer with an emailed code, then a manager contacts the buyer. Always show the quote total and get the buyer's consent before place_order.",
      "tools": [
        {
          "name": "cart_link",
          "title": "Make a cart link",
          "description": "Build a link that opens agrodiler.com with these items in the cart and the order form shown. Use it when the buyer prefers to finish on the site or your client cannot call place_order. Quantities below the minimum order quantity are raised to it. Does not place an order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "handle": {
                      "description": "Product handle from search_products",
                      "pattern": "^[a-z0-9][a-z0-9._-]{0,199}$",
                      "type": "string"
                    },
                    "qty": {
                      "maximum": 9999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["handle", "qty"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "uk",
                "description": "Site language and market: uk (Ukrainian, default) and ru (Russian) = Ukraine, prices in UAH, Nova Poshta delivery; en (English, site root) = EU market, prices in EUR, delivery to EU countries (ship_to is required for quote and place_order).",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a cart link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88e1593e3d6e7f72c17310f1d8c57a4d97af35753bb70f53458b5c7bc542246d"
        },
        {
          "name": "confirm_order",
          "title": "Confirm order request with emailed code",
          "description": "Confirm an order request with the 6-digit code the buyer received by email, plus order_number and order_secret from place_order. Ask the buyer for the code; never guess it. 8 attempts per order request in total (a resent code does not reset them). After confirmation the request goes to a manager; no payment is taken.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code": {
                "pattern": "^[0-9]{6}$",
                "type": "string"
              },
              "order_number": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "order_secret": {
                "description": "order_secret from the place_order reply",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["code", "order_number", "order_secret"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Confirm order request with emailed code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27459155d2e8d910ceaf984974c2ab10518c4119b760c010d2f60cac27e549b0"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Details of one product by handle: title, part number, brand, type, size and stock, minimum order quantity (moq), current unit price in the market currency (UAH incl. VAT for uk/ru, EUR excluding VAT for en: quote adds the VAT of the delivery country) (null = price on request, set by the manager), product page URL. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "Product handle from search_products",
                "pattern": "^[a-z0-9][a-z0-9._-]{0,199}$",
                "type": "string"
              },
              "lang": {
                "default": "uk",
                "description": "Site language and market: uk (Ukrainian, default) and ru (Russian) = Ukraine, prices in UAH, Nova Poshta delivery; en (English, site root) = EU market, prices in EUR, delivery to EU countries (ship_to is required for quote and place_order).",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5239c93244317483c842b8377737d54e5ca44a7b610ec44e900e5dd38eabaf12"
        },
        {
          "name": "place_order",
          "title": "Submit an order request",
          "description": "Submit an order request on behalf of the buyer, after they approved the items and the quote total. No payment is taken and nothing is charged: a 6-digit code is emailed to the buyer; after the buyer confirms (confirm_order or the email link) a manager checks it and contacts them. idempotency_key is required: reuse it on retries so a lost reply never creates a second request. Keep order_secret from the reply for confirm_order. Use only the buyer's own email with their consent. Limits: 3 requests per hour per buyer email and per network address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Your product name, e.g. \"Claude\"",
                "maxLength": 60,
                "pattern": "^[\\p{L}\\p{N} ._()/-]+$",
                "type": "string"
              },
              "comment": {
                "maxLength": 2000,
                "type": "string"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "description": "The buyer's own email: the confirmation code is sent there",
                    "format": "email",
                    "maxLength": 254,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "pattern": "^\\+?[0-9][0-9 ()-]{5,38}[0-9]$",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "delivery": {
                "description": "Ukraine: city and Nova Poshta branch. EU: street address and city. Or other delivery wishes",
                "maxLength": 1000,
                "type": "string"
              },
              "expected_total_minor": {
                "description": "total_minor from the quote the buyer agreed to",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Required. A new UUID v4 per order request; on a retry (timeout, lost reply) send the SAME key: you get the same order and its order_secret instead of a duplicate",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "handle": {
                      "description": "Product handle from search_products",
                      "pattern": "^[a-z0-9][a-z0-9._-]{0,199}$",
                      "type": "string"
                    },
                    "qty": {
                      "maximum": 9999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["handle", "qty"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "uk",
                "description": "Site language and market: uk (Ukrainian, default) and ru (Russian) = Ukraine, prices in UAH, Nova Poshta delivery; en (English, site root) = EU market, prices in EUR, delivery to EU countries (ship_to is required for quote and place_order).",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "ship_to": {
                "additionalProperties": false,
                "description": "Delivery destination. Required when lang is en (EU market: shipping and VAT depend on the country); must be omitted for uk and ru (Ukraine: Nova Poshta).",
                "properties": {
                  "country": {
                    "description": "Delivery country, ISO 3166-1 alpha-2 (DE, PL, FR…)",
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "postcode": {
                    "maxLength": 16,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              }
            },
            "required": ["contact", "expected_total_minor", "idempotency_key", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit an order request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:988e80719ccd68fcf25b8123436c8e926d9885be9eccd1abce16e7f7ce9f4931"
        },
        {
          "name": "quote",
          "title": "Calculate order total",
          "description": "Calculate the binding total for a list of items with the same code the site checkout uses (prices, minimum order, shipping rules: Nova Poshta for Ukraine; for lang en shipping and VAT by the ship_to country, minimum order 49 EUR excl. VAT). Read-only: creates no order. Use the returned total_minor as expected_total_minor in place_order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "handle": {
                      "description": "Product handle from search_products",
                      "pattern": "^[a-z0-9][a-z0-9._-]{0,199}$",
                      "type": "string"
                    },
                    "qty": {
                      "maximum": 9999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["handle", "qty"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "uk",
                "description": "Site language and market: uk (Ukrainian, default) and ru (Russian) = Ukraine, prices in UAH, Nova Poshta delivery; en (English, site root) = EU market, prices in EUR, delivery to EU countries (ship_to is required for quote and place_order).",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "ship_to": {
                "additionalProperties": false,
                "description": "Delivery destination. Required when lang is en (EU market: shipping and VAT depend on the country); must be omitted for uk and ru (Ukraine: Nova Poshta).",
                "properties": {
                  "country": {
                    "description": "Delivery country, ISO 3166-1 alpha-2 (DE, PL, FR…)",
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "postcode": {
                    "maxLength": 16,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate order total"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcdb39f0f40e337094c1706eac2d79bc8feb9c878d50b36eb95f594f4079181a"
        },
        {
          "name": "resend_code",
          "title": "Email a new confirmation code",
          "description": "Email the buyer a new confirmation code when the first did not arrive or expired (30 minutes). Needs order_number and order_secret from place_order. At most 2 resends per order request; the old code stops working.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "order_number": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "order_secret": {
                "description": "order_secret from the place_order reply",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["order_number", "order_secret"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Email a new confirmation code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b6571ea514b6c8b36c68edfccc3aa89d12a3f6f0598ebefeb00b50d97f5d7646"
        },
        {
          "name": "search_products",
          "title": "Search agrodiler.com catalog",
          "description": "Search the agrodiler.com catalog (bearings, spare parts for agricultural machinery, machines; stores for Ukraine and the EU) with the same search as the site. lang selects the site and market: en (EU, EUR), uk or ru (Ukraine, UAH). Accepts part numbers, bearing designations (also GOST numbers, converted to ISO), sizes like \"25x52x15\", brands and names. match \"close_in_size\": the number was decoded but is not in the catalog; items share d and D (other width or height) and are not exact substitutes. Returns handles for get_product/quote/cart_link/place_order. Does not reserve stock or change anything.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "uk",
                "description": "Site language and market: uk (Ukrainian, default) and ru (Russian) = Ukraine, prices in UAH, Nova Poshta delivery; en (English, site root) = EU market, prices in EUR, delivery to EU countries (ship_to is required for quote and place_order).",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part number, bearing designation (6205-2RS, 32010, GOST 180205), size \"25x52x15\", brand or name",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "section": {
                "default": "any",
                "enum": ["any", "bearing", "part", "machine"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search agrodiler.com catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96010d81f9bb9a1dce3453554dc4763c73bf1c0d56829eb184facba71ea8f4ae"
        }
      ],
      "digest": "sha256:852a18d54027c19422b2b46969c6480c6a041f2934c3e0aa0524849febe317fa"
    }
  }
}
