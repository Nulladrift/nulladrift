{
  "lockfileVersion": 2,
  "subjects": {
    "com.promptafire.marketing/promptafire": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://marketing.promptafire.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "promptafire",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Promptafire teaches marketers prompt engineering and AI workflows. Free modules are readable by anyone. Pro modules need a connected Promptafire account with Pro access; read_lesson explains how when it is locked. Nothing here writes to a member's account.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Promptafire document",
          "description": "Return the full Markdown of one search result by id. Free lessons and blog posts always; Pro lessons only when the connected Promptafire account has Pro access, otherwise a short locked notice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "An id returned by search",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:872e8e8ff9395d9fa077db9d3c93089dc95dd9ad2bb85f122228b553ded7ed37"
        },
        {
          "name": "get_module",
          "title": "Get a module",
          "description": "A module's description, duration, access level, and section list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Module slug, for example think-before-you-prompt",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13302e2a5cef94ae572661df624b7621cbb4082bacbae5959649242f5b3fea6b"
        },
        {
          "name": "list_modules",
          "title": "List modules",
          "description": "The full curriculum: every track and module with its access level and a link to its overview.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a486aa672c59a6c38e1f42b28cb25a1ee8b4ad0c4017252433ad09537b1edd0"
        },
        {
          "name": "list_posts",
          "title": "List blog posts",
          "description": "Every published Promptafire blog post with date, author, and a link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bb19ab7f74c77335f762420aedeff2f4217add29040106deb11c6a63715b94d"
        },
        {
          "name": "read_lesson",
          "title": "Read a lesson",
          "description": "The Markdown body of one lesson section. Free modules always. Pro modules only when the connected Promptafire account has Pro access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "module": {
                "description": "Module slug",
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "Section slug from get_module",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["module", "section"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aac80fc756b5d2a0b37104f13958f6f65f7850564fd324592b9f0e4c2b5a7d0c"
        },
        {
          "name": "read_post",
          "title": "Read a blog post",
          "description": "The Markdown body of one blog post.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Post slug from list_posts",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cc3fc75308ba997517f5783a7fc233299deb0eb8d39048238db3f7993b248b5"
        },
        {
          "name": "search",
          "title": "Search Promptafire",
          "description": "Search Promptafire lessons and blog posts. Returns ids for fetch, titles, and web URLs. Lesson ids look like lesson:<module>/<section>, post ids like post:<slug>.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What to look for",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e08b722e73c45466a03a3f42e8c416f546c2cb19f096bdf485df5886f4f66e28"
        },
        {
          "name": "search_curriculum",
          "title": "Search the curriculum",
          "description": "Full-text search across Promptafire lessons. Returns module, section, whether it is free or Pro, a short snippet when readable, and the web URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What to look for",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d540e4c423d3062c207438c96cd3a64afcc4beebbd1ba4b1b0e0b988a2c9466"
        }
      ],
      "digest": "sha256:da14082bef594f656c669b86f9eec028b246ef8550ad13c178fb15bc380d1523"
    }
  }
}
