        {
          "name": "search_guidance",
          "title": "Search curated guidance",
          "description": "List curated guidance records that match a target coding agent, model family, scope and topic. Returns official model guidance, platform documentation and Agent Skills standard records with labels, applicability and the date each source was verified. PromptingCraft.com methodology records are returned only when kind is promptingcraft_methodology and are never official provider guidance. Inputs are fixed categories only. Use get_guidance for the full record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Record kind. Omit for official guidance, platform documentation and standards.",
                "enum": ["model_guidance", "platform_documentation", "agent_skills_standard", "promptingcraft_methodology"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model_family": {
                "default": "any",
                "description": "Model family the target agent will run, if known. Use other for a family without curated guidance.",
                "enum": ["openai", "anthropic", "deepseek", "kimi", "other", "any"],
                "type": "string"
              },
              "scope": {
                "default": "any",
                "description": "general: broad provider technique; model_specific: applies only to a named model or interface.",
                "enum": ["general", "model_specific", "any"],
                "type": "string"
              },
              "target_agent": {
                "default": "any",
                "description": "Coding agent the prompt is for.",
                "enum": ["codex", "claude-code", "cursor", "chatgpt", "any"],
                "type": "string"
              },
              "topic": {
                "description": "Guidance topic.",
                "enum": ["context-and-structure", "instruction-hierarchy", "untrusted-content", "reasoning", "structured-output", "tool-use", "evaluation", "caching-and-cost", "scope-control", "long-context", "skills-and-plugins", "agent-workflows", "planning-and-modes", "model-selection", "discovery"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "type": ["string", "null"]
                  },
                  "limit": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "model_family": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  },
                  "target_agent": {
                    "type": "string"
                  },
                  "topic": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["kind", "limit", "model_family", "scope", "target_agent", "topic"],
                "type": "object"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "provenance": {
                "additionalProperties": false,
                "properties": {
                  "curated_on": {
                    "type": ["string", "null"]
                  },
                  "freshness_note": {
                    "type": "string"
                  },
                  "label_definitions": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "ledger_commit": {
                    "type": ["string", "null"]
                  },
                  "ledger_url": {
                    "type": "string"
                  },
                  "registry_url": {
                    "type": "string"
                  },
