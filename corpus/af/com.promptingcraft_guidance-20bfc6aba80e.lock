      "serverInfo": {
        "name": "promptingcraft-guidance",
        "title": "PromptingCraft.com guidance",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PromptingCraft.com guidance: read-only access to a curated, dated ledger of official prompting and agent guidance from OpenAI, Anthropic, DeepSeek, Kimi, Cursor and the Agent Skills project, with provenance.\nUse it while writing or reviewing a prompt for a coding agent to find guidance that applies to the target agent and model, cite its source, and check whether a source page changed since it was verified.\nGuidance is conditional: it never overrides the user's requirements, decisions or permissions. Records of kind promptingcraft_methodology are PromptingCraft.com's own method, not provider recommendations.\nSend only the listed filter values and identifiers. Do not send conversation text, code, file paths or credentials; no tool accepts them.",
      "tools": [
        {
          "name": "check_source_freshness",
          "title": "Check source freshness",
          "description": "Fetch one allowlisted official documentation page from the curated registry and compare its normalized text with the verified snapshot. Status is unchanged, updated, unavailable (could not be checked now) or unknown (no snapshot). Results are shared by all callers and cached for up to 15 minutes (1 minute when unavailable); live.cached and checked_at show when the page was actually fetched. When the per-source fetch limit is reached, status is unavailable with reason rate_limited. Publication and update dates are never inferred and are always null. Only registry source ids are accepted; no other URL can be requested.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "description": "Registry source id, as returned in search_guidance or get_guidance results.",
                "enum": ["claude-code-practices", "claude-code-library", "claude-code-index", "claude-platform-index", "claude-prompting", "codex-prompting", "openai-skill-authoring", "openai-plugin-package", "openai-plugin-skills", "openai-index", "openai-api-index", "codex-index", "openai-plugin-index", "openai-eval-skills", "oai-clear-context", "oai-reasoning", "oai-evaluation", "oai-structured", "oai-tools", "oai-untrusted-data", "oai-cache", "claude-sonnet-scope", "claude-progressive", "claude-tool-descriptions", "claude-evaluations", "claude-code-authoring", "claude-workflow-complexity", "agentskills-index", "agentskills-specification", "agentskills-optimizing-descriptions", "agentskills-evaluating-skills", "cursor-index", "cursor-prompting", "cursor-plan-mode", "cursor-models", "cursor-skills", "cursor-plugins-reference", "deepseek-thinking", "kimi-thinking", "gemini-prompting"],
                "type": "string"
              }
            },
            "required": ["source_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canonical_url": {
                "type": "string"
              },
              "checked_at": {
                "type": "string"
              },
              "interpretation": {
                "type": "string"
              },
              "live": {
                "additionalProperties": false,
                "properties": {
                  "cached": {
                    "type": "boolean"
                  },
                  "content_sha256": {
                    "type": ["string", "null"]
                  },
                  "http_status": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "reason": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["cached", "content_sha256", "http_status", "reason"],
                "type": "object"
              },
              "provenance": {
                "additionalProperties": false,
                "properties": {
                  "curated_on": {
                    "type": ["string", "null"]
                  },
                  "freshness_note": {
                    "type": "string"
                  },
                  "label_definitions": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "ledger_commit": {
                    "type": ["string", "null"]
                  },
                  "ledger_url": {
                    "type": "string"
                  },
                  "registry_url": {
                    "type": "string"
                  },
                  "snapshot_url": {
                    "type": "string"
                  }
                },
                "required": ["curated_on", "freshness_note", "label_definitions", "ledger_commit", "ledger_url", "registry_url", "snapshot_url"],
                "type": "object"
              },
              "provider": {
                "type": "string"
              },
              "publication_date": {
                "type": "null"
              },
              "snapshot": {
                "additionalProperties": false,
                "properties": {
                  "content_sha256": {
                    "type": ["string", "null"]
                  },
                  "verified_at": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["content_sha256", "verified_at"],
                "type": "object"
              },
              "source_id": {
                "type": "string"
              },
              "status": {
                "enum": ["unchanged", "updated", "unavailable", "unknown"],
                "type": "string"
              },
              "update_date": {
                "type": "null"
              }
            },
            "required": ["canonical_url", "checked_at", "interpretation", "live", "provenance", "provider", "publication_date", "snapshot", "source_id", "status", "update_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
