      "serverInfo": {
        "name": "skill-store",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Skill Store holds ~60,000 skills: step-by-step procedures written by\npractitioners and organisations, covering software, operations, data,\ndocuments, finance, legal, health, animal care, marketing, design and more.\n\nSearch the store FIRST, before starting any task that produces a plan,\nschedule, procedure, document, configuration or code in a particular domain,\neven when you already know how to do it. A skill often carries specific\nhouse rules, standards or hard-won details that general knowledge will not\nreproduce, and the user may be relying on them. A search takes under a\nsecond; when it returns found=false, carry on normally.\n\n1. search_skills(query, area) — describe the TASK in a sentence or two.\n   Returns a few candidates with what each does and why it was suggested.\n   Also pass `area`, the one of these that best fits the task, so results\n   from that area rank higher: Software Development; AI & Agents; Data & Analytics; Security; Business; Finance & Markets; Betting & Prediction Markets; Legal; Health & Life Sciences; Creative & Media; Science & Education; Personal & Home.\n2. get_skill(skill_ref) — fetch the best candidate's SKILL.md and follow it,\n   telling the user which skill you used. Only fetch a skill you will use.\n3. report_skill_outcome(skill_ref, worked, notes) — after using a skill, say\n   whether it helped and what was missing.\nWhen a search also returns `skill_sets`, each is a set of skills used\ntogether for the whole job: fetch its `skill_refs` with get_skill in order\n(or get_skill_set(ref) for each step's recommended model size).\n",
      "tools": [
        {
          "name": "get_skill",
          "title": "Get skill",
          "description": "Fetch a skill's SKILL.md by the `ref` from\nsearch_skills (e.g. \"oakoss/vitest-testing-18074849092\"). Returns the\nmarkdown to follow. Pass `model` (the model that will use the skill, e.g.\n\"qwen3.6-27b\") or `tier` (\"small\" for a local / on-device model with a short\ncontext): many skills have a short version written for small models. When\nthe store holds a skill's supporting files (references, templates, scripts)\nthey follow the SKILL.md, each under its path; when it does not,\n`files_not_stored` is true and `source_url` is the author's folder with them.\nA skill whose licence forbids redistribution comes back as an error\n(`available` false) with the author's link. To keep a skill for later, save\nit as .claude/skills/<name>/SKILL.md with its files beside it. A ref ending\nin @<n> returns version n; a skill set's ref (skill-set/...) returns the set's\nsteps in order.",
          "inputSchema": {
            "properties": {
              "model": {
                "title": "Model",
                "type": "string"
              },
              "skill_ref": {
                "title": "Skill Ref",
                "type": "string"
              },
              "tier": {
                "enum": ["frontier", "small"],
                "title": "Tier",
                "type": "string"
              }
            },
            "required": ["skill_ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fc6f9552552afc27d96982ca4dc2fd5616efb4efa85831ae1b3262eb8000c29"
        },
        {
          "name": "get_skill_set",
          "title": "Get skill set",
          "description": "Fetch a skill set by the `ref` from\nsearch_skills' `skill_sets` (e.g. \"skill-set/patent-drawing-set-179...\"): the\nskills used together for one job, in order, each with its `ref` for\nget_skill, its recommended model size (\"frontier\" or \"small\"), its step\nlabel and version. `sequential` true means run the steps in order.",
          "inputSchema": {
            "properties": {
              "ref": {
                "title": "Ref",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get skill set"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fafb08d25e92fb044423610589dda1b7e5fcc13b293d17b4720a9a0c981b38be"
        },
        {
          "name": "report_skill_outcome",
          "title": "Report skill outcome",
          "description": "After using a skill: did it help with the\ntask? `notes` says what worked or what was missing or wrong.",
          "inputSchema": {
            "properties": {
              "notes": {
                "default": "",
                "title": "Notes",
                "type": "string"
              },
              "skill_ref": {
                "title": "Skill Ref",
                "type": "string"
              },
              "worked": {
                "title": "Worked",
                "type": "boolean"
              }
            },
            "required": ["skill_ref", "worked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report skill outcome"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ada9fbc5afe582b7ac4542d5ee98fe029b66c677dde94a63399ca10af5a3de27"
        },
        {
          "name": "search_skills",
          "title": "Search skills",
          "description": "Call this BEFORE starting a domain task (a plan, schedule,\nprocedure, document, configuration or code), even one you know how to do: a\nskill may carry specific rules general knowledge will not reproduce. `query`\nis a sentence or two describing the task. A candidate with `available`\nfalse is one the store can list but not serve (its licence): get_skill returns\nonly the author's link. `skill_sets`, when present, lists sets of skills used\ntogether for the whole job, each with its `skill_refs` in order. `area` is the subject area that best fits the\ntask; skills from that area rank higher (others are still returned). `limit`\n1-10 (default 3). Optional `tier` ('frontier' or 'small') for the model that\nwill follow the skill.",
          "inputSchema": {
            "properties": {
              "area": {
                "enum": ["Software Development", "AI & Agents", "Data & Analytics", "Security", "Business", "Finance & Markets", "Betting & Prediction Markets", "Legal", "Health & Life Sciences", "Creative & Media", "Science & Education", "Personal & Home"],
                "title": "Area",
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 10,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "tier": {
                "enum": ["frontier", "small"],
                "title": "Tier",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:563f8ab73af3a8b134fdd664c2df158648ede0033ad4d3af1994f10b54df2114"
        }
      ],
      "digest": "sha256:0e83a5ff21408a6a0f4edd06fe16c1fb275cc20d2737f2b5f7070c1c3c995b41"
    }
