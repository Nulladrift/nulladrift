{
  "lockfileVersion": 2,
  "subjects": {
    "ai.huntboard/huntboard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://huntboard.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "huntboard",
        "title": "HuntBoard",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HuntBoard finds real, recent job postings from company career pages and ATS boards (Greenhouse, Lever, Workday, Comeet, Ashby and more), scored against the job seeker's target titles. Call search_jobs with 1-6 target titles and at least one location (or remote_ok: true). Results are already scored 7-10 for fit and deduplicated; show them as a list with the link. get_job returns the full details of one posting from a search_jobs link. list_coverage lists the locations and roles HuntBoard keeps browse pages for. subscribe_daily_hunts emails the person a confirmation link; daily job-match emails start only after they confirm, and every email has a one-click unsubscribe. HuntBoard is free; a job seeker can also sign up at https://huntboard.ai.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get one job posting",
          "description": "Full details of one posting HuntBoard has indexed: title, company, location, workplace type, employment type, posted date, source, apply link, whether it is still open, and a description excerpt. Pass the link returned by search_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The job link as returned by search_jobs.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one job posting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b77f5e073ad02dbf186d1a9814fcfdee85785d4c28bd5cc986ed523f0ea8f470"
        },
        {
          "name": "list_coverage",
          "title": "List covered locations and roles",
          "description": "The countries, cities, remote-in-country pages and job roles HuntBoard keeps browse pages for, each with its public page URL. Useful to pick locations and titles before searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered locations and roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db2cce332d9e397c4c810c1dec0f7330d4bcbe0dd21ead9be6126aecc3765d62"
        },
        {
          "name": "search_jobs",
          "title": "Search job postings",
          "description": "Find recent job postings that match target job titles in given locations (or remote). Runs HuntBoard's own hunt: SQL narrowing over its index of company career pages and ATS boards, then an AI fit score. Returns up to max_results jobs scored 7-10 with title, company, location, link, source and a one-line reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exclude_locations": {
                "description": "Location fragments to drop.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "exclude_titles": {
                "description": "Title fragments to drop, e.g. [\"Manager\", \"QA\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "locations": {
                "description": "Cities, regions or countries, e.g. [\"Tel Aviv\", \"Israel\"]. Optional only when remote_ok is true.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "max_results": {
                "default": 20,
                "description": "How many jobs to return, 1-50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "remote_ok": {
                "default": false,
                "description": "Also include remote roles open to the given locations (or global remote roles).",
                "type": "boolean"
              },
              "titles": {
                "description": "Target job titles, e.g. [\"Backend Engineer\", \"Platform Engineer\"]. Parentheticals are stripped and head phrases matched.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["titles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search job postings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96588011c54daa3010a86a70efe2a5fa16b6b793b2b4dc5f12508b9aede92496"
        },
        {
          "name": "subscribe_daily_hunts",
          "title": "Subscribe to daily job matches by email",
          "description": "Ask HuntBoard to email the person new job matches every morning for the given titles and locations. Double opt-in: HuntBoard sends a confirmation link to the email address and nothing starts until the person clicks it. Free, one-click unsubscribe in every email. Only call this when the person explicitly asked for daily emails and gave their own address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The person's own email address.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "exclude_locations": {
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "exclude_titles": {
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "locations": {
                "description": "Cities, regions or countries. Optional only when remote_ok is true.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "remote_ok": {
                "default": false,
                "description": "Also include remote roles.",
                "type": "boolean"
              },
              "titles": {
                "description": "Target job titles.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["email", "titles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Subscribe to daily job matches by email"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1fe617074075c44d52afad203b7204079328ff1b529e87d5f4731024dd6d0a9"
        }
      ],
      "digest": "sha256:c09a7a881dbffee8ae54eb56de204bb5fd78e3ba93c5256b1ad8611efead0940"
    }
  }
}
