        {
          "name": "wait_for_approval",
          "title": "Wait for approval",
          "description": "Block until the person answers an approval link, then return their choice. Returns at once if it was already answered. On timeout, call it again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "inbox_key": {
                "description": "The inbox_key returned by create_inbox (starts with \"porch_sk_\").",
                "type": "string"
              },
              "path": {
                "description": "The path returned by create_approval_link, e.g. \"/approve/AbC123\". The full URL works too.",
                "type": "string"
              },
              "timeout_seconds": {
