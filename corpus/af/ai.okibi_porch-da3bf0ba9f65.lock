        {
          "name": "create_approval_link",
          "title": "Create approval link",
          "description": "Make a link to send a person when you need their decision (\"Deploy to production?\"). It opens a page with your title, message and one button per choice. Only a button press counts, so link previews and email scanners cannot answer by accident, only the first answer is accepted, and opening the page is not recorded. Then call wait_for_approval.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "choices": {
                "description": "Button labels (default [\"Approve\", \"Deny\"]). The first is highlighted.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "inbox_key": {
                "description": "The inbox_key returned by create_inbox (starts with \"porch_sk_\").",
                "type": "string"
              },
              "message": {
                "description": "Optional details shown under the title (plain text).",
                "maxLength": 4000,
                "type": "string"
              },
              "title": {
                "description": "The question, shown as the page heading.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["inbox_key", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "choices": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["choices", "next", "path", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
