            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30ee08993e7e3439bf626dd940a4992fe79ec29d5f30f5e95590ead06cbb10f9"
        },
        {
          "name": "list_coupons",
          "title": "List live coupons",
          "description": "Live coupons and offers on this site, across shops or filtered by shop, category or kind. Sorted by `featured` (exclusive and top first, default), `newest` or `ending_soon`. Each coupon `url` reveals the code on the site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug, from `list_categories`.",
                "maxLength": 100,
                "type": "string"
              },
              "exclusive_only": {
                "description": "Only coupons exclusive to this site.",
                "type": "boolean"
              },
              "free_shipping_only": {
                "description": "Only free-shipping coupons.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "shop": {
                "description": "Shop slug.",
                "maxLength": 150,
                "type": "string"
              },
              "sort": {
                "description": "Order (default `featured`).",
                "enum": ["featured", "newest", "ending_soon"],
                "type": "string"
              },
              "type": {
                "description": "`code`: needs a code; `offer`: no code.",
                "enum": ["code", "offer"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List live coupons"
          },
          "behavior": {
