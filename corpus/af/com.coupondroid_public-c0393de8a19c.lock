      "instructions": "Public, read-only server of Coupondroid (https://coupondroid.com/), a coupon and deals website for\nUS - United States. Content is in en-US and prices in USD.\nIt returns only what the website itself shows: shops, their live coupons and offers, categories and\nsales events. Data is live (cached for a few minutes).\n\n- Start with `site_info`; then `search_shops` / `get_shop` for a merchant, or `list_coupons` to browse.\n- Every coupon carries a `url`: send the user there to reveal the code or open the offer and go on\n  to the shop. Codes are not returned by this server, so never make one up.\n- Quote titles, discounts and end dates as returned; do not invent offers or conditions.\n- Other countries have their own site and server; `site_info` lists them.\n- Site guide for LLMs: https://coupondroid.com/llms.txt\n",
      "tools": [
        {
          "name": "get_shop",
          "title": "Shop and its live coupons",
          "description": "One shop by slug with its live coupons and offers (best first), its categories and the same shop on the sites of other countries. Each coupon `url` reveals the code on the site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 30).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Shop slug, from `search_shops` (e.g. \"samsung\").",
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shop and its live coupons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c954dd103d2d8a9bbaeadfeef00c3f5f9f73a6225b82f73e06a319cc0a62c380"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The shop categories of this site (fashion, electronics, travel…), with their page on the site. Use a `slug` to filter `search_shops` or `list_coupons`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
