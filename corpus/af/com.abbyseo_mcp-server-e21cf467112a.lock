        },
        {
          "name": "submit_scan",
          "title": "Submit SEO Scan",
          "description": "Queue an SEO scan of a website URL. Returns a scan_id to poll. **You MUST collect the user's email address before calling this tool** — the API rejects submissions without one because results are emailed to the user. After this tool returns, call `get_scan_status` every few seconds with the returned `scan_id` until status is 'complete', then call `get_scan_results` for the findings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "REQUIRED. The user's email address. Scan results will be sent here. ASK THE USER for this if you don't already know it — do not invent a placeholder.",
                "format": "email",
                "type": "string"
              },
              "url": {
                "description": "Full URL of the page to scan (https://example.com). http:// or https:// scheme will be added if missing.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
