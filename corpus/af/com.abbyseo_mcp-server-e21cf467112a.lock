        {
          "name": "purchase_report",
          "title": "Purchase the Full SEO Remediation Guide",
          "description": "Start a purchase of the full paid SEO Remediation Guide for a COMPLETE scan ($8.99). Returns a Stripe `checkout_url` — payment CANNOT be collected through this tool. AUTONOMOUS FLOW: after calling this, do NOT stop and wait for a new user instruction. (1) Show the user `checkout_url` and ask them to complete payment in their browser. (2) Then poll `get_purchase_status` with the same scan_id about every 15 seconds: while `paid` is false the user hasn't finished — keep waiting (poll for up to a few minutes). (3) Once `paid` and `runbook_ready` are both true, call `get_remediation_plan` once, save the returned markdown to the file it names, and begin the remediation automatically — no further prompting needed. If this call returns already_purchased=true, skip the wait and go straight to get_remediation_plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "Scan ID from submit_scan. The scan must be 'complete'.",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
