      "instructions": "Abby SEO scans any site for 20 SEO checks and produces an executable fix plan. Returning user with no scan_id (scanned earlier or bought on the website)? Call find_my_reports(email) first to look it up. FREE tier: submit_scan(url, email) (ask the user for their email FIRST) → poll get_scan_status to 'complete' → get_scan_results returns the score + top issues ONLY. PAID tier ($8.99) unlocks the full plan covering ALL issues: purchase_report(scan_id) → show the user the Stripe checkout_url → poll get_purchase_status (~15s) until paid (don't wait for a new prompt) → get_remediation_plan(scan_id). Save its markdown as seo-remediation-plan.md and execute it: priority-ordered fixes, copy-ready replacements, '❓ ASK THE OWNER' stops (never invent brand, keyword, or contact details), re-scan via submit_scan to verify. Payment is browser-only — it can't be collected through these tools. New here? The 'getting_started' prompt (or the how_to_use tool) returns a plain-English usage guide with example requests — in Claude Code the prompt is /mcp__abbyseo__getting_started; if a client doesn't surface prompts, call how_to_use.",
      "tools": [
        {
          "name": "find_my_reports",
          "title": "Find My SEO Scans / Reports by Email",
          "description": "Look up a user's recent SEO scans by the email they used — for RETURNING users who don't have a scan_id handy (scanned/purchased earlier or on the website). In a fresh session where the user has no scan_id, START HERE: ask the user for that email, then call this. Returns up to 10 recent scans as {scan_id, url, scanned_at, paid, runbook_ready}. Then use the scan_id with get_remediation_plan (if paid+runbook_ready) or purchase_report (if not paid).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address the user used when scanning or purchasing.",
                "format": "email",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
