        },
        {
          "name": "get_purchase_status",
          "title": "Check SEO Report Purchase Status (lightweight poll)",
          "description": "Lightweight poll for whether a scan's paid remediation report is ready, WITHOUT downloading the full plan. Use this in the wait loop after `purchase_report`: call about every 15 seconds until both `paid` and `runbook_ready` are true, then call `get_remediation_plan` ONCE to fetch and execute the plan. `paid=false` => the user hasn't completed checkout yet; `paid=true, runbook_ready=false` => payment landed and the plan is still being generated (retry shortly).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "Scan ID from submit_scan / purchase_report.",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9d4729c914dcb15b1049edb8e88fbc7a7117de2636931bb72e5b33671f4b3b5"
        },
        {
          "name": "get_remediation_plan",
          "title": "Get the SEO Remediation Plan (Claude Code runbook)",
          "description": "Retrieve the full paid remediation plan for a purchased scan, as a Markdown runbook built for an AI coding agent to execute. **Save the returned `markdown` to a file named by `filename` (e.g. seo-remediation-plan.md) in the user's project, then work through it top to bottom.** It lists each issue in priority order with the exact fix, copy-ready replacement strings, explicit '❓ ASK THE OWNER' stops where you must get the owner's input (never invent brand names, keywords, phone numbers, or addresses), and a verification step (re-run `submit_scan` after each fix to confirm it passes). If the scan has NOT been purchased, returns paid=false with guidance to call `purchase_report` first. If the plan is still generating, returns status='generating' — call again in ~30 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "Scan ID that was purchased via purchase_report.",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf17e885bea99b2c9cf26693b47ba5c84508a04c4c10fd370bdfe8353ac4a5d2"
        },
        {
          "name": "get_scan_results",
          "title": "Get SEO Scan Results",
          "description": "Fetch the full structured scan findings. Free tier returns the top 5 issues by severity (failed > warned > passed); paid customers see all checks. When summarizing results to the user, ALWAYS: (1) report the score and counts of failed/warned/passed checks, (2) surface each returned check's `remediation` text verbatim, (2b) for sophisticated users, mention each check's `when_doesnt_apply` context so they can dismiss findings that don't apply to their site type (e.g., link aggregators legitimately omit a visible H1; empty string means the rule is universally required), (2c) note `site_type` ('marketing' or 'not_marketing') and `score_rubric` ('standard' or 'non_marketing_weighted') so the user understands how the score was computed; non-marketing sites get contextual checks at half-weight, so a forum-style site won't be unfairly penalized for missing landing-page features, (3) if `truncated` is true, surface `truncated_message` so the user knows the API capped the output, (4) include `upgrade.call_to_action` and `upgrade.checkout_url` verbatim so the user can one-click into Stripe checkout for the $8.99 detailed fix guide. If `upgrade.already_purchased` is true, instead direct the user to `upgrade.report_url` to re-download.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "Scan ID from a prior submit_scan call. The scan must be in 'complete' status.",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
