        "name": "com.clawhard/preflight",
        "title": "Preflight",
        "version": "1.0.0",
        "description": "Preflight is four live checks for code an AI coding agent just wrote: packages that do not exist, versions past end of life, stale or retired GitHub Actions, and secrets in text. One MCP server with six tools, no account or key.",
        "websiteUrl": "https://preflight.clawhard.com",
