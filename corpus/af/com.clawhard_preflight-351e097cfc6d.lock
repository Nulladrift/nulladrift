      "instructions": "Preflight: Preflight is four live checks for code an AI coding agent just wrote: packages that do not exist, versions past end of life, stale or retired GitHub Actions, and secrets in text. One MCP server with six tools, no account or key. Use it when a coding agent has just written or is about to install, pin, commit or paste something: npm or PyPI packages, runtime and base-image versions, a GitHub Actions workflow, or text that may contain API keys and tokens. Tools: notary_check_packages (Check that npm and PyPI packages really exist before installing them); ripe_check_file (Check the versions pinned in a Dockerfile, compose file, package.json, pyproject or CI workflow (live end-of-life and Docker tags)); ripe_check_versions (Look up support status, end-of-life date and latest version for runtimes, frameworks, databases and Docker images (live)); tack_check_workflow (Check a GitHub Actions workflow and pin every action to a commit SHA (live)); tack_resolve_actions (Look up GitHub Actions: latest release, commit SHA, runtime and inputs (live)); spill_scan_secrets (Find and redact API keys, tokens, private keys and passwords in text). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "notary_check_packages",
          "title": "Check that npm and PyPI packages really exist before installing them",
          "description": "Use when the user or an agent is about to install or import npm or PyPI packages: before npm install or pip install, when adding lines to package.json or requirements.txt, or when a package name came from an AI answer, a tutorial or memory and may be invented. Looks each name up in the live registry and returns whether it exists, the latest version, whether a pinned version exists, weekly downloads, first and last publish dates, deprecation or yanked status, install-time scripts, whether the name is one or two typed characters from a well-known package, and real similar packages when the name does not exist. Example: {\"packages\":[{\"ecosystem\":\"npm\",\"name\":\"@anthropic/mcp-client\"},{\"ecosystem\":\"pypi\",\"name\":\"requests\",\"version\":\"2.32.3\"}]}. Up to 10 packages per call; versions must be exact, not ranges. Not a malware or vulnerability scan: \"ok\" means it exists and nothing looked wrong.",
          "inputSchema": {
            "properties": {
              "packages": {
                "description": "1 to 10 packages to look up.",
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "Which registry: npm (JavaScript, TypeScript, Node) or pypi (Python).",
                      "enum": ["npm", "pypi"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The package name only, e.g. left-pad, @types/node or requests. No version, extras (requests[security]), URL or path.",
                      "maxLength": 214,
                      "minLength": 1,
                      "type": "string"
                    },
                    "version": {
                      "description": "Optional: one exact version to verify, e.g. 4.17.21 (npm also accepts a dist-tag like latest). Not a range such as ^4.17.0.",
                      "maxLength": 64,
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["packages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check that npm and PyPI packages really exist before installing them"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/notary/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/notary/result"
          },
          "digest": "sha256:a5c087e8678728a99059d25da9526e1f99dbb5402e6c616a8f3ecbdb6a9cbabe"
        },
        {
          "name": "ripe_check_file",
          "title": "Check the versions pinned in a Dockerfile, compose file, package.json, pyproject or CI workflow (live end-of-life and Docker tags)",
          "description": "Use when a Dockerfile, docker-compose/compose.yaml, Kubernetes manifest, GitHub Actions workflow, package.json, pyproject.toml, requirements.txt, go.mod, global.json, .nvmrc, .python-version, .tool-versions, mise.toml, Gemfile, composer.json or Terraform file has just been written or edited, or the user asks whether the versions in it are current (signals: \"write a Dockerfile\", \"FROM node:18\", \"python:3.9-slim\", \"is this base image outdated\", \"end of life\", \"EOL\", \"upgrade the runtime\", \"which Node version\", \"does this tag exist\", \"manifest unknown\", \"engines\", \"requires-python\"). Reads every version pin with its line (FROM and image: references with build-arg defaults, engines/volta/packageManager, requires-python, go and toolchain directives, sdk.version, setup-* versions and matrices, and well-known frameworks such as Next.js, React, Django, Rails, Laravel), then checks each one live: support status on today's date from endoflife.date (supported, security fixes only, end of life, not released, no such version), the end-of-life date and days left, the latest patch in that line, the newest supported line and the oldest one still supported; for container images it also checks the base OS in the tag (alpine3.18, bookworm, jammy), deprecated official images, and that the tag really exists on its registry (Docker Hub, ghcr.io, mcr.microsoft.com, quay.io and others), and proposes a replacement tag that it confirmed exists. Returns findings with severity, line, message and fix, plus a fix_message. Example: {\"filename\":\"Dockerfile\",\"content\":\"FROM node:18-alpine3.18\\nRUN npm ci\\nFROM python:3.9-slim-buster\"}. Does not build images, resolve npm or PyPI dependency trees (packages are checked only when endoflife.date tracks them), or see private registries. Up to 100000 characters.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Judge support status on this date (YYYY-MM-DD). Default: today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_tags": {
                "description": "Check Docker image tags exist on their registry (and verify the suggested replacement tag). Default true.",
                "type": "boolean"
              },
              "content": {
                "description": "The text of the file.",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "description": "File name or path, used to tell the file type: \"Dockerfile\", \"compose.yaml\", \".github/workflows/ci.yml\", \"package.json\", \"pyproject.toml\", \"go.mod\", \".nvmrc\"... Optional when kind is given or the content makes it obvious.",
                "maxLength": 300,
                "type": "string"
              },
              "kind": {
                "description": "File type; default auto (from filename, then content).",
                "enum": ["auto", "dockerfile", "compose", "workflow", "kubernetes", "package.json", "composer.json", "pyproject.toml", "requirements.txt", "go.mod", "global.json", ".nvmrc", ".python-version", ".ruby-version", "runtime.txt", ".tool-versions", "mise.toml", "gemfile", "terraform"],
                "type": "string"
              },
              "warn_days": {
                "description": "Warn when end of life is this many days away or less. Default 180.",
                "maximum": 1095,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check the versions pinned in a Dockerfile, compose file, package.json, pyproject or CI workflow (live end-of-life and Docker tags)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/ripe/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/ripe/result"
          },
          "digest": "sha256:7f9a470e6771b62bb4abdd714bc0a46f19fd9e59b04827ee9cc20dee58e87c6c"
        },
        {
          "name": "ripe_check_versions",
          "title": "Look up support status, end-of-life date and latest version for runtimes, frameworks, databases and Docker images (live)",
          "description": "Use when a version of a runtime, framework, database, OS or Docker image is about to be chosen or recommended, or the user asks whether a version is still supported, when it reaches end of life, what the latest version or current LTS is, or whether a Docker tag exists (signals: \"which Node version should I use\", \"latest LTS\", \"is Python 3.9 still supported\", \"when does Postgres 14 go EOL\", \"is .NET 8 end of life\", \"latest Django\", \"does python:3.13-slim-trixie exist\", \"Ubuntu 22.04 support\"). Each item is free text: \"node 18\", \"python 3.9.18\", \"postgres:13-alpine\" (an image), \"django>=4.2\", \"ubuntu jammy\", \"lts/hydrogen\", or just a product name (\"nodejs\") for its supported lines and current pick. Data is fetched live from endoflife.date (about 490 products: languages, frameworks, databases, operating systems, cloud and infrastructure software); image tags are checked on their registry. Returns per item the matched release line, status on today's date (supported, security fixes only, end of life, not released, no such version), LTS flag, end-of-life date and days left, paid extended support date, latest patch and whether the given version is behind it, the recommended line and the oldest still supported, and for images whether the tag exists plus a verified replacement. Example: {\"items\":[\"node 18\",\"python:3.9-slim\",\"postgres 14\",\"nextjs 13.4.1\",\"dotnet\"]}. Up to 40 items. Products endoflife.date does not track are reported as unknown, not guessed; for a whole file use ripe_check_file.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Judge support status on this date (YYYY-MM-DD). Default: today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_tags": {
                "description": "Check Docker image tags exist on their registry (and verify the suggested replacement tag). Default true.",
                "type": "boolean"
              },
              "items": {
                "description": "Products and versions, one per item: \"node 18\", \"python 3.12.4\", \"postgres:16-alpine\", \"django 5.1\", \"ubuntu 22.04\", \"dotnet\" (product only).",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "warn_days": {
                "description": "Warn when end of life is this many days away or less. Default 180.",
                "maximum": 1095,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up support status, end-of-life date and latest version for runtimes, frameworks, databases and Docker images (live)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/ripe/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/ripe/result"
          },
          "digest": "sha256:e984ba8afd89bca4696671e10284f18bd1e129cbe9f4c0967668313e060afb2d"
        },
        {
          "name": "spill_scan_secrets",
          "title": "Find and redact API keys, tokens, private keys and passwords in text",
          "description": "Use when the user asks whether some text contains secrets, or before you paste, commit, share, log or send code, a .env file, a diff, config, logs, a stack trace or a prompt that might contain credentials, for example \"did I leak a key in this?\", \"is this safe to post?\" or \"redact the secrets in this log\". Detects 48 services by exact key format (OpenAI, Anthropic, Gemini/Google, Groq, xAI, OpenRouter, Stripe, Supabase, AWS, GitHub, GitLab, npm, PyPI, Slack, Discord, Twilio, SendGrid, Resend, Shopify, Cloudflare and more) plus PEM private keys, database URLs with passwords, JWTs, Authorization headers and high-entropy values in variables named like secret, token, api_key or password. It verifies what it can deterministically: GitHub token CRC32 checksums, JWT and Supabase key role and expiry (service_role vs anon), documented example keys and placeholders, and NEXT_PUBLIC_/VITE_/EXPO_PUBLIC_ variables that ship to every browser. Returns findings with severity (critical, high, medium, public, info), line and column, a masked preview (never the full secret), why it matters, the fix and the provider's revoke URL, plus a redacted copy with labels like [STRIPE_SECRET_KEY_1]. Text is processed in memory to answer and is not stored. Limits: format-based, so a random secret with a neutral name can be missed; it never tests keys against providers; up to 200,000 characters. The same scanner also runs entirely in the browser at https://spill.clawhard.com.",
          "inputSchema": {
            "properties": {
              "redact_public_keys": {
                "description": "false (default): keep keys that are meant to be public (Stripe pk_, Supabase anon or publishable, Mapbox pk.) in the redacted copy so the code still runs. true: hide them too.",
                "type": "boolean"
              },
              "text": {
                "description": "The text to scan: code, a diff, .env, config, logs, a stack trace, a chat or a prompt.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find and redact API keys, tokens, private keys and passwords in text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/spill/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/spill/result"
          },
          "digest": "sha256:60fffa8fd05552a876779b13b2d68703099bc51a35b61afb4cb4d636eb67df46"
        },
        {
          "name": "tack_check_workflow",
          "title": "Check a GitHub Actions workflow and pin every action to a commit SHA (live)",
          "description": "Use when the user asks to write, review, fix or harden a GitHub Actions workflow (.github/workflows/*.yml) or a composite action.yml, or when a workflow was just written or edited and is about to be committed (signals: \"write a CI workflow\", \"why does my workflow fail\", \"Invalid workflow file\", \"Unexpected input\", \"pin actions to SHA\", \"is actions/checkout@v4 still current\", \"Node 20 deprecated\", \"upload-artifact v3\", \"runs-on ubuntu-20.04\", \"script injection\", \"pull_request_target\"). Parses the YAML (errors with line and column, duplicate keys, anchors), checks the structure against GitHub's workflow syntax as documented on 2026-11-19 (including recent keys such as schedule timezone, cache-mode, background, wait, wait-all, cancel, parallel and $/ self-repository references), then resolves every uses: reference live on github.com: whether the repository, tag, branch or commit exists, which release a SHA is, the latest release, retired versions that make a job fail (upload/download-artifact v3 and older, actions/cache v1-v2 and old exact pins), runs.using node20-or-older runtimes, with: inputs the action does not declare (with a did-you-mean), missing required inputs, reusable-workflow inputs, and pinned-SHA comments that name the wrong version. Also flags retired runner labels (live runner-images list), script injection through ${{ github.event... }} in run:, pull_request_target checkouts of PR code, and a missing permissions key. Returns each finding with line, path, fix and doc link, per-action resolution, fix_message, and pinned_workflow: the same file with every action pinned to its full commit SHA and a # version comment (retired or missing refs move to the latest release; upgrade:true moves all). Example: {\"workflow\":\"on: push\\njobs:\\n  test:\\n    runs-on: ubuntu-latest\\n    steps:\\n      - uses: actions/checkout@v4\\n      - uses: actions/setup-node@v4\\n        with:\\n          node_version: 20\"}. Does not run the workflow, evaluate expressions or see private repositories, secrets or repository settings. Up to 200000 characters.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "auto (default) detects a workflow (jobs:) or an action metadata file (runs:).",
                "enum": ["auto", "workflow", "action"],
                "type": "string"
              },
              "live": {
                "description": "Resolve actions, inputs and runner labels on github.com. Default true; false = offline YAML and syntax checks only.",
                "type": "boolean"
              },
              "upgrade": {
                "description": "Pin every action to its latest release instead of the version the file uses. Default false (retired or missing refs are moved to the latest release either way).",
                "type": "boolean"
              },
              "workflow": {
                "description": "The YAML text of a workflow file (.github/workflows/<name>.yml) or of an action.yml / action.yaml.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["workflow"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a GitHub Actions workflow and pin every action to a commit SHA (live)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/tack/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/tack/result"
          },
          "digest": "sha256:815b1fc444a1fbd82ed3aa2cfb252c4edc01a0c0cea6852de2aa9c8ca8b964dc"
        },
        {
          "name": "tack_resolve_actions",
          "title": "Look up GitHub Actions: latest release, commit SHA, runtime and inputs (live)",
          "description": "Use when a uses: line for a GitHub Action is about to be written and its current version, commit SHA or inputs are needed, or the user asks what the latest version of an action is, what SHA a tag points to, or whether an action or tag exists (signals: \"latest actions/checkout\", \"pin setup-node to a SHA\", \"what inputs does this action take\", \"does v9 exist\", \"which version is this SHA\"). Takes owner/repo (latest release), owner/repo@ref or owner/repo/path@ref, reads the tags and branches live from github.com and the action.yml at that commit, and returns per action: exists or not, the commit SHA, the release a SHA or major tag points to, the latest release and major tag, runs.using (flags node20 and older, which GitHub stopped shipping on 2026-09-23), retired versions that fail jobs, the declared inputs, and a ready-to-paste line: uses: owner/repo@<40-char sha> # vX.Y.Z. Example: {\"actions\":[\"actions/checkout\",\"actions/setup-node@v4\",\"docker/build-push-action@v6\"]}. Up to 30 per call. Public github.com repositories only; for a whole workflow file use tack_check_workflow.",
          "inputSchema": {
            "properties": {
              "actions": {
                "description": "Action references: \"owner/repo\" (latest release), \"owner/repo@v4\", \"owner/repo/path@ref\", or a full uses: line.",
                "items": {
                  "maxLength": 300,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "upgrade": {
                "description": "For references with a ref, return the pinned line for the latest release instead. Default false.",
                "type": "boolean"
              }
            },
            "required": ["actions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up GitHub Actions: latest release, commit SHA, runtime and inputs (live)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/tack/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/tack/result"
          },
          "digest": "sha256:e8893f9ad337eee7139e56c9839756a0eba9f2f6e99d0b2d0eab07035ed32d4f"
        }
