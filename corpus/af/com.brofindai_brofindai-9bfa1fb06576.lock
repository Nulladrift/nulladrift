{
  "lockfileVersion": 2,
  "subjects": {
    "com.brofindai/brofindai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://brofindai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "BroFindAI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BroFindAI MCP server. Use search_ai_tools to find AI tools, list_categories for browsing, get_tool_details for specifics, and list_mcp_servers for MCP server discovery.",
      "tools": [
        {
          "name": "get_tool_details",
          "description": "Get full details of a specific AI tool by its slug identifier (e.g. 'chatgpt', 'midjourney'). Returns name, description, URL, category, pricing, votes, and metadata.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The tool's slug identifier (lowercase, hyphenated)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b45c4248a8efe971a0dcece31160a4e07cf4d62c8cb8b26c7564636039effdb1"
        },
        {
          "name": "list_categories",
          "description": "List all AI tool categories in the BroFindAI directory with the number of tools in each category.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2eba4bb78f1102079dececeea7515d35e474c6fb1e4db47e814be3823afecbf9"
        },
        {
          "name": "list_mcp_servers",
          "description": "Browse the BroFindAI MCP (Model Context Protocol) servers directory. Filter by category or search by keyword.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by MCP server category (e.g. 'Databases', 'Browser Automation')",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default 10, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Search keyword for MCP server name, description, or tags",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1ba4b347391bd7fc14b5f22cbfee6ae24e8fb87b05ea4d906f014afa07d440d"
        },
        {
          "name": "list_tags",
          "description": "List every tag and platform in use across the directory with tool counts, plus how many tools have a known/unknown API and open-source status. Call this to discover valid filter values for search_ai_tools.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35dfd2888c14c3e5b52739d0e7a2dcce5682dcf9841a3c3317e9aca4a3418c9f"
        },
        {
          "name": "search_ai_tools",
          "description": "Search the BroFindAI directory of 1100+ AI tools by keyword, category, pricing, platform, tags, API availability, or open-source status. Returns matching tools with full structured metadata.",
          "inputSchema": {
            "properties": {
              "api": {
                "description": "true = only tools with a confirmed public API; false = only tools confirmed to have none. Tools where this is unknown are excluded either way.",
                "type": "boolean"
              },
              "category": {
                "description": "Filter by category: 'Writing & Content', 'Coding & Dev Tools', 'Image Generation', 'Chatbots & Assistants', 'SEO & Marketing', 'Video', 'Audio & Voice', 'Business', 'Research', 'Data & Analytics', 'Other'",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default 10, max 50)",
                "type": "number"
              },
              "opensource": {
                "description": "true = only confirmed open-source tools; false = only confirmed proprietary. Tools where this is unknown are excluded either way.",
                "type": "boolean"
              },
              "platform": {
                "description": "Only tools available on this platform",
                "enum": ["Web", "Windows", "Mac", "Linux", "iOS", "Android", "Browser Extension", "VS Code", "CLI", "Self-Hosted"],
                "type": "string"
              },
              "pricing": {
                "description": "Filter by pricing model",
                "enum": ["Free", "Freemium", "Paid"],
                "type": "string"
              },
              "query": {
                "description": "Search keyword (matches name, tagline, description, and tags)",
                "type": "string"
              },
              "tags": {
                "description": "Only tools carrying ALL of these tags (e.g. ['coding','autocomplete']). Call list_tags for the vocabulary.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38a40efe509dbaf057ea2a6bb1b7ec84af9509b6c6f526266d0801fbf41a43a3"
        }
      ],
      "digest": "sha256:729c0a208949fef1191c2f38dd8f309e6eaf5e4477b562a8297777c5aa33ca95"
    }
  }
}
