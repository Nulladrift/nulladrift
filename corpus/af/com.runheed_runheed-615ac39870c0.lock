      },
      "transport": {
        "type": "http",
        "url": "https://runheed.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "runheed",
        "title": "Runheed",
        "version": "0.1.0",
        "websiteUrl": "https://runheed.com",
        "icons": [
          {
            "src": "https://runheed.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://runheed.com/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Runheed holds the production errors reported by this workspace's apps. runheed_get_recent and runheed_search_errors list error groups with their IDs; runheed_get_error and runheed_get_error_context return one group in full; runheed_resolve_error marks a group fixed and takes the fixing commit as its comment. When asked what to fix, start with runheed_get_project_health: it names the error to fix first and any that came back after a fix, with the note from that fix.",
      "tools": [
        {
          "name": "runheed_get_error",
          "title": "Get an error",
          "description": "Returns one error group in full: message, status, counts, first and last seen, environment, agent context, the top stack frames and the latest breadcrumbs. If the error came back after it was marked resolved, it also shows the note it was resolved with, so you can see what the last fix tried.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "errorId": {
                "description": "The error ID to get details for",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9c32728e7cea43cd7fc26457222a7855824fcc39ed25ef7bfeb390b4e3273145"
        },
        {
          "name": "runheed_get_error_context",
          "title": "Get error context",
          "description": "Returns everything recorded around an error: every breadcrumb, platform, runtime, OS, environment, release, the affected user, the agent session and extra data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "errorId": {
                "description": "The error ID to get context for",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get error context"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a5574c7e41deb0afa92761967341c20b0159656d3f33ad3f6ae4d28cd00b001f"
        },
        {
          "name": "runheed_get_project_health",
          "title": "Get project health",
          "description": "Returns a 0 to 100 health score for a project (or the whole workspace), errors in the last 24 hours, the unresolved count, the error rate, recent issues and recommendations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "projectId": {
                "description": "Project id or slug (e.g. shop-api); all projects if not specified",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get project health"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9ba02809900d16b549ffb56ac090ef033c0aebe81aee81cac9a600d35a577384"
        },
        {
          "name": "runheed_get_recent",
          "title": "Get recent errors",
          "description": "Returns the error groups seen most recently, newest first, with status, type, message, route, top stack frame, event count, last-seen time and ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Number of recent errors to return",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "projectId": {
                "description": "Filter by project id or slug (e.g. shop-api)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get recent errors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2ac9701026196df6cd288e44749a54af00c0b239767af280eca37933e1b4c7a4"
        },
        {
          "name": "runheed_get_trends",
          "title": "Get error trends",
          "description": "Returns error statistics for the last 24 hours, 7 days or 30 days: total, new and resolved counts, the most frequent errors and the hourly error rate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "period": {
                "default": "24h",
                "description": "Time period to analyze",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "projectId": {
                "description": "Filter by project id or slug (e.g. shop-api)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get error trends"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd93d33859103a283943a963caa840da78bae84d1496dd7cf70f2b4a1dc8b5cf"
        },
        {
          "name": "runheed_ignore_error",
          "title": "Ignore an error",
          "description": "Marks an error group ignored, for known or expected errors, so new occurrences stop alerting. Returns a confirmation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "errorId": {
                "description": "The error ID to ignore",
                "type": "string"
              },
              "reason": {
                "description": "Reason for ignoring this error",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ignore an error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f44340ce1b22ec2852220bf476afead861782090552ab0f5821c9366aeedcd99"
        },
        {
          "name": "runheed_resolve_error",
          "title": "Resolve an error",
          "description": "Marks an error group resolved, with an optional note such as the fixing commit. The group reopens on its own if the error happens again. Returns a confirmation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "comment": {
                "description": "Optional comment about the fix",
                "type": "string"
              },
              "errorId": {
                "description": "The error ID to resolve",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Resolve an error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f2f21e877b835ababe544ca80f0d46db3baaf38c9826d963e3576daddf177901"
        },
        {
          "name": "runheed_search_errors",
          "title": "Search errors",
          "description": "Searches the workspace's error groups by text (type, message, route, file or extra data), status and project. Returns each matching group with its status, type, message, route, top stack frame, event count, last-seen time and ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of errors to return",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "projectId": {
                "description": "Filter by project id or slug (e.g. shop-api)",
                "type": "string"
              },
              "query": {
                "description": "Text to find in the error type, message, route, stack frames or extra data, for example a route or a file name",
                "type": "string"
              },
              "status": {
                "description": "Filter by error status",
                "enum": ["unresolved", "resolved", "ignored"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search errors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d94fcefc1b52b69f8f51c5bd72053a7217700b3406b99aaf058aa39d4dac9388"
        },
        {
          "name": "runheed_unignore_error",
          "title": "Stop ignoring an error",
          "description": "Moves an ignored error group back to unresolved, so new occurrences alert again. Returns a confirmation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "errorId": {
                "description": "The error ID to unignore",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Stop ignoring an error"
          },
          "behavior": {
            "destructive": false,
