          },
          "digest": "sha256:ceda5234d5b64187c11cd7f5ac9ab15765b459fc3c26b44aa6e76ce45990468d"
        },
        {
          "name": "runheed_resolve_error",
          "title": "Resolve an error",
          "description": "Marks an error group resolved, with an optional note such as the fixing commit. The group reopens on its own if the error happens again. Returns a confirmation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "comment": {
                "description": "Optional comment about the fix",
                "type": "string"
              },
              "errorId": {
                "description": "The error ID to resolve",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Resolve an error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f2f21e877b835ababe544ca80f0d46db3baaf38c9826d963e3576daddf177901"
        },
        {
          "name": "runheed_search_errors",
          "title": "Search errors",
          "description": "Searches the workspace's error groups by text (type, message, route, file or extra data), status, project and release (including only the errors a release introduced). Returns each matching group with its status, type, message, route, top stack frame, event count, last-seen time and ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of errors to return",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "newInRelease": {
                "description": "With release: only errors that first appeared in that release, to check what a deploy introduced",
                "type": "boolean"
              },
              "projectId": {
                "description": "Filter by project id or slug (e.g. shop-api)",
                "type": "string"
              },
              "query": {
                "description": "Text to find in the error type, message, route, stack frames or extra data, for example a route or a file name",
                "type": "string"
              },
              "release": {
                "description": "Only errors with an event from this release (the release value the app passes to init, often a commit SHA)",
                "type": "string"
              },
              "status": {
                "description": "Filter by error status",
                "enum": ["unresolved", "resolved", "ignored"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search errors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aefcb055aad17d74c6126d3dc1ca8693d4a7498c349e65dc6a23ab9f46195717"
        },
        {
          "name": "runheed_send_test_event",
          "title": "Send a test event",
          "description": "Sends one test error (RunheedTestEvent) to a project through the normal ingest path, which shows whether the project and its send key work. The test error appears in the recent errors and can be resolved like any other.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "projectId": {
                "description": "Project id or slug",
                "type": "string"
              }
            },
            "required": ["projectId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send a test event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08d3c2de4c0a628f49254c8198802c7bdcace1b8f842a01cf8b9c25d5bed6fba"
        },
        {
          "name": "runheed_unignore_error",
          "title": "Stop ignoring an error",
          "description": "Moves an ignored error group back to unresolved, so new occurrences alert again. Returns a confirmation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "errorId": {
                "description": "The error ID to unignore",
                "type": "string"
              }
            },
            "required": ["errorId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Stop ignoring an error"
          },
          "behavior": {
