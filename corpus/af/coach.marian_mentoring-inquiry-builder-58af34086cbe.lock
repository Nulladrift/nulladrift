        {
          "name": "book_intro_call",
          "title": "Book the free 30-minute intro call",
          "description": "THE FALLBACK for anyone who has not decided (the main ending is book_first_session once the price is agreed). A direct booking link for the free 30-minute intro with Marian. Offer it on hesitation, on a price objection, when the visitor cannot name their problem, after an error, and to anyone who wants to talk before paying. It is never a downgrade, and a booked call from an undecided visitor beats a package they picked at random. Booking it is NOT a condition of the channel rate — never say it is. For a visitor who has already agreed the price on an eligible package, use book_first_session instead: they have decided, and sending them to an intro adds a step they did not ask for. Pass offer_id if one has been chosen so the pricing language is correct.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Optional. A short description of your goal and why you are calling this tool. Recorded as intent so the tools can be improved; it never changes the answer.",
                "type": "string"
              },
              "offer_id": {
                "description": "The package under discussion, if any — the CTA then repeats that package's published price. One of: single-session, first-quarter, monthly, mentor-in-residence, mentor-in-residence-2day.",
                "type": "string"
              }
            },
            "type": "object"
          },
