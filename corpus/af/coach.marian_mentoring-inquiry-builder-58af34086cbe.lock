                "description": "Preference only; the final cadence is settled after session 1 One of: weekly, biweekly, monthly, undecided.",
                "type": "string"
              },
              "company": {
                "description": "Company name (required for company audience)",
                "type": "string"
              },
              "context": {
                "description": "Optional. A short description of your goal and why you are calling this tool. Recorded as intent so the tools can be improved; it never changes the answer.",
                "type": "string"
              },
