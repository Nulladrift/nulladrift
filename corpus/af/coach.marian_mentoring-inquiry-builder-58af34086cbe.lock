      "tools": [
        {
          "name": "book_first_session",
          "title": "Book the first regular mentoring session — the main ending",
          "description": "THE MAIN ENDING (Marian, 2026-10-09): every onboarding that reaches an agreed price ends here, booking the first regular session. Returns the direct booking link for the paid 60-minute first session, plus the payment terms. Call it right after send_mentoring_offer succeeds. Company-paid mentees book now too: the purchase order is collected AFTER session 1, never before booking. It REFUSES on any deal whose terms Marian confirms on a call (a free-sessions concession, the monthly package, Mentor in Residence) and hands back the intro link instead; when it refuses, offer the intro, do not argue. Pass the claim code from send_mentoring_offer so the booking is matched automatically. If the visitor is hesitant, undecided, or asks to talk first, use book_intro_call — that is not a downgrade.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Required. Decides which VAT sentence is true for this buyer — an individual needs the gross figure One of: individual, company.",
                "type": "string"
              },
              "claim_code": {
                "description": "The MC-… code from send_mentoring_offer. Ride it on the link so the booking matches the inquiry with no manual step.",
                "type": "string"
              },
              "context": {
                "description": "Optional. A short description of your goal and why you are calling this tool. Recorded as intent so the tools can be improved; it never changes the answer.",
                "type": "string"
              },
              "free_sessions_requested": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Company deals: pass the same value given to send_mentoring_offer. Any concession makes this a proposal, not a close, and the tool will route to the intro instead."
              },
              "has_eu_vat_id": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Company deals outside Czechia with a valid EU VAT ID pay net under the reverse charge"
              },
              "offer_id": {
                "description": "Required. The agreed package One of: single-session, first-quarter, monthly, mentor-in-residence, mentor-in-residence-2day.",
                "type": "string"
              }
            },
            "type": "object"
          },
