              "focus_area_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Required. Agreed focus area ids (visitor can pick any from the taxonomy)"
              },
              "leaders_count": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Company deals: how many leaders are being sponsored"
              },
              "motivation": {
                "description": "Required.",
                "type": "string"
              },
              "offer_id": {
                "description": "Required. One of: single-session, first-quarter, monthly, mentor-in-residence, mentor-in-residence-2day.",
                "type": "string"
              },
              "role_band": {
                "description": "Required.",
                "type": "string"
              },
              "success_definition": {
                "description": "Required. The visitor's definition of success, in their own words",
                "type": "string"
              },
