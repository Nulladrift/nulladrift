        {
          "name": "compose_mentoring_brief",
          "title": "Compose the mentoring brief: the artifact + the authoritative price",
          "description": "The accumulator — call after every change. Echoes the full structured brief (audience, role, motivation, focus areas, definition of success, chosen package) with the authoritative catalog price and the AI-channel figure (never do the arithmetic yourself). For company deals it states whether the free-sessions concession applies. Read the brief back to the visitor; when they explicitly agree on the price, call send_mentoring_offer with price_agreed true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Required. One of: individual, company.",
                "type": "string"
              },
              "company_context": {
                "description": "Company deals: company name + anything relevant",
                "type": "string"
              },
              "context": {
                "description": "Optional. A short description of your goal and why you are calling this tool. Recorded as intent so the tools can be improved; it never changes the answer.",
                "type": "string"
