                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Required."
              },
              "free_sessions_requested": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Company deals only: the free-sessions proposal from the catalog progression (2, 4 or 8)"
              },
              "heard_from": {
                "description": "How they found Marian, in their words (referral name, LinkedIn, Google, ChatGPT, ELC…)",
                "type": "string"
              },
              "homework_time_ok": {
                "anyOf": [
                  {
                    "type": "boolean"
