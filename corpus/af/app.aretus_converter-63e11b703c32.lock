{
  "lockfileVersion": 2,
  "subjects": {
    "app.aretus/converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.aretus.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aretus-converter",
        "title": "Aretus: Publisher (.pub) converter",
        "version": "1.0.0",
        "websiteUrl": "https://aretus.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Aretus converts Microsoft Publisher (.pub) files to PDF, page images (PNG/JPG), ODG and text-only DOCX on Aretus's servers (aretus.app). It is an independent service, not affiliated with Microsoft. Previews are watermarked; downloading the converted files needs a one-time payment on aretus.app, except one free file per email address. Files are deleted 24 hours after upload.",
      "tools": [
        {
          "name": "convert_publisher_files",
          "title": "Convert Publisher (.pub) files",
          "description": "Convert Microsoft Publisher (.pub) files to PDF, page images (PNG and JPG), ODG (editable in LibreOffice Draw) and text-only DOCX. Use it when the user has .pub files, or a .zip of them, that they want to open, view, print or convert. Pass public download links in file_urls, or files the user attached in files; a .zip is unpacked and the .pub files in it are converted. The files are downloaded to and converted on Aretus's servers (aretus.app), an independent service that is not affiliated with Microsoft; results are usually close to Publisher's layout but not identical. The result lists each file's page count, warnings and watermarked preview images, the one-time price for downloading everything, and pay_url, where the user pays. One file can be downloaded free with get_free_file. Files are deleted 24 hours after upload. Waits up to about 25 seconds for the conversion; if it is still running, check again with get_conversion.",
          "inputSchema": {
            "$defs": {
              "AttachedFile": {
                "description": "A file the user attached in ChatGPT, passed by the host as a temporary download link.",
                "properties": {
                  "download_url": {
                    "description": "Temporary download URL of the attached file.",
                    "title": "Download Url",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "The host's id for the attached file.",
                    "title": "File Id",
                    "type": "string"
                  },
                  "file_name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Original file name, if known.",
                    "title": "File Name"
                  },
                  "mime_type": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "MIME type, if known.",
                    "title": "Mime Type"
                  }
                },
                "required": ["download_url", "file_id"],
                "title": "AttachedFile",
                "type": "object"
              }
            },
            "properties": {
              "file_urls": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public http(s) links to .pub or .zip files (1 to 20 in total with files).",
                "title": "File Urls"
              },
              "files": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/AttachedFile"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Files the user attached in the chat (.pub or .zip), as provided by the host.",
                "title": "Files"
              }
            },
            "title": "convert_publisher_filesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert Publisher (.pub) files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["files"]
          },
          "digest": "sha256:ce78ce81f2aafd2120b64831fdf784bf06450f153ae0b214510782de8089c9a5"
        },
        {
          "name": "get_conversion",
          "title": "Check a Publisher conversion",
          "description": "Status of a conversion started with convert_publisher_files: each file's pages, warnings and watermarked preview images, the price, and pay_url. After the user has paid on aretus.app it also returns download_url, a ZIP of every converted file (valid for about an hour).",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job_id returned by convert_publisher_files.",
                "pattern": "^[0-9a-f]{32}$",
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_conversionArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Publisher conversion"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc5a66824c2595acf00961beec9eadcbed9f0d9cbf3e3e92929415e5d7f76b47"
        },
        {
          "name": "get_free_file",
          "title": "Download one converted file free",
          "description": "Get one converted file free and without watermark: a ZIP with its PDF, ODG, DOCX and page images. Limited to one free file per email address and one per batch. It needs the user's own email address: ask the user for it and use it only with their agreement, never an address they did not give for this. Aretus keeps only a one-way hash of the address to enforce the limit and sends no email. Temporary or disposable inboxes are refused. Right after conversion the DOCX and page images may still be in the making: then it answers preparing with retry_after.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's own email address, given by the user for this.",
                "maxLength": 254,
                "title": "Email",
                "type": "string"
              },
              "file_id": {
                "description": "The file_id of a converted file, e.g. f1.",
                "pattern": "^f\\d{1,5}$",
                "title": "File Id",
                "type": "string"
              },
              "job_id": {
                "description": "The job_id returned by convert_publisher_files.",
                "pattern": "^[0-9a-f]{32}$",
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["email", "file_id", "job_id"],
            "title": "get_free_fileArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Download one converted file free"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2b2cdb33f8ec625d27aafb51680b926c0d4bd613d5900146c4a0628506c9ab8e"
        },
        {
          "name": "get_pricing",
          "title": "Aretus prices and limits",
          "description": "Prices and limits of the Aretus Publisher (.pub) converter: the one-time price by number of converted files, what is free, file size limits and how long files are kept.",
          "inputSchema": {
            "properties": {},
            "title": "get_pricingArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Aretus prices and limits"
          },
          "behavior": {
            "destructive": false,
