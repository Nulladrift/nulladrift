{
  "lockfileVersion": 2,
  "subjects": {
    "com.snapforgelab/ship-ready-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.snapforgelab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "snapforge-ship-ready-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_app",
          "title": "Ship-ready check",
          "description": "Run a passive, read-only launch check on the public URL of a live app the user owns or is authorized to test (built with Replit, Lovable or Bolt). Checks: reachable and fast, SEO title/meta, robots/sitemap, security headers, open CORS, and a dev banner left in production. Only reads what any visitor's browser already sees (homepage, response headers, robots.txt, sitemap.xml); never scans JavaScript bundles for secrets, never signs in, submits forms, writes data or reads databases. Refuse private/internal addresses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public https URL of the app to check, e.g. https://yourapp.replit.app",
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "findings": {
                "items": {
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "fix_prompt": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "severity": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "id", "severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "free_audit": {
                "type": "string"
              },
              "http_status": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "reachable": {
                "type": "boolean"
              },
              "response_ms": {
                "type": ["number", "null"]
              },
              "stack": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["findings", "free_audit", "reachable", "stack", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ship-ready check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88ff0cb3597371a2144c2698137625261071c5b2f468c3f309296a10673e9121"
        },
        {
          "name": "get_fix_prompt",
          "title": "Get fix prompt",
          "description": "Return a paste-ready prompt to fix a specific issue in the user's builder (Replit Agent, Lovable or Bolt). Use the issue id from check_app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "builder": {
                "enum": ["replit", "lovable", "bolt"],
                "type": "string"
              },
              "issue": {
                "enum": ["missing_security_headers", "open_cors", "sitemap_returns_html", "missing_title_meta", "dev_banner_in_prod", "app_down"],
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "builder": {
                "type": "string"
              },
              "fix_prompt": {
                "type": "string"
              },
              "issue": {
                "type": "string"
              }
            },
            "required": ["builder", "fix_prompt", "issue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get fix prompt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:741c7f6d73a5b79a72f627fb016268dd7a41814251cd1faff0093ed929225b04"
        }
      ],
      "digest": "sha256:a1c9bf202c5a56ad91823fb25bf160ae081eef0b9fc0226b4ae661c5c6be5637"
    }
  }
}
