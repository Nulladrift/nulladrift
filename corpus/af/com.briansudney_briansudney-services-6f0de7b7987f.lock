          "name": "check_fit",
          "title": "Match a need to a service",
          "description": "Matches a stated need against the published services using the signal words in the facts file. Deterministic matching only; when nothing matches, it says so and returns the full list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "The need, in the asker's words, up to 500 characters.",
                "type": "string"
              },
              "source": {
                "description": "Optional caller label used to tag returned links, letters, digits and hyphens, up to 24 characters.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
