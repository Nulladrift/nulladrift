        "name": "Vinhozinho",
        "title": "Vinhozinho · Mais Vinho · Menos Frescura",
        "version": "1.0.0-barrica",
        "websiteUrl": "https://vinhozinho.com.br/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
