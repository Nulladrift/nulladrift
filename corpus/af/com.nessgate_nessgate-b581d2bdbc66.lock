{
  "lockfileVersion": 2,
  "subjects": {
    "com.nessgate/nessgate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nessgate.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nessgate",
        "title": "NessGate — the neutral resolver for the agentic web",
        "version": "1.22.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Three read-only tools. discover_domain: what a domain publishes (the raw normalized list). connect_domain: given a domain AND your client's capabilities, HOW to connect — one outcome (ready | credentials-required | incomplete | broken | no-compatible-method) with a connection plan, or the exact missing field. check_readiness: per-endpoint readiness for a domain, client-agnostic. All read the domain live, store no discovered domain or resource data, make no ownership/safety claim; credentials stay with the caller.",
      "tools": [
        {
          "name": "check_readiness",
          "title": "Check how ready a domain's endpoints are to connect to",
          "description": "Given a domain, return each connectable resource it publishes with a readiness assessment (ready | credentials-required | incomplete | broken, with the exact missing field) read from the service's own metadata. Client-agnostic; read-only. Use connect_domain when you know the client's capabilities.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Registrable domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32552a965929d05d756eb9b20f75acbc554ebb054359559803c73cd033fe3717"
        },
        {
          "name": "connect_domain",
          "title": "Get a connection plan for this client",
          "description": "Given a domain AND the calling client's capabilities, return HOW the client can connect: one outcome (ready | credentials-required | incomplete | broken | no-compatible-method) with a connection plan (protocol, endpoint, transport, version, and the auth metadata the service published — e.g. the OAuth authorize/token endpoints and scopes), or the exact missing field when the service under-publishes. Deterministic matching, no scores. Read-only; credentials stay with the caller and are never sent to NessGate.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "The calling client's capabilities. Omit a dimension to accept any. If client/supports is omitted entirely, a broad default (mcp, openapi, a2a) is assumed and the response carries clientAssumed:true.",
                "properties": {
                  "prefer": {
                    "description": "Optional cross-protocol tie-break order.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "supports": {
                    "description": "Protocols the client speaks, each optionally narrowing versions/transports/auth.",
                    "items": {
                      "properties": {
                        "auth": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "protocol": {
                          "description": "e.g. mcp, openapi, a2a",
                          "type": "string"
                        },
                        "transports": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "versions": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["protocol"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "domain": {
                "description": "Registrable domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1626d7479ab59a96d0bc725450fb19beb55e40efb177e986be1f110bc9fafa5"
        },
        {
          "name": "discover_domain",
          "title": "Resolve a domain's machine-readable resources",
          "description": "Given a domain, read whatever it publishes at the standard machine-discovery locations (llms.txt, /.well-known/ard.json, /.well-known/agent-card.json, /.well-known/api-catalog, ai-info.json, openapi.json, and more) and return one normalized answer. Each resource keeps a sourceUrl pointing back to the domain so the caller can verify. NessGate reads the domain live and stores no discovered domain or resource data; it makes no ownership or safety claim.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Registrable domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d3259fcb65d8e01cd8c1d6da4dc118887cef3994d940bfd2c57b0bd8cd328ca"
        }
      ],
      "digest": "sha256:1d1ffb17fbad2fb01ab0f1448a9207c2dab050a1f58cbf41cd491cfc783072b7"
    }
  }
}
