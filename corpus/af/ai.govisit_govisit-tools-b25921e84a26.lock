        {
          "name": "search_places",
          "title": "Search places",
          "description": "For faster searches, pass a known country or destination code. Unscoped name lookups search all covered countries. Search published places by name or traveler intent. mode defaults to auto: exact names avoid embedding, otherwise combine name and intent candidates without duplicate IDs. Explicit name never embeds. A destination page supplies its scope; country, destination and near intersect and never widen. Scoped names and proximity require a geography-enabled index release; older releases report unavailable constraints. At most 200 candidate records are examined before returning up to 20 items, with counts/truncation; a missing result is not proof of invisibility everywhere. Distance is geographic meters, not walking time. Scores and profile quality are retrieval signals, not proof of amenities or suitability. Intent uses one query embedding.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "intent"
                    }
                  },
                  "required": ["mode"]
                },
