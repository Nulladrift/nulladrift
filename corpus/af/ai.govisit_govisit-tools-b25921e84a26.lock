        {
          "name": "search_availability",
          "title": "Search availability",
          "description": "Find bookable options for supported hotels, restaurants, tours, activities and experiences, and transport services. Search using the requested dates or time and party size. Returns matching options, rates or prices when supplied, and a prefilled booking URL where available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Number of adults staying in one room.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "checkIn": {
                "description": "Check-in date in the hotel’s local calendar, in YYYY-MM-DD format.",
                "format": "date",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date in YYYY-MM-DD format, after check-in.",
                "format": "date",
                "type": "string"
              },
              "childAges": {
                "description": "Each child’s age at check-in. Omit when no children are traveling. Some providers only support adults.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 13,
                "type": "array"
              },
              "currency": {
                "default": "EUR",
                "description": "Requested quote currency. Defaults to EUR. Unsupported currencies are returned without substitution.",
                "enum": ["EUR", "USD", "CAD", "GBP", "AUD", "JPY", "CZK"],
                "type": "string"
              },
              "pagePath": {
                "description": "Canonical GoVisit page path supplying this tool's published context; no origin, query or fragment.",
                "examples": ["/en/places/94a68698-eba7-4e36-9cac-fb95fe8d9da2"],
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "pagePath"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "else": {
                  "properties": {
                    "bookingUrl": {
                      "type": "null"
                    },
                    "bookingUrlScope": {
                      "type": "null"
                    },
                    "offers": {
                      "maxItems": 0
                    }
                  }
                },
                "if": {
                  "properties": {
                    "status": {
                      "const": "available"
                    }
                  }
                },
                "then": {
                  "properties": {
                    "observedAt": {
                      "type": "string"
                    },
                    "offers": {
                      "minItems": 1
                    }
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "status": {
                      "const": "sold_out"
                    }
                  }
                },
                "then": {
                  "properties": {
                    "observedAt": {
                      "type": "string"
                    }
                  }
                }
              }
