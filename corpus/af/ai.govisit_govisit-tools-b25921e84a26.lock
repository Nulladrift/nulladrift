        {
          "name": "search_places",
          "title": "Search places",
          "description": "Find GoVisit places by name or by what the traveler wants to do. Use it to identify a specific place or build a shortlist within the requested geography. Returns matching places with profile links, the search scope, and any coverage limits.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "intent"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "properties": {
                    "query": {
                      "minLength": 3
                    }
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "name"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "properties": {
                    "limit": {
                      "maximum": 10
                    },
                    "query": {
                      "maxLength": 120
                    }
                  }
                }
              }
            ],
            "properties": {
              "country": {
                "description": "Two-letter ISO country code. Supply it when the country is known to narrow the search. Intersects destination and proximity where the public geography projection is available.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Stable destination code or all. Defaults to the current destination, otherwise all.",
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_]*$",
                "type": "string"
              },
              "language": {
                "description": "Requested response language; defaults to the page language.",
                "enum": ["en", "cs"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of places to return. Defaults to 10. Name mode allows up to 10. Other modes allow up to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "auto",
                "description": "Name lookup, intent retrieval, or name-first auto discovery.",
                "enum": ["auto", "name", "intent"],
                "type": "string"
              },
              "near": {
                "additionalProperties": false,
                "description": "Proximity filter with a radius in meters. Supply either a GoVisit place ID or explicit coordinates as the reference.",
                "oneOf": [
                  {
                    "not": {
                      "required": ["coordinates"]
                    },
                    "required": ["placeId"]
                  },
                  {
                    "not": {
                      "required": ["placeId"]
                    },
                    "required": ["coordinates"]
                  }
                ],
                "properties": {
                  "coordinates": {
                    "additionalProperties": false,
                    "description": "Reference point in latitude and longitude.",
                    "properties": {
                      "latitude": {
