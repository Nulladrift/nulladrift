        {
          "name": "search_destinations",
          "title": "Search destinations",
          "description": "Search published destinations by name or traveler intent. mode defaults to auto: exact name matches avoid embedding; otherwise name and intent results are combined. Explicit name never embeds; intent always searches by meaning. Returns stable destination codes, public URLs, match method, scope and index release. Optional within and types filter canonical geography before ranking; they require a geography-enabled release. Whole-Division containment takes precedence over a default hierarchy parent for cross-border destinations; unknown scope is never assumed. Types are published classifications, not population or city tiers.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "intent"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "properties": {
                    "query": {
                      "minLength": 3
                    }
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "name"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "properties": {
                    "query": {
                      "maxLength": 120
                    }
                  }
                }
              }
            ],
            "properties": {
              "language": {
                "description": "Requested response language; defaults to the page language.",
                "enum": ["en", "cs"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "auto",
                "description": "Name lookup, intent retrieval, or name-first auto discovery.",
                "enum": ["auto", "name", "intent"],
                "type": "string"
              },
              "query": {
                "description": "Place or destination name, or the traveler's intent.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "types": {
                "description": "Match any of these published classifications; not a size/tier filter.",
                "items": {
                  "enum": ["country", "region", "district", "city", "highlight"]
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "within": {
                "description": "Canonical destination code to explore within; all is reserved for an explicit unrestricted place search, never a containing-destination filter.",
                "maxLength": 64,
                "not": {
                  "pattern": "^[aA][lL][lL]$"
                },
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_]*$",
                "type": "string"
              }
            },
            "required": ["query"],
