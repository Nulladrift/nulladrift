                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      "longitude": {
                        "description": "Reference longitude in decimal degrees.",
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      }
                    },
                    "required": ["latitude", "longitude"],
                    "type": "object"
                  },
                  "placeId": {
