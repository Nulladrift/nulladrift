        {
          "name": "request_booking",
          "title": "Send a booking request",
          "description": "Send a chauffeured transportation request to BlackCarLimousineService.ca for the traveller. Only call when the traveller explicitly asked to book. Returns a reference (BCS-XXXXXXX); the team confirms price, vehicle and chauffeur by email or phone. Not confirmed until then; nothing is charged.",
          "inputSchema": {
