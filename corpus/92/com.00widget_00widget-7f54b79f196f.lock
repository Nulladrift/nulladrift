                            "type": "object"
                          },
                          "role": {
                            "default": "normal",
                            "description": "`destructive` marks the button as dangerous and stops it running from a widget; it routes through the iOS app for confirmation instead.",
                            "enum": ["normal", "destructive"],
                            "type": "string"
                          },
                          "webhookId": {
                            "description": "Named action webhook that receives this button press. Omit for the default webhook. Write-only: it is stripped from the stored card and never returned by reads or shares.",
                            "maxLength": 96,
                            "minLength": 1,
                            "pattern": "^[A-Za-z0-9._:-]+$",
