        {
          "name": "get_integration_guide",
          "title": "Read the 00Widget integration guide",
          "description": "The rules no argument schema can carry: which template fits which shape of data, what a Live Activity freezes at start, and what publishing etiquette costs you if you ignore it. Read it before publishing for the first time. ALWAYS pass `section`: pick `cards` or `live-activities` for the surface you decided on, which is half the size of the default and all of it relevant. Only fall back to `essentials` if you genuinely do not know yet which of the two you are publishing to.",
          "inputSchema": {
            "properties": {
              "section": {
                "default": "essentials",
                "description": "Which part to return; pick by what you have already decided to publish. `cards` — dashboard cards: the templates, chart semantics and item rows. `live-activities` — starting, updating and ending a run on the Lock Screen. `actions` — the shape of a button on a card. `essentials` (the default) is `cards` AND `live-activities` together, so it is roughly twice the size of either and half of it will be about the surface you are not using; take it only when you do not yet know which you need. `everything` is the full public document, including the HTTP and code-level material an MCP client has no use for. Every section names what it omits and where to find it, so narrowing costs you nothing you cannot ask for.",
                "enum": ["essentials", "cards", "live-activities", "actions", "everything"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "markdown": {
                "description": "The requested integration guide as Markdown.",
                "type": "string"
              },
              "section": {
                "description": "The guide section that was returned.",
                "enum": ["essentials", "cards", "live-activities", "actions", "everything"],
                "type": "string"
              }
            },
            "required": ["markdown", "section"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the 00Widget integration guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f47854da2f8c530d648d836aba7475c8fd96d4a3a5ccd3b0d56f782a3f8afb08"
        },
        {
          "name": "get_status",
          "title": "Check what this connection can reach",
          "description": "Whether anything will actually see what you publish, what this credential may do, how much rate budget is left, and what this deployment has enabled. Worth one call before publishing for the first time: if `delivery.canPushWidgets` is false, nothing you publish will be seen by anyone, and the operator needs to install the app and allow notifications rather than you trying again. `attention.liveActivities` names any activity of yours that has stopped telling the operator the truth; it is empty when there is nothing wrong.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "account": {
                "additionalProperties": true,
                "properties": {
                  "credentialExpiresAt": {
                    "type": "string"
                  },
                  "credentialKind": {
                    "type": "string"
                  },
                  "scopes": {
                    "description": "What this credential may do.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tenantId": {
                    "type": "string"
                  }
                },
                "required": ["credentialExpiresAt", "credentialKind", "scopes", "tenantId"],
                "type": "object"
              },
              "attention": {
                "additionalProperties": true,
                "properties": {
                  "liveActivities": {
                    "description": "Activities you own that are not telling the operator the truth. `past-stale-date` means the safety net worked and iOS is already drawing it as out of date, but the run outlived its estimate and needs updating or ending. `no-stale-date` is the dangerous one: nothing will ever mark it stale, so a Lock Screen shows its last state as current indefinitely — send `staleAt` on the next update. Empty when there is nothing to say; activities shared to you are never listed, because you cannot update them.",
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "externalActivityId": {
                          "type": "string"
                        },
                        "reason": {
                          "enum": ["no-stale-date", "past-stale-date"],
                          "type": "string"
                        },
                        "secondsSinceUpdate": {
                          "type": "number"
                        },
                        "staleAt": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "required": ["externalActivityId", "reason", "secondsSinceUpdate", "staleAt"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["liveActivities"],
                "type": "object"
              },
              "delivery": {
                "additionalProperties": true,
                "properties": {
                  "canPushWidgets": {
                    "description": "False means no device can receive a widget reload: what you publish is stored and seen by nobody.",
                    "type": "boolean"
                  },
                  "canStartLiveActivities": {
                    "description": "False means a Live Activity cannot appear on any device.",
                    "type": "boolean"
                  },
                  "devices": {
                    "type": "number"
                  },
                  "liveActivityStartTokens": {
                    "description": "Devices a Live Activity start is sent to. Devices that have not run the app in 30 days are not counted and are not sent starts.",
                    "type": "number"
                  },
                  "liveActivityStartTokensRecentlyActive": {
                    "description": "Of those, devices that have run the app in the last 7 days.",
                    "type": "number"
                  },
                  "secondsUntilNextWidgetReload": {
                    "type": "number"
                  },
                  "widgetPushApnsDiagnosticsEnabled": {
                    "description": "Whether this deployment is recording the APNs result of each widget reload. Off normally, because every attempt costs a row written.",
                    "type": "boolean"
                  },
                  "widgetPushLastDeliveries": {
                    "description": "The latest APNs result per registered widget push token, newest first. Only present while diagnostics are enabled.",
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "apnsId": {
                          "description": "APNs' own id for the push.",
                          "type": "string"
                        },
                        "attemptedAt": {
                          "type": "string"
                        },
                        "attempts": {
                          "description": "How many times this reload was tried before giving up.",
                          "type": "number"
                        },
                        "reason": {
                          "description": "APNs failure reason, when it failed.",
                          "type": "string"
                        },
                        "status": {
                          "description": "The HTTP status APNs answered with; 200 is delivered.",
                          "type": "number"
                        },
                        "tokenPrefix": {
                          "description": "First 8 characters of the push token, enough to tell devices apart.",
                          "type": "string"
                        }
                      },
                      "required": ["attemptedAt", "attempts", "status"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "widgetPushTokens": {
                    "type": "number"
                  },
                  "widgetReloadBurst": {
                    "description": "How many reloads a widget may receive back-to-back after a quiet stretch.",
                    "type": "number"
                  },
                  "widgetReloadMinSpacingSeconds": {
                    "description": "The shortest gap between two reload pushes to the same widget.",
                    "type": "number"
                  },
                  "widgetReloadRefillSeconds": {
                    "description": "How often one additional widget reload becomes available.",
                    "type": "number"
                  }
                },
                "required": ["canPushWidgets", "canStartLiveActivities", "devices", "liveActivityStartTokens", "liveActivityStartTokensRecentlyActive", "secondsUntilNextWidgetReload", "widgetPushApnsDiagnosticsEnabled", "widgetPushTokens", "widgetReloadBurst", "widgetReloadMinSpacingSeconds", "widgetReloadRefillSeconds"],
                "type": "object"
              },
              "features": {
                "additionalProperties": true,
                "properties": {
                  "mcp": {
                    "type": "boolean"
                  },
                  "sharing": {
                    "type": "boolean"
                  }
                },
                "required": ["mcp", "sharing"],
                "type": "object"
              },
              "published": {
                "additionalProperties": true,
                "properties": {
                  "cards": {
                    "type": "number"
                  },
                  "liveActivities": {
                    "type": "number"
                  }
                },
                "required": ["cards", "liveActivities"],
                "type": "object"
              },
              "rateLimits": {
                "description": "Only windows this account has touched; anything absent has its full allowance.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "limit": {
                      "type": "number"
                    },
                    "remaining": {
                      "type": "number"
                    },
                    "resetAt": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "limit", "remaining", "resetAt"],
                  "type": "object"
                },
                "type": "array"
              },
              "subscription": {
                "additionalProperties": true,
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "required": {
                    "description": "Whether writes are refused without an active subscription.",
                    "type": "boolean"
                  },
                  "state": {
                    "additionalProperties": true,
                    "properties": {
                      "active": {
                        "type": "boolean"
                      },
                      "autoRenew": {
                        "type": "boolean"
                      },
                      "environment": {
                        "type": "string"
                      },
                      "expiresAt": {
                        "type": "string"
                      },
                      "productId": {
                        "type": "string"
                      },
                      "provider": {
                        "enum": ["apple", "meta"],
                        "type": "string"
                      },
                      "status": {
                        "enum": ["active", "trial", "grace", "expired", "revoked", "none"],
                        "type": "string"
                      }
                    },
                    "required": ["active", "status"],
                    "type": "object"
                  }
                },
                "required": ["enabled", "required"],
                "type": "object"
              }
            },
            "required": ["account", "attention", "delivery", "features", "published", "rateLimits", "subscription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check what this connection can reach"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:372f2827c4cd82ca815996198ed9b9d89f5259c4fb71ff2c3662817fa64e2f9a"
        },
        {
          "name": "list_cards",
          "title": "List cards",
          "description": "List every dashboard card this credential's tenant has published, as stored. Use it to discover the ids already in use before publishing, and to read back what a widget shows.",
          "inputSchema": {
            "properties": {
              "includeShared": {
                "description": "Also return cards other tenants have shared with this one, when sharing is enabled.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "actions": {
                      "items": {
                        "additionalProperties": true,
                        "properties": {
                          "confirm": {
                            "default": false,
                            "description": "Ask the person before running. Also stops the button running from a widget, for the same reason `role: destructive` does.",
                            "type": "boolean"
                          },
                          "confirmation": {
                            "additionalProperties": true,
                            "description": "Custom copy for the foreground confirmation alert. Older actions may omit it; clients then explain that 00Widget will send the named action for the card.",
                            "properties": {
                              "message": {
                                "description": "Plain-language consequence shown beneath the confirmation title.",
                                "type": "string"
                              },
                              "title": {
                                "description": "Question shown as the confirmation title, such as \"Approve launch?\".",
                                "type": "string"
                              }
                            },
                            "required": ["message", "title"],
                            "type": "object"
                          },
                          "id": {
                            "description": "Stable id for the button. It is the `/v1/actions/<id>/run` path segment and is echoed back in the webhook delivery.",
                            "type": "string"
                          },
                          "label": {
                            "description": "What the button says. Short enough for a widget: \"Boost 1h\", \"Retry\".",
                            "type": "string"
                          },
                          "role": {
                            "default": "normal",
                            "description": "`destructive` marks the button as dangerous and stops it running from a widget; it routes through the iOS app for confirmation instead.",
                            "enum": ["normal", "destructive"],
                            "type": "string"
                          }
                        },
                        "required": ["confirm", "id", "label", "role"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "briefing": {
                      "additionalProperties": true,
                      "description": "Ordered prose behind a `briefing` card. Keep `value` as the compact conclusion and `subtitle` as its first explanation: old clients render the unknown template as a summary and still show both.",
                      "properties": {
                        "sections": {
                          "description": "Progressive details, most important first. The card's value and subtitle are the compact conclusion and old-client fallback.",
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "id": {
                                "description": "Stable id for this detail. Order sections from most important to least: smaller surfaces show only a prefix.",
                                "type": "string"
                              },
                              "label": {
                                "description": "Optional short heading such as Cause, Impact, or Next.",
                                "type": "string"
                              },
                              "text": {
                                "description": "One self-contained plain-text detail. Do not send Markdown. Make it useful without relying on a later section, because smaller widgets may stop here.",
                                "type": "string"
                              }
                            },
                            "required": ["id", "text"],
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["sections"],
                      "type": "object"
                    },
                    "chart": {
                      "additionalProperties": true,
                      "description": "The series behind a `chart` card. Republish the whole window every time — nothing is appended and no history is kept.",
                      "properties": {
                        "categories": {
                          "description": "Rich categories aligned with points. Use category signal for meanings that vary per bar, such as favorable off-peak and unfavorable peak periods. The server derives labels.",
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "id": {
                                "description": "Stable category id for the time period or bucket.",
                                "type": "string"
                              },
                              "label": {
                                "description": "Short display label. The server derives the legacy labels array from categories.",
                                "type": "string"
                              },
                              "signal": {
                                "description": "Contextual interpretation of this category, such as a favorable off-peak or unfavorable peak period.",
                                "enum": ["favorable", "neutral", "caution", "unfavorable"],
                                "type": "string"
                              }
                            },
                            "required": ["id", "label"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "labels": {
                          "description": "Optional category labels aligned with points. Small surfaces omit them; large widgets and detail views show a readable subset.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "max": {
                          "description": "Pins the top of the plot.",
                          "type": "number"
                        },
                        "min": {
                          "description": "Pins the bottom of the plot. Without a range the plot scales to the series, so a flat-but-noisy one looks dramatic. Send at least `min: 0` whenever the absolute scale is the point.",
                          "type": "number"
                        },
                        "points": {
                          "description": "2-60 values, oldest first, plotted evenly spaced. There are no timestamps: send a fixed rolling window. The small surfaces — Lock Screen, small widget, grid cells — average a long series down to what they can draw, so the window you send is always the window shown; send the resolution the data actually has.",
                          "items": {
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "rangeValueLabel": {
                          "description": "Short meaning shared by every supplied ranges[].value marker, such as Daily average, Median, or Current. Omit it rather than guessing.",
                          "type": "string"
                        },
                        "ranges": {
                          "description": "Two to sixty low/high intervals. The server derives legacy points from each value, or from its midpoint when value is absent.",
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "high": {
                                "description": "Top of the observed or expected interval.",
                                "type": "number"
                              },
                              "low": {
                                "description": "Bottom of the observed or expected interval.",
                                "type": "number"
                              },
                              "value": {
                                "description": "Optional representative value marked inside the interval. Its meaning is supplied by the chart's rangeValueLabel; clients never infer one.",
                                "type": "number"
                              }
                            },
                            "required": ["high", "low"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "reference": {
                          "description": "A target, budget, SLO or threshold, drawn as a dashed rule across the plot. Usually the difference between a trend you can read and one you can act on, because above-or-below needs no axis labels. The rule has no numeric label; when its exact value matters, lead the card's short `subtitle` with its formatted meaning and value.",
                          "type": "number"
                        },
                        "referenceMetadata": {
                          "additionalProperties": true,
                          "description": "Optional label and semantic meaning for the numeric reference. Kept separate so older clients still receive and draw the legacy reference number.",
                          "properties": {
                            "label": {
                              "description": "Short name for the rule, such as Target, Baseline, Budget, or Capacity.",
                              "type": "string"
                            },
                            "semantic": {
                              "additionalProperties": true,
                              "description": "Meaning of the rule. Renderers choose its color, dash, emphasis, and accessibility wording.",
                              "properties": {
                                "flow": {
                                  "description": "Whether a quantity flows into or out of the measured system.",
                                  "enum": ["inbound", "outbound"],
                                  "type": "string"
                                },
                                "role": {
                                  "description": "What the series represents; affects emphasis and fill treatment, never a producer-selected color.",
                                  "enum": ["actual", "forecast", "baseline", "target", "capacity", "balance", "remainder"],
                                  "type": "string"
                                },
                                "signal": {
                                  "description": "Contextual interpretation from the producer's perspective, not an intrinsic property of the value.",
                                  "enum": ["favorable", "neutral", "caution", "unfavorable"],
                                  "type": "string"
                                }
                              },
                              "type": "object"
                            }
                          },
                          "type": "object"
                        },
                        "semantic": {
                          "additionalProperties": true,
                          "description": "Meaning shared by a single points or range series and inherited by any multi-series entry that omits a semantic dimension.",
                          "properties": {
                            "flow": {
                              "description": "Whether a quantity flows into or out of the measured system.",
                              "enum": ["inbound", "outbound"],
                              "type": "string"
                            },
                            "role": {
                              "description": "What the series represents; affects emphasis and fill treatment, never a producer-selected color.",
                              "enum": ["actual", "forecast", "baseline", "target", "capacity", "balance", "remainder"],
                              "type": "string"
                            },
                            "signal": {
                              "description": "Contextual interpretation from the producer's perspective, not an intrinsic property of the value.",
                              "enum": ["favorable", "neutral", "caution", "unfavorable"],
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "series": {
                          "description": "One to four semantic series for vertical bars, stacked or grouped when multiple. The server derives legacy points as their totals for older clients.",
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "id": {
                                "description": "Stable series id, used to keep renderer-owned presentation consistent.",
                                "type": "string"
                              },
                              "label": {
                                "description": "Short legend label.",
                                "type": "string"
                              },
                              "points": {
                                "description": "Non-negative values aligned one-for-one with every other series, label, and category.",
                                "items": {
                                  "type": "number"
                                },
                                "type": "array"
                              },
                              "semantic": {
                                "additionalProperties": true,
                                "description": "Optional role, flow, and contextual signal hints. Renderers choose all actual colors and patterns.",
                                "properties": {
                                  "flow": {
                                    "description": "Whether a quantity flows into or out of the measured system.",
                                    "enum": ["inbound", "outbound"],
                                    "type": "string"
                                  },
                                  "role": {
                                    "description": "What the series represents; affects emphasis and fill treatment, never a producer-selected color.",
                                    "enum": ["actual", "forecast", "baseline", "target", "capacity", "balance", "remainder"],
                                    "type": "string"
                                  },
                                  "signal": {
                                    "description": "Contextual interpretation from the producer's perspective, not an intrinsic property of the value.",
                                    "enum": ["favorable", "neutral", "caution", "unfavorable"],
                                    "type": "string"
                                  }
                                },
                                "type": "object"
                              }
                            },
                            "required": ["id", "label", "points"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "stacking": {
                          "default": "stacked",
                          "description": "How multiple bar series share each category: stacked into one column or grouped side by side.",
                          "enum": ["stacked", "grouped"],
                          "type": "string"
                        },
                        "style": {
                          "default": "line",
                          "description": "`line` is a sparkline with a soft area fill; `bar` grows every bar from the bottom of the range; `delta` anchors at zero instead, so signed values grow up or down from a zero rule; `range` draws floating low/high intervals with optional publisher-defined value markers.",
                          "enum": ["line", "bar", "delta", "range"],
                          "type": "string"
                        }
                      },
                      "required": ["points", "stacking", "style"],
                      "type": "object"
                    },
                    "comparison": {
                      "additionalProperties": true,
                      "description": "A concise interpretation beside the headline, for example +18 vs Monday. This is distinct from chart style `delta`, which controls bar geometry.",
                      "properties": {
                        "label": {
                          "description": "What the change is compared with, such as vs Monday or from last week.",
                          "type": "string"
                        },
                        "signal": {
                          "default": "neutral",
                          "description": "Whether this change is favorable, neutral, cautionary, or unfavorable in context.",
                          "enum": ["favorable", "neutral", "caution", "unfavorable"],
                          "type": "string"
                        },
                        "value": {
                          "description": "Already-formatted change, such as +18 or -12%.",
                          "type": "string"
                        }
                      },
                      "required": ["label", "signal", "value"],
                      "type": "object"
                    },
                    "deadline": {
                      "type": "string"
                    },
                    "deepLink": {
                      "description": "HTTPS URL opened when the card is tapped. Point it at the dashboard or detail page this card summarises.",
                      "format": "uri",
                      "type": "string"
                    },
                    "icon": {
                      "description": "SF Symbol name for the card: sun.max, bolt.car, flame, washer, creditcard.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable identity of the thing being shown, reused on every publish so the card updates rather than duplicating. Never embed a timestamp or run id. Namespace it if another integration might pick the same name.",
                      "type": "string"
                    },
                    "items": {
                      "description": "Rows. A `list` shows them as rows, ranked as bars when they carry an `amount`; a `history` draws their `status` as pips, oldest first; a `breakdown` splits one bar by their `amount`.",
                      "items": {
                        "additionalProperties": true,
                        "properties": {
                          "amount": {
                            "description": "The row's magnitude, used to draw it: ranked bars in a `list` (measured against the largest row) or proportional segments in a `breakdown` (measured against the total, so never send percentages). Send it alongside `value`, not instead of it — `value` is the label.",
                            "type": "number"
