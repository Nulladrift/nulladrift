        {
          "name": "upsert_cards_batch",
          "title": "Publish several cards at once",
          "description": "Create or replace up to 32 cards in one call. Always prefer this over repeated upsert_card when one snapshot produces several related cards: it makes a single widget-reload decision instead of burning WidgetKit's daily reload budget once per card. Set `replacePrefix` to your own id namespace and the snapshot also deletes what it no longer contains, which is the only way to stop reporting something without leaving a dead card behind.",
          "inputSchema": {
            "properties": {
              "cards": {
                "description": "Every card from one producer snapshot, sent together. Ids must be unique within the batch. This is one coalesced widget-reload decision instead of one per card, which is why it is preferred over looping the single-card endpoint.",
                "items": {
                  "properties": {
                    "actions": {
                      "description": "Buttons. They are not tied to `template: action` — any template can carry them, so a `chart` card can plot a series and offer a Retry button. `action` is simply the template whose whole point is the buttons, with no visual of its own. How many are drawn depends on the surface: a small widget shows 1, medium 2, large and extra-large 4, and the iOS app and Apple TV show all of them; the Lock Screen accessories show none, and a widget the operator has set to Compact density shows one fewer (none at all on a small one). Order them most useful first, because the tail is what gets cut. Only `role: normal` with `confirm: false` can run straight from a widget; anything else routes through the iOS app for confirmation. A press is delivered to the action's private `webhookId`, or to the account's `default` webhook when none is set. The destination must already be registered under `/v1/integrations/` or the press fails with a 409. Registration needs the `webhook:manage` scope, which an MCP credential does not have — the operator registers webhooks with an API token, from whatever runs each endpoint.",
                      "items": {
                        "properties": {
                          "confirm": {
                            "default": false,
                            "description": "Ask the person before running. Also stops the button running from a widget, for the same reason `role: destructive` does.",
                            "type": "boolean"
                          },
                          "confirmation": {
                            "description": "Custom copy for the foreground confirmation alert. Older actions may omit it; clients then explain that 00Widget will send the named action for the card.",
                            "properties": {
                              "message": {
                                "description": "Plain-language consequence shown beneath the confirmation title.",
                                "maxLength": 240,
                                "minLength": 1,
                                "type": "string"
                              },
                              "title": {
                                "description": "Question shown as the confirmation title, such as \"Approve launch?\".",
                                "maxLength": 120,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["message", "title"],
                            "type": "object"
                          },
                          "id": {
                            "maxLength": 96,
                            "minLength": 1,
                            "pattern": "^[A-Za-z0-9._:-]+$",
                            "type": "string"
                          },
                          "label": {
                            "description": "What the button says. Short enough for a widget: \"Boost 1h\", \"Retry\".",
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "payload": {
                            "additionalProperties": {
                              "maxLength": 512,
                              "type": "string"
                            },
                            "description": "Private context delivered to your webhook when the button is pressed. Write-only: it is stripped from the stored card and never returned by any read, shared card, or device cache.",
                            "propertyNames": {
                              "maxLength": 64,
                              "minLength": 1,
                              "type": "string"
