        {
          "name": "save_cards",
          "title": "Save to my cards",
          "description": "Save flash cards to the learner's bag: words, phrases, idioms, sentences or patterns they engaged with, at or just above their level. Takes 1 to 6 cards a call, each with its front, back and the sentence where it was met; a card already in the bag gets the new example. Returns the saved and skipped cards and the bag's count and limit.",
          "inputSchema": {
            "properties": {
              "cards": {
                "items": {
                  "properties": {
                    "back": {
                      "description": "The meaning, at most 6 words, in the learner's support language.",
                      "type": "string"
                    },
                    "example": {
                      "description": "The sentence where the learner met it, copied exactly.",
                      "type": "string"
                    },
                    "front": {
                      "description": "The card's general form: a word's dictionary form (a noun with de/het where the language needs it), a pattern's frame with … for the open part.",
                      "type": "string"
                    },
                    "image": {
                      "description": "A library picture id, or the concept a picture was requested under.",
                      "type": "string"
                    },
                    "key": {
                      "description": "The dictionary form, lowercase; a pattern's frame (\"om … te\").",
                      "type": "string"
                    },
                    "kind": {
                      "description": "One of: word (one word, in its dictionary form), phrase (a fixed group of words whose meaning comes from its words: a collocation or set expression, \"een afspraak maken\"), idiom (a fixed expression whose meaning does not come from its words, \"iets onder de knie hebben\"), sentence (a whole sentence or clause with its verb, kept as met), pattern (a structure with open slots, \"om … te\"), rule (how a part of the grammar works), exception (a form that breaks a rule), concept (a named idea of the language or its culture: a split verb, de/het), tip (a way to learn or to pass the exam). Choose the most specific one that fits. A whole sentence or clause with its verb is a sentence, never a phrase; a phrase or idiom is a unit smaller than that. A fixed group whose meaning you get by reading its words is a phrase; one whose meaning you cannot get from its words is an idiom. Another word only if none fits.",
                      "type": "string"
                    },
                    "lang": {
                      "description": "BCP 47 code of the card's language.",
                      "type": "string"
                    }
                  },
                  "required": ["back", "example", "front", "key", "kind", "lang"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "material": {
                "description": "The lesson the cards come from, when there is one.",
                "type": "string"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
