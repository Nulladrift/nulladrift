      "serverInfo": {
        "name": "assay-systems-register",
        "title": "Assay Systems — public procurement register",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public procurement register of 70 countries (contracts, suppliers, buyers). Open tools are free; assay_supplier_contracts, assay_line_contracts, assay_ending and assay_solo need an Enterprise Data key (X-API-Key header, https://assay-systems.com/api-key/#data). Source and licence come with every answer. Web: https://assay-systems.com",
      "tools": [
        {
          "name": "assay_contract",
          "title": "Contract record",
          "description": "One contract or award record from the register.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code in lower case, e.g. ca, us, gb, ua. assay_countries lists them.",
                "type": "string"
              },
              "id": {
                "description": "Record id as given by assay_search (the part after the country in the endpoint).",
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a505b5a8652ae2bbd0e8d0c7ebb7d4b7e78350e3addc347e4ffa734d8d94f448"
        },
