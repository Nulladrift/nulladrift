            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code in lower case, e.g. ca, us, gb, ua. assay_countries lists them.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1 to 200.",
