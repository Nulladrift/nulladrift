        {
          "name": "assay_ending",
          "title": "Contracts ending soon",
          "description": "Contracts of one line that are still running, soonest end first: the next tenders to come. Needs an Enterprise Data key: X-API-Key header on the MCP request (https://assay-systems.com/api-key/#data).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "before": {
                "description": "YYYY-MM-DD: only contracts ending before this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code in lower case, e.g. ca, us, gb, ua. assay_countries lists them.",
                "type": "string"
              },
              "line": {
                "description": "Line id from assay_line or assay_search.",
                "type": "string"
              },
              "page": {
                "description": "Page of the result list (default 1).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country", "line"],
            "type": "object"
          },
