          "title": "Awards won without a rival",
          "description": "Buyer × supplier pairs where the supplier won without a rival, locks and buyer shares; without country — the list of countries. Needs an Enterprise Data key: X-API-Key header on the MCP request (https://assay-systems.com/api-key/#data).",
