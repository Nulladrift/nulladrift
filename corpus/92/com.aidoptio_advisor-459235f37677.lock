      "instructions": "Read-only information and deterministic tools from Aidoptio, a European AI adoption consultancy for organisations from SMB to enterprise. Catalog: get_catalog for services, prices (EUR, excl. VAT) and products, get_service for one offer, search_articles for published articles. Advisor tools (rule-based, no model is called, no input is stored): benchmark_readiness (is a process ready for a private benchmark), ai_act_triage (indicative EU AI Act risk tier, not legal advice), plan_vendor_evaluation (criteria, test plan and a preregistration hash for comparing AI vendors on your own cases), verify_report (check an Aidoptio report against the public method log), get_disclosures (our vendor relations and independence rules; also as resource aidoptio://disclosures), verify_ai_text (did a text come from the Aidoptio website assistant) and ai_literacy_scan (AI Act Article 4: a status per step from your own answers, no score, not legal advice). From question to request: estimate_engagement prices a route of offers with the published amounts (e.g. route [\"readiness-sprint\"] for \"what does a sprint cost\"), and prepare_intake_link returns a link that fills in the contact form with the offer, the route, an optional plan hash and three preferred moments you got from the person. The link holds no personal data. This server sends, books and stores nothing: the person opens the link, adds name and e-mail, checks everything and sends it, and a person at Aidoptio answers. Please cite the URLs you use.",
      "tools": [
        {
          "name": "ai_act_triage",
          "title": "EU AI Act and agent risk triage",
          "description": "Five questions about one AI use or agent. Returns an indicative risk tier under Regulation (EU) 2024/1689 (prohibited, high-risk, transparency, minimal), whether agent risk is high, the deadlines that apply, the controls to put in place and first steps, with the EUR-Lex source and the date the status was last checked. Same rule set as the triage on aidoptio.com. Indicative triage, not legal advice. Deterministic: no model is called and the answers are not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autonomy": {
                "description": "Degree of autonomy of the system or agent draft = Draft proposal for an employee only; autonomous = Independently executes external actions or transactions via tools or MCP.",
                "enum": ["draft", "autonomous"],
                "type": "string"
              },
              "data": {
                "description": "Data processing and origin none = No personal data; eea = Standard business data and personal data within the EEA; sensitive = Special category data or customer data outside the EEA.",
                "enum": ["none", "eea", "sensitive"],
                "type": "string"
              },
              "domain": {
                "description": "Application domain and impact on people prohibited = Manipulation, social scoring or emotion recognition at work; high = Recruitment, credit, life or health insurance, education, essential services, critical infrastructure; transparency = Chatbot or generated content facing customers or citizens; minimal = Internal knowledge search or writing assistant.",
                "enum": ["prohibited", "high", "transparency", "minimal"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: en (English, default) or nl (Dutch).",
                "enum": ["en", "nl"],
                "type": "string"
              },
              "maturity": {
                "description": "Current assurance and AI literacy (Art. 4) solid = Role training, AI register, DPIA and kill switch in place; partial = Partly: policy or training, but no complete register or test; adhoc = Still ad hoc.",
                "enum": ["solid", "partial", "adhoc"],
                "type": "string"
              },
              "role": {
                "description": "Your organisation's role under the EU AI Act deployer = Deployer of existing models or tools; provider = Provider, or substantial modification or fine-tuning under your own brand.",
                "enum": ["deployer", "provider"],
                "type": "string"
              }
            },
            "required": ["autonomy", "data", "domain", "maturity", "role"],
            "type": "object"
          },
