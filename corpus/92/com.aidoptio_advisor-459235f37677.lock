        {
          "name": "benchmark_readiness",
          "title": "Benchmark Readiness Scan",
          "description": "Six questions about one process: is it ready for a private evaluation benchmark on your own cases? Returns a 0-100 readiness score, what is already in place, what to prepare, and the fitting first step with its starting price (EUR excl. VAT). Same rule set as the scan on aidoptio.com. A transparent heuristic, not a measurement and not a quote. Deterministic: no model is called and the answers are not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "history": {
                "description": "How many historical cases with a known outcome can you pull? lt50 = Fewer than 50; 50-200 = 50 to 200; 200-1000 = 200 to 1,000; gt1000 = More than 1,000; unknown = I don't know yet.",
                "enum": ["lt50", "50-200", "200-1000", "gt1000", "unknown"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: en (English, default) or nl (Dutch).",
                "enum": ["en", "nl"],
                "type": "string"
              },
              "models": {
                "description": "How do you use AI models or tools in this process today? none = Not yet; adhoc = Employees use general chat assistants ad hoc; pilot = A pilot or proof of concept with one model; production = In production, and we want to compare or switch models.",
                "enum": ["none", "adhoc", "pilot", "production"],
                "type": "string"
              },
              "process": {
                "description": "Which process would you benchmark first? service = Customer service: tickets, e-mail, chat; cases = Case handling: claims, applications, dossiers; documents = Document intake and back office; sales = Sales: quotes, tenders, proposals; internal = Internal helpdesk: IT, HR, knowledge questions; undecided = Several candidates, not chosen yet.",
                "enum": ["service", "cases", "documents", "sales", "internal", "undecided"],
                "type": "string"
              },
              "redlines": {
                "description": "Are there hard red-line rules the system must never break? written = Yes, written down in policies or procedures; tacit = Yes, but they live in our experts' heads; none = Not that we know of; unsure = I'm not sure.",
                "enum": ["written", "tacit", "none", "unsure"],
                "type": "string"
              },
              "sensitivity": {
                "description": "How sensitive is the data in these cases? low = Low: mostly public or internal information; medium = Medium: customer data, can be pseudonymised; high-classified = High (health, financial, special categories), and classified; high-unclear = High, and nobody has classified it yet.",
                "enum": ["low", "medium", "high-classified", "high-unclear"],
                "type": "string"
              },
              "volume": {
                "description": "What monthly volume do you want this process to handle? lt100 = Fewer than 100; 100-1000 = 100 to 1,000; 1000-10000 = 1,000 to 10,000; gt10000 = More than 10,000.",
                "enum": ["lt100", "100-1000", "1000-10000", "gt10000"],
                "type": "string"
              }
            },
            "required": ["history", "models", "process", "redlines", "sensitivity", "volume"],
            "type": "object"
          },
