                },
                "type": "object"
              },
              "red_lines": {
                "description": "Rules a system must never break, e.g. \"Never promise a refund\".",
                "items": {
                  "maxLength": 200,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "use_case": {
                "description": "The process the vendors are evaluated for: service (customer service), cases (case handling), documents (document intake and back office), sales, internal (internal helpdesk) or other.",
