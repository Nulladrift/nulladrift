        {
          "name": "ai_literacy_scan",
          "title": "AI literacy scan (EU AI Act, Article 4)",
          "description": "For an organisation that wants to show what it does about AI literacy under Article 4 of Regulation (EU) 2024/1689. Give the role groups and, optionally, your own yes/partly/no answers per checklist question and the questions you have evidence on file for. Returns a status per step (the four steps of the European Commission Q&A plus being able to show it): unknown, open, partly or measures_reported; the evidence expected per question; the gaps in the file; the actions with priority; and related obligations that are not Article 4 (Articles 26, 27, 50 and 5). No score and no percentage: Article 4 asks for measures, not for a level. Without answers it returns the full checklist. Same rule set as the section on aidoptio.com. Statuses are based only on your own answers: an aid, not legal advice and not proof of meeting the AI Act. Deterministic: no model is called and the answers are not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acts_on_its_own": {
                "description": "true when an AI system acts on its own, for example an agent that sends emails.",
                "type": "boolean"
              },
              "ai_uses": {
                "description": "How AI is used. recruitment-or-hr and credit-or-eligibility make the high-risk questions 4.1 to 4.6 a point to check.",
                "items": {
                  "enum": ["general-assistant", "built-into-software", "recruitment-or-hr", "customer-facing-chat", "credit-or-eligibility", "content-generation", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "answers": {
                "additionalProperties": false,
                "description": "Your own answer per checklist question id, e.g. {\"1.1\": \"yes\", \"2.4\": \"partly\"}. Call the tool without answers to get the ids and the questions.",
                "maxProperties": 31,
                "patternProperties": {
                  "^\\d\\.\\d$": {
                    "enum": ["yes", "partly", "no"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "evidence_on_file": {
                "description": "Ids of the questions you have evidence on file for. Leave out to skip the file check (dossier_gaps is then null).",
                "items": {
                  "pattern": "^\\d\\.\\d$",
                  "type": "string"
                },
                "type": "array"
              },
              "high_risk_confirmed": {
                "description": "true when you have established that the recruitment, HR or credit use is high-risk (Annex III, point 4 or 5). Then questions 4.1 to 4.6 get priority.",
                "type": "boolean"
              },
              "is_provider": {
                "description": "true = provider, false = deployer, left out = not established yet.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: en (English, default) or nl (Dutch).",
                "enum": ["en", "nl"],
                "type": "string"
              },
              "roles": {
                "description": "Role groups that work with AI: office, management, hr-sales, board.",
                "items": {
                  "enum": ["office", "management", "hr-sales", "board"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["roles"],
            "type": "object"
          },
