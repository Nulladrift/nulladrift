          "description": "Returns a link to the Aidoptio contact form (English or Dutch) that fills in the chosen offer, optionally the route of estimate_engagement, a plan hash from plan_vendor_evaluation, benchmark_readiness, ai_act_triage or ai_literacy_scan, and three preferred intake moments. The link carries no name, e-mail or other personal data: the person opens it, adds their own details, checks everything and presses Send (with moments: Confirm these moments, through the booking path without any third-party calendar). This tool sends nothing, books nothing and stores nothing; Aidoptio only receives the request after that click. Also returns the exact message text the form will show.",
