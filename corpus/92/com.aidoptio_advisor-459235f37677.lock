        {
          "name": "estimate_engagement",
          "title": "Estimate an Aidoptio engagement",
          "description": "Prices a route of 1 to 5 Aidoptio offers with the published amounts only (EUR, excl. VAT): per step the price model (fixed, from, range, on-request, free), amount or bounds, unit and the page URL; the one credit rule the site states (the full Readiness Sprint fee is credited against Pilot to Production when both are in the route, Sprint first); totals per one-time, per month and per year, where max is null when a step has only a starting price or is quoted per scope. Not a quote: the final amount follows from a written proposal. Example: route [\"readiness-sprint\"] answers \"what does a sprint cost\". Rule-based, no model, nothing stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned text: en (English, default) or nl (Dutch).",
                "enum": ["en", "nl"],
                "type": "string"
              },
              "route": {
                "description": "Offer ids in the order of the steps, 1 to 5 (e.g. [\"readiness-sprint\", \"pilot-to-production\"]). Ids: get_catalog (services, their tiers and products).",
                "items": {
