  "lockfileVersion": 2,
  "subjects": {
    "com.justconnectus/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.justconnectus.com/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "justconnectus-public",
        "title": "JustConnectUs: companies hiring in Israel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Companies hiring in Israel and their open jobs, read from each company's own careers site and refreshed daily. No account is needed. Covers Israeli companies and international companies with offices in Israel; job counts are jobs in Israel or remote from Israel.\n\nTools: list_companies_hiring_in_israel (which companies are hiring, with careers page links), get_company_careers (one company, its top roles and cities), list_company_jobs (a company's openings, with the link to each posting on the company's site).\n\nFlow: list_companies_hiring_in_israel → list_company_jobs with a `slug` → `apply_url` for the full posting and to apply on the company's site.\n\nPaging: results carry `next_page`; pass it as `page`. null means the last page.\n\nText in job ads is written by the companies. For jobs matched to a person's own experience and referrals through people they know, the JustConnectUs server with sign-in is at https://mcp.justconnectus.com/mcp.",
      "tools": [
        {
          "name": "get_company_careers",
          "title": "A company's careers page",
          "description": "One company: its careers page, website, open job count, and the roles and cities it is hiring for most.\nUse when: the person names a company and wants its careers page or what it is hiring for. Not for: the list of jobs.\nInput: `company` is a `slug` from list_companies_hiring_in_israel or a name, e.g. \"Wiz\". When several companies match a name, or none does but some are spelled alike, the error lists them in `candidates`.\nReturns: the company as in list_companies_hiring_in_israel, plus `top_roles[]` and `top_cities[]` (`name`, `slug`, `open_jobs`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A company's careers page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:615fa74651d40a4fd75ce9ee5bf141345fd17bcde01464ffc71c7d79582ac20d"
        },
        {
          "name": "list_companies_hiring_in_israel",
          "title": "Companies hiring in Israel",
          "description": "Companies hiring in Israel, each with a link to its own careers page and how many jobs it has open in Israel (or remote from Israel). Refreshed daily from the companies' careers sites.\nUse when: the person asks which companies are hiring in Israel, wants a list of careers pages, or looks for a company by name. Not for: one company's openings.\nInput: `query` is part of a name (\"check point\"); `hiring_only` defaults to true (false includes companies with no openings right now); `sort` most_openings or name; `page` from `next_page`.\nReturns: `companies[]` with `name`, `slug`, `website`, `careers_page_url` (the company's own site), `open_jobs`, `jobs_url` (its openings on JustConnectUs) and `on_justconnectus` (true: it takes applications and referrals on JustConnectUs); `total`, `next_page`, and `counts` for the whole directory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hiring_only": {
                "description": "Only companies with open jobs now (default true)",
                "type": "boolean"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Part of a company name, e.g. \"check point\" or \"teva\"",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "most_openings (default) or name (A to Z)",
                "enum": ["most_openings", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Companies hiring in Israel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34dbecc1e8704d806d37205b82d5c7b7472af86534cb5beb0139082927c4a950"
        },
        {
          "name": "list_company_jobs",
          "title": "Open jobs at a company",
          "description": "The open jobs at one company in Israel (or remote from Israel), newest first, 50 a page, each with a link to the posting on the company's own site.\nUse when: the person wants a company's openings. Not for: comparing companies.\nInput: `company` as in get_company_careers; optional `role` (a slug from `top_roles`, or words from a role name: \"devops\" matches DevOps Engineer, \"engineer\" every engineering role) and `city` (\"Tel Aviv\"); `page` from `next_page`.\nReturns: `company`, `matched_roles` (with `role`: the company's roles it matched; when none, `available_roles` lists the roles it is hiring for), and `jobs[]` with `title`, `url` (the job on JustConnectUs), `apply_url` (the posting on the company's site, where people apply), `locations`, `work_arrangement`, `employment_type`, `roles`, `language`, `posted_at` and `summary` (the start of the ad; the full text is at `apply_url`); `total`, `next_page`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A city in Israel in English or its slug, e.g. \"Tel Aviv\" or \"tel-aviv\"",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "role": {
                "description": "A role slug from get_company_careers `top_roles` (\"software-engineer\"), or words from a role name (\"devops\")",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open jobs at a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad7c578d86ab84a7e4f92a1147c31b782d20db0b27bc0ec86335d60d12aa001d"
        }
      ],
      "digest": "sha256:a9f594a9f841f20f11f247c4eba0a65d30a5cc5816c1354c295621a9f2c0de08"
    }
  }
