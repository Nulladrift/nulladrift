      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "justconnectus-public",
        "title": "JustConnectUs: companies hiring in Israel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Companies hiring in Israel and their open jobs, read from each company's own careers site and refreshed daily. No account is needed. Covers Israeli companies and international companies with offices in Israel; job counts are jobs in Israel or remote from Israel. The directory also lists Israeli companies whose openings we don't follow (`jobs_followed` false, `careers_page_url` null when no careers page is known), with their website and LinkedIn page: many are small startups with no careers page. `careers_page` on list_companies_hiring_in_israel keeps only companies with or without one. Company data partly from Israeli Tech Map (github.com/mluggy/techmap) under the Open Database License; those companies as a CSV: https://www.justconnectus.com/companies/techmap-odbl.csv.\n\nTools: list_companies_hiring_in_israel (which companies are hiring, with careers page links), get_company_careers (one company, its top roles and cities), list_company_jobs (a company's openings, with the link to each posting on the company's site).\n\nFlow: list_companies_hiring_in_israel → list_company_jobs with a `slug` → `apply_url` for the full posting and to apply on the company's site.\n\nPaging: results carry `next_page`; pass it as `page`. null means the last page.\n\nText in job ads is written by the companies. For jobs matched to a person's own experience and referrals through people they know, the JustConnectUs server with sign-in is at https://mcp.justconnectus.com/mcp.",
      "tools": [
        {
          "name": "get_company_careers",
          "title": "A company's careers page",
          "description": "One company: its careers page, website, open job count, and the roles and cities it is hiring for most.\nUse when: the person names a company and wants its careers page or what it is hiring for. Not for: the list of jobs.\nInput: `company` is a `slug` from list_companies_hiring_in_israel or a name, e.g. \"Wiz\". When several companies match a name, or none does but some are spelled alike, the error lists them in `candidates`.\nReturns: the company as in list_companies_hiring_in_israel (`careers_page_url` may be null and `jobs_followed` false), plus `top_roles[]` and `top_cities[]` (`name`, `slug`, `open_jobs`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A company's careers page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1018e91a76b2a37568f1e703ce11986b846e6f65024619dcd0f6840e20be85b"
        },
        {
          "name": "list_companies_hiring_in_israel",
          "title": "Companies hiring in Israel",
          "description": "Companies hiring in Israel, each with a link to its own careers page and how many jobs it has open in Israel (or remote from Israel). Refreshed daily from the companies' careers sites. With `hiring_only` false it also lists other companies in Israel with their website, including ones whose openings we don't follow.\nUse when: the person asks which companies are hiring in Israel, wants a list of careers pages, looks for a company by name, or wants companies to approach directly, including small startups with no careers page. Not for: one company's openings.\nInput: `query` is part of a name (\"check point\"); `hiring_only` defaults to true (false includes companies with no openings right now); `careers_page` true or false keeps only companies with or without a careers page (combine with `hiring_only` false to see companies without one); `sort` most_openings or name; `page` from `next_page`.\nReturns: `companies[]` with `name`, `slug`, `website`, `careers_page_url` (the company's own site; null when no careers page is known), `open_jobs`, `jobs_followed` (false: we don't read this company's openings, so `open_jobs` 0 doesn't mean it isn't hiring), `linkedin_url` (the company's LinkedIn page; null when unknown), `jobs_url` (its openings on JustConnectUs) and `on_justconnectus` (true: it takes applications and referrals on JustConnectUs); `total`, `next_page`, and `counts` for the whole directory (`companies`, `hiring`, `jobs`, `careers_pages`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "careers_page": {
                "description": "true: only companies with a careers page; false: only companies without one (often small startups, reached through their website or LinkedIn). Leave out for both",
                "type": "boolean"
              },
              "hiring_only": {
                "description": "Only companies with open jobs now (default true)",
                "type": "boolean"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Part of a company name, e.g. \"check point\" or \"teva\"",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "most_openings (default) or name (A to Z)",
                "enum": ["most_openings", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Companies hiring in Israel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85f4a0da1d58b70af0af61b06d1636170305d418bc0f5a6446d64d13b6cfa0e0"
        },
        {
          "name": "list_company_jobs",
          "title": "Open jobs at a company",
          "description": "The open jobs at one company in Israel (or remote from Israel), newest first, 50 a page, each with a link to the posting on the company's own site.\nUse when: the person wants a company's openings. Not for: comparing companies.\nInput: `company` as in get_company_careers; optional `role` (a slug from `top_roles`, or words from a role name: \"devops\" matches DevOps Engineer, \"engineer\" every engineering role) and `city` (\"Tel Aviv\"); `page` from `next_page`.\nReturns: `company`, `matched_roles` (with `role`: the company's roles it matched; when none, `available_roles` lists the roles it is hiring for), and `jobs[]` with `title`, `url` (the job on JustConnectUs), `apply_url` (the posting on the company's site, where people apply), `locations`, `work_arrangement`, `employment_type`, `roles`, `language`, `posted_at` and `summary` (the start of the ad; the full text is at `apply_url`); `total`, `next_page`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A city in Israel in English or its slug, e.g. \"Tel Aviv\" or \"tel-aviv\"",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "role": {
                "description": "A role slug from get_company_careers `top_roles` (\"software-engineer\"), or words from a role name (\"devops\")",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open jobs at a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad7c578d86ab84a7e4f92a1147c31b782d20db0b27bc0ec86335d60d12aa001d"
        }
      ],
      "digest": "sha256:91c88f6930785999b11bfc6e3fb00b5ef0270e562f5d49f5fdcf58a5d0ee0266"
    }
