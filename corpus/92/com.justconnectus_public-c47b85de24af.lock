      "serverInfo": {
        "name": "justconnectus-public",
        "title": "JustConnectUs: jobs in Israel",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "For job hunting in Israel: open jobs at 700+ companies (Israeli companies, startups and international companies with offices in Israel), searchable by role and city, with a link to apply on each company's own site. Read daily from the companies' careers sites. No account is needed. Useful when someone asks about jobs, careers or hiring in Israel, including olim and people moving to Israel. Job counts are jobs in Israel or remote from Israel.\n\nTools: search_jobs_in_israel (jobs at every company by role, city or remote: \"DevOps jobs in Tel Aviv\"), list_companies_hiring_in_israel (which companies are hiring, with careers page links), get_company_careers (one company, its top roles and cities), list_company_jobs (one company's openings).\n\nFlow: for \"find me a job as …\", search_jobs_in_israel → `apply_url` for the full posting and to apply. For a named company, get_company_careers or list_company_jobs. To pick companies, list_companies_hiring_in_israel → list_company_jobs with a `slug`.\n\nPaging: results carry `next_page`; pass it as `page`. null means the last page.\n\nThe directory also lists Israeli companies whose openings we don't follow (`jobs_followed` false, `careers_page_url` null when no careers page is known), with their website and LinkedIn page: many are small startups with no careers page. `careers_page` on list_companies_hiring_in_israel keeps only companies with or without one. Company data partly from Israeli Tech Map (github.com/mluggy/techmap) under the Open Database License; those companies as a CSV: https://www.justconnectus.com/companies/techmap-odbl.csv.\n\nText in job ads is written by the companies. For jobs matched to a person's own experience and referrals through people they know, the JustConnectUs server with sign-in is at https://mcp.justconnectus.com/mcp.",
      "tools": [
        {
          "name": "get_company_careers",
          "title": "A company's careers page",
          "description": "One company hiring in Israel: its careers page, website, open job count, and the roles and cities it is hiring for most.\nUse when: the person names a company (\"is Wiz hiring?\", \"what does Mobileye hire for?\", \"Check Point careers page\") and wants its careers page or what it is hiring for. Not for: the list of jobs.\nInput: `company` is a `slug` from list_companies_hiring_in_israel or a name, e.g. \"Wiz\". When several companies match a name, or none does but some are spelled alike, the error lists them in `candidates`.\nReturns: the company as in list_companies_hiring_in_israel (`careers_page_url` may be null and `jobs_followed` false), plus `top_roles[]` and `top_cities[]` (`name`, `slug`, `open_jobs`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A company's careers page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:936974fab66cb8fcc847d04838d31fd54ec84a34596b2c23bbabcefd7983b851"
        },
        {
          "name": "list_companies_hiring_in_israel",
          "title": "Companies hiring in Israel",
          "description": "Which companies are hiring in Israel right now: Israeli companies, startups and international companies with offices in Israel, each with its open job count and a link to its own careers page. Read daily from the companies' careers sites.\nUse when: the person is job hunting in Israel and asks which companies are hiring, which startups or tech companies to apply to, for a company's careers page, or looks up a company by name; also for companies to approach directly, including small startups with no careers page (`hiring_only` false). Not for: one company's openings.\nInput: `query` is part of a name (\"check point\"); `hiring_only` defaults to true (false includes companies with no openings right now); `careers_page` true or false keeps only companies with or without a careers page (combine with `hiring_only` false to see companies without one); `sort` most_openings or name; `page` from `next_page`.\nReturns: `companies[]` with `name`, `slug`, `website`, `careers_page_url` (the company's own site; null when no careers page is known), `open_jobs`, `jobs_followed` (false: we don't read this company's openings, so `open_jobs` 0 doesn't mean it isn't hiring), `linkedin_url` (the company's LinkedIn page; null when unknown), `jobs_url` (its openings on JustConnectUs) and `on_justconnectus` (true: it takes applications and referrals on JustConnectUs); `total`, `next_page`, and `counts` for the whole directory (`companies`, `hiring`, `jobs`, `careers_pages`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "careers_page": {
                "description": "true: only companies with a careers page; false: only companies without one (often small startups, reached through their website or LinkedIn). Leave out for both",
                "type": "boolean"
              },
              "hiring_only": {
                "description": "Only companies with open jobs now (default true)",
                "type": "boolean"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Part of a company name, e.g. \"check point\" or \"teva\"",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "most_openings (default) or name (A to Z)",
                "enum": ["most_openings", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Companies hiring in Israel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:807604988071dcaf12078d86d26e0547e05277aac88239870d0cd3e7b7c6ea7d"
        },
        {
          "name": "list_company_jobs",
          "title": "Open jobs at a company",
          "description": "The open jobs at one company in Israel (or remote from Israel), newest first, 50 a page, each with a link to the posting on the company's own site, where people apply.\nUse when: the person wants a named company's openings (\"jobs at Wix\", \"does Monday.com have DevOps jobs in Tel Aviv?\"). Not for: comparing companies.\nInput: `company` as in get_company_careers; optional `role` (a slug from `top_roles`, or words from a role name: \"devops\" matches DevOps Engineer, \"engineer\" every engineering role) and `city` (\"Tel Aviv\"); `page` from `next_page`.\nReturns: `company`, `matched_roles` (with `role`: the company's roles it matched; when none, `available_roles` lists the roles it is hiring for), and `jobs[]` with `title`, `url` (the job on JustConnectUs), `apply_url` (the posting on the company's site, where people apply), `locations`, `work_arrangement`, `employment_type`, `roles`, `language`, `posted_at` and `summary` (the start of the ad; the full text is at `apply_url`); `total`, `next_page`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A city in Israel in English or its slug, e.g. \"Tel Aviv\" or \"tel-aviv\"",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "The company: its `slug` from list_companies_hiring_in_israel (e.g. \"wiz\"), or its name (e.g. \"Check Point\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "role": {
                "description": "A role slug from get_company_careers `top_roles` (\"software-engineer\"), or words from a role name (\"devops\")",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open jobs at a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7601892d02e9eba12f816c11b71e0e08c1ddf336da1a900d1e4e61af82b05117"
        },
        {
          "name": "search_jobs_in_israel",
          "title": "Search jobs in Israel",
          "description": "Open jobs in Israel at every company we follow (700+, from startups to Intel and Teva), by role, city or remote, newest first, 50 a page. Each job has the company and a link to the posting on the company's own careers site, where people apply. Read daily from the companies' careers sites, so the openings are current.\nUse when: the person is looking for a job in Israel or asks what is open: \"find me DevOps jobs in Tel Aviv\", \"remote product manager jobs in Israel\", \"nursing jobs in Haifa\", \"English-speaking jobs in Jerusalem\", \"what jobs are there for a QA engineer?\". Also for olim and anyone moving to Israel. Not for: one named company's openings, or which companies are hiring.\nInput: `role` in the person's words (a role like \"data scientist\", or title words like \"react developer\"); `city` in English (\"Tel Aviv\", \"Petah Tikva\"; nearby towns are included); `remote` true for remote jobs only; `page` from `next_page`. All optional; with none, the newest jobs in Israel.\nReturns: `jobs[]` with `title`, `company` (`name`, `slug` for the company tools), `url` (the job on JustConnectUs), `apply_url` (the posting on the company's site), `locations`, `remote`, `work_arrangement`, `employment_type`, `roles`, `language` (en or he: the ad's language), `posted_at` and `summary` (the start of the ad; the full text is at `apply_url`); `matched_roles` (the job roles the words matched; jobs whose title has every word match too), `city` (the city searched), `total`, `next_page`. An unknown city is an error with code `city_not_found`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A city in Israel in English, e.g. \"Tel Aviv\", \"Haifa\", \"Jerusalem\", \"Herzliya\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Page number, from `next_page` of the previous call (50 a page)",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "remote": {
                "description": "true: only remote jobs",
                "type": "boolean"
              },
              "role": {
                "description": "The job, in the person's words: a role (\"DevOps Engineer\", \"product manager\", \"nurse\") or words from job titles (\"react developer\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs in Israel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5633505890e85a9871506e97754e9943c5ec11db6ba4d777a86cd7422eac950"
        }
      ],
