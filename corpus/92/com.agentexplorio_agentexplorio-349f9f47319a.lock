{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentexplorio/agentexplorio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentexplorio.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentexplorio",
        "title": "AgentExplorio",
        "version": "1.0.2",
        "websiteUrl": "https://agentexplorio.com/developers/mcp",
        "icons": [
          {
            "src": "https://agentexplorio.com/brand/agentexplorio-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_agents to find AI agents for a task, then get_agent for details. Always show the verification label to the user.",
      "tools": [
        {
          "name": "compare_agents",
          "title": "Compare agents",
          "description": "Side-by-side facts for 2 or 3 agents by slug.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "Slugs of the 2 or 3 listings to compare",
                "items": {
                  "description": "A listing slug from search_agents results",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cba434c130fe5791b1629572dcb4558382285db83fe5dcc8623e269d264d449e"
        },
        {
          "name": "get_agent",
          "title": "Get agent details",
          "description": "Full public listing for one agent by slug: pricing, setup, integrations, industries, tasks, uptime, likes, reviews and verification.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The listing's slug, as returned in search_agents results (e.g. the last part of its agentexplorio.com URL)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e83b0a1deea90027f06c490ab650b0fee590635e292f21a971dfb51e40368fba"
        },
        {
          "name": "search_agents",
          "title": "Search AI agents",
          "description": "Find AI agents, MCP servers and agent tools that do a job. Describe the task in plain words (e.g. 'reply to customer emails for a dental clinic'). Optional filters narrow by industry, type, price, setup and integration. Results come from the AgentExplorio index with verification labels; unverified listings are labeled.",
          "inputSchema": {
            "properties": {
              "industry": {
                "description": "Industry slug to filter by, e.g. legal, healthcare, ecommerce-retail",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return (1 to 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "price": {
                "description": "Pricing model to filter by",
                "enum": ["free", "freemium", "paid", "open_source"],
                "type": "string"
              },
              "query": {
                "description": "The task in plain words, e.g. 'book appointments for a hair salon'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "setup": {
                "description": "no_code for tools anyone can set up; developer for tools that need coding or API keys",
                "enum": ["no_code", "developer"],
                "type": "string"
              },
              "type": {
                "description": "Kind of listing: agent (does the task on its own), assistant (chat helper), mcp_tool (MCP server an AI can call), builder_tool (platform to build agents), workflow_template (ready-made automation)",
                "enum": ["agent", "assistant", "mcp_tool", "builder_tool", "workflow_template"],
                "type": "string"
              },
              "verified_only": {
                "default": false,
                "description": "true to return only listings AgentExplorio has verified",
                "type": "boolean"
              },
              "works_with": {
                "description": "An app or protocol the result must integrate with, e.g. Slack, HubSpot, WhatsApp, MCP",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9288846304a7e0e9fc50e89ef337f13b3dbdc56b225af9bf0a97e810f675c8e7"
        }
      ],
      "digest": "sha256:750790fb4eb46e556f4f8bbd98ab3da5f8eefebab4e13d4239c39dbfe2b8863e"
    }
  }
}
