{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentexplorio/agentexplorio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentexplorio.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentexplorio",
        "title": "AgentExplorio",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_agents to find AI agents for a task, then get_agent for details. Always show the verification label to the user.",
      "tools": [
        {
          "name": "compare_agents",
          "title": "Compare agents",
          "description": "Side-by-side facts for 2 or 3 agents by slug.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fb0af77946a8f457cfe46303ec5f1ee7a1d3e2cd271551c666ead867b157d8e"
        },
        {
          "name": "get_agent",
          "title": "Get agent details",
          "description": "Full public listing for one agent by slug: pricing, setup, integrations, industries, tasks, uptime, likes, reviews and verification.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f0da6a4e7fa37c54025f147ffbe858744386159d2f6bfe6a2800f3531a090e4"
        },
        {
          "name": "search_agents",
          "title": "Search AI agents",
          "description": "Find AI agents, MCP servers and agent tools that do a job. Describe the task in plain words (e.g. 'reply to customer emails for a dental clinic'). Optional filters narrow by industry, type, price, setup and integration. Results come from the AgentExplorio index with verification labels; unverified listings are labeled.",
          "inputSchema": {
            "properties": {
              "industry": {
                "description": "Industry slug, e.g. legal, healthcare, ecommerce-retail",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "price": {
                "enum": ["free", "freemium", "paid", "open_source"],
                "type": "string"
              },
              "query": {
                "description": "What you need done",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "setup": {
                "enum": ["no_code", "developer"],
                "type": "string"
              },
              "type": {
                "enum": ["agent", "assistant", "mcp_tool", "builder_tool", "workflow_template"],
                "type": "string"
              },
              "verified_only": {
                "default": false,
                "type": "boolean"
              },
              "works_with": {
                "description": "Integration or protocol, e.g. Slack, HubSpot, WhatsApp, MCP",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b0f09842e830b1bd86461a223c37db2111b44bde015e7f9573ce74f8fe98f72"
        }
      ],
      "digest": "sha256:8c7d9d19eb75c79406039d7cf7f81629bd1283ddf3948d6b7ce254eaee8928ee"
    }
  }
}
