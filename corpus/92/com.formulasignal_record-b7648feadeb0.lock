      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FormulaSignal keeps a permanent, dated, evidence-backed Record of U.S. pre-workout products: what each one declares, what it costs per serving, how that has changed, and what published research and regulatory filings say about the ingredients. Start with products.resolve to turn a name into a canonical product_id, then call the capability that answers the actual question. Do not call record.search repeatedly with reworded questions; it costs the user quota and produces the same answer. Report status and limitations as facts about the Record rather than as facts about the product. FormulaSignal performs no laboratory testing, gives no medical or suitability advice, and does not publish an unreviewed change as a confirmed one. An observation window is not an exact change date. When asked exactly when a product changed, give the window and say the exact date is not established.",
      "tools": [
        {
          "name": "ingredients.regulatory",
          "title": "Get regulatory context",
          "description": "Return regulatory records and documented cautions for named ingredients, each carrying the class of record it actually is.\n\nWhen to use: Use when you need to know what filings, advisories, label warnings, interactions, or enforcement actions FormulaSignal holds for an ingredient.\n\nWhat it cannot provide: A regulatory filing is never returned as an approval, a warning, or a finding of harm. Nothing here is medical clearance.\n\nLimits: Pass ingredient_ids (at most 5) or one product_id, not both. Your plan has a daily limit on how many distinct products, Signals and ingredients you may read. Repeating a question about the same product costs nothing extra; reading many different products costs one each. Do not iterate through products, aliases, or date windows to assemble a copy of the Record: it is refused, scored, and can suspend the key.\n\nFormulaSignal covers a defined, counted set of U.S. pre-workout products. Coverage is not the whole category, and a product being absent from coverage says nothing about that product. Every response carries a status. `supported` means the Record answered. `partial`, `stale`, `under_review`, `ambiguous` and `unsupported` are all real answers about the Record and none of them is a fact about the product: report them as what FormulaSignal holds, never as what is true of the product. Read `limitations` and repeat what applies. An observation date is when a source was read, not when a change was made, and an observation window is not an exact reformulation date. Nothing here is medical advice or a suitability judgement for any person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ingredient_ids": {
                "description": "Up to five canonical ingredient ids. Pass these or product_id, not both.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "product_id": {
                "description": "A canonical product id, to read the ingredients that product declares. Pass this or ingredient_ids, not both.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
