              "cursor": {
                "description": "The next_cursor value from the previous page. Omit it for the first page.",
                "type": "string"
              },
              "dimension": {
                "description": "Only Signals of this kind of change: FORMULA, FORMULA_DOSE, SERVING, PRICE, CLAIMS, CERTIFICATION, LIFECYCLE or OTHER.",
                "type": "string"
              },
              "limit": {
                "description": "Signals per page, 1 to 25. Defaults to the plan's page size.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "product_id": {
                "description": "Only Signals for this canonical product id.",
                "type": "string"
              },
              "since": {
                "description": "Only Signals released on or after this date, YYYY-MM-DD. Pass the newest release date you have already seen to poll for what is new.",
