                    "type": "string"
                  },
                  "available": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Available"
                  },
                  "fetched_at": {
                    "format": "date-time",
                    "title": "Fetched At",
                    "type": "string"
                  },
                  "label": {
                    "const": "published by the retailer, not verified",
                    "default": "published by the retailer, not verified",
                    "title": "Label",
                    "type": "string"
                  },
                  "logo_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Retailer logo to show next to this data, when its terms require one.",
                    "title": "Logo Url"
                  },
                  "match": {
                    "const": "gtin",
                    "default": "gtin",
                    "title": "Match",
                    "type": "string"
                  },
                  "price": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
