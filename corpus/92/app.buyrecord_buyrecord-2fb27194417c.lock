                  "average": {
                    "description": "Out of 5.",
                    "title": "Average",
                    "type": "number"
                  },
                  "count": {
                    "title": "Count",
                    "type": "integer"
                  },
                  "label": {
                    "const": "published on the merchant's site, not verified",
                    "default": "published on the merchant's site, not verified",
                    "title": "Label",
                    "type": "string"
                  }
                },
                "required": ["average", "count"],
                "title": "MerchantPublishedRating",
                "type": "object"
              },
              "ProductOutcomes": {
                "properties": {
                  "available": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Available"
                  },
                  "breakdown": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "propertyNames": {
                      "enum": ["kept_silent", "kept_positive", "complained", "returned"]
                    },
                    "title": "Breakdown",
                    "type": "object"
                  },
                  "computed_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Computed At"
                  },
                  "confidence": {
                    "anyOf": [
                      {
                        "enum": ["low", "medium", "high"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "low under 10 verified outcomes, medium under 30, high from 30. Null when no score is shown.",
                    "title": "Confidence"
                  },
                  "manufacturer_warranty": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ManufacturerWarranty"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "merchant_published_rating": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/MerchantPublishedRating"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "min_sample": {
                    "title": "Min Sample",
                    "type": "integer"
                  },
                  "price": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Price"
                  },
                  "product_id": {
                    "format": "uuid",
                    "title": "Product Id",
                    "type": "string"
                  },
                  "recalls": {
                    "description": "US CPSC recalls linked to this product.",
                    "items": {
                      "$ref": "#/$defs/Recall"
                    },
                    "title": "Recalls",
                    "type": "array"
                  },
                  "retailer_offers": {
                    "description": "Same GTIN at big retailers (official APIs). Not verified.",
                    "items": {
                      "$ref": "#/$defs/RetailerOffer"
                    },
                    "title": "Retailer Offers",
                    "type": "array"
                  },
                  "sample_size": {
                    "title": "Sample Size",
                    "type": "integer"
                  },
                  "score": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "0 to 100. Null when sample_size is below min_sample.",
                    "title": "Score"
                  },
                  "source": {
                    "enum": ["merchant_sync", "email_receipt", "public_web", "merchant_reported"],
                    "title": "Source",
                    "type": "string"
                  },
                  "store_policy": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/StorePolicy"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "title": {
                    "description": "Product name as published by the merchant, cleaned and capped at 200 characters.",
                    "title": "Title",
                    "type": "string"
                  },
                  "top_reasons": {
                    "items": {
                      "enum": ["size", "quality", "not_as_described", "late_delivery", "damaged", "other"],
                      "type": "string"
                    },
                    "title": "Top Reasons",
                    "type": "array"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["available", "breakdown", "computed_at", "confidence", "merchant_published_rating", "min_sample", "price", "product_id", "sample_size", "score", "source", "store_policy", "title", "top_reasons", "url"],
                "title": "ProductOutcomes",
                "type": "object"
              },
              "Recall": {
                "description": "A US CPSC recall linked to this product. match: 'upc' (exact barcode) or 'brand_and_name'.",
