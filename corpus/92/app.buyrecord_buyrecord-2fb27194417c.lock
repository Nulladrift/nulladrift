                  "brand": {
                    "title": "Brand",
                    "type": "string"
                  },
                  "fetched_at": {
                    "format": "date-time",
                    "title": "Fetched At",
                    "type": "string"
                  },
                  "label": {
                    "const": "published by the manufacturer, not verified",
                    "default": "published by the manufacturer, not verified",
                    "title": "Label",
                    "type": "string"
                  },
                  "source_url": {
                    "title": "Source Url",
                    "type": "string"
                  },
                  "warranty_months": {
                    "title": "Warranty Months",
                    "type": "integer"
                  }
                },
                "required": ["brand", "fetched_at", "source_url", "warranty_months"],
                "title": "ManufacturerWarranty",
                "type": "object"
              },
              "MerchantPublishedRating": {
                "description": "Average rating and review count the merchant publishes on its own product page (schema.org\nAggregateRating). Not verified by BuyRecord and never part of the verified score.",
