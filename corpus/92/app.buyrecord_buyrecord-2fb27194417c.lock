                        "type": "null"
                      }
                    ],
                    "description": "The retailer's customer rating (average and count only)."
                  },
                  "retailer": {
                    "enum": ["bestbuy", "walmart"],
                    "title": "Retailer",
                    "type": "string"
                  },
                  "retailer_name": {
                    "enum": ["Best Buy", "Walmart"],
                    "title": "Retailer Name",
                    "type": "string"
                  },
                  "source": {
                    "const": "retailer_api",
                    "default": "retailer_api",
                    "title": "Source",
                    "type": "string"
                  },
                  "url": {
                    "description": "Product page at the retailer.",
                    "title": "Url",
                    "type": "string"
                  }
