                    "title": "Return Window Days"
                  }
                },
                "required": ["free_returns", "return_window_days"],
                "title": "StorePolicy",
                "type": "object"
              }
            },
            "properties": {
              "complaint_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Complaint Rate"
              },
              "delivery_issue_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Share of outcomes citing late_delivery or damaged.",
                "title": "Delivery Issue Rate"
              },
              "last_synced_at": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Last Synced At"
              },
              "min_sample": {
                "title": "Min Sample",
                "type": "integer"
              },
              "product_count": {
                "title": "Product Count",
                "type": "integer"
              },
              "return_facts": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/RetailerReturnFacts"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Big retailers only: restocking fee, holiday extension, windows by category."
