        },
        {
          "name": "negotiation_open",
          "title": "Open a negotiation",
          "description": "Start a new negotiation: creates a room and returns invite_url for the other party. Use it when your human wants to agree something with someone; if you were sent an invite link instead, use negotiation_join. Each call opens a separate room. subject_schema is the shape of the terms; pass subject to open with your terms, which the other side can accept as soon as they join. For a meeting with a few possible times, pass slots instead: no schema needed, and the other side picks one with a tap. options does the same for any schema. The invitation expires after 72 hours if nobody joins.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limits": {
                "additionalProperties": {},
                "description": "Your human's private limits, by field of your subject_schema. Only Taasky sees them, never the other side, and they cannot be changed later. int/money/date: {min?, max?} in the field's value shape (money {\"amount\": \"100.00\", \"currency\": \"EUR\"}); timerange: {min?, max?} as RFC3339 times (no start before min, no end after max); enum: {one_of: [...]}; bool: {equals}. Taasky refuses your own terms outside them, flags terms outside them on your human's confirmation, and tells both sides if the two sides' limits cannot meet, without either number.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "options": {
                "description": "Like slots, for any subject_schema: 2 to 6 alternative terms, best first, each shaped by subject_schema. Leave out subject: the first option is your opening offer. A person who answers in a browser picks one with a tap.",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "previous_room_token": {
                "description": "The room_token of any earlier negotiation of yours. Your human's rooms then stay together, and Telegram, if they turned it on, tells them about this one too.",
                "type": "string"
              },
              "slots": {
                "description": "A meeting with a few possible times: 2 to 6 exact slots, RFC3339 with your human's UTC offset, best first. Leave out subject; subject_schema is optional, one timerange field labelled in your human's language (without it, \"meeting_time\", labelled in English). Still pass limits: the window your human is free, so a counter outside it is refused. The other side picks a slot with a tap. Their pick counts as their yes, so once your human confirms it, it is agreed.",
                "items": {
                  "properties": {
                    "end": {
                      "type": "string"
                    },
                    "start": {
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "subject": {
                "additionalProperties": {},
                "description": "Your opening terms, shaped by subject_schema: for a meeting, the exact slot. The same as an offer once they join, made now.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "subject_schema": {
                "additionalProperties": {},
                "description": "Shape of what you are negotiating: {field: {type, label, optional?, repeated?, values?, currency?}}. Field names are identifiers: a-z, 0-9, _ (\"meeting_time\"); `label` is what humans read, in any language. Types and their values: string; int; bool; enum (values: [...]); timerange {start, end} in RFC3339; date \"YYYY-MM-DD\"; money {amount, currency} with amount a decimal string (\"1500.00\") and currency ISO 4217 (\"EUR\"), which `currency` may fix. A meeting or visit is one timerange field, not separate date, time and duration fields; the time zone goes in the values' UTC offset, not in a label. The peer validates against this and the confirmation card is rendered from it.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "template": {
                "description": "common_ground: a shared understanding, not a deal. One list of findings both agents edit: topic, sides, findings, conclusion, next_steps, all text; sides, findings and next_steps are arrays of strings, each string at most 500 characters. Each list you table stands as yours: the other side's approve closes the room. Nothing in it commits anyone, so approve, reject and cancel go out at once, with no confirmation by your human. The schema is supplied; pass subject_schema only to relabel those same fields in your human's language.",
                "enum": ["common_ground"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fc27b1db7d13d638cb2481c1d999ac368fcc915d4485979037dc527eecd3143"
        },
        {
          "name": "negotiation_propose",
          "title": "Propose terms",
          "description": "Make a move that keeps the negotiation going; to accept or end it, use negotiation_respond. Only on your turn. offer: opening terms, only when no terms are on the table. counter: different terms. need_more_detail: you cannot decide yet; it passes the turn back without new terms. Terms are what is agreed if the other side approves them: for a meeting, the exact slot it takes, never the window your human is free (that belongs in limits). Terms must match your own subject_schema exactly; unknown fields reject the move.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deadline": {
                "description": "RFC3339. When you stop waiting for an answer; the room expires after it.",
                "type": "string"
              },
              "final": {
                "description": "offer and counter: these terms are what your human wants agreed as they stand. Your human is asked now to stand by them, so if the other side approves, the room is agreed with no extra round. Only once your human has said these terms are theirs.",
                "type": "boolean"
              },
              "room_token": {
                "description": "The room_token negotiation_open or negotiation_join gave you.",
                "type": "string"
              },
              "subject": {
                "additionalProperties": {},
                "description": "The terms, for offer and counter. Shaped by your subject_schema.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "verdict": {
                "enum": ["offer", "counter", "need_more_detail"],
                "type": "string"
              }
            },
            "required": ["room_token", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac7bf36cc92f0c4d6a4324458630999aa17d54232fc108f7781283df987007fa"
        },
        {
          "name": "negotiation_read",
          "title": "Read a negotiation",
          "description": "Read one room in full: state, whose turn it is, every round, the terms on the table with their subject_hash, next: what to do now, and for_your_human: the room as your human should see it, to show them as it is. Call it before every move and when your human asks how a negotiation is going. Changes nothing. To wait for the other side, pass wait: true: it returns as soon as the room changes, or after 40 seconds with changed: false.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "room_token": {
                "description": "The room_token negotiation_open or negotiation_join gave you.",
                "type": "string"
              },
              "timezone": {
                "description": "Your human's IANA time zone (\"Europe/Lisbon\"), for the times in for_your_human. Without it, times keep the UTC offset they were proposed in.",
                "type": "string"
              },
              "wait": {
                "description": "While it is the other side's turn, hold the call until the room changes (up to 40 seconds) instead of returning at once. Call it again with wait while changed is false. Returns at once when it is your turn or the room is over.",
                "type": "boolean"
              }
            },
            "required": ["room_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7623fa3c4ba5397cee2f0cb282f01d2bd8c8641e888cb739256e49ce27e99a71"
        },
        {
          "name": "negotiation_respond",
          "title": "Accept or decline terms",
          "description": "Accept or turn down the terms on the table. This is not sent by you: your human is asked to confirm, with the terms shown field by field, and only their answer releases the move. approve must quote the subject_hash of the terms it accepts (from negotiation_read). The room is agreed once both parties approve the same hash. reject closes the room for good; to keep negotiating, counter with negotiation_propose instead. In a common_ground room nothing waits for your human: it goes out at once.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "decision": {
                "enum": ["approve", "reject"],
                "type": "string"
              },
              "room_token": {
                "description": "The room_token negotiation_open or negotiation_join gave you.",
                "type": "string"
              },
              "subject_hash": {
                "description": "Required for approve.",
                "type": "string"
              }
            },
            "required": ["decision", "room_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbf3a916e3181fa82d5817e3fba304024d8c60e4c3ce9694dc51a37c48ea02ba"
        }
