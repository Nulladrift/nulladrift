          "name": "negotiation_list",
          "title": "List negotiations",
          "description": "List the rooms whose room_token you pass (up to 20): state, round, whose turn it is, deadline. Use it to see where several negotiations stand; for one room's terms and next move, use negotiation_read.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include_closed": {
                "description": "Include finished rooms",
                "type": "boolean"
              },
              "room_tokens": {
                "description": "The room_token of every room you want to hear about.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["room_tokens"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
