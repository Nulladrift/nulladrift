        {
          "name": "create_design_brief",
          "title": "Create design brief",
          "description": "Save an immutable GPU/IGBT design brief with supplier citations, hard/preferred requirements, manufacturing constraints, operating point and optional spatial heat map. Requires artifacts:read/write too. Interpret sources with the client's model, ask about consequential conflicts and record assumptions. No LLM key or compute is used by this server. Revisions use parent_brief_id.",
          "inputSchema": {
            "$defs": {
              "Citation": {
                "additionalProperties": false,
                "properties": {
                  "excerpt": {
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "location": {
                    "description": "PDF page/table or CSV row reference",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source_artifact_id": {
                    "format": "uuid",
                    "type": "string"
                  }
                },
                "required": ["excerpt", "location", "source_artifact_id"],
                "type": "object"
              },
              "HeatMapPlacement": {
                "additionalProperties": false,
                "properties": {
                  "normal_sign": {
                    "default": 1,
                    "enum": [-1, 1],
                    "type": "integer"
                  },
                  "origin_mm": {
                    "maxItems": 3,
                    "minItems": 3,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "plane": {
                    "enum": ["xy", "xz", "yz"],
                    "type": "string"
                  },
                  "requirement_id": {
                    "type": "string"
                  },
                  "source_artifact_id": {
                    "format": "uuid",
                    "type": "string"
                  }
                },
                "required": ["origin_mm", "plane", "requirement_id", "source_artifact_id"],
                "type": "object"
              },
              "Manufacturing": {
                "additionalProperties": false,
                "properties": {
                  "allowed_fin_types": {
                    "items": {
                      "enum": ["straight", "wavy", "pin_inline", "pin_staggered", "offset_strip"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array"
                  },
                  "allowed_materials": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "max_channel_depth_mm": {
                    "exclusiveMinimum": 0,
                    "maximum": 40,
                    "type": "number"
