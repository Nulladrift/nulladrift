              },
              "reason": {
                "description": "Why the authenticated user or authorized agent accepts the cell-count deviation or discards this candidate.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["action", "job_id", "reason"],
            "type": "object"
