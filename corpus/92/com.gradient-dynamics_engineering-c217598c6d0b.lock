            "additionalProperties": false,
            "properties": {
              "filename": {
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_. ()-]{0,179}$",
                "type": "string"
              },
              "media_type": {
                "enum": ["application/pdf", "text/csv", "text/plain", "image/png", "image/jpeg"],
                "type": "string"
              },
              "project_id": {
                "format": "uuid",
                "type": "string"
              },
              "sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "size_bytes": {
                "exclusiveMinimum": 0,
                "maximum": 10485760,
                "type": "integer"
              }
            },
            "required": ["filename", "media_type", "project_id", "sha256", "size_bytes"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Prepare reference document upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:write",
            "gd/signInRequired": true,
            "ui": {
              "resourceUri": "ui://gradient/upload.html"
            }
          },
          "digest": "sha256:a29c50584a31bcfe530dfb7591479a0ded575924dcf113bed5c76dee1010766e"
        },
        {
          "name": "prepare_job_viewer",
          "title": "Prepare job viewer",
          "description": "Prepare or reopen a finished geometry, verified mesh candidate or published simulation result in its default interactive 3D browser viewer with orbit/pan/zoom. get_job normally does this automatically; PNG snapshots and 2D sections do not replace this view. Uses only this job’s saved outputs and one durable cached preparation; it never reruns compute, creates extra sections or retries failed/cancelled preparation. Show viewer_url automatically in a labelled browser link, preserving the complete fragment. Pending viewer.operation_id or operation_id is continued with get_operation. Report visualization failure separately from job outcome. Requires jobs:read and artifacts:read.",
          "inputSchema": {
