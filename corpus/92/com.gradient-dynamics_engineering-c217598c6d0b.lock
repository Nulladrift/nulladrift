        {
          "name": "plan_mesh",
          "title": "Plan mesh (dry run)",
          "description": "Dry run of an external octree mesh: send the create_mesh request (octree_prism.controls, no idempotency_key) and see the domain, sizes, boundary layer, refinement regions, predicted cells and the cores and memory it would get, without meshing. The mesher refuses what it cannot mesh, with numbers: a target too small for the sizes or first layer, a first layer thinner than the curved wall sags, or a target too large for meshing memory. Read feasible, then refusal or predicted_cells and notes, and tell the user before create_mesh when the prediction is far from target_cells. Internal fluid and CHT meshes, and requests with explicit domain and spacings, are not planned. Starts no compute and is not charged.",
          "inputSchema": {
            "$defs": {
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "DecisionContext": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
