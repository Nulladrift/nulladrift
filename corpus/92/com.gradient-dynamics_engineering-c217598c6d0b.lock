                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "restart_artifact_id": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["mesh_artifact_id"],
            "type": "object"
          },
          "outputSchema": {
