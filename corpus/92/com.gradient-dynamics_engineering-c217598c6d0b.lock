        {
          "name": "validate_prediction",
          "title": "Check prediction request",
          "description": "Validate an inference request against an enabled immutable model release, without running it. Model availability is configured separately from MCP.",
          "inputSchema": {
            "$defs": {
              "ElectronicsConditions": {
                "additionalProperties": false,
                "description": "SI operating conditions supported by the electronics v014 adapter.\n\nBounds limit input abuse and invalid physics, not a promise of accuracy.\nThe model catalogue states the narrower, operator-qualified envelope.",
                "properties": {
                  "fan_speed_pct": {
                    "default": 100,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inlet_temperature_K": {
                    "default": 300,
                    "exclusiveMinimum": 0,
                    "maximum": 2000,
                    "type": "number"
                  },
                  "reference_pressure_Pa": {
                    "default": 101325,
                    "exclusiveMinimum": 0,
                    "maximum": 100000000,
                    "type": "number"
                  },
                  "total_power_W": {
                    "default": 80,
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "$ref": "#/$defs/ElectronicsConditions"
              },
              "geometry_artifact_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "include_fields": {
                "default": true,
                "type": "boolean"
              },
              "model_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "model_version": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["geometry_artifact_id", "model_id", "model_version"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check prediction request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "predictions:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:da2bb8155adf6979d65337103b8304560411b1269a8aa8121044b6b1796f05f9"
        },
        {
          "name": "validate_simulation",
          "title": "Check simulation request",
          "description": "Validate the RANS, URANS or CHT input contract without compute. Verify mesh patches/material zones and units first. URANS requires an owned restart artifact.",
          "inputSchema": {
            "$defs": {
              "BoundaryCondition": {
                "additionalProperties": false,
                "properties": {
                  "type": {
                    "enum": ["inlet", "outlet", "wall", "rotating_wall", "symmetry", "farfield"],
                    "type": "string"
                  },
                  "value": {
                    "$ref": "#/$defs/BoundaryValue"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "BoundaryValue": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flow_direction": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nonzero Cartesian inlet direction for volumetric flow."
                  },
                  "omega": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule)."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rotation origin in metres in the mesh coordinate system."
                  },
                  "pressure": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute pressure in Pa. Legacy outlet/farfield zero means reference_pressure, not vacuum."
                  },
                  "specific_dissipation_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet omega in 1/s; supply with turbulent_kinetic_energy."
                  },
                  "temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute temperature in K."
                  },
                  "turbulence_intensity": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet turbulence fraction, not percent; native reference default 0.01 when exact SST state is absent."
                  },
                  "turbulent_kinetic_energy": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet k in m^2/s^2; supply with specific_dissipation_rate."
                  },
                  "turbulent_viscosity_ratio": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet eddy/molecular viscosity ratio; native default 10 when exact SST state is absent."
                  },
                  "velocity": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cartesian velocity in m/s; mutually exclusive with inlet volumetric flow rate."
                  },
                  "volumetric_flow_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet volumetric flow in m^3/s, converted using actual inlet mesh area. Requires flow_direction."
                  },
                  "wall_type": {
                    "anyOf": [
                      {
                        "enum": ["no_slip", "slip", "moving_wall", "rotating_wall"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "ConvergenceCriteria": {
                "additionalProperties": true,
                "description": "Fields as in assess_convergence: window_fraction, window_iterations, max_final_residual, residuals, residual_rise_orders, min_residual_orders_dropped, forces, force_band_percent, force_band_floor. Unset fields keep the standard test; unknown fields are rejected.",
                "type": "object"
              },
              "DecisionContext": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Fluid": {
                "additionalProperties": false,
                "properties": {
                  "density": {
                    "default": 1.225,
                    "description": "Density in kg/m^3; default is an air assumption, not a material lookup.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "molecular_weight": {
                    "default": 28.97,
                    "description": "Molecular weight in g/mol.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "viscosity": {
                    "default": 0.0000181,
                    "description": "Dynamic viscosity in Pa s.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "FluxCoreConfig": {
                "additionalProperties": false,
                "description": "FluxCore controls; the native worker validates the mesh and solve.",
                "properties": {
                  "airspeed": {
                    "default": 0,
                    "description": "Freestream speed in m/s; zero is not a substitute for a missing operating point.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "angle_of_attack": {
                    "default": 0,
                    "description": "Angle of attack in degrees.",
                    "type": "number"
                  },
                  "architecture": {
                    "default": "fluxcore",
                    "description": "Fluxcore GPU solver. Use 'fluxcore'; 'workhorse' remains an accepted compatibility identifier for saved requests and deployed workers.",
                    "enum": ["fluxcore", "workhorse", "krylov"],
                    "type": "string"
                  },
                  "bdf_order": {
                    "anyOf": [
                      {
                        "maximum": 2,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "URANS backward-difference time order; resolved default 2."
                  },
                  "bdf_startup_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "boundary_conditions": {
                    "maxProperties": 512,
                    "patternProperties": {
                      "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$": {
                        "$ref": "#/$defs/BoundaryCondition"
                      }
                    },
                    "propertyNames": {
                      "maxLength": 128,
                      "minLength": 1
                    },
                    "type": "object"
                  },
                  "cht_inlet_temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "CHT inlet temperature in K."
                  },
                  "cht_turbulent_prandtl": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "compressible_config": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/NumericalControls"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Advanced FluxCore numerical controls. Search the solver-control catalogue for canonical names, architecture availability and defaults. Only explicit values are forwarded; unknown controls are rejected."
                  },
                  "convergence_tolerance": {
                    "default": 0.000001,
                    "exclusiveMaximum": 1,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "export_solution_fields": {
                    "default": true,
                    "type": "boolean"
                  },
                  "fluid": {
                    "$ref": "#/$defs/Fluid"
                  },
                  "forces": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ForcesConfig"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_cfl": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Positive URANS pseudo-time CFL, or -1 for architecture default."
                  },
                  "inner_chunk_size": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_early_stop": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_iterations": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_residual_drop": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "iterations_per_output": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Output cadence in iterations/physical steps; 0 disables intermediate output, not final export."
                  },
                  "live_history_interval": {
                    "default": 50,
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "max_iterations": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": 6000,
                    "description": "Steady iteration ceiling; explicitly null for URANS."
                  },
                  "mesh_format": {
                    "default": "cgns",
                    "enum": ["cgns", "openfoam"],
                    "type": "string"
                  },
                  "mesh_scale_factor": {
                    "default": 1,
                    "description": "Stored meshes are in meters. A different scale requires an explicit mesh_unit_conversion on the simulation request; OpenFOAM always requires 1.0.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "mrf_zones": {
                    "description": "Multiple reference frames tied to actual mesh cell zones; rotating walls alone do not define a rotating fluid zone.",
                    "items": {
                      "$ref": "#/$defs/MRFZone"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "n_physical_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "reference_pressure": {
                    "default": 101325,
                    "description": "Reference absolute pressure in Pa.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "simulation_type": {
                    "default": "rans",
                    "enum": ["rans", "urans", "cht"],
                    "type": "string"
                  },
                  "solver_mode": {
                    "const": "all_speed",
                    "default": "all_speed",
                    "type": "string"
                  },
                  "temperature": {
                    "default": 300,
                    "description": "Freestream absolute temperature in K.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "thermal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ThermalConfig"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "time_step": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "URANS physical time step in seconds; supply an engineering time scale."
                  },
                  "transient_predictor": {
                    "anyOf": [
                      {
                        "enum": ["previous", "extrapolate"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "transient_sample_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "transient_washout_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "turbulence_model": {
                    "default": "k_omega_sst",
                    "enum": ["k_omega_sst", "spalart_allmaras", "laminar"],
                    "type": "string"
                  },
                  "wall_treatment": {
                    "default": "wall_functions",
                    "enum": ["wall_functions", "low_re", "none"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "ForcesConfig": {
                "additionalProperties": false,
                "properties": {
                  "drag_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [1, 0, 0]
                  },
                  "enabled": {
                    "default": true,
                    "type": "boolean"
                  },
                  "exclude_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "include_fixed_velocity_walls": {
                    "default": false,
                    "type": "boolean"
                  },
                  "interval": {
                    "default": 1,
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "lift_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [0, 1, 0]
                  },
                  "mode": {
                    "default": "end_only",
                    "enum": ["off", "end_only", "interval", "history", "both", "every_step"],
                    "type": "string"
                  },
                  "patches": {
                    "description": "Actual wall patch names; empty uses native automatic wall selection.",
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "reference_area": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Reference area in m^2; positive for explicit mode, omitted/0 for auto_projected."
                  },
                  "reference_area_mode": {
                    "anyOf": [
                      {
                        "enum": ["explicit", "auto_projected"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit engineering reference area or a disclosed projected-area estimate."
                  },
                  "reference_length": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Moment reference length in metres."
                  },
                  "reference_velocity": {
                    "default": 0,
                    "description": "Reference speed in m/s; zero uses the freestream.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "MRFZone": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "cell_zone_name": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "non_rotating_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "omega": {
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule).",
                    "type": "number"
                  },
                  "origin": {
                    "$ref": "#/$defs/Vector3",
                    "default": [0, 0, 0],
                    "description": "Rotation origin in metres."
                  },
                  "rotating_wall_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "zone_id": {
                    "description": "Verified mesh cell zone ID. If cell_zone_name is supplied, the native mesh reader resolves its authoritative ID.",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["axis", "omega", "zone_id"],
                "type": "object"
              },
              "MeshUnitConversion": {
                "additionalProperties": false,
                "description": "Interpret existing coordinate values for this run; never rewrite the source mesh.",
                "properties": {
                  "confirmed": {
                    "const": true,
                    "type": "boolean"
                  },
                  "coordinate_units": {
                    "enum": ["m", "mm", "cm", "in"],
                    "type": "string"
                  },
                  "source_sha256": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  }
                },
                "required": ["confirmed", "coordinate_units", "source_sha256"],
                "type": "object"
              },
              "NumericalControls": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "type": "string"
                    },
                    {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "Explicit advanced numerical controls. Use get_solver_controls to find canonical names/types and get_tool_schema for the full schema. Unknown names are rejected.",
                "type": "object"
              },
              "SurfaceHeatSource": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "default": "z",
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  "center_m": {
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "hotspot_fraction": {
                    "default": 0,
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "hotspot_offset_m": {
                    "default": [0, 0],
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "hotspot_scale": {
                    "default": 0.35,
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "plane_tolerance_m": {
                    "default": 0.000001,
                    "exclusiveMinimum": 0,
                    "maximum": 0.001,
                    "type": "number"
                  },
                  "position_m": {
                    "default": 0,
                    "type": "number"
                  },
                  "power_w": {
                    "minimum": 0,
