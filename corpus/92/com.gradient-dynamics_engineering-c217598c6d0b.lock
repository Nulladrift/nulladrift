                      }
                    ],
                    "description": "Wall edge length in metres (with adaptive sizing, the largest). Leave out to size the wall for target_cells; set it only when the user fixes a size."
                  },
                  "sizing": {
                    "default": "adaptive",
                    "description": "adaptive refines size for curvature, sharp edges, narrow gaps and thin walls down to min_size; uniform keeps one edge length.",
                    "enum": ["adaptive", "uniform"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "OctreeSurfaceLayers": {
                "additionalProperties": false,
                "properties": {
                  "layers": {
                    "description": "Most prism layers on these surfaces; 0 for none.",
                    "maximum": 40,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["layers"],
                "type": "object"
              },
              "OctreeSurfaceOverride": {
                "additionalProperties": false,
                "properties": {
                  "boundary_layer": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/OctreeSurfaceLayers"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "size": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Largest wall edge on these surfaces, in metres; refines the automatic size there, never coarsens it."
                  }
                },
                "type": "object"
              },
              "OctreeVolume": {
                "additionalProperties": false,
                "properties": {
                  "domain": {
                    "anyOf": [
                      {
                        "enum": ["compact", "standard", "large"],
                        "type": "string"
                      },
                      {
                        "$ref": "#/$defs/OctreeDomain"
                      }
                    ],
                    "default": "standard",
                    "description": "Wind-tunnel size around the body (compact 3/6/2/2, standard 5/10/4/4, large 8/16/6/6 body lengths upstream/downstream/side/top), or an explicit domain."
                  },
                  "growth": {
                    "default": "medium",
                    "description": "How quickly cells coarsen away from the body.",
                    "enum": ["slow", "medium", "fast"],
                    "type": "string"
                  },
                  "max_size": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Largest far-field cell in metres; default from the domain size."
                  },
                  "regions": {
                    "items": {
                      "$ref": "#/$defs/OctreeRegion"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "rotating_zones": {
                    "items": {
                      "$ref": "#/$defs/OctreeRotatingZone"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "wake": {
                    "$ref": "#/$defs/OctreeWake"
                  }
                },
                "type": "object"
              },
              "OctreeWake": {
                "additionalProperties": false,
                "properties": {
                  "enabled": {
                    "default": true,
                    "type": "boolean"
                  },
                  "length": {
                    "default": 2,
                    "description": "Downstream extent in body lengths, along the stream.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "levels": {
                    "default": 1,
                    "description": "Nested levels, each twice as long with twice the cell size (2: a near and a far wake).",
                    "maximum": 3,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "parts": {
                    "description": "Wakes behind named parts.",
                    "items": {
                      "$ref": "#/$defs/OctreePartWake"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "size": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Near-wake cell size in metres; default twice the surface size. Leave out so the wake is sized for target_cells."
                  },
                  "spread": {
                    "default": 0,
                    "description": "Widening: each side moves out by spread per unit length (0.1: +10% of the length on every side at the end).",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "OpenFoamOptions": {
                "additionalProperties": true,
                "description": "engine=openfoam options. Sizing, refinement and quality fields: get_mesh_controls(engine=openfoam) or get_tool_schema. Unknown fields are rejected.",
                "properties": {
                  "domain_max": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "domain_min": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Surface coordinate units; domain bounds and spacing are always in metres."
                  },
                  "max_remesh_iterations": {
                    "default": 3,
                    "maximum": 4,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maximum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "minimum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "n_prism_layers": {
                    "default": 3,
                    "description": "Requested layers; 0 disables layers. Achieved layers/coverage must be checked after meshing.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit user or authorized-agent delegation for bounded automatic mesh retries; required for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "Review stops before another full mesh attempt; automatic allows the explicitly authorized, bounded max_remesh_iterations budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal"],
                    "type": "string"
                  }
                },
                "required": ["domain_max", "domain_min", "maximum_spacing", "minimum_spacing"],
                "type": "object"
              },
              "StructuredBoundary": {
                "additionalProperties": false,
                "properties": {
                  "center_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "kind": {
                    "enum": ["port", "remaining_boundary"],
                    "type": "string"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  },
                  "normal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "radius_mm": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "shape": {
                    "default": "circle",
                    "enum": ["circle", "rectangle"],
                    "type": "string"
                  },
                  "size_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["kind", "name"],
                "type": "object"
              },
              "StructuredInternalSurface": {
                "additionalProperties": false,
                "description": "Two-sided rectangular pressure-jump selection, never an exterior wall.",
                "properties": {
                  "axis": {
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  "coordinate_mm": {
                    "type": "number"
                  },
                  "direction": {
                    "default": 1,
                    "enum": [-1, 1],
                    "type": "integer"
                  },
                  "maximum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "minimum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  }
                },
                "required": ["axis", "coordinate_mm", "maximum_mm", "minimum_mm", "name"],
                "type": "object"
              },
              "StructuredOptions": {
                "additionalProperties": true,
                "description": "engine=structured options. Sizing, refinement and quality fields: get_mesh_controls(engine=structured) or get_tool_schema. Unknown fields are rejected.",
                "properties": {
                  "adaptive_refinement": {
                    "default": true,
                    "description": "Internal stair-step: retain fine cells near walls and in tight passages, coarsen the bulk with conformal 2:1 transitions.",
                    "type": "boolean"
                  },
                  "boundary_patches": {
                    "items": {
                      "$ref": "#/$defs/StructuredBoundary"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "flow_region": {
                    "$ref": "#/$defs/FlowRegion"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Derive from artifact metadata; required for uploads without declared units."
                  },
                  "internal_surfaces": {
                    "items": {
                      "$ref": "#/$defs/StructuredInternalSurface"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "mesh_type": {
                    "default": "stair_step",
                    "description": "Ask about surface fidelity; stair_step is the disclosed default. Neither option extrudes prism layers.",
                    "enum": ["stair_step", "cut_cell"],
                    "type": "string"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit user or authorized-agent delegation for bounded automatic mesh retries; required for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "Review stops before another full target-count attempt; automatic allows the explicitly authorized bounded max_target_iterations budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "anyOf": [
                      {
                        "enum": ["external", "internal", "cht", "solid"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["flow_region"],
                "type": "object"
              },
              "Vector3": {
                "maxItems": 3,
                "minItems": 3,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "additionalProperties": false,
            "properties": {
              "decision_context": {
                "$ref": "#/$defs/DecisionContext"
              },
              "engine": {
                "description": "structured = Cartesian; octree_prism = native octree/polyhedral with prism layers; openfoam = legacy engine identifier. Prefer configured octree_prism for generic unstructured requests; preserve explicit methods. Choose delivered file formats separately with export_formats.",
                "enum": ["structured", "openfoam", "octree_prism"],
                "type": "string"
              },
              "export_formats": {
                "default": ["cgns"],
                "description": "Delivered mesh formats, in preference order. Default cgns is Standard CGNS (NGON/NFACE) for ParaView. gd_cgns is GD CGNS for Fluxcore/Studio; fluent is a Fluent-format polyhedral .msh; openfoam is a polyMesh archive. Select formats independently of the meshing engine. The first format is the primary download. GD CGNS is also retained internally for simulation and viewing. Preserve an explicit user choice; do not ask for a format when none was specified.",
                "items": {
                  "enum": ["cgns", "gd_cgns", "fluent", "openfoam"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "octree_prism": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/OctreePrismOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "openfoam": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/OpenFoamOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reviewed_job_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Explicitly requested new attempt after reviewing this completed mesh job, including quality or resource failures. Use a fresh idempotency key; this records lineage and never restarts the prior execution."
              },
              "structured": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/StructuredOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "surface_artifact_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "target_cells": {
                "default": 1000000,
                "maximum": 50000000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["engine", "surface_artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan mesh (dry run)"
          },
          "behavior": {
