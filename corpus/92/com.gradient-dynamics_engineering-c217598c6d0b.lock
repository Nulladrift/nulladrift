        },
        {
          "name": "run_simulation",
          "title": "Run simulation",
          "description": "Run a CFD, heat-transfer or conjugate thermal (CHT) simulation to predict temperatures, pressure drop, flow and forces on a meshed design. Uses GPU compute: usually 1–15 credits and 5–60 minutes for up to 20M cells; call estimate_cost first and check the budget. Not for quick what-ifs (use predict_physics or a design preview) or for checking inputs (use validate_simulation). Submit a new durable RANS/URANS/CHT simulation for an owned validated mesh. Use a fresh key for a newly requested run, even with identical inputs; keep the original key only for retries/resuming that run. Reuse completed results only when requested or accepted. Read get_request_schema(simulation), inspect actual mesh patches/zones, clarify the objective, flow/thermal conditions and consequential controls. Honor explicit choices; use disclosed best judgment for delegated choices and record assumptions in decision_context. Returns immediately with a job ID. Numerical acceptance is distinct from completion and publication. After any terminal outcome inspect get_job, get_job_events and owned summaries; report available residuals/forces/y+ with qualification, and resolved_physics. End your reply with get_job's viewer_url, opened in the chat's browser, for valid published fields, with unqualified/nonconverged labels where applicable; do not auto-rerun. May incur GPU charges.",
          "inputSchema": {
            "$defs": {
              "BoundaryCondition": {
                "additionalProperties": false,
                "properties": {
                  "thermal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/BoundaryThermal"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "CHT only: heat transfer through this outer solid surface; default adiabatic."
                  },
                  "type": {
                    "enum": ["inlet", "outlet", "wall", "rotating_wall", "symmetry", "farfield"],
                    "type": "string"
                  },
                  "value": {
                    "$ref": "#/$defs/BoundaryValue"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "BoundaryThermal": {
                "additionalProperties": false,
                "description": "Heat transfer through an outer solid surface in a CHT run. Surfaces default to adiabatic.",
                "properties": {
                  "ambient_temperature_k": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Surrounding temperature in K; convection only."
                  },
                  "emissivity": {
                    "default": 0,
                    "description": "Surface emissivity for radiation to surroundings at ambient_temperature_k; 0 for none.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "htc_w_m2k": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Heat transfer coefficient to the surroundings in W/(m^2 K); convection only."
                  },
                  "solid_zone": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Solid zone that owns this surface; needed when the run has more than one solid zone."
                  },
                  "type": {
                    "default": "adiabatic",
                    "description": "adiabatic (no heat crosses) or convection to the surroundings, with optional radiation. Fixed-temperature and fixed-heat-flux surfaces are not available.",
                    "enum": ["adiabatic", "convection"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "BoundaryValue": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flow_direction": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nonzero Cartesian inlet direction for volumetric flow."
                  },
                  "omega": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule)."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rotation origin in metres in the mesh coordinate system."
                  },
                  "pressure": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute pressure in Pa. Legacy outlet/farfield zero means reference_pressure, not vacuum."
                  },
                  "specific_dissipation_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet omega in 1/s; supply with turbulent_kinetic_energy."
                  },
                  "temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute temperature in K."
                  },
                  "turbulence_intensity": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Optional inlet turbulence fraction (0–1, not percent). Omit all inlet turbulence quantities to use model-specific solver defaults; provide both intensity and viscosity ratio for a custom inlet."
                  },
                  "turbulent_kinetic_energy": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet k in m^2/s^2; supply with specific_dissipation_rate."
                  },
                  "turbulent_viscosity_ratio": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Optional inlet eddy/molecular viscosity ratio. Omit all inlet turbulence quantities for model-specific solver defaults; supply with turbulence_intensity for a custom inlet."
                  },
                  "velocity": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cartesian velocity in m/s; mutually exclusive with inlet volumetric flow rate."
                  },
                  "volumetric_flow_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet volumetric flow in m^3/s, converted using actual inlet mesh area. Requires flow_direction."
                  },
                  "wall_type": {
                    "anyOf": [
                      {
                        "enum": ["no_slip", "slip", "moving_wall", "rotating_wall"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "ContactResistance": {
                "additionalProperties": false,
                "properties": {
                  "resistance_m2k_w": {
                    "description": "Contact resistance in m^2 K/W.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "zones": {
                    "description": "The two solid zones that touch.",
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      },
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      }
                    ],
                    "type": "array"
                  }
                },
                "required": ["resistance_m2k_w", "zones"],
                "type": "object"
              },
              "ConvergenceCriteria": {
                "additionalProperties": true,
                "description": "Fields as in assess_convergence: window_fraction, window_iterations, max_final_residual, residuals, residual_rise_orders, min_residual_orders_dropped, forces, force_band_percent, force_band_floor, max_energy_balance_error. Unset fields keep the standard test; unknown fields are rejected.",
                "type": "object"
              },
              "Fluid": {
                "additionalProperties": false,
                "properties": {
                  "density": {
                    "default": 1.225,
                    "description": "Density in kg/m^3; default is an air assumption, not a material lookup.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "molecular_weight": {
                    "default": 28.97,
                    "description": "Molecular weight in g/mol.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "viscosity": {
                    "default": 0.0000181,
                    "description": "Dynamic viscosity in Pa s.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "ForcesConfig": {
                "additionalProperties": false,
                "properties": {
                  "drag_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [1, 0, 0]
                  },
                  "enabled": {
                    "default": true,
                    "type": "boolean"
                  },
                  "exclude_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "include_fixed_velocity_walls": {
                    "default": false,
                    "type": "boolean"
                  },
                  "interval": {
                    "default": 1,
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "lift_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [0, 1, 0]
                  },
                  "mode": {
                    "default": "end_only",
                    "enum": ["off", "end_only", "interval", "history", "both", "every_step"],
                    "type": "string"
                  },
                  "patches": {
                    "description": "Actual wall patch names; empty uses native automatic wall selection.",
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "reference_area": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
