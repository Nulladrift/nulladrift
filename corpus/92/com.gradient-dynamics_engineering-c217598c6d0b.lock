        {
          "name": "create_upload",
          "title": "Upload a local CAD or STL file",
          "description": "Upload a STL/STEP/STP/3MF file from a machine where you can run commands (coding agents, CI, headless agents) without a picker and without the file passing through the model. Run the returned transfer.command there, replacing the quoted path argument with a shell-quoted absolute path; HTTP errors exit nonzero, and success prints the verified ready artifact. The token covers one file for 15 minutes: never share it or use it for another file. Retry the same transfer while valid; call again after expiry. Give size_bytes with sha256 only if already known, to enforce them or reuse an identical verified upload. Reuse a known ready artifact first; for a host attachment use import_surface_attachment; without command access use open_surface_upload. Normally omit coordinate_units (auto). Supply engineering_context from the request and expected_length_mm only if known. Inspect measured STL bounds to infer units; ask only when scale remains ambiguous. STEP/3MF use embedded units normalized to mm. Use reconstruct_cad for 3MF. Does not start compute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coordinate_units": {
                "default": "auto",
                "description": "Normally auto. STEP/STP/3MF use embedded units normalized to mm. STL units are resolved from measured bounds and supplied engineering context; ambiguous scale requires one clarification.",
                "enum": ["auto", "mm", "cm", "m", "in"],
                "type": "string"
              },
              "engineering_context": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Brief supplied engineering context, e.g. a full-size passenger car or a GPU cold plate. Do not infer context from a filename alone."
              },
              "expected_length_mm": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional known approximate longest overall dimension in millimetres. Supply only when known from the user or source evidence, not an invented guess."
              },
              "filename": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "sha256": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "size_bytes": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 5000000000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Upload a local CAD or STL file"
          },
