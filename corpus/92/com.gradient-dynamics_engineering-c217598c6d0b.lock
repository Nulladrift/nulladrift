        },
        {
          "name": "validate_mesh",
          "title": "Check mesh request",
          "description": "Validate structured, octree/prism or OpenFOAM meshing configuration without compute. All engines default to ±30% cell-count tolerance; leave cell_count_tolerance omitted unless the user requests another tolerance. A target count alone does not imply ±5%. Domain coordinates have engine-specific units; returns clarification/default guidance and configured routing. This checks the contract, not native geometry; use inspect_mesh_geometry for structured component IDs, and check_geometry and plan_mesh for what the octree mesher will make of it. Quality is assessed after execution.",
          "inputSchema": {
            "$defs": {
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "FlowRegion": {
                "additionalProperties": false,
                "properties": {
                  "ambient_name": {
                    "default": "ambient",
                    "description": "External CHT: region name of the fluid round the solids in the box.",
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,119}$",
                    "type": "string"
                  },
                  "boundary_names": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "enum": ["x_min", "x_max", "y_min", "y_max", "z_min", "z_max"]
                    },
                    "type": "object"
                  },
                  "component_id": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Native profile component ID for internal fluid or solid-only meshing; never infer one from a display name."
                  },
                  "kind": {
                    "default": "external",
                    "description": "external: fluid outside bodies; internal: a selected fluid volume; solid: a selected closed component's material, no fluid.",
                    "enum": ["external", "internal", "solid", "assembly"],
                    "type": "string"
                  },
                  "maximum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "minimum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "NamedSurface": {
                "additionalProperties": false,
                "description": "A wall part, uploaded as its own STL in the surface's units, for per-part sizes, layers, wakes and patches.",
                "properties": {
                  "name": {
                    "description": "The part's name in controls and the mesh's wall patch name.",
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$",
                    "type": "string"
                  },
                  "surface_artifact_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  }
                },
                "required": ["name", "surface_artifact_id"],
                "type": "object"
              },
              "OctreeControls": {
                "additionalProperties": true,
                "description": "As in create_mesh: flow, wake, layers and sizes. get_tool_schema has every field. Unknown fields are rejected.",
                "type": "object"
              },
              "OctreePrismOptions": {
                "additionalProperties": true,
                "description": "GD Unstructured. Sizing, units, layers and rotating zones: get_mesh_controls or get_tool_schema. Unknown fields and quality-gate overrides are rejected.",
                "properties": {
                  "controls": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/OctreeControls"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Meshing intent (flow, wake, layers, sizes) for an external mesh; the mesher resolves every field left out as the development meshes were validated. Fields beside it override that: set them only for a value the user asked for."
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "max_remesh_iterations": {
                    "default": 2,
                    "maximum": 6,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "named_surfaces": {
                    "description": "Wall parts, each an uploaded STL in the surface's units, named for controls.surfaces, wake parts and around regions; each becomes a wall patch. For a STEP: its preview's surfaces (omit: solids are named).",
                    "items": {
                      "$ref": "#/$defs/NamedSurface"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Who authorized automatic retries (the user or a delegated agent); needed for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "review: stop before another full or memory-escalated attempt, keeping out-of-tolerance results for a decision. automatic: the authorized, bounded retry budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal", "cht_step"],
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "OpenFoamOptions": {
                "additionalProperties": true,
                "description": "engine=openfoam. Sizing and quality fields: get_mesh_controls(engine=openfoam) or get_tool_schema; unknown fields are rejected.",
                "properties": {
                  "domain_max": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "domain_min": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Surface coordinate units; domain bounds and spacing are always in metres."
                  },
                  "max_remesh_iterations": {
                    "default": 3,
                    "maximum": 4,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maximum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "minimum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "n_prism_layers": {
                    "default": 3,
                    "description": "Requested layers; 0 disables layers. Achieved layers/coverage must be checked after meshing.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Who authorized automatic retries (the user or a delegated agent); needed for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "review: stop before another full mesh attempt. automatic: the authorized, bounded max_remesh_iterations, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal"],
                    "type": "string"
                  }
                },
                "required": ["domain_max", "domain_min", "maximum_spacing", "minimum_spacing"],
                "type": "object"
              },
              "StructuredBoundary": {
                "additionalProperties": false,
                "properties": {
                  "center_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "kind": {
                    "enum": ["port", "remaining_boundary"],
                    "type": "string"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  },
                  "normal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "radius_mm": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "shape": {
                    "default": "circle",
                    "enum": ["circle", "rectangle"],
                    "type": "string"
                  },
                  "size_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["kind", "name"],
                "type": "object"
              },
              "StructuredInternalSurface": {
                "additionalProperties": false,
                "description": "Two-sided rectangular pressure-jump selection, never an exterior wall.",
                "properties": {
                  "axis": {
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  "coordinate_mm": {
                    "type": "number"
                  },
                  "direction": {
                    "default": 1,
                    "enum": [-1, 1],
                    "type": "integer"
                  },
                  "maximum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "minimum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  }
                },
                "required": ["axis", "coordinate_mm", "maximum_mm", "minimum_mm", "name"],
                "type": "object"
              },
              "StructuredOptions": {
                "additionalProperties": true,
                "description": "engine=structured. Sizing and quality fields: get_mesh_controls(engine=structured) or get_tool_schema; unknown fields are rejected.",
                "properties": {
                  "adaptive_refinement": {
                    "default": true,
                    "description": "CAD assemblies and internal stair-step: resolve sampled thin features and tight passages, coarser bulk elsewhere. Sizing alone does not set wall-model accuracy.",
                    "type": "boolean"
                  },
                  "boundary_patches": {
                    "items": {
                      "$ref": "#/$defs/StructuredBoundary"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "flow_region": {
                    "$ref": "#/$defs/FlowRegion"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Derive from artifact metadata; required for uploads without declared units."
                  },
                  "internal_surfaces": {
                    "items": {
                      "$ref": "#/$defs/StructuredInternalSurface"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "mesh_type": {
                    "default": "stair_step",
                    "description": "Ask about surface fidelity; stair_step is the disclosed default. Neither option extrudes prism layers.",
                    "enum": ["stair_step", "cut_cell"],
                    "type": "string"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Who authorized automatic retries (the user or a delegated agent); needed for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "review: stop before another full target-count attempt. automatic: the authorized, bounded max_target_iterations, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "anyOf": [
                      {
                        "enum": ["external", "internal", "cht", "solid"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["flow_region"],
                "type": "object"
              },
              "Vector3": {
                "maxItems": 3,
                "minItems": 3,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "additionalProperties": false,
            "properties": {
