                    {
                      "type": "number"
                    },
                    {
                      "type": "integer"
                    }
                  ]
                },
                "maxProperties": 1024,
                "type": "object"
              },
              "reconstruction_id": {
                "format": "uuid",
                "type": "string"
              },
              "tolerance_mm": {
                "default": 0.02,
                "maximum": 1,
                "minimum": 0.001,
                "type": "number"
              }
            },
            "required": ["expected_parent_sha256", "reconstruction_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
