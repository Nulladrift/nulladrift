        {
          "name": "get_job",
          "title": "Get job status",
          "description": "Read job state, progress, quality/result summary and artifact IDs, including retained diagnostics after failure. For finished geometry, mesh or published simulation results, automatically prepares/reuses one default interactive 3D browser view. Mesh and simulation jobs also return geometry_viewer, the source surface's link: include it in the reply when the geometry was requested. Open its viewer_url when possible and show a labelled link without waiting for another user request, even if snapshots are also supplied; if viewer has operation_id, finish get_operation then show the link. Browser-view failure does not invalidate saved compute. Set prepare_viewer=false for status only or when the user declines a viewer. Do not create unrequested sections or restart a failed/cancelled view automatically. awaiting_decision means compute has finished and nothing is charged unless the mesh is accepted: report result.review and quality, then ask the user or explicitly authorized agent to accept/discard through review_job or authorize a new attempt. Stop polling this state; do not resubmit automatically. Report available residuals, forces and y+ with their qualification; no field export does not imply no metrics. Read events and owned summary artifacts before claiming evidence is missing. Numerical nonconvergence/step limits and publication/integrity failures are different outcomes; never auto-rerun. On failure, explain error.title and error.message, report its evidence and follow error.action. error.stage and ran_for say where and after how long; stage_source=last_observed is not a confirmed failure location. Unknown cause must stay unknown; same_request_may_succeed is advisory, never retry authorization. Tell the user in plain words and agree any new attempt with them. For a finished simulation (converged, diverged or stopped at its iteration limit) it also returns convergence_chart: show its viewer_url as a labelled residual history link every time (see view_convergence_history). If submission_unknown, do not submit a replacement: operator reconciliation is needed. A job's queue.message says why it hasn't started (waiting in the queue, for example one meshing job per person at a time, or waiting for GPU); pass it on to the user and keep polling. Waiting isn't charged. While a native mesh runs, result.stage, running_seconds against estimated_seconds (estimated_seconds_high is the upper bound), and memory_in_use_gb of memory_reserved_gb say what it is doing; report them rather than only that it is running. Poll at least five seconds apart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "format": "uuid",
                "type": "string"
              },
              "prepare_viewer": {
                "default": true,
                "description": "Prepare one default browser view automatically after completion. Set false when the user declines visualization or wants status only; saved viewer links may still be returned.",
                "type": "boolean"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
