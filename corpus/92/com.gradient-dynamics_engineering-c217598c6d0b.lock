        {
          "name": "check_geometry",
          "title": "Check geometry with the mesher",
          "description": "Check an owned STL or STEP with the native octree mesher before meshing: open and non-manifold edges, self-intersections, separate bodies, zero-area triangles and the part's size in metres against its declared units, each issue with its fix. A STEP with several solids also lists the mesher's names for them (the CAD labels in lower case), which per-part controls use; a CHT mesh's expected_region_names are the labels as written in the CAD. This works where inspect_mesh_geometry cannot read STEP. meshable=false means the mesher cannot mesh it as given. Warnings still mesh: the mesher closes small holes or shrink-wraps a dirty surface, which rounds sharp edges; tell the user before meshing such a surface. No mesh is built and nothing is charged. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
