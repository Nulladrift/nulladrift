          "name": "prepare_cold_plate_simulation",
          "title": "Prepare cold-plate simulation",
          "description": "Prepare a CHT request from a brief and actual mesh zones/patches. Assign each CSV heat-map cell exactly once to a solid zone, conserve total power and explicitly accept any zone averaging. Supply verified materials, inlet flow conversion and boundary conditions. Returns a validated request for run_simulation and its resolved_physics; sets thermal.characteristic_length_m from the inlet port. Never launches compute or pretends a spatial field is retained when averaged.",
          "inputSchema": {
            "$defs": {
              "BoundaryCondition": {
                "additionalProperties": false,
                "properties": {
                  "thermal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/BoundaryThermal"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "CHT only: heat transfer through this outer solid surface; default adiabatic."
                  },
                  "type": {
                    "enum": ["inlet", "outlet", "wall", "rotating_wall", "symmetry", "farfield"],
                    "type": "string"
                  },
                  "value": {
                    "$ref": "#/$defs/BoundaryValue"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "BoundaryThermal": {
                "additionalProperties": false,
                "description": "Heat transfer through an outer solid surface in a CHT run. Surfaces default to adiabatic.",
                "properties": {
                  "ambient_temperature_k": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Surrounding temperature in K; convection only."
                  },
                  "emissivity": {
                    "default": 0,
                    "description": "Surface emissivity for radiation to surroundings at ambient_temperature_k; 0 for none.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "htc_w_m2k": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Heat transfer coefficient to the surroundings in W/(m^2 K); convection only."
                  },
                  "solid_zone": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Solid zone that owns this surface; needed when the run has more than one solid zone."
                  },
                  "type": {
                    "default": "adiabatic",
                    "description": "adiabatic (no heat crosses) or convection to the surroundings, with optional radiation. Fixed-temperature and fixed-heat-flux surfaces are not available.",
                    "enum": ["adiabatic", "convection"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "BoundaryValue": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flow_direction": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nonzero Cartesian inlet direction for volumetric flow."
                  },
                  "omega": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule)."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rotation origin in metres in the mesh coordinate system."
                  },
                  "pressure": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute pressure in Pa. Legacy outlet/farfield zero means reference_pressure, not vacuum."
                  },
                  "specific_dissipation_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet omega in 1/s; supply with turbulent_kinetic_energy."
                  },
                  "temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute temperature in K."
                  },
                  "turbulence_intensity": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Optional inlet turbulence fraction (0–1, not percent). Omit all inlet turbulence quantities to use model-specific solver defaults; provide both intensity and viscosity ratio for a custom inlet."
                  },
                  "turbulent_kinetic_energy": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet k in m^2/s^2; supply with specific_dissipation_rate."
                  },
                  "turbulent_viscosity_ratio": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Optional inlet eddy/molecular viscosity ratio. Omit all inlet turbulence quantities for model-specific solver defaults; supply with turbulence_intensity for a custom inlet."
                  },
                  "velocity": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cartesian velocity in m/s; mutually exclusive with inlet volumetric flow rate."
                  },
                  "volumetric_flow_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet volumetric flow in m^3/s, converted using actual inlet mesh area. Requires flow_direction."
                  },
                  "wall_type": {
                    "anyOf": [
                      {
                        "enum": ["no_slip", "slip", "moving_wall", "rotating_wall"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "ContactResistance": {
                "additionalProperties": false,
                "properties": {
                  "resistance_m2k_w": {
                    "description": "Contact resistance in m^2 K/W.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "zones": {
                    "description": "The two solid zones that touch.",
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      },
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      }
                    ],
                    "type": "array"
                  }
                },
                "required": ["resistance_m2k_w", "zones"],
                "type": "object"
              },
              "ConvergenceCriteria": {
                "additionalProperties": true,
                "description": "Fields as in assess_convergence: window_fraction, window_iterations, max_final_residual, residuals, residual_rise_orders, min_residual_orders_dropped, forces, force_band_percent, force_band_floor, max_energy_balance_error. Unset fields keep the standard test; unknown fields are rejected.",
                "type": "object"
              },
              "DecisionContext": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Fluid": {
                "additionalProperties": false,
                "properties": {
                  "density": {
                    "default": 1.225,
                    "description": "Density in kg/m^3; default is an air assumption, not a material lookup.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "molecular_weight": {
                    "default": 28.97,
                    "description": "Molecular weight in g/mol.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "viscosity": {
                    "default": 0.0000181,
                    "description": "Dynamic viscosity in Pa s.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "FluxCoreConfig": {
                "additionalProperties": false,
                "description": "FluxCore controls; the native worker validates the mesh and solve.",
                "properties": {
                  "airspeed": {
                    "default": 0,
                    "description": "Freestream speed in m/s; zero is not a substitute for a missing operating point.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "angle_of_attack": {
                    "default": 0,
                    "description": "Angle of attack in degrees.",
                    "type": "number"
                  },
                  "architecture": {
                    "default": "fluxcore",
                    "description": "Fluxcore GPU solver. Use 'fluxcore'; 'workhorse' remains an accepted compatibility identifier for saved requests and deployed workers.",
                    "enum": ["fluxcore", "workhorse", "krylov"],
                    "type": "string"
                  },
                  "bdf_order": {
                    "anyOf": [
                      {
                        "maximum": 2,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "URANS backward-difference time order; resolved default 2."
                  },
                  "bdf_startup_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "boundary_conditions": {
                    "maxProperties": 512,
                    "patternProperties": {
                      "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$": {
                        "$ref": "#/$defs/BoundaryCondition"
                      }
                    },
                    "propertyNames": {
                      "maxLength": 128,
                      "minLength": 1
                    },
                    "type": "object"
                  },
                  "cht_inlet_temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "CHT inlet temperature in K."
                  },
                  "cht_turbulent_prandtl": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "compressible_config": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/NumericalControls"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Advanced FluxCore numerical controls. Search the solver-control catalogue for canonical names, architecture availability and defaults. Only explicit values are forwarded; unknown controls are rejected."
                  },
                  "convergence_tolerance": {
                    "default": 0.000001,
                    "description": "Unset, it follows run_quality.",
                    "exclusiveMaximum": 1,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "export_solution_fields": {
                    "default": true,
                    "type": "boolean"
                  },
                  "fluid": {
                    "$ref": "#/$defs/Fluid"
                  },
                  "forces": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ForcesConfig"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_cfl": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Positive URANS pseudo-time CFL, or -1 for architecture default."
                  },
                  "inner_chunk_size": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_early_stop": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_iterations": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_residual_drop": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "iterations_per_output": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Output cadence in iterations/physical steps; 0 disables intermediate output, not final export."
                  },
                  "live_history_interval": {
                    "default": 50,
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "max_iterations": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": 6000,
                    "description": "Steady iteration ceiling; explicitly null for URANS. Unset, it follows run_quality."
                  },
                  "mesh_format": {
                    "default": "cgns",
                    "enum": ["cgns", "openfoam"],
                    "type": "string"
                  },
                  "mesh_scale_factor": {
                    "default": 1,
                    "description": "Stored meshes are in meters. A different scale requires an explicit mesh_unit_conversion on the simulation request; OpenFOAM always requires 1.0.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "mrf_zones": {
                    "description": "Multiple reference frames tied to actual mesh cell zones; rotating walls alone do not define a rotating fluid zone.",
                    "items": {
                      "$ref": "#/$defs/MRFZone"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "n_physical_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "reference_pressure": {
                    "default": 101325,
                    "description": "Reference absolute pressure in Pa.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "run_quality": {
                    "default": "standard",
                    "description": "Fills only unset limits: max_iterations 3000/6000/12000, convergence_tolerance 1e-4/1e-6/1e-7 and, for CHT, compressible_config.cht_outer_tol 1e-3/1e-4/1e-5.",
                    "enum": ["quick", "standard", "thorough"],
                    "type": "string"
                  },
                  "scale_resolving": {
                    "anyOf": [
                      {
                        "const": "ddes",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "URANS only: ddes runs delayed detached-eddy simulation on the chosen turbulence model."
                  },
                  "simulation_type": {
                    "default": "rans",
                    "enum": ["rans", "urans", "cht"],
                    "type": "string"
                  },
                  "solver_mode": {
                    "const": "all_speed",
                    "default": "all_speed",
                    "type": "string"
                  },
                  "temperature": {
                    "default": 300,
                    "description": "Freestream absolute temperature in K.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "thermal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ThermalConfig"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "time_step": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "URANS physical time step in seconds; supply an engineering time scale."
                  },
                  "transient_predictor": {
                    "anyOf": [
                      {
                        "enum": ["previous", "extrapolate"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "transient_sample_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "transient_washout_steps": {
                    "anyOf": [
                      {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "turbulence_model": {
                    "default": "auto",
                    "description": "auto (default): k-omega SST for flow-only runs; for CHT laminar below Reynolds number 2300, otherwise k-omega SST. Set a model only when the user asks for one. The choice and its reason are returned as resolved_physics.",
                    "enum": ["auto", "k_omega_sst", "spalart_allmaras", "laminar"],
                    "type": "string"
                  },
                  "wall_function": {
                    "const": "spalding",
                    "default": "spalding",
                    "description": "Wall law used with wall functions, for the flow, the forces and the thermal wall handoff. Ignored when the walls are resolved (low_re or none).",
                    "type": "string"
                  },
                  "wall_treatment": {
                    "default": "auto",
                    "description": "auto (default): wall functions valid at any y+ for turbulent flow, resolved walls (low_re) for laminar flow. low_re needs a first cell at y+ of about 1; none is for laminar CHT only.",
                    "enum": ["auto", "wall_functions", "low_re", "none"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "ForcesConfig": {
                "additionalProperties": false,
                "properties": {
                  "drag_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [1, 0, 0]
                  },
                  "enabled": {
                    "default": true,
                    "type": "boolean"
                  },
                  "exclude_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "include_fixed_velocity_walls": {
                    "default": false,
                    "type": "boolean"
                  },
                  "interval": {
                    "default": 1,
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "lift_direction": {
                    "$ref": "#/$defs/Vector3",
                    "default": [0, 1, 0]
                  },
                  "mode": {
                    "default": "end_only",
                    "enum": ["off", "end_only", "interval", "history", "both", "every_step"],
                    "type": "string"
                  },
                  "patches": {
                    "description": "Actual wall patch names; empty uses native automatic wall selection.",
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "reference_area": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Reference area in m^2; positive for explicit mode, omitted/0 for auto_projected."
                  },
                  "reference_area_mode": {
                    "anyOf": [
                      {
                        "enum": ["explicit", "auto_projected"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit engineering reference area or a disclosed projected-area estimate."
                  },
                  "reference_length": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Moment reference length in metres."
                  },
                  "reference_velocity": {
                    "default": 0,
                    "description": "Reference speed in m/s; zero uses the freestream.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "MRFZone": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "cell_zone_name": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "non_rotating_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "omega": {
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule).",
                    "type": "number"
                  },
                  "origin": {
                    "$ref": "#/$defs/Vector3",
                    "default": [0, 0, 0],
                    "description": "Rotation origin in metres."
                  },
                  "rotating_wall_patches": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "zone_id": {
                    "description": "Verified mesh cell zone ID. If cell_zone_name is supplied, the native mesh reader resolves its authoritative ID.",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["axis", "omega", "zone_id"],
                "type": "object"
              },
              "MeshUnitConversion": {
                "additionalProperties": false,
                "description": "Interpret existing coordinate values for this run; never rewrite the source mesh.",
                "properties": {
                  "confirmed": {
                    "const": true,
                    "type": "boolean"
                  },
                  "coordinate_units": {
                    "enum": ["m", "mm", "cm", "in"],
                    "type": "string"
                  },
                  "source_sha256": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  }
                },
                "required": ["confirmed", "coordinate_units", "source_sha256"],
                "type": "object"
              },
              "NumericalControls": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "type": "string"
                    },
                    {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "Explicit advanced numerical controls. Use get_solver_controls to find canonical names/types and get_tool_schema for the full schema. Unknown names are rejected.",
                "type": "object"
              },
              "SurfaceHeatSource": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "default": "z",
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  "center_m": {
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "hotspot_fraction": {
                    "default": 0,
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "hotspot_offset_m": {
                    "default": [0, 0],
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "hotspot_scale": {
                    "default": 0.35,
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "plane_tolerance_m": {
                    "default": 0.000001,
                    "exclusiveMinimum": 0,
                    "maximum": 0.001,
                    "type": "number"
                  },
                  "position_m": {
                    "default": 0,
                    "type": "number"
                  },
                  "power_w": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "size_m": {
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "zone": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["center_m", "name", "power_w", "size_m", "zone"],
                "type": "object"
              },
              "ThermalConfig": {
                "additionalProperties": false,
                "properties": {
                  "characteristic_length_m": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 100,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Hydraulic diameter in metres of the passage that carries the inlet flow, used for the Reynolds number that chooses laminar or turbulent flow when turbulence_model is auto. With a volumetric inlet the flow is taken through a circle of this diameter."
                  },
                  "contact_resistances": {
                    "description": "Thermal contact resistance on named solid-solid interfaces; overrides the global cht_solid_contact_resistance on those interfaces.",
                    "items": {
                      "$ref": "#/$defs/ContactResistance"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "cp_per_zone": {
                    "additionalProperties": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "type": "object"
                  },
                  "expansion_coefficient_per_k": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 0.1,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Fluid volumetric thermal expansion coefficient in 1/K for buoyancy. Default 1/T_ref for gases; required for liquids (water is about 2.1e-4)."
                  },
                  "fluid_zone_names": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_-]+$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "minItems": 1,
                    "type": "array"
                  },
                  "gravity_m_s2": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Gravity vector in m/s^2 in mesh coordinates, e.g. [0, 0, -9.81]; turns on buoyancy (Boussinesq) in every fluid zone. Omit for no buoyancy."
                  },
                  "heat_source_w_per_zone": {
                    "additionalProperties": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "type": "object"
                  },
                  "inlet_patch": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "k_per_zone": {
                    "additionalProperties": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "type": "object"
                  },
                  "natural_convection_cycles": {
                    "anyOf": [
                      {
                        "maximum": 50,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Buoyant flow/thermal re-solve cycles sharing max_iterations; default 3 when gravity is set."
                  },
                  "outlet_patch": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "reference_temperature": {
                    "default": 300,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "rho_per_zone": {
                    "additionalProperties": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "type": "object"
                  },
                  "solid_zone_names": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_-]+$",
                      "type": "string"
                    },
                    "maxItems": 512,
                    "type": "array"
                  },
                  "surface_heat_sources": {
                    "items": {
                      "$ref": "#/$defs/SurfaceHeatSource"
                    },
                    "maxItems": 512,
                    "type": "array"
                  }
                },
                "required": ["cp_per_zone", "fluid_zone_names", "k_per_zone", "rho_per_zone"],
                "type": "object"
              },
              "Vector3": {
                "maxItems": 3,
                "minItems": 3,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "additionalProperties": false,
            "properties": {
              "allow_zone_averaging": {
                "default": false,
                "type": "boolean"
              },
              "brief_id": {
                "format": "uuid",
                "type": "string"
              },
              "heat_map_cells_by_zone": {
                "additionalProperties": {
                  "items": {
                    "type": "integer"
                  },
                  "type": "array"
                },
                "description": "Assign every zero-based heat-map row exactly once to a verified solid zone",
                "maxProperties": 512,
                "type": "object"
              },
              "request": {
                "additionalProperties": false,
                "properties": {
                  "config": {
                    "$ref": "#/$defs/FluxCoreConfig"
                  },
                  "convergence_criteria": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ConvergenceCriteria"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "How to judge this run converged when it finishes; omit for the standard test (every residual at or below 1e-3, none rising)."
                  },
                  "decision_context": {
                    "$ref": "#/$defs/DecisionContext"
                  },
                  "gpu": {
                    "anyOf": [
                      {
                        "enum": ["B200", "H100"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "GPU type: B200 (default) or H100."
                  },
                  "gpu_count": {
                    "anyOf": [
                      {
                        "enum": [1, 2, 4, 8],
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "GPUs for the solve (default 1). CHT and Krylov runs use one."
                  },
                  "mesh_artifact_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  },
                  "mesh_unit_conversion": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/MeshUnitConversion"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "project_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "restart_artifact_id": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_-]+$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["mesh_artifact_id"],
                "type": "object"
              }
            },
            "required": ["brief_id", "request"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare cold-plate simulation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
