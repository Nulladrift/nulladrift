        {
          "name": "plan_cold_plate",
          "title": "Plan cold-plate designs",
          "description": "Plan liquid cold-plate designs that cool a GPU or IGBT within its temperature and pressure-drop limits. Planning only: no compute and no charge. Derive a GPU/IGBT template prototype from a saved brief and validate up to 16 explicit parameter variants against its numeric manufacturing constraints. Inspect defaults, device layout, power allocation, conflicts and export limitations. Submit eligible geometry requests using create_geometry and returned stable keys. No geometry, simulation or optimisation compute is launched by planning.",
