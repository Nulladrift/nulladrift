        {
          "name": "review_job",
          "title": "Review mesh result",
          "description": "Accept or discard an existing verified mesh awaiting_decision because its achieved cell count missed the requested range. Report actual count, requested range and quality first; act only on the user's decision or explicit bounded authority delegated to the orchestrating agent. Accepting permits downstream simulation without remeshing; discarding retains saved artifacts. Neither action starts compute or relaxes hard quality checks or the 20-million-cell ceiling. To authorize a different attempt, use create_mesh with reviewed_job_id, the reviewed settings and a fresh idempotency key; do not resubmit an uncertain/running job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
