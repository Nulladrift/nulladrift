        {
          "name": "publish_design_batch",
          "title": "Publish design batch",
          "description": "Publish one meaningful valid intermediate design (base body, passages, mounting features, parameter groups). Send the complete document and expected_sequence, preserving identity and units. Use a fresh request_id for each batch; reuse unchanged after network uncertainty. API validates atomically; failures retain the last valid model. Studio follows live. No model usage or saved project revision is triggered.",
