        {
          "name": "reconstruct_cad",
          "title": "Reconstruct editable CAD",
          "description": "Create a durable parametric reconstruction of an owned STEP or 3MF artifact, measured against the uploaded geometry. With your own key this runs native_features mode: deterministic measured features and parameter controls, without model composition. Hosted composition, which uses Gradient Dynamics' own design model with the brief and context_artifact_ids, is available to Design and Studio sessions only; a key requesting it is refused. Retains source bodies; 3MF surfaces remain tessellated and fitted parameters carry explicit fidelity/edit-range limits. An exact original feature history is not implied. Returns an operation ID: poll get_operation for stages, then inspect fidelity, source_format, fitted versus retained features, edit ranges, input_groups and verified per-parameter scope. Groups organize controls without coupling them; composition provenance identifies the authored plan. No mesh or simulation starts. Never replace imported CAD with an approximate template.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "brief": {
                "default": "",
                "maxLength": 10000,
                "type": "string"
              },
              "composition_mode": {
                "default": "hosted",
                "enum": ["hosted", "native_features"],
                "type": "string"
              },
              "context_artifact_ids": {
                "description": "Owned project design-source artifacts containing supplier/manufacturing text, heat maps or reference images. Raw CAD is not sent to the hosted model.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "expected_parent_sha256": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "parameters": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "integer"
                    }
                  ]
                },
                "maxProperties": 1024,
