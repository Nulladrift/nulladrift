        {
          "name": "assess_convergence",
          "title": "Judge convergence",
          "description": "Judge whether a finished simulation converged by the user's own standard. Unset fields keep the standard test: every reported residual (continuity, Ux, Uy, Uz, energy) at or below 1e-3 and none rising over the last 20% of iterations; forces count only when named in forces. Uses the run's full saved history: no compute, no charge, and the saved verdict is unchanged. Report the status, its reasons and the thresholds used. When the user states their standard before a run, pass it as run_simulation's convergence_criteria.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "force_band_floor": {
                "default": 0.001,
                "description": "Spread always allowed, for coefficients near zero.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "force_band_percent": {
                "default": 1,
                "description": "Largest max-min spread of each named force coefficient over the window, as a percentage of its mean.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "forces": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.:-]+$",
                      "type": "string"
                    },
                    "maxItems": 16,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Force coefficients that must also settle, e.g. drag_coefficient, lift_coefficient; default none."
              },
              "job_id": {
                "format": "uuid",
                "type": "string"
              },
              "max_final_residual": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": 0.001,
                "description": "Each final residual must be at or below this value (default 1e-3); null drops the limit."
              },
              "min_residual_orders_dropped": {
                "anyOf": [
                  {
                    "maximum": 20,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Also require each residual to have fallen this many orders of magnitude from its peak."
              },
              "residual_rise_orders": {
                "default": 0.5,
                "description": "A residual is rising when the window's later half is this many orders of magnitude above its earlier half.",
                "exclusiveMinimum": 0,
                "maximum": 10,
                "type": "number"
              },
              "residuals": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.:-]+$",
                      "type": "string"
                    },
                    "maxItems": 16,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Residuals to judge, e.g. continuity; default every one reported."
              },
              "window_fraction": {
                "default": 0.2,
                "description": "Share of the iterations run, counted back from the last, that the test examines.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "window_iterations": {
                "anyOf": [
                  {
                    "maximum": 100000000,
                    "minimum": 10,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Examine this many final iterations instead of window_fraction."
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Judge convergence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "jobs:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:e6e50344d4878a270361a66a040bd76d7ef73cd3875113cf9557daba08df10d3"
        },
