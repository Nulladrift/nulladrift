        {
          "name": "submit_study",
          "title": "Submit design study",
          "description": "Run a parameter sweep or design study: submit several geometry, mesh or simulation cases at once with one combined estimate and one budget check. Either every case is admitted or none is. Not for a single run (use create_geometry, create_mesh or run_simulation). Pass plan_geometry_study's cases (request and idempotency_key each) with kind=geometry, or your own mesh or simulation sweep, all in one project. max_concurrent (default 2) caps how many run at once; each case becomes its own job with its own billing, and notify_url is notified as each finishes. A refusal (HTTP 402) reports the combined estimate and submits nothing. Keep each case's idempotency_key to retry safely.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {},
              "StudyCase": {
                "additionalProperties": false,
                "properties": {
                  "idempotency_key": {
                    "description": "Stable per case; plan_geometry_study returns one for each child.",
                    "pattern": "^[A-Za-z0-9_.:-]{1,128}$",
                    "type": "string"
                  },
                  "request": {
                    "additionalProperties": {
                      "$ref": "#/$defs/JsonValue"
                    },
                    "type": "object"
                  }
                },
                "required": ["idempotency_key", "request"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "description": "Runs to submit together; no partial admission.",
            "properties": {
              "cases": {
                "items": {
                  "$ref": "#/$defs/StudyCase"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "enum": ["geometry", "mesh", "simulation"],
                "type": "string"
              },
              "max_concurrent": {
                "default": 2,
                "description": "Most children of this study that run at once (plan limits still apply).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "notify_url": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public HTTPS URL notified as each child finishes."
              },
              "study_id": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                "type": "string"
              }
            },
            "required": ["cases", "kind", "study_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit design study"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "jobs:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:c99c9a5a8353bb9ea64821871a81865798be89ba6e828f25271a1293ff3c9672"
        },
        {
          "name": "validate_geometry",
          "title": "Check geometry request",
          "description": "Validate template parameters or a self-contained declarative design document and requested formats without compute. This is contract validation, not a native geometry/manufacturing assessment. Exactly one of template_id or document is required.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {}
            },
            "additionalProperties": false,
            "properties": {
              "bounds_m": {
                "anyOf": [
                  {
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      }
                    ],
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "deflection_mm": {
                "default": 0.01,
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "design_brief_artifact_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Immutable owned design brief used to derive this candidate; retained in job lineage"
              },
              "document": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "$ref": "#/$defs/JsonValue"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Self-contained gd.design/v1 feature graph, up to 1 MiB. Use native design catalogue/edit operations to compose it. Mutually exclusive with template_id; assets/external references are not supported. Native validity, manufacturing and exact export are checked by the worker."
              },
              "method": {
                "default": "exact",
                "description": "Exact STEP by default. For purpose=meshing, auto permits checked faceted STEP for implicit volumes; artifacts record the actual representation.",
                "enum": ["exact", "auto"],
                "type": "string"
              },
              "named_stl": {
                "default": false,
                "description": "Also export each selected document body as a separate named STL, alongside the combined surface, for mesh wall patches.",
                "type": "boolean"
              },
              "output_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 128,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "outputs": {
                "items": {
                  "enum": ["step", "stl", "design"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "parameters": {
                "additionalProperties": {
                  "$ref": "#/$defs/JsonValue"
                },
                "maxProperties": 256,
                "type": "object"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "purpose": {
                "default": "export",
                "description": "Meshing requires explicit volume output_names; heatmaps, boundary patches and display helpers are rejected by the geometry engine.",
                "enum": ["export", "meshing"],
                "type": "string"
              },
              "resolution": {
                "default": 64,
                "maximum": 160,
                "minimum": 24,
                "type": "integer"
              },
              "template_id": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Registered template; mutually exclusive with document"
              },
              "workflow_name": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check geometry request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "geometry:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:b445f5f36de198638b7a5999e272310f235d2ce6879cdb7021523868d8f1e64d"
        },
        {
          "name": "validate_mesh",
          "title": "Check mesh request",
          "description": "Validate structured, octree/prism or OpenFOAM meshing configuration without compute. All engines default to ±30% cell-count tolerance; leave cell_count_tolerance omitted unless the user requests another tolerance. A target count alone does not imply ±5%. Domain coordinates have engine-specific units; returns clarification/default guidance and configured routing. This checks the contract, not native geometry; use inspect_mesh_geometry for structured component IDs, and check_geometry and plan_mesh for what the octree mesher will make of it. Quality is assessed after execution.",
          "inputSchema": {
            "$defs": {
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "DecisionContext": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "FlowRegion": {
                "additionalProperties": false,
                "properties": {
                  "boundary_names": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "enum": ["x_min", "x_max", "y_min", "y_max", "z_min", "z_max"]
                    },
                    "type": "object"
                  },
                  "component_id": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Existing native profile component ID for internal fluid or solid-only meshing; never infer an ID from a display name."
                  },
                  "kind": {
                    "default": "external",
                    "description": "external: fluid outside bodies; internal: selected fluid volume; solid: material inside a selected closed component, with no fluid region.",
                    "enum": ["external", "internal", "solid"],
                    "type": "string"
                  },
                  "maximum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "minimum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "NamedSurface": {
                "additionalProperties": false,
                "description": "A part of the wall, uploaded as its own STL in the surface's units, for per-part sizes, layers, wakes and patches.",
                "properties": {
                  "name": {
                    "description": "The part's name in controls and the mesh's wall patch name.",
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$",
                    "type": "string"
                  },
                  "surface_artifact_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  }
                },
                "required": ["name", "surface_artifact_id"],
                "type": "object"
              },
              "OctreeControls": {
                "additionalProperties": true,
                "description": "As in create_mesh: flow, wake, layers and sizes. get_tool_schema has every field. Unknown fields are rejected.",
                "type": "object"
              },
              "OctreePrismOptions": {
                "additionalProperties": true,
                "description": "GD Unstructured. Get exact sizing, units, layers and rotating-zone controls with get_mesh_controls or get_tool_schema. Unknown fields and quality-gate overrides are rejected.",
                "properties": {
                  "controls": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/OctreeControls"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Meshing intent (flow, wake, layers, sizes) for an external mesh. The mesher resolves the domain, spacings and every other field left out from the geometry, with the settings the development meshes were validated with. Other fields given beside it override the resolved values: set them only for a value the user asked for."
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "max_remesh_iterations": {
                    "default": 2,
                    "maximum": 6,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "named_surfaces": {
                    "description": "Parts of the wall, each an uploaded STL in the surface's units, named for controls.surfaces, wake parts and around regions; each also becomes a wall patch. A STEP's solids are named by the mesher, so leave this out for a STEP.",
                    "items": {
                      "$ref": "#/$defs/NamedSurface"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit user or authorized-agent delegation for bounded automatic mesh retries; required for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "Review stops before another full mesh or memory-escalation attempt and retains eligible out-of-tolerance results for a decision. Automatic allows only the explicitly authorized bounded retry budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal", "cht_step"],
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "OpenFoamOptions": {
                "additionalProperties": true,
                "description": "engine=openfoam options. Sizing, refinement and quality fields: get_mesh_controls(engine=openfoam) or get_tool_schema. Unknown fields are rejected.",
                "properties": {
                  "domain_max": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "domain_min": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Surface coordinate units; domain bounds and spacing are always in metres."
                  },
                  "max_remesh_iterations": {
                    "default": 3,
                    "maximum": 4,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maximum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "minimum_spacing": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "n_prism_layers": {
                    "default": 3,
                    "description": "Requested layers; 0 disables layers. Achieved layers/coverage must be checked after meshing.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit user or authorized-agent delegation for bounded automatic mesh retries; required for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "Review stops before another full mesh attempt; automatic allows the explicitly authorized, bounded max_remesh_iterations budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal"],
                    "type": "string"
                  }
                },
                "required": ["domain_max", "domain_min", "maximum_spacing", "minimum_spacing"],
                "type": "object"
              },
              "StructuredBoundary": {
                "additionalProperties": false,
                "properties": {
                  "center_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "kind": {
                    "enum": ["port", "remaining_boundary"],
                    "type": "string"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  },
                  "normal": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "radius_mm": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "shape": {
                    "default": "circle",
                    "enum": ["circle", "rectangle"],
                    "type": "string"
                  },
                  "size_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["kind", "name"],
                "type": "object"
              },
              "StructuredInternalSurface": {
                "additionalProperties": false,
                "description": "Two-sided rectangular pressure-jump selection, never an exterior wall.",
                "properties": {
                  "axis": {
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  "coordinate_mm": {
                    "type": "number"
                  },
                  "direction": {
                    "default": 1,
                    "enum": [-1, 1],
                    "type": "integer"
                  },
                  "maximum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "minimum_mm": {
                    "$ref": "#/$defs/Vector3"
                  },
                  "name": {
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,31}$",
                    "type": "string"
                  }
                },
                "required": ["axis", "coordinate_mm", "maximum_mm", "minimum_mm", "name"],
                "type": "object"
              },
              "StructuredOptions": {
                "additionalProperties": true,
                "description": "engine=structured options. Sizing, refinement and quality fields: get_mesh_controls(engine=structured) or get_tool_schema. Unknown fields are rejected.",
                "properties": {
                  "adaptive_refinement": {
                    "default": true,
                    "description": "Internal stair-step: retain fine cells near walls and in tight passages, coarsen the bulk with conformal 2:1 transitions.",
                    "type": "boolean"
                  },
                  "boundary_patches": {
                    "items": {
                      "$ref": "#/$defs/StructuredBoundary"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "flow_region": {
                    "$ref": "#/$defs/FlowRegion"
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Derive from artifact metadata; required for uploads without declared units."
                  },
                  "internal_surfaces": {
                    "items": {
                      "$ref": "#/$defs/StructuredInternalSurface"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "mesh_type": {
                    "default": "stair_step",
                    "description": "Ask about surface fidelity; stair_step is the disclosed default. Neither option extrudes prism layers.",
                    "enum": ["stair_step", "cut_cell"],
                    "type": "string"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Explicit user or authorized-agent delegation for bounded automatic mesh retries; required for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "Review stops before another full target-count attempt; automatic allows the explicitly authorized bounded max_target_iterations budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "anyOf": [
                      {
                        "enum": ["external", "internal", "cht", "solid"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["flow_region"],
                "type": "object"
              },
              "Vector3": {
                "maxItems": 3,
                "minItems": 3,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "additionalProperties": false,
            "properties": {
              "decision_context": {
                "$ref": "#/$defs/DecisionContext"
              },
              "engine": {
                "description": "structured = Cartesian; octree_prism = native octree/polyhedral with prism layers; openfoam = legacy engine identifier. Prefer configured octree_prism for generic unstructured requests; preserve explicit methods. Choose delivered file formats separately with export_formats.",
                "enum": ["structured", "openfoam", "octree_prism"],
                "type": "string"
              },
              "export_formats": {
                "default": ["cgns"],
                "description": "Delivered mesh formats, in preference order. Default cgns is Standard CGNS (NGON/NFACE) for ParaView. gd_cgns is GD CGNS for Fluxcore/Studio; fluent is a Fluent-format polyhedral .msh; openfoam is a polyMesh archive. Select formats independently of the meshing engine. The first format is the primary download. GD CGNS is also retained internally for simulation and viewing. Preserve an explicit user choice; do not ask for a format when none was specified.",
                "items": {
                  "enum": ["cgns", "gd_cgns", "fluent", "openfoam"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "octree_prism": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/OctreePrismOptions"
                  },
                  {
                    "type": "null"
                  }
