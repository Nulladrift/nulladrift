        },
        {
          "name": "predict_physics",
          "title": "Predict with PhysicsAI",
          "description": "Get a fast PhysicsAI estimate of thermal or flow performance for a design, in seconds, instead of a full CFD run. Small GPU charge. Not a substitute for a simulation when the user needs a solver result or the design is outside the model's range. Submit PhysicsAI inference for an owned geometry-design artifact and an explicit immutable release. This is inference, not CFD or model training. Returns a job ID.",
          "inputSchema": {
            "$defs": {
              "ElectronicsConditions": {
                "additionalProperties": false,
                "description": "SI operating conditions supported by the electronics v014 adapter.\n\nBounds limit input abuse and invalid physics, not a promise of accuracy.\nThe model catalogue states the narrower, operator-qualified envelope.",
                "properties": {
                  "fan_speed_pct": {
                    "default": 100,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inlet_temperature_K": {
                    "default": 300,
                    "exclusiveMinimum": 0,
                    "maximum": 2000,
                    "type": "number"
                  },
                  "reference_pressure_Pa": {
                    "default": 101325,
                    "exclusiveMinimum": 0,
                    "maximum": 100000000,
                    "type": "number"
                  },
                  "total_power_W": {
                    "default": 80,
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "$ref": "#/$defs/ElectronicsConditions"
              },
              "geometry_artifact_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Use a fresh unique key for each newly requested job, even with identical inputs or a matching completed job. Reuse unchanged only for retries/resuming that same intended job. Never replace it to retry an uncertain submission.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "include_fields": {
                "default": true,
                "type": "boolean"
              },
              "model_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "model_version": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "notify_url": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional public HTTPS URL that receives a signed notification when the job finishes, so you need not poll."
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["geometry_artifact_id", "idempotency_key", "model_id", "model_version"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Predict with PhysicsAI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "predictions:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:e04d75455bf2f4b269343503c702a0b3f11448c53448d9fc91e3ce763afe9634"
        },
        {
          "name": "prepare_cold_plate_simulation",
          "title": "Prepare cold-plate simulation",
          "description": "Prepare a CHT request from a brief and actual mesh zones/patches. Assign each CSV heat-map cell exactly once to a solid zone, conserve total power and explicitly accept any zone averaging. Supply verified materials, inlet flow conversion and boundary conditions. Returns a validated request for run_simulation; never launches compute or pretends a spatial field is retained when averaged.",
          "inputSchema": {
            "$defs": {
              "BoundaryCondition": {
                "additionalProperties": false,
                "properties": {
                  "type": {
                    "enum": ["inlet", "outlet", "wall", "rotating_wall", "symmetry", "farfield"],
                    "type": "string"
                  },
                  "value": {
                    "$ref": "#/$defs/BoundaryValue"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "BoundaryValue": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flow_direction": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nonzero Cartesian inlet direction for volumetric flow."
                  },
                  "omega": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule)."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rotation origin in metres in the mesh coordinate system."
                  },
                  "pressure": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute pressure in Pa. Legacy outlet/farfield zero means reference_pressure, not vacuum."
                  },
                  "specific_dissipation_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet omega in 1/s; supply with turbulent_kinetic_energy."
                  },
                  "temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute temperature in K."
                  },
                  "turbulence_intensity": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet turbulence fraction, not percent; native reference default 0.01 when exact SST state is absent."
                  },
                  "turbulent_kinetic_energy": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet k in m^2/s^2; supply with specific_dissipation_rate."
                  },
                  "turbulent_viscosity_ratio": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet eddy/molecular viscosity ratio; native default 10 when exact SST state is absent."
                  },
                  "velocity": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cartesian velocity in m/s; mutually exclusive with inlet volumetric flow rate."
                  },
                  "volumetric_flow_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet volumetric flow in m^3/s, converted using actual inlet mesh area. Requires flow_direction."
                  },
                  "wall_type": {
                    "anyOf": [
                      {
                        "enum": ["no_slip", "slip", "moving_wall", "rotating_wall"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "ConvergenceCriteria": {
                "additionalProperties": true,
                "description": "Fields as in assess_convergence: window_fraction, window_iterations, max_final_residual, residuals, residual_rise_orders, min_residual_orders_dropped, forces, force_band_percent, force_band_floor. Unset fields keep the standard test; unknown fields are rejected.",
                "type": "object"
              },
              "DecisionContext": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Fluid": {
                "additionalProperties": false,
                "properties": {
                  "density": {
