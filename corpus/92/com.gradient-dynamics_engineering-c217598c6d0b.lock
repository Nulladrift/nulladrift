            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:dd93cbc403d924cb6458882af5862cfdca104a9bd8cf60326dcf3e423b10485d"
        },
        {
          "name": "view_simulation_result",
          "title": "View simulation result",
          "description": "Prepare an interactive Y-up browser view of an integrity-verified published simulation_result: VTU/FluxCore CGNS volume or VTP boundary. For a generic FluxCore pressure/velocity view, select field_names=[p,velocity_magnitude] with include_edges=false when those arrays are published, avoiding an oversized all-field view. Omitted fields use a bounded native default. The live Gradient Dynamics browser has surface/slice/streamline controls and can prepare further plots from the same saved simulation without a new solve. Surface mode shows saved fields; section mode cuts real volume topology at axis/position_m. For genuine velocity streamlines use mode=streamlines on a volume with explicit seed_points_m and max_length_m; vector_field defaults to U, integration_direction to forward, max_steps to 2000 (maximum 4000). Streamlines follow saved vectors with reported interpolation, not invented flow or a new solve. VTP cannot provide volume sections/streamlines. For surface/section, field_names selects saved scalars/components and include_edges=false omits optional wire edges without removing triangles or values. If a large view exceeds its limit, prepare smaller boundary/section or separate field views and assemble them; retain every field explicitly requested. Explain only the viewing limit, not storage internals. Assemble prepared views with assemble_simulation_viewer for one surface/slice/streamline browser workspace. Provide a default browser link automatically for valid published fields labelled unqualified/nonconverged where applicable; open it when the client supports browser opening. Never bypass access/integrity checks or rerun the solver for missing exports. No shell downloads, reconstructed convex interiors or transient NPZ support. Preserve the complete saved viewer link. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "axis": {
                "anyOf": [
                  {
                    "enum": ["x", "y", "z"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "field_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 12,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Published scalar fields or vector components/magnitude; omit to discover available fields."
              },
              "include_edges": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Surface/section views: false omits optional wire edges, retaining every triangle and field value. Omit preserves edges."
              },
              "integration_direction": {
                "anyOf": [
                  {
                    "enum": ["forward", "backward", "both"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Streamlines only: integration direction; defaults to forward."
              },
              "max_length_m": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Streamlines only: required maximum traced length in metres, at most 1,000,000 m."
              },
              "max_steps": {
                "anyOf": [
                  {
                    "maximum": 4000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Streamlines only: maximum integration steps per trace; defaults to 2000, at most 4000."
              },
              "mode": {
                "default": "surface",
                "enum": ["surface", "section", "streamlines"],
                "type": "string"
              },
              "position_m": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "seed_points_m": {
                "anyOf": [
                  {
                    "items": {
                      "maxItems": 3,
                      "minItems": 3,
                      "prefixItems": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "type": "array"
                    },
                    "maxItems": 128,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Streamlines only: explicit starting XYZ points in the saved volume coordinate frame, in metres."
              },
              "vector_field": {
                "anyOf": [
                  {
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]{0,127}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Streamlines only: saved velocity vector array, defaults to U. Scalar magnitude is not a vector."
              }
            },
            "required": ["artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "View simulation result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:12d3fe0b03289b0d5b8285865637efed1eca40cc2b612c78e2175c29746025b8"
        }
