          "description": "Call a discovered native design operation with its full schema; explicit controls are forwarded unchanged through the engineering API. Read get_design_operation_schema first. Edits return proposed documents; submit a self-contained document with create_geometry to save immutable engineering artifacts for viewing, meshing and simulation. For a shared Studio draft, publish each validated intermediate document with publish_design_batch, then finish_design_draft; Studio handles its review and revision handoff. This stateless call alone does not change a Studio application project or approve a design. Execution may incur compute. Synchronous study/evaluation timeout is not proof that work stopped; do not retry automatically. Binary exports/live streams use separate artifact transports.",
