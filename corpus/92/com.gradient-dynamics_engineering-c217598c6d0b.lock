        {
          "name": "prepare_surface_upload",
          "title": "Prepare CAD or STL upload",
          "description": "Reuse an already verified STL with this checksum, size, filename and units in the same project, or open its authenticated file picker. Existing clients may keep these arguments. If artifact.state is ready, continue with that artifact; no upload is needed. Otherwise show the upload panel or labelled Upload STL link and wait for get_artifact to report ready. Never perform client-side S3 uploads, retry previous transfer URLs or run shell/network commands. For a fresh interactive upload, prefer open_surface_upload without computing a hash.",
          "inputSchema": {
