        {
          "name": "run_simulation",
          "title": "Run simulation",
          "description": "Run a CFD, heat-transfer or conjugate thermal (CHT) simulation to predict temperatures, pressure drop, flow and forces on a meshed design. Uses GPU compute: usually 1–15 credits and 5–60 minutes for up to 20M cells; call estimate_cost first and check the budget. Not for quick what-ifs (use predict_physics or a design preview) or for checking inputs (use validate_simulation). Submit a new durable RANS/URANS/CHT simulation for an owned validated mesh. Use a fresh key for a newly requested run, even with identical inputs; keep the original key only for retries/resuming that run. Reuse completed results only when requested or accepted. Read get_request_schema(simulation), inspect actual mesh patches/zones, clarify the objective, flow/thermal conditions and consequential controls. Honor explicit choices; use disclosed best judgment for delegated choices and record assumptions in decision_context. Returns immediately with a job ID. Numerical acceptance is distinct from completion and publication. After any terminal outcome inspect get_job, get_job_events and owned summaries; report available residuals/forces/y+ with qualification. Provide the default browser viewer link automatically for valid published fields, with unqualified/nonconverged labels where applicable; do not auto-rerun. May incur GPU charges.",
          "inputSchema": {
            "$defs": {
              "BoundaryCondition": {
                "additionalProperties": false,
                "properties": {
                  "type": {
                    "enum": ["inlet", "outlet", "wall", "rotating_wall", "symmetry", "farfield"],
                    "type": "string"
                  },
                  "value": {
                    "$ref": "#/$defs/BoundaryValue"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "BoundaryValue": {
                "additionalProperties": false,
                "properties": {
                  "axis": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flow_direction": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nonzero Cartesian inlet direction for volumetric flow."
                  },
                  "omega": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Signed angular velocity in rad/s about axis (right-hand rule)."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rotation origin in metres in the mesh coordinate system."
                  },
                  "pressure": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute pressure in Pa. Legacy outlet/farfield zero means reference_pressure, not vacuum."
                  },
                  "specific_dissipation_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet omega in 1/s; supply with turbulent_kinetic_energy."
                  },
                  "temperature": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Absolute temperature in K."
                  },
                  "turbulence_intensity": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet turbulence fraction, not percent; native reference default 0.01 when exact SST state is absent."
                  },
                  "turbulent_kinetic_energy": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact SST inlet k in m^2/s^2; supply with specific_dissipation_rate."
                  },
                  "turbulent_viscosity_ratio": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet eddy/molecular viscosity ratio; native default 10 when exact SST state is absent."
                  },
                  "velocity": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cartesian velocity in m/s; mutually exclusive with inlet volumetric flow rate."
                  },
                  "volumetric_flow_rate": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Inlet volumetric flow in m^3/s, converted using actual inlet mesh area. Requires flow_direction."
                  },
                  "wall_type": {
                    "anyOf": [
                      {
                        "enum": ["no_slip", "slip", "moving_wall", "rotating_wall"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
