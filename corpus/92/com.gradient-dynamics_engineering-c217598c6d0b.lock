        {
          "name": "import_design_source_attachment",
          "title": "Import attached reference document",
          "description": "Import an already attached supplier PDF, requirements TXT, CSV heat map/table or PNG/JPEG using the file reference supplied by the chat host. Prefer this over another file picker when the host supplies the attachment. The API fetches and verifies the bytes, returning a ready artifact for read_design_source; then continue the user's existing request. Never invent a download URL/file ID, use a local path or expose the temporary URL. If the host cannot provide a transferable attachment, use open_design_source_upload once. Images remain visual evidence, not measured dimensions or numeric heat maps. Does not start engineering compute. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "$defs": {
              "ChatAttachment": {
                "additionalProperties": false,
                "description": "Standard JSON input; hosts may also recognize openai/fileParams metadata.",
                "properties": {
                  "download_url": {
                    "description": "Temporary HTTPS URL supplied by the chat client for this selected attachment. Never invent a URL or substitute a local path.",
                    "maxLength": 8192,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Opaque reference supplied by the chat client. It is not an API key.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "default": "",
                    "maxLength": 180,
                    "type": "string"
                  },
                  "mime_type": {
                    "default": "",
                    "maxLength": 180,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "file": {
                "$ref": "#/$defs/ChatAttachment"
              },
              "filename": {
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_. ()-]{0,179}$",
                "type": "string"
              },
              "media_type": {
                "enum": ["application/pdf", "text/csv", "text/plain", "image/png", "image/jpeg"],
                "type": "string"
              },
              "project_id": {
                "format": "uuid",
                "type": "string"
              },
              "sha256": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "size_bytes": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 10485760,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["file", "filename", "media_type", "project_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import attached reference document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:write",
            "gd/signInRequired": true,
            "openai/fileParams": ["file"]
          },
          "digest": "sha256:1fed284a9674575a556d93408d2b1192d2ff843b0e319fad8a43b45fb871a450"
        },
        {
          "name": "import_surface_attachment",
          "title": "Import attached CAD or STL",
          "description": "Import an already attached STL/STEP/STP/3MF using the actual file reference supplied by the chat host. Prefer this over asking the user to select that file again. The API fetches and verifies its bytes and returns a ready artifact; continue view_geometry for STL, inspect_mesh_geometry and requested meshing/sections. Reuse known ready artifacts first. Never invent a download URL/file ID, use a client path or expose the temporary URL. If the host cannot hand off the attachment, use create_upload when you can run commands where the file is, otherwise open_surface_upload once. Normally omit coordinate_units (auto). Supply engineering_context from the request and expected_length_mm only if known. Inspect measured STL bounds to infer units; ask only when scale remains ambiguous. STEP/3MF use embedded units normalized to mm. Use reconstruct_cad for 3MF before downstream geometry or meshing. Does not start engineering compute. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "$defs": {
              "ChatAttachment": {
                "additionalProperties": false,
                "description": "Standard JSON input; hosts may also recognize openai/fileParams metadata.",
                "properties": {
                  "download_url": {
                    "description": "Temporary HTTPS URL supplied by the chat client for this selected attachment. Never invent a URL or substitute a local path.",
                    "maxLength": 8192,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Opaque reference supplied by the chat client. It is not an API key.",
                    "maxLength": 1024,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "default": "",
                    "maxLength": 180,
                    "type": "string"
                  },
                  "mime_type": {
                    "default": "",
                    "maxLength": 180,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "coordinate_units": {
                "default": "auto",
                "description": "Normally auto. STEP/STP/3MF use embedded units normalized to mm. STL units are resolved from measured bounds and supplied engineering context; ambiguous scale requires one clarification.",
                "enum": ["auto", "mm", "cm", "m", "in"],
                "type": "string"
              },
              "engineering_context": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Brief supplied engineering context, e.g. a full-size passenger car or a GPU cold plate. Do not infer context from a filename alone."
              },
              "expected_length_mm": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional known approximate longest overall dimension in millimetres. Supply only when known from the user or source evidence, not an invented guess."
              },
              "file": {
                "$ref": "#/$defs/ChatAttachment"
              },
              "filename": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "sha256": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "size_bytes": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 5000000000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["file", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import attached CAD or STL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:write",
            "gd/signInRequired": true,
            "openai/fileParams": ["file"]
          },
          "digest": "sha256:ee59a73e9a312deb323b483ccd8f3249dac128459f986d3d7a2ea30f60ff804e"
        },
        {
          "name": "inspect_mesh_geometry",
          "title": "Inspect geometry for meshing",
          "description": "Inspect owned geometry without a mesh job or preview download; reuses saved results. Use detail=bounds for unstructured setup dimensions; a completed geometry export can provide STEP bounds without importing the assembly again. This does not assess closure or component identities. Use the default detail=components when selecting structured components. Normally omit input_unit: declared/CAD units remain authoritative; STL auto uses measured bounds with supplied engineering_context or expected_length_mm. If ambiguous, return unit candidates and ask one physical-dimension clarification; never invent a scale. Resolved bounds are in mm and an eligible STL viewer link is returned automatically. A configured CAD preparation service also assesses actual component IDs and closure. On an octree-only host STL inspection returns bounds only: closure and component IDs are unassessed, not guessed, and STEP inspection needs CAD preparation; use check_geometry there for closure, size and STEP solids. Use inspected bounds for structured or unstructured domains. meshing_ready describes assessed structured component closure only; open named patches are not an automatic unstructured rejection. Prefer configured octree_prism for generic external unstructured flow, preserving native quality gates. Structured internal-fluid/solid IDs must be assessed, never inferred from design output names. Read design.json with read_artifact_summary. If unavailable, explain the specific missing engineering evidence; do not switch flow region to bypass it. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "detail": {
                "default": "components",
                "description": "Use bounds for unstructured setup dimensions; verified geometry-export bounds can be reused without reimporting CAD. Components requests assessed identities for structured selection. Bounds never establish mesh readiness.",
                "enum": ["components", "bounds"],
                "type": "string"
              },
              "engineering_context": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Supplied engineering context for automatic STL units, e.g. a full-size passenger car. Do not infer it from a filename."
              },
              "expected_length_mm": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Known approximate longest physical dimension in millimetres; do not invent one."
              },
              "input_unit": {
                "anyOf": [
                  {
                    "enum": ["auto", "mm", "cm", "m", "in"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Normally omitted or auto: retain declared/embedded units, otherwise infer from measured STL bounds and engineering context. Supply explicit units only when known."
              }
            },
            "required": ["artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inspect geometry for meshing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "meshes:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:659191f3289b5fa2104bd1da55cc7e4976f4eeb703e19abee7e9444601d139e4"
        },
        {
          "name": "list_activity",
          "title": "List activity",
          "description": "List engineering jobs, durable preparations and meaningful synchronous operations across your credentials. Filter a workflow or study to follow related work. Read-only; never retries compute. Each entry has a browser link. Unbound synchronous requests are visible only to their submitter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "default": "",
                "maxLength": 64,
                "type": "string"
              },
              "category": {
