        {
          "name": "view_convergence_history",
          "title": "View residual history",
          "description": "Show a finished simulation's residual history in the browser: residuals per equation against iteration on a log scale, and drag, lift and any named force coefficients against iteration, with the saved convergence window and verdict when there is one. Do this at the end of every simulation, whether it converged, diverged or stopped at its iteration limit; get_job does it automatically and returns convergence_chart. Show viewer_url as a labelled link in your reply with the outcome and final residuals, preserving the complete URL including its fragment. Judge convergence from the history, not only from whether residuals reached a tolerance such as 1e-6: report result.convergence_assessment when present and point the user to its window on the chart; steady force coefficients with flat residuals can be a usable result short of the tolerance, while residuals still falling steeply, rising, or forces still drifting mean more iterations would change the answer. Report what the chart shows and let the user decide on a longer run; never rerun automatically. Uses only the job's saved result: no compute and no charge. Requires jobs:read and artifacts:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "View residual history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:1950ed7fde2da99b7b6051bf3e7318b13e2f7c771f4fd506d5de140d67986875"
        },
        {
          "name": "view_geometry",
          "title": "View geometry",
          "description": "Default for visualizing geometry: open a solid interactive 3D view in the Gradient Dynamics browser viewer for a generated geometry_surface or verified uploaded surface STL, including imported CAD surfaces. A static picture or 2D section alone does not replace this viewer unless explicitly requested. Uploaded STL needs no geometry job or second upload. Large ASCII uploads receive a bounded binary display derivative with every triangle retained; keep source_artifact_id for inspection and meshing. Render Y-up with orbit/pan/zoom, fit, standard views, sections, measurements and PNG capture. Measurements use tessellation, not exact CAD. Open viewer_url in the browser, not an embedded chat panel; show one labelled browser link if opening is unavailable. Continue already requested meshing/mesh sections. No geometry regeneration. Raw STEP is not rendered directly by this STL viewer. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "View geometry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:c36ef7da1058e4c2a3dc854b14ef0aedb15601bc51fe298a59b08f7ab56ca4be"
        },
        {
          "name": "view_mesh",
          "title": "View mesh",
          "description": "Open the saved mesh in the Gradient Dynamics interactive 3D Y-up browser: body-focused wind-tunnel view, Body/Tunnel/All presets, exact cell edges, boundary colours, quality metrics, probes and true 2D slice controls. Use this job's mesh_cgns, not CAD. Omitted surface_detail now uses native CGNS cell faces for sources up to 1 GiB; larger sources use a clearly labelled saved preview when available. surface_detail=cells requires native topology and never silently falls back to a preview. surface_detail=preview explicitly selects lightweight display geometry; its display triangles/edges are not volume-cell faces. Colours identify surface categories, not cell quality; unknown types stay unassigned. Exact zone/patch_names select smaller views. The hosted browser prepares new surfaces and true sections asynchronously from the same mesh, without remeshing. A cutaway clips the boundary and is not a volume cross-section. Use view_mesh_section and assemble_mesh_viewer for specifically requested saved planes. Return and open the complete browser viewer_url, not embedded HTML. Report actual quality failures and missing metrics honestly. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "patch_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 32,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional exact CGNS boundary names. Omit to display all available patches, individually toggleable."
              },
              "surface_detail": {
                "anyOf": [
                  {
                    "enum": ["cells", "preview"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "cells extracts native CGNS boundary faces and cell edges; requires a volume renderer. preview explicitly prefers the possibly simplified display boundary. Omit uses native cells for volumes up to 1 GiB, and a labelled saved preview for larger volumes."
              },
              "zone": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]{0,127}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "View mesh"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:b607604e10d8090199edd3f4bd3acea2b5fe3337d96d204be472da6b8387211f"
        },
        {
          "name": "view_mesh_section",
          "title": "View mesh cross-section",
          "description": "Show a 2D cross-section of actual volume-cell edges cut from a completed or verified awaiting_decision mesh_cgns artifact. Use this for requested mesh cross-sections, not geometry clipping. Sections and PNGs supplement view_mesh; they do not replace its interactive 3D browser viewer unless the user explicitly requests 2D only. Set axis and position_m in the saved mesh coordinate frame; optionally select an exact zone or crop. Returns an interactive 2D pan/zoom browser viewer, a supplementary PNG picture and saved PNG/HTML artifacts; no mesh regeneration. Y is vertical in X/Z sections. Supports structured and unstructured CGNS with NGON/NFACE or linear tetra/prism/pyramid/hexa topology, up to 1 GiB input and 200,000 section edges; no silent decimation. Open viewer_url in a browser and show its labelled link; include the PNG when requested. For a combined surface/section workspace use assemble_mesh_viewer with the returned JSON artifact_id. Surface clipping is not a substitute. Keep infrastructure details out of the answer. Repeating the same request reuses its saved section. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "axis": {
                "default": "z",
                "enum": ["x", "y", "z"],
                "type": "string"
              },
              "position_m": {
                "description": "Plane coordinate in metres in the saved mesh frame, e.g. z=0.093 m.",
                "type": "number"
              },
              "view_bounds_m": {
                "anyOf": [
                  {
                    "maxItems": 4,
                    "minItems": 4,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional crop [horizontal_min, vertical_min, horizontal_max, vertical_max], metres. X/Y for a Z section, Z/Y for X, X/Z for Y."
              },
              "zone": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.:-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional exact mesh zone from its summary; omit for all zones."
              }
            },
            "required": ["artifact_id", "position_m"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "View mesh cross-section"
