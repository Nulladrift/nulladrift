        {
          "name": "validate_simulation",
          "title": "Check simulation request",
          "description": "Validate the RANS, URANS or CHT input contract without compute. Verify mesh patches/material zones and units first. URANS requires an owned restart artifact. Leave turbulence_model and wall_treatment on auto unless the user asks for a model; tell the user the returned resolved_physics, with its reasons and warnings.",
          "inputSchema": {
            "$defs": {
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "ConvergenceCriteria": {
                "additionalProperties": true,
                "description": "Fields as in assess_convergence: window_fraction, window_iterations, max_final_residual, residuals, residual_rise_orders, min_residual_orders_dropped, forces, force_band_percent, force_band_floor, max_energy_balance_error. Unset fields keep the standard test; unknown fields are rejected.",
                "type": "object"
              },
              "MeshUnitConversion": {
                "additionalProperties": false,
                "description": "Interpret existing coordinate values for this run; never rewrite the source mesh.",
                "properties": {
                  "confirmed": {
                    "const": true,
                    "type": "boolean"
                  },
                  "coordinate_units": {
                    "enum": ["m", "mm", "cm", "in"],
                    "type": "string"
                  },
                  "source_sha256": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  }
                },
                "required": ["confirmed", "coordinate_units", "source_sha256"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "config": {
                "additionalProperties": true,
                "description": "As in run_simulation: physics, fluid, boundary conditions, thermal, forces and numerics. get_tool_schema has every field. Unknown fields are rejected.",
                "type": "object"
              },
              "convergence_criteria": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/ConvergenceCriteria"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How to judge this run converged when it finishes; omit for the standard test (every residual at or below 1e-3, none rising)."
              },
              "decision_context": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "gpu": {
                "anyOf": [
                  {
                    "enum": ["B200", "H100"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "GPU type: B200 (default) or H100."
              },
              "gpu_count": {
                "anyOf": [
                  {
                    "enum": [1, 2, 4, 8],
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
