        {
          "name": "plan_geometry_study",
          "title": "Plan design study",
          "description": "Validate up to 16 explicit template parameter variants and assign stable child submission keys. Returns a plan only: no jobs are launched. Submit the chosen cases together with submit_study (one budget check), or one at a time with create_geometry.",
          "inputSchema": {
            "$defs": {
              "GeometryRequest": {
                "additionalProperties": false,
                "properties": {
                  "bounds_m": {
                    "anyOf": [
                      {
                        "maxItems": 2,
                        "minItems": 2,
                        "prefixItems": [
                          {
                            "maxItems": 3,
                            "minItems": 3,
                            "prefixItems": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              }
                            ],
                            "type": "array"
                          },
                          {
                            "maxItems": 3,
                            "minItems": 3,
                            "prefixItems": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              }
                            ],
                            "type": "array"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "deflection_mm": {
                    "default": 0.01,
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "design_brief_artifact_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Immutable owned design brief used to derive this candidate; retained in job lineage"
                  },
                  "document": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "$ref": "#/$defs/JsonValue"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Self-contained gd.design/v1 feature graph, up to 1 MiB. Use native design catalogue/edit operations to compose it. Mutually exclusive with template_id; assets/external references are not supported. Native validity, manufacturing and exact export are checked by the worker."
                  },
                  "method": {
                    "default": "exact",
                    "description": "Exact STEP by default. For purpose=meshing, auto permits checked faceted STEP for implicit volumes; artifacts record the actual representation.",
                    "enum": ["exact", "auto"],
                    "type": "string"
                  },
                  "named_stl": {
                    "default": false,
