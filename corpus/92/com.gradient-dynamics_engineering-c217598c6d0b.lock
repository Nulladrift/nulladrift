                "anyOf": [
                  {
                    "$ref": "#/$defs/OpenFoamOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reviewed_job_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Explicitly requested new attempt after reviewing this completed mesh job, including quality or resource failures. Use a fresh idempotency key; this records lineage and never restarts the prior execution."
              },
              "structured": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/StructuredOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "surface_artifact_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "target_cells": {
                "default": 1000000,
                "maximum": 50000000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["engine", "surface_artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check mesh request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
