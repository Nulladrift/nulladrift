        {
          "name": "assemble_mesh_viewer",
          "title": "Assemble mesh inspection viewer",
          "description": "Combine 2–8 prepared mesh surface/section view artifact IDs from the same mesh job into one interactive browser workspace. Prepare requested surfaces with view_mesh and true volume-cell cuts with view_mesh_section; complete any pending operations first. Use their returned JSON artifact_id values (engineering_view/mesh_section), not mesh_cgns, PNG or HTML IDs. No extra extraction or meshing; at most 64 MiB combined data. Do not create unrequested sections just to assemble a workspace. The views retain surface-type colours, quality evidence and display-only warnings. Open the returned viewer_url in a browser preserving its fragment, never embed HTML in chat. This supports inspection of verified awaiting_decision candidates without accepting them for simulation. May return a pending operation_id instead of the finished result. Continue with get_operation at retry_after_seconds intervals; on success use result, then continue the requested workflow. Do not resubmit to check progress.",
          "inputSchema": {
