                  "mesh_type": {
                    "default": "stair_step",
                    "description": "Ask about surface fidelity; stair_step is the disclosed default. Neither option extrudes prism layers.",
                    "enum": ["stair_step", "cut_cell"],
                    "type": "string"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Who authorized automatic retries (the user or a delegated agent); needed for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "review: stop before another full target-count attempt. automatic: the authorized, bounded max_target_iterations, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "anyOf": [
                      {
                        "enum": ["external", "internal", "cht", "solid"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["flow_region"],
                "type": "object"
              },
              "Vector3": {
                "maxItems": 3,
                "minItems": 3,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "additionalProperties": false,
            "properties": {
              "decision_context": {
                "additionalProperties": false,
                "description": "User intent and declared assumptions, retained with the owned job request.",
                "properties": {
                  "assumptions": {
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "clarifications": {
                    "items": {
                      "$ref": "#/$defs/Clarification"
                    },
                    "maxItems": 16,
                    "type": "array"
                  },
                  "objective": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "engine": {
                "description": "structured: Cartesian; octree_prism: native octree/polyhedral with prism layers, for a generic unstructured request; openfoam: legacy. Keep a method the user named. Formats are export_formats.",
                "enum": ["structured", "openfoam", "octree_prism"],
                "type": "string"
              },
              "export_formats": {
                "default": ["cgns"],
                "description": "Delivered formats, any engine; the first is the primary download. cgns (default): Standard CGNS (NGON/NFACE) for ParaView. gd_cgns: for Fluxcore/Studio, always kept for viewing and simulation. fluent: polyhedral .msh. openfoam: polyMesh. Keep the user's choice; never ask for one.",
                "items": {
                  "enum": ["cgns", "gd_cgns", "fluent", "openfoam"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Use a fresh unique key for each new job, even with identical inputs or a matching finished job. Reuse it unchanged only to retry or resume that same intended job, an uncertain submission included.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "notify_url": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional public HTTPS URL sent a signed notification when the job finishes, so you need not poll."
              },
              "octree_prism": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/OctreePrismOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "openfoam": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/OpenFoamOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reviewed_job_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A new attempt the user asked for after reviewing this finished mesh job, failures included. Needs a fresh idempotency key; records lineage, never restarts the old run."
              },
              "structured": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/StructuredOptions"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "surface_artifact_id": {
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "target_cells": {
                "default": 1000000,
                "maximum": 50000000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["engine", "idempotency_key", "surface_artifact_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
