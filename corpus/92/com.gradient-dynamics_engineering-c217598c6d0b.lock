        {
          "name": "predict_physics",
          "title": "Predict with PhysicsAI",
          "description": "Get a fast PhysicsAI estimate of thermal or flow performance for a design, in seconds, instead of a full CFD run. Small GPU charge. Not a substitute for a simulation when the user needs a solver result or the design is outside the model's range. Submit PhysicsAI inference for an owned geometry-design artifact and an explicit immutable release. This is inference, not CFD or model training. Returns a job ID.",
          "inputSchema": {
            "$defs": {},
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "additionalProperties": false,
                "description": "SI operating conditions supported by the electronics v014 adapter.\n\nBounds limit input abuse and invalid physics, not a promise of accuracy.\nThe model catalogue states the narrower, operator-qualified envelope.",
                "properties": {
                  "fan_speed_pct": {
                    "default": 100,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inlet_temperature_K": {
                    "default": 300,
                    "exclusiveMinimum": 0,
                    "maximum": 2000,
                    "type": "number"
                  },
                  "reference_pressure_Pa": {
                    "default": 101325,
                    "exclusiveMinimum": 0,
                    "maximum": 100000000,
                    "type": "number"
                  },
                  "total_power_W": {
                    "default": 80,
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "geometry_artifact_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Use a fresh unique key for each new job, even with identical inputs or a matching finished job. Reuse it unchanged only to retry or resume that same intended job, an uncertain submission included.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "include_fields": {
                "default": true,
                "type": "boolean"
              },
              "model_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "model_version": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                "type": "string"
              },
              "notify_url": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional public HTTPS URL sent a signed notification when the job finishes, so you need not poll."
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["geometry_artifact_id", "idempotency_key", "model_id", "model_version"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Predict with PhysicsAI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "predictions:write",
            "gd/signInRequired": true
          },
