        {
          "name": "plan_cold_plate",
          "title": "Plan cold-plate designs",
          "description": "Plan liquid cold-plate designs that cool a GPU or IGBT within its temperature and pressure-drop limits. Planning only: no compute and no charge. Derive a GPU/IGBT template prototype from a saved brief and validate up to 16 explicit parameter variants against its numeric manufacturing constraints. Inspect defaults, device layout, power allocation, conflicts and export limitations. Submit eligible geometry requests using create_geometry and returned stable keys. No geometry, simulation or optimisation compute is launched by planning.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {}
            },
            "additionalProperties": false,
            "properties": {
              "brief_id": {
                "format": "uuid",
                "type": "string"
              },
              "parameters": {
                "additionalProperties": {
                  "$ref": "#/$defs/JsonValue"
                },
                "maxProperties": 128,
                "type": "object"
              },
              "project_id": {
                "format": "uuid",
                "type": "string"
              },
              "vary": {
                "additionalProperties": {
                  "items": {
                    "$ref": "#/$defs/JsonValue"
                  },
                  "type": "array"
                },
                "description": "Explicit grid of up to 16 candidates; use evaluated best parameters as the next baseline",
                "maxProperties": 4,
                "type": "object"
              }
            },
            "required": ["brief_id", "project_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan cold-plate designs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "geometry:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:8dd4c8fcfc77a281cb0db8982b90f690d10282b29bb2aaceef25cfee3b09c8d4"
        },
        {
          "name": "plan_geometry_study",
          "title": "Plan design study",
          "description": "Validate up to 16 explicit template parameter variants and assign stable child submission keys. Returns a plan only: no jobs are launched. Submit the chosen cases together with submit_study (one budget check), or one at a time with create_geometry.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {}
            },
            "additionalProperties": false,
            "description": "Explicit cases only; no automatic fan-out, compute or app project edits.",
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "bounds_m": {
                    "anyOf": [
                      {
                        "maxItems": 2,
                        "minItems": 2,
                        "prefixItems": [
                          {
                            "maxItems": 3,
                            "minItems": 3,
                            "prefixItems": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              }
                            ],
                            "type": "array"
                          },
                          {
                            "maxItems": 3,
                            "minItems": 3,
                            "prefixItems": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              }
                            ],
                            "type": "array"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "deflection_mm": {
                    "default": 0.01,
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "design_brief_artifact_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Immutable owned design brief used to derive this candidate; retained in job lineage"
                  },
                  "document": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "$ref": "#/$defs/JsonValue"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Self-contained gd.design/v1 document, up to 1 MiB, of general operations and library blocks (search_design_library); `blocks` {name: edition} copies blocks in. Not with template_id; no assets or external references. The worker checks validity, manufacturing and exact export."
                  },
                  "method": {
                    "default": "exact",
                    "description": "Exact STEP by default. For purpose=meshing, auto permits checked faceted STEP for implicit volumes; artifacts record the actual representation.",
                    "enum": ["exact", "auto"],
                    "type": "string"
                  },
                  "named_stl": {
                    "default": false,
                    "description": "Also export each selected document body as a separate named STL, alongside the combined surface, for mesh wall patches.",
                    "type": "boolean"
                  },
                  "output_names": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 128,
                        "minItems": 1,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "outputs": {
                    "items": {
                      "enum": ["step", "stl", "design", "view"],
                      "type": "string"
                    },
                    "maxItems": 4,
                    "minItems": 1,
                    "type": "array"
                  },
                  "parameters": {
                    "additionalProperties": {
                      "$ref": "#/$defs/JsonValue"
                    },
                    "maxProperties": 256,
                    "type": "object"
                  },
                  "project_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "purpose": {
                    "default": "export",
                    "description": "Meshing requires explicit volume output_names; heatmaps, boundary patches and display helpers are rejected by the geometry engine.",
                    "enum": ["export", "meshing"],
                    "type": "string"
                  },
                  "resolution": {
                    "default": 64,
                    "maximum": 160,
                    "minimum": 24,
                    "type": "integer"
                  },
                  "template_id": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Registered template; mutually exclusive with document"
                  },
                  "workflow_name": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  }
                },
                "type": "object"
              },
              "study_id": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                "type": "string"
              },
              "variants": {
                "items": {
                  "additionalProperties": {
                    "$ref": "#/$defs/JsonValue"
                  },
                  "type": "object"
                },
                "maxItems": 16,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["request", "study_id", "variants"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan design study"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "geometry:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:11852eac8be59a351d012a5a79cc378c596ee9693c8e0614419e373e54172c39"
        },
        {
          "name": "plan_mesh",
          "title": "Plan mesh (dry run)",
          "description": "Dry run of an external octree mesh: send the create_mesh request (octree_prism.controls, no idempotency_key) and see the domain, sizes, boundary layer, refinement regions, predicted cells and the cores and memory it would get, without meshing. The mesher refuses what it cannot mesh, with numbers: a target too small for the sizes or first layer, a first layer thinner than the curved wall sags, or a target too large for meshing memory. Read feasible, then refusal or predicted_cells and notes, and tell the user before create_mesh when the prediction is far from target_cells. Internal fluid and CHT meshes, and requests with explicit domain and spacings, are not planned. Starts no compute and is not charged.",
          "inputSchema": {
            "$defs": {
              "Clarification": {
                "additionalProperties": false,
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "question": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["question"],
                "type": "object"
              },
              "FlowRegion": {
                "additionalProperties": false,
                "properties": {
                  "ambient_name": {
                    "default": "ambient",
                    "description": "External CHT: region name of the fluid round the solids in the box.",
                    "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,119}$",
                    "type": "string"
                  },
                  "boundary_names": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "enum": ["x_min", "x_max", "y_min", "y_max", "z_min", "z_max"]
                    },
                    "type": "object"
                  },
                  "component_id": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Native profile component ID for internal fluid or solid-only meshing; never infer one from a display name."
                  },
                  "kind": {
                    "default": "external",
                    "description": "external: fluid outside bodies; internal: a selected fluid volume; solid: a selected closed component's material, no fluid.",
                    "enum": ["external", "internal", "solid", "assembly"],
                    "type": "string"
                  },
                  "maximum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "minimum_mm": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "NamedSurface": {
                "additionalProperties": false,
                "description": "A wall part, uploaded as its own STL in the surface's units, for per-part sizes, layers, wakes and patches.",
                "properties": {
                  "name": {
                    "description": "The part's name in controls and the mesh's wall patch name.",
                    "pattern": "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$",
                    "type": "string"
                  },
                  "surface_artifact_id": {
                    "maxLength": 128,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  }
                },
                "required": ["name", "surface_artifact_id"],
                "type": "object"
              },
              "OctreeBoundaryLayer": {
                "additionalProperties": false,
                "properties": {
                  "first_height": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "First layer height in metres. Give this or y_plus; with neither the stack is sized for the core cells."
                  },
                  "gap_compression": {
                    "default": true,
                    "description": "In narrow passages shrink the stack to fit, keeping its layer count, instead of dropping layers.",
                    "type": "boolean"
                  },
                  "growth_rate": {
                    "default": 1.2,
                    "maximum": 2,
                    "minimum": 1,
                    "type": "number"
                  },
                  "layers": {
                    "default": 5,
                    "description": "Prism layers; 0 for none (inviscid or wall-function walls).",
                    "maximum": 40,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "y_plus": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target first-cell y+; needs flow.speed. A requested y+ is not an achieved one."
                  }
                },
                "type": "object"
              },
              "OctreeControls": {
                "additionalProperties": false,
                "description": "Meshing intent: the mesher sizes everything left out for the request's target_cells.",
                "properties": {
                  "boundary_layer": {
                    "$ref": "#/$defs/OctreeBoundaryLayer"
                  },
                  "exact_count": {
                    "default": false,
                    "description": "When the user states a cell count, probe the topology to land within 10% of it. Rebuilds need retry_policy=automatic, else the first passing mesh is kept and its count reported.",
                    "type": "boolean"
                  },
                  "flow": {
                    "$ref": "#/$defs/OctreeFlow"
                  },
                  "surface": {
                    "$ref": "#/$defs/OctreeSurface"
                  },
                  "surfaces": {
                    "description": "Size and layer overrides per named surface or glob such as wheel_*.",
                    "maxProperties": 64,
                    "patternProperties": {
                      "^[A-Za-z0-9_.*?\\[\\]-]+$": {
                        "$ref": "#/$defs/OctreeSurfaceOverride"
                      }
                    },
                    "propertyNames": {
                      "maxLength": 64,
                      "minLength": 1
                    },
                    "type": "object"
                  },
                  "volume": {
                    "$ref": "#/$defs/OctreeVolume"
                  }
                },
                "type": "object"
              },
              "OctreeDomain": {
                "additionalProperties": false,
                "description": "Body lengths from the body (unset ones as \"standard\"; side 0 touches it), or absolute corners in metres.",
                "properties": {
                  "bottom": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Below the body when there is no ground; default as top."
                  },
                  "downstream": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "maximum": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "minimum": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "side": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "top": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "upstream": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "OctreeFlow": {
                "additionalProperties": false,
                "properties": {
                  "angle_of_attack": {
                    "default": 0,
                    "description": "Degrees, turning the stream from direction towards up. The domain stays on the body axes; the wake follows the stream.",
                    "maximum": 45,
                    "minimum": -45,
                    "type": "number"
                  },
                  "contact_plinth": {
                    "default": false,
                    "description": "Tyres on the ground: cut them just above it and extrude a vertical plinth instead of the tangential wedge.",
                    "type": "boolean"
                  },
                  "direction": {
                    "default": "+x",
                    "description": "Free-stream direction.",
                    "enum": ["+x", "-x", "+y", "-y", "+z", "-z"],
                    "type": "string"
                  },
                  "farfield": {
                    "default": "inlet_outlet",
                    "description": "inlet_outlet: velocity inlet upstream, pressure outlet downstream, symmetry elsewhere. freestream: far-field patches all round (free flight at any angle); a ground stays a moving wall.",
                    "enum": ["inlet_outlet", "freestream"],
                    "type": "string"
                  },
                  "ground": {
                    "anyOf": [
                      {
                        "enum": ["none", "body_min"],
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "default": "none",
                    "description": "\"none\": free stream all round; \"body_min\": a moving-wall ground at the lowest point of the body (vehicles); a number: the ground at that up-coordinate in metres."
                  },
                  "kinematic_viscosity": {
                    "default": 0.000015,
                    "description": "m^2/s, for y_plus sizing; air by default.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "sideslip": {
                    "default": 0,
                    "description": "Degrees, turning the stream towards the side axis.",
                    "maximum": 45,
                    "minimum": -45,
                    "type": "number"
                  },
                  "speed": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Free-stream speed in m/s; sizes the first layer from boundary_layer.y_plus."
                  },
                  "up": {
                    "default": "+y",
                    "description": "Up axis, different from the direction's axis.",
                    "enum": ["+x", "-x", "+y", "-y", "+z", "-z"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "OctreePartWake": {
                "additionalProperties": false,
                "description": "A wake behind named parts (mirrors, wheels, a hub), along the stream.",
                "properties": {
                  "length": {
                    "default": 0.5,
                    "description": "Downstream extent in body lengths.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "size": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cell size in metres; default the body wake's."
                  },
                  "spread": {
                    "default": 0,
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "surfaces": {
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_.*?\\[\\]-]+$",
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["surfaces"],
                "type": "object"
              },
              "OctreePrismOptions": {
                "additionalProperties": true,
                "description": "GD Unstructured. Sizing, units, layers and rotating zones: get_mesh_controls or get_tool_schema. Unknown fields and quality-gate overrides are rejected.",
                "properties": {
                  "controls": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/OctreeControls"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Meshing intent (flow, wake, layers, sizes) for an external mesh; the mesher resolves every field left out as the development meshes were validated. Fields beside it override that: set them only for a value the user asked for."
                  },
                  "input_unit": {
                    "anyOf": [
                      {
                        "enum": ["mm", "cm", "m", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "max_remesh_iterations": {
                    "default": 2,
                    "maximum": 6,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "named_surfaces": {
                    "description": "Wall parts, each an uploaded STL in the surface's units, named for controls.surfaces, wake parts and around regions; each becomes a wall patch. For a STEP: its preview's surfaces (omit: solids are named).",
                    "items": {
                      "$ref": "#/$defs/NamedSurface"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "retry_authorization_reason": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Who authorized automatic retries (the user or a delegated agent); needed for retry_policy=automatic."
                  },
                  "retry_policy": {
                    "default": "review",
                    "description": "review: stop before another full or memory-escalated attempt, keeping out-of-tolerance results for a decision. automatic: the authorized, bounded retry budget, within the credential's retry allowance.",
                    "enum": ["review", "automatic"],
                    "type": "string"
                  },
                  "workflow": {
                    "default": "external",
                    "enum": ["external", "internal", "cht_step"],
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "OctreeRegion": {
                "additionalProperties": false,
                "description": "Cells inside are no larger than size: a box (minimum and maximum, or center and lengths,\nrotated by x_axis and y_axis), cylinder (start, end, radius), sphere (center, radius)\nor around named surfaces (surfaces, distance).",
                "properties": {
                  "center": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "distance": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "An around region's reach from its surfaces, in metres."
                  },
                  "end": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inner_radius": {
                    "default": 0,
                    "description": "An annulus round a hub, or a spherical shell.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "lengths": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Full box lengths along x_axis, y_axis and their cross product."
                  },
                  "maximum": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "minimum": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "anyOf": [
                      {
                        "maxLength": 96,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "radius": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "shape": {
                    "default": "box",
                    "enum": ["box", "cylinder", "sphere", "around"],
                    "type": "string"
                  },
                  "size": {
                    "description": "Largest cell inside, in metres.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "start": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Vector3"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "surfaces": {
                    "anyOf": [
                      {
                        "items": {
                          "maxLength": 64,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9_.*?\\[\\]-]+$",
                          "type": "string"
                        },
                        "maxItems": 64,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Named surfaces for an around region."
                  },
                  "x_axis": {
                    "anyOf": [
                      {
