          "name": "prepare_design_source_upload",
          "title": "Prepare reference document upload",
          "description": "Prepare a supplier PDF, requirements TXT, CSV or reference PNG/JPEG with known size and SHA-256. Returns the API file picker or reuses the exact verified source. Follow returned upload state; never run shell uploads. Prefer open_design_source_upload when no checksum is available.",
