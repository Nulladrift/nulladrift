          },
          "meta": {
            "gd/signInRequired": false
          },
          "digest": "sha256:5e6e9699473abfcfd83e9154a7278d03e8b03e3fffbb1f0fd4e1f2aa61d7586e"
        },
        {
          "name": "finish_design_draft",
          "title": "Finish design draft",
          "description": "Finish or cancel the shared draft at its current sequence. Ready drafts remain inspectable and are handed to Studio's normal proposal/revision review; this never bypasses engineer approval.",
          "inputSchema": {
