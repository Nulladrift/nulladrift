        {
          "name": "open_surface_upload",
          "title": "Upload CAD or STL",
          "description": "Fallback STL/STEP/3MF file picker only for a new file when the chat host cannot hand off its attachment. Prefer import_surface_attachment for a host-provided file reference, or create_upload when you can run commands on the machine with the file. If the geometry already has a verified ready artifact ID, use get_artifact then view_geometry/inspect_mesh_geometry; do not ask for another upload or CAD-uploader confirmation. Exact checksum matches can use prepare_surface_upload. Filename alone is not identity; clarify reuse when uncertain. API transfers/verifies bytes, with no terminal or S3 client. Retain artifact ID and continue requested stages once ready. Normally omit coordinate_units (auto). Supply engineering_context from the request and expected_length_mm only if known. Inspect measured STL bounds to infer units; ask only when scale remains ambiguous. STEP/3MF use embedded units normalized to mm. Use reconstruct_cad for 3MF. Upload does not start compute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coordinate_units": {
                "default": "auto",
                "description": "Normally auto. STEP/STP/3MF use embedded units normalized to mm. STL units are resolved from measured bounds and supplied engineering context; ambiguous scale requires one clarification.",
                "enum": ["auto", "mm", "cm", "m", "in"],
                "type": "string"
              },
              "engineering_context": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Brief supplied engineering context, e.g. a full-size passenger car or a GPU cold plate. Do not infer context from a filename alone."
              },
              "expected_length_mm": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional known approximate longest overall dimension in millimetres. Supply only when known from the user or source evidence, not an invented guess."
              },
              "filename": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "sha256": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
