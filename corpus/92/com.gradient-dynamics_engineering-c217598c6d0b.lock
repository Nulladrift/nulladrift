                "type": "string"
              },
              "target_cells": {
                "default": 1000000,
                "maximum": 50000000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["engine", "idempotency_key", "surface_artifact_id"],
            "type": "object"
