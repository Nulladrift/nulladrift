              },
              "media_type": {
                "enum": ["application/pdf", "text/csv", "text/plain", "image/png", "image/jpeg"],
                "type": "string"
              },
              "project_id": {
                "format": "uuid",
                "type": "string"
              },
              "sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "size_bytes": {
                "exclusiveMinimum": 0,
                "maximum": 10485760,
                "type": "integer"
              }
            },
            "required": ["filename", "media_type", "project_id", "sha256", "size_bytes"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare reference document upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:write",
            "gd/signInRequired": true,
            "ui": {
              "resourceUri": "ui://gradient/upload.html"
            }
          },
          "digest": "sha256:56207b6ced6e235121b7156f1ff81958326d51619bac0552ef292461d6cc47cd"
        },
        {
          "name": "prepare_job_viewer",
          "title": "Prepare job viewer",
          "description": "Prepare or reopen a finished geometry, verified mesh candidate or published simulation result in its default interactive 3D browser viewer with orbit/pan/zoom. get_job normally does this automatically; PNG snapshots and 2D sections do not replace this view. Uses only this job’s saved outputs and one durable cached preparation; it never reruns compute, creates extra sections or retries failed/cancelled preparation. Show viewer_url automatically in a labelled browser link, preserving the complete fragment. Pending viewer.operation_id or operation_id is continued with get_operation. Report visualization failure separately from job outcome. Requires jobs:read and artifacts:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare job viewer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:de1586c9ffc5ab0e3ceb5edbd41c21267465ebd3a5f73a088b47b1f6252f7d64"
        },
        {
          "name": "prepare_surface_heatmap",
          "title": "Prepare surface heatmap",
          "description": "Prepare a spatial CHT heatmap from CSV x_mm,y_mm,width_mm,height_mm,power_W and a verified mesh zone. Coordinates are lower-left in-plane millimeters; power is total watts per rectangle, never W/m². Specify receiving solid, plane axis/position and tolerance. Returns thermal.surface_heat_sources in meters, preserving the distribution for Fluxcore; no zone averaging or compute. The solver still checks full exterior-face coverage. Remove replaced sources to avoid double heating; do not infer numeric loads from image colors.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "CSV rectangles are lower-left coordinates in the two in-plane axes, in XYZ order.",
            "properties": {
              "axis": {
                "default": "z",
                "enum": ["x", "y", "z"],
                "type": "string"
              },
              "csv_text": {
                "maxLength": 256000,
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "mesh_artifact_id": {
                "format": "uuid",
                "type": "string"
              },
              "plane_tolerance_mm": {
                "default": 0.01,
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "position_mm": {
                "default": 0,
                "type": "number"
              },
              "zone": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["csv_text", "filename", "mesh_artifact_id", "zone"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare surface heatmap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "gd/requiredScope": "simulations:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:b40f9aa5ba259746034571be739f980b69280e5a28c4b0fb8ce9195909fcd845"
        },
        {
          "name": "prepare_surface_upload",
          "title": "Prepare CAD or STL upload",
          "description": "Reuse an already verified STL with this checksum, size, filename and units in the same project, or open its authenticated file picker. Existing clients may keep these arguments. If artifact.state is ready, continue with that artifact; no upload is needed. Otherwise show the upload panel or labelled Upload STL link and wait for get_artifact to report ready. Never perform client-side S3 uploads, retry previous transfer URLs or run shell/network commands. For a fresh interactive upload, prefer open_surface_upload without computing a hash.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coordinate_units": {
                "default": "auto",
                "description": "Normally auto. STEP/STP/3MF use embedded units normalized to mm. STL units are resolved from measured bounds and supplied engineering context; ambiguous scale requires one clarification.",
                "enum": ["auto", "mm", "cm", "m", "in"],
                "type": "string"
              },
              "engineering_context": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Brief supplied engineering context, e.g. a full-size passenger car or a GPU cold plate. Do not infer context from a filename alone."
              },
              "expected_length_mm": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional known approximate longest overall dimension in millimetres. Supply only when known from the user or source evidence, not an invented guess."
              },
              "filename": {
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "const": "surface",
                "default": "surface",
                "type": "string"
              },
              "media_type": {
                "default": "model/stl",
                "enum": ["model/stl", "application/sla", "application/octet-stream"],
                "type": "string"
              },
              "project_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "request_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "size_bytes": {
                "exclusiveMinimum": 0,
                "maximum": 5000000000,
                "type": "integer"
              }
            },
            "required": ["filename", "sha256", "size_bytes"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare CAD or STL upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "artifacts:write",
            "gd/signInRequired": true,
            "ui": {
              "resourceUri": "ui://gradient/upload.html"
            }
          },
          "digest": "sha256:7ea9c23b6c51072b504e0de714bb8b009768541567265c87072380e24cc86640"
        },
        {
          "name": "preview_mesh_domain",
          "title": "Preview mesh domain",
          "description": "Preview an external wind tunnel quickly from verified cached geometry bounds. Domain corners are metres; relative distances are body lengths. Presets, distances and corners mean the same box for either method; a structured mesh takes the resolved corners in mm and these face names as flow_region.boundary_names. Returns face identities and preview_only=true, never mesh feasibility or cell estimates. A body_min ground is nominal: final mesh planning may add flat-base clearance. Use this for interactive enclosure edits, then retain validate_mesh and native plan_mesh before generation. Does not start a mesh or charge compute.",
          "inputSchema": {
            "$defs": {
              "OctreeDomain": {
                "additionalProperties": false,
                "description": "Body lengths from the body (unset ones as \"standard\"; side 0 touches it), or absolute corners in metres.",
                "properties": {
                  "bottom": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Below the body when there is no ground; default as top."
                  },
                  "downstream": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "maximum": {
                    "anyOf": [
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "minimum": {
                    "anyOf": [
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "side": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "top": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "upstream": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  }
                },
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "domain": {
                "anyOf": [
                  {
                    "enum": ["compact", "standard", "large"],
                    "type": "string"
                  },
                  {
                    "$ref": "#/$defs/OctreeDomain"
                  }
                ],
                "default": "standard",
                "description": "Preset, relative distances in body lengths, or minimum/maximum corners in metres, the same for either method. A structured mesh request takes the resolved corners in mm and these face names as flow_region.boundary_names. This previews bounds only; run full mesh preflight before generation."
              },
              "flow": {
                "additionalProperties": false,
                "properties": {
                  "angle_of_attack": {
                    "default": 0,
                    "description": "Degrees, turning the stream from direction towards up. The domain stays on the body axes; the wake follows the stream.",
                    "maximum": 45,
                    "minimum": -45,
                    "type": "number"
                  },
                  "contact_plinth": {
                    "default": false,
                    "description": "Tyres on the ground: cut them just above it and extrude a vertical plinth instead of the tangential wedge.",
                    "type": "boolean"
                  },
                  "direction": {
                    "default": "+x",
                    "description": "Free-stream direction.",
                    "enum": ["+x", "-x", "+y", "-y", "+z", "-z"],
                    "type": "string"
                  },
                  "farfield": {
                    "default": "inlet_outlet",
                    "description": "inlet_outlet: velocity inlet upstream, pressure outlet downstream, symmetry elsewhere. freestream: far-field patches all round (free flight at any angle); a ground stays a moving wall.",
                    "enum": ["inlet_outlet", "freestream"],
                    "type": "string"
                  },
                  "ground": {
                    "anyOf": [
                      {
                        "enum": ["none", "body_min"],
                        "type": "string"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "default": "none",
                    "description": "\"none\": free stream all round; \"body_min\": a moving-wall ground at the lowest point of the body (vehicles); a number: the ground at that up-coordinate in metres."
                  },
                  "kinematic_viscosity": {
                    "default": 0.000015,
                    "description": "m^2/s, for y_plus sizing; air by default.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "sideslip": {
                    "default": 0,
                    "description": "Degrees, turning the stream towards the side axis.",
                    "maximum": 45,
                    "minimum": -45,
                    "type": "number"
                  },
                  "speed": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Free-stream speed in m/s; sizes the first layer from boundary_layer.y_plus."
                  },
                  "up": {
                    "default": "+y",
                    "description": "Up axis, different from the direction's axis.",
                    "enum": ["+x", "-x", "+y", "-y", "+z", "-z"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "input_unit": {
                "anyOf": [
                  {
