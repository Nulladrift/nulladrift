          "description": "Build CAD (STL, and exact STEP where supported) for a cooling or flow design from a template or design document. CPU job, not charged: usually under a minute for a part, several minutes for a detailed assembly. To test parameter changes, run one design study through call_design_operation, not a build per variation. Not for editing an uploaded CAD file (use reconstruct_cad and edit_reconstructed_cad). Submit a durable geometry job from exactly one template_id or self-contained gd.design/v1 document, including complex feature graphs returned by design edits. Document assets/imported CAD references are currently unsupported; never discard them. STL/design defaults; exact STEP only when supported by every exported feature. For meshing implicit multizone geometry, set purpose=meshing, method=auto and explicit output_names to permit checked named faceted STEP volumes. Heatmaps and boundary patches are not volume regions; artifact metadata records exact versus faceted geometry. Returns job ID and immutable artifact lineage for viewing, meshing and simulation; does not approve the design or edit Studio projects. May incur compute charges.",
