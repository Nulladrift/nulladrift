        {
          "name": "open_design_source_upload",
          "title": "Upload reference document",
          "description": "Fallback file picker for a new supplier PDF, requirements TXT, CSV heat map/table or PNG/JPEG when the chat host cannot hand off its attachment. Prefer import_design_source_attachment for a host-provided file reference, or reuse a known ready artifact. API handles transfer and SHA-256; no shell or signed-URL upload needed. Show the picker or Upload source link once; retain artifact ID and continue when ready. Images are visual evidence, not measured dimensions or numeric heat maps. Server cannot read client file paths.",
