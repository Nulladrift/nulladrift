        {
          "name": "edit_reconstructed_cad",
          "title": "Edit reconstructed CAD",
          "description": "Edit a saved CAD reconstruction with explicit qualified parameter values, preserving the source and parent revision. Map the user's engineering intent to those parameters yourself: written instructions are interpreted by Gradient Dynamics' own design model for Design and Studio sessions only. Set reconstruction_id to reconstruction_artifact_id from the completed operation, and expected_parent_sha256 to reconstruction_sha256. Inspect verified parameter scope before editing: shared controls affect all listed components, while input-group membership does not couple independent controls. Stale or unsupported edits are rejected; ambiguous intent asks an engineering clarification. Durable operation returns a new revision and fidelity report; the old design is unchanged. Poll get_operation. Never change read-only recognised features or discard exact source bodies to make an edit pass.",
          "inputSchema": {
