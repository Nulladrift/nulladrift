                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "tolerance_mm": {
                "default": 0.02,
                "maximum": 1,
                "minimum": 0.001,
                "type": "number"
              }
            },
            "required": ["artifact_id"],
            "type": "object"
