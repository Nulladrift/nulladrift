        {
          "name": "submit_study",
          "title": "Submit design study",
          "description": "Run a parameter sweep or design study: submit several geometry, mesh or simulation cases at once with one combined estimate and one budget check. Either every case is admitted or none is. Not for a single run (use create_geometry, create_mesh or run_simulation). Pass plan_geometry_study's cases (request and idempotency_key each) with kind=geometry, or your own mesh or simulation sweep, all in one project. max_concurrent (default 2) caps how many run at once; each case becomes its own job with its own billing, and notify_url is notified as each finishes. A refusal (HTTP 402) reports the combined estimate and submits nothing. Keep each case's idempotency_key to retry safely.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {},
              "StudyCase": {
                "additionalProperties": false,
                "properties": {
                  "idempotency_key": {
                    "description": "Stable per case; plan_geometry_study returns one for each child.",
                    "pattern": "^[A-Za-z0-9_.:-]{1,128}$",
                    "type": "string"
                  },
                  "request": {
                    "additionalProperties": {
                      "$ref": "#/$defs/JsonValue"
                    },
                    "type": "object"
                  }
                },
                "required": ["idempotency_key", "request"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "description": "Runs to submit together; no partial admission.",
            "properties": {
              "cases": {
                "items": {
                  "$ref": "#/$defs/StudyCase"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "enum": ["geometry", "mesh", "simulation"],
                "type": "string"
              },
              "max_concurrent": {
                "default": 2,
                "description": "Most children of this study that run at once (plan limits still apply).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "notify_url": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public HTTPS URL notified as each child finishes."
              },
              "study_id": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                "type": "string"
              }
            },
            "required": ["cases", "kind", "study_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit design study"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "jobs:read",
            "gd/signInRequired": true
          },
          "digest": "sha256:c99c9a5a8353bb9ea64821871a81865798be89ba6e828f25271a1293ff3c9672"
        },
        {
          "name": "validate_geometry",
          "title": "Check geometry request",
          "description": "Validate template parameters or a self-contained design document and requested formats without compute. This is contract validation, not a native geometry/manufacturing assessment. Exactly one of template_id or document is required.",
          "inputSchema": {
            "$defs": {
              "JsonValue": {}
            },
            "additionalProperties": false,
            "properties": {
              "bounds_m": {
                "anyOf": [
                  {
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      {
                        "maxItems": 3,
                        "minItems": 3,
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      }
                    ],
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "deflection_mm": {
                "default": 0.01,
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "design_brief_artifact_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Immutable owned design brief used to derive this candidate; retained in job lineage"
              },
              "document": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "$ref": "#/$defs/JsonValue"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Self-contained gd.design/v1 document, up to 1 MiB, of general operations and library blocks (search_design_library); `blocks` {name: edition} copies blocks in. Not with template_id; no assets or external references. The worker checks validity, manufacturing and exact export."
              },
              "method": {
                "default": "exact",
                "description": "Exact STEP by default. For purpose=meshing, auto permits checked faceted STEP for implicit volumes; artifacts record the actual representation.",
                "enum": ["exact", "auto"],
                "type": "string"
              },
              "named_stl": {
                "default": false,
                "description": "Also export each selected document body as a separate named STL, alongside the combined surface, for mesh wall patches.",
                "type": "boolean"
              },
              "output_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 128,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "outputs": {
                "items": {
                  "enum": ["step", "stl", "design", "view"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "parameters": {
                "additionalProperties": {
                  "$ref": "#/$defs/JsonValue"
                },
                "maxProperties": 256,
