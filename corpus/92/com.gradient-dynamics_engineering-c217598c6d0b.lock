        {
          "name": "edit_reconstructed_cad",
          "title": "Edit reconstructed CAD",
          "description": "Edit a saved CAD reconstruction with explicit qualified parameter values, preserving the source and parent revision. Map the user's engineering intent to those parameters yourself: written instructions are interpreted by Gradient Dynamics' own design model for Design and Studio sessions only. Set reconstruction_id to reconstruction_artifact_id from the completed operation, and expected_parent_sha256 to reconstruction_sha256. Inspect verified parameter scope before editing: shared controls affect all listed components, while input-group membership does not couple independent controls. Stale or unsupported edits are rejected; ambiguous intent asks an engineering clarification. Durable operation returns a new revision and fidelity report; the old design is unchanged. Poll get_operation. Never change read-only recognised features or discard exact source bodies to make an edit pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_parent_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "instruction": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "parameters": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "type": "integer"
                    }
                  ]
                },
                "maxProperties": 1024,
                "type": "object"
              },
              "reconstruction_id": {
                "format": "uuid",
                "type": "string"
              },
              "tolerance_mm": {
                "default": 0.02,
                "maximum": 1,
                "minimum": 0.001,
                "type": "number"
              }
            },
            "required": ["expected_parent_sha256", "reconstruction_id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit reconstructed CAD"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "gd/requiredScope": "geometry:write",
            "gd/signInRequired": true
          },
          "digest": "sha256:574bf45c4558289822fc6e3ec2c567aca02f93d491c36fa5b159c149c87b2238"
        },
        {
          "name": "estimate_cost",
          "title": "Estimate cost and time",
          "description": "How much will this cost and how long will it take? Free and needs no account. Estimate how many credits a thermal, CFD or meshing run will use and how long it will take, before running it. Use before create_mesh or run_simulation, and to compare options; give the planned cell count (or an owned mesh_artifact_id) and solver steps. Signed in, it also says whether your plan, credits and key budget would admit the run. For explicitly authorized automatic mesh retries, set mesh_max_attempts to the same total attempt budget as the mesh request so the upper time estimate covers it. Read-only: no inputs are uploaded and no compute starts. Meshes are charged by delivered cells (failed meshes and automatic rebuilds are free), predictions per success, simulations by measured compute; the high value is held.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "What you plan to run; no inputs are uploaded and no compute starts.",
            "properties": {
              "architecture": {
                "default": "fluxcore",
                "description": "Fluxcore GPU solver. Use 'fluxcore'; 'workhorse' remains an accepted compatibility identifier for saved requests and deployed workers.",
                "enum": ["fluxcore", "workhorse", "krylov"],
                "type": "string"
              },
              "cells": {
                "anyOf": [
                  {
                    "maximum": 50000000,
                    "minimum": 1000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Mesh target cells (operation=mesh) or the simulation mesh's cell count. Defaults to 1 million for meshes; for simulations supply cells or mesh_artifact_id."
              },
              "gpu": {
                "anyOf": [
                  {
                    "enum": ["B200", "H100"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Simulation GPU type: B200 (default) or H100."
              },
              "gpu_count": {
                "anyOf": [
                  {
                    "enum": [1, 2, 4, 8],
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Simulation GPUs (default 1)."
              },
              "inner_iterations": {
                "anyOf": [
                  {
                    "maximum": 10000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "max_iterations": {
                "anyOf": [
                  {
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Steady RANS/CHT iteration ceiling (default 6000)."
              },
              "mesh_artifact_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Owned mesh whose verified cell count to use (signed-in callers only)."
              },
              "mesh_max_attempts": {
                "default": 1,
                "description": "Total authorized full mesh attempts, for the upper time estimate. Use 1 for retry_policy=review; for automatic, copy max_remesh_iterations (octree/OpenFOAM) or max_target_iterations (structured). Read-only estimation does not authorize a retry. Automatic rebuilds are not charged: a mesh costs the same credits however many attempts it takes.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "n_physical_steps": {
                "anyOf": [
