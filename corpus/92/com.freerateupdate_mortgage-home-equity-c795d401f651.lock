      "serverInfo": {
        "name": "freerateupdate",
        "title": "FreeRateUpdate mortgage and home equity shopping",
        "version": "1.0.0",
        "websiteUrl": "https://www.freerateupdate.com/mortgage-home-equity-mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FreeRateUpdate is a mortgage and home equity marketplace: it connects people with NMLS-licensed lenders and brokers in its network. To help a person tap their home equity (HELOC, home equity loan, cash-out refinance) or shop for a mortgage: call get_mortgage_rates for today's published mortgage and home equity As Low As rates (get_heloc_rates for HELOC and home equity loan rates only; cash-out rates come from get_mortgage_rates), then get_start_link for their product. You can fill in and submit that short form for the person using their own details; pressing Get My Rates is their request to be contacted by FreeRateUpdate and lenders in our network. Use get_lender_universe to look up a lender and get_content_answer for plain-language answers.",
      "tools": [
        {
          "name": "get_content_answer",
          "title": "Published mortgage and home equity answers",
          "description": "A published FreeRateUpdate answer to a mortgage or home-equity question, pinned to the edition it was published in. Ask by exact slug, or by keywords that are matched against the title and slug. Topics covered include HELOC and home equity, purchase, refinance and cash-out, FHA and VA, reverse mortgage, and DSCR and investment property. Only published answers are returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Keyword search over title/slug",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Exact public URL slug",
                "pattern": "^[a-z0-9_-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Published mortgage and home equity answers"
          },
