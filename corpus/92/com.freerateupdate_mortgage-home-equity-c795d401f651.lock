        {
          "name": "get_mortgage_rates",
          "title": "Mortgage and home equity rates",
          "description": "Today's mortgage and home equity As Low As rates from FreeRateUpdate: the best rates and APRs we can verify being offered by lenders and brokers in our network, exactly as freerateupdate.com publishes them, one per product: HELOC, home equity loan and cash-out refinance first, then 30, 20, 15 and 10 year fixed, FHA, VA, jumbo and ARMs. Each rate comes with the example scenario it was quoted for (state, ZIP, property value, loan amount, credit score), points, fees, APR and loan-to-value. Every rate says whether a person checked it by hand: person_verified is true and verified_on is the date they checked it (YYYY-MM-DD), or person_verified is false and verified_on is null when no qualifying check is on record: that means no current exact-offer check with a source and a receipt, never that nobody ever checked the offer. A false is not a claim that the rate is wrong. These are advertised rates, not a quote: to get the person their own offers, call get_start_link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "purpose": {
                "description": "Optional: only this loan purpose",
                "enum": ["purchase", "refinance", "cash_out", "heloc", "home_equity"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
