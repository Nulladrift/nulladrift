      "tools": [
        {
          "name": "cert_inspect",
          "description": "Parse a PEM-encoded X.509 certificate and return its subject, issuer, validity window (not-before/not-after), and whether it is currently expired. Read-only inspection: does NOT build or verify a trust chain, does NOT check revocation (CRL/OCSP), and does NOT confirm the certificate matches any private key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pem": {
                "description": "A PEM-encoded X.509 certificate, including the\n-----BEGIN CERTIFICATE----- / -----END CERTIFICATE----- markers.",
                "type": "string"
              }
            },
            "required": ["pem"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1e4b0af2706d0162d1496eeba7ea5471e5490ae29417cce07ee89a9a4858838"
        },
        {
          "name": "create_access_key",
          "description": "Create a scoped, revocable access_key bound to a role. Requires an admin owner_key. The raw key (`ak_...` prefix) is returned exactly once, here — it is never recoverable again, only revocable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "expiry": {
                "default": null,
                "description": "RFC3339 expiry, e.g. \"2026-12-31T00:00:00Z\".",
                "type": ["string", "null"]
              },
              "label": {
                "type": "string"
              },
              "mailbox_label": {
                "default": "",
                "type": "string"
              },
              "owner_key": {
                "default": null,
                "description": "Owner key. Must belong to an admin member.\nOptional. If omitted, defaults to the owner_key resolved from the\nconnection's `Authorization: Bearer <owner_key>` header.",
                "type": ["string", "null"]
              },
              "role_ids": {
                "default": [],
                "description": "Roles to bind this key to (combination, bundle-26). Unset/empty grants no scopes (denies everything).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["label"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69f1aab435d6f0ebe372d12ce8f5da78d368fb13dbe9260e7608ad23d667b726"
        },
        {
          "name": "create_org",
          "description": "Create a new, deliberately-named org under the same email as the supplied owner_key — not a fresh signup. `name` is slugified into the org's namespace slug (e.g. \"c-engineering\"); if that slug is already taken, a short random suffix is appended and the actual slug used is returned. Subject to the same per-email account-creation quota as signup. Returns a fresh owner_key in the same shape as `switch_org`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Human-readable name for the new org, e.g. \"c-engineering\". Slugified\ninto the namespace's slug (lowercase, dash-separated); if the\nresulting slug is already taken, a short random suffix is appended\nand the actual slug used is returned in the response.",
                "type": "string"
              },
              "owner_key": {
                "default": null,
                "description": "Any valid owner_key for this email. The new org is created under the\nsame email, not a fresh signup.\nOptional. If omitted, defaults to the owner_key resolved from the\nconnection's `Authorization: Bearer <owner_key>` header.",
                "type": ["string", "null"]
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb398355501f057287c98807f430940085a53b4cd04d7ba4931eb2dc2981cfc4"
        },
