        {
          "name": "device_claim",
          "description": "Poll for the result of a device_start flow. Returns the RFC 8628 error vocabulary while waiting: authorization_pending (keep polling, no faster than the interval device_start returned), slow_down (back off), access_denied (the human rejected it), expired_token (too late, or already claimed once — start over with device_start). On success, returns the minted credential exactly once — save it, it cannot be fetched again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "device_code": {
                "description": "The device_code returned by device_start.",
                "type": "string"
              }
            },
            "required": ["device_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2358cf3f3905311723788a2c0155e2e03e07885e1089abac06a331849999650"
        },
        {
          "name": "device_start",
          "description": "Start a device-code sign-in (RFC 8628 shape). Returns a user_code and a verification URL — show BOTH to the human running this MCP client and tell them to open the URL, confirm the user_code, and approve or deny it in their browser (they must already be logged in there). Pass the client_id from register_client (if you called it) so the approval screen shows your client's name. Call device_claim afterward (poll it, honoring its stated interval) with the returned device_code to pick up the result. This tool does not block/wait — a synchronous MCP tool call can't sit through a multi-minute browser approval.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client_id": {
                "default": null,
                "description": "Optional client_id from a prior register_client call. Omit to start\na device-code flow exactly as before this bundle.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfb8ae6e2a1d1ed71abbc537343544378fadcf379c6b33a55cb0cb45af4bbe37"
        },
        {
          "name": "discussion_claim_role",
          "description": "Atomically claim a predefined role in a role-claim deliberation thread. Use this when the thread was created with requested_roles.",
