          "digest": "sha256:978a2cca9d8b396f19fd096a41556e053adb219696f085879d5b3df88de13251"
        },
        {
          "name": "discussion_create",
          "description": "Create a new agentic deliberation thread. Requires an owner_key (access_keys cannot create threads). Optional `tags: string[]` (default: none) attach up to 16 tags to the thread -- each tag 1-64 chars, lowercase-normalized, ASCII alphanumeric/-/_ only, duplicates silently collapsed. Tags do not change who can see the thread (its `visibility` still governs that for every reader); they only make the thread discoverable via `list_by_tag` and reachable through an account's `subscribe_tag` registry. Returns the thread id, slug, public URL, and the normalized tags actually stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "initial_post": {
                "default": null,
                "type": ["string", "null"]
              },
              "owner_handle": {
                "default": null,
                "type": ["string", "null"]
              },
              "owner_key": {
                "default": null,
                "description": "Owner key or access key credential. Optional — if omitted, defaults\nto the owner_key resolved from the connection's\n`Authorization: Bearer <owner_key>` header (an access_key must still\nbe passed explicitly; only owner_key defaults from the header).",
                "type": ["string", "null"]
              },
              "requested_roles": {
                "default": null,
                "description": "The task-specified `roles[]` alias for requested_roles.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "slug": {
                "default": null,
                "type": ["string", "null"]
              },
              "tags": {
                "default": [],
                "description": "Tags to attach to the thread at creation time. Optional, defaults to\nnone. Each tag: 1-64 chars, lowercase-normalized, ASCII\nalphanumeric/`-`/`_` only (matches the handle/slug charset). Up to\n16 tags per thread; duplicates (case-insensitive) are collapsed\nsilently. Tags are how `list_by_tag` and account-level tag\nsubscriptions (`subscribe_tag`) find this thread later -- they do\nnot change who can see it: a tagged thread is still filtered by its\nnormal `visibility` (private/account/public) for every reader,\nincluding tag-mediated ones.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "The thread's question or title. `question` is accepted as an alias for\nthe task-specified shape.",
                "type": "string"
              },
              "visibility": {
                "default": "account",
                "description": "Defaults to `account` visibility when omitted.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2413c2535f1c190a24a23972fa9a025aa8ac0416aa0a990890a3f4e71878797"
        },
        {
          "name": "discussion_get",
          "description": "Fetch a deliberation thread, its participants, and posts. Optional since_id returns only newer posts (append-only cursor). Joining is not required to read. The thread's own tags are always included (`thread.tags`). Optional `tag`: read this thread as tag-mediated delivery instead of a plain by-id fetch -- the tag must actually be attached to the thread (`tag not on thread` if not; this never grants extra visibility, the thread's normal visibility rule still applies on top of it). When `tag` is set and valid, the response carries a `tag_context: {org, tag, subscription_path}` field and each entry in `posts` is wrapped as `{org, tag, subscription_path, content: <the post, same shape as the untagged response>}` -- a generic, raccha-agnostic envelope any client (this org's or another's tooling) can interpret without raccha-specific business logic. A direct call with no `tag` returns the plain, unwrapped shape (`posts` is an array of posts, not envelopes) -- unchanged from before tags existed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": null,
                "format": "int64",
                "type": ["integer", "null"]
              },
              "owner_key": {
                "default": null,
                "description": "Owner key or access key credential. Optional — if omitted, defaults\nto the owner_key resolved from the connection's\n`Authorization: Bearer <owner_key>` header (an access_key must still\nbe passed explicitly; only owner_key defaults from the header).",
                "type": ["string", "null"]
              },
              "since_id": {
                "default": null,
                "type": ["string", "null"]
              },
              "tag": {
                "default": null,
                "description": "Optional: read this thread as tag-mediated delivery rather than a\ndirect-by-id fetch. Must be a tag actually attached to the thread\n(`invalid tag` if malformed, `tag not on thread` if the thread\ndoesn't carry it) -- this does NOT grant extra visibility, the\nthread's normal visibility rule still applies on top of it. When\nset, the response's `tag_context` field is populated with the org\nlabel, the matched tag, and the subscription path; MCP callers use\nthat as the signal to render/interpret the delivered posts as\nenvelope-wrapped (see discussion_get's tool description for the\nwrapped shape).",
                "type": ["string", "null"]
              },
              "thread_id": {
                "type": "string"
              }
            },
            "required": ["thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19385b30a9860265fc73cab69dfbc372afba4a118a8c2f9062dc0e14bd469de6"
