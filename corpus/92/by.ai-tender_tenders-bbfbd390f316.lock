{
  "lockfileVersion": 2,
  "subjects": {
    "by.ai-tender/tenders": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai-tender.by/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "by.ai-tender/tenders",
        "title": "AI-TENDER — Belarus procurements, prices, radar & KYB",
        "version": "2.0.0",
        "websiteUrl": "https://ai-tender.by/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open public procurements of Belarus with source platform links (free tools). With an Authorization: Bearer ait_... key, commercial tools unlock B2B market prices with VAT, construction/PIR radar, and KYB verification. Facts only: no scores, no advice to participate.",
      "tools": [
        {
          "name": "get_tender",
          "title": "One open procurement by id",
          "description": "One open procurement by its id (\"<source>:<number>\", e.g. \"goszakupki:3653566\"): customer, deadline, price, delivery place, procedure, link to the source platform. A closed or unknown id returns found=false. Карточка закупки.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Procurement identifier in \"<source>:<number>\" format (e.g. \"goszakupki:3653566\", \"icetrade:1372121\", \"gias:<uuid>\")",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Open procurement card if found, found=false with meaning otherwise, or an error object.",
            "properties": {
              "error": {
                "additionalProperties": true,
                "description": "Error object returned when id is missing or empty",
                "type": "object"
              },
              "found": {
                "description": "Whether an open procurement with this id was found",
                "type": "boolean"
              },
              "id": {
                "description": "Queried procurement identifier",
                "type": "string"
              },
              "meaning": {
                "description": "Explanation when found=false (not among open procurements)",
                "type": "string"
              },
              "tender": {
                "additionalProperties": true,
                "description": "Full public procurement record when found=true",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ff572ad2d4bc97fc0aad27eb612ad686f809ba5cc03567f072de08aa91d1cb0"
        },
        {
          "name": "list_regions",
          "title": "Regions with open procurements",
          "description": "Regions of Belarus with the number of open procurements in each. Области и число открытых закупок.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Belarus regions paired with the count of open procurements in each.",
            "properties": {
              "regions": {
                "description": "List of regions ordered descending by open procurement count",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "open": {
                      "description": "Count of currently open procurements in this region",
                      "type": "integer"
                    },
                    "region": {
                      "description": "Region name accepted by search_tenders.region",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6b4841b26082468a5d041663368055e89b6a31af37e493e3e2a3e028fdbca72"
        },
        {
          "name": "search_tenders",
          "title": "Open public procurements of Belarus",
          "description": "Search OPEN public procurements of Belarus (submission deadline not passed) by words in the title or customer name, or by the customer UNP (9 digits); optional region. Each item: title, customer, deadline, price, procedure, source platform link and the AI-TENDER card. Ordered by deadline. Поиск открытых закупок Беларуси.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of open procurements to return, 1–25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words from the title or customer, or customer UNP",
                "type": "string"
              },
              "region": {
                "description": "Region name as returned by list_regions",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Open procurements matching query and scope boundaries, or an error object.",
            "properties": {
              "count": {
                "description": "Number of procurements returned in items",
                "type": "integer"
              },
              "does_not_establish": {
                "description": "Boundary statements clarifying what absence or presence does not prove",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "additionalProperties": true,
                "description": "Error object returned when parameters are invalid (e.g. unknown_region)",
                "type": "object"
              },
              "items": {
                "description": "Open public procurement records ordered by submission deadline",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "scope": {
                "description": "Explicit coverage and open-deadline scope statement",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a29c7ffb6790241d2850d14e544ba24b7087dfd5cbcdd8224a27ec074105f9f"
        }
      ],
      "digest": "sha256:e426f27fe601a6b3855bde0e3bc7e24e2392ce665528015d76747608e279a710"
    }
  }
}
