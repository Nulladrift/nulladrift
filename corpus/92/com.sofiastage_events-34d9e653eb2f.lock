      },
      "instructions": "Use these read-only tools for current SofiaStage cultural-event data. Dates and times use Europe/Sofia. Prefer show_stable_id when referring to an event. Returned event and ticket URLs are informational source pages; the server cannot initiate checkout, reservation, or payment.",
      "tools": [
        {
          "name": "get_editorial",
          "title": "Get an editorial profile",
          "description": "Get a SofiaStage editorial collection, article metadata, and precomputed upcoming events by exact title or route slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name_or_slug": {
                "description": "Exact public name/title or route slug.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name_or_slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "editorial": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["editorial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdc4dbc2badf906597942b43d5269563797d44f21bafa59f54b2c08e9999c9ae"
        },
        {
          "name": "get_event",
          "title": "Get a SofiaStage event",
          "description": "Get one event by canonical show_stable_id or legacy source ID, optionally including related performers and editorial entries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "event_id": {
                "description": "Canonical show_stable_id (preferred) or legacy source ID.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "include": {
                "default": ["stars", "extras"],
                "items": {
                  "enum": ["stars", "extras"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "event": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d800b6fcf15e7f35e7d4aabf35ea9bd6eedd948cc48a2b76669bca8625301fc"
        },
        {
          "name": "get_performer",
          "title": "Get a performer profile",
          "description": "Get a SofiaStage performer or creative-team profile, biography metadata, public links, and precomputed upcoming events by exact name or route slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name_or_slug": {
                "description": "Exact public name/title or route slug.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name_or_slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "performer": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["performer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1143b358ab0e22ed5aeff2e7db593217b66c76af03e70de4e0df28073c69747"
        },
        {
          "name": "search_catalog",
          "title": "Search the SofiaStage catalog",
          "description": "Search cities, venues, production titles, performers, or editorial collections. Performer and editorial results are compact; use their detail tools next.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "enum": ["city", "venue", "title", "performer", "editorial"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "scope": {
                "default": "sofia",
                "enum": ["sofia", "all"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["city", "venue", "title", "performer", "editorial"],
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["items", "kind", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d1642cdde7d6786db69ddb5218fce55b7f1aea6ed334a85fa0e61a2d1554dbe"
        },
        {
          "name": "search_events",
          "title": "Search SofiaStage events",
          "description": "Search current cultural events by Sofia/all-city scope, city, date, local time, venue, title, performer, or editorial collection. Returns stable event IDs and cursor pagination.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name. Providing a city takes precedence over the Sofia default.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "date_from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "editorial": {
                "description": "Editorial collection or extra name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "include": {
                "default": [],
                "items": {
                  "enum": ["stars", "extras"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page_token": {
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "performer": {
                "description": "Performer or creative-team name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Performance-title search text. Bulgarian and Latin transliteration are supported.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "relative_date": {
                "enum": ["today", "tomorrow", "this_weekend", "next_7_days"],
                "type": "string"
              },
              "scope": {
                "default": "sofia",
                "description": "Default Sofia-only scope, or all cities.",
                "enum": ["sofia", "all"],
                "type": "string"
              },
              "time_from": {
                "description": "Local Europe/Sofia lower boundary for the first requested date.",
                "pattern": "^(?:[01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "time_to": {
                "description": "Local Europe/Sofia upper boundary for the last requested date.",
                "pattern": "^(?:[01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "title": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "venue": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "applied_filters": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "events": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "has_more": {
                "type": "boolean"
              },
              "page_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "timezone": {
                "const": "Europe/Sofia",
                "type": "string"
              }
            },
            "required": ["applied_filters", "events", "has_more", "page_token", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81d49442abd283a0ab07afa1e7736ca33e211427ad9f3d7a630843980a40ef69"
        }
