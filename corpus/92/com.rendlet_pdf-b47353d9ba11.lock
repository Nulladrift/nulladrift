{
  "lockfileVersion": 2,
  "subjects": {
    "com.rendlet/pdf": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rendlet.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rendlet",
        "title": "Rendlet PDF",
        "version": "0.2.0",
        "websiteUrl": "https://rendlet.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free, no key: list_capabilities, get_pricing, preview_pdf (watermarked low-res, 3/day per IP). html_to_pdf and render_template need \"Authorization: Bearer <key>\": a free key (100 docs/month) at https://rendlet.com/#signup, prepaid credit packs (card, see get_pricing), or \"sandbox\" for a watermarked 1-page trial. Without a usable key they return a 402 payment_required result with buy links. Support: support@rendlet.com",
      "tools": [
        {
          "name": "get_pricing",
          "title": "Get Rendlet pricing and how to buy",
          "description": "Use when the user asks about price, hits a quota, or needs more documents. Inputs: none. Output: JSON with the free key, monthly plans with Stripe links, prepaid credit packs with Stripe Payment Links, and the cost of each tool. Cost: free, no key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fd86b93246de755990b9e2bf6d334d2dc4f56c6abe69ddafc90f3a69ff9a19a"
        },
        {
          "name": "html_to_pdf",
          "title": "HTML to PDF",
          "description": "Use to produce a real, full-quality PDF from HTML (reports, receipts, letters). Inputs: \"html\" (required), \"format\" (A4|Letter|Legal|A3|A5), \"landscape\", \"margin\" (CSS length), \"filename\". Rendered by headless Chromium with JavaScript disabled; only data: URIs and public https assets load; Chinese text supported. Output: the PDF as an embedded base64 resource plus pages, bytes and remaining quota. Requires \"Authorization: Bearer <key>\" (or \"sandbox\" for a watermarked 1-page trial, 5/day). Without a usable key it returns a 402 payment_required result with buy links. Cost: 1 document from your monthly plan (free key: 100/month), or 1 prepaid credit after the cap.",
          "inputSchema": {
            "properties": {
              "filename": {
                "default": "document.pdf",
                "type": "string"
              },
              "format": {
                "default": "A4",
                "enum": ["A4", "Letter", "Legal", "A3", "A5"],
                "type": "string"
              },
              "html": {
                "description": "Full HTML document or fragment.",
                "type": "string"
              },
              "landscape": {
                "default": false,
                "type": "boolean"
              },
              "margin": {
                "default": "12mm",
                "description": "CSS length, e.g. 12mm",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94af0821e891c5f5b581c96b8b97a7099b88ad7cb0a953176cde9019d04c4390"
        },
        {
          "name": "list_capabilities",
          "title": "List Rendlet capabilities",
          "description": "Use first to learn what Rendlet can render and which tools are free. Inputs: none. Output: JSON listing tools, input modes (HTML, built-in invoice/itinerary templates), page sizes, limits per plan, auth method and links. Cost: free, no key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:943479875a2422db464d50ea8ea7bd9101fd5d0e30bf73430ba94f09f8bca963"
        },
        {
          "name": "preview_pdf",
          "title": "Free watermarked PDF preview",
          "description": "Use to show what a document will look like before paying or signing up. Inputs: optional \"html\" (string, up to 50 KB; omit to preview the built-in sample invoice). Output: a 1-page low-resolution, PREVIEW-watermarked PDF (rasterized first A4 page) as an embedded base64 resource. Not for production use. Cost: free, no key, 3 previews per IP per day.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "HTML to preview. Omit to preview the sample invoice.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a99c2f9a98ebb9ad186d69e43584315ed7df7680381b47e23491af299d48dbed"
        },
        {
          "name": "render_template",
          "title": "Render built-in template",
          "description": "Use when you have structured data for an invoice or travel itinerary and want a clean PDF without writing HTML. Inputs: \"template\" (\"invoice\": seller, buyer, items, tax_rate, currency; \"itinerary\": trip, days), \"data\" (object; full examples at GET https://rendlet.com/v1/templates), \"filename\". Output: the PDF as an embedded base64 resource plus pages and remaining quota. Same auth and 402 behaviour as html_to_pdf. Cost: 1 document from your monthly plan, or 1 prepaid credit after the cap.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Template data; see https://rendlet.com/v1/templates",
                "type": "object"
              },
              "filename": {
                "default": "document.pdf",
                "type": "string"
              },
              "template": {
                "enum": ["invoice", "itinerary"],
                "type": "string"
              }
            },
            "required": ["data", "template"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ef1418658eaabb894ed6db7e9e784928e7b8d67062926e7149a2456c5f7a56c"
        }
      ],
      "digest": "sha256:c35ff6000f7de938232723d103ff3c631c36730105bd4ee81ff37c74458e8600"
    }
  }
}
