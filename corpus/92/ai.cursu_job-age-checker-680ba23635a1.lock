{
  "lockfileVersion": 2,
  "subjects": {
    "ai.cursu/job-age-checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cursu.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cursu-job-age-checker",
        "title": "Cursu Job Age Checker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One tool, check_job_posting_age: pass the employer's job link to get the first-posted date, age in days and whether the listing is still open. Dates show age and status, not hiring intent; present them that way.",
      "tools": [
        {
          "name": "check_job_posting_age",
          "title": "Check when a job was posted",
          "description": "Find out when a job posting was first published and whether it is still open, from the company's own job link (Greenhouse, Lever, Ashby, SmartRecruiters, Workday, Workable, Recruitee, BambooHR, Teamtailor, JazzHR, Breezy HR, Personio, Oracle Recruiting Cloud, iCIMS, UKG Pro Recruiting, Rippling, Dayforce, ADP Workforce Now, Eightfold; job pages on Jobvite, Pinpoint, Paylocity, Taleo Business Edition, JOIN, softgarden, Homerun; or any careers page with JobPosting structured data). Greenhouse, Recruitee and UKG also give a last-updated date. Use it when someone asks how old a job listing is, whether it is still accepting applications, or whether it might be a \"ghost job\": the dates are evidence for that question, but they show age and status, not whether the company intends to hire. LinkedIn and Indeed links are refused; pass the employer's apply link instead. Free, no account; by Cursu (cursu.ai).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The job posting's URL on the employer's careers site or ATS, starting with https://.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ageDays": {
                "type": ["integer", "null"]
              },
              "checkedAt": {
                "description": "ISO time of the check (results are cached for up to 24 hours).",
                "type": "string"
              },
              "company": {
                "type": ["string", "null"]
              },
              "confidence": {
                "enum": ["high", "medium", "low", "none"],
                "type": "string"
              },
              "dateSource": {
                "enum": ["ats_api", "json_ld", "page_data", "third_party", "none"],
                "type": "string"
              },
              "firstPosted": {
                "description": "First-published date, YYYY-MM-DD (UTC).",
                "type": ["string", "null"]
              },
              "lastUpdated": {
                "description": "Last-updated date, YYYY-MM-DD (UTC); Greenhouse, Recruitee and UKG only.",
                "type": ["string", "null"]
              },
              "link": {
                "description": "This result on cursu.ai.",
                "type": "string"
              },
              "source": {
                "description": "Where the dates came from: the ATS name, \"the <ATS> job page\" for a page read, or \"the company's job page\".",
                "type": "string"
              },
              "status": {
                "enum": ["open", "closed", "unknown"],
                "type": "string"
              },
              "title": {
                "type": ["string", "null"]
              }
            },
            "required": ["checkedAt", "confidence", "dateSource", "link", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check when a job was posted"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8452aa35cb92c8315ded5c4abbed7c8dbdd2c8846712d2462c56ae45a9d8fe9b"
        }
      ],
      "digest": "sha256:77189ad59c090463e342bfec094112ac05d689c510a8f099072998ae62a47522"
    }
  }
}
