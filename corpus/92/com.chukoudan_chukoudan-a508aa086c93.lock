        {
          "name": "tuishui",
          "title": "出口退税计算器",
          "description": "出口退税计算器（Export tax refund calculator）：填发票金额和退税率，立刻看到应退税额和每一步的出处。 Trading companies (exempt-and-refund) and manufacturers (exempt-credit-refund). 输入为精确的十进制字符串 / Inputs are exact decimal strings. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "enterpriseType": "trading",
                "exports": [
                  {
                    "exportDate": "2026-09-24",
                    "hsCode": "61091000",
                    "invoiceAmount": "100000",
                    "refundRate": "13",
                    "taxRate": "13"
                  }
                ]
              }
            ],
            "properties": {
              "carriedCredit": {
                "description": "上期留抵税额（CNY） / Credit carried from the last period (CNY)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "declaredEndCredit": {
                "description": "申报表的期末留抵税额（可选）（CNY） / Period-end credit on the VAT return (optional) (CNY)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "enterpriseType": {
                "description": "企业类型。可选值：trading = 外贸企业（免退税）；manufacturer = 生产企业（免抵退） / Business type. options: trading = Trading company (exempt-and-refund); manufacturer = Manufacturer (exempt-credit-refund)",
                "enum": ["trading", "manufacturer"],
                "type": "string"
              },
              "exports": {
                "description": "出口货物 / Exported goods",
                "items": {
                  "properties": {
                    "currency": {
                      "description": "币种 / Currency",
                      "pattern": "^[A-Z]{3}$",
