                "containerType": "auto",
                "fill": false,
                "grossWeight": "18",
                "height": "50",
                "length": "60",
                "quantity": "450",
                "upright": false,
                "width": "40"
              }
            ],
            "properties": {
              "containerType": {
                "description": "柜型。可选值：auto = 自动比较；20gp = 20GP；40gp = 40GP；40hq = 40HQ；45hq = 45HQ / Container. options: auto = Compare all; 20gp = 20GP; 40gp = 40GP; 40hq = 40HQ; 45hq = 45HQ",
                "enum": ["auto", "20gp", "40gp", "40hq", "45hq"],
                "type": "string"
              },
              "fill": {
                "description": "装满为止（不填箱数） / Fill the container (no carton count) 用户问最多能装多少箱、没有给箱数时填 true（这时不要填 quantity）。 / Send true when the user asks how many fit and gave no carton count (then leave quantity out).",
                "type": "boolean"
              },
              "grossWeight": {
