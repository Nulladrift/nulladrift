        {
          "name": "maitou",
          "title": "唛头生成",
          "description": "唛头生成（Shipping mark generator）：正唛和侧唛，A4 或 100×150 mm 标签直接打印。 Main and side marks, printed on A4 or 100×150 mm labels. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "capitals": true,
                "cartons": "450",
                "grossWeight": "18",
                "height": "50",
                "length": "60",
                "lines": [
                  {
                    "text": "ACME"
                  },
                  {
                    "text": "HAMBURG"
                  },
                  {
                    "text": "P.O. NO. 20260917"
                  },
                  {
                    "text": "ITEM: STORAGE BOX"
                  }
                ],
                "netWeight": "16",
                "width": "40"
              }
            ],
            "properties": {
              "capitals": {
                "description": "拉丁字母全部大写 / Capitalise Latin letters",
                "type": "boolean"
              },
              "cartons": {
                "description": "箱数 / Carton count",
                "pattern": "^(0|[1-9]\\d*)$",
                "type": "string"
              },
              "grossWeight": {
                "description": "每箱毛重 G.W.（kg） / G.W./carton (kg)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "height": {
                "description": "高（cm） / Height (cm)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "length": {
                "description": "长（cm） / Length (cm)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "lines": {
                "description": "正唛 / Main mark",
                "items": {
                  "properties": {
                    "text": {
                      "description": "正唛内容 / Main mark text",
                      "type": "string"
                    }
                  },
                  "required": [],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "netWeight": {
                "description": "每箱净重 N.W.（kg） / N.W./carton (kg)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "width": {
                "description": "宽（cm） / Width (cm)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              }
            },
            "required": ["cartons", "grossWeight", "height", "length", "netWeight", "width"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Links": {
                "additionalProperties": false,
                "description": "Addresses that go with the answer. `page`: the tool’s page on the site with the same inputs in its address, in the language asked (Chinese for a language the site does not publish yet), so a person can open the page that shows these numbers.",
                "properties": {
                  "page": {
