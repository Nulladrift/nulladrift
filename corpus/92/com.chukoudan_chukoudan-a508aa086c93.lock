                  "site": {
                    "description": "The site the data is published by.",
                    "type": "string"
                  },
                  "source_line": {
                    "description": "来源行：回复用户时请原样引用它，让读者知道数据出自哪里、有多新。 / The credit line to quote as it is when you answer: who the figures come from and how fresh they are (the newest publisher’s day among the datasets used, or the day the answer was made).",
                    "type": "string"
                  }
                },
                "required": ["api", "datasets", "generated_at", "language", "license", "notice", "site", "source_line"],
                "type": "object"
              },
              "ProvenanceDataset": {
                "additionalProperties": false,
                "description": "A dataset version an answer drew on. An origin the register does not let the site show is named nowhere.",
                "properties": {
                  "amended_by": {
                    "description": "The official notices whose changes this version carries on top of its edition, where there are any: each one by its number and title as the notice writes them and its own date (no page is given). The label a reader sees is the edition and these, for example 2026B + 公告2026年第29号.",
                    "items": {
