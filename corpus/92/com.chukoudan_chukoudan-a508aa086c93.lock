      "instructions": "出口贸易工具箱 chukoudan.com: 换算、CBM/体积重、装柜、汇率与结汇成本、出口退税、FOB/CFR/CIF 报价。 Each tool computes exactly as the site does. Figures come back as exact decimal strings in tagged values (money, quantity, ratio, rate, count, code, date): quote them as given and never round them. Each step and warning has a `message`, one sentence with its figures filled in: use it, do not make up figures. `provenance` names the dataset versions and their publishers, and `provenance.source_line` is the credit line (来源：出口单 chukoudan.com · 数据 日期): quote it as it is when you answer. 回复用户时请原样引用 provenance.source_line，并转述 provenance.notice（本站非官方渠道，仅供参考）。 Pass on provenance.notice (not an official channel; for reference) with the source line. `links.page` is the site’s page holding the same inputs: give it to the person, who can open it and see the numbers. 每个计算结果的 links.page 是填好同样输入的本站页面，可以给用户打开核对。 Limits: 60 calls a minute per client (a page of dataset rows costs one per 1,000 rows); past that the server answers HTTP 429 with Retry-After in seconds. 每个客户端每分钟 60 次调用；超出时返回 HTTP 429，请按 Retry-After 的秒数等待后再试。",
      "tools": [
        {
          "name": "amazon-fees",
          "title": "亚马逊费用",
          "description": "亚马逊费用（Amazon fees and profit）：填入售价、成本和亚马逊的各项费用，算出每件和整批的净利润、利润率和保本价。 Enter the price, your cost and your own Amazon fees to get the net profit per unit and per batch, the margin and the break-even price. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "adsRate": "10",
                "cost": "6",
                "currency": "USD",
                "fulfilmentFee": "4",
                "inboundCost": "1",
                "otherCost": "0.5",
                "price": "25",
                "quantity": "1000",
                "referralRate": "10",
                "returnRate": "5",
                "storageFee": "0.10",
                "storageMonths": "2",
                "targetMargin": "20"
              }
            ],
            "properties": {
              "adsRate": {
                "description": "广告费占售价（%） / Advertising as a share of the price (%)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "cost": {
                "description": "每件采购成本 / Purchase cost per unit",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "currency": {
                "description": "币种 / Currency",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "fulfilmentFee": {
                "description": "每件配送费 / Fulfilment fee per unit",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "inboundCost": {
                "description": "每件头程运费 / Inbound shipping per unit",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "otherCost": {
                "description": "每件其他成本 / Other cost per unit",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "price": {
                "description": "每件售价 / Selling price per unit",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "quantity": {
                "description": "订单数量（件） / Order quantity (units)",
                "pattern": "^(0|[1-9]\\d*)$",
                "type": "string"
              },
              "referralRate": {
                "description": "佣金比例（%） / Referral fee rate (%)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "returnRate": {
                "description": "退货率（%） / Return rate (%)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "storageFee": {
                "description": "每件每月仓储费 / Storage fee per unit per month",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "storageMonths": {
                "description": "存放月数（月） / Months stored (months)",
                "pattern": "^(0|[1-9]\\d*)$",
                "type": "string"
              },
              "targetMargin": {
                "description": "目标利润率（%，按售价） / Target margin (% of the price)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              }
            },
            "required": ["cost", "fulfilmentFee", "price", "quantity", "referralRate"],
            "type": "object"
          },
