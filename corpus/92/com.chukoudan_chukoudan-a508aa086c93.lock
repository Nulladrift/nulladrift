                        "minimum": 0,
                        "type": "integer"
                      },
                      "value": {
                        "description": "A fraction: 0.13 is 13 %.",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  },
                  {
