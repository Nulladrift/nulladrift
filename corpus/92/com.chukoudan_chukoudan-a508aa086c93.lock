                  "insuranceRate": {
                    "description": "保险费率（%） / Insurance rate (%)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "margin": {
                    "description": "目标利润率（%） / Target margin (%)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "marginBasis": {
                    "description": "利润率按。可选值：quote = 报价；cost = 成本 / Margin on. options: quote = the quote; cost = cost",
                    "enum": ["quote", "cost"],
                    "type": "string"
                  },
                  "markup": {
                    "description": "投保加成（%） / Insured at (% of CIF)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "mode": {
                    "description": "计算方向。可选值：forward = 正算：成本 → 报价；reverse = 反算：报价 → 利润 / Direction. options: forward = Quote from cost; reverse = Profit from a quote",
                    "enum": ["forward", "reverse"],
                    "type": "string"
                  },
                  "port": {
                    "description": "起运港（选填） / Port of loading (optional)",
                    "type": "string"
                  },
                  "price": {
                    "description": "含税采购单价（CNY） / Purchase price per unit, VAT included (CNY)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "quantity": {
                    "description": "数量 / Quantity",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "quotedPrice": {
                    "description": "你的报价单价 / Your unit price",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "refundRate": {
                    "description": "退税率（%） / Refund rate (%)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "taxRate": {
                    "description": "征税率（%） / VAT rate on the purchase (%)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "term": {
                    "description": "你报的术语。可选值：FOB = FOB；CFR = CFR；CIF = CIF / Your quote is on. options: FOB = FOB; CFR = CFR; CIF = CIF",
                    "enum": ["FOB", "CFR", "CIF"],
                    "type": "string"
                  },
                  "unit": {
                    "description": "数量单位。可选值：pcs = 件；sets = 套；cartons = 箱；kg = 千克 / Unit. options: pcs = pcs; sets = sets; cartons = cartons; kg = kg",
                    "enum": ["pcs", "sets", "cartons", "kg"],
                    "type": "string"
                  },
                  "volume": {
                    "description": "总体积（m3） / Total volume (m3)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["price", "quantity", "refundRate", "taxRate"],
                "type": "object"
              },
              "quote": {
                "$schema": "http://json-schema.org/draft-07/schema#",
                "additionalProperties": false,
                "description": "报价单上的其他内容：卖方、买方、品名、术语、港口、有效期、付款方式、交货期。 What the quote says besides the prices: seller, buyer, goods, terms, ports, validity, payment, lead time.",
                "properties": {
                  "buyer": {
                    "additionalProperties": false,
                    "properties": {
                      "contact": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["country", "name"],
                    "type": "object"
                  },
                  "commission_included": {
                    "type": "boolean"
                  },
                  "destination_port": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "issued": {
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  "item": {
                    "additionalProperties": false,
                    "properties": {
                      "description": {
                        "maxLength": 200,
                        "minLength": 1,
