        {
          "name": "unit-convert",
          "title": "单位换算",
          "description": "单位换算（Unit converter）：长度、重量、体积，按国际通用的定义系数换算。 Length, weight and volume, with the internationally defined factors. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "from": "cm",
                "kind": "length",
                "to": "in",
                "value": "60"
              }
            ],
            "properties": {
              "from": {
                "description": "原单位。可选值：mm = 毫米 mm；cm = 厘米 cm；m = 米 m；in = 英寸 in；ft = 英尺 ft；g = 克 g；kg = 千克 kg；t = 公吨 t；lb = 磅 lb；cm3 = 立方厘米 cm³；L = 升 L；m3 = 立方米 m³；in3 = 立方英寸 in³；ft3 = 立方英尺 ft³ / From. options: mm = mm; cm = cm; m = m; in = in; ft = ft; g = g; kg = kg; t = t (metric ton); lb = lb; cm3 = cm³; L = L; m3 = m³; in3 = in³; ft3 = ft³",
                "type": "string"
              },
              "to": {
                "description": "换算为。可选值：mm = 毫米 mm；cm = 厘米 cm；m = 米 m；in = 英寸 in；ft = 英尺 ft；g = 克 g；kg = 千克 kg；t = 公吨 t；lb = 磅 lb；cm3 = 立方厘米 cm³；L = 升 L；m3 = 立方米 m³；in3 = 立方英寸 in³；ft3 = 立方英尺 ft³ / Convert to. options: mm = mm; cm = cm; m = m; in = in; ft = ft; g = g; kg = kg; t = t (metric ton); lb = lb; cm3 = cm³; L = L; m3 = m³; in3 = in³; ft3 = ft³",
                "type": "string"
              },
              "value": {
                "description": "数值 / Value",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              }
            },
            "required": ["from", "to", "value"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Links": {
                "additionalProperties": false,
                "description": "Addresses that go with the answer. `page`: the tool’s page on the site with the same inputs in its address, in the language asked (Chinese for a language the site does not publish yet), so a person can open the page that shows these numbers.",
                "properties": {
                  "page": {
                    "description": "The tool’s page holding these inputs.",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["page"],
                "type": "object"
              },
              "Normalized": {
                "description": "What the API changed in the inputs before core saw them, so the caller sees what was understood: a JSON number as text, a thousands comma, full-width digits, a currency or unit name or a date written another way. Absent when nothing was changed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "given": {
                      "description": "What was sent, as text.",
                      "type": "string"
                    },
                    "path": {
                      "description": "The input, like `cartons.0.length`.",
                      "type": "string"
                    },
                    "used": {
                      "description": "What core was given.",
                      "type": "string"
                    }
                  },
                  "required": ["given", "path", "used"],
                  "type": "object"
                },
                "type": "array"
              },
              "PlainValue": {
                "description": "A figure, tagged so a reader knows how to write it: amounts and quantities are exact decimal strings, never floats.",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "type": "string"
                      },
                      "currency": {
                        "description": "An ISO 4217 code.",
                        "type": "string"
                      },
                      "kind": {
                        "const": "money"
                      }
                    },
                    "required": ["amount", "currency", "kind"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "quantity"
                      },
                      "places": {
                        "description": "How many decimal places the rounding rule keeps; pad to it, never round.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "unit": {
                        "type": "string"
                      },
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["kind", "unit", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "ratio"
                      },
                      "places": {
                        "description": "How many decimal places of the fraction the rounding rule keeps; write the percentage padded to two fewer (0.2820 is 28.20 %), never round.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "value": {
                        "description": "A fraction: 0.13 is 13 %.",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "base": {
                        "type": "string"
                      },
                      "kind": {
                        "const": "rate"
                      },
                      "per": {
                        "description": "`per` units of `base` cost `value` units of `quote`.",
                        "type": "string"
                      },
                      "quote": {
                        "type": "string"
                      },
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["base", "kind", "per", "quote", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "fractional": {
                        "const": true
                      },
                      "grouping": {
                        "const": false
                      },
                      "kind": {
                        "const": "count"
                      },
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "code"
                      },
                      "value": {
                        "description": "A token from a fixed list the tool exports; the words for it are the copy key `<tool>.code.<value>`.",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "date"
                      },
                      "value": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "identifier"
                      },
                      "value": {
                        "description": "A number that is data, such as a barcode number: write it as it is, keep its leading zeros, never group it.",
                        "pattern": "^[A-Za-z0-9]{1,32}$",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "value"],
                    "type": "object"
                  }
                ]
              },
              "Provenance": {
                "additionalProperties": false,
                "description": "Where the figures in an answer come from. In every answer, errors included.",
                "properties": {
                  "api": {
                    "const": "v1"
                  },
                  "datasets": {
                    "items": {
                      "$ref": "#/$defs/ProvenanceDataset"
                    },
                    "type": "array"
                  },
                  "generated_at": {
                    "description": "When the answer was made.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "language": {
                    "description": "The language of the source lines.",
                    "enum": ["zh-CN", "en", "ja", "ko"]
                  },
                  "license": {
                    "additionalProperties": false,
                    "description": "The license as copy keys: which text applies. `status` was `draft` until the text was approved (2026-10-12) and is `approved` now.",
                    "properties": {
                      "ours": {
                        "type": "string"
                      },
                      "status": {
                        "enum": ["draft", "approved"]
                      },
                      "underlying": {
                        "type": "string"
                      }
                    },
                    "required": ["ours", "status", "underlying"],
                    "type": "object"
                  },
                  "notice": {
                    "description": "本站非官方渠道的说明：引用本站数据时请和来源行一起转述。 / The site’s own line that it is not an official channel: pass it on with the source line when you quote us.",
                    "type": "string"
                  },
                  "site": {
                    "description": "The site the data is published by.",
                    "type": "string"
                  },
                  "source_line": {
                    "description": "来源行：回复用户时请原样引用它，让读者知道数据出自哪里、有多新。 / The credit line to quote as it is when you answer: who the figures come from and how fresh they are (the newest publisher’s day among the datasets used, or the day the answer was made).",
                    "type": "string"
                  }
                },
                "required": ["api", "datasets", "generated_at", "language", "license", "notice", "site", "source_line"],
                "type": "object"
              },
              "ProvenanceDataset": {
                "additionalProperties": false,
                "description": "A dataset version an answer drew on. An origin the register does not let the site show is named nowhere.",
                "properties": {
                  "amended_by": {
                    "description": "The official notices whose changes this version carries on top of its edition, where there are any: each one by its number and title as the notice writes them and its own date (no page is given). The label a reader sees is the edition and these, for example 2026B + 公告2026年第29号.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "day": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "number": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "required": ["day", "number", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "edition": {
                    "description": "The publisher’s name for the edition (2026B), where it names them.",
                    "type": "string"
                  },
                  "id": {
                    "description": "The dataset.",
                    "type": "string"
                  },
                  "origin": {
                    "description": "The origin’s id in the register; null when the site may not show it.",
                    "type": ["string", "null"]
                  },
                  "published_at": {
                    "description": "The publisher’s own date (and time, with its offset, when it gives one).",
                    "type": "string"
                  },
                  "source": {
                    "description": "The publisher’s own source line, in the answer’s language; null when there is none to show.",
                    "type": ["string", "null"]
                  },
                  "source_url": {
                    "description": "The publisher’s page, only where the register lets the site link to it.",
                    "type": "string"
                  },
                  "version": {
                    "description": "Its version, named after the publisher’s date.",
                    "type": "string"
                  }
                },
                "required": ["id", "origin", "published_at", "source", "version"],
                "type": "object"
              },
              "Step": {
                "additionalProperties": false,
                "description": "One line of the worked example: `id` is the copy key of its sentence, `values` fill it in.",
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "message": {
                    "description": "这一步的一句话说明，数值已代入，用请求的语言。 / The step as one sentence in the language asked, its figures filled in. Absent when a sentence cannot be made whole.",
                    "type": "string"
                  },
                  "values": {
                    "additionalProperties": {
                      "$ref": "#/$defs/PlainValue"
                    },
                    "type": "object"
                  }
                },
                "required": ["id", "values"],
                "type": "object"
              },
              "Warning": {
                "additionalProperties": false,
                "description": "Something a reader should know about a result; `code` is a copy key.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "level": {
                    "description": "Absent means a caution.",
                    "enum": ["note", "hint"]
                  },
                  "message": {
                    "description": "这条提醒的一句话说明，数值已代入，用请求的语言：回复时请用它，不要自己编数字。 / The warning as one sentence in the language asked, its figures filled in: use it, do not make up figures. Absent when a sentence cannot be made whole.",
                    "type": "string"
                  },
                  "next": {
                    "description": "For a hint: the slug of the tool it points to.",
                    "type": "string"
                  },
                  "values": {
                    "additionalProperties": {
                      "$ref": "#/$defs/PlainValue"
                    },
                    "type": "object"
                  }
                },
                "required": ["code", "values"],
                "type": "object"
              },
              "unit_convertOutputs": {
                "additionalProperties": {
                  "$ref": "#/$defs/PlainValue"
                },
                "description": "Each figure core returns, by id, as a tagged value. The ids listed are the ones the tool’s manifest names; a tool may return more (a figure that only its worked steps use), in the same form.",
                "properties": {
                  "result": {
                    "$ref": "#/$defs/PlainValue"
                  }
                },
                "required": ["result"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "links": {
                "$ref": "#/$defs/Links"
              },
              "normalized": {
                "$ref": "#/$defs/Normalized"
              },
              "outputs": {
                "$ref": "#/$defs/unit_convertOutputs"
              },
              "provenance": {
                "$ref": "#/$defs/Provenance"
              },
              "steps": {
                "items": {
                  "$ref": "#/$defs/Step"
                },
                "type": "array"
              },
              "tool": {
                "const": "unit-convert"
              },
              "warnings": {
                "items": {
                  "$ref": "#/$defs/Warning"
                },
                "type": "array"
              }
            },
            "required": ["links", "outputs", "provenance", "steps", "tool", "warnings"],
            "type": "object"
          },
