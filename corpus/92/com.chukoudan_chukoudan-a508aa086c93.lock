                    "type": ["string", "null"]
                  },
                  "published_at": {
                    "description": "The publisher’s own date (and time, with its offset, when it gives one).",
                    "type": "string"
                  },
                  "source": {
                    "description": "The publisher’s own source line, in the answer’s language; null when there is none to show.",
                    "type": ["string", "null"]
                  },
                  "source_url": {
                    "description": "The publisher’s page, only where the register lets the site link to it.",
                    "type": "string"
                  },
                  "version": {
                    "description": "Its version, named after the publisher’s date.",
                    "type": "string"
                  }
                },
                "required": ["id", "origin", "published_at", "source", "version"],
                "type": "object"
              },
              "QuoteDocument": {
                "additionalProperties": false,
                "description": "One seller’s quote to one buyer: prices and terms only, never the seller’s costs. Each field’s description names its counterpart in OASIS UBL 2.4 Quotation. `digest` is sha256 of the canonical JSON (UTF-8, keys sorted, no spaces) of the document without `digest`; `basis.rate` names the dated exchange rate the prices rest on, which a buyer can check at https://chukoudan.com/v1/datasets/central-parity.",
                "properties": {
                  "basis": {
                    "additionalProperties": false,
                    "description": "The dated exchange rate the prices rest on, when the seller includes it, so a buyer can check it.",
                    "properties": {
                      "made_with": {
                        "const": "https://chukoudan.com"
                      },
                      "rate": {
                        "additionalProperties": false,
                        "properties": {
                          "base": {
                            "pattern": "^[A-Z]{3}$",
                            "type": "string"
                          },
                          "day": {
                            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                            "type": "string"
                          },
                          "per": {
                            "enum": ["1", "100"],
                            "type": "string"
                          },
                          "quote": {
                            "const": "CNY"
                          },
                          "source": {
                            "description": "`central-parity`: the RMB central parity of `day`, from https://chukoudan.com/v1/datasets/central-parity; `given`: the seller’s own rate.",
                            "enum": ["central-parity", "given"],
                            "type": "string"
                          },
                          "value": {
                            "pattern": "^(0|[1-9]\\d*)(\\.\\d+)?$",
                            "type": "string"
                          }
                        },
                        "required": ["base", "per", "quote", "source", "value"],
                        "type": "object"
                      }
                    },
                    "required": ["made_with"],
                    "type": "object"
                  },
                  "buyer": {
                    "additionalProperties": false,
                    "description": "UBL: cac:OriginatorCustomerParty. country: ISO 3166-1 alpha-2.",
                    "properties": {
                      "contact": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["country", "name"],
                    "type": "object"
                  },
                  "currency": {
                    "description": "ISO 4217 code of every price. UBL: cbc:PricingCurrencyCode.",
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "digest": {
                    "description": "`sha256:` and the hex SHA-256 of this document’s canonical JSON without `digest`: UTF-8, keys sorted, no spaces, non-ASCII characters written as themselves (Python: json.dumps(doc, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False)).",
                    "pattern": "^sha256:[0-9a-f]{64}$",
                    "type": "string"
                  },
