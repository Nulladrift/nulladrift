          "name": "container-load",
          "title": "装柜计算器",
          "description": "装柜计算器（Container loading calculator）：每柜装多少箱、要几个柜、怎么摆。 Cartons per container, containers needed, and how to stack them. 读取数据 / Reads: containers@current. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 每箱毛重 grossWeight 可以不填：用户没给重量就不要填，绝不要编一个。不填时只按尺寸算能装多少箱、要几个柜，没有核对载重上限；回答里第一条 warning 的 message 说明了这一点，回复用户时必须把这句话原样带上。 / grossWeight may be left out: when the user gave no weight, do not fill it and never invent one. The answer is then a count by size alone with the payload limit not checked; the first warning’s message says so, and your reply must pass that sentence on. 用户问“一个柜最多能装多少箱”、没有给箱数时，把 fill 填 true，并且不要填 quantity；给了箱数就填 quantity，fill 不填。 / When the user asks how many fit in one container and gives no carton count, send fill as true and leave quantity out; with a carton count, send quantity and leave fill out. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
