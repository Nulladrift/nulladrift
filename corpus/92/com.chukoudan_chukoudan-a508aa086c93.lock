                    "exportDate": {
                      "description": "出口日期（报关单） / Export date (customs declaration)",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "fobAmount": {
                      "description": "离岸价（FOB） / FOB value",
                      "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                      "type": "string"
                    },
                    "fxPer": {
                      "description": "折合率单位。可选值：1 = 每 1 外币；100 = 每 100 外币 / Rate quoted per. options: 1 = per 1 unit; 100 = per 100 units",
                      "enum": ["1", "100"],
                      "type": "string"
                    },
                    "fxRate": {
                      "description": "折合率（中间价） / Exchange rate (central parity)",
                      "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                      "type": "string"
