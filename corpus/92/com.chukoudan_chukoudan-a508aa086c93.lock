                      },
                      "hs_code": {
                        "pattern": "^\\d{6}(\\d{2}(\\d{2})?)?$",
                        "type": "string"
                      },
                      "origin": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "packing": {
