        {
          "name": "duty-estimate",
          "title": "关税估算",
          "description": "关税估算（Duty estimator）：这批货运到英国，买家要付多少关税和增值税，到岸总成本是多少。 What duty and VAT the buyer pays on a consignment to the UK, and the landed cost. 读取数据 / Reads: duty-rules@current, uk-tariff@current. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "currency": "USD",
                "destination": "gb",
                "dutyRate": "2",
                "freight": "600",
                "goods": "5000",
                "insurance": "30",
                "quantity": "1000",
                "rate": "0.75",
                "vatRate": "20"
              }
            ],
            "properties": {
              "currency": {
                "description": "币种 / Currency",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "destination": {
                "description": "目的国 / Destination",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "dutyRate": {
                "description": "关税税率 (%) / Duty rate (%)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "freight": {
                "description": "运费（选填） / Freight (optional)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "goods": {
                "description": "货值（整批货的总价） / Goods value (whole consignment)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "insurance": {
                "description": "保险费（选填） / Insurance (optional)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "quantity": {
                "description": "数量（选填） / Quantity (optional)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "rate": {
                "description": "汇率（1 单位币种折多少英镑） / Exchange rate (pounds for 1 unit of the currency)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              },
              "vatRate": {
                "description": "增值税 VAT 税率 (%) / VAT rate (%)",
                "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                "type": "string"
              }
            },
            "required": ["currency", "destination", "goods", "vatRate"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Links": {
                "additionalProperties": false,
                "description": "Addresses that go with the answer. `page`: the tool’s page on the site with the same inputs in its address, in the language asked (Chinese for a language the site does not publish yet), so a person can open the page that shows these numbers.",
                "properties": {
