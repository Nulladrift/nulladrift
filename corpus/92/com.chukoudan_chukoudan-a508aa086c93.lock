                    "description": "报价币种 / Quote currency",
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "domestic": {
                    "description": "国内费用（CNY） / Domestic costs (CNY)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "domesticBasis": {
                    "description": "国内费用按。可选值：total = 合计；perUnit = 每件 / Domestic costs are given. options: total = for the whole order; perUnit = per unit",
                    "enum": ["total", "perUnit"],
                    "type": "string"
                  },
                  "freight": {
                    "description": "海运费 / Sea freight",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "freightBasis": {
                    "description": "运费计价方式。可选值：container = 每柜；cbm = 每立方米；total = 合计 / Freight is charged. options: container = per container; cbm = per m³; total = for the whole order",
                    "enum": ["container", "cbm", "total"],
                    "type": "string"
                  },
                  "fxPer": {
                    "description": "汇率单位。可选值：1 = 每 1 外币；100 = 每 100 外币 / Rate quoted per. options: 1 = per 1 unit; 100 = per 100 units",
                    "enum": ["1", "100"],
                    "type": "string"
                  },
                  "fxRate": {
                    "description": "汇率 / Exchange rate",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
