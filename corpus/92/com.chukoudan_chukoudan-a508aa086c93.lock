        {
          "name": "lookup_refund_rate",
          "title": "出口退税率查询",
          "description": "查询一个海关编码（HS 编码、商品编码，8 位或 10 位，可带点）在出口退税率文库中的出口退税率（退税率、征税率），用于“帮我查一下海关编码 … 的出口退税率”这类问题。返回该编码的各个时期，并标出适用的一期：给出 export_date（报关单出口日期，不是开票日期）就按那一天；没给就按今天（北京时间），回答里的 lookup.in_force_on 写明用的是哪一天。用户问“现在”“今天”时不要填 export_date，绝不要自己猜今天的日期；回答时说明是按哪一天标出的。编码不在文库中时返回 found: false 和相近编码，绝不编造税率。本站非官方渠道，仅供参考，以官方公布为准，请把答案里的 notes 一并转告用户。 Look up the export VAT refund rate (出口退税率, 退税率) of ONE customs / HS code (海关编码, 商品编码; 8 or 10 digits, dots allowed, e.g. 8506101110) in the 出口退税率文库. Use it for \"帮我查一下海关编码 … 的出口退税率\" / \"what is the export refund rate of HS code …\". Returns every period of the code (refund rate, levy rate 征税率, from, to) and the period in force on one day: export_date when given, otherwise today by the Beijing calendar (lookup.in_force_on names the day). The rate that counts is the one on the export date of the customs declaration (报关单出口日期), not the invoice date: for “now” or “today” leave export_date out and never guess today’s date; say in your reply which day the period was marked for. An unknown code answers found: false with nearby codes, never a rate. Reference data from this site, not the official channel; the official publication prevails. Pass on the notes in the answer. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "海关编码（HS 编码），8 位或 10 位，可带点或空格，例如 8506101110。 The customs code, 8 or 10 digits (dots and spaces allowed), e.g. 8506101110.",
                "type": "string"
              },
              "export_date": {
                "description": "报关单上的出口日期（不是开票日期），格式 YYYY-MM-DD；不填则按今天（北京时间）标出适用的一期。用户问“现在”就不填，绝不要自己猜今天的日期。 The export date on the customs declaration, YYYY-MM-DD (not the invoice date). Optional: without it the period in force today (Beijing calendar) is marked; leave it out for “now” and never guess today’s date.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export refund rate of a customs code"
          },
