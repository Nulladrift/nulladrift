        {
          "name": "make_quote",
          "title": "生成报价单",
          "description": "按报价工具的输入和卖方的条款，生成一份发给买方的报价单：quote 是结构化数据（https://chukoudan.com/schemas/quote/v1.json，只有价格和条款，带 digest 和汇率依据，买方可核对），text 是可直接发出的纯文本（语言按 language），internal 是卖方自己的成本、退税和利润，只给卖方看，绝不发给买方。本站不保存任何内容。 Make a quote for a buyer from the quote calculator’s inputs (pricing) and the seller’s terms (quote): `quote` is the quote as data (schema https://chukoudan.com/schemas/quote/v1.json; prices and terms only, with a digest and the dated rate it rests on, so the buyer can check it), `text` is the same quote as plain text ready to send, and `internal` holds the seller’s own cost, refund and profit: for the seller only, NEVER send it to the buyer. Leave pricing.fxRate out to use the day’s RMB central parity. Nothing is stored. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pricing": {
                "description": "报价工具（baojia）的输入；不填 fxRate 就用当天的人民币汇率中间价。 The inputs of the quote calculator (baojia); leave fxRate out to use the day’s RMB central parity.",
                "examples": [
                  {
                    "containers": "1",
                    "currency": "USD",
                    "freight": "1800",
                    "freightBasis": "container",
                    "fxRate": "7.0850",
                    "margin": "10",
                    "marginBasis": "quote",
                    "mode": "forward",
                    "price": "50",
                    "quantity": "4500",
                    "quotedPrice": "7.50",
                    "refundRate": "13",
                    "taxRate": "13",
                    "term": "FOB"
                  }
                ],
                "properties": {
                  "commission": {
                    "description": "佣金率（%） / Commission rate (%)",
                    "pattern": "^-?(0|[1-9]\\d*)(\\.\\d+)?$",
                    "type": "string"
                  },
                  "containers": {
                    "description": "柜数 / Containers",
                    "pattern": "^(0|[1-9]\\d*)$",
                    "type": "string"
                  },
