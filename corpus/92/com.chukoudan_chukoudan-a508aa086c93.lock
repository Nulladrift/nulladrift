        {
          "name": "baojia",
          "title": "FOB/CIF/CFR 报价",
          "description": "FOB/CIF/CFR 报价（FOB/CIF/CFR quotes）：由成本算三种术语报价和利润。 Quotes and profit on all three terms, from your cost. 输入为精确的十进制字符串 / Inputs are exact decimal strings. 正算反算都能做：mode=forward（默认）由含税采购单价、数量、征税率、退税率、汇率和目标利润率，算出 FOB 报价和利润；给了海运费就有 CFR，再给保险费率就有 CIF，佣金另算含佣价。mode=reverse 由已经报出的价格（term 和 quotedPrice）反算利润、利润率和保本价，同样给出出口退税额和含佣价。必填：含税采购单价 price、数量 quantity、征税率 taxRate、退税率 refundRate、汇率 fxRate（正算还要目标利润率 margin）；汇率和退税率要用户给，不会自动取。出口退税按外贸企业（取得增值税专用发票采购）计算；生产企业的免抵退请用 tuishui。 / Works both ways: mode=forward (the default) takes the VAT-inclusive purchase price, quantity, VAT rate, refund rate, exchange rate and target margin to the FOB quote and profit, with CFR when sea freight is given and CIF when an insurance rate is given, and the commission-inclusive price on top. mode=reverse takes a price already quoted (term and quotedPrice) and gives the profit, margin and break-even price, with the export tax refund and the commission-inclusive price. Required: price, quantity, taxRate, refundRate, fxRate (forward also needs margin); the user gives the exchange rate and the refund rate, neither is looked up for you. The refund is worked as a trading company’s (goods bought on a special VAT invoice); for a manufacturer’s 免抵退 use tuishui. 用户给了海关编码，先调用 lookup_refund_rate 查退税率；要发给买方的报价单，调用 make_quote（不填汇率就用当天的中间价）。 / For a customs code call lookup_refund_rate for the refund rate first; for a quote to send to a buyer call make_quote (leave the rate out there to use the day’s central parity). 用户没有给的数字和日期不要自己编：必填的先问用户，选填的不填。 / Never make up a figure or a date the user did not give: ask for a required one, leave an optional one out. 回复时引用回答里的 provenance.source_line / Quote provenance.source_line in your reply. 结果仅供计算参考，不是税务、法律或投资意见；回答时请带上返回的说明和来源行。 / The result is for calculation and reference only, not tax, legal or investment advice; when you answer, pass on the returned notice and source line.",
          "inputSchema": {
            "description": "数字最好写成字符串（十进制，如 \"12.5\"），JSON 数字也行；千位逗号只认 1,234,567 这种写法，小数点用英文句点，不要带货币符号或单位。币种可写 USD、usd 或 美元，单位可写 cm 或 厘米，日期可写 2026-05-01、2026/05/01 或 20260501。读不准的一律拒绝并说明原因，绝不猜；回答里的 normalized 列出实际采用的值。 / Figures should be sent as decimal strings such as \"12.5\"; a JSON number is accepted too. A thousands comma only as 1,234,567; the decimal point is a dot; no currency symbols or units. A currency may be USD, usd or 美元, a unit cm or 厘米, a date 2026-05-01, 2026/05/01 or 20260501. Anything that cannot be read in exactly one way is refused with a reason, never guessed; `normalized` in the answer lists what was used.",
            "examples": [
              {
                "containers": "1",
                "currency": "USD",
                "freight": "1800",
                "freightBasis": "container",
                "fxRate": "7.0850",
                "margin": "10",
                "marginBasis": "quote",
                "mode": "forward",
