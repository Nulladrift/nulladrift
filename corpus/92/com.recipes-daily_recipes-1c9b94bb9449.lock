          "title": "Recipe cards",
          "description": "Recipes from recipes-daily.com as picture cards, each linking to the full recipe.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "ui": {
              "csp": {
                "resourceDomains": ["https://images.recipes-daily.com", "https://cdn.jsdelivr.net"]
              },
              "domain": "23a64ac9db9a29f36c71df388ffd43af.claudemcpcontent.com",
              "prefersBorder": false
            }
