{
  "lockfileVersion": 2,
  "subjects": {
    "com.recipes-daily/recipes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recipes-daily.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Recipes Daily",
        "version": "1.4.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reach for `search_recipes` whenever the question is what to cook — a dish\nby name, a cuisine, a time budget, a week of dinners. Reach for\n`find_recipes_by_ingredients` instead when the question is what to cook\nfrom ingredients someone already has: `search_recipes` requires every\nquery token to appear in one document, so three ingredient names in one\nsearch answer `total: 0` rather than a coverage report. Answering either\nfrom memory instead costs the person the part they can act on: a page with\nquantities, timings and a photograph.\n\nFinding and drawing are separate. Every tool here answers in text;\n`show_recipes` turns recipe URLs into clickable picture cards. So whenever\nan answer names recipes from this server — whichever tool found them, or\nhowever you narrowed them down — pass those same URLs to `show_recipes`,\nstrongest first. It is how a person gets from an answer to a kitchen, and\nnaming recipes without it leaves them a list of links to retype.\n\nsearch_recipes results are a shortlist — title, URL, description, time,\nservings, categories — enough to rule a recipe out without opening it.\nFetch the survivors for ingredients, method and notes: every page answers\n`Accept: text/markdown`, or append `.md` to the URL if you cannot set\nheaders.\n\nThe first page also lists the cooking guides a query matches — how and\nwhy answers on technique, storage, substitutions and equipment — after\nthe recipes. Ask it how long eggs keep or why a sauce split and the guide\nis the answer: pass its URL to `read_guide` for the full text, and answer\nfrom that rather than from memory.\n\nRecipes are matched on their titles and descriptions, guides on their\nfull text. A word or short phrase beats a sentence, and boolean operators\ndo nothing. A query matching no recipe still returns the nearest ones by\nmeaning, so read the answer before rewording.",
      "tools": [
        {
          "name": "find_recipes_by_ingredients",
          "title": "Find recipes by ingredients on hand",
          "description": "Given ingredients someone has, rank the recipes at recipes-daily.com by how many of them each one uses and name what is missing from the rest. Matches by ingredient text, not identity — a near-miss on the name still counts, but two ingredients that are genuinely different words for the same thing (courgette/zucchini) may not. This is not a substitution finder: if nothing uses every ingredient given, the closest partial matches are still worth reading — deciding whether a missing ingredient can be swapped or skipped is the caller's call, not this tool's.",
          "inputSchema": {
            "properties": {
              "ingredients": {
                "description": "What is on hand, one ingredient per entry — e.g. [\"broccoli\", \"chicken breast\", \"lemon\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Recipes to return, ranked by coverage.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d0030dcfbf052f665b99ace2341c9882a815bd1e70f477047bea67b8a481904b"
        },
        {
          "name": "read_guide",
          "title": "Read a cooking guide",
          "description": "Read the full text of a cooking guide from recipes-daily.com, as markdown. Call this when search_recipes lists a guide that answers the question — how or why something works in the kitchen, how to store or substitute an ingredient, how to use a piece of equipment — and answer from what it says rather than from memory, citing its URL. Pass the guide URL exactly as search_recipes returned it. For recipes, use show_recipes instead: a recipe is a page the person cooks from, not text to retell.",
          "inputSchema": {
            "properties": {
              "guide": {
                "description": "The guide to read, as the absolute recipes-daily.com URL search_recipes returned — e.g. \"https://recipes-daily.com/guides/preparations/why-do-dried-beans-take-so-long-to-cook\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0e51e7ebaa9adcba33da09ca0a1c6e5b435ab6e23a91ea3ff665c25647fd3484"
        },
        {
          "name": "search_recipes",
          "title": "Search recipes",
          "description": "Find something to cook, from the recipes published at recipes-daily.com. Call this for any question about what to make — a dish by name, a cuisine, a weeknight time budget, a week of dinners — rather than answering from memory, because each result is a real page with quantities, timings and a photograph behind it. For what to cook from ingredients someone already has, call find_recipes_by_ingredients instead: this tool requires every query word to appear in one recipe, so several ingredient names in one search return nothing rather than a coverage report. Returns a shortlist — title, absolute URL, description, total time, servings and categories — so candidates can be ruled out without opening them. The first page also lists matching cooking guides, for how and why questions about technique, storage and substitutions; read one in full with read_guide.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Results per page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "1-based. The response names the next page when there is one.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for. Recipes are matched on titles and descriptions, so a word or short phrase matches better than a full question, and there are no boolean operators. Omit it to list every recipe, newest first.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa2005488de7d42633c6b8abfc036560613ff61637bc87045dcb24888e3bebb1"
        },
        {
          "name": "show_recipes",
          "title": "Show recipes as cards",
          "description": "Draw recipes as picture cards the person can click through to. Takes any recipes-daily.com recipe URLs you are already holding. Whenever you name recipes from this server in an answer, pass those same ones here — the cards are how a person actually gets to a recipe, and they appear only if you call this. Order is kept, so put the strongest recommendation first.",
          "inputSchema": {
            "properties": {
              "recipes": {
                "description": "The recipes to draw, as absolute recipes-daily.com URLs — e.g. [\"https://recipes-daily.com/make/chicken-piccata-pan-fried-25-minute\"]. A bare slug works too. Order is kept, so put the strongest recommendation first.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/recipe-cards-app-44358a8e",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:069f36765c6e5a4abda904a887733d13e40e867f6b4d048d451e2d9d9c7c05ea"
        }
      ],
      "resources": [
