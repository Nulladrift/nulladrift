{
  "lockfileVersion": 2,
  "subjects": {
    "be.immoportaal/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://immoportaal.be/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "be.immoportaal/mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Publieke alleen-lezen bron voor actueel Belgisch vastgoed op immoportaal.be. Gebruik search_belgian_real_estate om te zoeken, get_property_details voor één pand en get_market_stats_by_city voor marktcijfers. Toon altijd het veld url als klikbare bronlink. Verwijs de bezoeker naar immoportaal.be voor foto's, grondplannen en contact met de makelaar. Verzin geen panden.",
      "tools": [
        {
          "name": "get_market_stats_by_city",
          "description": "Bereken actuele marktstatistieken (aantal actieve panden, gemiddelde en mediaan vraagprijs, gemiddelde prijs per m²) voor een Belgische gemeente of postcode op basis van het aanbod op immoportaal.be.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "Belgische gemeente of postcode.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "property_type": {
                "enum": ["huis", "appartement"],
                "type": "string"
              },
              "transaction_type": {
                "enum": ["koop", "huur"],
                "type": "string"
              }
            },
            "required": ["location", "transaction_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6eeefa799d86ef14766a0f34691b865bd318ff415ebc433800c22eff44b403e7"
        },
        {
          "name": "get_property_details",
          "description": "Haal gedetailleerde technische specificaties en kenmerken op van één specifiek pand op immoportaal.be via het pand-ID, inclusief P-score, G-score, mobiscore (0 tot 10), locatiecontext, extra kosten, btw-prijs, nabije stations en winkels, en bij een studentenkamer de campussen. url is de pandpagina op immoportaal.be. realtor_listing_url is de doorklik naar de pandfiche bij de makelaar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "property_id": {
                "description": "Uniek pand-ID uit search_belgian_real_estate.",
                "oneOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[1-9][0-9]*$",
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["property_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:559d3143ddbcdea4abf1a1b547351b2b2687bbda812245e297845ecfe0cb04f6"
        },
        {
          "name": "search_belgian_real_estate",
          "description": "Zoek actueel Belgisch vastgoed te koop of te huur op immoportaal.be. location is een gemeente, postcode of stationsnaam. Voorbeelden: Gent, Gent-Sint-Pieters, Gent-Dampoort, Dampoort, of Gent-Sint-Pieters 500 m. Zonder afstand zoekt een station binnen 2000 m. radius is een straal in meter en werkt ook samen met een stationsnaam, zonder lat en long. lat, long en radius samen zoeken rond een punt. near_train_station is true voor 1000 m van een station, of een maximum in meter. property_type studentenkamer zoekt koten. Elk pand bevat P-score, G-score en mobiscore wanneer de bron die heeft. Bij nieuwbouw is de vraagprijs exclusief btw en exclusief andere kosten. Bij een studentenkamer staan de campussen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Segment: wonen, werken of studentenkamer.",
                "enum": ["residentieel", "professioneel", "studentenkamer"],
                "type": "string"
              },
              "lat": {
                "description": "Breedtegraad (WGS84). Samen met long en radius.",
                "maximum": 51.6,
                "minimum": 49,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Gemeente, postcode of treinstation. Een afstand mag erbij: Gent-Sint-Pieters 500 m, Gent-Dampoort of Dampoort. Zonder afstand: 2000 m rond het station.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "long": {
                "description": "Lengtegraad (WGS84). Samen met lat en radius.",
                "maximum": 6.5,
                "minimum": 2.2,
                "type": "number"
              },
              "max_epc_label": {
                "description": "Dit EPC-label of energiezuiniger.",
                "enum": ["A+", "A", "B", "C", "D", "E", "F"],
                "type": "string"
              },
              "max_price": {
                "description": "Maximumprijs in euro.",
                "minimum": 1,
                "type": "integer"
              },
              "min_bedrooms": {
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimumprijs in euro.",
                "minimum": 1,
                "type": "integer"
              },
              "near_train_station": {
                "description": "true voor wandelafstand (1000 m), of een maximumafstand tot een bestaand treinstation in meter (50-5000).",
                "oneOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "maximum": 5000,
                    "minimum": 50,
                    "type": "integer"
                  }
                ]
              },
              "property_type": {
                "enum": ["huis", "appartement", "bouwgrond", "handelspand", "studio", "kantoor", "studentenkamer"],
                "type": "string"
              },
              "radius": {
                "description": "Straal in meter. Samen met lat en long, of samen met een stationsnaam in location. Voorbeeld: 500.",
                "maximum": 20000,
                "minimum": 100,
                "type": "integer"
              },
              "transaction_type": {
                "description": "Koop of huur.",
                "enum": ["koop", "huur"],
                "type": "string"
              }
            },
            "required": ["transaction_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:996b318882ed2fa7f85fea9ceec84e0a55455dc331dd8c8acbbc524d36756efc"
        }
      ],
      "digest": "sha256:b55442e012d4fa6ee8d1220ac41f9b0734368978da2c80895718e577f5a2428c"
    }
  }
}
