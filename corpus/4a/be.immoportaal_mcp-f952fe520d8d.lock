      },
      "transport": {
        "type": "http",
        "url": "https://immoportaal.be/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "be.immoportaal/mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Publieke alleen-lezen bron voor actueel Belgisch vastgoed op immoportaal.be. Gebruik search_belgian_real_estate om te zoeken, get_property_details voor één pand en get_market_stats_by_city voor marktcijfers. Haal tools/list opnieuw op aan het begin van een sessie; een eerder opgeslagen schema kan stations, straal of studentenkamer missen. Toon altijd url als klikbare bronlink naar de pandpagina op immoportaal.be. Toon ook realtor_listing_url als die er is: dat is de fiche bij de makelaar en de link voor contact. Foto's en grondplannen staan op de pandpagina. Een veld dat null is of ontbreekt, heeft de bron niet aangeleverd. Vul het niet zelf in en reken het niet uit. p_score en g_score zijn bij huur niet van toepassing en vaak leeg. Bij nieuwbouw is de vraagprijs exclusief btw en exclusief andere kosten. price_incl_vat_6_eur en price_incl_vat_21_eur ontbreken vaak; reken die btw niet zelf uit. mobiscore is null als er geen score is. Verzin geen panden.",
      "tools": [
        {
          "name": "get_market_stats_by_city",
          "description": "Marktcijfers op immoportaal.be: aantal actieve panden, gemiddelde en mediaan vraagprijs, gemiddelde prijs per m². location is een gemeente (Gent), een postcode (9000) of een treinstation (Gent-Dampoort, Station Aalst, Gent-Sint-Pieters 800 m). Zonder afstand geldt 2000 m rond het station. radius in meter past die straal aan. property_type is huis, appartement, bouwgrond, handelspand, studio, kantoor of studentenkamer. Voorbeeld: location Gent, transaction_type huur, property_type studentenkamer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "Gemeente, postcode of treinstation. Voorbeelden: Gent, 9000, Gent-Dampoort, Station Aalst, Gent-Sint-Pieters 800 m. Zonder afstand: 2000 m rond het station.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "property_type": {
                "description": "Optioneel. huis, appartement, bouwgrond, handelspand, studio, kantoor of studentenkamer. Voorbeeld: studentenkamer.",
                "enum": ["huis", "appartement", "bouwgrond", "handelspand", "studio", "kantoor", "studentenkamer"],
                "type": "string"
              },
              "radius": {
                "description": "Straal in meter rond een treinstation in location, van 100 tot 20000. Voorbeeld: 800. Een afstand in location, zoals 800 m, heeft voorrang. Bij een gemeente of postcode doet radius niets.",
                "maximum": 20000,
                "minimum": 100,
                "type": "integer"
              },
              "transaction_type": {
                "description": "koop of huur. Voorbeeld: koop.",
                "enum": ["koop", "huur"],
                "type": "string"
              }
            },
            "required": ["location", "transaction_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cce047be0739d3f25dae16ba689a7dbd10bf3e20f9147d468cb354cae2c78aa"
        },
        {
          "name": "get_property_details",
          "description": "Details van één pand op immoportaal.be, via het id uit de zoekresultaten. Toon url (pandpagina op immoportaal.be) en realtor_listing_url (fiche bij de makelaar) naast elkaar. null betekent dat de bron het veld niet heeft: niet invullen en niet zelf berekenen. p_score en g_score zijn bij huur niet nodig en vaak leeg. Bij nieuwbouw ontbreken de btw-bedragen vaak; de vraagprijs is exclusief btw en exclusief andere kosten. Verder: mobiscore (0 tot 10), locatiecontext, extra kosten, het dichtstbijzijnde station, winkels, en bij een studentenkamer de campussen met afstand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "property_id": {
                "description": "Pand-id uit search_belgian_real_estate. Voorbeeld: 4513.",
                "oneOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[1-9][0-9]*$",
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["property_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1039c21caf0dca4f016909acfe371164bfe6aae044236cdb9e923e50a72df1a5"
        },
        {
          "name": "search_belgian_real_estate",
          "description": "Zoek actueel Belgisch vastgoed te koop of te huur op immoportaal.be. location is een gemeente (Gent), een postcode (9000) of een treinstation (Gent-Sint-Pieters, Gent-Dampoort, Dampoort, Station Aalst). De straal zet je in die tekst of in radius: Gent-Sint-Pieters 800 m, of location Gent-Sint-Pieters met radius 800. Zonder afstand zoekt een station binnen 2000 m. lat, long en radius samen zoeken rond een punt, bijvoorbeeld lat 51.05, long 3.72 en radius 800. near_train_station is true voor 1000 m van een willekeurig station, of een maximum in meter zoals 800. Op een gemeente krijgt elk pand dan distance_m tot het dichtstbijzijnde station. Samen met een stationsnaam wordt near_train_station de straal rond dat station, tenzij radius of een afstand in de naam die al zet; distance_m is dan de afstand tot dat station. category is residentieel, professioneel of studentenkamer. Stuur niet wonen of werken. property_type is huis, appartement, bouwgrond, handelspand, studio, kantoor of studentenkamer. Eén van category of property_type volstaat. Samen mag als ze overeenkomen, ook studentenkamer met studentenkamer. Voorbeeld kot: transaction_type huur, location Gent, property_type studentenkamer. Elk resultaat bevat url. p_score en g_score zijn bij huur niet van toepassing en vaak null; reken ze niet zelf uit. Bij nieuwbouw ontbreken price_incl_vat_6_eur en price_incl_vat_21_eur vaak; reken die btw niet zelf uit. De vraagprijs is dan exclusief btw en exclusief andere kosten. Bij een studentenkamer staan de campussen met afstand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Waarde: residentieel, professioneel of studentenkamer. residentieel is wonen, professioneel is werken. Stuur niet wonen of werken. Voorbeeld: studentenkamer. Dit veld alleen volstaat. Samen met property_type mag, als ze overeenkomen: residentieel met huis, appartement, bouwgrond of studio; professioneel met handelspand of kantoor; studentenkamer met studentenkamer.",
                "enum": ["residentieel", "professioneel", "studentenkamer"],
                "type": "string"
              },
              "lat": {
                "description": "Breedtegraad WGS84. Alleen samen met long en radius. Voorbeeld: 51.05.",
                "maximum": 51.6,
                "minimum": 49,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Aantal resultaten, van 1 tot 15. Standaard 10. Voorbeeld: 5.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Gemeente, postcode of treinstation. Voorbeelden: Gent, 9000, Gent-Sint-Pieters, Gent-Dampoort, Dampoort, Station Aalst. Een afstand erbij past de stationsstraal aan: Gent-Sint-Pieters 800 m. Zonder afstand: 2000 m rond het station. Weglaten mag als lat, long en radius samen gezet zijn.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "long": {
                "description": "Lengtegraad WGS84. Alleen samen met lat en radius. Voorbeeld: 3.72.",
                "maximum": 6.5,
                "minimum": 2.2,
                "type": "number"
              },
              "max_epc_label": {
                "description": "Dit EPC-label of energiezuiniger, van A+ tot F. Voorbeeld: B.",
                "enum": ["A+", "A", "B", "C", "D", "E", "F"],
                "type": "string"
              },
              "max_price": {
                "description": "Maximumprijs in euro. Voorbeeld: 600.",
                "minimum": 1,
                "type": "integer"
              },
              "min_bedrooms": {
                "description": "Minimum aantal slaapkamers. Voorbeeld: 3. Een studio heeft geen slaapkamers.",
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimumprijs in euro. Voorbeeld: 200000.",
                "minimum": 1,
                "type": "integer"
              },
              "near_train_station": {
                "description": "Op een gemeente of postcode: alleen panden binnen deze afstand van een willekeurig station. true is 1000 m, een getal is 50 tot 5000. Voorbeeld: 800. Elk pand krijgt dan distance_m tot het dichtstbijzijnde station. Samen met een stationsnaam, bijvoorbeeld location Gent-Dampoort en near_train_station 800: dit getal wordt de straal rond dat station, tenzij de naam al een afstand bevat of radius gezet is. distance_m is dan de afstand tot dat station. Een grotere radius houdt de cirkel rond het station, en dit veld laat alleen panden over die ook binnen deze meters van een station liggen.",
                "oneOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "maximum": 5000,
                    "minimum": 50,
                    "type": "integer"
                  }
                ]
              },
              "property_type": {
                "description": "Pandtype. Precies één van: huis, appartement, bouwgrond, handelspand, studio, kantoor, studentenkamer. Een kot is studentenkamer. Voorbeeld: studentenkamer. Dit veld alleen volstaat. Samen met category mag, als ze overeenkomen.",
                "enum": ["huis", "appartement", "bouwgrond", "handelspand", "studio", "kantoor", "studentenkamer"],
                "type": "string"
              },
              "radius": {
                "description": "Straal in meter, van 100 tot 20000. Samen met lat en long, of samen met een stationsnaam in location. Voorbeeld: 800. Een afstand in location, zoals 800 m, heeft voorrang op dit getal.",
                "maximum": 20000,
                "minimum": 100,
                "type": "integer"
              },
              "transaction_type": {
                "description": "Verplicht. koop of huur. Voorbeeld: huur.",
                "enum": ["koop", "huur"],
                "type": "string"
              }
            },
            "required": ["transaction_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fa41581240d404d8bbcf496e94d16c31e0fcff8c9e80b0116f731eb36c96a25"
        }
      ],
      "digest": "sha256:0a156e77f360cc4eb3a8b94b6f5b577b5dc8ab63290499a1120239747bb3106f"
    }
  }
