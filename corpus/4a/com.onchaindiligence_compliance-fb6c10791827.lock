        {
          "name": "inspect_payment",
          "description": "FREE. Pure deterministic inspection of a proposed payment against structured policy (amount/network/asset/recipient/resource) — no external evidence, no sanctions screening, no cryptographic signing, no receipt. Returns the same ALLOW / REQUIRE_APPROVAL / BLOCK decision semantics as POST /x402/preflight-payment for the deterministic checks alone, so a caller can sanity-check a proposal before deciding whether the paid preflight (adds optional sanctions evidence and a signed, independently-verifiable receipt, $0.01) is worth paying for. This result is NOT cryptographically attested and carries no receipt — receipt is always null.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "description": "Canonical decimal string amount, e.g. \"1.00\". Never a float.",
                    "type": "string"
                  },
                  "asset": {
                    "description": "Canonical ERC-20 token contract address (0x…) — never a ticker like \"USDC\".",
                    "type": "string"
                  },
                  "kind": {
                    "const": "PAYMENT",
                    "description": "The only supported action kind in v1.",
                    "type": "string"
                  },
                  "network": {
                    "description": "CAIP-2 network identifier, e.g. \"eip155:8453\" for Base mainnet.",
                    "type": "string"
                  },
                  "recipient": {
                    "description": "Recipient wallet address (0x…).",
                    "type": "string"
                  },
                  "resource": {
                    "description": "URL of the resource/service the payment is for, if any.",
                    "type": ["string", "null"]
                  },
                  "sender": {
                    "description": "Sender wallet address, if known.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["amount", "asset", "kind", "network", "recipient"],
                "type": "object"
              },
              "policy": {
                "additionalProperties": false,
                "properties": {
                  "acknowledge_unconstrained": {
                    "description": "Required (true) if every constraint above is null/omitted, confirming that was intentional and not an accident.",
                    "type": "boolean"
                  },
                  "allowed_assets": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Allowed token contract addresses, or null for no restriction."
                  },
                  "allowed_networks": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Allowed CAIP-2 networks, or null for no restriction."
                  },
                  "allowed_resource_origins": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Allowed https origins for action.resource, or null."
                  },
                  "expected_payer": {
                    "description": "Frozen commitment to the wallet expected to authorize the eventual on-chain payment (D2.4 binding strength) — decision-neutral, or null.",
                    "type": ["string", "null"]
                  },
                  "expected_recipient": {
                    "description": "Exact recipient address the caller expects, or null.",
                    "type": ["string", "null"]
                  },
                  "max_amount": {
                    "description": "Maximum allowed decimal amount, or null for no configured cap.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "required": ["action", "policy"],
            "type": "object"
