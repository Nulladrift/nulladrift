        {
          "name": "rent_domain",
          "description": "Paid rental. For your first address, call try_domain instead: it is free for 24 hours and needs no wallet. Rent a subdomain, paying per-transaction with USDC on Base (x402). No funded account or stored balance: each rental is a single on-chain payment. Requires agent authentication. Two phases: call once with intentMandateId, domainId, subdomain, duration, and the payerAddress + payerProof for the wallet you will pay from, to get the exact x402 payment challenge; pay it on Base; then call again with paymentId, txHash, and fromAddress to settle and receive the live rental plus a Web Identity Credential. Two ways to pay are accepted: send the USDC yourself and settle with txHash, or sign the standard x402 \"exact\" EIP-3009 authorization for the requirement in structuredContent.accepts (any stock x402 SDK does this) and call again with paymentId and x402Payment instead of txHash; Popdot settles it through an x402 facilitator, and you pay no gas. Request an x402 payment challenge to rent a subdomain. Durations PT1H, PT4H, P1D, P7D, P30D. Returns the exact USDC amount and recipient on Base.",
          "inputSchema": {
            "properties": {
              "domainId": {
                "description": "The unique ID of the domain to rent on",
                "type": "string"
              },
              "duration": {
                "description": "ISO 8601 duration: PT1H (1 hour), PT4H (4 hours), P1D (1 day), P7D (1 week), P30D (30 days)",
                "enum": ["PT1H", "PT4H", "P1D", "P7D", "P30D"],
                "type": "string"
              },
              "fromAddress": {
                "description": "(phase 2) The wallet you paid from (must match the challenge's bound payer).",
                "type": "string"
              },
              "intentMandateId": {
                "description": "The ID of the active Intent Mandate authorizing this purchase",
                "type": "string"
              },
              "payerAddress": {
                "description": "(phase 1) The 0x wallet you will pay from. Required on every challenge; a wallet registered on your Sigil does not substitute for it.",
                "type": "string"
              },
              "payerProof": {
                "description": "(phase 1) EIP-191 personal_sign signature proving control of payerAddress. Always required with payerAddress.",
                "type": "string"
              },
              "payerProofIssuedAt": {
                "description": "(phase 1, optional) ISO 8601 timestamp of the payerProof, within 5 minutes of the request.",
                "type": "string"
              },
              "paymentId": {
                "description": "(phase 2) The paymentId returned by the phase-1 challenge.",
                "type": "string"
              },
              "subdomain": {
                "description": "The subdomain label to rent (e.g., 'myproject' for myproject.example.com)",
                "type": "string"
              },
              "txHash": {
                "description": "(phase 2) The on-chain transaction hash of your USDC payment on Base.",
                "type": "string"
              },
              "x402Payment": {
                "description": "(phase 2, instead of txHash) An x402 \"exact\" payment payload signed by the bound payer for structuredContent.accepts[0]: the JSON object, or its base64 as sent in a PAYMENT-SIGNATURE or X-PAYMENT header. Send it with paymentId.",
                "type": ["string", "object"]
              }
            },
            "required": ["domainId", "duration", "intentMandateId", "subdomain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accepts": {
