        {
          "name": "try_domain",
          "description": "Start here. Get a memorable public URL for something you built, free for 24 hours, with no signup, key or wallet. Give a one sentence goal and set autoSelect: true (or pass preferredSubdomain); it picks the domain for you, so you do not need search_domains first. Add an https target if you have one. With no target yet the address shows a holding page, and you point it later by calling try_domain again with your trialHandle and target. It may ask a short safety question or two (answer with answer_trial_canary); on a clean pass it returns a live subdomain plus a one-time claim token you can redeem with upgrade_trial for your own agent identity. One trial per agent. Expires in 24 hours.",
          "inputSchema": {
            "properties": {
              "analyticsConsent": {
                "description": "Record operator consent to trial analytics for this address.",
                "type": "boolean"
              },
              "autoSelect": {
                "description": "Let Popdot AI pick an available subdomain from your goal when you do not provide preferredSubdomain.",
                "type": "boolean"
              },
              "desiredEmotion": {
                "description": "Preferred vibe of the parent domain: comedy, absurd, playful, edgy, wholesome, professional, trustworthy. Unknown values are ignored.",
                "enum": ["comedy", "absurd", "playful", "edgy", "wholesome", "professional", "trustworthy"],
                "type": "string"
              },
              "email": {
                "description": "Optional email to associate with the trial. Never returned.",
                "type": "string"
              },
              "goal": {
                "description": "What you built and want to put online, in a sentence (used to name and describe the address).",
                "type": "string"
              },
              "inputResponses": {
                "description": "(retry only) Your answers to the safety questions, one { id, response } per requested input.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "preferredSubdomain": {
                "description": "The subdomain label you want (e.g. 'mydemo'). Omit and set autoSelect:true to have one picked for you.",
                "type": "string"
              },
              "publicKey": {
                "description": "Optional, on the call that goes live. Your Ed25519 public key (standard padded base64 of the raw 32 bytes) to claim your agent identity in the same call. Requires headers X-Popdot-Timestamp (Unix seconds) and X-Popdot-Signature: an Ed25519 signature by this key over {timestamp}\\nPOST\\n/api/mcp\\n{sha256 hex of the raw request body}. Omit it to receive a claim token for upgrade_trial instead.",
                "type": "string"
              },
              "target": {
                "description": "Optional. An https URL to point the address at. Omit it to go live on a holding page now; to point it later, call try_domain again with the same goal, your trialHandle and this target (no answers). A trial can be pointed once.",
                "type": "string"
              },
              "trialHandle": {
                "description": "(retry only) The trialHandle returned by the first call. Echo it back with your answers, or with a target to point a live holding-page trial.",
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canaryVerdict": {
                "type": "string"
              },
              "candidateId": {
                "type": "string"
              },
              "claimError": {
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "claimToken": {
                "type": "string"
              },
              "claimTokenExpiresAt": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "expiresAt": {
                "type": "string"
