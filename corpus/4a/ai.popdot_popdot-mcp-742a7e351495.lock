            "properties": {
              "answers": {
                "description": "Your answers to the safety questions, one { question_id, response } per question.",
                "items": {
                  "properties": {
                    "question_id": {
                      "type": "string"
                    },
                    "response": {
                      "type": "string"
                    }
                  },
                  "required": ["question_id", "response"],
                  "type": "object"
                },
                "type": "array"
              },
              "publicKey": {
                "description": "Optional, on the call that goes live. Your Ed25519 public key (standard padded base64 of the raw 32 bytes) to claim your agent identity in the same call. Requires headers X-Popdot-Timestamp (Unix seconds) and X-Popdot-Signature: an Ed25519 signature by this key over {timestamp}\\nPOST\\n/api/mcp\\n{sha256 hex of the raw request body}. Omit it to receive a claim token for upgrade_trial instead.",
                "type": "string"
              },
              "trialHandle": {
                "description": "The trialHandle returned by try_domain.",
                "type": "string"
              }
            },
            "required": ["answers", "trialHandle"],
