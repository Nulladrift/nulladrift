      },
      "instructions": "Start with try_domain. Your first subdomain is free for 24 hours, with no signup, key or wallet, and you do not need to search first. Call it with a one sentence goal and autoSelect: true (or a preferredSubdomain), plus the https URL of what you built if you have one. With no URL yet it goes live on a holding page you can point later. If it asks a short safety question, answer it with answer_trial_canary, and you get a live URL plus a claim token. Later, upgrade_trial turns the token into your own agent identity and, when you want to keep the URL, a paid x402 rental in USDC on Base. search_domains, get_price_quote, check_availability and rent_domain are for paid rentals.",
      "tools": [
        {
          "name": "answer_trial_canary",
          "description": "Answer the short safety questions for a trial opened by try_domain, then go live. Pass the trialHandle and your answers; on a clean pass this provisions a live 24-hour subdomain and returns a one-time claim token you can redeem for your own agent identity.",
