        {
          "name": "find_retirement_routes",
          "title": "Find Retirement & Passive-Income Residence",
          "description": "Find RETIREMENT and PASSIVE-INCOME residence routes (pensionado, rentista, retiree visas) that qualify on income or savings, not an investment. Filter by monthly income in USD, income type, net worth, the most days a year you want to spend there, region, dependants and untaxed foreign income. golden_only returns only routes rated Golden by the Mirabello Golden Retirement Index (score 70+/100: no investment, little or no tax on foreign income, little presence, little renewal); min_score sets a score floor. Each route gives its official requirement in its legal currency, whether you appear to qualify (indicative FX), the stay rule, the foreign-income tax label (Mexico, Portugal, Colombia and Brazil tax the foreign pension of a tax resident), the Golden Retirement score with its reasons, the path to permanent residence, and the official source. Unverified figures are withheld, never estimated. Information, not advice.",
          "inputSchema": {
            "properties": {
              "dependants": {
                "description": "Number of dependants (spouse, children) to include; routes with a per-dependant income add-on raise the requirement accordingly. Default 0.",
                "type": "integer"
              },
              "foreign_income_untaxed_only": {
                "description": "true = only routes where foreign income is untaxed for a tax resident (exempt, territorial or remittance basis). Default false.",
                "type": "boolean"
              },
              "golden_only": {
                "description": "true = only routes rated Golden by the Mirabello Golden Retirement Index; results are then ordered by score. Default false.",
                "type": "boolean"
              },
              "income_type": {
                "description": "What the income is: pension (state or private retirement pension), passive (rents, dividends, interest), or either/both. Default either.",
                "enum": ["pension", "passive", "either"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results returned (default 5, up to 62). The list is ranked; total_matched gives the full count.",
                "examples": [5],
                "maximum": 62,
                "minimum": 1,
                "type": "integer"
              },
              "max_stay_days_per_year": {
                "description": "The most days a year you are willing to spend in the country. Routes with a higher stated minimum are excluded; routes whose stay rule is not stated are kept and flagged.",
                "type": "number"
              },
              "min_score": {
                "description": "Only routes with a Golden Retirement score at or above this value (0 to 100); unscored routes are excluded. Results are then ordered by score.",
                "type": "number"
              },
              "monthly_income_usd": {
                "description": "Your regular monthly income in USD (pension and/or passive income). Optional; without it qualification by income is left open.",
