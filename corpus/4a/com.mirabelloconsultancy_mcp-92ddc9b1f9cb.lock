        {
          "name": "plan_path",
          "title": "Plan Path — Freedom Compass",
          "description": "The Mirabello Freedom Compass — ORIGIN-AWARE migration path planner. Given the client's STARTING POINT — current citizenship(s) + tax residence — plus their goal, returns ranked end-to-end options. The origin is the constraint: it sets the MOBILITY DELTA (what a passport actually ADDS over the one they hold — a Caribbean passport adds little to a US/EU citizen, lots to others), eligibility/restrictions, and tax-exit/reporting considerations (e.g. US citizenship-based tax & §877A, German AStG §6 — generic, sourced, CHECK-OFFICIAL-SOURCE). Each path carries fit_score + rationale, mobility_delta, eligibility, min_investment, processing_time. Informational only, not advice. Use for \"I am a [nationality], I want [goal] — what should I do?\". Pass from_citizenship (ISO alpha-2 array) + goal. Privacy: an anonymised record of the query (citizenships, tax residence, goal, budget band and timeline; no name, contact or exact amount) is kept for 90 days to improve coverage.",
          "inputSchema": {
            "properties": {
              "budget_usd": {
                "description": "Total budget the applicant has available for the investment itself, in USD (fees are additional).",
                "examples": [300000],
                "type": "number"
              },
              "family": {
                "description": "Family composition object, e.g. { \"adults\": 2, \"children_under16\": 1, \"children_16plus\": 0 }.",
                "type": "object"
              },
              "from_citizenship": {
                "description": "current citizenship(s), ISO alpha-2 e.g. [\"US\"]",
