        {
          "name": "query_graph",
          "title": "Query Knowledge Graph",
          "description": "RELATIONAL query over the investment-migration KNOWLEDGE GRAPH (programme entities · countries · blocs · investment thresholds · authorities · legal sources). Two modes: (1) pass id to get a single entity + its neighbours (e.g. id:\"programme:dominica-cbi\" or \"country:GR\" or \"bloc:EU\"); (2) pass filters to find PROGRAMMES matching constraints — type (CBI|RBI), cc, status (e.g. operational), leads_to (citizenship|residence), bloc (EU|GCC|CARICOM), max_investment_usd / min_investment_usd (FX-normalised, best-effort) — each returned with its country, options, authority and official legal source. Answers queries the flat tools cannot, e.g. \"open CBI programmes leading to citizenship under $200k with their governing source\". Investment figures are best-effort USD; cite the programme official_source for the authoritative amount. Information, not advice.",
          "inputSchema": {
            "properties": {
