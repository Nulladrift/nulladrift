        {
          "name": "compare_programmes",
          "title": "Compare Programmes",
          "description": "Compare programmes side by side. Pass a + b (two programme ids) for the canonical versioned comparison artefact from the Mirabello Investment Migration Index: rank, composite, the dimension scores, per-dimension deltas, per-metric leads (a|b|tie) and the human compare page URL where one exists. Or pass ids (2-4) for the classic multi-column comparison of cost, processing, mobility, family inclusion, tax, path to citizenship. Use this, not several single-programme lookups, whenever the user wants two or more programmes compared; ids or names (\"Portugal golden visa\") both work.",
          "inputSchema": {
            "properties": {
