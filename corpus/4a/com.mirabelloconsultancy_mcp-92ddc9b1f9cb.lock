        {
          "name": "check_maltese_citizenship_eligibility",
          "title": "Maltese Citizenship Screener",
          "description": "Rules-based first screen of whether a person is already Maltese or can register, for two family routes: \"birth\" (a child born in Malta or abroad to a Maltese parent, the 1 August 1989 rule, the father-only rule for 1964-1989 births abroad and the maternal-line Form I) and \"marriage\" (spouse of a Maltese citizen, 5 years married and living together, widow/widower and separation cases, the prerequisite of registering a foreign marriage in Malta). Returns an outcome (citizen_automatically | likely_eligible | not_yet_eligible | needs_legal_opinion | out_of_scope), the reasons, the form to use, next steps and official sources. A screen, not a legal determination; the decision rests with Aġenzija Komunità Malta.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "Route birth: the child's date of birth, ISO YYYY-MM-DD.",
                "examples": ["2026-03-14"],
                "type": "string"
              },
              "born_in_malta": {
                "description": "Route birth: true if the child was born in Malta, false if born abroad.",
                "type": "boolean"
              },
              "living_together": {
                "description": "Route marriage: true if the spouses still live together.",
                "type": "boolean"
              },
              "maltese_parent": {
                "description": "Route birth: which parent was a Maltese citizen when the child was born.",
                "enum": ["mother", "father", "both"],
                "type": "string"
              },
              "marriage_date": {
                "description": "Route marriage: date of the marriage, ISO YYYY-MM-DD (the 5 years run from this date).",
                "examples": ["2020-06-20"],
                "type": "string"
              },
              "marriage_registered_in_malta": {
                "description": "Route marriage: true if a marriage celebrated abroad has already been registered at the Malta Public Registry.",
                "type": "boolean"
              },
              "parent_citizenship_basis": {
                "description": "Route birth: how the Maltese parent holds citizenship. \"registration_by_descent\" means the parent registered as a descendant (Forms K/M), citizenship then does not pass automatically.",
                "enum": ["birth", "descent_automatic", "registration_by_descent", "registration_other", "naturalisation"],
                "type": "string"
              },
              "route": {
                "description": "\"birth\" to check a child's citizenship by birth/descent, \"marriage\" to check a foreign spouse's eligibility to register.",
                "enum": ["birth", "marriage"],
                "type": "string"
              },
              "separated": {
                "description": "Route marriage: true if the spouses are separated (legally or in fact).",
                "type": "boolean"
              },
              "spouse_deceased": {
                "description": "Route marriage: true if the Maltese spouse has died.",
                "type": "boolean"
              }
