          "description": "Route a qualified buyer enquiry about a specific property to Mirabello Consultancy, which acts as introducer only (it does not sell or broker property). Requires property_id (slug) + a valid email + explicit consent:true (GDPR). Side effect: delivers the enquiry to Mirabello and returns the next step. CBI/RBI property purchases must use a government-approved project and an authorised agent; Mirabello handles the purchase and the citizenship/residency application. Each call sends a separate enquiry, so do not repeat a call that succeeded.",
