{
  "lockfileVersion": 2,
  "subjects": {
    "center.ostrov/public-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ostrov.center/api/public/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ostrov-public-api",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Public center information and preliminary quotes only. Read current catalog before calculating. Ask dates, party, food and services; do not infer choices. Availability and booking require confirmation by the center. No saving, applications, payments or private documents through this endpoint.",
      "tools": [
        {
          "name": "calculate_quote",
          "description": "Calculate without saving or contacting anyone. Check complete, warnings and availabilityStatus.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "catalogVersion": {
                "maximum": 1000000000,
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "enum": ["group", "biggroup", "resident"],
                "type": "string"
              },
              "plan": {
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "activities": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "day": {
                              "maximum": 364,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "options": {
                              "items": {
                                "maxLength": 100,
                                "type": "string"
                              },
                              "maxItems": 20,
                              "type": "array"
                            },
                            "resource": {
                              "maxLength": 100,
                              "type": "string"
                            },
                            "slot": {
                              "maxLength": 100,
                              "type": "string"
                            }
                          },
                          "required": ["day", "options", "resource", "slot"],
                          "type": "object"
                        },
                        "maxItems": 2000,
                        "type": "array"
                      },
                      "adults": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "arrival": {
                        "format": "date",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "departure": {
                        "format": "date",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "food": {
                        "type": "boolean"
                      },
                      "housing": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "occupancy": {
                              "maximum": 3,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "quantity": {
                              "maximum": 100,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "resource": {
                              "maxLength": 100,
                              "type": "string"
                            }
                          },
                          "required": ["occupancy", "quantity", "resource"],
                          "type": "object"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "organizer": {
                        "description": "Display name; required and nonempty when saving.",
                        "maxLength": 100,
                        "type": "string"
                      },
                      "policyVersion": {
                        "const": 4,
                        "type": "integer"
                      },
                      "team": {
                        "description": "Adult organizers and team, separate from participants. Ordinary tariff charges the team fully; all-inclusive benefits are calculated by the server.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "teens": {
                        "description": "Children eligible for the child discount (currently 6–12). Despite the field name, full-rate children (currently 13+) belong in adults. Check the live catalogue.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "title": {
                        "description": "Retreat name; required and nonempty when saving.",
                        "maxLength": 150,
                        "type": "string"
                      },
                      "youngChildren": {
                        "const": 0,
                        "description": "Legacy counter kept at zero; use youngChildrenAges for information.",
                        "type": "integer"
                      },
                      "youngChildrenAges": {
                        "description": "Information only; does not change any guest count, accommodation, food or price.",
                        "items": {
                          "maximum": 5,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 30,
                        "type": "array"
                      }
                    },
                    "required": ["activities", "adults", "arrival", "departure", "food", "housing", "policyVersion", "team", "teens"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "adults": {
                        "maximum": 20,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "arrival": {
                        "format": "date",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "bathVisits": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "children": {
                        "description": "Children counted in accommodation; current rules permit ages 6–17. Put younger ages in youngChildrenAges.",
                        "items": {
                          "maximum": 17,
                          "minimum": 6,
                          "type": "integer"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      "departure": {
                        "format": "date",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "housing": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "occupancy": {
                              "maximum": 3,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "resource": {
                              "maxLength": 100,
                              "type": "string"
                            }
                          },
                          "required": ["occupancy", "resource"],
                          "type": "object"
                        },
                        "maxItems": 30,
                        "minItems": 1,
                        "type": "array"
                      },
                      "name": {
                        "description": "Required and nonempty when saving.",
                        "maxLength": 100,
                        "type": "string"
                      },
                      "youngChildrenAges": {
                        "description": "Information only; does not change any guest count, accommodation, food or price.",
                        "items": {
                          "maximum": 5,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 30,
                        "type": "array"
                      }
                    },
                    "required": ["adults", "arrival", "bathVisits", "children", "departure", "housing"],
                    "type": "object"
                  }
                ]
              }
            },
            "required": ["kind", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
