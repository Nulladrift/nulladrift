      "serverInfo": {
        "name": "justautomate-website",
        "title": "JustAutomate website",
        "version": "1.1.0",
        "websiteUrl": "https://justautomate.ai/"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JustAutomate (justautomate.ai) is a Polish B2B agency that designs and implements AI agents, process automation and system integrations for companies in Poland, Germany, Austria, Switzerland and English-speaking markets. This read-only server exposes the public website: use search_site and get_page for content, list_pages to browse, get_workshop_offer for the process workshop (the paid first step, with public prices per market) and get_contact_options for how to reach the team. All prices are net, excluding VAT. Implementation work is quoted after the workshop. The first 30-minute consultation is free. The server never submits forms, books meetings or sends messages: when the user wants to talk to JustAutomate, give them the contact link or e-mail address.",
      "tools": [
        {
          "name": "get_contact_options",
          "title": "How to contact JustAutomate",
          "description": "How a person can reach JustAutomate or book the free initial consultation: e-mail, phone and the contact form in Polish, English or German. This server never submits forms, books meetings or sends messages on anyone's behalf: pass the link or address to the user and let them decide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Preferred language of the contact page: pl, en or de.",
                "enum": ["pl", "en", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to contact JustAutomate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:570bf850c3fb9811df9c88048491a20b2631aec6702737363f048163a835a9dc"
        },
        {
          "name": "get_page",
          "title": "Read a page of justautomate.ai",
          "description": "Return the content of one public page of justautomate.ai as clean Markdown (no navigation, scripts or forms), with title, description and canonical URL in the front matter. Accepts a full URL or a path such as \"/uslugi/\" or \"/en/services/process-workshop/\". Old addresses are followed to their current page. Private client offers and pages excluded from search engines are not available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Page URL on justautomate.ai or a path starting with \"/\".",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page of justautomate.ai"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8db86c7901c413801375cac775860e62d19ad67c8c69d5fb49d5f3ad34676e34"
        },
        {
          "name": "get_workshop_offer",
          "title": "Process workshop: price and scope",
          "description": "The process workshop is how every JustAutomate engagement starts: the team maps how a process really runs, lists automation candidates with estimated hours saved, sets the implementation order and quotes the implementation. Returns the public price per week (net, excluding VAT), typical duration, deliverables and the offer page for each market: PL (Poland, PLN), DE (Germany), AT (Austria), CH (Switzerland, CHF), INTL (English-speaking clients, EUR). Implementation itself is quoted only after the workshop.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "Market. Omit to get all of them.",
                "enum": ["PL", "DE", "AT", "CH", "INTL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Process workshop: price and scope"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://justautomate/workshop-offer.html",
            "ui": {
              "resourceUri": "ui://justautomate/workshop-offer.html"
            },
            "ui/resourceUri": "ui://justautomate/workshop-offer.html"
          },
          "digest": "sha256:54ce21c25c43581a98492a49cb5ed86ae5cc5f4befea18379ab57488b2836530"
        },
        {
          "name": "list_pages",
          "title": "List pages of justautomate.ai",
          "description": "List public pages of justautomate.ai, optionally filtered by kind and language, with pagination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Only pages in this language: pl, en or de.",
                "enum": ["pl", "en", "de"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of pages to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of pages to skip.",
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "Only pages of this kind.",
                "enum": ["home", "section", "offer", "guide", "blog", "about", "contact", "city", "legal", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List pages of justautomate.ai"
          },
