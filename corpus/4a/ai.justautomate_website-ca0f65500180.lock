        },
        {
          "name": "search_site",
          "title": "Search justautomate.ai",
          "description": "Search the public website of JustAutomate (justautomate.ai), a B2B agency that builds AI agents, process automation and system integrations for companies in Poland, the DACH region and internationally. Covers services, products, industry offers, guides and blog posts in Polish, English and German, plus local pages for selected German-speaking cities. Returns titles, descriptions and URLs; read a result with get_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Only pages in this language: pl, en or de.",
                "enum": ["pl", "en", "de"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of results.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in any of the site languages, e.g. \"process workshop price\", \"KI-Agentur Wien\", \"automatyzacja faktur\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Only pages of this kind.",
                "enum": ["home", "section", "offer", "guide", "blog", "about", "contact", "city", "legal", "other"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
