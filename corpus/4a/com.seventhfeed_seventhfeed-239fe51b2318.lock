{
  "lockfileVersion": 2,
  "subjects": {
    "com.seventhfeed/seventhfeed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://seventhfeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "seventhfeed",
        "title": "Seventh Feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Seventh Feed is a directory of AI marketing, SEO, GEO/AEO, writing, outreach and growth tools with pricing, free tiers, traffic, verified revenue and agent-readiness. Start with search_tools (or list_categories), then get_tool for one tool. Results include page links; cite them. Data is a dated snapshot (as_of).",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare tools",
          "description": "The same facts as get_tool for 2 to 5 tools side by side.",
          "inputSchema": {
            "properties": {
              "domains": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63931ffa7efe04cf6be325361a5836c972e55c58f8409ebb42cd5cbe19b8f818"
        },
        {
          "name": "get_tool",
          "title": "Get a tool",
          "description": "One marketing or SEO tool by domain: our summary, the site’s own title and description (with date checked), pricing and free tier where stated, agent-readiness (llms.txt, MCP registry id, public API), traffic and revenue with source and date, operational risk notes if any, our referral code if we have one, and a link to its page.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain from search_tools, e.g. \"semrush.com\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81cd1652e7bedfe307056e578fd3f1401af2eaba2161f7c7eadc982f5eaecc31"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The categories used to sort AI marketing and SEO tools, with how many tools each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51f83d0be4da73f0793586fd4251b4d82bb0e7c9b3a8fef1bd5f398883702eef"
        },
        {
          "name": "list_new_tools",
          "title": "List newly added tools",
          "description": "Tools by the date Seventh Feed first saw them, newest first. Pass since (YYYY-MM-DD) to get only those first seen on or after that day.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d764a2377bd498418696012ec2173a95bfb0dc28f535c6ee08c500077b8d3024"
        },
        {
          "name": "list_referrals",
          "title": "List referral codes",
          "description": "Seventh Feed’s own referral codes and partner offers for AI marketing and SEO tools: what a new user gets, the link or code, the terms and the date checked.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aeaa5ed7d58382e69ff503ff151a4b505d116bdd0a4c583b64c5acd673ebb9f0"
        },
        {
          "name": "search_tools",
          "title": "Search AI marketing & SEO tools",
          "description": "Search the Seventh Feed directory of AI marketing, SEO, GEO/AEO, writing, cold email outreach, social scheduling and growth tools. Every word in q must appear in the name, domain, summary, category or tags. Filter by category id (see list_categories) or agent_ready.",
          "inputSchema": {
            "properties": {
              "agent_ready": {
                "type": "boolean"
              },
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to look for, e.g. \"ai visibility\" or \"cold email\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:528dba57a51115c59e6ed3c3fe1f788055e8f7460f4d95cfd6f3b03f6bf77ae2"
        },
        {
          "name": "submit_tool",
          "title": "Submit a tool",
          "description": "Suggest an AI marketing, SEO, GEO, writing, outreach or growth tool for the directory by its URL or domain. Queued and listed if the site has a title, description or llms.txt.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories, if you know it.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "type": "string"
              },
              "note": {
                "description": "What the tool does, in your own words. Stored for the maintainer; not published as is.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "The tool’s URL or domain, e.g. \"https://example.ai\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b5b85c90994be3b824119b07ec833d0c5d4d8fac0e9366d154f6a523adce54c5"
        }
      ],
      "digest": "sha256:9bd0e61f9d86f2cc7af798c8d910fd577d46600036aa32f019882c135dfd1a7b"
    }
  }
}
