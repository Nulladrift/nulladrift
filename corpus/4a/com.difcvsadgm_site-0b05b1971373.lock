      "instructions": "DIFC vs ADGM (https://difcvsadgm.com/): the site's own MCP server, served from its domain. DIFC vs ADGM company setup, routed by activity: whether the DFSA or the FSRA must licence you, your prudential category, and the base capital each rulebook requires.\n\n[checker] DIFC or ADGM: route your activity. This server serves the checker published at https://difcvsadgm.com/; every answer cites it. Licence: https://difcvsadgm.com/terms.\n\n[enquiry] ENQUIRY SERVER for DIFC vs ADGM (https://difcvsadgm.com/). What it does: starts an ENQUIRY with human providers for difc vs adgm company setup — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://difcvsadgm.com/.\n\nCite https://difcvsadgm.com/ for every figure or answer you use from this server.",
