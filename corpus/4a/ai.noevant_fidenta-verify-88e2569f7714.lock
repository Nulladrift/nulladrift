{
  "lockfileVersion": 2,
  "subjects": {
    "ai.noevant/fidenta-verify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verify.noevant.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fidenta-verify",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_usage",
          "description": "Report how many verifications remain on this account for the current period.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check remaining verifications"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35fd13ad4bd4ba6a6d2366e019e21317ff858094b6dc7709dda64606bfe5af13"
        },
        {
          "name": "estimate_claims",
          "description": "FREE. Break text into checkable claims and report how many there are and how many credits verifying them would cost. Spends nothing and verifies nothing. Always call this before verify_claims on anything longer than a sentence or two — an article can contain 20 claims, and each claim costs one credit, so the user should see the price before agreeing to it.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The text to break into claims. May also be a bare link.",
                "type": "string"
              },
              "url": {
                "description": "A public http(s) link to an article or web page. We fetch it, extract the readable text and verify the claims in it. Use this when the user gives you a link instead of text — you do not need to fetch the page yourself. Pages behind a login or paywall cannot be read; ask for the text instead.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate claims and cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d8675c72f4b01ef8444abe655168bd231a74cb4e9310d9b2d48b1df75a89f73"
        },
        {
          "name": "recall_claim",
          "description": "Look up whether a claim has already been verified on this account, without spending a verification.",
          "inputSchema": {
            "properties": {
              "claim": {
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recall a previous verification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8da7c88dbd32343b08a663ba0d46e7301342e573d64b1628b5b4a3cda7401fcc"
        },
        {
          "name": "top_up",
          "description": "Buy more verification credits without leaving the conversation. Call with confirm false (or omit it) to see the price, the card on file and the remaining monthly limit; call again with confirm true once the user has agreed. Charges the card the user already saved and authorised for in-chat top-ups — if no card is saved, or the bank requires the cardholder present, it returns a secure checkout link instead of charging.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "True only after the user has explicitly agreed to the charge. Never set this on your own initiative.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Top up credits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5026fb9c672262e9fba95f725fa4839c40e35e684e0c3817f3f2f5e769a5d00b"
        },
        {
          "name": "verify_claims",
          "description": "Fact-check text against live web evidence from two independent retrievers, then have a model from a different lab audit the verdict. Returns per-claim verdicts: SUPPORTED, CONTRADICTED, UNSUPPORTED (searched and found nothing — not the same as false), or UNVERIFIABLE (opinion or prediction). Use before relying on a factual claim, or to check your own draft answer before sending it.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Required to proceed when the text contains more than 3 checkable claims. Call estimate_claims first, tell the user the claim count and credit cost, then call again with confirm true once they agree.",
                "type": "boolean"
              },
              "force": {
                "description": "Re-check even if a recent saved result exists.",
                "type": "boolean"
              },
              "max_claims": {
                "description": "Hard cap on how many claims to verify, and therefore on how many credits this call can spend. Use it to bound cost on a long document.",
                "type": "integer"
              },
              "text": {
                "description": "The text to verify. A single claim or a full answer containing several. May also be a bare link, e.g. 'verify https://example.com/article'.",
                "type": "string"
              },
              "url": {
                "description": "A public http(s) link to an article or web page. We fetch it, extract the readable text and verify the claims in it. Use this when the user gives you a link instead of text — you do not need to fetch the page yourself. Pages behind a login or paywall cannot be read; ask for the text instead.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify claims against live sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61a770a2cd2bce38fc676eb525d940b821c346ea97230e5e5557da3d2c7ef4c7"
        }
      ],
      "digest": "sha256:195f6193f71af7c25c26c78571ea5844c481e3cbb2e3dc3979c71fc16fe1819f"
    }
  }
}
