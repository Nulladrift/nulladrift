{
  "lockfileVersion": 2,
  "subjects": {
    "com.moon-oh/moonoh-marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://moon-oh.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moonoh-marketplace",
        "title": "Moonoh NYC & NJ Marketplace MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Moonoh MCP Server provides search_marketplace, get_item_details, and get_price_report tools to query 34,601 items (20,455 marketplace listings + 14,116 local shop items) across NYC and Northern NJ.",
      "tools": [
        {
          "name": "get_item_details",
          "description": "Get complete structured item details (photos, verified price, condition, seller, neighborhood, and similar available items) by Moonoh item ID or URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Moonoh item ID (e.g. 'karrot-uh7b3dkne8ex', 'heykorean-674246') or Moonoh item URL",
                "type": "string"
              },
              "url": {
                "description": "Optional Moonoh item URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:298953c4c7ef61a9c2db387205eaaab293b22720ed3eb89beba2ad92a1acb7a5"
        },
        {
          "name": "get_price_report",
          "description": "Get real-time pricing statistics, median prices, and category breakdowns across 34,601 items (20,455 marketplace listings + 14,116 local shop items) in NYC boroughs and Northern NJ.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Region name ('manhattan', 'brooklyn', 'queens', 'flushing', 'bayside', 'astoria', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5aa2fb23c373a0aa2bfa50dca965ff474abe430a1e2b4d63323fe42a79eb6b36"
        },
        {
          "name": "search_marketplace",
          "description": "Search 34,601 items (20,455 marketplace listings + 14,116 local shop items) in NYC & Northern NJ by keyword, category, or borough.",
          "inputSchema": {
            "properties": {
              "borough": {
                "description": "Geographic filter ('manhattan', 'brooklyn', 'queens', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              },
              "category": {
                "description": "Category filter ('furniture', 'fashion', 'electronics', 'baby & kids', 'sports', 'food & groceries', 'all')",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results to return (default 15, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Search term or item name (e.g. 'dining table', 'tiffany bracelet', 'sofa', 'airpods', 'puffer jacket')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13f3d8c795cc1a47d0c575d1b195da257b3f48008921b6b23499f1613dfee4ef"
        }
      ],
      "digest": "sha256:bcf1b9eaa3a5c6d5ac63ef39ef099d04c424a594f593caec654c4ba12fac0a48"
    }
  }
}
