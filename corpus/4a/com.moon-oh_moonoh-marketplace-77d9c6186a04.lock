{
  "lockfileVersion": 2,
  "subjects": {
    "com.moon-oh/moonoh-marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://moon-oh.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moonoh-marketplace",
        "title": "Moonoh NYC & NJ Marketplace MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Moonoh MCP Server provides search_marketplace, get_item_details, and get_price_report tools to query 39,762 items (24,385 marketplace listings + 14,718 local shop items) across NYC and Northern NJ.",
      "tools": [
        {
          "name": "get_church_details",
          "title": "Get Manhattan Church Details",
          "description": "Get full church identity, separate service-level times/venues/languages, verification status, source URLs, and canonical Moonoh detail URL by church slug.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Church slug (e.g. 'daring-church', 'new-frontier-church-nyc', 'times-square-church')",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Manhattan Church Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cccda74f13fee3dc39f3136c38983d7020642013461f803735a1a54559b1e96"
        },
        {
          "name": "get_item_details",
          "title": "Get Marketplace Item Details",
          "description": "Get complete structured item details (photos, verified price, condition, seller, neighborhood, and similar available items) by Moonoh item ID or URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Moonoh item ID (e.g. 'karrot-uh7b3dkne8ex', 'heykorean-674246') or Moonoh item URL",
                "type": "string"
              },
              "url": {
                "description": "Optional Moonoh item URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Marketplace Item Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fc857cf29c08634524f941b1562634f2ee90a2babb4ba071259088335652471"
        },
        {
          "name": "get_price_report",
          "title": "Get NYC & NJ Local Market Price Report",
          "description": "Get real-time pricing statistics, median prices, and category breakdowns across 39,762 items (24,385 marketplace listings + 14,718 local shop items) in NYC boroughs and Northern NJ.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Region name ('manhattan', 'brooklyn', 'queens', 'flushing', 'bayside', 'astoria', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get NYC & NJ Local Market Price Report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:669fe588d4656d1ee4828ed0298dc6ffcf52783ecf330302f7c97ac4f1f61621"
        },
        {
          "name": "search_churches",
          "title": "Search Manhattan Protestant Churches Guide",
          "description": "Search verified Manhattan Protestant churches and worship services by keyword, neighborhood, or worship language (America/New_York).",
          "inputSchema": {
            "properties": {
              "includePending": {
                "description": "Include 'Details being verified' candidates without pins (default false)",
                "type": "boolean"
              },
              "language": {
                "description": "Worship language (e.g. 'English', 'Korean', 'Cantonese', 'Mandarin')",
                "type": "string"
              },
              "neighborhood": {
                "description": "Manhattan neighborhood (e.g. 'Chelsea', 'Upper West Side', 'Chinatown / Lower East Side')",
                "type": "string"
              },
              "query": {
                "description": "Church name, neighborhood, or community keyword",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Manhattan Protestant Churches Guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2cc52dd77598f557dde31a76d4b913aa89d7720236f83262f4b0fa149796b36a"
        },
        {
          "name": "search_marketplace",
          "title": "Search NYC & NJ Marketplace and Local Shops",
          "description": "Search 39,762 items (24,385 marketplace listings + 14,718 local shop items) in NYC & Northern NJ by keyword, category, or borough.",
          "inputSchema": {
            "properties": {
              "borough": {
                "description": "Geographic filter ('manhattan', 'brooklyn', 'queens', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              },
              "category": {
                "description": "Category filter ('furniture', 'fashion', 'electronics', 'baby & kids', 'sports', 'food & groceries', 'all')",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results to return (default 15, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Search term or item name (e.g. 'dining table', 'tiffany bracelet', 'sofa', 'airpods', 'puffer jacket')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search NYC & NJ Marketplace and Local Shops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f164f342c3219ebf73f2bb40e922a94251eeb984a8c21ed0d5088f3456f690e"
        }
      ],
      "digest": "sha256:176b5993c5b2e6e34d35d2a6a31430e7ce1a5e3b5f81e730ae41bc93d744ae03"
    }
  }
}
