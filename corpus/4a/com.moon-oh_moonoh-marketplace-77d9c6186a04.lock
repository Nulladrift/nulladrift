      "serverInfo": {
        "name": "moonoh-marketplace",
        "title": "Moonoh NYC & NJ Marketplace MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Moonoh MCP Server provides search_marketplace, get_item_details, and get_price_report tools to query 39,762 items (24,385 marketplace listings + 14,718 local shop items) across NYC and Northern NJ.",
      "tools": [
        {
          "name": "get_item_details",
          "title": "Get Marketplace Item Details",
          "description": "Get complete structured item details (photos, verified price, condition, seller, neighborhood, and similar available items) by Moonoh item ID or URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Moonoh item ID (e.g. 'karrot-uh7b3dkne8ex', 'heykorean-674246') or Moonoh item URL",
                "type": "string"
              },
              "url": {
                "description": "Optional Moonoh item URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Marketplace Item Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fc857cf29c08634524f941b1562634f2ee90a2babb4ba071259088335652471"
        },
        {
          "name": "get_price_report",
          "title": "Get NYC & NJ Local Market Price Report",
          "description": "Get real-time pricing statistics, median prices, and category breakdowns across 39,762 items (24,385 marketplace listings + 14,718 local shop items) in NYC boroughs and Northern NJ.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Region name ('manhattan', 'brooklyn', 'queens', 'flushing', 'bayside', 'astoria', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get NYC & NJ Local Market Price Report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:669fe588d4656d1ee4828ed0298dc6ffcf52783ecf330302f7c97ac4f1f61621"
        },
        {
          "name": "search_marketplace",
          "title": "Search NYC & NJ Marketplace and Local Shops",
          "description": "Search 39,762 items (24,385 marketplace listings + 14,718 local shop items) in NYC & Northern NJ by keyword, category, or borough.",
          "inputSchema": {
            "properties": {
              "borough": {
                "description": "Geographic filter ('manhattan', 'brooklyn', 'queens', 'bronx', 'staten-island', 'bergen-county-nj', 'hudson-county-nj', 'all')",
                "type": "string"
              },
              "category": {
                "description": "Category filter ('furniture', 'fashion', 'electronics', 'baby & kids', 'sports', 'food & groceries', 'all')",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results to return (default 15, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Search term or item name (e.g. 'dining table', 'tiffany bracelet', 'sofa', 'airpods', 'puffer jacket')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search NYC & NJ Marketplace and Local Shops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
