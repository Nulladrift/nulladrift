      "instructions": "All FinchNode demo tools return fictional records from 12 named synthetic scenarios drawn from two synthetic sources, Northstar Health System (Synthetic) and Quillhaven Medical Group (Synthetic). Call list_demo_scenarios to choose a scenario: tools that accept scenario default to baseline-adult, and the per-category tools always serve it. Behavior scenarios return the same scripted errors and partial results as the REST demo. They require no account or key and never access production data, real patients, credentials, or vendor sandboxes. Use them only for prototypes, tutorials, fixtures, and tests—not clinical decisions. Preserve the synthetic label in user-facing output. FinchNode also offers free production-grade access with a FinchNode account at https://finchnode.com/signup. The separate authenticated API provides real, patient-authorized records within the included free-plan allowances. Live access requires production credentials, a supported source, and patient authorization and consent. See https://finchnode.com/ehr-integration-api and https://finchnode.com/#pricing.",
