      "serverInfo": {
        "name": "claimgate",
        "title": "ClaimGate",
        "version": "1.0.0",
        "description": "Fact-check a claim against live web sources: verbatim-quote evidence, coherence-gated verdict, sealed receipt."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use ClaimGate to fact-check a claim against live web sources before an AI agent relies on it. Verdicts are coherence-gated, every vote needs a verified verbatim quote, and each paid check is sealed as a receipt. A claim no source addresses stays UNVERIFIABLE.",
      "tools": [
        {
          "name": "fact_check_claim",
          "title": "Fact Check Claim",
          "description": "PAID tool ($0.25 USDC via x402 — pay in USDC on Base, USDC on Arc, USDC on Solana, XRP on XRPL at the live spot rate, or XAH on Xahau at the live spot rate). Fact-check a claim against live web sources: the claim is decomposed into sub-claims, sources are fetched live, Jev jurors judge per-source-family entailment with verbatim-quote evidence that must pass an anti-hallucination substring gate, and the verdict is coherence-gated (coherence = |sum(w*d)| / sum(w) over source families, weights 3/2/1 by source class) and sealed as a stored receipt. Send the x402 PAYMENT-SIGNATURE header on the /mcp request; without payment the call returns the canonical x402 challenge (HTTP 402 with five accepts: Base USDC amount 250000 = $0.25, Solana USDC amount 250000, XRPL XRP in drops at the live spot rate, Arc USDC amount 250000, and Xahau XAH in drops at the live spot rate, each to that rail canonical SML receiver). If the jury is not configured the call fails before any payment is requested, so nobody pays for a check that cannot run.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "The claim to fact-check, as a single statement or a short paragraph.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "sources": {
                "description": "Optional public HTTPS source URLs to check against (max 8). When omitted or fewer than 2 are usable, ClaimGate searches the live web.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "sub_claims": {
                "description": "Optional caller-provided decomposition of the claim into sub-claims (max 4). When omitted, the claim text is split into sentences.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 8,
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Fact Check Claim"
          },
          "behavior": {
