      },
      "transport": {
        "type": "http",
        "url": "https://mamatool.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mamatool",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "calculate_emi",
          "title": "Calculate loan EMI",
          "description": "Calculates the monthly EMI (equated monthly instalment) for a loan from the principal, annual interest rate and tenure in months, plus total interest and total payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualRate": {
                "description": "Annual interest rate in percent (0 or more).",
                "minimum": 0,
                "type": "number"
              },
              "months": {
                "description": "Loan tenure in months (1-600).",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "principal": {
                "description": "Loan amount (principal), greater than 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["annualRate", "months", "principal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate loan EMI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfc5700c4c0e7502500fe783b53c1610c5bf69ca5c38ac18fd93e5d86a179b3e"
        },
        {
          "name": "count_words",
          "title": "Count words",
          "description": "Counts words, characters, sentences and paragraphs in a piece of text, and estimates reading and speaking time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The text to count.",
                "maxLength": 100000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count words"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4485c4a4189e3569ba706b76a78e4267253bd8e8709c31014ffb4fe9b8b310a7"
        },
        {
          "name": "format_json",
          "title": "Format JSON",
          "description": "Validates and pretty-prints JSON text with the requested indentation. Returns a clear error message when the input is not valid JSON.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "indent": {
                "default": 2,
                "description": "Spaces per indent level (0-8). 0 gives compact JSON.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "jsonText": {
                "description": "The JSON text to format.",
                "maxLength": 100000,
                "type": "string"
              }
            },
            "required": ["jsonText"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Format JSON"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6cde156ae462e87aa70caa2a4fa112fc0af7a128dd5ea7b0411008b47463d3a"
        },
        {
          "name": "generate_password",
          "title": "Generate password",
          "description": "Generates a random secure password of the requested length and character sets. Passwords are generated with cryptographic randomness and are never stored or sent anywhere.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "digits": {
                "default": true,
                "description": "Include digits (0-9).",
                "type": "boolean"
              },
              "length": {
                "default": 16,
                "description": "Password length (4-128).",
                "maximum": 128,
                "minimum": 4,
                "type": "integer"
              },
              "lowercase": {
                "default": true,
                "description": "Include lowercase letters (a-z).",
                "type": "boolean"
              },
              "symbols": {
                "default": true,
                "description": "Include symbols (!@#$%^&* etc.).",
                "type": "boolean"
              },
              "uppercase": {
                "default": true,
                "description": "Include uppercase letters (A-Z).",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate password"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b82925e060fb59d5cbdfdae351ac9ccc252d658f340c6534081db35b779df9eb"
        },
        {
          "name": "generate_qr_code",
          "title": "Generate QR code",
          "description": "Generates a QR code image (PNG) for a URL or any short text, for example a website address or Wi-Fi details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "size": {
                "default": 256,
                "description": "Image width and height in pixels (128-1024).",
                "maximum": 1024,
                "minimum": 128,
                "type": "integer"
              },
              "text": {
                "description": "The URL or text to encode in the QR code.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86ba5e5629086ac67144156cd3cc25663bfa142bbf93fba95b2fd5dbb5020a10"
        }
      ],
      "digest": "sha256:4aa7cc8e2387994946857d4d90cd660a4016e15d9117d5aa4cb503ae73ba0aea"
    }
  }
