        {
          "name": "roast_landing_page",
          "description": "Free AI conversion review of a public landing page URL: score /100, 5-second-test first impression, top 3 problems quoted from the page, and a headline rewrite. Returns a link to the full report page and a roast_id you can pass to buy_full_teardown. Takes ~20s. Limit 5 free roasts per day per IP.",
          "inputSchema": {
            "properties": {
              "url": {
