        "name": "pageroast",
        "title": "PageRoast",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use roast_landing_page to get a blunt conversion review of any public landing page. It returns a roast_id: pass it to buy_full_teardown to get the $9 quote (this charges nothing), and only call buy_full_teardown again with confirmPaymentSpend: true once the user has said yes. Then get_full_teardown returns the paid teardown as Markdown.",
      "tools": [
        {
          "name": "buy_full_teardown",
          "description": "Quote and buy the $9 full teardown for a roast. Step 1: call with just the roast_id — you get the quote and nothing is charged, no checkout session is created. Step 2: only after the user has said yes, call again with confirmPaymentSpend: true to create the Stripe checkout session and get the URL for them to pay at. PageRoast has no accounts and stores no card, so the payment happens on Stripe's own page.",
          "inputSchema": {
            "properties": {
              "confirmPaymentSpend": {
                "description": "Set to true only after the user has approved the $9 purchase. Without it this tool only quotes.",
                "type": "boolean"
              },
              "roast_id": {
                "description": "The roast_id returned by roast_landing_page",
                "type": "string"
              }
            },
            "required": ["roast_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy the full teardown ($9)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa064f34c3b4bc8e3a6ee2cbaa7b90dce14e601608f47fd2c1516ca1c02b3d4f"
        },
        {
          "name": "get_full_teardown",
          "description": "Read the paid $9 full teardown for a roast, as Markdown. While it is unpaid it returns the free roast and says how to buy it; for the minute after payment it says it is still being written; then it returns the full teardown.",
          "inputSchema": {
            "properties": {
              "roast_id": {
                "description": "The roast_id returned by roast_landing_page",
                "type": "string"
              }
            },
            "required": ["roast_id"],
            "type": "object"
