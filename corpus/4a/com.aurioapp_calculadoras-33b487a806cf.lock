                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "kind": {
                "const": "renta",
                "type": "string"
              },
              "resultado": {
                "enum": ["pagar", "devolver", "cero"],
                "type": "string"
              }
            },
            "required": ["cta", "disclaimer", "ejercicio", "foral", "kind"],
            "type": "object"
