        {
          "name": "cuota_autonomos",
          "title": "Calcular la cuota de autónomos",
          "description": "Calcula la cuota mensual de autónomos (RETA) según el tramo de rendimientos: tramo, base mínima y cuota mínima/máxima. Úsala para “cuánto pago de autónomos”, “cuota de autónomos con 2.000 € al mes”, “qué tramo de autónomos me toca”. English: Spanish self-employed social security fee by income bracket.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "rendimientoNetoAnual": {
                "description": "Rendimiento neto anual previsto (ingresos − gastos deducibles, SIN restar la cuota de autónomos), en euros. Expected annual net income in EUR.",
                "maximum": 100000000,
                "minimum": -100000000,
                "type": "number"
              },
              "societario": {
                "description": "Autónomo societario (administrador de una sociedad). Por defecto false.",
