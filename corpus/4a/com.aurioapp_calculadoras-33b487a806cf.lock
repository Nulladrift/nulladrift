        {
          "name": "me_lo_puedo_permitir",
          "title": "¿Me lo puedo permitir?",
          "description": "Dice si te puedes permitir una compra sin romper tu colchón de emergencia, o cuántos meses tendrías que ahorrar. Úsala para “me puedo permitir un coche”, “me lo puedo permitir”, “puedo comprarme un iPhone”, “me da para irme de viaje”. English: “can I afford it?” check against savings and an emergency fund.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ahorroActual": {
                "description": "Ahorro o liquidez disponible hoy en euros. Current savings in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "gastosMensuales": {
                "description": "Gastos al mes en euros, incluidos los fijos. Monthly expenses in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "ingresosMensuales": {
                "description": "Ingresos netos al mes en euros. Monthly net income in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "mesesColchon": {
                "description": "Meses de gastos a conservar como colchón de emergencia (por defecto 3). Emergency fund months.",
                "maximum": 24,
                "minimum": 0,
                "type": "integer"
              },
              "precio": {
                "description": "Precio de la compra en euros (coche, viaje, móvil…). Purchase price in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["ahorroActual", "gastosMensuales", "ingresosMensuales", "precio"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ahorroTrasCompra": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
