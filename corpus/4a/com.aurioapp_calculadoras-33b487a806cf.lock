        {
          "name": "estimar_renta",
          "title": "Estimar la Renta",
          "description": "Estima la declaración de la Renta (IRPF) de un asalariado en España: si sale a pagar o a devolver y cuánto. Admite comunidad autónoma, hijos, plan de pensiones y, además, rendimientos de autónomo. Úsala para “cuánto me devuelve Hacienda”, “me sale a pagar la Renta”, “cuánto pago de IRPF con 30.000 € brutos”. Si el usuario no sabe sus cotizaciones o retenciones, omítelas (el resultado lo indica). English: Spanish annual income tax return estimate (refund or amount due) for employees.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "anioNacimiento": {
                "description": "Año de nacimiento. Birth year.",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "brutoAnual": {
                "description": "Salario bruto anual en euros (certificado de retenciones o nóminas). Gross annual salary in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "ccaa": {
                "description": "Comunidad autónoma de residencia (foral = País Vasco/Navarra, fuera del cálculo). Region.",
                "enum": ["andalucia", "aragon", "asturias", "baleares", "canarias", "cantabria", "castilla_la_mancha", "castilla_y_leon", "cataluna", "comunidad_valenciana", "extremadura", "galicia", "la_rioja", "madrid", "murcia", "ceuta", "melilla", "foral"],
                "type": "string"
              },
              "hijos": {
                "description": "Años de nacimiento de los hijos que conviven contigo. Children birth years.",
                "items": {
                  "maximum": 2100,
                  "minimum": 1900,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "pagosFraccionados130": {
                "description": "Solo autónomos: pagos fraccionados del modelo 130 ya hechos en el año, en euros.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "planPensiones": {
                "description": "Aportación anual a un plan de pensiones individual, en euros. Pension plan contribution in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "rendimientoNetoActividad": {
                "description": "Solo autónomos: rendimiento neto anual de la actividad (descontados los gastos deducibles y, si procede, los de difícil justificación del ejercicio), en euros. Self-employed net income in EUR.",
                "maximum": 100000000,
                "minimum": -100000000,
                "type": "number"
              },
              "retenciones": {
                "description": "Retenciones de IRPF ya practicadas en el año, en euros. Tax withheld in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "seguridadSocial": {
                "description": "Cotizaciones a la Seguridad Social del trabajador en el año, en euros (vienen en la nómina). Si no se sabe, omitir. Employee social security in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["brutoAnual"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "avisos": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
