        {
          "name": "calcular_modelo_130",
          "title": "Calcular el modelo 130",
          "description": "Calcula el pago fraccionado de IRPF de un autónomo (tipo modelo 130): usa el periodo y la actividad indicados, y descuenta retenciones y pagos previos. Úsala para “cuánto pago en el 130”, “pago fraccionado de IRPF este trimestre”. English: Spanish self-employed quarterly income tax prepayment (form 130).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "actividadCeutaConDerecho": {
                "description": "Solo true si el usuario confirma que toda la actividad introducida tiene derecho a la deducción de Ceuta del art. 68.4 LIRPF. No inferir por residencia. En otro caso se simula el régimen general.",
                "type": "boolean"
              },
              "ejercicio": {
                "description": "Ejercicio fiscal (2024–2026). Por defecto, 2026. Tax year.",
                "maximum": 2026,
                "minimum": 2024,
                "type": "integer"
              },
              "gastosAcumulados": {
                "description": "Gastos deducibles acumulados del año (sin IVA), en euros, incluida la cuota de autónomos. YTD expenses in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "ingresosAcumulados": {
                "description": "Ingresos del año acumulados hasta el trimestre (sin IVA), en euros. YTD income in EUR.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "opcionArticulo26": {
                "description": "Ha optado por la reducción del art. 26.1 RIRPF, incompatible con los gastos de difícil justificación. Actívala solo si se indica expresamente.",
                "type": "boolean"
              },
              "pagosPrevios": {
                "description": "Pagos fraccionados (130) de trimestres anteriores del mismo año, en euros.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "retenciones": {
                "description": "Retenciones de IRPF que te han practicado en facturas, acumuladas, en euros.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "simplificada": {
                "description": "Aplicar los gastos de difícil justificación del periodo en estimación directa simplificada. Por defecto true.",
                "type": "boolean"
              },
              "trimestre": {
                "description": "Trimestre (1–4). Por defecto, el cuarto trimestre del ejercicio. Tax quarter.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["gastosAcumulados", "ingresosAcumulados"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actividadCeutaConDerecho": {
                "type": "boolean"
              },
              "base": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "cta": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "cuota": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "disclaimer": {
                "type": "string"
              },
              "ejercicio": {
                "type": "number"
              },
              "gastosDificilJustificacion": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "kind": {
                "const": "modelo130",
                "type": "string"
              },
              "opcionArticulo26": {
                "type": "boolean"
              },
              "pagoFraccionado": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "rendimientoNeto": {
