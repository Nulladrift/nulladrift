      "instructions": "Aurio — calculadoras de dinero para España (hipoteca, ahorro, “¿me lo puedo permitir?”, Renta y, para autónomos, IVA, modelo 130 y cuota). Importes en euros. Todo es orientativo: no es asesoramiento ni presenta nada ante la AEAT. Aurio calculators for personal finance and Spanish taxes; informational only.",
      "tools": [
        {
          "name": "calcular_iva_trimestre",
          "title": "Calcular el IVA del trimestre",
          "description": "Calcula el IVA trimestral de un autónomo (tipo modelo 303): IVA repercutido menos IVA soportado deducible. Úsala para “cuánto tengo que pagar de IVA este trimestre”, “calcular el 303”, “IVA a ingresar”. Solo calcula: no presenta nada ante la AEAT. English: quarterly VAT (Spain, form 303) estimate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gastos": {
                "default": [],
                "description": "Gastos/facturas recibidas del trimestre con IVA soportado. Expenses by VAT rate.",
                "items": {
                  "properties": {
                    "base": {
                      "description": "Base imponible de los gastos (sin IVA) en euros. Expense base in EUR.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "deduciblePct": {
                      "description": "% de IVA deducible (100 por defecto; 50 típico en vehículo mixto).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "tipo": {
                      "default": "general",
                      "description": "Tipo de IVA soportado.",
                      "enum": ["general", "reducido", "superreducido", "exento"],
                      "type": "string"
                    }
                  },
                  "required": ["base"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "ingresos": {
                "description": "Ventas/facturas emitidas del trimestre agrupadas por tipo de IVA. Sales by VAT rate.",
                "items": {
                  "properties": {
                    "base": {
                      "description": "Base imponible facturada (sin IVA) en euros. Taxable base in EUR.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "tipo": {
                      "default": "general",
                      "description": "Tipo de IVA: general 21 %, reducido 10 %, superreducido 4 %, exento 0 %.",
                      "enum": ["general", "reducido", "superreducido", "exento"],
                      "type": "string"
                    }
                  },
                  "required": ["base"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["ingresos"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cta": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "disclaimer": {
                "type": "string"
              },
              "ivaRepercutido": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "ivaSoportadoDeducible": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              },
              "kind": {
                "const": "iva",
                "type": "string"
              },
              "resultado": {
                "enum": ["ingresar", "compensar"],
                "type": "string"
              },
              "resultadoImporte": {
                "additionalProperties": false,
                "properties": {
                  "formatted": {
                    "type": "string"
                  },
                  "minor": {
                    "type": "string"
                  }
                },
                "required": ["formatted", "minor"],
                "type": "object"
              }
            },
            "required": ["cta", "disclaimer", "ivaRepercutido", "ivaSoportadoDeducible", "kind", "resultado", "resultadoImporte"],
