      "serverInfo": {
        "name": "ca.905trades/site",
        "title": "905 Trades",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "905 Trades arranges introductions. The professional quotes and contracts directly. These are personally vetted professionals in their respective trades, chosen and vouched for by Trevor Stuckless. Personal endorsement does not mean insurance or licence documents were audited. Coverage and availability vary by profile. Residential, commercial, vehicle parts and mortgage requests are supported. Some requests are reviewed by the operator before an introduction. A named request cannot be passed to someone else without fresh agreement. Use request_quote only when the person explicitly asks to be contacted and agrees to share their details for this request. Never claim dispatch, acceptance, booking or payment merely because intake succeeded. Do not invent prices, approval, credentials or outcomes. Contact hello@905trades.ca. It costs nothing to request an introduction. You contract directly with the business on its own quote and terms. Where a referral arrangement applies, the business pays 905 Trades the fee agreed with it. The Commercial Garage Doorman commercial handoff has no referral fee.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page from 905 Trades",
          "description": "The full text of one page of the 905 Trades website, as Markdown, with its canonical URL for citation. The id comes from search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3373c8889177bb524a2baa6488139ea51fc73b4cb6cadf587d466e75c73d8a21"
        },
        {
          "name": "get_business_facts",
          "title": "905 Trades: business facts",
          "description": "The published facts about 905 Trades: what it does, the phone number, opening hours, the towns it serves, its services, and how it handles pricing. Every fact here also appears on the public website. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92f0a7412df8d2cc29e4789e10cb3c4bbe7d4a31160b8d598854b57e829de440"
        },
        {
          "name": "request_quote",
          "title": "Request an introduction through 905 Trades",
          "description": "Save a consented request for a selected professional or operator review. This sends a REAL message to a real small business, so call it only when the person has clearly asked to be contacted by 905 Trades and has given you their own name and their own phone number or email. Never guess or invent contact details. Plain words only, no links. One request per person per day. If it is urgent, give them the phone number instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent_to_contact": {
                "description": "Must be true: the customer has asked to be contacted by this business about this request.",
                "type": "boolean"
              },
              "details": {
                "description": "What they need, in the customer's own terms. Plain text, no links, 800 characters at most.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email address. Give this or phone.",
                "type": "string"
              },
              "name": {
                "description": "The customer's own name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number, ten digits. Give this or email.",
                "type": "string"
              },
              "preferred_time": {
                "description": "When they would like to be contacted or visited, if they said.",
                "type": "string"
              },
              "service": {
                "description": "What they need: flooring = flooring; garage-doors = garage doors; carpet-cleaning = carpet and upholstery cleaning; renovations = renovations; plumbing-gas-heating = plumbing, gas and heating; property-maintenance = property maintenance; rental-turnovers = rental turnovers; commercial-property = commercial property; truck-parts = used ram truck parts; mortgages = mortgage introductions.",
                "enum": ["flooring", "garage-doors", "carpet-cleaning", "renovations", "plumbing-gas-heating", "property-maintenance", "rental-turnovers", "commercial-property", "truck-parts", "mortgages"],
                "type": "string"
              },
              "town": {
                "description": "Town or postal code where the work is.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "details", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6019b5e81d3fac668775d3837b02003c3c56ef09366661299b7e7a27b2648e54"
        },
        {
          "name": "search",
          "title": "Search 905 Trades",
          "description": "Keyword search over the pages of the 905 Trades website. Returns page ids, titles and canonical URLs. Use fetch with an id to read a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain words to look for, for example \"broken spring\" or \"vinyl plank basement\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
