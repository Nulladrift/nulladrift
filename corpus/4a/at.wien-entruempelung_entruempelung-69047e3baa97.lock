{
  "lockfileVersion": 2,
  "subjects": {
    "at.wien-entruempelung/entruempelung": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wien-entruempelung.at/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Wien Entrümpelung (mekyn)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Öffentliche Aktionen der Website https://wien-entruempelung.at/. Inhalte: content_summary (Überblick), content_full (alles, in Teilen), content_section (eine Seite/ein Abschnitt) — jede Antwort beginnt mit der Änderungsliste. Entrümpelung: get_services, estimate_clearance (Richtwert-Spanne, kein Festpreis), answer_question (mit Quelle), request_viewing (nur mit Einwilligung). Buchen, Anfragen und Bestellen nur im Auftrag und mit den Angaben der betroffenen Person.",
      "tools": [
        {
          "name": "answer_question",
          "title": "Wissen zu Entrümpelung und Wien",
          "description": "Answers one question about clearance or Vienna from a sourced knowledge card or a published page. The reply includes the source URL and the retrieval date. If no card exists, the tool says so and does not guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "One question about clearance, waste, parking or a Vienna district",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c797ec807d1e25dc11f9b8e97700de8f2649ba5357768c25524c73687ed56399"
        },
        {
          "name": "content_full",
          "title": "Ganze Website als Text",
          "description": "Der komplette Inhalt der Website, strukturiert nach Seiten und Abschnitten, mit Quellen (references) und Bildbeschreibungen. Zuerst die Änderungsliste (was wann dazukam, entfernt oder geändert wurde). Lange Antworten kommen in Teilen: nextCursor an cursor übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Fortsetzung aus nextCursor der vorigen Antwort",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2881783d1bdb4083a84e8ba2f812c7bdc2990af1be2c56047c302060705a98dd"
        },
        {
          "name": "content_section",
          "title": "Ein Abschnitt oder eine Seite",
          "description": "Eine Seite (page) oder ein Abschnitt (page + section) als Text mit Quellen und Bildern. Kennungen aus content_full oder content_summary (pages). Lange Texte in Teilen: nextOffset an offset übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Fortsetzung aus nextOffset",
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Seitenkennung, z. B. home oder de/leistungen",
                "type": "string"
              },
              "section": {
                "description": "Abschnittskennung (optional; ohne = ganze Seite)",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb78ca4efcb63e2279b5fab8b66ccec4830f52769c34556a514e0288cdd18113"
        },
        {
          "name": "content_summary",
          "title": "Zusammenfassung des Betriebs",
          "description": "Kurzfassung: Betrieb, Leistungen mit öffentlichen Preisen, Gebiet, Öffnungszeiten, Kontakt, dazu die Seitenliste mit Abschnitts-Kennungen. Zuerst die Änderungsliste.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8938038a6bc877c6312dc69e825ce11156edd91fc83866c08791f46af53c6584"
        },
        {
          "name": "estimate_clearance",
          "title": "Richtwert einer Entrümpelung",
          "description": "Indicative euro range for a clearance job from the confirmed method. Not a fixed price. The fixed price follows the free viewing. If volume or confirmation is missing, quoted is false and no amount is returned. Do not calculate the range yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areaM2": {
                "description": "Floor area in square metres. Used only when a conversion factor is stored.",
                "type": "number"
              },
              "floor": {
                "description": "Floor number. 0 is the ground floor.",
                "maximum": 40,
                "minimum": 0,
                "type": "integer"
              },
              "halteverbot": {
                "description": "True when a no-parking zone is needed",
                "type": "boolean"
              },
              "lift": {
                "description": "True when a lift is available.",
                "type": "boolean"
              },
              "offering": {
                "description": "Service name, for example Wohnung, Keller, Haushalt, Messie",
                "type": "string"
              },
              "postalCode": {
                "description": "Vienna postal code, four digits, form 1dd0",
                "type": "string"
              },
              "rooms": {
                "description": "Room count. Used only when a conversion factor is stored.",
                "type": "number"
              },
              "rush": {
                "description": "True when the date is urgent",
                "type": "boolean"
              },
              "specials": {
                "description": "Special items",
                "items": {
                  "enum": ["piano", "hazardous", "fridge"],
                  "type": "string"
                },
                "type": "array"
              },
              "volumeM3": {
                "description": "Estimated cubic metres. Preferred quantity.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad4bc5e38aff41c99f592241b93ea79124d62558d568c3c3f49ab016ff65ff0b"
        },
        {
          "name": "get_business_info",
          "title": "Betrieb: Kontakt, Standorte, Öffnungszeiten",
          "description": "Name, Standorte mit Adresse und Telefon, Öffnungszeiten und Leistungen dieses Betriebs, wie auf der Website veröffentlicht.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83e3702802ebd8fbe87603d6cff764570a7c956f148360904f559d900c713f01"
        },
        {
          "name": "get_services",
          "title": "Leistungen der Entrümpelung",
          "description": "The published clearance services with from-prices (ab), the same rows as the website. A from-price is not a fixed price. The ninth padded catalog name is omitted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d00910886ab176afb305ae453e6c70505b37916cfda8c0d80795ab48805682ef"
        },
        {
          "name": "request_viewing",
          "title": "Besichtigung anfragen",
          "description": "Sends a viewing request with a callback to the business. Requires the person’s own name, email and explicit consent. Phone is optional. Rate limited. A missing consent stores nothing. This does not promise a fixed price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calculation": {
                "additionalProperties": true,
                "description": "Optional estimate result to attach",
                "type": "object"
              },
              "consent": {
                "description": "Explicit consent to be contacted about this viewing",
                "type": "boolean"
              },
              "customerEmail": {
                "description": "E-Mail für die Bestätigung",
                "format": "email",
                "type": "string"
              },
              "customerName": {
                "description": "Vor- und Nachname der Kundin bzw. des Kunden",
                "type": "string"
              },
              "customerPhone": {
                "description": "Telefonnummer (optional)",
                "type": "string"
              },
              "message": {
                "description": "What should be cleared, and any details already known",
                "type": "string"
              }
            },
            "required": ["consent", "customerEmail", "customerName"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04f1439ca11d16cf506a5189665c46cd968ffb820fe9c0a9287e9186d29daad7"
        }
      ],
      "digest": "sha256:9a9f49aaa3c02aa99685682a6695a036420265aee6498af6f9e812f5ed1c73d0"
    }
  }
}
