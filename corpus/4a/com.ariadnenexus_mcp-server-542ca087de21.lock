      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Ariadne Nexus Zero-PII Collateral Provenance & Underwriting MCP (ANX-RFC-001 / ZK_PROV_V1). 1. Run free discovery tools (`inspect_manifest_schema`, `verify_asset_hash`, `verify_zk_provenance_proof`, or `verify_underwriting_compliance`) first to validate 32-byte SHA-256 manifest digests and certificates with zero billing. 2. Never transmit natural-person names, street addresses, or raw bills of sale; submit only pre-hashed SHA-256 transfer digests (`custody_event_hashes`) and `optical_scan_sha256`. 3. Gated SLA tools (`generate_zk_provenance_proof`, `batch_underwrite_portfolio`) require an unlocked `X-API-Key` or inline `x402` (`X-Payment`) USDC settlement.",
      "tools": [
        {
          "name": "batch_underwrite_portfolio",
          "title": "Batch Merton Jump-Diffusion Portfolio Underwriting Engine",
          "description": "Computes per-asset optical scores (bps), Merton jump-diffusion 99% stressed values, approved advances in integer USD cents, and effective LTV (bps) across 1-100 collateral items. Use when: sizing a fine-art or RWA credit facility from appraised cent values, optical scan digests, custody depth, and horizon days. Do not use when: signing a single-asset proof (use generate_zk_provenance_proof instead) or auditing an underwriting summary against LTV caps (use verify_underwriting_compliance instead). Behavior: Read-only actuarial solver (p99=910ms; $2.50 USD / 250 cents via X-API-Key or X-Payment; unbilled 402 quote if unentitled).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assets": {
                "description": "List of 1 to 100 specialty collateral items to underwrite under Merton jump-diffusion 99% tail stress.",
                "items": {
                  "additionalProperties": false,
                  "description": "Single collateral item with integer-cent appraisal and optical scan digest.",
                  "properties": {
                    "appraised_value_cents": {
                      "description": "Independent appraised value in exact integer USD cents from 1 to 100000000000 ($1B max; e.g., 500000000 for $5M).",
                      "maximum": 100000000000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "asset_id": {
                      "description": "Unique collateral item identifier, 3-64 chars (e.g., \"col_item_01\").",
                      "pattern": "^[a-zA-Z0-9_:-]{3,64}$",
                      "type": "string"
                    },
                    "custody_depth": {
                      "default": 3,
                      "description": "Verified custodial transfer chain depth (1-100); depth >= 4 lowers title-defect jump intensity lambda from 0.19 to 0.08 (default: 3).",
                      "maximum": 100,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "optical_scan_sha256": {
                      "description": "64-character hex SHA-256 digest of the item's optical microtopography scan.",
                      "pattern": "^(?:0x)?[a-fA-F0-9]{64}$",
                      "type": "string"
                    }
                  },
                  "required": ["appraised_value_cents", "asset_id", "optical_scan_sha256"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "horizon_days": {
                "default": 365,
                "description": "Credit facility tenor and liquidation stress horizon in calendar days from 30 to 1825 (default: 365).",
                "maximum": 1825,
                "minimum": 30,
                "type": "integer"
              },
              "portfolio_id": {
                "description": "Institutional credit facility or collateral schedule identifier, 3-64 chars (e.g., \"port_fine_art_2026_q4\").",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9_:-]{3,64}$",
                "type": "string"
              },
              "target_advance_rate_bps": {
                "default": 5000,
                "description": "Requested gross loan-to-value (LTV) advance rate in integer basis points from 1000 (10.00%) to 8500 (85.00%); defaults to 5000 (50.00%).",
                "maximum": 8500,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["assets", "portfolio_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asset_count": {
                "description": "Number of collateral items underwritten.",
                "type": "integer"
              },
              "assets": {
                "description": "Per-asset optical scores, stressed values, and approved cent advances.",
                "items": {
                  "properties": {
                    "appraised_value_cents": {
                      "description": "Item appraised value in integer USD cents.",
                      "type": "integer"
                    },
                    "approved_advance_cents": {
                      "description": "Item approved advance in integer USD cents (capped at 55% of stressed value).",
                      "type": "integer"
                    },
                    "asset_id": {
                      "description": "Collateral item ID.",
                      "type": "string"
                    },
                    "merton_99_stressed_value_cents": {
                      "description": "Item Merton 99% stressed value in integer USD cents.",
                      "type": "integer"
                    },
                    "optical_forensic_score_bps": {
                      "description": "Item optical concordance score in basis points.",
                      "type": "integer"
                    },
                    "status": {
                      "description": "Item underwriting disposition.",
                      "enum": ["APPROVED", "MANUAL_FORENSIC_REVIEW"],
                      "type": "string"
                    }
                  },
                  "required": ["appraised_value_cents", "approved_advance_cents", "asset_id", "merton_99_stressed_value_cents", "optical_forensic_score_bps", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "effective_portfolio_ltv_bps": {
                "description": "Portfolio-level approved advance divided by appraised value in bps.",
                "type": "integer"
              },
              "execution_latency_ms": {
                "description": "Server-side execution duration in milliseconds.",
                "type": "number"
              },
              "horizon_days": {
                "description": "Liquidation stress horizon in calendar days.",
                "type": "integer"
              },
              "portfolio_id": {
                "description": "Evaluated portfolio or credit facility identifier.",
                "type": "string"
              },
              "tier": {
                "description": "Commercial execution tier (\"gated_production\").",
                "type": "string"
              },
              "tool": {
                "description": "Executed tool identifier (\"batch_underwrite_portfolio\").",
                "type": "string"
              },
              "total_appraised_value_cents": {
                "description": "Aggregate appraised portfolio value in integer USD cents.",
                "type": "integer"
              },
              "total_approved_advance_cents": {
                "description": "Aggregate approved loan advance in integer USD cents.",
                "type": "integer"
              },
              "total_merton_stressed_value_cents": {
                "description": "Aggregate Merton 99% tail-stressed value in integer USD cents.",
                "type": "integer"
              }
            },
            "required": ["asset_count", "assets", "effective_portfolio_ltv_bps", "execution_latency_ms", "horizon_days", "portfolio_id", "tier", "tool", "total_appraised_value_cents", "total_approved_advance_cents", "total_merton_stressed_value_cents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Batch Merton Jump-Diffusion Portfolio Underwriting Engine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aada6631158f62cdb1fff66c9c6980cd8b4e7447fe87b195b952ea7422b7c24"
        },
        {
          "name": "generate_zk_provenance_proof",
          "title": "Ed25519 Zero-PII Provenance Proof & Optical Score Generator",
          "description": "Computes a 0x01-prefixed SHA-256 custodial Merkle root, optical microtopography score (7200-9985 bps), underwriting recommendation, and Ed25519-signed ZK_PROV_V1 zero-PII provenance certificate. Use when: generating a pre-bind title attestation for an asset_id and policy_ref from custodial SHA-256 digests. Do not use when: verifying an existing certificate (use verify_zk_provenance_proof instead) or sizing multi-asset portfolio loans (use batch_underwrite_portfolio instead). Behavior: Read-only attestation (p99=380ms; $2.50 USD / 250 cents via X-API-Key or X-Payment; returns an unbilled 402 quote if unentitled).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "Unique alphanumeric collateral or vault asset identifier, 3-64 chars allowing underscores, colons, or hyphens (e.g., \"art_vault_basquiat_09\").",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9_:-]{3,64}$",
                "type": "string"
              },
              "custody_event_hashes": {
                "default": [],
                "description": "Ordered list of up to 128 SHA-256 hex digests of prior custodial transfers folded into the 0x01 Merkle root; defaults to a genesis leaf if empty.",
                "items": {
                  "description": "64-character hex SHA-256 digest of a chronological custodial transfer event (zero seller PII).",
                  "pattern": "^(?:0x)?[a-fA-F0-9]{64}$",
                  "type": "string"
                },
                "maxItems": 128,
                "type": "array"
              },
              "optical_scan_sha256": {
                "description": "Optional 64-character hex SHA-256 digest of the raking-light or XRF optical microtopography scan; derived from asset_id when omitted.",
                "pattern": "^(?:0x)?[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "policy_ref": {
                "description": "Underwriting binder or specialty title policy reference ID, 3-64 chars (e.g., \"POL-CHUBB-2026-441\").",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9_:-]{3,64}$",
                "type": "string"
              }
            },
            "required": ["asset_id", "policy_ref"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asset_id": {
                "description": "Attested collateral identifier.",
                "type": "string"
              },
              "custody_chain_depth": {
                "description": "Number of custodial transfer leaves folded into the Merkle tree.",
                "type": "integer"
              },
              "execution_latency_ms": {
                "description": "Server-side execution duration in milliseconds.",
                "type": "number"
              },
              "optical_forensic_score_bps": {
                "description": "Surface microtopography concordance score in basis points (7200-9985).",
                "type": "integer"
              },
              "policy_ref": {
                "description": "Bound underwriting policy or binder reference.",
                "type": "string"
              },
              "tier": {
                "description": "Commercial execution tier (\"gated_production\").",
                "type": "string"
              },
              "title_lien_clearance_merkle_root": {
                "description": "0x-prefixed 64-hex SHA-256 Merkle root with 0x01 internal node separation.",
                "type": "string"
              },
              "tool": {
                "description": "Executed tool identifier (\"generate_zk_provenance_proof\").",
                "type": "string"
              },
              "underwriting_recommendation": {
                "description": "Deterministic specialty-title bind recommendation.",
                "enum": ["BIND_ELIGIBLE_STANDARD", "BIND_WITH_ENHANCED_DEDUCTIBLE"],
                "type": "string"
              },
              "zk_attestation_certificate": {
                "description": "Ed25519-signed ZK_PROV_V1 zero-PII attestation envelope.",
                "properties": {
                  "issued_at_utc": {
                    "description": "ISO-8601 UTC attestation issuance timestamp.",
                    "type": "string"
                  },
                  "oracle_pubkey_ed25519_b64": {
                    "description": "Base64-encoded 32-byte Ed25519 oracle public key.",
                    "type": "string"
                  },
                  "public_statement": {
                    "description": "Pipe-delimited ZK_PROV_V1 signed public claims.",
                    "type": "string"
                  },
                  "scheme": {
                    "description": "Attestation signature scheme (\"ariadne-zk-ed25519-v1\").",
                    "type": "string"
                  },
                  "seller_pii_exposed": {
                    "description": "Always false; confirms zero seller PII in public claims.",
                    "type": "boolean"
                  },
                  "signature_b64": {
                    "description": "Base64-encoded 64-byte Ed25519 signature over public_statement.",
                    "type": "string"
                  }
                },
                "required": ["issued_at_utc", "oracle_pubkey_ed25519_b64", "public_statement", "scheme", "seller_pii_exposed", "signature_b64"],
                "type": "object"
              }
            },
            "required": ["asset_id", "custody_chain_depth", "execution_latency_ms", "optical_forensic_score_bps", "policy_ref", "tier", "title_lien_clearance_merkle_root", "tool", "underwriting_recommendation", "zk_attestation_certificate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ed25519 Zero-PII Provenance Proof & Optical Score Generator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ade98670c352e7443fd834079ccd94d0a2e45dd1c53d79502b43a9683cf1a65"
        },
        {
          "name": "inspect_manifest_schema",
          "title": "Collateral Manifest Schema & Field Validator",
          "description": "Returns required ANX-RFC-001 (ZK_PROV_V1) manifest fields for a collateral class and validates an optional candidate manifest object, listing missing keys and attestation readiness. Use when: checking required manifest keys or pre-validating a candidate JSON payload before SHA-256 hashing. Do not use when: validating an existing 64-hex SHA-256 digest (use verify_asset_hash instead), signing a provenance certificate (use generate_zk_provenance_proof instead), or auditing portfolio LTV caps (use verify_underwriting_compliance instead). Behavior: Read-only, stateless, deterministic schema check (p99=28ms; free discovery tier at 60 RPM without billing).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collateral_class": {
                "default": "fine_art",
                "description": "Specialty collateral category whose ANX-RFC-001 manifest schema is inspected (default: \"fine_art\").",
                "enum": ["fine_art", "rwa_bullion", "rare_manuscript", "collectible"],
                "type": "string"
              },
              "manifest_payload": {
                "description": "Optional candidate collateral manifest JSON object validated for required ANX-RFC-001 keys (asset_id, collateral_class, optical_scan_sha256, custody_event_hashes, appraised_value_cents). Omit to list required fields only.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "collateral_class": {
                "description": "Evaluated specialty collateral classification.",
                "enum": ["fine_art", "rwa_bullion", "rare_manuscript", "collectible"],
                "type": "string"
              },
              "execution_latency_ms": {
                "description": "Server-side execution duration in milliseconds.",
                "type": "number"
              },
              "missing_fields": {
                "description": "Required manifest keys absent from manifest_payload.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "payload_checked": {
                "description": "True when a candidate manifest_payload object was supplied.",
                "type": "boolean"
              },
              "ready_for_zk_attestation": {
                "description": "True when manifest_payload was supplied and missing_fields is empty.",
                "type": "boolean"
              },
              "required_manifest_fields": {
                "description": "Required ANX-RFC-001 top-level manifest keys.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tier": {
                "description": "Commercial execution tier (\"free_discovery\").",
                "type": "string"
              },
              "tool": {
                "description": "Executed tool identifier (\"inspect_manifest_schema\").",
                "type": "string"
              }
            },
            "required": ["collateral_class", "execution_latency_ms", "missing_fields", "payload_checked", "ready_for_zk_attestation", "required_manifest_fields", "tier", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Collateral Manifest Schema & Field Validator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:504c499f92d14df2cb41332155c357bc9f1ce3681ce6b6cf0150f102887a1e51"
        },
        {
          "name": "verify_asset_hash",
          "title": "Collateral SHA-256 Digest & Commitment Verifier",
          "description": "Validates and normalizes a 64-character hexadecimal SHA-256 collateral manifest digest and derives its deterministic specialty-title registry commitment ID (cmt_*) for fine art, bullion, manuscripts, or collectibles. Use when: confirming manifest SHA-256 digest conformance and commitment binding prior to paid underwriting. Do not use when: checking unhashed JSON manifest fields (use inspect_manifest_schema instead) or verifying a signed ZK_PROV_V1 certificate (use verify_zk_provenance_proof instead). Behavior: Read-only, stateless, deterministic computation (p99=42ms; free discovery tier at 30 RPM without billing).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_sha256": {
                "description": "64-character hexadecimal SHA-256 digest of the canonical collateral manifest JSON, with optional 0x prefix (e.g., \"0x9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\").",
                "pattern": "^(?:0x)?[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "collateral_class": {
                "default": "fine_art",
                "description": "Specialty collateral classification bound into the cmt_* registry commitment ID (default: \"fine_art\").",
                "enum": ["fine_art", "rwa_bullion", "rare_manuscript", "collectible"],
                "type": "string"
              }
            },
            "required": ["asset_sha256"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "collateral_class": {
                "description": "Bound specialty collateral classification.",
                "enum": ["fine_art", "rwa_bullion", "rare_manuscript", "collectible"],
                "type": "string"
              },
              "execution_latency_ms": {
                "description": "Server-side execution duration in milliseconds.",
                "type": "number"
              },
              "locked_production_fields": {
                "description": "Gated attestation fields unlocked via generate_zk_provenance_proof.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "manifest_sha256": {
                "description": "Normalized lowercase 0x-prefixed 64-hex SHA-256 digest.",
                "type": "string"
              },
              "registry_commitment_id": {
                "description": "Deterministic specialty-title commitment identifier prefixed with cmt_.",
                "type": "string"
              },
              "schema_conformance_valid": {
                "description": "True when the digest conforms to ANX-RFC-001 32-byte SHA-256 rules.",
                "type": "boolean"
              },
              "tier": {
                "description": "Commercial execution tier (\"free_discovery\").",
                "type": "string"
              },
              "tool": {
                "description": "Executed tool identifier (\"verify_asset_hash\").",
                "type": "string"
              }
            },
            "required": ["collateral_class", "execution_latency_ms", "locked_production_fields", "manifest_sha256", "registry_commitment_id", "schema_conformance_valid", "tier", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Collateral SHA-256 Digest & Commitment Verifier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd62b6a15f64a56a3187d83958fad06f4aaf046ef2533f2d2530d7f53898cc2f"
        },
        {
          "name": "verify_underwriting_compliance",
          "title": "Underwriting LTV Cap & Oracle Root-of-Trust Verifier",
          "description": "Audits a portfolio underwriting summary against the ANX-RFC-001 55% (5500 bps) Merton stressed advance cap, classifies optical forensic score thresholds, and returns the active ZK_PROV_V1 Ed25519 oracle public key and SHA-256 fingerprint. Use when: validating credit-committee LTV compliance on a batch_underwrite_portfolio quote or retrieving the oracle public key for pinning in verify_zk_provenance_proof. Do not use when: computing stressed collateral values from raw asset schedules (use batch_underwrite_portfolio instead), verifying an Ed25519 certificate signature (use verify_zk_provenance_proof instead), or checking JSON manifest fields (use inspect_manifest_schema instead). Behavior: Read-only, stateless compliance check (p99=15ms; free discovery tier at 60 RPM without billing).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "min_optical_forensic_score_bps": {
                "default": 8500,
                "description": "Minimum item-level optical forensic score across the portfolio in basis points (0-10000; default: 8500).",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "portfolio_id": {
                "description": "Portfolio or credit facility identifier audited for statutory LTV compliance (e.g., \"port_fine_art_2026_q4\").",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[a-zA-Z0-9_:-]{3,64}$",
                "type": "string"
              },
              "proposed_advance_cents": {
                "description": "Proposed loan advance in exact integer USD cents tested against the ANX-RFC-001 55% (5500 bps) Merton stressed advance ceiling.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "integer"
              },
              "total_appraised_value_cents": {
                "description": "Aggregate appraised portfolio value in exact integer USD cents (>= 1).",
                "maximum": 10000000000000,
                "minimum": 1,
                "type": "integer"
              },
              "total_merton_stressed_value_cents": {
                "description": "Aggregate Merton 99% tail-stressed liquidation value in integer USD cents returned by batch_underwrite_portfolio.",
                "maximum": 10000000000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["portfolio_id", "proposed_advance_cents", "total_appraised_value_cents", "total_merton_stressed_value_cents"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compliant": {
                "description": "True when proposed_advance_cents <= 55% of stressed value, stressed value <= appraised value, and min_optical_forensic_score_bps >= 8000.",
                "type": "boolean"
              },
              "execution_latency_ms": {
                "description": "Server-side execution duration in milliseconds.",
                "type": "number"
              },
              "gross_ltv_bps": {
                "description": "Proposed advance divided by total appraised value in basis points.",
                "type": "integer"
              },
              "headroom_cents": {
                "description": "Signed integer USD cents remaining under ceiling (negative indicates cap breach).",
                "type": "integer"
              },
              "max_compliant_advance_cents": {
                "description": "Maximum ANX-RFC-001 compliant loan advance in integer USD cents (5500 bps of stressed value).",
                "type": "integer"
              },
              "optical_policy_tier": {
                "description": "Underwriting policy tier determined by min_optical_forensic_score_bps.",
                "enum": ["BIND_ELIGIBLE_STANDARD", "APPROVED_ENHANCED_DEDUCTIBLE", "MANUAL_FORENSIC_REVIEW"],
                "type": "string"
              },
              "oracle_trust_anchor": {
                "description": "Active ANX-RFC-001 Ed25519 oracle root-of-trust metadata for key pinning.",
                "properties": {
                  "oracle_pubkey_ed25519_b64": {
                    "description": "Active base64-encoded 32-byte Ed25519 oracle public key.",
                    "type": "string"
                  },
                  "oracle_pubkey_sha256_hex": {
                    "description": "SHA-256 hex fingerprint of the raw 32-byte Ed25519 oracle public key.",
                    "type": "string"
                  },
                  "protocol_version": {
                    "description": "Specification version (\"ZK_PROV_V1\").",
                    "type": "string"
                  },
                  "rfc_spec_url": {
                    "description": "Canonical ANX-RFC-001 specification URI.",
                    "type": "string"
                  },
                  "scheme": {
                    "description": "Signature scheme (\"ariadne-zk-ed25519-v1\").",
                    "type": "string"
                  }
                },
                "required": ["oracle_pubkey_ed25519_b64", "oracle_pubkey_sha256_hex", "protocol_version", "rfc_spec_url", "scheme"],
                "type": "object"
              },
              "portfolio_id": {
                "description": "Audited portfolio or credit facility identifier.",
                "type": "string"
              },
