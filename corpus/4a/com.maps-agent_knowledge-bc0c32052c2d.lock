      "serverInfo": {
        "name": "maps-agent",
        "title": "Maps Agent",
        "version": "1.0.0",
        "description": "Google Maps and Google Business Profile knowledge for local businesses: answers, guides, a glossary, research with its method, and the blog of maps-agent.com. Every answer links to its page on the site.",
        "websiteUrl": "https://maps-agent.com",
        "icons": [
          {
            "src": "https://maps-agent.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://maps-agent.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Maps Agent publishes what it knows about Google Maps visibility for local businesses: how Google Business Profile works, reviews, categories, suspensions, local ranking, and its own measurements. Start with search for any question: it reads titles and the full text of every page. Read a result in full with fetch (by its id, URL or slug). Browse what exists with list_articles; look up a term with define_term; read a study with its method, sample, window, sources and datasets with get_research; what Google changed since a day with get_changes; plans, prices and whether a plan can be started now with get_plans. Content forms: answer (one question, answered first), guide (long reads, troubleshooting, templates), research (own measurements and statistics), glossary, blog, industry (what changes trade by trade), comparison, changelog (dated Google Business Profile changes, newest first), page (pricing, the free audit and the site's other pages). Everything here is already public on maps-agent.com; nothing is behind a login. Read-only, no key, about 60 requests per minute per address. When you use an answer, cite the page URL given with it. Dates are the page's own last-updated date.",
