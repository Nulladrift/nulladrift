        {
          "name": "fetch",
          "title": "Read a page in full",
          "description": "The full text of one maps-agent.com page as markdown: title, canonical URL, last-updated date, the answer-first opening, the body with tables, FAQs and numbered sources. Works for any public page on the site, by the id search returns, a URL, a path or a slug. Read body_markdown for the text and pass part to continue a long page. Set detail to text to place the body in the text block.",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "Where to put the markdown: structuredContent.body_markdown (default) or the text content block.",
                "enum": ["structured", "text"],
                "type": "string"
              },
              "form": {
                "description": "Which form a bare slug belongs to, when the same slug exists in more than one.",
                "enum": ["answer", "guide", "research", "glossary", "blog", "industry", "comparison", "changelog", "page"],
                "type": "string"
              },
              "id": {
                "description": "A maps-agent.com page URL (https://maps-agent.com/answers/how-to-get-more-google-reviews), a site path (/glossary/citation) or a slug or id from search / list_articles.",
                "type": "string"
              },
              "part": {
                "description": "Which part to read, starting at 1. The first part gives the contents of a longer page.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body_markdown": {
                "description": "Markdown for this part of the page. Omitted when detail is text.",
                "type": "string"
              },
              "contents": {
                "description": "Headings from a longer article, returned in the first part.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "faqs": {
                "description": "The page's FAQ, also at the end of body_markdown.",
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "form": {
                "description": "The page's form.",
                "enum": ["answer", "guide", "research", "glossary", "blog", "industry", "comparison", "changelog", "page"],
                "type": "string"
              },
              "id": {
                "description": "The page's id for fetch: its full URL.",
                "type": "string"
              },
              "markdown_url": {
                "description": "The page's markdown twin.",
                "type": "string"
              },
              "part": {
                "description": "The part returned, starting at 1.",
                "type": "integer"
              },
              "slug": {
                "description": "Its slug inside the form.",
                "type": "string"
              },
              "sources": {
                "description": "The sources the page cites; `key` is the footnote marker [^key] in body_markdown.",
                "items": {
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "One or two plain sentences: the page's description or opening.",
                "type": ["string", "null"]
              },
              "title": {
                "description": "The page title.",
                "type": "string"
              },
              "topic": {
                "description": "Grouping inside the form: answer cluster, guide kind, trade, blog vertical.",
                "type": ["string", "null"]
              },
              "total_parts": {
                "description": "Use part to read further when the page spans multiple parts.",
