        "name": "maps-agent",
        "title": "Maps Agent",
        "version": "1.0.0",
        "description": "Google Maps and Google Business Profile knowledge for local businesses: answers, guides, a glossary, research with its method, and the blog of maps-agent.com. Every answer links to its page on the site.",
        "websiteUrl": "https://maps-agent.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Maps Agent publishes what it knows about Google Maps visibility for local businesses: how Google Business Profile works, reviews, categories, suspensions, local ranking, and its own measurements. Start with search_knowledge for any question; read a result in full with get_article (by URL or slug). Browse what exists with list_articles; look up a term with define_term; read a study with its method, sample and window with get_research. Content forms: answer (one question, answered first), guide (long reads, troubleshooting, templates), research (own measurements and statistics), glossary, blog, industry (what changes trade by trade), comparison. Everything here is already public on maps-agent.com; nothing is behind a login. Read-only, no key, about 60 requests per minute per address. When you use an answer, cite the page URL given with it. Dates are the page's own last-updated date.",
      "tools": [
