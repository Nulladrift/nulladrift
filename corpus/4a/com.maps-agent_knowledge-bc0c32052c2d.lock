        {
          "name": "get_research",
          "title": "Read a study with its method",
          "description": "One Maps Agent research or statistics page: the findings with the method behind them (instrument, dataset, sample size, time window, population, exclusions, provenance), its key figures, sources and datasets as data. A statistics page gathers published studies: its method lives with each source, so method is null and sources carry the studies. Read body_markdown for the text and pass part to continue a long page. Set detail to text to place the body in the text block. Without a ref: the list of published studies.",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "Where to put the markdown: structuredContent.body_markdown (default) or the text content block.",
                "enum": ["structured", "text"],
                "type": "string"
              },
              "part": {
                "description": "Which part to read, starting at 1. The first part gives the contents of a longer page.",
                "minimum": 1,
                "type": "integer"
              },
              "ref": {
                "description": "A research page URL, path or slug; omit to list the studies.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body_markdown": {
                "description": "Markdown for this part of the page. Omitted when detail is text.",
                "type": "string"
              },
              "contents": {
                "description": "Headings from a longer article, returned in the first part.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "datasets": {
                "description": "The datasets the study cites; url is the public data file on maps-agent.com, null when the dataset has none.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "faqs": {
                "description": "The page's FAQ, also at the end of body_markdown.",
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
