                "not": {
                  "required": ["report_id"]
                },
                "required": ["business_name", "location", "place_id"]
              },
              {
                "not": {
                  "anyOf": [
                    {
                      "required": ["business_name"]
                    },
                    {
                      "required": ["location"]
                    },
                    {
                      "required": ["place_id"]
                    }
                  ]
                },
                "required": ["report_id"]
              }
