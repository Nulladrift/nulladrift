  "subjects": {
    "com.jointhestudentlife/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jointhestudentlife.com/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.jointhestudentlife/docs",
        "title": "The Student Life docs",
        "version": "1.0.0",
        "description": "City guides, student blog guides, FAQ, pricing and policies.",
        "websiteUrl": "https://jointhestudentlife.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read only documentation for The Student Life: 56 city guides for students (costs, neighbourhoods, universities, housing), 20 blog guides for international and Erasmus students, the FAQ, pricing and the privacy, terms and refund policies. Use search_docs, then get_doc. For live events, tickets and deals use the product server at https://jointhestudentlife.com/mcp. No authentication is needed.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Read a guide or doc",
          "description": "Read one document in full as plain text: a blog guide, a city guide, the FAQ, pricing or a policy. Pass the id from search_docs (e.g. \"blog/erasmus-2026-guide\", \"city/berlin\", \"refund-policy\") or its URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document id from search_docs.",
                "maxLength": 100,
                "type": "string"
              },
              "url": {
                "description": "Or the document URL on jointhestudentlife.com.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a guide or doc"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57d77e3f8484d64553316d1151e6820c2c0023efb39d4e8c75b6a601df0718a0"
        },
        {
          "name": "search_docs",
          "title": "Search guides and docs",
          "description": "Full text search over The Student Life city guides, blog guides for international and Erasmus students, the FAQ, pricing and the privacy, terms and refund policies. Returns ids, titles, links and a snippet; read one with get_doc.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional filter.",
                "enum": ["blog", "city", "page"],
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"cheapest student cities\", \"make friends abroad\", \"refund\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search guides and docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:788f93d12b98c9a7a6c36611879aa1854c24af67675ded549250f98ff4c743c2"
        }
      ],
