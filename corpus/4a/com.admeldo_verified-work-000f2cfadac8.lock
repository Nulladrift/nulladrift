{
  "lockfileVersion": 2,
  "subjects": {
    "com.admeldo/verified-work": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verify.admeldo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "verified-work",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_receipt",
          "title": "Check an outcome receipt (free)",
          "description": "Fetches a Verified Work receipt by id (or takes the receipt JSON) and verifies its Ed25519 signature against the verifier's published key. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "receipt": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "receipt_id": {
                "pattern": "^rcpt_[A-Za-z0-9]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:be62cebaf8c05cbd6fb0c2c5bee2c7a9ad65606c7741b1affeacd4e9c95418b0"
        },
        {
          "name": "get_price",
          "title": "Show the live price (free)",
          "description": "Returns the verifier's current x402 payment terms (amount, asset, network, recipient) without paying. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:735f784f0b21519b45630e19e53b251bb8d3d193b12d637cafc3ab627bd2d240"
        },
        {
          "name": "verify_work",
          "title": "Verify delivered work (paid via x402, $0.02)",
          "description": "Checks delivered work against agreed terms and returns an Ed25519-signed pass/fail outcome receipt with per-check evidence (ERC-8004 compatible). job_type 'dataset_spec/v1': artifact is an array of rows; spec may set row_schema (JSON Schema), min_rows, max_rows, unique_key, freshness {field, max_age_seconds}. job_type 'json_response/v1': artifact is a JSON body; spec may set json_schema, required_fields (JSON Pointers), value_constraints, http_status, max_size. Costs the same x402 price as POST /verify (currently $0.02 USDC on Base). Pay with a PAYMENT-SIGNATURE header on this tools/call; this server never accepts a wallet private key. Malformed input is rejected with no charge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "artifact": {
                "description": "dataset_spec/v1: array of row objects. json_response/v1: the delivered JSON body."
              },
              "job_type": {
                "enum": ["dataset_spec/v1", "json_response/v1"],
                "type": "string"
              },
              "spec": {
                "additionalProperties": {},
                "description": "Acceptance criteria for the job type",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "status": {
                "description": "json_response/v1 only: HTTP status the delivered response had",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "subject": {
                "additionalProperties": {},
                "description": "Optional ids of the worker/buyer agents (e.g. ERC-8004 agentId)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["artifact", "job_type", "spec"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eac3c1eca3e1dee57929fce53ab51466b186937742c94930bb2ace5f404df7a5"
        }
      ],
      "digest": "sha256:ebcae6ac388abb8453a0b2f4c5bcde6629a156fc24ccbd85f44016f993a1863f"
    }
  }
}
