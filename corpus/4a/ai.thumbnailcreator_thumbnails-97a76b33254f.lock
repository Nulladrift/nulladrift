{
  "lockfileVersion": 2,
  "subjects": {
    "ai.thumbnailcreator/thumbnails": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://thumbnailcreator.ai/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "thumbnailcreator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "account_usage",
          "title": "Account usage",
          "description": "Shows the credit balance and in-flight spend for the API key's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25a94e290fb6bfd6eab5c380c0e621f3898ac8e60616fc8aca8cd8e2e4520056"
        },
        {
          "name": "generate_thumbnails",
          "title": "Generate thumbnails",
          "description": "Generates thumbnail images from a prompt with one or more models (up to 8 images per call). Waits for results and returns image URLs valid for one hour. Billed per image to the API key's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "Aspect ratio. 16:9 is 1920x1080 for YouTube.",
                "enum": ["16:9", "1:1", "9:16", "4:5"],
                "type": "string"
              },
              "models": {
                "description": "Model ids from list_models. Defaults to gpt-image-2.",
                "items": {
                  "enum": ["gpt-image-2", "gpt-image-2.6-flare", "gpt-image-2.5-sunburst", "nano-banana-pro", "nano-banana-2.1", "flux-2-max", "seedream-5-lite", "ideogram-v4", "grok-imagine"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "n": {
                "description": "Images per model.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "What the thumbnail should show, including any exact text to render.",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b2c234d420eb22a983b41bc44d8c49461c0c841a99f5607e70fce59567c20f0"
        },
        {
          "name": "get_generation",
          "title": "Get a generation",
          "description": "Returns the status and fresh image URLs for a generation id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ec52d4f24fbaff89ba40d2b05fb89300360cb173e17bc425fe4e5841940481e"
        },
        {
          "name": "list_models",
          "title": "List image models",
          "description": "Lists available thumbnail image models with the price per image in USD.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:43596a3e351322b1cf04ae84bfeb57f0cddf70e2a701850ce1c4a62d145f7435"
        }
      ],
      "digest": "sha256:cb8fa2fcda94355d3ff1f49a317fddc9120dad7c0442dcab626134b5bcc7f70d"
    }
  }
}
