      "serverInfo": {
        "name": "tariffs",
        "title": "Tariff & HS Code Duty Finder: HS codes, customs duty & tax",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tariff & HS Code Duty Finder: HS codes, customs duty & tax. Use find_tariff_codes to turn a product description into candidate tariff codes and get_duty_rate to read the duty on a code. Always send country: GB for goods imported into the United Kingdom, US for goods imported into the United States; ask which if the user did not say. The codes are candidates, not a classification: say so every time, tell the user the right code depends on the product's make-up and use and that customs decides, and suggest confirming with customs or a licensed customs broker, or asking for a binding ruling, before declaring goods. Describe the product plainly (what it is, the material, the use). If nothing matches, retry with fewer or plainer words, or the product noun alone. When several candidates fit, show the best few with their headings and let the user choose; do not pick one for them as the answer. Send originCountry (a two-letter code) to get_duty_rate when the user names where the goods come from, and read it as the schedule's rate for that origin, not as proof the goods qualify. If get_duty_rate returns lines under the code instead of a rate, the code is not one goods are declared under: show the lines and ask which fits. Pass on every note returned. For the US, say that chapter 99 additional duties are not included. Do not present the result as legal, customs or trade advice, and do not estimate total landed cost. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "find_tariff_codes",
          "title": "Find an HS code, HTS or customs code",
          "description": "Use this when the user asks for the tariff code, commodity code, customs code, HS code, HTS code, Harmonized System code or customs classification for a product, for example \"what is the tariff code for a ceramic flower pot in the UK?\", \"HTS code for a lithium-ion battery\" or \"which heading covers cotton t-shirts for import into the US?\". Pass a plain description of the product and country GB (United Kingdom) or US (United States). Returns candidate codes from the official schedule, each with its description, the headings above it and whether goods are declared under it, plus a notice that they are candidates and not a binding classification. Do not use it to classify goods with certainty, to give a binding customs ruling, to compute shipping or landed cost, or for countries other than GB and US.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Destination of the goods, whose import tariff to read: GB (United Kingdom Global Tariff) or US (Harmonized Tariff Schedule). The EU and other countries are not covered.",
                "enum": ["GB", "US"],
                "type": "string"
              },
              "description": {
                "description": "Plain description of the product: what it is, what it is made of, what it is used for. Or a code, to look that code up.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "description": "Most candidates to return. Default 8.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country", "description"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidates": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "declarable": {
                      "type": "boolean"
                    },
                    "description": {
                      "type": "string"
                    },
                    "dutyRate": {
                      "type": "string"
                    },
                    "level": {
                      "enum": ["heading", "subheading", "commodity"],
                      "type": "string"
                    },
                    "path": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["code", "declarable", "description", "level", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "country": {
                "enum": ["GB", "US"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "totalMatches": {
                "type": "integer"
              }
            },
            "required": ["candidates", "country", "notice", "query", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Find an HS code, HTS or customs code",
            "openai/toolInvocation/invoking": "Find an HS code, HTS or customs code..."
          },
          "digest": "sha256:41803967ce9ae31254187f4ae803ed43995c884c04266fdee16c3d0826b24eb3"
        },
        {
          "name": "get_duty_rate",
          "title": "Get customs duty, tariff and import tax",
          "description": "Use this when the user asks what import duty, customs duty, tariff, import tax or VAT applies to a tariff code or HS code, for example \"what is the US duty on HTS 8507.60.00?\", \"what duty applies to UK commodity code 6914100000 from Vietnam?\" or \"what is under heading 6914 in the UK tariff?\". Pass the code (4 to 10 digits, dots allowed), country GB or US, and originCountry when the user names where the goods come from. For a code goods are declared under it returns the description and the rate: for the UK the third-country duty, VAT rates as a list, the preferential rate and any additional duty for the origin, and other measures; for the US the general, special and column 2 rates and units. For a code that is only a heading it returns the lines beneath it instead. Chapter 99 additional duties for the US and quotas or trade remedies are not included. Do not use it for a landed cost estimate, for excise or customs-broker fees, or for legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Tariff code of 4 to 10 digits, with or without dots, for example 8517.13 or 6914900010.",
                "maxLength": 14,
                "minLength": 4,
                "pattern": "^[0-9. ]{4,14}$",
                "type": "string"
              },
              "country": {
                "description": "Destination of the goods, whose import tariff to read: GB (United Kingdom Global Tariff) or US (Harmonized Tariff Schedule). The EU and other countries are not covered.",
                "enum": ["GB", "US"],
                "type": "string"
              },
              "originCountry": {
                "description": "Two-letter code of the country the goods come from, for example VN. Adds that country's preferential rate (GB) or tells whether the column 2 rate applies (US).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["code", "country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "children": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "declarable": {
                      "type": "boolean"
                    },
                    "description": {
                      "type": "string"
                    },
                    "general": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "description"],
                  "type": "object"
                },
                "type": "array"
              },
              "code": {
                "type": "string"
              },
              "country": {
                "enum": ["GB", "US"],
                "type": "string"
              },
              "declarable": {
                "type": "boolean"
              },
              "description": {
                "type": "string"
              },
              "duty": {
                "properties": {
                  "additional": {
                    "items": {
                      "properties": {
                        "area": {
                          "type": "string"
                        },
                        "rate": {
                          "type": "string"
                        }
                      },
                      "required": ["area", "rate"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "columnTwo": {
                    "type": "string"
                  },
                  "footnotes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "general": {
                    "type": "string"
                  },
                  "otherMeasures": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "preferential": {
                    "items": {
                      "properties": {
                        "area": {
                          "type": "string"
                        },
                        "rate": {
                          "type": "string"
                        }
                      },
                      "required": ["area", "rate"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "special": {
                    "type": "string"
                  },
                  "thirdCountry": {
                    "type": "string"
                  },
                  "units": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "vat": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "level": {
                "enum": ["heading", "subheading", "commodity"],
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "originCountry": {
                "type": "string"
              },
              "path": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "totalChildren": {
                "type": "integer"
              }
            },
            "required": ["code", "country", "declarable", "level", "notes", "notice", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
