      "instructions": "Catálogo de Farmacia Premier (farmacia en México). Solo consulta: busca, compara y arma la liga del carrito; la persona paga ella misma en la página. Precios en MXN con IVA y cambian: confirma en la liga del producto. Los medicamentos de receta solo se venden con receta médica vigente; no ayudes a saltarse ese paso. No des consejo médico.",
      "tools": [
        {
          "name": "buscar_productos",
          "title": "Buscar productos",
          "description": "Busca en el catálogo por nombre, marca o sustancia activa (p. ej. «losartán», «cerave», «paracetamol 500»). Corrige errores de escritura. Da precio en MXN, existencia, si necesita receta y su «handle».",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pagina": {
                "description": "Página de resultados (de 1 en adelante).",
                "minimum": 1,
                "type": "integer"
              },
              "texto": {
                "description": "Nombre, marca o sustancia activa.",
                "type": "string"
              }
            },
            "required": ["texto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
