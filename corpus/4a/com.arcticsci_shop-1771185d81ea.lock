{
  "lockfileVersion": 2,
  "subjects": {
    "com.arcticsci/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://arcticsci.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "arctic-white-shop",
        "title": "Arctic White",
        "version": "1.1.0",
        "websiteUrl": "https://arcticsci.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Arctic White (arcticsci.com) sells laboratory consumables in the US and internationally: microplates, deep well plates, reservoirs, sealing mats and films, tubes, filter plates and lab equipment. Find products with search_products and get_product. Prices are in USD per selling unit (usually a case); many items are priced on request. To buy items with published prices, call check_price_and_stock, then get_shipping_estimate, then start_checkout, and give the buyer the checkout link: they pay on arcticsci.com. For items priced on request, large orders, POs or net terms, use request_quote; the buyer confirms it by email. Never claim an order is placed or paid: the buyer completes payment on the link. Phone (888) 448-0311, hello@arcticsci.com.",
      "tools": [
        {
          "name": "check_price_and_stock",
          "title": "Check price and stock",
          "description": "Price and stock for a list of items, the subtotal, and whether the order can be bought online now (published prices, within the payment limits) or needs a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Products and quantities. Quantity is in the product's selling unit (usually cases).",
                "items": {
                  "additionalProperties": false,
                  "description": "One product line.",
                  "properties": {
                    "quantity": {
                      "description": "Number of selling units (usually cases)",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Arctic White SKU, e.g. AWLS-219006",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "can_checkout": {
                "description": "True when start_checkout can sell these items now; otherwise use request_quote",
                "type": "boolean"
              },
              "lines": {
                "description": "One entry per requested item",
                "items": {
                  "properties": {
                    "availability": {
                      "description": "Stock status: in_stock, backorder (available to order) or out_of_stock",
                      "enum": ["in_stock", "backorder", "out_of_stock"],
                      "type": "string"
                    },
                    "line_total_usd": {
                      "description": "Quantity times unit price in USD, null when priced on request",
                      "type": ["number", "null"]
                    },
                    "quantity": {
                      "description": "Selling units requested",
                      "type": "integer"
                    },
                    "sku": {
                      "description": "SKU",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Product name",
                      "type": "string"
                    },
                    "unit_price_usd": {
                      "description": "Price per selling unit in USD, null when priced on request",
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["availability", "line_total_usd", "quantity", "sku", "title", "unit_price_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "description": "Why the items can't be bought online, null when they can",
                "type": ["string", "null"]
              },
              "subtotal_usd": {
                "description": "Goods subtotal in USD before shipping and tax, null when any item is priced on request",
                "type": ["number", "null"]
              }
            },
            "required": ["can_checkout", "lines", "reason", "subtotal_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check price and stock"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72256d6b472d82d9dba1cfbb3ec4543f748b3ee70828457e698c7f467619d5f9"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full details for one product: description, specifications and dimensions, options with SKU, price and stock, image and page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sku": {
                "description": "SKU (e.g. AWLS-219006) or an arcticsci.com product link",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brand": {
                "description": "Brand, Arctic White",
                "type": "string"
              },
              "description": {
                "description": "Plain-text product description",
                "type": "string"
              },
              "discontinued": {
                "description": "True when the product is discontinued",
                "type": "boolean"
              },
              "image_url": {
                "description": "Main product image, null when there is none",
                "type": ["string", "null"]
              },
              "quote_only": {
                "description": "True for a custom made, quote-only product: it has no price and cannot be checked out; use request_quote",
                "type": "boolean"
              },
              "specifications": {
                "description": "Specifications and dimensions, in display order",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Specification, e.g. Well Count",
                      "type": "string"
                    },
                    "value": {
                      "description": "Value, e.g. 96",
                      "type": "string"
                    }
                  },
                  "required": ["name", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "standard_alternative": {
                "description": "For a quote-only product, the closest standard product sold today; null otherwise or when none is set",
                "properties": {
                  "sku": {
                    "description": "SKU of the standard product",
                    "type": ["string", "null"]
                  },
                  "title": {
                    "description": "Its name",
                    "type": "string"
                  },
                  "url": {
                    "description": "Its page on arcticsci.com",
                    "type": "string"
                  }
                },
                "required": ["sku", "title", "url"],
                "type": ["object", "null"]
              },
              "title": {
                "description": "Product name",
                "type": "string"
              },
              "url": {
                "description": "Product page on arcticsci.com",
                "type": "string"
              },
              "variants": {
                "description": "Orderable options",
                "items": {
                  "description": "One orderable option of the product.",
                  "properties": {
                    "availability": {
                      "description": "Stock status: in_stock, backorder (available to order) or out_of_stock",
                      "enum": ["in_stock", "backorder", "out_of_stock"],
                      "type": "string"
                    },
                    "option": {
                      "description": "Option name (e.g. Sterile), null when the product has one option",
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "Price as shown, e.g. $246.00, or Pricing on request",
                      "type": "string"
                    },
                    "price_usd": {
                      "description": "Published price per selling unit in USD, null when priced on request",
                      "type": ["number", "null"]
                    },
                    "sku": {
                      "description": "SKU of this option",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["availability", "option", "price", "price_usd", "sku"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["brand", "description", "discontinued", "image_url", "quote_only", "specifications", "standard_alternative", "title", "url", "variants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c24d528c27433210423fc3f4ff50c9b43f481f17acc328abc75639ca5e69c4c"
        },
        {
          "name": "get_shipping_estimate",
          "title": "Get shipping estimate",
          "description": "Live FedEx shipping options and prices for the items to a destination, the same rates checkout charges. Needs only the country, postal code and, in the US and Canada, the state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Where the items ship to. state is required only in the US and Canada (2-letter code). zip is required except in countries without postal codes.",
                "properties": {
                  "city": {
                    "description": "City (optional)",
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter country code, e.g. US, DE, GB",
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter state or province code in the US and Canada (e.g. PA, ON); region name or blank elsewhere",
                    "type": "string"
                  },
                  "zip": {
                    "description": "ZIP or postal code",
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "items": {
                "description": "Products and quantities. Quantity is in the product's selling unit (usually cases).",
                "items": {
                  "additionalProperties": false,
                  "description": "One product line.",
                  "properties": {
                    "quantity": {
                      "description": "Number of selling units (usually cases)",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Arctic White SKU, e.g. AWLS-219006",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["address", "items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "rates": {
                "description": "Shipping options, as offered by the carrier",
                "items": {
                  "properties": {
                    "estimated_days": {
                      "description": "Estimated business days in transit, null when the carrier gives none",
                      "type": ["integer", "null"]
                    },
                    "id": {
                      "description": "Pass this to start_checkout as shipping_rate_id",
                      "type": "string"
                    },
                    "price_usd": {
                      "description": "Shipping charge in USD",
                      "type": "number"
                    },
                    "service": {
                      "description": "Carrier and service, e.g. FedEx Ground",
                      "type": "string"
                    }
                  },
                  "required": ["estimated_days", "id", "price_usd", "service"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["rates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get shipping estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5afa80ef6c19f9e0a0573ca06a868e4c55fa0862cb0a1fe40c4fa7e53e17df65"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Ask Arctic White for a quote (any items, including those priced on request, large orders, POs or net terms). We email the buyer a link to confirm the request; once confirmed, our team replies with pricing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Shipping address. state is required only in the US and Canada (2-letter code); elsewhere it is optional. zip is required except in countries without postal codes.",
                "properties": {
                  "city": {
                    "description": "City",
                    "type": "string"
                  },
                  "company": {
                    "description": "Company or institution (optional here; give it as the top-level company)",
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter country code, e.g. US, DE, GB",
                    "type": "string"
                  },
                  "name": {
                    "description": "Recipient name",
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter state or province code in the US and Canada (e.g. PA, ON); region name or blank elsewhere",
                    "type": "string"
                  },
                  "street1": {
                    "description": "Street address",
                    "type": "string"
                  },
                  "street2": {
                    "description": "Suite, building or floor (optional)",
                    "type": "string"
                  },
                  "zip": {
                    "description": "ZIP or postal code",
                    "type": "string"
                  }
                },
                "required": ["city", "country", "street1"],
                "type": "object"
              },
              "company": {
                "description": "Company or institution",
                "type": "string"
              },
              "email": {
                "description": "Buyer's work email; they confirm the request from it",
                "type": "string"
              },
              "items": {
                "description": "Products and quantities. Quantity is in the product's selling unit (usually cases).",
                "items": {
                  "additionalProperties": false,
                  "description": "One product line.",
                  "properties": {
                    "quantity": {
                      "description": "Number of selling units (usually cases)",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Arctic White SKU, e.g. AWLS-219006",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "Buyer's name (optional)",
                "type": "string"
              },
              "note": {
                "description": "Anything the team should know: timeline, PO, terms, freight account (optional)",
                "type": "string"
              },
              "phone": {
                "description": "Phone number (optional)",
                "type": "string"
              }
            },
            "required": ["address", "company", "email", "items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "email": {
                "description": "Where the confirmation link was sent",
                "type": "string"
              },
              "status": {
                "description": "The request waits for the buyer to confirm it from the email",
                "enum": ["awaiting_email_confirmation"],
                "type": "string"
              }
            },
            "required": ["email", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a05cda5944ef1842ce02ba4d6521534a8e4b7dedb3040384813facc7a4a1d395"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search Arctic White's catalog of lab consumables (microplates, deep well plates, reservoirs, sealing mats and films, tubes, filter plates, lab equipment) by catalog number, a competitor's part number, name, well count or type. Returns SKUs, published prices (or 'pricing on request'), stock and product links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most results to return (1 to 25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, e.g. '96 deep well 2 mL', 'AWLS-219006', 'sealing mat 384'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "description": "Matching products, best match first. Empty when nothing matches.",
                "items": {
                  "properties": {
                    "quote_only": {
                      "description": "True for a custom made, quote-only product: it has no price and cannot be checked out; use request_quote",
                      "type": "boolean"
                    },
                    "replaces": {
                      "description": "The competitor part this product replaces, when found through that part number",
                      "type": ["string", "null"]
                    },
                    "standard_alternative": {
                      "description": "For a quote-only product, the closest standard product sold today; null otherwise or when none is set",
                      "properties": {
                        "sku": {
                          "description": "SKU of the standard product",
                          "type": ["string", "null"]
                        },
                        "title": {
                          "description": "Its name",
                          "type": "string"
                        },
                        "url": {
                          "description": "Its page on arcticsci.com",
                          "type": "string"
                        }
                      },
                      "required": ["sku", "title", "url"],
                      "type": ["object", "null"]
                    },
                    "title": {
                      "description": "Product name",
                      "type": "string"
                    },
                    "url": {
                      "description": "Product page on arcticsci.com",
                      "type": "string"
                    },
                    "variants": {
                      "description": "Orderable options",
                      "items": {
                        "description": "One orderable option of the product.",
                        "properties": {
                          "availability": {
                            "description": "Stock status: in_stock, backorder (available to order) or out_of_stock",
                            "enum": ["in_stock", "backorder", "out_of_stock"],
                            "type": "string"
                          },
                          "option": {
                            "description": "Option name (e.g. Sterile), null when the product has one option",
                            "type": ["string", "null"]
                          },
                          "price": {
                            "description": "Price as shown, e.g. $246.00, or Pricing on request",
                            "type": "string"
                          },
                          "price_usd": {
                            "description": "Published price per selling unit in USD, null when priced on request",
                            "type": ["number", "null"]
                          },
                          "sku": {
                            "description": "SKU of this option",
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["availability", "option", "price", "price_usd", "sku"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["quote_only", "replaces", "standard_alternative", "title", "url", "variants"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f296d58c937deb134700038c9e116c7e4453856556e46cdcbd399acaeab9c78"
        },
        {
          "name": "start_checkout",
          "title": "Start checkout",
          "description": "Create a secure Stripe checkout link on arcticsci.com for items with published prices. The buyer opens the link to review the order, see sales tax and pay; nothing is charged until they do. Use the shipping option id from get_shipping_estimate, or leave it out for the lowest rate. Items priced on request, custom made (quote_only) products, or orders over the payment limits need request_quote instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Shipping address. state is required only in the US and Canada (2-letter code); elsewhere it is optional. zip is required except in countries without postal codes.",
                "properties": {
                  "city": {
                    "description": "City",
                    "type": "string"
                  },
                  "company": {
                    "description": "Company or institution. Required: Arctic White ships to businesses and labs.",
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter country code, e.g. US, DE, GB",
                    "type": "string"
                  },
                  "name": {
                    "description": "Recipient name",
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter state or province code in the US and Canada (e.g. PA, ON); region name or blank elsewhere",
                    "type": "string"
                  },
                  "street1": {
                    "description": "Street address",
                    "type": "string"
                  },
                  "street2": {
                    "description": "Suite, building or floor (optional)",
                    "type": "string"
                  },
                  "zip": {
                    "description": "ZIP or postal code",
                    "type": "string"
                  }
                },
                "required": ["city", "company", "country", "street1"],
                "type": "object"
              },
              "email": {
                "description": "Buyer's email, prefilled on the payment page (optional)",
                "type": "string"
              },
              "items": {
                "description": "Products and quantities. Quantity is in the product's selling unit (usually cases).",
                "items": {
                  "additionalProperties": false,
                  "description": "One product line.",
                  "properties": {
                    "quantity": {
                      "description": "Number of selling units (usually cases)",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Arctic White SKU, e.g. AWLS-219006",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "shipping_rate_id": {
                "description": "id from get_shipping_estimate (optional; the lowest rate is used when left out)",
                "type": "string"
              }
            },
            "required": ["address", "items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkout_url": {
                "description": "Stripe payment page on arcticsci.com's account. Give it to the buyer; it expires in 24 hours.",
                "type": "string"
              },
              "shipping_service": {
                "description": "Carrier and service, e.g. FedEx Ground",
                "type": "string"
              },
              "shipping_usd": {
                "description": "Shipping charge in USD",
                "type": "number"
              },
              "subtotal_usd": {
                "description": "Goods subtotal in USD",
                "type": "number"
              }
            },
            "required": ["checkout_url", "shipping_service", "shipping_usd", "subtotal_usd"],
            "type": "object"
          },
          "annotations": {
