        {
          "name": "edit_measures",
          "title": "Edit measures",
          "description": "Rewrite measures from..to (numbers, inclusive) of one track of the draft with .cesure measures, as read_score returns them: measures, the measures of the piece, and trackMeasures, the track's, one in each, as many; to = from - 1 inserts before from. A measure of the piece written with its id stays that measure, even rewritten; one written without its id is a new measure, and the one it stood for is removed with what it carried (a repeat it opened, say). A measure of the range left out is removed, and measures [] with trackMeasures [] removes the whole range. The other tracks follow column by column, as in the editor: a column is inserted, removed or given a time signature on every track; its repeat signs are carried as the editor carries them unless its measure of the piece writes repeat (null clears them), and a tempo change stays on its column (on the next one when its column is removed), so no other column changes tempo. A note written by its pitch alone (E4, Bb3) on a track with strings is given one by Cesure, which never moves a note written with its string (E4@1). The answer names the measures written. A written measure that does not read or does not fill its time signature refuses the whole call, the refusal naming each fault with its place; a measure sent back unchanged (same id and content) is kept as it was. Measure notation (.cesure): each voice is one string of beats separated by spaces. beat = content.duration[{d | tu 3}]; content = note | (note note …) | r; note = pitch[@string][{note props}] | x@string. Every beat carries its duration: -2 breve, 1 whole, 2 half, 4 quarter, 8, 16, 32, 64, 128, 256. A note is the pitch it sounds, named as meant (C4 = middle C, F#3, Bb2; D#5 is not Eb5); on a track with a tuning, @ and its string (from 1, the highest), never a fret: Cesure deduces it; without @, Cesure chooses the string. A track without tuning has no strings (a piano: two staves, right hand then left), and no @. A track may say \"hideWhenEmpty\":[\"never\",\"always\"] (one per staff, auto|always|never|instrument): \"always\" leaves a staff out of a system it plays nothing in, \"instrument\" only with the whole track, \"auto\" when the score says \"hideEmptyStaves\":true; the first system too only with \"hideEmptyStavesInFirstSystem\":true. x@6 mutes string 6. fret.string (3.1) is still read. A property's values: one bare (tu 3) or several in parentheses (tu (5 4)). Beat props: d dotted, tu 3 triplet on each beat of the group, its first beat also start 1 and its last stop 1 (MusicXML's tuplet start and stop; a triplet quarter and eighth is one group); a beat of a nested group carries every tu it is in, from the widest to the tightest, each with its own edges (tu 3 tu 3 start 2), beam up|down a stem forced to that side, beam split|merge the beam stopped or carried on to the next beat (written only where the source does). A staff's clef: \"clef\":\"treble|soprano|mezzosoprano|alto|tenor|baritone|bass\" plus 8vb|8va|15mb|15ma (treble8vb), and {clef alto} on a beat from there on: lines only, never the pitch. An octave line of a staff opens on the beat writing {ot (8va start 1)} and closes where the beat writing {ot (8va stop 1)} ends (8va|8vb|15ma|15mb), nothing between, every voice of the staff under it: its heads stand an octave or two from the pitch, which stays the sounding one. A measure's \"chords\":[{\"chord\":\"C\"},{\"at\":2,\"chord\":\"G/B\"}] writes its chord symbols, each at its instant in quarters, a beat struck there or not. Note props: t tie, h hammer/pull-off and sl slide to the next note on that string, v vibrato, be (0 0 15 4 60 4) a whole-tone bend (its points: each an offset along the note, 0 to 60, and a height in quarter tones; be (0 0 15 4 30 4 45 0 60 0) bends and releases, be (0 4 60 4) is a pre-bend), lr let ring (it sounds on past its length, its written duration unchanged), tw on a tied-from note: its tie waits for the next note of its pitch in its voice, past the beats between (an arpeggio held into its chord, that note marked t). Each voice fills its time signature exactly: 4/4 = 4 quarters = 8 eighths, 3/4 = 3 quarters, 6/8 = 6 eighths; rests complete a short one. The time signature and the marks below are a measure of the piece's, written once for every track, with its id and its \"repeat\" (the score's \"measures\", read_score's and edit_measures' measures); a track's measure holds its staves and chords alone, measure i of every track standing in measure i of the piece. A measure of the piece without numerator/denominator is 4/4, whatever came before. \"barLineRight\":\"none\" closes a measure on no visible bar line (a cadenza cut where the source draws none). \"uncounted\":true leaves a measure out of the bar count: it carries the number of the one before and shows none; on the first measure it declares the pickup, measure 0, and a short first measure without the key is read as the pickup (\"uncounted\":false makes it measure 1). \"meter\":[4,4] names the meter of an irregular measure no regular one gives (a piece all in a cadenza). \"tsVisibility\":false prints no time signature where the measure would engrave one. \"barNumberDisplay\":\"hide\" counts a measure without showing its number. \"incomplete\":true makes a measure irregular on purpose, in its own length (a pickup). In edit_measures a measure of the piece kept by its id keeps the marks it leaves out (a new signature drops incomplete and meter), a new one has none, and one written holds for the whole column (null clears barLineRight, barNumberDisplay and meter; false clears uncounted and incomplete; true clears tsVisibility). A time signature on a track's measure is that track's own, kept and never played. A second voice (a bass under a melody) is a second string in voices. Examples (4/4): \"C4@3.4 D4@3.4 r.2\" (C4 then D4 on string 3 (strings from 1, the highest), quarters; a half rest); \"(E4@1 C4@2 G3@3).2 x@6.4 r.4\" (a chord, a half; a muted string); \"E4.8 F#4.8 G4.4 Bb3.2\" (notes by pitch alone (C4 = middle C): Cesure chooses their strings); \"C4@3.4{d} C4@3.8 F#4@1.8{tu 3} G4@1.8{tu 3} A4@1.8{tu 3} F#4@2{h}.8 G4@2.8\" (dotted quarter; a triplet of eighths (each beat carries it); a hammer-on to the next note); \"C4@3.2 C4@3{t}.4 F#4@2{sl}.8 G#4@2{v}.8\" (a tie to the note before, a slide, a vibrato). A measure of the piece: {\"id\":\"p2\",\"numerator\":3,\"denominator\":4}, the track's measure in it: {\"staves\":[{\"voices\":[\"E4@1.8 F#4@1.8 G4@1.4 A4@1.4\",\"E2@6.2{d}\"]}]}. The full format: https://cesure.app/format",
