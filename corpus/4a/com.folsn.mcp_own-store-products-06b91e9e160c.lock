          "name": "search_folsn_products",
          "title": "폴슨 상품 검색 / Search Folsn products",
          "description": "폴슨(folsn)이 네이버 스마트스토어에서 직접 파는 상품을 상품 이름·옵션(용량·수량·색상·모델 번호)으로 찾습니다. 결과마다 판매가(원)·배송비·묶음 수량과 개당 환산가·재고 상태·구매 주소·가격 기록 시각·출처를 따로 돌려줍니다. 다른 쇼핑몰 가격이나 전체 최저가는 돌려주지 않습니다. 검색어는 한국어 상품명(브랜드 + 제품명 + 용량·수량)이 가장 잘 맞고, 등록된 영어 브랜드·상품명도 일부 지원합니다. matchStatus=needs_clarification이면 clarificationFields의 옵션을 사용자에게 되물으세요. 결과가 없으면 hint의 내용을 사용자에게 전해 주세요. 예: {\"query\": \"쿤달 칫솔 16입\", \"limit\": 5}\nSearch products sold directly by Folsn on its own Naver Smart Store (Korea) by product name and option (volume, count, color, model number). Each result returns price in KRW, shipping fee, bundle quantity with unit price, stock status, purchase URL, the time the price was recorded, and the source as separate fields. It does not return other stores' prices or market-wide lowest prices. Korean product names (brand + product + volume/count) match best; selected English brand and product names also work. Unknown English words remain unchanged. If matchStatus=needs_clarification, ask the user about the options in clarificationFields. If there are no results, relay the hint to the user. Example: {\"query\": \"클로란 피오니 샴푸 400ml\", \"limit\": 5}",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "최대 결과 수(1~10) / max results",
                "examples": [5],
