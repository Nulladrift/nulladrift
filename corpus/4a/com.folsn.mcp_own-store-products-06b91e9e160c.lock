          "description": "검색 결과의 sku(스마트스토어 상품 번호)로 폴슨 상품 한 건의 판매 조건을 가져옵니다: 판매가(원)·배송비·쿠폰(현재는 수집하지 않아 null)·묶음 수량과 개당 환산가·재고 상태·구매 주소·가격 기록 시각·출처. 예: {\"product_id\": \"13300090680\"}\nGet the sale terms of one Folsn product by its sku (Smart Store product number) from search_folsn_products: price in KRW, shipping fee, coupon (not collected yet, null), bundle quantity and unit price, stock status, purchase URL, price record time and source. Example: {\"product_id\": \"13300090680\"}",
