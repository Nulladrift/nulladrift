      "instructions": "이 서버는 폴슨(folsn)의 공개 상품 정보를 읽기 전용으로 제공합니다. 자사 판매 정보 도구(search_folsn_products·get_folsn_product_offer)는 폴슨이 네이버 스마트스토어에서 직접 파는 상품의 판매 조건만 알려 줍니다. 이 두 도구는 다른 쇼핑몰 가격·전체 최저가·가격 추천은 다루지 않습니다. 다른 판매처 정보 도구(search_catalog_products·get_catalog_product·get_catalog_offers)는 여러 원장의 상품 후보와 출처를 구분해 보여 줍니다. 상품 원장에 있다고 인허가·안전성·현재 판매가 확인된 것은 아닙니다. productId는 검색 결과에서 그대로 전달하고 출처·옵션·관측 시각을 확인하세요. get_catalog_offers는 상품에 연결해 확인한 다른 판매처의 공개 판매가·배송비·구매 링크를 관측 시각과 함께 돌려주며, 연결되지 않은 관측은 상품에 붙이지 않습니다. 뷰티 상품 정보 도구 3종(search_beauty_products·get_beauty_product_detail·analyze_ingredients)은 서버 설정으로 켰을 때만 목록에 나옵니다. analyze_ingredients의 ewgScore·ewgGrade·ewgGradeDistribution은 폴슨이 서버 안 성분 표로 추정한 값이며 EWG(Environmental Working Group)의 공식 평가 값이 아닙니다. 도구가 말하는 최저가는 폴슨이 수집한 판매처 안에서의 값입니다. 폴슨의 구입 가격·이익률·주문·고객 정보·비밀값은 제공하지 않으며, 폴슨은 링크로 안내하는 다른 판매처와 제휴나 수수료 관계가 없습니다. 미확인 배송비(null)는 무료배송이 아닙니다. matchStatus=needs_clarification이면 용량·수량·상품 종류를 다시 확인하세요. 첫 결과라도 요청한 구성과 다르면 추천하지 말고, availabilityStatus=out_of_stock은 구매 가능 상품으로 추천하지 마세요. 가격 기록 시각은 원천 기록 갱신 시각이며 재고를 별도로 확인한 시각은 제공하지 않습니다. seller.name은 폴슨이 운영하는 스마트스토어 이름(사사로이)입니다. 등록된 일부 영어 브랜드·상품명도 검색되며 등록되지 않은 영어 단어는 번역하지 않습니다. 결과가 없으면 hint의 내용을 사용자에게 전해 주세요. relatedResults는 요청한 상품이 아니라 검색어와 일부만 일치하는 상품으로 소개하세요. / This server gives read-only public product information from Folsn. The own-store tools (search_folsn_products, get_folsn_product_offer) only return sale terms of products Folsn sells on its own Naver Smart Store. They do not cover other stores' prices, market-wide lowest prices or price advice. The catalog tools (search_catalog_products, get_catalog_product, get_catalog_offers) show product candidates from several records with their sources; catalog presence does not prove approval, safety or current availability. Pass productId from search unchanged and respect evidence, options and recorded times. get_catalog_offers returns other sellers' public prices, shipping fees and store links only for offers linked and checked against the product, with the observation time; unlinked observations are not product offers. The three beauty tools (search_beauty_products, get_beauty_product_detail, analyze_ingredients) appear only when enabled on the server. The ewgScore, ewgGrade and ewgGradeDistribution values of analyze_ingredients are Folsn's own estimates from an ingredient table on its server, not official ratings of the Environmental Working Group (EWG). Any lowest value covers only the sellers Folsn collected. Folsn's acquisition prices, markups, orders, customer data and secrets are never returned, and Folsn has no affiliate or commission relationship with linked sellers. Unknown shipping (null) is not free. If matchStatus=needs_clarification, ask for the option; do not recommend a result with a different composition or availabilityStatus=out_of_stock. The price time is the source record update, not a separate stock verification time. seller.name is Folsn's Smart Store (사사로이). If there are no results, relay the hint to the user. Present relatedResults as partial matches for the query, not as the requested product.\n이용약관 / Terms: https://mcp.folsn.com/public/terms · 개인정보 처리방침 / Privacy: https://mcp.folsn.com/public/privacy",
