                "description": "상품 이름·옵션 검색어 또는 sku / product name and options, or sku",
                "examples": ["쿤달 칫솔 16입", "클로란 피오니 샴푸 400ml"],
                "maxLength": 100,
                "minLength": 1,
                "title": "Query",
                "type": "string"
