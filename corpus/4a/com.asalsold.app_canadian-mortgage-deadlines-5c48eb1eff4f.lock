          "name": "rate_hold_deadline",
          "description": "Canada: the last date an offer can be accepted so a mortgage still funds before a rate hold expires. A rate hold applies to the funding date, not the offer date, so the real deadline is weeks before the printed expiry. Requires the expiry date — it cannot be answered without one.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Mortgage amount in CAD",
                "type": "number"
              },
              "expiry": {
                "description": "Rate hold expiry date, YYYY-MM-DD",
                "type": "string"
              },
              "heldRate": {
                "description": "The rate being held, as a percent, e.g. 4.79",
                "type": "number"
              }
            },
            "required": ["amount", "expiry", "heldRate"],
            "type": "object"
          },
