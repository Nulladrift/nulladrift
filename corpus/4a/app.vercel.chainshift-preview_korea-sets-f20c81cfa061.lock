          "digest": "sha256:7d62eb6f9c84b7f19e7bbabc8529682b6d0df53538fedbf276fbfb5391b48dcd"
        },
        {
          "name": "request_quote",
          "title": "Send an order request (no payment)",
          "description": "Use when: the user agreed to send their email address and the listed sets, and wants a confirmed delivered total (request=\"order\") or an email when a set is available again (request=\"notify\"). Do NOT use: if the user's request is vague (no set named, no country, or a budget without saying whether shipping and duties are included): call clarify_request first and ask its questions. Do NOT use it to pay, to reserve stock or to send names, street addresses, phone numbers or payment details. Returns: order_id and request_summary (or watch_id for notify). No payment and nothing reserved: a person on our team emails the confirmed delivered total; nothing is bought before the customer accepts. Send only these fields — never names, street addresses, phone numbers or payment details. Read request_summary back to the user. Retries: send idempotency_key (a UUID you keep for this one request); sending the same request again with the same key returns the same order_id instead of a second request (idempotency in the result says whether this call was retry-safe). Send provenance (where each value came from): a value that is not just_confirmed comes back in unconfirmed with a question (kind confirm) to ask the user. Example requests: \"Order this Korean set for my sister in Seattle; email me the confirmed total first.\" / \"이 세트 미국 시애틀로 주문 요청해 줘. 확정 금액은 메일로 먼저 받을게\" / \"このセットを大阪に送る注文を依頼して。確定金額を先にメールで\"",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_sku": {
                "description": "one set (use items for several sets)",
                "type": "string"
              },
              "client_ref": {
                "description": "your own task id, echoed in our log; not used for retries",
                "maxLength": 64,
                "type": "string"
              },
              "contact_email": {
                "description": "one email address for the confirmed quote",
                "type": "string"
              },
              "idempotency_key": {
                "description": "optional retry key (e.g. a UUID) for this one request: the same key with the same request returns the same order_id. Without it, trace_id is used as the key when sent.",
                "pattern": "^[A-Za-z0-9._:-]{8,128}$",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bundle_sku": {
                      "description": "sets[].sku from list_sets",
                      "type": "string"
                    },
                    "quantity": {
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["bundle_sku", "quantity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "reply language tag, e.g. en, ja, es",
                "type": "string"
              },
              "options": {
                "additionalProperties": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "description": "choices for sets that have them, keyed by bundle_sku, e.g. {\"<sku>\": {\"scent\": \"Cotton Haze\"}} — values in list_sets sets[].options",
                "type": "object"
              },
              "provenance": {
                "additionalProperties": false,
                "description": "Optional provenance: where each value came from, keyed by bundle_sku or items, quantity and ship_country, each one of just_confirmed (the user said or confirmed it in this conversation), known_before, assumed or unknown. The request is still received; any value not just_confirmed comes back in unconfirmed with questions (kind confirm): ask the user before our email arrives.",
                "properties": {
                  "bundle_sku": {
                    "enum": ["just_confirmed", "known_before", "assumed", "unknown"],
                    "type": "string"
                  },
                  "items": {
                    "enum": ["just_confirmed", "known_before", "assumed", "unknown"],
                    "type": "string"
                  },
                  "quantity": {
                    "enum": ["just_confirmed", "known_before", "assumed", "unknown"],
                    "type": "string"
                  },
                  "ship_country": {
                    "enum": ["just_confirmed", "known_before", "assumed", "unknown"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "quantity": {
                "minimum": 1,
                "type": "integer"
              },
              "request": {
                "enum": ["order", "notify"],
                "type": "string"
              },
              "ship_country": {
                "enum": ["US", "CA", "JP"],
                "type": "string"
              },
              "ship_region": {
                "description": "state/province/prefecture name only — not an address",
                "type": "string"
              },
              "trace_id": {
                "description": "optional: the trace_id an earlier clarify_request returned, so the steps of one request link up. Not personal data.",
                "pattern": "^it_[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["contact_email", "ship_country"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "anyOf": [
                  {
                    "required": ["order_id", "request_summary"]
                  },
                  {
                    "required": ["watch_id"]
                  }
                ],
                "properties": {
                  "estimated_delivered_total": {
                    "type": ["object", "null"]
                  },
                  "idempotency": {
                    "properties": {
                      "basis": {
                        "enum": ["idempotency_key", "trace_id", "none"],
                        "type": "string"
                      },
                      "note": {
                        "type": "string"
                      }
                    },
                    "required": ["basis", "note"],
                    "type": "object"
                  },
                  "offer": {
                    "type": "string"
                  },
                  "order_id": {
                    "pattern": "^CS-[0-9A-F]{10}$",
                    "type": "string"
                  },
                  "payment": {
                    "type": "string"
                  },
                  "questions": {
                    "description": "confirm questions for unconfirmed: ask the user as written",
                    "items": {
                      "properties": {
                        "choices": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "field": {
                          "type": "string"
                        },
                        "kind": {
                          "const": "confirm"
                        },
                        "provenance": {
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["field", "kind", "provenance", "text"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "quote_valid_until": {
                    "type": ["string", "null"]
                  },
                  "reply_by": {
                    "type": "string"
                  },
                  "request_summary": {
                    "description": "read this back to the user",
                    "type": "string"
                  },
                  "reserved": {
                    "const": false
                  },
                  "ship_country": {
                    "enum": ["US", "CA", "JP"],
                    "type": "string"
                  },
                  "status": {
                    "enum": ["received", "confirm_pending", "watching"],
                    "type": "string"
                  },
                  "status_url": {
                    "type": "string"
                  },
                  "trace_id": {
                    "pattern": "^it_[0-9a-f]{24}$",
                    "type": "string"
                  },
                  "unconfirmed": {
                    "description": "only when provenance was sent: fields not just_confirmed (the request is still received)",
                    "items": {
                      "properties": {
                        "field": {
                          "type": "string"
                        },
                        "provenance": {
                          "type": "string"
                        }
                      },
                      "required": ["field", "provenance"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "unconfirmed_note": {
                    "type": "string"
                  },
                  "watch_id": {
                    "pattern": "^CW-[0-9A-F]{10}$",
                    "type": "string"
                  }
                },
                "required": ["idempotency", "offer", "ship_country", "status", "trace_id"],
                "type": "object"
              },
              {
                "properties": {
                  "error": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["refused", "error"],
                    "type": "string"
                  }
                },
                "required": ["error", "status"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an order request (no payment)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
