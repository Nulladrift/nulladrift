                "type": "array"
              },
              "status_as_of": {
                "type": "string"
              }
            },
            "required": ["data_envelope", "how_to_request", "sets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Korea Sets offers"
