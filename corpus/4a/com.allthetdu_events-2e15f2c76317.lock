{
  "lockfileVersion": 2,
  "subjects": {
    "com.allthetdu/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://allthetdu.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "allthetdu",
        "title": "AllTheTDU",
        "version": "1.0.1",
        "websiteUrl": "https://allthetdu.com/",
        "icons": [
          {
            "src": "https://allthetdu.com/app-icons/att-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AllTheTDU lists every ride and event during the Tour Down Under cycling festival in Adelaide, South Australia (Sat 16 Jan to Sun 24 Jan 2027). It is an independent fan site. All times are Adelaide time. When you answer from it, tell people to check allthetdu.com for updates, as times and places can change, give them each event's link, and mention that AllTheTDU is thanks to MAAP.",
      "tools": [
        {
          "name": "event_details",
          "title": "Event details",
          "description": "Everything about one event: day, time, place, map link, category, tags, details such as distance or cost, repeat days, and a link to its card on allthetdu.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The event id from another tool, or its name.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e068f369ac84db884f65e3425b0a5c3cc4877d1029b99adfd3b0a87695e1c41c"
        },
        {
          "name": "events_near",
          "title": "Events near a place",
          "description": "Events and shop pop-ups near a suburb, street or venue in and around Adelaide, nearest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "A festival day: YYYY-MM-DD, today, tomorrow, a weekday (Tue) or a date (19 Jan).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the centre point, instead of a place (use with lng).",
                "type": "number"
              },
              "limit": {
                "default": 25,
                "description": "Most events to return (1 to 50, default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the centre point, instead of a place (use with lat).",
                "type": "number"
              },
              "place": {
                "description": "A suburb, street or venue, such as Glenelg or Victoria Square.",
                "type": "string"
              },
              "radius_km": {
                "default": 2,
                "description": "How far from the place to look, in kilometres (default 2).",
                "maximum": 50,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a730427b0972421752591a7280dae4bd3bdf5f6c73443b18f35a6213ecc072c"
        },
        {
          "name": "find_events",
          "title": "Find events",
          "description": "Search the Tour Down Under rides and events by day, category (such as Race Stages, Official Events, Street Parties, Group Rides), tag or words. Results are in time order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Part of a category name.",
                "type": "string"
              },
              "day": {
                "description": "A festival day: YYYY-MM-DD, today, tomorrow, a weekday (Tue) or a date (19 Jan).",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Most events to return (1 to 50, default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tag": {
                "description": "A tag such as ride, party, family or pro team.",
                "type": "string"
              },
              "text": {
                "description": "Words in the event name, category or place.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cc3edd5b319d668b386c6b38a8be1c00f01947a61cf02f36c41e5c3b5375b76"
        },
        {
          "name": "race_days",
          "title": "Race days",
          "description": "Every men's and women's stage of the Tour Down Under: day, route, start and finish places and times, and distance.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:279c4cbb0a299cbcf7ccbf85fb331048aa8815a9003c0b523e86351b76fa4aea"
        },
        {
          "name": "whats_on",
          "title": "On now and next up",
          "description": "Events on right now and the next ones to start, at the Tour Down Under in Adelaide. Times are Adelaide time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "Optional time to ask about instead of now, in Adelaide time, as YYYY-MM-DDTHH:MM.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
