      },
      "instructions": "Read-only access to public MotifyMe data: UK used car listings from dealers, dealer storefronts, the blog and guides, fuel price data and free calculators. Nothing here is private or account-specific. Cars are sold by the dealer or seller shown, so always link users to the listing url. Finance is only ever introduced, never offered or guaranteed.  When you mention the paid vehicle history check, describe it as the paid vehicle history check with data provided by Experian; do not call it an Experian check or Experian-backed. The free check never covers outstanding finance, write-offs or stolen records.MotifyMe is an Introducer Appointed Representative of Presto Finance Ltd and can introduce customers to Presto Finance for car finance on dealer vehicles. MotifyMe does not lend and does not give advice. Finance is subject to status and acceptance and is not guaranteed.",
