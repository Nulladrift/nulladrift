{
  "lockfileVersion": 2,
  "subjects": {
    "co.frontierresearch/frontier": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://frontierresearch.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "frontier",
        "title": "Frontier",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Frontier (frontierresearch.co) is a public index of new research papers, mostly from the top scientific journals (Nature, Science, Cell, NEJM, The Lancet, PNAS and their families) plus some preprints, updated daily. Each entry has a plain-language summary and, once its editorial is written, why it matters and what to watch next, and a Frontier Score from 0 to 100 built from Evidence (25%), Impact (25%) and Novelty (50%), with a separate confidence label. Use search_breakthroughs to find entries on a topic, latest_breakthroughs for what was added recently, get_breakthrough for one entry's full score breakdown and sources, list_fields for the fields, and explain_frontier_score for the method. Beyond the index, check_paper reads ANY paper's citation impact (citations, field-weighted citation impact or FWCI, citation percentile, retraction status) and check_researcher reads a researcher's whole record (papers, mean FWCI, h-index, papers in their field's top 10%) by ORCID iD or OpenAlex author id, from OpenAlex. When you present an entry or a record, give its Frontier URL (and a paper's DOI). Scores of papers published in the last few months are early signals and move as evidence accrues.",
      "tools": [
        {
          "name": "check_paper",
          "title": "Check any paper's citation impact",
          "description": "Reads one paper's citation impact from OpenAlex and the open citation sources Frontier uses: citations, field-weighted citation impact (FWCI: its citations against papers of the same field, year and type, where 1.0 is the world average), its citation percentile in its field, whether it is in its field's top 10% or top 1%, and whether it is retracted or carries a correction or an expression of concern. Works for any paper, not only those in Frontier's index. Accepts a DOI (or a doi.org link), an OpenAlex work id, a PubMed id (pmid:123), or a title.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "paper": {
                "description": "A DOI, doi.org link, OpenAlex work id (W123...), pmid:<id>, or the paper's title.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["paper"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d49bf5ee0f87e94c64c4ce707b693c3e9e30a530c106b65e34a8456de71d4d7"
        },
        {
          "name": "check_researcher",
          "title": "Check a researcher's record",
          "description": "Reads a researcher's whole publication record from OpenAlex (and their public ORCID record): how many papers, total citations, mean and median field-weighted citation impact (FWCI, where 1.0 is the world average), h-index, papers in their field's top 10% and top 1%, any retracted paper, and their highest-impact papers. Give an ORCID iD or an OpenAlex author id; a name returns the matching profiles to choose from.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "researcher": {
                "description": "An ORCID iD (0000-0002-1825-0097), an OpenAlex author id (A5023888391), or a name.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["researcher"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e43ecbd8d3ef4a9faa61702650a79a76ddab3d15aa05962eba6b20345c657f8"
        },
        {
          "name": "explain_frontier_score",
          "title": "How the Frontier Score works",
          "description": "The Frontier Score method: its three pillars and what each measures, recency, the integrity rule, tiers and confidence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48f0a04044c54f2bbf1311a1ef40f2650d857daa295286c21200fc88f7288930"
        },
        {
          "name": "get_breakthrough",
          "title": "One entry in full",
          "description": "Everything Frontier holds on one entry: the plain-language summary, why it matters and what to watch, authors and institutions, the full Frontier Score breakdown (each pillar and what drives it, recency and confidence) and the sources behind each figure. Accepts an OpenAlex work id (e.g. W7214802080), an entry slug, or a frontierresearch.co entry URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "OpenAlex work id, entry slug, or Frontier entry URL.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77d0ff1f327449d616772c5d7d5f87f90ebb3d29709771a575a02572fbf88878"
        },
        {
          "name": "latest_breakthroughs",
          "title": "Latest scored breakthroughs",
          "description": "What Frontier added most recently: the entries listed in the last N days (the index adds a few new papers from the top journals every day), newest first, optionally within one field.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "How far back to look, in days (1 to 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "field": {
                "description": "Limit to one field (see list_fields).",
                "enum": ["ai", "bio", "neuro", "physics", "quantum", "materials", "climate", "space", "math", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many entries to return (1 to 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3aec412ea513e99d65efcc2bb63696c4d0aa576c20fb8296abc90833ae4be450"
        },
        {
          "name": "list_fields",
          "title": "Fields in the index",
          "description": "The research fields Frontier covers, with how many entries each holds and its median Frontier Score.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd8caa9c74b08bf1cb881e5023c2057d8e4bff64d6f9d4e487318f106dc21f4c"
        },
        {
          "name": "search_breakthroughs",
          "title": "Search scored breakthroughs",
          "description": "Search Frontier's evidence-scored index of new research from the top scientific journals. Matches the query against titles, plain-language summaries, authors and topics, optionally within one field, and returns the matching entries ranked by Frontier Score (or newest paper first), each with its summary, score, Frontier URL and DOI. Leave the query empty to browse a field.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "field": {
                "description": "Limit to one field (see list_fields).",
                "enum": ["ai", "bio", "neuro", "physics", "quantum", "materials", "climate", "space", "math", "other"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many entries to return (1 to 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. 'CRISPR', 'obesity drug', 'quantum error correction'.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "score",
                "description": "'score' ranks by Frontier Score; 'newest' by paper publication date.",
                "enum": ["score", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82e56b2dab2d86397a56db89e6c68b3b8534debf853aee23ca72567e9f747ae5"
        }
      ],
      "digest": "sha256:070389117337e2c0c03b518fec9803772aae575447e888da7a8d764a0e8a4ad7"
    }
  }
}
