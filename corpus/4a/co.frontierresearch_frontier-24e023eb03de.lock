{
  "lockfileVersion": 2,
  "subjects": {
    "co.frontierresearch/frontier": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://frontierresearch.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "frontier",
        "title": "Frontier",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Frontier (frontierresearch.co) is a public index of new research papers, mostly from the top scientific journals (Nature, Science, Cell, NEJM, The Lancet, PNAS and their families) plus some preprints, updated daily. Each entry has a plain-language summary and, once its editorial is written, why it matters and what to watch next, and a Frontier Score from 0 to 100 built from Evidence (25%), Impact (25%) and Novelty (50%), with a separate confidence label. Use search_breakthroughs to find entries on a topic, latest_breakthroughs for what was added recently, get_breakthrough for one entry's full score breakdown and sources, list_fields for the fields, and explain_frontier_score for the method. When you present an entry, give its Frontier URL and the paper's DOI. Scores of papers published in the last few months are early signals and move as evidence accrues.",
      "tools": [
        {
          "name": "explain_frontier_score",
          "title": "How the Frontier Score works",
          "description": "The Frontier Score method: its three pillars and what each measures, recency, the integrity rule, tiers and confidence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48f0a04044c54f2bbf1311a1ef40f2650d857daa295286c21200fc88f7288930"
        },
        {
          "name": "get_breakthrough",
          "title": "One entry in full",
          "description": "Everything Frontier holds on one entry: the plain-language summary, why it matters and what to watch, authors and institutions, the full Frontier Score breakdown (each pillar and what drives it, recency and confidence) and the sources behind each figure. Accepts an OpenAlex work id (e.g. W7214802080), an entry slug, or a frontierresearch.co entry URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "OpenAlex work id, entry slug, or Frontier entry URL.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77d0ff1f327449d616772c5d7d5f87f90ebb3d29709771a575a02572fbf88878"
        },
        {
          "name": "latest_breakthroughs",
          "title": "Latest scored breakthroughs",
          "description": "What Frontier added most recently: the entries listed in the last N days (the index adds a few new papers from the top journals every day), newest first, optionally within one field.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "How far back to look, in days (1 to 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "field": {
                "description": "Limit to one field (see list_fields).",
                "enum": ["ai", "bio", "neuro", "physics", "quantum", "materials", "climate", "space", "math", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many entries to return (1 to 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3aec412ea513e99d65efcc2bb63696c4d0aa576c20fb8296abc90833ae4be450"
        },
        {
          "name": "list_fields",
          "title": "Fields in the index",
          "description": "The research fields Frontier covers, with how many entries each holds and its median Frontier Score.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd8caa9c74b08bf1cb881e5023c2057d8e4bff64d6f9d4e487318f106dc21f4c"
        },
        {
          "name": "search_breakthroughs",
          "title": "Search scored breakthroughs",
          "description": "Search Frontier's evidence-scored index of new research from the top scientific journals. Matches the query against titles, plain-language summaries, authors and topics, optionally within one field, and returns the matching entries ranked by Frontier Score (or newest paper first), each with its summary, score, Frontier URL and DOI. Leave the query empty to browse a field.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "field": {
                "description": "Limit to one field (see list_fields).",
                "enum": ["ai", "bio", "neuro", "physics", "quantum", "materials", "climate", "space", "math", "other"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many entries to return (1 to 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. 'CRISPR', 'obesity drug', 'quantum error correction'.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "score",
                "description": "'score' ranks by Frontier Score; 'newest' by paper publication date.",
                "enum": ["score", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82e56b2dab2d86397a56db89e6c68b3b8534debf853aee23ca72567e9f747ae5"
        }
      ],
      "digest": "sha256:8bb0bbdf6261c1eeac3123df0ed57162e5f002008f9816bb088b74723fba87a2"
    }
  }
}
