{
  "lockfileVersion": 2,
  "subjects": {
    "app.pepvault/pepvault": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pepvault.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pepvault",
        "title": "PepVault",
        "version": "1.0.0",
        "websiteUrl": "https://pepvault.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PepVault (https://pepvault.app) is a peptide reference site. These tools return its published pages: each compound's reference page and Dose Guide, vial reconstitution charts, study summaries, side-by-side comparisons, a glossary and guides. Every page result is the page's own Markdown with its source URL and last-updated date, the link to cite. Dose figures are the ranges studies used, never a dose for a person, and the reconstitution tool is arithmetic on the numbers given. Start with get_peptide for a named compound, search_pepvault for anything else.",
      "tools": [
        {
          "name": "compare_peptides",
          "title": "Compare two peptides",
          "description": "Get PepVault's side-by-side page for two compounds (for example BPC-157 and TB-500): how they differ and which does what. When no comparison page exists it returns each compound's page link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "a": {
                "description": "The first compound.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "b": {
                "description": "The second compound.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two peptides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:130d0c5295898b458ac36bb6c27c057513b53a8b56a1d1a022e794267a7dd1a4"
        },
        {
          "name": "define_term",
          "title": "Define a peptide term",
          "description": "Get the glossary entry for a peptide or dosing term (half-life, bacteriostatic water, U-100 syringe, titration): what the word means.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              },
              "term": {
                "description": "The word or phrase (\"half-life\", \"bacteriostatic water\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Define a peptide term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:718e865370e969276a2f3d99c806ae8b2cb3181b01e27572087ba4f6209efb7f"
        },
        {
          "name": "get_dose_reference",
          "title": "Get a peptide's dose guide",
          "description": "Get one compound's Dose Guide page: the dose ranges studies used, how often, and a typical run length. For questions about dosing amounts or schedules. These are research ranges, never a dose for a person.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              },
              "name": {
                "description": "The compound's name, a brand name or an alias.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a peptide's dose guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd4d802deacdaa081ac6f5824e55a7fd34141aa765aab0c30415c943c7b8d774"
        },
        {
          "name": "get_page",
          "title": "Get a PepVault page",
          "description": "Get a pepvault.app reference page by its path or URL (for example /guides/where-to-inject-peptides), as its published Markdown. It reads the reference pages listed on pepvault.app, not the pages about the PepVault app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              },
              "path": {
                "description": "A pepvault.app path (\"/peptides/bpc-157\") or URL.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a PepVault page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63fb7719f4d67592402c23cb812104e5ec4c0824952960952669287093d41afc"
        },
        {
          "name": "get_peptide",
          "title": "Get a peptide's reference page",
          "description": "Get one compound's reference page: what it is, the dose range studies used, how often, half-life, side effects and how strong the evidence is. Takes a peptide's or GLP-1's name; brand names and aliases work (Ozempic and Wegovy open semaglutide).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              },
              "name": {
                "description": "The compound's name, a brand name or an alias (\"BPC-157\", \"Ozempic\", \"tirzepatide\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a peptide's reference page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b3f86728cbab3ed637a5c77f085cf82f173a2ad907c6b14ac09b32d7a52cbaa"
        },
        {
          "name": "get_study",
          "title": "Get a study summary",
          "description": "Get one study summary: what the study tested, how it was done, what it found, its limits and the takeaway. Takes the study's slug, its pepvault.app URL or its PubMed id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The study's slug (\"bpc-157-chang-2011\"), its pepvault.app URL, or its PubMed id.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "max_chars": {
                "description": "Return at most this many characters of the page (2000–30000; default the whole page up to 30000).",
                "maximum": 30000,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a study summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fb48f970e985cc54cd9fb345b4ecdd6eab502a79b16655851d8e5f67d3a5801"
        },
        {
          "name": "list_studies",
          "title": "List a peptide's studies",
          "description": "List the study summaries PepVault has published for one compound, each with its page and PubMed link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "The compound's name, a brand name or an alias.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "How many studies, at most (default 10, up to 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a peptide's studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64038b8beda59189694e209a425159809509a90b2c7ce9db472d95d844a0de16"
        },
        {
          "name": "reconstitution",
          "title": "Reconstitution arithmetic",
          "description": "Work out a mixed vial's strength, the units to read on a U-100 insulin syringe for a given amount, and how many doses the vial holds, from the vial's mg, the water's mL and the amount. Arithmetic on the numbers given, the same math as PepVault's calculator, not a dose recommendation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "The compound in the vial, to link its vial chart.",
                "maxLength": 120,
                "type": "string"
              },
              "dose": {
                "description": "The amount to draw, in dose_unit.",
                "type": "number"
              },
              "dose_unit": {
                "description": "The unit of dose.",
                "enum": ["mg", "mcg"],
                "type": "string"
              },
              "syringe_ml": {
                "anyOf": [
                  {
                    "const": 0.3,
                    "type": "number"
                  },
                  {
                    "const": 0.5,
                    "type": "number"
                  },
                  {
                    "const": 1,
                    "type": "number"
                  }
                ],
                "description": "The U-100 insulin syringe's size in mL (0.3, 0.5 or 1), to check the amount fits."
              },
              "vial_mg": {
                "description": "The vial's amount of powder, in mg.",
                "type": "number"
              },
              "water_ml": {
                "description": "The water added, in mL.",
                "type": "number"
              }
            },
            "required": ["dose", "dose_unit", "vial_mg", "water_ml"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calculator_url": {
                "type": "string"
              },
              "dose": {
                "type": "number"
              },
              "dose_unit": {
                "type": "string"
              },
              "doses_per_vial": {
                "type": "number"
              },
              "fits_syringe": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "strength_mg_per_ml": {
                "type": "number"
              },
              "syringe_ml": {
                "type": "number"
              },
              "units_u100": {
                "type": "number"
              },
              "vial_chart_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "vial_mg": {
                "type": "number"
              },
              "volume_ml": {
                "type": "number"
              },
              "water_ml": {
                "type": "number"
              }
            },
            "required": ["calculator_url", "dose", "dose_unit", "doses_per_vial", "note", "strength_mg_per_ml", "units_u100", "vial_chart_url", "vial_mg", "volume_ml", "water_ml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reconstitution arithmetic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fe4a2cfabdea5b67e778b816e657788f7cb3dca6ee307fb71a46100e3c136ac"
        },
        {
          "name": "search_pepvault",
          "title": "Search PepVault",
          "description": "Search PepVault's peptide library, dose guides, vial charts, study summaries, comparisons, glossary and guides. For questions that don't name one compound or term. Returns up to 8 pages with title, URL, type and description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What to look for, in plain words (\"retatrutide half-life\", \"how to mix a 5 mg vial\").",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Only pages of this type.",
                "enum": ["compound", "dose_guide", "vial_chart", "study", "comparison", "glossary_term", "guide", "tool", "news", "question", "goal", "legal_status", "brand", "condition", "stack", "other"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "updated": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "title", "type", "updated", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search PepVault"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae446094c784deb8a4eac2f58ca8d880e9ab4e24e4016e17745061718716845c"
        }
      ],
      "digest": "sha256:14a97eb8e8766bc3f87d4deb49219dd4d87fafdfab93d889614a5d90174ecb06"
    }
  }
}
