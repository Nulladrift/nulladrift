  "subjects": {
    "au.com.trip-planner/camping-australia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.campingaustralia.com.au/mcp"
