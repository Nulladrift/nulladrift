        {
          "name": "search_campsites",
          "title": "Search campsites",
          "description": "Search campsites, caravan parks, free camps and other accommodation by place name, region, state, map coordinates, listing type and features. Returns matching listings with name, location, rating, features and images.\n\nCoverage: Australia (the default), the United States (federal, BLM and national-forest campgrounds plus free camping), Canada, New Zealand, Argentina and Chile. The country parameter selects one country per search; results from different countries are not mixed.\n\nFeature filtering: the features array takes exact feature names, and only listings that have every listed feature are returned. Common names:\nAmenities: Toilets, Showers, Hot Showers, Drinking Water, Power, WiFi Internet, Laundromat, Dump Point, Camp Kitchen\nActivities: Fishing Spot, Beach Fishing, Swimming, Walking, Boating, Boat Ramp, Bird Watching\nAccommodation: Caravans, Caravan Park, Tent Site, Campground, Cabins, Free Camping, Showground\nFacilities: BBQ, Fire Place, Shade, Picnic Tables, Children's Play Facility, Swimming Pool\nRules: Pets Welcome, No Pets, Accessible, Camping Fee, Mobile Phone Coverage\nPet-friendly listings carry 'Pets Welcome'; listings tagged 'No Pets' do not allow pets. get_features returns the complete list.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country to search: 'AU' (Australia, the default), 'US' (United States), 'CA' (Canada), 'NZ' (New Zealand), 'AR' (Argentina) or 'CL' (Chile). Each search covers one country.",
                "enum": ["AU", "US", "CA", "NZ", "AR", "CL"],
                "type": "string"
              },
              "entity_type": {
                "description": "Restrict results to one listing type:\n- 'free_camping': free bush camps and rest areas with overnight stays\n- 'caravan_park': caravan parks with powered/unpowered sites\n- 'campground': managed campgrounds (national parks etc.)\n- 'accom': accommodation (cabins, lodges, holiday parks)\n- 'campsite': individual campsites\n- 'tours': tours and activities\n- 'poi': points of interest, day-use areas, lookouts and picnic spots (no overnight camping)\nOmit to search all types.",
                "enum": ["free_camping", "caravan_park", "campground", "accom", "campsite", "tours", "poi"],
                "type": "string"
              },
              "features": {
                "description": "Exact feature names a listing has to have, e.g. ['Pets Welcome', 'Toilets', 'Swimming Pool']. A listing is returned only if it has all of them. get_features lists the valid names.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results to return (default 6, max 20)",
                "type": "integer"
              },
              "near_latitude": {
                "description": "Latitude for proximity search. AU: -33.8688 Sydney. US: 38.5733 Moab, 37.8651 Yosemite Valley. CA: 51.1784 Banff, 49.2827 Vancouver. NZ: -45.0312 Queenstown, -38.1368 Rotorua, -43.5321 Christchurch, -36.8485 Auckland. AR: -41.13 Bariloche, -32.89 Mendoza, -50.34 El Calafate. CL: -41.32 Puerto Varas, -39.27 Pucón, -51.73 Puerto Natales / Torres del Paine. Set 'country' to match.",
                "type": "number"
              },
              "near_longitude": {
                "description": "Longitude for proximity search. AU: 151.2093 Sydney. US: -109.5498 Moab, -119.5383 Yosemite Valley. CA: -115.5708 Banff, -123.1207 Vancouver. NZ: 168.6626 Queenstown, 176.2497 Rotorua, 172.6362 Christchurch, 174.7633 Auckland. AR: -71.31 Bariloche, -68.84 Mendoza, -72.28 El Calafate. CL: -72.99 Puerto Varas, -71.98 Pucón, -72.51 Puerto Natales / Torres del Paine. Set 'country' to match.",
                "type": "number"
              },
              "query": {
                "description": "Free-text campsite name or place (e.g. 'Byron Bay', 'Moab', 'Banff', 'Queenstown', 'Bariloche', 'Torres del Paine', 'Central Coast'). Facility requirements are matched by the features parameter, not here.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius in kilometres (default 50, use 100-150 for broader search)",
                "type": "number"
              },
              "region": {
                "description": "Region name to search within (e.g. 'South Coast', 'Blue Mountains')",
                "type": "string"
              },
              "state": {
                "description": "Australian state or territory abbreviation (e.g. 'NSW', 'VIC', 'QLD'). Applies to Australian searches only; for other countries use query or near_latitude/near_longitude.",
                "enum": ["NSW", "VIC", "QLD", "SA", "WA", "TAS", "NT", "ACT"],
                "type": "string"
              }
