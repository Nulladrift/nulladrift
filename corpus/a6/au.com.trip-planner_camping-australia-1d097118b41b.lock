      "serverInfo": {
        "name": "camping-australia",
        "title": "Camping Australia",
        "version": "1.5.0",
        "description": "Search campsites, caravan parks and free camps across Australia, the United States (federal, BLM and national-forest campgrounds), Canada, New Zealand, Argentina and Chile; check weather, find fishing spots and gear, and plan road trips. Pass country='US', 'CA', 'NZ', 'AR', 'CL' or 'AU' to search_campsites — results never mix countries."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "bk_cart_add",
          "title": "Add a stay to the booking cart",
          "description": "Add a product to the live booking cart, OR answer a booking question. This is SERVER-DRIVEN and stateful:\n- First add: omit session_key to start a new cart; pass operator_id, product_id, check_in, check_out, adults/children, and quoted_price (the price from bk_operator_availability).\n- The response status is 'added' (item is in the cart) OR 'question_pending' — in which case it returns ONE question and a pending_token. Ask the user EXACTLY that one question, then call bk_cart_add again with the same session_key, the pending_token, and answer={field_id, value}. Repeat until status is 'added'.\nAlways reuse the session_key returned by the previous cart call — never invent one.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults (default 2)",
                "type": "integer"
              },
              "answer": {
                "description": "Answer to the pending booking question",
                "properties": {
                  "field_id": {
                    "description": "The question's fieldId",
                    "type": "string"
                  },
                  "value": {
                    "description": "The user's answer",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "check_in": {
                "description": "Check-in date YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Children (default 0)",
                "type": "integer"
              },
              "operator_id": {
                "description": "Operator id from bk_search_operators (for a new product add)",
                "type": "integer"
              },
              "pending_token": {
                "description": "Token from a prior 'question_pending' response (when answering a booking question)",
                "type": "string"
              },
              "product_id": {
                "description": "Product id from bk_operator_availability",
                "type": "integer"
              },
              "quoted_price": {
                "description": "The price quoted by bk_operator_availability for this product",
                "type": "number"
              },
              "session_key": {
                "description": "Cart session key from a prior cart call. Omit on the very first add to open a new cart.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a stay to the booking cart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c873acf88e45088368c823e15e3a46811998c2365bf37edb574894927bdbf9ec"
        },
        {
          "name": "bk_cart_checkout",
          "title": "Complete booking checkout",
          "description": "Finalise the live booking cart and get the SINGLE checkout URL the user uses to complete payment. TWO-STEP, human-in-the-loop:\n1. Call WITHOUT confirm — this returns the booking summary + total price and NO payment link. Show the traveller the full summary (property, dates, guests, total) and ask them to confirm.\n2. Only after they EXPLICITLY agree, call again with confirm=true to get the secure payment link. Never set confirm=true yourself without the traveller's clear yes.\nPayment happens on the secure checkout page — label the link 'Book now' and never name the booking platform. Never tell the user the booking is 'confirmed' from chat; it's pending until they pay. Only call once the cart is ready (no pending questions) and bk_cart_guest has set the lead guest. The checkout URL covers the whole cart.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Set true ONLY after the traveller has seen the full summary + total and explicitly agreed. Without it, the payment link is withheld and only the summary is returned.",
                "type": "boolean"
              },
              "session_key": {
                "description": "The cart session key",
                "type": "string"
              }
            },
            "required": ["session_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Complete booking checkout"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f690de3e4f685e2c58c8dab46a3b4e612b94bc571149e08756e1586af3276c84"
        },
        {
          "name": "bk_cart_guest",
          "title": "Set booking guest details",
          "description": "Attach the lead guest's contact details to the live booking cart. Live booking requires a name and email to issue a booking. For a signed-in customer, any of first_name / surname / email you omit are prefilled from their account — so you can call this with just the session_key and confirm the prefilled details with them, or pass explicit values to override. Call once the cart has items and before bk_cart_checkout.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Guest email (booking confirmation goes here)",
                "type": "string"
              },
              "first_name": {
                "description": "Guest first name",
                "type": "string"
              },
              "phone": {
                "description": "Optional contact phone",
                "type": "string"
              },
              "session_key": {
                "description": "The cart session key",
                "type": "string"
              },
              "surname": {
                "description": "Guest surname",
                "type": "string"
              }
            },
            "required": ["email", "first_name", "session_key", "surname"],
            "type": "object"
