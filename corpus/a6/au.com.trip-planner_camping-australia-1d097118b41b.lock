        {
          "name": "get_weather_forecast",
          "title": "Weather forecast",
          "description": "Get a daily weather forecast for a campsite or a pair of coordinates. Provide either campsite_name (a full or partial campsite name, resolved to that campsite's stored coordinates) or latitude and longitude.\n\nReturns up to 14 days from the primary forecast provider, or about 10 days when the backup provider answers; the forecast_days field states how many days are included. Each day has max/min temperature, rain chance, rainfall amount, maximum wind speed, UV index, minimum humidity and a condition description, plus sunrise and sunset where available.",
          "inputSchema": {
            "properties": {
              "campsite_name": {
                "description": "Full or partial campsite name (e.g. 'Byron Bay', 'Big4 Morisset'). The first matching campsite's stored coordinates are used.",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the location (e.g. -33.8688 for Sydney)",
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the location (e.g. 151.2093 for Sydney)",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Weather forecast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9d24f197d38e66672530c68fdd9105b9712b00282a951bf9663a5675446160d"
        },
