        {
          "name": "search_campsites",
          "title": "Search campsites",
          "description": "Search for campsites, caravan parks, or accommodation by location, features, and other criteria. Use this when the user asks to find a place to stay, camp, or explore. Returns a list of matching entities with names, locations, ratings, features, and images.\n\nCOVERAGE: Australia (default), the United States (federal, BLM, national-forest campgrounds + free camping), Canada, New Zealand, Argentina AND Chile (campgrounds + free camping). Set the 'country' parameter to 'US' for United States, 'CA' for Canada, 'NZ' for New Zealand, 'AR' for Argentina, 'CL' for Chile, 'AU' for Australia — results never mix countries.\n\nIMPORTANT — Feature filtering:\nWhen users mention specific requirements (pets, pools, toilets, etc.), you MUST pass the correct feature name(s) in the 'features' array. Only campsites that have ALL requested features will be returned.\n\nAVAILABLE FEATURE NAMES (use these exact strings):\nAmenities: Toilets, Showers, Hot Showers, Drinking Water, Power, WiFi Internet, Laundromat, Dump Point, Camp Kitchen\nActivities: Fishing Spot, Beach Fishing, Swimming, Walking, Boating, Boat Ramp, Bird Watching\nAccommodation: Caravans, Caravan Park, Tent Site, Campground, Cabins, Free Camping, Showground\nFacilities: BBQ, Fire Place, Shade, Picnic Tables, Children's Play Facility, Swimming Pool\nRules: Pets Welcome, No Pets, Accessible, Camping Fee, Mobile Phone Coverage\n\nCRITICAL — Pet policy:\n- 'dog friendly' / 'pets allowed' / 'pet friendly' → use feature 'Pets Welcome'\n- NEVER recommend a campsite with 'No Pets' feature to someone wanting pets\n- If the user asks for pet-friendly, ALWAYS include 'Pets Welcome' in features array",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Which country's campsites to search. Set 'US' for United States, 'CA' for Canada, 'NZ' for New Zealand, 'AR' for Argentina, 'CL' for Chile, 'AU' for Australia. Defaults to 'AU'. Results NEVER mix countries — always set this to match the location the user is asking about.",
                "enum": ["AU", "US", "CA", "NZ", "AR", "CL"],
                "type": "string"
              },
              "entity_type": {
                "description": "Filter by listing type. Use when the user specifies what kind of place they want:\n- 'free_camping' — free bush camps, rest areas with overnight stays\n- 'caravan_park' — caravan parks with powered/unpowered sites\n- 'campground' — managed campgrounds (national parks etc)\n- 'accom' — accommodation (cabins, lodges, holiday parks)\n- 'campsite' — individual campsites\n- 'tours' — tours and activities\n- 'poi' — points of interest, day-use areas, lookouts, picnic spots (NO overnight camping)\n\nIf the user just says 'camping' or 'campsites', do NOT set this — search all types.\nIf the user asks for 'free camping', set to 'free_camping'.\nIf the user asks for 'things to do' or 'activities', set to 'tours'.\nIf the user asks for 'day trips' or 'picnic spots', set to 'poi'.",
                "enum": ["free_camping", "caravan_park", "campground", "accom", "campsite", "tours", "poi"],
                "type": "string"
              },
              "features": {
                "description": "REQUIRED features the campsite MUST have. Use exact feature names from the list above. e.g. ['Pet Friendly', 'Toilets', 'Swimming Pool']. All listed features must be present on a campsite for it to be returned.",
                "items": {
                  "type": "string"
