      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "camping-australia",
        "title": "Camping Australia",
        "version": "1.6.1",
        "description": "Search campsites, caravan parks and free camps across Australia, the United States (federal, BLM and national-forest campgrounds), Canada, New Zealand, Argentina and Chile; check weather, find fishing spots and gear, and plan road trips. Pass country='US', 'CA', 'NZ', 'AR', 'CL' or 'AU' to search_campsites — results never mix countries."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "bk_cart_add",
          "title": "Add a stay to the booking cart",
          "description": "Requires sign-in and the booking:cart permission. Add a product to the live booking cart, or answer a question the park asks while adding it.\n- First add: omit session_key to open a new cart, and pass operator_id, product_id, check_in, check_out, adults, children and quoted_price (the price from bk_operator_availability).\n- The response status is 'added' when the item is in the cart, or 'question_pending' with one question from the park and a pending_token. Answering means calling again with the same session_key, the pending_token and answer={field_id, value}; this repeats until the status is 'added'.\nEach response carries the session_key that identifies the cart in later cart calls.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults (default 2)",
                "type": "integer"
              },
              "answer": {
                "description": "Answer to the pending booking question",
                "properties": {
                  "field_id": {
                    "description": "The question's fieldId",
                    "type": "string"
                  },
                  "value": {
                    "description": "The user's answer",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "check_in": {
                "description": "Check-in date YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Children (default 0)",
                "type": "integer"
              },
              "operator_id": {
                "description": "Operator id from bk_search_operators (for a new product add)",
                "type": "integer"
              },
              "pending_token": {
                "description": "Token from a prior 'question_pending' response (when answering a booking question)",
                "type": "string"
              },
              "product_id": {
                "description": "Product id from bk_operator_availability",
                "type": "integer"
              },
              "quoted_price": {
                "description": "The price quoted by bk_operator_availability for this product",
                "type": "number"
              },
              "session_key": {
                "description": "Cart session key from a prior cart call. Omit on the very first add to open a new cart.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a stay to the booking cart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b5de757f665f7218b355c540a3ad0844423326112026b1937d85a74c59223b0"
        },
        {
          "name": "bk_cart_checkout",
          "title": "Complete booking checkout",
          "description": "Requires sign-in and the booking:checkout permission. Finalise the live booking cart in two steps:\n1. Without confirm, it returns the booking summary (property, dates, guests) and total price, with no payment link.\n2. With confirm=true, it returns a single link to the park's secure payment page covering the whole cart. The traveller pays on that page; this connector never takes payment.\nconfirm=true is intended for after the traveller has reviewed the summary and agreed to proceed. The booking stays pending until payment is completed on the payment page. The cart needs no pending questions and a lead guest set with bk_cart_guest.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "true returns the secure payment link; intended for after the traveller has reviewed the summary and total and agreed to proceed. Omitted or false returns only the summary and total.",
                "type": "boolean"
              },
              "session_key": {
                "description": "The cart session key",
                "type": "string"
              }
            },
            "required": ["session_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Complete booking checkout"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9d545cae4800e9ecf4483ffbf0a3f94f7607a525e27081831a967197529dcfb"
        },
        {
          "name": "bk_cart_guest",
          "title": "Set booking guest details",
          "description": "Requires sign-in and the booking:cart permission. Set the lead guest's contact details on the live booking cart; a name and email are needed before checkout. For a signed-in customer, any of first_name, surname and email left out are filled from their Camping Australia account, and explicit values override the account details. Returns the updated cart.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Guest email (booking confirmation goes here)",
                "type": "string"
              },
              "first_name": {
                "description": "Guest first name",
                "type": "string"
              },
              "phone": {
                "description": "Optional contact phone",
                "type": "string"
              },
              "session_key": {
                "description": "The cart session key",
                "type": "string"
              },
              "surname": {
                "description": "Guest surname",
                "type": "string"
              }
            },
            "required": ["email", "first_name", "session_key", "surname"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set booking guest details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b89ed0df7e921078ef69a0e35bc4e7e9d9f5c05eae591454011e61ab4c93c6f"
        },
        {
          "name": "bk_cart_promo",
          "title": "Apply a promo code",
          "description": "Requires sign-in and the booking:cart permission. Apply a promo or discount code to the live booking cart, or remove one with remove=true. A code applied before bk_cart_checkout is reflected in the checkout total. Returns the updated cart.",
          "inputSchema": {
            "properties": {
              "promo_code": {
                "description": "The promo / discount code",
                "type": "string"
              },
              "remove": {
                "description": "True to remove the code instead of applying it",
                "type": "boolean"
              },
              "session_key": {
                "description": "The cart session key",
                "type": "string"
              }
            },
            "required": ["promo_code", "session_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply a promo code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea377e4910167c00297596f4e92b80fa997230ed0d5dbd1fab1fc0699cd033e3"
        },
        {
          "name": "bk_operator_availability",
          "title": "Live park availability and prices",
          "description": "Requires sign-in. Get live products, prices and availability at one bookable operator for specific dates and party size. operator_id comes from bk_search_operators; check_in and check_out are YYYY-MM-DD dates. Returns bookable products with product_id, price, max_guests and an available flag (or, for some caravan parks, an availability grid). The product_id and price are the inputs to bk_cart_add.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adults (default 2)",
                "type": "integer"
              },
              "check_in": {
                "description": "Check-in date YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Number of children (default 0)",
                "type": "integer"
              },
              "operator_id": {
                "description": "Operator id from bk_search_operators",
                "type": "integer"
              }
            },
            "required": ["check_in", "check_out", "operator_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Live park availability and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2f7677de21683dbd33103a6a6ff418ca1227760b0470673368f7b58248fded44"
        },
        {
          "name": "bk_search_content",
          "title": "Search things to do",
          "description": "Requires sign-in. Search curated tourism content (attractions, things to do, local experiences and events) from our booking partner, for questions such as what's on near a place. This content is not part of the campsite directory; accommodation is searched with bk_search_operators. Returns the matching content.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 6)",
                "type": "integer"
              },
              "query": {
                "description": "What to search for (e.g. 'things to do near Jervis Bay')",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search things to do"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f5410c1bd35264e8ed3fae9ee916b46e74cad9da5a2b1f97e017b65019e5915"
        },
        {
          "name": "bk_search_operators",
          "title": "Search bookable caravan parks",
          "description": "Requires sign-in. Find accommodation operators near a set of coordinates that can be booked in real time, with live inventory from our booking partner. This differs from search_campsites, which searches the full Camping Australia directory, including places that cannot be booked online. Returns each operator's operator_id, name, town, state, distance and from-price; operator_id is the input to bk_operator_availability and bk_cart_add.",
          "inputSchema": {
            "properties": {
              "latitude": {
                "description": "Latitude to search around",
                "type": "number"
              },
              "limit": {
                "description": "Max operators (default 15, max 50)",
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude to search around",
                "type": "number"
              },
              "within_km": {
                "description": "Search radius in km (default 30, max ~50)",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search bookable caravan parks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ffa60541a7404eeddbf0a385b21bfc43b89c33011cdfa4eae69c9bbb3cbd328"
        },
        {
          "name": "find_nearest_toilets",
          "title": "Find nearest public toilets",
          "description": "Find the public toilets nearest to a set of coordinates, using data from the National Public Toilet Map. Useful for finding the closest toilet, the closest accessible toilet or the nearest RV dump point. Returns toilets sorted by distance, each with name, address, distance, opening hours, facilities (wheelchair access, baby change, RV dump point, showers, drinking water and more) and a directions link. If none fall inside radius_km, the closest ones are still returned.",
          "inputSchema": {
            "properties": {
              "latitude": {
                "description": "Latitude of the search location.",
                "type": "number"
              },
              "limit": {
                "description": "Max results to return (default 5, max 25).",
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude of the search location.",
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius in km (default 15). If none are within radius, the closest are returned anyway.",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find nearest public toilets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c3f13818c05e18ca8899bfe0dc892012004b2668fcb813c30841ab38c246008"
        },
