      "tools": [
        {
          "name": "niche_angle_propose",
          "title": "Propose angles",
          "description": "Angles on one story (Pro): up to a few distinct stances a reader could take, each with a hook, the take, and the sources that support it. Pass the session_id from a scan and a story_id from its slate. Nothing is written for you; the angles are starting points.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lens": {
                "description": "Optional direction for a regenerated angle set, such as focus on the evidence.",
                "type": "string"
              },
              "regenerate": {
                "description": "Request another set of angles after the selected story's angles are ready. Subject to the account's allowance.",
                "type": "boolean"
              },
              "session_id": {
                "type": "string"
              },
              "story_id": {
                "description": "id from niche_session_state.stories[].id",
                "type": "string"
              }
            },
            "required": ["session_id", "story_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Propose angles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:99b84806f5ed9a90887aab3d46a6fb8afdec0e164dab36ffe10470b39dbcc6db"
        },
        {
          "name": "niche_feed_read",
          "title": "Read a briefing",
          "description": "Read the latest or a dated briefing for a niche: stories, reporting dates, source links, why each story matters, and new or continuing status. Use a slug from https://nicheangle.com/n or a custom niche's URL, such as founders or ai-leaders. Assistant access requires Pro. This reads an existing briefing without starting a scan. A quiet briefing has status=quiet; no_edition means no briefing is available; unknown_niche means the slug was not found.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional edition date, YYYY-MM-DD. Default: the latest edition.",
                "type": "string"
              },
              "niche": {
                "description": "Niche slug, e.g. financial-advisors.",
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a briefing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29c03caee661882dae1eca09b29b570b09125423ff2c7ed9d9ac22acec923114"
        },
        {
          "name": "niche_intelligence_query",
          "title": "Intelligence query",
          "description": "Ask an analyst-shaped question over a fresh scan of a niche (Pro): 'the biggest developments this week', 'what is emerging', 'where money is moving'. Returns the sourced slate plus a short synthesis when requested. Returns a session_id; poll niche_session_state until cp1_awaiting_story. For synthesis, continue polling with wait_until=synthesis and wait=30 until it arrives or a shortfall is reported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Requested number of developments, from 3 to 15. The result can contain fewer when reporting is limited.",
                "maximum": 15,
                "minimum": 3,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional stable key for retries of the same scan, so a retry reuses the original run.",
                "type": "string"
              },
              "lens": {
                "description": "mainstream covers established reporting, emerging emphasizes newer topics, and investment focuses on funding developments.",
                "enum": ["mainstream", "emerging", "investment"],
                "type": "string"
              },
              "recency_strict": {
                "description": "Exclude reporting outside the requested window. Default false; strict windows can return fewer stories.",
                "type": "boolean"
              },
              "source_quality": {
                "default": "balanced",
                "description": "strict prioritizes well-supported stories; balanced is the default; broad includes less-established reporting. Inspect the returned sources before relying on a claim.",
                "enum": ["strict", "balanced", "broad"],
                "type": "string"
              },
              "subject": {
                "description": "The subject/space to investigate (2-200 chars). Specific is better.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "synthesis": {
                "description": "none returns stories only. narratives adds sourced themes across the stories. patterns adds a summary of broader developments. Default none.",
                "enum": ["none", "narratives", "patterns"],
                "type": "string"
              },
              "window": {
                "description": "Reporting window: 24h, week, month, quarter, or year. Pair with recency_strict for a hard cutoff.",
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Intelligence query"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59a5fe1339a13a11da34bf16eb4a3680d1a871513d6ac6cf79a87b81591c93e9"
        },
        {
          "name": "niche_list_sessions",
          "title": "List sessions",
          "description": "List your recent scans: id, the niche you described, status and timestamps. Use it to find a session_id you no longer have.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "description": "Max sessions to return (default 25, max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "niche_contains": {
                "description": "Optional case-insensitive substring filter on the niche input, to find sessions on a topic (e.g. 'walnut').",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many sessions before returning, for paging through history. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "status_filter": {
                "description": "Optional scan status, such as cp1_awaiting_story, cp2_awaiting_angle, complete, or failed.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sessions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:887033859fb75612a7d595e3acc767ad18cf2f7f3db0c47eb685f128b1237c5b"
        },
        {
          "name": "niche_session_cancel",
          "title": "Cancel a session",
          "description": "Cancel a scan that is still running.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "description": "Optional. Surfaced as session.error_message.",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a session"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f20c9729327375d144be9e406953d4b1ee9ce8b29a73a001b6e20cc6ab88438f"
        },
        {
          "name": "niche_session_state",
          "title": "Read session state",
          "description": "Read the current state of a scan: status, the ranked stories with their sources and source information, and any angles already proposed. Poll this after niche_signal_scan or niche_intelligence_query until the slate is ready.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_unpicked": {
                "default": false,
                "description": "When true, return the full candidate set even after picks have been made. Default false (sparse: only the picked story / angle come back). Meaningful only with view='full'; ignored in view='status' (the lean envelope never carries the candidate slate).",
                "type": "boolean"
              },
              "session_id": {
                "description": "session_id from niche_signal_scan.",
                "type": "string"
              },
              "since_status": {
                "description": "Last status received. With wait and wait_until=change, return when it changes.",
                "type": "string"
              },
              "view": {
                "default": "full",
                "description": "status returns a short progress summary. full returns the stories and available angles. Default full.",
                "enum": ["status", "full"],
                "type": "string"
              },
              "wait": {
                "default": 0,
                "description": "Wait up to 30 seconds for progress, then return the current state. Default 0.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "wait_for": {
                "description": "Alias for wait_until. If both are supplied, wait_until takes precedence.",
                "enum": ["change", "checkpoint", "synthesis"],
                "type": "string"
              },
              "wait_until": {
                "default": "change",
                "description": "With wait, return on change, an actionable checkpoint, or completion of synthesis.",
                "enum": ["change", "checkpoint", "synthesis"],
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read session state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b1d38b6f4076e5e9e218e0472b43b055ad202f544d723c447e7a3fa23434624"
        },
        {
          "name": "niche_signal_scan",
          "title": "Discover stories (signal scan)",
          "description": "Scan a niche you describe, right now (Pro). Returns a ranked, sourced slate of the stories people in that field are talking about, with source links, the outlets, and why it matters. For a ready-made briefing use niche_feed_read instead. Assistant access requires Pro. Poll niche_session_state with the returned session_id until status is cp1_awaiting_story; the slate is in `stories`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Optional stable key for retries of the same scan, so a retry reuses the original run.",
                "type": "string"
              },
              "niche": {
                "description": "Niche / beat description (2-200 chars). Specific is better.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "recency": {
                "description": "Reporting window: 24h, week, month, quarter, or year. Pair with recency_strict for a hard cutoff.",
                "type": "string"
              },
              "recency_strict": {
                "description": "Exclude reporting outside the requested window. Default false; strict windows can return fewer stories.",
                "type": "boolean"
              },
              "source_quality": {
                "default": "balanced",
                "description": "strict prioritizes well-supported stories; balanced is the default; broad includes less-established reporting. Inspect the returned sources before relying on a claim.",
                "enum": ["strict", "balanced", "broad"],
                "type": "string"
              },
              "thinking_budget": {
                "default": "balanced",
                "description": "balanced returns a session_id immediately. fast waits briefly for stories and returns them if ready; otherwise poll niche_session_state.",
                "enum": ["fast", "balanced"],
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Discover stories (signal scan)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57c95feaa359b58eac2a01a4ee91b19a6ed7dbfe115655c65ad2a4ff0ce1f3f1"
        },
        {
          "name": "niche_whoami",
          "title": "Who am I (account + capability map)",
          "description": "Orient in one read-only call: your plan (Free or Pro), the tools this server serves, and the endpoint. Assistant access requires Pro. Call it first if you are unsure what is available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who am I (account + capability map)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a12e5cbbe247da23808e750ef63f23ed975403af4757f0fc717302b196b8c01e"
        }
      ],
      "digest": "sha256:e5dd8582a2209b6644cddc95c044411999a96f391bacf89bcadc08c38ab93d73"
    }
  }
