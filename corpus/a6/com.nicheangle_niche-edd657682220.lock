      "serverInfo": {
        "name": "niche-mcp",
        "title": "Niche",
        "version": "2.0.0",
        "websiteUrl": "https://nicheangle.com",
        "icons": [
          {
            "src": "https://nicheangle.com/niche-app-icon-1024.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
