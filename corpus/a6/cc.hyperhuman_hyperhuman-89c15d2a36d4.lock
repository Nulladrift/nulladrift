      "instructions": "Hyperhuman is fitness content infrastructure: browse sample and team workouts, build and update workouts and programs, adapt sessions for a member, create social drops, and get embed or Content API snippets. Guest tools work without sign-in: health_check, list_sample_workouts, get_integration_plan, get_embed_code_samples, and get_workout_details or get_workout_playlist for sample-* ids. list_sample_workouts returns curated samples for guests (isSampleLibrary) and the connected team's workouts after sign-in. Team tools (list_team_workouts, create_workout, drops and similar) need Hyperhuman sign-in. When one returns an auth challenge, the user connects their account; team data is never available without it. Embed and integration snippets use YOUR_ORG_ID and YOUR_API_KEY placeholders only; real API keys and passwords are never returned. Plans and billing are managed at team.hyperhuman.cc; no purchases happen through these tools. Product facts, plans and prices, for reading: https://hyperhuman.cc/llms.txt. health_check confirms the server is reachable.",
      "tools": [
        {
          "name": "adapt_plan",
          "title": "Adapt plan",
          "description": "Adapts an existing program for a user profile. Use when the user wants to customize a program (length, workouts per week, level). Returns the adapted program.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_user_age": {
                "description": "Member's age in years, 16 to 100.",
                "maximum": 100,
                "minimum": 16,
                "type": "integer"
              },
              "end_user_fitness_levels": {
                "description": "Member's fitness level as a one-item list, e.g. [\"intermediate\"]. Values: beginner, intermediate, advanced.",
                "items": {
                  "enum": ["beginner", "intermediate", "advanced"],
                  "type": "string"
                },
                "type": "array"
              },
              "end_user_gender": {
                "description": "Member's gender: \"male\" or \"female\".",
                "enum": ["male", "female"],
                "type": "string"
              },
              "locale": {
                "description": "Language for names and text, as a locale code, e.g. \"en-US\", \"de-DE\" or \"de\". Omit for the default language.",
                "type": "string"
              },
              "max_weeks": {
                "description": "Longest adapted program in weeks, 1 to 52.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              },
              "min_weeks": {
                "description": "Shortest adapted program in weeks, 1 to 52.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              },
              "plan_id": {
                "description": "Program ID to adapt, from list_team_programs or recommend_plans.",
                "minLength": 1,
                "type": "string"
              },
              "team_id": {
                "description": "Not used: this tool works on the signed-in team. Leave it out.",
                "type": "string"
              },
              "user_requirements": {
                "description": "Free-text guidance for the AI, up to 2000 characters, e.g. \"Low impact, no jumping, knee friendly\".",
                "maxLength": 2000,
                "type": "string"
              },
              "workouts_per_week": {
