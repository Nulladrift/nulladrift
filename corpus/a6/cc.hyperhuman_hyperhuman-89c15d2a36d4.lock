        {
          "name": "get_social_analytics",
          "title": "Get social analytics",
          "description": "Reports how the team's social posts perform: publish counts, reach, views and engagement. Use when the user asks how social is doing, which channel works best, or how one post performed. Not for the publishing log (use list_social_automation_events). Returns totals, per-post rows or a paged post list, by report. by_drop and performance need a plan with social post analytics.",
          "inputSchema": {
            "additionalProperties": false,
            "if": {
              "properties": {
                "report": {
                  "const": "by_drop"
                }
              },
              "required": ["report"]
            },
            "properties": {
              "compare_with_previous": {
                "description": "summary only: true adds up/down trends against the previous period of the same length.",
                "type": "boolean"
              },
              "drop_id": {
                "description": "Drop to report on. Required for by_drop; optional for performance to limit rows to that drop. Get it from list_team_drops.",
                "minLength": 1,
                "type": "string"
              },
              "end_date": {
                "description": "Period end (UTC). Set with start_date; omit both for the last 30 days, as YYYY-MM-DD, e.g. \"2026-11-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1. Defaults to 1.",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 100. Defaults to 10.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "performance only: limit rows to one network: instagram, tiktok, youtube, facebook, linkedin or threads.",
                "enum": ["instagram", "tiktok", "youtube", "facebook", "linkedin", "threads"],
                "type": "string"
              },
              "report": {
                "description": "summary = team totals: posts published, skipped, failed, reach and engagement, best channels; by_drop = per-post results for one drop (needs drop_id); performance = every published post with its metrics, paged.",
                "enum": ["summary", "by_drop", "performance"],
                "type": "string"
              },
              "start_date": {
                "description": "Period start (UTC). Set with end_date; omit both for the last 30 days, as YYYY-MM-DD, e.g. \"2026-11-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
