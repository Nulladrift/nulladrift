      "instructions": "Hyperhuman is fitness content infrastructure: browse sample and team workouts, build and update workouts and programs, adapt sessions for a member, create social drops, and get embed or Content API snippets. Guest tools work without sign-in: health_check, list_sample_workouts, get_integration_plan, get_embed_code_samples, and get_workout_details or get_workout_playlist for sample-* ids. list_sample_workouts returns curated samples for guests (isSampleLibrary) and the connected team's workouts after sign-in. Team tools (list_team_workouts, create_workout, drops and similar) need Hyperhuman sign-in. When one returns an auth challenge, the user connects their account; team data is never available without it. Embed and integration snippets use YOUR_ORG_ID and YOUR_API_KEY placeholders only; real API keys and passwords are never returned. Plans and billing are managed at team.hyperhuman.cc; no purchases happen through these tools. Product facts, plans and prices, for reading: https://hyperhuman.cc/llms.txt. health_check confirms the server is reachable.",
