        {
          "name": "create_drop",
          "title": "Create drop",
          "description": "Creates a social drop: a video clip post from an exercise, exercise group, workout, or program, or an AI card post (tip, fact, myth vs fact, insight, trend, quote, offer) from a topic. Use when the user wants to create social media content. Returns the new drop IDs. Nothing is posted publicly.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "kind": {
                    "description": "Clip post: kind is omitted or \"clip\".",
                    "enum": ["clip"]
                  }
                },
                "required": ["source_id", "source_type"]
              },
              {
                "properties": {
                  "kind": {
                    "description": "Clip post: kind is omitted or \"clip\".",
                    "enum": ["clip"]
                  },
                  "source_ids": {
                    "minItems": 1
                  }
                },
                "required": ["source_ids", "source_type"]
              },
              {
                "properties": {
                  "kind": {
                    "description": "Card post: one of the card kinds; topic is optional.",
                    "enum": ["tip", "fact", "myth_fact", "insight", "trend", "quote", "offer"]
                  }
                },
                "required": ["kind"]
              }
            ],
            "properties": {
              "channel_preset": {
                "description": "Social format. Sets aspect ratio, length and copy style. Clip posts: ig_reels, ig_stories, ig_carousel (Instagram square video), tiktok, yt_shorts, fb_reels, yt_longform, fb_post, linkedin_post, threads_post. Card posts: ig_post, ig_stories, fb_post, linkedin_post, threads_post. Single posts only; not used with source_ids. Example: \"ig_reels\".",
                "enum": ["ig_reels", "ig_stories", "ig_carousel", "tiktok", "yt_shorts", "fb_reels", "yt_longform", "ig_post", "fb_post", "linkedin_post", "threads_post"],
                "type": "string"
              },
              "kind": {
                "description": "Post type. \"clip\" (default) = video post from a library item; needs source_type and source_id or source_ids. Card posts (AI-written image slides), with an optional topic: \"tip\", \"fact\", \"myth_fact\" (myth vs fact), \"insight\", \"trend\", \"quote\", \"offer\".",
                "enum": ["clip", "tip", "fact", "myth_fact", "insight", "trend", "quote", "offer"],
                "type": "string"
              },
              "locale": {
                "description": "Language for names and text, as a locale code, e.g. \"en-US\", \"de-DE\" or \"de\". Omit for the default language.",
                "type": "string"
              },
              "source_id": {
                "description": "Clip posts: ID of one item of source_type, from list_team_exercises, list_team_workouts or list_team_programs. Use source_ids for several.",
                "type": "string"
              },
              "source_ids": {
                "description": "Clip posts: up to 7 IDs of the same source_type. Makes one post per ID. Use instead of source_id.",
                "items": {
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "source_type": {
                "description": "Clip posts: what the video is made from. \"exercise\" = one exercise clip; \"exerciseCollection\" = an exercise group (circuit or sets); \"workout\" = a workout; \"workoutCollection\" = a program.",
                "enum": ["exercise", "exerciseCollection", "workout", "workoutCollection"],
                "type": "string"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "title": {
                "description": "Post title shown in Teams. Single clip posts only. Omit to use the source name.",
                "type": "string"
              },
              "topic": {
                "description": "Card posts: what the post is about, up to 200 characters, e.g. \"Mobility for desk workers\". Omit to let the AI pick a topic.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
