        {
          "name": "create_similar_workout",
          "title": "Create a similar workout",
          "description": "Adapts a team workout with AI for a member's level, goals, limits or equipment, as an unsaved draft. Use when the user wants a variant of an existing workout for someone, e.g. a knee-friendly or beginner version. Not for a plain copy (use duplicate_content) or a new workout from scratch (use generate_workout). Returns the draft's steps in build_workout format and the reasons for each change; save it with build_workout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Member's age, 16 to 99, e.g. 34. Omit if unknown.",
                "maximum": 99,
                "minimum": 16,
                "type": "integer"
              },
              "exclude_exercise_collections": {
                "description": "Never use exercises from these library collections, by name, e.g. [\"Free - Eclectic Home\"]. Not with include_exercise_collections.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "exercise_sources": {
                "description": "Where swapped-in exercises may come from, at least one: premium_stock = premium library; free_stock = free library; team_exercises = the team's own videos. E.g. [\"team_exercises\",\"premium_stock\"].",
                "items": {
                  "enum": ["premium_stock", "free_stock", "team_exercises"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "fitness_levels": {
                "description": "Member's fitness levels, first is primary, e.g. [\"intermediate\"]. Values: beginner, intermediate, advanced.",
                "items": {
                  "enum": ["beginner", "intermediate", "advanced"],
                  "type": "string"
                },
                "type": "array"
              },
              "gender": {
                "description": "Member's gender: male, female or other. Omit if unknown.",
                "enum": ["male", "female", "other"],
                "type": "string"
              },
              "goal_ids": {
                "description": "Member's goal IDs from list_team_goals. Omit for the original's goals.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "guideline_id": {
                "description": "Guideline ID from list_programming_guidelines (source=mine). Used with guideline_mode=explicit.",
                "type": "string"
              },
              "guideline_mode": {
                "description": "Programming guideline to follow: auto = best match; none = no guideline; explicit = the one in guideline_id. Omit for the backend default.",
                "enum": ["auto", "none", "explicit"],
                "type": "string"
              },
              "id": {
                "description": "ID of the team workout to adapt. Get it from list_team_workouts.",
                "minLength": 1,
                "type": "string"
              },
              "include_exercise_collections": {
                "description": "Only use exercises from these library collections, by name, e.g. [\"Premium - Studio\"]. Not with exclude_exercise_collections.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "training_days_per_week": {
                "description": "How many days a week the member trains, 1 to 7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "user_guidance": {
                "description": "Free-text context, up to 2000 characters: injuries, space, equipment, likes, e.g. \"Knee pain, no jumping\".",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["exercise_sources", "id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
              }
            },
