        {
          "name": "build_workout",
          "title": "Build a workout",
          "description": "Builds and saves a full workout from ordered exercise and rest steps in one call. Use when the user lists the exercises, reps or times they want, or wants to save a draft from create_similar_workout. Not for AI-generated workouts (use generate_workout) or editing an existing one (use update_workout). Returns the new workout's ID, name and length.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category_ids": {
                "description": "Workout category IDs from list_workout_categories, e.g. for HIIT or Yoga. Omit for none.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "description": "Short description members see on the workout. Omit for none.",
                "type": "string"
              },
              "difficulty": {
                "description": "Level: beginner, intermediate or advanced. Omit to leave unset.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "name": {
                "description": "Workout name, 3 characters or more, e.g. \"Core Blast 20\".",
                "minLength": 3,
                "type": "string"
              },
              "steps": {
                "description": "Ordered steps, 1 to 100. Each is an exercise {exercise_id, reps or duration_seconds, pace?, weight_level?, rpe?} or a rest {rest_seconds}. Needs at least one exercise; the first and last steps can't be rest.",
                "items": {
                  "additionalProperties": false,
                  "description": "One step: an exercise (exercise_id plus reps or duration_seconds) or a rest (rest_seconds only).",
                  "properties": {
                    "duration_seconds": {
                      "description": "Seconds for a timed exercise step, e.g. 40. Set reps or duration_seconds, not both.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "exercise_id": {
                      "description": "Exercise for this step, from list_team_exercises. Leave out on a rest step.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "pace": {
                      "description": "Tempo cue for an exercise step: slow, medium or fast. Omit for none.",
                      "enum": ["slow", "medium", "fast"],
                      "type": "string"
                    },
                    "reps": {
                      "description": "Reps for a reps-based exercise step, e.g. 12. Set reps or duration_seconds, not both.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "rest_seconds": {
                      "description": "Makes this a rest step of this many seconds, e.g. 20. Leave out every exercise field.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "rpe": {
                      "description": "Target effort for an exercise step, 0 to 10 (rate of perceived exertion). Omit or 0 for none.",
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "weight_level": {
                      "description": "Load cue for an exercise step: light, medium or heavy. Omit for none.",
                      "enum": ["light", "medium", "heavy"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "visibility": {
                "description": "public = members can see it in the app; private = team only (private needs a plan that includes it).",
                "enum": ["public", "private"],
                "type": "string"
              }
            },
            "required": ["name", "steps"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
              }
            },
            "required": ["_viewType"],
            "type": "object"
