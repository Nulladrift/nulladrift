        {
          "name": "update_brand_kit",
          "title": "Update Brand Kit",
          "description": "Changes Brand Kit fields; only the fields you send change, and list fields replace the whole list. Use when the user wants to change the brand voice, words to use or avoid, hashtags, offers, review mode or content mix. Not for suggestions from a website (use import_brand_kit) or brand colours (use update_team_settings). Returns the saved Brand Kit. Team managers only. Overwrites the current values.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "always_hashtags": {
                "description": "Hashtags added to every post. Replaces the whole list. Up to 5 items, 40 characters each, e.g. [\"#yourgym\"]. Send [] to clear.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "audience": {
                "description": "Who the posts are for, max 280 characters, e.g. \"Busy parents in Austin starting strength training\".",
                "maxLength": 280,
                "type": "string"
              },
              "avoid_words": {
                "description": "Words and phrases the brand never uses. Replaces the whole list. Up to 10 items, 40 characters each, e.g. [\"shred\",\"bikini body\"]. Send [] to clear.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "banned_claims": {
                "description": "Claims AI copy must never make. Replaces the whole list. Up to 20 items, 60 characters each, e.g. [\"lose weight fast\"]. Send [] to clear.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "brand_book_url": {
                "description": "Public brand book or tone guide (HTML or PDF). Send an empty string to clear it. Public http(s) URL, max 2048 characters, e.g. \"https://yourgym.com/join\".",
                "maxLength": 2048,
                "type": "string"
              },
              "content_mix": {
                "additionalProperties": false,
                "description": "Target share of each content pillar. The four values must add up to 100, e.g. 50/20/20/10.",
                "properties": {
                  "community": {
                    "description": "Percent of posts about members and community, 0 to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "educate": {
                    "description": "Percent of posts that teach, 0 to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "inspire": {
                    "description": "Percent of posts that motivate, 0 to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "promote": {
                    "description": "Percent of posts that sell an offer, 0 to 100.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["community", "educate", "inspire", "promote"],
                "type": "object"
              },
              "disclaimer": {
                "description": "Line added where health claims need it, max 200 characters, e.g. \"Consult your doctor before starting.\"",
                "maxLength": 200,
                "type": "string"
              },
              "emoji_policy": {
                "description": "Emoji in AI copy: none = no emoji; light = one or two; rich = expressive use.",
                "enum": ["none", "light", "rich"],
                "type": "string"
              },
              "hashtag_count": {
                "description": "Hashtags per AI post, 0 to 10, e.g. 4.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "offers": {
                "description": "Offers AI posts may promote. Replaces the whole list. Up to 5. Send [] to clear.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "Offer name, max 60 characters, e.g. \"Free trial week\".",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "pitch": {
                      "description": "One-line pitch for the offer, max 140 characters.",
                      "maxLength": 140,
                      "type": "string"
                    },
                    "url": {
                      "description": "Public http(s) link for the offer, max 2048 characters.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "reference_urls": {
                "description": "Public pages that show the brand. Replaces the whole list. Up to 5 items, 2048 characters each, e.g. [\"https://yourgym.com/about\"]. Send [] to clear.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "review_mode": {
                "description": "Which AI posts wait for approval: facts = fact, myth vs fact, trend and insight posts; all = every AI post; off = none beyond fact posts, which are always held.",
                "enum": ["facts", "all", "off"],
                "type": "string"
              },
              "sample_posts": {
                "description": "Example posts that show the voice. Replaces the whole list. Up to 3 items, 600 characters each, e.g. [\"Small steps, every day…\"]. Send [] to clear.",
                "items": {
                  "maxLength": 600,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "say_words": {
                "description": "Words and phrases the brand loves to use. Replaces the whole list. Up to 10 items, 40 characters each, e.g. [\"strong\",\"consistent\"]. Send [] to clear.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "social_cta_url": {
                "description": "Main link AI posts point people to. Send an empty string to clear it. Public http(s) URL, max 2048 characters, e.g. \"https://yourgym.com/join\".",
                "maxLength": 2048,
                "type": "string"
              },
              "social_tone_preset": {
                "description": "Tone for AI social copy: calm_supportive = gentle and reassuring; energetic_motivational = high energy, push; clinical_educational = expert, evidence-led; friendly = warm and casual; bold = direct and punchy.",
                "enum": ["calm_supportive", "energetic_motivational", "clinical_educational", "friendly", "bold"],
                "type": "string"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "voice_words": {
                "description": "Words that describe the brand voice. Replaces the whole list. Up to 3 items, 24 characters each, e.g. [\"warm\",\"expert\"]. Send [] to clear.",
                "items": {
                  "maxLength": 24,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
              }
            },
            "required": ["_viewType"],
            "type": "object"
          },
