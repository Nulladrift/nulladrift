        {
          "name": "update_team_settings",
          "title": "Update team settings",
          "description": "Changes team settings; only the fields you send change. Covers name, website, description, support email, brand colours, branded-app AI switches and client settings. Use when the user wants to rename the team, turn an app AI feature on or off, change how clients join or tune client status rules. Not for the Brand Kit voice (use update_brand_kit). Returns the saved settings. Team managers only. Overwrites the current values.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_adaptation_enabled": {
                "description": "AI workout and program adaptation in the branded member apps: true = shown, false = hidden.",
                "type": "boolean"
              },
              "ai_chat_enabled": {
                "description": "AI chat in the branded member apps: true = shown, false = hidden.",
                "type": "boolean"
              },
              "ai_generation_enabled": {
                "description": "AI workout and program generation in the branded member apps: true = shown, false = hidden.",
                "type": "boolean"
              },
              "ai_recommendation_enabled": {
                "description": "AI recommended workouts and programs in the branded member apps: true = shown, false = hidden.",
                "type": "boolean"
              },
              "brand_main_color": {
                "description": "Main brand colour for the workout progress bar, as #RRGGBB, e.g. \"#FF5733\". Custom colours need a plan with branding.",
                "pattern": "^#[0-9A-Fa-f]{6}$",
                "type": "string"
              },
              "brand_secondary_color": {
                "description": "Secondary brand colour for the workout progress bar, as #RRGGBB, e.g. \"#33FF57\". Custom colours need a plan with branding.",
                "pattern": "^#[0-9A-Fa-f]{6}$",
                "type": "string"
              },
              "brand_text_color": {
                "description": "Text colour on the workout progress bar, as #RRGGBB, e.g. \"#FFFFFF\". Custom colours need a plan with branding.",
                "pattern": "^#[0-9A-Fa-f]{6}$",
                "type": "string"
              },
              "client_alerts_enabled": {
                "description": "Coach alerts for clients who need action, pain flare-ups and muscle guard: true = on, false = off.",
                "type": "boolean"
              },
              "client_invite_email_enabled": {
                "description": "true = Hyperhuman emails client invites; false = the team sends its own invite emails (invites are still created).",
                "type": "boolean"
              },
              "client_status_thresholds": {
                "additionalProperties": false,
                "description": "Rules for the client roster status (On track, Watch, Act). Fields you leave out keep their current value.",
                "properties": {
                  "act_pct": {
                    "description": "Adherence percent below which a client needs action, 0 to 99. Default 60.",
                    "maximum": 99,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "inactive_days": {
                    "description": "Days without a session before a client needs action, 2 to 60. Default 7.",
                    "maximum": 60,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "on_track_pct": {
                    "description": "Adherence percent at or above which a client is On track, 1 to 100. Default 80.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "clients_join_setting": {
                "description": "How clients join: OPEN = anyone with the link; INVITE_ONLY = only invited people; SUBSCRIPTION_REQUIRED = a paid member subscription is needed.",
                "enum": ["OPEN", "INVITE_ONLY", "SUBSCRIPTION_REQUIRED"],
                "type": "string"
              },
              "description": {
                "description": "Short description of the team for its profile.",
                "maxLength": 2000,
                "type": "string"
              },
              "insights_mode": {
                "description": "Default lens for client insights and digests: coach = training; physio = rehab and pain; weight_management = weight goals; wellness = general well-being.",
                "enum": ["coach", "physio", "weight_management", "wellness"],
                "type": "string"
              },
              "name": {
                "description": "Team name shown to clients, at least 3 characters, e.g. \"Northside Strength\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "support_email": {
                "anyOf": [
                  {
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  }
                ],
                "description": "Inbox that gets copies of member problem reports, e.g. \"help@northside.fit\". Send an empty string to clear it."
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "website": {
                "description": "Team website, e.g. \"https://northside.fit\".",
                "maxLength": 2048,
                "type": "string"
              },
              "workout_set_logging_enabled": {
                "description": "Members log weight and reps during workouts in the member web app and embedded player: true = on, false = off.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
