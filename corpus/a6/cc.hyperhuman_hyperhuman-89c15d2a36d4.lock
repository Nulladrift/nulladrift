        {
          "name": "update_exercise_metadata",
          "title": "Update exercise metadata",
          "description": "Updates exercise metadata (name, description, muscle groups, categories, equipment, skill level, tags, side, coach). Use when the user wants to fix or improve exercise tagging. Only team-owned exercises can be updated; stock exercises are read-only. Provide at least one field to update besides exercise_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Up to 3 exercise categories, e.g. [\"strength\", \"mobility\"]. Replaces the current ones.",
                "items": {
                  "enum": ["strength", "cardio", "mobility", "balance", "endurance", "flexibility", "plyometrics", "recovery", "running"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "category_ids": {
                "description": "Up to 3 exercise categories, e.g. [\"strength\", \"mobility\"]. Older name for categories; used only when categories is not set.",
                "items": {
                  "enum": ["strength", "cardio", "mobility", "balance", "endurance", "flexibility", "plyometrics", "recovery", "running"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "coach": {
