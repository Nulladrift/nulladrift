              },
              "per_page": {
                "description": "Results per page, 1 to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Text to match in client names or emails, e.g. \"ana\". Omit to list everyone.",
                "type": "string"
              },
              "sort": {
                "description": "Order: joined = join date (default); name = A to Z; status = active first; insight_status = Act first, then Watch, then On track.",
                "enum": ["joined", "name", "status", "insight_status"],
                "type": "string"
              },
              "sort_direction": {
                "description": "asc = oldest or A first (default); desc = newest or Z first.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "status": {
                "description": "Membership filter: active = can use the app; suspended = paused by the team; removed = removed by the team; left = left on their own; all = every client. Omit for all.",
