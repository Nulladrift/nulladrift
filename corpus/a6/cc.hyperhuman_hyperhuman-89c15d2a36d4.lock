                "description": "Events to send, 1 or more: workout_session.completed = a member finished a workout; plan.started = a member started a program; plan.progress_updated = program progress changed; plan.completed = a member finished a program; insights.digest_ready = a client insights digest is ready; * = all events, now and future. E.g. [\"workout_session.completed\"].",
                "items": {
                  "enum": ["workout_session.completed", "plan.started", "plan.progress_updated", "plan.completed", "insights.digest_ready", "*"],
