                "type": "string"
              },
              "duration_max": {
                "description": "Longest workout length in minutes, 10 to 90.",
                "maximum": 90,
                "minimum": 10,
                "type": "integer"
              },
              "duration_min": {
                "description": "Shortest workout length in minutes, 10 to 90.",
                "maximum": 90,
                "minimum": 10,
                "type": "integer"
              },
              "end_user_age": {
                "description": "Member's age in years, 16 to 100.",
                "maximum": 100,
                "minimum": 16,
                "type": "integer"
              },
              "end_user_fitness_levels": {
                "description": "Member's fitness level as a one-item list, e.g. [\"intermediate\"]. Values: beginner, intermediate, advanced.",
                "items": {
                  "enum": ["beginner", "intermediate", "advanced"],
                  "type": "string"
                },
                "type": "array"
              },
              "end_user_gender": {
                "description": "Member's gender: \"male\" or \"female\".",
                "enum": ["male", "female"],
                "type": "string"
              },
              "end_user_goal_ids": {
                "description": "Member's goal IDs from list_team_goals, e.g. [\"63c92926f920a9005c4e619c\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exercise_sources": {
