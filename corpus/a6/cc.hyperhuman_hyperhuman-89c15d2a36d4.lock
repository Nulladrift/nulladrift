        {
          "name": "create_similar_program",
          "title": "Create a similar program",
          "description": "Adapts a team program with AI for a member's level, goals, schedule or limits, as an unsaved draft. Use when the user wants a version of an existing program for someone, e.g. 3 days a week or injury-safe. Not for a plain copy (use duplicate_content) or a new program from scratch (use generate_program). Returns the draft's workouts with what was kept, swapped or added; save it with create_program.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Member's age, 16 to 99, e.g. 34. Omit if unknown.",
                "maximum": 99,
                "minimum": 16,
                "type": "integer"
              },
              "fitness_levels": {
                "description": "Member's fitness levels, first is primary, e.g. [\"intermediate\"]. Values: beginner, intermediate, advanced.",
                "items": {
                  "enum": ["beginner", "intermediate", "advanced"],
                  "type": "string"
                },
                "type": "array"
              },
              "gender": {
                "description": "Member's gender: male, female or other. Omit if unknown.",
                "enum": ["male", "female", "other"],
                "type": "string"
              },
              "goal_ids": {
                "description": "Member's goal IDs from list_team_goals. Omit for the original's goals.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "guideline_id": {
                "description": "Guideline ID from list_programming_guidelines (source=mine). Used with guideline_mode=explicit.",
                "type": "string"
              },
              "guideline_mode": {
                "description": "Programming guideline to follow: auto = best match; none = no guideline; explicit = the one in guideline_id. Omit for the backend default.",
                "enum": ["auto", "none", "explicit"],
                "type": "string"
              },
              "id": {
                "description": "ID of the team program to adapt. Get it from list_team_programs.",
                "minLength": 1,
                "type": "string"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "training_days_per_week": {
                "description": "How many days a week the member trains, 1 to 7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "user_guidance": {
                "description": "Free-text context, up to 2000 characters: injuries, space, equipment, likes, e.g. \"Knee pain, no jumping\".",
                "maxLength": 2000,
                "type": "string"
              },
