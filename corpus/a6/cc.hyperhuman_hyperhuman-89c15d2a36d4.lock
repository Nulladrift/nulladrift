        {
          "name": "set_client_coaching",
          "title": "Set client coaching targets",
          "description": "Sets or clears a client's load target on one exercise, and sets their insight mode and daily protein target. Use when the user wants to prescribe a weight for a client, remove that prescription, or change how a client's insights are framed. Not for editing a workout's prescribed weights for everyone (use update_workout). Returns the saved values. Overwrites the previous target or setting; insight settings need client insights in the team plan.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["exercise_id"]
              },
              {
                "required": ["insight_mode"]
              },
              {
                "required": ["protein_target_g"]
              }
            ],
            "properties": {
              "clear_target": {
                "description": "true = remove the coach-set target for exercise_id. Don't combine with weight.",
                "type": "boolean"
              },
              "client_id": {
                "description": "ID of the client (their user ID). Get it from list_clients (the \"id\" of each client), e.g. \"64f1a2b3c4d5e6f7a8b9c0d1\".",
                "minLength": 1,
                "type": "string"
              },
              "exercise_id": {
                "description": "ID of the exercise to set or clear a load target for, 24 hex characters. Get it from list_team_exercises or get_client_session, e.g. \"64f1a2b3c4d5e6f7a8b9c0d1\".",
                "pattern": "^[a-f0-9]{24}$",
                "type": "string"
              },
              "insight_mode": {
                "description": "Lens for this client's insights: auto = clear the override and use the team default; coach = strength and training; physio = rehab and pain; weight_management = weight and nutrition; wellness = general health habits.",
                "enum": ["auto", "coach", "physio", "weight_management", "wellness"],
                "type": "string"
              },
              "protein_target_g": {
                "anyOf": [
                  {
                    "maximum": 400,
                    "minimum": 30,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Daily protein target in grams, 30 to 400, e.g. 120. null clears it."
              },
              "reps": {
                "description": "Target reps at that load, 1 to 100. Optional.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "weight": {
                "description": "Target load for exercise_id, 0.5 to 1000, in weight_unit. Overrides the workout's weight and the suggestion until cleared.",
                "maximum": 1000,
                "minimum": 0.5,
                "type": "number"
              },
              "weight_unit": {
                "description": "Unit of weight: metric = kg; imperial = lb. Required with weight.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["client_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
              }
            },
