        {
          "name": "assign_content_to_client",
          "title": "Assign content to client",
          "description": "Gives a client access to team workouts and programs so they show up in their app. Use when the user wants to assign, share or send a workout or program to a specific client. Not for publishing to every member (set visibility on the workout or program instead). Returns what was assigned. Sends the client an email and a push notification for each item.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["workout_ids"]
              },
              {
                "required": ["program_ids"]
              }
            ],
            "properties": {
              "client_id": {
                "description": "ID of the client (their user ID). Get it from list_clients (the \"id\" of each client), e.g. \"64f1a2b3c4d5e6f7a8b9c0d1\".",
                "minLength": 1,
                "type": "string"
              },
              "program_ids": {
                "description": "IDs of programs to give the client, up to 50. Get them from list_team_programs.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "workout_ids": {
                "description": "IDs of workouts to give the client, up to 50. Get them from list_team_workouts.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
