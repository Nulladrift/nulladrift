        {
          "name": "create_webhook",
          "title": "Create webhook",
          "description": "Adds a webhook endpoint that receives the chosen events as signed HTTPS POSTs. Use when the user wants their server or app told when members finish workouts or programs, or when insights are ready. Not for changing an existing endpoint (use update_webhook). Returns the new endpoint's ID, URL and events; the signing secret is not shown. Team managers only; up to 10 endpoints per team. Starts sending real member events to that URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Note for your team, max 200 characters, e.g. \"Leaderboard service\".",
                "maxLength": 200,
                "type": "string"
              },
              "events": {
                "description": "Events to send, 1 or more: workout_session.completed = a member finished a workout; plan.started = a member started a program; plan.progress_updated = program progress changed; plan.completed = a member finished a program; insights.digest_ready = a client insights digest is ready; * = all events, now and future. E.g. [\"workout_session.completed\"].",
                "items": {
                  "enum": ["workout_session.completed", "plan.started", "plan.progress_updated", "plan.completed", "insights.digest_ready", "*"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "url": {
                "description": "Public HTTPS URL that receives events, max 2048 characters, e.g. \"https://api.yourapp.com/hyperhuman/webhooks\". Private and local addresses are refused.",
                "format": "uri",
                "maxLength": 2048,
                "pattern": "^https:\\/\\/",
                "type": "string"
              }
            },
            "required": ["events", "url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
