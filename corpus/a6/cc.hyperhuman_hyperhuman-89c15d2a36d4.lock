        {
          "name": "import_recording",
          "title": "Import video",
          "description": "Imports a video from a public link, or every video in a shared Google Drive folder, into the team's uploads, where Hyperhuman splits it into exercise clips. Use when the user wants to add exercise videos from a link, Dropbox, Google Drive or a folder of recordings. Not for AI-generated clips (use generate_video_clip). Returns the upload ID and name, or the folder import message. Imported video counts toward the account's video storage minutes; clips appear in list_uploads_to_review when ready.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["url"]
              },
              {
                "required": ["gdrive_folder_url"]
              }
            ],
            "properties": {
              "expected_exercises": {
                "description": "Exercise names in the order they appear, with url only, to guide AI clip naming, e.g. [\"Squat\", \"Lunge\"]. Up to 60.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "gdrive_folder_url": {
                "description": "Shared Google Drive folder link; every video in it is imported, e.g. \"https://drive.google.com/drive/folders/1a2b3c\". Use instead of url.",
                "pattern": "drive\\.google\\.com\\/drive\\/folders\\/[A-Za-z0-9_-]+",
                "type": "string"
              },
              "kind": {
                "description": "What the video is, with url only: multi_exercise = several exercises to split into clips; class = a full class; promo = a promo video; educational = a talk or tutorial. The backend defaults to multi_exercise.",
                "enum": ["multi_exercise", "class", "promo", "educational"],
                "type": "string"
              },
              "name": {
                "description": "Name for the upload, with url only, e.g. \"Lower body session\". Omit to use the file name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Public link to one video file (MP4, MOV and similar, up to 2 GB), e.g. a Dropbox or Google Drive file share link. YouTube, Vimeo pages and streaming playlists are not supported. Use instead of gdrive_folder_url.",
