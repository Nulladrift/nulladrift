        {
          "name": "update_autopilot_task",
          "title": "Update content automation",
          "description": "Changes a Content Autopilot task's rules, schedule, clients or AI guidance; fields you leave out stay as they are. Use when the user wants to edit an automation. Not for turning it on or off (use set_autopilot_task_state); how it makes content and what it makes cannot change (create a new task). Returns the updated task. Overwrites the saved settings; lists replace the old list.",
          "inputSchema": {
            "additionalProperties": false,
            "if": {
              "properties": {
                "programming_guideline": {
                  "const": "explicit"
                }
              },
              "required": ["programming_guideline"]
            },
            "properties": {
              "assign_to_client_user_ids": {
                "description": "Client user IDs who get each new item assigned, up to 100. Get them from list_clients.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "category_ids": {
                "description": "Workout category IDs to pick from, up to 50. Workout tasks. Get them from list_workout_categories.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "custom_prompt_guidance": {
                "description": "Notes for the AI, up to 2000 characters, e.g. \"Low impact, no jumping\". Used with custom, ai_tuned and ai_driven.",
                "maxLength": 2000,
                "type": "string"
              },
              "difficulty_options": {
                "description": "Levels each run picks from, 1 to 3 of beginner, intermediate, advanced, e.g. [\"beginner\", \"intermediate\"].",
                "items": {
                  "enum": ["beginner", "intermediate", "advanced"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "duration_max": {
                "description": "Longest length: minutes for workouts, weeks for programs. At least 1, at least duration_min.",
                "minimum": 1,
                "type": "integer"
              },
              "duration_min": {
                "description": "Shortest length: minutes for workouts, weeks for programs. At least 1, at most duration_max.",
                "minimum": 1,
                "type": "integer"
              },
              "exclude_exercise_collections": {
                "description": "Never use exercises from these collections. Up to 50 exercise collection names, matched case-insensitively, e.g. [\"Kettlebell\"]. Workout tasks only (ai_generate, create_similar). Cannot be combined with the other collection list.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "goal_ids": {
                "description": "Program goal IDs to pick from, up to 50. Program tasks. Get them from list_team_goals.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "include_exercise_collections": {
                "description": "Only use exercises from these collections. Up to 50 exercise collection names, matched case-insensitively, e.g. [\"Kettlebell\"]. Workout tasks only (ai_generate, create_similar). Cannot be combined with the other collection list.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "include_free_stock": {
                "description": "Use Hyperhuman's free stock exercises. Backend default on create: true.",
                "type": "boolean"
              },
              "include_premium_stock": {
                "description": "Use premium stock exercises. Needs premium stock on the plan. Backend default on create: false.",
                "type": "boolean"
              },
              "include_team_content": {
                "description": "Use the team's own exercises (and team workouts for programs). Backend default on create: false.",
                "type": "boolean"
              },
              "name": {
                "description": "Task name shown in Teams, up to 200 characters, e.g. \"Weekly AI workout\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "next_run_at": {
                "description": "First (or next) run, as an ISO 8601 date-time, e.g. \"2026-12-01T09:00:00Z\". The run starts at the top of the hour at or after it. Omit to run when the task is activated.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "programming_guideline": {
                "description": "Programming guideline the AI follows: auto = the team's best-matching saved guideline; none = no guideline; explicit = the one in programming_guideline_id. Not used by publish_existing tasks.",
                "enum": ["auto", "none", "explicit"],
                "type": "string"
              },
              "programming_guideline_id": {
                "description": "ID of a saved programming guideline (Teams > Workout defaults > Programming). Needed when programming_guideline is explicit; setting it alone implies explicit.",
                "minLength": 1,
                "type": "string"
              },
              "prompt_guidance_mode": {
                "description": "Extra direction for the AI: none = task rules only; custom = adds custom_prompt_guidance; ai_tuned = adds the team's last 30 days of stats (plus custom_prompt_guidance if set); ai_driven = AI also picks level, category or goal and length from those stats (ai_generate tasks). Backend default: none.",
                "enum": ["none", "custom", "ai_tuned", "ai_driven"],
                "type": "string"
              },
              "repeat_mode": {
                "description": "How often the task runs: once, daily, weekly, biweekly (every 2 weeks) or monthly.",
                "enum": ["once", "daily", "weekly", "biweekly", "monthly"],
                "type": "string"
              },
              "repeat_until": {
                "description": "Last day the task repeats, as an ISO 8601 date-time, e.g. \"2027-03-31T23:59:59Z\". Omit to repeat with no end. Ignored for once.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "task_id": {
                "description": "ID of the autopilot task. Get it from list_autopilot_tasks.",
                "minLength": 1,
                "type": "string"
              },
              "team_id": {
                "description": "Team to act on. Omit to use the signed-in team.",
                "type": "string"
              },
              "time_zone": {
                "description": "IANA time zone that keeps the run at the same local time, e.g. \"Europe/Bucharest\". Omit to keep the UTC time.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "workouts_per_week_max": {
                "description": "Most workouts per week, 1 to 7, at least workouts_per_week_min. Program tasks only.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "workouts_per_week_min": {
                "description": "Fewest workouts per week, 1 to 7. Program tasks only.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["task_id"],
            "then": {
              "required": ["programming_guideline_id"]
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "_viewType": {
                "type": "string"
              }
            },
            "required": ["_viewType"],
            "type": "object"
