        {
          "name": "get_content_analytics",
          "title": "Get content analytics",
          "description": "Shows member and content analytics for a period: headline KPIs, engagement, top content, program outcomes or demographics. Use when the user asks how members are training, which workouts perform best, program completion, or who their audience is. Not for social post stats or plan usage (use get_team_usage). Returns the report's key numbers, with trends when compare_with_previous is true. Needs a plan with analytics.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compare_with_previous": {
                "description": "true = add up/down/stable trends against the previous period of the same length.",
                "type": "boolean"
              },
              "end_date": {
                "description": "Last day of the period (UTC), included. Defaults to today, as YYYY-MM-DD, e.g. \"2026-11-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "granularity": {
                "description": "Bucket size for the engagement time series: day, week or month. Ignored by other reports.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "report": {
                "description": "Which report: overview = headline KPIs; engagement = sessions, completion and retention; content = top and weakest workouts and programs; programs = enrollments and completions per program; demographics = members by gender, age, fitness level and goal.",
                "enum": ["overview", "engagement", "content", "programs", "demographics"],
                "type": "string"
              },
