              {
                "scopes": ["hyperhuman:internal:read", "hyperhuman:internal:write"],
                "type": "oauth2"
              }
            ],
            "openai/toolInvocation/invoked": "Ready",
            "openai/toolInvocation/invoking": "Loading Hyperhuman Agent Workspace",
            "openai/widgetAccessible": true,
            "securitySchemes": [
              {
                "scopes": ["hyperhuman:internal:read", "hyperhuman:internal:write"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/hyperhuman-app.html",
              "visibility": ["model", "app"]
            }
