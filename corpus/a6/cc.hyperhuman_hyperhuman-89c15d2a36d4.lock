              "difficulty": {
                "description": "Workout level: \"beginner\", \"intermediate\" or \"advanced\".",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "exercise_map": {
                "description": "Ordered workout steps as instance IDs, e.g. [{\"instance_id\": \"…\"}]. Create them with create_exercise_instance and create_rest_instance. The first and last steps can't be rest.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "instance_id": {
                      "description": "Instance ID from create_exercise_instance or create_rest_instance.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["instance_id"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "instances": {
                "description": "Ordered steps as existing instance references: each object carries an instance ID as \"_id\" or \"instance_id\", e.g. [{\"instance_id\": \"…\"}]. Not exercise definitions (build_workout takes those). Same rules as exercise_map.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "Workout name, e.g. \"20-Min Full Body HIIT\".",
