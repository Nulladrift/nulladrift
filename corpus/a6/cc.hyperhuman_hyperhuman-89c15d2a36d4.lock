        {
          "name": "create_exercise_instance",
          "title": "Create exercise instance",
          "description": "Creates an exercise instance with duration/reps, pace, weight, RPE. Use when building a workout manually - create instances for each exercise, then pass instance IDs to create_workout. Stock and team exercises can be used directly via exercise_id.",
          "inputSchema": {
            "additionalProperties": false,
            "else": {
              "required": ["reps"]
            },
            "if": {
              "properties": {
                "time_based": {
                  "const": true
                }
              },
              "required": ["time_based"]
            },
            "properties": {
              "amrap": {
                "description": "true = as many reps as possible in the time. Timed steps only.",
                "type": "boolean"
              },
              "duration_seconds": {
                "description": "Timed steps: work time in seconds, e.g. 30.",
                "minimum": 1,
                "type": "integer"
              },
              "exercise_id": {
                "description": "Exercise ID from list_team_exercises (team or stock exercise).",
                "minLength": 1,
                "type": "string"
              },
              "pace": {
                "description": "Movement pace: \"slow\", \"medium\" or \"fast\".",
                "enum": ["slow", "medium", "fast"],
                "type": "string"
              },
              "reps": {
                "description": "Rep-based steps: number of reps, e.g. 12.",
                "minimum": 1,
                "type": "integer"
              },
              "rpe": {
                "description": "Target effort (RPE), 0 to 10. 0 or omitted = no target.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "skip_intro": {
                "description": "true skips the exercise intro before this step.",
                "type": "boolean"
              },
              "team_id": {
                "description": "Not used: this tool works on the signed-in team. Leave it out.",
                "type": "string"
              },
              "time_based": {
                "description": "true = timed step (needs duration_seconds); false = rep-based step (needs reps).",
                "type": "boolean"
              },
              "weight_level": {
                "description": "Load guidance: \"light\", \"medium\" or \"heavy\".",
                "enum": ["light", "medium", "heavy"],
                "type": "string"
              }
            },
            "required": ["exercise_id", "time_based"],
            "then": {
              "required": ["duration_seconds"]
            },
            "type": "object"
