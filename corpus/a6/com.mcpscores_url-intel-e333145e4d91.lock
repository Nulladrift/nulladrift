{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/url-intel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://url-intel.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/url-intel",
        "title": "MCPFax URL Intelligence",
        "version": "1.0.1",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tells you what is really behind a URL before you follow it: the full redirect chain of a shortened or tracked link, what the server says about itself, and the pages a site publishes. Tool calls are x402-paid in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). resolve_url and url_headers cost $0.005; site_pages $0.008. initialize, ping and tools/list are free, as are request_data and demand_report. Security-header presence is a hygiene signal, NOT a safety verdict. An unreachable host, or a site with no sitemap, is reported honestly and is NOT charged.",
      "tools": [
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just URLs — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95c0ac4250ab62efc97569b423523d20475bb820a44eb3812ce5a81ab6d99b82"
        },
        {
          "name": "resolve_url",
          "title": "Where does this link actually go?",
          "description": "Follow a URL's redirect chain one hop at a time and report every step: each intermediate host and status, the final destination, whether it crossed to a different host, and a cleaned copy with tracking parameters (utm_*, fbclid, gclid and friends) stripped. Use before following or showing a shortened, tracked or unfamiliar link — a shortener cannot hide its destination from this. Stops after 10 hops, and refuses to follow a redirect into private address space. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL to resolve, e.g. a shortened or tracked link.",
                "examples": ["https://bit.ly/example"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa1a1d6b9a7ffe43fb7286352c11603b30fa7870e3ac603428aaa4a9041ffcbb"
        },
        {
          "name": "site_pages",
          "title": "What pages does this site publish?",
          "description": "The pages a site declares in its sitemap, with last-modified dates, located via robots.txt first and the conventional /sitemap.xml second. Use to enumerate a documentation set or a blog archive before deciding what to read, instead of crawling blindly. A sitemap index is reported as such, so you know to call again for the child sitemaps. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum entries to return. Default 200, maximum 1000.",
                "examples": ["200"],
                "type": "string"
              },
              "url": {
                "description": "Site root (e.g. 'https://example.com') or a sitemap URL directly.",
                "examples": ["https://example.com"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:025b8a2a21afd87dd97c02a2e2acfbf8f002ba7bc77a28893e9c2e0845e06245"
        },
        {
          "name": "url_headers",
          "title": "What a host says about itself",
          "description": "Response status, server software, content type, caching, and which of the six standard security headers the host sets or omits. Use to check a URL is live and well-formed before relying on it, or to profile a site cheaply without downloading it. Header presence is a hygiene signal, not a safety verdict — a site can set every header and still be malicious. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL to inspect.",
                "examples": ["https://example.com"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df966ca6f4e6a956fa1b41929754e15b701b0739a1baf16a2ffe9b3fba923d02"
        }
      ],
      "digest": "sha256:f97a80f66384fcc1fb40ccedeea6dc4d457abc2a8fe836512daca13f63fdd276"
    }
  }
}
