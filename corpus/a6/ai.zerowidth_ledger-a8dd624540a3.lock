        {
          "name": "ledger_metrics_get",
          "title": "Read one Ledger metric with its readings",
          "description": "One metric's definition (unit, kind, direction, target, cadence) plus its readings newest first and the open decisions bound to it. Use before answering 'how is X trending?' or before recording a reading against it. `metricId` accepts the id or the snake_case slug from ledger_metrics_list. For an event metric whose readings carry labels, `labels` lists each label and its values, largest total first. Pass `slice` to get the series for part of it (\"new users in DE\"), or `by` to split the series by one label (\"new users by country\"); either returns `series`, summed per `bucket`.",
