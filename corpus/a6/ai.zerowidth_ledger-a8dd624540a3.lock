        {
          "name": "ledger_entries_add_evidence",
          "title": "Attach evidence to a Ledger entry",
          "description": "Records what happened against an open decision — a manual observation the user reports ('the pilot team says triage feels faster'), an implementation note, or a reference to a Caliper run. Evidence is what settlement later reads, so attach it as it arrives and cite it in the lesson. Metric readings attach themselves via ledger_metrics_record_reading — don't duplicate them here. Fails with conflict on superseded entries. Ids come from ledger_entries_list. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "data": {
                "additionalProperties": {},
                "description": "Structured detail worth keeping with the summary.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "entryId": {
                "description": "The entry the evidence is about.",
                "type": "string"
              },
              "kind": {
                "default": "manual",
                "description": "Usually `manual`; `caliper_eval_run` with refId for a run; `implementation` when the change shipped.",
                "enum": ["caliper_eval_run", "manual", "metric_reading", "implementation", "task_run", "verbatim", "source"],
                "type": "string"
              },
              "refId": {
                "description": "Source record id (a Caliper run id, …) when there is one.",
                "maxLength": 100,
                "type": "string"
              },
              "summary": {
                "description": "What happened, in one or two sentences.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["entryId", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Attach evidence to a Ledger entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:22b46d428cbe12ff1e9bc8a810503accebdeaf81a83ba07af2271ef9117511fe"
        },
        {
          "name": "ledger_entries_create",
          "title": "Record a decision, lesson, or observation in the Ledger",
          "description": "Records a memory entry. Every entry is a TITLE (`summary`: one short plain sentence) over a BODY (`rationale`: the detail, markdown welcome) — never put the detail in the title. Three kinds: `decision` — a change being made now; PRE-REGISTRATION IS THE POINT, so `prediction` (what we expect) must be written NOW, before any evidence exists, and never backfilled to match an outcome. `lesson` — a distilled belief the team already holds (`lesson` text required, no prediction). `observation` — a durable fact worth remembering (no prediction): something already true, never something planned. Ideas, pitches, backlog items, and upcoming work are NOT entries — a dated piece of work that carries out a decision is a plan item (ledger_plan_add on that decision), and a running list you keep across runs belongs in a Napkin doc or sheet. When a user states something durable about their business in conversation, offer to capture it as a lesson or observation. When a user shares MEETING NOTES, propose the decisions you find with ledger_entries_draft so they keep or drop each one in Ledger; use this tool for an entry they've asked you to record. Link the Compass pages the entry touches so future consult-before-acting finds it. May return `needs_confirmation` — summarize the entry and wait for approval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "compassPageIds": {
                "description": "Where — Compass page ids this decision touches.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "kind": {
                "default": "decision",
                "description": "decision = a change with a pre-registered expectation; lesson = a belief arriving already settled; observation = a fact that is already true (not a plan, idea, or pitch).",
                "enum": ["decision", "lesson", "observation", "belief"],
                "type": "string"
              },
              "lesson": {
                "description": "What we learned — required for kind=lesson, optional for kind=observation, forbidden on decisions (their lesson is written at settlement).",
                "maxLength": 4000,
                "type": "string"
              },
              "prediction": {
                "description": "Decisions ONLY. What we expect: a list of `claims` plus one shared `deadline`, or `freeform` for room decisions nothing can settle. A claim either REACHES a value (comparator + target, e.g. CTA clicks >= 400) or HOLDS one (`hold`, e.g. newsletter reads no more than 5% below the 28 days before this). Name every number the change is expected to move AND every number it shouldn't cost — a decision that claims only what it hopes will rise gets to pick its own evidence. Set `watch: true` on a number worth following that the decision isn't committing to. When the change aims at part of an event metric (\"new users in Germany\"), narrow the claim with `slice` ({ country: [\"DE\"] }) using label values from ledger_metrics_get — a claim on an event metric settles on the total counted since landing (reach) or events per day (hold).",
                "properties": {
                  "claims": {
                    "default": [],
                    "items": {
                      "properties": {
                        "comparator": {
                          "enum": [">=", "<=", ">", "<", "="],
                          "type": "string"
                        },
                        "evalId": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        },
                        "hold": {
                          "properties": {
                            "days": {
                              "default": 28,
                              "maximum": 365,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "kind": {
                              "const": "pre_landing",
                              "type": "string"
                            },
                            "maxDrop": {
                              "default": 0,
                              "maximum": 1,
                              "minimum": 0,
                              "type": "number"
                            },
                            "maxRise": {
                              "maximum": 1,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["kind"],
                          "type": "object"
                        },
                        "metricId": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        },
                        "slice": {
                          "additionalProperties": {
                            "items": {
                              "maxLength": 100,
                              "minLength": 1,
                              "type": "string"
                            },
                            "maxItems": 50,
                            "minItems": 1,
                            "type": "array"
                          },
                          "propertyNames": {
                            "pattern": "^[a-z][a-z0-9_]{0,39}$",
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "source": {
                          "enum": ["caliper_eval", "metric", "manual"],
                          "type": "string"
                        },
                        "target": {
                          "type": "number"
                        },
                        "unit": {
                          "maxLength": 50,
                          "type": "string"
                        },
                        "watch": {
                          "type": "boolean"
                        }
                      },
                      "required": ["source"],
                      "type": "object"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "deadline": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "freeform": {
                    "maxLength": 2000,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "rationale": {
                "description": "The entry's BODY: the detail under the title — why, context, lists, steps. Markdown is fine here and renders as formatted text.",
                "maxLength": 4000,
                "type": "string"
              },
              "summary": {
                "description": "The entry's TITLE: one short plain sentence naming what we did (decision) or the fact itself (lesson, observation). Plain text, no markdown, at most 280 characters — e.g. \"Newsletter moves to a biweekly cadence\". Everything longer goes in rationale.",
                "maxLength": 280,
                "minLength": 1,
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record a decision, lesson, or observation in the Ledger"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9ff5003cde918502f110b852b1bf83308f406762f769da58f9a1a74ece9f47de"
        },
        {
          "name": "ledger_entries_draft",
          "title": "Propose Ledger entries for review",
          "description": "Writes up to 50 entries as DRAFTS: proposals that stay out of the record until a person confirms each one in Ledger's Drafts view. Use it for entries you found rather than were told — decisions in meeting notes, or a team's past changes read from its tracker, pull requests or launch posts (set `fromHistory: true`). For history: take each claim from what the source said AT THE TIME, set `landedAt` to when it shipped, attach the source URL, and leave `rollout` as full unless the source says otherwise. These read as low confidence because they were written down after the fact; say so plainly rather than overstating them. Tell the person how many drafts are waiting and that they review them under Decisions → Drafts. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "type": "string"
              },
              "drafts": {
                "items": {
                  "properties": {
                    "kind": {
                      "default": "decision",
                      "enum": ["decision", "lesson", "observation", "belief"],
                      "type": "string"
                    },
                    "landedAt": {
                      "description": "When the change took effect: the merge, ship or launch date. Set once.",
                      "format": "date-time",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                      "type": "string"
                    },
                    "lesson": {
                      "maxLength": 4000,
                      "type": "string"
                    },
                    "prediction": {
                      "description": "Decisions only. For history, the claim the source made at the time, not one fitted to what happened since.",
                      "properties": {
                        "claims": {
                          "default": [],
                          "items": {
                            "properties": {
                              "comparator": {
                                "enum": [">=", "<=", ">", "<", "="],
                                "type": "string"
                              },
                              "evalId": {
                                "maxLength": 100,
                                "minLength": 1,
                                "type": "string"
                              },
                              "hold": {
                                "properties": {
                                  "days": {
                                    "default": 28,
                                    "maximum": 365,
                                    "minimum": 1,
                                    "type": "integer"
                                  },
                                  "kind": {
                                    "const": "pre_landing",
                                    "type": "string"
                                  },
                                  "maxDrop": {
                                    "default": 0,
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  },
                                  "maxRise": {
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  }
                                },
                                "required": ["kind"],
                                "type": "object"
                              },
                              "metricId": {
                                "maxLength": 100,
                                "minLength": 1,
                                "type": "string"
                              },
                              "slice": {
                                "additionalProperties": {
                                  "items": {
                                    "maxLength": 100,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "maxItems": 50,
                                  "minItems": 1,
