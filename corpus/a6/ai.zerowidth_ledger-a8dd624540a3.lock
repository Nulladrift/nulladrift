              },
              "dueOn": {
                "description": "A calendar day, YYYY-MM-DD.",
                "type": "string"
              },
              "endTime": {
                "description": "Same-day end, after startTime.",
                "type": "string"
              },
              "entryId": {
                "description": "The open decision this carries out.",
                "type": "string"
              },
              "note": {
                "maxLength": 2000,
                "type": "string"
              },
              "ownerUserId": {
                "description": "A workspace member's user id.",
                "type": "string"
              },
              "repeatWeeklyUntil": {
                "description": "Also add a copy every 7 days through this day.",
                "type": "string"
              },
              "startTime": {
                "description": "Omit for an all-day item. 24-hour HH:MM in timeZone.",
                "type": "string"
              },
              "tags": {
                "description": "What kind of work it is: blog, video, social, event… Reuse the workspace's existing tags (see ledger_plan_list).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "timeZone": {
                "description": "IANA zone the time is in (America/Chicago). Required with startTime; use the user's own zone.",
