                              "description": "Entire homes, plus homes whose type is not recorded (unknown_type).",
                              "type": "integer"
                            },
                            "private_rooms": {
                              "type": "integer"
                            },
                            "shared_rooms": {
                              "type": "integer"
                            },
                            "total": {
                              "type": "integer"
                            },
                            "unknown_type": {
                              "description": "Counted inside homes: nothing on record says whether these are whole homes.",
                              "type": "integer"
