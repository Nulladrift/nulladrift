        {
          "name": "get_live_quote",
          "title": "Get a live total price",
          "description": "Live price for one property and one stay. stay_total includes cleaning, fees and taxes; nightly rates exclude them. If a stay is too short, it returns the coded MIN_STAY_NOT_MET error and the applicable threshold in error.details.minimum_nights. Also returns the refundable deposit hold, which is separate from the total, the payment schedule, and that home's own cancellation and check-in terms. The top-level totals and cancellation are the non-refundable rate; rate_options lists every rate on offer with its own terms, total and booking_url, including a refundable rate with its free-cancellation deadline when check-in is more than 30 days away (a cancellation by then refunds everything paid except the 3.5% card processing fee). Returns a booking_url the guest opens to complete the booking and accept the rental terms on Luxury Lodging's own site; this tool does not book or take payment. An optional coupon_code is applied to the rent before the rates are priced, as on the website, so when the code applies every total includes it; when it does not, the totals are the price without it and the coupon field says why. The booking_url carries the code only when it applied, and the code is checked again at booking. Amounts ending in _minor are integer cents in `currency`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD.",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD.",
                "type": "string"
              },
              "coupon_code": {
                "description": "A coupon code the guest was given. Optional. When it applies, the totals and every rate's total include it, and the discount appears in price_breakdown and as a negative row in quote.charges. A code that does not apply, or that nobody issued, leaves the price unchanged and is reported in coupon with its reason. A code tied to one guest's email is reported as not found. A quote does not reserve a use of a code, and the code is checked again when the guest books, so it may no longer apply then.",
                "maxLength": 40,
                "type": "string"
              },
              "guests": {
                "description": "Everyone staying, including children and infants.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "How many pets the guest is bringing, 0 to 4; 0 or leave out for none. true means one pet and false none. This changes the price: some homes charge per pet or per pet per night.",
                "maximum": 4,
                "minimum": 0,
                "type": ["integer", "boolean"]
              },
              "property_id": {
                "description": "Property id or slug.",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "property_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A live total for one stay. When available is false only property_id, available, reason, booking_url and a short quote block are present.",
            "properties": {
              "available": {
                "type": "boolean"
              },
              "booking_url": {
                "description": "Where the guest completes the booking on Luxury Lodging's own site, for the non-refundable rate. It names the coupon only when the coupon applied.",
                "type": "string"
              },
              "cancellation": {
                "description": "This home's own cancellation terms for the non-refundable rate, which stay_total prices. Each entry in rate_options carries its own terms, and those are the only refund terms that apply to that rate.",
                "type": "string"
              },
              "check_in": {
                "type": "string"
              },
              "check_in_from": {
                "type": "string"
              },
              "check_out": {
                "type": "string"
              },
