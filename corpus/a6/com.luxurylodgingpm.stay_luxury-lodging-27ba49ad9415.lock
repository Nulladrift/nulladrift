      "instructions": "EscapeStays is the direct booking site of Luxury Lodging, a professional property manager. The prices are the manager's own rates. Tools. search_properties returns homes for a place, dates, group size and filters. With dates it returns available homes, each with a stay_total; without dates no search or comparison row carries a price. list_markets returns each city with homes, its state or region and country, how many homes it has and the largest group a home sleeps there. compare_properties returns side-by-side facts and policies for 2 to 5 homes, with a stay_total for each when dates are given; a row with details_available false has not loaded its details, and get_property_details returns them for that home. get_property_details returns one home's facts, amenities, house rules and its own check-in time, deposit and pet policy; policies.minimum_nights is the general policy baseline, not a promise for every date. get_availability reports a hint from calendar minimums in its range, while rules can be stricter for particular arrival dates. An exact quote checks a specific stay; a too-short stay returns MIN_STAY_NOT_MET with details.minimum_nights. get_availability returns open and blocked nights; it does not price a stay. get_live_quote returns the live price of one stay, including its exact pet fee, and a booking_url. Prices. stay_total is the price of the whole stay and includes cleaning, fees and taxes. A nightly rate, including from_price_per_night where it appears, is a starting rate that excludes cleaning, fees and taxes; it is not the price of a stay. Every stay price these tools return is an all-in total. A row with no stay_total has not been priced for those dates: get_availability shows whether the nights are open, and the row does not mean the home is booked out or ready to book. Without check-in and check-out dates no stay has been priced. A stay of 28 nights or more gets 10% off its rent automatically (the monthly stay discount, not cleaning, fees or taxes); its stay_total already includes it. quote_expires_at is when a quote lapses; after it the price of the stay can differ from the quoted stay_total until get_live_quote prices the stay again. A quote does not hold the home. Search coverage. A busy market can hold more homes than one search can price. unpriced_in_time counts the matching homes the search did not price, and those homes are unknown, not unavailable; unpriced_property_ids lists up to 30 of them, and get_live_quote prices any one of those ids. pet_policy_unknown counts matching homes whose pet policy could not be verified, which is also unknown, not a prohibition. An empty or short result with either count above zero is a partial result. price_all_matches on search_properties prices every matching home in the market, and a higher limit prices more of them; a narrower place covers fewer homes. Counts of free homes and the cheapest home are complete only when both counts are zero. Payment. When check-in is more than 60 days away the guest pays 50% at booking (total_due_now) and the balance is charged automatically to the same card 60 days before check-in; closer stays are paid in full. get_live_quote's payment_schedule says which applies. A refundable security deposit hold applies to every booking and is separate from stay_total. Cancellation terms are set per quote and rate, not per site. get_live_quote returns rate_options, one entry per rate on offer, each with its own stay_total, cancellation text, refundable flag and booking_url. The non-refundable rate is offered on every stay. When check-in is more than 30 days away a refundable rate is also offered, 8% higher on the nightly subtotal, cancellable until free_cancel_until; on a cancellation by then the 3.5% card processing fee is non-refundable and everything else paid is refunded in full. The quote block carries cancellation_policy_id, cancellation_summary and refundable for the rate that quote prices. The cancellation terms returned with a quote are the terms of that rate. Home facts. Each home has its own check-in time, deposit, pet policy and house rules, returned by get_property_details. accommodation_type and bathroom_sharing say what the guest rents: a private_room or shared_room is not an entire home, and either field can be unknown. Location is neighbourhood-level, and a market's country can be null. No tool returns a street address; the exact address is sent to the guest with check-in instructions before arrival. A market's collection_url is a public page. Reviews. guest_reviews are the home's own 4 and 5 star reviews from Airbnb or Booking.com, each with its source. review_count counts those reviews and is not an average rating; no average rating is returned. Coupons. A live quote and a booking link take an optional coupon_code. When the code applies, stay_total, every rate's total and the signed booking_url total include it, the discount is a negative row in quote.charges, and booking_url carries the code. When it does not apply, or nobody issued it, the answer is the normal undiscounted quote with a coupon field that says why; that is not an error. A code tied to one guest's email is reported as not found. A quote does not reserve a use of a code, and the code is checked again when the guest books, so it may no longer apply then. Booking. These tools cannot book a stay. booking_url, returned with each quote and rate, opens Luxury Lodging's own site, where the guest pays by card or Link and accepts the rental terms. get_booking_link returns the URL a guest books a dated stay from. It takes the same property_id, dates, guests and pets and returns a link for the stay without a repeated quote; opening that link does not reserve the home. First-time guests complete a quick ID and selfie check through Stripe within 24 hours of booking (2 hours if arriving within 2 days); if it is not completed, the booking is cancelled with a full refund. Errors. A failed call carries a code. NO_MATCHES, INVALID_DATES, MIN_STAY_NOT_MET, CAPACITY_EXCEEDED, QUOTE_EXPIRED, PRICE_CHANGED, INVENTORY_CHANGED, INVALID_INPUT and NOT_FOUND describe the request or the stay. UPSTREAM_UNAVAILABLE and RATE_LIMITED are temporary: the call can be repeated, and neither says anything about whether a home is booked. Questions outside what these tools cover are handled at reservations@luxurylodgingstr.com.",
      "tools": [
        {
          "name": "compare_properties",
          "title": "Compare homes side by side",
          "description": "Compares 2 to 5 homes in one call: size, the amenities guests choose by, review counts, each home's own check-in time, deposit and pet policy, and with dates, availability and the stay total for each, for a guest deciding between specific homes. Each home carries `accommodation_type` and `bathroom_sharing`: a private room or shared room is not an entire home. Without dates no price is returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD. Totals are returned only when both dates are given.",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD.",
                "type": "string"
              },
              "guests": {
                "description": "Everyone staying, including children and infants.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "How many pets the guest is bringing, 0 to 4; 0 or leave out for none. true means one pet and false none. Totals include the pet fee for that many pets.",
                "maximum": 4,
                "minimum": 0,
                "type": ["integer", "boolean"]
              },
              "property_ids": {
                "description": "Property ids or slugs from search results or booking links.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["property_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compared": {
                "type": "integer"
              },
              "dates_checked": {
                "type": "boolean"
              },
              "homes": {
                "items": {
                  "properties": {
                    "accommodation_type": {
                      "description": "What the guest rents: an entire home, a private room in a shared building or a shared room. A private room or shared room is not an entire home. unknown means the type is not recorded for this home.",
                      "enum": ["entire_home", "private_room", "shared_room", "unknown"],
                      "type": "string"
                    },
                    "available": {
                      "description": "Only present when dates were given. A reason of not_checked means this home's availability could not be read, not that it is booked.",
                      "type": "boolean"
                    },
                    "avg_per_night": {
                      "description": "No longer returned; stay_total is the price of the stay.",
                      "type": "number"
                    },
                    "bathroom_sharing": {
                      "description": "Whether the guest has a private bathroom or shares one. unknown means it is not recorded for this home.",
                      "enum": ["private", "shared", "unknown"],
                      "type": "string"
                    },
                    "bathrooms": {
                      "type": ["number", "null"]
                    },
                    "bedrooms": {
                      "type": ["number", "null"]
                    },
                    "booking_url": {
                      "type": "string"
                    },
                    "check_in_from": {
                      "type": "string"
                    },
                    "check_out_by": {
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "detail_note": {
                      "type": "string"
                    },
                    "details_available": {
                      "description": "Only present, and only false, when this home's record could not be loaded. Such a row carries no name, place, amenity or review fields at all; detail_note says why.",
                      "type": "boolean"
                    },
                    "from_price_note": {
                      "description": "Deprecated, no longer returned along with from_price_per_night.",
                      "type": "string"
                    },
                    "from_price_per_night": {
                      "description": "Deprecated, no longer returned: only a row with a confirmed stay_total carries a price. Kept in this schema so existing clients still validate.",
                      "type": ["number", "null"]
                    },
                    "highlights": {
                      "description": "Up to three short phrases describing what sets the home apart.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "neighbourhood": {
                      "description": "Neighbourhood-level location only; the exact address is shared after booking.",
                      "type": ["string", "null"]
                    },
                    "nights": {
                      "type": ["integer", "null"]
                    },
                    "pet_fee": {
                      "description": "The fee for one pet, from the fee table the quote charges from; with several pets a live quote charges it as pet_fee_basis says (per pet, per pet per night) and states the total in price_breakdown.pet_fee. Null when the home charges none; omitted when it could not be verified, and pet_fee_note says why.",
                      "type": ["number", "null"]
                    },
                    "pet_fee_basis": {
                      "enum": ["per stay", "per night", "per pet", "per pet per night"],
                      "type": "string"
                    },
                    "pet_fee_note": {
                      "type": "string"
                    },
                    "pet_policy_note": {
                      "type": "string"
                    },
                    "pets_allowed": {
                      "description": "Omitted when pet policy could not be verified.",
                      "type": "boolean"
                    },
                    "property_id": {
                      "type": "integer"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "review_count": {
                      "description": "How many 4- and 5-star reviews this home has. It is a count, not a rating; no average rating exists for any home.",
                      "type": "integer"
