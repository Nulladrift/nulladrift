        {
          "name": "get_availability",
          "title": "Get availability calendar",
          "description": "Open and blocked nights for one property over a date range of up to 93 days. `minimum_nights` is the smallest positive `min_stay` value among calendar dates returned in that range. It is a hint; individual arrival dates may require more. This result shows which alternative dates are open but does not price or confirm a stay. An exact quote determines eligibility and price for a specific stay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_date": {
                "description": "Last date to check, YYYY-MM-DD. At most 93 days after start_date.",
                "type": "string"
              },
              "property_id": {
                "description": "Property id or slug.",
                "type": "string"
              },
              "start_date": {
                "description": "First date to check, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["end_date", "property_id", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "blocked_dates": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "end_date": {
                "type": "string"
              },
              "minimum_nights": {
                "description": "The smallest positive min_stay value among calendar dates returned for the requested range. It is a hint, not a guarantee that every arrival is allowed. An exact quote checks a specific stay.",
                "type": ["number", "null"]
              },
              "nights_blocked": {
                "type": "integer"
              },
              "nights_open": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "open_dates": {
                "description": "YYYY-MM-DD nights that are open. They still have to satisfy minimum stay and arrival rules.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "property_id": {
                "type": "integer"
              },
              "start_date": {
                "type": "string"
              }
            },
            "required": ["blocked_dates", "end_date", "nights_blocked", "nights_open", "note", "open_dates", "property_id", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get availability calendar"
          },
          "behavior": {
            "destructive": false,
