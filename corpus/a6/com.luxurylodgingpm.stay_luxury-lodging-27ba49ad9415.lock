                      "type": "array"
                    },
                    "security_deposit_hold": {
                      "type": ["number", "null"]
                    },
                    "sleeps": {
                      "type": ["integer", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "stay_total": {
                      "type": "number"
