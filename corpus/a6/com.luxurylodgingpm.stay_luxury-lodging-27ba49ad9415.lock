                    },
                    "type": "array"
                  },
                  "nightly_subtotal_minor": {
                    "description": "Rent for the nights before any discount, plus the refundable-rate premium when that rate is quoted.",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "nights": {
                    "type": ["integer", "null"]
                  },
                  "optional_fees_minor": {
                    "description": "Fees the guest chose, the pet fee for the pets in this quote.",
