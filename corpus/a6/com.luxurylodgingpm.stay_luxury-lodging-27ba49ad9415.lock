        {
          "name": "get_booking_link",
          "title": "Get a booking link",
          "description": "A link to Luxury Lodging's own site that opens checkout for one home, dates, party size and rate, for the same stay, rate and attribution as a live quote's booking_url, carrying a freshly signed quote token. It checks the stay the way a live quote does: valid dates, the home's guest limit and its pet policy, and it re-prices the stay to sign the link without returning the total. An optional coupon_code is priced into the signed total the same way a live quote prices it, and the link carries the code only when it applied. Opening the link does not reserve the home, hold dates or take payment; the guest completes checkout on EscapeStays. The price of the stay is the all-in total, which includes cleaning, fees and taxes; a nightly rate excludes them and is not the price of a stay. Neither the link nor this result carries a street address; the exact address is sent to the guest with check-in instructions before arrival.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD.",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD.",
                "type": "string"
              },
              "coupon_code": {
                "description": "A coupon code the guest was given. Optional. When it applies, the link's signed total includes it and the link carries the code, so the website prices the stay the same way. A code that does not apply, or that nobody issued, leaves the price unchanged and is reported in coupon with its reason. A code tied to one guest's email is reported as not found. A quote does not reserve a use of a code, and the code is checked again when the guest books, so it may no longer apply then.",
                "maxLength": 40,
                "type": "string"
              },
              "guests": {
                "description": "Everyone staying, including children and infants. The link opens on this party size.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "How many pets the guest is bringing, 0 to 4; 0 or leave out for none. true means one pet and false none. The link keeps the number of pets, and the stay is refused when the home does not allow them.",
                "maximum": 4,
                "minimum": 0,
                "type": ["integer", "boolean"]
              },
              "property_id": {
                "description": "Property id or slug.",
                "type": "string"
              },
              "quote_id": {
                "description": "The quote.quote_id from a live quote for this stay, echoed back unchanged. It is not checked against current pricing.",
                "maxLength": 64,
                "type": "string"
              },
              "rate": {
                "description": "Which rate the link opens on. Defaults to non_refundable, the rate a live quote's booking_url opens on. refundable is offered only while check-in is more than 30 days away.",
                "enum": ["refundable", "non_refundable"],
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "guests", "property_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A booking link for one stay. Opening it does not reserve the home.",
            "properties": {
              "booking_url": {
                "description": "Where the guest completes the booking on Luxury Lodging's own site. The link a live quote returns for this stay and rate: the same home, dates, party, rate, coupon and attribution, with a freshly signed quote token (so its quote_ref differs from the quote's). It names the coupon only when the coupon applied.",
                "type": "string"
              },
              "canonical_url": {
                "description": "The home's property page, not the booking link.",
                "type": "string"
              },
              "check_in": {
                "type": "string"
              },
              "check_out": {
                "type": "string"
              },
              "confirms_booking": {
                "description": "False on every response: the link does not book, hold or pay for anything.",
                "enum": [false],
                "type": "boolean"
              },
              "coupon": {
                "description": "What happened to the coupon_code that was sent. Only returned when one was sent. The stay's totals already include the coupon when applied is true and are the price without it when applied is false.",
                "properties": {
                  "amount_off": {
                    "description": "Dollars taken off the stay's rent. Only when applied is true; it is already inside the totals.",
                    "type": "number"
                  },
                  "applied": {
                    "description": "True when the code took money off this stay.",
                    "type": "boolean"
                  },
                  "code": {
                    "description": "The code as sent, in upper case.",
                    "type": "string"
                  },
                  "label": {
                    "description": "What the discount is called. Only when applied is true.",
                    "type": "string"
                  },
                  "message": {
                    "description": "A sentence the guest can read about the code.",
                    "type": "string"
                  },
                  "reason": {
                    "description": "Why the code did not apply. Only when applied is false. unknown: no such code. unavailable: the code could not be checked just now.",
                    "enum": ["unknown", "inactive", "expired", "not_started", "wrong_market", "wrong_home", "requires_attribution", "no_discountable_amount", "outside_offer_window", "blacked_out", "minimum_nights", "already_used", "unavailable"],
                    "type": "string"
                  }
                },
                "required": ["applied", "code", "message"],
                "type": "object"
              },
              "guests": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "pets": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "pricing_note": {
                "description": "States that the stay was re-priced to sign the link, and that the total is not returned here.",
                "type": "string"
              },
              "property_id": {
                "type": "integer"
              },
              "quote_id": {
                "description": "The quote_id sent with the request, echoed unchanged. Absent when none was sent.",
                "type": "string"
              },
              "rate": {
                "description": "The rate the link opens on.",
                "enum": ["refundable", "non_refundable"],
                "type": "string"
              }
            },
            "required": ["booking_url", "canonical_url", "check_in", "check_out", "confirms_booking", "guests", "note", "pets", "pricing_note", "property_id", "rate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
