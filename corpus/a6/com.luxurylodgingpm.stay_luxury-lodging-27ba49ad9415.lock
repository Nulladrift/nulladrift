        {
          "name": "search_properties",
          "title": "Search Luxury Lodging homes",
          "description": "Searches Luxury Lodging's directly bookable vacation rentals by destination, dates, group size, bedrooms and amenities. With dates, only homes confirmed available are returned, each with a stay total that includes cleaning, fees and taxes; nightly rates exclude them. Interchangeable units of the same type are returned once, with every unit's id listed in `similar_units` so any of them can still be quoted and booked; `limit` counts those results, while `total_matching` counts the individual homes confirmed available. A busy market can hold more homes than one request can price, so `unpriced_in_time` counts matching homes whose availability was not established: they are unknown, not unavailable, and `unpriced_property_ids` lists the property_id of up to 30 of them, each of which can be priced individually with a live quote. Pet-friendly searches also report `pet_policy_unknown`: otherwise matching homes with unverified pet policies, with or without dates. While either count is above zero, the results are not the whole market; `price_all_matches`, a higher `limit`, or a narrower place covers more of it. Without dates no price is returned. Each result carries `accommodation_type` and `bathroom_sharing`: a private room or shared room is not an entire home. Optional filters cover accommodation type, exact bedrooms, required amenities and a budget; results can be paged with `cursor`, and `completeness` is partial when a matching home was left unpriced or unchecked. A query that names a known landmark or area (\"near McCormick Place\") returns homes within `radius_miles` of it, nearest first, each with `distance_miles` and `distance_type` straight_line: a direct distance, not a driving or walking route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodation_type": {
                "description": "What the guest rents. Homes whose type is not recorded are left out and counted in accommodation_type_unknown.",
                "enum": ["entire_home", "private_room", "shared_room"],
                "type": "string"
              },
              "amenities": {
                "description": "Amenities every returned home has, as recorded by the property manager. The same hard filter as amenities_required, except a home with no amenity data is left out without being counted.",
                "items": {
                  "enum": ["pool", "hot_tub", "parking", "wifi", "kitchen", "washer", "pets"],
                  "type": "string"
                },
                "type": "array"
              },
              "amenities_preferred": {
                "description": "Amenities that order homes when the requested sort ties, and appear in match_reasons. Homes lacking them stay in the results.",
                "items": {
                  "enum": ["pool", "hot_tub", "parking", "wifi", "kitchen", "washer", "pets"],
                  "type": "string"
                },
                "type": "array"
              },
              "amenities_required": {
                "description": "Amenities every returned home has. A home whose amenity data is unavailable fails the filter and is counted in amenities_unknown.",
                "items": {
                  "enum": ["pool", "hot_tub", "parking", "wifi", "kitchen", "washer", "pets"],
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms_min": {
                "description": "Fewest bathrooms acceptable.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms_exact": {
                "description": "Exactly this many bedrooms; 0 is a studio. Cannot be sent together with bedrooms_min.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "bedrooms_min": {
                "description": "Fewest bedrooms acceptable.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "budget": {
                "additionalProperties": false,
                "description": "A spending limit. scope total compares amount with each home's stay total including cleaning, fees and taxes, and needs check_in and check_out. scope nightly compares it with each home's starting nightly rate, which excludes cleaning, fees and taxes. amount, currency and scope are all required.",
                "properties": {
                  "amount": {
                    "description": "The limit, in the stated currency.",
                    "exclusiveMinimum": 0,
                    "maximum": 1000000,
                    "type": "number"
                  },
                  "currency": {
                    "description": "Only USD is supported.",
                    "enum": ["USD"],
                    "type": "string"
                  },
                  "scope": {
                    "description": "total: the whole stay, with dates. nightly: the starting nightly rate, excluding fees and taxes.",
                    "enum": ["total", "nightly"],
                    "type": "string"
                  }
                },
                "required": ["amount", "currency", "scope"],
                "type": "object"
              },
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD. Availability is checked only when both dates are given.",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD.",
                "type": "string"
              },
              "cursor": {
                "description": "The next_cursor value of the previous response, valid only with the same other inputs. Returns the page after it.",
                "type": "string"
              },
              "guests": {
                "description": "Everyone staying, including children and infants.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "How many properties to return (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Market or city name, when the guest named one exactly.",
                "type": "string"
              },
              "max_total": {
                "description": "Budget for the whole stay in dollars, including cleaning, fees and taxes. Applies only when dates are given.",
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number, starting at 1, counted in units of page_size. Cannot be sent together with cursor.",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Results per page, up to 20. Takes the place of limit when both are sent.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "How many pets the guest is bringing, 0 to 4; 0 or leave out for none. true means one pet and false none. Results are limited to pet-friendly homes, dated totals include the pet fee for that many pets, and booking links keep the number of pets.",
                "maximum": 4,
                "minimum": 0,
                "type": ["integer", "boolean"]
              },
              "price_all_matches": {
                "description": "Prices every matching home rather than a fast sample, so total_matching is the real count and the cheapest result is genuinely the cheapest. Slower, and still bounded: unpriced_in_time counts any homes it did not reach.",
                "type": "boolean"
              },
              "query": {
                "description": "Free text place, e.g. 'Tampa', a neighbourhood, or a landmark such as 'near McCormick Place, Chicago'. A known Chicago landmark or area (McCormick Place, Navy Pier, Wrigley Field, O'Hare Airport, the South Loop and others) returns homes within radius_miles, nearest first, with a straight-line distance. Text that names no city, state, neighbourhood or landmark is refused with INVALID_INPUT; it is not answered as an empty, complete result.",
                "type": "string"
              },
              "radius_miles": {
                "description": "How far from a named landmark or area to search, in whole miles, 1 to 25. Homes are included by the distance they state, to the nearest half mile. Defaults to 5 for a landmark and 3 for an area. Ignored for any other place.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "total_price_* needs dates and orders by the stay total; from_price_asc orders by a starting rate that is not returned, and with dates by the stay total; sleeps_desc puts the largest homes first.",
                "enum": ["total_price_asc", "total_price_desc", "from_price_asc", "sleeps_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accommodation_type_unknown": {
                "description": "Otherwise matching homes left out of an accommodation_type search because no type is recorded for them. They are not confirmed to be another type. 0 when the filter was not sent.",
                "type": "integer"
              },
              "amenities_unknown": {
                "description": "Otherwise matching homes left out of an amenities_required search because no amenity data is available for them. They are not confirmed to lack the amenity. 0 when the filter was not sent.",
                "type": "integer"
              },
              "availability_note": {
                "type": "string"
              },
              "budget_applied": {
                "description": "Only returned when a budget was sent: what it was compared with.",
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "compared_to": {
                    "description": "stay_total includes cleaning, fees and taxes; from_price_per_night is a starting nightly rate that excludes them.",
                    "enum": ["stay_total", "from_price_per_night"],
                    "type": "string"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "homes_not_checked": {
                    "description": "Matching homes the budget could not be checked against: unpriced for a total budget, no starting rate for a nightly one.",
                    "type": "integer"
                  },
                  "includes_fees_and_taxes": {
                    "type": "boolean"
                  },
                  "note": {
                    "type": "string"
                  },
                  "scope": {
                    "enum": ["total", "nightly"],
                    "type": "string"
                  }
                },
                "required": ["amount", "compared_to", "currency", "includes_fees_and_taxes", "note", "scope"],
                "type": "object"
              },
              "budget_unverified": {
                "description": "Otherwise matching homes left out of a nightly budget search because no starting nightly rate is on record. 0 when the budget was not sent or was a total budget.",
                "type": "integer"
              },
              "budget_unverified_property_ids": {
                "description": "The property_id of up to 30 of the homes counted in budget_unverified; each can be priced for specific dates with a live quote.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 30,
                "type": "array"
              },
              "completeness": {
                "description": "complete: no matching home is unpriced, and none was left out for an unknown pet policy, accommodation type, amenity data, starting rate or position. partial: at least one is, so the results may omit a home that matches.",
                "enum": ["complete", "partial"],
                "type": "string"
              },
              "dates_checked": {
                "description": "False means availability is unknown and no stay has been priced; no row carries a stay_total.",
                "type": "boolean"
              },
              "distance_unknown": {
                "description": "Only on a landmark or area search: otherwise matching homes left out because no position is recorded for them, so their distance is unknown. They are not confirmed to be outside the radius.",
                "type": "integer"
              },
              "has_more": {
                "description": "True when more results follow this page in the same ordering, within the priced sample. Homes counted in unpriced_in_time are not part of any page and have no effect on this.",
                "type": "boolean"
              },
              "matches": {
                "description": "How many results this response carries.",
                "type": "integer"
              },
              "next_cursor": {
                "description": "The value to send as cursor, with every other input unchanged, to get the next page. Null when has_more is false.",
                "type": ["string", "null"]
              },
              "offset": {
                "description": "How many results precede this page in the full ordering.",
                "type": "integer"
              },
              "page_size": {
                "description": "How many results this page asked for.",
                "type": "integer"
              },
              "pet_policy_unknown": {
                "description": "Otherwise matching homes omitted from a pet-friendly search because their pet policy is unknown, not confirmed to prohibit pets. Applies with or without dates; included in unpriced_in_time when dated. A positive count means the pet-friendly inventory is incomplete.",
                "type": "integer"
              },
              "properties": {
                "items": {
                  "properties": {
                    "accommodation_type": {
                      "description": "What the guest rents: an entire home, a private room in a shared building or a shared room. A private room or shared room is not an entire home. unknown means the type is not recorded for this home.",
                      "enum": ["entire_home", "private_room", "shared_room", "unknown"],
                      "type": "string"
                    },
                    "availability_status": {
                      "description": "available: confirmed available for the requested dates when this answer was produced. not_checked: no dates were given, so availability was not checked.",
                      "enum": ["available", "not_checked"],
                      "type": "string"
                    },
                    "avg_per_night": {
                      "description": "No longer returned; stay_total is the price of the stay.",
                      "type": "number"
                    },
                    "avg_per_night_display": {
                      "type": "string"
                    },
                    "bathroom_sharing": {
                      "description": "Whether the guest has a private bathroom or shares one. unknown means it is not recorded for this home.",
                      "enum": ["private", "shared", "unknown"],
                      "type": "string"
                    },
                    "bathrooms": {
                      "type": ["number", "null"]
                    },
                    "bedrooms": {
                      "type": ["number", "null"]
                    },
                    "booking_url": {
                      "description": "Where the guest completes the booking on Luxury Lodging's own site.",
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "content_updated_at": {
                      "description": "When the property manager's record of this home last changed, ISO 8601, as the provider states it. Omitted when the provider gives no such time.",
                      "type": "string"
                    },
                    "data_checked_at": {
                      "description": "When this home's availability and price were fetched, ISO 8601. Only present on a row whose stay was priced.",
                      "type": "string"
                    },
                    "distance_miles": {
                      "description": "Only on a landmark or area search: how far this home is from it, in miles, rounded to the nearest 0.5 (0.5 means under 0.5 mile), as a straight line over the ground, not a driving or walking route.",
                      "type": "number"
                    },
                    "distance_type": {
                      "description": "Only with distance_miles: how the distance was measured. straight_line is the direct distance, shorter than any route.",
                      "enum": ["straight_line"],
                      "type": "string"
                    },
                    "from_price_note": {
                      "description": "Deprecated, no longer returned along with from_price_per_night.",
                      "type": "string"
                    },
                    "from_price_per_night": {
                      "description": "Deprecated, no longer returned: only a row with a confirmed stay_total carries a price. Kept in this schema so existing clients still validate.",
                      "type": ["number", "null"]
                    },
                    "highlights": {
                      "description": "Up to three short phrases describing what sets the home apart.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "match_reasons": {
                      "description": "Short statements of why this home passed the filters that were sent, e.g. \"2 bedrooms (exact)\" or \"has parking\". On a landmark search the first is the distance, e.g. \"1.5 mi from McCormick Place (straight line)\" or \"under 0.5 mi from McCormick Place (straight line)\". Empty when no filter was sent.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "missing_or_unverified": {
                      "description": "Facts about this home that could not be verified, drawn from: pet policy, amenities, accommodation type.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "neighbourhood": {
                      "description": "Neighbourhood-level location only; the exact address is shared after booking.",
                      "type": ["string", "null"]
                    },
                    "nights": {
                      "type": "integer"
                    },
                    "photo": {
                      "type": ["string", "null"]
                    },
                    "property_id": {
                      "type": "integer"
                    },
                    "property_type": {
                      "type": ["string", "null"]
                    },
                    "review_count": {
                      "description": "How many 4- and 5-star reviews this home has. It is a count, not a rating; no average rating exists for any home.",
                      "type": "integer"
                    },
                    "review_sources": {
                      "description": "Which platforms those reviews came from.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "similar_units": {
                      "description": "Only present when interchangeable units of this type exist; any of these ids can be quoted and booked.",
                      "properties": {
                        "count": {
                          "type": "integer"
                        },
                        "note": {
                          "type": "string"
                        },
                        "property_ids": {
                          "items": {
                            "type": "integer"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["count", "note", "property_ids"],
                      "type": "object"
                    },
                    "sleeps": {
                      "type": ["integer", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "stay_total": {
                      "description": "Total for the requested dates including cleaning, fees and taxes. Only present when dates were given and the home was priced.",
                      "type": "number"
                    },
                    "stay_total_display": {
                      "type": "string"
                    },
                    "top_amenities": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["availability_status", "booking_url", "city", "highlights", "match_reasons", "missing_or_unverified", "name", "property_id", "review_count", "review_sources", "top_amenities"],
                  "type": "object"
                },
                "type": "array"
              },
              "search_scope": {
                "description": "The place actually searched and how it was read.",
                "properties": {
                  "place": {
                    "description": "The place searched; null when no place was given and every home was searched.",
                    "type": ["string", "null"]
                  },
                  "radius_miles": {
                    "description": "How far from its centre or point homes are included; given for a metro, landmark or area.",
                    "type": "number"
                  },
                  "type": {
                    "description": "metro: the metro area around the named city, within radius_miles. state: the whole state. city: homes in the named city. nearby_or_text: homes near the place or whose listing text matches it. landmark: homes within radius_miles of a named landmark, nearest first, by straight-line distance. area: the same, measured from the centre of a named area such as the South Loop.",
                    "enum": ["all_homes", "metro", "state", "city", "nearby_or_text", "landmark", "area"],
                    "type": "string"
                  }
                },
                "required": ["place", "type"],
                "type": "object"
              },
              "searched_location": {
                "type": ["string", "null"]
              },
              "status": {
                "description": "NO_MATCHES: nothing matched and nothing is unknown (unpriced_in_time and pet_policy_unknown are both 0). It is a normal answer, not an error. Any other search is OK, even with no results, and unpriced_in_time and pet_policy_unknown say what is still unknown.",
                "enum": ["OK", "NO_MATCHES"],
                "type": "string"
              },
              "total_matching": {
                "description": "How many individual homes matched, counting every interchangeable unit.",
                "type": "integer"
              },
              "total_matching_groups": {
                "description": "How many distinct unit types matched.",
                "type": "integer"
              },
              "unpriced_in_time": {
