                    "description": "Why the code did not apply. Only when applied is false. unknown: no such code. unavailable: the code could not be checked just now.",
                    "enum": ["unknown", "inactive", "expired", "not_started", "wrong_market", "wrong_home", "requires_attribution", "no_discountable_amount", "outside_offer_window", "blacked_out", "minimum_nights", "already_used", "unavailable"],
