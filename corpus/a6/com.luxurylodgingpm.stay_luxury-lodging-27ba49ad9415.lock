        {
          "name": "get_property_details",
          "title": "Get property details",
          "description": "Full detail for one property: bedrooms, capacity, amenities recorded by the property manager, photos, house rules and the real check-in, check-out, deposit and pet policies for that specific home. `policies.minimum_nights` is the general policy baseline; calendar restrictions can require more on particular dates. Dated availability reports calendar rules, and an exact quote checks whether a specific stay meets them. Location is given at neighbourhood level; the exact address is shared after booking. Guest reviews are a selection of 4- and 5-star reviews, each with its source; no average rating exists. `accommodation_type` and `bathroom_sharing` say whether the guest rents an entire home or a room: a private room or shared room is not an entire home.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "property_id": {
                "description": "Property id or the slug from a booking link.",
                "type": "string"
              }
            },
            "required": ["property_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accommodation_type": {
                "description": "What the guest rents: an entire home, a private room in a shared building or a shared room. A private room or shared room is not an entire home. unknown means the type is not recorded for this home.",
                "enum": ["entire_home", "private_room", "shared_room", "unknown"],
                "type": "string"
              },
              "alias": {
                "type": ["string", "null"]
              },
              "amenities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "amenities_source": {
                "enum": ["provider", "unavailable"],
                "type": "string"
              },
              "bathroom_sharing": {
                "description": "Whether the guest has a private bathroom or shares one. unknown means it is not recorded for this home.",
                "enum": ["private", "shared", "unknown"],
                "type": "string"
              },
              "bathrooms": {
                "type": ["number", "null"]
              },
              "bedrooms": {
                "type": ["number", "null"]
              },
              "beds": {
                "type": ["number", "null"]
              },
              "booking_url": {
                "type": "string"
              },
              "common_questions": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "type": ["string", "null"]
              },
              "guest_reviews": {
                "description": "A selection of 4- and 5-star reviews, not a summary of every review. No overall or average rating is implied or available.",
                "properties": {
                  "reviews": {
                    "items": {
                      "properties": {
                        "published": {
                          "type": ["string", "null"]
                        },
                        "source": {
                          "description": "The platform the review was left on.",
                          "type": "string"
                        },
                        "stars": {
                          "type": ["number", "null"]
                        },
                        "text": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["source"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "selection": {
                    "type": "string"
                  }
                },
                "required": ["reviews", "selection"],
                "type": "object"
              },
              "house_rules": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "location": {
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "description": "Null when the provider gave none; the country is then unknown.",
                    "type": ["string", "null"]
                  },
                  "neighbourhood": {
                    "description": "Neighbourhood-level location only; the exact address is shared after booking.",
                    "type": ["string", "null"]
                  },
                  "state": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["city", "country"],
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "photos": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "policies": {
                "description": "This home's own policies, not portfolio defaults, when policies_source is \"provider\".",
                "properties": {
                  "cancellation": {
                    "type": "string"
                  },
                  "check_in_from": {
                    "type": "string"
                  },
                  "check_in_until": {
                    "type": ["string", "null"]
                  },
                  "check_out_by": {
                    "type": "string"
                  },
                  "minimum_nights": {
                    "description": "The general minimum from this home's policy source. It is a baseline, not a promise that every date allows a stay this short; date-specific calendar rules can be higher. An exact quote checks the requested dates.",
                    "type": ["number", "null"]
                  },
                  "pet_fee": {
                    "description": "The fee for one pet, from the fee table the quote charges from; with several pets a live quote charges it as pet_fee_basis says (per pet, per pet per night) and states the total in price_breakdown.pet_fee. Null when the home charges none; omitted when it could not be verified, and pet_fee_note says why.",
                    "type": ["number", "null"]
                  },
                  "pet_fee_basis": {
                    "description": "How pet_fee applies. Per night multiplies by the nights; per pet by the number of pets; per pet per night by both.",
                    "enum": ["per stay", "per night", "per pet", "per pet per night"],
                    "type": "string"
                  },
                  "pet_fee_note": {
                    "type": "string"
                  },
                  "pet_policy_note": {
                    "type": "string"
                  },
                  "pets_allowed": {
                    "description": "Omitted when pet policy could not be verified.",
                    "type": "boolean"
                  },
                  "policies_source": {
                    "enum": ["provider", "portfolio-default"],
                    "type": "string"
                  },
                  "quiet_hours": {
                    "properties": {
                      "from": {
                        "type": "string"
                      },
                      "to": {
                        "type": "string"
                      }
                    },
                    "required": ["from", "to"],
                    "type": ["object", "null"]
                  },
                  "security_deposit_hold": {
                    "description": "A refundable hold, not part of the total charged at booking.",
                    "type": "number"
                  }
                },
                "required": ["cancellation", "check_in_from", "check_out_by", "policies_source", "security_deposit_hold"],
                "type": "object"
              },
              "property_id": {
                "type": "integer"
              },
              "property_type": {
                "type": ["string", "null"]
              },
              "sleeps": {
                "type": ["integer", "null"]
              },
              "support_email": {
                "type": "string"
              }
            },
            "required": ["amenities", "amenities_source", "booking_url", "guest_reviews", "house_rules", "location", "name", "photos", "policies", "property_id", "support_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get property details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
