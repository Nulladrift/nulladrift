                    }
                  },
                  "required": ["booking_url", "property_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["compared", "dates_checked", "homes", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
