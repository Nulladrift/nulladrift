        {
          "name": "get_revenue_summary",
          "title": "Summarize invoiced and paid amounts",
          "description": "Use this when someone asks how much they invoiced or were paid in a period, like last month. Returns invoice and payment counts and totals in the business currency, invoices by status and a collection rate; defaults to the last 90 days, at most 366, skipping drafts and counting at most 500 documents. Not for a single invoice or customer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "Business id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "endDate": {
                "description": "Last UTC day to include, YYYY-MM-DD, at most 366 days after startDate; defaults to today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "First UTC day to include, YYYY-MM-DD; defaults to 89 days before endDate (a 90-day window)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collectedAmount": {
                "description": "Sum of the payments recorded in the range, whatever their status; not proof of bank settlement",
                "type": "number"
              },
              "collectionRatePercent": {
                "description": "collectedAmount as a percentage of invoicedAmount; null when a total is incomplete or nothing was invoiced",
                "type": ["number", "null"]
              },
              "currency": {
                "anyOf": [
                  {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ISO 4217 alpha-3 business currency, or null when unset"
              },
              "invoiceAmountMissingCount": {
                "minimum": 0,
                "type": "integer"
              },
              "invoiceCount": {
                "minimum": 0,
                "type": "integer"
              },
              "invoiceCountIsLowerBound": {
                "type": "boolean"
              },
              "invoiceStatusBreakdown": {
                "description": "Non-draft invoices issued in the range, per status, with count and amount. Aggregates only: invoice, payment, customer, line-item, processor, card, bank, note and identifier data are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "amountMissingCount": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["DRAFT", "PENDING", "PARTIALLY_PAID", "PAID", "OVERDUE", "REFUNDED", "UNCOLLECTIBLE", "UNKNOWN", "OTHER"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "amountMissingCount", "count", "status"],
                  "type": "object"
                },
                "maxItems": 9,
                "type": "array"
              },
              "invoicedAmount": {
                "type": "number"
              },
              "paymentAmountMissingCount": {
                "minimum": 0,
                "type": "integer"
              },
              "paymentCount": {
                "minimum": 0,
                "type": "integer"
              },
              "paymentCountIsLowerBound": {
                "type": "boolean"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "endDate": {
                    "$ref": "#/properties/range/properties/startDate"
                  },
                  "startDate": {
                    "description": "UTC calendar date in YYYY-MM-DD format",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["endDate", "startDate"],
                "type": "object"
              }
            },
            "required": ["collectedAmount", "collectionRatePercent", "currency", "invoiceAmountMissingCount", "invoiceCount", "invoiceCountIsLowerBound", "invoiceStatusBreakdown", "invoicedAmount", "paymentAmountMissingCount", "paymentCount", "paymentCountIsLowerBound", "range"],
            "type": "object"
          },
