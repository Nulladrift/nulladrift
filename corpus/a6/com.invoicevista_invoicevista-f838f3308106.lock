                    "type": "string"
                  },
                  "street": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "customerId": {
                "description": "Customer id: 24 lowercase hexadecimal characters.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "email": {
                "description": "New email address for their invoices.",
                "maxLength": 254,
                "type": "string"
              },
              "expectedLastEditTime": {
                "description": "The customer's lastEditTime as last read; a customer changed since then is refused.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "New language for their invoices and messages, as a code such as en or it.",
                "maxLength": 10,
                "type": "string"
              },
              "legalEntity": {
                "description": "What kind of customer this is.",
