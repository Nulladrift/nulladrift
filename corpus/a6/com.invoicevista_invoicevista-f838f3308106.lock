        {
          "name": "update_customer",
          "title": "Update a customer's details",
          "description": "Use this when someone asks to change a customer's name, email, phone, tax id, address or language. Returns the customer's id, name, business and which fields changed; contact details, tax ids and addresses are never returned. Not for adding a new customer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Billing address lines to change. Lines left out keep their stored value.",
                "properties": {
                  "city": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "countryCode": {
                    "maxLength": 2,
                    "type": "string"
