                "properties": {
                  "businessId": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastEditTime": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lowStock": {
                    "type": "boolean"
                  },
                  "minimumQuantity": {
                    "anyOf": [
                      {
                        "maximum": 1000000000,
                        "minimum": 0,
