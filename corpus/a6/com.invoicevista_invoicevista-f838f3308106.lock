          "name": "set_inventory_quantity",
          "title": "Update a stock quantity",
          "description": "Use this when someone asks to correct or update how much of an item a business has in stock, such as after a count or a delivery. Returns the item with its previous and new quantity; the number given replaces the stored one. Not for adding a new stock item.",
