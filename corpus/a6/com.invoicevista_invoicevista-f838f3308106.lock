                "description": "Stock item id: 24 lowercase hexadecimal characters.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "quantity": {
                "description": "The quantity now in stock, in the item unit. It replaces the stored quantity rather than adding to it.",
                "maximum": 1000000000,
                "minimum": 0,
