      "instructions": "# Billing operations with InvoiceVista\n\nUse the InvoiceVista MCP connector only after the user connects InvoiceVista\nand authorizes the intended organization. If OAuth fails, ask them to connect\nInvoiceVista. Never request, embed, repeat or infer an API key, password, OAuth\ntoken, payment credential, bank detail, processor id or webhook secret.\n\n## What the connector changes\n\nEvery tool is idempotent, tenant-scoped and closed-world. Three of them write:\n`create_customer` and `update_customer` add and change a customer of the\nuser's own business, and `set_inventory_quantity` sets one stock count. Before\nany of them, show the user exactly what will be saved and wait for their yes.\nEvery other tool is read-only. The writes need the `invoicevista:write`\npermission: a connection made before they existed holds read access only, so\nwhen a write tool is missing, ask the user to disconnect and reconnect\nInvoiceVista and allow changes.\n\nBeyond those three, the connector cannot create, edit, delete or send an\ninvoice, payment or quote, delete a customer, charge, retry, refund, settle,\ntransfer or otherwise move money. It cannot contact customers or give an\nindividualized financial decision. Direct the authorized operator to\nInvoiceVista's first-party controls for other changes and to a qualified\nprofessional for advice.\n\n## Identifier and tenant handling\n\nOwned business ids chain the reads: resolve one with `list_businesses`, then\nreuse that exact id for summaries, catalog, plan and stock. A customer id comes\nonly from `find_customer` and a stock item id only from\n`list_inventory_items`, each with the `lastEditTime` its change needs. Never\nguess an id or treat an opaque id as authority; the InvoiceVista API rechecks\nOAuth product, scope, live user membership and organization on every request.\nA cross-tenant id returns not found or an authorization error.\n\nProduct rows and subscription results deliberately have no persisted record\nids because none is needed for another connector tool.\n\n## Available tools\n\n| Tool                         | Use it when someone asks…                                                                |\n| ---------------------------- | ---------------------------------------------------------------------------------------- |\n| `list_businesses`            | which businesses they invoice from; also resolves the business ID every other tool needs |\n| `get_business`               | about one business's currency, country, language or timezone                             |\n| `get_revenue_summary`        | how much was invoiced or paid in a period (at most 366 UTC days, drafts skipped)         |\n| `get_receivables_summary`    | what customers owe, what is overdue and how old unpaid invoices are                      |\n| `get_quote_pipeline_summary` | how many quotes were sent, their value and how many were accepted (at most 366 days)     |\n| `list_products`              | what the business sells and at what price                                                |\n| `get_subscription`           | which InvoiceVista plan the business is on and its limits                                |\n| `show_business_overview`     | for a one-card overview of one business                                                  |\n| `find_customer`              | about a customer they name, when the next step needs that customer's id                  |\n| `create_customer`            | to add a new customer, with the details they give                                        |\n| `update_customer`            | to change a customer's name, email, phone, tax id, address or language                   |\n| `list_inventory_items`       | how much of something is in stock, or what is running low                                |\n| `set_inventory_quantity`     | to correct a stock count after a count or a delivery                                     |\n\n`list_businesses` and `list_products` accept at most 100 rows and return an\nopaque cursor. Do not claim completeness when `hasMore` is true.\n`show_business_overview` caps customer/invoice/payment/quote counts at 100 and\nthe product preview at 12; report each lower-bound flag. Aggregate summary\nsources cap at 500 _after_ tenant and requested-date filtering; report\n`*IsLowerBound` and `amountMissingCount` rather than treating a partial total as\ncomplete.\n\n## Customer and financial-data boundary\n\nSafe outputs can contain:\n\n- owned business id/name, currency, country, locale and timezone;\n- aggregate customer/invoice/payment/quote/product counts and status counts;\n- bounded UTC date range and as-of calendar day;\n- signed aggregate invoice, payment, quote, outstanding and overdue amounts;\n- aggregate age buckets, source/missing/lower-bound flags and optional rates;\n- product catalog name, price and tax;\n- subscription plan name/status/frequency and quota limits;\n- for a customer the user named, its id, name, business and last edit time,\n  at most five matches, and the last two digits of a phone only when two\n  customers share a name; and\n- stock item id, name, unit, quantity, minimum and low-stock flag.\n\nThe connector never exposes:\n\n- a list of customers, or any customer's email, phone, address,\n  tax/government identifiers, notes or profile;\n- individual invoice/payment/quote ids, numbers, status, exact date/time,\n  value, customer linkage or document body;\n- notes, line item names/descriptions, arbitrary search or metadata;\n- cardholder, bank account, processor/customer, settlement, credential,\n  webhook, error/debug or secret data; or\n- any money-transfer, charge, refund, retry, settlement, invoice, payment or\n  quote write, or financial-advice capability.\n\nDo not ask users to paste excluded data into chat or infer a customer from an\naggregate. Offer a safe aggregate/catalog/plan read or the first-party\nInvoiceVista dashboard.\n\n## Revenue workflow\n\n1. Use `list_businesses` unless the exact owned business id is already known.\n2. Call `get_business` for currency/timezone context.\n3. Call `get_revenue_summary` with explicit inclusive `YYYY-MM-DD` UTC dates\n   when the user names a period; the maximum is 366 days. With no range, it\n   defaults to the 90 days ending today.\n4. Distinguish non-draft invoice production from recorded payments. Do not\n   call either recognized revenue or independent bank settlement. Payment\n   totals include every payment recorded in the range, whatever its status.\n5. Collection rate is null when source rows are truncated, numeric values are\n   missing or invoice production is zero. Never calculate a definitive rate\n   from incomplete aggregates.\n6. Signed negative values may represent adjustments/refunds. Describe the\n   recorded aggregate; do not infer cause or provide advice.\n\nThe revenue summary MCP App renders the same aggregate output and invoice\nstatus mix; it receives no individual records.\n\n## Receivables workflow\n\n1. Call `get_receivables_summary` for open/overdue counts, signed amounts and\n   age buckets as of the returned UTC day.\n2. Report `sourceInvoiceCountIsLowerBound` before discussing completeness.\n3. Explain `partiallyPaidCountExcludedFromAmount`: InvoiceVista does not store\n   remaining balance, so including the full invoice would overstate debt.\n   The overdue count covers invoices whose status is `OVERDUE`; a pending\n   invoice past its due date shows up in the age buckets only.\n4. Use age buckets only as aggregate operational groupings. No customer or\n   individual invoice can be resolved.\n5. Do not recommend collection action against a person, extend/deny credit or\n   initiate a charge.\n\n## Quote, catalog and plan workflow\n\nUse `get_quote_pipeline_summary` with an explicit bounded period. Draft quotes\nare omitted. Acceptance rate uses approved versus rejected decisions and is\nnull when the source is truncated or no decision exists. Do not describe\npending value as guaranteed revenue.\n\nUse `list_products` only after resolving a business. Catalog names are\noperator-provided product labels, not line descriptions from a customer\ndocument. Prices/tax are configuration and need not equal a final charge;\n`tax` is the product's stored tax value and is null when none was set.\n\nUse `get_subscription` for InvoiceVista plan capacity. A business with no\nactive/past-due persisted plan receives documented Free defaults. It never\nreturns subscription, processor product/price or payment-method ids.\n\n## Customer workflow\n\n1. Find the customer the user named with `find_customer`, passing the name as\n   they gave it. Every word must appear in the stored name, so ask for more of\n   it when the tool reports `tooManyMatches`, and ask which one when two come\n   back; `phoneEnding` is there to tell namesakes apart.\n2. To add a customer, call `create_customer` with the name and only the details\n   the user gave, and a new `requestId`. Retrying with the same `requestId`\n   returns the first customer instead of adding a second. A new customer is a\n   company unless the user says otherwise.\n3. To change one, call `update_customer` with the customer's id, the\n   `lastEditTime` from `find_customer` and only the fields that change. An\n   address given in part changes only those lines. A customer changed since it\n   was read is refused: read it again, show the user and retry once they\n   confirm.\n4. It never returns a customer's email, phone number, address or tax id. When\n   someone asks for them, or to export customers, say the connector does not\n   share them and that the InvoiceVista app shows them.\n\n## Stock workflow\n\nCall `list_inventory_items` for a business's stock: up to 100 items with unit,\nquantity, minimum and `lowStock`, and `lowStockOnly` for what is running low.\n`set_inventory_quantity` replaces the stored quantity with the number given,\nso when the user reports a change (\"we used 3 reams\"), work out the new total\nfrom the quantity read, confirm it, and pass the item's `lastEditTime`. A\nretried call cannot apply a change twice. Stock items are added and removed in\nthe app.\n\n## Aggregate overview\n\n`show_business_overview` is the broad first safe check. It displays business\nconfiguration, aggregate counts/status counts and product preview. It does not\ndisplay individual financial dates, amounts or identifiers. Follow with the\nspecific aggregate summary rather than trying to reconstruct records from\ncounts.\n\n## Safe fallbacks\n\n- Individual invoice, payment or quote request: say the connector\n  intentionally has no such tool; offer aggregate status/value counts or the\n  first-party app.\n- Customer contact, tax id or address request, or a customer export: say the\n  connector does not share them and that the InvoiceVista app shows them.\n- Card/bank/processor/credential request: do not call a tool; explain those\n  fields never enter connector output.\n- Charge/refund/retry/settle/transfer request, or a change to an invoice,\n  payment or quote: explain the connector cannot make it; do not pretend a\n  read changed state.\n- Financial advice or customer targeting: do not use aggregates to recommend\n  an individualized decision; offer factual aggregate reporting only.\n- Unrelated task: do not invoke InvoiceVista.\n\n## Interactive workspace\n\nWhen the user wants to open InvoiceVista Invoice Maker or browse visually, call `open_invoicevista` with no arguments. It opens a read-only sidebar of up to 100 businesses with explicit truncation. Select a business for its aggregate overview, revenue, receivables and quote pipeline. Existing individual customer and document restrictions still apply.\n",
      "tools": [
        {
          "name": "create_customer",
          "title": "Add a customer",
          "description": "Use this when someone asks to add a new customer to a business, such as a client they are about to invoice. Returns the customer's id, name, business and language; the email, phone, tax id and address given are saved but never returned. Not for changing an existing customer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Billing address.",
                "properties": {
                  "city": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "countryCode": {
                    "maxLength": 2,
                    "type": "string"
                  },
                  "postalCode": {
                    "maxLength": 30,
                    "type": "string"
                  },
                  "state": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "street": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "businessId": {
                "description": "Business id: 24 lowercase hexadecimal characters; may be absent when the account has one business.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "email": {
                "description": "Email address their invoices go to.",
                "maxLength": 254,
                "type": "string"
              },
              "language": {
                "description": "Language for their invoices and messages, as a code such as en, it or pt-BR; the business language when absent.",
                "maxLength": 10,
                "type": "string"
              },
              "legalEntity": {
                "description": "What kind of customer this is; a new customer is stored as a company when absent.",
                "enum": ["individual", "company", "partnership", "trust", "charity", "government"],
                "type": "string"
              },
              "name": {
                "description": "The customer's full or company name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Mobile number, with the country code when known.",
                "maxLength": 40,
                "type": "string"
              },
              "requestId": {
                "description": "A unique id for this customer, such as a UUID. A repeated call with the same requestId returns the first customer and adds no second one.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "taxId": {
                "description": "Tax or VAT number printed on their invoices.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["name", "requestId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "customer": {
                "additionalProperties": false,
                "properties": {
                  "businessId": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "language": {
                    "anyOf": [
                      {
                        "maxLength": 16,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastEditTime": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["businessId", "id", "language", "lastEditTime", "name"],
                "type": "object"
              },
              "status": {
                "enum": ["created", "already_created"],
                "type": "string"
              }
            },
            "required": ["customer", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a customer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["invoicevista:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b26addc504048042c6258d8ae35352d38eda3c2fe2e0e58db2082fce135994c5"
        },
        {
          "name": "find_customer",
          "title": "Find a customer by name",
          "description": "Use this when someone names a customer to update and you need that customer's id. Returns up to five customers whose name contains every word searched, each with its id, business and last edit time; never their contact details, tax id or address. Not for listing every customer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "Only customers of this business; every business of the account when absent",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "search": {
                "description": "The customer's name as the user gave it, or part of it. Every word must appear in the stored name, in any order, ignoring case and accents.",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "customers": {
                "description": "The customers whose name matches, with the ids the other tools take. Contact details, dates of birth, notes and clinical records are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "businessId": {
                      "anyOf": [
                        {
                          "pattern": "^[0-9a-f]{24}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "pattern": "^[0-9a-f]{24}$",
                      "type": "string"
                    },
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "phoneEnding": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{2}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The last two digits of the customer's phone, given only when two customers share this name"
                    }
                  },
                  "required": ["businessId", "id", "lastEditTime", "name", "phoneEnding"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "tooManyMatches": {
                "description": "More than 5 customers match: none are returned; ask the user for more of the name",
                "type": "boolean"
              }
            },
            "required": ["count", "customers", "tooManyMatches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a customer by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["invoicevista:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e8ebe3b9d50c8275397d2e43b5f5a13d1d9b012503a54a9cb6f5a46510c428dc"
        },
        {
          "name": "get_business",
          "title": "Get business details",
          "description": "Use this when someone asks about one business's invoicing setup, such as its currency, country, language or timezone. Returns the business's name, currency, country code, language and timezone, or not-found. Not for revenue or unpaid invoices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "Business id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "countryCode": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "ISO 4217 alpha-3 business currency, or null when unset"
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "locale": {
                        "anyOf": [
                          {
                            "maxLength": 35,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["countryCode", "currency", "id", "locale", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when not found. Contact, legal-entity, address, banking and integration fields are omitted."
              },
              "status": {
                "enum": ["found", "not-found"],
                "type": "string"
              }
            },
            "required": ["business", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get business details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["invoicevista:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:73fabdba16425ffffaf8e5a6b4e330003d4f7cbff809bfb55dd99a001c86d3e5"
        },
        {
          "name": "get_quote_pipeline_summary",
          "title": "Summarize quotes and acceptance",
          "description": "Use this when someone asks how many quotes or estimates they sent, what they were worth, or how many were accepted or rejected. Returns quote count, total value, counts by status and an acceptance rate; defaults to the last 90 days, at most 366, skipping drafts and counting at most 500 quotes. Not for a single quote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "Business id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "endDate": {
                "description": "Last UTC day to include, YYYY-MM-DD, at most 366 days after startDate; defaults to today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "First UTC day to include, YYYY-MM-DD; defaults to 89 days before endDate (a 90-day window)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptanceRatePercent": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Approved quotes as a percentage of approved plus rejected; null when the count is a lower bound or none was decided"
              },
              "amountMissingCount": {
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "anyOf": [
                  {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ISO 4217 alpha-3 business currency, or null when unset"
              },
              "quoteCount": {
                "minimum": 0,
                "type": "integer"
              },
              "quoteCountIsLowerBound": {
                "type": "boolean"
              },
              "quotedAmount": {
                "type": "number"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "endDate": {
                    "$ref": "#/properties/range/properties/startDate"
                  },
                  "startDate": {
                    "description": "UTC calendar date in YYYY-MM-DD format",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["endDate", "startDate"],
                "type": "object"
              },
              "statusBreakdown": {
                "description": "Non-draft quotes issued in the range, per status, with count and amount. Quote and customer identifiers, contacts, tax ids, addresses, notes, line descriptions and free text are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "amountMissingCount": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["DRAFT", "PENDING", "REJECTED", "APPROVED", "UNKNOWN", "OTHER"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "amountMissingCount", "count", "status"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
