                "description": "New full or company name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "New mobile number, with the country code when known.",
                "maxLength": 40,
                "type": "string"
              },
              "taxId": {
                "description": "New tax or VAT number.",
                "maxLength": 64,
                "type": "string"
              }
