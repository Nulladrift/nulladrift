      "tools": [
        {
          "name": "court_fee_calc",
          "title": "Court Fee Calc",
          "description": "诉讼费计算器（纯本地计算，依据《诉讼费用交纳办法》国务院令第481号）。用 case_type 区分：case_type=property 财产案件受理费：传 amount（标的额，元），按分段累计输出明细（≤1万每件50元；1-10万部分2.5%；10-20万2%；20-50万1.5%；50-100万1%；100-200万0.9%；200-500万0.8%；500-1000万0.7%；1000-2000万0.6%；超2000万0.5%）；case_type=divorce 离婚案件：基础受理费50-300元/件，可选传 property_amount（财产分割总额，元），超20万元部分按0.5%加收；case_type=execution 申请执行费：传 amount（执行金额，元），分段累计（≤1万每件50元；1-50万1.5%；50-500万1%；500-1000万0.5%；超1000万0.1%），不传金额时说明50-500元/件。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "标的额/执行金额（元）"
              },
              "case_type": {
                "description": "property=财产案件；divorce=离婚案件；execution=申请执行",
                "type": "string"
              },
              "property_amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "（divorce）离婚财产分割总额（元）"
              }
            },
            "required": ["case_type"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:146fd1f31b1d0540e052698a7fd7034093f4f094a61804af21bebf7b641c5f87"
        },
        {
          "name": "labor_calc",
          "title": "Labor Calc",
          "description": "劳动法计算器（纯本地计算）。用 action 区分子功能：action=severance 经济补偿/赔偿金：传 years（工作年限，年，可为小数）、monthly_salary（离职前12个月平均月工资）、local_avg_salary（可选，当地上年度职工月平均工资，用于三倍封顶与12年封顶）、termination_type（N=协商/法定经济补偿；N+1=无过失性辞退加代通知金；2N=违法解除赔偿金）；action=overtime 加班费：传 monthly_salary（月工资或约定基数）及 workday_hours（工作日延时小时）、restday_hours（休息日小时）、holiday_hours（法定节假日小时），或用 hours+overtime_type（1.5/2/3）单次计算；action=annual_leave 年休假：传 total_years（累计工作年限）返回应享年假天数（5/10/15天）；action=double_wage 未签合同二倍工资：传 months_since_entry（入职月数）与可选 monthly_salary，返回最多11个月的二倍工资差额规则说明与估算。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "severance=经济补偿/赔偿金；overtime=加班费；annual_leave=年休假；double_wage=二倍工资",
                "type": "string"
              },
              "holiday_hours": {
                "default": 0,
                "type": "number"
              },
              "hours": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "local_avg_salary": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "（severance，可选）当地上年度职工月平均工资"
              },
              "monthly_salary": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "月工资（离职前12个月平均）或加班费计算基数"
              },
              "months_since_entry": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "（double_wage）入职至未签合同状态持续月数"
              },
              "overtime_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "restday_hours": {
                "default": 0,
                "type": "number"
              },
              "termination_type": {
                "default": "N",
                "description": "（severance）N / N+1 / 2N",
                "type": "string"
              },
              "total_years": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "（annual_leave）累计工作年限"
              },
              "workday_hours": {
                "default": 0,
                "type": "number"
              },
              "years": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "（severance）本单位工作年限，年，3.5 表示3年6个月"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9bd5d09e3e8483b46412a712efe01ce82b566955cdc4dc1808410241e3891d71"
        },
        {
          "name": "law_search",
          "title": "Law Search",
          "description": "常用法律条文全文检索（本地 SQLite FTS5，共收录6部法律1796条）：《民法典》1260条、《劳动法》107条、《劳动合同法》98条、《消费者权益保护法》63条、《道路交通安全法》124条、《治安管理处罚法（2025修订，2026年施行）》144条。三种用法：① keyword 关键词全文检索（如『经济补偿』『三倍工资』『醉酒驾驶』，可加 law 限定法律）；② law + article_no 按法律名与条号直取条文（如 law=劳动合同法, article_no=47；条号可传阿拉伯数字或中文）；③ 不传参数返回收录法律目录。返回法律名、条号与条文原文。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article_no": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "条号，如 47 或 第四十七条（与 law 同时使用）"
              },
              "keyword": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "检索关键词，如 经济补偿、带薪年休假、消费者、醉驾"
              },
              "law": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "限定法律（简称即可）：民法典/劳动法/劳动合同法/消费者权益保护法/道路交通安全法/治安管理处罚法"
              },
              "limit": {
                "default": 10,
                "description": "返回条数上限，1-50，默认10",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:d02df77640d26cf0ebc496f0ae08f55a84c5ae1a335e840549251bc776ed2245"
        }
      ],
      "digest": "sha256:8f1bf61bf7d5138ff522a990a0f2ba3fd1bad508d5ca926b7d29b15724a6f049"
    }
  }
