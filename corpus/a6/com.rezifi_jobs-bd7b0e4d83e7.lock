{
  "lockfileVersion": 2,
  "subjects": {
    "com.rezifi/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.rezifi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rezifi-jobs",
        "title": "Rezifi job search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rezifi searches open jobs on employers' own careers sites, each confirmed open in the last 3 days. search_jobs takes the role or skill and, when the person names them, the place, remote and their level (fresher covers students and new graduates). Each result carries its id, company, place, pay when stated and its apply link. get_job takes an id and gives the employer's posting; find_similar_jobs gives jobs like it; check_jobs_open says whether saved jobs are still open. When an answer is marked expanded, some jobs come from Internshala or Unstop, and each one names its source.",
      "tools": [
        {
          "name": "check_jobs_open",
          "title": "Check jobs are open",
          "description": "Whether each of up to 50 jobs, by the ids a search gave, is still open: open (seen on the employer's site in the last 3 days), unconfirmed (not seen for longer, so it may have closed), closed, or unknown, with when it was last seen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "description": "A job's id, as a search result gives it (8 letters and digits).",
                  "pattern": "^[0-9a-hjkmnp-tv-zA-HJKMNP-TV-Z]{8}$",
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check jobs are open"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checked the jobs",
            "openai/toolInvocation/invoking": "Checking the jobs"
          },
          "digest": "sha256:649b9cf6a7d5550b77ef1f1b65c47af7e5a0b1e2a50d9925b517913211b107bc"
        },
        {
          "name": "find_similar_jobs",
          "title": "Find similar jobs",
          "description": "Open jobs like one a search returned: the same role, in the same country, remote when it is remote, from employers' own careers sites first. The job itself is left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A job's id, as a search result gives it (8 letters and digits).",
                "pattern": "^[0-9a-hjkmnp-tv-zA-HJKMNP-TV-Z]{8}$",
                "type": "string"
              },
              "limit": {
                "description": "How many jobs, 1 to 19 (default 10).",
                "maximum": 19,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find similar jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Found similar jobs",
            "openai/toolInvocation/invoking": "Finding similar jobs"
          },
          "digest": "sha256:1feb4d5982a9e11106af29876398b64fadcf7e8cf8e50a62f23a7d2d1ccf9879"
        },
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "One job a search returned, in full: the employer's description (up to 20,000 characters), responsibilities, required and nice-to-have skills, pay and minimum years when stated, employment type, the apply link, and whether it is still open (seen on the employer's site in the last 3 days), unconfirmed, or closed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A job's id, as a search result gives it (8 letters and digits).",
                "pattern": "^[0-9a-hjkmnp-tv-zA-HJKMNP-TV-Z]{8}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read the job",
            "openai/toolInvocation/invoking": "Reading the job"
          },
          "digest": "sha256:66c6dde5e7cb67674948e1e264a9c3ca2725eae14b8fa0f69eae93e2e674cdfb"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Find open jobs by role, skill or company, with an optional place, remote, and experience level. Results come from employers' own careers sites first (confirmed open in the last 3 days); when those are fewer than asked for, jobs from Internshala and Unstop fill the rest, each marked with its source. Each result has the employer's apply link, the stated pay and minimum years when the posting gives them, a two-line summary and the core skills.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the person asks to find jobs in, as a name or two-letter code, e.g. \"IN\", \"US\". Never the person's own location. Leave empty for every country.",
                "type": "string"
              },
              "level": {
                "description": "intern, fresher (students, new graduates, up to a year), junior, mid, senior, or lead.",
                "enum": ["intern", "fresher", "junior", "mid", "senior", "lead"],
                "type": "string"
              },
              "limit": {
                "description": "How many jobs, 1 to 20 (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The role, skill or company, e.g. \"full stack developer\", \"React\", \"data analyst\", \"Accenture\". When the person asks about a place, name it here (\"React developer in Pune\"); it may also say remote or fresher.",
                "maxLength": 200,
                "type": "string"
              },
              "remote": {
                "description": "true for remote jobs only.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Found jobs",
            "openai/toolInvocation/invoking": "Searching jobs"
          },
          "digest": "sha256:911a93bee8a8829ffa742fa43dca23734916b901e332c7b0b4643ecfb7d4fa76"
        }
      ],
      "digest": "sha256:69dfe378a96c0bdf66566805dc68c3c315e4fa4f835429085a3140475b26bfd9"
    }
  }
}
