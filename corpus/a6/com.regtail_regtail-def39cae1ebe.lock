        {
          "name": "resolve_vehicle",
          "title": "Resolve a vehicle plate",
          "description": "Resolve a typed plate, car photo data URL or supported advert URL to a plate only. No account or spend.\n    If uncertain, ask the user to confirm; if unavailable, ask for the typed plate. Then use free_check.",
          "inputSchema": {
            "$defs": {
              "AdvertInput": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "const": "advert_url",
                    "title": "Kind",
                    "type": "string"
                  },
                  "url": {
                    "maxLength": 2048,
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["kind", "url"],
                "title": "AdvertInput",
                "type": "object"
              },
              "PhotoInput": {
                "additionalProperties": false,
                "properties": {
                  "image_data_url": {
                    "maxLength": 5600000,
                    "title": "Image Data Url",
                    "type": "string"
                  },
                  "kind": {
                    "const": "photo",
                    "title": "Kind",
                    "type": "string"
                  }
                },
                "required": ["image_data_url", "kind"],
                "title": "PhotoInput",
                "type": "object"
              },
              "PlateInput": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "const": "plate",
                    "title": "Kind",
                    "type": "string"
                  },
                  "plate": {
                    "maxLength": 16,
                    "minLength": 2,
                    "title": "Plate",
                    "type": "string"
                  }
                },
                "required": ["kind", "plate"],
                "title": "PlateInput",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "input": {
                "discriminator": {
                  "mapping": {
                    "advert_url": "#/$defs/AdvertInput",
                    "photo": "#/$defs/PhotoInput",
                    "plate": "#/$defs/PlateInput"
                  },
                  "propertyName": "kind"
                },
                "oneOf": [
                  {
                    "$ref": "#/$defs/PlateInput"
                  },
                  {
                    "$ref": "#/$defs/PhotoInput"
                  },
                  {
                    "$ref": "#/$defs/AdvertInput"
                  }
