      "instructions": "Check UK used cars from their records. Start with resolve_vehicle for a plate, photo or advert link, then free_check for the site's free identity, tax/MOT status and latest MOT test, or compare_vehicles for two free checks. No account needed. mot_index gives free MOT statistics for a model, a make or all cars (pass rates by age, common failures); it is fleet data, not a check of a car. Show the free summary and up to three questions from free facts. The resolver returns only a plate; no advert claims are returned. Display supplied image URLs verbatim where supported, with the report link beneath; keep the text if images cannot display. Next-MOT odds, component estimates, repair prices, mileage analysis and older MOT details are in the detailed report only. Mention only returned locked teasers. Paid odds are an estimate, not an inspection. Optional account linking enables full_report, viewing_advice, my_reports and credits_balance. unlock_report alone spends one credit for 30 days; ask the user first and get explicit plate-specific consent. Reading an active unlock spends nothing. Finance, stolen and write-off registers are not checked. Never imply an unlock adds those checks.",
