        {
          "name": "mot_index",
          "title": "MOT Index fleet statistics",
          "description": "MOT statistics for the whole GB fleet, from the RegTail MOT Index 2025 (DVSA anonymised MOT data, Open Government Licence v3.0). Answers: how often a model passes its MOT, what fails and what gets advisories, how it compares with all cars, by age, fuel and mileage, and how a model at a given age compares with all cars of that age (pass age). Free, no account or credit needed, read-only. Beta: the figures are final for this release, field names may still change.\n\nAggregate figures, not a check of any particular car: for one car use the plate tools. Pass node as a stable id: overview, index (every node id), postcode, release, model/{make}/{model} (e.g. model/ford/fiesta), make/{make}, defect/{slug}; a page URL or a name like 'Ford Fiesta' also works. year is 2023, 2024, 2025 or latest. view='full' adds the long lists.\n\nReturns summary (one sentence), data (rates are fractions 0 to 1; failure and advisory rates are floors, say 'at least'; fuel, mileage-band and postcode figures are not age-adjusted), evidence (sources, as-of, population, uncertainty, insufficient_data with its reason when a year has too few tests: then say there are not enough tests, never give a number), links, edges (the next nodes, what each answers, free, thin) and citation. Cite it as DVSA anonymised MOT data. It does not check outstanding finance, stolen or write-off status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "anyOf": [
                  {
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Model or overview nodes: compare cars of this age in years",
                "title": "Age"
              },
              "node": {
                "default": "overview",
                "description": "Node id (model/ford/fiesta, make/ford, defect/oil-leak, overview, index, postcode, release), a /mot page URL, or a name like 'Ford Fiesta'",
                "maxLength": 200,
                "title": "Node",
                "type": "string"
              },
              "view": {
                "default": "summary",
                "description": "summary (small) or full (adds the long lists)",
                "enum": ["summary", "full"],
                "title": "View",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "const": "latest",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "2023, 2024, 2025 or latest (default: the node's newest year with figures)",
                "title": "Year"
              }
            },
            "title": "mot_index_appArguments",
            "type": "object"
          },
