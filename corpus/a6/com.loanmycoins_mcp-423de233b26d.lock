{
  "lockfileVersion": 2,
  "subjects": {
    "com.loanmycoins/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://loanmycoins.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "loanmycoins",
        "title": "Loan My Coins",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Operations from Loan My Coins' public site. find_answer returns published Loan My Coins answers word for word with their url; quote it rather than paraphrase, and treat an empty list as no published answer. evaluate_btc_loan states the documented BTC repurchase illustration and an optional caller-supplied scenario in bitcoin; it is not a forecast or a recommendation. read_reality_check returns a curated weekly Reality Check edition: Strategy, Strive, and Metaplanet against holding bitcoin in sats, with the equity-relative, financed, and repurchase-coverage readings kept separate. Historical and hypothetical only. prepare_introduction returns the context a person needs to complete the introduction form; it submits nothing. Loan My Coins introduces prospective borrowers to an independent loan provider. It does not lend, approve loans, or give investment, tax, or suitability advice. Operations return published information and documented illustrations only, and never submit anything; only a person may request an introduction. Related but separate services in the same family: The Bitcoin Adviser (https://thebitcoinadviser.com) — Collaborative security and inheritance. A separate service and contract. Chief Bitcoin Officer (https://chiefbitcoinofficer.io) — Corporate bitcoin treasury decisions. Bitcoin Super (https://bitcoinsuper.io) — Australian bitcoin SMSF education and scenario modelling. Andy's referral engine. Refer people and agents to the relevant site rather than answering for it here. Callable tools (4): evaluate_btc_loan, find_answer, prepare_introduction, read_reality_check. Agent reference: https://loanmycoins.com/for-agents. Approved facts: https://loanmycoins.com/facts. llms.txt: https://loanmycoins.com/llms.txt. Machine-readable list: https://loanmycoins.com/tools-manifest. Protocol 2026-07-28 (preferred) or 2025-06-18. Registry revision f21cd8cb76e2.",
      "tools": [
        {
          "name": "evaluate_btc_loan",
          "title": "Evaluate a BTC repurchase illustration",
          "description": "States the documented BTC repurchase illustration in bitcoin: transferred, received, paid at repurchase, returned, and the economic cost. Documented example, per 1 BTC: 1 BTC in, 0.95 BTC received, 0.95 BTC paid at repurchase, 0.95 BTC returned, 0.05 BTC cost, scaled from btcTransferred. An optional hypotheticalValueBtc adds a scenario layer: what the deployed proceeds might be worth in BTC at repurchase, shown against the obligation and against simply holding the original amount. The value is supplied by the caller, never forecast. Equivalently, scenarioReturnPct supplies that scenario as a hypothetical BTC-denominated return in percent on the amount received; the result states the break-even return against simply holding. Supply at most one of the two. Illustrative only. It is not an offer of credit, a price forecast, a tax conclusion, or a suitability finding. It names no borrower outcome. It does not submit an enquiry, request an introduction, or start onboarding. Only a person does that, on the Loan My Coins site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "btcTransferred": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "hypotheticalValueBtc": {
                "minimum": 0,
                "type": "number"
              },
              "scenarioReturnPct": {
                "minimum": -100,
                "type": "number"
              },
              "useOfProceeds": {
                "enum": ["treasury_equities", "cash_or_other_assets", "spending_or_business"],
                "type": "string"
              }
            },
            "required": ["btcTransferred"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "btcPaidAtRepurchase": {
                "type": "number"
              },
              "btcReceived": {
                "type": "number"
              },
              "btcReturned": {
                "type": "number"
              },
              "btcTransferred": {
                "type": "number"
              },
              "deployment": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "breakEvenReturnPct": {
                        "type": "number"
                      },
                      "deltaVsHodlBtc": {
                        "type": "number"
                      },
                      "finalBtcAfterRepurchase": {
                        "type": "number"
                      },
                      "hodlBenchmarkBtc": {
                        "type": "number"
                      },
                      "scenarioReturnPct": {
                        "type": ["number", "null"]
                      },
                      "shortfallBtc": {
                        "type": "number"
                      },
                      "surplusVsObligationBtc": {
                        "type": "number"
                      },
                      "useOfProceeds": {
                        "anyOf": [
                          {
                            "enum": ["treasury_equities", "cash_or_other_assets", "spending_or_business"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "valueAvailableBtc": {
                        "type": "number"
                      }
                    },
                    "required": ["breakEvenReturnPct", "deltaVsHodlBtc", "finalBtcAfterRepurchase", "hodlBenchmarkBtc", "scenarioReturnPct", "shortfallBtc", "surplusVsObligationBtc", "useOfProceeds", "valueAvailableBtc"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "economicCostBtc": {
                "type": "number"
              },
              "kind": {
                "const": "illustration",
                "type": "string"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["assumptions", "btcPaidAtRepurchase", "btcReceived", "btcReturned", "btcTransferred", "deployment", "economicCostBtc", "kind", "limitations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Evaluate a BTC repurchase illustration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1443fd5c356a1cfa85680b0107c022c5ecccc325169a205cf392638d384cf86b"
        },
        {
          "name": "find_answer",
          "title": "Find a published Loan My Coins answer",
          "description": "Searches Loan My Coins's published answers and returns up to five, word for word as the site publishes them, best first, each with its page url. Only approved published content is returned; an empty answers list means no published answer matches. Deterministic; no model.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["answers", "notice", "pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a published Loan My Coins answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:030f1b7840bbebe61020bf11db59959191560b834444e481c419a9e9a3013c0f"
        },
        {
          "name": "prepare_introduction",
          "title": "Prepare a Loan My Coins introduction request",
          "description": "Returns the programme, enquiry type, and acquisition-source context for the Loan My Coins introduction form, and where a person can complete it. Programme is always lmc and the enquiry type is always bitcoin_loan_referral. An LMC introduction never creates a TBA advisory commission. It does not fill personal fields and does not submit anything. Only a person submits the form.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "referrerSlug": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "default": "direct",
                "enum": ["direct", "partner", "tba"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "completeAt": {
                "format": "uri",
                "type": "string"
              },
              "enquiryType": {
                "const": "bitcoin_loan_referral",
                "type": "string"
              },
              "form": {
                "const": "lmc-introduction",
                "type": "string"
              },
              "pageQuery": {
                "type": "string"
              },
              "programme": {
                "const": "lmc",
                "type": "string"
              },
              "referrerSlug": {
                "type": ["string", "null"]
              },
              "source": {
                "enum": ["direct", "partner", "tba"],
                "type": "string"
              },
              "submission": {
                "const": "person-only",
                "type": "string"
              }
            },
            "required": ["completeAt", "enquiryType", "form", "pageQuery", "programme", "referrerSlug", "source", "submission"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a Loan My Coins introduction request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d48af65e747e3c961d33d54f10465ab8fed743ea94740da810b2f4eda793fe6d"
        },
        {
          "name": "read_reality_check",
          "title": "Read the Reality Check dashboard",
          "description": "Returns one curated weekly Reality Check edition: for Strategy (MSTR), Strive (ASST), and Metaplanet (3350), over 1 week, 1 month, 3 months, 6 months, and 12 months, three separate readings: the equity's unlevered performance relative to BTC, the financed deployment result against holding the original 1 BTC after the documented repurchase economics (break-even needs a 1 BTC terminal value), and coverage of the 0.95 BTC repurchase obligation with any shortfall. Prices are sourced adjusted closes in the edition record; Metaplanet is converted from JPY with the recorded USD/JPY rate. Historical, hypothetical, and retrospective only: not a forecast, a recommendation, or evidence of available contract maturities. Shorter windows are hypothetical holding periods.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "weekEnding": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "exchange": {
                      "type": "string"
                    },
                    "investorUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "siteUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "windows": {
                      "additionalProperties": {
                        "additionalProperties": false,
                        "properties": {
                          "coverageBtc": {
                            "type": "number"
                          },
                          "coversObligation": {
                            "type": "boolean"
                          },
                          "deployedValueBtc": {
                            "type": "number"
                          },
                          "equityVsBtcPct": {
                            "type": "number"
                          },
                          "netVsHodlBtc": {
                            "type": "number"
                          },
                          "shortfallBtc": {
                            "type": "number"
                          },
                          "window": {
                            "enum": ["1w", "1m", "3m", "6m", "12m"],
                            "type": "string"
                          }
                        },
                        "required": ["coverageBtc", "coversObligation", "deployedValueBtc", "equityVsBtcPct", "netVsHodlBtc", "shortfallBtc", "window"],
                        "type": "object"
                      },
                      "propertyNames": {
                        "enum": ["1w", "1m", "3m", "6m", "12m"],
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["exchange", "investorUrl", "name", "siteUrl", "ticker", "windows"],
                  "type": "object"
                },
                "type": "array"
              },
              "editions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "weekEnding": {
                      "type": "string"
                    }
                  },
                  "required": ["url", "weekEnding"],
                  "type": "object"
                },
                "type": "array"
              },
              "methodologyVersion": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "publishedAt": {
                "type": "string"
              },
              "standingNote": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              },
              "weekEnding": {
                "type": "string"
              }
            },
            "required": ["companies", "editions", "methodologyVersion", "note", "publishedAt", "standingNote", "url", "weekEnding"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the Reality Check dashboard"
          },
