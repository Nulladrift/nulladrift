                "type": "string"
              },
              "range": {
                "description": "Quanto tempo o usuário quer: \"dia\" (padrão), \"semana\" (7 dias) ou \"mes\" (o mês inteiro publicado). Use \"mes\" quando ele pedir \"tábua completa\", \"mês completo\", \"a tábua do mês\" ou uma programação de viagem.",
                "enum": ["dia", "semana", "mes"],
                "type": "string"
