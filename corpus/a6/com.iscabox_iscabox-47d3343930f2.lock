              "lng": {
                "description": "Longitude em graus decimais. Ex: -48.63.",
                "type": "number"
              },
              "portSlug": {
                "description": "Slug do porto coberto pela iscabox. Se a cidade que o usuário citou é um destes portos (ou é atendida por um deles), passe o slug direto — é mais confiável que a busca por texto.",
                "enum": ["santos", "rio-de-janeiro", "angra-dos-reis", "cabo-frio", "vitoria", "salvador", "ilheus", "recife", "natal", "fortaleza", "sao-luis", "belem", "paranagua", "itajai", "florianopolis", "rio-grande", "maceio", "tutoia", "cabedelo", "aracaju", "imbituba", "sao-francisco-do-sul", "sao-sebastiao", "itaguai", "fernando-de-noronha", "suape", "salinopolis", "mosqueiro", "vila-do-conde", "breves", "luis-correia", "pecem", "madre-de-deus", "aratu", "ubu", "porto-de-galinhas", "maragogi", "porto-seguro", "boa-viagem", "praia-do-forte", "morro-de-sao-paulo", "tamandare", "candeias", "guarajuba", "guarapari", "itamaraca", "paracuru", "barra-de-sao-miguel", "gaibu", "paiva", "lucena", "sao-miguel-dos-milagres", "arraial-d-ajuda", "serrambi", "muro-alto", "sao-miguel-do-gostoso", "itaparica", "jericoacoara", "caraiva", "porto-das-dunas", "taipu-de-fora", "jaua", "arembepe", "cabo-branco", "camocim", "aracati", "barra-grande", "maria-farinha", "itacare", "baia-formosa", "stella-maris", "boipeba", "beberibe", "icapui", "trancoso", "tibau-do-sul", "japaratinga", "jacaraipe", "touros", "santa-cruz-cabralia", "praia-do-frances", "cotovelo", "canavieiras", "paripueira", "rio-do-fogo"],
