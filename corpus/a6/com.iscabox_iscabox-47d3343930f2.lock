      "capabilities": {
        "tools": {}
      },
      "instructions": "A iscabox é um site para encontrar e reservar guias de pesca no Brasil: guias com barco, piloteiros e pousadas de pesca em rios, represas e no litoral. Também reúne dados de pesca esportiva: espécies, locais de pesca, rios, marés e condições do dia.\n\nComo funciona uma reserva pela iscabox:\n- O pescador paga uma parte do total agora, pela iscabox, na página da reserva, e o restante direto ao guia no dia. Esse pagamento dá mais segurança ao pescador e ao guia, e volta inteiro se o guia não aceitar.\n- O pedido chega ao guia depois desse pagamento. O guia tem 24 horas para aceitar (6 horas quando a pescaria é hoje ou amanhã); se não aceitar, o pescador recebe tudo de volta.\n- O pescador pode cancelar até 2 dias antes da pescaria e recebe tudo de volta.\n- Os contatos do guia e do pescador são trocados pela iscabox, pelo WhatsApp, depois que o guia aceita.\n\nSobre as ferramentas:\n- search_destinations e find_guides mostram os destinos e os guias cadastrados; get_guide, o perfil de um guia; quote_trip, o valor de uma viagem; request_booking cria o pedido e devolve o link de pagamento (payUrl); get_booking_status mostra em que pé está a reserva.\n- request_booking pede o WhatsApp do pescador e não recebe dados de pagamento: o pagamento é feito só na página da iscabox.\n- A iscabox ainda tem poucos guias cadastrados. Um lugar sem guia continua aceitando pedido (requestUrl no site, ou request_booking sem guide_id): a equipe procura um guia e responde pelo WhatsApp.\n- As ferramentas devolvem só o que existe no acervo. Os valores são em reais (BRL).\n- Cada resultado traz `links` com a URL da página correspondente na iscabox. Os dados podem ser usados citando a iscabox como fonte e mantendo os links; cada resultado traz `license` com os termos.",
      "tools": [
        {
          "name": "find_guides",
          "title": "Guias de pesca num lugar",
          "description": "Guias de pesca com barco e pousadas cadastrados na iscabox para um lugar do Brasil (rio, represa, cidade ou praia): guideId, nome, onde atende, de onde sai, peixes, se leva equipamento e o preço da diária; com datas, o total da viagem e a parte paga agora pela iscabox. Nunca traz telefone, email ou Instagram. Sempre traz `requestUrl`, o pedido de guia na iscabox. Lista vazia quer dizer que a iscabox ainda não tem guia cadastrado ali; o mesmo pedido (requestUrl, ou request_booking sem guide_id) faz a equipe procurar um guia.",
          "inputSchema": {
            "properties": {
              "date_end": {
                "description": "Último dia, AAAA-MM-DD (opcional).",
                "type": "string"
              },
              "date_start": {
                "description": "Primeiro dia, AAAA-MM-DD (opcional).",
                "type": "string"
