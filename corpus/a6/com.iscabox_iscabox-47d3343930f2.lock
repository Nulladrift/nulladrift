        {
          "name": "search_locations",
          "title": "Buscar locais de pesca",
          "description": "Busca locais de pesca no acervo da iscabox — rios, represas, praias, pesqueiros. Filtre por estado, espécie ou tipo de água. Use quando o usuário perguntar onde pescar. Se o usuário citar uma cidade, passe lat e lng dela: locais próximos entram na resposta mesmo quando a cidade em si não tem página. Use kind para separar pesque-pague de água livre.",
          "inputSchema": {
            "properties": {
              "anchor": {
                "description": "Lugar citado antes na conversa, quando a mensagem atual não cita nenhum (\"quero locais na beira do lago\" depois de falar de Fortaleza): a busca fica ancorada nele.",
                "type": "string"
              },
              "exclude": {
                "description": "locationPath dos locais já mostrados, para não repeti-los.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "kind": {
                "description": "Tipo de local. \"pesqueiro\" = pesque-pague; \"natural\" = rio, represa, lagoa, praia. Passe \"natural\" quando o usuário não quer pesque-pague.",
                "enum": ["pesqueiro", "natural"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude, em graus decimais, da cidade ou ponto que o usuário citou. Preencha com o que você sabe da geografia brasileira. Ex: Marau (RS) é -28.45.",
                "type": "number"
              },
              "limit": {
                "description": "Quantos resultados (1-8, padrão 5).",
                "type": "number"
              },
              "lng": {
                "description": "Longitude do mesmo ponto. Ex: Marau (RS) é -52.20.",
                "type": "number"
