      "serverInfo": {
        "name": "SendFaxFast Credits MCP",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SendFaxFast sends faxes with prepaid credits (1 credit = 1 fax, up to 100 pages). get_fax_price shows whether a destination is supported. Documents: ChatGPT passes files attached in the chat to send_fax as the \"file\" parameter. In other apps, create_upload_link returns a one-time upload_url; after the user has uploaded the file there, send_fax accepts the upload_id. A direct public HTTPS link to a PDF works as document_url. Each send_fax result states whether the fax was sent, scheduled or is awaiting payment. Sending requires a credits API key (sfx_...), sent as \"Authorization: Bearer sfx_...\" or as ?key=sfx_... in the connector URL. send_fax transmits a real fax to the given number and uses 1 credit. When credits run out, the tool result contains a link to buy a new credit pack on sendfaxfast.com; credits cannot be bought through the connector.",
      "tools": [
        {
          "name": "create_upload_link",
          "title": "Create upload link",
          "description": "Creates a secure one-time upload link (valid 30 minutes) for the fax document (PDF, JPG or PNG, max. 10 MB) – upload from phone or computer by drag & drop, file picker or camera. For files on the user's device, or chat attachments that are not available as send_fax's \"file\" parameter. The user opens upload_url and uploads the file; send_fax then accepts the returned upload_id. Creating a link sends nothing and costs nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a0d2d324b44a7ea0e203ee1b3814a13013fd99f845b4393fa4c3e93e7d91a547"
        },
        {
          "name": "get_account_balance",
          "title": "Get credit balance",
          "description": "Check how many fax credits remain on your account. Requires your credits API key (sfx_...).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
