        },
        {
          "name": "get_fax_price",
          "title": "Check fax price",
          "description": "Check if a fax destination is supported and how many credits it costs (a flat 1 credit per fax, up to 100 pages). No API key required. Supported: USA, Canada, Australia, New Zealand and 39 more countries (same list as sendfaxfast.com); premium-rate numbers are not supported.",
          "inputSchema": {
            "properties": {
              "fax_number": {
                "description": "Recipient fax number in E.164 format (e.g. +12125550100 for USA, +61212345678 for Australia, +911123456789 for India)",
                "type": "string"
              }
            },
            "required": ["fax_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check fax price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c40c8092415396db79138faad105da2cab8ee99c57ad93606b25221eccdf6f86"
        },
        {
          "name": "get_fax_status",
          "title": "Get fax status",
          "description": "Check the delivery status of one of your faxes. Use the fax_id returned by send_fax. Requires your credits API key; only your own faxes are visible.",
          "inputSchema": {
            "properties": {
              "fax_id": {
                "description": "Fax ID returned by send_fax",
                "type": "integer"
              }
            },
            "required": ["fax_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get fax status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
