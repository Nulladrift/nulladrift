      "instructions": "You want to know who is actually earning in the x402 economy, and sellers' own claims are all anyone publishes. These figures are read off Base. TOOL CALLS ARE x402-PAID in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request, or params._meta['x402/payment']. An unpaid call answers with a valid x402 accepts array and settles nothing, and initialize, ping, tools/list and GET /health are free. WHERE THE NUMBERS COME FROM: USDC revenue figures are read off Base directly, not claimed by the sellers being ranked, and every figure carries the observation window it was computed over. COVERAGE IS YOUNG AND STATED HONESTLY: GET /health publishes, free and unprompted, what each paid route can answer today and how far back the observation window reaches, so you can decide whether a call is worth making before you make it. Routes refuse and settle nothing rather than bill for an answer they cannot support; a refusal costs you nothing. Ranks order OBSERVED activity over a stated window. They are not audits, not endorsements, not a security review, and not forward-looking predictions. Absence from a rank means we have not observed the seller, which is not the same as the seller being inactive.Tool calls are x402-paid in USDC on Base — send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). PRICES DIFFER PER TOOL, from $0.005 to $0.01, so read the price out of tools/list before you call. An unpaid call returns a PaymentRequired result carrying the x402 accepts challenge and settles nothing; initialize, ping and tools/list are free. Every figure is an OBSERVATION with a date, never an estimate, and an empty result means the archive holds nothing matching, not that nothing exists.",
