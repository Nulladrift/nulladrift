          "title": "X402 Market Report",
          "description": "Daily state of the x402 agent economy: observed USDC inflow, seller ranking, category demand, growth, and coverage. Reports its real observation window; concentration adjustment applied only when scan coverage supports it. A FREE register-wide change digest covering the same domain is market_digest on the x402-observatory gateway; buy this for the derived figures, not for what merely changed. Price: $0.01 USDC per successful call.",
