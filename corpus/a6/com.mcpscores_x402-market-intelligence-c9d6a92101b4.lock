          "title": "X402 New Entrants",
          "description": "x402 services first listed since a given date, with first archive observation and early-traction evidence from observed inflow. Entrants MCPFax can attribute — a declared payTo, an observed title, or observed inflow — rank first, and each row says which it carries. A window identifying nobody is refused 422 and charges nothing. Requests before the archive's first date are partially covered. Price: $0.01 USDC per successful call.",
