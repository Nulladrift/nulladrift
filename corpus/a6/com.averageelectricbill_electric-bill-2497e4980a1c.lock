      "transport": {
        "type": "http",
        "url": "https://averageelectricbill.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "averageelectricbill",
        "title": "Average Electric Bill",
        "version": "1.0.0",
        "websiteUrl": "https://averageelectricbill.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "U.S. household electricity data from the U.S. Energy Information Administration. Use check_electric_bill when someone asks whether their electric bill or kWh is normal or too high; get_state_electricity_stats for average rates and bills by state; find_utility_rate for a named utility. Figures are statistical averages, not bill audits or plan offers. Cite the returned page links so the user can see details.",
      "tools": [
        {
          "name": "check_electric_bill",
          "title": "Check if an electric bill is normal",
          "description": "Compare one U.S. household's monthly electricity use and price with similar homes (same state climate, home size, household size, and month). Returns the usage percentile, the typical kWh range, the rate vs. the state or utility average, the dollar gap to a typical home, the estimated share going to air conditioning or heating that month, and likely causes. Data: U.S. EIA monthly retail sales, EIA Form 861, and the EIA Residential Energy Consumption Survey (RECS). Statistical comparison, not a bill audit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_due": {
                "description": "Total amount on the bill in USD. Optional; enables the rate comparison.",
                "type": "number"
              },
              "home_size_sqft": {
                "description": "Home size in square feet, e.g. 1800.",
                "type": "number"
              },
              "household_size": {
                "description": "Number of people living in the home.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "kwh": {
                "description": "kWh used on this bill (one month).",
                "type": "number"
              },
              "month": {
                "description": "Month the bill covers (1-12). Optional but recommended: use varies a lot by season.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "U.S. state or D.C.: two-letter code (TX) or name (Texas).",
                "type": "string"
              },
              "utility": {
                "description": "Electric utility or retail provider name. Optional; compares the rate with that utility's average.",
                "type": "string"
              }
            },
            "required": ["home_size_sqft", "household_size", "kwh", "state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b47aeb4dbcdc3b8f289d758b675f0536bc14dcb7321cd2cc43ce32a4aa47ab2"
        },
        {
          "name": "find_utility_rate",
          "title": "Look up an electric utility's average rate",
          "description": "Search U.S. electric utilities and retail providers by name or initials (e.g. 'PG&E', 'Oncor', 'Duke Energy') and return each one's average residential price per kWh and customer count from EIA Form 861. These are what residential customers paid on average over the year, not current plan offers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Utility name or initials.",
                "type": "string"
              },
              "state": {
                "description": "Optional: limit to one state (code or name).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d03f67eb1e5a5046b7dcd36aad63cb8c5d0928cd8c9f94a2a6bde29dc25b34d2"
        },
        {
          "name": "get_state_electricity_stats",
          "title": "Average electricity rate and bill by state",
          "description": "Average residential electricity price (cents per kWh), monthly use, monthly bill, and 1- and 5-year price change for a U.S. state, D.C., or the U.S. overall, over the latest 12 months of EIA data. Omit `state` to get all 50 states and D.C., sorted by price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter code, state name, or 'US'. Omit for every state.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6b7cd7536fdafcedf9d72ad5c43af421d88979d81f7d56f2c0d8c27e7ab1fa3"
        }
      ],
      "digest": "sha256:b5ad0a10841d71391f7547bf75765534e05e29b6a6048fcc393f921069429435"
    }
  }
