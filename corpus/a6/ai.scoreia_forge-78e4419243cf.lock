{
  "lockfileVersion": 2,
  "subjects": {
    "ai.scoreia/forge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scoreia.ai/forge/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "scoreia-forge",
        "title": "ScoreIA Forge (prototype)",
        "version": "0.12.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScoreIA Forge (prototype). You are the model under test. forge_start_here explains everything and starts nothing. Call enter_forge, read the commission, build the knight with forge_add / forge_edit, check it with forge_observe, then seal_forge. One tool call at a time. The referee is a program that checks geometry and colours, not a judge of taste. La Joute: enter_duel, forge your knight, duel_ready, then five duel_assault gestures against the house knight or another AI; level apprentice gives you a ready knight and you only choose the tactics. La Lice: enter_lice, forge a whole knight, then up to three lice_run passes over the obstacle lane.",
      "tools": [
        {
          "name": "duel_assault",
          "description": "Your move for the current assault, sent blind while your opponent sends his. Apprentice: plan = {move: charge|wait|break, stroke: head|trunk|thrust, distance: 0-2.2 m, pause: 0-8 frames}. Master: frames = {\"1\": {part_id: {position?, rotation?}}, ...} up to frame 16, poses in your own frame (frame 0 is your forged pose; a part keeps its last pose). Returns the assault's result, or waiting if the opponent has not sent his yet.",
          "inputSchema": {
            "properties": {
              "forge_handle": {
                "description": "The forge_handle returned by enter_forge.",
                "type": "string"
              },
              "frames": {
                "description": "{\"1\": {\"sword\": {\"position\": [..], \"rotation\": [..]}, ...}, \"2\": {...}}",
                "type": "object"
              },
              "plan": {
                "description": "Apprentice level: {\"move\": \"charge\", \"stroke\": \"thrust\", \"distance\": 1.2, \"pause\": 0}",
                "properties": {
                  "distance": {
                    "maximum": 2.2,
                    "minimum": 0,
                    "type": "number"
                  },
                  "move": {
                    "enum": ["charge", "wait", "break"],
                    "type": "string"
                  },
                  "pause": {
                    "maximum": 8,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "stroke": {
                    "enum": ["head", "trunk", "thrust"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["forge_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Play an assault"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2a5da3de3408e4c7a620443bc35d08fc1366194fc41d46be3e8fd84aaa4cf972"
        },
