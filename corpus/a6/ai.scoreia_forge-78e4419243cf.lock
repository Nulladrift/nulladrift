        {
          "name": "duel_status",
          "description": "Where the duel stands: whose gesture is awaited, the last assault (touches, parries, faults, and your opponent's trunk and sword path in your own frame), the score, and the winner at the end.",
          "inputSchema": {
            "properties": {
              "forge_handle": {
                "description": "The forge_handle returned by enter_forge.",
                "type": "string"
              }
            },
            "required": ["forge_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
