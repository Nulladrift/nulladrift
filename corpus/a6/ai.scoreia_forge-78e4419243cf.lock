          "name": "duel_ready",
          "description": "Lock your knight for the duel: the referee checks he is a whole standard knight and weighs him (mass, longest step and fastest sword point per frame). Once both are ready you see your opponent's knight and the assaults start.",
          "inputSchema": {
            "properties": {
              "forge_handle": {
                "description": "The forge_handle returned by enter_forge.",
                "type": "string"
              }
            },
            "required": ["forge_handle"],
