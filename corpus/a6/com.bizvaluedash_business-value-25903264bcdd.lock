    "com.bizvaluedash/business-value": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bizvaluedash.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bizvaluedash",
        "title": "BizValueDash",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for questions about what a small private business is worth. Use search_guides and get_page for explanations, and estimate_value_range for an indicative range. Always present estimates as indicative, not as a formal valuation.",
      "tools": [
        {
          "name": "estimate_value_range",
          "title": "Indicative business value range",
          "description": "Return an indicative value range for a small private business from its yearly earnings and industry, using publicly reported average sale multiples. Earnings should be seller's discretionary earnings (profit before tax plus owner pay, interest and depreciation) for owner-operated businesses, or EBITDA for larger ones. Not a formal valuation.",
          "inputSchema": {
            "properties": {
              "annual_earnings": {
                "description": "Yearly earnings in US dollars.",
                "type": "number"
              },
              "industry": {
                "description": "Industry or sector, for example \"hvac\", \"dental\", \"restaurant\", \"manufacturing\". Optional.",
                "type": "string"
              }
            },
            "required": ["annual_earnings"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffd936674e2ef42255417433f9bb331f56ce8f66de33e54dde71f7ffb973492f"
        },
        {
          "name": "get_page",
          "title": "Get a BizValueDash page",
          "description": "Return the full text of one BizValueDash page. Pass a slug or URL from search_guides.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Page slug or full URL, for example \"sde-vs-ebitda\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f0fc864434e76f6df9ebb94387c6de83fc347bf7b63dc202a27c89c353a10a9"
        },
        {
          "name": "search_guides",
          "title": "Search BizValueDash guides",
          "description": "Search BizValueDash guides, glossary and pages about what a small business is worth, valuation multiples, SDE and EBITDA, what raises or lowers business value, and formal valuations. Returns the best matching pages with a short excerpt.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2dcf21cda9ac80987292607031897ae06002def56291772102639478d9a80398"
        }
      ],
