{
  "lockfileVersion": 2,
  "subjects": {
    "com.aifindme/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aifindme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aifindme",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI Find Me is a free directory of online shops with fact cards read from each shop's own website (what it sells, products with prices and stock, shipping, delivery, returns, payment methods, contact details, official links); it also holds some local businesses, so use shops_only for shops. Use search_businesses to find businesses by words, category, city and country (shops_only for web shops; country codes such as GB, NL or US: new shops come from the United Kingdom only for now, and the shops already listed in the Netherlands, Belgium and the United States stay listed), list_new_listings for what was added since a date, then get_business for the full fact card and get_products for what a web shop sells (categories, price range, a sample of products with prices and stock, shipping countries, delivery time, returns). The JSON card says where every fact came from; each listing says whether someone proved they control the website or a mailbox at its domain or published on it (\"Verified via website\", \"Verified via business email\", which is not a check of every fact) or not (\"Unclaimed\"). Facts are read automatically and can be wrong. Facts marked OpenStreetMap are © OpenStreetMap contributors (ODbL): keep that credit when you repeat them. Listings are re-checked regularly (each card shows the date of its last read).",
      "tools": [
        {
          "name": "get_business",
          "title": "Get a business fact card",
          "description": "Get every fact the directory holds about one business: summary, about, category, address and map link, phone, email, opening hours (with the time zone when known), price range, cuisine, services, prices, FAQs, features such as wheelchair access or delivery, payment methods, languages, registration numbers, booking/order/menu links, social profiles. Markdown by default; json gives the structured card with the source of each fact and completeness.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "markdown (default) or json",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "slug": {
                "description": "The business slug, from search_businesses",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2edeca252053096ee6537ef3e2b99ed0edf0458cf58444fe3161ef9838acd71"
        },
        {
          "name": "get_products",
          "title": "Get a web shop’s products",
          "description": "For a web shop: the shop facts (platform, categories, price range, currency, number of products, shipping countries, delivery time, free-shipping threshold, return period, review profiles, trust marks) and a sample of its products with name, price, stock, link and image, as the shop publishes them. Prices and stock are as of shop.productsChecked, the other shop facts as of shop.lastChecked (earlier after a re-check that read only the products). For a listing that is not a shop, shop is null and products is empty.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Number of products, default 20",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The business slug, from search_businesses",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:657e7556f063cde62935baa4436a46cd6a4bd7bc755daabfb0c12098aa77fe0c"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List the directory categories with their keys (for the category argument of search_businesses) and how many businesses each has.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:95a0e15accc1eda0850e17fda9a11a595a213be5d47882055e6f86416394718f"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "List the cities that have listings, most listings first, with the value to pass as the city argument of search_businesses. Optionally only cities with listings in one category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Only cities with listings in this category",
                "enum": ["restaurant", "cafe", "bakery", "bar", "hotel", "dentist", "health", "beauty", "fitness", "legal", "finance", "realestate", "home", "auto", "retail", "software", "agency", "education", "events", "travel", "pets", "creative", "nonprofit", "other"],
                "type": "string"
              },
              "limit": {
                "description": "Number of cities, default 50",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fc48473ed697bc05b70d1fda8ccffe84ceb09f5b9f56022457c31a62a1098d9b"
        },
        {
          "name": "list_new_listings",
          "title": "List new listings",
          "description": "Businesses newly listed in the directory since a date (default: the last 7 days, at most 90 days back), newest first, with their listing date; kind \"shop\" keeps the web shops, country (NL, BE, GB or US) one country. Poll it to learn about new shops and businesses; get_business and get_products give the facts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Two-letter country code: NL (Netherlands), BE (Belgium), GB (United Kingdom) or US (United States)",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "kind": {
                "description": "\"shop\": only web shops",
                "enum": ["shop"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results, default 25",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date or date-time, e.g. 2026-11-08 (default: 7 days ago)",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:280daffec1f792902d65c0984bb552ad1630635b96d36f4a268f8efe43aef30d"
        },
        {
          "name": "search_businesses",
          "title": "Search businesses",
          "description": "Search the AI Find Me business directory by words (a service, product, business name or feature), category and/or city. A sentence works too: small words (\"where\", \"buy\", \"the\") and shop words are ignored, plurals and accents don't matter, a country named last becomes a filter, a web address finds its listing. Listings with every word come first; when none has them all, the answer says relaxed: true and has listings with some. Returns up to 25 matching businesses with slug, name, category, city, a short summary, phone, website, whether someone proved control of the website or a mailbox (ownerVerified), when it was last checked, and the address of the full fact card; web shops also carry their platform, product count and categories. Use get_business with the slug for every fact, get_products for a shop's products.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category key (see list_categories)",
                "enum": ["restaurant", "cafe", "bakery", "bar", "hotel", "dentist", "health", "beauty", "fitness", "legal", "finance", "realestate", "home", "auto", "retail", "software", "agency", "education", "events", "travel", "pets", "creative", "nonprofit", "other"],
                "type": "string"
              },
              "city": {
                "description": "City name, as people write it (\"Amsterdam\"); see list_cities",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code: NL (Netherlands), BE (Belgium), GB (United Kingdom) or US (United States)",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Number of results, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for: a service, product, business name or feature",
                "maxLength": 200,
                "type": "string"
              },
              "shops_only": {
                "description": "Only web shops (online stores), e.g. for \"where can I buy X\" questions",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:caf81d82f0ba5c1346c5e30032a641a66a0e631de4ab9c1050a8a5724c747c34"
        }
      ],
      "digest": "sha256:6eb8edf1f56b3d42d1f9e0fc12d2e6ede71fe0fab470965df4cf76d590a3e37b"
    }
  }
}
