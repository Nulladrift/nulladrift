{
  "lockfileVersion": 2,
  "subjects": {
    "com.cordering/whitelabel-ordering": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wl-mcp.cordering.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "plate-and-fork",
        "version": "0.0.1"
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Plate & Fork food-ordering tools: browse restaurants on the Plate & Fork platform and order directly from them. Call list_vendors to show the available restaurants and list_menu to show a restaurant's menu — both return a complete, self-contained HTML document that you must present by opening it as an HTML artifact, never by pasting the markup into the chat as text. To order: call prepare_order to resolve the requested items and obtain a confirmation token, then call place_order with that token to place a real order, and check_order to follow it. Prices are in RSD and all times are in the Europe/Belgrade time zone.\n",
      "tools": [
        {
          "name": "check_order",
          "title": "Check an order",
          "description": "Check the current status of an order the user has already placed, using the order number returned by place_order. Reports whether the restaurant has accepted it, whether it is on its way, and whether it has finished (delivered or declined). There is no background tracking and no notification: call this again when the user asks, and only until the order is reported as finished.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant the order was placed with, from the list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              },
              "orderId": {
                "description": "The order number returned by place_order.",
                "type": "integer"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c832bd67d07bc6d7b54f791ec36ddb203c33dca8d4b0b7efc9730c371921d34"
        },
        {
          "name": "list_accounts",
          "title": "List signed-in accounts",
          "description": "Show which accounts are signed in, per restaurant, and which one is active. Useful when the user keeps separate work and personal accounts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List signed-in accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cf7ac5b4cad243c31ddd25983277c058b0ecc669db18599b316c703b00a135c"
        },
        {
          "name": "list_menu",
          "title": "Show a menu",
          "description": "Show the restaurant's menu to the user as a visual HTML document — a horizontally-scrollable category strip with item photos, names and prices. Present the returned HTML by opening it as an HTML artifact; do NOT paste the markup into the chat as text. (Ordering does not require this — prepare_order resolves item names on its own.)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant, from a list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              },
              "vendorId": {
                "description": "vendorId of the restaurant, from a list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Show a menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aaea81c374d7dd7ea49c2bdfe804079889943d89f96a21079e7df9cf9bb07122"
        },
        {
          "name": "list_vendors",
          "title": "List restaurants",
          "description": "Find restaurants (vendors) available for ordering. This is the discovery entry point: each card shows the clientId and vendorId that list_menu and prepare_order need. Call it with no arguments to list every restaurant — that is the normal case. Returns a complete, self-contained HTML document of vendor cards (logo, address, phone, delivery fee) — restaurants open today first in colour, those closed today greyed out at the bottom. Present the returned HTML to the user by opening it as an HTML artifact; do not paste the markup into the chat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City to filter by. Pass this ONLY when the user named a city themselves; never guess one from context, because a filter that matches nothing hides restaurants the user could have ordered from.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List restaurants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bd4391d9f494a40bd99c6f27554ee8daaa17737bc803b935689832d70120063d"
        },
        {
          "name": "login",
          "title": "Start signing in",
          "description": "Start signing the user in to a restaurant so they can place orders. Browsing the menu never needs this — only ordering and saving an address do. Returns a URL the user must open in a browser to sign in with Google or Apple; afterwards they copy the 'code' value from the address bar and you call submit_login_code. Each restaurant has its own login, so this must be done per restaurant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant to sign in to, from a list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start signing in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8bfcbcc9082783db80d5000fba3a1bd7b4214a52530caa5a272fd50391513984"
        },
        {
          "name": "logout",
          "title": "Sign out",
          "description": "Sign the user out. By default signs out of every restaurant; pass a clientId to sign out of one, and an account label to sign out just that account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant to sign out of. Omit to sign out everywhere.",
                "type": "integer"
              },
              "label": {
                "description": "Account label to sign out, e.g. 'work'. Omit to sign out every account at that restaurant.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Sign out"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9a410dac36643afac9a668daea3f98dd83760370d4f1d0754e285329d23d2223"
        },
        {
          "name": "place_order",
          "title": "Place the order",
          "description": "Place an order previously staged by prepare_order. Requires the confirmationToken returned by prepare_order. This causes a real order to be sent to the vendor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmationToken": {
                "description": "The confirmationToken returned by prepare_order.",
                "type": "string"
              }
            },
            "required": ["confirmationToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Place the order"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20a13e5ae6ff94f52e7e68590ff61539e80ce4f58837e6aad285382ff7574369"
        },
        {
          "name": "prepare_order",
          "title": "Prepare an order",
          "description": "Resolve a natural-language food order (one or more items) to concrete menu items and return a summary plus a confirmation token. Does NOT place the order. Call place_order with the returned token to actually place it. Delivery is as soon as possible by default; pass 'date' to ask for a later time instead. Each call covers one delivery, so an order for more than one day means one call per day. The restaurant may still refuse a time it is not open for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bringTerminal": {
                "description": "Whether the courier should bring a card terminal so the order can be paid by card on delivery. Pass true when the user wants to pay by card, false for cash; omit when they do not say. Ignored (with a note) by vendors that cannot take card on delivery.",
                "type": "boolean"
              },
              "clientId": {
                "description": "clientId of the restaurant, from a list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              },
              "cutlery": {
                "description": "Whether to ask the restaurant to include disposable cutlery. Only pass this when the user says either way; omit to leave it to the restaurant's default. Ignored (with a note) by vendors that do not offer it.",
                "type": "boolean"
              },
              "date": {
                "description": "Delivery date-time as an ISO-8601 UTC instant, e.g. '2026-07-25T12:00:00Z'. Must be in the future. Defaults to 5 minutes from now (as soon as possible) — only pass this when the user asks for a specific time.",
                "type": "string"
              },
              "deliveryAddress": {
                "description": "Delivery address text, e.g. 'Orlovica Pavla 26'.",
                "type": "string"
              },
              "items": {
                "description": "The item(s) to order — one or more lines, each with an item name, an optional quantity (default 1), an optional size, and optional extra ingredients by name.",
                "items": {
                  "properties": {
                    "extras": {
                      "description": "Extra ingredients to add to this item, by name, e.g. ['Šunka']. Each must be one of the extras that item offers (its own composition ingredients are not addable); repeat a name to add it twice.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "item": {
                      "description": "Menu item name, e.g. 'Margherita'.",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Quantity for this item, at least 1. Defaults to 1 if omitted.",
                      "format": "int32",
                      "type": "integer"
                    },
                    "size": {
                      "description": "Requested size by name, e.g. '33cm' or 'Large'. Selects that size variant of the item; omit for the standard size. A size the item is not available in is rejected with the list of sizes it does offer.",
                      "type": "string"
                    }
                  },
                  "required": ["item"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "Optional notes for the vendor.",
                "type": "string"
              },
              "vendorId": {
                "description": "vendorId of the restaurant, from a list_vendors result. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              }
            },
            "required": ["deliveryAddress", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Prepare an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3da2a788c986c76063a8d52729d2ed372a104907f68176bf4b58efa33c55fab"
        },
        {
          "name": "submit_login_code",
          "title": "Finish signing in",
          "description": "Complete a sign-in started by login, using the 'code' value the user copied from the browser address bar. On success the user can place orders from that restaurant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant being signed in to. Omit if only one sign-in is in progress.",
                "type": "integer"
              },
              "code": {
                "description": "The code value copied from the redirect URL after signing in.",
                "type": "string"
              },
              "label": {
                "description": "Optional label for this account, e.g. 'work' or 'personal'. Defaults to the email address on the account.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Finish signing in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9cfd6194843bc0f14c616b1d29105acc0d536d2e932158a5e304bba6e1b211d"
        },
        {
          "name": "switch_account",
          "title": "Switch account",
          "description": "Choose which signed-in account to order with at a restaurant, e.g. to switch between work and personal. The account must already be signed in via login.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientId": {
                "description": "clientId of the restaurant. Omit only when the server is configured for a single restaurant.",
                "type": "integer"
              },
              "label": {
                "description": "Account label to make active, e.g. 'work'.",
                "type": "string"
              }
            },
            "required": ["label"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Switch account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:549986c9669050b7d10adacb9c725d0c9ad2e52881112af4b35dc67f08ff18c2"
        }
      ],
      "digest": "sha256:69c0ec28756fff2272b4bc4afc05582f605c6bab3de9a97d9b12cd32da56fd39"
    }
  }
}
