        {
          "name": "stye_fit_to_duration",
          "title": "Find music that fits a runtime",
          "description": "Finds cues that fit an exact runtime, for a cut of known length such as a 30-second advert or a 90-second title sequence: music to license for a project, or anything about the Songs To Your Eyes catalogue.\n\nTwo kinds of result come back. Some cues already run close to the target length (fit='native'). Others are purpose-made short edits of a longer piece, cut down by the composer (fit='cutdown'), built to land on time rather than fade out.\n\ndelta_s is how far each result sits from the target, negative meaning shorter. For a cutdown, licence_ref identifies that specific edit (the thing to license), while ref points at the full-length original that carries the description and the preview.\n\nEvery result carries listen_url, a permanent public page where the cue plays, with cover art and a waveform. It is the only way a person can hear a cue: a cue listed without its listen_url cannot be auditioned.\n\nThe brief is matched on Songs To Your Eyes' own servers; it is not sent to any third-party AI service.",
          "inputSchema": {
            "properties": {
              "brief": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional sound brief, e.g. 'epic cinematic trailer'.",
                "title": "Brief"
              },
              "composer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only tracks credited to this composer/artist; partial names match, case-insensitive.",
                "title": "Composer"
              },
              "has_vocals": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true = songs with sung lead vocals/lyrics only. false = everything else, including wordless vocal textures (background vocals, choir).",
                "title": "Has Vocals"
              },
              "include_previews": {
                "default": false,
                "description": "Attach streaming preview links (15-min expiry).",
                "title": "Include Previews",
                "type": "boolean"
              },
              "limit": {
                "default": 8,
                "description": "Maximum results (default 8, up to 25).",
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "moods": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Match ANY of these moods.",
                "title": "Moods"
              },
              "target_seconds": {
                "description": "The runtime to fill, in seconds — e.g. 30 for a 30-second spot.",
                "exclusiveMinimum": 0,
                "maximum": 3600,
                "title": "Target Seconds",
                "type": "number"
              },
              "tolerance_seconds": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Acceptable deviation. Default: 15% of target, minimum 2s.",
                "title": "Tolerance Seconds"
              }
            },
            "required": ["target_seconds"],
            "title": "stye_fit_to_durationArguments",
            "type": "object"
          },
