      "instructions": "Songs To Your Eyes is a production music library. These tools search its catalogue of professionally produced cues across cinematic, trailer, underscore, electronic, rock and world music, many with stems, alternate mixes or timed cutdowns, for finding music to license for a video, film, advert, trailer or podcast.\n\nSearch matches meaning: a described scene or feeling ('tense investigative underscore that never resolves') matches better than a single keyword ('tense').\n\nEvery track result carries listen_url, a public page where the track plays. Listening conveys no licence; licensing is arranged with the Songs To Your Eyes team (info@songstoyoureyes.com). Nothing is bought or sold through these tools.",
