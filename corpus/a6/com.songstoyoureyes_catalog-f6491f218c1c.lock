                "title": "Bpm Min"
              },
              "brief": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the music should sound like and what it is for: the mood, the scene, the instruments, vocal textures, how it should build. E.g. 'tense investigative underscore that never resolves'. Tempo and length have their own filters; vocal texture (wordless backing vocals, choir pads) is matched from the brief.",
                "title": "Brief"
              },
              "composer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only tracks credited to this composer/artist. Partial names match ('Albeg' finds 'Yair Albeg Wein'), case-insensitive, with or without a brief. Every result carries its `composer` credit.",
                "title": "Composer"
