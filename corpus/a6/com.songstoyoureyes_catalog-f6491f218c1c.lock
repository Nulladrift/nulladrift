        {
          "name": "stye_search_tracks",
          "title": "Find music for a scene or brief",
          "description": "Searches the Songs To Your Eyes production-music catalogue for cues that fit a brief for a video, film, advert, trailer or podcast: music to license for a project, or anything about the Songs To Your Eyes catalogue.\n\nThe brief is matched by MEANING against an editorial description of how each cue behaves\nas well as against its tags, so a described scene, mood, instrumentation or arc (\"tense\ninvestigative underscore that never resolves\", \"warm and hopeful for a charity film\")\nmatches far better than a single keyword.\n\nLISTENING. Each result carries listen_url, a permanent public page where that cue plays.\nIt is the only way a person can hear a cue: a cue listed without its listen_url cannot be\nauditioned. This holds for every list, an album listing included.\n\nPRIVACY. When a brief has not been searched before, its text is sent to Google's Gemini\nAPI to interpret it; no identifier is sent.\n\nFILTERS. Every filter is a hard constraint. Filters combine with AND, and a cue missing\nthe tag a filter tests is excluded, so several filters together can empty a page. The\nbrief carries soft qualities without excluding anything.\n\nPAGES. One call returns one page of up to 25 cues (default 15); there is no pagination,\nand identical arguments return identical cues. A different brief, or the same need\nphrased from a different angle, returns different cues.\n\nVOCALS. has_vocals=true selects songs with sung lead vocals and lyrics. Wordless vocal\ntextures (background vocals, oohs and aahs, choir pads) are classed as instrumental,\nhas_vocals=false; a request for \"background vocals\" is almost always a request for no\nlyrics. Texture words in the brief (\"background vocals\", \"choir\", \"vocal hooks\", \"group\nsinging\") are detected server-side and applied as a hard requirement, so every result\ncarries that texture and a short page reflects the catalogue's actual supply of it.\n\nCOMPOSERS. The composer filter matches the credited composer by partial name, with or\nwithout a brief (with none, it lists that composer's cues). Each result's `composer` field\nis the catalogue's own writer credit.\n\nANGLES. A page reflects one phrasing of a brief. Phrasings from different angles reach\ndifferent parts of the whole catalogue: the literal angle (traditional instruments and idiom), the\nfeel angle (texture, pulse and atmosphere with no instrument names, e.g. \"hazy hypnotic\nmodal groove, dusty and sun-baked\") and the crossover angle (the setting's colour through\nanother genre: desert funk, ethnic electronica, psychedelic world). The feel and crossover\nangles routinely surface the most distinctive picks, which a literal phrasing misses.\n\nPLACES. The catalogue describes music by instrument, texture and mood, not geography:\nregion and culture names (\"Moroccan\", \"Gnawa\", \"Berber\") appear in almost no tags, so a\nbrief built on them loses its keyword match, while the sound of the place (oud, darbuka,\nqanun, hand percussion; desert, hypnotic, modal, dusty) matches.\n\nALBUMS. Albums are curated sets of about five cues built around one idea. A general search\nreturns at most two cues per album (max_per_album) so that a page spans the catalogue, and\n`albums_represented` reports how many distinct albums the page drew on. The album filter\nreturns a whole set and lifts that cap. A recommendation built from a single album shows\none record's take on a brief rather than the catalogue's range.\n\nEVENTS AND OCCASIONS. Tags naming a specific event (a festival, a holiday, an occasion)\nare on a handful of cues, not applied systematically: only 20 cues carry \"Burning Man\"\nwhile the catalogue holds ~1,900 electronic cues, and\n39 carry \"Festival\". An event-tag match is therefore a narrow slice. The music an occasion\nimplies reaches much further: house, techno, trance and rave for a festival; the\nemotional register, rather than the word, for a wedding.\n\nCONTEXTS. The `context` parameter runs an owner-curated occasion search ('rave-club',\n'christmas', 'halloween', 'summer' and others) against assignments precomputed from the\ncatalogue owner's translation rules: \"rave\" reaches the whole beat-driven electronic\npalette, not just the cues that carry a festival tag. An unknown name returns the full\nlist of valid contexts. Country names (Lebanon, Morocco, Turkey...) are accepted and\ngeneralise to their regional palette, where the catalogue's world coverage is deeper. Some\ncontexts are ambiguous (summer, a country or territory): they return results grouped into\n2-4 labelled directions, each with its own slug, plus a question that tells them apart;\nthat slug passed as `context` returns the one direction.\n\nAMBIGUOUS BRIEFS. Some briefs span genuinely different musical directions: \"summer vibes\"\ncan mean tropical-house feelgood, chill-lounge, world/travel or sexy/fashion. A single\nsearch commits to one reading; the ambiguous contexts return the labelled spread.\n\nREFERENCES. The catalogue's tags carry no artist, composer, film or brand names, so a\nreference searched verbatim (\"a la Philip Glass\", \"like Stranger Things\", \"think Apple\nads\") finds little, while a description of its sound matches: Philip Glass is minimal\npulsing arpeggios, piano and strings, hypnotic repetition; Trent Reznor meets M83 is dark\nindustrial synths under huge emotive electronic swells; Stranger Things is a retro analog\nsynth pulse, ominous but restrained.\n\nNEGATIVES. Negation written into the brief does not subtract from a search. The `exclude`\nparameter hard-drops any cue carrying the listed tags, spelling variants included. It\ntakes tag-shaped terms (instruments, moods, genres); soft qualities (\"not too hard\")\nmatch better as positive wording in the brief (\"restrained\", \"understated\").\n\nSTEMS, CUTDOWNS AND KEYS. The catalogue holds ~44,000\nstem versions and ~2,800 drums-only stems, and\n~1,100 cues have a labelled :30 cutdown; each\nresult's `versions` counts what exists for that cue. The `key` filter matches briefs like\n\"preferably in E\" (E matches both E and Em); ~7,200 mains\ncarry a key.\n\nCLEAN LYRICS. `explicit`: true means the catalogue owner has flagged the cue's sung lyrics\nas not clean.\n\nLYRICS. 328 cues have lyrics on file, and the lyrics are in the full-text index, so words\nthat are actually sung match. Matching is by wording, not subject: \"a song about winning\"\nfinds lyrics containing \"winning\", not every song about victory. The catalogue is\noverwhelmingly instrumental, so a lyric match is a narrow slice on top of the musical\nmatch.\n\nRESULTS. Each result describes one cue. listen_url is a permanent public page where the\ncue plays, with cover art and a waveform: it is how a person actually hears the music.\nEvery playable row carries its own listen_url. The versions of a cue share one title and\ndiffer only by ref, so a link built by hand from a title or a ref can point at the wrong\naudio.\n\nAlso returned: title, album, album_title, composer (the catalogue's own writer credit),\ndescription (what it sounds like and what it suits), duration_s, bpm, key, has_vocals,\nexplicit, genres, moods, instruments, use_cases, keywords (extra catalogue tags beyond\nthose lists, such as tempo bands like 'Mid Tempo' and placements like 'TV Score'), and\nthree editorial judgements: energy (low | low-building | moderate | building | high),\nresolves (whether it lands, or stays unresolved and tense) and vo_friendly (whether it\nleaves space for a voiceover). versions counts the stems, alternate mixes and shorter cuts\nthat exist for the cue, and cutdown_lengths_s lists the cut lengths in seconds. ref is the\ncatalogue's ID for the cue. preview_url, when requested, is a temporary streaming link\nthat expires after 15 minutes; listen_url never expires.\n\nA field absent from a row means the catalogue holds no data for it: an absent bpm means\nuntagged, not slow; an absent composer means no usable credit; an absent cutdown_lengths_s\nmeans no timed cutdowns exist.\n\nThe player streams nearly every cue clean. A file downloaded from it without a licence is\na watermarked test file (a spoken \"STYE Music\" tag); a clean file comes with a licence.\npreview_url is watermarked too.\n",
          "inputSchema": {
            "properties": {
              "album": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
