        {
          "name": "search_packages",
          "description": "Search hand-curated trip packages bundling event tickets + hotel + experiences with savings vs DIY booking. Packages live on dedicated /packages/ pages and include preview hotel, ticket category, and (sometimes) experience list. Filter by category (concerts, f1, world_cup, tennis, nfl, etc.), city, country, date range, or package type (single_event for one-day events; multi_event_city for multi-day city trips with multiple events). Returns complete trip recommendations; ticket-only inventory is returned by search_events. Prices include all package components.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Package category. Common values: concerts (1000+ packages), f1 (Formula 1 race weekends), world_cup (FIFA World Cup 2026), tennis (Grand Slams), nfl, mlb, nba, nhl, epl/la_liga/serie_a/bundesliga (soccer leagues), city_multi (multi-event city trips), festivals.",
                "enum": ["concerts", "f1", "motogp", "world_cup", "tennis", "nfl", "mlb", "nba", "nhl", "epl", "la_liga", "serie_a", "bundesliga", "ucl", "mls", "ligue_1", "city_multi", "festivals"],
                "type": "string"
              },
              "city": {
                "description": "Filter by destination city (e.g. 'London', 'New York').",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "description": "Filter by destination country name (e.g. 'England', 'USA', 'Spain'). Note: packages use country name, not ISO code.",
                "maxLength": 60,
                "type": "string"
              },
              "currency": {
                "enum": ["AUD", "USD", "NZD", "GBP", "EUR", "SGD", "CAD", "MYR"],
                "type": "string"
              },
              "date_from": {
                "format": "date",
                "type": "string"
              },
              "date_to": {
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "package_type": {
                "description": "single_event (one event) or multi_event_city (multiple events in one city trip).",
                "enum": ["single_event", "multi_event_city"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Curated Packages"
          },
