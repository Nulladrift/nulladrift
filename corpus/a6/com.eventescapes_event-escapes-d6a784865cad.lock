        {
          "name": "search_events",
          "description": "Search upcoming sporting and music events bookable on Event Escapes. Covers F1, MotoGP, all major soccer leagues, NFL, NHL, MLB, NBA, tennis Grand Slams, rugby, cricket, golf, volleyball, boxing, MMA, horse racing, athletics, and major concerts. Filter by sport, city, country, or date range. Returns event inventory (tickets only); curated trip packages bundling tickets, hotel and experiences are returned by search_packages. Prices are estimates; the final price is set at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "enum": ["AUD", "USD", "NZD", "GBP", "EUR", "SGD", "CAD", "MYR"],
                "type": "string"
              },
              "date_from": {
                "format": "date",
                "type": "string"
              },
              "date_to": {
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "enum": ["f1", "motogp", "soccer", "premier_league", "la_liga", "champions_league", "nfl", "nhl", "mlb", "nba", "tennis", "rugby", "volleyball", "golf", "cricket", "boxing", "mma", "horse_racing", "athletics", "music"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8da6aa1fd27670a25c42bf46ee63240bf616e75802c471c4e5d1a30d65bb2465"
        },
