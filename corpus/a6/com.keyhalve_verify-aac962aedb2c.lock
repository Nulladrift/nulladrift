{
  "lockfileVersion": 2,
  "subjects": {
    "com.keyhalve/verify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.keyhalve.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "keyhalve-verify",
        "title": "KeyHalve — verify sealed documents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free, public verification of KeyHalve-sealed documents (from any platform on the rail: ValidPay, CheckBooks, …). Use keyhalve_verify with a verify URL or QR text. This server never receives decryption keys — sealed contents remain readable only in the holder's browser.",
      "tools": [
        {
          "name": "keyhalve_explain",
          "description": "Plain-language explanation of what a KeyHalve verification verdict means and why it can be trusted (blind rail, three-share custody, commitments, revocation). Optionally focused on one topic.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Optional single topic; omit for the overview.",
                "enum": ["verdict", "blindness", "rail", "revocation", "integrity", "issuer_trust", "limits"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a KeyHalve verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:864070f0a86e3119aff1a288a375b2543ae4c89fb44355ffaa05cf37f5c8d612"
        },
        {
          "name": "keyhalve_status",
          "description": "Live status of a KeyHalve-sealed document by id: active, revoked (with reason/time), or outside its validity window. Lighter than keyhalve_verify — status only, no integrity or rail checks. Use for \"is this still good right now?\"",
          "inputSchema": {
            "properties": {
              "document_id": {
                "description": "The document id, e.g. vp_…, kh_…, cb_….",
                "type": "string"
              }
            },
            "required": ["document_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check live document status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bee0ba3da862b1ea7a9d585494b210cf0805f3a38c2fe2efdfb055b84a484394"
        },
        {
          "name": "keyhalve_verify",
          "description": "Verify a KeyHalve-sealed document. Accepts a verify URL, the raw text of a KeyHalve QR code, or a document id (vp_…, kh_…, cb_…). Returns the cryptographic verdict: whether the seal exists, its live status (active/revoked/expired), ciphertext integrity against the issuance commitment, the KeyHalve rail's independent attestation, the validity window, and the issuer's trust context. This tool NEVER decrypts sealed contents — any decryption key in the URL fragment is discarded unread; contents are only readable by opening the verify URL in a browser.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "A KeyHalve verify URL, QR-code text, or bare document id.",
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify a sealed document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fabce5a33a57e66b261602e97b3ea50ab939bf85debf31220f662abfe702aefa"
        }
      ],
      "digest": "sha256:05edcf44e8565e8f640216cdd56b70bc184eb906bcbabb4c0a06cc56859edde6"
    }
  }
}
