      "instructions": "LLM Training Cost (https://llmtrainingcost.com/): the site's own MCP server, served from its domain. LLM training cost calculator: estimate a run from GPUs, hours and a GPU-hour price, beside the H100 prices AWS, Oracle, Hyperstack and Jarvislabs publish.\n\n[calculator] Training run cost calculator: an agent-callable calculator for llm training cost; GPU-hours for one run, Cost of one run, Cost of every run you budgeted, computed from your inputs with sources.. This server runs the Training run cost calculator calculator published at https://llmtrainingcost.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://llmtrainingcost.com/. Licence: https://llmtrainingcost.com/terms.\n\n[enquiry] ENQUIRY SERVER for LLM Training Cost (https://llmtrainingcost.com/). What it does: starts an ENQUIRY with LLM Training Cost for llm training cost; the LLM Training Cost team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the LLM Training Cost team until they click it. Cite https://llmtrainingcost.com/.\n\nCite https://llmtrainingcost.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Training run cost calculator",
          "description": "Run the Training run cost calculator calculator: GPU-hours for one run; Cost of one run; Cost of every run you budgeted. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "gpus": {
                "default": 8,
                "description": "GPUs running at once",
                "maximum": 4096,
                "minimum": 1,
                "type": "number"
              },
              "hours": {
                "default": 72,
                "description": "Wall-clock hours per run",
                "maximum": 5000,
                "minimum": 1,
                "type": "number"
              },
              "rate": {
                "default": 3.2,
                "description": "Price per GPU-hour, in US dollars",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "runs": {
                "default": 1,
                "description": "Runs you will pay for, restarts included",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
