                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "operation_id": {
                "description": "A unique ID for this user-requested action. Reuse this exact ID and payload after a timeout; use a new ID only for a new action.",
                "maxLength": 128,
                "minLength": 16,
                "type": "string"
              },
              "prep_minutes": {
                "maximum": 1440,
                "minimum": 0,
                "type": "integer"
              },
              "servings": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "tags": {
                "default": [],
                "items": {
                  "maxLength": 50,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cook_minutes", "difficulty", "ingredients", "instructions", "meal_types", "operation_id", "prep_minutes", "servings", "title"],
            "type": "object"
