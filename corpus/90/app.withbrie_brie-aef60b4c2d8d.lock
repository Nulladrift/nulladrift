        {
          "name": "update_recipe",
          "title": "Update a saved Brie recipe",
          "description": "Update an existing recipe as a named version only after the user reviews the changes and asks to save them. First use get_recipe; copy version_id and version_revision into the expected fields. Submit the complete revised recipe: omitted ingredients and directions are removed. Map existing ingredient_id values to source_ingredient_id; use null for new ingredients. Keep current display_text and preserve qualitative or ranged quantities as null. Retains the recipe ID, image, source, earlier versions, and versions used by planned meals. External services may prepare optional nutrition and search updates. On version_conflict, read and review again before a new operation; never silently rebase or create a duplicate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "change_summary": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "cook_minutes": {
                "maximum": 1440,
                "minimum": 0,
                "type": "integer"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "difficulty": {
                "enum": ["easy", "moderate", "challenging"],
                "type": "string"
              },
              "expected_revision": {
                "description": "Copy version_revision from that same get_recipe result. On conflict, reload and review with the user; never silently overwrite.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "expected_version_id": {
                "description": "The current version_id returned by get_recipe before discussing this edit.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "anyOf": [
                        {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "display_text": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "group": {
                      "anyOf": [
                        {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 180,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "anyOf": [
                        {
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "optional": {
                      "type": "boolean"
                    },
                    "preparation": {
                      "anyOf": [
                        {
                          "maxLength": 180,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "quantity_text": {
                      "anyOf": [
                        {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "source_ingredient_id": {
                      "anyOf": [
                        {
                          "pattern": "^ingredient_[1-9]\\d*$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Copy ingredient_id from the base recipe for retained or changed rows; null only for a newly added ingredient. Omit removed rows."
                    },
                    "unit": {
                      "anyOf": [
                        {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["amount", "display_text", "group", "name", "note", "optional", "preparation", "quantity_text", "source_ingredient_id", "unit"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "instructions": {
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 80,
                "minItems": 1,
                "type": "array"
              },
              "operation_id": {
                "description": "A unique ID for this user-requested action. Reuse this exact ID and payload after a timeout; use a new ID only for a new action.",
                "maxLength": 128,
                "minLength": 16,
                "type": "string"
              },
              "prep_minutes": {
                "maximum": 1440,
                "minimum": 0,
                "type": "integer"
              },
              "recipe_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "servings": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "version_label": {
                "default": "Our edited version",
                "description": "A short descriptive name, such as Less sweet. Use the version label requested by the user, if any.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
