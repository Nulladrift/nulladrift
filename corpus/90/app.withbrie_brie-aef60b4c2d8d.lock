        {
          "name": "create_recipe",
          "title": "Save a new recipe to Brie",
          "description": "Save a complete new recipe only after the user asks to save it. Supply ingredients, servings, times, and ordered directions; keep unknown, qualitative, or ranged quantities null and preserve their wording in raw_text. Never invent source facts or macros. Returns the saved recipe immediately; external services prepare its image and optional estimated nutrition in the background. Use get_recipe to check readiness.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cook_minutes": {
                "maximum": 10080,
                "minimum": 0,
                "type": "integer"
              },
              "cuisine": {
                "default": "Home cooking",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "default": "",
                "maxLength": 2000,
                "type": "string"
              },
              "difficulty": {
                "enum": ["easy", "moderate", "challenging"],
                "type": "string"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 100000,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "optional": {
                      "default": false,
                      "type": "boolean"
                    },
                    "quantity_text": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "raw_text": {
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "section": {
                      "enum": ["Produce", "Meat", "Dairy", "Pantry", "Frozen", "Household"],
                      "type": "string"
                    },
                    "unit": {
                      "anyOf": [
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["amount", "name", "raw_text", "section", "unit"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "instructions": {
                "items": {
                  "maxLength": 3000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "meal_types": {
                "items": {
                  "enum": ["breakfast", "lunch", "dinner"],
                  "type": "string"
