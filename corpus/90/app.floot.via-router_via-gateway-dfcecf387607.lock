{
  "lockfileVersion": 2,
  "subjects": {
    "app.floot.via-router/via-gateway": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://via-router.floot.app/_api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "via-router-discovery",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use free via_list_services and via_get_service, or via_api_compare for a paid comparison. With an x-credit-token connection header, each call costs0.01 USD of prepaid credit and requires a UUID requestId; reuse it only for retries of identical input. Without prepaid credit, use an authorized x402 buyer wallet for the0.01 USDC challenge. Never submit both payment methods. Credit loading: https://via-router.floot.app/credits. Use via_one_call_quote for a free toll quote, via_one_call for the existing buyer-approved x402 payment and delivery flow, and via_one_call_status for external Transit recovery. Supply maxUsdc and a private UUIDv4 orderId for execution. Prepaid comparison credit does not fund suppliers. This server never signs buyer payments.",
      "tools": [
        {
          "name": "via_api_compare",
          "description": "Compare APIs for a buyer task. Pay0.01 USDC on Base with an authorized x402 wallet, or0.01 USD of prepaid VIA credit if your MCP connection has an x-credit-token header. Prepaid calls require requestId: a fresh UUID per task, reused only to retry the same task without another debit. Returns a recommendation and alternatives. Supplier purchase is separate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "default": "US",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "intent": {
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["en", "pt"],
                "type": "string"
              },
              "requestId": {
                "description": "Required for prepaid credit. New UUID per task; preserve it for retries of identical input.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd0e46ea9c75c43446cd62d2f1551acfe9cd2a7b28ad0d6f2b99fe1e3625d05a"
        },
        {
          "name": "via_extract_page",
          "description": "Extract structured text from a public web page or PDF for 0.02 USDC on Base via x402. Payment is only made after buyer approval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeLinks": {
                "type": "boolean"
              },
              "maxChars": {
                "maximum": 100000,
                "minimum": 500,
                "type": "integer"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:287620d982a43471755aa209a6a4129134881d962ea3c08c5f10e9a129c5b993"
        },
        {
          "name": "via_extract_web_lite",
          "description": "Web Text Lite: extract clean text, title and headings from a public HTML or plain-text page (up to 1 MiB, max 10000 characters; no PDF, OCR, JavaScript rendering or links) for 0.001 USDC on Base via x402. PDF URLs are refused before payment; use via_extract_page (0.02 USDC) for PDFs. Nothing is charged if extraction fails. Payment is only made after buyer approval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxChars": {
                "default": 10000,
                "maximum": 10000,
                "minimum": 500,
                "type": "integer"
              },
              "url": {
                "description": "Public HTML or plain-text page; not a PDF",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f57d7126f02d6e6247847231ad39b06db749b28e8b6a039959dd3b3c8565595"
        },
        {
          "name": "via_get_service",
          "description": "Free integration instructions for one VIA HTTP service: exact endpoint, JSON input schema, example and x402 payment steps. Does not execute the service or authorize payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Exact service name from via_list_services",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddbae61ab51b8a1128dfc416395206d03ba0ef124e4b48f54bf3cf8ff25ef7b4"
        },
        {
          "name": "via_list_services",
          "description": "Free VIA service discovery. Lists HTTP services and advertised prices; does not run research, charge, sign or purchase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional topic or service-name filter",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89eabbf454b4346a9c7e83530a365fe3f656815cd5cd561a232887bc487c038c"
        },
        {
          "name": "via_one_call",
          "description": "Execute a VIA toll operation through the existing One-Call payment and delivery handler. First call without payment returns the live x402 offer; only after buyer approval, retry IDENTICAL task, maxUsdc and private orderId with the buyer-signed payload in params._meta['x402/payment']. Buyer pays VIA before an eligible external supplier is paid; VIA relays delivery and retains its margin. Only supported tasks/suppliers. No automatic signing or financial retry. Prepaid comparison credits do not fund this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxUsdc": {
                "description": "Maximum approved total in USDC, including supplier and VIA margin.",
                "pattern": "^(0|[1-9]\\d*)(\\.\\d{1,6})?$",
                "type": "string"
              },
              "orderId": {
                "description": "Private client-generated UUIDv4. Required for execution; preserve it and the exact body for payment retry and recovery.",
                "format": "uuid",
                "type": "string"
              },
              "task": {
                "maxLength": 1000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["maxUsdc", "orderId", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30f80edcece7e0d7c62d1629f3eec415baa209f991502e4eeb949f8ceb8aec3c"
        },
        {
          "name": "via_one_call_quote",
          "description": "Free quote for the VIA toll: VIA-owned delivery first, eligible paid supplier otherwise. Returns supplier cost, VIA margin and total. Use maxUsdc '0' to check the price with no approved spend. No wallet signature or payment. Continue only if ok and executionEnabled are true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxUsdc": {
                "description": "Maximum approved total in USDC, including supplier and VIA margin.",
                "pattern": "^(0|[1-9]\\d*)(\\.\\d{1,6})?$",
                "type": "string"
              },
              "orderId": {
                "description": "Private client-generated UUIDv4. Required for execution; preserve it and the exact body for payment retry and recovery.",
                "format": "uuid",
                "type": "string"
              },
              "task": {
                "maxLength": 1000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["maxUsdc", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec11cb3edaedf00f11496a5f35ba5950b6ea5e4cc88f7757e9898ade4437fef7"
        },
        {
          "name": "via_one_call_status",
          "description": "Free status/recovery lookup for an external Transit order using its private UUIDv4. If retryAfterSeconds is present, wait before repeating this status lookup only. Delivered results may include the original x402 receipt in _meta. Never submits payment. Does not cover VIA-owned service receipts; 404 is not proof that a payment did not occur.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "orderId": {
                "description": "Private client-generated UUIDv4. Required for execution; preserve it and the exact body for payment retry and recovery.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28d5fd0d48415c2ad70cfd4ed404dbf70fa6d98b2e400624632d523d2ff01335"
        }
      ],
      "digest": "sha256:fff18beaf02357c2101e518e9c71e2ee633f11caac090c7cd2d98c6fb8c43966"
    }
  }
}
