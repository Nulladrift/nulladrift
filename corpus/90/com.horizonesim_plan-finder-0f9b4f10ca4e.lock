{
  "lockfileVersion": 2,
  "subjects": {
    "com.horizonesim/plan-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://horizonesim.com/api/v1/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "horizon-public",
        "title": "Horizon eSIM",
        "version": "1.0.0",
        "websiteUrl": "https://horizonesim.com",
        "icons": [
          {
            "src": "https://horizonesim.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://horizonesim.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Horizon eSIM sells prepaid travel eSIM data plans on horizonesim.com: fixed-data plans, and in many destinations unlimited plans with a high-speed allowance for the whole plan, then up to 1 Mbps until the plan ends. Use these tools when someone needs mobile data for a trip, compares plans or prices for a country or region, asks whether a phone supports eSIM, or has a problem with a Horizon eSIM. For one country, call list_destination_plans. For a trip through several countries, call search_destinations with coveringCountries first. Quote prices (EUR, paid once) and plan links exactly as returned: each link opens the plan's page, which shows the final price before purchase. These tools cannot buy a plan, take a payment, sign anyone in or read an order. For those, link the plan page or Horizon support at https://horizonesim.com/contact.",
      "tools": [
        {
          "name": "check_device_compatibility",
          "title": "Device compatibility guidance",
          "description": "Looks up a phone or cellular tablet in Horizon's curated eSIM device list. A listed model is not proof that every regional variant is compatible or carrier-unlocked, and not_listed does not mean incompatible. Matching is most reliable with the exact model name and the region where the device was sold. The lookup needs no IMEI or EID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "model": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "match": {
                "enum": ["listed", "similar_models", "not_listed"],
                "type": "string"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    },
                    "platform": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "model", "platform"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["checks", "match", "models", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Device compatibility guidance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:174f4607c4b2dfc473cfd66db9e2da76c3689a5a9ba2d7779a35a4955a9bf418"
        },
        {
          "name": "get_destination_coverage",
          "title": "Destination coverage and local networks",
          "description": "Shows the countries and published local mobile networks for a Horizon destination, with currently verified 4G/5G claims. Use for regional coverage, a stopover, or manual network selection. Country inclusion does not guarantee signal everywhere, and an absent radio claim does not prove a network lacks that technology. This describes new-sale catalog coverage, not a customer's purchased plan or current location.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "catalogUpdatedAt": {
                "type": ["string", "null"]
              },
              "countries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "networks": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "verifiedTechnologies": {
                            "items": {
                              "enum": ["4G", "5G"],
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["name", "verifiedTechnologies"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["code", "name", "networks"],
                  "type": "object"
                },
                "type": "array"
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["name", "slug", "type"],
                "type": "object"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "radioClaimsValidUntil": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["catalogUpdatedAt", "countries", "destination", "limitations", "radioClaimsValidUntil", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destination coverage and local networks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1b4d51fc23b0ad12fa150a97731ca686aae9e3d7311e1853a3ca191ec2505b8a"
        },
        {
          "name": "get_support_policy",
          "title": "Current Horizon support policies",
          "description": "Answers activation and first-use timing, refund eligibility, hotspot and speed policy, or human support availability from Horizon's shared policy constants. No order ID or verification is needed. This never performs a refund or a handoff.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "enum": ["activation", "refunds", "hotspot_and_speed", "support"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "humanSupportUrl": {
                "type": "string"
              },
              "nextStep": {
                "type": "string"
              },
              "statement": {
                "type": "string"
              },
              "topic": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["humanSupportUrl", "nextStep", "statement", "topic", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Current Horizon support policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:757cd0353f94ea1ee1de2fbc8bbba3dd7ea64cc195c452e693c56265cfe21ad5"
        },
        {
          "name": "get_troubleshooting_steps",
          "title": "eSIM troubleshooting steps",
          "description": "Returns Horizon's approved steps for one eSIM problem, in the customer's language and in the order to try them: the eSIM does not install, no signal, signal but no internet, slow data, or the hotspot does not work. None of the steps deletes the eSIM.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "issue": {
                "description": "install: the eSIM does not install. signal: no signal. internet: signal but no internet. slow: the connection is slow. hotspot: the hotspot does not work.",
                "enum": ["install", "signal", "internet", "slow", "hotspot"],
                "type": "string"
              },
              "locale": {
                "description": "The customer's language code, one of en, sq, de, tr, fr, ar, pl, es, ru, hr, it, zh, he, ja, af. Other codes get English.",
                "maxLength": 35,
                "type": "string"
              },
              "platform": {
                "default": "unknown",
                "description": "The customer's phone: ios for an iPhone, android for an Android phone, unknown when the customer did not say.",
                "enum": ["ios", "android", "unknown"],
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "completedText": {
                "type": "string"
              },
              "issue": {
                "enum": ["install", "signal", "internet", "slow", "hotspot"],
                "type": "string"
              },
              "issueLabel": {
                "type": "string"
              },
              "locale": {
                "enum": ["en", "sq", "de", "tr", "fr", "ar", "pl", "es", "ru", "hr", "it", "zh", "he", "ja", "af"],
                "type": "string"
              },
              "platform": {
                "enum": ["ios", "android", "unknown"],
                "type": "string"
              },
              "steps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "platformHints": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "platformHints", "text", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["completedText", "issue", "issueLabel", "locale", "platform", "steps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "eSIM troubleshooting steps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:358ae28f645c240cb54792dedc4c5d6a416fd5ca47eefd7c935da997e4ed76ab"
        },
        {
          "name": "list_destination_plans",
          "title": "Destination plans and prices",
          "description": "Lists the eSIM plans that Horizon sells now for one destination (a country or a region): the data amount, the number of days, the unlimited flag, the price in EUR and a link to each plan's page on horizonesim.com. For an unlimited plan, unlimitedTerms gives the high-speed allowance for the whole plan and the speed after it until the plan ends. Takes the destination's English name or slug, for example \"Netherlands\", \"United States\" or \"europe\". Prices and links are current when returned; the plan page shows the final price before purchase.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "description": "The English name or the slug of a country or region, for example \"Netherlands\", \"usa\", \"balkans\" or \"europe\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "type": {
                    "enum": ["country", "region", "global"],
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "slug", "type", "url"],
                "type": "object"
              },
              "plans": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dataGb": {
                      "type": ["number", "null"]
                    },
                    "days": {
                      "type": "number"
                    },
                    "isUnlimited": {
                      "type": "boolean"
                    },
                    "promotionalSellingPriceEur": {
                      "type": ["number", "null"]
                    },
                    "sellingPriceEur": {
                      "type": "number"
                    },
                    "unlimitedTerms": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["dataGb", "days", "isUnlimited", "promotionalSellingPriceEur", "sellingPriceEur", "unlimitedTerms", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["currency", "destination", "plans"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destination plans and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2fd60c6b6e6fe624cb28abc45b9f5c1935783b8ac6394e2000c0b9c0d603ff1c"
        },
        {
          "name": "search_destinations",
          "title": "Find Horizon destinations",
          "description": "Finds Horizon's country, regional and global destinations by English name, slug or ISO country code, for a destination whose name is unclear or a trip through several countries. With coveringCountries (ISO-3 codes) it returns only the destinations that cover every country of the itinerary. Returns each destination's name, slug and type, without prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "coveringCountries": {
                "default": [],
                "description": "ISO-3 country codes, for example FRA and DEU.",
                "items": {
                  "pattern": "^[A-Z]{3}$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destinations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "countryCodes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["countryCodes", "name", "slug", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextOffset": {
                "type": ["number", "null"]
              },
              "nextStep": {
                "type": "string"
              }
            },
            "required": ["destinations", "nextOffset", "nextStep"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Horizon destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9ec1ea971a423460043f8c458ab090287757390b9ff3f7c418760c93c02ab0b0"
        }
      ],
      "digest": "sha256:aaa42d384cf427b8bba9f8c5bc3be1a793f8de47abe06eae9a2ac59ef0c19872"
    }
  }
}
