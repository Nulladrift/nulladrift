{
  "lockfileVersion": 2,
  "subjects": {
    "com.pick-rate/hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pick-rate.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pickrate",
        "title": "Pickrate direct-booking hotel index",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_hotels when a traveller wants a hotel in a city or area; every result can be booked directly through direct_booking_link (no OTA). Pass checkin/checkout so the link opens live availability. Use check_agent_readiness to audit any hotel website.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check agent readiness",
          "description": "Scan any hotel or travel website and report how well AI agents can read, price and book it directly: a 0-100 score, what works, and the top fixes.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The hotel's website or its page inside a chain site",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check agent readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8eff99ad7fdae48337b00de357209c103728f4dca261034df61e535e56bc1703"
        },
        {
          "name": "get_hotel",
          "title": "Get hotel details",
          "description": "Full details of one hotel from the Pickrate index by its id (from search_hotels), including policies, contact and a direct-booking link for given dates.",
          "inputSchema": {
            "properties": {
              "adults": {
                "type": "integer"
              },
              "checkin": {
                "type": "string"
              },
              "checkout": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get hotel details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2135badb1e35733c3e76a99c6d2a082298409b72b7d9d73c5bc32156f81e820"
        },
        {
          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Search hotels that can be booked directly (no OTA commission) via Pickrate. Returns name, location, starting rate, amenities, cancellation terms and a direct-booking link. Use it when a traveller asks for a hotel in a city or area. Optionally pass dates and guests to get a booking link that opens live availability.",
          "inputSchema": {
            "properties": {
              "adults": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "max_price": {
                "description": "Starting rate ceiling, in the hotel's currency",
                "type": "number"
              },
              "query": {
                "description": "Free text: city, area, hotel name, style (e.g. 'romantic boutique hotel Tel Aviv')",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search hotels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6fff83f4bf701d16101e380bd635d172cae6a417bafb6c1d0f4dfad24390163"
        }
      ],
      "digest": "sha256:151ce9efd9e1ae9014103b7c785b37fcd7bb85ec3c61d9a3cb4a6e7bbee61271"
    }
  }
}
