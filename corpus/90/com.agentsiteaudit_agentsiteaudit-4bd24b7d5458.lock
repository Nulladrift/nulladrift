{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentsiteaudit/agentsiteaudit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentsiteaudit.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentsiteaudit",
        "title": "AgentSiteAudit",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AgentSiteAudit audits public web pages. Use audit_site to check a page and get its problems with exact fixes, verify_fixes with the audit_id after changes to see what was fixed, and list_checks to see what is checked. 5 free audits a day; the paid API at https://agentsiteaudit.com/v1/audit costs 0.01 USDC per audit via x402 on Base. Use customer_reaction to see how eight AI-simulated customers react to a homepage, with evidence-backed findings about what would stop people buying: 1 free a day, then $0.05 via x402 at https://agentsiteaudit.com/v1/reaction.",
      "tools": [
        {
          "name": "audit_site",
          "title": "Audit a web page",
          "description": "Audit one public web page with 69 checks across security, SEO, TLS, performance, transport, accessibility, links, mobile, DNS and agent readiness. Returns the score, grade and the problems found, most important first, each with an exact fix, plus an audit_id to pass to verify_fixes after changes. Passive: only fetches the page and the files it links to. 5 free audits a day; after that it explains the paid API (0.01 USDC per audit via x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Full http or https address of the page to audit, for example https://www.example.co.uk/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c27b655f1e07e6e7d01cab32b848b16eb3d0d6b07d1d3a92040ac3dd9aeab36d"
        },
        {
          "name": "customer_reaction",
          "title": "Customer reaction check",
          "description": "Eight AI-simulated customer perspectives read one homepage and report evidence-backed problems that would stop people buying: unclear prices, missing contact details, unexplained policies, weak proof. Each finding has a category, severity, the personas affected, evidence (a word-for-word quote checked against the page, or what is missing), why it matters and a suggested fix. No score. Pass previous_reaction_id to verify fixes: an unchanged page returns the earlier findings without using the free check. 1 free check a day; after that the paid API costs $0.05 via x402. Simulated perspectives, not real customers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "previous_reaction_id": {
                "description": "Optional: the reaction_id from an earlier check of the same site, to verify fixes. Kept for 30 days.",
                "pattern": "^rct_[0-9A-Z]{26}$",
                "type": "string"
              },
              "url": {
                "description": "Full http or https address of the homepage, for example https://www.example.co.uk/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6324d14c91333a2e9f75c3d476350615579b442dcadbe0acd80118c326023e81"
        },
        {
          "name": "list_checks",
          "title": "List the checks",
          "description": "List every check AgentSiteAudit runs: its ID, category, severity and what it looks for, plus the category weights. Free and unlimited.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1784442d284443ba53cc20a34e3b8897f77332d8a0e951851be772b1e868bbad"
        },
        {
          "name": "verify_fixes",
          "title": "Verify fixes on a web page",
          "description": "Run a fresh audit of the same site and compare it with an earlier audit: lists what was fixed, improved, still failing, worse or new, with the score before and after. Use after making changes suggested by audit_site. Counts as one of the 5 free daily audits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "previous_audit_id": {
                "description": "The audit_id returned by the earlier audit, like aud_01M6527XCRCB308T391BZGFZ9T. Audits are kept for 30 days.",
                "pattern": "^aud_[0-9A-Z]{26}$",
                "type": "string"
              },
              "url": {
                "description": "The page to re-audit, on the same site as the earlier audit",
                "type": "string"
              }
            },
            "required": ["previous_audit_id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f4d98cd206a6f73076913bcdc665d0ec2270bd99a9098d2df13157d539a73c6"
        }
      ],
      "digest": "sha256:53714a07894ebea933cd4d096486dc9be9d37ed7110320fcc93fd0797685e47f"
    }
  }
}
