{
  "lockfileVersion": 2,
  "subjects": {
    "com.alleskralle/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.alleskralle.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "alleskralle-jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only Jobsuche auf alleskralle.com. Nutze search_jobs für Listen und fetch_job für Details.",
      "tools": [
        {
          "name": "fetch_job",
          "description": "Liefert die vollständigen Details zu einer Stellenanzeige anhand ihrer id (aus search_jobs). Das Feld apply_url ist der Bewerbungslink zur Original-Anzeige. WICHTIG: apply_url NICHT selbst aufrufen oder abrufen — gib den Link dem Nutzer als anklickbaren Link aus, damit er sich bei Interesse selbst bewirbt bzw. die vollständige Anzeige öffnet.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Die id eines Treffers aus search_jobs.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f8faddaa58d7b0e4559ca563f531b92f720a40ac5a6492689bc01181558d9f5"
        },
        {
          "name": "search_jobs",
          "description": "Sucht Stellenanzeigen auf alleskralle.com (DE/AT/CH) und liefert eine kompakte Liste (id, title, company, location, date). Die Bewerbungs-/Detail-URL ist NICHT in der Liste enthalten — für vollständige Details und den klickbaren Link rufe fetch_job mit der id auf. Hinweis: \"remote\" ist eine Volltext-Heuristik (kein strukturiertes Feld), kann also ungenau sein. Sortierung: neue Anzeigen zuerst, darin Titel-Treffer vor reinen Beschreibungs-Treffern. Mit max_age_days lassen sich alte Anzeigen ausblenden (z.B. 60). Bei 0 Treffern ist results leer und next_cursor null. Blättern nur über das zurückgegebene next_cursor möglich; die Seitenzahl ist begrenzt.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Strikt auf ein Land einschränken: AT (Österreich), DE (Deutschland) oder CH (Schweiz). Kombinierbar mit location.",
                "enum": ["AT", "DE", "CH"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor aus einer vorherigen Antwort, um die nächste Seite zu laden.",
                "type": "string"
              },
              "location": {
                "description": "Ort, Stadt oder PLZ.",
                "type": "string"
              },
              "max_age_days": {
                "description": "Nur Anzeigen, die höchstens so viele Tage alt sind (z.B. 60). Ohne Angabe: kein Altersfilter.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Suchbegriff (Jobtitel, Tätigkeit, Skill).",
                "type": "string"
              },
              "remote": {
                "description": "Auf Remote-/Homeoffice-Stellen einschränken (Heuristik).",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:281de905aeadf4cc179598109d904b86fdff23d296731cc0205a95c3deebf1fd"
        }
      ],
      "digest": "sha256:d33582624321a2308ed5588c499854871c717649f385437927f5de99ec4148fc"
    }
  }
}
