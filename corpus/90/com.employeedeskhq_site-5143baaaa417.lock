          "digest": "sha256:fe43e662f4ce61a09ecbdfa2922a65469605af1c67b27c58c9ca475d45eae848"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the EmployeeDeskHQ dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
