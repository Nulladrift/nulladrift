                "type": "string"
              },
              "context": {
                "description": "Life context to match against. Examples: 'anxiety', 'morning', 'travel', 'forgiveness', 'gratitude'. Send this or id, not both.",
                "minLength": 2,
                "type": "string"
              },
              "id": {
                "description": "A du'a id taken from a related reference in an earlier response. Send this or context, not both.",
                "pattern": "^[A-Za-z0-9-]{3,40}$",
                "type": "string"
              },
              "limit": {
                "description": "Number of du'as to return for a context; default 3, max 10. The response says how many more exist. Ignored with id.",
