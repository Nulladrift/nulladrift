        {
          "name": "get_quran_verse",
          "title": "get_quran_verse",
          "description": "Returns one Quran verse by surah and ayah number: Tanzil Uthmani Arabic and Pickthall English, with citation. Quote the Arabic exactly; do not paraphrase either text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Optional: curious, revert or practising, from the user's own self-description only. Teaching context attaches whenever an entry exists; omit when the audience is unknown.",
                "enum": ["curious", "revert", "practising"],
                "type": "string"
              },
              "ayah": {
                "description": "Ayah (verse) number within the surah",
                "maximum": 286,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Translation locale; defaults to \"en\" (Pickthall). Urdu, Indonesian and Turkish translations are not yet available: \"ur\", \"id\" and \"tr\" return Pickthall English with a note.",
                "enum": ["en", "id", "ur", "ar", "tr"],
                "type": "string"
              },
              "surah": {
                "description": "Surah number, 1-114",
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ayah", "surah"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "_sakina_meta": {
                "additionalProperties": true,
                "properties": {
                  "content_type": {
                    "enum": ["quran_verse", "not_found"],
                    "type": "string"
                  },
                  "disclaimer": {
