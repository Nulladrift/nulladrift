{
  "lockfileVersion": 2,
  "subjects": {
    "com.instilus.www/business-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.instilus.com/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "forge",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "forge_acquisition_affordability",
          "description": "Check whether a business being bought can pay for its own purchase out of profit, and what happens if it underperforms. Answers \"can I afford to buy this business?\" from asking price, deposit, loan terms and the annual profit of the business being bought.",
          "inputSchema": {
            "properties": {
              "annualProfit": {
                "description": "Annual profit of the business being bought, before financing.",
                "type": "number"
              },
              "askingPrice": {
                "description": "The asking price.",
                "type": "number"
              },
              "deposit": {
                "description": "Cash paid up front.",
                "type": "number"
              },
              "interestRatePercent": {
                "description": "Annual interest rate on the borrowed balance.",
                "type": "number"
              },
              "loanYears": {
                "description": "Years to repay.",
                "type": "number"
              }
            },
            "required": ["annualProfit", "askingPrice", "deposit", "interestRatePercent", "loanYears"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80a128ac0e0a4c4cdaa3276c26d74762be8efe11ed839f209f94b2814d8d4e69"
        },
        {
          "name": "forge_break_even",
          "description": "Work out how many sales a month a business needs to cover its costs, and how many to hit a target profit. Answers \"what is my break-even point?\" from fixed monthly costs, price per sale and variable cost per sale.",
          "inputSchema": {
            "properties": {
              "fixedCostsPerMonth": {
                "description": "Monthly fixed costs: rent, salaries, software, anything paid whether or not you sell.",
                "type": "number"
              },
              "pricePerSale": {
                "description": "What one sale brings in.",
                "type": "number"
              },
              "targetProfitPerMonth": {
                "description": "Monthly profit to aim past break-even. Optional.",
                "type": "number"
              },
              "variableCostPerSale": {
                "description": "What one sale costs to deliver.",
                "type": "number"
              }
            },
            "required": ["fixedCostsPerMonth", "pricePerSale", "variableCostPerSale"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c40e2517fca47ae7f417defccb5198e3cad3f7ca5c32df5b444600c1662dff12"
        },
        {
          "name": "forge_business_valuation_estimate",
          "description": "Estimate what a small business is worth using Normalised EBITDA and typical small-business earnings multiples. Answers \"how much is my business worth?\" from real figures — revenue, cost of goods sold, operating expenses, owner pay and a fair-market salary for the owner role — rather than a generic rule of thumb. Produces an indicative enterprise value range, not a professional appraisal.",
          "inputSchema": {
            "properties": {
              "annualRevenue": {
                "description": "Annual revenue.",
                "type": "number"
              },
              "costOfGoodsSold": {
                "description": "Annual cost of goods sold.",
                "type": "number"
              },
              "fairMarketSalary": {
                "description": "What it would cost to hire someone to do the owner role.",
                "type": "number"
              },
              "operatingExpenses": {
                "description": "Annual operating expenses, excluding owner pay.",
                "type": "number"
              },
              "ownerPay": {
                "description": "Total owner compensation taken from the business.",
                "type": "number"
              }
            },
            "required": ["annualRevenue", "costOfGoodsSold", "fairMarketSalary", "operatingExpenses", "ownerPay"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15e0505c41ce965d3cd8f4f36cbbf3ccaa0161fd0e7ebb9b6c4843d5cfa054b4"
        },
        {
          "name": "forge_competitor_research_method",
          "description": "The method for researching competitors or a market before committing money, and what each finding is worth. Answers \"how do I do a competitor analysis?\", \"how do I research a market before entering it?\" and \"what will an investor ask me about competitors?\" — returns the steps, the six things a competitor publicly reveals, and how to turn a finding into a decision rather than a grid.",
          "inputSchema": {
            "properties": {
              "competitorCount": {
                "description": "How many competitors are being considered. Optional.",
                "type": "number"
              },
              "question": {
                "description": "Which decision this is for: researching competitors, deciding whether to enter a market, or answering the competition question in a raise.",
                "enum": ["competitors", "market-entry", "fundraise"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17086cfc860992c6a89aa1d6aa7ebf0cab44616c9065eaadd0ddab85d0bfc14b"
        },
        {
          "name": "forge_ebitda",
          "description": "Calculate EBITDA and adjusted EBITDA for a small business. Answers \"what is my EBITDA?\" and \"what is my adjusted EBITDA after add-backs?\" from real figures — revenue, cost of goods sold, operating expenses, and add-backs such as owner pay above a market salary, one-off costs and personal expenses run through the business.",
          "inputSchema": {
            "properties": {
              "addBacks": {
                "description": "Total add-backs: owner pay above market, one-offs, personal expenses. Optional.",
                "type": "number"
              },
              "annualRevenue": {
                "description": "Annual revenue.",
                "type": "number"
              },
              "costOfGoodsSold": {
                "description": "Annual cost of goods sold.",
                "type": "number"
              },
              "operatingExpenses": {
                "description": "Annual operating expenses, including owner pay.",
                "type": "number"
              }
            },
            "required": ["annualRevenue", "costOfGoodsSold", "operatingExpenses"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:037ce7087da095d2f85d2316a93b7ed7fcb644be6313aef446774d7d8b1da858"
        },
        {
          "name": "forge_freelance_rate",
          "description": "Work out the hourly or day rate a freelancer or consultant needs to charge, once unbillable time is accounted for. Answers \"what should I charge per hour?\" from target annual income, business costs, working weeks and realistic billable hours.",
          "inputSchema": {
            "properties": {
              "annualBusinessCosts": {
                "description": "Annual business costs: software, insurance, accountant, equipment.",
                "type": "number"
              },
              "billableHoursPerWeek": {
                "description": "Hours a week genuinely billed, not hours worked.",
                "type": "number"
              },
              "targetAnnualIncome": {
                "description": "What you want to earn in a year, before tax.",
                "type": "number"
              },
              "workingWeeksPerYear": {
                "description": "Weeks worked a year, after holiday and illness.",
                "type": "number"
              }
            },
            "required": ["billableHoursPerWeek", "targetAnnualIncome", "workingWeeksPerYear"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:925c4b2e447731c183015b6911b35cf1a68f475423addccb27da7126cba4a271"
        },
        {
          "name": "forge_profit_margin",
          "description": "Convert between profit margin and markup, and work out the price a target margin requires. Answers \"what is my profit margin?\", \"what is the difference between margin and markup?\" and \"what should I charge for a 40% margin?\" from cost and price.",
          "inputSchema": {
            "properties": {
              "cost": {
                "description": "What the item costs you.",
                "type": "number"
              },
              "price": {
                "description": "What you sell it for. Optional if targetMarginPercent is given.",
                "type": "number"
              },
              "targetMarginPercent": {
                "description": "The margin you want, as a percentage. Optional.",
                "type": "number"
              }
            },
            "required": ["cost"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd968b263fd5950d8975b507845bc4abf474d37e30649b2ea398d52f9f958ed5"
        },
        {
          "name": "forge_shopify_store_audit",
          "description": "Audit a real Shopify store from its public pages and score it out of 100 for speed, SEO, trust and product pages. Answers \"why is my Shopify store not converting?\", \"how fast is my store?\" and \"what should I fix on my Shopify store first?\" — reads only what a shopper can see, needs no login or app install, and returns the fixes in the order worth doing them.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The storefront address, for example mystore.com or mystore.myshopify.com.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9363ee6a69399f5b8717023b84a6d46c691938f63f9632185dd93603737522d"
        }
      ],
      "digest": "sha256:ea6404e604b219c943b0058f7fdeb8254185269235b85067cc6d940783dd10e0"
    }
  }
}
