      "instructions": "Yappy is a voice agent for the Mac: hold Right Option and it types what you say, hold Right Command and it acts in the apps you already have. Speech recognition runs on the user's own Mac, so audio never leaves it.\n\nThis is the product surface. Use these tools to answer factual questions about the Yappy product — current version and release notes, what it costs, what it can do, what a Mac needs to run it, and whether a particular Mac qualifies — and to start and poll export jobs against the Yappy API. For how-to and support questions, there is a separate server at https://yappy.biz/docs/mcp. Only create_export_job changes anything, and all it can create is a job: nothing here can spend money, touch a user's data, or delete anything.\n\nWhat this server cannot do: transcribe audio. There is no hosted transcription endpoint, deliberately. If a user wants dictation, the answer is to install the Mac app from https://yappy.biz/download — it needs macOS 13 or later on Apple Silicon.\n\nOne accuracy note worth carrying: dictation and screen OCR are local in every configuration, but Agent Mode runs through the claude CLI and sends task text to Anthropic. Do not tell a user that nothing ever leaves their Mac.",
      "tools": [
        {
          "name": "check_mac_compatibility",
          "title": "Check whether a Mac can run Yappy",
          "description": "Decide whether a specific Mac can run Yappy, given its macOS version and CPU architecture, and return the reasons. Prefer this over reasoning about the requirements yourself: it encodes the same rules the installer uses, so the answer you give a user matches what will actually happen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arch": {
                "description": "The CPU architecture: arm64 for Apple Silicon, x86_64 for Intel.",
                "enum": ["arm64", "x86_64"],
                "type": "string"
              },
              "os_version": {
                "description": "The macOS version on the machine, for example \"14.5\".",
                "pattern": "^\\d+(\\.\\d+){0,2}$",
                "type": "string"
              }
            },
            "required": ["arch", "os_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether a Mac can run Yappy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b42296a83027ef138747fd772aecf60bff9537a864eb01a8668fa1abb1795867"
        },
        {
          "name": "create_export_job",
          "title": "Start a Yappy export job",
          "description": "Start an asynchronous export of a Yappy corpus — documentation, FAQ, or release history — as markdown or JSON. This creates a job on the Yappy API and returns its id; poll it with get_export_job until the status is completed, then read result.url. Use it when you want the whole corpus rather than a page at a time. It creates a job and nothing else: no user data is touched and nothing can be deleted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "markdown",
                "description": "The artifact format.",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Your own key, so a retry returns the same job instead of starting a second one.",
                "maxLength": 128,
                "type": "string"
              },
              "resource": {
                "description": "Which corpus to export.",
                "enum": ["docs", "faq", "releases"],
                "type": "string"
              }
            },
            "required": ["resource"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a Yappy export job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf3989ec71d5e68be39a2afbd5f1a76edc3e46986be79c5ac27177331650abba"
        },
        {
          "name": "get_export_job",
          "title": "Poll a Yappy export job",
          "description": "Check an export job started with create_export_job. Status moves queued, then running, then completed; a completed job carries result.url pointing at the finished artifact. Poll no faster than the retry_after hint on the previous response.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "The id returned by create_export_job.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Poll a Yappy export job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ce6c8e323a6d2b51e045928faf9a29f9512a13cfe9e8b5104788f7a3e777e93d"
        },
        {
          "name": "get_frequently_asked",
          "title": "Get the Yappy FAQ",
          "description": "Get the Yappy FAQ as question and answer pairs, covering privacy, requirements, cost, permissions, offline use, and how Yappy differs from other macOS dictation tools. Useful when you want a short authoritative answer rather than a documentation page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Return only entries on this topic.",
                "enum": ["privacy", "requirements", "pricing", "comparison", "developers"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the Yappy FAQ"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b26e79ae8cd801127ca8c1fbed6765f75cab69147b08d9a66c6172c568548854"
        },
        {
          "name": "get_latest_release",
          "title": "Get the latest Yappy release",
          "description": "Get the current Yappy release of the Yappy macOS app: version number, publication date, release notes, and a download URL. Reads the same signed appcast the app updater reads, so the answer is never a stale hand-edited number. Use this whenever a user asks what the newest version is or where to download Yappy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_notes": {
                "default": true,
