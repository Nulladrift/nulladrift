        },
        {
          "name": "list_products",
          "title": "List Products",
          "description": "List every product in the Creator Studio line with its included skills. FREE.\n\nTakes no arguments. Returns a list of 20 product objects, each\n{\"slug\": \"brand-voice-keeper\", \"name\": ..., \"tagline\": ..., \"skills\":\n[\"tone-checker\", ...], \"free_skill\": \"voice-quiz\"}. Use the returned slug\nvalues with get_free_skill, get_full_product, or get_full_skill.\n\nReturns metadata only - no persona text and no skill instructions. Use\nwhen the caller wants to see what this server covers. Not for keyword\nsearch across the whole 138-product catalog, which the catalog server's\nsearch_catalog does, and not for instructions the caller can act on\n(get_free_skill). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
