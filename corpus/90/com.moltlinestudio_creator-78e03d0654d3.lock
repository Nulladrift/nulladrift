        {
          "name": "get_full_skill",
          "title": "Get Full Skill",
          "description": "Load one paid skill's complete instructions from a product. PREMIUM (license).\n\nTypical input {\"slug\": \"brand-voice-keeper\", \"skill_name\": \"tone-checker\"}\nreturns {\"slug\": ..., \"skill\": ..., \"instructions\": \"<full skill text>\"}.\n\nReturns one named skill, selected by skill_name. Use when the caller wants\none specific paid skill. Not for the free gateway skill, which\nget_free_skill returns with no plan, and not for every skill at once\n(get_full_product). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_name": {
                "description": "Exact skill name as listed in that product's \"skills\"\narray from list_products.",
                "type": "string"
              },
              "slug": {
                "description": "Product slug exactly as returned by list_products.",
                "type": "string"
              }
