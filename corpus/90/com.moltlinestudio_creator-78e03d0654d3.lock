      "instructions": "Moltline's Creator Studio: 20 content/creative persona-skill products (blogging, brand voice, copywriting, video, social, newsletters and more). Free: list_products, get_free_skill, analyze_writing. Premium: get_full_product, get_full_skill.",
      "tools": [
        {
          "name": "analyze_writing",
          "title": "Analyze Writing",
          "description": "Analyze a draft for readability, passive voice, cliches, and hedging. FREE.\n\nAlso measures sentence variety and keyword density, and produces a\nprioritized fix list. Typical input {\"text\": \"<your draft>\"} returns\n{\"readability_grade\": 9.2, \"passive_voice_count\": N, \"cliches_found\":\n[...], \"hedging_words\": [...], \"sentence_count\": N,\n\"avg_words_per_sentence\": N, \"top_repeated_words\": [...],\n\"priority_fixes\": [\"...\"]}.\n\nUse on body prose to find readability and style problems. Not for ranking\ntitles (headline_analyzer) and not for platform limits\n(social_length_check). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"empty text\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The draft to analyze, at least one full sentence; plain text,\nany length.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze Writing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
