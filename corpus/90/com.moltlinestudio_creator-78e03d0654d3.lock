        {
          "name": "headline_analyzer",
          "title": "Headline Analyzer",
          "description": "Score and rank up to 20 headlines, best first. FREE.\n\nScores 0-100 on length, power/emotion words, numbers, structure, and\nclarity. Typical input {\"headlines\": [\"7 Mistakes New Writers Make\",\n\"On Writing\"]} returns {\"ranked\": [{\"headline\": ..., \"score\": 85,\n\"notes\": [\"good length\", \"contains number\"]}, ...]}.\n\nUse when several title options need ranking. Not for email subject lines,\nwhich the outbound server's subject_line_scorer judges against\ndeliverability signals, and not for body prose (analyze_writing). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "headlines": {
                "description": "List of candidate headlines as plain strings; only the\nfirst 20 are scored.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["headlines"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
