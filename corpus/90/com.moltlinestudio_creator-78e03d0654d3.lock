        },
        {
          "name": "social_length_check",
          "title": "Social Length Check",
          "description": "Check a post against every major platform's length limit at once. FREE.\n\nCovers X, LinkedIn posts and headlines, Instagram captions, Threads,\nYouTube titles, and meta descriptions. Typical input {\"text\": \"<post>\"}\nreturns {\"chars\": N, \"platforms\": {\"x_post\": {\"limit\": 280, \"fits\":\ntrue, \"over_by\": 0}, ...}}.\n\nUse before posting, to catch truncation. Not for readability\n(analyze_writing) and not for reading duration (reading_time). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The post or caption text to check, exactly as it would be\npublished.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
