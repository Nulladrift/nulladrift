        },
        {
          "name": "reading_time",
          "title": "Reading Time",
          "description": "Estimate reading and speaking time plus basic content stats. FREE.\n\nTypical input {\"text\": \"<your article>\"} returns {\"words\": 1200,\n\"reading_minutes\": 5.2, \"speaking_minutes\": 8.6, \"paragraphs\": 14,\n\"fit\": \"newsletter/blog\"}.\n\nUse when length and pacing are the question. Not for writing quality or\ngrade level (analyze_writing). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The content to measure, plain text.",
                "type": "string"
              },
              "wpm": {
                "default": 230,
                "description": "Silent reading speed in words per minute; values below 60 are\ntreated as 60. Default 230.",
                "type": "integer"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
