      },
      "transport": {
        "type": "http",
        "url": "https://strata.andque.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "andque-strata-b2a-mcp",
        "version": "2.8.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "list_data_streams",
          "description": "Free ($0, no auth), read-only, idempotent catalog listing all 16 B2A streams, pricing, licenses, and schemas. Pass category or streamId (default category=\"all\", includeLegacyAliases=false); returns stream entries ordered by catalog index with SHA-256 provenance. Note: For stock checks, use probe_stream_inventory instead.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "all",
                "description": "Optional B2A domain category filter (\"all\" returns all 16 streams ordered by catalog index).",
                "enum": ["all", "corporate_kyb_compliance", "finance_macro_patents", "geospatial_real_estate_medical", "web_jobs_trends_golf_market"],
                "type": "string"
              },
              "includeLegacyAliases": {
                "default": false,
                "description": "When true, includes backward-compatible Phase-7 and specialized verb tool aliases for each stream.",
                "type": "boolean"
              },
              "streamId": {
                "description": "Optional canonical B2A stream slug from the 16-stream enum; when provided, returns the full inputSchema, outputSchema, and parameter defaults for that stream.",
                "enum": ["ansr-golf-ev-engine", "ats-jobs", "cyber-kev-status", "domain-intel", "google-trends", "jp-academic-biotech", "jp-area-hazard-poi", "jp-entity-reputation", "jp-foreclosure-bit", "jp-macro-edinet", "jp-medical-navii", "jp-patent-b2a", "jp-procurement-giteki", "jp-registry-diff", "jp-tcg-index", "jp-wholesale-macro"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "canonicalToolsCount": {
                "description": "Number of canonical 3-word MCP tools exposed in default tools/list (18).",
                "type": "integer"
              },
              "legacyCallableToolsCount": {
                "description": "Number of backward-compatible legacy and Phase-7 tool aliases callable via tools/call.",
                "type": "integer"
              },
              "matchedStreamsCount": {
                "description": "Number of streams matching the requested category or streamId filter.",
                "type": "integer"
              },
              "ok": {
                "description": "True when the free 1st-floor stream catalog introspection succeeded.",
                "type": "boolean"
              },
              "selectedStreamSchema": {
                "description": "Populated when streamId is specified, containing full inputSchema, outputSchema, and parameterDefaults.",
                "type": "object"
              },
              "sha256Digest": {
                "description": "Deterministic 64-character hex SHA-256 digest of the returned stream catalog payload.",
                "type": "string"
              },
              "sourceRightsRegistry": {
                "description": "Open-government and first-party commercial-resell license and attribution ledger.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "streams": {
                "description": "Ordered array of B2A stream metadata entries including canonicalToolName, modes, and x402 pricing.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "totalCallableToolsCount": {
                "description": "Total unique deduplicated tool names callable via tools/call and ?profile=full.",
                "type": "integer"
              },
              "totalStreams": {
                "description": "Total commercial B2A data streams available on the server (16).",
                "type": "integer"
              }
            },
            "required": ["canonicalToolsCount", "matchedStreamsCount", "ok", "sha256Digest", "sourceRightsRegistry", "streams", "totalStreams"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List B2A Data Streams & Schemas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "pricing": "FREE ($0.000, no X-MCP-API-Key required)",
            "streamId": "list-data-streams",
            "tier": "free_1st_floor"
          },
          "digest": "sha256:25f0fb84a88485f0146a289c2c8a2a104476221cf6d8347effac1c72c3d59e44"
        },
        {
          "name": "probe_stream_inventory",
          "description": "Free ($0, no auth), read-only, idempotent pre-check of record existence and 24h freshness across 16 streams. Pass streamId with corporateNumber, domain, lei, or boardSlug (default streamId=\"domain-intel\", limit=25); returns stock status ordered by target match. Note: For stream schemas, use list_data_streams instead.",
          "inputSchema": {
            "properties": {
              "amendmentsOnly": {
                "description": "When true in mode=\"edinet_gc_amendments\", probes amended securities/quarterly/semi-annual reports.",
                "type": "boolean"
              },
              "assetSymbol": {
                "description": "Optional digital currency ticker filter in mode=\"ofac_sanctions\" across 600 organization-linked SDN wallets (e.g. \"TRX\", \"ETH\", \"XBT\", \"USDT\"). Free probes return dataset availability only.",
                "enum": ["ARB", "BCH", "BSC", "BTC", "DASH", "ETH", "LTC", "SOL", "TON", "TRX", "USDC", "USDT", "XBT", "XLM", "XMR", "XRP", "ZEC"],
                "type": "string"
              },
              "ats": {
                "default": "greenhouse",
                "description": "ATS platform when probing ats-jobs (\"greenhouse\", \"lever\", or \"ashby\").",
                "enum": ["greenhouse", "lever", "ashby"],
                "type": "string"
              },
              "boardSlug": {
                "description": "Company ATS board slug when probing ats-jobs (e.g. \"stripe\", \"layerx\").",
                "maxLength": 120,
                "type": "string"
              },
              "companyScale": {
                "description": "Company scale (\"large\", \"sme\", \"micro\", or \"other\") when probing mode=\"gov_qualification\".",
                "enum": ["large", "sme", "micro", "other"],
                "type": "string"
              },
              "corporateNumber": {
                "description": "13-digit Japanese Corporate Number (NTA Mod-9 validated, e.g. \"1180301018771\") when probing corporate registry, recalls, or tenders.",
                "maxLength": 13,
                "pattern": "^[0-9]{13}$",
                "type": "string"
              },
              "corporateNumbers": {
                "description": "Batch of 1 to 25 13-digit Japanese Corporate Numbers for free stock probing.",
                "items": {
                  "maxLength": 13,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "cveId": {
                "description": "CVE identifier (e.g. \"CVE-2024-0001\") when probing cyber advisories.",
                "maxLength": 32,
                "pattern": "^CVE-[0-9]{4}-[0-9]{4,8}$",
                "type": "string"
              },
              "docId": {
                "description": "8-character EDINET filing document ID (e.g. \"S100ABCD\") when probing mode=\"edinet_gc_amendments\".",
                "maxLength": 8,
                "pattern": "^S[0-9A-Za-z]{7}$",
                "type": "string"
              },
              "domain": {
                "description": "Domain name to check when probing domain posture or corporate registry (e.g. \"nttdata.com\", \"preferred.jp\").",
                "maxLength": 253,
                "type": "string"
              },
              "domains": {
                "description": "Batch of 1 to 25 corporate domains when probing domain posture or corporate registry.",
                "items": {
                  "maxLength": 253,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "edinetCode": {
                "description": "6-character FSA EDINET submitter code (e.g. \"E02144\") when probing mode=\"edinet_gc_amendments\" or securities filings.",
                "maxLength": 6,
                "pattern": "^E[0-9]{5}$",
                "type": "string"
              },
              "entityName": {
                "description": "Organization or corporate legal name when probing mode=\"ofac_sanctions\".",
                "maxLength": 200,
                "type": "string"
              },
              "entityNames": {
                "description": "Batch of 1 to 25 organization or corporate legal names when probing mode=\"ofac_sanctions\".",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "excludeGoingConcern": {
                "description": "In mode=\"screen\" / \"filter\", excludes corporations with active EDINET Going Concern notes or material events.",
                "type": "boolean"
              },
              "excludeLapsedLei": {
                "description": "In mode=\"screen\" / \"filter\", excludes corporations whose GLEIF LEI status is LAPSED.",
                "type": "boolean"
              },
              "excludeRecentEdinetAmendments": {
                "description": "In mode=\"screen\" / \"filter\", excludes corporations that filed recent amended securities reports on EDINET.",
                "type": "boolean"
              },
              "geo": {
                "default": "US",
                "description": "2-letter ISO country code when probing google-trends (e.g. \"US\", \"JP\").",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "goingConcernOnly": {
                "description": "When true in mode=\"edinet_gc_amendments\", probes filings with statutory Going Concern notes or material events.",
                "type": "boolean"
              },
              "hasBicOnly": {
                "description": "When true in mode=\"gleif_lei\", filters for entities with SWIFT BIC codes.",
                "type": "boolean"
              },
              "holeNumber": {
                "description": "Optional golf hole number (1-18) when probing ansr-golf-ev-engine.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "includeWeakAliases": {
                "default": false,
                "description": "Optional flag for paid OFAC screening (weak AKAs excluded by default unless true; when true, weak AKAs are tagged with matchedVia=\"weak_aka_alias\" and akaStrength=\"weak\"). Free probes return dataset availability only.",
                "type": "boolean"
              },
              "keyword": {
                "description": "Search keyword when probing search trends or Japanese public data streams.",
                "maxLength": 120,
                "type": "string"
              },
              "lapsedOnly": {
                "description": "When true in mode=\"gleif_lei\", filters for LAPSED LEI registrations.",
                "type": "boolean"
              },
              "lei": {
                "description": "20-character ISO 17442 LEI (Mod 97-10 validated, e.g. \"5493006W3QUS5LMH6R84\") when probing mode=\"gleif_lei\".",
                "maxLength": 20,
                "pattern": "^[A-Za-z0-9]{20}$",
                "type": "string"
              },
              "leis": {
                "description": "Batch of 1 to 25 20-character ISO 17442 LEI codes.",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 25,
                "description": "Optional row scan limit (1 to 25, default 25; free probes cap internal scan budget at 25 rows).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "minQualificationGrade": {
                "description": "Minimum Unified Government Qualification grade (\"A\" highest through \"D\").",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "mode": {
                "description": "Mode when probing jp-entity-reputation (\"lookup\", \"batch\", \"screen\", \"filter\", \"gleif_lei\", \"ofac_sanctions\", \"gov_qualification\", or \"edinet_gc_amendments\") or ansr-golf-ev-engine (\"ev\", \"sg\", \"dispersion\", \"strategy\", \"course_search\", or \"hole_strategy\").",
                "enum": ["lookup", "batch", "screen", "filter", "gleif_lei", "ofac_sanctions", "gov_qualification", "edinet_gc_amendments", "ev", "sg", "dispersion", "strategy", "course_search", "hole_strategy"],
                "type": "string"
              },
              "prefecture": {
                "description": "Japanese prefecture name or 2-digit JIS code across all 47 prefectures (e.g. \"北海道\", \"東京都\", \"大阪府\", \"13\").",
                "maxLength": 32,
                "type": "string"
              },
              "prefectureCode": {
                "description": "2-digit JIS prefecture code across all 47 Japanese prefectures (\"01\" to \"47\", e.g. \"13\" for Tokyo, \"27\" for Osaka).",
                "maxLength": 2,
                "pattern": "^(0[1-9]|[1-3][0-9]|4[0-7])$",
                "type": "string"
              },
              "qualificationGrade": {
                "description": "Exact Unified Government Qualification grade (\"A\", \"B\", \"C\", or \"D\") when probing mode=\"gov_qualification\".",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "query": {
                "description": "Facility/station/golf-course query string when probing spatial or ANSR golf streams.",
                "maxLength": 120,
                "type": "string"
              },
              "requireGleifLei": {
                "description": "In mode=\"screen\" / \"filter\", requires the corporation to hold a registered GLEIF LEI.",
                "type": "boolean"
              },
              "secCode": {
                "description": "4- or 5-digit Japanese securities code when probing securities filings or mode=\"edinet_gc_amendments\".",
                "maxLength": 5,
                "pattern": "^[0-9A-Za-z]{4,5}$",
                "type": "string"
              },
              "streamId": {
                "default": "domain-intel",
                "description": "Target B2A stream identifier from the 16-stream enum to pre-check record availability and 24h freshness.",
                "enum": ["ansr-golf-ev-engine", "ats-jobs", "cyber-kev-status", "domain-intel", "google-trends", "jp-academic-biotech", "jp-area-hazard-poi", "jp-entity-reputation", "jp-foreclosure-bit", "jp-macro-edinet", "jp-medical-navii", "jp-patent-b2a", "jp-procurement-giteki", "jp-registry-diff", "jp-tcg-index", "jp-wholesale-macro"],
                "type": "string"
              },
              "strictExcludeUnobserved": {
                "default": false,
                "description": "In mode=\"screen\" / \"filter\", controls unknown/unobserved handling for exclusion filters (excludeGoingConcern, excludeRecentEdinetAmendments, excludeLapsedLei). Defaults to false (retains unobserved corporations with unobservedOrExcludedScopes[] tags; when true, unobserved corporations are also excluded).",
                "type": "boolean"
              },
              "subLayer": {
                "description": "Optional specialized hard-fact sub-layer ledger name (e.g. \"jp18_and_nutrient_standards\", \"meti_manufacturing_champions\", \"meti_cscl_chemical_registry\", \"eu_cosing_jp_bridge\", \"mhlw_jsqi_2021_index\", \"foshu_tokuho_claims\", \"functional_food_claims\", \"mhlw_cosmetic_standards\", \"approved_food_additives\", \"kobutsu_url_ledger\", \"keishin_financials\", \"harvest_labor_violations\", \"facility_brand_operator_links\", \"mlit_negative_dispositions\", \"product_compliance_checkpoint\").",
                "maxLength": 80,
                "type": "string"
              },
              "targetKey": {
                "description": "Optional canonical target key (e.g. \"domain:nttdata.com\", \"ats:greenhouse:layerx\", \"trends:US:mcp\").",
                "maxLength": 256,
                "type": "string"
              },
              "walletAddress": {
                "description": "Blockchain wallet address (e.g. \"0x...\", \"TNiq9AXBp9EjUqhDhrwrfvAA8U3GUQZH81\") when probing mode=\"ofac_sanctions\".",
                "maxLength": 128,
                "type": "string"
              },
              "walletAddresses": {
                "description": "Batch of 1 to 25 blockchain wallet addresses for OFAC dataset availability probing.",
                "items": {
                  "maxLength": 128,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "currentHash": {
                "description": "64-character hex SHA-256 content digest when recordExists is true, or null when not in stock.",
                "type": ["string", "null"]
              },
              "freshWithin24h": {
                "description": "True when the target observation or dataset snapshot was verified within the past 24 hours.",
                "type": "boolean"
              },
              "matchedCount": {
                "description": "Matched record count in the bounded probe window (null when redacted for paid OFAC screening).",
                "type": ["integer", "null"]
              },
              "ok": {
                "description": "True when the free 1st-floor inventory probe completed without error.",
                "type": "boolean"
              },
              "paidEndpoint": {
                "description": "Ready-to-call x402 HTTP endpoint URL pre-populated with the probed query parameters.",
                "type": "string"
              },
              "probedAt": {
                "description": "ISO-8601 UTC timestamp when this free probe was executed.",
                "type": "string"
              },
              "recordExists": {
                "description": "True when matching structured records or dataset snapshots are currently in stock.",
                "type": "boolean"
              },
              "sealStatus": {
                "description": "TAPP Sigstore Rekor cryptographic Merkle seal status of the probed dataset.",
                "type": "string"
              },
              "streamId": {
                "description": "Resolved B2A data stream identifier that was probed.",
                "type": "string"
              },
              "targetKey": {
                "description": "Normalized deterministic ledger target key inspected for availability.",
                "type": "string"
              },
              "x402PriceUsd": {
                "description": "Base Mainnet USDC price for instant x402 pay-per-request execution (e.g. \"$0.006\").",
                "type": "string"
              }
            },
            "required": ["currentHash", "freshWithin24h", "ok", "probedAt", "recordExists", "sealStatus", "streamId", "targetKey", "x402PriceUsd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Probe Stream Record Availability & Freshness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "pricing": "FREE ($0.000, no X-MCP-API-Key required)",
            "streamId": "probe-inventory",
            "tier": "free_1st_floor"
          },
          "digest": "sha256:288d19f93e78170ed75f50050904d117e4865dadf4ad033f732f847def950430"
        },
        {
          "name": "query_ats_jobs",
          "description": "Read-only, idempotent query of Greenhouse, Lever, and Ashby job openings and daily hiring deltas (API key or x402; daily). Pass boards or ats with boardSlug (default includeDelta=false, limit=100, offset=0); returns job records ordered by update time descending. Note: For employer KYB, use query_corporate_registry instead.",
          "inputSchema": {
            "properties": {
              "ats": {
                "default": "greenhouse",
                "description": "Single-board ATS platform (\"greenhouse\", \"lever\", or \"ashby\", default \"greenhouse\").",
                "enum": ["greenhouse", "lever", "ashby"],
                "type": "string"
              },
              "boardSlug": {
                "description": "Single-board company ATS slug (e.g. \"stripe\", \"layerx\", \"openai\").",
                "maxLength": 120,
                "type": "string"
              },
              "boards": {
                "description": "List of 1 to 20 official ATS job boards to query and compute SHA-256 deltas for.",
                "items": {
                  "properties": {
                    "ats": {
                      "description": "ATS platform provider (\"greenhouse\", \"lever\", or \"ashby\").",
                      "enum": ["greenhouse", "lever", "ashby"],
                      "type": "string"
                    },
                    "boardSlug": {
                      "description": "Company ATS board slug (e.g. \"stripe\", \"layerx\", \"openai\").",
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["boardSlug"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "includeDelta": {
                "default": false,
                "description": "When true, computes daily SHA-256 per-job delta status (new, changed, removed, unchanged).",
                "type": "boolean"
              },
              "includeDescriptionText": {
                "default": false,
                "description": "When true, includes normalized plain-text job description excerpts.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Result row limit alias (1 to 500, default 100).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maxJobs": {
                "description": "Maximum total job postings returned across the request (1 to 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maxJobsPerBoard": {
                "default": 100,
                "description": "Maximum job postings returned per ATS board (1 to 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based pagination offset (0..10000, default 0). Combine with limit to page through large result sets deterministically.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "onlyDeltaChanges": {
                "default": false,
                "description": "When true, filters output to only newly posted, modified, or removed openings.",
                "type": "boolean"
              },
              "since": {
                "description": "Optional ISO-8601 timestamp (e.g. \"2026-11-22T00:00:00Z\") to replay all job delta events (new/changed/removed) observed since that timestamp. Defaults to a 24-hour retention window so multiple customers receive identical daily deltas.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "generated_at": {
                "description": "ISO-8601 UTC timestamp when this response payload was generated.",
                "type": "string"
              },
              "items": {
                "description": "Normalized Greenhouse, Lever, and Ashby job openings ordered by update timestamp descending with SHA-256 hiring delta status.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "offset": {
                "description": "Zero-based pagination offset applied to the matched record slice.",
                "type": "integer"
              },
              "partialResult": {
                "description": "True only if a live upstream sub-source returned partial coverage.",
                "type": "boolean"
              },
              "returnedCount": {
                "description": "Number of structured records returned in items for this page.",
                "type": "integer"
              },
              "sealStatus": {
                "description": "TAPP Sigstore Rekor cryptographic Merkle seal status of the dataset.",
                "type": "string"
              },
              "sha256Digest": {
                "description": "Deterministic 64-character hex SHA-256 provenance digest of the returned items.",
                "type": "string"
              },
              "stats": {
                "description": "Execution telemetry including itemCount, durationMs, and upstream breakdown.",
                "type": "object"
              },
              "streamId": {
                "description": "Underlying B2A data stream identifier that fulfilled the query.",
                "type": "string"
              },
              "success": {
                "description": "True when the read-only query completed without upstream or validation failure.",
                "type": "boolean"
              },
              "toolName": {
                "description": "Executed MCP tool name for deterministic audit correlation.",
                "type": "string"
              }
            },
            "required": ["generated_at", "items", "offset", "returnedCount", "sealStatus", "sha256Digest", "stats", "streamId", "success", "toolName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query ATS Career Boards & Hiring Deltas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "pricing": "Pre-authorized MCP API key quota",
            "streamId": "ats-jobs",
            "tier": "paid_2nd_floor"
          },
          "digest": "sha256:87dda95ab93b927c470964a5385a5266788c3e1c25b134b1c09e56addd4497a6"
        },
        {
          "name": "query_collectibles_pricing",
          "description": "Read-only, idempotent query of Pokemon TCG, Foil MTG, and Yu-Gi-Oh floor prices in JPY/USD/EUR, spreads, and 7d/30d deltas (API key or x402; daily). Pass game and keyword (default game=\"all\", limit=30, offset=0); returns pricing records ordered by observation time descending. Note: For search demand, use query_search_trends instead.",
          "inputSchema": {
            "properties": {
              "game": {
                "default": "all",
                "description": "Filter by TCG title (\"all\", \"pokemon\", \"mtg_jp\", \"yugioh\", or \"jp_sets\").",
                "enum": ["all", "pokemon", "mtg_jp", "yugioh", "jp_sets"],
