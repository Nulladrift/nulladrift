        {
          "name": "query_golf_strategy",
          "description": "Read-only, idempotent query of 157,480-point golf EV, Strokes Gained, dispersion, and GPS strategy across 2,005 courses in 47 prefectures (API key or x402; 24h). Pass mode with distance/lie or courseId (default mode=\"ev\", limit=10, offset=0); returns shot metrics ordered by query index. Note: For POIs, use query_seismic_hazards instead.",
          "inputSchema": {
            "properties": {
              "coreScore": {
                "default": 81,
                "description": "Player benchmark score (64 to 125). Overrides skillLevel if specified.",
                "maximum": 125,
                "minimum": 64,
                "type": "integer"
              },
              "courseId": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Exact course ID from ansr_course_profiles.",
                "maxLength": 64,
                "type": "string"
              },
              "courseName": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Sub-course name filter (e.g. \"Out\", \"In\", \"東\", \"西\").",
                "maxLength": 120,
                "type": "string"
              },
              "currentDistanceYards": {
                "description": "[Mode \"strategy\"] Optional current distance to the hole in yards (1 to 700) to compute required advance yardage.",
                "maximum": 700,
                "minimum": 1,
                "type": "number"
              },
              "distance": {
                "description": "[Mode \"ev\" | \"dispersion\"] Remaining distance to the pin (0 to 700, e.g. 150).",
                "maximum": 700,
                "minimum": 0,
                "type": "number"
              },
              "drivingDistance": {
                "default": 230,
                "description": "Player average driver distance in yards (rounded to nearest 10-yard band between 180 and 330).",
                "maximum": 330,
                "minimum": 180,
                "type": "number"
              },
              "end": {
                "description": "[Mode \"sg\"] Ending ball state after the shot (use lie=\"hole_out\" or distance=0 when holed).",
                "properties": {
                  "distance": {
                    "description": "Ending distance to the hole (0 to 700).",
                    "maximum": 700,
                    "minimum": 0,
                    "type": "number"
                  },
                  "lie": {
                    "description": "Ending ball lie after the shot (or \"hole_out\").",
                    "enum": ["tee", "teeShot", "fairway", "rough", "bunker", "trouble", "green", "fringe", "hole_out"],
                    "type": "string"
                  },
                  "unit": {
                    "description": "Distance unit (\"yards\", \"meters\", or \"feet\").",
                    "enum": ["yards", "meters", "feet"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "facilityName": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Golf facility name filter (e.g. \"ヒバリゴルフクラブ\").",
                "maxLength": 120,
                "type": "string"
              },
              "holeNumber": {
                "description": "[Mode \"hole_strategy\"] Specific hole number (1-18). Omit to compute the full GamePlan for all holes in the course.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "includeHoles": {
                "default": true,
                "description": "[Mode \"course_search\"] Include hole-by-hole GPS coordinates and yardages.",
                "type": "boolean"
              },
              "isObRetee": {
                "default": false,
                "description": "[Mode \"sg\"] True if the shot went Out-of-Bounds (OB) requiring a re-tee (SG = -2.0).",
                "type": "boolean"
              },
              "lie": {
                "default": "fairway",
                "description": "[Mode \"ev\" | \"dispersion\"] Current ball lie.",
                "enum": ["tee", "teeShot", "fairway", "rough", "bunker", "trouble", "green", "fringe", "hole_out"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "[Mode \"course_search\"] Maximum courses to return (1-20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "ev",
                "description": "Calculation mode: \"ev\" (Shot/Putt Expected Value & lie penalties), \"sg\" (Strokes Gained between start and end states), \"dispersion\" (ShotCircle landing dispersion ellipse & 8-level benchmarks), \"strategy\" (Target EV reverse distance lookup), \"course_search\" (Search 2,005 Japanese golf facilities / 4,647 courses / 41,812 valid holes [raw 41,825 rows; 13 anomalous rows quarantined] GPS data), or \"hole_strategy\" (Hole-by-hole GPS GamePlan, SG=0 landing coordinates & tee/approach dispersion for a real course).",
                "enum": ["ev", "sg", "dispersion", "strategy", "course_search", "hole_strategy"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based pagination offset (0..10000, default 0). Combine with limit to page through result sets deterministically.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "penalty": {
                "default": 0,
                "description": "[Mode \"sg\"] Penalty strokes incurred on the shot (0 to 10, default 0).",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "queries": {
                "description": "Optional batch of 1 to 10 shot/strategy queries in a single request.",
                "items": {
                  "description": "Individual ANSR golf calculation query object.",
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "query": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Golf facility name, kana, or English substring (e.g. \"ヒバリゴルフクラブ\", \"Hibari\", \"ゴールド札幌\").",
                "maxLength": 120,
                "type": "string"
              },
              "region": {
                "description": "[Mode \"course_search\"] Region filter (e.g. \"関東\", \"近畿\", \"九州\").",
                "maxLength": 32,
                "type": "string"
              },
              "shape": {
                "default": "straight",
                "description": "[Mode \"dispersion\" | \"strategy\" | \"hole_strategy\"] Shot shape (\"straight\", \"fade\", or \"draw\").",
                "enum": ["straight", "fade", "draw"],
                "type": "string"
              },
              "skillLevel": {
                "description": "Optional preset skill level name or code: \"World Ranker\" (W↑: 68/300y), \"National Ranker\" (G↑: 70/270y), \"Professional\" (N↑: 72/270y), \"Scratch\" (0-: 75/250y), \"Under 5\" (5↓: 78/250y), \"Single\" (S↓: 81/230y), \"80s\" (8↓: 89/200y), \"90s\" (9↓: 98/200y).",
                "maxLength": 40,
                "type": "string"
              },
              "stage": {
                "default": "approach",
                "description": "[Mode \"dispersion\"] Shot stage (\"tee\" or \"approach\").",
                "enum": ["tee", "approach"],
                "type": "string"
              },
              "start": {
                "description": "[Mode \"sg\"] Starting ball state before the shot (distance, unit, and lie).",
                "properties": {
                  "distance": {
                    "description": "Starting distance to the hole (0 to 700).",
                    "maximum": 700,
                    "minimum": 0,
                    "type": "number"
                  },
                  "lie": {
                    "description": "Starting ball lie before the shot.",
                    "enum": ["tee", "teeShot", "fairway", "rough", "bunker", "trouble", "green", "fringe", "hole_out"],
                    "type": "string"
                  },
                  "unit": {
                    "description": "Distance unit (\"yards\", \"meters\", or \"feet\").",
                    "enum": ["yards", "meters", "feet"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "state": {
                "description": "[Mode \"course_search\"] Nationwide prefecture filter across all 47 Japanese prefectures (e.g. \"北海道\", \"東京都\", \"大阪府\", \"兵庫県\", \"沖縄県\").",
                "maxLength": 32,
                "type": "string"
              },
              "targetEV": {
                "default": 3,
                "description": "[Mode \"strategy\"] Target Expected Value (strokes to hole out, 1.0 to 10.0, default 3.0) to reverse-solve for required remaining fairway distance.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "unit": {
                "default": "yards",
                "description": "[Mode \"ev\" | \"dispersion\"] Distance unit (\"yards\", \"meters\", or \"feet\").",
                "enum": ["yards", "meters", "feet"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "generated_at": {
                "description": "ISO-8601 UTC timestamp when this response payload was generated.",
                "type": "string"
              },
              "items": {
                "description": "Deterministic 157,480-point golf Expected Value, Strokes Gained, ShotCircle dispersion, and 2,005-course GPS GamePlan items ordered by query index.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "offset": {
                "description": "Zero-based pagination offset applied to the matched record slice.",
                "type": "integer"
              },
              "partialResult": {
                "description": "True only if a live upstream sub-source returned partial coverage.",
                "type": "boolean"
              },
              "returnedCount": {
                "description": "Number of structured records returned in items for this page.",
                "type": "integer"
              },
              "sealStatus": {
                "description": "TAPP Sigstore Rekor cryptographic Merkle seal status of the dataset.",
                "type": "string"
              },
              "sha256Digest": {
                "description": "Deterministic 64-character hex SHA-256 provenance digest of the returned items.",
                "type": "string"
              },
              "stats": {
                "description": "Execution telemetry including itemCount, durationMs, and upstream breakdown.",
                "type": "object"
              },
              "streamId": {
                "description": "Underlying B2A data stream identifier that fulfilled the query.",
                "type": "string"
              },
              "success": {
                "description": "True when the read-only query completed without upstream or validation failure.",
                "type": "boolean"
              },
              "toolName": {
                "description": "Executed MCP tool name for deterministic audit correlation.",
                "type": "string"
              }
            },
            "required": ["generated_at", "items", "offset", "returnedCount", "sealStatus", "sha256Digest", "stats", "streamId", "success", "toolName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query Golf EV, Strokes Gained & Course Strategy"
          },
          "behavior": {
            "destructive": false,
