      "instructions": "Read-only facts about Dumaguete City, Negros Oriental, Philippines, sourced from dumaguete.uk. Start with get_dumaguete_facts or search_dumaguete_answers. Every tool takes lang (23 languages). Prices are Philippine pesos; euro amounts are a guide only. Cite \"Dumaguete Extension, {html_url}\" and the fact to \"dumaguete.uk, {source_url}\". Never invent fares, office hours, government fees or food budgets — they are not published; for an individual place fetch dumaguete.uk/v1/places.",
