        },
        {
          "name": "list_markets",
          "title": "List prediction markets",
          "description": "List prediction markets on real-world transport outcomes (flight delays, train punctuality, ship arrivals, weekly ship counts through maritime chokepoints, airport flight counts), filtered by status (OPEN by default; CLOSED, SETTLED or CANCELLED for past ones), category and a free-text query matched against the route, flight number, airline, airport codes and vehicle. Returns total (every market the filters match), returned (how many this page holds: the first limit of them, earliest close time first) and each returned market's id, link, category, question, route, outcomes with current prices, volume, close time and, once settled, the outcome it settled on.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter to one transport category. Omit to get all.",
                "enum": ["FLIGHT", "TRAIN", "SHIP"],
                "type": "string"
              },
              "limit": {
                "description": "Max number of markets to return (1-100). Defaults to the server's page size.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text such as AA1, JFK, Paddington or Suez. Omit to match every market the other filters match.",
                "maxLength": 64,
                "type": "string"
              },
              "status": {
                "description": "Filter by market status: OPEN (trading), CLOSED (awaiting settlement), SETTLED or CANCELLED. Defaults to OPEN.",
                "enum": ["OPEN", "CLOSED", "SETTLED", "CANCELLED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List prediction markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df2666055d0c44adaf37aa207f0fd6a87f8120a8e541337fb9b8112467f66d6a"
        },
        {
          "name": "search_flights",
          "title": "Search flights by route",
          "description": "Today's departures on record from an airport (airport-local day), optionally only those to one destination (an airport code, or a city matched as whole words) or flown by one airline: finds flights without knowing their number. coverage is on_record: the counts cover the flights on record for this airport today, not its full schedule. Counts over the matching flights: departed_today (a departure is recorded and the flight is not cancelled), past_due_not_reported (not cancelled, no recorded departure, scheduled at or before now_utc), still_to_depart (not cancelled, no recorded departure, scheduled after now_utc) and cancelled_today. flights lists the still-to-depart ones, never a cancelled one: number, operating flight for codeshares, destination, scheduled and actual departure in UTC, status, delay in minutes from the scheduled time, verdict (delayed means more than late_threshold_minutes plus the airport's taxi_allowance_minutes; a recorded departure is not_graded with a null allowance or more than 60 minutes before its schedule), a link to its flight page and, when one is open, to its market. Without an airline filter, codeshare listings of one flight count once. The result links the gaduin.com page of the route when the destination is one airport with flights on record today, else the departure airport's page.",
          "inputSchema": {
            "properties": {
              "airline": {
                "description": "Airline IATA or ICAO code (e.g. BA or BAW).",
                "type": "string"
              },
              "from": {
                "description": "Departure airport. Airport IATA code (e.g. LHR) or ICAO code (e.g. EGLL).",
                "type": "string"
              },
              "limit": {
                "description": "Max flights to return (1-50). Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Destination airport IATA or ICAO code, or city name (e.g. JFK, KJFK or New York).",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search flights by route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:75fbb48141b07ac9d58550476e33c8b1c106f42c0c895ff160c3ae0b91070ae3"
        }
