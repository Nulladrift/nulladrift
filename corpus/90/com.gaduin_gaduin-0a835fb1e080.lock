      "instructions": "Gaduin's tools return live flight status and on-time history, flights by route, airline on-time records, airport status, train-station departures and arrivals, ship traffic through maritime chokepoints, and prediction markets on flight, train and ship outcomes with their price history, with links to https://gaduin.com. The data is informational, not advice; the account tools (positions, balance) need an API key.",
      "tools": [
        {
          "name": "get_airline_stats",
          "title": "Airline on-time record",
          "description": "An airline's last 30 days of the flights on record that it operates itself (coverage on_record: the flights on record, not its full schedule): arrivals graded against a published schedule, on-time and late counts, the on-time share, median and 90th-percentile arrival delay (all three only from 20 graded arrivals), landings left ungraded, cancellations, diversions, routes flown, up to five most and least delayed flights, the late rule, and a link to its airline page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Airline IATA code (e.g. BA) or ICAO code (e.g. BAW).",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airline on-time record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:beb268e00037a862202ab7c9c6281c285c2f58e26d15a00156124e04ff8e8837"
        },
        {
          "name": "get_airport_status",
          "title": "Airport status today",
          "description": "How an airport is running today (airport-local day), with a link to its page on gaduin.com. departures: today's flights on record scheduled in the local day, each counted once, with coverage on_record (the counts cover the flights on record for this airport today, not its full schedule); of those due (scheduled at or before now) each is exactly one of on_time, delayed, cancelled, not_reported (no recorded departure yet) or not_graded (a recorded departure with a null allowance or more than 60 minutes before its schedule); decided = on_time + delayed + cancelled; cancelled_later counts cancellations scheduled after now, and diverted the due flights shown diverted (also counted in their outcome). Delayed means departing more than delay_threshold_minutes plus taxi_allowance_minutes after the scheduled time; the allowance is the airport's usual taxi time where its departure times are take-off times, 0 for gate times, and null when its departures are not graded yet. The on-time, delayed, cancelled and disrupted (delayed + cancelled) shares are over decided; they and the typical delay of the delayed flights (their lower median) are null, and verdict is unknown, below min_decided (20) decided flights or when departures are not graded. arrivals: coverage is airport_list with share_basis scheduled_day (the airport's own arrivals list), else on_record; with share_basis scheduled_day, arrivals scheduled today, landed and cancelled, with cancelled_share = cancelled / scheduled, null below min_scheduled (20); with share_basis not_comparable (US airports), flights landed in the local day and flights scheduled in it and cancelled, two different days, so scheduled and cancelled_share are null and arrivals never rate the airport; arrival delays are not measured. A side GADUIN did not read today is null. status: severe when the departures disrupted share is at least 0.50, disrupted from 0.25, else normal; when departures are not rated, severe or disrupted when the arrivals cancelled share reaches 0.50 or 0.25, else not_rated, or no_data when nothing was read. status_from names the side that set it; disruption_score is the departures disrupted share. observed_utc is the time of the newest recorded departure.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "Airport IATA code (e.g. LHR) or ICAO code (e.g. EGLL).",
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airport status today"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22cdbacca78f9e9c9181545375f8fdec1aca55d0ee2dd37e93f97edf43c3ab01"
        },
        {
          "name": "get_chokepoint_status",
          "title": "Chokepoint ship traffic",
          "description": "Ship traffic through one maritime chokepoint as of its latest published count: status, the mean of the last 7 calendar days to latest_date against normal and how many of those days are published, the newest daily count, how many final weeks it has been under 85% of normal, since when and against which normal, the last 8 weeks with their share of normal (figures only once a week is final), the last 14 published daily counts, the rule behind the status, and a link to its page on gaduin.com. Counts are published in batches several days in arrears (weekly; Panama monthly): latest_date is the newest day counted, not today.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Chokepoint slug from list_chokepoints, e.g. suez or panama.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Chokepoint ship traffic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23d0a32bc7ffbd1641983c36691b710e2a36f463f85f218e1f0b915fbdde7306"
        },
        {
          "name": "get_flight_history",
          "title": "Flight on-time history",
          "description": "How often a flight has been late over the last 30 days. Returns n (arrivals graded against a published arrival schedule) with its on-time and late counts, ungraded_arrivals (landings with no published schedule to grade), cancelled and diverted counts, operations (n + cancelled + diverted, the base for shares), unconfirmed legs left out, the window (shorter when the record limit cut it), the late rule with its minute threshold, and a link to the flight page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. AA1.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight on-time history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:85b36e19416a26bd76a60ce9f5c80a9eae3eb150658d27fbab7ffc746478bd22"
        },
        {
          "name": "get_flight_status",
          "title": "Flight status",
          "description": "Current status of a flight by number (e.g. AA1 or AAL1). Returns the canonical flight number and the leg its gaduin.com flight page answers with (today's leg in its own time zone, else the active leg nearest now, else the latest one), with its role (current: left and not landed, inside its arrival horizon; next: not yet left; latest: landed, cancelled, no arrival recorded, unconfirmed or past due with nothing recorded), its status (arrival_not_recorded once it left and no arrival was recorded by its scheduled arrival plus 6 hours, else its recorded departure plus 24 hours; timing is then null), whether sources disagree on its outcome, its timing, delay in minutes and on-time or delayed verdict under the late rule, its departure and arrival times in UTC and airport-local time with the time zone, the leg's own last update time (null when none), a link to the flight page and, when one is open, a link to the prediction market that page links (this leg's until it leaves, else the next upcoming leg's, with that leg's service date).",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. AA1.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:475ed0d06ffecf7f491fe049523f2181a0eed6afb0b2cf392e5c6cac0d742f10"
        },
