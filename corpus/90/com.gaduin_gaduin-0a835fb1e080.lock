      "instructions": "Gaduin's tools return live flight status and on-time history, flights by route, disrupted flights, airline on-time records, airport status and day-long airport departures and arrivals boards, aircraft positions and flown tracks, takeoffs and landings observed from transponder positions, train runs by number, station boards and the station catalogue, rail punctuality, ship traffic through maritime chokepoints, port movement lists and vessel port calls, and prediction markets on flight, train and ship outcomes with their price history, with links to https://gaduin.com. The data is informational, not advice; the account tools (positions, balance) need an API key.",
      "tools": [
        {
          "name": "get_aircraft_position",
          "title": "Aircraft position",
          "description": "The latest position on record for the aircraft with this ICAO 24-bit address, however old: latitude, longitude, barometric altitude, ground speed, course, on-ground state and callsign (both null unless reported in the last 15 minutes), when it was reported and its age in seconds. live is true only when it is at most 180 seconds old, two of GADUIN's 90-second reading intervals; an older position is the latest on record, not where the aircraft is now. Not found when no position of the aircraft was recorded in the last 90 days. Positions are what the aircraft's own transponder broadcast, picked up by ground receivers and relayed to GADUIN with a delay, so reported_at_utc, not the time of the request, is when the aircraft was there; where no receiver hears the aircraft (over oceans and remote land) there is no position for that stretch.",
          "inputSchema": {
            "properties": {
              "icao24": {
                "description": "The aircraft's ICAO 24-bit address as six hex digits, e.g. 4ca7b2 (get_flight_status reports it under aircraft).",
                "type": "string"
              }
            },
            "required": ["icao24"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Aircraft position"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d00eaad6df8c4244fa726e81bc502b9217a20d4063f6022d51eb3dbe26b91254"
        },
        {
          "name": "get_aircraft_track",
          "title": "Aircraft recorded track",
          "description": "Every position recorded for an aircraft from from to to, both inclusive, oldest first; nothing is cut. The window may span at most 6 hours and must start within the last 90 days; a longer or older window is refused, so read a longer stretch window by window. GADUIN reads every aircraft's position once every 90 seconds and keeps a point only when the reported position time moved, so points are typically 90 seconds apart, with gaps where no receiver heard the aircraft; aircraft of flights GADUIN follows are read every 5 seconds for about 40 minutes either side of their scheduled arrival, so their points are denser there. Nothing is thinned. Positions are what the aircraft's own transponder broadcast, picked up by ground receivers and relayed to GADUIN with a delay, so reported_at_utc, not the time of the request, is when the aircraft was there; where no receiver hears the aircraft (over oceans and remote land) there is no position for that stretch.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Start of the window: an ISO-8601 time with a UTC offset, e.g. 2026-11-13T12:00:00Z; within the last 90 days.",
                "format": "date-time",
                "type": "string"
              },
              "icao24": {
                "description": "The aircraft's ICAO 24-bit address as six hex digits, e.g. 4ca7b2 (get_flight_status reports it under aircraft).",
                "type": "string"
              },
              "to": {
                "description": "End of the window, after from and at most 6 hours later, in the same form.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["from", "icao24", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Aircraft recorded track"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01345ab6efb9519e1ca9d544e3573124e24da1b380ebe10ed7dc3e41f367f349"
        },
