        },
        {
          "name": "get_market_price_history",
          "title": "Market price history",
          "description": "How a market's prices moved: up to 180 timestamped points, oldest first, each with one price per outcome (in outcome order, 0 to 1). Shows how the market's view of an outcome changed over its life, including for closed and settled markets. The history reads a market's most recent 2,000 trades: when it has more, truncated is true and the series starts at starts_at, not at the market's open.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Market UUID, as list_markets and get_market return it.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8232b171594e2fc90ff3d408044bf8727cd410ed0d701572d72d29ddb8333dec"
        },
        {
          "name": "get_station_board",
          "title": "Train station board",
          "description": "Departures and arrivals at a railway station found by name or station code: for each train still to come, the other end of its journey, scheduled and recorded times in UTC, expected times and platforms where the railway publishes them, status, delay, operator and, when one is open, a link to its market; whether the board is live (expected times) and how fresh its source is; the coming hour's departures and cancellations, with the late count only on a live, fresh board (null otherwise); and a link to the station page on gaduin.com. Finds stations that have a page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max trains per direction (1-30). Defaults to 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "The railway's country code to narrow the match, e.g. GB, US or CH.",
                "type": "string"
              },
              "station": {
                "description": "Station name or code, e.g. London Paddington, PAD or Zürich HB.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Train station board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a069da1bffb67af6fe8491b37df65d83d1cc4282a74afb981ff63c2a823d9c7"
        },
        {
          "name": "list_chokepoints",
          "title": "Maritime chokepoints",
          "description": "Every maritime chokepoint with a published daily ship count (Suez, Panama, Hormuz, Malacca and more), lowest share of normal first, then those unknown or not rated: slug, name, the unit counted, status (open, elevated, disrupted, closed, not_rated when too few ships a day to judge, or unknown), the mean of the last 7 calendar days to latest_date as a share of normal, normal and the newest day behind it, and a link to its page on gaduin.com. Counts are published in batches several days in arrears (weekly; Panama monthly): latest_date is the newest day counted, not today.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Maritime chokepoints"
