{
  "lockfileVersion": 2,
  "subjects": {
    "com.gaduin/gaduin": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gaduin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gaduin",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Gaduin's tools return live flight status and on-time history, flights by route, airline on-time records, airport and train-station status, ship traffic through maritime chokepoints, and prediction markets on flight, train and ship outcomes with their price history, with links to https://gaduin.com. The data is informational, not advice; the account tools (positions, balance) need an API key.",
      "tools": [
        {
          "name": "get_airline_stats",
          "title": "Airline on-time record",
          "description": "An airline's last 30 days of the flights it operates itself: arrivals, on-time and late counts with the on-time share, cancellations, diversions, median and 90th-percentile arrival delay, routes flown, its most and least delayed flights, the late rule, and a link to its airline page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Airline IATA code (e.g. BA) or ICAO code (e.g. BAW).",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airline on-time record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c16788c8c577f244af73e439adacddf144328f0965a956defd81385f8958be35"
        },
        {
          "name": "get_airport_status",
          "title": "Airport status today",
          "description": "How an airport is running today (airport-local day): its status (severe, disrupted, normal, quiet or no_data), disruption score (0-1, the worse side), which side is worse, and for departures and arrivals the flights scheduled, completed, delayed and cancelled, the delayed, cancelled and disrupted shares and the median delay of the delayed ones, with a link to the airport page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "Airport IATA code (e.g. LHR) or ICAO code (e.g. EGLL).",
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airport status today"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aae95bd35b96e4b6c67aac8e35b42546006920179cd5a193ddae9d3c89e7370f"
        },
        {
          "name": "get_chokepoint_status",
          "title": "Chokepoint ship traffic",
          "description": "Ship traffic through one maritime chokepoint: status, the recent daily mean against normal, the newest daily count, how many weeks it has been below normal and since when, the last 8 weekly totals with their share of normal, the last 14 daily counts, the rule behind the status, and a link to its page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Chokepoint slug from list_chokepoints, e.g. suez or panama.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Chokepoint ship traffic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:841863c79b4e138f3756898c55eeb46737f10dcae5fe9caa081cfac789e6d80a"
        },
        {
          "name": "get_flight_history",
          "title": "Flight on-time history",
          "description": "How often a flight has been late over the last 30 days. Returns on-time, late and cancelled counts, n (arrivals with a recorded arrival time), the window, the late rule with its minute threshold, and a link to the flight page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. BA117.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight on-time history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8e4efa2d09db0c1ae80d6a3da942e4a934a6f1a97f8dbfb82fcd4c2188eb8202"
        },
        {
          "name": "get_flight_status",
          "title": "Flight status",
          "description": "Live status of a flight by number (e.g. BA117 or BAW117). Returns the canonical flight number, the leg in the air or next to depart (or the most recent one), its departure and arrival times in UTC and airport-local time with the time zone, delay in minutes, the last update time, a link to the flight page on gaduin.com and, when one is open, a link to the prediction market on that journey.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. BA117.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7bbba12916099d937600398c67fcce29ff577d8e0d41816cfd0407fcf6ec65bf"
        },
        {
          "name": "get_market",
          "title": "Get a market",
          "description": "One market by id or slug: its question, the rule it settles on, route, outcomes with current prices, volume, close time, status and, once settled, the outcome it settled on, with a link to its page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Market UUID, or the slug from a gaduin.com/markets/<slug> link.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4815271c1d5bb2a80439396ff1ea3e7611a2d532af9386bc3335213c4f2229f2"
        },
        {
          "name": "get_market_price_history",
          "title": "Market price history",
          "description": "How a market's prices moved: up to 180 timestamped points, oldest first, each with one price per outcome (in outcome order, 0 to 1). Shows how the market's view of an outcome changed over its life, including for closed and settled markets.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Market UUID, as list_markets and get_market return it.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e9d0eef65de24b034e0e38e62d199129e64da0cee6acefc2f8998db44fe923e"
        },
        {
          "name": "get_station_board",
          "title": "Train station board",
          "description": "Live departures and arrivals at a railway station found by name or station code: for each train still to come, the other end of its journey, scheduled, expected and actual times in UTC, platform, status, delay, operator and, when one is open, a link to its market; plus the coming hour's departures, late and cancelled counts, and a link to the station page on gaduin.com. Finds stations that have a page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max trains per direction (1-30). Defaults to 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "The railway's country code to narrow the match, e.g. GB, US or CH.",
                "type": "string"
              },
              "station": {
                "description": "Station name or code, e.g. London Paddington, PAD or Zürich HB.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Train station board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1c6024ca2bc255e889232fcc96b6630eec350e8b4a9ef3f13fe7bc1046569350"
        },
        {
          "name": "list_chokepoints",
          "title": "Maritime chokepoints",
          "description": "Every maritime chokepoint with a published daily ship count (Suez, Panama, Hormuz, Malacca and more), furthest below normal first: slug, name, status (open, elevated, disrupted, closed or unknown), recent daily mean as a share of normal, the newest day counted, and a link to its page on gaduin.com.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Maritime chokepoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ae9568519dcc95c144a5e25ba92be592c89faec691e97d0911f0f12e901ce6b"
        },
        {
          "name": "list_disrupted_airports",
          "title": "Most disrupted airports today",
          "description": "Today's most disrupted airports, worst first: those rated disrupted or severe, each with the same reading as get_airport_status and a link to its page on gaduin.com. Empty when none is disrupted.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max airports to return (1-50). Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Most disrupted airports today"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73bbf97c73e605e953f06e1ab31ff52bb742bfdab807ea85085866bd09869e5a"
        },
        {
          "name": "list_markets",
          "title": "List prediction markets",
          "description": "List prediction markets on real-world transport outcomes (flight delays, train punctuality, ship arrivals, weekly ship counts through maritime chokepoints, airport flight counts), filtered by status (OPEN by default; CLOSED, SETTLED or CANCELLED for past ones), category and a free-text query matched against the route, flight number, airline, airport codes and vehicle. Returns each market's id, link, category, question, route, outcomes with current prices, volume, close time and, once settled, the outcome it settled on.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter to one transport category. Omit to get all.",
                "enum": ["FLIGHT", "TRAIN", "SHIP"],
                "type": "string"
              },
              "limit": {
                "description": "Max number of markets to return (1-100). Defaults to the server's page size.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text such as BA117, JFK, Paddington or Suez. Omit to list everything matching the other filters.",
                "maxLength": 64,
                "type": "string"
              },
              "status": {
                "description": "Filter by market status: OPEN (trading), CLOSED (awaiting settlement), SETTLED or CANCELLED. Defaults to OPEN.",
                "enum": ["OPEN", "CLOSED", "SETTLED", "CANCELLED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List prediction markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80551c2ff2757105b476167b7d6055d6f47c3c9f5967a940a416427b40bda1bc"
        },
        {
          "name": "search_flights",
          "title": "Search flights by route",
          "description": "Today's departures from an airport still to leave (airport-local day), optionally only those to one destination or flown by one airline: finds flights without knowing their number. Each flight has its number, operating flight for codeshares, destination, scheduled and actual departure in UTC, status, delay, a link to its flight page and, when one is open, to its market; with counts of matching flights departed and still to depart.",
          "inputSchema": {
            "properties": {
              "airline": {
                "description": "Airline IATA or ICAO code (e.g. BA or BAW).",
                "type": "string"
              },
              "from": {
                "description": "Departure airport. Airport IATA code (e.g. LHR) or ICAO code (e.g. EGLL).",
                "type": "string"
              },
              "limit": {
                "description": "Max flights to return (1-50). Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Destination airport IATA or ICAO code, or city name (e.g. JFK, KJFK or New York).",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search flights by route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f56911a88ccc1bb339a202171ad8932f37ae338c5484a8427996b1d19c62e2e6"
        }
      ],
      "digest": "sha256:31b0a6abb00758df0f8c74ea994c3692faea0dd20334da442dcdf09d7ec0005e"
    }
  }
}
