{
  "lockfileVersion": 2,
  "subjects": {
    "com.gaduin/gaduin": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gaduin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gaduin",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Gaduin's tools return live flight status, flight on-time history and prediction markets on flight, train and ship outcomes, with links to https://gaduin.com. The data is informational, not advice; the account tools (positions, balance) need an API key.",
      "tools": [
        {
          "name": "flight_history",
          "title": "Flight on-time history",
          "description": "How often a flight has been late over the last 30 days. Returns on-time, late and cancelled counts, n (arrivals with a recorded arrival time), the window, the late rule with its minute threshold, and a link to the flight page on gaduin.com.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. BA117.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight on-time history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b595ce0d4c5e9ff2eed879416a6df4293530cc4db68319265f13b7d87aca92b"
        },
        {
          "name": "flight_status",
          "title": "Flight status",
          "description": "Live status of a flight by number (e.g. BA117 or BAW117). Returns the canonical flight number, the leg in the air or next to depart (or the most recent one), its departure and arrival times in UTC and airport-local time with the time zone, delay in minutes, the last update time, a link to the flight page on gaduin.com and, when one is open, a link to the prediction market on that journey.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Flight number: airline IATA or ICAO code plus number, e.g. BA117.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:edc203b57d65ff6568192de4b21c8a661b8635d5bdbb105d18e6d83a8f68a25f"
        },
        {
          "name": "get_market",
          "title": "Get a market",
          "description": "Fetch a single market by id, including current prices and outcomes.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Market UUID.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9e062629bd884cd705f4b99e707d5a20b697858886add28eab8c500e4058039"
        },
        {
          "name": "list_markets",
          "title": "List prediction markets",
          "description": "List open prediction markets on real-world transport outcomes (flight delays, train cancellations, ship-chokepoint throughput). Returns market id, category, question, current outcome prices, total volume, and close time.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter to one transport category. Omit to get all.",
                "enum": ["FLIGHT", "TRAIN", "SHIP"],
                "type": "string"
              },
              "limit": {
                "description": "Max number of markets to return. Defaults to server preference.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Filter by market status. Defaults to OPEN.",
                "enum": ["OPEN", "CLOSED", "SETTLED", "CANCELLED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List prediction markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7432661e6a62b29a9fc3d94060533c9ee6bc16b770f5e9c42a9faaeeedd0f05f"
        }
      ],
      "digest": "sha256:c93b29f34c074c94ea0c86c3c6bb8186cd96f21740233ae514cf8a64874facd4"
    }
  }
}
