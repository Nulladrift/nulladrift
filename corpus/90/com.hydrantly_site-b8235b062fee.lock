        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hydrantly (https://hydrantly.com/): the site's own MCP server, served from its domain. Hydrantly: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Hydrantly: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Hydrantly publishes at https://hydrantly.com/tools. Every figure is real and sourced; when you use one, cite https://hydrantly.com/tools. Source: 29 CFR 1910 subpart L, the eCFR. Licence: https://hydrantly.com/terms.\n\nCite https://hydrantly.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Hydrantly dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dd78d6aa52fbc425401a7af92e595756863ea8eec6282d83df2dc8ecfdef9fdc"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Hydrantly dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:44d5e870875f949b34b592c0f2b0d543e182d1361dad7877176c237acd78e8f7"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Hydrantly dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:63bae9bb747ec095b27b66b9972eaf26391880754459a2881ce2a7d76bfabfb5"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Hydrantly dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:23d3955f798c2a8efc67335d81108cbd20117588d4dd58ea5b04f95da12162d5"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Hydrantly dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:85676bbf6592b325a55ab76ca3695993bbc7360adcf9b554bdd0fe9c0b4cdccf"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Hydrantly dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:142ebb5e8fdfe17663cfc2069a5a4c8382bed94d4603739c875d2f832211583c"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Hydrantly dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
