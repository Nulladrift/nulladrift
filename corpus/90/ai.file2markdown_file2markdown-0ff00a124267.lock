{
  "lockfileVersion": 2,
  "subjects": {
    "ai.file2markdown/file2markdown": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.file2markdown.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "file2markdown",
        "title": "file2markdown",
        "version": "",
        "description": "Convert documents and web pages to clean, LLM-ready Markdown.",
        "websiteUrl": "https://www.file2markdown.ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Convert documents and web pages to clean Markdown. Use convert_url for anything reachable by URL (web pages, PDFs, Office files); convert_base64 for local file contents. Anonymous callers get 5 conversions/day per network; a Pro API key removes the limit, enables OCR for scanned PDFs and images, and unlocks convert_batch (2-10 documents in one call). Keys: https://www.file2markdown.ai/account",
      "tools": [
        {
          "name": "convert_base64",
          "description": "Convert base64-encoded file contents to Markdown.\n\n    filename is required and drives format detection (e.g. \"report.docx\").\n    Intended for programmatic MCP clients; for anything with a URL, prefer\n    convert_url.\n\n    quality_check: \"basic\" (default) attaches local output-health checks in\n    the `quality` field; \"ai\" additionally sends selected excerpts of the\n    converted text to TypeSafe for narrow yes/no judgments. See convert_url.\n    ",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "title": "Content Base64",
                "type": "string"
              },
              "filename": {
                "title": "Filename",
                "type": "string"
              },
              "quality_check": {
                "default": "basic",
                "title": "Quality Check",
                "type": "string"
              }
            },
            "required": ["content_base64", "filename"],
            "title": "convert_base64Arguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76cf9029c38ae7268c3b159023b256ddd70ce322d29906d3569ad2578c7fc579"
        },
        {
          "name": "convert_batch",
          "description": "Convert 2-10 documents to Markdown in one call (Pro API key required).\n\n    Each item is either {\"url\": ..., \"filename_hint\"?: ...} or\n    {\"content_base64\": ..., \"filename\": ...}; types may be mixed. Items are\n    converted in parallel and isolated: one bad URL or file never fails the\n    batch — its slot returns ok:false with the error. The combined markdown\n    shares one output budget, split evenly across items (per-item `truncated`\n    flags apply). Set include_markdown=false to get only metadata + quality\n    per item (health-check a folder without flooding your context).\n\n    Anonymous callers: use convert_url / convert_base64 individually.\n    ",
          "inputSchema": {
            "properties": {
              "include_markdown": {
                "default": true,
                "title": "Include Markdown",
                "type": "boolean"
              },
              "items": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Items",
                "type": "array"
              },
              "quality_check": {
                "default": "basic",
                "title": "Quality Check",
                "type": "string"
              }
            },
            "required": ["items"],
            "title": "convert_batchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:769f8d62aacd8e7efdcfa3c8fbee289bab6ffa0a077b07d1a71e6fc107e238e9"
        },
        {
          "name": "convert_url",
          "description": "Fetch a URL (web page, PDF, Office doc, and more) and convert it to Markdown.\n\n    Works on publicly accessible URLs. Web pages are converted from their\n    served HTML; JavaScript-rendered content may be incomplete. Optional\n    filename_hint (e.g. \"report.pdf\") helps format detection when the URL\n    has no file extension.\n\n    The result carries a `quality` object (output-health check of the returned\n    Markdown: status review / no_issues_detected / not_evaluated, coverage and\n    a list of issues with line locations). quality_check=\"basic\" (default)\n    runs only local deterministic checks. quality_check=\"ai\" additionally\n    sends selected excerpts of the CONVERTED text to TypeSafe for narrow\n    yes/no judgments (garbled text, hard-wrapped prose, broken tables); it is\n    off unless requested. No check compares against the source document.\n    ",
          "inputSchema": {
            "properties": {
              "filename_hint": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Filename Hint"
              },
              "quality_check": {
                "default": "basic",
                "title": "Quality Check",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "convert_urlArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ff8069e3408bfbcbec9168c0d4a5f1b05f258ca9682a445cb7d4a1d292d8b90"
        },
        {
          "name": "list_supported_formats",
          "description": "List supported input formats, per-tier limits, and which features need Pro.\n\n    Single source of truth — do not claim capabilities beyond what this\n    returns.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "list_supported_formatsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e5d642f1ec9e214c3b7dc5f9175c648a0024922576a46456488f5fd2de8b770"
        },
        {
          "name": "usage_status",
          "description": "Check your tier and remaining conversions before burning a call.",
          "inputSchema": {
            "properties": {},
            "title": "usage_statusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f41b69e3551586fbe236c8b9a29972c3d7e69757f51bea1bdcd862b324a80cb"
        }
      ],
      "digest": "sha256:ecdf692fe54ea0f549f46845cc01ac1c67e33ff44a0567dee37a4e563e77710d"
    }
  }
}
