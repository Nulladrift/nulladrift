{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ai-portal/ai-portal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ai-portal.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai-portal",
        "title": "AI-Portal — Enterprise GenAI Briefing",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools over AI-Portal data (https://www.ai-portal.ai): AI model releases, AI regulations, a GenAI glossary, and daily curated GenAI news. Use list_releases for \"when did model X ship / what did provider Y release\", list_regulations for AI compliance status, search_glossary for term definitions, and get_latest_news for current GenAI headlines.",
      "tools": [
        {
          "name": "get_latest_news",
          "title": "Get latest GenAI news",
          "description": "Latest curated GenAI news items from AI-Portal, refreshed every weekday morning.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max items to return (default 10, max 30)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2247f13793f6a096848d1d37cf462b1328afae128b0a555c3b578f7b09f7d11"
        },
        {
          "name": "list_regulations",
          "title": "List AI regulations",
          "description": "List AI regulations and their compliance status (EU AI Act, ISO 42001, and more), including jurisdiction, effective dates, key requirements, and fines.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "Jurisdiction substring, e.g. \"european\", \"israel\"",
                "type": "string"
              },
              "status": {
                "description": "Filter by status",
                "enum": ["In Force", "Transitional", "Draft", "Proposed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:421009c5c61f73c17b7b9655500716a3a769c6df6b8a899ad1edc7fe308447d2"
        },
        {
          "name": "list_releases",
          "title": "List AI model releases",
          "description": "List AI model and product releases tracked by AI-Portal, newest first. Filter by category, provider, year, or landmark releases only.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Release category",
                "enum": ["llm", "multimodal", "image", "video", "tool", "framework"],
                "type": "string"
              },
              "landmark_only": {
                "description": "Only landmark (major) releases",
                "type": "boolean"
              },
              "limit": {
                "description": "Max items to return (default 25, max 100)",
                "type": "number"
              },
              "provider": {
                "description": "Provider name substring, e.g. \"anthropic\", \"google\"",
                "type": "string"
              },
              "year": {
                "description": "Four-digit year, e.g. \"2026\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa3f6845f7f7e6447a612a56206e7871457e74154314d6473ffa37db5abfe5a5"
        },
        {
          "name": "search_glossary",
          "title": "Search the AI glossary",
          "description": "Search AI-Portal's glossary of AI/GenAI terms. Returns term, definition, category, and a usage example.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["fundamentals", "architecture", "training", "deployment", "safety", "agents", "evaluation"],
                "type": "string"
              },
              "query": {
                "description": "Search text, matched against term, abbreviation, and definition",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:edaf9208de4f7efaf31bbbf50fe58514cbe1495b219277e9f9ac9be9f151e11a"
        }
      ],
      "digest": "sha256:cf80cfd46927d842374195381f9f68421ce84fd05433889b970757835606fbf8"
    }
  }
}
