      "serverInfo": {
        "name": "fill-my-bracket",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Fill My Bracket is a caddie for your March Madness bracket: it gives you the data to choose with. Until the 2027 field is set on Selection Sunday, March 14, 2027, there is no bracket field, so these tools serve what is real right now. Call get_rankings for the current AP Top 25 and the Bart Torvik model's ranks (rankings as of Monday, November 9, 2026; the AP Top 25, Week 1 poll released November 9, 2026), or for one team's poll rank, votes, and model rank. Call get_cinderella_radar for the site's Cinderella radar: the unranked teams whose model rank says they could surprise in March, the watch list, and the ranked teams flagged as vulnerable favorites, each with its counted first-round seed-line record. Call get_upset_counts when the user asks how often upsets happen or how a seed line has done: it answers from the men's tournament counted game by game, 1985-2026 (wins in N games). Every result carries its as-of date; keep that date in view when you present a result. Counted history is not a prediction: never present a historical win share as the odds or probability of a future game. Keep answers to what the tools return: do not invent teams, ranks, seeds, or matchups. No 2027 team, seed, or matchup exists yet; if the user asks you to fill a bracket or name the 2027 field, say the field is set on Selection Sunday, March 14, 2027 and the bracket builder arrives with it. Call get_backtest for a past tournament (2016-2026): the winning recipes - which combinations of those same answers, run by the site's own engine over that year's real field, would have scored best against what actually happened, counted under standard pool scoring. It can also score one exact recipe. A backtest describes a finished tournament; never present it as evidence about a future one. The tools are read-only, preference and data only: never state or imply odds, win probabilities, or betting advice. The tools cannot submit a bracket to any pool, take payment, or use a pool login. Nothing is saved or tracked beyond anonymous per-day tool call counts (integers only).",
      "tools": [
        {
          "name": "get_backtest",
          "title": "Get backtested winning recipes",
          "description": "For a past men's tournament (2016-2026; no tournament was played in 2020), returns the winning recipes: the site's own five-question engine was run over that year's REAL field (real teams, real seeds) across 108 answer combinations, and every bracket was scored against what actually happened under standard pool scoring (1-2-4-8-16-32, max 192). With no style inputs, returns the year's real champion and Final Four, the best total score and the recipe that earned it, the best first-weekend score, how many recipes ended with the real champion, and how many reproduced the full Final Four (in most years, none did). With style inputs (chaos, tiebreak, champion_pick, loyalty), scores that exact recipe instead. Counted history, not a prediction: a recipe is what WOULD have scored in a finished tournament, and the result says so. No odds, no betting advice.",
          "inputSchema": {
            "properties": {
              "champion_pick": {
                "description": "Optional recipe input: one of that year's real Final Four teams, or 'none'.",
                "type": "string"
              },
              "chaos": {
                "description": "Optional recipe input: 'chalk', 'some', 'lots', or 'chaos'.",
                "type": "string"
              },
              "loyalty": {
                "description": "Optional recipe input: 'none' or 'home' (root for the champion pick as your home team).",
                "type": "string"
              },
              "tiebreak": {
                "description": "Optional recipe input: 'mascot', 'colors', or 'familiar'.",
                "type": "string"
              },
              "year": {
                "description": "Tournament year, 2016-2026 (no 2020). Default 2025.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get backtested winning recipes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b859bf2701a6c8f7e51fd1111eb592969b10c2203336419498eb721e2af37e8"
        },
        {
          "name": "get_cinderella_radar",
          "title": "Get the Cinderella radar",
          "description": "Returns Fill My Bracket's Cinderella radar, as of Monday, November 9, 2026, exactly as published on the site's rankings page: the unranked teams the model rates far above their poll votes (each with its league, AP votes, model rank, and a plain why line), the Cinderella watch list, and the ranked teams flagged as vulnerable favorites on their projected seed lines, each with that line's counted first-round record from 1985-2026. These are November signals from the Week 1 poll and one model, stated as the site states them: not predictions, not odds, and no guarantee any of these teams makes the 2027 field, which is set on Selection Sunday, March 14, 2027.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Cinderella radar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68f15bffbbc336658ef9cac8fc5e04dd85f8d3a9db4ebacf2b3616e04da3a3d3"
        },
        {
          "name": "get_rankings",
          "title": "Get current rankings",
          "description": "Returns the current college basketball rankings exactly as published on fillmybracket.com/college-basketball-rankings: the AP Top 25, Week 1 (released Monday, November 9, 2026, with first-place votes), the other teams receiving votes, and the Bart Torvik T-Rank model ranks (read November 1, 2026). Rankings as of Monday, November 9, 2026, and every result says so. With no argument, returns the full Top 25 plus the model's own top 10, so the poll-vs-model gaps are visible. With a team name, returns that team's AP rank or votes, its model rank, and any radar or vulnerable-favorite note the site carries for it. A team outside the published data gets a plain not-found: nothing is invented. Real teams and real ranks only; this is current-season data, not the 2027 tournament field, which is set on Selection Sunday, March 14, 2027.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Optional: how many of the Top 25 to return, 1 to 25. Default 25.",
                "type": "number"
              },
              "team": {
                "description": "Optional: one team name, e.g. 'Duke' or 'Grand Canyon'. Omit for the full Top 25 table.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ffb681cc780b30b5cf5a86bbbc007637a6d14d1213f7a43ccefed0b5732e78a"
        },
        {
          "name": "get_upset_counts",
          "title": "Get counted upset history",
          "description": "Answers upset questions from the men's tournament counted game by game, 1985-2026 (41 tournaments, 2,583 games): how often a seed line wins its first-round game (stated as wins in 164 games), how many first-round upsets a typical year has, and how far a seed has gone. Ask with a matchup ('12 vs 5'), a seed, or no argument for the whole table. These are counted historical facts, not odds, not win probabilities for any future game, and not betting advice. The dataset is men's only and covers the main bracket from the round of 64 (no First Four games).",
          "inputSchema": {
            "properties": {
              "matchup": {
                "description": "A first-round seed pairing, e.g. '12 vs 5'. Optional.",
                "type": "string"
              },
              "seed": {
                "description": "One seed, 1 to 16: returns its first-round seed line. Optional.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get counted upset history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dee9d2af6a5cbc29079bb2f1e5ae5de50435268a3416d3607696265e9dce9e75"
        }
      ],
      "digest": "sha256:b61c88f8634c9344eedb53a55bbb054c9f5a381eb24cc308ba0dbe8f00b7fd10"
    }
