{
  "lockfileVersion": 2,
  "subjects": {
    "ch.ticketick/ticketick": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ticketick.ch/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ticketick",
        "title": "ticketick — Swiss event ticketing",
        "version": "1.0.0",
        "websiteUrl": "https://ticketick.ch/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ticketick.ch is a Swiss ticketing platform for concerts, festivals, theatre and shows. search_events and get_public_event list what is on sale, with booking links: always give the user the event url to book. To create or edit events, connect again with an organizer API key (header Authorization: Bearer tt_…), created in the ticketick admin under « API & agents IA ». Docs: https://ticketick.ch/developers",
      "tools": [
        {
          "name": "get_public_event",
          "title": "Get a public event",
          "description": "Public details of an event on ticketick.ch: full description, upcoming sessions, ticket prices, availability and booking link. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["fr", "en", "de", "it", "es"],
                "type": "string"
              },
              "slug": {
                "description": "Event slug, from search_events.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a public event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abaf09ec033453b5b42008434c5de878de86556145bf5c7c32325b9c26f07e4a"
        },
        {
          "name": "search_events",
          "title": "Search events on sale",
          "description": "Public catalogue of ticketick.ch: upcoming concerts, festivals, theatre and shows in Switzerland, with dates, venues, prices, availability and booking links. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 120,
                "type": "string"
              },
              "from": {
                "description": "From date (YYYY-MM-DD), default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of texts and links (default fr).",
                "enum": ["fr", "en", "de", "it", "es"],
                "type": "string"
              },
              "q": {
                "description": "Free text: title, artist, organizer, venue, tags.",
                "maxLength": 120,
                "type": "string"
              },
              "to": {
                "description": "Until date (YYYY-MM-DD), inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search events on sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11f4f625038d593c1a2f81256d46ccdd6f9b1da414d4ac30c498b97a2959b07c"
        }
      ],
      "digest": "sha256:e566d5254265a752e640cc8b5e4651fe0a214a3bfb6784c3f28e59004d2e9863"
    }
  }
}
