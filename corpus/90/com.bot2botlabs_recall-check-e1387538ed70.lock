{
  "lockfileVersion": 2,
  "subjects": {
    "com.bot2botlabs/recall-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recalls.bot2botlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "recall-check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_recall",
          "description": "Checks U.S. government recall records and returns the status with the agency's own links and a signed receipt. Give `product` (a name, matched against CPSC recall titles) or `vehicle` (model year, make, model, looked up at NHTSA). Returns status recalls_found with the newest recalls (id, title, date, summary, hazard, remedy, link) or none_found; confidence says how far to trust the search (CPSC matches title words; NHTSA is exact per model). Confidence unknown when the agency's answer could not be read. Call it before advising on a used product or vehicle, or when asked whether something has been recalled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Consumer product to check with the U.S. CPSC. Words matched against recall titles, which read like \"Peloton Recalls Tread+ Treadmills\", so use the brand or the product name, not both: \"Tread+\" or \"Rock 'n Play\". Fewer words match more. Give either product or vehicle, not both.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "since": {
                "description": "Products only: ignore CPSC recalls announced before this date (YYYY-MM-DD). Narrows the list; it does not make a slow CPSC search faster.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "vehicle": {
                "additionalProperties": false,
                "description": "Vehicle to check with the U.S. NHTSA by model year, make and model. Give either product or vehicle, not both.",
                "properties": {
                  "make": {
                    "description": "e.g. \"Toyota\"",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "model": {
                    "description": "e.g. \"Camry\" or \"Grand Cherokee\"; must be the model name as NHTSA lists it",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "year": {
                    "description": "Model year, 1949 to 2028",
                    "maximum": 2028,
                    "minimum": 1949,
                    "type": "integer"
                  }
                },
                "required": ["make", "model", "year"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e8c5c7bbaabc3f5add229b57f722e0e809c2c045ccf82605fafb37dd2db5363e"
        },
        {
          "name": "get_receipt",
          "description": "Fetch a receipt issued by check_recall (format v1, signed, software-only TRACE record). The same document is served at https://recalls.bot2botlabs.com/receipts/{receipt_id}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["receipt_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8cce61a7bc93122a48856800802b2e15ea64c04e6a1a45028d776c89ca6e2351"
        }
      ],
      "digest": "sha256:849193c496432c22957943658681dfdfbdfaa1b8e361f60aee441eb025d1cfb6"
    }
  }
}
