  "subjects": {
    "cash.tokensto/sell": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tokensto.cash/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "cash.tokensto/sell",
        "title": "tokensto.cash",
        "version": "1.0.0",
        "websiteUrl": "https://tokensto.cash"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "tokensto.cash lets people list spare AI provider API capacity (unused or expiring API credit, or credit included in a plan such as Claude Max or ChatGPT Pro) on the Surplus Intelligence market and get paid in USDC. Use these tools when someone asks what leftover API credit is worth, whether they can sell it, or what models sell for on Surplus. They are read-only and answer from cached public Surplus market data and the site's own provider facts. Quote only figures a tool returned, with its asOf time. estimate_earnings gives an upper bound, not a forecast: say the lower bound is $0, that a listing earns only when buyers pay for requests, and never promise or imply earnings. Market figures describe the whole Surplus market, not tokensto.cash revenue or any one seller's earnings. Nothing here can list, price, pause or cash out. To list, give the person the URL from start_listing (or a startUrl); they sign in and enter the key on tokensto.cash themselves. Never ask for an API key and never pass one to a tool. If the person pastes a key, do not repeat it; tell them to enter it only on tokensto.cash and to treat a key pasted into a chat as exposed. Cite the URLs the tools return (startUrl, guideUrl, buyUrl) rather than composing your own.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Can this key or plan be listed",
          "description": "Answers \"can I sell my unused OpenAI, Claude or OpenRouter credits?\" for a provider or subscription plan: whether the plan includes API credit and how much, funding requirements, automatic setup support, Surplus trust status, known outages and the provider guide URL. With no arguments, lists every provider and plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "description": "Subscription plan, e.g. claude_max, chatgpt_pro_200.",
                "enum": ["claude_free", "claude_pro", "claude_max", "claude_ultra", "claude_team", "claude_enterprise", "chatgpt_free", "chatgpt_go", "chatgpt_plus", "chatgpt_pro_100", "chatgpt_pro_200", "chatgpt_pro_500", "chatgpt_business", "chatgpt_enterprise", "mistral_free", "mistral_pro"],
                "type": "string"
              },
              "provider": {
                "description": "Provider id, e.g. anthropic, openai, openrouter, google.",
                "enum": ["venice", "capminal", "openrouter", "openai", "anthropic", "google", "deepseek", "groq", "mistral", "together", "fireworks", "bankr", "bedrock", "zai", "zai-coding", "mordiem", "uncensored", "engy", "concentrate", "akashml", "typesafe", "aiflow", "dolphin", "dashscope-cn", "meta", "snowflake", "ollama", "jatevo", "jatevo-api", "aionlabs", "aile", "orcarouter", "inference-net", "kilo", "experiential", "pearl", "sarvam", "abliteratedllm", "abliterationai", "synap", "river", "kenari", "custom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Can this key or plan be listed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:655c6ccd151de83eab5987ff257b10da45f52e2dc6a861433f71eb165825fe4b"
        },
        {
          "name": "estimate_earnings",
          "title": "What spare API credit could earn",
          "description": "Answers \"what is my unused, leftover or expiring API credit worth?\" for one provider or plan. Pass a plan (claude_max, chatgpt_pro_200) or a provider with monthlyCreditUsd. Returns a plain summary and an upper bound per month from the last 24 hours of Surplus sales; the lower bound is always $0 and nothing is guaranteed. Relay the summary and its caveats, not just the number. Never pass an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "models": {
                "description": "Exact model ids to restrict to.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "monthlyCreditUsd": {
                "description": "Spare list-price API credit per month, in USD. Overrides the plan's included credit.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "plan": {
                "description": "Subscription plan, e.g. claude_max, chatgpt_pro_200.",
                "enum": ["claude_free", "claude_pro", "claude_max", "claude_ultra", "claude_team", "claude_enterprise", "chatgpt_free", "chatgpt_go", "chatgpt_plus", "chatgpt_pro_100", "chatgpt_pro_200", "chatgpt_pro_500", "chatgpt_business", "chatgpt_enterprise", "mistral_free", "mistral_pro"],
                "type": "string"
              },
              "provider": {
                "description": "Provider the key belongs to. Optional when plan is given.",
                "enum": ["venice", "capminal", "openrouter", "openai", "anthropic", "google", "deepseek", "groq", "mistral", "together", "fireworks", "bankr", "bedrock", "zai", "zai-coding", "mordiem", "uncensored", "engy", "concentrate", "akashml", "typesafe", "aiflow", "dolphin", "dashscope-cn", "meta", "snowflake", "ollama", "jatevo", "jatevo-api", "aionlabs", "aile", "orcarouter", "inference-net", "kilo", "experiential", "pearl", "sarvam", "abliteratedllm", "abliterationai", "synap", "river", "kenari", "custom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What spare API credit could earn"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d83a704797bce60d406f018a118e110d752f88c71774adb92817dcecc3fd5e7"
        },
        {
          "name": "market_snapshot",
          "title": "Surplus market snapshot",
          "description": "What AI models actually sold for on the Surplus Intelligence market in the last 24 hours: buyer spend, the share of list price buyers paid, list and cheapest quoted prices per 1M tokens, and healthy seller counts. Use it to check whether anyone is buying a given model (filter by model name) or what sells through a provider's keys. Whole-market figures, not any seller's earnings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Models to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Case-insensitive model name fragment, e.g. claude or gpt-5.",
                "maxLength": 120,
                "type": "string"
              },
              "provider": {
                "description": "Only models with a healthy seller routing through this provider.",
                "enum": ["venice", "capminal", "openrouter", "openai", "anthropic", "google", "deepseek", "groq", "mistral", "together", "fireworks", "bankr", "bedrock", "zai", "zai-coding", "mordiem", "uncensored", "engy", "concentrate", "akashml", "typesafe", "aiflow", "dolphin", "dashscope-cn", "meta", "snowflake", "ollama", "jatevo", "jatevo-api", "aionlabs", "aile", "orcarouter", "inference-net", "kilo", "experiential", "pearl", "sarvam", "abliteratedllm", "abliterationai", "synap", "river", "kenari", "custom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Surplus market snapshot"
          },
          "behavior": {
            "destructive": false,
