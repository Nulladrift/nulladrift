                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Catalog identifier for a plan or capability.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Human-readable capability label.",
                      "type": "string"
                    },
                    "planIds": {
                      "description": "Selected plans offering this capability; more than one ID indicates overlap.",
                      "items": {
                        "type": "string"
