        {
          "name": "ai_api_cost",
          "title": "AI API cost",
          "description": "Estimate API workload costs in USD per request, day and month, with rates and dated snapshot provenance. Use for token budgets; use ai_subscription_stack_cost for chat or coding subscriptions. Model IDs use providerId/id from https://operatornest.com/api/models?subset=pricing, filtered to the MCP catalog; the OSS bundle lists accepted IDs in src/data/pricing-snapshot.json. Rates stay offline until the catalog is updated; missing rates return null. Cached tokens are part of total input; published batch and long-context rates apply only when eligible. Non-token charges are excluded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batchModelIds": {
                "description": "Optional subset of modelIds to price with published batch discounts. Omission or [] uses standard rates; IDs without a published discount are rejected.",
                "examples": [
                  []
                ],
                "items": {
                  "description": "Selected model ID with a published batch discount.",
                  "maxLength": 200,
                  "minLength": 1,
                  "pattern": "\\S",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 0,
                "type": "array",
                "uniqueItems": true
              },
              "cachedInputTokens": {
                "description": "Cached portion of inputTokens per request; must not exceed inputTokens. Use 0 without caching.",
                "examples": [5000],
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "inputTokens": {
                "description": "Total input tokens per request, including cached input tokens.",
                "examples": [10000],
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "modelIds": {
                "description": "Unique providerId/id values from the MCP pricing catalog. Unknown or unavailable IDs fail validation.",
                "items": {
                  "description": "Model ID accepted by the MCP pricing catalog.",
                  "maxLength": 200,
                  "minLength": 1,
                  "pattern": "\\S",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "outputTokens": {
                "description": "Generated output tokens per request.",
                "examples": [2000],
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "requestsPerDay": {
                "description": "Requests used to scale the daily estimate, independent of requestsPerMonth.",
                "examples": [100],
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "requestsPerMonth": {
                "description": "Requests used to scale the monthly estimate; not inferred from the daily count.",
                "examples": [3000],
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["cachedInputTokens", "inputTokens", "modelIds", "outputTokens", "requestsPerDay", "requestsPerMonth"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "API token cost estimates with normalized inputs, USD units, rate assumptions and catalog snapshot provenance.",
            "properties": {
              "assumptions": {
                "description": "Limits and assumptions to retain when presenting the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "estimates": {
                "description": "Cost estimates in selected-model order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "batch": {
                      "description": "Whether a requested published batch discount was applied.",
                      "type": "boolean"
                    },
                    "longContext": {
                      "description": "Whether published long-context rate multipliers apply.",
                      "type": "boolean"
                    },
                    "modelId": {
                      "description": "Selected providerId/id from the pricing catalog.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Display name of the selected model or plan.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Catalog note about pricing limitations.",
                      "type": "string"
                    },
                    "perDay": {
                      "description": "Estimated USD per day at requestsPerDay; null when rates are unlisted.",
                      "type": ["number", "null"]
                    },
                    "perMonth": {
                      "description": "Estimated USD per month at requestsPerMonth; null when rates are unlisted.",
                      "type": ["number", "null"]
                    },
                    "perRequest": {
                      "description": "Estimated USD per request; null when any required rate is unlisted.",
                      "type": ["number", "null"]
                    },
                    "ratesPerMillion": {
                      "additionalProperties": false,
                      "description": "USD rates per million tokens after long-context multipliers, before batch discounts; null means unlisted.",
                      "properties": {
                        "cachedInput": {
                          "description": "Cached-input USD rate per million tokens; falls back to the input rate when absent.",
                          "type": ["number", "null"]
                        },
                        "input": {
                          "description": "Uncached-input USD rate per million tokens; null means unlisted.",
                          "type": ["number", "null"]
                        },
                        "output": {
                          "description": "Output USD rate per million tokens; null means unlisted.",
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["cachedInput", "input", "output"],
                      "type": "object"
                    },
                    "sourceUrl": {
                      "description": "Official rate or scheduler syntax reference URL.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["batch", "longContext", "modelId", "name", "note", "perDay", "perMonth", "perRequest", "ratesPerMillion", "sourceUrl"],
                  "type": "object"
                },
                "type": "array"
              },
              "input": {
                "additionalProperties": false,
                "description": "Normalized inputs used for this calculation.",
                "properties": {
                  "batchModelIds": {
                    "description": "Optional subset of modelIds to price with published batch discounts. Omission or [] uses standard rates; IDs without a published discount are rejected.",
                    "examples": [
                      []
                    ],
                    "items": {
                      "description": "Selected model ID with a published batch discount.",
                      "maxLength": 200,
                      "minLength": 1,
                      "pattern": "\\S",
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 0,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "cachedInputTokens": {
                    "description": "Cached portion of inputTokens per request; must not exceed inputTokens. Use 0 without caching.",
                    "examples": [5000],
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "inputTokens": {
                    "description": "Total input tokens per request, including cached input tokens.",
                    "examples": [10000],
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "modelIds": {
                    "description": "Unique providerId/id values from the MCP pricing catalog. Unknown or unavailable IDs fail validation.",
                    "items": {
                      "description": "Model ID accepted by the MCP pricing catalog.",
                      "maxLength": 200,
                      "minLength": 1,
                      "pattern": "\\S",
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "outputTokens": {
                    "description": "Generated output tokens per request.",
                    "examples": [2000],
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "requestsPerDay": {
                    "description": "Requests used to scale the daily estimate, independent of requestsPerMonth.",
                    "examples": [100],
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "requestsPerMonth": {
                    "description": "Requests used to scale the monthly estimate; not inferred from the daily count.",
                    "examples": [3000],
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["cachedInputTokens", "inputTokens", "modelIds", "outputTokens", "requestsPerDay", "requestsPerMonth"],
                "type": "object"
              },
              "method": {
                "description": "Calculation or ranking method applied to the inputs.",
                "type": "string"
              },
              "provenance": {
                "additionalProperties": {
                  "description": "Unit or source detail for the named field.",
                  "type": "string"
                },
                "description": "Dated data sources or runtime time-zone information used for this result.",
                "type": "object"
              },
              "tool": {
                "const": "ai-api-cost-calculator",
                "description": "Calculator identifier for this result."
              },
              "units": {
                "additionalProperties": {
                  "description": "Unit or source detail for the named field.",
                  "type": "string"
                },
                "description": "Units for the numeric and time fields in this result.",
                "type": "object"
              }
            },
            "required": ["assumptions", "estimates", "input", "method", "provenance", "tool", "units"],
            "type": "object"
          },
