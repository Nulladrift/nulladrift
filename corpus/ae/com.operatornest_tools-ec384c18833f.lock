        {
          "name": "ai_subscription_stack_cost",
          "title": "AI subscription stack cost",
          "description": "Total selected AI chat and coding subscriptions in USD and identify overlapping capabilities. Use to review a subscription stack; use ai_api_cost for API token charges. Select unique planIds from the schema enum; [] returns zero totals and no plans. Returns monthly and annual totals, selected plans, capability groups and dated official sources. Annual totals use published annual billing or twelve monthly charges; taxes, regional differences and promotions are excluded. Bundled rates are dated estimates, without live billing lookup or subscription changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "planIds": {
                "description": "Unique subscription IDs from the enum. An empty list returns zero totals and no selected plans.",
                "examples": [
                  ["chatgpt-plus", "claude-pro"],
                  []
                ],
                "items": {
                  "description": "ID of a plan in the bundled subscription catalog.",
                  "enum": ["chatgpt-go", "chatgpt-plus", "chatgpt-pro", "claude-pro", "claude-max-5x", "claude-max-20x", "google-ai-pro", "google-ai-ultra-5x", "google-ai-ultra-20x", "supergrok", "supergrok-plus", "perplexity-pro", "perplexity-max", "microsoft-365-premium", "mistral-pro", "manus-pro", "genspark-plus", "cursor-pro"],
                  "type": "string"
                },
                "maxItems": 18,
                "minItems": 0,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["planIds"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Subscription totals, capability overlap and dated plan sources with normalized selection.",
            "properties": {
              "annualTotal": {
                "description": "Sum of published annual charges or twelve monthly charges per plan; excludes taxes, regional changes and promotions.",
                "type": "number"
              },
              "assumptions": {
                "description": "Limits and assumptions to retain when presenting the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "input": {
                "additionalProperties": false,
                "description": "Normalized inputs used for this calculation.",
                "properties": {
                  "planIds": {
                    "description": "Unique subscription IDs from the enum. An empty list returns zero totals and no selected plans.",
                    "examples": [
                      ["chatgpt-plus", "claude-pro"],
                      []
                    ],
                    "items": {
                      "description": "ID of a plan in the bundled subscription catalog.",
                      "enum": ["chatgpt-go", "chatgpt-plus", "chatgpt-pro", "claude-pro", "claude-max-5x", "claude-max-20x", "google-ai-pro", "google-ai-ultra-5x", "google-ai-ultra-20x", "supergrok", "supergrok-plus", "perplexity-pro", "perplexity-max", "microsoft-365-premium", "mistral-pro", "manus-pro", "genspark-plus", "cursor-pro"],
                      "type": "string"
                    },
                    "maxItems": 18,
                    "minItems": 0,
                    "type": "array",
                    "uniqueItems": true
                  }
                },
                "required": ["planIds"],
                "type": "object"
              },
              "method": {
                "description": "Calculation or ranking method applied to the inputs.",
                "type": "string"
              },
              "monthlyTotal": {
                "description": "Sum of selected monthly USD charges; zero for an empty stack.",
                "type": "number"
              },
              "overlap": {
                "description": "Capability groups and selected plan IDs; more than one plan ID indicates overlap.",
