{
  "lockfileVersion": 2,
  "subjects": {
    "com.andreporsch/scorecards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.andreporsch.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "andre-porsch-scorecards",
        "version": "0.3.1",
        "icons": [
          {
            "src": "https://mcp.andreporsch.com/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public self-check preparation in German and English. Ask for the person’s actual answers; do not infer answers. Create an answer brief, not an official ScoreApp score. Do not claim that a lead, appointment, submission, or email was created. Do not request personal details or confidential free text.",
      "tools": [
        {
          "name": "create_assessment_brief",
          "title": "Create an answer brief",
          "description": "Validate all 12 answers and create a structured brief plus Markdown document. Group the nine practice answers and identify the person’s own partial, negative, and uncertain responses. No scoring, ranking, submission, email, or account access. Provide only answers the person actually chose; show the resulting brief to them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "description": "Supply one selected answer for each of the 12 distinct questions from the same assessment and revision.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "optionId": {
                      "description": "Copy the id of the option the person chose from this question’s options array.",
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "questionId": {
                      "description": "Copy the id of this question from the selected assessment’s questions array.",
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    }
                  },
                  "required": ["optionId", "questionId"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 12,
                "type": "array"
              },
              "assessmentId": {
                "description": "Assessment ID from list_assessments: ki-im-arbeitsalltag for German or ai-at-work for English.",
                "enum": ["ki-im-arbeitsalltag", "ai-at-work"],
                "type": "string"
              },
              "revision": {
                "description": "Copy the revision returned by get_assessment_questions for the questions the person answered.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["answers", "assessmentId", "revision"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfee49cb527de23a1f6de197b3db04c866b6a15ee20e038d289ffc5dd15d3dee"
        },
        {
          "name": "get_assessment_questions",
          "title": "Get the self-check questions",
          "description": "Get the exact 12 questions and allowed answer choices in one language. Ask the person to choose. This is a dated snapshot, not a live ScoreApp session.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assessmentId": {
                "description": "Assessment ID from list_assessments: ki-im-arbeitsalltag for German or ai-at-work for English.",
                "enum": ["ki-im-arbeitsalltag", "ai-at-work"],
                "type": "string"
              }
            },
            "required": ["assessmentId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c728946ce203c10d905f20e0570ddb607cf9ca7ea1de1fa62c84044ffe40c7ca"
        },
        {
          "name": "list_assessments",
          "title": "List public self-checks",
          "description": "List André Porsch’s two public AI-at-work self-checks and their question snapshot date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Filter by language: de for German or en for English. Omit to list both.",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9c9853b08316e6a0a12013e9e1f51e99d7938137085aa4f14f00a46e1315b9f"
        }
      ],
      "digest": "sha256:d442bc613d45111e92e722ac324316e5d7be61de9f5fdd0ee983913507fafd05"
    }
  }
}
