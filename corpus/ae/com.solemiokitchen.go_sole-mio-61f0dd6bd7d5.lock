        {
          "name": "get_reservation_link",
          "description": "Build a Toast Tables booking deep link for a date, time and party size (online booking works for 1-10 guests; 11 or more must call). Checks the day is not Monday (closed) and flags times outside opening hours. The guest completes the booking at the link.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Visit date YYYY-MM-DD (America/New_York).",
                "title": "Date",
                "type": "string"
              },
              "party_size": {
                "description": "Number of guests (online booking 1-10; 11+ must call).",
                "maximum": 500,
                "minimum": 1,
                "title": "Party Size",
                "type": "integer"
              },
              "time": {
                "description": "Arrival time 24h HH:MM, e.g. '18:30'.",
                "title": "Time",
                "type": "string"
              }
            },
            "required": ["date", "party_size", "time"],
