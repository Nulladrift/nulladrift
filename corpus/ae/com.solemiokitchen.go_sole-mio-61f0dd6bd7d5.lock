          "name": "get_menu",
          "description": "Menu with USD prices. No arguments: overview of menus and their sections. With section: the items (name, description, price or size prices). With dietary: only items carrying that marker. Prices are before tax.",
          "inputSchema": {
            "properties": {
              "dietary": {
                "anyOf": [
