      "instructions": "Read-only facts about Sole Mio Kitchen & Bar (Italian restaurant, Boynton Beach, FL): hours, menu with prices, specials, reservation and order links, catering and events, loyalty. Every answer includes its source and data_updated_at. Pizza is NY-style from a deck oven, never wood-fired. Use submit_inquiry only when a person actually asks for catering, a private event or a group booking; never invent contact details.",
