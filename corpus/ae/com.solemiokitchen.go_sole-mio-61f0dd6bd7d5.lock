                "default": null,
                "description": "Only items marked vegetarian or gluten_free (kitchen markers; unmarked items are unconfirmed).",
                "title": "Dietary"
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
