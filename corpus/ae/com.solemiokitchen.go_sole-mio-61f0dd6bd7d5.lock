        {
          "name": "submit_inquiry",
          "description": "Send a catering / private event / group-dining inquiry to the restaurant team. ONLY call when the person explicitly asked to be contacted and gave their name and phone or email. Rate-limited. The restaurant replies by phone or email within one business day.",
          "inputSchema": {
            "properties": {
              "company_website": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Anti-spam honeypot. Leave EMPTY. Never fill this field.",
                "title": "Company Website"
              },
              "date": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Preferred date or date range (free text, e.g. '2026-12-18').",
                "title": "Date"
              },
              "email": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contact email (provide phone or email).",
                "title": "Email"
              },
              "guests": {
                "anyOf": [
                  {
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Approximate number of guests.",
                "title": "Guests"
              },
              "message": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Details: occasion, menu wishes, allergies, budget (max 1000 chars).",
                "title": "Message"
              },
              "name": {
                "description": "Contact person's name.",
                "maxLength": 80,
                "minLength": 2,
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "maxLength": 30,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contact phone (provide phone or email).",
                "title": "Phone"
              },
              "type": {
                "description": "Kind of request.",
                "enum": ["catering", "private_event", "group"],
                "title": "Type",
                "type": "string"
              }
            },
            "required": ["name", "type"],
            "title": "submit_inquiryArguments",
            "type": "object"
          },
