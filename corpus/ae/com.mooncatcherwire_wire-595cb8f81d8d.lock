          "digest": "sha256:43e09e71efa75fc0b19da6323660724f513bc51bd8ccb5f3b4b96ce028964c4e"
        },
        {
          "name": "mcw-signals-thesis",
          "title": "Bitcoin signals: thesis",
          "description": "Bitcoin only, beta. The bull, base and bear cases for three horizons (scalp, short and long), as the Signals page's Thesis tab shows them. For each horizon: `most_probable_arm`, TSP's own most probable case (bull, base, bear or none; null when not known), with `probabilities_tie` true when two or more cases share the highest probability, and TSP's pick among them then its own tie-break (null when a probability is missing); `dominant_case`, TSP's own label: the highest-probability case with price levels (bull, base, bear or none; null when not known; the levels themselves are not published), so it can name a different case from the most probable one; the aggregate confidence; and each case's action, its probability, whether it has a signal for its direction (`has_signal`) and whether TSP marks it degenerate. Each horizon's inputs are judged at the moment of the answer, each series against its own cadence (judged_on[].cadence_check, and stale per input family; ETF flows by two days since their row was written, max pain by six hours since its chain was captured). `horizon_timeframes` names the timeframe analyses each horizon is built from, and `timeframes` holds their rows, each with its own analyzed_at and `cadence_check` (its `ok` false past half an hour, three of TSP's ten-minute re-runs). Direction and probability only: no entry, target or stop is published, nor any of TSP's reasoning text. Not investment advice.",
