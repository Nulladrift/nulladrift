      "instructions": "Crypto news from www.mooncatcherwire.com — every wire story of the last cycle, deduplicated and scored by market impact. mcw-get-board is the board as it stands; mcw-list-stories is the same stories filtered by ticker, topic, age or breaking only.\n\nTwo things worth knowing. Topics are OURS, not the upstream feed's: it classifies only by ticker, so a topic such as \"ai\" exists only here, and mcw-list-topics is the list of valid slugs. And stories an editor has junked or held are not served here at all — the count is reported as withheld_by_editors, so a story missing from the board is visible rather than unexplained.\n\nThe mcw-signals-* tools are Bitcoin chart analysis, in beta: direction and confidence only, never an entry, target or stop, and not investment advice. Every answer opens with `freshness`, which gives the age of the numbers in it.",
