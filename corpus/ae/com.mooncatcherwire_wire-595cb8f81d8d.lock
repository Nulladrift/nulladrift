        {
          "name": "mcw-signals-charts",
          "title": "Bitcoin signals: chart",
          "description": "Bitcoin only, beta. One timeframe's analysis, its OHLCV candles and the support, resistance and FBB band levels the analysis lists. The analysis carries its own analyzed_at and `cadence_check` (its `ok` false past half an hour, three of TSP's ten-minute re-runs). `granularity` names the bars: 2H, 6H, 8H and 12H are built from TSP's 1h bars, and 1m, 3m, 5m and 15m have levels only, no bars (the finest bars the Signals run takes from TSP are 30m); `note` says so. A built series is judged on the 1h bars it is built from: its health and its freshness are the 1h series' (source_newest_bar_at and source_interval_ms say which bar and cadence). `bars` defaults to the newest 50 and accepts up to 200. The newest bar can carry a partial flag: when true it was read before it closed, ingested_at says when (null if not known), and its high, low and close are as of then. When TSP also marks it live, it has no ingested_at: its high, low and close are a live sample TSP took at as_of (null if not known; extremes is TSP's word for how its high and low were taken, sampled or null), and volume_ingested_at says when its volume was recorded (null if not known). On a built series, live, as_of and volume_ingested_at are its last 1h bar's: only its close is that sample, its high and low span the 1h bars it holds (extremes null), and its volume is their sum. A bar TSP makes from its sample before that interval's bar is recorded is left out, so a series ends at its newest recorded bar: partial is true there when TSP moved its flag from it onto the bar it made, or left it unlabelled with its volume recorded before it closed. Levels, not a trade plan. Not investment advice.",
          "inputSchema": {
            "properties": {
              "bars": {
                "default": 50,
                "description": "How many of the newest bars to return.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "timeframe": {
                "default": "4H",
                "enum": ["1m", "3m", "5m", "15m", "30m", "1H", "2H", "4H", "6H", "8H", "12H", "1D", "1W"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bitcoin signals: chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb090152ed39546c0767cc561a3022e6fd806b211e36336251047355daef3999"
        },
        {
          "name": "mcw-signals-market-data",
          "title": "Bitcoin signals: market data",
          "description": "Bitcoin only, beta. The BTC derivatives market: funding, open interest, liquidations, long/short, taker volume, ETF flows, options max pain and two fear and greed indexes from two publishers (each 0 to 100, 100 = extreme greed; `fear_greed` and `fear_greed_alternative`, each with its own reading, label and date, never averaged or combined), each with its own observed time and cadence. `stats` is TSP's open, high, low, close and range over its latest hourly bars, from `window_start` to `window_end` (TSP's window, not always 24 hours): `newest_partial` is true when the newest hour was still open when TSP read it, at `as_of` (null when not known), and `newest_bar_open` says whether it is open at the moment of the answer. Open interest comes for one contract (`instrument`, its venue in `exchange`) and for several together: `contracts` lists the perpetual contracts in that one figure, `contracts_unlisted` counts any leg it does not name, and `includes_single_contract` says whether the one contract is among them; a venue not shown here is null. `flow.retail` is the all-accounts long/short ratio (the global account ratio, by number of accounts), set against the top-trader position ratio. A pending ETF day has a null flow, never 0, whatever TSP's own word for it (tsp_status: reported, provisional or null). `stopped_refreshing` is true on ETF flows two days after their row was last written, and on max pain, which has no cadence of its own, six hours after its chain was captured. Clock verdicts (cadence_check, open_bucket.closed, newest_bar_open, stopped_refreshing, max pain's nearest expiry) are judged at the moment of the answer. By default the latest reading of every metric is complete and the back-history beside it is the newest 3 points per series; the answer's `history` block reports how many older points were left out. Set `history` to true for the full stored series. TSP's sentiment readings are in mcw-signals-sentiment, and its verdict on each price feed in mcw-signals-meta. Not investment advice.",
          "inputSchema": {
            "properties": {
              "history": {
                "default": false,
                "description": "True returns every stored point of each series instead of the newest 3. The answer is about twice as large.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bitcoin signals: market data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d63859ca130b1619b0f23a9846b8591e390296ef365ed546cc0faf643f12403"
        },
        {
          "name": "mcw-signals-meta",
          "title": "Bitcoin signals: freshness and sources",
          "description": "Bitcoin only, beta. When the BTC signals snapshot was made, how old its newest value is, whether it is degraded and why, and every source with its own observed time and whether it was carried from an earlier run. Also the beta and not-advice notice. It is the only one of the signals tools that is purely about the age of the data. Also TSP's own verdict on each BTC price feed (`feed_freshness`: `tsp_status` fresh, stale, errored or null, as of `verdict_at`, and `last_updated_at`, when TSP last wrote it) beside the Wire's own verdict for the same series (`wire_check`), with `verdicts_differ` true when the two disagree; neither replaces the other.",
          "inputSchema": {
