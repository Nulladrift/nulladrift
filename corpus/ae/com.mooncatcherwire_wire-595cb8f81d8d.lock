          "digest": "sha256:b4a3e66201a52f678cad7d096153fe0e4efa4fe59f667f165ca0f3c19bdcea6f"
        },
        {
          "name": "mcw-signals-sentiment",
          "title": "Bitcoin signals: sentiment",
          "description": "Bitcoin only, beta. TSP's sentiment readings for BTC, each with its own time and none combined with another. `hourly`: TSP's hourly rollup (TSP says its sentiment is global by design: one TSP-wide series, not scoped to one org), its newest hourly buckets (up to 48), each with its `hour`, `mean_sentiment`, `stddev_sentiment` and `sample_count`; a bucket with fewer than `thin_below` readings is thin; a null mean is no data, never 0; an hour with no readings has no bucket; TSP rewrites an hour after it closes, and `newest_bucket_open` says whether the newest is still open at the moment of the answer. `ema`: TSP's 24-hour EMA of that rollup, each point with its `hour` and the `computed_at` TSP gives it. TSP says the scores run roughly -1 to 1; a score outside -1 to 1 is published as null (the Wire's filter). `news_index`: TSP's own daily news index (0 to 100, 100 = extreme greed), with TSP's label and `article_count`; a day with too few articles has a null value, never a low one. `blend`: TSP's blend, the `weighted_sentiment`, `confidence` and `source_count` of its canonical row over that row's own window (`window_start` to `window_end`); it is not a combination of the indexes. The hourly, EMA and news blocks each carry their own `cadence_check`, and the blend its `age_s` and `stale`, judged at the moment of the answer. By default each series is the newest 3 points; the answer's `history` block reports how many older points were left out. Set `history` to true for the full stored series. Not investment advice.",
          "inputSchema": {
            "properties": {
              "history": {
                "default": false,
                "description": "True returns every stored point of each series instead of the newest 3 (up to 48 hourly buckets, 24 EMA points and 30 days of the news index).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
