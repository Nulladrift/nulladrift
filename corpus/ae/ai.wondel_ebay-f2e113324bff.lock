{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/ebay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/ebay/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eBay",
        "title": "eBay MCP",
        "version": "1.0.0",
        "description": "Search any eBay marketplace and fetch full item details for one listing.",
        "websiteUrl": "https://mcps.wondel.ai/servers/ebay/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from eBay (https://www.ebay.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "ebay_product",
          "title": "Get eBay product details (SerpAPI)",
          "description": "Get full details for a single eBay item via SerpAPI (engine `ebay_product`). Pass `product_id` — the eBay item id taken from an `ebay_search` result's `product_id` field (also the number in an /itm/<id> URL). Returns product_results (title, pricing/buying options, condition, quantity, shipping, specifications, variations, media, returns), seller_results and related_products. Use `ebay_domain` to match the marketplace the item was found on.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ebay_domain": {
                "description": "eBay marketplace domain the item is on, e.g. 'ebay.com' (default), 'ebay.de', 'ebay.co.uk'.",
                "type": "string"
              },
              "lang": {
                "description": "Language code, e.g. 'en-US' (default). Only used for the US eBay domain when locale is set.",
                "type": "string"
              },
              "locale": {
                "description": "Origin location the request should appear to come from.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "product_id": {
                "description": "eBay item id — the `product_id` from an ebay_search result (or the number in an /itm/<id> URL).",
                "type": "string"
              },
              "shipping_country": {
                "description": "Destination country code used to calculate shipping data.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87f65ef463975da0f002e993fce09e92ac2552a5d30d613c41dc295c975137e1"
        },
        {
          "name": "ebay_search",
          "title": "Search eBay (SerpAPI)",
          "description": "Search eBay listings live via SerpAPI (engine `ebay`). Returns organic_results (each with title, link, condition, price, shipping, seller and — crucially — a `product_id`), plus categories, related_searches and pagination. Provide `_nkw` (a free-text query, what you'd type in eBay's search box) and/or a `category_id` to browse a category. Filter by price (`_udlo`/`_udhi`), condition (`LH_ItemCondition`), buying format (`buying_format`), seller (`_sasl`) and more; sort with `_sop` and paginate with `_pgn`. Pass a result's `product_id` to the `ebay_product` tool for full item details. Prices are in the marketplace currency (set via `ebay_domain`, default ebay.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "LH_ItemCondition": {
                "description": "Item condition id(s), pipe-separated for multiple ('1000|3000'): 1000 New, 1500 Open box, 2500 Seller refurbished, 3000 Used, 7000 For parts/not working, 10 Not specified.",
                "type": "string"
              },
              "LH_PrefLoc": {
                "description": "Preferred item location: 'Domestic', 'Regional' or 'Worldwide' (mapped internally to SerpAPI's numeric LH_PrefLoc codes — the words themselves are rejected by the upstream API).",
                "type": "string"
              },
              "_blrs": {
                "description": "Set to 'spell_auto_correct' to exclude results from an auto-corrected spelling of the query.",
                "type": "string"
              },
              "_dmd": {
                "description": "Result layout: 'Grid' or 'List'. Cosmetic; does not change the items returned.",
                "type": "string"
              },
              "_ipg": {
                "description": "Results per page. Allowed values: 25, 50 (default), 100, 200.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "_nkw": {
                "description": "Search query — anything you'd type in eBay's search box. Required unless category_id is set.",
                "type": "string"
              },
              "_pgn": {
                "description": "Page number (1-based). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "_salic": {
                "description": "Filter items by location, as a country code (e.g. '1' for US — see eBay location ids).",
                "type": "string"
              },
              "_sasl": {
                "description": "Seller username(s) to filter by, comma-separated.",
                "type": "string"
              },
              "_saslop": {
                "description": "How to apply _sasl: 1 = only these sellers (default), 2 = exclude these sellers.",
                "maximum": 2,
                "minimum": 1,
                "type": "integer"
              },
              "_sop": {
                "description": "Sort order code: '12' = Best Match (default), '1' = ending soonest, '10' = newly listed, '15' = price+shipping lowest first, '16' = price+shipping highest first.",
                "type": "string"
              },
              "_stpos": {
                "description": "Buyer ZIP/postal code, used for location- and shipping-based filtering.",
                "type": "string"
              },
              "_udhi": {
                "description": "Maximum price (in the marketplace currency).",
                "minimum": 0,
                "type": "number"
              },
              "_udlo": {
                "description": "Minimum price (in the marketplace currency).",
                "minimum": 0,
                "type": "number"
              },
              "buying_format": {
                "description": "Buying format filter: 'Auction', 'BIN' (Buy It Now) or 'BO' (Best Offer).",
                "type": "string"
              },
              "category_id": {
                "description": "eBay category id to concentrate the search in. Can be used with or instead of _nkw.",
                "type": "string"
              },
              "ebay_domain": {
                "description": "eBay marketplace domain, e.g. 'ebay.com' (default), 'ebay.de', 'ebay.co.uk', 'ebay.com.au'.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "show_only": {
                "description": "Extra filters, comma-separated: Sold, Complete (sold & completed listings), FS (free shipping), FR (free returns), RPA (returns accepted), Lots, Charity, Savings, SaleItems, AS, AV, LPickup.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d20e39fdaa7ba50c6253116637d16033fe6148b9940707a8287d9dae9cd63e19"
        }
      ],
      "digest": "sha256:421a206befb8129e7c6112332e5dc7a0a71b53c09d254349ba8177c4c7b39cbe"
    }
  }
}
