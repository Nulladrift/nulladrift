        {
          "name": "post_vastu_ayadi",
          "title": "Calculate Ayadi shadvarga - Vastu proportion and yoni calculator API",
          "description": "Ayadi shadvarga calculator for a building or a room: send the dimensions and the API returns all six proportional formulas with the multiplier, the divisor and the remainder shown, the member each remainder names, and the two verdict rules the texts state. Choose between three text families, which genuinely disagree, and choose your own cubit length, because every remainder is unit sensitive. Built for practitioner tools, plan checking software and anyone who has to justify a dimension rather than assert it.",
          "inputSchema": {
            "examples": [
              {
                "breadth": 11,
                "length": 11
              }
            ],
            "properties": {
              "ayadiText": {
                "default": "manasara",
                "description": "Which family of Ayadi formulas to apply. manasara takes length, breadth and circumference separately and is double sourced. perimeter-texts runs every formula on the perimeter alone and is the family the usual worked example is printed for. utpala supplies a yoni formula from the length times the breadth and nothing else, so the other five vargas fall back to the perimeter family and the response says so. Defaults to manasara.",
                "enum": ["manasara", "perimeter-texts", "utpala"],
                "example": "manasara",
                "type": "string"
              },
              "breadth": {
                "description": "Breadth of the building or room, in the unit given. Under the Manasara family this is the measure the vyaya and yoni formulas multiply.",
                "example": 11,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "circumference": {
                "description": "Circumference or height, if the Manasara vara and tithi formulas should read something other than the perimeter. Defaults to the perimeter, which is what a rectangular plan supplies.",
                "example": 11,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "hastaInches": {
                "default": 18,
                "description": "Length of one hasta, the classical cubit, in inches. Defaults to 18, which is 24 angula at three quarters of an inch each and is the value three independent sources agree on. Raise it if your lineage measures the cubit differently; the value used is echoed on the response so a stored reading can be reproduced years later. Only used when unit is feet or metres.",
                "example": 18,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "length": {
                "description": "Length of the building or room, in the unit given. Under the Manasara family this is the measure the aya and rksha formulas multiply; under the perimeter family it only feeds the perimeter.",
                "example": 11,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "perimeter": {
                "description": "Perimeter of the plan, if it is not simply twice the length plus twice the breadth. The perimeter family runs every formula on this one measure, so it is the number that decides all six remainders there.",
                "example": 11,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "hasta",
                "description": "Unit the Ayadi dimensions are given in. Every remainder is unit sensitive, so this is an input and never assumed: the same building measured in cubits and in feet gives different remainders. hasta is the classical cubit and needs no conversion; feet and metres are converted using hastaInches and rounded to whole cubits, and the rounded figures are returned. Defaults to hasta.",
                "enum": ["hasta", "feet", "metres"],
                "example": "hasta",
                "type": "string"
              },
              "vyayaFormula": {
                "default": "p9-10",
                "description": "Which vyaya formula the perimeter family uses. The printed table gives two joined by the word or and states no rule for choosing. p9-10 multiplies by nine and divides by ten, which is the only divisor consistent with the ten member vyaya group, so its remainder can be placed in that group and it is the default. p3-14 multiplies by three and divides by fourteen, and its remainder maps to no group any source enumerates. Ignored when ayadiText is manasara, which has one vyaya formula.",
                "enum": ["p9-10", "p3-14"],
                "example": "p9-10",
                "type": "string"
              }
            },
            "required": ["breadth", "length"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "conventions": {
                "properties": {
                  "ayadiText": {
