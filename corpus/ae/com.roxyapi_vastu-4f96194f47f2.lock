                    },
                    "year": {
                      "type": "number"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["facing", "rooms", "score", "scoring", "sources"],
            "type": "object"
          },
