        {
          "name": "post_vastu_timing_griha_pravesh",
          "title": "Find griha pravesh dates - Vastu house warming muhurta API",
          "description": "Griha pravesh muhurta search over a date window: send the window and the place, and the API returns every day that clears the classical day-level rules, with the nakshatra, tithi, weekday and solar position that qualified it and the rule ids that admitted it. Two Muhurta texts disagree on the admissible nakshatras and you choose which one leads, and the rules a date search cannot settle are published rather than dropped. Built for house warming date pickers, practitioner scheduling and agent assistants that have to answer when a family should move in.",
          "inputSchema": {
            "examples": [
              {
                "endDate": "2027-03-20",
                "latitude": 28.6139,
                "longitude": 77.209,
                "startDate": "2027-01-20",
                "timezone": "America/New_York"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "endDate": {
                "description": "Last day of the search window, in YYYY-MM-DD, inclusive. The window is capped at 93 days, which is a full season and the same cap the Vedic auspicious day search carries.",
                "example": "2027-03-20",
                "format": "date",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the house, in decimal degrees, positive north. Sunrise decides where one day ends and the next begins, so a nakshatra running out during the morning changes which day it counts for.",
                "example": 28.6139,
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the house, in decimal degrees, positive east.",
                "example": 77.209,
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "muhurtaText": {
                "default": "muhurta-chintamani",
                "description": "Which Muhurta text supplies the admissible nakshatras for entering a new house. muhurta-chintamani admits eight and kalaprakasika admits twelve; seven overlap and are the high confidence core, one is unique to the first and five to the second. The two texts are independent witnesses, which is what makes the overlap strong and the difference worth exposing. Defaults to muhurta-chintamani.",
                "enum": ["muhurta-chintamani", "kalaprakasika"],
                "example": "muhurta-chintamani",
                "type": "string"
              },
              "startDate": {
                "description": "First day of the search window, in YYYY-MM-DD. Every limb is read at sunrise of the local day, because the Hindu day begins at sunrise rather than at midnight.",
                "example": "2027-01-20",
                "format": "date",
                "type": "string"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maximum": 14,
                    "minimum": -14,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
