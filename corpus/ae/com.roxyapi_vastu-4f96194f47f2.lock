              },
              "road": {
                "description": "Which side a road runs along. The verdict is convention: the chapter states no rule for the side a road is on, only that an obstruction facing the gate brings misery unless it lies beyond twice the height of the house.",
                "enum": ["North", "Northeast", "East", "Southeast", "South", "Southwest", "West", "Northwest"],
                "example": "North",
                "type": "string"
              },
              "slopeLowDirection": {
                "description": "Which quarter of the plot the ground falls toward, that is where the LOW point is. The chapter states its rules in terms of the side that stands HIGHER, so the opposite of this value is what the verses are read against, and both are returned. Omit it if the ground is level.",
                "enum": ["North", "Northeast", "East", "Southeast", "South", "Southwest", "West", "Northwest"],
                "example": "Northeast",
                "type": "string"
              },
              "slopeSchool": {
                "default": "brihat-samhita",
                "description": "Which reading of the ground level to lead with. brihat-samhita applies verses 115 to 117 as written, where a higher north-east is a loss, a higher east or north is permitted when level ground is unavoidable and still carries its stated cost, and a higher south or west carries its cost with no allowance. modern applies the widely taught rule that the north-east must be the lowest point, which agrees with verse 115 and contradicts the verse 116 allowance. Both readings are returned whichever you choose, so the disagreement is visible rather than hidden. Defaults to brihat-samhita.",
                "enum": ["brihat-samhita", "modern"],
                "example": "brihat-samhita",
                "type": "string"
              },
              "water": {
                "description": "Which quarter holds standing water, a well, a tank or a sump. This one IS sourced: 53.119 gives a distinct effect for each of the eight directions and calls only the north and the north-east favourable.",
                "enum": ["North", "Northeast", "East", "Southeast", "South", "Southwest", "West", "Northwest"],
                "example": "Northeast",
                "type": "string"
              }
            },
