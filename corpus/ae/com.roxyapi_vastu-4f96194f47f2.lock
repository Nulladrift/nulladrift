                "type": "string"
              },
              "recommendedPadas": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "side": {
                "type": "string"
              },
              "source": {
                "properties": {
                  "basis": {
                    "type": "string"
                  },
                  "chapter": {
                    "type": "number"
                  },
                  "publicDomain": {
                    "type": "boolean"
                  },
                  "text": {
                    "type": "string"
                  },
                  "translation": {
                    "type": "string"
                  },
                  "verse": {
                    "type": "string"
                  },
                  "year": {
                    "type": "number"
                  }
                },
                "required": ["text"],
                "type": "object"
              },
              "square": {
                "type": "number"
              },
              "startCorner": {
                "type": "string"
              }
            },
            "required": ["auspiciousness", "cell", "conventions", "effect", "ordinalOnSide", "pada", "reading", "recommendedPadas", "side", "source", "square", "startCorner"],
            "type": "object"
          },
