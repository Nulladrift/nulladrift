{
  "lockfileVersion": 2,
  "subjects": {
    "com.professorsausages/sausage-trust": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x402.professorsausages.com/mcp/trust"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sausage-trust",
        "title": "Verify Anything — email, phone, domain, URL, IBAN & OFAC sanctions screening, pay-per-check (Sausage Trust)",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "Professor Sausages' verification counter — one server for 'should I trust this?'. Deterministic signals with evidence, never a silent all-clear. Free tools: find_data, pricing, request_data. Paid tools charge per call in USDC on Base via x402: call one without x_payment to get its exact terms, sign them, and call again with x_payment. No signup, no API keys. Sanctions screening runs against the full live OFAC SDN + Consolidated lists; domain and DNS reads are live RDAP/DoH. These are signals for triage — nothing here is a compliance, credit or legal decision, and a no_match is not a clear.",
      "tools": [
        {
          "name": "address_screen",
          "title": "Screen a crypto address against OFAC",
          "description": "Screen a crypto address against the full live OFAC SDN list, segmented by chain. Returns a verdict with the matching SDN entries as evidence — never a silent all-clear. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "The address to screen, in that chain's native format.",
                "examples": ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],
                "type": "string"
              },
              "chain": {
                "default": "base",
                "description": "Which chain the address belongs to.",
                "enum": ["base", "ethereum", "bitcoin", "tron", "litecoin", "monero", "dash", "zcash", "bitcoin-cash", "dogecoin", "bitcoin-gold", "verge", "solana"],
                "examples": ["base"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2123ae06552db2c00454f95939b9a002e7beeccee2926217e887da1d08568bd3"
        },
        {
          "name": "domain_intel",
          "title": "Domain registration & DNS card",
          "description": "RDAP registration card for a domain (creation/expiry dates, registrar, statuses, nameservers, DNSSEC) plus derived risk flags like domain age. view='dns' returns a live multi-record DNS summary (A/AAAA/CNAME/MX/NS/TXT/SOA/CAA + SPF/DMARC); view='live' re-reads the registry at the moment you ask. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Registrable domain name.",
                "examples": ["cloudflare.com"],
                "type": "string"
              },
              "view": {
                "default": "registration",
                "description": "Which read to perform.",
                "enum": ["registration", "dns", "live"],
                "examples": ["registration"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:136e3eb778f8294f34d406876c5217b2a8e52532be7e6cfa149ac55d4c20e406"
        },
        {
          "name": "email_check",
          "title": "Email deliverability signals",
          "description": "Deliverability signals for one address: RFC5322 syntax, live MX/SPF/DMARC over DNS-over-HTTPS, disposable/role-account flags. Signals with evidence — not a guaranteed inbox verdict. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The address to check.",
                "examples": ["support@cloudflare.com"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d3b6048886b837a3f515ffa16d9a5b605bebe758557e871807244c8365dbd47"
        },
        {
          "name": "find_data",
          "title": "Find the right data source",
          "description": "Describe the data you need in plain language (e.g. 'Apple risk factors 2023', 'is this token a honeypot', 'is this email deliverable', 'read this page'). Searches this server's datasets first, then the whole Professor Sausages catalog, and returns matching endpoints with method, URL, price, and how to call them. Free.",
          "inputSchema": {
            "properties": {
              "task": {
                "description": "What you're trying to find or do, in your own words",
                "examples": ["Apple risk factors 2023"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74bf25410f49fc1649e80b6b0fd003b464a9f17e5b9e238e4ce647fd6547c50c"
        },
        {
          "name": "iban_check",
          "title": "IBAN validate & decode",
          "description": "Validate an IBAN (length + mod-97 check digits). view='decode' resolves it to country, bank and account parts; view='format' returns electronic and paper (grouped) forms. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "iban": {
                "description": "The IBAN, spaces optional.",
                "examples": ["DE89370400440532013000"],
                "type": "string"
              },
              "view": {
                "default": "validate",
                "description": "Which operation to run.",
                "enum": ["validate", "decode", "format"],
                "examples": ["decode"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["iban"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3e399cdc535ffcbd8cf363ba6bddf29a54825fb4fd3f1367d1baa198dde2611"
        },
        {
          "name": "phone_check",
          "title": "Phone number validation",
          "description": "Validate and normalize a phone number: E.164 form, line type, region, and a verdict. Pure CPU, no third-party lookup. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "The number, ideally in E.164.",
                "examples": ["+14155552671"],
                "type": "string"
              },
              "region": {
                "description": "ISO-3166 region hint for national-format numbers.",
                "examples": ["US"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:adbaec45d248ab2461306ee2dfee20fca8925729d6c6eabb6126eca71cccc5d2"
        },
        {
          "name": "pricing",
          "title": "Price list",
          "description": "Every endpoint this server fronts, with its exact per-call USD price (x402, USDC on Base) and a one-line summary, read live from the route table. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb4eb66437fcff965618ea513fca413fddab3347eff8c05d3fe41a3aed30c3c8"
        },
        {
          "name": "request_data",
          "title": "Request missing data",
          "description": "The suggestion box: ask for data we don't have (a pre-2015 filing, an uncovered ticker, an unsupported chain, a whole dataset). Requests feed the nightly ingestion queue — filings are usually available within ~24h. Include contact if you want to hear back. Free.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Optional: URL/email/handle for follow-up",
                "examples": ["https://example.com/contact"],
                "type": "string"
              },
              "description": {
                "description": "What data you need, in your own words",
                "examples": ["Tesla 10-K for fiscal 2014"],
                "type": "string"
              },
              "use_case": {
                "description": "Optional: what you're building",
                "examples": ["a risk-factor diffing agent"],
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1532a22044b752d95dec892179788d26c0dbe5dc99bd459b3d252ac53bdf645d"
        },
        {
          "name": "sanctions_entity",
          "title": "Full OFAC dossier",
          "description": "The complete OFAC record for one entity number: all aliases, addresses, sanctions programs, and extracted identifiers (passports, tax ids, DOBs). Use after sanctions_screen returns a candidate. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "OFAC ent_num from a screen result.",
                "examples": ["27307"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a350ff455831dc4402c5a752d9a2eaf636f825c29aa7e945601f504debec6f25"
        },
        {
          "name": "sanctions_screen",
          "title": "OFAC sanctions name screen",
          "description": "Fuzzy-screen a name against the full OFAC SDN + Consolidated lists. Returns match / possible_match / no_match with scored candidates and the aliases that matched — never a silent all-clear. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max candidates to return.",
                "examples": [5],
                "type": "integer"
              },
              "list": {
                "default": "all",
                "description": "Which OFAC list(s) to screen against.",
                "enum": ["sdn", "cons", "all"],
                "examples": ["all"],
                "type": "string"
              },
              "min_score": {
                "description": "Minimum fuzzy score (0-100) for a candidate to be returned.",
                "examples": [85],
                "type": "integer"
              },
              "name": {
                "description": "Name to screen.",
                "examples": ["Ivan Ivanov"],
                "type": "string"
              },
              "type": {
                "description": "Restrict to one party type.",
                "enum": ["individual", "entity", "vessel", "aircraft"],
                "examples": ["individual"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:949b5a827caf6171596ab1e1ed81544e57130e4704311743979a6f17c7f22209"
        },
        {
          "name": "url_screen",
          "title": "Phishing / malicious URL screen",
          "description": "Screen a URL against the URLhaus blocklist snapshot plus deterministic live heuristics (redirect chain, host reputation signals, lookalike patterns). Returns a verdict with the rules that fired. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "follow": {
                "default": true,
                "description": "Follow the redirect chain before judging.",
                "examples": [true],
                "type": "boolean"
              },
              "url": {
                "description": "Absolute URL to screen.",
                "examples": ["https://example.com/"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:168ceef6f7a3e6688257b1fcfd8bec6d21ca01e1bef5485c67217f0491f96685"
        },
        {
          "name": "vessel_screen",
          "title": "Maritime sanctions screen",
          "description": "Screen vessels against OFAC maritime designations by fuzzy name, exact call sign, or IMO number, with flag filtering. Paid: call without x_payment to receive this call's exact terms (amount, asset, network), sign them, then call again with x_payment. The free `pricing` tool lists every price at once.",
          "inputSchema": {
            "properties": {
              "call_sign": {
                "description": "Exact call sign.",
                "examples": ["T2EU4"],
                "type": "string"
              },
              "flag": {
                "description": "Flag state filter.",
                "examples": ["Iran"],
                "type": "string"
              },
              "imo": {
                "description": "IMO number.",
                "examples": ["9116412"],
                "type": "string"
              },
              "limit": {
                "description": "Max results.",
                "examples": [10],
                "type": "integer"
              },
              "name": {
                "description": "Vessel name (fuzzy).",
                "examples": ["Adrian Darya"],
                "type": "string"
              },
              "x_payment": {
                "description": "Optional signed x402 payment payload (base64, what the X-PAYMENT header carries). Omit to receive the exact payment terms; sign them (e.g. @x402/fetch) and call again with this argument to settle and get the data.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:422f3dace7402f0080a2261bb33afbad54cd1baa9724de8809f4984740b0fd66"
        }
      ],
      "prompts": [
        {
          "name": "counterparty-check",
          "title": "The Professor's Counterparty Check",
          "description": "Screen a business counterparty end-to-end: sanctions, domain age and DNS posture, email deliverability, and any URL they sent you.",
