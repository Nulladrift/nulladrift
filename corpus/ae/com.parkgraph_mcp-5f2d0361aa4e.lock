{
  "lockfileVersion": 2,
  "subjects": {
    "com.parkgraph/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://parkgraph.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "parkgraph",
        "title": "Park Graph",
        "version": "2.3.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Park Graph finds and books parking for drivers. No tool needs an API key; only my_sessions and my_vehicles need driver sign-in, and without it they return SIGN_IN_REQUIRED with the sign-in page. search_lots takes place (a U.S. address, venue, landmark or city) or lat and lng, plus an optional vehicle, and returns bookable lots nearest first (an empty list means Park Graph has no lots there) plus public directory lots (page_url, not bookable). The quote tool takes a lot_id and duration_hours and returns the price and booking.mode: reserve, pay_at_qr_page or not_bookable; at reserve lots it also returns amount_due_cents, the total the driver pays. reserve holds a space when booking.mode is reserve and returns booking_url, the lot's pay page on parkgraph.com; at pay_at_qr_page lots, the quote tool returns pay_url, where the driver pays and parks. get_session and extend_session take the 6-character phone code on the driver's receipt or pass and the last 3 characters of the plate; extend_session returns a pay_url, and it charges nothing, and the end time doesn't change, until the driver pays there. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own. The parkgraph://docs/overview resource summarises the API and coverage. Terms: https://parkgraph.com/legal/developers",
      "tools": [
        {
          "name": "extend_session",
          "title": "Extend a parking session",
          "description": "Adds time to the driver's active hourly parking, once the driver pays for it. No API key needed. Requires phone_code (the 6-character code on the driver's receipt or pass), plate_last3 (the last 3 characters of the plate) and extend_hours (0.5 to 8, in half-hour steps); session_id with session_code works in place of the two codes. Returns the price, the new end time once paid and a pay_url to the driver's session page, where the driver pays. Nothing is charged and the end time doesn't move until the driver pays there. Any mismatch returns the same answer, SESSION_NOT_FOUND. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extend_hours": {
                "default": 1,
                "description": "Hours to add: 0.5 to 8, in half-hour steps",
                "maximum": 24,
                "minimum": 0.5,
                "type": "number"
              },
              "phone_code": {
                "description": "The 6-character phone code printed on the driver's receipt or pass",
                "type": "string"
              },
              "plate_last3": {
                "description": "The last 3 letters or numbers of the license plate parked on the session",
                "type": "string"
              },
              "session_code": {
                "description": "The session's code (sess_…), for verification",
                "type": "string"
              },
              "session_id": {
                "description": "Session id, from the driver's session page link. Sent with session_code in place of the phone code.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Extend a parking session"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a957ff7c91aff8ad38986c7d5a0617e7e2ab28b3e996a0c2033fac0eb63783d4"
        },
        {
          "name": "get_lot",
          "title": "Get lot details",
          "description": "Everything a driver needs about one lot: address, map point, spaces, features, hours, prices and spaces left right now. Takes the lot_id from search_lots. No API key needed. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lot_id": {
                "description": "Lot id from search_lots",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["lot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get lot details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:320991c83d54c8ae70b6af5b1708c8c62c7379496a415685a42de848dc971fb1"
        },
        {
          "name": "get_session",
          "title": "Get a parking session",
          "description": "Looks up the driver's parking: lot, status, start and end times, rate, amount so far and extensions, with a link to the driver's session page. No API key needed. Requires phone_code (the 6-character code on the driver's receipt or pass) and plate_last3 (the last 3 characters of the plate), or session_id with session_code. Any mismatch returns the same answer, SESSION_NOT_FOUND. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone_code": {
                "description": "The 6-character phone code printed on the driver's receipt or pass",
                "type": "string"
              },
              "plate_last3": {
                "description": "The last 3 letters or numbers of the license plate parked on the session",
                "type": "string"
              },
              "session_code": {
                "description": "The session's code (sess_…), sent with session_id",
                "type": "string"
              },
              "session_id": {
                "description": "Session id, from the driver's session page link. Sent with session_code.",
                "format": "uuid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a parking session"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7696cc8268d74ca45d808b24219268480428f764541e0dcb6cab094c064a3502"
        },
        {
          "name": "my_sessions",
          "title": "My parking",
          "description": "The signed-in driver's own parking: recent sessions (newest first), spaces held through this connector, and monthly passes, each with a link to its page on parkgraph.com. Requires driver sign-in to Park Graph through this connector; without sign-in the call returns SIGN_IN_REQUIRED with the sign-in page. Sessions are matched by the driver's verified sign-in email (the email on their receipts). get_session checks one session without sign-in, by phone code. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active_only": {
                "default": false,
                "description": "Only sessions that are parked now and holds that haven't expired",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My parking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2062b5830106bd651400cef909f9a1bc4433598f062302364708c0fdbff00922"
        },
        {
          "name": "my_vehicles",
          "title": "My vehicles",
          "description": "The signed-in driver's saved vehicles (up to 5 plates, each with an optional label) and plates from their past parking that aren't saved yet. action list (the default) only reads; save adds a plate or sets its label, rename changes a label, remove deletes a saved plate. Saving or removing the same plate twice changes nothing. A saved plate works as reserve's plate. Requires driver sign-in to Park Graph through this connector; without sign-in the call returns SIGN_IN_REQUIRED with the sign-in page. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "list",
                "description": "What to do",
                "enum": ["list", "save", "rename", "remove"],
                "type": "string"
              },
              "label": {
                "description": "A name for the vehicle, for save and rename (\"Work truck\")",
                "maxLength": 40,
                "type": "string"
              },
              "plate": {
                "description": "The plate, for save, rename and remove (spaces and dashes are ignored)",
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "My vehicles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f5f2efef05a0766ee1ab6a0e4a131a169810cbce6bc519e414084ff164a9f5a4"
        },
        {
          "name": "quote",
          "title": "Quote a price",
          "description": "What parking at a lot costs for a number of hours, at the lot's current price (daily max applied). No API key needed. booking.mode in the result is the next step: reserve (the reserve tool holds a space) or pay_at_qr_page (booking.pay_url is the lot's pay page, where the driver pays and parks). Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration_hours": {
                "description": "How long the driver will park, in hours",
                "maximum": 24,
                "minimum": 0.25,
                "type": "number"
              },
              "lot_id": {
                "description": "Lot id from search_lots",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["duration_hours", "lot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65f92eec09ff2c3de594b47eddb3ef6aae39519245b2a99588319a378f8fbe8a"
        },
        {
          "name": "reserve",
          "title": "Reserve a space",
          "description": "Holds space at a lot for the driver for a few minutes and returns booking_url, the lot's pay page on parkgraph.com (opened on duration_hours when it is sent). No API key needed. A hold takes a real space until it expires or the driver pays. Lots that take payment at their QR page place no hold: the result is status pay_at_qr_page with a pay_url, the lot's pay page. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_platform": {
                "description": "The calling assistant's platform (recorded on the booking)",
                "enum": ["chatgpt", "claude", "gemini", "grok", "perplexity", "copilot", "custom"],
                "type": "string"
              },
              "duration_hours": {
                "description": "Hours to book. The result's booking_url opens the lot's pay page on this length",
                "enum": [1, 2, 4, 8],
                "type": "integer"
              },
              "end": {
                "description": "Departure time (ISO 8601)",
                "format": "date-time",
                "type": "string"
              },
              "idempotency_key": {
                "description": "A repeated key retries safely. Generated when omitted and returned in the result.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "intent": {
                "description": "What the driver needs, in plain words (optional)",
                "maxLength": 500,
                "minLength": 4,
                "type": "string"
              },
              "lot_id": {
                "description": "Lot id from search_lots",
                "format": "uuid",
                "type": "string"
              },
              "plate": {
                "description": "Plate to pre-fill on the pay page",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "space_count": {
                "default": 1,
                "description": "Number of spaces",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "start": {
                "description": "Arrival time (ISO 8601)",
                "format": "date-time",
                "type": "string"
              },
              "ttl_seconds": {
                "default": 180,
                "description": "How long the hold lasts, in seconds",
                "maximum": 900,
                "minimum": 30,
                "type": "integer"
              },
              "vehicle": {
                "description": "The driver's vehicle",
                "properties": {
                  "length_meters": {
                    "exclusiveMinimum": 0,
                    "maximum": 20,
                    "type": "number"
                  },
                  "needs_charger": {
                    "type": "boolean"
                  },
                  "plate": {
                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  },
                  "type": {
                    "enum": ["standard", "ev", "oversized", "motorcycle", "rv", "av"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["lot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Reserve a space"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c84a722765a31c8a93998b0b08a82130875666631e64080cf15cfda65722d52"
        },
        {
          "name": "search_lots",
          "title": "Search parking lots",
          "description": "Finds parking near where the driver is going: place is a U.S. address, venue, landmark or city (\"Coors Field, Denver\"), or send lat and lng. Nearest first, with spaces left and the current price. vehicle narrows the list to lots that take a car, truck, tractor-trailer or RV, with truck rates where a lot sets them. No API key needed. Results include bookable Park Graph lots (lots; each id is the lot_id that get_lot, the quote tool and reserve take) plus public directory lots (unlisted_lots, with a page_url; not bookable). The top-level summary is a one-line, plain-language answer. An empty lots list means no bookable Park Graph lot near there. Every payment completes on parkgraph.com with the driver present; no tool charges money on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude of the driver's destination, sent with lng",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "latitude": {
                "description": "Same as lat",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of lots returned",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the driver's destination, sent with lat",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "longitude": {
                "description": "Same as lng",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Where the driver is going: a U.S. address, venue, landmark or city (\"Coors Field, Denver\", \"JFK Terminal 4\"). Sent in place of lat and lng.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "radius_km": {
                "default": 5,
                "description": "Search radius around that point, in km",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              },
              "vehicle": {
                "description": "Only lots that take this vehicle. truck covers box trucks, trailers and tractor-trailers; rv means lots with oversized spaces.",
                "enum": ["car", "truck", "tractor_trailer", "rv"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search parking lots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2af94e9f554da82c2838e1b57cb846e9e174b6eeb5cf30ad10ed3d4f16cc0fc1"
        }
      ],
      "resources": [
        {
          "uri": "parkgraph://docs/overview",
          "name": "Park Graph Overview",
          "title": "Park Graph Overview",
          "description": "Platform overview, API capabilities, and integration documentation",
          "mimeType": "text/markdown",
          "digest": "sha256:15f4a7aabc46e1f4c1f4e5499697b6e2a6122d60175861c6c444ab05a8293b67"
        }
      ],
      "prompts": [
        {
          "name": "find_and_book_parking",
          "title": "Find and book parking",
          "description": "Search for parking near a place, compare prices, and hold a space for the driver.",
          "arguments": [
            {
              "name": "location",
              "description": "Where the driver is going: an address, a place name, or lat,lng.",
              "required": true
            },
            {
              "name": "duration_hours",
              "description": "How long they will park, in hours.",
              "required": false
            },
            {
              "name": "arrival",
              "description": "When they arrive, e.g. 'now' or an ISO 8601 time.",
              "required": false
            }
          ],
          "digest": "sha256:0cb3615fa5364278ee3d7a6a3bbc8c684aec715bc6935b406c4639fb7867d720"
        }
      ],
      "digest": "sha256:818de230ef73291f1c3c077a8ec28a836e38e1df0575dc9ce91d2b18c08252bd"
    }
  }
}
