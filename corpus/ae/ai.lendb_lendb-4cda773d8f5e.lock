        {
          "name": "find_loan_officers",
          "title": "Find mortgage loan officers",
          "description": "Use this when someone wants a US mortgage loan officer (or mortgage broker or lender contact) for a specific situation and place: for example an FHA, VA, USDA, jumbo, DSCR or ITIN loan, a first-time buyer, a self-employed borrower who needs a bank statement loan, a non-warrantable condo or a duplex, or a Spanish-speaking loan officer near a city, ZIP, region or state. Searches LenDb, an independent, lender-neutral database of US loan officers (coverage is partial), and returns a ranked list. Each result has the person's name, NMLS ID, lender, office location, distance_mi, license_check for the property state (confirmed, lender_reported or federal_registration), match_status (exact, or partial with unconfirmed_specialties), matched specialties with a short reason each, last_verified and a canonical_url profile link; detail 'full' returns every field and reason. A city or ZIP keeps offices within 25 miles, widened to 50 or 100 when few are found (search.note); a state alone ranks statewide. Words like 'broker' or 'credit union' rank that kind of lender first. People with no license evidence for the state are listed separately in not_yet_verified. Also returns ambiguous_location when a city name fits several places, unassessed_requirements for parts of the situation LenDb cannot check, and citation_guidance. If situation is just a loan officer's name (the name on their lender page or the name a state regulator licenses, e.g. 'Nicholas Bucca' for Nic Bucca), it returns that profile in profile_match. Phone numbers and email addresses are never returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "debug": {
                "description": "Also return how the query was parsed (debug.parsed, debug.filters). Default false.",
                "type": "boolean"
              },
              "detail": {
                "description": "'compact' (default): per person name, NMLS ID, canonical_url, lender, office, license evidence for the property state, matched specialties with one short reason each and the last verified date. 'full': every field, all reasons and the matching method.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "fha_approved": {
                "description": "Only loan officers whose current lender is FHA-approved per HUD's FHA Single Family Portfolio Snapshot data (the lender, not the person). Default false. Without it, an FHA search still ranks HUD-approved lenders' people first when all else is equal.",
                "type": "boolean"
              },
              "language": {
                "description": "Language the borrower wants to be served in. Accepts an ISO 639-1 code ('es'), a BCP 47 tag ('es-MX', 'zh-TW'), an ISO 639-2/3 code ('spa'), an English name ('Spanish') or a native name ('español', '中文', '한국어', 'tiếng Việt'). A hard filter: every result speaks it. An unsupported language returns an error listing the supported codes (see list_specialties).",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Where the property is: 'City, ST', a city, a 5-digit ZIP, a region ('Bay Area'), or a US state.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "situation": {
                "description": "The borrower's situation in plain words: property type, loan program, income type, credit, language, kind of lender. Example: 'duplex, self-employed, bank statement loan'.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["location", "situation"],
            "type": "object"
          },
