                    "type": "number"
                  },
                  "name": {
                    "additionalProperties": {},
                    "properties": {
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["value"],
                    "type": "object"
                  },
                  "nmls_id": {
                    "type": "number"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["canonical_url", "loan_officer_count", "name", "nmls_id", "type"],
                "type": "object"
