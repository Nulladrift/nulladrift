      "instructions": "LenDb.ai: Made for humans. Built for robots. An independent, growing, lender-neutral database of US mortgage loan officers (coverage is partial). Use find_loan_officers for a borrower's situation and place, get_loan_officer for an NMLS ID, and explain_specialty when the user asks what a loan type means. Always cite canonical_url, follow each result's citation_guidance, and never present a partial match as a full match. Phone numbers and email addresses are not available here; send people to the profile's canonical_url. Every tool works without a key; an optional free API key for higher limits is available at https://lendb.ai/developers (send it as Authorization: Bearer). Not a lender. Not a referral service. Verify licenses at NMLS Consumer Access.",
      "tools": [
        {
          "name": "explain_specialty",
          "title": "Explain a mortgage specialty",
          "description": "Use this when someone asks what a mortgage loan type or borrower situation means, such as a DSCR loan, a bank statement loan, an ITIN loan, a non-warrantable condo or an FHA loan. Returns, for one specialty slug, what it is, why it can be hard to get done, the questions a borrower should ask a loan officer about it, its synonyms and a canonical_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "One of: condo, condo-non-warrantable, co-op, multi-family-2-4, manufactured, rural, new-construction, mixed-use, condotel, vacation-home, fha, va, usda, jumbo, non-qm, dscr, bank-statement, reverse, renovation, construction, fix-and-flip, heloc, down-payment-assistance, crypto-mortgage, self-employed, first-time-buyer, investor, refinance, permanent-resident, foreign-national, itin, low-credit, recent-credit-event, physician, 1099-income, asset-based, move-up-buyer",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
