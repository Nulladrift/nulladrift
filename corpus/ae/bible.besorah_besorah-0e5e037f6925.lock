      "instructions": "Read-only access to the whole Bible (Hebrew, Greek, Aramaic, English): read passages, search the text, study a verse word by word, look up Hebrew/Greek words (Strong's, Brown–Driver–Briggs), find every verse a word is in, and follow cross-references, quotations and parallels. Every result carries a url to the page it came from. Texts and data are open: terms and licences at https://besorah.bible/data-licence.txt.",
      "tools": [
        {
          "name": "compare_books",
          "title": "Compare two books' vocabulary",
          "description": "Compare two books' vocabularies: how many words they share, the rare words they share (most of whose uses are in these two books), and the words only one uses. Same language only: two Hebrew books, two Greek ones, or a Septuagint book (editionA: septuagint) against a New Testament book. Use when the user asks how the vocabularies of two books compare.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "e.g. Isaiah",
                "type": "string"
              },
              "b": {
                "description": "e.g. Matthew",
                "type": "string"
              },
              "editionA": {
                "description": "edition of the first book, e.g. septuagint",
                "type": "string"
              },
              "editionB": {
                "description": "edition of the second book, e.g. hebrew-nt",
                "type": "string"
              },
              "format": {
                "description": "optional: json (default) or markdown (compact, readable)",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "limit": {
                "description": "how many to return",
                "type": "number"
              },
              "max_chars": {
                "description": "optional: cap the answer at about this many characters (lists are shortened and marked truncated; use offset/nextOffset to get the rest)",
                "type": "number"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
