                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "exterior_material": {
                    "additionalProperties": false,
                    "description": "The assessor's primary exterior wall as a family: masonry, wood, siding, stucco, concrete, metal, glass, other. \"Brick buildings\" is { any_of: [\"masonry\"] }.",
                    "properties": {
                      "any_of": {
