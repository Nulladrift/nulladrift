        {
          "name": "explainFeasibilityStatus",
          "title": "Explain a Bucky feasibility status",
          "description": "Explain one Bucky coverage or per-fact provenance status and the safe next action. This is a pure static lookup: it does not inspect an address, retrieve property data, or call a database, geocoder, AI model, or third-party API. Accepts exactly one of: live, live_unavailable, published, planned_not_live, geo_division_uncatalogued, unseeded_place, geocode_failed, cited, cited_conditional, conditional_unresolved, no_limit_in_bylaw, not_extracted, site_specific_schedule, unverified_default, derived_from_cited, defaulted, missing. Copy the status verbatim from a feasibility result. An unknown status returns this list instead of failing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "status": {
                "description": "A Bucky coverage resolution status or per-fact provenance status returned by a feasibility result. Copy it verbatim. Do not paraphrase or invent a status.",
                "enum": ["live", "live_unavailable", "published", "planned_not_live", "geo_division_uncatalogued", "unseeded_place", "geocode_failed", "cited", "cited_conditional", "conditional_unresolved", "no_limit_in_bylaw", "not_extracted", "site_specific_schedule", "unverified_default", "derived_from_cited", "defaulted", "missing"],
                "type": "string"
              }
            },
            "required": ["context", "status"],
            "type": "object"
          },
          "annotations": {
