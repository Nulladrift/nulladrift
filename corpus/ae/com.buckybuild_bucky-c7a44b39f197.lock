                    },
                    "top": {
                      "description": "Percentile band (BUC-4011): keep the highest-valued share of places with a current value, as a percent. 25 = the highest 25%. Use instead of min and max.",
                      "exclusiveMaximum": 100,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["key"],
