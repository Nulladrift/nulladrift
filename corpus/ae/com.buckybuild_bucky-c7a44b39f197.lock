        {
          "name": "screenLots",
          "title": "Find lots that match a list",
          "description": "Find the lots in one live Bucky city that match a list. Pass `city` or `geoDivisionId` with `thesis` (plain words), `criteria` (square feet, dollars), or both; or pass a saved `profileId`. Returns countOutcome (exact, partial, at_least, estimate, or unavailable), screeningRunId, and selected lots ranked largest first with a pass, fail, or not_available verdict per filter. totalMatches is a compatibility value and can be returned-page size when the total is unavailable. Report a not_available filter; never present the count as filtered by it. The execution preserves selection for optional candidate assessment; assessment candidate counts are separate from search totals. Returns candidates, counted suggestions and savedMatches. Candidate/suggestion criteria use the same square-foot boundary as the input, including canonical registry values and strategies. Present these alternatives before asking to save. Pass the selected criteria with save=true only after explicit approval, without re-reading the thesis. For a height the user wants to build (\"10 to 14 storeys\"), use criteria.permitted_stories or permitted_height_m: the maximum the lot's zone allows. criteria.stories is the building standing on the lot. Each lot has `lotId` for updateSaved (action save), `address` for checkSite and `parcelExternalId` for saveToProject. Assembly lots carry the same ids. At most 25 lots per call (`limit`, default 10). `page` says which matches these are (offset, returned, total, truncated); when truncated, call screenLots with `page.next` for the next lots. Paging reads only: it saves nothing and uses no list quota. save=true saves the list (write scope, counts against the plan list limit) and returns a CSV link of every match; the CSV needs a saved list, so links.csv is null without one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assembly": {
                "additionalProperties": false,
                "description": "Assembly mode: also return candidate assemblies, 2 to maxLots adjacent lots that each pass criteria and together meet minCombinedAreaSqft and/or minCombinedFrontageFt. Use for \"two or three adjacent lots that combine to 10,000 sf\"; put per-lot limits in criteria and the combined size here, not in minAreaSqft.",
                "properties": {
                  "maxLots": {
                    "description": "Most lots in one assembly, 2 to 5. Default 3.",
                    "maximum": 5,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "minCombinedAreaSqft": {
                    "description": "Combined lot area the assembly must reach, in square feet.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "minCombinedFrontageFt": {
                    "description": "Combined frontage the assembly must reach, in feet: the sum of derived lot widths, an estimate.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "sameZone": {
                    "description": "same (default): every lot in one zone code. family: one zone family. any: zones may differ.",
                    "enum": ["same", "family", "any"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "city": {
                "description": "City as the user said it, e.g. \"Laval\" or \"Bedford, MA\". Omit when you pass geoDivisionId or profileId.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "criteria": {
                "additionalProperties": false,
                "description": "Structured criteria. A field set here replaces the same field read from thesis.",
                "properties": {
                  "assessed_value_per_buildable": {
                    "additionalProperties": false,
                    "description": "Assessed total value (land and buildings) divided by the buildable floor area (lot area x the zone’s cited maximum FSR), in currency per square metre of floor area, inclusive bounds ($150 per sq ft = 1,614.59 per m²). Lots without a cited FSR or a usable assessment never match.",
                    "properties": {
                      "max": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "branches": {
                    "description": "Alternative strategies; nested registry values stay in canonical units.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "criteria": {
                          "description": "The filters of this branch: the same keys and units as the top-level `criteria`, without `branches`.",
                          "type": "object"
                        },
                        "key": {
                          "pattern": "^[a-z][a-z0-9_]{0,39}$",
                          "type": "string"
                        },
                        "label": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["criteria", "key", "label"],
                      "type": "object"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "building_use": {
                    "additionalProperties": false,
                    "description": "What the lot is used for today, read from the assessor's use code: office, mixed_use, retail, hospitality, industrial, multifamily, two_to_four_family, single_family, institutional, civic, religious, parking, vacant_land, other. \"Commercial buildings, not houses or churches\" is { any_of: [\"office\", \"mixed_use\", \"retail\"] } or { none_of: [\"single_family\", \"two_to_four_family\", \"religious\", \"civic\"] }.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "contamination_risk": {
                    "additionalProperties": false,
                    "description": "true: a gas station or auto-service business (repair, body shop, car wash) is mapped on the lot. { is: false } excludes those lots. A risk flag from OpenStreetMap and city business licences, not a site investigation: it misses former and unmapped businesses.",
                    "properties": {
                      "is": {
                        "type": "boolean"
                      }
                    },
                    "required": ["is"],
                    "type": "object"
                  },
                  "dwelling_count": {
                    "additionalProperties": false,
                    "description": "Dwellings on the lot, as the assessment roll states them (Montréal: nombre de logements). \"A single-family house\" is { min: 1, max: 1 }; \"duplex or triplex\" is { min: 2, max: 3 }. Lots whose roll states no count never match.",
                    "properties": {
                      "max": {
