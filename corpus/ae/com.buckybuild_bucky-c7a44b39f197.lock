                  "tract_rental_vacancy": {
                    "additionalProperties": false,
                    "description": "CMHC Rental Market Survey vacancy rate, all bedroom types, purpose-built rental, in the census tract holding the lot centre, percent (1.5 = 1.5%), inclusive bounds. Lots in tracts CMHC does not publish never match.",
                    "properties": {
                      "max": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "typology": {
                    "additionalProperties": false,
                    "description": "Current site use from site_typologies, not what can be built. Exact typology IDs; sector-only lots do not match any_of. none_of keeps lots whose typology is unknown.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "usePermission": {
                    "additionalProperties": false,
                    "description": "A specific use judged by its permission status per zone, from reviewed bylaw mappings. Matches as of right, and with conditions only when every condition passes projectInputs. Existing-only uses never match. A zone with no reviewed mapping is unknown: counted in usePermission.unknownLotCount, never matched, never called prohibited or needing rezoning. A broad-code match alone is a candidate, not permission.",
                    "properties": {
                      "includeUnreviewedExceptions": {
                        "description": "Opt in to zones whose base zone allows the use but a site-specific exception applies that has not been reviewed. Default false: they are grouped and counted, not matched.",
                        "type": "boolean"
                      },
                      "notListedZoneFamilies": {
                        "description": "Opt in to rezoning candidates: zones of these families where the use is not listed. A candidate is an assessed opportunity, never a permission.",
                        "items": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      "statuses": {
                        "description": "Statuses that count as a match. Default as_of_right and with_conditions; with_conditions matches only when every condition passes the project inputs. existing_only never matches.",
                        "items": {
                          "enum": ["as_of_right", "with_conditions", "holding"],
                          "type": "string"
                        },
                        "minItems": 1,
                        "type": "array"
                      },
                      "useCodes": {
                        "description": "Use codes to screen for. A parent code (COMMERCIAL_ENTERTAINMENT) matches its children.",
                        "items": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["useCodes"],
                    "type": "object"
                  },
                  "use_sector": {
                    "additionalProperties": false,
                    "description": "Current site use from site_typologies, not what can be built. Sector IDs; includes sector-only assignments. none_of keeps lots whose sector is unknown.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "year_built": {
                    "additionalProperties": false,
                    "description": "Year the main building was built, inclusive bounds.",
                    "properties": {
                      "max": {
                        "maximum": 2100,
                        "minimum": 1600,
                        "type": "integer"
                      },
                      "min": {
                        "maximum": 2100,
                        "minimum": 1600,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "zoneCodes": {
                    "description": "Zone codes from the city's own vocabulary, e.g. RM-4.",
                    "items": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "zone_family": {
                    "additionalProperties": false,
                    "description": "The zone's dominant use: residential, mixed, commercial, industrial, public, recreation, agricultural, forest. \"Zoned residential or mixed\" is { any_of: [\"residential\", \"mixed\"] }. Québec zones read the zone letter (H, M, C, I, P/U, R, A, F); other zones a family classified from the zone name and purpose. The family names the dominant use; the bylaw still decides which uses are permitted.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "zone_primary_share": {
                    "additionalProperties": false,
                    "description": "Share of the lot in its largest zone, as a ratio: 0.8 = the main zone covers 80% of the lot. \"Mostly in one zone\" is { min: 0.5 }.",
                    "properties": {
                      "max": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "cursor": {
                "description": "Next page of the same list. Copy page.next from the prior result: it carries the cursor with the filters of the list. Do not combine with thesis. Reads only; nothing is saved.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "geoDivisionId": {
                "description": "Division id, from an earlier screenLots or cityInventory result.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "groupBy": {
                "description": "Adds `groups`: every match split by one field, with lot count and summed area per group, the top groupLimit groups plus other / withheld / unknown buckets that add up to the match count. owner: largest owners; only corporations and public bodies are named, other owners are counted as \"private owners (not named)\". owner_type: corporation, government, trust, individual or unclassified. lot_size: area bands. year_built: decades. First page only.",
                "enum": ["owner", "owner_type", "owner_class", "zone_code", "zone_family", "existing_use", "use_sector", "typology", "lot_size", "year_built"],
                "type": "string"
              },
              "groupLimit": {
                "description": "Groups to list before the rest are summed as other. Default 10, at most 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "groupOrder": {
                "description": "lots (default): most matching lots first. area: largest summed lot area first. lot_size and year_built ignore groupOrder and groupLimit: they list every band in its own order.",
                "enum": ["lots", "area"],
                "type": "string"
              },
              "hygiene": {
                "description": "Default true. Ad-hoc lists leave out public owners (owner_class), cap lot size at 5 acres unless criteria set any lot-size minimum or maximum, and ignore assessed values under $100,000 where the city stores them, unless criteria set the same field. Each default is named in notes. false skips them. Ignored with profileId: a saved list runs as saved.",
                "type": "boolean"
              },
              "limit": {
                "description": "Lots to return. Default 10, at most 25 per call; page.next reads the next lots. countOutcome states whether the total is exact, partial, at_least (a lower bound), estimate (about), or unavailable.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "profileId": {
                "description": "Saved list id. Runs the saved city and criteria. Do not combine with city, thesis, or criteria.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "save": {
                "description": "true saves the list to the account. Default false. Search execution history is recorded.",
                "type": "boolean"
              },
              "saveName": {
                "description": "Name for a saved list.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "description": "Order of the returned lots across every match. Default lot_area_desc (largest first). land_value_per_buildable_asc / assessed_value_per_buildable_asc: lowest assessed land (or total) value per buildable sq ft first, for \"cheapest land per buildable foot\". Lots with no cited FSR or usable assessment come last.",
                "enum": ["lot_area_desc", "lot_area_asc", "land_value_per_buildable_asc", "assessed_value_per_buildable_asc"],
                "type": "string"
              },
              "thesis": {
                "description": "The list in plain words, e.g. \"industrial lots over half an acre outside the floodplain\".",
                "maxLength": 1500,
                "minLength": 3,
                "type": "string"
              },
              "totals": {
                "description": "true adds `totals`: the match count and summed lot area (sq ft and acres) of every match, not only the page. Use it for \"how many acres\" instead of adding up pages. groupBy implies it. First page only.",
                "type": "boolean"
              }
            },
            "required": ["context"],
            "type": "object"
          },
