        {
          "name": "getBuckyMcpGuide",
          "title": "Get the Bucky MCP guide",
          "description": "Use this free guide when the user asks where to start, needs help signing in, or has not given enough information to choose a workflow. If the user gave a complete address, use previewSiteCoverage when signed out or checkSite when signed in. If the host requires context, pass a short purpose such as \"choose a Bucky workflow\". Optional role, market, and scale answer the guide questions. Signed in, the guide also returns the standing profile.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "market": {
                "description": "Which country the site is in. Answers \"US or Canada?\".",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "role": {
                "description": "Who is asking. Answers \"Developer, GC, or municipal reviewer?\".",
                "enum": ["developer", "gc", "reviewer"],
                "type": "string"
              },
              "scale": {
                "description": "One site or several. Answers \"Single parcel, or a portfolio?\".",
                "enum": ["single_parcel", "portfolio"],
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
