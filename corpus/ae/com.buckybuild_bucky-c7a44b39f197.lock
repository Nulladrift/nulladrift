        {
          "name": "getBuckyMcpGuide",
          "title": "Get the Bucky MCP guide",
          "description": "Call with no arguments on first contact. Optional `role`, `market`, and `scale` answer the first-call questions on a second call. Returns what this session should do next, and the two ideas Bucky uses: lists, and the properties in them. Signed in, it also returns `profile`: the standing answers Bucky has for this user and the questions still open; save answers with updateMyProfile.",
          "inputSchema": {
