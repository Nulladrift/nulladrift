                      },
                      "min": {
                        "maximum": 100000,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "existing_coverage_pct": {
                    "additionalProperties": false,
                    "description": "Building footprint area on the lot as a percentage of lot area, 0-100. An underbuilt screen is { max: 20 }. Footprints can be years old: check the city honesty note.",
                    "properties": {
                      "max": {
                        "minimum": 0,
