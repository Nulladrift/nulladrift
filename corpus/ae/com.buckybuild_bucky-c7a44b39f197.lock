        {
          "name": "checkSite",
          "title": "Check a site: lot, zone and building envelope for an address",
          "description": "Look up lot, zone, and building envelope for one street address in Canada or the US. Pass `address`. One address per call; cannot search or compare. Read exception before searching: its parcel zone label identifies the site-specific exception, chain contains the cited text and required references. Use that text first. text_missing means incomplete evidence, never no exception. Prevailing by-laws can be address-specific; do not apply every listed address provision to this lot. A live answer uses one site check from the monthly plan allowance; `usage` says if it was charged and how many are left. getBuckyMcpGuide reports the allowance for free. CMHC rental survey figures describe purpose-built rentals; the new-build proxy is the 2000 or later band. Missing facts are not surveyed or unavailable, never zero. Cite RMS figures as Source: CMHC, Rental Market Survey, October YYYY using referencePeriod. Cite starts and completions with their own source and period. Every envelope value carries a `status`. Never report `not_extracted` or `site_specific_schedule` as no limit or as zero — call `explainFeasibilityStatus` first. Envelope numbers are extracted ceilings. Call `getBylawSection` with a citation `knowledgeSectionId`, or with `coverage.geoDivisionId`, `zone.code`, and the section number, before treating a number as available on this lot. Do not fetch `zone.bylawSourceUrl`. `lot.minLotFrontageM` is the zone minimum. `lot.lotConformity` compares lot width, lot area, and floor area per unit to those minima. A missing input is `unknown`, never a pass. State every fail before quoting a unit count.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Street address to analyse, e.g. \"4170 Sophia St, Vancouver BC\".",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "source": {
                "default": "full",
                "description": "Which question the caller is answering. Used for attribution and to pick the link back; the payload is the same either way.",
                "enum": ["zoning_lookup", "lot_dimensions", "setback_lookup", "height_limit_lookup", "lot_split_lookup", "full"],
                "type": "string"
              }
            },
            "required": ["address", "context"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a site: lot, zone and building envelope for an address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://bucky/app.html?v=3d67c43d424f"
            }
          },
          "digest": "sha256:d98c967d9fe871a6a9571600523c4961be9298d64ac996dbae0df35f4de68c48"
        },
        {
          "name": "cityInventory",
          "title": "See what Bucky has mapped for a city",
          "description": "Public city catalogue inventory. Pass exactly one of: cityName, lat and lng together, or geoDivisionId. A city name with multiple matches returns choices; after the user chooses, call again with that candidate geoDivisionId. Never pass a slug. Shows datasets grouped by topic as on file, not loaded yet, unavailable, or not confirmed. This is city coverage, not lot feasibility or operator health. CMHC rental survey figures describe purpose-built rentals; the new-build proxy is the 2000 or later band. Missing facts are not surveyed or unavailable, never zero. Cite RMS figures as Source: CMHC, Rental Market Survey, October YYYY using referencePeriod. Cite starts and completions with their own source and period. If Bucky has not mapped the place, the result points to recording demand. It does not record demand by itself.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cityName": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "geoDivisionId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
