                    },
                    "type": "object"
                  },
                  "frequent_transit_distance": {
                    "additionalProperties": false,
                    "description": "Metres from the lot line to the nearest frequent bus stop or rapid-transit station.",
                    "properties": {
                      "max": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "hydrant_distance": {
