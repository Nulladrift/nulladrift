              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "draft": {
                "additionalProperties": false,
                "description": "Optional. Feedback you drafted from this chat when the user asked you to: what they tried, what went wrong, what they expected. Plain words. No prompts, raw tool output, addresses, names, personal data or secrets. It fills the form for the user to edit.",
                "properties": {
