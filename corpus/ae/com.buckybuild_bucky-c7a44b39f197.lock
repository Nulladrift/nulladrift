        {
          "name": "findPlacesByMarket",
          "title": "Find places by their rental market",
          "description": "Find which places to look at by their rental market: filter and rank every structured-live place on market facts and signals. Signed-in only; read scope. Pass `country` (CA or US; places rank only within one country) and a `preset` (CA: tight-rental, fast-rent-growth, undersupplied, mli-select-headroom; US: low-rental-vacancy, car-light), `filters` ({ key, min, max }, inclusive), or both; optional `region` (province or state, as a code or name), `sort`, `limit` (default 20, max 50) and `offset`. An unknown key returns the filterable keys. Returns counts { places, matched, inPlan, excluded, unknown }, matched places with their values and `access`, and the unknown places with their missing keys. Report the unknown count: a place missing a filtered value is not a match and not a fail. Places are compared on one survey period. `truncation` says what was left out: `places` pages with `truncation.places.nextOffset` as the next `offset`; `unknown` lists at most 50 places by name, `counts.unknown` is the total. To run a saved filter set, pass `setId` (from listPlaceMarketSets) with `limit` and `offset` only. The result adds `set` and `unavailableFilters`: stored filters whose key Bucky no longer filters on. Those are left out and the rest run; tell the user which filters were skipped. Cite every figure with the `sources` lines (CMHC licence for CA, ACS for US). Market data filters places, not lots: use screenLots for lots inside a place. Every structured-live place is searched, not only the user's. Each matched place has `access`: `in_plan` (the user can screen its lots), `available` (Bucky sells it; the user can upgrade to add it) or `not_sold` (Bucky does not sell it yet; the user can request it). `counts.inPlan` is how many matches are in the user's plan. Say how many matches are in the plan, and offer Upgrade or Request for the others; never offer to screen lots in a place that is not `in_plan`. To find lots in the matched places, this is two steps: this call ranks places by market, then call screenLots once per matched place with `access: in_plan`, passing its `geoDivisionId`, at most 10 places in rank order. Never screen unknown places or places that are not `in_plan`; say how many were left out and why. Tell the user it was two steps, and credit the market `sources` for the first.\n\nTurning a question into filters: pick the country from the place named (Ontario, Texas). Put a province or state in `region`. Map each condition to the closest key below. \"Tight\" or \"low vacancy\" is a max on a vacancy key; \"growing\" or \"rising\" is a min on a change key; \"above\" is min, \"below\" is max. Percent bounds are numbers: 5 means 5%. Money bounds are in the country's own dollars.\n\nA relative question (\"top quarter for rent growth\", \"lowest 10% vacancy in the province\") is a percentile filter: `top` keeps the highest-valued share of places, `bottom` the lowest, as a percent (25 = 25%), instead of min and max. It ranks within the request's places, so give a region for \"in the province\". Each result filter states the cut value it resolved to in `text`.\n\nNever invent a key. If no key below measures what was asked (for example a comparison to a provincial median), say so, name the nearest key, and use a numeric bound you state. Tell the user every filter you used, in plain words with units, before or with the result: each result filter has a `text` field for this.\n\nOn an UNKNOWN_KEY or CROSS_SCOPE error, read `errorDetails` and call again in the same turn with a key or region from it.\n\nCA keys:\npopulation_density_per_sq_km: Density (people per km²).\nmedian_age: Median age (years).\nmedian_household_income: Median household income (CAD dollars). Nominal dollars of the income year, not adjusted for inflation.\nowner_occupied_pct: Owner-occupied (%).\nrenter_occupied_pct: Renter-occupied (%).\nmedian_home_value: Median home value (CAD dollars). Nominal dollars of the data year (for the ACS, the 5-year release’s end year), not adjusted for inflation.\nmedian_gross_rent: Median gross rent (CAD dollars).\ncmhc_rental_vacancy_rate: Purpose-built rental vacancy (%).\ncmhc_rental_availability_rate: Purpose-built rental availability (%).\ncmhc_avg_rent_studio: Avg rent, studio (purpose-built) (CAD dollars).\ncmhc_avg_rent_1br: Avg rent, 1BR (purpose-built) (CAD dollars).\ncmhc_avg_rent_2br: Avg rent, 2BR (purpose-built) (CAD dollars).\ncmhc_avg_rent_3br_plus: Avg rent, 3BR+ (purpose-built) (CAD dollars).\ncmhc_avg_rent_total: Avg rent, all units (purpose-built) (CAD dollars).\ncmhc_median_rent_total: Median rent, all units (purpose-built) (CAD dollars).\ncmhc_avg_rent_built_2000_plus: Avg rent, built 2000 or later (purpose-built) (CAD dollars).\ncmhc_avg_rent_change_pct: Avg rent change, same units (purpose-built) (%).\nsignal_rent_cagr_5y_pct: Rent change, annualized over 5 years (%). Annualized change between two published rent levels, in nominal dollars.\nsignal_rental_vacancy_trend_3y_pp: Purpose-built rental vacancy change over 3 years (percentage points).\nsignal_new_build_rent_premium_pct: Newer-building rent difference (built 2000 or later vs all units) (%). Compares average rent in buildings constructed in 2000 or later with average rent across all surveyed units.\nsignal_rental_pipeline_pct: Rental units under construction as a share of purpose-built rental units (%).\nsignal_rental_starts_momentum_pct: Rental starts, last 12 months vs the 12 months before (%).\nsignal_mli_affordability_gap_pct: MLI Select rent difference as a share of average rent (%). Average rent minus the MLI Select reference rent ceiling, divided by average rent.\nsignal_population_cagr_census_5y_pct: Population change per year, Census 2016 to 2021 (%). Annualized change in the Census of Population count between 2016 and 2021.\nsignal_household_income_cagr_census_5y_pct: Median household income change per year, Census 2016 to 2021 (2015 to 2020 incomes, nominal) (%). Annualized change in median total household income, not adjusted for inflation.\n\nUS keys:\npopulation_density_per_sq_km: Density (people per km²).\nmedian_age: Median age (years).\nacs_households_no_vehicle_pct: Households with no vehicle (%). Share of occupied households by vehicles available, ACS 5-year estimate.\nacs_households_one_vehicle_pct: Households with one vehicle (%).\nacs_households_two_plus_vehicles_pct: Households with two or more vehicles (%).\nacs_vehicles_per_household: Vehicles per household (vehicles per household). Aggregate vehicles available divided by occupied households, ACS 5-year estimate.\nacs_commute_drove_alone_pct: Commute: drove alone (%). Share of workers age 16 and over by means of transportation to work, including those who worked from home; ACS 5-year estimate.\nacs_commute_carpool_pct: Commute: carpool (%).\nacs_commute_transit_pct: Commute: public transit (%).\nacs_commute_walk_pct: Commute: walked (%).\nacs_commute_work_from_home_pct: Worked from home (%).\nmedian_household_income: Median household income (USD dollars). Nominal dollars of the income year, not adjusted for inflation.\nhud_ami_median_family_income: HUD area median family income (USD dollars).\nowner_occupied_pct: Owner-occupied (%).\nrenter_occupied_pct: Renter-occupied (%).\nvacancy_rate: Vacancy rate (%).\nmedian_home_value: Median home value (USD dollars). Nominal dollars of the data year (for the ACS, the 5-year release’s end year), not adjusted for inflation.\nmedian_gross_rent: Median gross rent (USD dollars).\nacs_rental_vacancy_rate: ACS rental vacancy rate (all rental units) (%). ACS 5-year rental vacancy rate, including all rental units, not only purpose-built rentals.\nacs_median_gross_rent_built_2020_plus: ACS median gross rent, built 2020 or later (all rental units) (USD dollars). ACS 5-year median gross rent for renter-occupied units paying cash rent in structures built 2020 or later; nominal dollars for the release.\nhud_fmr_efficiency: HUD FMR — efficiency (USD dollars).\nhud_fmr_one_bedroom: HUD FMR — 1BR (USD dollars).\nhud_fmr_two_bedroom: HUD FMR — 2BR (USD dollars).\nhud_fmr_three_bedroom: HUD FMR — 3BR (USD dollars).\nhud_fmr_four_bedroom: HUD FMR — 4BR (USD dollars).\nsignal_rent_cagr_5y_pct: Rent change, annualized over 5 years (%). Annualized change between two published rent levels, in nominal dollars.\nsignal_rental_vacancy_trend_5y_pp: Rental vacancy change over 5 years (all rental units) (percentage points). ACS rental vacancy rate in the 2020–2024 release minus the 2015–2019 release, in points.\nsignal_rent_premium_built_2020_plus_pct: Newer-building rent difference (built 2020 or later vs all units) (%). ACS median gross rent in structures built 2020 or later, compared with median gross rent across all renter-occupied units, from the same release.\nsignal_multifamily_permits_pct: Units permitted in 5+ unit buildings, 12 months, as a share of renter-occupied units (%). Census Building Permits Survey units authorized in buildings of 5 or more units over the latest 12 months, divided by ACS renter-occupied units.\nsignal_multifamily_permits_momentum_pct: Units permitted in 5+ unit buildings, last 12 months vs the 12 months before (%). Permits, not construction.\nsignal_lihtc_rent_gap_pct: LIHTC 2-bedroom rent limit difference as a share of median gross rent (%). ACS median gross rent minus the LIHTC 60% AMI rent limit for a 2-bedroom unit (30% of the HUD 3-person 60% income limit, per month), divided by median gross rent.\nsignal_population_cagr_acs_5y_pct: Population change per year, ACS 2015–2019 to 2020–2024 (%). Annualized change in total population between the 2015–2019 and 2020–2024 ACS 5-year releases.\nsignal_household_income_cagr_acs_5y_pct: Median household income change per year, ACS 2015–2019 to 2020–2024 (nominal) (%). Annualized change in median household income between the 2015–2019 and 2020–2024 ACS 5-year releases, in each release’s own dollars, not adjusted for inflation.\nsignal_home_value_cagr_acs_5y_pct: Median home value change per year, ACS 2015–2019 to 2020–2024 (nominal) (%). Annualized change in the median value owners report for owner-occupied homes, between the 2015–2019 and 2020–2024 ACS 5-year releases, not adjusted for inflation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "country": {
                "description": "ISO country code. Places are filtered and ranked only within this country.",
                "enum": ["CA", "US"],
                "type": "string"
              },
              "filters": {
                "default": [],
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bottom": {
                      "description": "Percentile band (BUC-4011): keep the lowest-valued share of places with a current value, as a percent. 25 = the lowest 25%. Use instead of min and max.",
                      "exclusiveMaximum": 100,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "key": {
                      "description": "A filterable fact key, e.g. cmhc_rental_vacancy_rate",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "max": {
                      "description": "Inclusive upper bound, in the key unit",
                      "type": "number"
                    },
                    "min": {
