        {
          "name": "findPlacesByMarket",
          "title": "Find places by their rental market",
          "description": "Rank Canadian or US places by rental market facts (vacancy, rent, rent growth, permits, population). Read-only; signed-in only. Pass `country` (CA or US; places rank only within one country) and a `preset` (CA: tight-rental, fast-rent-growth, undersupplied, mli-select-headroom; US: low-rental-vacancy, car-light), `filters` ({ key, min, max } inclusive, or `top`/`bottom` percent), or both; optional `region` (province or state), `sort`, `limit` (default 20, max 50) and `offset`. An unknown key returns the filterable keys. Returns counts { places, matched, inPlan, excluded, unknown }, matched places with their values and `access`, and the places missing a filtered value. Report the unknown count: a missing value is not a match and not a fail. `truncation.places.nextOffset` is the next `offset`. Each matched place has `access`: `in_plan` (the user can screen its lots), `available` or `not_sold` (not in the user's plan). Say how many matches are `in_plan`. Only screen lots in `in_plan` places. To run a saved filter set, pass `setId` from listPlaceMarketSets with `limit` and `offset` only. `unavailableFilters` lists stored filters that were skipped; tell the user. Cite every figure with the `sources` lines (CMHC for CA, ACS for US). Tell the user each filter used, in plain words with units: each result filter has a `text` field. To find lots, call screenLots with the `geoDivisionId` of each `in_plan` place.\n\nTurning a question into filters: pick the country from the place named (Ontario, Texas). Put a province or state in `region`. Map each condition to the closest key below. \"Tight\" or \"low vacancy\" is a max on a vacancy key; \"growing\" or \"rising\" is a min on a change key; \"above\" is min, \"below\" is max. Percent bounds are numbers: 5 means 5%. Money bounds are in the country's own dollars.\n\nA relative question (\"top quarter for rent growth\", \"lowest 10% vacancy in the province\") is a percentile filter: `top` keeps the highest-valued share of places, `bottom` the lowest, as a percent (25 = 25%), instead of min and max. It ranks within the request's places, so give a region for \"in the province\". Each result filter states the cut value it resolved to in `text`.\n\nNever invent a key. If no key below measures what was asked (for example a comparison to a provincial median), say so, name the nearest key, and use a numeric bound you state. Tell the user every filter you used, in plain words with units, before or with the result: each result filter has a `text` field for this.\n\nOn an UNKNOWN_KEY or CROSS_SCOPE error, read `errorDetails` and call again in the same turn with a key or region from it.\n\nCA keys:\npopulation_density_per_sq_km: Density (people per km²).\nmedian_age: Median age (years).\nmedian_household_income: Median household income (CAD dollars).\nowner_occupied_pct: Owner-occupied (%).\nrenter_occupied_pct: Renter-occupied (%).\nmedian_home_value: Median home value (CAD dollars).\nmedian_gross_rent: Median gross rent (CAD dollars).\ncmhc_rental_vacancy_rate: Purpose-built rental vacancy (%).\ncmhc_rental_availability_rate: Purpose-built rental availability (%).\ncmhc_avg_rent_studio: Avg rent, studio (purpose-built) (CAD dollars).\ncmhc_avg_rent_1br: Avg rent, 1BR (purpose-built) (CAD dollars).\ncmhc_avg_rent_2br: Avg rent, 2BR (purpose-built) (CAD dollars).\ncmhc_avg_rent_3br_plus: Avg rent, 3BR+ (purpose-built) (CAD dollars).\ncmhc_avg_rent_total: Avg rent, all units (purpose-built) (CAD dollars).\ncmhc_median_rent_total: Median rent, all units (purpose-built) (CAD dollars).\ncmhc_avg_rent_built_2000_plus: Avg rent, built 2000 or later (purpose-built) (CAD dollars).\ncmhc_avg_rent_change_pct: Avg rent change, same units (purpose-built) (%).\nsignal_rent_cagr_5y_pct: Rent change, annualized over 5 years (%).\nsignal_rental_vacancy_trend_3y_pp: Purpose-built rental vacancy change over 3 years (percentage points).\nsignal_new_build_rent_premium_pct: Newer-building rent difference (built 2000 or later vs all units) (%).\nsignal_rental_pipeline_pct: Rental units under construction as a share of purpose-built rental units (%).\nsignal_rental_starts_momentum_pct: Rental starts, last 12 months vs the 12 months before (%).\nsignal_mli_affordability_gap_pct: MLI Select rent difference as a share of average rent (%).\nsignal_population_cagr_census_5y_pct: Population change per year, Census 2016 to 2021 (%).\nsignal_household_income_cagr_census_5y_pct: Median household income change per year, Census 2016 to 2021 (2015 to 2020 incomes, nominal) (%).\n\nUS keys:\npopulation_density_per_sq_km: Density (people per km²).\nmedian_age: Median age (years).\nacs_households_no_vehicle_pct: Households with no vehicle (%).\nacs_households_one_vehicle_pct: Households with one vehicle (%).\nacs_households_two_plus_vehicles_pct: Households with two or more vehicles (%).\nacs_vehicles_per_household: Vehicles per household (vehicles per household).\nacs_commute_drove_alone_pct: Commute: drove alone (%).\nacs_commute_carpool_pct: Commute: carpool (%).\nacs_commute_transit_pct: Commute: public transit (%).\nacs_commute_walk_pct: Commute: walked (%).\nacs_commute_work_from_home_pct: Worked from home (%).\nmedian_household_income: Median household income (USD dollars).\nhud_ami_median_family_income: HUD area median family income (USD dollars).\nowner_occupied_pct: Owner-occupied (%).\nrenter_occupied_pct: Renter-occupied (%).\nvacancy_rate: Vacancy rate (%).\nmedian_home_value: Median home value (USD dollars).\nmedian_gross_rent: Median gross rent (USD dollars).\nacs_rental_vacancy_rate: ACS rental vacancy rate (all rental units) (%).\nacs_median_gross_rent_built_2020_plus: ACS median gross rent, built 2020 or later (all rental units) (USD dollars).\nhud_fmr_efficiency: HUD FMR — efficiency (USD dollars).\nhud_fmr_one_bedroom: HUD FMR — 1BR (USD dollars).\nhud_fmr_two_bedroom: HUD FMR — 2BR (USD dollars).\nhud_fmr_three_bedroom: HUD FMR — 3BR (USD dollars).\nhud_fmr_four_bedroom: HUD FMR — 4BR (USD dollars).\nsignal_rent_cagr_5y_pct: Rent change, annualized over 5 years (%).\nsignal_rental_vacancy_trend_5y_pp: Rental vacancy change over 5 years (all rental units) (percentage points).\nsignal_rent_premium_built_2020_plus_pct: Newer-building rent difference (built 2020 or later vs all units) (%).\nsignal_multifamily_permits_pct: Units permitted in 5+ unit buildings, 12 months, as a share of renter-occupied units (%).\nsignal_multifamily_permits_momentum_pct: Units permitted in 5+ unit buildings, last 12 months vs the 12 months before (%).\nsignal_lihtc_rent_gap_pct: LIHTC 2-bedroom rent limit difference as a share of median gross rent (%).\nsignal_population_cagr_acs_5y_pct: Population change per year, ACS 2015–2019 to 2020–2024 (%).\nsignal_household_income_cagr_acs_5y_pct: Median household income change per year, ACS 2015–2019 to 2020–2024 (nominal) (%).\nsignal_home_value_cagr_acs_5y_pct: Median home value change per year, ACS 2015–2019 to 2020–2024 (nominal) (%).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "country": {
                "description": "ISO country code. Places are filtered and ranked only within this country.",
                "enum": ["CA", "US"],
                "type": "string"
              },
              "filters": {
                "default": [],
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bottom": {
                      "description": "Percentile band (BUC-4011): keep the lowest-valued share of places with a current value, as a percent. 25 = the lowest 25%. Use instead of min and max.",
                      "exclusiveMaximum": 100,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "key": {
                      "description": "A filterable fact key, e.g. cmhc_rental_vacancy_rate",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "max": {
                      "description": "Inclusive upper bound, in the key unit",
                      "type": "number"
                    },
                    "min": {
                      "description": "Inclusive lower bound, in the key unit",
                      "type": "number"
                    },
                    "top": {
                      "description": "Percentile band (BUC-4011): keep the highest-valued share of places with a current value, as a percent. 25 = the highest 25%. Use instead of min and max.",
                      "exclusiveMaximum": 100,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["key"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Matched places to skip. Copy truncation.places.nextOffset for the next page.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "preset": {
                "description": "A preset id for the country; its filters apply first, then `filters` by key",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Province or state, as a code (AB) or a name (Alberta)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "setId": {
                "description": "Run one of your saved filter sets, by id from listPlaceMarketSets. Pass it with limit and offset only.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sort": {
                "additionalProperties": false,
                "description": "Defaults to the preset sort, else the first filter key",
                "properties": {
                  "direction": {
                    "enum": ["asc", "desc"],
                    "type": "string"
                  },
                  "key": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["direction", "key"],
                "type": "object"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find places by their rental market"
