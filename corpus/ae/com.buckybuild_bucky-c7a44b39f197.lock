          "name": "screenLots",
          "title": "Find lots that match a list",
          "description": "Find the lots in one live Bucky city that match a list. Pass `city` or `geoDivisionId` with `thesis` (plain words), `criteria` (square feet, dollars), or both; or pass a saved `profileId`. Returns countOutcome, screeningRunId, page and selected lots ranked largest first. The execution preserves selection for optional candidate assessment; assessment candidate counts are separate from search totals. Candidate/suggestion criteria use the same square-foot boundary as the input, including canonical registry values and strategies. Put every filter, lot size included, inside `criteria` (square feet, dollars), never top level. countOutcome.kind is exact, partial, at_least, estimate or unavailable; totalMatches can be the page size. Report each not_available filter before the count. At most 25 lots per call (limit, default 10); when page.truncated, pass page.next unchanged for more. Paging saves nothing. Show candidates, suggestions and savedMatches before save=true; save only after approval, criteria unchanged. For example {\"city\":\"Toronto\",\"criteria\":{\"minAreaSqft\":10000,\"maxAreaSqft\":50000}}; do not use lot_area. For all lots in a city, pass criteria:{} and hygiene:false. Without profileId, both a location and thesis or criteria are required. partial counted a looser set of filters; at_least is a lower bound; estimate is about. totalMatches is a compatibility value; never present the count as filtered by a not_available filter. page gives offset, returned, total and truncated; paging uses no list quota. For a height the user wants to build (\"10 to 14 storeys\"), use criteria.permitted_stories or permitted_height_m: the maximum the lot's zone allows. criteria.stories is the building standing on the lot. Each lot has `lotId` for updateSaved (action save), `address` for checkSite and `parcelExternalId` for saveToProject. Assembly lots carry the same ids. save=true needs write scope, counts against the plan list limit and returns a CSV link of every match; the CSV needs a saved list, so links.csv is null without one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assembly": {
                "additionalProperties": false,
                "description": "Assembly mode: also return candidate assemblies, 2 to maxLots adjacent lots that each pass criteria and together meet minCombinedAreaSqft and/or minCombinedFrontageFt. Use for \"two or three adjacent lots that combine to 10,000 sf\"; put per-lot limits in criteria and the combined size here, not in minAreaSqft.",
                "properties": {
                  "maxLots": {
                    "description": "Most lots in one assembly, 2 to 5. Default 3.",
                    "maximum": 5,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "minCombinedAreaSqft": {
                    "description": "Combined lot area the assembly must reach, in square feet.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "minCombinedFrontageFt": {
                    "description": "Combined frontage the assembly must reach, in feet: the sum of derived lot widths, an estimate.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "sameZone": {
                    "description": "same (default): every lot in one zone code. family: one zone family. any: zones may differ.",
                    "enum": ["same", "family", "any"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "city": {
                "description": "City as the user said it, e.g. \"Laval\" or \"Bedford, MA\". Omit when you pass geoDivisionId or profileId.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "criteria": {
                "additionalProperties": false,
                "description": "Structured criteria, e.g. {\"minAreaSqft\":10000,\"maxAreaSqft\":50000}. Lot area filters belong here, in square feet, not at the top level. A field set here replaces the same field read from thesis. Pass {} to search without explicit filters. A saved list needs at least one filter; with hygiene on, the defaults count.",
                "properties": {
                  "assessed_value_per_buildable": {
                    "additionalProperties": false,
                    "description": "Assessed total value (land and buildings) divided by the buildable floor area (lot area x the zone’s cited maximum FSR), in currency per square metre of floor area, inclusive bounds ($150 per sq ft = 1,614.59 per m²). Lots without a cited FSR or a usable assessment never match.",
                    "properties": {
                      "max": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "branches": {
                    "description": "Alternative strategies: a lot matches when it meets the top-level criteria and at least one branch. Branch criteria take the same keys and units as the top level, e.g. {\"key\":\"big\",\"label\":\"Large lots\",\"criteria\":{\"minAreaSqft\":20000}}.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "criteria": {
                          "description": "The filters of this branch: the same keys and units as the top-level `criteria`, without `branches`.",
                          "type": "object"
                        },
                        "key": {
                          "pattern": "^[a-z][a-z0-9_]{0,39}$",
                          "type": "string"
                        },
                        "label": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["criteria", "key", "label"],
                      "type": "object"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "building_use": {
                    "additionalProperties": false,
                    "description": "What the lot is used for today, read from the assessor's use code: office, mixed_use, retail, hospitality, industrial, multifamily, two_to_four_family, single_family, institutional, civic, religious, parking, vacant_land, other. \"Commercial buildings, not houses or churches\" is { any_of: [\"office\", \"mixed_use\", \"retail\"] } or { none_of: [\"single_family\", \"two_to_four_family\", \"religious\", \"civic\"] }.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "contamination_risk": {
                    "additionalProperties": false,
                    "description": "true: a gas station or auto-service business (repair, body shop, car wash) is mapped on the lot. { is: false } excludes those lots. A risk flag from OpenStreetMap and city business licences, not a site investigation: it misses former and unmapped businesses.",
                    "properties": {
                      "is": {
                        "type": "boolean"
                      }
                    },
                    "required": ["is"],
                    "type": "object"
                  },
                  "dwelling_count": {
                    "additionalProperties": false,
                    "description": "Dwellings on the lot, as the assessment roll states them (Montréal: nombre de logements). \"A single-family house\" is { min: 1, max: 1 }; \"duplex or triplex\" is { min: 2, max: 3 }. Lots whose roll states no count never match.",
                    "properties": {
                      "max": {
                        "maximum": 100000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "min": {
                        "maximum": 100000,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "existing_coverage_pct": {
                    "additionalProperties": false,
                    "description": "Building footprint area on the lot as a percentage of lot area, 0-100. An underbuilt screen is { max: 20 }. Footprints can be years old: check the city honesty note.",
                    "properties": {
                      "max": {
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "existing_use_class": {
                    "additionalProperties": false,
                    "description": "What stands on the lot: place_of_worship (church, temple, mosque, synagogue…), fuel_station, auto_service (repair, body, car wash), auto_sales (car dealer), else vacant, surface_parking or built. \"Vacant lots or surface parking\" is { any_of: [\"vacant\", \"surface_parking\"] }; \"gas stations\" is { any_of: [\"fuel_station\"] }; \"church sites\" is { any_of: [\"place_of_worship\"] }. Vacant means no building over 20 m² in any footprint source and no assessed building worth over 20% of the land. Québec lots without footprints use the assessment roll land-use code (CUBF 9100 = vacant). A mapped business on the lot wins over the footprint class. Fuel and auto-service sites are a contamination risk flag, not a site investigation.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "exterior_material": {
                    "additionalProperties": false,
                    "description": "The assessor's primary exterior wall as a family: masonry, wood, siding, stucco, concrete, metal, glass, other. \"Brick buildings\" is { any_of: [\"masonry\"] }.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "frequent_transit_distance": {
                    "additionalProperties": false,
                    "description": "Metres from the lot line to the nearest frequent bus stop or rapid-transit station.",
                    "properties": {
                      "max": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "hydrant_distance": {
                    "additionalProperties": false,
                    "description": "Metres from the lot line to the nearest fire hydrant.",
                    "properties": {
                      "max": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "improvement_land_ratio": {
                    "additionalProperties": false,
                    "description": "Building (improvement) value divided by land value, assessed or appraised, as a ratio: 0.25 = the building is worth a quarter of the land. A teardown screen is { max: 0.25 }.",
                    "properties": {
                      "max": {
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "land_value_per_buildable": {
                    "additionalProperties": false,
                    "description": "Assessed land value divided by the buildable floor area (lot area x the zone’s cited maximum FSR), in currency per square metre of floor area, inclusive bounds ($150 per sq ft = 1,614.59 per m²). Lots without a cited FSR, a land/improvement split or a usable assessment never match.",
                    "properties": {
                      "max": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "lot_depth": {
                    "additionalProperties": false,
                    "description": "Metres. A frontage the city publishes, else the side of the lot outline's oriented bounding rectangle.",
                    "properties": {
                      "max": {
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "lot_width": {
                    "additionalProperties": false,
                    "description": "Metres. A frontage the city publishes, else the side of the lot outline's oriented bounding rectangle.",
                    "properties": {
                      "max": {
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "maxAreaSqft": {
                    "description": "Largest lot, in square feet.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "maxAssessed": {
                    "description": "Highest assessed total value, in dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "minAreaSqft": {
                    "description": "Smallest lot, in square feet.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "minAssessed": {
                    "description": "Lowest assessed total value, in dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "minHomes": {
                    "description": "Homes allowed, at least N. A zone-level estimate.",
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "namedAreaIds": {
                    "description": "Submarket (named area) ids. Use `thesis` to match submarkets by name.",
                    "items": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "namedAreaKinds": {
                    "description": "Named-area kinds from the registry, e.g. [\"downtown\"]. Each resolves to this city's areas of that kind and is added to namedAreaIds, so no id lookup is needed. A city with no area of a kind is an error that names it (\"no downtown area on file\"); it never screens the whole city instead. Midtown and uptown are names, not kinds: use thesis.",
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "ocp_above_zoning": {
                    "additionalProperties": false,
                    "description": "true: the lot's plan designation (Official Community Plan, or future land use map) allows more housing than its current zone (both ranked 1 rural, 2 low density, 3 medium density, 4 high density or mixed-use centre): a rezoning candidate. { is: false } keeps lots where both are ranked and the plan is not higher. Lots with an unranked zone or designation, no zone, or no designation match neither. A planning signal: a rezoning consistent with the plan is more likely to be supported, but this is not a rezoning approval or the density zoning permits today.",
                    "properties": {
                      "is": {
                        "type": "boolean"
                      }
                    },
                    "required": ["is"],
                    "type": "object"
                  },
                  "overlayExcludeKinds": {
                    "description": "Overlay kinds a lot must not overlap. A lot passes only if it was evaluated for every excluded kind; an unevaluated kind is reported not_available.",
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "overlayKinds": {
                    "description": "Overlay kinds a lot must overlap by at least 1 m². A kind the city has not evaluated is reported not_available, never applied.",
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "owner_class": {
                    "additionalProperties": false,
                    "description": "Owner class of the lot, from ParcelMap BC owner type or an open assessment roll: private, municipal, provincial (or state), federal, crown_agency (or public agency), public_other, institutional (religious, charitable, education, health), first_nations, mixed_ownership (as the source states), unclassified, and public (any of municipal, provincial, federal, crown_agency, public_other). Institutional and First Nations land is not public. A lot with parcels of several classes holds all of them, so none_of [\"public\"] also drops a lot that is partly public and any_of [\"private\"] keeps it. \"Not public land\" is { none_of: [\"public\"] }, which keeps lots whose owner class is unknown; any_of drops them. \"Private\" is the registered owner type, not a title search.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "ownership_form": {
                    "additionalProperties": false,
                    "description": "Ownership form: fee_simple (land title), strata_condo, co_op, leasehold, mixed. \"Land title only\" is { none_of: [\"strata_condo\", \"co_op\", \"leasehold\", \"mixed\"] }, which keeps lots whose form is unknown; any_of drops them.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "parking_coverage": {
                    "additionalProperties": false,
                    "description": "Mapped surface-parking area on the lot as a percentage of lot area, 0-100. Church parking lots: place_of_worship true with { min: 25 }. An office or store with a large parking field: existing_use_class built with { min: 50 }. 0 means the map shows no parking.",
                    "properties": {
                      "max": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "permitted_height_m": {
                    "additionalProperties": false,
                    "description": "Metres. Maximum building height the lot may reach: the city's height overlay map where one sets it (Toronto), else the zone rules. { min: 30 } keeps lots allowed at least 30 m.",
                    "properties": {
                      "max": {
                        "maximum": 1000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 1000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "permitted_stories": {
                    "additionalProperties": false,
                    "description": "Maximum storeys the lot's zone allows, from the zone rules. { min: 10 } keeps lots whose zone allows at least 10 storeys; \"10 to 14 storey rental\" is { min: 10, max: 14 }. Not the building standing on the lot: that is `stories`.",
                    "properties": {
                      "max": {
                        "maximum": 200,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "min": {
                        "maximum": 200,
                        "minimum": 1,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "permitted_use": {
                    "additionalProperties": false,
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "place_of_worship": {
                    "additionalProperties": false,
                    "description": "true: a church, temple, mosque, synagogue or other place of worship is mapped on the lot (OpenStreetMap, city heritage registers). { is: false } excludes those lots. Same lots as existing_use_class place_of_worship.",
                    "properties": {
                      "is": {
                        "type": "boolean"
                      }
                    },
                    "required": ["is"],
                    "type": "object"
                  },
                  "planned_transit_distance": {
                    "additionalProperties": false,
                    "description": "Metres from the lot line to the nearest station of a rapid transit line that is planned or under construction (not yet open; never counted as frequent transit).",
                    "properties": {
                      "max": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "projectInputs": {
                    "additionalProperties": false,
                    "description": "What the project is, checked against a use's structured conditions.",
                    "properties": {
                      "buildingForm": {
                        "description": "standalone, or unit_in_building (a unit inside a building with other occupants).",
                        "enum": ["standalone", "unit_in_building"],
                        "type": "string"
                      },
                      "grossFloorAreaSqft": {
                        "description": "Gross floor area of the project, in square feet.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "register_status": {
                    "additionalProperties": false,
                    "description": "Historic register status: individually_listed, contributing, non_contributing, in_district (inside a register district, building not yet mapped), not_listed. \"On the register\" is { any_of: [\"individually_listed\", \"contributing\"] }. Register status is a research lead, not tax-credit eligibility. The federal 20% credit needs a certified historic structure; building age alone qualifies for nothing (the 10% pre-1936 credit was repealed in 2017).",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "stall_count": {
                    "additionalProperties": false,
                    "description": "Estimated marked surface-parking stalls on the lot: mapped parking area divided by an area per stall for the parking source, as a central estimate. \"At least 200 stalls\" is { min: 200 }. Garages and underground parking are not counted. A lot in a city with no parking map never matches.",
                    "properties": {
                      "max": {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "min": {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "stories": {
                    "additionalProperties": false,
                    "description": "Above-grade stories: the assessor count where recorded (half stories are decimals, 1.5), otherwise estimated from building height at 3 m per storey. \"1-2 story\" is { max: 2 }.",
                    "properties": {
                      "max": {
                        "maximum": 200,
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "maximum": 200,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "street": {
                    "additionalProperties": false,
                    "description": "Street names as the lot address carries them, upper case with the suffix abbreviated: \"STATE ST\", \"BANK ST\". { any_of: [...] } keeps lots on those streets. Matches the lot's address, not every street it touches: a corner lot counts once.",
                    "properties": {
                      "any_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "none_of": {
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "subdivision_yield": {
                    "additionalProperties": false,
                    "description": "Lot area divided by the zone's minimum lot area: how many minimum-size lots the parcel could hold by area. \"Could be subdivided\" is { min: 2 }; \"into 3 lots\" is { min: 3 }. Ignores frontage, streets and lot shape: a candidate, not a subdivision approval.",
                    "properties": {
                      "max": {
                        "minimum": 0,
                        "type": "number"
                      },
                      "min": {
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "tax_exempt": {
                    "additionalProperties": false,
                    "description": "true: the assessment roll classes the property as exempt from property tax (public, religious, charitable and similar owners). { is: false } keeps taxable lots only. Read from rolls that state both values; personal exemptions (senior, veteran) do not count.",
                    "properties": {
                      "is": {
                        "type": "boolean"
