                    "additionalProperties": false,
                    "description": "Assessed land value divided by the buildable floor area (lot area x the zone’s cited maximum FSR), in currency per square metre of floor area, inclusive bounds ($150 per sq ft = 1,614.59 per m²). Lots without a cited FSR, a land/improvement split or a usable assessment never match.",
                    "properties": {
