        {
          "name": "getBylawSection",
          "title": "Get cited bylaw section text",
          "description": "Return the stored bylaw section text behind a snapshot citation. Pass `sectionIds` copied from `citations.*.knowledgeSectionId` on checkSite. Or pass `geoDivisionId` from `coverage.geoDivisionId`, `zoneCode` from `zone.code`, and `sectionNumbers` such as 3.1 or 3.2. Examples: {\"sectionIds\":[\"<knowledgeSectionId>\"]} or {\"geoDivisionId\":\"<coverage.geoDivisionId>\",\"zoneCode\":\"RM-4\",\"sectionNumbers\":[\"3.1\"]}. sectionIds and sectionNumbers are arrays; do not pass address, city, sectionId or sectionNumber. The markdown is the schedule text. A number in the snapshot can still be conditional on frontage, tenure, or adjoining district. Each section returns at most 12,000 characters. A cut section has `truncated: true`, `totalChars` and `nextOffset`: call again with that section id and `textOffset: nextOffset` for the rest. Ids or section numbers with no active chunk come back in `missing`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "geoDivisionId": {
                "description": "coverage.geoDivisionId from checkSite.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sectionIds": {
                "description": "Copy citations.*.knowledgeSectionId from checkSite. 1 to 4 ids.",
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "sectionNumbers": {
                "description": "Section numbers to read, for example 3.1 or 3.2. 1 to 4 numbers.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "textOffset": {
                "description": "Character to start each section at. Default 0. Copy nextOffset from a truncated section to read the rest.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "zoneCode": {
                "description": "zone.code from checkSite, for example C-2.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get cited bylaw section text"
          },
