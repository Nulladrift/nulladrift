      "serverInfo": {
        "name": "skai-shopify-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_shopify_fees",
          "title": "Calculate Shopify fees",
          "description": "Compare the monthly and annual cost of Shopify Basic, Grow, Advanced and Plus for a sales volume and payment mix, with break-even sales between plans and requirements only Plus covers. Uses Shopify's published prices and rates for the US, UK, Australia, Norway or New Zealand (market); Norway's Plus and New Zealand's subscriptions are billed in EUR or USD and converted at a dated ECB reference rate, reported in exchangeRate; pass exchangeRate to use your own. The variable Plus platform fee is unpublished, so pass plusQuoteMonthly if you have a quote. Only monthlyGmv is required; the rest defaults to one US brand fully on Shopify Payments with yearly billing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "averageOrderValue": {
                "description": "Average order value in market sales currency; drives the per-order fixed card fee.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "b2bCatalogs": {
                "description": "B2B company catalogs needed.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "billing": {
                "description": "Billing for Basic, Grow and Advanced.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "brands": {
                "description": "Separate brands; each needs its own plan or Plus contract.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "checkoutExtensions": {
                "description": "Whether checkout UI extensions are needed.",
                "type": "boolean"
              },
              "exchangeRate": {
                "description": "Local sales currency units per foreign subscription currency unit (NOK/EUR in Norway; NZD/USD in New Zealand), up to 1,000,000. Overrides the market's default ECB reference rate; the estimate's exchangeRate reports which rate was applied.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "headlessStorefronts": {
                "description": "Headless storefronts needed.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "internationalCardShare": {
                "description": "Share of Shopify Payments sales on international cards (0-1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "market": {
                "enum": ["us", "uk", "au", "no", "nz"],
                "type": "string"
              },
              "monthlyGmv": {
                "description": "Monthly online sales in the selected market sales currency across all stores.",
                "maximum": 50000000,
                "minimum": 0,
                "type": "number"
              },
              "plusQuoteMonthly": {
                "description": "Monthly Plus price in market sales currency from a Shopify quote; replaces the list price.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "plusTerm": {
                "description": "Shopify Plus contract term.",
                "enum": ["one-year", "three-year"],
                "type": "string"
              },
              "premiumCardShare": {
                "description": "Share of Shopify Payments sales on premium cards in the US, or Amex cards in other markets (0-1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "providerFixedCents": {
                "description": "Third-party provider's own fixed fee per order in cents.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "providerRateBps": {
                "description": "Third-party provider's own rate in basis points (290 = 2.9%).",
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "sameBrandStores": {
                "description": "Stores for the same brand, such as regional stores.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "shopifyPaymentsShare": {
                "description": "Share of online sales processed by Shopify Payments (0-1); the rest uses a third-party provider.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "staffAccounts": {
                "description": "Staff accounts needed besides the store owner.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["monthlyGmv"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:79e51b6c094db19c3414230f2ffd60d79fd9e5ec664b6dbd7bed02f5415cac46"
        },
        {
          "name": "check_shopify_store_speed",
          "title": "Check Shopify store speed",
          "description": "Test a Shopify store's speed with Google PageSpeed Insights (mobile and desktop) and real-user Core Web Vitals, list the apps and scripts slowing it down, and estimate what a headless build could change, with its assumptions. Takes 10 seconds to 2.5 minutes; results are cached for 24 hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "strategy": {
                "description": "Which Lighthouse runs to include; defaults to both.",
                "enum": ["mobile", "desktop", "both"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e7d401b015a561e47218ea970aea646e20da382f75965142cae27a6d1720ea4e"
        },
        {
          "name": "detect_shopify_store",
          "title": "Detect Shopify store",
          "description": "Detect whether a site is a Shopify theme store or a headless Shopify storefront, and which theme it uses. Fetches only the public page; runs no speed test.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
