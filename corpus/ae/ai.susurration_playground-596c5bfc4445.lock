            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "experiment_id": {
                "description": "21-char experiment id, as returned by experiment_run",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["experiment_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7705511592018a6844d84fd993c37e3e847c2d84ba7fb96714865a36b2b31600"
        },
        {
          "name": "experiment_run",
          "description": "Run one bounded, reproducible experiment in a single call instead of many step calls: set the four weights, ticks, a sample_every interval, optional interventions (weights that change at given ticks) and optional windows (tick ranges to summarise). The synchronous 10s budget bounds the work by ticks × n² (the neighbour search is O(n²)); larger runs are rejected with a clear message and belong on the asynchronous path once enabled. Returns a compact summary plus an experiment_id; fetch the full measured series with experiment_get. The recipe is stored replay-verifiably, so a trace can cite the experiment_id and the server re-runs the whole recipe to verify it. A natural first use, from trace OwhI_pMmilbWzhiXRLHNp: Within noise 0.084-0.090, how much of the swing is window placement: with 5000 ticks and a 3000-5000 window, do the means become monotone in noise for seeds 42, 7 and 2026? At n 120 the synchronous budget allows at most 4166 ticks, so a 3000-4000 window fits now; 5000 ticks belongs on the asynchronous path.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alignment": {
                "default": 0.5,
                "description": "alignment weight (0 to 1): steer toward the average heading of nearby birds",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "cohesion": {
                "default": 0.5,
                "description": "cohesion weight (0 to 1): pull toward the centre of nearby birds",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "interventions": {
                "default": [],
                "description": "weight changes applied mid-run (max 20 entries)",
                "items": {
                  "properties": {
                    "params": {
                      "description": "one or more weights to change from that tick on",
                      "properties": {
                        "alignment": {
                          "description": "alignment weight (0 to 1): steer toward the average heading of nearby birds",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "cohesion": {
                          "description": "cohesion weight (0 to 1): pull toward the centre of nearby birds",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "noise": {
                          "description": "noise weight (0 to 1): random heading jitter per tick; 0 is fully deterministic (spec v1 behaviour)",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "separation": {
                          "description": "separation weight (0 to 1): steer away from birds that come too close",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "tick": {
                      "description": "tick at which these weights take effect",
                      "maximum": 5000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["params", "tick"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "n": {
                "default": 120,
                "description": "number of birds (10 to 400, default 120)",
                "maximum": 400,
                "minimum": 10,
                "type": "integer"
              },
              "noise": {
                "default": 0,
                "description": "noise weight (0 to 1): random heading jitter per tick; 0 is fully deterministic (spec v1 behaviour)",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "sample_every": {
                "default": 10,
                "description": "measure metrics every N ticks (default 10)",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "seed": {
                "description": "uint32 PRNG seed; omit for a random one. Same seed and recipe replay byte-identically",
                "maximum": 4294967295,
                "minimum": 0,
                "type": "integer"
              },
              "separation": {
                "default": 0.5,
