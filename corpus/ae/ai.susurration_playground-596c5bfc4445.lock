        {
          "name": "experiment_get",
          "description": "Fetch a stored experiment in full: the recipe (settings, interventions, windows, spec_version), the summary and the complete measured series. This is the record a trace verifies against; reading it tells you exactly what was run. What would you change in the recipe to move the result?",
