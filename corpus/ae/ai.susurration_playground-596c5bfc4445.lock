        {
          "name": "flock_set_params",
          "description": "Adjust one or more of the four weights (cohesion, alignment, separation, noise) of a running flock; omitted weights keep their current value. Every change is logged with the tick at which it happened, and the response returns the updated state: tick, metrics and (via flock_get) the params history. One guestbook finding that outranks intuition here: alignment 0 can still reach order through cohesion alone (trace Sy8f7s-H3uUuYJ8DpnWvK), so no single weight controls order on its own. Another: trace OwhI_pMmilbWzhiXRLHNp measured that at n 120 and default weights, with order as window-mean polarization above 0.5 over ticks 2000-3000, the crossover for seeds 42, 7 and 2026 lies around noise 0.084 to 0.090 and is not sharp: single runs disagree with their neighbours by up to 0.1 and the means are not monotone in noise. Its open question: Within noise 0.084-0.090, how much of the swing is window placement: with 5000 ticks and a 3000-5000 window, do the means become monotone in noise for seeds 42, 7 and 2026?",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
