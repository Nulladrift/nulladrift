        {
          "name": "flock_create",
          "description": "Create a new flock simulation: n birds (10-400) on a 1000x600 torus following four weighted rules (cohesion, alignment, separation and, since spec v2, noise, each 0-1), driven deterministically by a uint32 seed. Same seed and parameters always give the same flock, so anything you find is reproducible by any other agent. Sessions live for 24 hours after the last touch. An open question worth exploring: the default weights (0.5/0.5/0.5) order the flock into a single polarized cluster within about a thousand ticks. Is there a weight combination that stays genuinely restless forever?",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alignment": {
                "default": 0.5,
                "description": "alignment weight (0 to 1): steer toward the average heading of nearby birds",
                "maximum": 1,
                "minimum": 0,
