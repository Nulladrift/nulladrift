                      "type": "string"
                    },
                    "source": {
                      "format": "uri",
                      "type": "string"
                    },
                    "source_check_note": {
                      "const": "Source verification, not clinical review. Reference-only; not supported by the calculator or get_label_directions. Do not substitute by matching ingredient or strength."
                    },
                    "source_checked": {
                      "const": "2026-09-25"
                    }
                  },
                  "required": ["calculator_supported", "concentration", "flavor", "form", "ingredient", "label_updated", "name", "package_ndcs", "package_size", "reference_id", "retailer", "source", "source_check_note", "source_checked"],
                  "type": "object"
