        {
          "name": "get_label_directions",
          "title": "Get printed label directions",
          "description": "Read one printed public label row. Use exact identifiers from list_calculator_bottles or find_label_references.calculator_bottles; if already known, call directly without repeating discovery. Copy all three identifiers from the same bottle and one of its label_bands. Returns label amount or ask_doctor, age and weight restrictions, full directions, source and canonical URL. Does not determine suitability for a child. Minimal operational telemetry records no tool arguments or results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "concentration": {
                "description": "Copy the concentration string from that same bottle, including units and spacing. Do not convert strengths.",
                "enum": ["160 mg / 5 mL", "100 mg / 5 mL", "50 mg / 1.25 mL", "1 mg / mL"],
                "type": "string"
              },
              "label_band": {
                "description": "Copy a label_band identifier from that bottle's label_bands. This is a published row, not an exact patient age or weight.",
                "enum": ["under-24-lb", "24-35-lb", "36-47-lb", "48-59-lb", "60-71-lb", "72-95-lb", "under-12-lb", "12-17-lb", "18-23-lb", "under-2-years", "2-5-years", "6-11-years"],
                "type": "string"
              },
              "product_id": {
                "description": "Exact calculator-supported product_id from the catalog or finder; never a reference_only reference_id.",
                "enum": ["tylenol-child", "tylenol-infant", "motrin-child", "motrin-infant", "zyrtec-child"],
                "type": "string"
              }
            },
            "required": ["concentration", "label_band", "product_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "oneOf": [
              {
                "properties": {
                  "label_amount": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "status": {
                    "const": "label_reference"
                  }
