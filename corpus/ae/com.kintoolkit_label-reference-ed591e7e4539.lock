        "name": "kintoolkit-calculator",
        "version": "1.2.0",
        "websiteUrl": "https://kintoolkit.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use list_question_guides and get_question_guide for educational medicine questions, comparisons, chewables and Claritin; copy only a public guide_id, never a user question. Return the complete guide with sources and safety limits. Reference-only guide products do not expand calculator support. Educational US liquid medicine label lookup, not a personalized prescription. For ordinary product names, map only the public brand, ingredient and bottle audience to find_label_references; never forward the user’s full question or patient details. Ask which bottle or formulation is meant when matches are ambiguous. Store-brand entries are reference-only, not calculator-supported substitutes. Use only an exact listed calculator bottle, concentration and published label band for get_label_directions. Never send names, exact measurements, medical history or other patient details. Do not interpolate, convert concentrations or infer that a label reference is safe for a particular child. Preserve the age restrictions, directions, maximum and source together; verify the full package label and ask a clinician when unsure. Public access requires no authentication. The MCP limit is 120 HTTP requests per IP per 60-second fixed window in each region; shared networks share the limit. On HTTP 429, honor a valid Retry-After if present; otherwise wait at least 60 seconds plus jitter, reduce request rate and bound retries. Do not switch IPs or hosts to evade limits. Breaking API changes and removals receive at least 90 days of advance notice at https://kintoolkit.com/developers#api-change-policy.",
      "tools": [
        {
          "name": "find_label_references",
          "title": "Find medicine label references",
          "description": "Resolve ordinary public product names using bounded filters: Children’s Motrin means brand motrin and audience children; Zyrtec means brand zyrtec; generic cetirizine means ingredient cetirizine; Walmart means brand equate. Omit filters only when unspecified. An unlisted medicine or brand is unsupported; do not drop it or use an ingredient match to substitute another product. Lists matching calculator bottles and separately marked reference-only CVS, Equate and Walgreens formulations with sources. Returns clarification guidance for ambiguous matches. No free text or patient inputs. Arguments and results are excluded from operational telemetry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Public wording on the bottle, never a patient age.",
                "enum": ["infants", "children"],
                "type": "string"
              },
              "brand": {
                "description": "Public bottle brand; Walmart Equate maps to equate. Omit only when the brand is unspecified, not when it is unsupported.",
                "enum": ["tylenol", "motrin", "zyrtec", "cvs", "equate", "walgreens"],
                "type": "string"
              },
              "ingredient": {
                "description": "Public active ingredient. Combined filters must all match; do not discard a conflicting brand or ingredient.",
                "enum": ["acetaminophen", "ibuprofen", "cetirizine"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "calculator_bottles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "concentration": {
                      "enum": ["160 mg / 5 mL", "100 mg / 5 mL", "50 mg / 1.25 mL", "1 mg / mL"],
                      "type": "string"
                    },
                    "ingredient": {
                      "type": "string"
                    },
                    "label_bands": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "age_band": {
                            "type": "string"
                          },
                          "label_band": {
                            "type": "string"
                          },
                          "url": {
                            "format": "uri",
                            "type": "string"
                          },
                          "weight_band": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": ["age_band", "label_band", "url", "weight_band"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "product_id": {
                      "enum": ["tylenol-child", "tylenol-infant", "motrin-child", "motrin-infant", "zyrtec-child"],
                      "type": "string"
                    },
                    "source": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["concentration", "ingredient", "label_bands", "name", "note", "product_id", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_step": {
                "type": "string"
              },
              "reference_only": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "calculator_supported": {
                      "const": false
                    },
                    "concentration": {
                      "type": "string"
                    },
                    "flavor": {
                      "type": "string"
                    },
                    "form": {
                      "type": "string"
                    },
                    "ingredient": {
                      "type": "string"
                    },
                    "label_updated": {
                      "format": "date",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
