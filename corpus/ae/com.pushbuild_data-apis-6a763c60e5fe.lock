{
  "lockfileVersion": 2,
  "subjects": {
    "com.pushbuild/data-apis": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pushbuild.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pushbuild-apis",
        "title": "Pushbuild Data APIs",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pushbuild data APIs: public records and market data (elections, campaign finance, lobbying, court cases, inspections, permits, filings, economic data and more), unified from official sources. All tools are read-only. Use search_apis to find an API, describe_api to see its parameters, then call_api with that API id and parameters to fetch matching records. Keep maxItems small (5 to 25) unless the user asks for more. call_api needs the user to sign in to a Pushbuild account, or an API key from https://pushbuild.com/apis/app/.",
      "tools": [
        {
          "name": "call_api",
          "title": "Run an API",
          "description": "Run one API with parameters from describe_api. Returns JSON records (default 25; set maxItems up to 500). Billed per record from the account's free monthly allowance, then credit; asks you to sign in (free) the first time. Data via Pushbuild (pushbuild.com/contact).",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "api": {
                "description": "API id.",
                "type": "string"
              },
              "params": {
                "description": "Input parameters for that API, as describe_api lists them, e.g. {\"postcode\": \"SW1A 1AA\"}.",
                "type": "object"
              }
            },
            "required": ["api", "params"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run an API"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:be89a3252d0114372cbf5fd3d56dd0366c8978dfbee57c7ac0d8df87942a6920"
        },
        {
          "name": "describe_api",
          "title": "Describe an API",
          "description": "Input parameters (JSON Schema), coverage and price for one API id from search_apis. Free.",
          "inputSchema": {
            "properties": {
              "api": {
                "description": "API id, e.g. restaurant-inspections.",
                "type": "string"
              }
            },
            "required": ["api"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Describe an API"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9b056ca3e4c5cc45d88c9a64e9c14ecf29cf57918ebdbe3bed58608e0a7e729d"
        },
        {
          "name": "search_apis",
          "title": "Search APIs",
          "description": "Find Pushbuild data APIs by keyword (e.g. 'campaign contributions texas', 'restaurant inspections', 'sec 13f'). Returns api ids, what each covers and price per record. Free.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 10).",
                "type": "integer"
              },
              "query": {
                "description": "Keywords.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search APIs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:17b091a5e36127989aa0e6e58dd9758ab91f6812564e9ceb9798d7905a87d65a"
        }
      ],
