    "app.rowb.gbu-compliance/assessment": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gbu-compliance.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gbu-compliance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "assess_workplace",
          "description": "Assess a workplace against the section 5(3) hazard checklist. Returns risk level per hazard, the gaps that are not low, and the next review date. Deterministic: same input gives the same output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employees": {
                "description": "Number of employees (optional, stored in the record).",
                "type": "integer"
              },
              "hazards": {
                "description": "Hazard IDs from list_hazards, e.g. [\"H01\",\"H02\",\"H12\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sector": {
                "description": "Free-text sector label, e.g. \"Metallbau\" or \"Praxis\".",
                "type": "string"
              }
            },
            "required": ["hazards"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c63ab50c077aa5b96b6ce8e2c9c5bbae969656791229e55a7f4d48b936bc8549"
        },
        {
          "name": "documentation",
          "description": "Build the section 6 ArbSchG documentation record for an assessment: result, measures and the review result field. Returns the three fields section 6 requires.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer": {
                "description": "Employer name to print on the record.",
                "type": "string"
              },
              "hazards": {
                "description": "Hazard IDs from list_hazards.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sector": {
                "type": "string"
              }
            },
            "required": ["hazards"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a5e5daae4ea1f5d8cd062866cc1485e8f92b4338ed761f8b3fcce1a7147eb44"
        },
        {
          "name": "list_hazards",
          "description": "List the hazard checklist used for a Gefährdungsbeurteilung, grouped by the six categories of ArbSchG §5(3). Read this first, then pick IDs for assess_workplace.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:336f574eb6bf855945d6913a2badfb9bdfcbc05a98c8ff899b6baea76f94e354"
        },
        {
          "name": "review_due",
          "description": "Return the next review date for a risk level (high 180 days, medium 365, low 730).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "risk": {
                "description": "high, medium or low",
                "type": "string"
              }
            },
            "required": ["risk"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09294351f79d6616c6daae3e1d2634343d58f1185b7812cdfc2285f3b25eeeec"
        }
      ],
