        {
          "name": "set_tracking_params",
          "title": "Set tracking params",
          "description": "Set the tracking params on a paid listing's outbound link (Bronze and up). Keys: ref or utm_* (<=10, lowercase/digits/_); values: 1-100 of A-Z a-z 0-9 . _ ~ -. Send {} to clear back to ?ref=curlship. Free listings are refused.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "type": "integer"
              },
              "proof": {
                "enum": ["email", "domain"],
                "type": "string"
              },
              "tracking": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "e.g. {\"utm_source\": \"yours\", \"utm_medium\": \"referral\"}",
                "type": "object"
              }
            },
            "required": ["listing_id", "proof", "tracking"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
