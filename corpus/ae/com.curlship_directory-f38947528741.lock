        {
          "name": "remove_free_listing",
          "title": "Remove a free listing",
          "description": "Take a free listing off the directory. Send remove true and no url or email. A paid listing or the Featured holder is refused.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "type": "integer"
              },
              "proof": {
                "enum": ["email", "domain"],
                "type": "string"
              },
              "remove": {
                "const": true,
                "type": "boolean"
              }
