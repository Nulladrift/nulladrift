          "name": "refresh_listing",
          "title": "Refresh listing metadata",
          "description": "Re-read title, description, and image from the listed page. Send listing_id and proof only. The first confirm previews; send apply back to save.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "type": "integer"
