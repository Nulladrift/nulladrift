        {
          "name": "list_listings",
          "title": "List listings",
          "description": "Active listings as JSON. No query returns every listing, in the same order as before. Optional query parameters: limit, offset, q, since, and category. q matches the title, description, or URL. since is an ISO timestamp; listings created at or after it are kept. category is a category slug and filters to that group or leaf. Each listing includes created_at and a category object ({slug, name, group}) or null while the listing is unclassified.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category slug — a group or a promoted leaf.",
                "type": "string"
              },
              "limit": {
                "description": "Max listings. 50 with offset, 100 with q, when omitted.",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "How many matching listings to skip.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Substring of the title, description, or URL.",
                "type": "string"
              },
              "since": {
                "description": "ISO timestamp. Keep listings created at or after this moment.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
