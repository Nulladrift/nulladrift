      "instructions": "Featured is the first tool. Paid actions return checkout_url. Opening that URL is the payment. /sse is the website stream. /webhooks is the payment callback.",
      "tools": [
        {
          "name": "bid_featured",
          "title": "Bid for the Featured spot",
          "description": "Take the Featured spot. It sits above every listing. The minimum right now is $51. Always dofollow. One-time payment, no refund when someone outbids you. The product must already be listed. Omit amount_usd to bid $51.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Bid in USD. Omit to bid the minimum (51).",
                "type": "number"
              },
              "url": {
                "description": "URL of a listing that is already on the directory.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Bid for the Featured spot"
          },
          "behavior": {
            "destructive": false,
