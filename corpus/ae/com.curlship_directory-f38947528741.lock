        {
          "name": "x402_bid_featured",
          "title": "Bid for Featured, paid in USDC",
          "description": "Bid on the Featured spot in USDC over x402 — the same auction as a card bid (minimum $51 right now), but settled on-chain with no checkout and no human in the loop. Call without payment_signature for the 402 quote, sign accepts[0] as an EIP-3009 authorization, call again with payment_signature echoing it as `accepted`. The product must already be listed. Omit amount_usd to bid $51.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Bid in USD. Omit to bid the minimum (51).",
                "type": "number"
              },
              "payment_signature": {
                "description": "The PAYMENT-SIGNATURE header value: base64 JSON x402 v2 PaymentPayload — accepts[0] from the quote, signed and echoed back as `accepted`. Omit to get the quote back as a 402.",
                "type": "string"
              },
              "url": {
                "description": "URL of a listing that is already on the directory.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Bid for Featured, paid in USDC"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd71f12e3e2afb64418e5b8cc7782853e0b803e90bfae9be382039918d4950fe"
        },
        {
          "name": "x402_submit_listing",
          "title": "Submit a listing, paid in USDC",
          "description": "Buy bronze_lifetime ($30 USDC once, forever) or platinum ($49 USDC per prepaid year) with USDC over x402 — settled on-chain, no checkout page, no human in the loop. Call without payment_signature and the reply is a 402 whose body (also the PAYMENT-REQUIRED header, base64) is the quote; sign accepts[0] as an EIP-3009 authorization and call again with payment_signature — the tier is granted in that same call. Same URL and listing rules as a free submission.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "payment_signature": {
                "description": "The PAYMENT-SIGNATURE header value: base64 JSON x402 v2 PaymentPayload — accepts[0] from the quote, signed and echoed back as `accepted`. Omit to get the quote back as a 402.",
                "type": "string"
              },
              "tier": {
                "description": "The only tiers x402 sells.",
                "enum": ["bronze_lifetime", "platinum"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["email", "tier", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
