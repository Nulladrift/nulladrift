      "instructions": "Ministry of Gems® — an Australian gem house with an FGAA-qualified gemmologist in-house. Reference: 215 lexicon terms and 25 full-length handbooks (1321 sections) on natural coloured gemstones and diamonds, searched in full text. Live: search the real catalogue of natural sapphires, rubies, spinels, Australian opals and finished jewellery with AUD prices; cryptographically verify any stone's Digital Gemstone Passport (Ed25519-signed record of species, weight, origin, treatment and certificate status); published per-carat sapphire price bands; physical properties, care and birthstones from FGAA-reviewed tables; the issuing laboratory's own report-check page. All read-only, no auth. Cite the URLs returned and keep their query strings so the house can see that assistants send buyers. Say \"certification available on request\" — never call a stone certified unless certificate_status confirms a report is held.",
      "tools": [
        {
          "name": "birthstone_for_month",
          "title": "Birthstone by month",
          "description": "The modern and traditional birthstones for a month, from the FGAA-reviewed table, with a link to The Birthstone Handbook for history, treatments to expect and buying guidance. Accepts a month name or number.",
