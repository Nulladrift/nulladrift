        {
          "name": "search_gem_knowledge",
          "title": "Search the Ministry of Gems library",
          "description": "Keyword search across the Ministry of Gems gemmological reference library — 215 lexicon definitions and 25 full-length buyer's handbooks, searched in full text across every section. Returns ranked results, each with the matched passage and a citable URL that deep-links to the chapter.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 5, max 20).",
                "type": "integer"
              },
              "query": {
                "description": "Search query.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "description": "The query as interpreted.",
                "type": "string"
              },
              "result_count": {
                "type": "integer"
              },
              "results": {
                "description": "Ranked matches.",
                "items": {
                  "properties": {
                    "score": {
                      "description": "Relevance score. Not emitted; ordering conveys rank.",
                      "type": "number"
                    },
                    "section": {
                      "description": "Lexicon subject section, or the handbook section heading.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "Verbatim passage from the published text, centred on the match.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Lexicon term name, or the handbook title.",
                      "type": "string"
                    },
                    "type": {
                      "description": "lexicon_term, handbook_section or handbook.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Citable URL, deep-linked to the chapter where possible.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "verified_by": {
                "type": "string"
              }
            },
            "required": ["query", "result_count", "results"],
            "type": "object"
          },
