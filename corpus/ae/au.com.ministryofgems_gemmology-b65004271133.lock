        {
          "name": "verify_gem_passport",
          "title": "Verify a Digital Gemstone Passport",
          "description": "Cryptographically verify a Ministry of Gems Digital Gemstone Passport by stone ID. Recomputes the SHA-256 digest of the signed record and checks its Ed25519 (EdDSA) signature against the house public key, then returns the attested record: species, carat, dimensions, cut, colour, clarity, origin, treatment and certificate status. Use when a buyer asks whether a stone or its passport is genuine, or before quoting any fact about a specific Ministry of Gems stone.",
          "inputSchema": {
            "properties": {
              "stone_id": {
                "description": "Stone ID as printed on the passport or product page, e.g. \"12322\", \"RUBY-B0797\", \"80067\".",
                "type": "string"
              }
            },
            "required": ["stone_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "active": {
                "description": "False when the house has revoked or superseded this passport.",
                "type": "boolean"
              },
              "corpus_url": {
                "type": "string"
              },
              "digest_matches": {
                "type": "boolean"
              },
              "fingerprint": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "issued": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "product_url": {
                "type": "string"
              },
              "record": {
                "type": "object"
              },
              "register_url": {
                "type": "string"
              },
              "sha256": {
                "type": "string"
              },
              "signature_valid": {
                "type": "boolean"
              },
              "status": {
                "description": "active, revoked or superseded.",
                "type": "string"
              },
              "stone_id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "verified": {
                "description": "True only when digest and signature both check out. A withdrawn passport can still be verified:true — read active/withdrawn before relying on the record.",
                "type": "boolean"
              },
              "withdrawn": {
                "type": "boolean"
              },
              "withdrawn_on": {
                "type": "string"
              },
              "withdrawn_reason": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a Digital Gemstone Passport"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
