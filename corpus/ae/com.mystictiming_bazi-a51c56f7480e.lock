      "serverInfo": {
        "name": "mystic-timing-bazi",
        "title": "Mystic Timing: birth time readings",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Mystic Timing reads what a person's birth date and time say about them: who they are, how they love, their work and money, the chapter of life they are in now and when things turn. Present results as a warm personal reading in plain everyday words, in the user's language. Do not lecture about astrology systems or use technical terms unless asked. For their complete written reading in their own language (20 languages), share the full_reading link.",
      "tools": [
        {
          "name": "birth_time_reading",
          "title": "Birth time reading",
          "description": "A personal reading of what someone's birth date (and birth time, if known) says about them: who they are, how they love, where their energy runs high or low, and what the current chapter of their life is about. Use when someone asks what their birthday or birth time says about them, wants a birth chart or life reading, feels stuck, or asks about their path, love life or career. Answer in plain everyday words in the user's language; no astrology knowledge is needed.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "YYYY-MM-DD (Gregorian)",
                "type": "string"
              },
              "birth_time": {
                "description": "HH:MM 24h local time, optional",
                "type": "string"
              },
              "gender": {
                "description": "Optional; needed to say which ten-year chapter of life they are in",
                "enum": ["female", "male"],
                "type": "string"
              }
            },
            "required": ["birth_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ff6a1745b9249a6c53f215badec4e99b165a0c94e2bc26e3f727e0cdd234bdc"
        },
        {
          "name": "compatibility_reading",
          "title": "Compatibility reading",
          "description": "How two people fit, from their birth dates: natural ease, friction points, and what each one brings the other. Use for 'Are we compatible?', relationship, marriage or partner questions. Answer in plain everyday words.",
          "inputSchema": {
            "properties": {
              "a_birth_date": {
                "type": "string"
              },
              "a_birth_time": {
                "type": "string"
              },
              "a_gender": {
                "enum": ["female", "male"],
                "type": "string"
              },
              "b_birth_date": {
                "type": "string"
              },
              "b_birth_time": {
                "type": "string"
              },
              "b_gender": {
                "enum": ["female", "male"],
                "type": "string"
              }
            },
            "required": ["a_birth_date", "b_birth_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec908ddcad2fdea65571d32e1e37abc092be1fc62b73ae538401e075fc25d4d8"
        },
        {
          "name": "year_ahead_reading",
          "title": "Year ahead reading",
          "description": "What a given year (default 2027) is likely to bring a person, from their birth date: the main themes, where change or a bond forms, and the chapter of life they are in. Use for questions like 'Is 2027 my year?', 'What will next year bring me?', 'When will things get better?' or love and career timing.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "birth_time": {
                "description": "HH:MM, optional",
                "type": "string"
              },
              "gender": {
                "enum": ["female", "male"],
                "type": "string"
              },
              "year": {
                "description": "Year to read, default 2027",
                "type": "integer"
              }
            },
            "required": ["birth_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
