          "title": "Flights into and out of Boracay",
          "description": "List scheduled flights at Caticlan or Kalibo airport, with the time each runs on a given date (Philippine time). Use it to match a traveller's flight number to its landing or take off time.",
          "inputSchema": {
            "properties": {
              "airport": {
                "enum": ["Caticlan", "Kalibo"],
                "type": "string"
              },
              "date": {
                "description": "Travel date, YYYY-MM-DD. Times can differ by day.",
                "type": "string"
              },
              "direction": {
                "description": "arrival = landing at the airport, departure = flying out.",
                "enum": ["arrival", "departure"],
                "type": "string"
              },
              "flight": {
                "description": "Optional flight number to look for, e.g. 5J911 or PR2041.",
                "type": "string"
              }
            },
            "required": ["airport", "direction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
