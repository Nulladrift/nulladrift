      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "myboracayguide",
        "title": "MyBoracayGuide: Boracay Transfers and Activities",
        "version": "1.0.0",
        "websiteUrl": "https://myboracayguide.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MyBoracayGuide sells airport transfers to and from Boracay Island, Philippines, and activities and tours on the island. Almost every traveller flies into Caticlan (MPH), 10 minutes from the jetty; Kalibo (KLO) is about 2 hours by road. A transfer covers the land and sea legs between the airport and the hotel on Boracay. On transfers, children 0 to 5 travel free and 6 and up pay the adult rate. Prices are in Philippine pesos. These tools never book or charge anything: quote with quote_boracay_airport_transfer or quote_boracay_activity, then give the traveller the link from create_boracay_transfer_booking_link or create_boracay_activity_booking_link so they can check the details and pay on myboracayguide.com.",
      "tools": [
        {
          "name": "create_boracay_activity_booking_link",
          "title": "Booking link for a Boracay activity",
          "description": "Make a myboracayguide.com link that opens the booking page for an activity with the option, date and number of guests filled in. Nothing is booked or paid: the traveller enters their details and pays there.",
          "inputSchema": {
            "properties": {
              "activity": {
                "description": "Activity name from list_boracay_activities, e.g. \"Parasailing\".",
                "type": "string"
              },
              "date": {
                "description": "Activity date, YYYY-MM-DD, Philippine time.",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "option": {
                "description": "Option when the activity has several, e.g. \"Tandem\" or \"Premium\". quote_boracay_activity lists them.",
                "type": "string"
              }
            },
            "required": ["activity", "date", "guests"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking link for a Boracay activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:990db526fdefad4f691a2551b6791b52b05424326b50fb602bb80bff420d21a9"
        },
        {
          "name": "create_boracay_transfer_booking_link",
          "title": "Booking link for a Boracay transfer",
          "description": "Make a myboracayguide.com link that opens the transfer booking form already filled in with the trip, passengers and any traveller details known. Nothing is booked or paid: the traveller opens the link, checks the details, adds anything missing and pays on the website.",
          "inputSchema": {
            "properties": {
              "adults_with_ph_id": {
                "description": "Adult (6 yrs and up) with a Philippine ID, local rate",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "adults_without_ph_id": {
                "description": "Adult (6 yrs and up) without a Philippine ID, foreign rate",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "airport": {
                "description": "Caticlan (MPH) is what almost everyone flies into; Kalibo (KLO) is about 2 hours by road. Defaults to Caticlan.",
                "enum": ["Caticlan", "Kalibo"],
                "type": "string"
              },
              "arrival_date": {
                "description": "Date landing at the airport, YYYY-MM-DD. Needed for Arrival and Round Trip.",
                "type": "string"
              },
              "arrival_flight": {
                "description": "Arrival flight number, e.g. PR2041.",
                "type": "string"
              },
              "arrival_time": {
                "description": "Scheduled landing time, 24 hour HH:MM, Philippine time.",
                "type": "string"
              },
              "children_with_ph_id": {
                "description": "Child (0 to 5 yrs) with a Philippine ID, travels free",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "children_without_ph_id": {
                "description": "Child (0 to 5 yrs) without a Philippine ID, travels free",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "country": {
                "description": "Country of residence.",
                "type": "string"
              },
              "departure_date": {
                "description": "Date flying out, YYYY-MM-DD. Needed for Departure and Round Trip.",
                "type": "string"
              },
              "departure_flight": {
                "description": "Departure flight number, e.g. 5J895.",
                "type": "string"
              },
              "departure_time": {
                "description": "Scheduled take off time, 24 hour HH:MM, Philippine time.",
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "hotel": {
                "description": "Hotel or resort on Boracay where the traveller is staying.",
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "package": {
                "description": "Package name from list_boracay_airport_transfers. Defaults to \"Standard Transfer\", which most travellers book.",
                "type": "string"
              },
              "seniors_with_ph_id": {
                "description": "Senior (60 and up) with a Philippine senior or PWD ID, 20% off",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "seniors_without_ph_id": {
                "description": "Senior (60 and up) without a Philippine ID, adult rate",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "trip_type": {
                "description": "Arrival = airport to hotel, Departure = hotel to airport, Round Trip = both.",
                "enum": ["Arrival", "Departure", "Round Trip"],
                "type": "string"
              }
            },
            "required": ["trip_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking link for a Boracay transfer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d653d56dcf0bc1fb33bb040f3916a0f983b121e782abc23bb5e6db95369bfa2"
        },
        {
