{
  "lockfileVersion": 2,
  "subjects": {
    "com.ppn-hub/ppn-hub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ppn-hub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ppn-mcp-gateway",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "environment_brief",
          "description": "Environmental brief for one location: fans out to every public geo-aware API (weather, terrain, environment, …) and returns a merged JSON. Partial results come back with an errors[] list. Requires 'Authorization: Bearer ppn_live_*'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Optional human-readable place label (echoed back)",
                "type": "string"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5082ea30da83be661e6b2e730908a884eb458d2bc4d5d0890e9a708d8d23e12"
        },
        {
          "name": "execute_api",
          "description": "Execute a request against any of the 60 registered APIs. Use search_apis first to find the correct api name and operationId. Requires 'Authorization: Bearer ppn_live_*'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api": {
                "description": "API name: sanken-matrix-gateway, marketo, atmos, chronomap, hydros, lithos, terra, carbon-credit, cost-compare, demand-forecast, grid-connect, site-matching, storage-optimize, tariff-optimize, transmission-loss, carbonias, planetary, green-path-api, biomassia, gasturbia, geothermia, hydria, reactoria, renewio, solaria, windaria-api, hydrogen, sla-viewer-production, nanobase-api, nanosnap-console, nanosnap-gacha-production, nanosnap-inventory-production, nanosnap-leaderboard-production, nanosnap-mailbox-production, nanosnap-persona-gateway-production, nanosnap-presence-production, nanosnap-replay-production, nanosnap-room-production, nanosnap-save-data-production, nanosnap-spatial-message-production, nanosnap-world-counter-production, nanosnap-world-objects-production, biositia, cryonia, faunaunify, literatia, plantunify, ppn-hub-workers, foodsense, onokoro, sakurahub-address, sakurahub-gateway, sakurahub-web, weathio, biolexia-production, biocolo, nishinoshima-gateway-production, celestora, orbitalio, perks",
                "type": "string"
              },
              "body": {
                "description": "Request body for POST/PUT/PATCH"
              },
              "operationId": {
                "description": "operationId from search_apis results",
                "type": "string"
              },
              "params": {
                "additionalProperties": {},
                "description": "Query and path parameters as key-value pairs",
                "type": "object"
              }
            },
            "required": ["api", "operationId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d6bd810b819c88e0e99c42eb70fa35d5a6323f97ac59c7919a7b0d6c89f2c28"
        },
        {
          "name": "search_apis",
          "description": "Search across 519 endpoints in 60 APIs (amenomi, cultural, earth, energy-calc, green-path, harmonias, hydrogen, internal, nanobase, nanosnap, natura, platform, sakurahub, science, sim, space, stocks). Returns matching endpoints with method, path, summary, parameters, and a ready-to-run example. Use this to discover available API endpoints before calling execute_api. Results carry a \"coverage\" field (e.g. [\"JP\"]) for region-limited APIs; use the \"region\" filter to narrow.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Filter by domain: amenomi, cultural, earth, energy-calc, green-path, harmonias, hydrogen, internal, nanobase, nanosnap, natura, platform, sakurahub, science, sim, space, stocks",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default: 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "method": {
                "description": "Filter by HTTP method",
                "enum": ["GET", "POST", "PUT", "DELETE", "PATCH"],
                "type": "string"
              },
              "query": {
                "description": "Search term (matches operationId, summary, description, path, API name, tags; synonyms expanded)",
                "type": "string"
              },
              "region": {
                "description": "Filter by ISO 3166-1 alpha-2 region the API serves data for (e.g. \"JP\"). Returns region-specific + global APIs; excludes APIs limited to other regions.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "tag": {
                "description": "Filter by OpenAPI tag",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b022f1bb6b2ce828a117d4ff67c49571dcde437b272bd7a52499a2a2e01e3f3"
        }
      ],
      "digest": "sha256:29722a9d5e8ff17b01dc901098e4f1bc519b18765ac515237ae9b05c73eb021e"
    }
  }
}
