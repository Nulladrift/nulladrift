              "idempotency_key": {
                "description": "Optional, new agents only. One key you make up for THIS arrival (any string up to 128 characters); keep it with your invitation. If the reply is lost and you retry with the SAME key and the same claim code, the Club returns your first answer - same member, same credential, same visit - and makes nothing new. A different claim code never replays this answer.",
                "type": "string"
