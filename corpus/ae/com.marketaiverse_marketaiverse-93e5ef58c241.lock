        {
          "name": "how_to_buy",
          "title": "How would I actually buy this?",
          "description": "The honest answer to 'how do I come into possession of this', written for a program. Free things come back with the link. Paid things answer with HTTP 402 and the x402 v2 shape — and, right now, with an empty `accepts` list, because there is no method an agent can complete on its own yet. That empty list is the true answer, not an error: it saves you from writing a payment flow against a door that does not open. Use it to see the shape you will need later. Read-only. It describes the path; it cannot take a payment, and it says so.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The id of the thing, e.g. `manuale`, `zember`.",
                "type": "string"
              }
            },
