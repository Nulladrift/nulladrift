          "name": "search_shelf",
          "title": "Search the shelf",
          "description": "Search everything on the MarketAIVerse shelf: things for sale, free things, and free tools made by other people that we collected. Returns what each thing is, who made it, the price, and whether we measured it. If a number is missing, that means we have not measured it — it is not an error. Read-only. No match is an empty list, not an error.",
