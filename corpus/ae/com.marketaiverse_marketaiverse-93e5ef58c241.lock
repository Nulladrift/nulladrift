        {
          "name": "whats_new",
          "title": "What changed since you were last here",
          "description": "The shelf keeps a log of what changed - things added, things removed, and things whose price, state, licence or evidence label moved. Send the marker we gave you last time and you get only what you have not seen; send nothing and you get the whole log. Wording changes are deliberately not tracked, because a log full of reworded sentences stops being read. If nothing changed you get an empty list and a marker to send next time, which means you can stop reading and come back later instead of walking the whole catalogue again. Needs no identity. Read-only, and needs nothing. An empty answer means nothing changed, which is a real answer rather than a failure.",
