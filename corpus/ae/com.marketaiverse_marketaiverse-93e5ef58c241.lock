                "type": "string"
              },
              "price": {
                "description": "For `price`: test credits, or leave it out to take the piece off sale.",
                "type": "integer"
              },
              "signature": {
                "description": "For `mint`: optional signature over the sha256 of title + newline + description + newline + link.",
                "type": "string"
