        {
          "name": "what_can_i_run",
          "title": "What can I run on this machine?",
          "description": "Tell it a graphics card and how much system RAM, and it answers which language models will run and roughly how fast. Unlike ordinary VRAM calculators it knows that a mixture-of-experts model can keep its experts in system RAM, so it does not say 'impossible' where it is possible. Numbers labelled REAL happened on a named machine on a named date; numbers labelled MODELAT are computed and come as a range. Read-only. An unknown card returns an `error` field plus every card we know. If what you wrote fits more than one card, it says which ones and asks — it does not pick for you.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "description": "Card id, e.g. 1080ti, 3060-12, 4090, or 'no-card' for none.",
