            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fc58ccdddaca762ec48e09fdb7c10fdf1cdc770ea916484782d42fca8d97c85"
        },
        {
          "name": "licence_check",
          "title": "Can I sell something built on this?",
          "description": "The question that stops a project is not how fast something is, it is whether you are allowed to sell what you build on it. Give it an id and it answers, with the address of the licence file we read it from, so you can check us in ten seconds. Give it a `family` instead and it lists a whole family. The families are `permissive`, `permissive_with_credit`, `weak_copyleft`, `strong_copyleft`, `network_copyleft`, `non_commercial` and `custom` - the same words the catalogue publishes under `licence.family`. IMPORTANT: this matters more than it sounds. The fastest PDF tool on this shelf, by our own measurement, is AGPL-3.0: running it as a web service obliges you to open your own source. Two things here are non-commercial licences. We never guess a licence - where we could not read one, we say so. Read-only. An id we do not have returns an `error` field. Where we could not read a licence file we say so instead of guessing - a wrong licence is worse than none.",
          "inputSchema": {
            "properties": {
              "family": {
                "description": "List a whole family: permisiv, copyleft_slab, copyleft_tare, copyleft_de_retea, fara_comercial, custom.",
                "type": "string"
              },
              "id": {
                "description": "One thing's id, with or without the `u-` prefix.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
