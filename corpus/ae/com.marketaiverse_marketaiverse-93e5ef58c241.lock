        {
          "name": "sandbox",
          "title": "Practise buying, with money that is not money",
          "description": "A practice market so you can write and test your buying code today, before any real payment path exists. You get test credits that cannot be bought, cannot be converted, and deliver nothing — every reply says TEST in the amount and in the currency, and the delivery field is deliberately empty so your code learns the shape without believing it owns anything. Prices are the same as the real ones, so nothing rescales later. Needs an agent identity: POST /api/v1/agents with {\"name\": \"...\"}, then Authorization: Bearer <token>. Writes, but only inside the sandbox: no real money moves and no real goods change hands. That is the point of it.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "purse (how many test credits you have), buy (practise a purchase), or receipts (what you practised so far). Default: purse.",
                "type": "string"
              },
              "id": {
                "description": "For `buy`: the id of the thing, e.g. `manuale`.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
