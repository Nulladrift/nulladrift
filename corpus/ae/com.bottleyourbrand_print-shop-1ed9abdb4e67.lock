        {
          "name": "order_label_artwork",
          "title": "Order custom labels",
          "description": "Turn an image into a print-ready Bottle Your Brand label or sticker (wine, beer, water bottle, dropper bottle, square or rectangle sticker) and get an order link. Resizes any image — AI-generated art, a photo, a logo — to the label's exact size, adds the 0.125\" bleed, checks resolution, and returns a preview plus a link that opens the product page with the file attached. Takes a public https URL to a PNG, JPG or WebP. Show the customer the preview and any warnings before they order. If warnings mention a plain margin, call again with trim_border true. If a filled_gap warning says part of the label is filled with an extension of the image's edges, offer to regenerate the artwork at the label's shape (from get_label_specs) so it fills edge to edge. When the image is a file in the chat with no public URL, use upload_label_artwork instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fit": {
                "description": "Leave unset (auto) unless the customer asks for something specific. auto fills the label edge to edge, cropping when that loses 15% or less of the image; otherwise it keeps the whole design reaching the cut line on two sides and extends its edges into the rest. cover always crops to fill. fill always keeps the whole design. contain is only for a small logo on a plain background that should sit inside the label with space around it.",
                "enum": ["auto", "cover", "fill", "contain"],
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the image (PNG, JPG, or WebP).",
                "type": "string"
              },
              "orientation": {
                "description": "rectangle-sticker only: auto (default) prints vertical when the image is portrait.",
                "enum": ["auto", "landscape", "portrait"],
                "type": "string"
              },
              "position": {
                "description": "cover only: which part of the image to keep when cropping (default center).",
                "enum": ["center", "top", "bottom", "left", "right", "smart"],
                "type": "string"
              },
              "product": {
                "description": "Product: wine, beer, water (wrap-around water bottle label), dropper, square-sticker or rectangle-sticker (all-purpose square/rectangle stickers and labels for jars, boxes, bags, candles, etc.).",
                "enum": ["wine", "beer", "water", "dropper", "square-sticker", "rectangle-sticker"],
                "type": "string"
              },
              "size": {
                "description": "Size in inches, WxH. Defaults to the most popular. wine: 3.5x4; beer: 4x3.5; water: 8.25x1.75 or 8x2.125; dropper: 3x2; square-sticker: 3x3 or 2x2 or 4x4 or 5x5; rectangle-sticker: 3x2 or 4x2 or 4x3 or 6x4",
                "type": "string"
              },
              "trim_border": {
                "description": "Remove a plain margin/padding around the artwork first (default: true for contain, false for cover).",
                "type": "boolean"
              }
            },
            "required": ["image_url", "product"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cropped_pct": {
                "description": "Percent of the image cut off to fit the label shape.",
                "type": "number"
              },
              "effective_dpi": {
                "type": "number"
              },
              "expires_at": {
                "type": "string"
              },
              "fit": {
                "type": "string"
              },
              "full_size_with_bleed": {
                "type": "string"
              },
              "mockup_url": {
                "description": "The label wrapped on a real bottle photo (wine, beer and dropper labels).",
                "type": ["string", "null"]
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "order_url": {
                "description": "Link that opens the product page with the print-ready file attached.",
                "type": "string"
              },
              "orientation": {
                "type": "string"
              },
              "preview_url": {
                "description": "Preview with the cut line (magenta), safe zone (dashed blue) and bleed (shaded).",
                "type": ["string", "null"]
              },
              "print_file": {
                "type": "string"
              },
              "print_pdf": {
                "type": "string"
              },
              "print_quality": {
                "enum": ["good", "acceptable", "low"],
                "type": "string"
