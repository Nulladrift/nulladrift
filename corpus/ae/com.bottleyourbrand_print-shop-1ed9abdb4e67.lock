              "orientation": {
                "type": "string"
              },
              "preview_url": {
                "description": "Preview with the cut line (magenta), safe zone (dashed blue) and bleed (shaded).",
                "type": ["string", "null"]
              },
              "print_file": {
                "type": "string"
              },
              "print_pdf": {
                "type": "string"
