        {
          "name": "order_label_artwork",
          "title": "Order custom labels",
          "description": "Turn an image into a print-ready Bottle Your Brand label or sticker (wine, beer, water bottle, dropper bottle, square or rectangle sticker) and get an order link. Resizes any image — AI-generated art, a photo, a logo — to the label's exact size, adds the 0.125\" bleed, checks resolution, and returns a preview plus a link that opens the product page with the file attached. Takes a public https URL to a PNG, JPG or WebP. Show the customer the preview and any warnings before they order. If warnings mention a plain margin, call again with trim_border true; if heavy cropping cuts off text, regenerate at the shape from get_label_specs or use fit contain. When the image is a file in the chat with no public URL, use upload_label_artwork instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fit": {
                "description": "cover (default) fills the label edge to edge and crops the overflow, for full designs and scenes. contain keeps the whole image inside the label and extends its background, for logos and wide water bottle labels.",
                "enum": ["cover", "contain"],
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the image (PNG, JPG, or WebP).",
                "type": "string"
              },
              "orientation": {
                "description": "rectangle-sticker only: auto (default) prints vertical when the image is portrait.",
                "enum": ["auto", "landscape", "portrait"],
                "type": "string"
              },
              "position": {
                "description": "cover only: which part of the image to keep when cropping (default center).",
                "enum": ["center", "top", "bottom", "left", "right", "smart"],
                "type": "string"
              },
              "product": {
                "description": "Product: wine, beer, water (wrap-around water bottle label), dropper, square-sticker or rectangle-sticker (all-purpose square/rectangle stickers and labels for jars, boxes, bags, candles, etc.).",
                "enum": ["wine", "beer", "water", "dropper", "square-sticker", "rectangle-sticker"],
                "type": "string"
              },
              "size": {
                "description": "Size in inches, WxH. Defaults to the most popular. wine: 3.5x4; beer: 4x3.5; water: 8.25x1.75 or 8x2.125; dropper: 3x2; square-sticker: 3x3 or 2x2 or 4x4 or 5x5; rectangle-sticker: 3x2 or 4x2 or 4x3 or 6x4",
                "type": "string"
              },
              "trim_border": {
                "description": "Remove a plain margin/padding around the artwork first (default: true for contain, false for cover).",
                "type": "boolean"
              }
            },
            "required": ["image_url", "product"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cropped_pct": {
                "description": "Percent of the image cut off to fit the label shape.",
                "type": "number"
              },
              "effective_dpi": {
                "type": "number"
              },
