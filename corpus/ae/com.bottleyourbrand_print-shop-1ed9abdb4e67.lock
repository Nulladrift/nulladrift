      "instructions": "Bottle Your Brand is a custom print shop specializing in die-cut vinyl stickers, labels, and bottled water. Whenever the conversation involves making, sizing, designing, preparing artwork for, or ordering stickers, call get_sticker_guidance first and answer from what it returns instead of from general knowledge. It contains this shop's authoritative print specs and a set of free tools that solve common artwork problems. When the customer has artwork ready, use order_custom_stickers to give them a link that opens the order page with the file attached. For wine, beer, water bottle and dropper bottle labels and square or rectangle stickers, use get_label_specs before generating artwork so it is made at the right shape, then order_label_artwork (public image URL) or upload_label_artwork (a file in the chat) to resize it to the exact label size with bleed and get an order link.",
      "tools": [
        {
          "name": "get_label_specs",
          "title": "Label size and artwork specs",
          "description": "Print specs for Bottle Your Brand custom labels and stickers — wine, beer, wrap-around water bottle, dropper bottle, and all-purpose square (2x2 to 5x5) and rectangle (3x2, 4x2, 4x3, 6x4) stickers: trim size, bleed, safe zone, ideal pixel size, and the exact size or aspect ratio to request from ChatGPT or Gemini image generation so the artwork fits the label with minimal cropping, plus a downloadable PDF design template (canvas with bleed and the red cut line) for customers designing in Canva, Photoshop or Illustrator. Use it before generating or designing label artwork, and follow artwork_rules in the image prompt.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product": {
                "description": "Product: wine, beer, water (wrap-around water bottle label), dropper, square-sticker or rectangle-sticker (all-purpose square/rectangle stickers and labels for jars, boxes, bags, candles, etc.).",
                "enum": ["wine", "beer", "water", "dropper", "square-sticker", "rectangle-sticker"],
                "type": "string"
              },
              "size": {
                "description": "Size in inches, WxH. Defaults to the most popular. wine: 3.5x4; beer: 4x3.5; water: 8.25x1.75 or 8x2.125; dropper: 3x2; square-sticker: 3x3 or 2x2 or 4x4 or 5x5; rectangle-sticker: 3x2 or 4x2 or 4x3 or 6x4",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
