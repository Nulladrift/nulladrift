    "com.nomadweather.www/climate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.nomadweather.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nomadweather-climate",
        "title": "NomadWeather climate",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Monthly weather averages (2015-2025) and air-quality averages (2023-2025) for about 100 digital nomad bases. Answers include a link to the place page. Averages, not a forecast.",
      "tools": [
        {
          "name": "best_months",
          "description": "Returns the top 3 months for dry, warm, cool, sunny or clean-air weather in one place among about 100 digital nomad bases worldwide, with the numbers and the rule used.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "Place name, e.g. \"Hanoi\"",
                "type": "string"
              },
              "what": {
                "description": "What to optimise for. clean-air only exists for 20 places.",
                "enum": ["dry", "warm", "cool", "sunny", "clean-air"],
                "type": "string"
              }
            },
            "required": ["place", "what"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e93160d35fdc1050befece160f7ba169ed580cd0f6b7ee9d11b89675913c4c8d"
        },
        {
          "name": "climate_by_month",
          "description": "Returns the 12 monthly climate averages (high and low °C, rain mm, rain days, cloud %, humidity %) for one place among about 100 digital nomad bases worldwide.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "Place name, e.g. \"Lisbon\" or \"Chiang Mai, Thailand\"",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f5ea30d5c466789d91f40b807b673332a7c8776184a7fcb9ae008e07af21fcd"
        },
        {
          "name": "smoke_by_month",
          "description": "Returns the 12 monthly PM2.5 air-quality averages and their bands (clear, hazy, smoky, very smoky) for 20 nomad bases in Asia and Mexico, such as Chiang Mai, Hanoi and Bangkok.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "Place name, e.g. \"Chiang Mai\"",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3e04cd161710b088f2be79bfeb45e041f8a7bcc0f0ec357ceee6b8fd0faed08"
        }
      ],
      "digest": "sha256:15ade4c27bcecdc35045ddc3a0ceb6bb5135870a988916b94654dd3e7a8532a2"
    }
  }
