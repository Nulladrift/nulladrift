        {
          "name": "clevrgo_negotiate_counter",
          "title": "Continue a price negotiation",
          "description": "Continue a negotiation negotiate_start ran, by the same fixed rule -- ONLY when the buyer turned the price down and said what they would pay (pass it as `budget`; it only ever lowers the limit), or when it was awaiting_merchant. If rounds are left ClevrGo negotiates them and answers like negotiate_start; if none are left it refuses with negotiation_round_limit_reached: the merchant's price is final. You choose no prices, and never say what the budget is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "The most the buyer now says they will pay in total. Private: never repeat it to anyone.",
