        {
          "name": "clevrgo_flight_search",
          "title": "Search flights",
          "description": "Search one-way or round-trip flights. Resolve both ends with flight_regions first and copy its fields as returned -- code, is_city, city_code and country_code -- never guess them. Prices come back in US dollars.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "cabinClass": {
                "description": "economy, premium_economy, business or first.",
                "type": "string"
              },
              "children": {
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "departDate": {
                "description": "Date as YYYY-MM-DD.",
                "type": "string"
              },
              "fromCityCode": {
                "description": "city_code of the origin from flight_regions, when it has one.",
                "type": "string"
              },
              "fromCode": {
                "type": "string"
              },
              "fromCountryCode": {
                "description": "Two-letter country_code of the origin, from flight_regions. For a city, take it from its airports.",
                "type": "string"
              },
              "fromIsCity": {
                "type": "boolean"
              },
              "infants": {
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "nonstop": {
                "type": "boolean"
              },
              "returnDate": {
                "description": "Date as YYYY-MM-DD.",
                "type": "string"
              },
              "toCityCode": {
                "description": "city_code of the destination from flight_regions, when it has one.",
                "type": "string"
              },
              "toCode": {
                "type": "string"
              },
              "toCountryCode": {
                "description": "Two-letter country_code of the destination, from flight_regions. For a city, take it from its airports.",
                "type": "string"
              },
              "toIsCity": {
                "type": "boolean"
              }
            },
            "required": ["adults", "departDate", "fromCode", "fromCountryCode", "toCode", "toCountryCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
