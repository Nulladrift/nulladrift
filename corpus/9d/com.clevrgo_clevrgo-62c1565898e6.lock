        {
          "name": "clevrgo_request_flight_aftersales",
          "title": "Prepare a flight change or refund",
          "description": "Prepare a cancellation, a change / upgrade (改签 / 升舱) or a refund (退票) of one of the buyer's own flight orders, when the buyer asks for it. Use the order's reference from flight_orders (bf1). This opens that order's after-sales panel in ClevrGo, filled in with what the buyer told you; ClevrGo then shows the supplier's quote and the BUYER confirms it there. Nothing is cancelled, changed or refunded by this call: never say it is done. cancel is for an order not yet ticketed; change and refund are for a ticketed one. Pass reason only when the buyer gave one -- never pick it for them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "cancel an unticketed order; change (also for an upgrade to a higher cabin); refund a ticketed one.",
                "enum": ["cancel", "change", "refund"],
                "type": "string"
              },
              "cabinClass": {
                "description": "For change: only the cabin the buyer named (商务舱 = BUSINESS, 头等舱 = FIRST). When they just say upgrade / 升舱 without naming one, leave it out or ask -- never pick FIRST for them. One cabin's results say nothing about another's: no First fares does not mean no Business fares.",
                "enum": ["ECONOMY", "PREMIUM_ECONOMY", "BUSINESS", "FIRST"],
                "type": "string"
              },
              "departDate": {
                "description": "For change: the new departure date the buyer asked for, YYYY-MM-DD.",
                "type": "string"
              },
              "orderRef": {
                "description": "The flight order's reference from flight_orders, e.g. 'bf1'.",
                "type": "string"
              },
              "reason": {
                "description": "For refund, only when the buyer said why: 0 personal reasons, 1 illness, 2 flight changed by the airline, 3 emergency / crisis, 4 visa refused.",
                "enum": [0, 1, 2, 3, 4],
                "type": "integer"
              }
            },
            "required": ["action", "orderRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
