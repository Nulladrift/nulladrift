          "title": "Accept a negotiated price",
          "description": "Accept the merchant's current offer in a negotiation -- ONLY after the buyer said yes to that price (you asked them once, after negotiating). ClevrGo refuses it above the buyer's budget. This agrees the price (a deal); nothing is ordered or paid. Then order it with buy_product.",
