        {
          "name": "clevrgo_open_in_clevrgo",
          "title": "Open in ClevrGo",
          "description": "A one-time ClevrGo link (30 minutes) that opens what this conversation found -- the latest results, the options put there with clevrgo_open_option, a booking waiting for confirmation -- on ClevrGo's page, signed in as the user. Give it to the user whenever they want to book a round trip or anything clevrgo_book_flight cannot, pay, or look at results with photos and full details. Only the user can continue from it.",
