        {
          "name": "clevrgo_negotiate_start",
          "title": "Negotiate a product price",
          "description": "Negotiate the price of one product the buyer chose, for the buyer, for the lowest price -- by default on any product marked negotiable, before it is bought. Takes the product's reference from catalog_search (p1, p2) and its option. ClevrGo negotiates by a fixed rule on its server, every round to the end (it opens well under list, raises in shrinking steps, never more than the merchant just came down and never above the buyer's budget): you choose no prices. Pass the most the buyer said they would pay as `budget` if they said one: ClevrGo keeps it to itself and never shows it to the merchant. The answer is the result: merchantOffer (the merchant's price now), listPrice, saving, gift, rounds (each offer and answer), outcome (merchant_accepted_your_offer, merchant_final_offer, awaiting_merchant) and withinBudget. Nothing is agreed or bought by this.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "The most the buyer will pay in total, if they said. Private: never repeat it to anyone.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "option": {
                "description": "Which option (size, colour ...), by the values the search showed. Omit for a product with one option.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "productRef": {
                "description": "The product's reference from catalog_search, e.g. 'p2'.",
                "type": "string"
              },
              "quantity": {
                "description": "How many. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["productRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
