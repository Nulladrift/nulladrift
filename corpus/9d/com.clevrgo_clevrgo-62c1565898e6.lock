        {
          "name": "clevrgo_my_coupons",
          "title": "The user's ClevrGo coupons",
          "description": "The user's merchant coupons in ClevrGo: what each takes off (a free order, an amount, a percentage), which shop it is for, until when, and whether it can be used now. Each only works at its own shop. clevrgo_buy_product applies the best usable one by itself and its summary shows the coupon and the total after it; a free order needs no payment or signature. Call this when the user asks about their coupons or wants to pick one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "merchantId": {
                "description": "Only this shop's coupons. Omit for all.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
