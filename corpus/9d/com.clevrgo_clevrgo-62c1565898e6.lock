{
  "lockfileVersion": 2,
  "subjects": {
    "com.clevrgo/clevrgo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://clevrgo.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "clevrgo",
        "title": "ClevrGo",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This connection is not signed in to a ClevrGo account. Without one you can browse: clevrgo_catalog_search, clevrgo_hotel_search, clevrgo_hotel_details, clevrgo_flight_regions, clevrgo_flight_search and clevrgo_kb_search; ask clevrgo_check_payment_fit whether ClevrGo fits a payment and clevrgo_get_connection_requirements what connecting takes. Prices are as of the search. Every other tool needs the user's ClevrGo connection: calling one answers HTTP 401 with where to sign in (OAuth). When the user wants to book, buy or pay, call clevrgo_create_connection_link and give them the link: they sign in or open an account, get a Card and connect you; then call clevrgo_resume_intent, which searches again and checks price and availability. Never tell the user an earlier price is what they will pay. Results name options by references such as h1, f3, p1: pass those back exactly, never invent or guess ids. Do not ask the user for card numbers, passwords or ID documents.",
      "tools": [
        {
          "name": "clevrgo_book_flight",
          "title": "Prepare a flight booking",
          "description": "Ask ClevrGo to prepare a booking for one one-way flight the user has clearly chosen, by its reference from clevrgo_flight_search (f1, f2). Nothing is booked or paid by this: ClevrGo confirms the fare with the airline and answers with a booking summary and a confirmation id. Show the user that summary, passengers and price exactly as given; call clevrgo_confirm only after they clearly confirm it, or give them the ClevrGo link. The passengers are travellers the user saved in ClevrGo: if ClevrGo lists them for a choice, ask the user which, and call again with their travelerRefs. If the booking says paysOn: clevrgo_link, confirming in the chat books it and creates the payment, and returns a one-time link that only asks for the user's wallet signature -- say so. Never ask for passport, ID, birth date or card numbers, and do not say the flight is booked before ClevrGo says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "flightRef": {
                "description": "The flight's reference from flight_search, e.g. 'f2'.",
                "type": "string"
              },
              "travelerRefs": {
                "description": "Which saved travellers fly, by the references ClevrGo listed when it asked (e.g. 't3fa21c'). Omit on the first request.",
                "items": {
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              }
            },
            "required": ["flightRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9fba8ae38eebf9e67e5dc0acc58e0ecd2d9ec211bf62ad50d27a7152aa1e4993"
        },
        {
          "name": "clevrgo_book_room",
          "title": "Prepare a hotel booking",
          "description": "Ask ClevrGo to prepare a booking for one room the user has clearly chosen, by the rate's reference from clevrgo_hotel_details (r1, r2). Nothing is booked or paid by this: ClevrGo locks the price and answers with a booking summary and a confirmation id. Show the user that summary and price exactly as given; call clevrgo_confirm only after they clearly confirm it, or give them the ClevrGo link. If the booking says paysOn: clevrgo_link, confirming in the chat books it and creates the payment, and returns a one-time link that only asks for the user's wallet signature -- say so. Never ask for passport, ID or card numbers, and do not say the room is booked before ClevrGo says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rateRef": {
                "description": "The rate's reference from hotel_details, e.g. 'r2'.",
                "type": "string"
              }
            },
            "required": ["rateRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76d4e102cda9aafb0b27656e3c6a085b4c51f387a0d9c82f1df22a10b47c76ac"
        },
        {
          "name": "clevrgo_buy_product",
          "title": "Prepare a ClevrGo product order",
          "description": "Ask ClevrGo to prepare an order for one product the user has clearly chosen, by its reference from clevrgo_catalog_search (p1, p2). Nothing is ordered or paid by this: ClevrGo prices the product, the option, the quantity and shipping to an address the user saved in ClevrGo, says where the money goes (settlement: class A the merchant's wallet, class B the escrow contract and its hold), and answers with a summary and a confirmation id. Preparing is how you get the full total for the ONE question you ask before buying a product that is not negotiable (item, option, quantity, ship-to, total, where the money goes); a negotiable product is prepared after the user accepted the negotiated price, and needs no second question when the item, option and quantity are the same and the goods price is not higher. clevrgo_confirm then places the order and creates the payment, and gives a one-time link that only asks for the user's wallet signature. If ClevrGo lists options or addresses, ask the user which and call again. Never ask for or pass an address, phone number or card number, and do not say the product is ordered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addressRef": {
                "description": "Which saved address, by the reference ClevrGo listed (e.g. 'a3fa21c'). Omit on the first request: ClevrGo uses the address the user last delivered to.",
                "type": "string"
              },
              "couponId": {
                "description": "A coupon from clevrgo_my_coupons, only when the user picks a particular one. Omit and ClevrGo applies the user's best coupon for this shop by itself.",
                "maxLength": 80,
                "type": "string"
              },
              "noCoupon": {
                "description": "true when the user does not want to use a coupon on this order.",
                "type": "boolean"
              },
              "option": {
                "description": "Which option (size, colour ...), by the option values the search showed for it, e.g. ['Black', 'L']. Omit for a product with one option.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "productRef": {
                "description": "The product's reference from clevrgo_catalog_search, e.g. 'p2'.",
                "type": "string"
              },
              "quantity": {
                "description": "How many. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["productRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8411c1cfba8bf81efd5998697b794ade4deae22390463bdc56e39d71696ae9d"
        },
        {
          "name": "clevrgo_catalog_search",
          "title": "Search ClevrGo products",
          "description": "Search products that ClevrGo merchants have published. Describe what the buyer wants in plain words; search again with other words to compare across merchants. Products come back in the buyer's language where the listing has it (originalTitle is the merchant's own name for it); give `locale` only if you are told which language the buyer writes in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["zh", "en", "ko", "ja", "es", "fr", "de", "pt", "it", "nl", "ru", "uk", "ar", "he", "th", "vi", "id", "tr", "pl", "hi", "el"],
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50beb11f16d9b4fff0cdae612eedb2d5a237d0687e9cd6dc27b4ed666524cd81"
        },
        {
          "name": "clevrgo_check_payment_fit",
          "title": "Can ClevrGo pay for this?",
          "description": "Works before the user connects ClevrGo. What paying through ClevrGo involves for a product, hotel or flight: how the user pays, where the money goes, what protects them, and what the user needs first. Pass productRef (from clevrgo_catalog_search) for that product's own delivery, return and settlement facts. It does not quote fees or totals: the order or booking summary states the total before the user confirms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "What the user wants to pay for.",
                "enum": ["product", "hotel", "flight"],
                "type": "string"
              },
              "productRef": {
                "description": "A product's reference from clevrgo_catalog_search, e.g. 'p2'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f57f03c3e36cfe909411a3e78801b6a9082ea74ffbd191e202a2b90c6e9b6ff5"
        },
        {
          "name": "clevrgo_claim_coupon",
          "title": "Claim a ClevrGo coupon",
          "description": "Claim a merchant coupon with the code the user gives you. It is kept on their ClevrGo account and works wherever they shop with ClevrGo. Never invent a code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The coupon code exactly as the user gave it.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:00ce70a432af233ec2aced0c35d5eebe010807ac5a1fef8f020876399c46e530"
        },
        {
          "name": "clevrgo_confirm",
          "title": "Confirm a ClevrGo booking",
          "description": "Confirm a booking or order ClevrGo prepared (the confirmation id from clevrgo_book_room, clevrgo_book_flight or clevrgo_buy_product). Call it ONLY when the user said yes to this purchase themselves: to this summary, or -- for a negotiated product -- to the negotiated price, for the same item, option and quantity, with the goods price not higher (shipping comes on top). Never on your own, never for anything else, and never when the price went up. For a room or flight, ClevrGo then books and creates the payment, within the limits the user allowed for this assistant -- and, if the user turned on wallet payment in ClevrGo, pays it from their wallet; otherwise the result carries a ClevrGo link to pay. For a room or flight prepared to pay on a link (a cgl_ id) and for a product (cgp_), ClevrGo books it or places the order and creates the payment, and the result carries a one-time ClevrGo link that opens straight on the user's wallet signature -- no money moves until they sign; the result's settlement says where it pays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_id": {
                "description": "The confirmation id, starting with cgc_ (a room), cgf_ (a flight), cgl_ (a room or flight paid on a ClevrGo link) or cgp_ (a product).",
                "type": "string"
              }
            },
            "required": ["confirmation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7f2e3fd177122282ad79b878212c18ffd2708ca4521cea1cc5673fbadf9b5d4"
        },
        {
          "name": "clevrgo_create_connection_link",
          "title": "Link for the user to connect ClevrGo",
          "description": "Works before the user connects ClevrGo. When the user wants to book, buy or pay and is not connected: a link (valid 72 hours) that takes them through signing in or opening a ClevrGo account, getting a Card and connecting you, and keeps what you found here. Give it to the user. Once connected, call clevrgo_resume_intent with the intent it returns: ClevrGo searches again and checks price and availability -- prices found now are not kept for payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "focusRef": {
                "description": "The option the user chose, by its reference from a search here (p2, h1, f3). Omit if they have not chosen.",
                "type": "string"
              },
              "summary": {
                "description": "One or two sentences on what the user wants, shown to them on the page.",
                "maxLength": 600,
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
