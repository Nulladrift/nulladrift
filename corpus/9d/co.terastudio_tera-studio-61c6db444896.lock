{
  "lockfileVersion": 2,
  "subjects": {
    "co.terastudio/tera-studio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://terastudio.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "tera-studio",
        "title": "Tera Studio",
        "version": "1.0.0",
        "description": "Find a song's key and tempo, move it to a key that fits your voice, and start hearing songs in your own voice.",
        "websiteUrl": "https://terastudio.co"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tera Studio helps people sing. Use find_song_key when someone names a song and wants its key, tempo or vocal range, find_song_key_and_tempo when they want the key or BPM of a song file they have, shift_song_key when a song is too high or too low for their voice, and get_own_voice_song_instructions when they want to hear a song sung in their own voice. find_song_key_and_tempo and shift_song_key open a small tool where the person chooses the file; it is read in their browser and is never uploaded to Tera Studio or into the chat. Tera Studio only uses a person's own voice, never a celebrity's or anyone else's.",
      "tools": [
        {
          "name": "find_song_key",
          "title": "Look up a song’s key by title",
          "description": "Look up the key, tempo (BPM) and typical vocal range of a well-known song by its title, in Tera Studio's song list (key and tempo from AcousticBrainz's analyses of the recording). Returns the key with its relative key, how many analyses agree on it, the BPM when they agree, an estimated range, and links to the song's page and to the key changer. Use it when someone names a song and asks its key or tempo, or whether it suits their voice. Pass semitones if they want it higher or lower. A song outside the list comes back as not found, with the key finder and key changer for a file they have.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artist": {
                "description": "Who sings it, if the person said; it picks between songs that share a title.",
                "maxLength": 120,
                "type": "string"
              },
              "semitones": {
                "description": "How far to move the song for their voice, from -6 to 6 semitones; negative is lower. Leave it out to keep the original key.",
                "maximum": 6,
                "minimum": -6,
                "type": "integer"
              },
              "title": {
                "description": "The song's title, without the artist.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "key_changer": {
                "format": "uri",
                "type": "string"
              },
              "key_finder": {
                "format": "uri",
                "type": "string"
              },
              "other_matches": {
                "items": {
                  "properties": {
                    "artist": {
                      "type": "string"
                    },
                    "bpm": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "key": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "shifted": {
                "anyOf": [
                  {
                    "properties": {
                      "key": {
                        "type": "string"
                      },
                      "semitones": {
                        "type": "integer"
                      },
                      "typical_range": {
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "song": {
                "anyOf": [
                  {
                    "properties": {
                      "artist": {
                        "type": "string"
                      },
                      "bpm": {
                        "anyOf": [
                          {
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "key": {
                        "type": "string"
                      },
                      "key_analyses_agree": {
                        "type": "string"
                      },
                      "key_confidence": {
                        "enum": ["high", "medium"],
                        "type": "string"
                      },
                      "relative_key": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      },
                      "typical_range": {
                        "properties": {
                          "estimate": {
                            "type": "boolean"
                          },
                          "high": {
                            "type": "string"
                          },
                          "low": {
                            "type": "string"
                          },
                          "span": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "required": ["artist", "bpm", "key", "key_confidence", "relative_key", "title", "typical_range"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "song_page": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["found", "key_changer", "other_matches", "shifted", "song", "song_page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a song’s key by title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Song looked up",
            "openai/toolInvocation/invoking": "Looking up the song…"
          },
          "digest": "sha256:bdd2974c009d8bfd93b57fd31f467f7b6e856e9b031c5a51b361dbb2f6834d40"
        },
        {
          "name": "find_song_key_and_tempo",
          "title": "Find a song’s key and tempo",
          "description": "Find the musical key (major or minor, with its relative key) and the tempo in BPM of a song file the person has. Opens a small Tera Studio tool where they choose the file; it is analysed in their browser and never uploaded. Use it when someone asks what key or BPM a song is in, or wants to know before singing, mixing or practising it. It reads only the file and doesn't identify or play songs; find_song_key looks up a well-known song by its title.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audio": {
                "type": "string"
              },
              "semitones": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": -6,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "start_song": {
                "format": "uri",
                "type": "string"
              },
              "view": {
                "enum": ["key_and_tempo", "change_key"],
                "type": "string"
              },
              "web_tool": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["audio", "start_song", "view", "web_tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a song’s key and tempo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://tera-studio/song-key-v1.1.2.html",
            "openai/toolInvocation/invoked": "Key and tempo finder ready",
            "openai/toolInvocation/invoking": "Opening the key and tempo finder…",
            "ui": {
              "resourceUri": "ui://tera-studio/song-key-v1.1.2.html"
            }
          },
          "digest": "sha256:8b9a8e261b0ab5428579cab9fbf781d0e854001bed75ffe34887f35337a0a21b"
        },
        {
          "name": "get_own_voice_song_instructions",
          "title": "Get own-voice song instructions",
          "description": "Explain how to hear a song sung in the person's own voice with Tera Studio, and give them the link to start. They create an account on terastudio.co, sing for about a minute, add a song they have the rights to use, and hear it back in their voice. Use it when someone wants to hear themselves sing a song, make a cover in their own voice, or turn a song into a gift in their voice. It returns steps and a link and creates nothing. Tera Studio only uses the person's own voice: not for celebrity or other people's voices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The language the song is sung in, if they said.",
                "maxLength": 40,
                "type": "string"
              },
              "occasion": {
                "description": "What it's for, if they said: a birthday, a wedding, a gift.",
                "maxLength": 60,
                "type": "string"
              },
              "song_title": {
                "description": "The song they want to hear in their voice, if they named one.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "consent": {
                "type": "string"
              },
              "start_song": {
                "format": "uri",
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["consent", "start_song", "steps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get own-voice song instructions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Link ready",
            "openai/toolInvocation/invoking": "Getting your link…"
          },
          "digest": "sha256:f9dbc2b90663e55c680a9de9ed3d957d83793d3fae8948463475abd5809fb886"
        },
        {
          "name": "shift_song_key",
          "title": "Change a song’s key",
          "description": "Move a song the person has up or down by up to 6 semitones, keeping its speed, so it fits their voice, and play it back. Opens a small Tera Studio tool where they choose the file; the change happens in their browser and nothing is uploaded. Use it when a song is too high or too low for someone. Pass semitones if they said how far (negative is lower); otherwise they choose in the tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "semitones": {
                "description": "How far to move the song, from -6 to 6 semitones; negative is lower. Leave it out to let the person choose.",
                "maximum": 6,
                "minimum": -6,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audio": {
                "type": "string"
              },
              "semitones": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": -6,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "start_song": {
                "format": "uri",
                "type": "string"
              },
              "view": {
                "enum": ["key_and_tempo", "change_key"],
                "type": "string"
              },
              "web_tool": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["audio", "start_song", "view", "web_tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Change a song’s key"
