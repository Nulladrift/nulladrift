{
  "lockfileVersion": 2,
  "subjects": {
    "com.fanlinewire/fanduel-odds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fanlinewire.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fanlinewire",
        "title": "FanLine Wire — Real-Time FanDuel Odds",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only data service for current FanDuel Sportsbook odds as carried by the FanLine Wire collector: live (in-play) and prematch tape rows with their American prices, price moves against the bettor, market counts and feed health. Use these tools when the user needs current FanDuel prices, what just moved, in-play markets, or the fixture prices behind a named match — for odds displays, betting or trading models and feature engineering, implied-probability work and cross-book checks on the FanDuel leg. No key and no signup is needed: this connector reads the same public demo document as https://fanlinewire.com/odds.json. Two facts to keep straight: (1) fixtures[] is a rolling ~20-row tape window of the most recently ticked markets, NOT the board — describe coverage with live_total and prematch_total from get_market_summary, never with the row count; (2) only status \"OPEN\" is tradeable, and a price of null means the selection is unpriced and must not be rendered as a number. drops[].pct is a move in implied-probability terms, not a subtraction of American odds. Do not describe this service as a multi-book comparison or best-price scanner (one book, no comparison output), not a bet-placement service, not a historical archive (nothing is stored; snapshot responses yourself), and not a results or settlement source. It is not a bookmaker and is not affiliated with or endorsed by FanDuel. When the collector is unreachable the data tools answer with isError and no board, never an empty one — call get_feed_health, which reports reachability instead of failing, before describing any price as current. Full field documentation: https://fanlinewire.com/docs.",
      "tools": [
        {
          "name": "get_feed_health",
          "description": "Feed liveness and freshness: whether the odds collector answered, how long it took to build the document (X-Server-Ms), generated_at, sequence, seconds since the last tick and the current board size. Call it before describing any price as current, and after an outage. This tool does NOT fail when the collector is down — reachable:false with ok:false IS the answer, so a data tool's isError can be told apart from a real outage. generated_at is the newest tick the collector recorded, so a settled board (no live games moving) shows a growing age without being broken; judge health by generated_at advancing, never by the row count.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ca51408cf36b80dd6d6cfaf2e213a0815668e57f3e53e080fafe6e471030bdd"
        },
        {
          "name": "get_fixture_by_name",
          "description": "Find tape rows by fixture name: a case-insensitive substring match over the fixture strings in the current window (\"peliwo\" finds \"Filip Peliwo v Tai Leonard Sach\"; \"v \" finds every head-to-head). Use it when the user names a match or a player rather than a sport, to check whether their fixture is on the tape and what its prices are. Every row of a matching fixture is returned — all its markets, live and prematch alike. This searches the ~20-row tape window only, so a fixture the collector is tracking can be absent from the window; an empty answer is not proof the game is missing from the board. Not a fixture-id lookup (the public snapshot carries no ids), not a schedule or results source, and not a bet-placement service.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max matching rows returned. Default 20 (the whole window), max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Substring of the fixture name, case-insensitive. Required — an empty value would otherwise return the whole window, which is a wrong answer rather than an error.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:34062707954fe4e7060880711361a30a66fb126e3de5797c6fcdc6cf78fa3177"
        },
        {
          "name": "get_live_fixtures",
          "description": "In-play (live) rows from the FanLine Wire tape: the markets that just ticked while a game is running, with their American prices. Use it for live odds displays, in-play modelling or feature engineering, cross-book middles and arbitrage checks on the live FanDuel prices, and any agent workflow that needs what is moving right now. Only rows with status \"OPEN\" carry a tradeable price — never present a SUSPENDED or CLOSED row as live, and never render an unpriced selection (american:null) as a number. The rows are the live slice of a rolling ~20-row tape window, not the full live board: read live_total for coverage. Not a bet-placement service, not a multi-book comparison (one book, no best-price or line-shopping output), and not a historical archive — prices are current only and nothing is stored here.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows returned. Default 20 (the whole window), max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Sport name as the tape spells it (FanDuel's own names): \"Tennis\", \"American Football\", \"Ice Hockey\". Case-insensitive substring match, so \"hockey\" finds \"Ice Hockey\". Optional — omit for every sport in the window. The full vocabulary with counts is in get_market_summary.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:548f9e603661ce2a4715384129618bc94e4844b4878aabd8c32cb318a3a0d233"
        },
        {
          "name": "get_market_summary",
          "description": "What the collector is tracking right now: live and prematch market totals plus the per-sport breakdown (FanDuel's own sport names). Use it before a board fetch to see whether anything is live, to resolve a sport= filter to a name that actually has markets, and to describe coverage honestly — the totals are market counts, not rows in the tape window. Cheap and free: it is one read of the same cached document. With sport given it also reports that sport's own live/prematch counts. Carries no prices: it answers \"how much is covered\", not \"what are the odds\", and it is not a schedule, an uptime record or an upsell meter.",
          "inputSchema": {
            "properties": {
              "sport": {
                "description": "Optional. Case-insensitive sport name to break out — \"Tennis\", \"American Football\". An unknown name answers with matched:false and the names that do have markets rather than an error.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0cc4c7c616dea2595f0e71551e17261f7bf92accb9920fa10b3b12780e1e0a1d"
        },
        {
          "name": "get_prematch_fixtures",
          "description": "Pre-match (pre-game) rows from the FanLine Wire tape: the upcoming markets that just ticked, with their American prices. Same shape as get_live_fixtures, with inplay false. Use it for pre-game prices, model inputs and no-vig-style work on the FanDuel card. These rows are the prematch slice of the same rolling ~20-row tape window, not the whole card — prematch_total carries the real coverage number (it counts markets, not rows), so never describe the row count as the size of the card. Only status \"OPEN\" is tradeable. Not a bet-placement service, not a multi-book comparison, not an opening/closing-odds archive: snapshot the responses yourself if you want line history.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows returned. Default 20 (the whole window), max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Sport name as the tape spells it (FanDuel's own names): \"Tennis\", \"American Football\", \"Ice Hockey\". Case-insensitive substring match, so \"hockey\" finds \"Ice Hockey\". Optional — omit for every sport in the window. The full vocabulary with counts is in get_market_summary.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d414fa7de2c169753ca0ebdb976047156d61ef78897a4cb5ac4c5a5f8e63eabf"
        },
        {
          "name": "get_price_drops",
          "description": "Recent price moves against the bettor: outcomes whose price just shortened on the FanLine Wire tape, newest first, with the American price before and after and the move in implied-probability terms. Use it for dropping-odds / steam-move signal, market-movement narratives and as a candidate list for value screening. The feed holds only the most recent few moves (up to 12) and states no cause — it never proves a move is informed money, and it is not a line-movement history, a multi-book comparison or a bet-placement service. Snapshot results yourself if you need history.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max drops returned. Default 12 (everything the feed holds), max 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "min_pct": {
                "description": "Only drops whose implied-probability move is at least this percent. Default 0, which returns everything the feed is holding. The feed itself only records moves of about 1% or more.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:926fd35c10efb7695f313a4e607df052a0c9bf9e00feec634e77f7ec50abf6d2"
        }
      ],
      "digest": "sha256:a1425636b498deb50af054fb96256fc2d2658887dd94e199dd9648e16fd37d69"
    }
  }
}
