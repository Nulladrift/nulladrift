{
  "lockfileVersion": 2,
  "subjects": {
    "com.partpacket/quotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://partpacket.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "partpacket",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One upload, live fabrication estimates. Currently FDM STL through Slant 3D and Craftcloud. Prices exclude shipping/tax and show a separate PartPacket fee. No provider orders or payments. Keep quoteAccessToken private.",
      "tools": [
        {
          "name": "create_quote",
          "description": "Upload a part and obtain live manufacturing estimates. Files are sent to eligible providers and retained privately for seven days. Only FDM STL in millimeters is currently live. Does not order or pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Optional FDM color. A bare material defaults to black.",
                "type": "string"
              },
              "countryCode": {
                "description": "ISO two-letter country, default US. Shipping is not yet rated.",
                "type": "string"
              },
              "file_base64": {
                "description": "Base64 STL bytes, at most 8 MiB decoded.",
                "type": "string"
              },
              "file_name": {
                "type": "string"
              },
              "material": {
                "description": "Material, e.g. PLA, PETG or OPM. Combined forms such as PLA black also work.",
                "type": "string"
              },
              "process": {
                "enum": ["fdm", "sheet-metal", "tube", "3d-print", "cnc"],
                "type": "string"
              },
              "quantity": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["file_base64", "file_name", "material", "process", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:826c849a0eddd9b381a34f92f33055b1a1c560fb32c09fba17347cd8998f31c2"
        },
        {
          "name": "get_quote",
          "description": "Retrieve a saved quote with its private quote access token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "quoteAccessToken": {
                "type": "string"
              }
            },
            "required": ["id", "quoteAccessToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25f2aac2085e1861eceb2fb621e26da80852fffa1097466bc31bf2d5f2554109"
        },
        {
          "name": "list_providers",
          "description": "List connected fabrication providers, supported files and connection status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:347621f9d210a1683233ff28e8bdf313545f980135508228add9414e07cb0c1f"
        },
        {
          "name": "request_order_review",
          "description": "Request human review of a saved quote. Requires quoting access token and contact email. Never places a provider order or takes payment. Unavailable until review notifications are connected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contactEmail": {
                "format": "email",
                "type": "string"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "quoteAccessToken": {
                "type": "string"
              },
              "quoteId": {
                "type": "string"
              },
              "quoteRequestId": {
                "type": "string"
              }
            },
            "required": ["contactEmail", "quoteAccessToken", "quoteId", "quoteRequestId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63c7effeeba663d26618e9253ecba7f8c3aebfd9bd89c720ad8e38027dff3798"
        }
      ],
      "digest": "sha256:555a96a2c4769d13f730eabe30a791fdcae34c11d902d64108e075c2797ac5b8"
    }
  }
}
