{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.vaeo/reports": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vaeo.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "vaeo",
        "title": "Vaeo AI Discovery Reports",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vaeo measures how often AI assistants (ChatGPT, Gemini, Perplexity, Meta AI, Claude, and Grok) name a local Australian business when people ask for one in its suburb, and which web pages the AIs read. Steps: 1) find_business, 2) get_questions (the questions and the price), 3) order_report gives a Stripe payment link: give it to the person, who pays on Stripe's page; the report is emailed to them. 4) check_order with the order_key until it is \"done\" (a report takes some minutes), then get_report or ask_about_report. Reports are counts from many answers in one test, not one answer, and not a promise.",
      "tools": [
        {
          "name": "ask_about_report",
          "title": "One part of the report",
          "description": "One part of a finished report, from the saved results (no new AI questions, no cost). Topics: short_answer, who_the_ais_named (who is named more), each_ai, each_question, pages_the_ais_read (which sites to get on), website, start_here (what to do first).",
          "inputSchema": {
            "properties": {
              "order_key": {
                "description": "The order_key that order_report gave.",
                "type": "string"
              },
              "topic": {
                "enum": ["short_answer", "who_the_ais_named", "each_ai", "each_question", "pages_the_ais_read", "website", "start_here"],
                "type": "string"
              }
            },
            "required": ["order_key", "topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b94bb496270387041c56b8529b4a99ec91426f2f1b7a92e12c6be246d9d15c7f"
        },
        {
          "name": "check_order",
          "title": "Check an order",
          "description": "Where an order is: not paid yet, being made, waiting, in its final check, done, or failed.",
          "inputSchema": {
            "properties": {
              "order_key": {
                "description": "The order_key that order_report gave.",
                "type": "string"
              }
            },
            "required": ["order_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00288accfdebfd9c80612047934701276489c05735849b81f74ae73aeacc2f20"
        },
        {
          "name": "find_business",
          "title": "Find a business",
          "description": "Search Google Maps for an Australian business by name and suburb, for example \"Corner Dental Newtown\". Gives each match's place_id for get_questions and order_report.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Business name and suburb.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a301d57f2218bbff2e4ebd737f0ca69f47f92aecd0b3d5e68ee0f649b2d5514a"
        },
        {
          "name": "get_questions",
          "title": "Questions and price",
          "description": "For one business: its details, our trade for it, the questions a report asks the AIs, and the price in A$.",
          "inputSchema": {
            "properties": {
              "place_id": {
                "description": "From find_business.",
                "type": "string"
              },
              "trade": {
                "description": "Optional. One of list_trades, when ours for the business is wrong or missing.",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fe033e5873a8bae46bf329a5d46071357bc70d71e92732f15a4eee4bd7d13484"
        },
        {
          "name": "get_report",
          "title": "Read the report",
          "description": "The finished report as data: how often the AIs named the business, its place among the businesses they named, each AI, each question, the sites the AIs cited, its website check, and \"Start here\" (at most 3 things to do first, each with the fact and count behind it).",
          "inputSchema": {
            "properties": {
              "order_key": {
                "description": "The order_key that order_report gave.",
                "type": "string"
              }
            },
            "required": ["order_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:812f0c75543c96c43809f9c0f5d8525dd8fcc83ead8bdfbe26e4f2e85c28d0b3"
        },
        {
          "name": "list_trades",
          "title": "Trades we report on",
          "description": "The kinds of business Vaeo makes reports for. A business of another kind cannot be ordered yet.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59378960cce2ff4f461ed81e4673c27f336d99dbc7fe7e7c010008fc55464be4"
        },
        {
          "name": "order_report",
          "title": "Order a report",
          "description": "Start an order and get a Stripe payment link. Nothing is charged here: the person opens the link and pays on Stripe's page, and gets the report by email. Give the person the link and the price. Keep the order_key to follow the order. With compare_with_place_id (a business of the same trade in the same suburb): two reports and a comparison.",
          "inputSchema": {
            "properties": {
              "compare_with_place_id": {
                "description": "Optional. A second business to compare with.",
                "type": "string"
              },
              "place_id": {
                "type": "string"
              },
              "trade": {
                "description": "One of list_trades.",
                "type": "string"
              },
              "trade_questions": {
                "description": "Optional. Labels of the trade questions from get_questions. Without it: the usual 2. The 8 general questions are always asked; 16 questions at most.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["place_id", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c028281968cd2c87db15bbdbc65e33c3f9d4c767c559362ab9a84c9c8198280e"
        }
      ],
      "digest": "sha256:3523e26dd5637896e179267f27665f28f1c32683de744434f927e033458a879d"
    }
  }
