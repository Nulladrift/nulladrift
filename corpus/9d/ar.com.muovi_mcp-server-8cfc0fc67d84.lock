      },
      "instructions": "Muovi marketplace tools. Call `muovi_list_services` and `muovi_list_cities` first to discover slugs, then `muovi_search_professionals`, which needs both a service and a barrio and returns up to 5 professionals per page: if the person has not said which service and which barrio, ask them. Every tool is read-only except `muovi_create_task_draft`, which saves a task draft and returns a link: the person opens it, reviews the draft, signs in and publishes the task themselves, so do not tell them a task was published. Before saving a draft, call `muovi_get_service_requirements` for the service and collect the required fields it lists; a draft missing a required answer comes back with the questions to ask and no link. A draft whose `urgency` is `flexible` is complete without the date. Ask one question per message and wait for the answer before asking the next. Also ask what a professional would need to quote this specific job, skip anything the person already said, and write those details into `description`; no list of job questions is prescribed. Do not ask the optional fields as a list; when what the person has told you, at any point in the conversation, gives an optional field's value, send it in `slots` as well as writing it in `description`. A draft with every required answer opens on a review form with those answers filled in, unless Muovi's assistant has a question of its own for the person, and the person confirms the address on Muovi's map after opening the link, before publishing; a draft with only a description opens Muovi's assistant, which asks the person its questions. `muovi_create_task_link` builds a link to Muovi's task creation for one professional from the search, without saving anything. Contact info (phone, email, whatsapp) is not returned by any tool.",
      "tools": [
        {
          "name": "muovi_create_task_draft",
          "title": "Create task draft",
          "description": "Save a task draft on Muovi for the person you are helping, and get back a link for them. The person opens the link, reviews the draft, signs in to Muovi and publishes it themselves. This tool publishes nothing and does not notify any professional. To hand over the full request, call `muovi_get_service_requirements` for the service first and collect the required fields it lists, asking one question per message and waiting for the answer before asking the next. A draft whose `urgency` is `flexible` is complete without the date. Also ask what a professional would need to quote this specific job, skip anything the person already said, and write those details into `description`; no list of job questions is prescribed. Send the answers in `slots` (keyed by slot key) with `location`. Do not ask the optional slots as a list; when what the person has told you, at any point in the conversation, gives an optional slot's value, send it in `slots` as well as writing it in `description`. If a required answer is missing, the result has `status: \"incomplete\"`, lists the questions still to ask and carries no link: ask them one per message and call again with every answer. If a value is not accepted, the result has `status: \"invalid_slots\"` and names each slot. A draft with every required answer opens on a review form with those answers filled in, without asking them again, unless Muovi's assistant has a question of its own for the person, and the person confirms the address on Muovi's map after opening the link, before publishing. Sending only `description` still saves a draft, and that link opens Muovi's assistant, which asks the person its questions. To direct the draft to one professional, pass `professional_id`, the `id` of any result from `muovi_search_professionals`: when the person publishes it, the task goes to that professional first for 24 hours and then opens to everyone, unless `open_to_others` is true, in which case it opens to everyone right away and that professional is still told. Set `open_to_others` from what the person chose; they can change it on the review form. A ProSite slug in `professional_slug` is still accepted instead of `professional_id`. Leave both out for a general request to get offers from several professionals. `service_slug` comes from `muovi_list_services`. A link nobody has opened expires 24 hours after it is created. The first person to open it takes the draft, signed in or not, and can reopen the link for up to 7 days, so give it only to that person. Do not include phone numbers, email addresses or other contact details in any text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_amount": {
                "description": "Optional. The person's budget in ARS, as a positive number.",
                "type": "number"
              },
              "description": {
                "description": "What the person needs done, in their words, with the job details a professional would need to quote it: 20 to 2000 characters.",
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "additionalProperties": false,
                "description": "Optional. Where the job is: `neighborhood_slug`, `address`, or both. The address is saved as text; the person confirms the place on the map on Muovi.",
                "properties": {
                  "address": {
                    "description": "A street address as text, 3 to 200 characters.",
                    "type": "string"
                  },
                  "city_slug": {
                    "description": "Optional, with neighborhood_slug. A city slug from `muovi_list_cities`.",
                    "type": "string"
                  },
                  "neighborhood_slug": {
                    "description": "A neighborhood slug from `muovi_list_cities`.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "open_to_others": {
                "description": "Optional, with professional_id. True when the person also wants offers from other professionals right away; false or omitted gives the chosen professional the first 24 hours.",
                "type": "boolean"
              },
              "preferred_date": {
                "description": "Required with preferred_time \"specific_date\", otherwise omitted. YYYY-MM-DD, from today up to 90 days ahead (Argentina time).",
                "type": "string"
              },
              "preferred_time": {
                "description": "Optional. When the person wants it done. Use \"specific_date\" together with `preferred_date`.",
                "enum": ["flexible", "this_week", "next_week", "specific_date"],
                "type": "string"
              },
              "professional_id": {
                "description": "Optional. The `id` of a professional from `muovi_search_professionals` to direct the draft to. Omit for a general request.",
                "type": "string"
              },
              "professional_slug": {
                "description": "Optional. A ProSite slug from an older link, instead of professional_id.",
                "type": "string"
              },
              "service_slug": {
                "description": "The service slug (from `muovi_list_services`), e.g. \"electricidad\".",
                "minLength": 1,
                "type": "string"
              },
              "slots": {
                "additionalProperties": true,
                "description": "Optional. The person's answers, keyed by slot key from `muovi_get_service_requirements`. Send each value in the slot's `value_format`.",
                "type": "object"
              },
              "time_preferences": {
                "description": "Optional. The parts of the day that suit the person.",
                "items": {
                  "enum": ["morning", "midday", "afternoon", "evening"],
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Optional. A short title for the task, 5 to 80 characters. Left out, Muovi takes it from the description.",
                "type": "string"
              },
              "zone_text": {
                "description": "Optional. Where the job is, as free text (neighborhood or area), up to 120 characters.",
                "type": "string"
              }
            },
            "required": ["description", "service_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create task draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e6474567fa84f838649c57beb00b2b96cbf802886f05158d630bb79b1ff66f3"
        },
        {
          "name": "muovi_create_task_link",
          "title": "Create task link",
          "description": "Build a link that opens Muovi's own task creation for one professional and one service: pass the `id` of a result from `muovi_search_professionals` as `professional_id`, and a service slug from `muovi_list_services`. Any professional in the search results can be picked. When the person publishes the task, it goes to that professional first for 24 hours and then opens to everyone; on the form the person can choose to also receive offers from other professionals right away. The link opens Muovi's task form, not the professional's ProSite. This tool makes no network call and saves nothing: give the URL to the person, who completes the task on Muovi.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "professional_id": {
                "description": "The `id` of a professional from `muovi_search_professionals`.",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "service_slug": {
                "description": "The service slug to start the task with (from `muovi_list_services`).",
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["professional_id", "service_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create task link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f57479cfd573090967da6ccb6e9d030435203428fb597455b49a4dd71a34735d"
        },
        {
          "name": "muovi_get_professional",
          "title": "Get professional",
          "description": "Fetch the full public profile of one Muovi professional by the `id` from `muovi_search_professionals`. Returns display name, headline, bio, portfolio image URLs, specialties, city and neighborhoods, services, ratings, verifications, and `profile_url`, the professional's public profile page on Muovi. Phone, email and WhatsApp are not returned. When presenting the professional, name only the checks Muovi has verified among identity, matrícula, background check (antecedentes) and phone, and never say that one is missing or not verified. To start a task for this professional, use `muovi_create_task_link` or `muovi_create_task_draft` with this `id` as `professional_id`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The professional's `id` from `muovi_search_professionals`. A ProSite slug from an older link is also accepted.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get professional"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66ac1399199315795e362a8bac25631bcde237f2b74c82cb14653223383d089e"
        },
        {
          "name": "muovi_get_reviews",
          "title": "Get reviews",
          "description": "Fetch paginated reviews for one Muovi professional by the `id` from `muovi_search_professionals`, sorted most-recent first. Each review has a 1-5 rating, an optional title and free-text comment, the author's reduced display name (e.g. \"María G.\" — full surnames are not returned), the author role (`client` or `worker`), the service category the review is associated with, and an ISO `created_at` timestamp. Use this to surface social proof when recommending a professional.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The professional's `id` from `muovi_search_professionals`. A ProSite slug from an older link is also accepted.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of reviews per page (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Zero-based offset into the review list for pagination.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41b388671b94e8cc5437249da53497b4d15dea69145f5880b108baa0b5b7d2e2"
        },
        {
          "name": "muovi_get_service_requirements",
          "title": "Get service requirements",
          "description": "List the fields Muovi takes for one service, to read before calling `muovi_create_task_draft`. Pass a `service_slug` from `muovi_list_services`. Each slot has a `key`, the question in Spanish (`question_es`), a `type`, the accepted `options` for a choice, a `value_format` saying what to send, whether it is `required`, and an `ask_if` condition when it only applies after another answer. Collect every `required` slot, asking one question per message and waiting for the answer before asking the next. A draft whose `urgency` is `flexible` is complete without the date. The other slots are optional: do not ask them as a list; when what the person has told you, at any point in the conversation, gives an optional slot's value, send it in `slots` as well as writing it in `description`. Also ask what a professional would need to quote this specific job, skip anything the person already said, and write those details into the `description` of `muovi_create_task_draft`; no list of job questions is prescribed. Send the answers back keyed by slot `key` in the `slots` argument of `muovi_create_task_draft`. The person confirms the address on Muovi's map after opening the draft link. `photo_policy` says whether photos help; photos are added by the person on Muovi, not through this server. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service_slug": {
                "description": "The service slug (from `muovi_list_services`), e.g. \"plomeria\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["service_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get service requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:205d0fca4952aa1133dbe99bac6fe49539094befc821f1e233033543e2fe2a94"
        },
        {
          "name": "muovi_list_cities",
          "title": "List cities",
          "description": "List every Argentine city Muovi serves, with active neighborhoods nested under each. Each city has a stable `slug` (used as the `city` parameter on `muovi_search_professionals`) and a human-readable `name`. Each neighborhood has its own `slug` (used as the `neighborhood` parameter on `muovi_search_professionals`). Call this when you need to resolve a user's location wording to a Muovi city or neighborhood slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2c33030f3332fefb9ae71ada0bd91a08d5992b0b90a172dd3908afd497058789"
        },
        {
          "name": "muovi_list_services",
          "title": "List services",
          "description": "List every service category Muovi supports in Argentina — home trades (electricidad, plomería, gas, pintura, carpintería, cerrajería, albañilería, herrería, techista), limpieza, jardinería, aire acondicionado, and moving/hauling: mudanzas (movers) and fletes (light freight/hauling). Every listed professional is identity-verified and reviewed, with on-platform payment and dispute resolution. Each entry has a stable `slug` (used as the `service` parameter on `muovi_search_professionals` and `muovi_create_task_link`), a human-readable `name`, an optional description, and a `requires_matricula` flag indicating whether listed professionals must hold a verified professional license. Call this first when you need to map a user's natural-language request to a Muovi service slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:44f88f7e9a10b1d4b2c1f757b5dd1f85fdff475fc58d7be9db6222a83a982110"
        },
        {
          "name": "muovi_search_professionals",
          "title": "Search professionals",
          "description": "Find up to 5 Muovi professionals per page for one service in one barrio. Both `service` (a slug from `muovi_list_services`) and `neighborhood` (a barrio slug from `muovi_list_cities`) are required: if the person has not said which service they need and in which barrio, ask them before searching. Every professional returned has a coverage area that includes the searched barrio, and `match` in the response names the service, barrio and city searched: present the results as professionals who work in that barrio. Results list professionals who declare the searched trade first, ordered by review score, with verified identity, background check and a matrícula or diploma counting toward it; professionals whose registered business is in another trade come last. Each result has a `display_name`, a `headline`, a photo (`avatar_url`), one `rating` and one `review_count`, `verifications`, up to 3 `portfolio` image URLs, an `id` and a `profile_url`, the professional's public profile page on Muovi; no phone, email or WhatsApp is returned. Where the client shows Muovi's card view, each professional's photo and portfolio images appear in it. Do not write images or image markdown: write a short text summary of each professional with the name, the headline, the rating with its review count and a link to `profile_url`, leaving out a field that is empty; for each professional, name only the checks Muovi has verified among identity, matrícula, background check (antecedentes) and phone, and never say that one is missing or not verified. After showing the results, offer the person two choices: a task for one professional (`muovi_create_task_link`, or `muovi_create_task_draft` with `professional_id`, passing that result's `id`), or a general request to get offers from several professionals (`muovi_create_task_draft` without a professional). When the person asks for more professionals and `pagination.has_more` is true, call again with the same arguments and the next `page` (up to 3). When `has_more` is false there is no next page: do not say Muovi has no more professionals; offer a general request (`muovi_create_task_draft` without a professional) so other professionals can send offers. Never state how many professionals exist. Use `muovi_get_professional` with the `id` for the full profile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional. City slug (e.g. \"caba\"), needed only when a barrio slug exists in more than one city.",
                "minLength": 1,
                "type": "string"
              },
              "has_matricula": {
                "description": "When true, only return professionals with a verified matrícula on file (electricians, gas fitters, etc.).",
                "type": "boolean"
              },
              "neighborhood": {
                "description": "Required. Barrio slug (e.g. \"palermo\"), from `muovi_list_cities`.",
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Optional. 1 (default), 2 or 3: the next 5 professionals of the same search. Pass the next page only when the previous response had `pagination.has_more` true.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "Required. Service slug (e.g. \"plomeria\"), from `muovi_list_services`.",
                "minLength": 1,
                "type": "string"
              },
              "verified_identity": {
                "description": "When true, only return professionals whose identity Muovi has verified.",
                "type": "boolean"
              }
            },
            "required": ["neighborhood", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search professionals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
