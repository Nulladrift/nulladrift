          "title": "Request consultation (legacy)",
          "description": "Legacy alias for submit_consultation. Emails the same Cloudflare Email pipeline after confirmed=true. If confirmed is not true, nothing is sent: re-confirm the details with the visitor and retry this call with confirmed set to true. Set dry_run to true to validate the input and return a preview of the email without sending it. Consultation requests are routed through Found For AI (foundforai.com), who will pass them to Goldsberry Orthodontics. The office then contacts the visitor to schedule.",
