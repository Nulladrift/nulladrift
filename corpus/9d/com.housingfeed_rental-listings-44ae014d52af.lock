{
  "lockfileVersion": 2,
  "subjects": {
    "com.housingfeed/rental-listings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://housingfeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "housingfeed",
        "title": "HousingFeed US Rental Listings",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HousingFeed serves US rental listings (apartments, houses, rooms) collected from property managers' own software and websites and from portals, re-read every week. Without a key, search_rentals_sample returns up to 10 live listings per call for a city, state, rent or bedroom range: use it to answer questions with real examples. rent_summary answers what rent costs in a city or ZIP: listing count, median and quartiles by bedrooms. With a HousingFeed key, search_my_feed searches the caller's licensed market file and feed_changes lists what was added, changed or removed this week. Always show the listing's url so the user can open the source.",
      "tools": [
        {
          "name": "feed_changes",
          "title": "My feed: this week's changes",
          "description": "Requires a HousingFeed key. Listings added, changed or removed in the latest weekly update of your feed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change": {
                "description": "Only this kind of change.",
                "enum": ["added", "changed", "removed"],
                "type": "string"
              },
              "limit": {
                "description": "Changes to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many changes (for paging).",
                "minimum": 0,
                "type": "integer"
              },
              "since": {
                "description": "Changes since this earlier version (one of feed_status's changes_from) instead of since the previous week; for a client that missed a week.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e2407a21d2a6da1b63783cf826b26358f9182541ba0261b93685f25dd368c98"
        },
        {
          "name": "feed_status",
          "title": "My feed: status",
          "description": "Requires a HousingFeed key. The current version of your licensed feed: listing count, when it was published, when the next weekly update is due, and how many listings were added, changed and removed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e659837744f78b7b9d0abe2040e2bc6c3b717f5f856c0809b88aa5c68c6a50e"
        },
        {
          "name": "rent_summary",
          "title": "US rent statistics for a city or ZIP",
          "description": "What rent costs right now in one US city or ZIP, no key needed: number of listings and the median, 25th and 75th percentile monthly asking rent, overall and by bedroom count (studio, 1, 2, 3, 4+). Based on listings verified at the source in the last 30 days. Give a state and a city or a ZIP.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beds": {
                "description": "Only this bedroom count: 0 = studio, 4 = four or more.",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "Full city name, e.g. Austin or New York (New York includes its five boroughs). Not a partial match.",
                "type": "string"
              },
              "include_rooms": {
                "description": "true = include rooms in shared homes and per-bed prices (student housing, co-living; both excluded by default).",
                "type": "boolean"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX.",
                "type": "string"
              },
              "zip": {
                "description": "Exact 5-digit ZIP code; use instead of or with city.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:15d3ce70c9f0ebbd6d0ffb97fc913f52fcb615975f99ee7c688d063fbbfbbfb4"
        },
        {
          "name": "search_my_feed",
          "title": "My feed: search listings",
          "description": "Requires a HousingFeed key. Search the listings in your licensed feed by city, ZIP, rent, bedrooms or map box. Returns up to 50 per call with a total; page with offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, partial match.",
                "type": "string"
              },
              "full": {
                "description": "true = every field of each listing, including description and photos.",
                "type": "boolean"
              },
              "limit": {
                "description": "Listings to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_beds": {
                "description": "Maximum bedrooms. Same as min_beds for exactly N.",
                "type": "number"
              },
              "max_lat": {
                "description": "North edge of a map box.",
                "type": "number"
              },
              "max_lng": {
                "description": "East edge of a map box.",
                "type": "number"
              },
              "max_rent": {
                "description": "Maximum monthly rent in USD.",
                "type": "number"
              },
              "min_beds": {
                "description": "Minimum bedrooms; 0 = studio.",
                "type": "number"
              },
              "min_lat": {
                "description": "South edge of a map box.",
                "type": "number"
              },
              "min_lng": {
                "description": "West edge of a map box.",
                "type": "number"
              },
              "min_rent": {
                "description": "Minimum monthly rent in USD.",
                "type": "number"
              },
              "offset": {
                "description": "Skip this many matches (for paging).",
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter US state code.",
                "type": "string"
              },
              "zip": {
                "description": "Exact ZIP code.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8bfc99c6fa4d97ade701a306918093d6eeac354ab1dd881d5e84e241e2154784"
        },
        {
          "name": "search_rentals_sample",
          "title": "Search US rental listings (free sample)",
          "description": "Live US rental listings for an area and budget, no key needed. Returns at most 10 listings per call (rent, beds, baths, size, address, coordinates, photo, source link, days listed). Use a state code and a city for one market; add rent and bedroom limits to narrow it. For complete results a HousingFeed key is needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, partial match, e.g. Brooklyn.",
                "type": "string"
              },
              "max_beds": {
                "description": "Maximum bedrooms. Same as min_beds for exactly N.",
                "type": "number"
              },
              "max_lat": {
                "description": "North edge of a map box.",
                "type": "number"
              },
              "max_lng": {
                "description": "East edge of a map box.",
                "type": "number"
              },
              "max_rent": {
                "description": "Maximum monthly rent in USD.",
                "type": "number"
              },
              "min_beds": {
                "description": "Minimum bedrooms; 0 = studio.",
                "type": "number"
              },
              "min_lat": {
                "description": "South edge of a map box.",
                "type": "number"
              },
              "min_lng": {
                "description": "West edge of a map box.",
                "type": "number"
              },
              "min_rent": {
                "description": "Minimum monthly rent in USD.",
                "type": "number"
              },
              "new_since_days": {
                "description": "Only listings first seen in the last N days (new listings land weekly, Sunday to Tuesday UTC).",
                "type": "number"
              },
              "sort": {
                "description": "best (default): photo and coordinates first, freshest, mixed sources.",
                "enum": ["best", "newest", "cheapest", "rent_desc"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. NY.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f5b10c8aaef7ad49c1c99b0c5a9c9b01f966777f903a464ac0b9788b79b7fa6"
        }
      ],
      "digest": "sha256:3d56f8b14ed8bc4a3abec618e34b517b768a216ddbced170d6d6a2c2e74f3100"
    }
  }
}
