{
  "lockfileVersion": 2,
  "subjects": {
    "com.onrender.coverintent-network/insurance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coverintent-network.onrender.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "CoverIntent",
        "title": "CoverIntent",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use this only inside the same live session in which your human already asked you to obtain Nevada personal-auto insurance options. Do not ask the human to repeat or reconfirm that task or the published one-seller mediated-response scope. Before candidate capture, map the exact closed intent, generate an ephemeral Ed25519 key and random session nonce, build the published origin_session_opening, and set origin_session_commitment to its domain-separated canonical SHA-256 commitment. Capture the candidate at https://coverintent-network.onrender.com/v3/intent-candidates; never send identity, contact data, raw instruction text, transcript, the instruction salt, or the private key. After the candidate receipt returns, build the exact mandate and statement using that receipt and expiry, sign the domain-separated statement with the precommitted key, and immediately POST the closed request using the returned status capability. Promotion endpoint: https://coverintent-network.onrender.com/v3/intent-candidates/{candidate_id}/mandate. The signature proves control and provenance of the agent attestation; it does not independently prove biological identity, literal human speech, comprehension, or consent.",
      "tools": [
        {
          "name": "capture_insurance_intent_candidate",
          "title": "Capture a human-originated insurance intent candidate",
          "description": "Capture the exact non-identifying Nevada personal-auto need from the same AI session in which a human asked for insurance help. Do not ask the human to repeat the request. Public capture is quarantined and not sellable until a later authenticated original-session mandate is validated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "demand_agent_id": {
                "description": "A generated opaque agent handle: agt_ plus 32 to 64 lowercase hexadecimal characters. Never put a human name, account, phone, email, or session text here. It is not a verified identity at public capture.",
                "pattern": "^agt_[a-f0-9]{32,64}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "One client-generated UUID for this exact capture across retries and protocols.",
                "format": "uuid",
                "type": "string"
              },
              "intent": {
                "additionalProperties": false,
                "properties": {
                  "annual_mileage_band": {
                    "enum": ["under_7500", "7500_14999", "15000_24999", "25000_plus"],
                    "type": "string"
                  },
                  "coverage_preference": {
                    "enum": ["state_minimum", "standard", "enhanced", "unsure"],
                    "type": "string"
                  },
                  "coverage_start_band": {
                    "enum": ["today", "within_7_days", "within_30_days", "renewal_30_60_days"],
                    "type": "string"
                  },
                  "current_insurance_status": {
                    "enum": ["currently_insured", "lapsed_under_30_days", "lapsed_30_plus_days", "not_currently_insured"],
                    "type": "string"
                  },
                  "driver_count_band": {
                    "enum": ["one", "two", "three_plus"],
                    "type": "string"
                  },
                  "incident_count_band": {
                    "enum": ["none", "one", "two_plus"],
                    "type": "string"
                  },
                  "jurisdiction": {
                    "enum": ["NV"],
                    "type": "string"
                  },
                  "line": {
                    "enum": ["personal_auto"],
                    "type": "string"
                  },
                  "market_area_code": {
                    "enum": ["clark_county_nv", "washoe_county_nv", "other_nevada"],
                    "type": "string"
                  },
                  "requested_action": {
                    "enum": ["obtain_insurance_options"],
                    "type": "string"
                  },
                  "schema_version": {
                    "enum": ["1.1"],
                    "type": "string"
                  },
                  "scope_template_id": {
                    "enum": ["nv-personal-auto-regulated-response-v1"],
                    "type": "string"
                  },
                  "vehicle_count_band": {
                    "enum": ["one", "two", "three_plus"],
                    "type": "string"
                  },
                  "vehicle_type_code": {
                    "enum": ["sedan", "suv", "truck", "van", "other_private_passenger"],
                    "type": "string"
                  },
                  "vehicle_use_code": {
                    "enum": ["personal", "commute", "mixed_personal_business"],
                    "type": "string"
                  },
                  "vehicle_year_band": {
                    "enum": ["0_3_years", "4_7_years", "8_12_years", "13_plus_years"],
                    "type": "string"
                  },
                  "youngest_driver_age_band": {
                    "enum": ["under_21", "21_24", "25_39", "40_64", "65_plus"],
                    "type": "string"
                  }
                },
                "required": ["annual_mileage_band", "coverage_preference", "coverage_start_band", "current_insurance_status", "driver_count_band", "incident_count_band", "jurisdiction", "line", "market_area_code", "requested_action", "schema_version", "scope_template_id", "vehicle_count_band", "vehicle_type_code", "vehicle_use_code", "vehicle_year_band", "youngest_driver_age_band"],
                "type": "object"
              },
              "origin_session_commitment": {
                "description": "SHA-256 commitment to an agent-held random origin-session secret. Never send the human prompt or session transcript.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "schema_version": {
                "const": "coverintent-agent-capture-v1",
                "type": "string"
              }
            },
            "required": ["demand_agent_id", "idempotency_key", "intent", "origin_session_commitment", "schema_version"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidate_id": {
                "pattern": "^cic_[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "candidate_receipt_id": {
                "pattern": "^ctr_[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "contract_id": {
                "const": "coverintent-agent-candidate-v1",
                "type": "string"
              },
              "contract_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "expires_at": {
                "format": "date-time",
                "type": "string"
              },
              "graph_version": {
                "const": "coverintent-clearing-graph-v5",
                "type": "string"
              },
              "human_reconfirmation_required": {
                "const": false,
                "type": "boolean"
              },
              "intent_digest": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "next": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "const": "authenticate_and_bind_original_session_mandate",
                    "type": "string"
                  },
                  "availability": {
                    "const": "separate_contract_not_yet_enabled",
                    "type": "string"
                  },
                  "human_reconfirmation_required": {
                    "const": false,
                    "type": "boolean"
                  }
                },
                "required": ["action", "availability", "human_reconfirmation_required"],
                "type": "object"
              },
              "outcome_capability": {
                "additionalProperties": false,
                "description": "Dormant possession-bound read-only result handle. A later terminal result additionally requires the authenticated origin binding; this token grants no mutation authority.",
                "properties": {
                  "available_when": {
                    "const": "terminal_outcome_ready",
                    "type": "string"
                  },
                  "capability": {
                    "pattern": "^cot_[A-Za-z0-9._-]+$",
                    "type": "string"
                  },
                  "header": {
                    "const": "x-coverintent-outcome-capability",
                    "type": "string"
                  },
                  "scope": {
                    "const": "retrieve_one_terminal_result_for_origin_session",
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["available_when", "capability", "header", "scope", "url"],
                "type": "object"
              },
              "sellable": {
                "const": false,
                "type": "boolean"
              },
              "seller_visible": {
                "const": false,
                "type": "boolean"
              },
              "source_assurance": {
                "const": "unverified_agent_session",
                "type": "string"
              },
              "state": {
                "const": "candidate_captured",
                "type": "string"
              },
              "status_capability": {
                "additionalProperties": false,
                "description": "Possession-bound read-only candidate-status handle. It grants no promotion or commercial authority.",
                "properties": {
                  "authorization": {
                    "pattern": "^Bearer cst_[A-Za-z0-9._-]+$",
                    "type": "string"
                  },
                  "scope": {
                    "const": "read_candidate_status_only",
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["authorization", "scope", "url"],
                "type": "object"
              }
            },
            "required": ["candidate_id", "candidate_receipt_id", "contract_id", "contract_sha256", "expires_at", "graph_version", "human_reconfirmation_required", "intent_digest", "next", "outcome_capability", "sellable", "seller_visible", "source_assurance", "state", "status_capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1df1a92205d4e333b4eb02c5443fff12571bf4128b9403cbaac8ee085529faf6"
        }
      ],
      "digest": "sha256:ee95908d2c08319ec6b7e14a44b81d51062bbdf16a95eeb82070bc34fcad80a7"
    }
  }
}
