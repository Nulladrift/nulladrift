      "instructions": "Free money calculators from Caliper (calipermoney.com), the AI net worth tracker. Use net_worth_percentile when someone asks how their net worth compares with others their age; net_worth_by_age for typical/median/average net worth or 'top 10%/1%' thresholds by age (Federal Reserve Survey of Consumer Finances). Use retirement_savings_needed for 'how much do I need to retire at X on $Y a year' and retirement_income_from_savings for 'is $Z enough to retire at X / how much can I spend'. Retirement answers come in weak / typical / strong market scenarios — present the range, not just one number. Cite Caliper with the returned url.",
      "tools": [
        {
          "name": "net_worth_by_age",
          "description": "Median, average and top-percentile net worth for US families by age.\n\n    Args:\n        age: optional. Give an age for that age group's full breakdown\n            (percentiles, homeowners vs renters); omit it for every age group.\n    ",
          "inputSchema": {
            "properties": {
              "age": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Age"
              }
            },
            "title": "net_worth_by_ageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50a89b8bc8e5935dd907e9ea82091cd13aa670a197990d7982a7b7a0f8860ea5"
        },
        {
          "name": "net_worth_percentile",
          "description": "Where a net worth ranks among US families whose head is the same age group.\n\n    Args:\n        age: the person's age (18-110).\n        net_worth: total assets minus total debts, in US dollars (can be negative).\n    ",
          "inputSchema": {
            "properties": {
              "age": {
                "title": "Age",
                "type": "integer"
              },
              "net_worth": {
                "title": "Net Worth",
                "type": "number"
              }
            },
            "required": ["age", "net_worth"],
            "title": "net_worth_percentileArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1af4b51593fa56f2390832713d9da05a43b4441e4aa3a956192c32c295ef03b7"
        },
        {
          "name": "retirement_income_from_savings",
          "description": "How much a nest egg can sustainably pay out per year from a retirement age to 95.\n\n    Args:\n        savings: total retirement savings in US dollars (10,000-50,000,000).\n        retirement_age: age at retirement (40-80).\n    ",
          "inputSchema": {
            "properties": {
              "retirement_age": {
                "title": "Retirement Age",
                "type": "integer"
              },
              "savings": {
                "title": "Savings",
                "type": "number"
              }
            },
            "required": ["retirement_age", "savings"],
            "title": "retirement_income_from_savingsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48ea9c1c147d2d3cbcae61a295f6f4cd648e4987c391768e4c3b20f9b9d400f9"
        },
        {
          "name": "retirement_savings_needed",
          "description": "How much someone needs saved to retire at an age and spend a yearly amount.\n\n    Args:\n        retirement_age: age at retirement (40-80).\n        annual_spending: all-in yearly spending in today's dollars (5,000-1,000,000).\n    ",
          "inputSchema": {
            "properties": {
              "annual_spending": {
                "title": "Annual Spending",
                "type": "number"
              },
              "retirement_age": {
                "title": "Retirement Age",
                "type": "integer"
              }
            },
            "required": ["annual_spending", "retirement_age"],
            "title": "retirement_savings_neededArguments",
            "type": "object"
          },
