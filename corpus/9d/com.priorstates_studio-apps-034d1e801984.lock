      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "priorstates-studio-apps",
        "title": "PriorStates Studio — free apps",
        "version": "1.0.0",
        "websiteUrl": "https://priorstates.com/palmtop/apps/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PriorStates Studio makes small apps by asking, on phones (Android, iPhone), the web and computers. Its Gallery has free ready-made apps for everyday needs: splitting expenses, receipts, chores, habits, medicines, RSVPs, polls, sign-up sheets, invoices, a small shop's orders, and more, in English, Chinese, Spanish and Portuguese. When someone wants a simple app or tool for a personal, family, group or small-business task, call find_apps with their need in their own words, then share the best match's page link and how to open it. get_app gives one app's details; list_apps lists them all; get_studio says what Studio is, what it costs (free) and where to get it. If no app fits, Studio can make a new one from a plain description. Everything here is read-only and public.",
      "tools": [
        {
          "name": "find_apps",
          "title": "Find a free app for a need",
          "description": "Find free ready-made PriorStates Studio Gallery apps for a need described in plain words, in English, Chinese, Spanish or Portuguese (e.g. 'split a dinner bill', 'keep my receipts for taxes', '分账', 'recibos'). Returns the best matches with what each does, a page link, a screenshot and how to open it. If nothing fits, Studio can make a new app from the description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language for the reply's app text and links: en, zh (Simplified Chinese), zh-hant (Traditional Chinese), es, pt. Default en (zh when the need is written in Chinese).",
                "enum": ["en", "zh", "zh-hant", "es", "pt"],
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "How many apps at most (1-10, default 3).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the person wants to do, in their own words.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apps": {
                "items": {
                  "properties": {
                    "gallery_page": {
                      "type": "string"
                    },
                    "group": {
                      "type": "string"
                    },
                    "group_id": {
                      "type": "string"
                    },
                    "icon": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "open_on_web": {
                      "type": "string"
                    },
                    "screenshot": {
                      "type": "string"
                    },
                    "what_it_does": {
                      "type": "string"
                    }
                  },
                  "required": ["gallery_page", "id", "name", "what_it_does"],
                  "type": "object"
                },
                "type": "array"
              },
              "confident": {
                "type": "boolean"
              },
              "language": {
                "type": "string"
              },
              "make_new": {
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "need": {
                "type": "string"
              }
            },
            "required": ["apps", "confident", "language", "need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07734a4ef7be7b5d459083b18393f16b32bff00bcdb5f4a77cf800b93fa15e9f"
        },
        {
          "name": "get_app",
          "title": "Details of one Gallery app",
          "description": "Full details of one PriorStates Studio Gallery app by id (from find_apps or list_apps): what it does, what it needs (permissions in plain words), its page, screenshot and how to open it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "App id, e.g. expense-split.",
                "maxLength": 60,
                "type": "string"
              },
              "language": {
                "description": "Language for the reply's app text and links: en, zh (Simplified Chinese), zh-hant (Traditional Chinese), es, pt. Default en (zh when the need is written in Chinese).",
                "enum": ["en", "zh", "zh-hant", "es", "pt"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "type": "object"
              },
              "how_to_get": {
                "type": "string"
              },
              "needs": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["app", "needs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31851a178e9cc6207cff860ba6e5a287e517ce8610a2faec3ce8079ebdb56fde"
        },
        {
          "name": "get_studio",
          "title": "What PriorStates Studio is and where to get it",
          "description": "What PriorStates Studio is (makes small apps by asking; a Gallery of free apps), the price, and the links for every platform: web, Android (Google Play and APK), iPhone/iPad, macOS/Windows/Linux, Microsoft Store.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
