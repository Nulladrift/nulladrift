          "digest": "sha256:83e9464ffb18f73a5472441d0d4b7a938eed3a0d3924f2701c3eb23797783c48"
        },
        {
          "name": "list_apps",
          "title": "All free Gallery apps",
          "description": "Every free app in the PriorStates Studio Gallery, by group (money, side business, home, health, learning, groups, work). Optional group filter by id or name.",
          "inputSchema": {
