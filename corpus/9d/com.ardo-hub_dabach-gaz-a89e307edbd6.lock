          "name": "ardo_check_status",
          "description": "בדיקת מצב של בקשה שנשלחה לעסק: sent_to_business (ממתינה לאישור), confirmed (אושרה), rejected (נדחתה), expired (לא נענתה בזמן), countered (העסק הציע חלופה; ההצעה ב-business_reply). קריאה בלבד.",
