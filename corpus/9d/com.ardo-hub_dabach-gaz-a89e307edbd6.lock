        {
          "name": "ardo_respond_to_offer",
          "description": "כשהעסק הציע חלופה (מצב countered): מעביר לעסק את תשובת הלקוח. קרא לכלי הזה רק אחרי שהלקוח עצמו ראה את ההצעה ואמר במפורש אם הוא מסכים; אל תענה בשמו. accept=true מאשר את ההזמנה בתנאי ההצעה, accept=false מבטל אותה.",
          "inputSchema": {
            "properties": {
              "accept": {
                "type": "boolean"
