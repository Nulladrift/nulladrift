          "description": "מידע על העסק בלי לפנות אליו: שעות פעילות, האם פתוח עכשיו, כתובת, אזור שירות, האם אומת שהאתר שייך לעסק (website_verified), הודעה עדכנית מהעסק, ואילו פעולות אפשר לבקש. קריאה בלבד; העסק לא מקבל שום הודעה. השתמש בכלי הזה לפני שמבקשים מהעסק משהו.",
