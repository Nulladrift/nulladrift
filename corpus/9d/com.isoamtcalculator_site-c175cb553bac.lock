                "type": "number"
              },
              "income": {
                "default": 150000,
                "description": "AMT income before the option spread",
                "maximum": 20000000,
                "minimum": 0,
                "type": "number"
              },
              "regular": {
                "default": 25000,
                "description": "Your regular federal income tax for the year",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "shares": {
                "default": 10000,
                "description": "ISO shares exercised and held past year end",
                "maximum": 10000000,
                "minimum": 0,
