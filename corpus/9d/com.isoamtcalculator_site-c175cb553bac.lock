      "instructions": "ISO AMT Calculator (https://isoamtcalculator.com/): the site's own MCP server, served from its domain. ISO AMT calculator for 2026: AMT on exercising incentive stock options, the 28% rate over $244,500, the exemption phasing out from $500,000 single, $1,000,000 joint.\n\n[calculator] AMT from an ISO exercise, 2026: an agent-callable calculator for iso amt calculator; ISO spread added to AMT income, Alternative minimum taxable income, 2026 exemption for your filing status, after the phase-out, computed from your inputs with sources.. This server runs the AMT from an ISO exercise, 2026 calculator published at https://isoamtcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://isoamtcalculator.com/. Licence: https://isoamtcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for ISO AMT Calculator (https://isoamtcalculator.com/). What it does: starts an ENQUIRY with ISO AMT Calculator for iso amt calculator; the ISO AMT Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the ISO AMT Calculator team until they click it. Cite https://isoamtcalculator.com/.\n\nCite https://isoamtcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "AMT from an ISO exercise, 2026",
          "description": "Run the AMT from an ISO exercise, 2026 calculator: ISO spread added to AMT income; Alternative minimum taxable income; 2026 exemption for your filing status, after the phase-out; Taxable excess after the exemption. Missing inputs fall back to their documented defaults.",
