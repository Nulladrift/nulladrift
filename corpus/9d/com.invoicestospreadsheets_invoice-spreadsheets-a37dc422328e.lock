      },
      "instructions": "Turns invoices into an Excel workbook and checks them. Read the invoice files the user provides yourself, then pass every invoice to create_invoice_spreadsheet with values exactly as printed (null when not printed or not legible; never estimate). Give the user the download link exactly as returned and tell them what the checks found. Use check_invoices when the user only wants totals verified or duplicates found. Use list_spreadsheet_templates when the user wants a blank spreadsheet to fill in by hand. The tools do not read files, give tax advice or file returns.",
      "tools": [
        {
          "name": "check_invoices",
          "title": "Check invoices",
          "description": "Use this when the user wants invoices verified without making a file: whether net plus VAT equals the total, whether line items add up, which fields are missing, and which invoices look like duplicates. Returns the findings and totals per currency. Nothing is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "invoices": {
                "description": "Every invoice, one entry each, with values exactly as printed on the document. Use null for anything not printed or not legible; never estimate.",
                "items": {
                  "properties": {
                    "category": {
                      "anyOf": [
                        {
                          "maxLength": 120,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "anyOf": [
                        {
                          "pattern": "^[A-Za-z]{3}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "ISO 4217 code, e.g. GBP, USD, EUR."
                    },
                    "date": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Invoice date as YYYY-MM-DD."
                    },
                    "description": {
                      "anyOf": [
                        {
                          "maxLength": 4000,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One line on what the invoice is for."
                    },
                    "invoice_number": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "line_items": {
                      "items": {
                        "properties": {
                          "category": {
                            "anyOf": [
                              {
                                "maxLength": 120,
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "description": {
                            "description": "The line as printed.",
                            "maxLength": 2000,
                            "type": "string"
                          },
                          "net": {
                            "anyOf": [
                              {
                                "maximum": 999999999999,
                                "minimum": -999999999999,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Line amount before VAT."
                          },
                          "quantity": {
                            "anyOf": [
                              {
                                "maximum": 999999999999,
                                "minimum": -999999999999,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "unit_price": {
                            "anyOf": [
                              {
                                "maximum": 999999999999,
                                "minimum": -999999999999,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Price for one unit, before VAT."
                          },
                          "vat": {
                            "anyOf": [
                              {
                                "maximum": 999999999999,
                                "minimum": -999999999999,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "VAT or sales tax on this line."
                          },
                          "vat_rate": {
                            "anyOf": [
                              {
                                "maximum": 999999999999,
                                "minimum": -999999999999,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "VAT rate as a percentage, e.g. 20 for 20%."
                          }
                        },
                        "required": ["description"],
                        "type": "object"
                      },
                      "maxItems": 2000,
                      "type": "array"
                    },
                    "net": {
                      "anyOf": [
                        {
                          "maximum": 999999999999,
                          "minimum": -999999999999,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Invoice amount before VAT."
                    },
                    "notes": {
                      "anyOf": [
                        {
                          "maxLength": 5000,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "po_number": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The buyer's purchase order number, if printed."
                    },
                    "supplier": {
                      "anyOf": [
                        {
                          "maxLength": 300,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Who issued the invoice."
                    },
                    "supplier_tax_id": {
                      "anyOf": [
                        {
                          "maxLength": 100,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The supplier's VAT or company registration number, if printed."
                    },
                    "total": {
                      "anyOf": [
                        {
                          "maximum": 999999999999,
                          "minimum": -999999999999,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Amount due including VAT."
                    },
                    "vat": {
                      "anyOf": [
                        {
                          "maximum": 999999999999,
                          "minimum": -999999999999,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Total VAT or sales tax."
                    },
                    "vat_rate": {
                      "anyOf": [
                        {
                          "maximum": 999999999999,
                          "minimum": -999999999999,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "VAT rate as a percentage when one rate applies to the whole invoice."
                    }
                  },
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["invoices"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check_count": {
                "type": "number"
              },
              "checks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "invoice_number": {
                      "type": ["string", "null"]
