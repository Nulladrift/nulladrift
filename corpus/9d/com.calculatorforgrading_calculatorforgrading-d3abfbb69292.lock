        {
          "name": "grade_calculator",
          "title": "Grade from questions wrong",
          "description": "Use this when a student or teacher wants the percent and letter grade for a test from the number of questions wrong (or correct), e.g. \"7 wrong out of 40\". Returns the percent, the letter on the chosen scale, how many more correct answers reach the next letter, and optionally a chart of every possible number wrong. Do not use it for a final-exam target, weighted categories, GPA or test scores. Needs only numbers; never ask for names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "correct": {
                "description": "Questions correct. Give wrong or correct, not both.",
                "minimum": 0,
                "type": "integer"
              },
              "custom_cutoffs": {
                "description": "Optional own cut-off percents, highest grade first, strictly descending (10_point: A, B, C, D = 4 numbers; plus_minus: 12 numbers). Use only when the user gives them.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "decimals": {
                "description": "Decimals shown in the percent (default 0).",
                "enum": [0, 1, 2],
                "type": "integer"
              },
              "include_chart": {
                "description": "Also return a chart row for each possible number wrong (first 60 rows).",
                "type": "boolean"
              },
              "rounding": {
                "description": "nearest rounds half up (default); down never rounds up, for teachers who truncate.",
                "enum": ["nearest", "down"],
                "type": "string"
              },
              "scale": {
                "description": "10_point = A 90, B 80, C 70, D 60 (default); 7_point = A 93, B 85, C 77, D 70; plus_minus = the site's preset with A+ 97 ... D- 60; pass_fail = pass at 60.",
                "enum": ["10_point", "7_point", "plus_minus", "pass_fail"],
                "type": "string"
              },
              "total_questions": {
                "description": "Number of questions or points on the test.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "wrong": {
                "description": "Questions wrong. Give wrong or correct, not both.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["total_questions"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "chart": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "correct": {
                      "type": "number"
                    },
                    "letter": {
                      "type": "string"
                    },
                    "percent": {
                      "type": "string"
                    },
                    "wrong": {
                      "type": "number"
                    }
                  },
                  "required": ["correct", "letter", "percent", "wrong"],
                  "type": "object"
                },
                "type": "array"
              },
              "correct": {
                "type": "integer"
              },
              "letter": {
                "type": "string"
              },
              "link": {
                "description": "Page of calculatorforgrading.com with the same inputs filled in.",
                "type": "string"
              },
              "next_letter": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "letter": {
                        "type": "string"
                      },
                      "min_percent": {
                        "type": "number"
                      },
                      "more_correct_needed": {
                        "type": "integer"
                      },
                      "percent_then": {
                        "type": "number"
                      }
                    },
                    "required": ["letter", "min_percent", "more_correct_needed", "percent_then"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "percent_exact": {
                "type": "number"
              },
              "percent_shown": {
                "type": "number"
              },
              "rule": {
                "type": "string"
              },
              "scale": {
                "type": "string"
              },
              "total_questions": {
                "type": "integer"
              },
              "wrong": {
                "type": "integer"
              }
            },
            "required": ["correct", "letter", "link", "next_letter", "percent_exact", "percent_shown", "rule", "scale", "total_questions", "wrong"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Grade from questions wrong"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60024cb255165be43aae081aafffd6c1177e0583e536f7b8e6921118415fa167"
        },
        {
          "name": "grading_scale_facts",
          "title": "Grading scale cut-offs with sources",
          "description": "Use this when someone asks what a grading scale is: the 10-point scale (A 90-100), the 7-point scale (A 93-100), the plus-minus scale with GPA points on 4.0 and 4.3, or the College Board percent-to-GPA table. Returns the cut-offs, the named sources and the date they were checked. Use it instead of answering from memory; there is no national scale and schools differ.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scale": {
                "enum": ["10_point", "7_point", "plus_minus", "college_board"],
                "type": "string"
              }
            },
            "required": ["scale"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "checked": {
                "type": "string"
              },
              "link": {
                "description": "Page of calculatorforgrading.com with the same inputs filled in.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rows": {
                "items": {
                  "properties": {
                    "gpa_4_0": {
                      "type": ["number", "null"]
                    },
                    "gpa_4_3": {
                      "type": ["number", "null"]
                    },
                    "letter": {
                      "type": "string"
                    },
                    "percent": {
                      "type": "string"
                    }
                  },
                  "required": ["letter", "percent"],
                  "type": "object"
                },
                "type": "array"
              },
              "scale": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["checked", "link", "note", "rows", "scale", "sources", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Grading scale cut-offs with sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
