      "serverInfo": {
        "name": "calculatorforgrading",
        "title": "Calculator for Grading",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Grade, GPA and test-score arithmetic from calculatorforgrading.com. Use the tools for every number: percent and letter from questions wrong, score needed on a final, weighted average, GPA, SAT/ACT/MCAT practice-test scores, and grading-scale tables with sources. Never ask for names, student IDs or school names; only numbers and letters are needed. Letter cut-offs differ by school: say which scale was used and tell the user to check their syllabus. Results are estimates for practice and planning, not official grades or scores. Answer in the user's language, keep the one-line method, and keep the link line at the end of the answer.",
      "tools": [
        {
          "name": "final_grade_needed",
          "title": "Score needed on the final",
          "description": "Use this when a student asks what score they need on a final exam (or last assignment) to reach a target grade, given the current grade and how much the final counts. Returns the needed percent, whether it is secured or out of reach, what a 0 and a 100 would leave, and the need for every letter. Works with percents (current_grade_percent + final_weight_percent) or with points (points_earned_so_far, points_possible_so_far, final_exam_points). Do not use it for a weighted average of categories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_grade_percent": {
                "description": "Current course grade in percent before the final.",
                "maximum": 150,
                "minimum": 0,
                "type": "number"
              },
              "final_exam_points": {
                "description": "Points mode: points the final is worth.",
                "type": "number"
              },
              "final_weight_percent": {
                "description": "How much of the course grade the final counts, in percent.",
                "maximum": 100,
                "minimum": 0.01,
                "type": "number"
              },
              "points_earned_so_far": {
                "description": "Points mode: points earned so far.",
                "type": "number"
              },
              "points_possible_so_far": {
                "description": "Points mode: points possible so far.",
                "type": "number"
              },
              "scale": {
                "description": "10_point (default) or plus_minus, used to read a letter target.",
                "enum": ["10_point", "plus_minus"],
                "type": "string"
              },
              "target_grade": {
                "description": "Wanted grade: a percent (90) or a letter (B+).",
                "type": ["string", "number"]
              }
            },
            "required": ["target_grade"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "final_counts_percent": {
                "type": "number"
              },
              "hundred_on_final_gives_percent": {
                "type": "number"
              },
              "hundred_on_final_letter": {
                "type": "string"
              },
              "letters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "letter": {
                      "type": "string"
                    },
                    "needs_percent": {
                      "type": ["number", "null"]
                    },
                    "verdict": {
                      "type": "string"
                    }
                  },
                  "required": ["letter", "needs_percent", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "Page of calculatorforgrading.com with the same inputs filled in.",
                "type": "string"
              },
              "needed_on_final_percent": {
                "type": ["number", "null"]
              },
              "scale": {
                "type": "string"
              },
              "target": {
                "type": "string"
              },
              "target_percent": {
                "type": "number"
              },
              "verdict": {
                "enum": ["secured", "reach", "impossible"],
                "type": "string"
              },
              "zero_on_final_gives_percent": {
                "type": "number"
              },
              "zero_on_final_letter": {
                "type": "string"
              }
            },
            "required": ["final_counts_percent", "hundred_on_final_gives_percent", "hundred_on_final_letter", "letters", "link", "needed_on_final_percent", "scale", "target", "target_percent", "verdict", "zero_on_final_gives_percent", "zero_on_final_letter"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score needed on the final"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1690ffad5849bf582d975b4c7842ae49cf15678f726c909f47e132fff55d8df4"
        },
        {
          "name": "gpa_calculator",
          "title": "GPA from course grades",
          "description": "Use this when a student wants their GPA from letter grades and credits, high school (honors +0.5, AP/IB +1.0 on passing grades, weighted and unweighted) or college (credit hours, unweighted). Returns unweighted and weighted GPA with the points of each course. Credits default to 1 (hs) or 3 (college). Do not use it for a single test grade or for a school-specific formula such as UC or LSAC.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "courses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "credits": {
                      "description": "Credits or credit hours.",
                      "exclusiveMinimum": 0,
                      "maximum": 30,
                      "type": "number"
                    },
                    "letter": {
                      "description": "Letter grade.",
                      "enum": ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F"],
                      "type": "string"
                    },
                    "level": {
                      "description": "regular (default), honors or ap (AP/IB).",
                      "enum": ["regular", "honors", "ap"],
                      "type": "string"
                    }
                  },
                  "required": ["letter"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "mode": {
                "description": "hs = high school with weighting (default); college = unweighted.",
                "enum": ["hs", "college"],
                "type": "string"
              },
              "scale": {
                "description": "4.0 (A+ counts 4.0, default) or 4.3 (A+ counts 4.3).",
                "enum": ["4.0", "4.3"],
                "type": "string"
              }
            },
            "required": ["courses"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "courses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "credits": {
                      "type": "number"
                    },
                    "letter": {
                      "type": "string"
                    },
                    "level": {
                      "type": "string"
                    },
                    "points_unweighted": {
                      "type": "number"
                    },
                    "points_weighted": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["credits", "letter", "level", "points_unweighted", "points_weighted"],
                  "type": "object"
                },
                "type": "array"
              },
              "credits": {
                "type": "number"
              },
              "gpa_unweighted": {
                "type": "number"
              },
              "gpa_weighted": {
                "type": ["number", "null"]
              },
              "link": {
                "description": "Page of calculatorforgrading.com with the same inputs filled in.",
                "type": "string"
              },
              "mode": {
                "type": "string"
              },
              "scale": {
                "type": "string"
              }
            },
            "required": ["courses", "credits", "gpa_unweighted", "gpa_weighted", "link", "mode", "scale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GPA from course grades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45dd724e18dc61b83cce9aaa2a750e642a5cac2fcd7b564fa130e5fa8a42e0f1"
