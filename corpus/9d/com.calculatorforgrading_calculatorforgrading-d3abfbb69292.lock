                "type": ["number", "null"]
              },
              "total_high": {
                "type": "integer"
              },
              "total_low": {
                "type": "integer"
              },
              "total_percentile": {
                "type": ["string", "null"]
              }
            },
            "required": ["caveat", "link", "sections", "source", "test"],
            "type": "object"
          },
