        {
          "name": "test_score_calculator",
          "title": "SAT, ACT and MCAT practice scores",
          "description": "Use this when a student wants a score from a published practice test: SAT (College Board digital practice tests 4-11, correct answers per section to score ranges), ACT (practice tests 1-4 and the National test, correct answers per section to scale scores and Composite) or MCAT (four section scores 118-132 to total and AAMC percentile). Returns the score with the source table and fetch date. Not for official score reports, other tests, or predicting a real exam.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "act_english_correct": {
                "maximum": 40,
                "minimum": 0,
                "type": "integer"
              },
              "act_math_correct": {
                "maximum": 41,
                "minimum": 0,
                "type": "integer"
              },
              "act_reading_correct": {
                "maximum": 27,
                "minimum": 0,
                "type": "integer"
              },
              "act_science_correct": {
                "maximum": 34,
                "minimum": 0,
                "type": "integer"
              },
              "mcat_bio_biochem": {
                "maximum": 132,
                "minimum": 118,
                "type": "integer"
              },
              "mcat_cars": {
                "maximum": 132,
                "minimum": 118,
                "type": "integer"
              },
              "mcat_chem_phys": {
                "maximum": 132,
                "minimum": 118,
                "type": "integer"
              },
              "mcat_psych_soc": {
                "maximum": 132,
                "minimum": 118,
                "type": "integer"
              },
              "practice_test": {
                "description": "SAT: practice test number 4-11. ACT: 1, 2, 3, 4 or national.",
                "type": ["integer", "string"]
              },
              "sat_math_correct": {
                "description": "SAT: correct answers in Math (both modules).",
                "maximum": 54,
                "minimum": 0,
                "type": "integer"
              },
              "sat_reading_writing_correct": {
                "description": "SAT: correct answers in Reading and Writing (both modules).",
                "maximum": 66,
                "minimum": 0,
                "type": "integer"
              },
              "test": {
                "enum": ["sat", "act", "mcat"],
                "type": "string"
              }
            },
            "required": ["test"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
