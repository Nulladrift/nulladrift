              },
              "data": {},
              "next_cursor": {
                "type": ["string", "null"]
              }
            },
            "required": ["as_of", "coverage", "data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search connectors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
