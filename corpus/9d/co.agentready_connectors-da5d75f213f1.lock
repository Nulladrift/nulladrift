        "version": "1.1.0",
        "websiteUrl": "https://agentready.co",
        "icons": [
          {
            "src": "https://app.agentready.co/icon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://app.agentready.co/apple-icon.png",
