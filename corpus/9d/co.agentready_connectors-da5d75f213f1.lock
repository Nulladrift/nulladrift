              },
              "connector": {
                "description": "Words in the connector's name, company or description, to search one connector or a few",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "has_mcp_server": {
                "description": "Has an MCP server",
                "type": "boolean"
              },
              "industry": {
                "description": "Industry slug (business connectors)",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return, 1 to 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "match": {
                "default": "any",
                "description": "Where q must match: any (default), name (tool name or title), description (tool description), inputs (an input's name or description)",
                "enum": ["any", "name", "description", "inputs"],
                "type": "string"
              },
              "q": {
                "description": "Words to find in tool names, titles, descriptions, input names and input descriptions, for example \"feedback\" or \"user intent\". Leave out to list the tools of the matching connectors",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "rank_max": {
