        {
          "name": "get_connector",
          "title": "Get one connector",
          "description": "Use this when you need one connector's data without showing it, or data the card lacks (to show a connector to the user, use render_connector_detail): rank in each store, tools and what they can do, skills, sign-in, hosting, server instructions and example prompts. Also returns the app events it lists (separate from MCP notifications), where its instructions come from, and what we could not see. Empty catalogs may be hidden behind sign-in. Store presence is not platform compatibility; current skills are not evidence of recent additions. Use include_tools=false and include_instructions=false for a concise overview. Set full_tools=true for every stored tool and full descriptions. Use get_connector_changelog for historical changes. Search only when the slug is unknown. Returns the MCP server URL when known.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "full_tools": {
                "description": "Return every stored tool with full descriptions and stored parameter details instead of the legacy 40-tool preview",
                "type": "boolean"
              },
              "include_instructions": {
                "description": "Include full server instructions; set false for an overview",
                "type": "boolean"
              },
              "include_tools": {
                "description": "Include tools. Set false for a concise overview; legacy default is true",
                "type": "boolean"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "slug": {
                "description": "Connector slug from search_connectors",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "coverage": {
