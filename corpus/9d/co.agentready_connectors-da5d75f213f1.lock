        {
          "name": "search_connectors",
          "title": "Search connectors",
          "description": "Use this when the user wants a list of connectors, plugins, apps or MCP servers in the AI app stores (ChatGPT plugins, Claude connectors and plugins, Cursor, Gemini, Grok, Google Search, Muse): the top-ranked ones in a store, the highest-ranked consumer (B2C) connector, ones with a feature (OAuth, UI, server instructions, app events, skills over MCP, a hosting provider) or ones in a category. Returns observed directory listings, not platform compatibility; absence does not mean unsupported. Returns slugs for get_connector. To look up several brands or connectors by name, pass them all in names in one call. Do not use it to count; use analyze.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "anonymous_tools": {
                "description": "Some tools work before signing in",
                "type": "boolean"
              },
              "audience": {
                "description": "Who it is for; consumer is closest to B2C",
                "enum": ["consumer", "business", "developer"],
                "type": "string"
              },
              "auth": {
                "description": "How people sign in",
                "enum": ["oauth", "key", "none"],
                "type": "string"
              },
              "auth_provider": {
                "description": "Sign-in provider of its OAuth server",
                "enum": ["clerk", "auth0", "stytch", "workos", "okta", "cognito", "firebase", "supabase", "descope", "keycloak", "google", "microsoft", "github", "self", "other"],
                "type": "string"
              },
              "category": {
                "description": "Agent Ready category slug, e.g. travel, finance, dev-code",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "cimd": {
                "description": "OAuth server accepts client ID metadata documents",
                "type": "boolean"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "dynamic_registration": {
                "description": "OAuth server supports dynamic client registration",
                "type": "boolean"
              },
              "has_events": {
                "description": "Has ChatGPT plugin events (not MCP notifications); list them with search_components type=event",
                "type": "boolean"
              },
              "has_instructions": {
                "description": "Has MCP server instructions",
                "type": "boolean"
              },
              "has_mcp_server": {
                "description": "Has an MCP server",
                "type": "boolean"
              },
              "has_ui": {
                "description": "Shows an interactive widget in the chat",
                "type": "boolean"
              },
              "host_provider": {
                "description": "Hosting provider, from the server host name",
                "enum": ["alpic", "vercel", "cloudflare", "render", "railway", "fly", "google_cloud", "supabase", "heroku", "netlify", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Industry slug (business connectors)",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "kind": {
                "description": "connector (tools or an MCP server) or skills (skill pack only)",
                "enum": ["connector", "skills"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many connectors to return, 1 to 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mcp_notification": {
                "description": "Declares this standard MCP notification (not ChatGPT plugin events)",
                "enum": ["tools_list_changed", "prompts_list_changed", "resources_list_changed", "resource_updates", "logging"],
                "type": "string"
              },
              "names": {
                "description": "Look up several connectors at once: 1 to 25 brand names, connector names or web domains, in place of q. Gives up to 3 best matches per name, each with matched_name, and lists names with no match in not_found. Use this, not one call per name",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "q": {
                "description": "Words in the connector name, company, description or keywords",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "rank_max": {
                "description": "Overall rank in `store` (chatgpt or claude) this high or better, e.g. 100. Not the rank within a category: with category, use a larger value (e.g. 1000) for the top of that category",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "released_after": {
                "description": "Released on or after this date (YYYY-MM-DD)",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "skills_over_mcp": {
                "description": "Serves skills over MCP",
                "type": "boolean"
              },
              "sort": {
                "default": "rank",
                "description": "rank and trend need `store` (rank: chatgpt or claude; trend: claude only). Without a store, rank uses the best rank in any store. newest sorts by release date; keywords sorts by how many ChatGPT plugin keywords a listing has (each row gives keyword_count; get_connector lists them)",
                "enum": ["rank", "trend", "tools", "keywords", "newest", "name"],
                "type": "string"
              },
              "store": {
                "description": "Listed in this store",
                "enum": ["chatgpt", "claude", "cursor", "gemini", "google_search", "grok", "muse"],
                "type": "string"
              },
              "tools_known": {
                "description": "Its tool list is known (false: hidden behind sign-in)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
