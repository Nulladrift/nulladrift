        {
          "name": "get_connector_changelog",
          "title": "Connector changelog",
          "description": "Use this when a user asks what changed in a named app, whether tools were added or removed, how an MCP server evolved, or whether a ChatGPT app was updated. Accepts one slug or an array for comparison in one call, e.g. slug=[\"seatgeek\",\"linear\"], store=chatgpt. Returns chronological changes with before/after evidence, coverage dates, limitations and per-connector pagination. Prefer this over list_changes for named connectors. Never substitute rank history for functional changes. Known slugs need no search first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page, with the same filters",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "kinds": {
                "description": "Change types in one request; omit for all",
                "items": {
                  "enum": ["new", "removed", "tool_added", "tool_removed", "tool_modified", "skill_added", "skill_removed", "skill_modified", "instructions_changed", "events_changed", "server_changed", "ui_changed", "auth_changed", "category_added", "category_removed", "renamed", "updated"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 50,
                "description": "Maximum events per connector per page",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Inclusive observation date, YYYY-MM-DD",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "slug": {
                "anyOf": [
                  {
                    "description": "Connector slug from search_connectors",
                    "pattern": "^[a-z0-9-]+$",
                    "type": "string"
                  },
                  {
                    "items": {
                      "description": "Connector slug from search_connectors",
                      "pattern": "^[a-z0-9-]+$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Known slug or up to 10 slugs to compare, e.g. [\"seatgeek\", \"linear\"]. Search only if the slug is unknown"
              },
              "store": {
                "description": "Only changes in this store",
                "enum": ["chatgpt", "claude", "cursor", "gemini", "google_search", "grok", "muse"],
                "type": "string"
              },
              "until": {
                "description": "Inclusive observation date, YYYY-MM-DD",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "coverage": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "changes": {
                      "items": {
                        "additionalProperties": {},
                        "properties": {
                          "after": {},
                          "before": {},
                          "component": {
                            "type": ["string", "null"]
                          },
                          "field": {
                            "type": ["string", "null"]
                          },
                          "kind": {
                            "type": "string"
                          },
                          "observed_at": {
                            "type": "string"
                          },
                          "source": {
                            "type": "string"
                          }
                        },
                        "required": ["after", "before", "component", "field", "kind", "observed_at", "source"],
