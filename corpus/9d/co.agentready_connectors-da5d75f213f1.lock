        {
          "name": "search_connectors",
          "title": "Search connectors",
          "description": "Use this when the user wants a list of connectors, plugins, apps or MCP servers in the AI app stores (ChatGPT plugins, Claude connectors and plugins, Cursor, Gemini, Grok, Google Search, Muse): the top-ranked ones in a store, ones with a feature (OAuth, UI, server instructions, skills over MCP, a hosting provider) or ones in a category. Returns brief rows by default; detail=\"full\" adds the other fields. To look up several brands by name, pass them all in names in one call. Do not use it to count; use analyze.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "anonymous_tools": {
                "description": "Some tools work before signing in",
                "type": "boolean"
              },
              "audience": {
                "description": "Who it is for; consumer is closest to B2C",
                "enum": ["consumer", "business", "developer"],
                "type": "string"
              },
              "auth": {
                "description": "How people sign in",
                "enum": ["oauth", "key", "none"],
                "type": "string"
              },
              "auth_provider": {
                "description": "Sign-in provider of its OAuth server",
                "enum": ["clerk", "auth0", "stytch", "workos", "okta", "cognito", "firebase", "supabase", "descope", "keycloak", "google", "microsoft", "github", "self", "other"],
                "type": "string"
              },
              "category": {
                "description": "Agent Ready category slug, e.g. travel, finance, dev-code",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "cimd": {
                "description": "OAuth server accepts client ID metadata documents",
                "type": "boolean"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "detail": {
                "default": "brief",
                "description": "brief (default): slug, name, company, short description, category, rank in each store, tool count. full: also audience, sign-in, hosting, features, tool names and the MCP server URL. Prefer brief, then get_connector for the few you need",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "dynamic_registration": {
                "description": "OAuth server supports dynamic client registration",
                "type": "boolean"
              },
              "has_events": {
                "description": "Lists ChatGPT plugin events",
                "type": "boolean"
              },
              "has_instructions": {
                "description": "Has MCP server instructions",
                "type": "boolean"
              },
              "has_mcp_server": {
                "description": "Has an MCP server",
                "type": "boolean"
              },
              "has_ui": {
                "description": "Shows an interactive widget in the chat",
                "type": "boolean"
              },
              "host_provider": {
                "description": "Hosting provider, from the server host name",
                "enum": ["alpic", "vercel", "cloudflare", "render", "railway", "fly", "google_cloud", "supabase", "heroku", "netlify", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Industry slug (business connectors)",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "kind": {
                "description": "connector (tools or an MCP server) or skills (skill pack only)",
                "enum": ["connector", "skills"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many connectors to return, 1 to 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mcp_notification": {
                "description": "Declares this MCP notification",
                "enum": ["tools_list_changed", "prompts_list_changed", "resources_list_changed", "resource_updates", "logging"],
                "type": "string"
              },
              "names": {
                "description": "Look up several connectors at once: 1 to 25 brand names, connector names or web domains, in place of q. Gives up to 3 best matches per name, each with matched_name, and lists names with no match in not_found. Use this, not one call per name",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "q": {
                "description": "Words in the connector name, company, description or keywords",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "rank_max": {
                "description": "Rank in `store` (chatgpt or claude) this good or better. It is the whole store's rank: with category, use a larger value such as 1000",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "released_after": {
                "description": "Released on or after this date (YYYY-MM-DD)",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "skills_over_mcp": {
                "description": "Serves skills over MCP",
                "type": "boolean"
              },
              "sort": {
                "default": "rank",
                "description": "rank: the store's rank (for a store without one, or no store: the best ChatGPT or Claude rank). trend: Claude only. newest: release date. keywords: number of ChatGPT plugin keywords",
                "enum": ["rank", "trend", "tools", "keywords", "newest", "name"],
                "type": "string"
              },
              "store": {
                "description": "Listed in this store",
                "enum": ["chatgpt", "claude", "cursor", "gemini", "google_search", "grok", "muse"],
                "type": "string"
              },
              "tools_known": {
                "description": "Its tool list is known (false: hidden behind sign-in)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "coverage": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "data": {},
              "next_cursor": {
                "type": ["string", "null"]
              }
            },
            "required": ["as_of", "coverage", "data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search connectors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fce4adc8793c3f32ab6f0f670621095ce46e538b2f0f821deef6fa367ea4675f"
        },
        {
          "name": "search_tools",
          "title": "Search tools and inputs",
          "description": "Use this when the user asks which connectors have a certain kind of tool or input (a feedback tool, a booking tool, inputs that capture user intent), or for one connector's tools with their inputs (connector, without q). Searches tool and input names and descriptions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
