        {
          "name": "get_guide",
          "title": "Guide",
          "description": "Use this when the user asks how something works rather than for data: how people discover connectors, how to write server instructions, tool descriptions or listing text, what ranks mean, what Agent Ready can see (data-coverage), or terms that sound alike, such as ChatGPT plugin events and MCP notifications (concepts).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "topic": {
                "description": "discovery: how people find connectors in ChatGPT and Claude. server-instructions, tool-descriptions, listing-metadata: how to write each. ranks-explained: what the store ranks mean. data-coverage: what Agent Ready can and cannot see in each store (tools, instructions, sign-in, history). concepts: terms that sound alike (ChatGPT plugin events vs MCP notifications, sign-in vs sign-up, rank vs usage...)",
                "enum": ["discovery", "server-instructions", "tool-descriptions", "listing-metadata", "ranks-explained", "data-coverage", "concepts"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
