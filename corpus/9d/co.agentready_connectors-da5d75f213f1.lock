      },
      "instructions": "Agent Ready has data on the connectors in the AI app stores: ChatGPT plugins and apps, Claude connectors and plugins, Cursor plugins, Gemini connected apps, Grok, Google Search and Muse. Stores use different words for the same thing (connector, plugin, app, connected app, MCP server, extension). These tools call all of them connectors. A rank is store order (lower is better, out of \"of\" listings with a ranking signal), not usage.\n\nWhich tool to use:\n- Lists of connectors by store, category or feature (OAuth, UI, skills): search_connectors. One connector's data, tools and MCP server URL: get_connector (up to 10 slugs in one call). Search only when the slug is unknown.\n- Counts and statistics: analyze. Tools, inputs, skills and other components across many connectors: search_tools and search_components.\n- Real tool descriptions and server instructions to learn from: find_tool_examples.\n- Changes to named connectors: get_connector_changelog. Changes across a store: list_changes.\n- Rank over time: get_rank_history (up to 25 connectors in one call), then render_rank_chart. Only ChatGPT (from 2026-10-08) and Claude publish a rank.\n- How something works (ranks, how people find connectors, writing tool descriptions and server instructions, data coverage, similar terms): get_guide.\n- Published usage numbers: list_usage_reports. The stores covered: list_stores.\n- Feedback for the Agent Ready team (wrong data, a problem, an idea): send_feedback.\n\nTo show connectors to the user, use a render tool, not your own table or card: one connector, render_connector_detail; 2 to 4, render_connector_compare; 5 or more, or a list, render_connector_table. The render tools take slugs from any tool that returns them.\n\nPut the answer in the first sentence. Add a caveat only when it changes the answer. Tools hidden behind sign-in are unknown, not absent. The data describes servers and store listings, not which apps support a feature.",
      "tools": [
        {
          "name": "analyze",
          "title": "Count and measure",
          "description": "Use this when the user asks for any count or statistic about connectors, tools, tool inputs or components: how many, by up to 2 fields, with min, max, mean, median and p90 of numbers such as tools per connector or description length. Examples: tools per connector in Claude (entity=connectors, store=claude, measure=[\"tools\"]); skills per category (entity=components, type=skill, group_by=[\"category\"]); OAuth and rank (entity=connectors, store=claude, group_by=[\"auth\"], measure=[\"rank_claude\"]). Grouped by store, a connector counts once per store: use coverage.connectors for the distinct total.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "description": "tools and inputs: only tools with this access (declared by the server, else estimated from the name)",
                "enum": ["read", "write", "delete"],
                "type": "string"
              },
              "anonymous_tools": {
                "description": "Some tools work before signing in",
                "type": "boolean"
              },
              "audience": {
                "description": "Who it is for; consumer is closest to B2C",
                "enum": ["consumer", "business", "developer"],
                "type": "string"
              },
              "auth": {
                "description": "How people sign in",
                "enum": ["oauth", "key", "none"],
                "type": "string"
              },
              "auth_provider": {
                "description": "Sign-in provider of its OAuth server",
                "enum": ["clerk", "auth0", "stytch", "workos", "okta", "cognito", "firebase", "supabase", "descope", "keycloak", "google", "microsoft", "github", "self", "other"],
                "type": "string"
              },
              "category": {
                "description": "Agent Ready category slug, e.g. travel, finance, dev-code",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "cimd": {
                "description": "OAuth server accepts client ID metadata documents",
                "type": "boolean"
              },
              "connector": {
                "description": "Words in the connector's name, company or description, to search one connector or a few",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "dynamic_registration": {
                "description": "OAuth server supports dynamic client registration",
                "type": "boolean"
              },
              "entity": {
                "description": "What to count and measure: connectors, tools, inputs (tool parameters) or components (skills, commands, hooks, UI templates...)",
                "enum": ["connectors", "tools", "inputs", "components"],
                "type": "string"
              },
              "group_by": {
                "description": "Up to 2 fields: a connector field (store, audience, category, industry, kind, auth, has_ui, has_events, mcp_notifications, keyword, has_instructions, skills_over_mcp, host_provider, publisher, has_mcp_server, tools_known, auth_provider, dynamic_registration, cimd, anonymous_tools). tools add access, access_estimated, source; inputs add type, required, tool_access, tool_source; components add type, component_store",
                "items": {
                  "pattern": "^[a-z_]+$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "has_events": {
                "description": "Lists ChatGPT plugin events",
                "type": "boolean"
              },
              "has_instructions": {
                "description": "Has MCP server instructions",
                "type": "boolean"
              },
              "has_mcp_server": {
                "description": "Has an MCP server",
                "type": "boolean"
              },
              "has_ui": {
                "description": "Shows an interactive widget in the chat",
                "type": "boolean"
              },
              "host_provider": {
                "description": "Hosting provider, from the server host name",
                "enum": ["alpic", "vercel", "cloudflare", "render", "railway", "fly", "google_cloud", "supabase", "heroku", "netlify", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Industry slug (business connectors)",
                "pattern": "^[a-z-]+$",
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "kind": {
                "description": "connector (tools or an MCP server) or skills (skill pack only)",
                "enum": ["connector", "skills"],
                "type": "string"
              },
              "mcp_notification": {
                "description": "Declares this MCP notification",
                "enum": ["tools_list_changed", "prompts_list_changed", "resources_list_changed", "resource_updates", "logging"],
                "type": "string"
              },
              "measure": {
                "description": "Numbers to summarize. connectors: tools, skills, keywords, components, rank_chatgpt, rank_claude, in_top_100_chatgpt, in_top_100_claude (1 or 0: the mean is the share). tools: description_length, inputs. inputs: description_length, enum_values. components: description_length, body_length",
                "items": {
                  "pattern": "^[a-z_]+$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "q": {
                "description": "Only rows whose own text matches: a tool, input or component search like in search_tools; for connectors, the connector text",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "rank_max": {
                "description": "Rank in `store` (chatgpt or claude) this good or better. It is the whole store's rank: with category, use a larger value such as 1000",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "released_after": {
                "description": "Released on or after this date (YYYY-MM-DD)",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "skills_over_mcp": {
                "description": "Serves skills over MCP",
                "type": "boolean"
              },
              "source": {
                "description": "tools and inputs: store (the store lists the tool) or server (only the MCP server lists it)",
                "enum": ["store", "server"],
                "type": "string"
              },
              "store": {
                "description": "Listed in this store",
                "enum": ["chatgpt", "claude", "cursor", "gemini", "google_search", "grok", "muse"],
                "type": "string"
              },
              "tools_known": {
                "description": "Its tool list is known (false: hidden behind sign-in)",
                "type": "boolean"
              },
              "type": {
                "description": "components: only this component type (skill, command, ui_template...). inputs: only this JSON type (string, number, boolean, array, object)",
                "pattern": "^[a-z_]+$",
                "type": "string"
              }
            },
            "required": ["entity"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "coverage": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "data": {},
              "next_cursor": {
                "type": ["string", "null"]
              }
            },
            "required": ["as_of", "coverage", "data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count and measure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6da7cc7cf7544be33cda48a016e96a155003563dc23dbb23cd0b7bbb93288c41"
