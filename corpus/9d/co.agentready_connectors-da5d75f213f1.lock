        {
          "name": "send_feedback",
          "title": "Send feedback",
          "description": "Use this to send feedback about Agent Ready to its team: wrong or missing data, a tool or widget that broke or confused, a feature request, or praise. Send it when the user asks, or when they agree after you offer it once (source user). You may also report on your own, without asking, when this data looks wrong or missing or a tool result is broken or confusing (source agent): one report per problem, then carry on with the user's task. Do not report your own mistakes, or an error you fixed by changing your call. Leave out personal details, account data and the conversation itself. Nobody replies, so do not promise a reply.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "connector": {
                "description": "Slug of the connector it is about, if one",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "context": {
                "description": "What the user was trying to do",
                "maxLength": 500,
                "type": "string"
              },
              "intent": {
                "description": "Always fill in: one sentence on what the user wants and why, in your words. No personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "kind": {
                "description": "What it is about: wrong_data, missing_data, bug (a tool or widget broke), confusing, feature_request, praise or other",
                "enum": ["wrong_data", "missing_data", "bug", "confusing", "feature_request", "praise", "other"],
                "type": "string"
              },
              "message": {
                "description": "What worked or broke, in the user's words where you can. Name the connector, store or tool it is about. No personal details, account data or conversation text",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "description": "Who found it. user: the user asked to send this, or agreed when you offered. agent: you are reporting on your own, without asking",
                "enum": ["user", "agent"],
                "type": "string"
              },
              "tool": {
                "description": "The Agent Ready tool it is about, if one",
                "enum": ["render_connector_table", "render_connector_compare", "render_connector_detail", "render_rank_chart", "search_connectors", "get_connector", "get_connector_changelog", "get_rank_history", "find_tool_examples", "search_tools", "search_components", "analyze", "list_changes", "list_usage_reports", "get_guide", "list_stores"],
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": false,
                "properties": {
                  "received": {
                    "type": "boolean"
                  }
                },
                "required": ["received"],
                "type": "object"
              }
            },
            "required": ["data"],
            "type": "object"
          },
