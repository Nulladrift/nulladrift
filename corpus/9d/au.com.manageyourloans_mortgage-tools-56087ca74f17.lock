        {
          "name": "calculate_repayments",
          "description": "Estimate monthly & fortnightly principal-and-interest repayments and total\n    interest for a home/personal loan scenario. Indicative only — not a quote.\n\n    Args:\n        principal: Loan amount in AUD (e.g. 500000).\n        annual_rate_pct: Annual interest rate as a percentage (e.g. 6.5).\n        term_years: Loan term in years (e.g. 30).\n    ",
          "inputSchema": {
            "properties": {
              "annual_rate_pct": {
                "title": "Annual Rate Pct",
                "type": "number"
              },
              "principal": {
                "title": "Principal",
                "type": "number"
              },
              "term_years": {
                "title": "Term Years",
                "type": "integer"
              }
            },
            "required": ["annual_rate_pct", "principal", "term_years"],
            "title": "calculate_repaymentsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fa1716236374e97387d66ae2f93986db4e629a6b935470ef72b7150562323b2"
        },
        {
          "name": "check_costco_eligibility",
          "description": "Check eligibility for the Costco partner service and Shop Card reward\n    (Executive membership + a settled loan). Indicative check only.\n\n    Args:\n        is_costco_member: Whether the person holds a current Costco membership.\n        membership_type: e.g. \"Executive\" or \"Gold Star\" (optional).\n    ",
          "inputSchema": {
            "properties": {
              "is_costco_member": {
                "title": "Is Costco Member",
                "type": "boolean"
              },
              "membership_type": {
                "default": "",
                "title": "Membership Type",
                "type": "string"
              }
            },
            "required": ["is_costco_member"],
            "title": "check_costco_eligibilityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e80ade00d9efa176d5204a8dbd4d7391d0017c487647c7b966ba8e50286c6388"
        },
        {
          "name": "compare_loan_types",
          "description": "List Manage Your Loans' loan categories with what each is for and a link.\n    Use to help a user pick which loan type fits their situation.",
          "inputSchema": {
