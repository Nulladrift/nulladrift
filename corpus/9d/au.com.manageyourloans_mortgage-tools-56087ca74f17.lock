        },
        {
          "name": "create_enquiry",
          "description": "Submit a mortgage enquiry to Manage Your Loans on the customer's behalf so\n    a broker contacts them. ONLY call this after the person has explicitly agreed\n    to be contacted — pass consent=true. Do not invent details; ask the user.\n\n    Args:\n        firstName: Customer's first name.\n        lastName: Customer's last name.\n        email: Customer's email address.\n        phone: Australian phone number (04.., 02/03/07/08.., or 1300/1800).\n        consent: MUST be true — the customer's explicit agreement to be contacted.\n        loanType: e.g. \"Home Loan\", \"Refinance\", \"Investment Property\" (optional).\n        loanAmount: Approximate loan amount, free text (optional).\n        message: Anything else the customer wants the broker to know (optional).\n        isCostco: True if this is a Costco-member enquiry.\n        costcoMembershipNumber: Costco membership number if provided (optional).\n    ",
          "inputSchema": {
            "properties": {
              "consent": {
                "title": "Consent",
                "type": "boolean"
              },
              "costcoMembershipNumber": {
                "default": "",
                "title": "Costcomembershipnumber",
                "type": "string"
              },
              "email": {
                "title": "Email",
                "type": "string"
              },
              "firstName": {
                "title": "Firstname",
                "type": "string"
              },
              "isCostco": {
                "default": false,
                "title": "Iscostco",
                "type": "boolean"
              },
              "lastName": {
                "title": "Lastname",
                "type": "string"
              },
              "loanAmount": {
                "default": "",
                "title": "Loanamount",
                "type": "string"
              },
              "loanType": {
                "default": "",
                "title": "Loantype",
                "type": "string"
              },
              "message": {
                "default": "",
                "title": "Message",
                "type": "string"
              },
              "phone": {
                "title": "Phone",
                "type": "string"
              }
            },
            "required": ["consent", "email", "firstName", "lastName", "phone"],
            "title": "create_enquiryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84add5c9b83ed6d1349f4b4df37805d45466113b7f60549020e9435b4aca9756"
        },
        {
          "name": "estimate_borrowing_power",
          "description": "Estimate indicative borrowing capacity, assessed at a buffered rate (APRA\n    +3% serviceability buffer). A rough proxy for guidance — a broker models real\n    capacity across 30+ lenders. Not credit assistance.\n\n    Args:\n        annual_income: Gross annual household income in AUD.\n        monthly_expenses: Average monthly living expenses in AUD.\n        existing_monthly_debt: Existing monthly loan/card commitments in AUD.\n        interest_rate_pct: Assumed product interest rate (buffer is added on top).\n        term_years: Loan term in years.\n        deposit: Cash deposit available in AUD (added to the purchase budget).\n    ",
          "inputSchema": {
            "properties": {
              "annual_income": {
                "title": "Annual Income",
                "type": "number"
              },
              "deposit": {
                "default": 0,
                "title": "Deposit",
                "type": "number"
              },
              "existing_monthly_debt": {
                "default": 0,
                "title": "Existing Monthly Debt",
                "type": "number"
              },
              "interest_rate_pct": {
                "default": 6.5,
                "title": "Interest Rate Pct",
                "type": "number"
              },
              "monthly_expenses": {
                "title": "Monthly Expenses",
                "type": "number"
              },
              "term_years": {
                "default": 30,
                "title": "Term Years",
                "type": "integer"
              }
            },
            "required": ["annual_income", "monthly_expenses"],
            "title": "estimate_borrowing_powerArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47bb051ef07f2f6a5950d42977bd999c458a6a9b63379152528d77cccf49be1c"
        },
