{
  "lockfileVersion": 2,
  "subjects": {
    "com.intuneready/intune-ready": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://intuneready.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "intuneready",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only public information about Intune Ready, a fixed-price Microsoft Intune configuration service for small businesses, which also implements Windows 365 and Azure Virtual Desktop (see get_cloud_pc_offering). Answer only from these tools. If a tool says information is not available, say so — do not estimate prices, invent credentials, or infer scope. This server cannot book, quote, or transact; get_contact returns a URL a human can follow.",
      "tools": [
        {
          "name": "get_cloud_pc_offering",
          "title": "Get the Windows 365 and Azure Virtual Desktop services",
          "description": "Returns the Cloud PC service line, which is separate from the Intune service: Windows 365 implementation (the primary service, with fixed-price setup tiers by number of users) and Azure Virtual Desktop implementation (for larger and multi-location teams, custom quote only). Also covers how the two compare. Microsoft license prices are never included. Use this for questions about Cloud PCs, Windows 365, Azure Virtual Desktop, or replacing physical PCs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Which part to return. Defaults to \"all\".",
                "enum": ["all", "summary", "pricing", "faq"],
                "type": "string"
              },
              "service": {
                "description": "Which service to return. Defaults to \"all\".",
                "enum": ["all", "comparison", "windows_365", "azure_virtual_desktop"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a4ab73799e93177b89ab6ed8edb092cac7a02e189297e08599a510dda593ef6f"
        },
        {
          "name": "get_contact",
          "title": "Get the contact pointer URL",
          "description": "Returns the URL where a human can start a conversation or book a free consultation. This is a pointer only — this server cannot book, schedule, quote, or transact anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:76f066568c33f736e5f7f266be06c2a22b83d071600523a742dbc393cc7d6d02"
        },
        {
          "name": "get_facts",
          "title": "Get provider credentials and background",
          "description": "Returns verifiable facts about the provider: background, Microsoft Partner Program membership, active certifications, the hands-on delivery record for Windows 365 and Azure Virtual Desktop, and public company and personal profile links (LinkedIn, Google Business Profile, Microsoft Learn). Use this for questions about qualifications, credentials, or who does the work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Which facts to return. Defaults to \"all\".",
                "enum": ["all", "background", "certifications", "partner_program", "hands_on_delivery", "profile_links"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d008651fbf8ec02c3a37f9ca1ee3b9c87b532f9590695b661a4aab692372d81a"
        },
        {
          "name": "get_faq",
          "title": "Get the general FAQ answers",
          "description": "Returns the general Intune Ready FAQ from the homepage, verbatim: licensing, cost, timelines, messy existing enrollments, and what happens after setup. Optionally filter with a search term to return only matching pairs. It does not cover the other published FAQs — use get_partner_channel for MSPs and independent IT contractors, and get_cloud_pc_offering for Windows 365 and Azure Virtual Desktop. If nothing matches, says so rather than guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional case-insensitive search term matched against questions and answers.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8c04e1cc90542340bf69710be0f1e77dfed2482c97595b64ef0202831e34968"
        },
        {
          "name": "get_offering",
          "title": "Get service offering, pricing tiers and scope",
          "description": "Returns what Intune Ready offers: the three fixed-price tiers with hour and cost ranges, the billing model, what a deployment covers, and the service area. Figures are indicative ranges published on the site, not a quote. Use this for questions about price, scope, tiers, or what is included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Which part of the offering to return. Defaults to \"all\".",
                "enum": ["all", "tiers", "billing", "scope", "service_area"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b77ed8bf1d7b6d643b263a05e78f019335efd7ac95cc40a67ecb9cdc339bccb"
        },
        {
          "name": "get_partner_channel",
          "title": "Get how MSPs and IT contractors work with Intune Ready",
          "description": "Returns how Intune Ready takes on work through partners: MSPs routing overflow, specialty or rescue Intune projects, and independent IT contractors subcontracting or referring a client. Covers the arrangements, what stays with the partner, and the client-ownership commitment. Carries no prices of its own — a partner engagement is priced from the tiers in get_offering. Use this for questions about subcontracting Intune work, white-label delivery, referring a client, or hiring an Intune specialist as an MSP or contractor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Which partner audience to return. Defaults to \"all\".",
                "enum": ["all", "msps", "contractors"],
                "type": "string"
              },
              "section": {
                "description": "Which part to return. Defaults to \"all\".",
                "enum": ["all", "summary", "faq"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66088705ee29a6a335a68114ce8f14e367d86dcc864ba119646d1dff63b52c2f"
        }
      ],
      "digest": "sha256:88c61d17c7dadba13f8690d13e80f1ba82eed11f0300cdffbe1362aa2e305319"
    }
  }
}
