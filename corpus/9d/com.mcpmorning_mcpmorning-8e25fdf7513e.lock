{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpmorning/mcpmorning": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpmorning.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcpmorning",
        "title": "MCP Morning",
        "version": "0.1.0",
        "websiteUrl": "https://mcpmorning.com/mcp-server/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MCP Morning daily rankings of Model Context Protocol servers from public npm, PyPI and GitHub data. Do not claim MCP Morning tested, audited or endorsed a server. Cite each item URL and the snapshot date. Docs: https://mcpmorning.com/mcp-server/",
      "tools": [
        {
          "name": "get_server",
          "description": "One MCP server from the current snapshot: stars, weekly downloads, growth, install hints from registry package metadata, and links (GitHub, npm/PyPI, its MCP Morning page). Identify by slug, owner/repo, GitHub URL, or registry name. Install snippets are unverified — we do not run servers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Slug (e.g. browser-use-browser-use), GitHub URL, or owner/repo.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fb84f502f8cda9c18067ac41f95260d99ae2d79f4c14c31e9670adbb556ce84"
        },
        {
          "name": "latest_edition",
          "description": "Today's MCP Morning newsletter: title, date, up to 5 featured items with links, and the archive URL. Snapshot date included. Editorial, not a test report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b275da88feb69e3654cc16d2745aeea0a8f0c0d9ecaaf9262812141f463d5e3"
        },
        {
          "name": "search_servers",
          "description": "Search the MCP Morning snapshot by name, slug, GitHub repo, description or registry name. limit≤25, paginate with offset. Returns snapshot date and mcpmorning.com page URLs. Does not mean MCP Morning ran the server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Substring to match.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f0cea252cce51f2096159573363656a1d6ec1389b3884cb97f533e1b32f62f66"
        },
        {
          "name": "top_servers",
          "description": "Ranked MCP servers from the latest MCP Morning snapshot. list=most_used (weekly downloads + GitHub stars/forks), rising (week-over-week download growth; requires 25 stars or 1,000 prior-week downloads), or new (repo created in the last 30 days). Optional language (GitHub primary language) and category (database, browser, files, search, dev, comms, cloud, ai, commerce, marketing, memory, finance). limit≤25, paginate with offset. Returns snapshot date and item page URLs. Popularity only — MCP Morning does not run or test servers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Job category slug or label: database (Databases & data), browser (Browser & web scraping), files (Files & documents), search (Search & knowledge), dev (Dev tools & GitHub), comms (Messaging & collaboration), cloud (Cloud & infrastructure), ai (AI models & media), commerce (Payments & commerce), marketing (Marketing & SEO), memory (Memory & context), finance (Finance & crypto).",
                "type": "string"
              },
              "language": {
                "description": "Filter by GitHub primary language, e.g. TypeScript or Python.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Page size, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "default": "most_used",
                "description": "Ranking to return: most_used, rising, or new.",
                "enum": ["most_used", "rising", "new"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of rows to skip for pagination.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea4ba99258224d16410fb42f02173d5e07518f093bf68693a3ab8bd66588a314"
        }
      ],
      "digest": "sha256:b00356d75ef6891939e5c2057031eafb2339e352c0cad9ae77b016dff0c4e268"
    }
  }
}
