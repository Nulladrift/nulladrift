            "readOnly": true
          },
          "digest": "sha256:4336a4a992efbde66aade4224b982f9f2ec310cbc6169415cc8d40bee84168c3"
        },
        {
          "name": "search_catalogue",
          "title": "Rechercher dans le catalogue",
          "description": "Cherche dans le catalogue de la Ravel Edition (volumes, éditions révisées, orchestrations). Renvoie titre, volume, année de composition et d'édition, durée, effectif, ISMN et adresse de la fiche. Sans paramètre, renvoie tout le catalogue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filtre de catégorie, par exemple orchestre, concerto, chambre, piano (facultatif)",
                "type": "string"
              },
              "query": {
                "description": "Mots à chercher : titre, volume, effectif, ISMN… (facultatif)",
                "type": "string"
              }
