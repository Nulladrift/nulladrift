      "serverInfo": {
        "name": "ravel-edition",
        "title": "Ravel Edition",
        "version": "1.0.0",
        "websiteUrl": "https://raveledition.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ravel Edition (raveledition.com) publie depuis 2018 des éditions critiques révisées des œuvres de Maurice Ravel (collection de XXI Music Publishing ASBL, Belgique). Utilisez search_catalogue pour trouver un volume, get_work pour la fiche complète d'une œuvre (sources, comité de lecture, enregistrements, prix), latest_news pour les actualités, list_orchestras pour les orchestres qui jouent ces éditions et ordering_info pour commander ou louer le matériel. Citez toujours l'adresse de la page (url) fournie. Les fiches en ligne font foi.",
      "tools": [
        {
          "name": "get_work",
          "title": "Fiche complète d'une œuvre",
          "description": "Renvoie la fiche complète d'une œuvre de la Ravel Edition : sources, édition, comité de lecture, enregistrements, ouvrage et prix, adresses des pages française et anglaise.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "work": {
                "description": "Titre de l'œuvre (ex. « Bolero », « La Valse », « Sarabande et Danse ») ou adresse de sa page",
                "type": "string"
              }
            },
            "required": ["work"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7100698a1f2cd9d5205e967c06e0fa12281944e7bfa5bda1ea6a0a7a1c01d6b5"
        },
        {
          "name": "latest_news",
          "title": "Dernières actualités",
          "description": "Dernières actualités de la Ravel Edition : concerts, créations, enregistrements, publications, presse.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Langue (fr par défaut)",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Nombre d'actualités (10 par défaut)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Ne garder que les actualités contenant ces mots (facultatif)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d99e5d4b2c2ccc56cb1d46f1a53377f4cbdcd1807edbce3741e16944951b03ca"
        },
        {
          "name": "list_orchestras",
          "title": "Orchestres",
          "description": "Liste des orchestres qui ont joué ou jouent les éditions de la Ravel Edition, avec pays et continent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Filtrer par pays ou continent, en français (ex. « France », « Allemagne », « Asie ») (facultatif)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
