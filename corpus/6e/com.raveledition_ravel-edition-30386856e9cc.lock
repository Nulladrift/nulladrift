            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b40584c9d182e374f71bf89c9ff64ca11527bb05195275aac9e23dacf5f26a0"
        },
        {
          "name": "ordering_info",
          "title": "Commander ou louer",
          "description": "Comment acheter les ouvrages et partitions ou louer les matériels d'orchestre de la Ravel Edition (contact, paiement, TVA, conditions).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
