{
  "lockfileVersion": 2,
  "subjects": {
    "cc.checkleaked/spotify-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spotify-proxy.checkleaked.cc/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "spotify-data",
        "title": "Spotify Data (CheckLeaked)",
        "version": "0.1.0",
        "description": "Spotify play counts, monthly listeners, charts and catalog data.",
        "websiteUrl": "https://spotify.checkleaked.cc"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Spotify catalog data from the CheckLeaked Spotify Data API: track play counts, artist monthly listeners, followers, world rank and top cities, Top 200 and viral charts, search, albums, playlists, ISRC lookup, and genres / moods / BPM.\n\n- Every tool accepts Spotify ids, spotify: URIs and open.spotify.com URLs. With only a name, call `search` first to get the id.\n- Each call spends one request of the user's API key (get_playlist spends two on its first page, as does fetch of a playlist), so pass up to 50 ids in one call instead of one call per item.\n- `fetch` returns the full record behind a search result id (track:<id>, artist:<id>, album:<id>, playlist:<id>).\n- Spotify shows a play count of 0 for tracks with fewer than 1,000 plays.\n- Unofficial: not affiliated with or endorsed by Spotify.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Spotify record",
          "description": "The full record behind a search result: a track (play count, album, release date, genres, moods, BPM, credits), an artist (monthly listeners, followers, world rank, top cities, top tracks), an album (every track with play counts) or a playlist (details and its first 50 tracks with play counts). Takes an id from the search results (track:<id>, artist:<id>, album:<id>, playlist:<id>), a spotify: URI or an open.spotify.com URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "track:<id>, artist:<id>, album:<id> or playlist:<id> from search, a spotify: URI or an open.spotify.com URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch a Spotify record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2f2f218b06829d4c3ed62e0832edfc2300a99120ca024bc3d9c8b3a53aa5dc9a"
        },
        {
          "name": "get_album",
          "title": "Get album",
          "description": "An album with its track list and (by default) every track's lifetime play count, plus the album total, release date, label, UPC and popularity.",
          "inputSchema": {
            "properties": {
              "album": {
                "description": "Spotify album id, spotify:album:<id> URI or open.spotify.com/album/<id> URL.",
                "minLength": 1,
                "type": "string"
              },
              "include_play_counts": {
                "default": true,
                "description": "Add each track's lifetime play count and the album total.",
                "type": "boolean"
              }
            },
            "required": ["album"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get album"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:10139ca0601eb3f68b0abbdbddc0c71aff428a24db83e505e5ac81f51c3b7ebb"
        },
        {
          "name": "get_artist_insights",
          "title": "Artist genres, moods and BPM",
          "description": "An artist's sound profile from their top tracks: genres, moods and activities with 0-1 weights, and tempo (average, min, max BPM). Up to 20 artists per call.",
          "inputSchema": {
            "properties": {
              "artists": {
                "description": "Spotify artist ids, spotify:artist:<id> URIs or open.spotify.com/artist/<id> URLs (1-20).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["artists"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Artist genres, moods and BPM"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:394d36add0e5b65160c7e5c292719e73ca194646be8d67ae06a0fa85e4a12c4d"
        },
        {
          "name": "get_artist_overview",
          "title": "Artist overview",
          "description": "One artist's profile: monthly listeners, followers, world rank, top cities, top tracks with play counts, latest release, discography counts, related artists, biography and social links.",
          "inputSchema": {
            "properties": {
              "artist": {
                "description": "Spotify artist id, spotify:artist:<id> URI or open.spotify.com/artist/<id> URL.",
                "minLength": 1,
                "type": "string"
              },
              "top_tracks": {
                "default": 10,
                "description": "How many top tracks to return (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["artist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Artist overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:35823d460a69f6183dbaf4e078f97297e44a97455af6c61257edc6af4add2e1f"
        },
        {
          "name": "get_artists_stats",
          "title": "Artist monthly listeners and stats",
          "description": "Monthly listeners, followers, world rank, popularity, genres and top 5 cities (with listener counts) for up to 50 artists in one call.",
          "inputSchema": {
            "properties": {
              "artists": {
                "description": "Spotify artist ids, spotify:artist:<id> URIs or open.spotify.com/artist/<id> URLs (1-50).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["artists"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Artist monthly listeners and stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:46c48720dba1637d69cc1677b8c5ebe26c249f73d5b56ce14613f49e390ac626"
        },
        {
          "name": "get_chart",
          "title": "Spotify charts",
          "description": "Spotify Charts by country: top_tracks (Top 200), viral_tracks (Viral 50, daily only), top_artists or top_albums. Each entry has rank, previous and peak rank, days (or weeks) on the chart, movement and, for top_tracks, the streams in that period. Defaults to the latest published daily chart.",
          "inputSchema": {
            "properties": {
              "chart": {
                "default": "top_tracks",
                "description": "Which chart.",
                "enum": ["top_tracks", "viral_tracks", "top_artists", "top_albums"],
                "type": "string"
              },
              "country": {
                "default": "global",
                "description": "'global' or a 2-letter country code, e.g. 'us', 'br', 'mx'.",
                "type": "string"
              },
              "date": {
                "description": "Chart date YYYY-MM-DD; omit for the latest published chart.",
                "type": "string"
              },
              "include_play_counts": {
                "default": false,
                "description": "top_tracks / viral_tracks: add each track's lifetime play count (slower).",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Entries to return (1-200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "daily",
                "description": "Daily or weekly chart (viral_tracks is daily only).",
                "enum": ["daily", "weekly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Spotify charts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5bf1ffa32b4b68614505ae3b0da57bd41f7d65266ac96427d149c4138ec6635"
        },
        {
          "name": "get_playlist",
          "title": "Get playlist",
          "description": "A playlist's name, owner, followers and description, plus `limit` tracks (max 100) from `offset` with lifetime play counts. Use next_offset from the answer to page through long playlists (later pages skip the metadata and cost one request).",
          "inputSchema": {
            "properties": {
              "include_play_counts": {
                "default": true,
                "description": "Add each track's lifetime play count.",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Tracks to return (1-100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Index of the first track (0 = start).",
                "minimum": 0,
                "type": "integer"
              },
              "playlist": {
                "description": "Spotify playlist id, spotify:playlist:<id> URI or open.spotify.com/playlist/<id> URL.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["playlist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get playlist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eda3abf72c500a851659fc0c6b7d579c1118160c43f61faaf3e50035d936c567"
        },
        {
          "name": "get_related_artists",
          "title": "Related artists",
          "description": "Artists Spotify lists as related to (\"Fans also like\") the given artist.",
          "inputSchema": {
            "properties": {
              "artist": {
                "description": "Spotify artist id, spotify:artist:<id> URI or open.spotify.com/artist/<id> URL.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many related artists to return (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["artist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Related artists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc897f5235265b58a1c2e3ff262c13f4acee69fabcc0884adbdf4e133dc5f3fd"
        },
        {
          "name": "get_track_insights",
          "title": "Track genres, moods and BPM",
          "description": "Genres, moods and activities (with Spotify's 0-1 weights), tempo in BPM, credits (writers, producers), lyrics flag and vocal languages for up to 50 tracks.",
          "inputSchema": {
            "properties": {
              "tracks": {
                "description": "Spotify track ids, spotify:track:<id> URIs or open.spotify.com/track/<id> URLs (1-50).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tracks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Track genres, moods and BPM"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b4415c81c355ef93f316e1504291ff6836a10ca5c7d5a14ae4a01f51a216f773"
        },
        {
          "name": "get_track_play_count",
          "title": "Track play counts",
          "description": "Lifetime Spotify play counts (streams) for up to 50 tracks in one call, with track name, artists and release date. The fastest way to compare streams. A play count of 0 means fewer than 1,000 plays.",
          "inputSchema": {
            "properties": {
              "tracks": {
                "description": "Spotify track ids, spotify:track:<id> URIs or open.spotify.com/track/<id> URLs (1-50).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tracks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Track play counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f99c38ca1e31ed9e76dff2949ac6c906d480a705d5fc3fb832dd9f298fbf6302"
        },
        {
          "name": "get_tracks",
          "title": "Get tracks",
          "description": "Track details for up to 50 tracks in one call: name, artists, album, release date, duration, explicit flag, popularity, ISRC and (by default) lifetime play count. include_insights adds genres, moods, activities, BPM, credits, lyrics flag and languages. A play count of 0 means fewer than 1,000 plays.",
          "inputSchema": {
            "properties": {
              "include_insights": {
                "default": false,
                "description": "Add genres, moods, BPM, credits and languages (slower).",
                "type": "boolean"
              },
              "include_play_counts": {
                "default": true,
                "description": "Add each track's lifetime play count.",
                "type": "boolean"
              },
              "tracks": {
                "description": "Spotify track ids, spotify:track:<id> URIs or open.spotify.com/track/<id> URLs (1-50).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tracks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get tracks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac155cd6e98316796cff1d4aadc6221122529b9daf0bfba28d0a8a2c53d26789"
        },
        {
          "name": "isrc_lookup",
          "title": "Find tracks by ISRC",
          "description": "Find the Spotify track(s) for an ISRC (International Standard Recording Code), e.g. USUG11904206. Returns ids, names, artists, album and release date.",
          "inputSchema": {
            "properties": {
              "isrc": {
                "description": "12-character ISRC; spaces and dashes are ignored.",
                "maxLength": 20,
                "minLength": 12,
                "type": "string"
              }
            },
            "required": ["isrc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tracks by ISRC"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f64b160f1fa97858c2ad285f4046a1f53417806058be658f2770d3adbf38e34"
        },
        {
          "name": "search",
          "title": "Search Spotify",
          "description": "Search the Spotify catalog by name to find ids for the other tools. `type` picks what to search: tracks, artists, albums or playlists. Returns up to `limit` hits (max 20) with id, name, key fields and open.spotify.com URL, plus `results` (id such as track:<id>, title, url) for the fetch tool. For track searches, include_play_counts adds each hit's lifetime play count.",
          "inputSchema": {
            "properties": {
              "include_play_counts": {
                "default": false,
                "description": "Track searches only: add lifetime play counts (slightly slower).",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Number of results (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, e.g. 'Bad Bunny' or 'blinding lights the weeknd'.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "default": "tracks",
                "description": "What to search for.",
                "enum": ["tracks", "artists", "albums", "playlists"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Spotify"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f510f96031ffccb35c59120478e76d1b6c9c1e0b469b53f948b2cc585b74865"
        }
      ],
      "digest": "sha256:9b040c8f275bdd76cca51237110730463fa44e64b8e6d2dc2d8b7d70d89cc3f6"
    }
  }
}
