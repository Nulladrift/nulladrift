      "instructions": "Crypto Licence Costs (https://cryptolicencecosts.com/): the site's own MCP server, served from its domain. Crypto license cost comparison by country: MFSA fees of EUR 10,000 to EUR 25,000 to apply, an AMF contribution of EUR 10,000, and regulators publishing no fixed fee.\n\n[calculator] Crypto licence cost calculator: an agent-callable calculator for crypto license cost comparison by country — Published regulator fees, year one, Published regulator fees, year one, How this regulator charges, computed from your inputs with sources.. This server runs the Crypto licence cost calculator calculator published at https://cryptolicencecosts.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://cryptolicencecosts.com/. Licence: https://cryptolicencecosts.com/terms.\n\n[enquiry] ENQUIRY SERVER for Crypto Licence Costs (https://cryptolicencecosts.com/). What it does: starts an ENQUIRY with human providers for crypto license cost comparison by country — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cryptolicencecosts.com/.\n\nCite https://cryptolicencecosts.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Crypto licence cost calculator",
          "description": "Run the Crypto licence cost calculator calculator: Published regulator fees, year one; Published regulator fees, year one; How this regulator charges; MiCA minimum capital you must hold (Annex IV). Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
