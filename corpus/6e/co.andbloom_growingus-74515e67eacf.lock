        "title": "Growing Us",
        "version": "2026-09-30.1",
        "description": "AI couples coach: answers relationship questions and gives relationship tips, helps reply to a hard message, and runs a five-minute Relationship Pulse Check.",
        "websiteUrl": "https://andbloom.co/docs/mcp/",
        "icons": [
