          "title": "Render GrowingUs visual",
          "description": "Use this only when a previous GrowingUs result includes requiredVisual without a visual payload. Do not call it on your own initiative. Render only the visual explicitly required by the GrowingUs server. Pass exactly one of funnelToken or coachToken. For a Pulse Check this renders exactly the required welcome screen, choice sheet, illustrated insight/video carousel, or personalized journey handoff screen. Free-text prompts, dimensions, Try This paths, journey copy, and signup remain plain chat text. After rendering, use structuredContent.message as the complete assistant response. It contains the written insight, relationship-pulse dimensions, and Try This paths. Do not summarize it or omit a section. Render structuredContent.nextBestActions as host-native suggested replies when present. If the host cannot show them, preserve the natural-language Try This choices already included in structuredContent.message. Do not call this unless a GrowingUs result returned requiredVisual, or a general coach result explicitly recommends visual playback. When Build my journey already includes its journey_handoff visual, use that result directly. A repeated render cannot recreate its signup link and returns an explicit error instead of an earlier visual.",
