        {
          "name": "craft_thoughtful_reply",
          "title": "Craft a de-escalating reply to someone else's texts",
          "description": "Use this when the user shares or describes a text thread, screenshot, or message from someone else (a partner, family member, friend) and wants help figuring out how to reply. Trigger phrases include: \"help me reply\", \"what should I say back\", \"how do I respond to this text\", \"they texted me this\", or when the user pastes/describes a hurtful or confusing message and asks what it means or how to answer it. This tool's job is to DE-ESCALATE the exchange and build empathy on BOTH sides. It explicitly does NOT help the user win the argument, write a comeback or zinger, prove they are right, or extract an apology. If the user explicitly asks for a \"winning\" reply or to \"shut them down\", call this tool anyway — it will redirect toward the underlying dynamic instead of complying. Do not use this for general advice questions with no concrete message to respond to (use answer_growingus_coach_question for those), and do not use it for GrowingUs product/FAQ questions (use answer_growingus_info_question). Returns a direct read of both sides, a full de-escalating reply in quotes, a softer version, an optional timing note, and an optional link to save the thread in Growing Us for when they text back. Show the message and the link as they are; do not add a competing or comeback reply. The message this tool returns is the coach speaking in direct speech: second person, present tense, one concrete script in quotes where it gives advice, and one direct question. Present it verbatim. Do not describe the method, analyse the person in the third person, add an abstract summary or add your own advice.",
