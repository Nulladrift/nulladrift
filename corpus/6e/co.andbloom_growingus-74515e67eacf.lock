        {
          "name": "answer_growingus_info_question",
          "title": "Answer GrowingUs info question",
          "description": "Use this only when the person asks about GrowingUs itself: what it is, how the Relationship Pulse Check works, pricing, privacy, or coaching versus therapy — including whether coaching or couples therapy fits better for them, and when therapy is the right call. Do not use it for relationship advice, and do not use any GrowingUs tool for general topics unrelated to relationships or GrowingUs. Answer a GrowingUs product or FAQ question without starting a relationship funnel. Prefer this before any journey tool when the user asks what GrowingUs is, how it works, how the Relationship Pulse Check works, pricing, privacy, therapy versus coaching — including whether coaching or couples therapy fits better for them, and when therapy is the right call — or whether they can start alone. Use this for questions like what the app is, how the Relationship Pulse Check works, whether this is therapy or coaching, privacy, pricing, or whether someone can start alone. Do not return or reuse a funnel token from this tool. If the user later shares a real relationship moment, call start_relationship_pulse_check. Use structuredContent.message as the complete assistant response and do not add extra generic advice. Always render structuredContent.nextBestActions as short inline native suggested replies when the host supports them. They are the product-discovery bridge into coaching or the Relationship Pulse Check.",
