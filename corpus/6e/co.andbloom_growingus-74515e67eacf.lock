        {
          "name": "start_relationship_pulse_check",
          "title": "Start Relationship Pulse Check",
          "description": "Use this when the person asks to start a Relationship Pulse Check, or describes a pattern that keeps coming back in their relationship — for example recurring fights about money or chores, crossed boundaries, betrayal and rebuilding trust, long-distance pressure, or drifting apart and wanting to reconnect and repair — and no funnelToken is active in this conversation yet. If this conversation already has a funnelToken, call continue_relationship_pulse_check instead. Do not use it for a one-off advice question or a product question. Start a real GrowingUs Relationship Pulse Check for an explicit request to start, begin, or do a Relationship Pulse Check. Also start it when the user describes one of these situations in their own words, even without naming the product: fights that keep repeating: the same fight again, both of us on the attack, one reaches, one shuts down, we both avoid it, it’s not about the dishes, little things build up; blowups and coming back: days of silence after every fight, can’t let it go; saying hard things: the conversation i keep postponing, i don’t feel heard, they won’t open up, any complaint makes them defensive, honest, but it comes out harsh; drifting and disconnection: roommates, not partners, small reaches go unanswered, phones get in the way, we have grown apart, loved, but not feeling it, something feels off; keeping a good thing good: we’re good and want to stay that way, stuck in a rut, taken for granted, goals we actually keep, getting ready for a big step; intimacy and desire: different levels of desire, we stopped having sex, attraction has changed, intimacy after a baby, illness or medication; load, roles and say: carrying the load, manager, not partner, always rescuing, no say in decisions, saver and spender; trust and old wounds: broken promises and small lies, just friends, or more?, jealousy, phones, passwords and privacy, you weren’t there when i needed you; family, stress and life change: in-laws between us, not on the same parenting team, since the baby, outside stress spilling over, my partner is struggling, loving across distance, life changed and we haven’t caught up, finding my place in a stepfamily, grieving differently; different needs and directions: a disagreement we can’t solve, we slid into it, should i stay or go?, are we just not compatible?, space and togetherness; working on my side: my partner won’t engage, why do i react like this?, the same pattern in every relationship. It also fits a recurring pattern around money or chores, boundaries, betrayal and rebuilding trust, long-distance pressure, or drifting apart and wanting to reconnect and repair. Do not start it for a single hard moment that needs an answer now (blowups and coming back: fights get too heated too fast, after the blowup, the apology doesn’t land; saying hard things: making sense of a hard exchange; drifting and disconnection: good news falls flat; intimacy and desire: can’t talk about sex; trust and old wounds: after an affair; different needs and directions: where is this going?, one leaning out, one leaning in; working on my side: “my partner is a narcissist”; safety first: afraid of my partner, fights that turn physical, thoughts of self-harm, drinking, gambling or using); use answer_growingus_coach_question for those. This is the mandatory first tool whenever GrowingUs is attached and the user explicitly asks to start, begin, do, or run a Relationship Pulse Check, including immediately after a general GrowingUs coaching answer. Call it before writing advice or asking your own questions. This creates the actual anonymous funnel state and returns a funnelToken. Without that token, do not describe a generic question flow as a GrowingUs Relationship Pulse Check. Copy the user's latest request exactly into message. Never add an incident, relationship topic, partner fact, or goal from the assistant's memory or the personality preflight excerpts. When the visible current chat already contains a concrete relationship story or stated goal, pass up to eight relevant user-authored excerpts in conversationContext so the user does not have to repeat themselves. Do not include assistant text, the assistant's memory, hidden context, unrelated messages, or a whole transcript. This narrow handoff is used only for this anonymous Pulse Check and is never exposed back in tool output. If the latest request itself already contains a concrete relationship story, keep that story in message. The server will reuse it and will not ask the user to repeat it. Every explicit start is isolated to this visible conversation. Never reuse or copy a funnelToken from another thread. If the user asks to use the story above, pass only the current thread's user-authored excerpts in conversationContext; the server starts a fresh check grounded in those excerpts. If the request only says to start the check, keep it generic. The coach will ask what the user wants to look at today; do not choose a remembered issue for them. Use the returned message exactly. For every later user reply, call continue_relationship_pulse_check with the returned funnelToken. Never preview or list future Relationship Pulse Check questions. The server returns exactly one question at a time. When structuredContent.visual is present, the mounted app already contains the required welcome or choice visual; render it once and do not call render_growingus_visual again. Only call render_growingus_visual when requiredVisual is returned without a visual payload, such as insight_media generation. Do not use this for product FAQs such as how the Relationship Pulse Check works, pricing, privacy, therapy versus coaching, or whether someone can start alone. The message this tool returns is the coach speaking in direct speech: second person, present tense, one concrete script in quotes where it gives advice, and one direct question. Present it verbatim. Do not describe the method, analyse the person in the third person, add an abstract summary or add your own advice. How a check moves: stage coach_chat is a short chat in which the person tells one concrete recent moment. It ends as soon as there is a concrete moment and what they want to change, and after 4 replies at the latest; canBeginQuestionnaire then turns true and the result offers the short questions (stage questioning). After the questions come the results (ready_for_cards, cards_generated), then a chosen path (reframe_generated, continuation_created). lane is undecided during the chat and becomes quick_spark, guided_pulse_check or full_journey when the questions begin; safety_exit ends the check. evidenceCoverage shows which of six signals are known: concreteMoment (a specific recent moment with what happened and how they reacted, in about 18 words or more), desiredChange (what they want to be different), whatToProtect (what they value between them), and focus, conflictPattern and repairBehaviour, which the short questions fill in. structuredContent.progress says where the person is in plain words; tell them when they ask.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "conversationContext": {
                "description": "Optional, relevant user-authored excerpts from this visible current chat. Use when they already describe the relationship story or goal; never include assistant text, the assistant's memory, hidden context, or unrelated history.",
