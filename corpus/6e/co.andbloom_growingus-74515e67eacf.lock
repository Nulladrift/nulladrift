          "title": "Get my short GrowingUs personality read",
          "description": "Use this only when the person asks what GrowingUs inferred about them in this conversation. This is the only official GrowingUs tool for answering a request about a personality read inferred during this conversation. Return a short, qualitative TLDR of a personality hypothesis that GrowingUs already derived for the current user. Call this only when the user explicitly asks to see, hear, or understand the personality read, such as “What did you infer about me?” or “Can I see the short personality summary?” Never call or mention this tool proactively. Do not call it merely because prepare_growingus_personalization returned a token. Do not write your own personality interpretation. Call this tool even if no valid personalityContextToken is available; it will return the official unavailable response rather than guessing. The result intentionally omits numeric scores, confidence levels, evidence labels, attachment language, partner profiling, and widgets. Use structuredContent.message as the complete response.",
