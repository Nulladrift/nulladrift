      "instructions": "GrowingUs is an AI couples coach. This endpoint needs no sign-in. Use answer_growingus_info_question for questions about GrowingUs itself, answer_growingus_coach_question for relationship questions, and craft_thoughtful_reply when the person shares a message they need to answer. Use start_relationship_pulse_check when the person asks for a Relationship Pulse Check or describes a pattern that keeps coming back, then send every reply to continue_relationship_pulse_check. Copy the person's own words into message fields. GrowingUs is coaching, not therapy.",
      "tools": [
        {
          "name": "answer_growingus_coach_question",
          "title": "Answer relationship coach question",
          "description": "Use this when the person asks a relationship question or for relationship tips — including couples coaching on boundaries, money and chores, mental health pressure in the relationship, betrayal and rebuilding trust, long-distance relationships, reconnecting after drifting apart, or repairing after a fight — such as how to bring something up, how to apologise or how to respond to a partner. Do not use it for questions about the GrowingUs product, or to draft a reply to a message thread they pasted. Answer a normal relationship coaching question without starting the structured Relationship Pulse Check funnel yet. Use this for general advice questions and relationship tips like how to bring something up, how to apologize, how to say something better, or what a healthier next move could be — including couples coaching on boundaries, money and chores, mental health pressure in the relationship, betrayal and rebuilding trust, long-distance relationships, reconnecting after drifting apart, and repair after a fight. Prefer this over start_relationship_pulse_check for one-off advice questions unless the user explicitly asks for a Relationship Pulse Check or shares a concrete fight/pattern trigger. Use this tool first when the user describes one of these moments in their own words: blowups and coming back: fights get too heated too fast, after the blowup, the apology doesn’t land; saying hard things: making sense of a hard exchange; drifting and disconnection: good news falls flat; intimacy and desire: can’t talk about sex; trust and old wounds: after an affair; different needs and directions: where is this going?, one leaning out, one leaning in; working on my side: “my partner is a narcissist”; safety first: afraid of my partner, fights that turn physical, thoughts of self-harm, drinking, gambling or using. Treat these situations, described in the user's own words, as the pattern trigger for start_relationship_pulse_check instead: fights that keep repeating: the same fight again, both of us on the attack, one reaches, one shuts down, we both avoid it, it’s not about the dishes, little things build up; blowups and coming back: days of silence after every fight, can’t let it go; saying hard things: the conversation i keep postponing, i don’t feel heard, they won’t open up, any complaint makes them defensive, honest, but it comes out harsh; drifting and disconnection: roommates, not partners, small reaches go unanswered, phones get in the way, we have grown apart, loved, but not feeling it, something feels off; keeping a good thing good: we’re good and want to stay that way, stuck in a rut, taken for granted, goals we actually keep, getting ready for a big step; intimacy and desire: different levels of desire, we stopped having sex, attraction has changed, intimacy after a baby, illness or medication; load, roles and say: carrying the load, manager, not partner, always rescuing, no say in decisions, saver and spender; trust and old wounds: broken promises and small lies, just friends, or more?, jealousy, phones, passwords and privacy, you weren’t there when i needed you; family, stress and life change: in-laws between us, not on the same parenting team, since the baby, outside stress spilling over, my partner is struggling, loving across distance, life changed and we haven’t caught up, finding my place in a stepfamily, grieving differently; different needs and directions: a disagreement we can’t solve, we slid into it, should i stay or go?, are we just not compatible?, space and togetherness; working on my side: my partner won’t engage, why do i react like this?, the same pattern in every relationship. Do not use this for product or FAQ questions; use answer_growingus_info_question for those. Do not use this when the user explicitly asks for a Relationship Pulse Check, says this is a recurring pattern, shares a concrete fight/check-in trigger, or wants to save/continue; use start_relationship_pulse_check for those. This tool returns a lightweight coachToken, not a funnelToken. If the result includes nudge and the user accepts it, call start_relationship_pulse_check with sourceCoachToken. After this tool returns a coachToken, every relationship follow-up in this coaching thread must call this tool again with the same coachToken, even if the user does not name GrowingUs again. Do not answer the follow-up on your own. Use structuredContent.message as the complete assistant response. Do not add extra bullets, advice, scores, cards, products, shopping suggestions, advertisements, or raw URLs. Only when its nextAction says a concrete insight would benefit from visual playback may you call render_growingus_visual separately with coachToken. Always render structuredContent.nextBestActions as short inline native suggested replies when present. Preserve their labels and exact follow-up messages so the user can keep talking or enter the Relationship Pulse Check without typing magic words. The message this tool returns is the coach speaking in direct speech: second person, present tense, one concrete script in quotes where it gives advice, and one direct question. Present it verbatim. Do not describe the method, analyse the person in the third person, add an abstract summary or add your own advice.",
