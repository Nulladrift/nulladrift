        {
          "name": "prepare_growingus_personalization",
          "title": "Tailor GrowingUs coaching",
          "description": "Use this optional preflight only when the user explicitly agreed to share earlier chat messages and at least two prior user messages from earlier turns already exist in the conversation. Never call it on a first turn, never invent excerpts, and do not use it for product questions or safety situations. Before a GrowingUs relationship coaching answer or Relationship Pulse Check, use a small selection of the user's own relevant messages to tailor the wording, pacing, and suggestions. Only use it when relevant context is available and the user agrees to share it. Do not use it for product FAQs or safety situations. Use only messages about the current user across different situations. Do not use partner-only descriptions. The personality token is only for communication-style personalization. Never infer or carry an incident, relationship topic, partner fact, or current goal from that token into another tool input or user-facing answer. When the user also explicitly starts a Relationship Pulse Check and the excerpts contain their relevant story, pass the same selected user-authored excerpts directly as conversationContext to start_relationship_pulse_check. This is a separate, explicit story handoff; it does not come from the personality token. Do not use assistant text, hidden memory, unrelated history, or a whole transcript. Regardless of whether this tool returns ready, pending, insufficient, or unavailable, immediately call the GrowingUs coach or Relationship Pulse Check tool requested by the user. Pass the latest user request exactly as written in message. Do not end the turn at the personality preflight. This creates a private, tentative coaching preference, not a label, diagnosis, or personality test. Raw message excerpts are discarded after this step. If there is not enough context, continue normally without asking extra personality questions. If ready or pending, pass personalityContextToken to answer_growingus_coach_question or start_relationship_pulse_check.",
