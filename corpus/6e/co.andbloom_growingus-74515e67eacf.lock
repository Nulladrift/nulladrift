        {
          "name": "continue_relationship_pulse_check",
          "title": "Continue Relationship Pulse Check",
          "description": "Use this for every reply the person gives while a Relationship Pulse Check is running. Do not use it to start a new check. This is the only state-changing continuation tool for an active GrowingUs Relationship Pulse Check. Call it for every user reply after start_relationship_pulse_check, even when GrowingUs is not named again. The message field is required. Copy the user's latest reply or clicked inline-action label exactly into message. Never call this tool with only the funnelToken. Use the same natural-language message field for a story, an answer choice, accepting the short questions, or selecting a Try This path. The server interprets it from the active stage. The server owns every stage transition. Never restart the Pulse Check, invent future questions, or choose a stage-specific tool. Use structuredContent.message exactly and show only the single current question returned by the server. For choice questions, structuredContent.visual already contains the interactive sheet. Render that mounted app once; it calls this continuation tool directly and renders the returned state. Do not repeat a saved widget selection. When the result creates a continuation, preserve the exact Markdown link in structuredContent.message as a clickable link. Never output only “Continue on GrowingUs” without its href; a resource_link content item provides the same destination as a fallback. When structuredContent.visual is present, the mounted app already contains the required choice_question or journey_handoff visual; do not call render_growingus_visual again. When requiredVisual is insight_media and no visual payload is present, call render_growingus_visual with the same funnelToken. Otherwise use structuredContent.message as the complete response. The message this tool returns is the coach speaking in direct speech: second person, present tense, one concrete script in quotes where it gives advice, and one direct question. Present it verbatim. Do not describe the method, analyse the person in the third person, add an abstract summary or add your own advice. How a check moves: stage coach_chat is a short chat in which the person tells one concrete recent moment. It ends as soon as there is a concrete moment and what they want to change, and after 4 replies at the latest; canBeginQuestionnaire then turns true and the result offers the short questions (stage questioning). After the questions come the results (ready_for_cards, cards_generated), then a chosen path (reframe_generated, continuation_created). lane is undecided during the chat and becomes quick_spark, guided_pulse_check or full_journey when the questions begin; safety_exit ends the check. evidenceCoverage shows which of six signals are known: concreteMoment (a specific recent moment with what happened and how they reacted, in about 18 words or more), desiredChange (what they want to be different), whatToProtect (what they value between them), and focus, conflictPattern and repairBehaviour, which the short questions fill in. structuredContent.progress says where the person is in plain words; tell them when they ask.",
