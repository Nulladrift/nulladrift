      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "funkyjobs",
        "title": "FunkyJobs Stellensuche",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FunkyJobs ist eine Schweizer Jobplattform. Verlinke bei jeder Stelle den Titel mit dem mitgelieferten Link (url), statt die Adresse auszuschreiben: dort steht das vollständige Inserat mit dem Weg zur Bewerbung.",
      "tools": [
        {
          "name": "get_job",
          "title": "Inserat abrufen",
          "description": "Ruft ein einzelnes Stelleninserat von funkyjobs.ch ab: Titel, Arbeitgeber, Ort, Pensum, Lohn falls angegeben, und einen Auszug der Beschreibung. Das vollständige Inserat und der Weg zur Bewerbung stehen unter dem mitgelieferten Link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Die id eines Treffers aus search_jobs.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inserat abrufen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:65e284a50390233e4b753f2a5d9fe065f47dfc208907521cfc73f0ef50fe1b9b"
        },
        {
          "name": "search_jobs",
          "title": "Stellen suchen",
          "description": "Sucht aktuelle Stelleninserate in der Schweiz auf funkyjobs.ch: Vollzeit, Teilzeit, Nebenjobs und Ferienjobs. Filtert nach Stichwort, Ort mit Umkreis, Pensum, Kategorie und Veröffentlichungsdatum. Liefert je Treffer Titel, Arbeitgeber, Ort, Pensum und den Link zum Inserat auf funkyjobs.ch. Gibt die 20 neuesten Treffer zurück; gibt es mehr, steht die ganze Trefferliste unter more_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Berufsfeld.",
                "enum": ["Administration", "Banking / Versicherung", "Bau / Energie / Umwelt", "Beratung / Consulting", "Chemie / Pharma", "Coiffeur / Beauty", "Detailhandel", "Einkauf", "Event / Promotion", "Finanzen / Controlling", "Fitness", "Forschung / Wissenschaft", "Garten & Landschaftsbau", "Gastronomie", "Handwerk", "Hotellerie", "Human Resources", "Immobilien", "Ingenieurswesen", "IT", "Kinderbetreuung", "Kundenservice", "Lehrer / Pädagogik", "Logistik", "Marketing", "Medizin / Pflege", "Nachhilfe", "Öffentliche Verwaltung", "Recht", "Reinigung", "Security", "Seniorenbetreuung", "Sonstiges", "Soziales", "Technik / Produktion", "Tierbetreuung", "Transport", "Vertrieb", "Weiterbildung", "Zusteller / Verteiler"],
                "type": "string"
              },
              "place": {
                "description": "Ort in der Schweiz, zum Beispiel «Bern» oder «Zürich». Für die ganze Schweiz weglassen.",
                "type": "string"
              },
              "published_within": {
                "description": "Nur Inserate, die heute (today) oder in den letzten 3, 7 oder 30 Tagen veröffentlicht wurden. Ohne Angabe alle.",
                "enum": ["today", "3days", "7days", "30days"],
                "type": "string"
              },
              "query": {
                "description": "Stichwort, zum Beispiel Beruf oder Tätigkeit: «Koch», «Reinigung», «Software Entwickler». Mehrere Wörter müssen alle im Inserat vorkommen; Varianten lassen sich mit OR verbinden («Koch OR Köchin»).",
                "type": "string"
              },
              "radius_km": {
                "description": "Umkreis um den Ort in Kilometern. Ohne Angabe 10 km, mit 0 nur der Ort selbst.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "workload_max": {
                "description": "Höchstpensum in Prozent, zum Beispiel 50 für Teilzeit bis 50 %.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "workload_min": {
                "description": "Mindestpensum in Prozent.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Stellen suchen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
