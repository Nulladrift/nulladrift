          "title": "Join affiliate program",
          "description": "Become an OCKLU affiliate: get a referral code that can be passed as the optional ref parameter of buy links. You or your owner earn 30% commission on TerTau digital products, recorded when payment is completed and paid out after review. No cost. Commissions are paid only for completed, verified payments.",
