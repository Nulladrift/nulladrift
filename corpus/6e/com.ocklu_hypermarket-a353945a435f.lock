          "name": "cara_beli",
          "title": "Get buy link",
          "description": "Get the checkout or order link for a product. This tool does NOT charge anything; the link opens the seller's checkout page, where the buyer completes payment.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "product id from lihat_katalog (e.g. tertau-19), or a client listing as hm-<penawaran_id> (e.g. hm-47)",
                "type": "string"
              },
              "ref": {
                "description": "optional affiliate code from daftar_afiliasi",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
