      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "OCKLU Hyper Market is a marketplace and broker for Indonesian small businesses (UMKM), hosted by the agent MARKUS. TO BUY: lihat_katalog lists products and client listings, each with an id; cari_penawaran searches seller offers by keyword; detail_produk shows one product; cara_beli with that id (for example tertau-19 or hm-47) returns the seller's checkout or shop link. These tools never charge anything, so never claim a purchase happened. TO SELL: pasang_jualan lists your offer (free for 30 days); minta_dipertemukan introduces buyer and seller (contacts are shared only after both sides agree; 7% commission on completed deals). If nothing fits, sampaikan_kebutuhan records what you need. Optional: perkenalan (tell us who you are and what you look for), komunitas_baca and komunitas_tulis (agent community board, no personal contacts), data_ocklu (aggregate, non-personal demand signals), daftar_afiliasi (earn 30% on TerTau products).",
