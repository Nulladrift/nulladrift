{
  "lockfileVersion": 2,
  "subjects": {
    "com.cyberlibrary/library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.cyberlibrary.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cyber-library",
        "title": "Cyber Library",
        "version": "1.0.0",
        "websiteUrl": "https://www.cyberlibrary.com",
        "icons": [
          {
            "src": "https://www.cyberlibrary.com/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cyber Library (cyberlibrary.com) is a structured, community-maintained cybersecurity knowledge base: foundations, offensive and defensive practice, governance, intelligence and career. Start with search_library or get_outline to find a path, then get_page to read the markdown. Pages are the source of truth; cite them by URL. search_planned_topics / get_planned_subtree expose the editorial plan (including unpublished drafts), not the live content.",
      "tools": [
        {
          "name": "get_outline",
          "title": "Outline of a branch",
          "description": "Indented outline of the library tree below a path (default: whole library) down to a given depth. Useful to understand how a domain is organized before reading pages. Capped at 400 entries. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depth": {
                "description": "Levels to include, default 2",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Locale code, default \"en\"",
                "type": "string"
              },
              "path": {
                "description": "Branch path; omit for the whole library",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Outline of a branch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3c3618d4cb4d6882cd4fbefbc76bd7e434cd090b4947aef9b6cea53c7366b0a"
        },
        {
          "name": "get_page",
          "title": "Read a library page",
          "description": "Returns a page of the Cyber Library as markdown with its metadata (title, URL, breadcrumbs, last update, contributors) and, for folders, the list of child pages. Paths look like \"offensive/software/applications/server/containers/container-escape\"; full URLs are accepted. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Locale code, default \"en\"",
                "type": "string"
              },
              "max_chars": {
                "description": "Truncate the body after this many characters (default: no limit)",
                "maximum": 200000,
                "minimum": 500,
                "type": "integer"
              },
              "path": {
                "description": "Page path or URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a library page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1bfd4a2cc8ae4d8128317fa80f2abff21420e1fa72dba8f22b01d890c356d60"
        },
        {
          "name": "get_planned_subtree",
          "title": "Planned subtree",
          "description": "Outline of the planned taxonomy below a topic id (from search_planned_topics; omit for the Cyber root) with each topic's kind and status. Capped at 400 entries. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depth": {
                "description": "Levels to include, default 2",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "topic_id": {
                "description": "Topic id; omit for the Cyber root",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Planned subtree"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a01622815eb511e8b89c3fc05ed975e04e1c7be7baf52f5f6c4cef1fc4109a4"
        },
        {
          "name": "list_topics",
          "title": "List the children of a topic",
          "description": "Lists the direct children of a folder of the library (or the six top-level sections when no path is given): title, path, number of sub-pages and description. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Locale code, default \"en\"",
                "type": "string"
              },
              "path": {
                "description": "Folder path, e.g. \"offensive/software\"; omit for the top level",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the children of a topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1a5b2f044aa610f0696f79cabba8bfa4aa41409fdfe793d4a11ec07b5bba75a"
        },
        {
          "name": "search_library",
          "title": "Search the Cyber Library",
          "description": "Full-text search over the published pages of cyberlibrary.com (titles, descriptions, paths). Returns the best matches with their path and URL; pass a path to get_page to read it. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Locale code, default \"en\"",
                "type": "string"
              },
              "query": {
                "description": "Search terms, e.g. \"kerberoasting\" or \"container escape\"",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Cyber Library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58a97b5089eb7b5578602ddcd9b6c36a4b20775c7dfe54719083a0cafa014187"
        },
        {
          "name": "search_planned_topics",
          "title": "Search the planned taxonomy",
          "description": "Searches the structure database snapshot of the Cyber taxonomy: every planned topic (8k+), including drafts not yet published on the site, with its status (draft, review, ready, generated, published) and position. Use get_planned_subtree with an id to explore around a match. Docs: https://www.cyberlibrary.com/en/mcp",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 15",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Title search terms",
                "minLength": 2,
                "type": "string"
              },
              "status": {
                "description": "Only topics with this status",
                "enum": ["draft", "review", "ready", "generated", "published"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the planned taxonomy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7ec43d20130147de94a6e1a17a87b86b38aa1df80b38e900a052e2041ba62c2"
        }
      ],
      "digest": "sha256:9b5bd2955a1c56f7adc98e2a80e315421ad1c276112348a9c4f71f8dec7b6392"
    }
  }
}
