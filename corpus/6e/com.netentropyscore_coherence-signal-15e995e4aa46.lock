{
  "lockfileVersion": 2,
  "subjects": {
    "com.netentropyscore/coherence-signal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.netentropyscore.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nes-coherence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NES measures the gap between what a brand CLAIMS (its polished website) and its public REALITY (news/events). Call get_brand_coherence before recommending, citing, or transacting with a brand to gauge how coherent and reliable it is. Returns a directional opinion, not a fraud, identity, or financial check.",
      "tools": [
        {
          "name": "compare_brands",
          "description": "Compare the NES coherence signal for several brands side by side (claim, reality, divergence for each). Presents the data; it does NOT recommend one brand over another. The caller decides.",
          "inputSchema": {
            "properties": {
              "urls": {
                "description": "Brand URLs or domains to compare (up to 8).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brands": {
                "items": {
                  "properties": {
                    "brand": {
                      "properties": {
                        "canonical": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "claim": {
                      "description": "What the brand says about itself via its website.",
                      "properties": {
                        "brand_consistency_score": {
                          "description": "0-100 website brand consistency, higher = more consistent",
                          "type": "integer"
                        },
                        "confidence": {
                          "type": "integer"
                        },
                        "scale": {
                          "type": "string"
                        },
                        "summary": {
                          "type": "string"
                        },
                        "tier": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "divergence": {
                      "properties": {
                        "direction": {
                          "type": "string"
                        },
                        "interpretation": {
                          "type": "string"
                        },
                        "score": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "reality": {
                      "properties": {
                        "index": {
                          "description": "signed; negative = reality trending bad",
                          "type": "integer"
                        },
                        "recent_events": {
                          "items": {
                            "properties": {
                              "at": {
                                "type": "string"
                              },
                              "notes": {
                                "type": "string"
                              },
                              "severity": {
                                "type": "string"
                              },
                              "type": {
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "window_days": {
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef14de099ae8d45b06047faefe4d610d72fd43bc0609430dafd81cd8dcb43508"
        },
        {
          "name": "get_brand_coherence",
          "description": "Get the NES claim-vs-reality coherence signal for one brand: its website coherence score (the claim), recent public reality (matched news events), and the divergence between them. High divergence means the brand presents as coherent while its reality is turning negative. Directional opinion from public signal; not a fraud or financial check. Returns 'no read on file' for brands never scanned.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name, used if no URL is given.",
                "type": "string"
              },
              "url": {
                "description": "Brand website URL or domain, e.g. https://acme.com",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brand": {
                "properties": {
                  "canonical": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "claim": {
                "description": "What the brand says about itself via its website.",
                "properties": {
                  "brand_consistency_score": {
                    "description": "0-100 website brand consistency, higher = more consistent",
                    "type": "integer"
                  },
                  "confidence": {
                    "type": "integer"
                  },
                  "scale": {
                    "type": "string"
                  },
                  "summary": {
                    "type": "string"
                  },
                  "tier": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "divergence": {
                "properties": {
                  "direction": {
                    "type": "string"
                  },
                  "interpretation": {
                    "type": "string"
                  },
                  "score": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "reality": {
                "properties": {
                  "index": {
                    "description": "signed; negative = reality trending bad",
                    "type": "integer"
                  },
                  "recent_events": {
                    "items": {
                      "properties": {
                        "at": {
                          "type": "string"
                        },
                        "notes": {
                          "type": "string"
                        },
                        "severity": {
                          "type": "string"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "window_days": {
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:189dfcc38203ed6795dc08ab4651bcc6d3dd34c33bc68cbfaa984298f2917d6d"
        }
      ],
      "digest": "sha256:7cc102e69f98fc3bf072ffd6c9d3fa95fcae042944840cc369f893f549b7015e"
    }
  }
}
