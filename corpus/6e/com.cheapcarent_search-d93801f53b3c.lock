{
  "lockfileVersion": 2,
  "subjects": {
    "com.cheapcarent/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cheapcarent.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cheapcarent-search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CheapCarRent exposes two read-only tools, list_locations and search_cars. Use list_locations to find the exact countryCode, cityParam or iata, then pass it to search_cars. Do not invent a city or airport that is not in the list. search_cars calls the public search and returns at most 8 offers from the city preview, not the whole market. Prices are not a guaranteed quote. The live price and the offer terms are on the offer URL at https://cheapcarent.com. The online booking fee is 17%. The rest of the rental is paid at pick-up. This server cannot book, pay, or look up a customer.",
      "tools": [
        {
          "name": "list_locations",
          "title": "List cities and airports",
          "description": "List the cities and airports CheapCarRent search accepts, with the exact spelling. Each row has country, countryCode, city, cityParam, iata when there is an airport, hasAirport, alsoAccepted spellings and the city page URL. Filter with country (two-letter code), query (city, country, alias or airport code; accents ignored) and airports_only. Pass countryCode as country and cityParam as city to search_cars, or pass iata. An unknown country code returns an error with the covered country codes. An empty list for a query means the place is not covered; do not guess another spelling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airports_only": {
                "type": "boolean"
              },
              "country": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f48a0fe443ce80c3f84d06fc3b3429ad3b8556ce91c2b659ef0cd49dcdbc90e8"
        },
        {
          "name": "search_cars",
          "title": "Search cars",
          "description": "Search current CheapCarRent car rental offers for one place and dates. This is the same city preview as the website, with pick-up and return at 12:00. Each offer has its price in its own currency and priceEur, the same day price in EUR; offers are sorted by priceEur, cheapest first. A rental can run up to 30 days, and pick-up must be within 365 days. The result is one page of at most 8 offers, not the whole market. An empty page is a normal result, not a failure. Prices are not a guaranteed quote. Use each offer URL on https://cheapcarent.com for the live price and that offer's terms. The online booking fee is 17%. The rest of the rental is paid at pick-up. Pass one location only: pickup, or country plus city, or iata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "driver_age": {
                "maximum": 99,
                "minimum": 18,
                "type": "integer"
              },
              "iata": {
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "pickup": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "pickup_date": {
                "type": "string"
              },
              "pickup_time": {
                "const": "12:00",
                "type": "string"
              },
              "return_date": {
                "type": "string"
              },
              "return_time": {
                "const": "12:00",
                "type": "string"
              }
            },
            "required": ["pickup_date", "return_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:13e533d114b2a9884ac61f3030345c96492a88c4a709b78ffaf6f382a3f55b59"
        }
      ],
      "digest": "sha256:0bd271a3c198ac681cbb0c4100c6626f2ae9c56d309e6f3282bd4384061332d2"
    }
  }
}
