{
  "lockfileVersion": 2,
  "subjects": {
    "com.cheapcarent/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cheapcarent.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cheapcarent-search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CheapCarRent exposes two read-only tools, list_locations and search_cars. Use list_locations to find the exact countryCode, cityParam or iata, then pass it to search_cars. Do not invent a city or airport that is not in the list. search_cars calls the public search and returns at most 8 offers from the city preview, not the whole market. Prices are not a guaranteed quote. The live price and the offer terms are on the offer URL at https://cheapcarent.com. The online booking fee is 17%. The rest of the rental is paid at pick-up. This server cannot book, pay, or look up a customer.",
      "tools": [
        {
          "name": "list_locations",
          "title": "List cities and airports",
          "description": "List the cities and airports CheapCarRent search accepts, with the exact spelling. Each row has country, countryCode, city, cityParam, iata when there is an airport, hasAirport, alsoAccepted spellings and the city page URL. Filter with country (two-letter code), query (city, country, alias or airport code; accents ignored) and airports_only. Pass countryCode as country and cityParam as city to search_cars, or pass iata. An unknown country code returns an error with the covered country codes. An empty list for a query means the place is not covered; do not guess another spelling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airports_only": {
                "description": "true to list only places with an airport (rows that have an iata code).",
                "type": "boolean"
              },
              "country": {
                "description": "Two-letter country code, e.g. ES or GR. Only places in this country are listed.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "City, country, alternative spelling or airport code to look for, e.g. Malaga or AGP. Accents are ignored; exact matches come first.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d3a26605f9f4432d7cc68c7288ce3524620fac6fa584717d7ccb21cef663e22e"
        },
        {
          "name": "search_cars",
          "title": "Search cars",
          "description": "Search current CheapCarRent car rental offers for one place and dates. This is the same city preview as the website, with pick-up and return at 12:00. Each offer has its price in its own currency and priceEur, the same day price in EUR; offers are sorted by priceEur, cheapest first. A rental can run up to 30 days, and pick-up must be within 365 days. The result is one page of at most 8 offers, not the whole market. An empty page is a normal result, not a failure. Prices are not a guaranteed quote. Use each offer URL on https://cheapcarent.com for the live price and that offer's terms. The online booking fee is 17%. The rest of the rental is paid at pick-up. Pass one location only: pickup, or country plus city, or iata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "cityParam from list_locations, e.g. barcelona. Pass together with country.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "countryCode from list_locations, e.g. ES. Pass together with city.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "const": "EUR",
                "description": "Only EUR is accepted. Offers keep their own currency in price; priceEur is always in EUR.",
                "type": "string"
              },
              "driver_age": {
                "description": "Driver's age in years, 18 to 99. Accepted but not used for prices: the preview is priced for a standard adult driver; age terms are on each offer's page.",
                "maximum": 99,
                "minimum": 18,
                "type": "integer"
              },
              "iata": {
                "description": "Three-letter airport code from list_locations, e.g. BCN. Use instead of country + city.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "description": "How many offers to return, 1 to 8. Default 8.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "How many of the cheapest offers to skip, for the next page. Default 0.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "pickup": {
                "description": "Free-text place name, e.g. Barcelona. Use only when list_locations gave no exact match; prefer country + city or iata.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "pickup_date": {
                "description": "Pick-up date, YYYY-MM-DD. Today or later, within 365 days.",
                "type": "string"
              },
              "pickup_time": {
                "const": "12:00",
                "description": "Pick-up time. Only 12:00 is supported; may be left out.",
                "type": "string"
              },
              "return_date": {
                "description": "Return date, YYYY-MM-DD. 1 to 30 days after pickup_date.",
                "type": "string"
              },
              "return_time": {
                "const": "12:00",
                "description": "Return time. Only 12:00 is supported; may be left out.",
                "type": "string"
              }
            },
            "required": ["pickup_date", "return_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:76d9ff6b1b22ea341847de858fc885b5b13e4c25cf58ea5f8fce462a69843db3"
        }
      ],
      "digest": "sha256:b3237246322e02ecf6d7c30082cb78f56c3460b8ed35a8a8c6679d8acee7d104"
    }
  }
}
