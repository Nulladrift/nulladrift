        {
          "name": "get_perp_market_history",
          "description": "Get perp funding rate and open interest history. Returns a perpetual future's funding rate and open interest over a\nconfigurable lookback window, sampled at a configurable resolution.\nBoth series come from the same venue snapshot row, so a caller reading\nthem together never compares values sampled at different times.\n\n`funding_rate` is the venue's hourly rate as a decimal fraction, so\n`0.0000125` is 0.00125% per hour. `open_interest` is a coin count of the\nbase asset (`35984.2` for BTC), not a USD notional.\n\nSee the [Time Window & Resolution](#section/Time-Window-and-Resolution)\nsection for the format of `window` and `resolution`.",
          "inputSchema": {
            "properties": {
