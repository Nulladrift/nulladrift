        {
          "name": "get_candles",
          "description": "Get OHLC candles for a symbol. Returns open/high/low/close buckets for an asset over a configurable\nlookback window, sampled at a configurable resolution. Use for\ncandlestick charts and volatility measures that need the intra-bucket\nrange rather than a single close.\n\nOnly sources that store individual ticks can produce OHLC. Requesting\ncandles for an asset priced from a derived or snapshot source returns\n`400`.\n\nSee the [Time Window & Resolution](#section/Time-Window-and-Resolution)\nsection for the format of `window` and `resolution`.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Ends the window at this instant instead of now, so a past period can be read. RFC3339, and not the zero time. A future instant bounds a window that is still filling. Absent reads live data.",
                "type": "string"
              },
              "asset_class": {
                "description": "Asset class to resolve the symbol in. Defaults to `spot` (one of: spot, perp)",
                "type": "string"
              },
              "asset_id": {
                "description": "Backend asset ID. Mutually exclusive with `symbol`: exactly one of the two is required, and naming both is a 400.",
                "type": "string"
              },
              "resolution": {
                "description": "Candle size (e.g. `1m`, `5m`, `1h`).",
                "type": "string"
              },
              "symbol": {
                "description": "Asset symbol to fetch candles for (e.g. `SOL`, `BTC`).",
                "type": "string"
              },
              "window": {
                "description": "Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
