        {
          "name": "get_market_cap_history",
          "description": "Get reported market-cap history. Returns an asset's reported market capitalisation in USD over a\nconfigurable lookback window, sampled at a configurable resolution.\n\nEach point is the figure the data provider reported at that timestamp.\nThe snapshot is written on the provider's ingest cadence, which is\ncoarser than a minute, so a `resolution` of at least `1h` is what the\nseries can actually fill. Buckets with no snapshot behind them are\nabsent rather than zero.\n\nSee the [Time Window & Resolution](#section/Time-Window-and-Resolution)\nsection for the format of `window` and `resolution`.",
          "inputSchema": {
            "properties": {
              "resolution": {
                "description": "Bucket size (e.g. `5m`, `1h`, `1d`). Must be at least `1h` for windows over `1d`.",
                "type": "string"
              },
              "symbol": {
                "description": "Asset symbol to fetch market cap for (e.g. `SOL`, `BTC`).",
                "type": "string"
              },
              "window": {
                "description": "Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
