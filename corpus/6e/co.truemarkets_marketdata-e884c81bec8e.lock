        "name": "marketdata",
        "title": "TrueMarkets Market Data",
        "version": "1.0.0",
        "description": "Real-time crypto market data, trending assets, price history, and market summaries.",
        "websiteUrl": "https://truemarkets.co"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are connected to the True Markets market data API. All tools are read-only and require no authentication.\n\n## Available Tools\n\n### Asset & Price Data\n- list_assets: List all tradeable tokens with symbol, name, chain, address, and decimals.\n- get_asset: Get details for a specific token by chain and contract address.\n- get_price_history: Get historical prices for one or more tokens (batch).\n\n### Market Intelligence\n- get_market_summary: Get a market digest with key bullets, trending assets, and sentiment.\n- get_trending_assets: Get assets trending by trading volume.\n- get_surging_assets: Get assets with the highest recent price change.\n- get_market_cap: Get the market capitalization for a specific asset.\n- list_market_caps: List all assets ranked by market capitalization.\n- get_asset_summary: Get a daily AI-generated summary for a specific asset.\n- get_asset_summary_history: Get historical daily summaries for a specific asset.\n\n## Parameter Defaults\n\n- window defaults to 1d for price history\n- resolution defaults to 5m for price history\n- symbols accepts comma-separated values (e.g., SOL,BTC,ETH)\n- limit defaults vary by tool (10 for trending/surging, 7 for asset summary history)",
