        {
          "name": "get_price_indicators",
          "description": "Get a technical indicator series. Returns one or more technical indicator lines computed from the asset's\nclose prices.\n\nThe requested `window` is widened internally by the indicator's warm-up\ndepth and trimmed back before responding, so the first returned point is\nalready converged rather than carrying seed bias. The window is measured\nback from the most recent available point, so a feed lagging behind the\ncurrent time still returns a full window.\n\n`lines` is keyed by line name. Single-line indicators (`sma`, `ema`,\n`rsi`, `atr`) return one entry named after the indicator. `macd`\nreturns `macd`, `signal` and `histogram`; `bollinger` returns `upper`,\n`middle`, `lower` and `percent_b`.\n\n`atr` reads OHLC candles rather than closes, so it is only available\nfor assets whose price source stores individual ticks; anything else\nreturns `400`. It is Wilder-smoothed and defaults to a period of 14.\n\nThe momentum measures cover fixed spans rather than a caller-supplied\n`period`, which is rejected for them. `surging_1h`, `surging_4h` and\n`surging_24h` are the percent price change over that span, so the\n`resolution` must be coarse enough for the span to fit in 400 buckets —\nthe same bound a supplied `period` carries.\n`trending_ratio` is average reported 24h volume over the last 6 hours\ndivided by its 30-day average, so it needs a CoinGecko-mapped asset and\na `resolution` of at least `1h`.\n\nVWAP is not offered: it needs per-bucket traded volume, which no price\nseries carries.",
          "inputSchema": {
            "properties": {
              "asset_class": {
                "description": "",
                "type": "string"
              },
              "asset_id": {
                "description": "Backend asset ID. Mutually exclusive with `symbol`: exactly one of the two is required, and naming both is a 400.",
                "type": "string"
              },
              "fast_period": {
                "description": "MACD fast EMA length. Defaults to 12.",
                "type": "number"
              },
              "indicator": {
                "description": " (one of: sma, ema, rsi, macd, bollinger, atr, surging_1h, surging_4h, surging_24h, trending_ratio)",
                "type": "string"
              },
              "period": {
                "description": "Lookback in candles. Required for sma, ema and rsi; defaults to 20 for bollinger and 14 for atr, and is not used by macd. Rejected for the momentum measures, which cover a fixed span.",
                "type": "number"
              },
              "resolution": {
                "description": "Candle size the period counts in (e.g. 1m, 1h, 1d)",
                "type": "string"
              },
              "signal_period": {
                "description": "MACD signal EMA length. Defaults to 9.",
                "type": "number"
              },
              "slow_period": {
                "description": "MACD slow EMA length. Defaults to 26; must exceed fast_period.",
                "type": "number"
              },
              "std_dev": {
                "description": "Bollinger band width in standard deviations. Defaults to 2.",
                "type": "number"
              },
              "symbol": {
                "description": "Asset symbol (e.g. SOL, BTC)",
                "type": "string"
              },
              "window": {
                "description": "Time window for the series (e.g. 1d, 7d, 1M)",
                "type": "string"
              }
            },
            "required": ["indicator"],
            "type": "object"
          },
