          },
          "digest": "sha256:137bb5b97e3d3fbc5af951e1da032d541aa4b32dec8953ab8c941e2f35c8a2e4"
        },
        {
          "name": "list_models",
          "description": "List available image models with pricing and latency.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:71717716da7462c3f5e65dc29b16407a389993eecb5c4f3c8192efdd653e01a2"
        },
        {
          "name": "list_templates",
          "description": "List card templates with their slots, style axes and exact price.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List templates"
          },
          "behavior": {
            "destructive": false,
