{
  "lockfileVersion": 2,
  "subjects": {
    "com.pixfaro/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pixfaro.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pixfaro",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Generate and edit images with any major model. Pick one with list_models; nano-banana-2 is the general default.",
      "tools": [
        {
          "name": "check_job",
          "description": "Check an async generation job by its j_… id. Slow models (mode \"async\" in list_models) return a job instead of an image — poll this until it succeeds or fails.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "j_… id returned by generate_image / edit_image",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Check job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc819649d80276ee5a91285c6f2850b444fd8163f73ad18eb4b1643486dd1b3b"
        },
        {
          "name": "edit_image",
          "description": "Edit a previously generated image by its img_… id with a natural-language instruction.",
          "inputSchema": {
            "properties": {
              "aspect_ratio": {
                "description": "Omit to keep the source image's shape. If set, it is per-model — see list_models.",
                "type": "string"
              },
              "image": {
                "description": "img_… id of a previous generation",
                "type": "string"
              },
              "instruction": {
                "description": "What to change",
                "type": "string"
              },
              "model": {
                "default": "nano-banana-2",
                "type": "string"
              },
              "overlay": {
                "oneOf": [
                  {
                    "const": "default",
                    "description": "Apply your saved brand kit (set with PUT /v1/brand-kit)",
                    "type": "string"
                  },
                  {
                    "description": "Optional brand overlay composited into a corner after generation. Provide EITHER text OR logo_id (an uploaded brand logo), not both.",
                    "properties": {
                      "color": {
                        "description": "text only; \"auto\" (default) or #RRGGBB",
                        "type": "string"
                      },
                      "font": {
                        "description": "text only; default space-grotesk",
                        "enum": ["space-grotesk", "inter", "jetbrains-mono"],
                        "type": "string"
                      },
                      "logo_id": {
                        "description": "A logo uploaded via POST /v1/logos (mutually exclusive with text)",
                        "type": "string"
                      },
                      "logo_style": {
                        "description": "Logo treatment (logo_id only). RECOMMENDED default \"sticker\": crisp die-cut border + drop shadow, legible on any photo. \"shadow\": drop shadow only (use when the logo already contrasts the scene). \"outline\": border only, flat cut-out. \"none\": bare logo, its own alpha only (use only for a pre-processed logo on a controlled background).",
                        "enum": ["sticker", "shadow", "outline", "none"],
                        "type": "string"
                      },
                      "margin": {
                        "description": "\"safe\" (default) or a non-negative px number"
                      },
                      "opacity": {
                        "description": "0.2–1.0, default 0.9",
                        "type": "number"
                      },
                      "position": {
                        "description": "default bottom-right",
                        "enum": ["top-left", "top-right", "bottom-left", "bottom-right"],
                        "type": "string"
                      },
                      "size": {
                        "description": "text cap-height or logo width; default m",
                        "enum": ["s", "m", "l"],
                        "type": "string"
                      },
                      "text": {
                        "description": "Handle to render, ≤64 chars, single line (mutually exclusive with logo_id)",
                        "type": "string"
                      },
                      "weight": {
                        "description": "text only; default 700",
                        "enum": [400, 500, 700],
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                ]
              },
              "resolution": {
                "description": "Output tier; defaults to the source image's",
                "enum": ["1K", "2K", "4K"],
                "type": "string"
              }
            },
            "required": ["image", "instruction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Edit image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee4af99923a77a716212c5fe4257784a982c307fe5d697789ddac40cc14ccb4a"
        },
        {
          "name": "generate_image",
          "description": "Generate an image from a text prompt. Returns a hosted URL plus cost and balance. Slow models (mode \"async\" in list_models) return a j_… job id instead — poll it with check_job.",
          "inputSchema": {
            "properties": {
              "aspect_ratio": {
                "description": "e.g. \"16:9\" (default 1:1). Ratios are per-model — list_models names the ones verified for each. Gemini models take a fixed set (no 4:1 or wider); the budget fal models compute any bounded W:H, so use one of those for banner shapes — up to 4:1 / 1:4, beyond which the derived strip gets too thin to send. Every fal model is 1K-only, so that is the practical bound.",
                "type": "string"
              },
              "model": {
                "default": "nano-banana-2",
                "description": "Model id from list_models",
                "type": "string"
              },
              "overlay": {
                "oneOf": [
                  {
                    "const": "default",
                    "description": "Apply your saved brand kit (set with PUT /v1/brand-kit)",
                    "type": "string"
                  },
                  {
                    "description": "Optional brand overlay composited into a corner after generation. Provide EITHER text OR logo_id (an uploaded brand logo), not both.",
                    "properties": {
                      "color": {
                        "description": "text only; \"auto\" (default) or #RRGGBB",
                        "type": "string"
                      },
                      "font": {
                        "description": "text only; default space-grotesk",
                        "enum": ["space-grotesk", "inter", "jetbrains-mono"],
                        "type": "string"
                      },
                      "logo_id": {
                        "description": "A logo uploaded via POST /v1/logos (mutually exclusive with text)",
                        "type": "string"
                      },
                      "logo_style": {
                        "description": "Logo treatment (logo_id only). RECOMMENDED default \"sticker\": crisp die-cut border + drop shadow, legible on any photo. \"shadow\": drop shadow only (use when the logo already contrasts the scene). \"outline\": border only, flat cut-out. \"none\": bare logo, its own alpha only (use only for a pre-processed logo on a controlled background).",
                        "enum": ["sticker", "shadow", "outline", "none"],
                        "type": "string"
                      },
                      "margin": {
                        "description": "\"safe\" (default) or a non-negative px number"
                      },
                      "opacity": {
                        "description": "0.2–1.0, default 0.9",
                        "type": "number"
                      },
                      "position": {
                        "description": "default bottom-right",
                        "enum": ["top-left", "top-right", "bottom-left", "bottom-right"],
                        "type": "string"
                      },
                      "size": {
                        "description": "text cap-height or logo width; default m",
                        "enum": ["s", "m", "l"],
                        "type": "string"
                      },
                      "text": {
                        "description": "Handle to render, ≤64 chars, single line (mutually exclusive with logo_id)",
                        "type": "string"
                      },
                      "weight": {
                        "description": "text only; default 700",
                        "enum": [400, 500, 700],
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                ]
              },
              "prompt": {
                "description": "What to draw",
                "type": "string"
              },
              "resolution": {
                "description": "Output tier (default 1K); supported tiers and prices per model are in list_models",
                "enum": ["1K", "2K", "4K"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Generate image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ae2fa9fa6aa733a3ed54085f0536c20bc7162fd4c160b20119ee114ce388772"
        },
        {
          "name": "get_balance",
          "description": "Show the current prepaid balance in USD.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
