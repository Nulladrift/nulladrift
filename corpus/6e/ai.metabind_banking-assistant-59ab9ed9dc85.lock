        {
          "name": "trend_card",
          "title": "Trend Card",
          "description": "Render trend_card: Any metric over time that has no dedicated card — one category's spend by month, a series you computed. Points are {label, value} in display order. Set upIsGood=false for cost-like metrics. Use chartStyle:'bar' whenever the user compares periods — month by month, or over the last 3/6/12 months; give each point a `series` name (repeating the label once per series) to stack them with a legend. Pass `items` to list the composition behind the number.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Any metric over time that has no dedicated card — one category's spend by month, a series you computed. Points are {label, value} in display order. Set upIsGood=false for cost-like metrics. Use chartStyle:'bar' whenever the user compares periods — month by month, or over the last 3/6/12 months; give each point a `series` name (repeating the label once per series) to stack them with a legend. Pass `items` to list the composition behind the number.",
            "properties": {
              "change": {
                "default": 0,
                "description": "The change over the period, in the same unit as `current`. Send it together with `start` whenever you have them: the card leads with this figure, and left out it has to work back from `change_pct`, which is close but not the real number.",
                "type": "number"
              },
              "change_pct": {
                "default": 0,
                "type": "number"
              },
              "chartStyle": {
                "default": "line",
                "description": "'bar' draws discrete bars on a labelled x axis — better for comparing periods against each other, and the only style that stacks series. 'line' is the continuous trend.",
                "enum": ["line", "bar"],
                "type": "string"
              },
              "current": {
                "default": 0,
                "type": "number"
              },
              "items": {
                "description": "Optional rows under the chart — the composition behind the number (accounts behind a net worth, categories behind a month's spend). Each is { name, detail, value, color?, prompts? }. `color` is a named colour for the dot ('blue', 'green', …); omit it and rows are coloured in order. `prompts` are follow-up questions offered when the row is tapped — each string is shown as the menu label AND sent to the assistant verbatim, so keep them short and self-contained ('How has my Brokerage changed?', not 'changed?'). OMIT `prompts` unless a row needs something its name cannot imply: left out, the card builds its own drill-down from `name`, which saves you writing the same sentence once per row.",
                "items": {
                  "properties": {
                    "color": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "prompts": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "nextSteps": {
                "description": "One short follow-up the user might ask next, in the form icon|question — 'calendar|Show me last month'. Phrase the question the way the user would say it, and take the icon from the table in the app instructions; any other name renders blank. Always supply 2-3. The card itself ignores them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "default": "",
                "description": "Usually omit this. Optional one-line insight rendered inside the card. Only pass it when you ALREADY have the figures in hand from a call you made for another reason — never make an extra tool call just to write a note, because that round trip delays the card itself. When you do add one, say something the card does not already show (what drove a change, what to watch), in one sentence, and never guess a number.",
                "type": "string"
              },
              "periodLabel": {
                "default": "Past 12 months",
                "type": "string"
              },
              "points": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "series": {
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "start": {
                "default": 0,
                "type": "number"
              },
              "title": {
                "default": "Trend",
                "type": "string"
              },
              "upIsGood": {
                "default": true,
                "description": "false for cost-like metrics: an increase renders red, a decrease green.",
                "type": "boolean"
              },
              "valueFormat": {
                "default": "currency",
                "description": "How the hero value and change are formatted.",
                "enum": ["currency", "number"],
                "type": "string"
              },
              "valueSuffix": {
                "default": "",
                "description": "Optional unit appended to values, e.g. ' subs' or '/mo'.",
                "type": "string"
              }
