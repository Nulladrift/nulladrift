        {
          "name": "subscriptions",
          "title": "Subscriptions",
          "description": "Render subscriptions: Recurring charges: total monthly cost and a row per subscription with its cadence, next charge date, and New / price-increase flags. It loads its own data.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Recurring charges: total monthly cost and a row per subscription with its cadence, next charge date, and New / price-increase flags. It loads its own data.",
            "properties": {
              "nextSteps": {
                "description": "One short follow-up the user might ask next, in the form icon|question — 'calendar|Show me last month'. Phrase the question the way the user would say it, and take the icon from the table in the app instructions; any other name renders blank. Always supply 2-3. The card itself ignores them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
