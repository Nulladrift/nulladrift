        {
          "name": "net_worth_trend",
          "title": "Net Worth Trend",
          "description": "Render net_worth_trend: Net worth: current total, change over the period, a trend chart, and the account balances behind it. It loads its own data. To compare periods against each other pass chartStyle:'bar' plus groupBy ('year' for this-year-vs-last-year, 'month' for month-by-month) — each bar is that period's closing balance.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Net worth: current total, change over the period, a trend chart, and the account balances behind it. It loads its own data. To compare periods against each other pass chartStyle:'bar' plus groupBy ('year' for this-year-vs-last-year, 'month' for month-by-month) — each bar is that period's closing balance.",
            "properties": {
              "chartStyle": {
                "default": "line",
