          "name": "store_session_summary",
          "title": "Save Session Summary",
          "description": "Store a compressed summary of this session to preserve continuity for the next one.\n\nCall this before ending a conversation — it is the dream cycle.\n\nStores a L3 session fact with key='session-latest' (or 'session-latest:claude-code' etc.), auto-archiving the previous version. The next session loads this via load_context().\n\nInclude: what was discussed/decided, what changed, what's next/unresolved.\n\nCollaborative takeaways: at natural session-end signals (user says 'okay I'm out', 'let's wrap', 'bye'), draft a one-line takeaway and confirm with the user before storing. Example: \"I'll remember: we fixed the rebind bug and decided to skip transcript ingestion for MVP. Sound right?\" Edit based on their response, then call store_session_summary. This makes memory consensual and catches mistakes immediately.\n\nUse session_id to scope by client: 'claude-code', 'claude-chat', 'cursor', 'openclaw'",
          "inputSchema": {
            "properties": {
              "contributors": {
                "description": "Optional list of contributor IDs when multiple agents or users collaborated this session (e.g. ['agent-A', 'chad', 'emily']). Stored in summary for attribution.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "decisions": {
                "description": "Key decisions made or conclusions reached",
                "type": "string"
              },
              "next_steps": {
                "description": "What's pending, open questions, what to pick up next session",
                "type": "string"
              },
              "scope": {
                "description": "Optional project slug for project-scoped last-wake-epoch watermark (conventions/wake-rehydration-v2:current).",
                "type": "string"
              },
              "session_id": {
                "description": "Optional client identifier to scope this summary: 'claude-code', 'cursor', 'claude-chat', 'openclaw'. Defaults to bare session-latest.",
                "type": "string"
              },
              "summary": {
                "description": "What happened this session — decisions made, work done, context established",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
