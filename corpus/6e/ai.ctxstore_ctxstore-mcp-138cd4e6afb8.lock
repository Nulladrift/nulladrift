        {
          "name": "search_facts",
          "title": "Search Facts",
          "description": "Search your persistent memory for stored facts.\n\nFor session bootstrap, prefer load_context() or wake_status() — they pull your identity, conventions, and latest self-note deterministically. Use search_facts when you need semantic discovery across the fact corpus.\n\nUse namespace parameter to scope searches: namespace='webapp' matches 'webapp/decisions', 'webapp/technical', etc. (prefix matching).\n\nSearch tips: use the words the fact was stored with. If you stored 'Postgres database', search for 'database' or 'Postgres', not 'data storage solution'.\n\nEach search embeds the query on a shared embedder: at most 4 searches (search_facts, search_context) per account run at once; past that a call waits up to 2 s, then answers {\"code\": \"busy\", \"retry_after_s\": 2}. Fan out with 2-4 readers, not 16.",
