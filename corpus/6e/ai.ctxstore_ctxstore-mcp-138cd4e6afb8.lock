      "instructions": "This account has persistent memory on ctxstore. What is stored here is available next session, in any client, to any agent the account holder connects. The memory arrives on its own: the first tool result of every session opens with it, addressed as the memory of the person you are assisting. Nothing needs fetching first.\n\nHow people get value from it, in the order it usually happens:\n1. If a tool answers with a setup prompt, the account is not linked yet. setup_account(mode='link_or_create', email) sends a six-digit code; setup_account(mode='verify', code, email) finishes. Keys are never pasted, echoed, or stored.\n2. store_fact when a decision, a learning, or a change of state happens, in the turn it happens. Short, searchable, with a stable key when the fact will change later.\n3. search_facts or get_fact before asking the person to repeat something they have told an agent before.\n4. Near the end of a session, store_session_summary, then agent:<id>:self-note:closing, so the next session starts where this one stopped.\n5. Bring their memory with you: if you already remember things about this person from your own platform memory, offer to carry them over with store_facts, one fact per item, in their words, with the date learned when known.\n\nAn agent identity is assigned when the session starts (the memory block names it); bind_agent(agent_id=...) renames it when the person prefers a name. Full manual: https://ctxstore.ai/llms.txt",
      "tools": [
        {
          "name": "accept_invite",
          "title": "Accept Namespace Invitation",
          "description": "Accept a namespace invitation addressed to THIS authenticated account's verified email (two-step email OTP).\n\nSteps:\n1) step='request' — emails a 6-digit code to the invited address (may return 402 needs Collaborator, or 503 if mailer fails).\n2) step='confirm' with code= the 6 digits — activates the grant. Then switch_workspace(name=<grantor>) enters it on this same connection (mcp_config with the X-Ctxstore-Workspace header is also returned for header-based clients).\n\nThe code activates the named grant_id only; it authorizes nothing else. Obtain grant_id from list_invites(). Docs: https://ctxstore.ai/docs.html#verify-invitations",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "6-digit code from email (required when step=confirm).",
                "type": "string"
              },
              "grant_id": {
                "description": "UUID of the invitation (from list_invites or invite email).",
                "type": "string"
              },
              "step": {
                "description": "request = send OTP email; confirm = submit code.",
                "enum": ["request", "confirm"],
                "type": "string"
              }
            },
            "required": ["grant_id", "step"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d9977955837133fd5ed871df7c4c0614dfff59b51d049ab7c8c0e49a766db19"
        },
        {
          "name": "bind_agent",
          "title": "Bind Agent Identity",
          "description": "Bind a sticky agent identity to this MCP session. Once bound, wake_status and load_context default to this agent_id when called without an explicit agent_id= arg — no need to pass identity on every call. Per-call override still works.\n\nPersisted to mcp_sessions.agent_id (migration 0008), so the binding survives setup_account(mode='restore') and the server re-hydrates it automatically on the next tool call.\n\nCall once near the start of a session, ideally from your boot recipe (HANDLER: bind_agent agent_id=<self>). Idempotent: re-binding the same agent_id is a no-op. Pass agent_id='' to clear the binding.\n\nblind_since= (with blind=true) sets when the blind session began, so list_facts_by_key_prefix hides feed comms keyed before it; the default is the session's start minus 60 s.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Agent identity slug (e.g. 'emily_code_4.7'). Empty string clears the binding.",
                "type": "string"
              },
              "blind": {
                "description": "Optional, default false. true = blind session for a model fitting: from now on the wake bundle, every related/nearest list and the search tools on this session leave out keys under letter-to-emily:, project:*:wake:fresh-eye:, project:*:fitting:, project:*:agent:*:model-upgrade: and earlier fittings' feed comms (comms:...:feed-q-, feed-a-, fresh-eye-, ack-fresh-eye-), plus keyless facts whose text starts with a fitting product marker (FINDINGS, COMPARE, MODEL TRIAL ...); search_facts' include_granted then defaults to false. Remembered for the session; pass false to turn it off. get_fact by exact key is not filtered; list_facts_by_key_prefix lists only feed comms whose key epoch is at or after the moment blind turned on (this run's own feed).",
                "type": "boolean"
              },
              "blind_since": {
                "description": "Optional, with blind=true: the blind start in unix epoch seconds (a fitting passes its FITTING_STARTED_EPOCH); list_facts_by_key_prefix then hides feed comms keyed before it, and it must lie within 24 h before and 300 s after the server clock. Default: the session's start minus 60 s. On an already-blind session the earlier start is kept.",
                "type": "number"
              },
              "scope": {
                "description": "Optional project slug (project:<slug>:*). The handed-back closing and opening notes are then chosen the way wake_status(scope=...) checks them: project:<slug>:agent:<id>:self-note:* or the global agent:<id>:self-note:*, newest wins. It also becomes the session's workspace scope, as switch_workspace(<slug>) does, so later wake_status() and load_context() use it too. Defaults to the session's workspace scope. Without any scope the newest note is labelled with its project and other projects' notes are listed by key.",
                "type": "string"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
