              "max_total_chars": {
                "default": 32000,
                "description": "Total bundle cap. If the assembled bundle exceeds this, a BUNDLE WARNINGS section is appended with the size signal. The bundle is NOT truncated at this limit — the warning lets the caller decide whether to lower top_k_per_layer or use targeted get_fact queries. Default 32000.",
                "type": "integer"
              },
              "profile": {
