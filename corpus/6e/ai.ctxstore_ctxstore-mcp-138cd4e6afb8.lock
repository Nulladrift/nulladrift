        {
          "name": "get_fact",
          "title": "Get Fact by Key",
          "description": "Retrieve a fact by its exact key — deterministic, never misses. Use get_fact for self-notes: get_fact(key='agent:<name>:self-note:opening') or get_fact(key='agent:<name>:self-note:closing'). search_facts misses self-notes because their embedding similarity scores below other identity facts — get_fact(key=) is the only reliable retrieval path. Also use for inter-agent handoffs when the exact key is known. Returns the current (non-deprecated) version of the fact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_granted": {
                "default": true,
                "description": "When true (default) and this account has no fact under the key, a key that starts with a prefix shared with this account resolves from that workspace, tagged |from:<grantor>'s workspace: <prefix>. Set false to read this account only. Ignored inside a workspace session.",
                "type": "boolean"
              },
              "key": {
                "description": "Exact fact key (e.g. 'sprint:bootstrap-namespace:review-emily_dev')",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
