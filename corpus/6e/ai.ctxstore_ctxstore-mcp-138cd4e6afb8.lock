        },
        {
          "name": "watch_events",
          "title": "Watch Events (long-poll fact writes)",
          "description": "Long-poll this account's fact-write events instead of re-scanning with since_epoch. Every store/supersede/delete/archive/restore/move publishes one event {key, id, namespace, layer, op, ts, seq}. One call waits up to max_wait_s (max 25) for the first matching event and returns up to 50, plus next_since. MCP has no streaming here, so loop: pass next_since back as `since` on the next call and nothing is missed (the server keeps the last ~10000 events per account). Omit since to start from now; since=0 replays what is retained; a bare integer N returns events with seq > N.\n\nEXAMPLES\n- Wait for hands to post results:\n    watch_events(prefix='task:pr27-review:result:', max_wait_s=25)\n- Resume:\n    watch_events(prefix='comms:<your-agent-id>:', since='<next_since>')\n\nInside a workspace only events for keys the grant can read are returned. Long-lived clients can use GET /api/v1/events (SSE) instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_wait_s": {
                "default": 20,
                "description": "Seconds to wait for the first event (0-25, default 20).",
                "type": "number"
              },
              "namespace": {
                "description": "Only events in this namespace (exact).",
                "type": "string"
              },
              "prefix": {
                "description": "Only events whose key starts with this prefix.",
                "type": "string"
              },
              "since": {
                "description": "Resume cursor: the next_since of the previous call (a stream id '<ms>-<n>'), '0' for everything retained, or a seq integer. Omit to start from now.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f31bf893d2f989642ef60874181dc0a0499924d27e1bf018e1d89953a05f1c0"
        }
