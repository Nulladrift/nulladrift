          "description": "Store information that should persist across sessions.\n\nStorage tips for best retrieval:\n- Include searchable keywords: 'We chose the Postgres DATABASE for ACID compliance' is better than 'We chose Postgres for ACID compliance'\n- Use the key parameter for facts that change over time (pricing, stack, team-members, current-sprint). When you store with the same key, the old version is archived automatically.\n- Use namespaces to organize: 'webapp/decisions', 'business/goals', 'team/members'\n- Store DECISIONS and CONTEXT, not raw data. 'We decided X because Y' is more useful than 'X happened'\n- Use category to classify: technical, decision, preference, identity, relationship\n- Use layer for context depth: 0=identity(stable), 1=architecture(monthly), 2=state(weekly), 3=session(daily)\n\nBefore ending a conversation, call store_session_summary to preserve continuity.",
