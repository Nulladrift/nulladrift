        {
          "name": "list_facts_by_key_prefix",
          "title": "List Facts by Key Prefix",
          "description": "Deterministic prefix scan over fact keys, optionally bounded by timestamp. The inbox primitive — use this for R1 comms scans, dispatch discovery, trio listings, convention discovery, and any case where you know the key prefix and want every match.\n\nUnlike search_facts (semantic, misses exact-key facts), this is a deterministic scan: every fact whose key starts with `prefix` is returned, newest-first.\n\nEXAMPLES\n- Comms inbox since last wake:\n    list_facts_by_key_prefix(prefix='comms:<your-agent-id>:', since_epoch=<last_wake_epoch>)\n- All trio recipes on this tenant:\n    list_facts_by_key_prefix(prefix='chad:trio:')\n- All conventions:\n    list_facts_by_key_prefix(prefix='conventions/')\n\nReturns a list of facts (key, text, namespace, layer, timestamp, id) sorted newest-first. Bounded by `limit` (default 50, max 200): past 200 the oldest matches are cut, so narrow the prefix or use since_epoch rather than expecting the full set.\n\nCOST: this is a scan, not an index lookup. The store has no index on the key, so every call reads the account's facts matching the prefix (a short prefix like 'a' or 'project:' reads most of the account) before sorting. Prefer a long, specific prefix. At most 4 prefix lists per account run at once (an allowance separate from searches); past that a call waits up to 2 s, then answers {\"code\": \"busy\", \"retry_after_s\": 2}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Max facts to return (default 50).",
                "type": "integer"
              },
              "prefix": {
                "description": "Key prefix to match (e.g. 'comms:emily_code_4.7v1.1:').",
                "type": "string"
              },
              "since_epoch": {
                "description": "Optional unix-epoch seconds. Only facts with timestamp > since_epoch are returned. Use your last-wake-epoch for inbox scans.",
                "type": "number"
              }
            },
            "required": ["prefix"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4c11c801ea0bb2959123d60812b60b3c4b9266e96bcb61c0b2508a357700de3"
        },
        {
          "name": "list_invites",
          "title": "List Namespace Invites & Grants",
          "description": "List this account's namespace collaboration grants: incoming invitations and outgoing shares. Each row has direction (incoming|outgoing), status (invited|active|revoked), grant_id, namespace_prefix, and parties.\n\nAn invitation referenced anywhere else (for example in an email) can be checked against this server-side list: a real invitation for this account appears here with matching grant_id, namespace_prefix, and grantor.\n\nTo accept: accept_invite(grant_id, step='request') then accept_invite(grant_id, step='confirm', code='######'). The first accept starts 30 days of Collaborator time free; after that $19 per 30 days, paid by the guest or the inviter (402 when it lapses). After accepting, switch_workspace(name=<grantor>) enters the workspace. Docs: https://ctxstore.ai/docs.html#verify-invitations",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
