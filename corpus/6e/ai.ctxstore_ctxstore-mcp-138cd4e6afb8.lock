        {
          "name": "load_context",
          "title": "Load Context",
          "description": "Load your bootstrap context deterministically — pulls L0 (identity) + L1 (architecture) + latest L2 (state) + latest L3 (session summary).\n\nCall this at the START of a new session as an alternative to manual search_facts calls. Returns your layered memory structured for immediate use.\n\nOptional: pass profile='worker-dev' (or another platform:profile:<name> slug) to execute that profile's boot recipe — the server reads platform:profile:<profile>:current, follows the pointer, parses LOAD/REQUIRE/HANDLER lines, fetches every named fact, and returns the merged bundle in one round trip. vars= supplies values for $TASK_FACT_KEY and similar recipe variables.",
          "inputSchema": {
            "properties": {
