        {
          "name": "start_checkout",
          "title": "Start checkout for a paid upgrade",
          "description": "Optional: a Stripe link for your human to pay for a 24-hour fast-track or a Featured placement. Call only after the user asked for the upgrade and agreed to its terms (termsUrl from the upgrades list); pass its termsVersion as acceptTerms. Returns a checkoutUrl the user opens to pay. Nothing is charged by this tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acceptTerms": {
                "description": "The upgrade's termsVersion, sent only after the user agrees to the terms.",
                "maxLength": 20,
                "type": "string"
              },
              "bot": {
                "description": "featured-*: share link or directory slug of the listed Bot.",
                "maxLength": 300,
                "type": "string"
              },
              "category": {
                "description": "fasttrack-listing: the directory category.",
                "enum": ["research-briefings", "inbox-calendar", "coding-shipping", "customer-sales", "finance-ops", "content-publishing", "personal-admin", "teams-handoffs"],
                "type": "string"
              },
              "email": {
                "description": "The user's email for the Stripe receipt and this order.",
                "maxLength": 254,
                "type": "string"
              },
              "offer": {
                "description": "fasttrack-listing for an unlisted Bot; featured-7d or featured-30d for a listed one.",
                "enum": ["fasttrack-listing", "featured-7d", "featured-30d"],
                "type": "string"
              },
              "shareUrl": {
                "description": "fasttrack-listing: the Bot's x.ai share link.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["acceptTerms", "email", "offer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start checkout for a paid upgrade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0ec3c72706c9d710d804ba500ae377170e809de251f2de97532a6bc328273f8"
        },
        {
          "name": "submit_bot",
          "title": "Submit a Grok Bot to the directory",
          "description": "Submit your own public Grok Bot share link for a free, human-reviewed listing. Only for a Bot the user built or has permission to share. The share link is checked live on x.ai and the listing is credited to the creator. Returns status queued, already_queued, listed, invalid or not_found, plus optional paid upgrades. Free; never call start_checkout unless the user asks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Directory category that fits the Bot best.",
                "enum": ["research-briefings", "inbox-calendar", "coding-shipping", "customer-sales", "finance-ops", "content-publishing", "personal-admin", "teams-handoffs"],
                "type": "string"
              },
              "credit": {
                "description": "Optional name or @handle to credit if the share page shows only a first name.",
                "maxLength": 80,
                "type": "string"
              },
              "origin": {
                "description": "Optional https:// link to the post that announced the Bot.",
                "maxLength": 200,
                "type": "string"
              },
              "shareUrl": {
                "description": "Public share link from Grok Bot's Copy share link, e.g. https://x.ai/bot/abc123.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "Optional one plain line about what it does, in the user's words.",
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["category", "shareUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a Grok Bot to the directory"
          },
          "behavior": {
            "destructive": false,
