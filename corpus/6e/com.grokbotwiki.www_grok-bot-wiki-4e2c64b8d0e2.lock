          "title": "Get a Grok Bot listing",
          "description": "One listing by slug: creator, share link, share-page description, tags, check dates and any editorial notes. Only public, live listings are available. Nothing beyond the creator's public share-page description is returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
