        {
          "name": "search",
          "title": "Search Grok Bot Wiki",
          "description": "ChatGPT connector search: ids, titles and URLs across Bots and guides. Pass an id to fetch for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Search query.",
                "maxLength": 200,
                "minLength": 1,
