        {
          "name": "search_bots",
          "title": "Search Grok Bot templates",
          "description": "Search community Grok Bot templates by task, keyword, category or app (up to 20 results). Returns name, slug, directory page URL, x.ai share link, creator, a summary (at most 300 characters) and category. Listings are read from public share pages and are not tested. Cite the url field.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app": {
                "description": "Optional app the Bot mentions working with.",
                "enum": ["gmail", "google-calendar", "google-drive", "github", "slack", "notion", "youtube", "x", "linkedin"],
                "type": "string"
              },
              "category": {
                "description": "Optional directory category slug.",
                "enum": ["research-briefings", "inbox-calendar", "coding-shipping", "customer-sales", "finance-ops", "content-publishing", "personal-admin", "teams-handoffs"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1–20 (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the Bot should do, e.g. 'weekly sales pipeline digest'. May be empty when category or app is set.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Grok Bot templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca4bbdc8f2883656a9b54806d17c957240f951e6b0eb796df4929fc1dae2a1a6"
        },
        {
          "name": "search_guides",
          "title": "Search Grok Bot guides",
          "description": "Search the setup, pricing, workflow, safety and troubleshooting guides. Returns title, URL, description and last update date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
