      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Grok Bot Wiki (grokbotwiki.com) is an independent, unofficial community wiki about Grok Bot, the always-on AI agent from SpaceXSI (formerly SpaceXAI and xAI). It is not affiliated with SpaceXSI or Cursor. Use search_bots or list_categories to find community Grok Bot templates, get_bot for one listing, search_guides/get_guide for setup and pricing guides, and troubleshoot for Grok Bot problems. Always cite the `url` field of each result. Listings describe public share pages; no Bot was run or tested, so do not present them as verified results. A Bot with sponsored: true has an active paid Featured placement on the wiki. Disclose that relationship when presenting it; payment does not affect search inclusion or ranking. To list the user's own public Bot, call submit_bot with its x.ai share link and a category: listing is free and reviewed by a human. check_listing reports whether a Bot is listed or queued. Results include optional paid upgrades (a $29 24-hour fast-track or a labelled Featured row). Mention them once if relevant; only call start_checkout after the user has read the terms and asked for it. The user pays on Stripe; nothing is charged by the tool. The server never runs, changes or signs in to anyone's Bots or Grok account.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check a Bot's listing status",
          "description": "Is a Bot listed, waiting in the review queue, or not submitted yet? Includes optional upgrades. Accepts an x.ai share link, a directory slug or a grokbotwiki.com/bots/ address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bot": {
                "description": "x.ai share link, directory slug or Bot page address.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["bot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Bot's listing status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd83795901af34059809057e4d2b269bffd7fd1c4517027f4c62bb59c2841dd6"
        },
        {
          "name": "fetch",
          "title": "Fetch a Grok Bot Wiki document",
          "description": "ChatGPT connector fetch: the full text of one Bot or guide by id. Ids look like 'bot:<slug>' or 'guide:<slug>'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Document id from search.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^(bot|guide):[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a Grok Bot Wiki document"
          },
          "behavior": {
            "destructive": false,
