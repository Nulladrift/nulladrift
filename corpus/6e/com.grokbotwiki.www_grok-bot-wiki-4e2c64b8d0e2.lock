          "digest": "sha256:2186e906d25a4d582786dbdd92ea9f44cd9bd3fd5575d64d079ef83599d9f74a"
        },
        {
          "name": "troubleshoot",
          "title": "Troubleshoot Grok Bot",
          "description": "Describe a Grok Bot problem; get the 1–3 most relevant Fix problems guides with their first answer. Each match includes the guide URL, a short answer, the most relevant section and official sources. Community guidance, not official support.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symptom": {
                "description": "What is going wrong, e.g. 'routines not running overnight' or 'Bot failed to respond'.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
