        {
          "name": "get_tarot_reading",
          "title": "Tarot reading",
          "description": "Draws four Tarot de Marseille cards (Major Arcana) for one question and returns AskY's written reading of them: the cards, what each one says, how they read together, a piece of advice and a question to take away. Use when someone asks for a tarot reading about a question of their own. Pass only the question itself, not the conversation. Questions about a medical diagnosis, death, gambling, harming someone, or from someone in crisis are not read: the tool returns a supportive message or a gentler question instead of cards. The question is used only to write the reading and is then erased; the number of readings depends on what the person's account includes; when it is reached the tool says so. Requires the person to be signed in to their AskY account; the reading is saved to that account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the answer: \"en\" for English or \"es\" for Spanish. Use the language the person is writing in. Defaults to \"en\".",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "description": "Optional first name to address the person by, only if they gave it in the conversation. Never invent one. Letters only, up to 40 characters.",
                "examples": ["Laura"],
                "maxLength": 40,
                "type": "string"
              },
              "question": {
                "description": "The person's own question, in their words, without the rest of the conversation. One question, 3 to 1500 characters. Example: \"Will this new job make me happier?\"",
                "examples": ["Will this new job make me happier?", "What do I need to understand about this relationship?", "¿Qué necesito para dar el siguiente paso en mi trabajo?"],
                "maxLength": 1500,
                "minLength": 3,
                "type": "string"
              },
              "topic": {
                "description": "Optional area of the question: love, work, health (health and wellbeing), friendship, or life (personal growth). Leave it out if unclear; the reading still works.",
                "enum": ["love", "work", "health", "friendship", "life"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asky": {
                "description": "Data for showing the result as cards. Left out when there are no cards (for example a message instead of a reading).",
