      },
      "transport": {
        "type": "http",
        "url": "https://askyreadings.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "asky",
        "title": "AskY",
        "version": "1.100"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "AskY gives Tarot de Marseille readings in English and Spanish. Use these tools when the person asks for the card of the day, a tarot reading about a question of theirs, or the meaning of a card. Set lang to the language the person is writing in.",
      "tools": [
        {
          "name": "get_card_meaning",
          "title": "Card meaning",
          "description": "Returns AskY's published guide to one Tarot de Marseille card: keywords, what the card brings, the card reversed, the card in love and in work, a piece of advice, a question to reflect on, and a link to the card's page. Accepts the card's French, English or Spanish name (for example \"Le Mat\", \"The Fool\", \"El Loco\", \"Ace of Cups\", \"Reina de Espadas\") or a Major Arcana number from 0 to 21 (for example \"13\" or \"XIII\"). Covers all 78 cards. Use when someone asks what a card means. It does not interpret a spread; use get_tarot_reading for a reading.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card": {
                "description": "The card's name in French, English or Spanish, or a Major Arcana number (0-21, Arabic or Roman).",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: \"en\" for English, \"es\" for Spanish. Use the language the person is writing in. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Card meaning"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://asky/cards-v1.html"
            },
            "ui/resourceUri": "ui://asky/cards-v1.html"
          },
          "digest": "sha256:aa6392f62aeba8c4e38cf4f1f29e257f0b1f38d7221a9994e7cb936b2a857165"
        },
        {
          "name": "get_card_of_the_day",
          "title": "Card of the day",
          "description": "Returns today's Tarot de Marseille card on AskY (the same card for everyone, changing each day, UK time): its name, the thought for the day, what the card brings, a picture address and a link to the card's page. Use when someone asks for the card of the day or a card for today. It does not draw a card for a personal question; use get_tarot_reading for that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer: \"en\" for English, \"es\" for Spanish. Use the language the person is writing in. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Card of the day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://asky/cards-v1.html"
            },
            "ui/resourceUri": "ui://asky/cards-v1.html"
          },
          "digest": "sha256:ae411895d523ae9c445d39005af5981d41284f715a0d480e50a9de90609203b8"
        },
        {
          "name": "get_personal_reading_info",
          "title": "Personal reading",
          "description": "Returns a short description of AskY's personal reading (a reading written by the reader herself for one question and sent by email, for adults aged 18 and over) and the address of the page that explains it. Use only when someone asks about a reading written personally for them. Nothing is booked or paid for in the conversation; this tool only returns information and a link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer: \"en\" for English, \"es\" for Spanish. Use the language the person is writing in. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Personal reading"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b4d02dd653e9c73e18874fa6ee140d7e1d224aae2e55ab831a6370a7901833d7"
        },
        {
          "name": "get_tarot_reading",
          "title": "Tarot reading",
          "description": "Draws four Tarot de Marseille cards (Major Arcana) for one question and returns AskY's written reading of them: the cards, what each one says, how they read together, a piece of advice and a question to take away. Use when someone asks for a tarot reading about a question of their own. Pass only the question itself, not the conversation. Questions about a medical diagnosis, death, gambling, harming someone, or from someone in crisis are not read: the tool returns a supportive message or a gentler question instead of cards. The question is used only to write the reading and is then erased; the number of readings depends on what the person's account includes; when it is reached the tool says so. Requires the person to be signed in to their AskY account; the reading is saved to that account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer: \"en\" for English, \"es\" for Spanish. Use the language the person is writing in. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "description": "Optional first name to address the person by, only if they gave it.",
                "maxLength": 40,
                "type": "string"
              },
              "question": {
                "description": "The person's question, in their own words. One question, 3 to 1500 characters.",
                "maxLength": 1500,
                "minLength": 3,
                "type": "string"
              },
              "topic": {
                "description": "What the question is about: love, work, health (health and wellbeing), friendship, or life (personal growth). Optional; leave out if unsure.",
                "enum": ["love", "work", "health", "friendship", "life"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Tarot reading"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["readings"],
                "type": "oauth2"
              }
            ],
