      "serverInfo": {
        "name": "asky",
        "title": "AskY · Tarot de Marseille",
        "version": "1.107",
        "description": "Tarot de Marseille readings in English and Spanish: the card of the day, a card's meaning, and a reading for a question of your own.",
        "websiteUrl": "https://askyreadings.com/connect"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "AskY gives Tarot de Marseille readings in English and Spanish. Use these tools when the person asks for the card of the day, a tarot reading about a question of theirs, or the meaning of a card. Set lang to the language the person is writing in.",
      "tools": [
        {
          "name": "get_card_meaning",
          "title": "Card meaning",
          "description": "Returns AskY's published guide to one Tarot de Marseille card: keywords, what the card brings, the card reversed, the card in love and in work, a piece of advice, a question to reflect on, and a link to the card's page. Accepts the card's French, English or Spanish name (for example \"Le Mat\", \"The Fool\", \"El Loco\", \"Ace of Cups\", \"Reina de Espadas\") or a Major Arcana number from 0 to 21 (for example \"13\" or \"XIII\"). Covers all 78 cards. Use when someone asks what a card means. It does not interpret a spread; use get_tarot_reading for a reading.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card": {
                "description": "A Tarot de Marseille card: its French, English or Spanish name (e.g. \"Le Mat\", \"The Fool\", \"El Loco\", \"Ace of Cups\", \"Reina de Espadas\"), or a Major Arcana number 0-21 in Arabic or Roman numerals (\"13\", \"XIII\"). Spelling and accents are forgiven.",
                "examples": ["Le Mat", "The Fool", "XIII", "Reina de Espadas"],
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the answer: \"en\" for English or \"es\" for Spanish. Use the language the person is writing in. Defaults to \"en\".",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asky": {
                "description": "Data for showing the result as cards. Left out when there are no cards (for example a message instead of a reading).",
                "properties": {
                  "back": {
                    "description": "Picture of the card back.",
                    "format": "uri",
                    "type": "string"
                  },
                  "cards": {
                    "description": "Cards shown, in reading order.",
                    "items": {
                      "properties": {
                        "image": {
                          "description": "Card picture (WebP).",
                          "format": "uri",
                          "type": "string"
                        },
                        "name": {
                          "description": "French Tarot de Marseille name, e.g. \"L'Hermite\".",
                          "type": "string"
                        },
                        "position": {
                          "description": "Place in the spread (readings only), else null.",
                          "type": ["string", "null"]
                        },
                        "reversed": {
                          "description": "True if the card came up reversed.",
                          "type": "boolean"
                        },
                        "sub": {
                          "description": "Name in the answer's language, e.g. \"The Hermit\".",
                          "type": "string"
                        }
                      },
                      "required": ["image", "name", "position", "reversed", "sub"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "lang": {
                    "description": "Language of the text.",
                    "enum": ["en", "es"],
                    "type": "string"
                  },
                  "line": {
                    "description": "One-line thought or summary; null when there is none.",
                    "type": ["string", "null"]
                  },
                  "link": {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "description": "What the link opens.",
                        "type": "string"
                      },
                      "url": {
                        "description": "Page on askyreadings.com, with utm tags.",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["label", "url"],
                    "type": "object"
                  },
                  "title": {
                    "description": "Heading, e.g. \"Today's card\" / \"La carta de hoy\".",
                    "type": "string"
                  },
                  "view": {
                    "description": "What kind of result this is: one card, or the cards of a reading.",
                    "enum": ["card", "reading"],
                    "type": "string"
                  }
                },
                "required": ["back", "cards", "lang", "line", "link", "title", "view"],
                "type": "object"
              },
              "text": {
                "description": "The full answer in Markdown, ready to show.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
