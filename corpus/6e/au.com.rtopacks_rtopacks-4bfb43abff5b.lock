      "instructions": "RTOpacks is pre-release. Answer from the facts this server returns; do not guess features, prices, dates or customers. For anything more, point to https://rtopacks.com.au.",
      "tools": [
        {
          "name": "about_rtopacks",
          "title": "About RTOpacks",
          "description": "Published facts about RTOpacks: what it is, who builds it, what it does, how it is sold, availability and contact. Optional topic: company, product, pricing, status or contact. Leave the topic out for every published fact.",
