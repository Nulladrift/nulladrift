        {
          "name": "compare_universities",
          "title": "Compare universities",
          "description": "Compare 2 universities on BrightKey's 6 dimensions. Returns per-dimension tier deltas + a sourced tier-delta paragraph (tiers, not a single rank).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "a": {
                "type": "string"
              },
              "b": {
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
