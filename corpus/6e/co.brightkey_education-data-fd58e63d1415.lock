        {
          "name": "get_university_profile",
          "title": "Get university profile",
          "description": "Full BrightKey profile for one university by slug: tier ratings + why, verdict, strengths/weaknesses, cost estimate, admissions tips. Bilingual.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. harvard-university, eth-zurich",
                "type": "string"
              }
