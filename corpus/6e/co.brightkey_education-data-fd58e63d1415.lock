            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:71fe774c14a0e7449385fc6be241cab6bcd823fced7063ee9340063499f287b4"
        },
        {
          "name": "list_universities",
          "title": "List universities",
          "description": "List BrightKey-profiled universities with optional filters. Returns slug, name, country, city, 6-dimension S/A/B/C/D tiers, and verdict.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acceptsIB": {
                "type": "boolean"
              },
              "country": {
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "minTier": {
                "enum": ["S", "A", "B", "C", "D"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
