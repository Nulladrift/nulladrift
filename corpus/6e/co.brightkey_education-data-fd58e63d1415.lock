          "name": "fetch",
          "title": "Fetch a BrightKey document by id",
          "description": "Fetch full content for an id returned by search (uni:<slug>, school:<city>/<slug>, answer:<slug>).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
