  "subjects": {
    "co.brightkey/education-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://brightkey.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "BrightKey Education Data",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "answer_education_question",
          "title": "Answer an education question",
          "description": "Search BrightKey's cited answers to common international-education questions (curriculum, schools, universities, visas, process). Returns the best-match sourced answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f45067ce31e8cfb6e792cb59db82e3b9b3b96cfcf479c5e125ee2810ea53403"
        },
        {
          "name": "compare_universities",
          "title": "Compare universities",
          "description": "Compare 2 universities on BrightKey's 6 dimensions. Returns per-dimension tier deltas + a sourced tier-delta paragraph (tiers, not a single rank).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "a": {
                "maxLength": 200,
                "type": "string"
              },
              "b": {
                "maxLength": 200,
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4c8e7dd587b142addf29d6ec66af10f956063c740a49c9a86a2ca56ab6f728be"
        },
        {
          "name": "degree_roi",
          "title": "Degree ROI",
          "description": "5-year-after-graduation net ROI + break-even year for a degree. Pass a preset country slug (e.g. germany, uk-oxbridge, us-private) or 'all' for the ranked list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ROI destination slug, or 'all'",
                "maxLength": 200,
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5973c8eafe38001dcd5f483428b5d883d5e926737cc7fe3ed35fd27200465663"
        },
        {
          "name": "fetch",
          "title": "Fetch a BrightKey document by id",
          "description": "Fetch full content for an id returned by search (uni:<slug>, school:<city>/<slug>, answer:<slug>).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 200,
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f22caf7033adcaac6a24a378eed357a4e0e3d4572cc8c868e55ba84acb41472"
        },
        {
          "name": "get_university_profile",
          "title": "Get university profile",
          "description": "Full BrightKey profile for one university by slug: tier ratings + why, verdict, strengths/weaknesses, cost estimate, admissions tips. Bilingual.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. harvard-university, eth-zurich",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7f57cb69476e075c17b25fcca4ae3ab1a7620b2a8bc9ececa43303de862b8329"
        },
        {
          "name": "list_universities",
          "title": "List universities",
          "description": "List BrightKey-profiled universities with optional filters. Returns slug, name, country, city, 6-dimension S/A/B/C/D tiers, and verdict.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acceptsIB": {
                "type": "boolean"
              },
              "country": {
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "minTier": {
                "enum": ["S", "A", "B", "C", "D"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5758745dbc11a2267d0c540ba1295d761d08aba28a570f639065d2edb6c0ffdb"
        },
        {
          "name": "match_schools",
          "title": "Match international schools",
          "description": "List BrightKey-profiled international schools, filtered by city and/or curriculum (e.g. IB, A-Levels, AP). Returns name, curricula, fees, inspection rating, tiers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "e.g. singapore, tokyo, dubai",
                "maxLength": 200,
                "type": "string"
              },
              "curriculum": {
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
