{
  "lockfileVersion": 2,
  "subjects": {
    "co.brightkey/education-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://brightkey.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "answer_education_question",
          "title": "Answer an education question",
          "description": "Search BrightKey's cited answers to common international-education questions (curriculum, schools, universities, visas, process). Returns the best-match sourced answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1394aea884cda59ae570f7ffe1649ea750d3921b3318b9273cd3cf70211f3fe7"
        },
        {
          "name": "compare_universities",
          "title": "Compare universities",
          "description": "Compare 2 universities on BrightKey's 6 dimensions. Returns per-dimension tier deltas + a sourced tier-delta paragraph (tiers, not a single rank).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "a": {
                "type": "string"
              },
              "b": {
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:206b83b98d75dc72972eb64d994da67799d6441b582f0b72778fef52f5021f93"
        },
        {
          "name": "degree_roi",
          "title": "Degree ROI",
          "description": "5-year-after-graduation net ROI + break-even year for a degree. Pass a preset country slug (e.g. germany, uk-oxbridge, us-private) or 'all' for the ranked list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ROI destination slug, or 'all'",
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e27fb7d17bba2699ba439ec1461d83a3f6fecdc5dfeb14f4c5930e09505f1dc5"
        },
        {
          "name": "fetch",
          "title": "Fetch a BrightKey document by id",
          "description": "Fetch full content for an id returned by search (uni:<slug>, school:<city>/<slug>, answer:<slug>).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2183c259869caa0f271af55024c4d411377082763fa81bb3f9ae409022d5f93e"
        },
        {
          "name": "get_university_profile",
          "title": "Get university profile",
          "description": "Full BrightKey profile for one university by slug: tier ratings + why, verdict, strengths/weaknesses, cost estimate, admissions tips. Bilingual.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. harvard-university, eth-zurich",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81539676baef088707061a9b37b29b4d7a3724ea469d4eec264861b473d66053"
        },
        {
          "name": "list_universities",
          "title": "List universities",
          "description": "List BrightKey-profiled universities with optional filters. Returns slug, name, country, city, 6-dimension S/A/B/C/D tiers, and verdict.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acceptsIB": {
                "type": "boolean"
              },
              "country": {
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "minTier": {
                "enum": ["S", "A", "B", "C", "D"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c2eb13dc4511b6ec7093c666a2d6c84b2be84a083921aa400f68303d8628efb"
        },
        {
          "name": "match_schools",
          "title": "Match international schools",
          "description": "List BrightKey-profiled international schools, filtered by city and/or curriculum (e.g. IB, A-Levels, AP). Returns name, curricula, fees, inspection rating, tiers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "e.g. singapore, tokyo, dubai",
                "type": "string"
              },
              "curriculum": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c9f85e8ac57830f064d529dc79b9159a1f847b6d2eb6a5285c57cc0fc46ff0e"
        },
        {
          "name": "search",
          "title": "Search BrightKey",
          "description": "Search across universities, schools, and answers. Returns {id, title, url} results; pass an id to fetch().",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e48e96957ac44a80c9a21917b985fa9df9cdc1190f15565bc970967f40b19a4b"
        }
      ],
      "digest": "sha256:1431a35863a1d32709da8f5f0cf524f112afc4a4a91d88f29a14c9b25fefe0d8"
    }
  }
}
