        {
          "name": "degree_roi",
          "title": "Degree ROI",
          "description": "5-year-after-graduation net ROI + break-even year for a degree. Pass a preset country slug (e.g. germany, uk-oxbridge, us-private) or 'all' for the ranked list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ROI destination slug, or 'all'",
                "type": "string"
              },
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
