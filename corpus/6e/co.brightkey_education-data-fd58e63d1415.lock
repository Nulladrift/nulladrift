        },
        {
          "name": "match_schools",
          "title": "Match international schools",
          "description": "List BrightKey-profiled international schools, filtered by city and/or curriculum (e.g. IB, A-Levels, AP). Returns name, curricula, fees, inspection rating, tiers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "e.g. singapore, tokyo, dubai",
