          "title": "Answer an education question",
          "description": "Search BrightKey's cited answers to common international-education questions (curriculum, schools, universities, visas, process). Returns the best-match sourced answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Response language; defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
