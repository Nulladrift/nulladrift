        {
          "name": "agent-budget",
          "title": "Agent 调用成本预算器",
          "description": "Agent 调用成本预算器：跑 agent 之前先算清成本：输入单次调用单价、预计调用次数、重试率、安全缓冲，算出预计花费和封顶花费。解决\"成本不可预测、跑到一半烧穿预算\"的痛点，给 agent 设 budget cap 一个明确数字。 传入参数对象，返回确定性计算结果与依据。适用场景：模型算数不稳、法规口径易错时，调用它拿准确答案。",
          "inputSchema": {
            "properties": {
