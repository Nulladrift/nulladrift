      "instructions": "面向 AI Agent 的中文确定性工具集，共 29 个工具：合同/广告/招聘/隐私等文本风险检测、劳动与装修等确定性计算、合同条款清单。模型做不稳的确定性环节，用这里拿准确答案。全部免费试用。",
