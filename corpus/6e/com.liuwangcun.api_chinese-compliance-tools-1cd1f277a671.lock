      "instructions": "面向 AI Agent 的中文确定性工具集，共 134 个工具：① Tier1 通用入口（web_search 检索 / web_fetch 抓取 / read_file / write_file / list_directory 暂存文件 / terminal 沙盒命令，联网与沙盒边界见各工具描述）；② Tier2 开发/生活确定性微工具（json_format/JWT解码/UUID/scientific计算/单位换算/颜色转换/子网/chmod/cron 等，结果精确不靠模型猜）；③ Tier3 发现层确定性工具（json_path/CSV↔JSON/CRC32/Base32/Base58/UA解析/URL解析/时间戳/字数统计/摩斯/IPv4整数/MIME/Token估算等，描述已写触发词便于你按需求选中）；④ Tier4 JSON 查询族（jsonpath_query 完整 JSONPath：$..递归/[?()]过滤/切片/负索引；json_pointer 精确取值；json_extract 多路径提取；jq_select 筛选映射；json_shape 结构摘要；json_validate 错误定位；json_keys_deep 键名索引——当你要从 JSON 里按条件查值时优先用这一族）；⑤ Tier5 财务金融计算族（npv_calc 净现值 / irr_calc 内部收益率 / depreciation_calc 折旧 / compound_growth 复利终值与CAGR / loan_amortization 摊还表 / business_days 营业日 / saas_metrics 经营指标 / roi_calc / wacc_calc / payback_calc 回收期——当你要算投资收益、折旧、贷款、工作日时优先用这一族）；⑥ Tier6 学术文献工具族（doi_check/isbn_check/issn_check/arxiv_check/pmid_check/orcid_check 标识符校验 + doi_extract/isbn_convert/citation_format 六种引文格式/ref_parse/bibtex_parse——当你要校验书号文献、排参考文献时优先用这一族）；⑦ 合同/广告/招聘/隐私等文本风险检测；⑧ 劳动与装修等确定性计算；⑨ 合同条款清单。模型做不稳的确定性环节，用这里拿准确答案。全部免费试用。批量/生产用途可按次机器付（HTTP 402 + x402 USDC）解锁完整资源清单与优先额度，见 /.well-known/x402.json；付费工具清单见 /products。",
