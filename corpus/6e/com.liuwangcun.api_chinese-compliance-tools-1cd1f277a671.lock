        {
          "name": "agent-readiness",
          "title": "Agent 就绪度诊断器",
          "description": "Agent 就绪度诊断器：你的网站/服务对 AI Agent 友不友好？输入九项发现信号（有没有 llms.txt、agent-card.json、JSON-LD、MCP 端点、机器支付等）的 yes/no，输出加权就绪度评分、等级、最大短板与逐条改进建议。命中\"Agent 找不到可信服务\"痛点，做 SEO4.0 自查。不发起网络请求，纯确定性评分。 传入参数对象，返回确定性计算结果与依据。适用场景：模型算数不稳、法规口径易错时，调用它拿准确答案。",
