          "title": "参考文献引文格式化",
          "description": "当用户要把一条文献元数据排成 GB/T 7714、APA、MLA、Vancouver、IEEE 或 AMA 格式的引文时调用：给作者/年份/题名等。 按用户给的元数据生成六种主流引文格式的参考文献串。 输入：{ \"style\": \"string\", \"authors\": \"array\", \"year\": \"string\", \"title\": \"string\", \"venue\": \"可选 string\", \"doi\": \"可选 string\", \"volume\": \"可选 string\", \"issue\": \"可选 string\", \"pages\": \"可选 string\" } 边界：只用调用方提供的元数据，不联网补全也不核实；作者/年份准确性由调用方负责。 免费试用；批量/生产可按次付费。",
