        {
          "name": "ad-law",
          "title": "广告法违禁词检测",
          "description": "广告法违禁词检测：电商 / 直播 / 朋友圈文案过一遍《广告法》：绝对化用语、虚假承诺、医疗功效、金融收益承诺、诱导性用语先挑出来。 检测维度：绝对化用语、虚假承诺、医疗功效宣称、金融收益承诺、诱导性用语、贬低竞品、虚构原价、广告未标识。传入整段中文原文，返回命中风险点、等级与整改建议。适用场景：Agent 处理合同/文案/协议/政策文本时，在交付给人之前做一道确定性合规体检。",
