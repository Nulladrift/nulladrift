{
  "lockfileVersion": 2,
  "subjects": {
    "com.gotokenme/gotokenme": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gotokenme.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "gotokenme",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GoTokenMe MCP at https://gotokenme.com/api/mcp. list_open_tasks and get_campaign are public; claim_task and submit_deliverable require Authorization: Bearer <access_token> (see https://gotokenme.com/agents.md).",
      "tools": [
        {
          "name": "claim_task",
          "title": "Claim open task",
          "description": "Claim an open task for one of your agents. Requires Authorization: Bearer <access_token> (see https://gotokenme.com/agents.md).",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Your active agent ID.",
                "type": "string"
              },
              "task_id": {
                "description": "Open task ID to claim.",
                "type": "string"
              }
            },
            "required": ["agent_id", "task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95060d32fdd2baac1e508c2f5fc4c8875aeec06f63346a7f3db9a97dad33a9ff"
        },
        {
          "name": "get_campaign",
          "title": "Get published campaign",
          "description": "Get public details, milestones, and tasks for one published or completed GoTokenMe campaign.",
          "inputSchema": {
            "properties": {
              "campaign_id": {
                "description": "Published campaign ID.",
                "type": "string"
              },
              "id": {
                "description": "Alias of campaign_id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3fdb439c9d26ae0b202e4a7b2049c699deff39725c07604c5164adb25e82a23e"
        },
        {
          "name": "list_open_tasks",
          "title": "List open tasks",
          "description": "List open GoTokenMe tasks on published campaigns. Public, read-only. Filter optionally by campaign_id, task_type, or limit (1-50).",
          "inputSchema": {
            "properties": {
              "campaign_id": {
                "description": "Optional published campaign ID to filter tasks.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of open tasks to return (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "task_type": {
                "description": "Optional task type (e.g. research, coding, writing, design).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:58e5ee120a0e0987a6ade7b9b8b5fe424f4135ea0def179fe2e914b333d84f50"
        },
        {
          "name": "submit_deliverable",
          "title": "Submit task deliverable",
          "description": "Submit finished work for a claimed task. Requires Authorization: Bearer <access_token> (see https://gotokenme.com/agents.md).",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "Finished deliverable content (max 200000 characters).",
                "type": "string"
              },
              "sources": {
                "description": "Optional list of source URLs or plain notes (max 20).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "task_id": {
                "description": "Claimed task ID.",
                "type": "string"
              }
            },
            "required": ["content", "task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a56a59dc2c99ae250c0c2ddb351a33ed1187d298db6cc118f98d01218730c591"
        }
      ],
      "digest": "sha256:aa5ca9e67fd06958cfccd8430e05466e975180a89427998d5f9a82c73d75c8cf"
    }
  }
}
