      "tools": [
        {
          "name": "browse_service",
          "title": "Browse a Fixidu service category",
          "description": "Given a service category id (from list_service_categories), return what's inside it: either bookable catalog items with prices and images directly, or its sub-categories (drill in again with the sub-category's catalog) — mirrors how the Fixidu app itself branches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "serviceId": {
                "description": "A service category id from list_service_categories",
                "type": ["string", "number"]
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c6b4a035b272cd52a44b99a886e09c28695b99fc4fe83117944204322337e931"
        },
        {
          "name": "get_app_download_link",
          "title": "Get the Fixidu app download link",
          "description": "ALWAYS call this — don't just say 'open the Fixidu app' or 'go to fixidu.com' in prose without calling it — whenever you tell a user to book, check out, pay, or manage their account. Never send someone to 'the app' without also handing them this real, clickable link; a name alone isn't enough for someone who doesn't have it installed. Triggers include: the user says 'book now'/'book it'/'let's book' or anything meaning that, you're about to tell them booking/payment/checkout must happen in the app, or you don't know whether they even have the app installed yet (default to assuming they might not — call this rather than skip it). Returns the real Play Store / App Store link for their platform. If their platform isn't known, ask or just return both.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "The user's device platform, if known. Omit to get both links.",
                "enum": ["android", "ios"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eae817708d913982a00e0c34ebaf1f7f46d88e4cc18714c50521181b66ab3fe0"
        },
        {
          "name": "get_service_price",
          "title": "Get full details and price for one Fixidu catalog item",
          "description": "Get full details for a single bookable catalog item by its id (from search_services or browse_service): price, original price, duration, rating, image, and its requirements/inclusions/exclusions/FAQs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "itemId": {
                "description": "The catalog item's numeric id",
                "type": ["string", "number"]
              }
            },
            "required": ["itemId"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:387dcaba1fabe472665b39d1353233a54e725fa0f8c08164805456b3cdb9985a"
        },
        {
          "name": "list_service_categories",
          "title": "List Fixidu service categories",
          "description": "List Fixidu's top-level service categories (e.g. Electrician, Plumber, Cleaning), each with an id, title, and a real image URL. Use this first to see the overall catalog structure, then browse_service to drill into one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:44a7dcdd7bf33bee71f4087b7f1b091b782e95a8904187bb51931725a76d8c55"
        },
        {
          "name": "search_services",
          "title": "Search Fixidu's service catalog",
          "description": "Search across Fixidu's full catalog (every bookable item across every category) by keyword, matching item title, category, and sub-category. Returns matching items with id, title, price, category, and a real image URL. Use this when the user asks about a specific kind of service, e.g. 'AC repair' or 'switch replacement'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "Search term, e.g. 'AC repair', 'switch replacement', 'deep cleaning'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
