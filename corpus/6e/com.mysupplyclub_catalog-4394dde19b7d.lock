      "instructions": "SupplyClub is a B2B wholesale supplier of eco-friendly foodservice packaging and restaurant supplies, sourcing through a network of manufacturing and distribution partners across the United States and overseas, with cost-plus pricing, no order minimums, and free shipping for members. Catalog: 2,000+ compostable, biodegradable, and recyclable products. Per-product flags state what the material can do: compostable, recyclable, microwaveable, freezable. A flag is absent when we have no rating for it — absent is not the same as false, and these are our own attributes, not third-party certifications. Oven safety is `oven_safe` and has THREE values, not two: 'yes', 'no', or 'reheat_only' (warming a cooked item, never baking). It is absent when we have no rating. All prices returned by these tools are guest prices in USD per case; unit_price is the per-unit price and case_configuration explains the case pack. Matching in search_products is keyword-based: queries of 1-2 core terms (e.g. 'cups', 'forks') return the most results, and long multi-word queries return few or zero. The brand, material, and category filters accept the exact values listed in `facets`; list_categories returns the full taxonomy, and of its names the `category` filter accepts only PRIMARY-level ones (parent and sub levels are for navigation and their `url`); each category carries `search_filter_value`, the exact filter value or null. `page` and `sort` support paging and price ordering, and sort=price_asc orders by cheapest case. get_product returns full detail for one product, including related_products (matching lids, bases, and accessories). Dimensions are available parsed as `dimensions_parsed` (numbers in inches) beside the `dimensions` display string. Every product's `url` is its storefront page. Products with purchasable=false are archived reference items and cannot be ordered.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get SupplyClub product details",
