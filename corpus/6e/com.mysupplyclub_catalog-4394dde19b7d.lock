            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "level": {
                "description": "Only this taxonomy level. Omit for the whole tree (broadest level first).",
                "enum": ["parent", "primary", "sub"],
                "type": "string"
