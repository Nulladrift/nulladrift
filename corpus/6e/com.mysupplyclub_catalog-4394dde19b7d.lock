                "type": "boolean"
              },
              "description": {
                "type": "string"
              },
              "dimensions": {
                "type": "string"
              },
              "dimensions_in": {
                "description": "Inches, free-text format",
                "type": "string"
              },
              "dimensions_parsed": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
