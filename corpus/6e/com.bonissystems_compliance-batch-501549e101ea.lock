      "serverInfo": {
        "name": "knox-compliance-naics",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Check whether a NAICS code aligns with a stated business vertical (a local lookup; information, not a compliance determination). The full compliance batch — which screens OFAC, routes Secretary-of-State registration to the correct state portal for review, and checks FAR §889 against external sources, then anchors — is a separate, authenticated endpoint.",
      "tools": [
        {
          "name": "naics_align",
          "description": "Given a NAICS code and a business vertical, return whether the code's mapped (Bonis known-commerce) description aligns with the vertical, that description, and an alignment band. Pure, local, no PII. Information, not a compliance determination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "naics_code": {
                "description": "The NAICS code (digits).",
                "type": "string"
              },
              "vertical": {
                "description": "The stated business vertical/industry.",
                "type": "string"
              }
            },
            "required": ["naics_code", "vertical"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
