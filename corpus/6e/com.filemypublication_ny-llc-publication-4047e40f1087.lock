            "readOnly": true
          },
          "digest": "sha256:756bee58410a83c0d2ffe725bfe3386abbca79972b38df8f4c2c49e9142988a0"
        },
        {
          "name": "get_county_publication_cost",
          "title": "LLC publication cost by county",
          "description": "FileMyPublication's all-in price to complete New York LLC publication in a county (both newspapers for six weeks, the State filing fee and our service fee) and the newspapers designated there. In Manhattan, Brooklyn, Queens and the Bronx the County Clerk assigns the papers, so the price is quoted once the Clerk names them.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "The New York county named in the LLC's Articles of Organization, e.g. 'Albany', 'Nassau', 'Brooklyn' or 'Kings'. Borough names are accepted.",
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "LLC publication cost by county"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c55136d96cdf689280101e501eeaf0d6a38242297873a2aa31e588ff5737904"
        },
        {
          "name": "get_publication_requirements",
          "title": "New York LLC publication requirements",
          "description": "Explains New York's LLC publication requirement: LLC Law §206 for New York LLCs, §802 for out-of-state (foreign) LLCs registered in New York, and §1203 for PLLCs. Covers the two newspapers, six weeks, the 120-day deadline, the Certificate of Publication and what happens if it is missed.",
          "inputSchema": {
            "properties": {
              "llc_type": {
                "description": "llc = formed in New York (default); foreign_llc = formed in another state and registered in New York; pllc = professional LLC.",
                "enum": ["llc", "foreign_llc", "pllc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
