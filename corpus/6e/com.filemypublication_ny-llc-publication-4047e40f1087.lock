        },
        {
          "name": "start_order",
          "title": "Start an order",
          "description": "Returns the link to start an order with FileMyPublication for a service, prefilled with the county and the LLC's DOS ID when given. It never places an order: the person reviews the price and pays on the website.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "Publication only: the county in the LLC's Articles.",
                "type": "string"
              },
              "dos_id": {
                "description": "Optional: the LLC's NY Department of State ID number.",
                "type": "string"
              },
              "service": {
                "description": "Which service. Defaults to publication.",
