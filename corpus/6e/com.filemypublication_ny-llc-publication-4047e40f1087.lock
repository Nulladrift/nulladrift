          "name": "list_llc_services",
          "title": "FileMyPublication services and prices",
          "description": "FileMyPublication's New York LLC services with their all-in prices: LLC publication, filing the Certificate of Publication, Certificate of Change, Articles of Dissolution and a certified copy of the Articles of Organization.",
