      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "filemypublication",
        "title": "FileMyPublication: New York LLC Publication",
        "version": "1.0.0",
        "websiteUrl": "https://filemypublication.com/ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FileMyPublication handles New York's LLC publication requirement (LLC Law §206): both newspapers, the affidavits and the Certificate of Publication. Use these tools for publication rules, the 120-day deadline, a county's all-in price and newspapers, County Clerk details, notice text, our other filings, and the link to order. Prices come live from the site. The tools only read; ordering happens on the website. Answers are general information, not legal advice.",
      "tools": [
        {
          "name": "calculate_publication_deadline",
          "title": "120-day publication deadline",
          "description": "Calculates a New York LLC's publication deadline: 120 days from the date its Articles of Organization were filed (or, for a foreign LLC, from when its Application for Authority took effect). Returns the date and the days remaining.",
          "inputSchema": {
            "properties": {
              "formation_date": {
                "description": "Filing date of the Articles of Organization, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["formation_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "120-day publication deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa11a36525fed810a5eb82531a020396d5b8e593224ba9247490bfe733275a26"
        },
        {
          "name": "draft_publication_notice",
          "title": "Draft the publication notice",
          "description": "Drafts the legal notice text a New York LLC publishes (§206), a foreign LLC's Notice of Qualification (§802), or a PLLC's notice (§1203), from the LLC's details. Anything not given prints as a bracketed placeholder. Uses the same wording the FileMyPublication site generates.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "The New York county named in the LLC's Articles of Organization, e.g. 'Albany', 'Nassau', 'Brooklyn' or 'Kings'. Borough names are accepted.",
                "type": "string"
              },
              "foreign_formation_date": {
                "description": "Foreign LLC only: date of organization, YYYY-MM-DD.",
                "type": "string"
              },
              "foreign_jurisdiction": {
                "description": "Foreign LLC only: state or country of organization.",
                "type": "string"
              },
              "foreign_office_address": {
                "description": "Foreign LLC only: office address in the home jurisdiction.",
                "type": "string"
              },
              "formation_date": {
                "description": "Filing date of the Articles of Organization (foreign LLC: Application for Authority), YYYY-MM-DD.",
                "type": "string"
              },
              "llc_name": {
                "description": "The LLC's exact name as filed with the Department of State.",
                "type": "string"
              },
              "llc_type": {
                "description": "Defaults to llc.",
                "enum": ["llc", "foreign_llc", "pllc"],
                "type": "string"
              },
              "principal_business_address": {
                "description": "Optional §206(a)(3-a) principal business location.",
                "type": "string"
              },
              "purpose": {
                "description": "Business purpose. Leave out for 'any lawful act'. For a PLLC, the profession.",
                "type": "string"
              },
              "registered_agent_address": {
                "description": "Optional registered agent's address.",
                "type": "string"
              },
              "registered_agent_name": {
                "description": "Optional registered agent's name (with its address).",
                "type": "string"
              },
              "service_of_process_address": {
                "description": "The address the Secretary of State mails legal papers to, from the filing receipt.",
                "type": "string"
              }
            },
            "required": ["llc_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft the publication notice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7871606045a18df1546fe6bd30463b6ecddf28a49b8fae231c5236249c277dda"
        },
        {
          "name": "get_county_clerk",
          "title": "County Clerk contact details",
          "description": "The County Clerk's office for a New York county: phone, address, hours, email and website. The Clerk designates the newspapers an LLC must publish in.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "The New York county named in the LLC's Articles of Organization, e.g. 'Albany', 'Nassau', 'Brooklyn' or 'Kings'. Borough names are accepted.",
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "County Clerk contact details"
          },
          "behavior": {
