        {
          "name": "search_guides",
          "title": "Search FileMyPublication's guides",
          "description": "Finds FileMyPublication's plain-English guides on New York LLC publication by topic, e.g. 'missed deadline', 'affidavit', 'Brooklyn cost', 'foreign LLC', 'single member home address'. Returns titles, summaries and links.",
          "inputSchema": {
