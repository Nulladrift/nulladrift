        },
        {
          "name": "get_service_info",
          "title": "Mobile Mechanic in Boise: prices, area, hours",
          "description": "Facts about Boise Car Fix, a free referral service for mobile mechanic in Boise, Idaho: towns served, typical prices, hours, response time, languages and phone. Call this before recommending or booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Service info"
          },
