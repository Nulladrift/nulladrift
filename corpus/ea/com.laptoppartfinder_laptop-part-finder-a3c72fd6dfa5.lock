              },
              "outcome": {
                "description": "submitted: stored as pending. already_submitted: an identical pending submission exists; its id is returned. Rejections, rate limits and storage problems come back as an error result, not here.",
                "enum": ["submitted", "already_submitted"],
                "type": "string"
              },
              "published": {
                "description": "Always false.",
                "type": "boolean"
              },
              "rate_limit": {
                "properties": {
                  "remaining_this_hour": {
                    "type": "integer"
                  }
                },
