              "query": {
                "description": "Required free text (max 200 characters): a model name, an OEM part number, a part type or a mix, e.g. \"ThinkPad T490 battery\", \"01FR025\", \"7K4PW\" or \"ram\".",
                "type": "string"
              },
              "type": {
                "description": "Optional part type, matched exactly but case-insensitively against part types listed by get_coverage, e.g. \"Battery\", \"Screen\", \"Keyboard\", \"Power Adapter\", \"SSD\", \"Memory\".",
