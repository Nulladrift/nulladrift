      },
      "instructions": "Read-only lookup of OEM laptop replacement part numbers (Setup and docs: https://laptoppartfinder.com/agents/) and the models they fit. One tool, submit_correction, can send a correction or missing fit to a private human review queue; it never changes the catalog or any answer by itself. Every fit has a source_url and a typed confidence: oem_manual (manufacturer documentation), retailer (third-party retailer listing, not manufacturer documentation) or unverified. Nothing is bench-tested and no prices are provided. For vague requests call resolve_request first; if it returns a clarifying_question, ask the user before answering. Part numbers are matched with or without dashes, and retired part numbers point to their current record. No key is needed; an optional free read-only API key (Authorization: Bearer lpf_...) is available, see https://laptoppartfinder.com/agents/#api-key.",
      "tools": [
        {
          "name": "check_part_fits",
          "title": "Check a part against models",
          "description": "Yes/no: do these part numbers fit these specific models? Example: \"does 01FR025 or 5B10W13905 fit my T490 and T495?\". Use get_part_fits instead to list every model one part fits. Use get_model_parts instead for a model's parts. Give part_number, part_numbers, or both (merged, duplicates dropped). At most 100 part×model pairs, else an error result. Parts match as in get_part; models resolve like get_model_parts, once each. One part: results in model order; an unknown part is an error result. Several parts: side-by-side comparison (parts list plus flat results in part-then-model order); unknown or ambiguous parts are flagged in their entry and their rows have fits null. fits true includes constraints, source_url, confidence; fits false is fit_status no_documented_fit (no document, not incompatibility); fits null for an ambiguous or unknown model. Per-row field details are in the output schema.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: your agent or app name (letters and digits), used only for anonymous usage counts.",
                "type": "string"
              },
              "models": {
                "description": "Required. 1 to 20 model slugs or full names, e.g. [\"lenovo-thinkpad-t490\", \"ThinkPad T495\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "part_number": {
                "description": "One OEM part number, with or without dashes or spaces, e.g. \"01FR025\" or \"7K4PW\". Give this, part_numbers, or both.",
                "type": "string"
              },
              "part_numbers": {
                "description": "Several OEM part numbers to compare, e.g. [\"01FR025\", \"5B10W13905\", \"L78555-005\"]. Merged after part_number; parts x models must be at most 100.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "anyOf": [
              {
                "required": ["part_number", "results"]
              },
              {
                "required": ["parts", "results"]
              },
              {
                "required": ["candidates", "status"]
              },
              {
                "properties": {
                  "outcome": {
                    "const": "not_found"
                  }
                },
                "required": ["data_revision", "message", "outcome"]
              }
            ],
