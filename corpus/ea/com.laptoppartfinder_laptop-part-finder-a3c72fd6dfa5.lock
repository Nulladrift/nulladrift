        {
          "name": "submit_correction",
          "title": "Send a correction or missing fit for review",
          "description": "Send LPF a correction, a missing model or fit, or repair feedback. Nothing is published automatically: every submission is stored as pending and unverified, with no tier (green, yellow and red are assigned only after a person reviews it), and it changes no page, fit or tool answer unless a reviewer accepts it. It may be declined, and there is no status lookup. This tool does not look anything up: use search_parts, get_part, get_part_fits or get_model_parts to read the catalog, and call this only when a result was wrong or missing and you have a specific, checkable detail. kind: correction (a listed fact looks wrong), new_model (a model LPF does not list), new_fit (a part you believe fits a model; both model and part_number are required), repair_feedback (a guide or part note was unclear or wrong). Give model and/or part_number as printed (they are matched against the catalog, but unknown ones are still accepted for review), a one-line summary (10 to 200 characters), optional details (up to 2000 characters, in your own words; quote at most 8 words from any source) and up to 3 https evidence_urls (stored, never fetched). Do not include personal data, contact details, keys, tokens or passwords: such text is rejected and not stored. Set acknowledge to true only when the user agrees to send it. Returns submission_id with status pending. Limited to 5 per hour and 15 per day per source; a repeat of a pending submission returns the existing id. Same fields over REST: POST /api/submissions.",
          "inputSchema": {
            "properties": {
              "acknowledge": {
                "description": "Required, must be true. Confirms the text has no personal data, keys or passwords, quotes at most 8 words from any source, and may be stored and reviewed by LPF (see /privacy/#submissions).",
                "type": "boolean"
              },
              "agent_name": {
                "description": "Optional. Your agent or app name, up to 60 characters, kept with the submission so the reviewer can see where it came from.",
                "type": "string"
              },
              "agent_version": {
                "description": "Optional. Your agent or app version, up to 30 characters.",
                "type": "string"
              },
              "basis": {
                "description": "Optional. Where the detail comes from, as you declare it; it does not raise any tier. Default other.",
                "enum": ["user_report", "manufacturer_document", "retailer_listing", "own_inspection", "other"],
                "type": "string"
              },
              "details": {
                "description": "Optional. Up to 2000 characters, in your own words; quote at most 8 words from any source. No personal data, keys or passwords.",
                "type": "string"
              },
              "evidence_urls": {
                "description": "Optional. Up to 3 public https URLs (up to 300 characters each) that support the claim. Stored for the reviewer, never fetched. No credentials or keys in the URL.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "kind": {
                "description": "Required. What you are sending: correction, new_model, new_fit or repair_feedback.",
                "enum": ["correction", "new_model", "new_fit", "repair_feedback"],
                "type": "string"
              },
              "model": {
                "description": "Model slug or full name as printed, up to 120 characters, e.g. \"lenovo-thinkpad-t490\" or \"ThinkPad T490\". Required for new_model and new_fit.",
                "type": "string"
              },
              "part_number": {
                "description": "OEM part number as printed, up to 40 characters, e.g. \"01FR025\". Required for new_fit.",
                "type": "string"
              },
              "part_type": {
                "description": "Optional part type, e.g. \"Battery\", \"Screen\", \"SSD\" (see get_coverage).",
                "type": "string"
              },
              "summary": {
                "description": "Required. One line saying what is wrong or missing, 10 to 200 characters, e.g. \"T490 battery 01AV490 listed for T480 only\".",
                "type": "string"
              }
            },
            "required": ["acknowledge", "kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "confidence": {
                "enum": ["unverified"],
                "type": "string"
              },
              "data_revision": {
                "type": "string"
              },
              "duplicate": {
                "type": "boolean"
              },
              "ignored_fields": {
                "items": {
