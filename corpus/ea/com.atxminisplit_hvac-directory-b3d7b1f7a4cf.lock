{
  "lockfileVersion": 2,
  "subjects": {
    "com.atxminisplit/hvac-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atxminisplit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "atx-mini-split-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ATX Mini Split compares every licensed (TDLR) heating and air contractor around Austin, Texas: 183 verified companies, ranked by a published score, with license status, services, posted prices and Google ratings. Use search_companies to find contractors by city or service, get_company for details, price_benchmarks for what Austin contractors actually post. For a flat-price mini split quote, request_mini_split_quote sends the request to Mini Split Reef, an advertiser on this site that is owned by the site's operators; only use it when the user asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "get_company",
          "title": "Company details",
          "description": "Full verified record for one company (slug from search_companies or its profile URL).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8cd5bfcbfcf817e6bd23858216feb0f73a4e98fdd34bf7e2af89d4da28fc2044"
        },
        {
          "name": "price_benchmarks",
          "title": "Posted HVAC prices in Austin",
          "description": "Installed prices Austin-area contractors publish on their own websites, quoted as written.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57d7d15bf4f766792e1825f657a862660e6192b80b69362b0b6c56c714262cd6"
        },
        {
          "name": "request_mini_split_quote",
          "title": "Request a mini split quote (advertiser: Mini Split Reef)",
          "description": "Send a flat-price mini split quote request to Mini Split Reef ($2,000 per unit installed), an advertiser owned by this site's operators. Only when the user explicitly asks to be contacted and provides their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "rooms": {
                "maxLength": 400,
                "type": "string"
              },
              "units": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f9cd0d73ef390f53e139b22f87e749cadf56751e5f28ff60a93afee99842eada"
        },
        {
          "name": "search_companies",
          "title": "Search licensed Austin HVAC companies",
          "description": "Find licensed HVAC / mini split contractors around Austin TX by city and service, ordered by the site's published score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "e.g. Austin, Round Rock, Cedar Park, Georgetown, Pflugerville, Kyle, Temple",
                "maxLength": 40,
                "type": "string"
              },
              "financing": {
                "type": "boolean"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "enum": ["mini splits", "heat pumps", "AC repair", "24/7 emergency", "heating", "maintenance", "AC replacement"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9371937c860ce2b747b02287fd2f59c35755a94240e75b5cb852cd464d57b428"
        }
      ],
      "digest": "sha256:6e488547fb89c0582d613e4a3d0134853c9d673ddfd5f737984a543292038e8f"
    }
  }
}
