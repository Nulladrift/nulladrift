{
  "lockfileVersion": 2,
  "subjects": {
    "com.jojapi/google-image-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/google-image-search"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-google-image-search",
        "title": "Google Image Search API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of Google Image Search on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/google-image-search/pricing · Docs: https://jojapi.com/hub/api/google-image-search",
      "tools": [
        {
          "name": "get_v1",
          "title": "Search Reusable Images",
          "description": "Images labelled for reuse (Creative Commons, public domain), up to `max` (default 10, at most 200), under `response.images`: title, type, the image with its width and height, thumbnails, the page it is on and a cached copy. Search Images searches all images. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "Search keyword.",
                "example": "Paris",
                "title": "keyword",
                "type": "string"
              },
              "max": {
                "description": "How many images to return, 1 to 200. Default: 10",
                "example": "10",
                "title": "max",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a7364b6b0ebad29b762dda2a1f5ab921b641f7fcde12a892251156566913a4f"
        },
        {
          "name": "get_v2",
          "title": "Search Images",
          "description": "Google Images results for a query, twenty a page: for each image its URL, width and height, its thumbnail with width and height, and the page it is on. `response.next_cursor` fetches the next twenty (null after the last page). Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The `next_cursor` of a previous answer, unchanged, for the next twenty images.",
                "title": "cursor",
                "type": "string"
              },
              "filter": {
                "description": "`0` includes the results Google omits as very similar to others.",
                "title": "filter",
                "type": "string"
              },
              "hl": {
                "description": "Interface language code. Default: en",
                "example": "en",
                "title": "hl",
                "type": "string"
              },
              "nfpr": {
                "description": "`1` searches exactly the query as typed, without Google's spelling correction.",
                "title": "nfpr",
                "type": "string"
              },
              "q": {
                "description": "Search query. Google's search operators work: `adele site:youtube.com`, `intitle:paris`, `query -exclude`.",
                "example": "Paris",
                "title": "q",
                "type": "string"
              },
              "safe": {
                "description": "SafeSearch: `active` filters explicit results, `off` does not.",
                "example": "active",
                "title": "safe",
                "type": "string"
              },
              "tbs": {
                "description": "Google's image filters, e.g. `isz:l` (large), `itp:face` (faces), `ic:gray` (black and white), `qdr:w` (past week).",
                "title": "tbs",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2dc749aaf28f09f39fb552fcc8340b7dc0bcaba56152fde086ea5efbd8aab518"
        }
      ],
      "digest": "sha256:95b9820e6500baf53fe3b088882ee8f7ced1d9c472c7f222bc2df9b5810bb1d7"
    }
  }
}
