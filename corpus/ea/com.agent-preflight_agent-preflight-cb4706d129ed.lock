{
  "lockfileVersion": 2,
  "subjects": {
    "com.agent-preflight/agent-preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.agent-preflight.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agent-preflight",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_request",
          "title": "Check Request",
          "description": "Validate an HTTP API request body against a supplied JSON Schema before sending it. This tool does not execute the request. Use it when an agent needs to determine whether a proposed JSON body satisfies its expected schema. Optional economics adds proceed/abort advice from expected waste versus a $0.002 check.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "economics": {
                "description": "Optional V0.2 cost context. Omit for V0.1 validation-only output.",
                "properties": {
                  "billsOnInvalidRequest": {
                    "description": "True when the target API charges or consumes quota on 4xx",
                    "type": "boolean"
                  },
                  "budgetRemainingUsd": {
                    "description": "Remaining agent budget. Checks above this are not +EV",
                    "minimum": 0,
                    "type": "number"
                  },
                  "downstreamCostUsd": {
                    "description": "USD cost of the target API attempt or success",
                    "minimum": 0,
                    "type": "number"
                  },
                  "preflightPriceUsd": {
                    "description": "Price of this check. Default 0.002",
                    "minimum": 0,
                    "type": "number"
                  },
                  "priorInvalidProbability": {
                    "description": "Prior probability the payload is doomed. Default 0.25",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "retryCostUsd": {
                    "description": "USD model/tool-turn cost of one failed attempt",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["billsOnInvalidRequest", "downstreamCostUsd", "retryCostUsd"],
                "type": "object"
              },
              "request": {
                "properties": {
                  "body": {
                    "description": "JSON body checked against schema"
                  },
                  "headers": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "HTTP headers as string key/value pairs",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "method": {
                    "description": "HTTP method of the proposed request",
                    "type": "string"
                  },
                  "query": {
                    "additionalProperties": {},
                    "description": "Query parameters",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "url": {
                    "description": "Absolute http(s) URL. This tool never fetches the URL.",
                    "type": "string"
                  }
                },
                "required": ["method", "url"],
                "type": "object"
              },
              "schema": {
                "additionalProperties": {},
                "description": "JSON Schema applied to request.body",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["request", "schema"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "economics": {
                "additionalProperties": false,
                "properties": {
                  "aPrioriExpectedNetUsd": {
                    "type": "number"
                  },
                  "aPrioriExpectedWasteUsd": {
                    "type": "number"
                  },
                  "decision": {
                    "enum": ["proceed", "abort"],
                    "type": "string"
                  },
                  "preflightPriceUsd": {
                    "type": "number"
                  },
                  "realizedNetUsd": {
                    "type": "number"
                  },
                  "reason": {
                    "enum": ["valid", "invalid_doomed_request"],
                    "type": "string"
                  },
                  "wasteIfSentUsd": {
                    "type": "number"
                  },
                  "worthCheckingAPriori": {
                    "type": "boolean"
                  }
                },
                "required": ["aPrioriExpectedNetUsd", "aPrioriExpectedWasteUsd", "decision", "preflightPriceUsd", "realizedNetUsd", "reason", "wasteIfSentUsd", "worthCheckingAPriori"],
                "type": "object"
              },
              "errors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "requestHash": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "path"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["errors", "requestHash", "valid", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb18e4db3b1ff175e8c56cb01046051650d493957c19a4aa84f09e400beb1b60"
        },
        {
          "name": "preflight_tool_call",
          "title": "Preflight Tool Call",
          "description": "Free MCP decision for generic search:web_search or browse:fetch proposals only. Returns structuredContent and JSON text, never destination results. Caller supplies cost estimates, post-consultation budget and history, executes tools and retrieves resultReference itself. Reuse requires explicit permission, positive TTL and matching nonempty goal hashes; history must belong to the caller. estimated fees/savings are hypothetical, not receipts; confidence is not calibrated. Paid HTTP is a separate $0.002 per settled POST interface. Full contract: https://agent-preflight.com/docs",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "properties": {
                  "maxToolCallsRemaining": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "remainingUsd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "reservedUsd": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["remainingUsd"],
                "type": "object"
              },
              "capabilities": {
                "properties": {
                  "canReduceScope": {
                    "type": "boolean"
                  },
                  "canReusePriorResult": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "freshnessTtlSeconds": {
                "minimum": 0,
                "type": "number"
              },
              "history": {
                "items": {
                  "properties": {
                    "ageSeconds": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "fingerprint": {
                      "type": "string"
                    },
                    "goalHash": {
                      "type": "string"
                    },
                    "outcome": {
                      "enum": ["success", "terminal_failure", "transient_failure"],
                      "type": "string"
                    },
                    "resultReference": {
                      "type": "string"
                    },
                    "toolCallId": {
                      "type": "string"
                    }
                  },
                  "required": ["ageSeconds", "fingerprint", "outcome", "toolCallId"],
                  "type": "object"
                },
                "type": "array"
              },
              "preflightPriceUsd": {
                "minimum": 0,
                "type": "number"
              },
              "retryCap": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "runId": {
                "type": "string"
              },
              "stepId": {
                "type": "string"
              },
              "task": {
                "properties": {
                  "goalHash": {
                    "type": "string"
                  }
                },
                "required": ["goalHash"],
                "type": "object"
              },
              "tool": {
                "properties": {
                  "estimatedExternalCostUsd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "estimatedModelCostUsd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "operation": {
                    "type": "string"
                  },
                  "provider": {
                    "type": "string"
                  },
                  "request": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "required": ["estimatedExternalCostUsd", "operation", "provider", "request"],
                "type": "object"
              }
            },
            "required": ["budget", "runId", "stepId", "tool"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "decision": {
                "enum": ["allow", "block", "reuse", "defer", "advise"],
                "type": "string"
              },
              "enforcement": {
                "enum": ["execute", "safe_to_skip", "advisory"],
                "type": "string"
              },
              "estimated": {
                "additionalProperties": false,
                "properties": {
                  "avoidableExternalCostUsd": {
                    "type": "number"
                  },
                  "avoidableModelCostUsd": {
                    "type": "number"
                  },
                  "billable": {
                    "description": "Modeled actionable status; MCP is unpaid",
                    "type": "boolean"
                  },
                  "confidence": {
                    "description": "Rule constant, not a calibrated probability",
                    "type": "number"
                  },
                  "netSavingsUsd": {
                    "type": "number"
                  },
                  "preflightCostUsd": {
                    "type": "number"
                  },
                  "priceChargedUsd": {
                    "description": "Modeled fee, not a settlement receipt",
                    "type": "number"
                  }
                },
                "required": ["avoidableExternalCostUsd", "avoidableModelCostUsd", "billable", "confidence", "netSavingsUsd", "preflightCostUsd", "priceChargedUsd"],
                "type": "object"
              },
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "matchedCallId": {
                "type": "string"
              },
              "reasonCodes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommendation": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "type": "string"
                  },
                  "resultReference": {
                    "type": "string"
                  }
                },
                "required": ["action"],
                "type": "object"
              },
              "requestFingerprint": {
                "description": "SHA-256 of version-2 exact proposal; absent on invalid input",
                "type": "string"
              }
            },
            "required": ["decision", "enforcement", "issues", "reasonCodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd643ab80594f028e0c3f8b23fb744cebe2e5841798d8dd4ed5a16ac5748743f"
        }
      ],
      "digest": "sha256:8aecffae01f5d664686c1a09a880005327351eaa4f4ba913e2b05f38b31ed41a"
    }
  }
}
