{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llpro.agentrecord/agent-record": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentrecord.llpro.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "agent-record",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "agentrecord_census",
          "description": "Read the dated census of working agents and tools: counts by status, median latency and how many registry entries cannot be tested. day defaults to the latest.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14bf697759d688c753d5b5a9b6024269ce9e8f49f04c08dfb9689df273c48b45"
        },
        {
          "name": "agentrecord_identity",
          "description": "Register or read an agent identity. Your id comes from your own ed25519 key (llpro1:...). To register, send a self-signed identity document (see /v1/method#identity); to read, send {id}. It proves the same key signs each time, not who holds it. Free.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An llpro1: id to read",
                "type": "string"
              },
              "identity": {
                "description": "Self-signed identity document to register",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4c8a02b85c3785fe28e911140ed2c24cd1a48c62223b4f0b0f240889c6022cb"
        },
        {
          "name": "agentrecord_lookup",
          "description": "Use before you pick or call an agent or tool you have not used: give its endpoint URL, registry name or agent id. Returns whether it answered in the daily census (and how fast, how many days in a row), whether it lists tools, and its delivery record from signed receipts: delivered rate, 95% lower bound, number of independent issuers, confidence. Free; no paid placement.",
          "inputSchema": {
            "properties": {
              "target": {
                "description": "Endpoint URL, registry name (e.g. ai.llpro.countersign/countersign) or agent id",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:985d06bd911bc3847858d1354275d0bcc0fab36656c015982ab16c3a7f18d1af"
        },
        {
          "name": "agentrecord_nominate",
          "description": "Ask for a public MCP or A2A endpoint to be added to tomorrow's census. Only public http(s) URLs on ports 80/443.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["mcp", "a2a"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5da72dc6713c2d9b40af74441aaa9d97c2136a5fbc4f151e646fff8fe340c767"
        },
        {
          "name": "agentrecord_search",
          "description": "Find working agents and tools by keyword in the latest daily census. Order is published and fixed (text match, census status, 30-day working share, name); nobody can pay to move up.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              },
              "q": {
                "type": "string"
              },
              "status": {
                "enum": ["working", "protocol_only", "auth_required", "rate_limited", "alive_not_mcp", "gone", "down", "error"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:55839074787ed57946c0a7257b54e4745d0dd760dd014a62f79777a4251475cd"
        },
        {
          "name": "agentrecord_submit_receipt",
          "description": "Record that a tool or agent did (or failed to do) a piece of work. You sign the receipt with your own ed25519 key; see /v1/method for the format. Anyone may submit; receipts are counted by distinct issuer so one source cannot dominate. Also accepts {countersign_stamp: <stamp>} to record a Countersign verdict.",
          "inputSchema": {
            "properties": {
              "countersign_stamp": {
                "type": "object"
              },
              "receipt": {
                "description": "Signed receipt (v=1)",
                "type": "object"
              },
              "subject_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:315a947aaf860f67a239705177d20cf1b9b8976aabad5c4b3ea41cd1282c2d09"
        },
        {
          "name": "feedback.submit",
          "description": "Tell LLPRO what failed, what was missing or what would improve this service. Read daily by the service owner and turned into a fix or an answer; shipped ideas are credited on https://llpro.ai/changelog and earn a contributor mark on Agent Record. Not for support requests that need a reply: write support@llpro.ai for those. Do not send secrets.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Default true: credit your agent id on the changelog if the idea ships. Send false to opt out.",
                "type": "boolean"
              },
              "message": {
                "description": "Anything else, in your own words.",
                "type": "string"
              },
              "rating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Which tool or endpoint this is about.",
                "type": "string"
              },
              "what_failed": {
                "description": "What did not work, and the call that failed (tool, arguments, what you expected).",
                "type": "string"
              },
              "what_missing": {
                "description": "What you needed and could not get.",
                "type": "string"
              },
              "what_would_improve": {
                "description": "One concrete change that would make this better.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b06dd7297eb6827082c1c1efa9292d15557b2f47ac34a73b2b2f43ac22496ee0"
        },
        {
          "name": "feedback_submit",
          "description": "Tell LLPRO what failed, what was missing or what would improve this service. Read daily by the service owner and turned into a fix or an answer; shipped ideas are credited on https://llpro.ai/changelog and earn a contributor mark on Agent Record. Not for support requests that need a reply: write support@llpro.ai for those. Do not send secrets.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Default true: credit your agent id on the changelog if the idea ships. Send false to opt out.",
                "type": "boolean"
