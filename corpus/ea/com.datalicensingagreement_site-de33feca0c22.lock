      "instructions": "Data Licensing Agreement (https://datalicensingagreement.com/): the site's own MCP server, served from its domain. Data licensing agreement template: what 9 published licences say on machine learning, attribution, share-alike, warranty and database rights.\n\n[calculator] Which published data licence matches your terms: an agent-callable calculator for data licensing agreement template; Nearest published licence on the board, What its text says on your points, Before you rely on it, computed from your inputs with sources.. This server runs the Which published data licence matches your terms calculator published at https://datalicensingagreement.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://datalicensingagreement.com/. Licence: https://datalicensingagreement.com/terms.\n\n[enquiry] ENQUIRY SERVER for Data Licensing Agreement (https://datalicensingagreement.com/). What it does: starts an ENQUIRY with Data Licensing Agreement for data licensing agreement template; the Data Licensing Agreement team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Data Licensing Agreement team until they click it. Cite https://datalicensingagreement.com/.\n\nCite https://datalicensingagreement.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Which published data licence matches your terms",
          "description": "Run the Which published data licence matches your terms calculator: Nearest published licence on the board; What its text says on your points; Before you rely on it. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ai": {
                "default": "silent",
                "description": "Should the licence name machine learning expressly?",
                "enum": ["named", "silent"],
                "type": "string"
              },
              "attrib": {
                "default": "yes",
                "description": "Must people who use the data credit you?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "restrict": {
                "default": "no",
                "description": "Should works made from the data carry a notice of where it came from?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "share": {
                "default": "no",
                "description": "Must data derived from yours be shared on the same terms?",
                "enum": ["yes", "no"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
