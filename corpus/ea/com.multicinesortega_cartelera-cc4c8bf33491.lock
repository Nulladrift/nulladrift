        {
          "name": "cartelera",
          "title": "Cartelera y horarios",
          "description": "Qué películas se proyectan y a qué horas, con la URL exacta donde se compra cada pase. Se puede acotar a un día concreto y, en una cadena, a un cine. Sin «dia» devuelve todos los días programados. Las horas son hora local del cine (nunca UTC) y los días son el día operativo del cine, que empieza y acaba en su hora de cierre: un pase de madrugada pertenece a la noche anterior. Cada pase lleva «disponibilidad»: available (hay sitio), few (quedan pocas) o soldout (agotado); null significa que no consta. Es una banda aproximada, refrescada cada pocos minutos, y no dice cuántas entradas quedan: para confirmarlo y comprar hay que abrir la URL de compra.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cine": {
                "description": "Identificador del cine (ver la herramienta «cines»). Se omite para verlos todos.",
                "type": "string"
              },
              "dia": {
                "description": "Día operativo en formato AAAA-MM-DD. Hoy es 2026-11-12. Días con pases: 2026-11-12, 2026-11-19.",
                "type": "string"
              }
