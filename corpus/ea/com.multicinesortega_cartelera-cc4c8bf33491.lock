          "name": "buscar_pelicula",
          "title": "Buscar una película",
          "description": "Busca una película por su título (acepta el título original y coincidencias parciales) y devuelve su ficha completa —sinopsis, duración, dirección, reparto, calificación— junto con todos sus pases y la URL donde se compra cada uno. Las horas son hora local del cine (nunca UTC) y los días son el día operativo del cine, que empieza y acaba en su hora de cierre: un pase de madrugada pertenece a la noche anterior.",
