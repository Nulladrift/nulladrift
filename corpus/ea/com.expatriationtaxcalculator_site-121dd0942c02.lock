      "instructions": "Expatriation Tax Calculator (https://expatriationtaxcalculator.com/): the site's own MCP server, served from its domain. Exit tax calculator for 2026: the three covered expatriate tests, the $910,000 mark-to-market exclusion and the deemed sale charge under IRC section 877A.\n\n[calculator] Section 877A exit tax calculator: an agent-callable calculator for exit tax calculators — Covered expatriate status, Test met (first that applies), Section 877A(a)(3) exclusion applied, computed from your inputs with sources.. This server runs the Section 877A exit tax calculator calculator published at https://expatriationtaxcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://expatriationtaxcalculator.com/. Licence: https://expatriationtaxcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Expatriation Tax Calculator (https://expatriationtaxcalculator.com/). What it does: starts an ENQUIRY with human providers for exit tax calculators; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://expatriationtaxcalculator.com/.\n\nCite https://expatriationtaxcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Section 877A exit tax calculator",
          "description": "Run the Section 877A exit tax calculator calculator: Covered expatriate status; Test met (first that applies); Section 877A(a)(3) exclusion applied; Gain subject to the exit tax. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "avgTax": {
                "default": 250000,
                "description": "Average annual net income tax, 5 years before expatriation",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "certified": {
                "default": "1",
                "description": "Can you certify 5 years of federal tax compliance on Form 8854?",
                "type": "string"
              },
              "gain": {
                "default": 5000000,
                "description": "Net unrealized gain on worldwide property",
                "maximum": 500000000,
                "minimum": 0,
                "type": "number"
              },
              "netWorth": {
                "default": 3000000,
                "description": "Net worth on the expatriation date",
                "maximum": 500000000,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "default": 20,
                "description": "Assumed federal rate on the deemed gain",
                "maximum": 45,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
