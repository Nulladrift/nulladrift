        "url": "https://wod-api-production.up.railway.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "WOD Coach",
        "version": "1.30.0",
        "websiteUrl": "https://api.hybriqx.com"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fitness tools: workout of the day (free), custom workouts ($0.05) and an AI personal trainer that writes injury-safe, personalised training programmes ($0.35). Paid tools use x402 (USDC on Base). HYROX is a trademark of its owner; this service is independent and not affiliated with HYROX.",
      "tools": [
        {
          "name": "coach_programme",
          "description": "AI personal trainer and strength coach. Personalised workout plan or training program from your equipment, goals and injuries, with strict injury-safe exercise substitutions. Home gym, full gym or bodyweight; single workout or 3-8 week periodised block. Fitness, CrossFit, HYROX-format racing, running. $0.35 USDC on Base via x402. Independent; not affiliated with HYROX.",
          "inputSchema": {
            "properties": {
              "duration": {
                "default": "single",
                "enum": ["single", "multi_week"],
                "title": "Duration",
                "type": "string"
              },
              "equipment": {
                "items": {
                  "type": "string"
                },
                "title": "Equipment",
                "type": "array"
              },
              "session_minutes": {
                "default": 60,
                "title": "Session Minutes",
                "type": "integer"
              },
              "sessions_per_week": {
                "default": 3,
                "title": "Sessions Per Week",
                "type": "integer"
              },
              "user_context": {
                "title": "User Context",
                "type": "string"
              },
              "weeks": {
                "default": 4,
                "title": "Weeks",
                "type": "integer"
              }
            },
            "required": ["equipment", "user_context"],
            "title": "coach_programmeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08bf9a91c681b321f3e67e1bb3f2f1fa45330cf1645eeae464e410875d8b5523"
        },
        {
          "name": "generate_workout",
          "description": "Workout generator (WOD): instant gym, home-gym, CrossFit, functional fitness, running or HYROX-format race workout. Formats: Strength, Metcon, Engine (cardio), Long Metcon, Speed Run, Zone 2 Run. $0.05 USDC on Base via x402. Independent; not affiliated with HYROX.",
          "inputSchema": {
            "properties": {
              "equipment": {
                "enum": ["Home Gym", "Full Gym"],
                "title": "Equipment",
                "type": "string"
              },
              "format_type": {
                "enum": ["Strength", "Metcon", "Engine", "Long Metcon", "Speed Run", "Zone 2 Run"],
                "title": "Format Type",
                "type": "string"
              },
              "seed": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Seed"
              },
              "style": {
                "enum": ["CrossFit", "Functional Fitness", "Hyrox"],
                "title": "Style",
                "type": "string"
              }
            },
            "required": ["equipment", "format_type", "style"],
            "title": "generate_workoutArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b2c178686d78c8ad171b158b4df7d9002920984aec13556499d6ba24634277c"
        },
        {
          "name": "get_todays_wod",
          "description": "Free: today's programmed workout of the day (WOD) from the WOD Coach weekly programme. Returns Markdown plus a summary.",
          "inputSchema": {
            "properties": {},
            "title": "get_todays_wodArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f02b65edc1a56ea887c37076d974faae56eee58df02d1b73851fe5fc9af27151"
        },
        {
          "name": "get_weekly_programme",
          "description": "Free: this week's training schedule (Engine, Strength & Power, Speed Run, Metcon, Long Metcon, Zone 2 Run). Future days list only their format and style.",
          "inputSchema": {
            "properties": {},
            "title": "get_weekly_programmeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:944d2e25af415e6c4ee85491078aeae056333c36b5b4c9ae412c43312f7251f3"
        },
        {
          "name": "race_pace_plan",
          "description": "Race pace calculator for HYROX-format fitness races, $0.01 USDC on Base: target finish time to splits for all 8 x 1 km runs and 8 stations (ski, sled push, sled pull, burpee broad jumps, row, farmers carry, lunges, wall balls), run pace per km, transition time, strategy and an optional 5k check. Independent; not affiliated with HYROX.",
          "inputSchema": {
            "properties": {
              "division": {
                "default": "open",
                "enum": ["open", "pro", "doubles"],
                "title": "Division",
                "type": "string"
              },
              "run_5k": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Run 5K"
              },
              "target": {
                "title": "Target",
                "type": "string"
              }
            },
            "required": ["target"],
            "title": "race_pace_plan_toolArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0226a2f14d1b6b85804c01349c873fbdaf89c3242f302f055d569aa8162151f"
        },
        {
          "name": "substitute_exercise",
          "description": "Exercise substitution for injuries, $0.02 USDC on Base: give a movement (e.g. barbell back squat) and an injury or limitation (e.g. knee pain, shoulder impingement) and get 3-5 safe alternative exercises with prescriptions, coaching cues and stop signs. Physio-informed, not medical advice. Gym, home gym, CrossFit, functional fitness.",
          "inputSchema": {
            "properties": {
              "equipment": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Equipment"
              },
              "limitation": {
                "title": "Limitation",
                "type": "string"
              },
              "movement": {
                "title": "Movement",
                "type": "string"
              }
            },
            "required": ["limitation", "movement"],
            "title": "substitute_exercise_toolArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc30b66906e6a784529bc58ac5ff33ae7a9dc64778d539afde0a88209466a0bd"
        },
        {
          "name": "warmup_generator",
          "description": "Warm-up generator, $0.01 USDC on Base: a targeted warm-up for a session type (strength, metcon, engine, speed run, zone 2) with optional prehab for the shoulder, knee, hip, lower back, ankle or wrist. 5-20 minutes, returns structured blocks plus Markdown. Gym, CrossFit, running.",
          "inputSchema": {
            "properties": {
              "focus": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Focus"
              },
              "minutes": {
                "default": 10,
                "title": "Minutes",
                "type": "integer"
              },
              "session": {
                "default": "Metcon",
                "title": "Session",
                "type": "string"
              },
              "style": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Style"
              }
            },
            "title": "warmup_generator_toolArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aeb25973fe6e06b41e6e9a5c070ae7ab19e58e9fa59536746b587262c7101fa0"
        }
      ],
