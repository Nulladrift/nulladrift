      "tools": [
        {
          "name": "acknowledge_alert",
          "title": "Acknowledge Alert",
          "description": "Acknowledge an alert: marks it as being worked on by moving it to the project's 'Acknowledged' state. An alert that is already acknowledged - in the Acknowledged state, a state placed after it, or resolved - is left as it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alertId": {
                "description": "UUID of the alert to acknowledge. Use list_alerts to find it.",
                "type": "string"
              }
            },
            "required": ["alertId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f93dddc5700a5738625f7d4b538592f5f5048398bbb209dbda752c2775c78f46"
        },
        {
          "name": "acknowledge_incident",
          "title": "Acknowledge Incident",
          "description": "Acknowledge an incident: marks it as being worked on by moving it to the project's 'Acknowledged' state. Equivalent to pressing 'Acknowledge' in the OneUptime dashboard. An incident that is already acknowledged - in the Acknowledged state, a state placed after it, or resolved - is left as it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "incidentId": {
                "description": "UUID of the incident to acknowledge. Use list_incidents to find it.",
                "type": "string"
              }
            },
            "required": ["incidentId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0583773d4e71f8c638563e9baac5f6a04fb4adfab4f4832016a75d1a78f7132e"
        },
        {
          "name": "add_alert_note",
          "title": "Add Alert Note",
          "description": "Add an internal note to an alert, visible to your team. Markdown is supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alertId": {
                "description": "UUID of the alert to annotate.",
                "type": "string"
              },
              "note": {
                "description": "The note content (Markdown supported).",
                "type": "string"
              }
            },
            "required": ["alertId", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3afe15668468f712c254ab4b6f2d8987c90ad4a2d443eb665dc8729f7fc8f6ba"
        },
        {
          "name": "add_incident_note",
          "title": "Add Incident Note",
          "description": "Add a note to an incident. Internal notes are visible to your team only; public notes are posted to the status page for subscribers/customers. Markdown is supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "incidentId": {
                "description": "UUID of the incident to annotate.",
                "type": "string"
              },
              "note": {
                "description": "The note content (Markdown supported).",
                "type": "string"
              },
              "visibility": {
                "default": "internal",
                "description": "Where the note is visible: 'internal' (team only, default) or 'public' (posted to the status page).",
                "enum": ["internal", "public"],
                "type": "string"
              }
            },
            "required": ["incidentId", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
