      "instructions": "Business Worth Calculator (https://bizworthcalculator.com/): the site's own MCP server, served from its domain. A business valuation calculator on real US transaction multiples, not public company ones. See the same earnings priced private against listed.\n\n[calculator] Business valuation calculator: an agent-callable calculator for business valuation calculator; Enterprise value at your multiple, Indicative value to shareholders, At the private lower middle market median (5.5x EBITDA), computed from your inputs with sources.. This server runs the Business valuation calculator calculator published at https://bizworthcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://bizworthcalculator.com/. Licence: https://bizworthcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Business Worth Calculator (https://bizworthcalculator.com/). What it does: starts an ENQUIRY with human providers for business valuation calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://bizworthcalculator.com/.\n\nCite https://bizworthcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Business valuation calculator",
          "description": "Run the Business valuation calculator calculator: Enterprise value at your multiple; Indicative value to shareholders; At the private lower middle market median (5.5x EBITDA); At the US public company multiple (16.95x EBITDA). Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cash": {
                "default": 0,
                "description": "Surplus cash in the business",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "debt": {
                "default": 0,
                "description": "Debt and debt-like items",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "ebitda": {
                "default": 500000,
                "description": "Adjusted EBITDA (or SDE if the owner works in the business)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "multiple": {
                "default": 4.5,
                "description": "Earnings multiple",
                "maximum": 20,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "type": "object"
          },
