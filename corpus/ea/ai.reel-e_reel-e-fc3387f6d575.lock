              },
              "creditLimit": {
                "description": "Optional: the most credits the person said these notes may use.",
                "properties": {
                  "aiPlus": {
                    "description": "The most AI+ credits the fixes may use.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "photoEdits": {
                    "description": "The most photo edit credits the fixes may use.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "listingId": {
                "description": "Listing id from list_listings.",
                "type": "string"
              },
              "notes": {
                "description": "The person's revision notes, word for word, with their times when they gave them.",
                "maxLength": 3000,
                "type": "string"
              },
              "watched": {
                "description": "Only after the plan asked which version they watched: editor (the video as it is now) or download (the last file made).",
                "enum": ["editor", "download"],
                "type": "string"
              }
            },
            "required": ["listingId", "notes"],
            "type": "object"
