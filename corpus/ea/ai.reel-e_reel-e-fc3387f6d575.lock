      "instructions": "Keylight works on one Reel-E account's listing videos. A new listing goes start_listing, add_listing_photos, start_video; start_video uses one listing credit and returns an approveUrl for the account owner unless this connection may create listings. Credit-using work and publish_website start at once on a connection the owner gave Full control (the credits and publish permissions); on any other connection they return a confirmationId and wait for the owner's yes in Reel-E. get_confirmation shows how it went. start_listing takes an address, plus the person's public listing page link when they have one, and an idempotencyKey that is reused on retry. Photos come from the person: attached in the chat where the app supports it, imported from the listing link (useImportedPhotos), or dropped in by the owner at the draft's addPhotosUrl from a computer or phone. Files on this machine can be sent with request_photo_upload. set_listing_basics (song from list_songs, branding, length) is optional before start_video; get_listing_status and then get_listing_links follow it. An existing listing starts at list_listings, then get_edit_summary; shots are named by the photoId in the summary. Edits save at once and each returns a changeId that undo_change reverses. To add new photos or a logo to an existing listing, upload_media returns a storageId for add_photos, replace_photo, set_logo or set_headshot.",
      "tools": [
        {
          "name": "add_listing_photos",
          "title": "Add photos to a new listing",
          "description": "Adds photos to a draft: photos attached in the chat (where the app supports it), the photos the listing link import found (useImportedPhotos), files uploaded with request_photo_upload (uploadIds, up to 12), and/or https image links (urls, up to 12 per call). JPG, PNG, WebP or HEIC, up to 25 MB each. Sending the same photo again adds nothing twice, so repeated calls continue until notYetAdded is 0. A listing needs at least 3 photos; the account's photo limit decides how many appear in the video, and the rest stay in the listing gallery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draftId": {
                "description": "The draftId start_listing returned.",
                "type": "string"
              },
              "photos": {
                "description": "Photos attached in the chat.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "uploadIds": {
                "description": "uploadIds from request_photo_upload whose files were already sent, up to 12.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "urls": {
                "description": "https image links to the person's own photos (JPG, PNG, WebP or HEIC), up to 12 per call.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "useImportedPhotos": {
                "description": "true adds the photos the listing link import found.",
                "type": "boolean"
              }
            },
            "required": ["draftId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured result with a `status`.",
            "properties": {
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add photos to a new listing"
