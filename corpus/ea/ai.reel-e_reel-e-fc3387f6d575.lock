        {
          "name": "frame_shot",
          "title": "Frame a shot",
          "description": "Chooses which part of a shot's photo each version shows: Wide (16:9), Square (1:1) or Phone (9:16). Uses no credit; undoable. A version's framing is its own: framing Phone leaves Wide and Square alone. There are four ways to frame, one per call: (a) focusX, focusY (0 to 1, where in the photo the frame centers; 0.5 is the middle) and zoom (1 to 3); (b) a nudge: zoomBy (zoom in is +0.25 for a bit), moveX / moveY (-0.1 moves the frame a little left or up, +0.1 right or down; the frame moves, so the picture appears to slide the other way); (c) frames: one {photoId, focusX, focusY, zoom} per shot, for when each shot needs its own frame (find_framing returns ready frames); or (d) reset true to go back to the default framing. aspect 'all' frames every version at once; a reset with 'all' clears the framing completely.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allShots": {
                "description": "Frame every shot in the video.",
                "type": "boolean"
              },
              "aspect": {
                "description": "Which version: wide, square, phone, or all.",
                "enum": ["all", "wide", "square", "phone"],
                "type": "string"
              },
              "focusX": {
                "description": "Where the frame centers across the photo, 0 (left) to 1 (right); 0.5 is the middle.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "focusY": {
                "description": "Where the frame centers down the photo, 0 (top) to 1 (bottom); 0.5 is the middle.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "frames": {
                "description": "One frame per shot, for shots that each need their own (find_framing returns them).",
                "items": {
                  "properties": {
                    "focusX": {
                      "description": "Where this shot's frame centers across the photo, 0 to 1.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "focusY": {
                      "description": "Where this shot's frame centers down the photo, 0 to 1.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "photoId": {
                      "description": "A photo: its photoId from the edit summary, or its play position like \"shot 3\".",
                      "type": "string"
                    },
                    "zoom": {
                      "description": "How far in this shot's frame is, 1 to 3.",
                      "maximum": 3,
                      "minimum": 1,
                      "type": "number"
                    }
                  },
                  "required": ["photoId"],
                  "type": "object"
                },
                "maxItems": 75,
                "minItems": 1,
                "type": "array"
              },
              "listingId": {
                "description": "Listing id from list_listings.",
                "type": "string"
              },
              "moveX": {
                "description": "A nudge sideways, -1 to 1; -0.1 moves the frame a little left.",
                "maximum": 1,
                "minimum": -1,
                "type": "number"
              },
              "moveY": {
                "description": "A nudge up or down, -1 to 1; -0.1 moves the frame a little up.",
                "maximum": 1,
                "minimum": -1,
                "type": "number"
              },
              "photoIds": {
                "description": "The shots to frame. Not needed with allShots or frames.",
                "items": {
                  "description": "A photo: its photoId from the edit summary, or its play position like \"shot 3\".",
                  "type": "string"
                },
                "maxItems": 75,
                "minItems": 1,
                "type": "array"
              },
              "reset": {
                "description": "true goes back to the default framing.",
                "type": "boolean"
              },
              "zoom": {
                "description": "How far in the frame is, 1 (whole photo) to 3.",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "zoomBy": {
                "description": "A nudge to the current zoom, -2 to 2; +0.25 is a bit closer.",
                "maximum": 2,
                "minimum": -2,
                "type": "number"
              }
            },
            "required": ["aspect", "listingId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured result with a `status`.",
            "properties": {
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Frame a shot"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/keylight-card-v2.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Frame a shot...",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://widget/keylight-card-v2.html"
            }
          },
          "digest": "sha256:9e59bd876212a12a517550dbec7f841424b8cfa940c0000d15d9178fcd4179f4"
