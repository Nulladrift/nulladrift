        {
          "name": "apply_effect",
          "title": "Shot VFX",
          "description": "A one-tap VFX on one shot: dusk (day to twilight), staging_fill (an empty room furnishes itself; interiors only), seasons (season_from current or a season, season_to summer, fall, winter or spring), shadows (a sun time lapse), stars (a starry night), sign_drop (3D letters drop onto the lawn: sign_text is a preset such as For Sale, Just Listed, Open House or Sold, or up to 2 words and 16 characters; default For Sale), helicopter_reveal (a helicopter lifts a cover off the home), sketch_to_real (a pencil sketch becomes the photo), house_drop (a construction time lapse) or people (a couple placed in the scene). The finished clip replaces the shot's clip, with Undo, after a few minutes. suggest_direction picks a VFX and shot for a wish; browse_options vfx lists them all. Uses 1 AI+ credit. On a Full control connection it starts at once; otherwise it returns a confirmationId and waits for the owner's yes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conceptConsent": {
                "description": "true only after the person said this is for builder or concept marketing (needed for concept VFX).",
                "type": "boolean"
              },
              "effect": {
                "description": "Which VFX; browse_options vfx describes each.",
                "enum": ["dusk", "staging_fill", "seasons", "shadows", "stars", "sign_drop", "helicopter_reveal", "sketch_to_real", "house_drop", "people"],
                "type": "string"
              },
              "listingId": {
                "description": "Listing id from list_listings.",
                "type": "string"
              },
              "photoId": {
                "description": "A photo: its photoId from the edit summary, or its play position like \"shot 3\".",
                "type": "string"
              },
              "season_from": {
                "description": "For seasons: the season the photo shows now, or current.",
                "enum": ["current", "summer", "fall", "winter", "spring"],
                "type": "string"
              },
              "season_to": {
                "description": "For seasons: the season to change to.",
                "enum": ["summer", "fall", "winter", "spring"],
                "type": "string"
              },
              "sign_text": {
                "description": "For sign_drop: the sign's words, a preset like 'For Sale' or up to 2 words and 16 characters.",
                "maxLength": 16,
                "type": "string"
              }
            },
            "required": ["effect", "listingId", "photoId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured result with a `status`.",
            "properties": {
