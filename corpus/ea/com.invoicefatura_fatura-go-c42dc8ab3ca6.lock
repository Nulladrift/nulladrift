        {
          "name": "check_einvoicing_readiness",
          "title": "Check an invoice for UAE e-invoicing readiness",
          "description": "Use this when the user asks whether an invoice has what UAE e-invoicing (PINT AE) needs, which fields are missing, or how to get their invoice data ready. A readiness check, not e-invoice validation: given an invoice's details, lists which PINT AE mandatory and conditional fields are present, missing or in the wrong format (seller and buyer legal name, TRN, company registration number from the trade licence or commercial registration, structured address with emirate code, country, invoice number, dates, currency and AED rate, unit codes, VAT category per line, totals that reconcile to the cent), with a plain-language fix for each. Only the accredited service provider validates the actual e-invoice. Use only details the user gave; leave out what they did not give rather than invent it, and the result will show it as missing. With a connected Fatura Go account, pass the invoice_id of a saved draft or invoice instead of the details to check that document. Do not use it for what a tax invoice must show under VAT law (tax_invoice_requirements) or for deadlines (einvoicing_timeline).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aed_exchange_rate": {
                "description": "When the currency is not AED.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "business_id": {
                "description": "Connected Fatura Go account only, with invoice_id.",
                "maxLength": 64,
                "type": "string"
              },
              "buyer": {
                "properties": {
                  "address_line1": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "city": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "country_code": {
                    "description": "Default AE.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "emirate": {
                    "description": "For a UAE buyer.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "is_business": {
                    "description": "false for a consumer (individual not in business). Default true.",
                    "type": "boolean"
                  },
                  "legal_id": {
                    "description": "The company's registration number as printed on its trade licence or commercial registration (or the Cabinet decision number for a body set up by one). A company number only: never a personal ID, passport or Emirates ID number.",
                    "maxLength": 50,
                    "type": "string"
                  },
                  "legal_id_authority": {
                    "description": "The authority that issued the buyer's trade licence, when legal_id_type is TL.",
                    "maxLength": 150,
                    "type": "string"
                  },
                  "legal_id_type": {
                    "description": "TL for a trade licence or commercial registration, CD for a Cabinet decision. Company documents only: do not ask the user for a personal identity document.",
                    "enum": ["TL", "EID", "PAS", "CD"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "passport_country": {
                    "description": "Not needed for a company registration: leave it out.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "region": {
                    "description": "State or province, for a buyer outside the UAE.",
                    "maxLength": 100,
                    "type": "string"
                  },
                  "trn": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "vat_registered": {
                    "description": "The buyer is VAT registered in the UAE.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "currency": {
                "description": "ISO 4217, for example AED.",
                "maxLength": 3,
                "type": "string"
              },
              "document_type": {
                "description": "Default: tax_invoice when the seller has a TRN, else commercial_invoice (out of scope of VAT).",
                "enum": ["tax_invoice", "commercial_invoice"],
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              },
              "invoice_id": {
                "description": "Connected Fatura Go account only: the id of a saved draft or invoice to check, instead of passing its details.",
                "maxLength": 64,
                "type": "string"
              },
              "invoice_number": {
                "maxLength": 100,
                "type": "string"
              },
              "issue_date": {
