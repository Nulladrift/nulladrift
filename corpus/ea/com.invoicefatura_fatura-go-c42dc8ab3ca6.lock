        },
        {
          "name": "create_draft_invoice",
          "title": "Create a draft invoice",
          "description": "Use this when a connected user asks to create, make or draft an invoice for one of their clients. Saves a new draft sales invoice for a client of the business. Line descriptions are printed on the tax invoice: write them in English, translating when the user writes in another language (for example \"Консультация\" becomes \"Consultation\"). Keep names, brands and model numbers exactly as written. Use another language only when the user explicitly asks for it or quotes the exact text. Lines are priced by Fatura Go as in the app (each line rounded, header = sum of lines; with prices_include_vat the entered price includes VAT, e.g. 26.95 = 25.67 + 1.28 VAT). Returns the stored lines and totals and app_url. Nothing is issued, numbered as a tax invoice or sent: the user reviews and issues it in Fatura Go (\"Review and issue in Fatura Go\"). due_date defaults to the client's or business's payment terms. Not for converting a quote: that is done in Fatura Go (Convert to invoice), which links the two. Do not use it to change an existing draft (update_draft_invoice), for a quote (create_draft_quote), or to issue or send an invoice: that happens in Fatura Go.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_id": {
                "description": "From list_businesses. May be left out when the connection shares exactly one business.",
                "maxLength": 64,
                "type": "string"
              },
              "client_id": {
                "description": "From list_clients or create_client.",
                "maxLength": 64,
                "type": "string"
              },
              "client_name": {
                "description": "Only when the client_id is not known: nothing is written, and the matching clients are returned to pick from.",
                "maxLength": 100,
                "type": "string"
              },
              "client_trn": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The buyer's 15-digit TRN for this invoice only, when the buyer gave a TRN that differs from the one saved on the client. It goes on the tax invoice; the client's saved TRN is not changed. Left out: the client's saved TRN is used (an update keeps the current choice); null goes back to the client's saved TRN."
              },
              "client_trn_from_document": {
                "description": "Whether client_trn (not the client's saved TRN) goes on the invoice. Default true when client_trn is given; false goes back to the saved TRN. Changing the client turns it off unless client_trn is sent again.",
                "type": "boolean"
              },
              "currency": {
                "description": "One of AED, SAR, USD, EUR, GBP, KWD, QAR, BHD, OMR, INR. Default the client's preferred currency, else the business currency.",
                "maxLength": 3,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD. Default today (UAE).",
                "maxLength": 10,
                "type": "string"
              },
              "document_language_override": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Language this document prints in: en, ar or bilingual. Left out: a new draft follows the business setting and an update keeps the current choice; null goes back to the business setting. Only for a document the user asked to print in another language."
              },
              "due_date": {
                "description": "YYYY-MM-DD, on or after date.",
                "maxLength": 10,
                "type": "string"
              },
              "fx_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "AED per 1 unit of a foreign currency. USD defaults to the 3.6725 peg."
              },
              "idempotency_key": {
                "description": "Optional. A unique string (for example a UUID) for this request: a retry with the same key returns the first result instead of writing again.",
                "maxLength": 200,
                "type": "string"
              },
              "items": {
                "description": "The lines, 1 to 100. On an update they replace every line.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Line descriptions are printed on the tax invoice: write them in English, translating when the user writes in another language (for example \"Консультация\" becomes \"Consultation\"). Keep names, brands and model numbers exactly as written. Use another language only when the user explicitly asks for it or quotes the exact text.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "qty": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 40,
                          "type": "string"
                        }
                      ],
                      "description": "Quantity above 0. Default 1."
                    },
                    "unit_code": {
                      "description": "Unit of measure, one of C62, HUR, DAY, WEE, MON, ANN, KGM, TNE, MTR, KMT, MTK, LTR, XBX, SET, PR, E48, LS (UN/ECE Rec 20/21: C62 each, HUR hour, DAY day, WEE week, MON month, ANN year, KGM kg, TNE tonne, MTR metre, KMT km, MTK m², LTR litre, XBX box, SET set, PR pair, E48 service, LS lump sum). Left out: a new line gets C62 (each); on an update a line keeps its stored unit when it is at the same position with the same description as before, else C62. Send unit_code to change it.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "unit_price": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 40,
                          "type": "string"
                        }
                      ],
                      "description": "Price of one unit. VAT-inclusive when prices_include_vat is true, else before VAT."
                    },
                    "vat_type": {
                      "description": "One of standard, zero, exempt, out_of_scope. Default standard (5%).",
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "prices_include_vat": {
                "description": "Whether unit_price includes the 5% VAT. Default the business setting.",
                "type": "boolean"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a draft invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/widgetDescription": "This card already shows the user the full document: parties, dates, every line, VAT, totals and status. Reply in one or two sentences. Do not repeat or redraw the document, its lines or its totals, as text or as a table. Still mention any warning or note in the result.",
            "securitySchemes": [
              {
                "scopes": ["fatura.drafts"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://fatura/invoice-card-v2"
            },
            "ui/resourceUri": "ui://fatura/invoice-card-v2"
          },
          "digest": "sha256:055489d08832b53cd8d56f8f3bab991149d58b1e044d9ec75d2c181fc76b7cc6"
        },
