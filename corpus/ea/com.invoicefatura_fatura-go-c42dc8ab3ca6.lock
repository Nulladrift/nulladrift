                      "maxLength": 40,
                      "type": "string"
                    },
                    "net_amount": {
                      "description": "Line net after any line discount, before VAT. Default quantity × unit price.",
                      "maximum": 1000000000,
                      "minimum": -1000000000,
                      "type": "number"
                    },
                    "quantity": {
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "unit_code": {
                      "description": "UNECE Rec 20 code, for example C62, H87, HUR; or what the user wrote.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "unit_price": {
                      "description": "Net, before VAT.",
                      "maximum": 1000000000,
                      "minimum": -1000000000,
                      "type": "number"
                    },
                    "vat_rate": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "vat_type": {
                      "description": "Default standard (5%).",
                      "enum": ["standard", "zero", "exempt", "out_of_scope", "reverse_charge"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "paid_in_full": {
                "description": "true when nothing is due, so no due date is needed.",
                "type": "boolean"
              },
              "seller": {
