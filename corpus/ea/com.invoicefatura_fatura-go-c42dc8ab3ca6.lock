        {
          "name": "create_draft_expense",
          "title": "Create an expense draft from a receipt",
          "description": "Use this when the user shares a receipt or supplier invoice, or asks to record an expense or purchase. Saves an expense draft from a purchase receipt or supplier invoice for the user to review in Fatura Go (\"Review in Fatura Go\"); no expense is recorded until they save it there. Pass the fields you read from the receipt. VAT follows the app: only the VAT printed on the receipt, or 5/105 of the total when the receipt says prices include 5% VAT; otherwise no VAT and a \"VAT not shown\" warning. Returns the stored draft(s), warnings in plain words and the review link. A supplier with the same TRN or exactly the same name is linked; similar names are returned to choose from; no supplier is created. An open draft with the same supplier and invoice number is returned instead of a second one. Do not use it for sales invoices (create_draft_invoice) or to pay a supplier bill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_id": {
                "description": "From list_businesses. May be left out when the connection shares exactly one business.",
                "maxLength": 64,
                "type": "string"
              },
              "category": {
                "description": "Expense category slug, e.g. fuel, meals, office_supplies, software. Default other.",
                "maxLength": 60,
                "type": "string"
              },
              "currency": {
                "description": "One of AED, SAR, USD, EUR, GBP, KWD, QAR, BHD, OMR, INR. Default the business currency.",
                "maxLength": 3,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, the receipt date. Default today (UAE).",
                "maxLength": 10,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. A unique string (for example a UUID) for this request: a retry with the same key returns the first result instead of writing again.",
                "maxLength": 200,
                "type": "string"
              },
              "net_amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "The total before VAT, only when printed."
              },
              "new_supplier": {
                "description": "true when the user says the supplier is new although similar names exist. Nothing is created now; Fatura Go adds the supplier when the expense is saved.",
                "type": "boolean"
              },
              "reference": {
                "description": "An order or PO number printed apart from the invoice number.",
                "maxLength": 200,
                "type": "string"
              },
              "supplier": {
                "description": "The seller's name as printed.",
                "maxLength": 200,
                "type": "string"
              },
              "supplier_id": {
                "description": "A supplier of the business, from the candidates a previous call returned.",
                "maxLength": 64,
                "type": "string"
              },
              "supplier_invoice_number": {
                "description": "The invoice or receipt number as printed.",
                "maxLength": 100,
                "type": "string"
              },
              "supplier_trn": {
                "description": "The SELLER's 15-digit TRN as printed (never the buyer's). Checked as check_trn does.",
                "maxLength": 40,
                "type": "string"
              },
              "total": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "The grand total printed on the receipt, VAT included. Required with the receipt fields."
              },
              "vat_amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "The VAT amount ONLY when a VAT line is printed. Leave it out when none is printed; never calculate it."
              },
              "vat_included_stated": {
                "description": "true ONLY when the receipt explicitly says the prices include 5% VAT (e.g. \"Inclusive of 5% VAT\"). A TRN alone is not such a statement.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
