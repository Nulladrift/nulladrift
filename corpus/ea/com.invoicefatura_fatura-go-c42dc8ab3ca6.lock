        {
          "name": "record_payment",
          "title": "Record an invoice payment",
          "description": "Use this when the user says a client paid an invoice, fully or in part, and asks to record or mark it as paid. Records a payment the client made against an issued invoice, through the same path as recording it in Fatura Go (accounting journal, paid status). Two steps: without confirmation_token nothing is recorded and the result is a preview (invoice, amount, date, method, account, remaining after) with a confirmation_token valid 10 minutes for one use; call again with the same arguments and the token only after the user answered (a confirmation sent within 10 seconds of the preview is refused). amount must be above 0 and at most the remaining balance; an overpayment is recorded in Fatura Go, not here. Not for a Shopify order's invoice. The date must not be in a closed accounting period. method is one of bank_transfer, cash, cheque, card, other: cash posts to cash on hand, any other or none to the default bank account. A recorded payment can be undone in the app; there is no undo tool. Do not use it for supplier bill payments or refunds: those are recorded in Fatura Go.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "The amount received, in the invoice currency, above 0, at most 2 decimals."
              },
              "business_id": {
                "description": "From list_businesses. May be left out: the invoice is then looked up in every business shared with this connection.",
                "maxLength": 64,
                "type": "string"
              },
              "confirmation_token": {
                "description": "Leave out on the first call (preview). Pass the token from the preview only after the user confirmed it, with the same other arguments.",
                "maxLength": 100,
                "type": "string"
              },
              "currency": {
                "description": "Optional check: must be the invoice currency.",
                "maxLength": 3,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, the day the money was received. Default today (UAE).",
                "maxLength": 10,
                "type": "string"
              },
              "invoice_id": {
                "description": "From list_invoices or get_invoice.",
                "maxLength": 64,
                "type": "string"
              },
              "invoice_number": {
                "description": "Instead of invoice_id.",
                "maxLength": 100,
                "type": "string"
              },
              "method": {
                "description": "One of bank_transfer, cash, cheque, card, other.",
                "maxLength": 20,
                "type": "string"
              },
              "reference": {
                "description": "Bank or cheque reference, if the user gave one.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record an invoice payment"
