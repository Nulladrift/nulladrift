        {
          "name": "check_vat_on_supply",
          "title": "Check the VAT treatment of a supply",
          "description": "Use this when the user asks whether to charge 5% VAT, 0% or no VAT on a sale: to a client abroad, in a free zone or in the GCC, on exports of goods or services, or for property, education or healthcare. Says whether a UAE supply is standard-rated (5%), zero-rated, exempt or out of scope, from what is supplied (goods or services, or a special category such as residential property, education or international transport), where the customer is (country, UAE free zone) and, for exports, the facts zero rating depends on (goods leaving within 90 days and the evidence; for services the customer's residence and presence, the 30-day rule and whether a visit was connected with the work, connection with UAE real estate or goods, the special place-of-supply rules). Each step cites the article, and a zero rate comes with the conditions and records needed to keep it. When a deciding fact is missing the result is \"depends\" with the questions to ask: ask the user, do not assume. Do not use it to calculate an amount (calculate_vat) or for registration (check_vat_registration).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "A special category, if any. Default general.",
                "enum": ["general", "international_transport", "means_of_transport", "investment_precious_metals", "residential_first_supply", "residential_other", "bare_land", "local_passenger_transport", "financial_services_margin", "education", "healthcare", "crude_oil_natural_gas"],
                "type": "string"
              },
              "connected_to_goods_in_uae": {
                "type": "boolean"
              },
              "connected_to_uae_real_estate": {
                "type": "boolean"
              },
              "customer_country": {
                "description": "ISO 3166 two-letter code of where the customer is, for example AE, GB, SA.",
                "maxLength": 3,
                "type": "string"
              },
              "customer_has_uae_residence": {
                "description": "Services: the customer has a business, branch or residence in the UAE.",
                "type": "boolean"
              },
              "customer_in_uae_free_zone": {
                "type": "boolean"
              },
              "customer_in_uae_when_performed": {
                "type": "boolean"
              },
              "days_in_uae_last_12_months": {
                "description": "Days the customer (or the person receiving the work) was in the UAE over the 12 months before the supply.",
                "maximum": 366,
                "minimum": 0,
                "type": "integer"
              },
              "export_arranged_by": {
                "description": "Goods: who arranges transport out of the UAE.",
                "enum": ["supplier", "customer"],
                "type": "string"
              },
              "export_evidence": {
                "items": {
                  "enum": ["customs_declaration", "commercial_evidence", "official_evidence", "shipping_certificate", "suspension_declaration"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "goods_exported_within_90_days": {
                "type": "boolean"
              },
              "goods_into_designated_zone": {
                "type": "boolean"
              },
              "goods_located_outside_uae": {
                "description": "Goods: supplied abroad and never brought into or sent from the UAE.",
                "type": "boolean"
              },
              "performed_outside_uae": {
                "description": "Services: the work is actually carried out outside the UAE.",
                "type": "boolean"
              },
              "presence_connected_with_supply": {
                "description": "Any time the customer spent in the UAE was connected with this work (meetings, workshops).",
                "type": "boolean"
              },
              "received_in_uae_by_another_person": {
                "description": "An employee, director or branch of the customer receives the work in the UAE.",
                "type": "boolean"
              },
              "special_place_of_supply": {
                "enum": ["none", "installation_on_goods", "means_of_transport", "hotel_restaurant_catering", "cultural_artistic_sport_educational_event", "real_estate", "transport_starting_in_uae", "telecom_or_electronic_used_in_uae"],
                "type": "string"
              },
              "supply": {
                "enum": ["goods", "services"],
                "type": "string"
              }
            },
            "required": ["supply"],
            "type": "object"
          },
