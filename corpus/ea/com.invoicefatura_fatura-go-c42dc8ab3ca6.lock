        {
          "name": "prepare_invoice",
          "title": "Prepare a UAE invoice",
          "description": "Use this when a user without a connected Fatura Go account asks to make, prepare or calculate an invoice for a client. Checks an invoice and works out its totals with UAE VAT rules (line rounding, 5% standard rate, full or simplified tax invoice, AED amounts), lists what is still missing under Article 59, and returns a link that opens the invoice in the Fatura Go invoice generator on invoicefatura.com, where the user can review it and download a PDF. When no card is shown, show the user the lines and totals from the result before the link. Nothing is issued or sent, and no invoice number is assigned. The link works for 24 hours. Use only details the user gave; leave a TRN out rather than guess it. No email addresses or phone numbers. For someone who has connected their own Fatura Go account, use create_draft_invoice from that connection instead: it saves a draft in their account. Do not use it for a connected user: save a draft with create_draft_invoice instead. It does not send or issue an invoice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "client": {
                "description": "The customer being invoiced.",
                "properties": {
                  "address": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "trn": {
                    "description": "15 digits. Leave out if unknown; never invent one.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "currency": {
                "description": "Default AED.",
                "enum": ["AED", "SAR", "USD", "EUR", "GBP", "KWD", "QAR", "BHD", "OMR", "INR"],
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD; default 14 days after the invoice date (Net 14).",
                "maxLength": 10,
                "type": "string"
              },
              "invoice_date": {
                "description": "YYYY-MM-DD; default today (UAE).",
                "maxLength": 10,
                "type": "string"
              },
              "language": {
                "description": "Invoice language; default en.",
                "enum": ["en", "ar", "bilingual"],
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "description": {
                      "description": "Line descriptions are printed on the tax invoice: write them in English, translating when the user writes in another language (for example \"Консультация\" becomes \"Consultation\"). Keep names, brands and model numbers exactly as written. Use another language only when the user explicitly asks for it or quotes the exact text.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 1000000,
                      "type": "number"
                    },
                    "unit_price": {
                      "maximum": 1000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "vat_type": {
                      "description": "Default standard (5%).",
                      "enum": ["standard", "zero", "exempt", "out_of_scope"],
                      "type": "string"
                    }
                  },
                  "required": ["description", "quantity", "unit_price"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "maxLength": 500,
                "type": "string"
              },
              "prices_include_vat": {
                "description": "true when unit prices already include VAT.",
                "type": "boolean"
              },
              "seller": {
                "description": "The user's own business.",
                "properties": {
                  "address": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "trn": {
                    "description": "15 digits. Leave out if unknown; never invent one.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["client", "lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare a UAE invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/widgetDescription": "This card already shows the user the full document: parties, dates, every line, VAT, totals and status. Reply in one or two sentences. Do not repeat or redraw the document, its lines or its totals, as text or as a table. Still mention any warning or note in the result.",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["fatura.read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://fatura/invoice-card-v2"
            },
            "ui/resourceUri": "ui://fatura/invoice-card-v2"
