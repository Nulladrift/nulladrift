                "enum": ["full", "simplified", "auto"],
                "type": "string"
              },
              "reverse_charge": {
                "type": "boolean"
              },
              "total_aed": {
                "description": "The supply amount in AED, VAT included.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
