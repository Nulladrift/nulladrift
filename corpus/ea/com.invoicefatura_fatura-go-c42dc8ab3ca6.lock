                  },
                  "city": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "country_code": {
                    "description": "Default AE.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "emirate": {
                    "description": "AUH, DXB, SHJ, AJM, UAQ, RAK, FUJ or the emirate name.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "legal_id": {
                    "description": "The company's registration number as printed on its trade licence or commercial registration (or the Cabinet decision number for a body set up by one). A company number only: never a personal ID, passport or Emirates ID number.",
                    "maxLength": 50,
                    "type": "string"
                  },
                  "legal_id_authority": {
                    "description": "The authority that issued the trade licence (for example Dubai DET or a free zone authority), when legal_id_type is TL.",
                    "maxLength": 150,
                    "type": "string"
                  },
                  "legal_id_type": {
                    "description": "TL for a trade licence or commercial registration, CD for a Cabinet decision. Company documents only: do not ask the user for a personal identity document.",
                    "enum": ["TL", "EID", "PAS", "CD"],
                    "type": "string"
                  },
                  "legal_name": {
                    "description": "As on the trade licence.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "passport_country": {
                    "description": "Not needed for a company registration: leave it out.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "trn": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "totals": {
                "description": "The totals printed on the invoice, to check they reconcile.",
                "properties": {
                  "gross": {
                    "type": "number"
                  },
                  "net": {
                    "type": "number"
                  },
                  "vat": {
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
