        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Use this when the user wants to compare packaged foods, such as \"which of these barcodes has the least sugar?\". Pass one to five barcodes and optionally sugars (default), salt or kcal. Returns a ranking from lowest to highest per 100 g with each product's other nutrition, Nutri-Score and NOVA group, and lists barcodes that were invalid, not found or lacked data. Crowd-sourced data: check the physical labels.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcodes": {
                "description": "Barcodes to compare, up to 5",
                "items": {
                  "description": "EAN or UPC barcode, 8 to 14 digits",
                  "maxLength": 20,
                  "minLength": 8,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "field": {
                "description": "What to rank by, per 100 g: sugars (default), salt or kcal",
                "enum": ["sugars", "salt", "kcal"],
                "type": "string"
              }
            },
            "required": ["barcodes"],
            "type": "object"
          },
          "outputSchema": {
