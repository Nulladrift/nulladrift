                  "type": "string"
                },
                "type": "array"
              },
              "listed_traces": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "may_contain": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": ["string", "null"]
              },
              "not_listed": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "status": {
                "enum": ["ok", "not_found", "invalid_barcode", "unavailable"],
                "type": "string"
              },
              "unknown": {
                "type": "boolean"
              },
              "unrecognised": {
                "items": {
                  "type": "string"
