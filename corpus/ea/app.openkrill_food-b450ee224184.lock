      "serverInfo": {
        "name": "food",
        "title": "Food Facts: Look up food by barcode",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Food Facts: Look up food by barcode. Use these tools for questions about packaged food products identified by barcode or name. Call lookup_barcode for one product, search_products to find barcodes by name or brand, compare_products to rank up to five barcodes by sugars, salt or kcal per 100 g, and check_allergens to see whether a product's listed allergens include ones the user wants to avoid. The data is crowd-sourced: always mention the data_quality_note and tell the user to check the physical label, and never describe an allergen check as a guarantee that a product is safe. If check_allergens returns unknown true, say the entry has no allergen or ingredient data. Credit Open Food Facts. Do not give dietary or medical advice. Open Food Facts has no recall data: say so when asked about a recall. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_allergens",
          "title": "Check allergens",
          "description": "Use this when the user asks whether a product contains certain allergens, such as \"does 5449000000996 contain milk or nuts?\". Pass the barcode and the allergens to avoid. Returns which are listed as contained, which as possible traces, which are not listed, and whether the entry has no allergen data at all. It reads the entry's allergen tags and ingredients text, which are crowd-sourced and can be wrong: it is a data lookup, not a safety guarantee. The physical label wins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid": {
                "description": "Allergens to look for, such as milk, nuts, peanuts, soy, gluten, eggs, fish, shellfish, sesame",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "barcode": {
                "description": "EAN or UPC barcode, 8 to 14 digits",
                "maxLength": 20,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["avoid", "barcode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "avoid": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "barcode": {
                "type": "string"
              },
              "brands": {
                "type": ["string", "null"]
              },
              "contains": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "data_quality_note": {
                "type": "string"
              },
              "listed_allergens": {
