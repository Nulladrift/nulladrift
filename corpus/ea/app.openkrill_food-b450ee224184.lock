        {
          "name": "lookup_barcode",
          "title": "Look up a barcode",
          "description": "Use this when the user gives a product barcode (EAN or UPC) and wants to know what is in it, such as \"what is in 3017620422003?\". Returns the product name, brands, quantity, ingredients text, the allergens and traces the entry lists, Nutri-Score, NOVA group, nutrition per 100 g, a data-quality note and the Open Food Facts link. The barcode check digit is verified first. The data is crowd-sourced and may be incomplete or wrong: check the physical label. Not dietary or medical advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "description": "EAN or UPC barcode, 8 to 14 digits",
                "maxLength": 20,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
