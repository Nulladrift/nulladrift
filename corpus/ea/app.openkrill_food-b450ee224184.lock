        {
          "name": "search_products",
          "title": "Search products",
          "description": "Use this when the user wants to find food products by name or brand, such as \"find oat milks\" or \"Nutella jars in Germany\". Pass the words to search for and optionally a country (English name or two-letter code) and a limit of up to 10. Returns each product's barcode, name, brands and Nutri-Score; use lookup_barcode for the full entry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country to limit to, as an English name or two-letter code, such as \"France\" or \"US\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "How many products to return, up to 10 (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, such as \"oat milk\" or a brand and product name",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "notice": {
