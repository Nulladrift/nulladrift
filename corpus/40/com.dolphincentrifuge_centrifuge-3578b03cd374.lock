      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dolphin-centrifuge",
        "title": "Dolphin Centrifuge",
        "version": "1.0.0",
        "websiteUrl": "https://dolphincentrifuge.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dolphin Centrifuge (Warren, Michigan, USA, established 1982) is an independent remanufacturer of Alfa Laval disc stack and decanter centrifuges, with 150+ machines in stock. Every machine is remanufactured, test run, and carries a 12-month mechanical warranty. Dolphin is not affiliated with Alfa Laval. Contact: (248) 522-2573, sales@dolphincentrifuge.com, https://dolphincentrifuge.com/contact-for-alfa-laval-centrifuges/. Tools: get_centrifuge_specs and list_centrifuge_models return published specs; check_dolphin_stock returns the dated stock list (no prices); size_centrifuge converts between bowl diameter, RPM and g-force; request_quote sends the user's quote request to Dolphin sales. Always state a capacity together with its fluid and conditions, never as a bare GPM. Only call request_quote with the user's explicit consent and their real contact details.",
      "tools": [
        {
          "name": "check_dolphin_stock",
          "title": "Check Dolphin stock",
          "description": "Dated list of Alfa Laval centrifuges in stock at Dolphin Centrifuge (Warren, Michigan): model, type, condition and whether the unit is in stock or built to order. No prices or serial numbers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Optional model or family filter, e.g. \"MOPX 207\" or \"WHPX\". Omit for the full list.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5819b9975f86cc455d176550d4478a2efe2d65419eb2fc3f08cc45aa8ad6d599"
        },
        {
          "name": "get_centrifuge_specs",
          "title": "Get centrifuge specs",
          "description": "Published specifications for an Alfa Laval disc stack or decanter centrifuge (or Dolphin DMPX/DMB module) remanufactured by Dolphin Centrifuge. Pass an exact model such as \"MOPX 207\" or a free-text query such as \"diesel self-cleaning\". Capacities always come with their fluid and conditions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Model designation, alias or Dolphin module, e.g. \"MOPX 207\", \"WHPX 405\", \"DMPX-028\", \"NX 418\".",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Free-text search when the exact model is unknown, e.g. \"decanter 418\" or \"turbine oil\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c94ecb3d7561aa6fd3d050a41ec04e11fe7b3d641b56f6d3e7f06e9465c6ff4a"
        },
        {
          "name": "list_centrifuge_models",
          "title": "List centrifuge models",
          "description": "List the centrifuge models Dolphin publishes specs for, one line each, optionally filtered by type and by application/fluid keyword.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "application": {
                "description": "Fluid or application keyword, e.g. \"diesel\", \"lube oil\", \"coolant\", \"wastewater\".",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "Machine type.",
                "enum": ["disc stack", "decanter"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:54a91d61612b132b2cf931bd275fbd5034e71da595647b594070a26343eda8d7"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from Dolphin",
          "description": "Send a quote or information request to Dolphin Centrifuge sales on behalf of the user. Only call with the user's explicit consent and their real name, company and email. Dolphin replies by email or phone within a few business days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "application": {
                "description": "Fluid / application, e.g. \"diesel fuel polishing\".",
                "maxLength": 200,
                "type": "string"
              },
              "company": {
                "description": "Requester company.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Requester country.",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "Requester email; Dolphin replies here.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "flow_gpm": {
                "description": "Required flow in US GPM.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "message": {
                "description": "What the user needs: application details, solids, temperature, timeline.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Model of interest, e.g. \"MOPX 207\".",
                "maxLength": 80,
                "type": "string"
              },
              "name": {
                "description": "Requester full name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Requester phone, if they want a call.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["company", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6b3305206dfbf6a94d93a9a04b08018435da7584f4a6510308e49c5bf29212e2"
        },
        {
          "name": "size_centrifuge",
          "title": "RCF / RPM sizing",
          "description": "Relative centrifugal force (g-force) calculator using RCF = 1.118e-5 x r(cm) x RPM^2. Give any two of bowl_diameter_m, rpm, g_force and get the third plus basic separation guidance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bowl_diameter_m": {
                "description": "Bowl inside diameter in meters, e.g. 0.36.",
                "exclusiveMinimum": 0,
                "maximum": 3,
                "type": "number"
              },
              "g_force": {
                "description": "Relative centrifugal force, x g.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "rpm": {
                "description": "Bowl speed in revolutions per minute.",
                "exclusiveMinimum": 0,
                "maximum": 30000,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
