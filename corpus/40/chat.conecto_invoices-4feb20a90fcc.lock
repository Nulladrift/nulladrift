        {
          "name": "invoices_void",
          "title": "Void a quote or invoice",
          "description": "Void a document. A sent one keeps its number (numbers stay gapless) but can no longer be paid, accepted or viewed; a draft is simply discarded. Refused while payments are recorded on it, on an invoice with credit notes and on a credit note (correct those with another credit note or a new invoice), and on an invoice that may be in the customer's hands (emailed, opened, or its PDF downloaded through a link): that one is cancelled with a credit note for all of it, as the law asks. An invoice posted to the books is reversed there. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "invoice_id": {
                "description": "The invoice_id invoices_create returned (quotes and credit notes have one too).",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "reason": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["invoice_id"],
            "type": "object"
          },
          "annotations": {
