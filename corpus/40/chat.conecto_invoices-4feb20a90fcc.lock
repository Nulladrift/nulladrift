        {
          "name": "invoices_update",
          "title": "Change a draft",
          "description": "Change a draft quote or invoice: give only what changes; customer and items replace the old ones. A sent document can't change: void it with invoices_void and create a new one. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217, e.g. \"USD\", \"EUR\" or \"JPY\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "description": "Who the document is for. Link a CRM record with contact_id or company_id, or give name and email (an email that matches a CRM contact links it). What is given here is printed as it is.",
                "properties": {
                  "address": {
                    "description": "Postal address, one line per row.",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "company_id": {
                    "description": "A CRM company; fills the name.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "contact_id": {
                    "description": "A CRM contact; fills the name and email.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "country": {
                    "description": "ISO 3166-1 code of the customer's country, e.g. \"FR\". Checks intra_eu and export invoices; e-invoices need it.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "email": {
                    "description": "Where the document is emailed.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "description": "Who is billed, as printed.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "tax_id": {
                    "description": "The customer's VAT or tax number, for business customers. A reverse-charge or intra-EU invoice needs their EU VAT ID, e.g. \"FR12345678901\".",
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "due_date": {
                "description": "YYYY-MM-DD, or null to go back to the default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "e_invoice": {
                "description": "Invoices and their credit notes as EN 16931 e-invoices (German B2B invoices must be from 2027): factur-x (Factur-X/ZUGFeRD, the XML inside the PDF/A-3) or xrechnung (XRechnung 3.0, its own XML beside the PDF), checked against the EN 16931 schema before sending. \"\" is the default: none, except that from 2027 an invoice from a German business to a German business above EUR 250 is a factur-x; \"none\" opts out (a business under the EUR 800,000 turnover allowance until 2028). Needs the customer's country. Default: the profile's.",
                "enum": ["", "factur-x", "xrechnung", "none"],
                "type": "string"
              },
              "invoice_id": {
                "description": "The invoice_id invoices_create returned (quotes and credit notes have one too).",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "issue_date": {
                "description": "YYYY-MM-DD, or null to go back to the default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "With books: the income account this line books to, e.g. \"4100\" for services. Default: the sales account.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "description": {
                      "description": "What was sold. Lines after the first print smaller, underneath.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "discount": {
                      "description": "Discount percent on this line, e.g. 10.",
                      "maxLength": 24,
                      "type": ["number", "string"]
                    },
                    "quantity": {
                      "description": "Default 1. Up to 6 decimals, e.g. 1.5 (hours).",
                      "maxLength": 24,
                      "type": ["number", "string"]
                    },
                    "tax_rate": {
                      "description": "Tax percent, e.g. 19. Default: the profile's tax_rate.",
                      "maxLength": 24,
                      "type": ["number", "string"]
                    },
                    "tracking": {
                      "additionalProperties": {
                        "maxLength": 60,
                        "type": "string"
                      },
                      "description": "With books: tracking options, e.g. {\"Department\": \"Service\"}.",
                      "maxProperties": 2,
                      "type": "object"
                    },
                    "unit_price": {
                      "description": "The price of one, before tax, e.g. \"19.99\". Negative for a credit line.",
                      "maxLength": 24,
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["description", "unit_price"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Printed above the lines, e.g. \"Thank you for your order\" or a project reference.",
                "maxLength": 5000,
                "type": "string"
              },
              "payment_link": {
                "description": "An https link to pay this document. Default: the profile's payment_link.",
                "maxLength": 500,
                "type": "string"
              },
              "payment_terms_days": {
                "maximum": 365,
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "supply_date": {
                "description": "YYYY-MM-DD, or null to go back to the default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "supply_until": {
                "description": "YYYY-MM-DD, or null to go back to the default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "tax_exemption": {
                "description": "Why lines with tax_rate 0 carry no tax, printed on the invoice as the law asks: exempt, zero_rated, reverse_charge (the customer accounts for the VAT), intra_eu (goods to a business in another EU country), export (goods leaving the EU), outside_scope, small_business (a business under its country's small-business VAT exemption, such as UStG §19 or art. 293 B CGI: no line may carry tax). Needed in the EU for any line without tax. Default: the profile's.",
                "enum": ["", "exempt", "zero_rated", "reverse_charge", "intra_eu", "export", "outside_scope", "small_business"],
                "type": "string"
              },
              "tax_exemption_note": {
                "description": "The wording printed for the exemption instead of the standard one, e.g. \"Steuerbefreit als Kleinunternehmer nach § 19 UStG\".",
                "maxLength": 300,
                "type": "string"
              },
              "valid_until": {
                "description": "YYYY-MM-DD, or null to go back to the default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "vat_exchange_rate": {
                "description": "For an invoice in another currency than the national one of the business's country: one unit of it in the national currency, for the VAT shown in both. Default in the EU: the European Central Bank's rate for the day of supply; UK businesses give it.",
                "maxLength": 24,
                "type": ["number", "string", "null"]
              }
            },
            "required": ["invoice_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a draft"
          },
          "behavior": {
