            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "In the invoice's currency, e.g. \"250.00\". Negative for a refund.",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "date": {
                "description": "When it was paid. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "invoice_id": {
                "description": "The invoice_id invoices_create returned (quotes and credit notes have one too).",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "keep_excess": {
                "default": false,
                "description": "Paid more than the balance: keep the rest as the customer's credit.",
                "type": "boolean"
              },
              "method": {
                "default": "other",
                "enum": ["bank_transfer", "card", "cash", "check", "online", "other"],
                "type": "string"
              },
              "note": {
                "maxLength": 500,
                "type": "string"
              },
              "reference": {
                "description": "e.g. the bank transfer reference or the payment id.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["amount", "invoice_id"],
            "type": "object"
          },
