        {
          "name": "invoices_create",
          "title": "Create a quote or invoice",
          "description": "Create a quote or an invoice as a draft: the customer (a CRM contact or company, or a name and email), line items, currency and dates. Nothing is numbered or sent yet; change drafts with invoices_update and send them with invoices_send. Amounts are the business's money in the document's currency, rounded half-up line by line. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217, e.g. \"USD\", \"EUR\" or \"JPY\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "description": "Who the document is for. Link a CRM record with contact_id or company_id, or give name and email (an email that matches a CRM contact links it). What is given here is printed as it is.",
                "properties": {
                  "address": {
                    "description": "Postal address, one line per row.",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "company_id": {
                    "description": "A CRM company; fills the name.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "contact_id": {
                    "description": "A CRM contact; fills the name and email.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "country": {
                    "description": "ISO 3166-1 code of the customer's country, e.g. \"FR\". Checks intra_eu and export invoices; e-invoices need it.",
                    "maxLength": 2,
                    "type": "string"
                  },
                  "email": {
                    "description": "Where the document is emailed.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "description": "Who is billed, as printed.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "tax_id": {
                    "description": "The customer's VAT or tax number, for business customers. A reverse-charge or intra-EU invoice needs their EU VAT ID, e.g. \"FR12345678901\".",
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "due_date": {
                "description": "Invoices. Default: issue date + the payment terms.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "e_invoice": {
