        {
          "name": "account_audit_log",
          "title": "Read the audit log",
          "description": "The account's admin and security actions, newest first: keys made and revoked, limits and auto-reload, the owner's sign-ins, connectors, exports, vault reads and writes, credentials set and everything deleted. Ordinary work is in the call log (account_list_calls). verify: true also checks the hash chain, which breaks where an entry was changed or removed. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Only actions starting with this, like \"key.\" or \"tool.vault_\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
