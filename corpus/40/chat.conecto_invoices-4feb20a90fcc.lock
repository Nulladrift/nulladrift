        {
          "name": "invoices_create_credit_note",
          "title": "Credit an invoice",
          "description": "Issue a credit note against a sent invoice: all of it, some of its lines, or an amount. It takes the next credit note number (gapless, CN-0001...), gets a PDF and a page like an invoice, and is emailed to the customer unless email is false. It lowers what the customer still owes; refunded: true says the money went back to them instead, and the invoice records the refund. In much of the EU a sent invoice is corrected this way, not voided. When the account keeps books, the sale and its tax are reversed there. Costs $0.10 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "A sum to credit, tax included, e.g. \"50.00\" off for a late delivery. Its tax follows the invoice's rates (or those of `lines`, when given too).",
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "email": {
                "default": true,
                "description": "false: issue it without emailing anyone.",
                "type": "boolean"
              },
              "invoice_id": {
                "description": "The invoice_id invoices_create returned (quotes and credit notes have one too).",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "lines": {
                "description": "Lines of the invoice to credit, at its prices. Leave out lines and amount to credit the whole invoice (or what is left of it).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line": {
                      "description": "The invoice's line number, from 1, in the order invoices_get lists its items.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "How many to credit. Default: all of the line not credited yet.",
                      "maxLength": 24,
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["line"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "link_hours": {
                "default": 24,
                "description": "How long the PDF download link works, in hours (up to 168).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "description": "A short note in the email.",
                "maxLength": 2000,
                "type": "string"
              },
              "method": {
                "default": "other",
                "description": "With refunded: how the money went back.",
                "enum": ["bank_transfer", "card", "cash", "check", "online", "other"],
                "type": "string"
              },
              "reason": {
                "description": "Printed on the credit note, e.g. \"Returned: 1 bike rack\".",
                "maxLength": 500,
                "type": "string"
              },
              "reference": {
                "description": "With refunded: e.g. the bank transfer or refund id.",
                "maxLength": 120,
                "type": "string"
              },
              "refunded": {
                "default": false,
                "description": "true: the money went back to the customer (say how with method and reference). false: the credit lowers what they still owe.",
                "type": "boolean"
              },
              "to": {
                "description": "Email it to this address instead of the customer's.",
                "maxLength": 254,
                "type": "string"
              }
            },
            "required": ["invoice_id"],
            "type": "object"
          },
