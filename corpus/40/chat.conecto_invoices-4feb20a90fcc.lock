        {
          "name": "invoices_statement",
          "title": "Make a customer statement",
          "description": "A customer statement, like Xero's. outstanding (the default) lists every invoice the customer still owed on as_of (default today) with what was paid or credited, how late each is and the money owed by how late; activity starts from what they owed before from, lists each invoice, payment and credit note up to to (default this month so far) with the running balance, and ends with what they owed. One currency (default the one they are billed in most). It is a PDF in the file store in the business's look and document language; email: true also emails the customer a link to it in the business's name, under the rules every bot email follows and at most once a day per customer. $0.05. Costs $0.05 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217, e.g. \"USD\", \"EUR\" or \"JPY\".",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "description": "Whose statement: a CRM contact_id or company_id, or the email or the name on their invoices.",
                "properties": {
                  "company_id": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "contact_id": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "email": {
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "email": {
                "default": false,
