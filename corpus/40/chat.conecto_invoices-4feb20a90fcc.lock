        {
          "name": "invoices_use_credit",
          "title": "Use or pay back a credit",
          "description": "Put a customer's credit (a prepayment or an overpayment) on one of their sent invoices, like Xero's allocate credit: invoice_id, and amount (default all it can: what is left on the credit or the invoice, the smaller); the invoice records it as a payment with method credit, and its share of the credit's VAT comes back off. Or refund: true pays what is left (or amount) back to the customer, with date and method; or void: true takes back a prepayment recorded by mistake while none of it is used. Same customer and currency only. Costs $0.01 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "maxLength": 24,
                "type": ["number", "string"]
              },
              "credit": {
                "description": "The credit's number, like \"CR-0001\" (invoices_list_credits).",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "invoice_id": {
                "description": "The invoice_id invoices_create returned (quotes and credit notes have one too).",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "method": {
                "default": "bank_transfer",
                "enum": ["bank_transfer", "card", "cash", "check", "online", "other"],
                "type": "string"
              },
              "reference": {
                "maxLength": 120,
                "type": "string"
              },
              "refund": {
                "default": false,
                "type": "boolean"
              },
              "void": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["credit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
