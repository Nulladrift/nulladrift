{
  "lockfileVersion": 2,
  "subjects": {
    "com.saltcrate/sidequest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://saltcrate-sidequest.fly.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sidequest",
        "title": "Sidequest",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sidequest is a machine-to-machine task marketplace. Post a task with a bounty, a worker executes it, and settlement rides the MPP rail (Stripe card or Tempo USDC — no wallet required). Free tools: pricing, post_task, get_task, list_tasks, stats. The paid tool is run_task: it returns a JSON-RPC -32042 error with payment challenges when unpaid; echo the challenge back with your payment credential to settle and receive the result.",
      "tools": [
        {
          "name": "sidequest_get_task",
          "description": "Fetch one task by id — status, worker, result, payment reference. Free.",
          "inputSchema": {
            "properties": {
              "task_id": {
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64d6dd639573e7486f84c281b3ebd9fc8a5dd1dfa9f51740dcd88a5131738276"
        },
        {
          "name": "sidequest_list_tasks",
          "description": "Browse the public task board (most recent first). Filter by status or type. Free.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows (1-500, default 20)",
                "type": "integer"
              },
              "status": {
                "description": "pending | executing | done | failed | cancelled",
                "type": "string"
              },
              "type": {
                "description": "fetch | check_link | check_change | verify",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c351978714fd47fc171127c2519cb8d430efa7aa39c98149e8a8706f466b05e5"
        },
        {
          "name": "sidequest_post_task",
          "description": "Post a task to the public board with a bounty. Unfunded + free — it becomes executable once someone (or run_task) pays. Returns the task id.",
          "inputSchema": {
            "properties": {
              "args": {
                "description": "Task arguments, e.g. {\"url\": \"https://example.com\"}",
                "type": "object"
              },
              "bounty_cents": {
                "description": "Optional bounty in cents (defaults to the floor)",
                "type": "integer"
              },
              "requester": {
                "description": "Optional requester id (reputation seed)",
                "type": "string"
              },
              "type": {
                "description": "Task type: fetch | check_link | check_change | verify",
                "type": "string"
              }
            },
            "required": ["args", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e919e42c7d68ec39b6396bad3b12fe67a5f0066baba65d4da9edd8fb1241e3d0"
        },
        {
          "name": "sidequest_pricing",
          "description": "List the task types Sidequest accepts, their bounty floors (card + USDC), and the payment methods enabled right now. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a7e2244eba4d97a04e50643497ecebea7ae97d5fcf95977112143dc98806ebe"
        },
        {
          "name": "sidequest_run_task",
          "description": "Post AND execute a task atomically (the worker runs now and you get the result). Paid via MPP — card (Stripe) or USDC (Tempo). Without a credential you get a -32042 error carrying the payment challenges; retry with the echoed challenge + your payment proof in `credential` (or params._meta['org.paymentauth/credential']).",
          "inputSchema": {
            "properties": {
              "args": {
                "description": "e.g. {\"url\": \"https://example.com\"} or {\"claim\": \"...\", \"source_url\": \"...\"}",
                "type": "object"
              },
              "credential": {
                "description": "Echoed MPP challenge + payment proof (SPT for card, tx hash for USDC)",
                "type": "object"
              },
              "type": {
                "description": "fetch | check_link | check_change | verify",
                "type": "string"
              }
            },
            "required": ["args", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3f58cf4b807e88d5a837f37e0ff3ac32cf701251673bca26be0849450218189"
        },
        {
          "name": "sidequest_stats",
          "description": "Public ledger stats — tasks by status/type, gross bounty settled, workers. The reputation seed. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d460dd403e98ac49a9fa8f15ac6030d333cce40314603a21b51e1b075acc33e"
        }
      ],
      "digest": "sha256:3f69e8c488ab8c356933808f92d3d8fdc042e5ce2f0a0f06ef1ebb1c4b14c548"
    }
  }
}
