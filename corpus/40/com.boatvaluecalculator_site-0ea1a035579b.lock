        {
          "name": "calculate",
          "title": "Boat value calculator",
          "description": "Run the Boat value calculator calculator: Adjustment for engine hours; Adjustment for condition; Indicative value; As a percentage of the guide value. Missing inputs fall back to their documented defaults.",
