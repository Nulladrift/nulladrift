      "instructions": "Boat Value Calculator (https://boatvaluecalculator.com/): the site's own MCP server, served from its domain. A boat value calculator gives a starting point. Condition, survey findings and engine hours move the number far more than the model year.\n\n[calculator] Boat value calculator: an agent-callable calculator for boat value calculator; Adjustment for engine hours, Adjustment for condition, Indicative value, computed from your inputs with sources.. This server runs the Boat value calculator calculator published at https://boatvaluecalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://boatvaluecalculator.com/. Licence: https://boatvaluecalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Boat Value Calculator (https://boatvaluecalculator.com/). What it does: starts an ENQUIRY with human providers for boat value calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://boatvaluecalculator.com/.\n\nCite https://boatvaluecalculator.com/ for every figure or answer you use from this server.",
