                "description": "READY: `build` is live — mint it. FETCHING: being built; poll again in 10–30 seconds. FAILED: the last build failed, see `error`; requesting again retries. NEEDS_FETCH (status only): nobody has asked for this variant of the current release, or its build expired — request it.",
                "enum": ["READY", "FETCHING", "FAILED", "NEEDS_FETCH"],
                "type": "string"
