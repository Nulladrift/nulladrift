                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "description": "Result ordering. Defaults to relevance.",
                "enum": ["relevance", "installs", "name"],
                "type": "string"
              },
              "type": {
                "description": "Restrict to games or apps.",
                "enum": ["game", "app"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
