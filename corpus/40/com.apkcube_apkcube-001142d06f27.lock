      "instructions": "APKCube's Android APK catalogue. The normal path is: find a package (search_apps, or get_apps for several at once), list the builds held for it (list_versions), check what a build actually is (get_version_security), then mint a short-lived download URL for one (get_download_url). Every tool that takes an apkId treats it as optional and uses the newest build held without it. When list_versions is empty, request_fetch asks us to download the app from Google Play; poll get_fetch_status until it says READY, then list again. Before telling anyone to install something, read get_version_security and get_signing_history: an absent scan is not a clean scan, `permissions: null` means nobody read the manifest rather than that the app asks for nothing, and a replaced signing key means the build is not an update of the one already installed. Verify every download against the `sha256` the mint returns. Calls are charged in credits against the account that authorized this client: check_availability, list_categories and get_account are free; get_apps bills 1 per package; search_apps, list_versions, get_fetch_status, get_variant_status, list_developer_apps, list_chart, list_similar_apps, compare_versions cost 1 each; get_app, get_play_details, list_reviews, get_version_security, list_sdks, get_protection, list_trackers, list_permissions, get_manifest, lookup_hash, lookup_certificate, list_developer_certificates, get_signing_history cost 5 each; get_download_url, request_fetch, request_variant, get_raw_scan cost 10 each. Each result reports what it cost and what is left in _meta under 'com.apkcube/credits'; get_account reports the balance on its own when you need it before spending.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check app availability",
          "description": "Free. Whether we hold a downloadable build of each of up to 100 packages, the newest one's versionName and versionCode, and `versions`: every build we hold by versionCode and versionName, highest code first — the cheap way to check for updates before calling list_versions or get_download_url. Send every package you are checking in one call rather than looping. Each lands in one of three lists: `items` for packages we know (`available` false when we hold no build), `notFound` for ones we have never seen, and `refused` for ones we will not serve at all, with the reason a download would give.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageNames": {
                "description": "Android package ids, 1–100.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["packageNames"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "description": "Packages we know, in the order sent — `available` false when we hold no build.",
                "items": {
                  "properties": {
                    "appName": {
                      "description": "The app's display name.",
                      "type": "string"
                    },
                    "available": {
                      "description": "True when we hold at least one build you can download.",
                      "type": "boolean"
                    },
                    "latestUploadedAt": {
                      "description": "When we ingested that build, not when it was published. Null when `available` is false.",
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "latestVersionCode": {
                      "description": "Play's monotonic build number of the newest build we hold — compare on this, not on the name. Null when `available` is false.",
                      "type": ["integer", "null"]
                    },
                    "latestVersionName": {
                      "description": "Version string of the newest build we hold. Null when `available` is false.",
                      "type": ["string", "null"]
                    },
                    "packageName": {
                      "description": "The package asked about.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The app's page on this site.",
                      "type": "string"
                    },
                    "versions": {
                      "description": "Every release we hold, newest `versionCode` first, one entry per code. Empty when `available` is false.",
                      "items": {
                        "properties": {
                          "versionCode": {
                            "description": "Play's monotonic build number.",
                            "type": "integer"
                          },
                          "versionName": {
                            "description": "Human-readable version string.",
                            "type": "string"
                          }
                        },
                        "required": ["versionCode", "versionName"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["appName", "available", "latestUploadedAt", "latestVersionCode", "latestVersionName", "packageName", "url", "versions"],
                  "type": "object"
                },
                "type": "array"
              },
              "notFound": {
                "description": "Ids with no row in the catalogue.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "refused": {
                "description": "Packages we will not serve at all, with the reason a download would give.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "What a download would be refused with: APP_BLACKLISTED, APP_PAID or APP_LOW_RATED.",
                      "type": "string"
                    },
                    "message": {
                      "description": "Why, in words.",
                      "type": "string"
                    },
                    "packageName": {
                      "description": "The package refused.",
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "packageName"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items", "notFound", "refused"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check app availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:148a0690783ed659bd9934290df11bec46baa9d85f7e988a0c14690b750978ab"
        },
        {
          "name": "compare_versions",
          "title": "Compare two builds",
          "description": "What changed between two releases: permissions gained and lost, whether the signing key moved, size and minimum Android. Name either side by version name or by version code — the code is tried first, because a version name is free text the developer sets and is often a placeholder. Order does not matter; the higher build number is treated as the newer. Check `permissionsKnown` before reading two empty permission lists as 'nothing changed'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "One release, by version name or version code.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              },
              "to": {
                "description": "The other release, by version name or version code.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["from", "packageName", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "minSdk": {
                "description": "Minimum Android API level move, when both sides are known and differ.",
                "properties": {
                  "from": {
                    "type": "integer"
                  },
                  "to": {
                    "type": "integer"
                  }
                },
                "type": ["object", "null"]
              },
              "newCertShas": {
                "description": "Certificates signing the newer release but not the older one.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "noteworthy": {
                "description": "Worth a human's attention: a permission was gained, or the signer moved.",
                "type": "boolean"
              },
              "packageName": {
                "description": "The package compared.",
                "type": "string"
              },
              "permissionsAdded": {
                "items": {
                  "properties": {
                    "category": {
                      "description": "Capability family ('Location'); null for unrecognised names.",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "description": "What the app can do with it; null when unrecognised.",
                      "type": ["string", "null"]
                    },
                    "label": {
                      "description": "Readable label ('Precise location').",
                      "type": "string"
                    },
                    "name": {
                      "description": "Raw manifest name, e.g. 'android.permission.CAMERA'.",
                      "type": "string"
                    },
                    "sensitive": {
                      "description": "Android-dangerous or special-access. These are the ones worth reading.",
                      "type": "boolean"
                    },
                    "standard": {
                      "description": "Declared under Android's own namespace, not by the app or an SDK.",
                      "type": "boolean"
                    }
                  },
                  "required": ["label", "name", "sensitive"],
                  "type": "object"
                },
                "type": "array"
              },
              "permissionsKnown": {
                "description": "Both releases had their manifests read. When FALSE the permission arrays are empty because we could not look, not because nothing moved.",
                "type": "boolean"
              },
              "permissionsRemoved": {
                "items": {
                  "properties": {
                    "category": {
                      "description": "Capability family ('Location'); null for unrecognised names.",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "description": "What the app can do with it; null when unrecognised.",
                      "type": ["string", "null"]
                    },
                    "label": {
                      "description": "Readable label ('Precise location').",
                      "type": "string"
                    },
                    "name": {
                      "description": "Raw manifest name, e.g. 'android.permission.CAMERA'.",
                      "type": "string"
                    },
                    "sensitive": {
                      "description": "Android-dangerous or special-access. These are the ones worth reading.",
                      "type": "boolean"
                    },
                    "standard": {
                      "description": "Declared under Android's own namespace, not by the app or an SDK.",
                      "type": "boolean"
                    }
                  },
                  "required": ["label", "name", "sensitive"],
                  "type": "object"
                },
                "type": "array"
              },
              "previousVersion": {
                "description": "The older of the two.",
                "type": "string"
              },
              "signerChange": {
                "description": "'same', 'added', 'narrowed', 'changed' or 'replaced'; null when either side's signature was never extracted.",
                "type": ["string", "null"]
              },
              "signerChangeDetail": {
                "description": "What it means for whoever installs the build.",
                "type": ["string", "null"]
              },
              "signerChangeLabel": {
                "description": "Short reading of `signerChange`.",
                "type": ["string", "null"]
              },
              "size": {
                "description": "Byte delta for one arch present in both releases. Null when they share none — comparing across differing split sets would report a change that is only a change in what we store.",
                "properties": {
                  "arch": {
                    "type": "string"
                  },
                  "bytes": {
                    "type": "integer"
                  }
                },
                "type": ["object", "null"]
              },
              "version": {
                "description": "The newer of the two, whichever order they were asked for in.",
                "type": "string"
              }
            },
            "required": ["noteworthy", "packageName", "permissionsKnown", "previousVersion", "version"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare two builds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:caf6d7a94b60bf22436ca27122e2e5154cae71a10abfa6747a93221f323af882"
        },
