        {
          "name": "list_developer_certificates",
          "title": "List a publisher's signing keys",
          "description": "Every signing key on record for one publisher's apps — lookup_certificate read the other way round. Each key says how many of the publisher's apps it signs and, in `elsewhere`, how many packages OUTSIDE the publisher it is also on: zero is ordinary, above zero is a key shared across the publisher's accounts or somebody else's builds signed with it, and lookup_certificate on that fingerprint lists which. All keys in one answer, no pages. BOUNDED, and `note` says how: it covers the publisher's apps we have ingested and scanned. Free when we hold no signing record for any of the publisher's apps (`total: 0`). The slug comes from `developerSlug` on any app row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Publisher slug, from an app's developerSlug field.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "developer": {
                "properties": {
                  "name": {
                    "description": "Publisher name.",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The publisher's slug.",
                    "type": "string"
                  }
                },
                "required": ["name", "slug"],
                "type": "object"
              },
              "items": {
                "description": "The key on the most apps first.",
                "items": {
                  "properties": {
                    "blocked": {
                      "description": "The key is on the catalogue-wide signature blocklist.",
                      "type": "boolean"
                    },
                    "certSha256": {
                      "description": "SHA-256 fingerprint, lowercase hex with no separators — what /lookup/certificate/{fingerprint} takes.",
                      "type": "string"
                    },
                    "elsewhere": {
                      "description": "How many packages OUTSIDE this publisher the key is also on record for. Zero is the ordinary case; above zero is a key shared across publisher accounts, or somebody else's builds signed with it — the certificate lookup lists them.",
                      "type": "integer"
                    },
                    "firstSeenAt": {
                      "description": "When the key was first recorded against any of this publisher's apps, ISO 8601.",
                      "type": "string"
                    },
                    "packages": {
                      "description": "How many of this publisher's listed apps the key is on record for.",
                      "type": "integer"
                    },
                    "subject": {
                      "description": "Subject as recorded, e.g. 'CN=Example, O=Example Ltd'.",
                      "type": ["string", "null"]
                    },
                    "trusted": {
                      "description": "A moderator vouched for this key on at least one of the apps.",
                      "type": "boolean"
                    }
                  },
                  "required": ["blocked", "certSha256", "elsewhere", "firstSeenAt", "packages", "subject", "trusted"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "What this answer is drawn from and therefore what it does not cover: the signing record we keep per package, so it covers this publisher's apps we hold files for and have scanned, and `elsewhere` counts only packages we hold.",
                "type": "string"
              },
              "total": {
                "description": "Keys in `items`. Every one — not paged; a publisher has a handful.",
                "type": "integer"
              }
            },
            "required": ["developer", "items", "note", "total"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List a publisher's signing keys"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
