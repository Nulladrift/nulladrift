                    "ratings": {
                      "description": "Vote count behind `rating`. Null on rows seeded from a list scrape.",
                      "type": ["integer", "null"]
                    },
                    "type": {
                      "description": "Game or app.",
                      "enum": ["game", "app"],
                      "type": "string"
