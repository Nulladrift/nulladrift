                      "type": ["string", "null"]
                    },
                    "reply": {
                      "description": "The developer's public reply.",
                      "properties": {
                        "postedAt": {
                          "description": "ISO 8601.",
                          "type": ["string", "null"]
                        },
                        "text": {
                          "description": "Reply text.",
                          "type": "string"
                        }
                      },
                      "required": ["postedAt", "text"],
