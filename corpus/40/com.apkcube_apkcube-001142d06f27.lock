        {
          "name": "get_fetch_status",
          "title": "Check a fetch",
          "description": "Where the fetch request_fetch started stands now: FETCHING (keep waiting), READY (call list_versions), or FAILED with a reason. Free when the fetch is still running (`FETCHING`); the final answer costs 1 credit, and so does a check when no fetch was requested (`FETCH_NOT_FOUND`). When FAILED carries `terminal: true`, Google Play will not deliver this app to us and asking again will not help; otherwise request_fetch may be retried.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageName": {
