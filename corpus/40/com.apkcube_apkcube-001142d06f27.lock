        {
          "name": "get_protection",
          "title": "Check whether a build is packed",
          "description": "Whether this build is wrapped in a commercial protector — DexProtector, Jiagu, Bangcle, Legu, AppSealing, Google's own PairIP — and what that means for everything else you can find out about it. Defaults to the newest build. A PROTECTOR IS NOT A MALWARE SIGNAL: anti-piracy, anti-tamper and anti-cheat are what these are sold for, and saying an app is 'suspicious' because it is packed is wrong about a large part of the catalogue. What it does mean is that the app's real code is not in classes.dex for anyone to read, so an empty SDK list, a short permission list or any other analysis of the same artifact is a floor and not a census — call this BEFORE you report that a build carries no trackers. `analyzed: false` means the archive was never opened, which is not the same as an unpacked build. Relay `summary` whole: it carries the finding and the bound in one sentence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analyzed": {
                "description": "Was the artifact ever opened? FALSE means every field below is a default and none of them is a finding.",
                "type": "boolean"
              },
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "capped": {
                "description": "Evidence tiers that hit their size cap while the artifact was being read, so the analysis worked from a subset of what the file carries. The one bound no later corpus can repair — fixing it needs the bytes back.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "codeCoverage": {
                "description": "How far the analysis reached into the app's OWN code: none — only the manifest and bundled libraries were read; partial — the code was read but not through; full — read through. Only 'full' makes an empty result mean anything close to 'none'.",
                "enum": ["none", "partial", "full"],
                "type": "string"
              },
              "dex": {
                "description": "How much code was read, when any was: read of total dex files, bytes, and truncated (one file ran out of budget part-way). NULL when none was read.",
                "type": ["object", "null"]
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "pairip": {
                "description": "Google PairIP licence protection specifically. Beyond packing, it checks the app's licence at run time, so a plain sideload of the file may refuse to run.",
                "type": "boolean"
              },
              "protected": {
                "description": "At least one commercial protector was identified. FALSE with analyzed:false above it means nobody looked — not that the build is unpacked.",
                "type": "boolean"
              },
              "protectors": {
                "description": "What was identified. NOT a malware signal — anti-piracy and anti-tamper are what these are sold for, Google's own PairIP included. What it does mean is that the app's real code is not in classes.dex for anyone to read.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Engine id — 'pairip', 'jiagu', 'dexprotector', 'bangcle', 'legu', … Branch on this.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Product name, or the id itself for one this deployment cannot name yet.",
                      "type": "string"
                    },
                    "vendor": {
                      "description": "Who publishes it. Null rather than guessed for an unknown id.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "name", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "One sentence carrying both halves — what was found, and what it bounds. Relay it whole: 'packed with Jiagu' on its own turns a build-tool choice into an accusation, and the second clause is the part a reader can act on.",
                "type": "string"
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              }
            },
            "required": ["analyzed", "apkId", "codeCoverage", "packageName", "pairip", "protected", "protectors", "summary", "versionCode", "versionName"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether a build is packed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7366b6398ba798201072e3cfdd7e40946d078e131d6d71405b82f8ef024bdc78"
        },
        {
          "name": "get_raw_scan",
          "title": "Read the stored scan record verbatim",
          "description": "The whole stored analysis record for one build, exactly as stored and with none of our rules applied — for when you want to judge the facts yourself rather than read our conclusions. It carries two things no other tool publishes: the EVIDENCE DIGEST every SDK match is drawn from (dex package prefixes, manifest component names, intent actions, how much code was read), so you can match it against your own corpus; and each signing certificate's serial and signature algorithm. Also the raw VirusTotal counters and every flagging vendor. Prefer the narrower tools when you want an answer — get_version_security, get_protection, list_trackers, list_permissions, get_manifest — and reach for this when you want the inputs. A build nobody has scanned is `scanned: false`, which is not a clean result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "certs": {
                "description": "Every signer certificate found, with the full X.509 detail — including the serial and the certificate's own signature algorithm, which the projected signer shape does not carry. Empty on scans that predate multi-signature support; read `signature` below for those.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "evidence": {
                "description": "What the scan SAW, with no judgement in it: dex package prefixes truncated at `depth`, manifest component class names, intent actions, how much code was read, and which tiers were capped. Every SDK match on this surface is drawn from this — published so you can run your own corpus against it instead of ours. NULL = scanned before the digest existed, or unreadable.",
                "type": ["object", "null"]
              },
              "evidenceVersion": {
                "description": "Which digest schema produced `evidence`.",
                "type": ["integer", "null"]
              },
              "manifest": {
                "description": "The manifest facts as stored. Same object the manifest endpoint publishes.",
                "type": ["object", "null"]
              },
              "md5": {
                "description": "MD5 of the same artifact. An identifier for matching a published IOC, never an integrity check.",
                "type": ["string", "null"]
              },
              "natives": {
                "description": "The native inventory as stored: abis, libs, protectors.",
                "type": ["object", "null"]
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "pairip": {
                "description": "Google PairIP detected. NULL = not reported by the engine that scanned this.",
                "type": ["boolean", "null"]
              },
              "permissions": {
                "description": "Raw manifest permission names, unlabelled and in the manifest's own order. NULL = the manifest was never read; [] = it declares none.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "scanned": {
                "description": "A scan record exists. FALSE and everything below is null or empty — none of which means clean.",
                "type": "boolean"
              },
              "scannedAt": {
                "description": "ISO 8601.",
                "type": ["string", "null"]
              },
              "sha1": {
                "description": "SHA-1 of the same artifact, ours where we computed one, else VirusTotal's.",
                "type": ["string", "null"]
              },
              "sha256": {
                "description": "The artifact's SHA-256, from the version row — the bytes a download serves.",
                "type": "string"
              },
              "signature": {
                "description": "The legacy single-signer columns, kept because scans predating multi-signature support have these and an empty `certs`.",
                "properties": {
                  "certMatch": {
                    "description": "'trusted' | 'known' | 'first-seen' | 'mismatch'.",
                    "type": ["string", "null"]
                  },
                  "certSha256": {
                    "description": "Primary certificate fingerprint.",
                    "type": ["string", "null"]
                  },
                  "certSubject": {
                    "description": "Its subject.",
                    "type": ["string", "null"]
                  },
                  "scheme": {
                    "description": "'v2' | 'v3' | 'v3.1'.",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "How signature extraction ended.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["certMatch", "certSha256", "certSubject", "scheme", "status"],
                "type": "object"
              },
              "status": {
                "description": "Queue state of the record: PENDING | ACTIVE | COMPLETED | FAILED. Only COMPLETED is a finished analysis; FAILED is one that will not finish, and its stored facts are whatever completed before it stopped.",
                "type": ["string", "null"]
              },
              "verdict": {
                "description": "Our classification, as stored: verified | secure | caution | dangerous | unverified | pending.",
                "type": ["string", "null"]
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              },
              "virusTotal": {
                "description": "The counters verbatim, every vendor that flagged the file, and the submission context. found:false means VirusTotal had no report for this hash, which is not a clean result.",
                "properties": {
                  "flagged": {
                    "description": "Each flagging vendor, its category and its own label for the detection.",
                    "items": {
                      "properties": {
                        "category": {
                          "description": "'malicious' | 'suspicious'.",
                          "type": "string"
                        },
                        "result": {
                          "description": "The vendor's detection label.",
                          "type": ["string", "null"]
                        },
                        "vendor": {
                          "description": "Vendor name.",
                          "type": "string"
                        }
                      },
                      "required": ["category", "vendor"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "found": {
                    "description": "VirusTotal had a report for this hash.",
                    "type": ["boolean", "null"]
                  },
                  "harmless": {
                    "description": "Vendors calling it harmless.",
                    "type": ["integer", "null"]
                  },
                  "malicious": {
                    "description": "Vendors calling it malicious.",
                    "type": ["integer", "null"]
                  },
                  "meta": {
                    "description": "firstSeen, timesSubmitted, reputation, threatLabel, threatCategories, yaraRules, sandboxVerdicts. Null for a verdict that came from a fresh upload — that path polls an analysis object, which has no submission history.",
                    "type": ["object", "null"]
                  },
                  "scanDate": {
                    "description": "ISO 8601.",
                    "type": ["string", "null"]
                  },
                  "suspicious": {
                    "description": "Vendors calling it suspicious.",
                    "type": ["integer", "null"]
                  },
                  "total": {
                    "description": "Vendors that ran.",
                    "type": ["integer", "null"]
                  },
                  "undetected": {
                    "description": "Vendors with no detection.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["flagged", "found", "meta"],
                "type": "object"
              }
            },
            "required": ["apkId", "certs", "evidence", "manifest", "natives", "packageName", "permissions", "scanned", "sha256", "signature", "versionCode", "versionName", "virusTotal"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read the stored scan record verbatim"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ad7fafc06a4b3a86ac8bbe8df056554874adcfb71e2f223a38fabfc28cc6bf1"
        },
        {
          "name": "get_signing_history",
          "title": "Trace the signing key",
          "description": "Which certificate signed which releases of a package, and where the key moved. Android will only install an update signed by the key that signed what is already on the device, so a `hasKeyReplacement: true` means the newer build is not an update of the older one — it is a different app under the same package name, which is what a repackaged app looks like. `unreadVersions` lists releases whose signature we never read; those are gaps, not agreement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "eras": {
                "description": "Newest era first.",
                "items": {
                  "properties": {
                    "certShas": {
                      "description": "The signer set.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "firstSeen": {
                      "description": "Oldest upload in the era, ISO 8601.",
                      "type": "string"
                    },
                    "lastSeen": {
                      "description": "Newest upload in the era, ISO 8601.",
                      "type": "string"
                    },
                    "transition": {
                      "description": "How this era's keys relate to the era BEFORE it: 'same', 'added', 'narrowed', 'changed' or 'replaced'. Null on the oldest era. 'replaced' — no key in common — is the one that matters.",
                      "type": ["string", "null"]
                    },
                    "versions": {
                      "description": "Version names in this era, newest first.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["certShas", "versions"],
                  "type": "object"
                },
                "type": "array"
              },
              "hasKeyReplacement": {
                "description": "At least one era shares no key with the era before it. Android will not install such a build over the existing app, and a key that changed without a rotation is the strongest repackaging signal there is.",
                "type": "boolean"
              },
              "packageName": {
                "description": "The package this timeline covers.",
                "type": "string"
              },
              "signers": {
                "description": "Certificates on record for the package.",
                "items": {
                  "properties": {
                    "addedVia": {
                      "description": "'scan' (trust on first use), 'google-play' or 'admin'.",
                      "type": "string"
                    },
                    "firstSeenAt": {
                      "description": "ISO 8601.",
                      "type": "string"
                    },
                    "inArchive": {
                      "description": "This certificate signs a release we actually hold.",
                      "type": "boolean"
                    },
                    "sha256": {
                      "type": "string"
                    },
                    "subject": {
                      "type": ["string", "null"]
                    },
                    "trusted": {
                      "description": "Escalated above plain first-use by a moderator.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "One sentence naming what the timeline shows.",
                "type": "string"
              },
              "unreadVersions": {
                "description": "Releases whose signing block was never read. A gap in coverage, published as a gap so it is not mistaken for agreement.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["eras", "hasKeyReplacement", "packageName", "summary", "unreadVersions"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Trace the signing key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3c84182b3fbb1345ce84c0be76ff733187bc51416da0f9a489dff34df43416d"
        },
        {
          "name": "get_variant_status",
          "title": "Check a variant build",
          "description": "Where one variant of an app stands: READY with the build (its `variantId` goes to get_download_url), FETCHING (keep waiting, 10–30 seconds between checks), FAILED with a reason (request_variant retries), or NEEDS_FETCH (nobody has asked for it, or it expired — call request_variant). Free when the build is still running (`FETCHING`); any other answer costs 1 credit, including when nobody has requested that variant (`NEEDS_FETCH`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              },
              "variant": {
                "description": "Which build: `<arch>[+all-langs][@sdkNN|@vcN]` with arch one of arm64-v8a, armeabi-v7a, universal, or `device:<slug>[+all-langs]`. Plain `arm64-v8a` is the ordinary build and not a variant. `+all-langs` carries every language Google Play has rather than the standard 24; armeabi-v7a is the 32-bit ARM build; universal is both ARM ABIs in one bundle; `@sdkNN` (NN one of 37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26, 25, 24) asks for the newest build that runs on that Android version; `@vcN` asks for one exact build by its versionCode (not combined with `@sdkNN`; refused with UNLIKELY_VERSION when N is not written like this app's build numbers); `device:<slug>` is exactly what Play serves that device and takes neither pin. Device slugs: pixel-9a, galaxy-s25-ultra, nothing-phone-1, samsung-f34-5g, samsung-s20-plus, samsung-a13-5g, redmi-note-12-4g, xiaomi-11-lite-5g-ne, poco-f1, oneplus-8-pro, huawei-mate-20, xperia-5, oppo-r17, xiaomi-mi-a1, redmi-7, realme-5i, nokia-1-3, realme-5-pro, samsung-j5-prime, pixel-9-pro-fold, pixel-tablet, shield-tv, bravia-vu2, bravia-vh22, pixel-watch-3, hp-googlebook-14, play-games-pc. Examples: `armeabi-v7a`, `universal+all-langs`, `arm64-v8a@sdk28`, `arm64-v8a@vc1234`, `device:pixel-9a`.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["packageName", "variant"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "build": {
                "properties": {
                  "arch": {
                    "description": "ABIs the bundle carries code for, `+`-joined for universal.",
                    "type": "string"
                  },
                  "expiresAt": {
                    "description": "When the build is deleted. Mint before then; afterwards, request it again.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "fileSize": {
                    "description": "Bytes.",
                    "type": "integer"
                  },
                  "format": {
                    "description": "'apk', 'xapk' or 'apks'.",
                    "type": "string"
                  },
                  "minSdk": {
                    "description": "Minimum Android API level.",
                    "type": "integer"
                  },
                  "sha256": {
                    "description": "SHA-256 of the file, lowercase hex.",
                    "type": "string"
                  },
                  "variant": {
                    "description": "The variant name this build answers.",
                    "type": "string"
