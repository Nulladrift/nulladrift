                    "sha256": {
                      "description": "SHA-256 of the file as the ingesting engine reported it, lowercase hex. Check your download against it to catch truncation or corruption in transit; it is our record of the upload rather than a digest recomputed over the stored object.",
                      "type": "string"
                    },
