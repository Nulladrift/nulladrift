                    "developerSlug": {
                      "description": "Key for the developer lookup. Null when the row has no publisher.",
                      "type": ["string", "null"]
                    },
                    "hasFiles": {
                      "description": "We hold at least one downloadable file. Check before spending a download.",
                      "type": "boolean"
                    },
                    "iconUrl": {
                      "description": "Store artwork URL.",
                      "type": ["string", "null"]
                    },
                    "installs": {
                      "description": "Google Play's install BUCKET, verbatim ('10,000,000+'). A string, not a number — Play publishes no exact count. Null when the app is not on Google Play.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "App title.",
                      "type": "string"
                    },
                    "onGooglePlay": {
                      "description": "False for an app its developer published on this site directly, with no Google Play listing: the Play fields are then null and the Play listing call answers 404.",
                      "type": "boolean"
                    },
                    "packageName": {
                      "description": "Android package id — the identifier every app call takes.",
                      "type": "string"
                    },
                    "rating": {
                      "description": "Play star rating, 0–5. Null when the app is not on Google Play, or when Play gave it no rating.",
                      "type": ["number", "null"]
