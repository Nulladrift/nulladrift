                "type": ["string", "null"]
              },
              "packageName": {
                "description": "The package these builds belong to.",
                "type": "string"
              },
              "versions": {
                "items": {
                  "properties": {
                    "apkId": {
                      "description": "Pass this to the download call.",
                      "type": "string"
                    },
                    "arch": {
                      "description": "'universal', 'arm64-v8a', …",
                      "type": "string"
                    },
                    "changelog": {
                      "description": "Release notes for this build.",
                      "type": ["string", "null"]
                    },
                    "fileSize": {
                      "description": "Bytes.",
                      "type": "integer"
                    },
                    "formFactor": {
                      "description": "The device this build is made for ('tv', 'wear', 'desktop', 'automotive' and so on), or null for the phone build. While a package has a phone build, it is always the latest.",
                      "type": ["string", "null"]
                    },
                    "format": {
                      "description": "'apk', 'xapk' or 'apks'. An xapk/apks is a ZIP of split APKs plus assets — not directly `adb install`-able.",
                      "type": "string"
                    },
                    "isLatest": {
                      "description": "Newest build we hold for this package: its phone build, when it has one.",
                      "type": "boolean"
                    },
                    "minSdk": {
                      "description": "Minimum Android API level.",
                      "type": "integer"
