                },
                "type": "array"
              }
            },
            "required": ["appName", "packageName", "versions"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List downloadable versions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
