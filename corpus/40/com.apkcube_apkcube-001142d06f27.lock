                    "text": {
                      "description": "The review.",
                      "type": ["string", "null"]
                    },
                    "thumbsUp": {
                      "description": "'Helpful' votes.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Link to the review on the store.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "reply", "score", "text", "thumbsUp"],
                  "type": "object"
                },
                "type": "array"
              },
              "lang": {
                "description": "Language the reviews were read in.",
                "type": "string"
              },
              "nextCursor": {
                "description": "Pass back as `cursor` for the next page, with the same sort, num and storefront. Null at the end.",
                "type": ["string", "null"]
              },
              "packageName": {
                "description": "The package.",
                "type": "string"
              },
              "sort": {
                "description": "Order of `items`.",
                "enum": ["newest", "rating", "helpfulness"],
                "type": "string"
              }
            },
            "required": ["country", "fetchedAt", "items", "lang", "nextCursor", "packageName", "sort"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Google Play reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
