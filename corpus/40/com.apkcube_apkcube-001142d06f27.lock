        {
          "name": "get_version_security",
          "title": "Check a build's integrity",
          "description": "What one build actually IS: its SHA-256, the anti-malware verdict, the certificates that signed it, and every Android permission it declares with a plain-English gloss. Defaults to the newest build, so you do not need list_versions first. `findings` is the part to read first: it applies our rules to the manifest and native facts on the same response and names what they imply — a debuggable build, a version that disagrees with the listing, cleartext traffic, components any app on the device can start, a packer. Two severities, `warning` and `notice`, and NEITHER is a verdict; an empty `findings` is not an all-clear, because a manifest nobody read produces no findings either. Read this BEFORE recommending an install, and read the nulls carefully — `scanned: false` and `virusTotal: null` mean nobody has looked, which is not the same as clean, and `permissions: null` means the manifest was never read, which is not the same as an app that asks for nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "findings": {
                "description": "What manifest and natives already imply, read for a caller who should not have to know Android to notice it. EMPTY IS NOT AN ALL-CLEAR: absence is never a finding, so an empty array also covers the case where the manifest was never read — manifest: null beside it is how you tell those apart. Warnings first.",
                "items": {
                  "properties": {
                    "detail": {
                      "description": "One sentence: what it means and what it does not, with the specifics where there are any. Both halves matter — every one of these is ordinary in some app shipping today, and relaying only the first clause turns a fact into an accusation.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable machine-readable id: debuggable | version-mismatch | cleartext-traffic | backup-allowed | shared-user-id | exported-components | legacy-permission-model | packed. Branch on this, not on the prose.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "warning — this file is not what a release build of this app should look like (a debuggable build, or a version that disagrees with the listing). notice — true, worth knowing, and routinely a deliberate choice of an ordinary app. Neither is a verdict: the anti-malware verdict is a separate field and a finding never moves it.",
                      "enum": ["warning", "notice"],
                      "type": "string"
                    },
                    "title": {
                      "description": "Short label.",
                      "type": "string"
                    }
                  },
                  "required": ["detail", "id", "severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "manifest": {
                "description": "What the artifact's own AndroidManifest.xml declares beyond the permissions it requests: targetSdk, compileSdk, debuggable, usesCleartextTraffic, allowBackup, sharedUserId, installLocation, the permissions it DEFINES, uses-feature, uses-library, components exported without a permission guard, and its own versionCode/versionName. NULL means nobody read the manifest. A key ABSENT inside the object means the manifest does not declare that attribute — never that it declares the platform default. Its versionCode against the versionCode above is the only check there is on what the store claimed: they disagreeing means the file is not the build the listing describes.",
                "type": ["object", "null"]
              },
              "md5": {
                "description": "MD5 of the artifact, computed at ingest. Null on builds ingested before it was computed — never a claim the file has no MD5.",
                "type": ["string", "null"]
              },
              "natives": {
                "description": "Native libraries the artifact ships: abis, libs (name, largest uncompressed size, the ABIs carrying it) and protectors. NULL means the archive's directory could not be read; empty lists are the factual 'ships no native libraries', which is ordinary for a split bundle's base APK. A protector is NOT a malware signal — anti-piracy and anti-tamper are what they are sold for — but it does mean the app's own code was not open to inspection, so treat other analysis of the same artifact as partial.",
                "type": ["object", "null"]
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "pairip": {
                "description": "Google PairIP licence protection, which breaks a plain sideload. The same signal reaches natives.protectors as the id 'pairip' when the native walk ran; this field is the scan's own boolean and answers even when natives is null.",
                "type": "boolean"
              },
              "permissionSummary": {
                "description": "'24 declared · 5 sensitive'. Null whenever `permissions` is.",
                "type": ["string", "null"]
              },
              "permissions": {
                "description": "NULL means the manifest was never read — not that the app declares none. An empty array is the genuine 'declares none'.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Capability family ('Location'); null for unrecognised names.",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "description": "What the app can do with it; null when unrecognised.",
                      "type": ["string", "null"]
                    },
                    "label": {
                      "description": "Readable label ('Precise location').",
                      "type": "string"
                    },
                    "name": {
                      "description": "Raw manifest name, e.g. 'android.permission.CAMERA'.",
                      "type": "string"
                    },
                    "sensitive": {
                      "description": "Android-dangerous or special-access. These are the ones worth reading.",
                      "type": "boolean"
                    },
                    "standard": {
                      "description": "Declared under Android's own namespace, not by the app or an SDK.",
                      "type": "boolean"
                    }
                  },
                  "required": ["label", "name", "sensitive"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "scanned": {
                "description": "Something has analysed this artifact. When false, every field below is null or zero and NONE of it means 'clean'.",
                "type": "boolean"
              },
              "scannedAt": {
                "description": "When the analysis ran, ISO 8601.",
                "type": ["string", "null"]
              },
              "sha1": {
                "description": "SHA-1 of the artifact, when one was reported. Computed at ingest where available, else taken from the VirusTotal report. An identifier for matching a published IOC — sha256 is the integrity check.",
                "type": ["string", "null"]
              },
              "sha256": {
                "description": "SHA-256 of the artifact. The same value the version list and the download call publish.",
                "type": "string"
              },
              "signature": {
                "description": "Signature validation. Null when that stage did not run.",
                "properties": {
                  "blocked": {
                    "description": "Signed with a key on the catalogue-wide blocklist. The download is refused whatever the anti-malware result said.",
                    "type": "boolean"
                  },
                  "certs": {
                    "items": {
                      "properties": {
                        "debugKey": {
                          "description": "Signed with the Android SDK's debug key, whose private half is on every machine that built the app. A release signed this way is a leak, a rebuild or a repack, and cannot install over the real app. Equals findings.includes('debug-key').",
                          "type": "boolean"
                        },
                        "findings": {
                          "description": "What is wrong with this certificate, from its own facts: 'debug-key', 'weak-key' (RSA/DSA modulus under 2048 bits), 'weak-signature-algorithm' (signed with MD5 or SHA-1). Empty is NOT an all-clear — a certificate we could not fully parse also yields none. Judges the key and its algorithm, never its dates: Android pins the key, so expiry is reported as context in validUntil, not as a finding.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "issuer": {
                          "description": "Issuer CN/O. Equal to the subject for a self-signed key, which is every Android signing key.",
                          "type": ["string", "null"]
                        },
                        "keyAlgorithm": {
                          "description": "'RSA', 'EC P-256', …",
                          "type": ["string", "null"]
                        },
                        "keySize": {
                          "description": "Key size in bits.",
                          "type": ["integer", "null"]
                        },
                        "match": {
                          "description": "Against our record for this package: 'trusted', 'known', 'first-seen' or 'mismatch'.",
                          "type": ["string", "null"]
                        },
                        "scheme": {
                          "description": "Signature scheme it was found under: 'v2', 'v3' or 'v3.1'.",
                          "type": ["string", "null"]
                        },
                        "sha1": {
                          "description": "SHA-1 of the same certificate, when the scan reported one. Not derivable from the SHA-256.",
                          "type": ["string", "null"]
                        },
                        "sha256": {
                          "description": "SHA-256 fingerprint of the DER certificate — the value that identifies a signing key.",
                          "type": "string"
                        },
                        "subject": {
                          "description": "Subject CN/O.",
                          "type": ["string", "null"]
                        },
                        "validFrom": {
                          "description": "ISO 8601. Android pins the key and not its dates, so this is context, never a verdict.",
                          "type": ["string", "null"]
                        },
                        "validUntil": {
                          "description": "ISO 8601.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["debugKey", "findings", "sha256"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "knownSignatures": {
                    "description": "Certificates on record for this package. More than one means an update only installs over a matching signature.",
                    "type": "integer"
                  },
                  "match": {
                    "description": "Best match across every signer certificate found.",
                    "type": ["string", "null"]
                  },
                  "scheme": {
                    "description": "APK Signature Scheme found.",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "Validation outcome.",
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "verdict": {
                "description": "Our overall reading of the artifact.",
                "enum": ["verified", "secure", "caution", "dangerous", "unverified"],
                "type": "string"
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              },
              "virusTotal": {
                "description": "Anti-malware analysis for this hash. NULL means nobody has looked — only a non-null object with flagged: 0 is an all-clear.",
                "properties": {
                  "flagged": {
                    "description": "Vendors that called the file malicious or suspicious.",
                    "type": "integer"
                  },
                  "flaggedBy": {
                    "description": "Which vendors flagged it, and as what.",
                    "items": {
                      "properties": {
                        "category": {
                          "type": "string"
                        },
                        "result": {
                          "type": ["string", "null"]
                        },
                        "vendor": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "meta": {
                    "description": "What VirusTotal knows that we cannot derive: threatLabel (a NAME for what the vendors are counting), threatCategories, firstSeen and timesSubmitted (submission history), reputation, yaraRules, sandboxVerdicts. Fields are absent when the report did not carry them; the object is null for a verdict that came from a fresh upload, which sees an analysis with no history. A recent firstSeen with a low timesSubmitted is the repackage shape, and is only meaningful NEXT TO A DETECTION — on release day every legitimate build looks the same.",
                    "type": ["object", "null"]
                  },
                  "vendors": {
                    "description": "Vendors that returned a result.",
                    "type": "integer"
                  }
                },
                "type": ["object", "null"]
              }
            },
            "required": ["apkId", "packageName", "scanned", "sha256", "verdict", "versionCode", "versionName"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a build's integrity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c5ce138828f939c30321efc33ffa245711427868ebdf2f355da65e29a93a0d8f"
