        },
        {
          "name": "lookup_certificate",
          "title": "Find what a signing key signs",
          "description": "Every package we hold that one signing certificate is on record for. Android only installs an update signed by the key that signed what is already on the device, which makes the signing key the closest thing an app has to an identity across package names — so a key you found on one repackaged app is worth asking about, because it has usually signed others. Takes the SHA-256 fingerprint of the DER certificate (64 hex, colons and case fine). A SHA-1 IS REFUSED, free, with the reason: the record stores one fingerprint per certificate and a SHA-1 cannot be resolved to it — get the SHA-256 (keytool prints both). BOUNDED, and `note` says how: it covers packages we have ingested and scanned, never every app the key has signed, so it is free when we hold nothing signed by the key (`total: 0`), which is not to say the key signs nothing; charged even when every package the key signed has been removed (an empty `items`). `blocked: true` means the key is on our catalogue-wide blocklist and nothing it signed can be downloaded here. Taken-down packages are counted in `blockedCount` and not listed, so a page may be shorter than `perPage`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fingerprint": {
                "description": "SHA-256 fingerprint of the signing certificate, 64 hex characters, with or without colons.",
                "type": "string"
              },
              "page": {
                "description": "1-based page. Defaults to 1.",
                "minimum": 1,
                "type": "integer"
              },
              "per": {
                "description": "Rows per page, 1–96. Defaults to 24.",
                "maximum": 96,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["fingerprint"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "algorithm": {
                "description": "Always sha256. The per-package signing record stores that one fingerprint, and a SHA-1 cannot be resolved to it — sending one is refused with that reason, free.",
                "enum": ["sha256"],
                "type": "string"
              },
              "blocked": {
                "description": "This key is on the catalogue-wide signature blocklist: a download of anything it signed is refused whatever the anti-malware result said.",
                "type": "boolean"
              },
              "blockedCount": {
                "description": "Packages this key is on record for that are taken down. Counted across the whole key, not this page, and withheld from `items` — a lookup is not a way to read back what has been removed.",
                "type": "integer"
              },
              "fingerprint": {
                "description": "The fingerprint as matched: lowercase hex, no separators.",
                "type": "string"
              },
              "items": {
                "description": "Newest record first.",
                "items": {
                  "properties": {
                    "addedVia": {
                      "description": "How the record was made: 'scan' (trust on first use), 'google-play' or 'admin'.",
                      "type": "string"
                    },
                    "appName": {
                      "description": "Its title. Null where we hold a signing record for a package whose catalogue row is gone.",
                      "type": ["string", "null"]
                    },
                    "firstSeenAt": {
                      "description": "When this key was first recorded against this package, ISO 8601.",
                      "type": "string"
                    },
                    "packageName": {
                      "description": "Android package id.",
                      "type": "string"
                    },
                    "trusted": {
                      "description": "A moderator vouched for this key on this package, above plain first use.",
                      "type": "boolean"
                    }
                  },
                  "required": ["addedVia", "appName", "firstSeenAt", "packageName", "trusted"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "What this answer is drawn from and therefore what it does not cover: the signing record we keep per package, so it covers packages we hold files for and have scanned — never every app the key has signed. A page can also be short, because withheld packages are removed after paging.",
                "type": "string"
              },
              "page": {
                "description": "1-based page number of this result.",
                "type": "integer"
              },
              "perPage": {
                "description": "Rows per page.",
                "type": "integer"
              },
              "subject": {
                "description": "Subject as recorded, e.g. 'CN=Example, O=Example Ltd'.",
                "type": ["string", "null"]
              },
              "total": {
                "description": "Total matching rows across all pages.",
                "type": "integer"
              },
              "totalPages": {
                "description": "Number of pages available.",
                "type": "integer"
              }
            },
            "required": ["algorithm", "blocked", "blockedCount", "fingerprint", "items", "note", "page", "perPage", "subject", "total", "totalPages"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find what a signing key signs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d723985840e6598fa55e7ae4c6b8ea02ae9a0b449d70edb5cd630035d50603d8"
        },
        {
          "name": "lookup_hash",
          "title": "Identify a file by its checksum",
          "description": "Which app and which build a file checksum names. Use this when you have a hash and no package name — an APK pulled off a device, a sample from a threat feed, a digest in an incident report. Takes an MD5 (32 hex), SHA-1 (40) or SHA-256 (64) and works out which from the length, so do not try to label it; colons, spaces and upper case are fine and are normalised. A miss is a real answer, not an error, and it is free when nothing matches (`found: false`): we hold no build with that checksum, and says nothing about whether the file exists elsewhere. READ `note`: only SHA-256 is carried by every stored build, so a SHA-1 or MD5 miss can mean we hold the file and never computed that digest for it — re-check with the SHA-256 if you have it. Once you have the packageName and apkId, the per-build tools will tell you what the file is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "An MD5, SHA-1 or SHA-256 hex digest of the file. The algorithm is taken from its length.",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "algorithm": {
                "description": "Inferred from the value's own length. Not a parameter you send.",
                "enum": ["md5", "sha1", "sha256"],
                "type": "string"
              },
              "found": {
                "description": "We hold a build with this checksum. FALSE is a complete answer and a 200 — it says nothing about whether the file exists anywhere else.",
                "type": "boolean"
              },
              "hash": {
                "description": "The hash as matched: lowercase hex, separators stripped.",
                "type": "string"
              },
              "match": {
                "description": "The build, when found: packageName, appName, apkId (the id every per-build call takes), versionName, versionCode, arch, format, fileSize in bytes, sha256, isLatest and uploadedAt.",
                "type": ["object", "null"]
              },
              "note": {
                "description": "What a miss does and does not prove for THIS algorithm. Only SHA-256 is carried by every stored build, so a SHA-1 or MD5 miss can mean we hold the file and never computed that digest for it.",
                "type": "string"
              }
            },
            "required": ["algorithm", "found", "hash", "match", "note"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Identify a file by its checksum"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6ea30a1745c5b4cfc5e785013f2bb363be58ff0a6c8edf0d2f71711d99710985"
        },
        {
          "name": "request_fetch",
          "title": "Fetch a missing app",
          "description": "Ask us to download an app from Google Play when list_versions came back empty. Costs 10 credits, even when we already have builds (`READY`) or Google Play doesn't list the app — so call list_versions first. Free only when a fetch for the app is already running (`FETCHING`). A fetch usually takes a few minutes. Poll get_fetch_status every 10–30 seconds — not this tool — and call list_versions once it says READY. Paid apps and apps Google Play will not deliver to us are refused with the reason. An app not in the catalogue yet is looked up on Google Play live, for up to 20 seconds; UPSTREAM_UNAVAILABLE / UPSTREAM_BUSY then is refunded and means Play did not answer in time, not that the app does not exist — retry after a few seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "FAILED only: why, in words safe to show a person.",
                "type": "string"
              },
              "packageName": {
                "description": "The package this fetch is for.",
                "type": "string"
              },
              "status": {
                "description": "READY: we hold builds — list the versions. FETCHING: a job is queued or running; poll again in a few seconds. FAILED: the last job failed; see `error`.",
                "enum": ["READY", "FETCHING", "FAILED"],
                "type": "string"
              },
              "terminal": {
                "description": "FAILED only, and present only when retrying cannot help: Google Play will not deliver this app to us. Absent means another fetch request may succeed.",
                "type": "boolean"
              },
              "updatedAt": {
                "description": "Status read only: when the job last moved.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["packageName", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Fetch a missing app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8c51ee665f959cef9c787880b368886a45543cd357e3d097b0b98e97e8118f4"
        },
        {
          "name": "request_variant",
          "title": "Request a variant build",
          "description": "Ask for an on-demand build of an app's newest release that the ordinary download does not carry: every language (`+all-langs`), the 32-bit ARM build (`armeabi-v7a`), both ARM ABIs in one bundle (`universal`), the newest build for an older Android version (`@sdkNN`), or exactly what one real device gets (`device:<slug>`). We must already hold the ordinary build — call list_versions first, and request_fetch if it is empty. Costs 10 credits, even when the variant is already built (`READY`); free only when a build of that variant is already running (`FETCHING`). A build usually takes a few minutes: poll get_variant_status, not this tool, then pass its `variantId` to get_download_url. Builds are temporary — see `expiresAt`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              },
              "variant": {
                "description": "Which build: `<arch>[+all-langs][@sdkNN|@vcN]` with arch one of arm64-v8a, armeabi-v7a, universal, or `device:<slug>[+all-langs]`. Plain `arm64-v8a` is the ordinary build and not a variant. `+all-langs` carries every language Google Play has rather than the standard 24; armeabi-v7a is the 32-bit ARM build; universal is both ARM ABIs in one bundle; `@sdkNN` (NN one of 37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26, 25, 24) asks for the newest build that runs on that Android version; `@vcN` asks for one exact build by its versionCode (not combined with `@sdkNN`; refused with UNLIKELY_VERSION when N is not written like this app's build numbers); `device:<slug>` is exactly what Play serves that device and takes neither pin. Device slugs: pixel-9a, galaxy-s25-ultra, nothing-phone-1, samsung-f34-5g, samsung-s20-plus, samsung-a13-5g, redmi-note-12-4g, xiaomi-11-lite-5g-ne, poco-f1, oneplus-8-pro, huawei-mate-20, xperia-5, oppo-r17, xiaomi-mi-a1, redmi-7, realme-5i, nokia-1-3, realme-5-pro, samsung-j5-prime, pixel-9-pro-fold, pixel-tablet, shield-tv, bravia-vu2, bravia-vh22, pixel-watch-3, hp-googlebook-14, play-games-pc. Examples: `armeabi-v7a`, `universal+all-langs`, `arm64-v8a@sdk28`, `arm64-v8a@vc1234`, `device:pixel-9a`.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["packageName", "variant"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "build": {
                "properties": {
                  "arch": {
                    "description": "ABIs the bundle carries code for, `+`-joined for universal.",
                    "type": "string"
                  },
                  "expiresAt": {
                    "description": "When the build is deleted. Mint before then; afterwards, request it again.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "fileSize": {
                    "description": "Bytes.",
                    "type": "integer"
                  },
                  "format": {
                    "description": "'apk', 'xapk' or 'apks'.",
                    "type": "string"
                  },
                  "minSdk": {
                    "description": "Minimum Android API level.",
                    "type": "integer"
                  },
                  "sha256": {
                    "description": "SHA-256 of the file, lowercase hex.",
                    "type": "string"
                  },
                  "variant": {
                    "description": "The variant name this build answers.",
                    "type": "string"
                  },
                  "variantId": {
                    "description": "Pass to the download call as `variantId`, beside the ordinary build's `apkId`.",
                    "type": "string"
                  },
                  "versionCode": {
                    "description": "Build number. Usually the newest release; older for an `@sdkNN` or device pin when that is what Play serves such a device.",
                    "type": "integer"
                  },
                  "versionName": {
                    "description": "Version string of the build.",
                    "type": "string"
                  }
                },
                "required": ["arch", "expiresAt", "fileSize", "format", "minSdk", "sha256", "variant", "variantId", "versionCode", "versionName"],
                "type": "object"
              },
              "error": {
                "description": "FAILED only: why, in words safe to show a person.",
                "type": "string"
              },
              "packageName": {
                "description": "The package.",
                "type": "string"
