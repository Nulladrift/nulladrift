                      "description": "When we ingested it, not when it was published.",
                      "format": "date-time",
                      "type": "string"
                    },
                    "versionCode": {
                      "description": "Play's monotonic build number — compare on this, not on the name.",
                      "type": "integer"
                    },
                    "versionName": {
                      "description": "Version string as the developer set it.",
                      "type": "string"
                    }
                  },
                  "required": ["apkId", "fileSize", "format", "sha256", "versionCode", "versionName"],
