        {
          "name": "console_update_listing",
          "title": "Edit my app's listing text",
          "description": "Change the text visitors read on your app's page: the short description (≤80 characters), full description (≤4000, plain text), what's new (≤500) and a YouTube link. Omit a field to keep it; pass null or an empty string to show Google Play's text for it. Goes live immediately; our moderators review afterwards. Needs the admin or owner role. Name and icon cannot be changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Full description, plain text, up to 4000 characters.",
                "type": "string"
              },
              "packageName": {
                "description": "Package id of an app on your Developers Console team, e.g. com.example.app.",
                "type": "string"
              },
              "recentChanges": {
