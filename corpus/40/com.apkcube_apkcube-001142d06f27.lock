                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "When Play last published an update, ISO 8601.",
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "version": {
                      "description": "Latest version NAME known ('2.24.9'). May be 'Varies with device'.",
                      "type": "string"
                    }
                  },
                  "required": ["availability", "developer", "hasFiles", "name", "packageName", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "packageName": {
                "description": "The package these are related to.",
