        {
          "name": "list_trackers",
          "title": "List a build's tracking and advertising SDKs",
          "description": "The privacy question on its own: which advertising, analytics, install-attribution, crash-reporting, push and social sign-in SDKs are in this build, and nothing else. `list_sdks` is the same evidence unfiltered — every recognised library including HTTP clients and UI toolkits — so use that one when you want the full inventory and this one when somebody asked what an app sends about them. A CATEGORY IS NOT AN ACCUSATION: all six are ordinary parts of shipping an app, and `unclassified` counts recognised libraries that are neither (unclassified means we take no position, never that a library is harmless). READ THE BOUNDS BEFORE THE LIST: `analyzed: false` means nobody looked; `codeCoverage` says whether the app's own code was read at all and in full; a non-empty `protectors` means the real code was never readable, and an empty list under one says nothing about the app. Relay `summary` whole — 'no trackers found' without its second clause is the standard way to get this wrong.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analyzed": {
                "description": "Was this build's evidence ever collected? FALSE means nobody looked, and the empty list beside it says nothing about the app. TRUE with an empty list is the factual 'we looked and recognised none' — bounded by codeCoverage.",
                "type": "boolean"
              },
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "byCategory": {
                "description": "Counts per category, same order. Empty when the list is.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Machine name.",
                      "type": "string"
                    },
                    "count": {
                      "description": "Libraries in this category.",
                      "type": "integer"
                    },
                    "label": {
                      "description": "English name.",
                      "type": "string"
                    }
                  },
                  "required": ["category", "count", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "capped": {
                "description": "Evidence tiers that hit their size cap while the artifact was being read, so the analysis worked from a subset of what the file carries. The one bound no later corpus can repair — fixing it needs the bytes back.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "codeCoverage": {
                "description": "How far the analysis reached into the app's OWN code: none — only the manifest and bundled libraries were read; partial — the code was read but not through; full — read through. Only 'full' makes an empty result mean anything close to 'none'.",
                "enum": ["none", "partial", "full"],
                "type": "string"
              },
              "complete": {
                "description": "The answer is bounded by none of the above: code read through, nothing capped, no protector. FALSE is the normal case and is not an error — it means this list is a floor, not a census.",
                "type": "boolean"
              },
              "dex": {
                "description": "How much code was read, when any was: read of total dex files, bytes, and truncated (one file ran out of budget part-way). NULL when none was read.",
                "type": ["object", "null"]
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "protectors": {
                "description": "Commercial protectors on the build, by product name. NOT a malware signal — anti-piracy and anti-tamper are what they are sold for, Google's PairIP included — but a packed app's real code is not in classes.dex for anyone to read, so a short list beside a non-empty protectors is explained by it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rules": {
                "description": "The corpus version that answered THIS request. Matching runs at read time against stored evidence, so two calls either side of a deploy may legitimately name a library the earlier one could not: the artifact has not changed, our ability to recognise what is in it has.",
                "type": ["string", "null"]
              },
              "sources": {
                "description": "Evidence classes actually SEARCHED — manifest, natives, dex — not what was found. Empty when analyzed is false. This is the field that separates 'we looked and found nothing' from 'we never looked'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "One sentence stating the finding AND its bound. Relay both halves: 'no trackers found' without 'and the code was not read' is the misreading this shape exists to prevent, and on a packed build it is false in the most damaging direction available.",
                "type": "string"
              },
              "total": {
                "description": "Classified libraries found — the number to quote.",
                "type": "integer"
              },
              "trackers": {
                "description": "Classified libraries only — advertising, analytics, install attribution, crash reporting, push messaging, social sign-in. Ordered by category, then name.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "advertising | analytics | attribution | crash | push | social. NULL means the corpus names this library but we have not classified it — 'unclassified', never 'harmless'. Most of that bucket is a UI toolkit or an HTTP client with nothing to classify.",
                      "type": ["string", "null"]
                    },
                    "categoryLabel": {
                      "description": "English name for `category`. NULL whenever it is.",
                      "type": ["string", "null"]
                    },
                    "evidence": {
                      "description": "Where it was recognised: native (a bundled .so), dex (a package prefix in the app's own code), static (a declared uses-library), action (an intent action), or the manifest element that named it — application, activity, service, receiver, provider. Two entries is stronger evidence than one.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "description": "Corpus id. Stable within a corpus version — see `rules`.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Library name.",
                      "type": "string"
                    },
                    "vendor": {
                      "description": "Who publishes it. NULL where the corpus records none.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["evidence", "id", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "unclassified": {
                "description": "Recognised libraries we do NOT classify as trackers: HTTP clients, UI toolkits, anything with nothing to classify. Counted rather than listed, so the difference from the SDK inventory's total is visible instead of looking like two endpoints disagreeing. Unclassified is never 'clean'.",
                "type": "integer"
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              }
            },
            "required": ["analyzed", "apkId", "byCategory", "codeCoverage", "complete", "packageName", "summary", "total", "trackers", "unclassified", "versionCode", "versionName"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List a build's tracking and advertising SDKs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:45ca77379393495eae9cacf19779a0ecf978cc0623cf3aaec94c3f86e223084a"
        },
        {
          "name": "list_versions",
          "title": "List downloadable versions",
          "description": "Every APK/XAPK build held for a package, newest first, each with its SHA-256. Call this before get_download_url when you want a specific build — the apkId it returns is what that tool takes; without one it serves the newest. Free when we hold no builds for the package (an empty list); request_fetch is how to get the app. A package we will not serve at all is refused here with the same reason a download would give, so you learn it without spending a download.",
          "inputSchema": {
            "additionalProperties": false,
