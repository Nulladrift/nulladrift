        },
        {
          "name": "list_permissions",
          "title": "List what a build asks the device for",
          "description": "Every Android permission this build declares, sensitive ones first, each with a readable label, its capability family and a sentence saying what the app can actually do with it. Defaults to the newest build. This is the same labelling compare_versions diffs, so the two cannot name the same permission differently. THE NULL IS THE PART TO READ: `permissions: null` means the manifest was never read and is NOT a claim that the app asks for nothing — an empty array is that claim. `sensitive` is the count worth quoting; a long list of ordinary permissions is what almost every app looks like. `defines` is separate and often misread: those are permissions this app declares for OTHER apps to hold, not things it is asking for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "byCategory": {
                "description": "Counts by capability family, most-declared first, each with how many of its names are sensitive — a family of eleven with none sensitive is a different shape of app from two that are both dangerous.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Capability family, e.g. 'Location'. 'Other' for names we cannot file.",
                      "type": "string"
                    },
                    "count": {
                      "description": "Names declared in this family.",
                      "type": "integer"
                    },
                    "sensitive": {
                      "description": "Of those, how many are sensitive.",
                      "type": "integer"
                    }
                  },
                  "required": ["category", "count", "sensitive"],
                  "type": "object"
                },
                "type": "array"
              },
              "declared": {
                "description": "How many. Null when permissions is.",
                "type": ["integer", "null"]
              },
              "defines": {
                "description": "Permissions this app DEFINES for other apps to hold — a different thing from the ones it requests. Empty when it defines none, and also empty when no manifest was read: permissions:null is how to tell.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "permissions": {
                "description": "Sensitive first, then by label. NULL means the manifest was never read — NOT that the app declares none. An empty array is the genuine 'declares none', and the two are opposite answers to the only question this call gets asked.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Capability family ('Location'); null for unrecognised names.",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "description": "What the app can do with it; null when unrecognised.",
                      "type": ["string", "null"]
                    },
                    "label": {
                      "description": "Readable label ('Precise location').",
                      "type": "string"
                    },
                    "name": {
                      "description": "Raw manifest name, e.g. 'android.permission.CAMERA'.",
                      "type": "string"
                    },
                    "sensitive": {
                      "description": "Android-dangerous or special-access. These are the ones worth reading.",
                      "type": "boolean"
                    },
                    "standard": {
                      "description": "Declared under Android's own namespace, not by the app or an SDK.",
                      "type": "boolean"
                    }
                  },
                  "required": ["label", "name", "sensitive"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "sensitive": {
                "description": "Of those, how many are Android-dangerous or special-access. This is the number worth reading.",
                "type": ["integer", "null"]
              },
              "summary": {
                "description": "'24 declared · 5 sensitive'. Null whenever permissions is.",
                "type": ["string", "null"]
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              }
            },
            "required": ["apkId", "byCategory", "defines", "packageName", "permissions", "versionCode", "versionName"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List what a build asks the device for"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:69c6bfbade88b4372fb43c714515a8ae50066b30ce6b681ee31c0825c0722fcf"
        },
        {
          "name": "list_reviews",
          "title": "List Google Play reviews",
          "description": "One page of Google Play user reviews for a package, live: stars, text, helpful votes, the app version the reviewer ran, and the developer's reply. Sort by newest (default), rating or helpfulness; up to 100 a page. Walk further pages by passing `nextCursor` back as `cursor` with the same sort, num and storefront — each page is a separate charge, so ask for what you need. Free when the page is empty (an empty `items`); a busy or failed Google Play is refunded.",
