        {
          "name": "get_manifest",
          "title": "Read what a build declares about itself",
          "description": "What the artifact's own AndroidManifest.xml says beyond the permissions it requests — targetSdk, compileSdk, debuggable, cleartext traffic, backup, sharedUserId, install location, uses-feature, uses-library, and the components it exports without a permission guard — plus the native libraries it ships, and our rules read off the pair as `findings`. Defaults to the newest build. `formFactors` lists the device types the build declares (Android TV, Wear OS, desktop and so on), each 'requires' or 'supports'; empty is not a claim that the app won't run on them. A KEY ABSENT INSIDE `manifest` means the manifest is silent about that attribute, never that it declares the platform default; `manifest: null` means nobody read it at all, and an empty `findings` beside that is not an all-clear. `versionMismatch` is the one to escalate: non-null means the file's own version disagrees with what the listing claims, which is what a swapped or relabelled artifact looks like. Use get_raw_scan if you want the stored record without our rules applied.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apkId": {
                "description": "A specific build from list_versions. Omit for the newest one.",
                "type": "string"
              },
              "packageName": {
                "description": "Android package id.",
                "type": "string"
              }
            },
            "required": ["packageName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apkId": {
                "description": "The build this describes — the one asked for, or the newest held.",
                "type": "string"
              },
              "findings": {
                "description": "Our rules read off the two fields above, warnings first. Empty is NOT an all-clear: absence is never a finding, so a manifest nobody read produces none either — manifest:null beside it is how to tell.",
                "items": {
                  "properties": {
                    "detail": {
                      "description": "One sentence: what it means and what it does not, with the specifics where there are any. Both halves matter — every one of these is ordinary in some app shipping today, and relaying only the first clause turns a fact into an accusation.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable machine-readable id: debuggable | version-mismatch | cleartext-traffic | backup-allowed | shared-user-id | exported-components | legacy-permission-model | packed. Branch on this, not on the prose.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "warning — this file is not what a release build of this app should look like (a debuggable build, or a version that disagrees with the listing). notice — true, worth knowing, and routinely a deliberate choice of an ordinary app. Neither is a verdict: the anti-malware verdict is a separate field and a finding never moves it.",
                      "enum": ["warning", "notice"],
                      "type": "string"
                    },
                    "title": {
                      "description": "Short label.",
                      "type": "string"
                    }
                  },
                  "required": ["detail", "id", "severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "formFactors": {
                "description": "The device types this build declares, each 'requires' or 'supports'. A declaration rather than a compatibility test. EMPTY does not mean the app won't run on them: it also covers a manifest nobody read or a scan with no usesFeaturesOptional, and a phone build says nothing about a separate TV or watch build.",
                "items": {
                  "properties": {
                    "formFactor": {
                      "enum": ["automotive", "auto", "cardboard", "daydream", "desktop", "tv", "wear"],
                      "type": "string"
                    },
                    "support": {
                      "enum": ["requires", "supports"],
                      "type": "string"
                    }
                  },
                  "required": ["formFactor", "support"],
                  "type": "object"
                },
                "type": "array"
              },
              "manifest": {
                "description": "What AndroidManifest.xml declares beyond the permissions it requests: targetSdk, compileSdk, debuggable, usesCleartextTraffic, allowBackup, sharedUserId, installLocation, definesPermissions, usesFeatures, usesFeaturesOptional (the subset declared required=\"false\"; absent on older scans), formFactorMarkers (allow-listed meta-data and category names marking a device type; absent on older scans), usesLibraries, exportedUnguarded, and its own versionCode/versionName. NULL = nobody read the manifest. A key ABSENT INSIDE the object means the manifest does not declare that attribute — never that it declares the platform default.",
                "type": ["object", "null"]
              },
              "natives": {
                "description": "Native libraries the artifact ships: abis, libs (name, largest uncompressed size, the abis carrying it) and protectors. NULL = the archive directory could not be read; empty lists are the factual 'ships no native libraries', ordinary for a split bundle's base APK.",
                "type": ["object", "null"]
              },
              "packageName": {
                "description": "The package asked for.",
                "type": "string"
              },
              "versionCode": {
                "description": "Its build number.",
                "type": "integer"
              },
              "versionMismatch": {
                "description": "The artifact's own version against what the listing claimed for it, as {claimed, actual}. Non-null means the bytes are not the build the listing describes — a swapped or relabelled artifact — and it is the only check that version number ever gets.",
                "type": ["object", "null"]
              },
              "versionName": {
                "description": "Version name of that build.",
                "type": "string"
              }
            },
            "required": ["apkId", "findings", "formFactors", "manifest", "natives", "packageName", "versionCode", "versionMismatch", "versionName"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read what a build declares about itself"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9c0dec396a2f874131229c1edcb61c7781342351a6c2dd7fda68fb5f0c63c3b7"
        },
        {
          "name": "get_play_details",
          "title": "Get the Google Play listing",
          "description": "Google Play's full store listing for one package, in any storefront: the star histogram, install estimate, IAP price range, release date, declared permissions, content-rating descriptors, legal publisher and contact details — the store data get_app leaves out. Usually null: the written-review count, sale pricing and the Play Pass and pre-registration flags. Pass `lang`/`country` for another storefront (prices, text and availability differ); the default en/us listing is served from our own scrape while it is fresh and scraped and stored otherwise. Works for packages outside the catalogue. Charged even when Google Play doesn't list the app (`APP_NOT_FOUND`); a busy or failed Google Play is refunded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter storefront country, e.g. us, jp. Defaults to us.",
                "type": "string"
              },
