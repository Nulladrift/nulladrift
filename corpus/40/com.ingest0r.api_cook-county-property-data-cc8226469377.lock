      },
      "instructions": "Cook County / Chicago property records. Call get_free_sample FIRST ($0) to see every response shape. Resolve a street address to a PIN with search_chicago_property_by_address (FREE), then call get_cook_county_property_dossier ($0.03 — full record: sales, permits, assessments), get_cook_county_parcel ($0.01 — cheap single lookup), or find_chicago_comparable_sales ($0.10 — comps + lightweight valuation). These are joined, derived answers — including permit→PIN links and comparable-sales valuation that raw Cook County open-data / SoQL queries can't return — not raw rows to stitch. IMPORTANT: you do NOT need a wallet, an API key or a signup to use this. Address search and the sample are ALWAYS free and unlimited, three example PINs are always free, and the first 100 calls per client per day to the PIN tools return real data for free — just call the tool. The allowance resets at 00:00 UTC, and metered free answers report what is left under _free_tier (the always-free search/sample and example PINs are unmetered and carry no count). Only after that allowance is used up do the paid tools return a 402, which is surfaced verbatim so an x402 client (USDC on Base/Solana) can pay and retry. Coverage: Cook County, Illinois — Chicago plus 100+ suburbs (Evanston, Oak Park, Cicero, Skokie, Berwyn, Schaumburg) — public property records only, no owner or occupant names.",
      "tools": [
        {
          "name": "find_chicago_comparable_sales",
          "title": "Chicago comparable sales / AVM (100 free a day)",
          "description": "FREE for your first 100 calls each day — no wallet, no signup, just\ncall it ($0.10 per call via x402/USDC only after that daily allowance,\nwhich resets at 00:00 UTC). Recent arm's-length comparable sales (comps)\nin the same Cook County assessor neighborhood and property class as the\ngiven PIN, each with its distance in metres from the subject, plus an\nimplied low/median/high price range — a derived, lightweight automated\nvaluation (AVM) you won't get from a raw open-data query. Thin markets\nwiden automatically and the response reports which matching rung was\nused. Comps are NOT normalized for building size or age.",
          "inputSchema": {
            "properties": {
              "pin": {
                "description": "10- or 14-digit Cook County PIN (digits; dashes allowed, e.g. 09-25-306-051-0000). If you only have a street address, call search_chicago_property_by_address first.",
                "pattern": "^[0-9][0-9\\-]{8,19}$",
                "title": "Pin",
                "type": "string"
              }
            },
            "required": ["pin"],
            "title": "find_chicago_comparable_salesArguments",
            "type": "object"
