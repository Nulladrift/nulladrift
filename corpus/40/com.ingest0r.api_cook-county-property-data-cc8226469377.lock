          "name": "get_cook_county_parcel",
          "title": "Cook County parcel record (100 free a day)",
          "description": "FREE for your first 100 calls each day — no wallet, no signup, just\ncall it ($0.01 per call via x402/USDC only after that daily allowance,\nwhich resets at 00:00 UTC). Cook County, IL parcel record for a 10- or\n14-digit PIN. Returns: pin, prop_address, prop_city, prop_zip, class,\ntownship_name, nbhd_code, municipality, ward, police_district,\ncensus_tract_geoid, school_elementary_district,\nschool_secondary_district, walk_score_cmap, airport_noise_dnl, lat, lon,\ntax_year. The cheap single-property lookup — use\nget_cook_county_property_dossier for sales, permits and assessments.",
