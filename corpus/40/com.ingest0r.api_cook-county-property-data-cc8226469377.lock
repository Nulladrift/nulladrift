        {
          "name": "get_cook_county_property_dossier",
          "title": "Cook County property dossier (100 free a day)",
          "description": "FREE for your first 100 calls each day — no wallet, no signup, just\ncall it ($0.03 per call via x402/USDC only after that daily allowance,\nwhich resets at 00:00 UTC). Full Cook County / Chicago property dossier\nfor a PIN: parcel basics, recorded sales & deed history, building\npermits, property-tax assessment history, and neighborhood / ward /\nschool / walkability context — the one-call due-diligence record.\nPermits are LINKED to the PIN here (the raw permit open-data has no PIN;\nlinks are derived by address + geo match), so this is a finished record\nyou cannot reproduce with raw open-data queries. Note assessment values\nare ASSESSED values (~10% of market for most residential classes), not\nmarket prices — see assessment_note in the response.",
          "inputSchema": {
