        {
          "name": "search_chicago_property_by_address",
          "title": "Chicago / Cook County address to parcel PIN (always free)",
          "description": "ALWAYS FREE, unlimited, no wallet and no signup. Resolve a Cook County\n/ Chicago street address (full or partial) to its parcel PIN(s) — ranked\ncandidates with address, city, ZIP, a match score and a match_quality\nflag. A trailing city/state/ZIP is fine ('1 E 113th St, Chicago, IL\n60628'). CHECK match_quality: 'exact' is certain, 'likely' shares the\nhouse number, and 'weak' means NO candidate matched the house number —\ndo not rely on a weak hit. Call this FIRST when you have an address but\nnot a PIN, then pass a returned pin to get_cook_county_parcel /\nget_cook_county_property_dossier / find_chicago_comparable_sales.\nCoverage: Cook County, Illinois — Chicago plus 100+ suburbs including\nEvanston, Oak Park, Cicero and Skokie.",
