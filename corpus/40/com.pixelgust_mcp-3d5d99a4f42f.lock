      "serverInfo": {
        "name": "pixelgust",
        "title": "PixelGust Environmental Data",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "PixelGust provides weather, climate, terrain, soil, vegetation, hazard, and demographic data for any location on Earth. Pass coordinates in decimal degrees (lat -90..90, lon -180..180). Every response has a units object or unit string that states each value's unit and time basis, and a map_url that opens the place on the PixelGust map, which you can share with the user. Without an API key you get free-tier limits (50 tool calls per day, resets 00:00 UTC). With a key, its plan applies: send it as an X-API-Key header, or add ?key=YOUR_KEY to the server URL when the client cannot set headers. Keys are created at https://pixelgust.com/app (API Keys menu).",
      "tools": [
        {
          "name": "get_climate_timeseries",
          "title": "Climate time series",
          "description": "Monthly time series 2015-2025 (about 130 monthly values) for one variable at a point, plus the 12-month climatology. Accumulation variables are monthly totals: precipitation_mm and total_evaporation_mm in mm/month (evaporation positive), snowfall_cm in cm/month, net_solar_radiation_mj_m2 and net_thermal_radiation_mj_m2 in MJ/m2/month. Net thermal is negative when the surface loses heat. Sum 12 months for an annual total. Other variables are monthly means (temperatures in C, pressure in hPa, wind speed in m/s, humidity and cloud cover in %, soil water as volume fraction, ndvi unitless, fire_weather_index as FWI). The response carries a unit string. Use for trend questions (is it getting hotter or drier here?). Wind direction is not available as a time series.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "variable": {
                "description": "Variable to return",
                "enum": ["temperature_c", "dewpoint_c", "skin_temperature_c", "surface_pressure_hpa", "precipitation_mm", "snowfall_cm", "total_evaporation_mm", "soil_water_layer_1_vol", "wind_speed_ms", "net_solar_radiation_mj_m2", "net_thermal_radiation_mj_m2", "relative_humidity_pct", "cloud_cover_pct", "ndvi", "fire_weather_index"],
                "type": "string"
              }
            },
            "required": ["lat", "lon", "variable"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Climate time series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0d975b73881f27dbcf364c7cbf867ba167db612633598cbffdc5cd401ee5ff7"
        },
        {
          "name": "get_current_weather",
          "title": "Current weather",
          "description": "Current weather conditions for a point: temperature, humidity, dewpoint, wind speed and direction, precipitation, pressure, cloud cover, solar radiation, plus terrain, land cover, NDVI, population density, and soil context. Source: NOAA GFS 0.25 degree, updated every 6 hours. The response's units object gives each value's unit and time basis.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Current weather"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6942702f993eefea6743d59d135fa5b729ffea2edf7f6ee68cab7c33b1c7a4a"
        },
        {
          "name": "get_environment",
          "title": "Environment",
          "description": "Environmental data for a point: NDVI vegetation index (300 m), annual evapotranspiration (MODIS, mm/year), and ESA WorldCover land cover class.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Environment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fefbb531b6f7d1d973f81b394ea6e6f97d78f0f4fb6c9abaf96591ee54e18e7f"
        },
        {
          "name": "get_hazards",
          "title": "Natural hazards",
          "description": "Natural hazard indices for a point: Fire Weather Index (current danger) and flood susceptibility (Topographic Wetness Index). Soil erosion is withdrawn for now, so soil_erosion_t_ha_yr is null.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Natural hazards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4c0f21516b49eb3e27e2c41d28a35ceb94dcf9d4112a6e544ecfbcface9f45c"
        },
        {
          "name": "get_historical_climate",
          "title": "Historical climate",
          "description": "10-year historical climate averages (2015-2024, ERA5 reanalysis) for a point. Pass month 1-12 for that month's climatology with min and max ranges: accumulations (precipitation, snowfall, evaporation, radiation) are then totals for that month, for example precipitation_mm in mm/month. Omit month for the annual climate: accumulations are then annual totals (mm/year, MJ/m2/year). Evaporation is positive (water evaporated). Use this for questions about typical climate, growing seasons, or what weather to expect at a location and time of year. The response's units object gives each value's unit and time basis.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "month": {
                "description": "Optional month 1-12. Omit it for the annual climate",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Historical climate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bff7c39de651c847d69e93e6a7bc5962b09426d1c199fb7b1bee4ce0fbb8dd2b"
        },
        {
          "name": "get_polygon_stats",
          "title": "Polygon statistics",
          "description": "Aggregate statistics (mean, min, max, std) over a polygon area: weather, terrain, hazards, environment, soil, and population. Coordinates are [longitude, latitude] pairs forming a simple ring (no self-intersections). Maximum area depends on plan (free tier: 100 km2, measured on the sphere). Weather units follow the chosen mode, as in get_current_weather, get_weather_forecast and get_historical_climate. Use for area questions such as average slope of a farm or population inside a zone.",
          "inputSchema": {
            "properties": {
              "coordinates": {
                "description": "[[lon, lat], ...] polygon ring (closed or open)",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "minItems": 3,
                "type": "array"
              },
              "day": {
                "default": 0,
                "description": "Forecast day for mode=forecast, 0-based (0 is the first forecast day, the day after the GFS run date). forecast_dates in the response lists all available days",
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "default": "nowcast",
                "description": "Weather source: nowcast for current conditions (GFS), forecast for a forecast day (set day), historical for 2015-2024 ERA5 averages (set month, or omit it for the annual climate)",
                "enum": ["nowcast", "forecast", "historical"],
                "type": "string"
              },
              "month": {
                "description": "Month 1-12 for mode=historical. Omit it for the annual climate",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["coordinates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Polygon statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3341be5c16d66e43051c0b90467bccdc43b75309b060c9a99d0ce58304e166ff"
        },
        {
          "name": "get_proximity",
          "title": "Proximity",
          "description": "Straight-line distance in km from a point to the nearest feature of six layers: coastline, highway (motorway or trunk road), airport (large or medium), major port, hospital or clinic, and school. Each layer is returned with its display name and distance_km.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Proximity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc99dae4da1ae59b526c043060bc9e0edeb8e5b1cca82bf41028d254e7546491"
        },
        {
          "name": "get_soil",
          "title": "Soil",
          "description": "Soil properties at a point from SoilGrids 2.0 (ISRIC - World Soil Information, CC BY 4.0), 250 m mean predictions: clay, sand and silt (%), bulk density, coarse fragments, organic carbon (content, density and 0-30 cm stock), total nitrogen, cation exchange capacity and pH, at six depths from 0-5 cm to 100-200 cm. Built-up areas, water and permanent ice have no prediction, so the nearest mapped pixel within a few kilometres is used and reported in pixel. Model estimates, not measurements: ISRIC advises against using SoilGrids at the local or farm level, and they are not for engineering design. Units are in soil.units, and the source block holds the credit to pass on with the values.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Soil"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf52f1922962a62256a79ff5e8545f58e8a035516507404bcb31fac16e08a22b"
        },
        {
          "name": "get_terrain",
          "title": "Terrain",
          "description": "Terrain for a point: elevation (m), slope and aspect (degrees) at 30 m resolution (Copernicus DEM), plus Topographic Wetness Index (flood susceptibility indicator).",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
