          },
          "digest": "sha256:651b1e169701000591508420e13c06914440570cfd4f3f8f09c6448d58038937"
        },
        {
          "name": "get_weather_forecast",
          "title": "Weather forecast",
          "description": "Daily weather forecast for a point. day is 0-based: day 0 is the first forecast day, the day after the GFS run date (UTC), not today. forecast_dates in the response lists all available days (currently 6 or 7 depending on the model run). The response gives the calendar date of the day returned, and daily totals or mean, min, and max per variable. The response's units object gives each value's unit and time basis.",
          "inputSchema": {
            "properties": {
              "day": {
                "default": 0,
                "description": "Forecast day, 0-based: 0 is the first forecast day. forecast_dates in the response lists all available days",
                "minimum": 0,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Weather forecast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a783c8c205d705c808773a3978745c0b8ec142cea4b6421c6bfc789f991466f"
        }
      ],
      "digest": "sha256:6c81bf01cb36381954b4bc2ba7ae9e3948eefc92cf4333c41607118ce1a6942e"
    }
