                "description": "Longitude in decimal degrees, -180 to 180",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
