{
  "lockfileVersion": 2,
  "subjects": {
    "com.submitmystartup/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://submitmystartup.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "submitmystartup",
        "title": "SubmitMyStartup",
        "version": "1.1.1",
        "description": "Find where to submit your startup. Searches a free list of directories with real submission results.",
        "websiteUrl": "https://submitmystartup.com/mcp-server/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server searches SubmitMyStartup's free public list of 1085 places to submit or launch a startup: directories, launch sites, communities, review sites, and editorial sites. The list's maintainer tries each place by submitting a real site to it (976 so far) and records what happened: what it costs and the catch, what the free path needs (an account, a badge, an email on your own domain, upvotes), the wait until a listing is live, and which products and regions it takes. Data generated 2026-11-11.\n\nTools:\n- find_directories: a ranked shortlist for one product and its limits (product type, B2B or B2C, country, budget, badge, domain email, deadline). Use it when someone asks where to submit or launch their startup.\n- get_directory: every fact about one place, by id, name, or website.\n- list_filters: the allowed filter values, with example arguments.\n- search and fetch: keyword search over the list, and one place's full record as text, in the shape ChatGPT's deep research and connectors use.\n\nGive product_types that are true of the product: a product without AI features leaves out ai-tools, so places that only take AI products drop out.\n\nA fact that is not on record is unknown, never guessed: results list their unknowns, so say what to check rather than assuming. Rules change, so mention when a place was last checked. rowUrl (or url in search and fetch) is the place's row on submitmystartup.com, for links. The data is from https://github.com/mmmmingos/where-to-submit-your-startup under the MIT License.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch one place's full record",
          "description": "The full record of one place on the list, as readable text: cost and catch, what the free path needs and doesn't, the wait, review, backlink, which products, audiences, stages, and regions it takes, the list's notes, when it was last checked, the maintainer's own attempt, and where each fact came from. Takes an id from search or find_directories; a name or website also works. Returns id, title, text, url (the place's row on the website, for citing), and metadata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The place's id from search, for example \"indie-hackers\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch one place's full record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d852e21373b2aa34787002fbb9b78b5ab746a6e63fb2cd5a135ba78fb73f7447"
        },
        {
          "name": "find_directories",
          "title": "Find places to submit a startup",
          "description": "Shortlist places to submit or launch a startup (directories, launch sites, communities, editorial sites) that fit a founder's product and limits. Use it when someone asks where to list, launch, or promote their startup or product. Returns a ranked list: Free with no catch first, then free with a catch, then paid by lowest listed price, then cost not on record. Within each group: shortest wait, then fewest unknown facts, then name. Never ranked by my own traffic results. Each result gives the cost and catch (cost, free), what the free path needs (needs), the wait, why it fits (why), which facts the query needs that are not on record (unknown), the list's notes, when it was last checked, and rowUrl, the place's row on the website. Leave out any filter that doesn't matter. Use get_directory for every fact about one place, and list_filters for allowed values and example arguments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Who the product is for. b2c drops places that only take business-to-business products (G2 and similar).",
                "enum": ["b2b", "b2c", "both"],
                "type": "string"
              },
              "budget": {
                "description": "The most the founder will pay for one listing, in USD unless currency is set. 0 means free paths only (free, and free with a catch). Leave out for any cost.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "can_add_badge": {
                "description": "false if the founder can't put a badge or backlink on their site. Default true.",
                "type": "boolean"
              },
              "cannot": {
                "description": "Other requirements the founder can't meet: account, engagement (upvote, comment on, or rate other products first), socialProfile, phone, captcha, ownDomain, invitation, revenueProof. badge and domainEmail also work here.",
                "items": {
                  "enum": ["account", "badge", "domainEmail", "engagement", "socialProfile", "phone", "captcha", "ownDomain", "invitation", "revenueProof"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "categories": {
                "description": "Only these sections of the list: directories, specialist (only for some startups), reddit, paid, problems.",
                "items": {
                  "enum": ["directories", "reddit", "paid", "specialist", "problems"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "country": {
                "description": "Where the startup is based, as an ISO 3166-1 alpha-2 code (AU, US, GB, IN); a country name such as Australia also works. Regional places limited to other countries drop out. Leave out for no region filter.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 currency of budget. Default USD. Prices in another currency count as unknown.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "domain_rating": {
                "description": "The product site's domain rating, for places that set a minimum.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "early_stage": {
                "description": "true if the startup meets early-stage rules (for example under 5 years old, at most two institutional rounds).",
                "type": "boolean"
              },
              "formats": {
                "description": "Only these listing formats: directory, launch (a dated launch), profile, editorial (a pitch for coverage), community (a post), app-review, review-site, gallery, beta-testing.",
                "items": {
                  "enum": ["directory", "launch", "profile", "editorial", "community", "app-review", "review-site", "gallery", "beta-testing"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "has_domain_email": {
                "description": "false if the founder has no email address on the product's own domain (only Gmail or similar). Default true.",
                "type": "boolean"
              },
              "include_problem_sites": {
                "description": "true to include places reported broken, inactive, closed, or dead. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many results to return, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "markets": {
                "description": "Markets the founder wants to reach (ISO alpha-2 codes or country names), for regional sites that cover a market or language rather than requiring a headquarters there.",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "offset": {
                "description": "Skip this many results, for paging. Default 0.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "product_types": {
                "description": "What the product is, as tags (see list_filters), for example [\"web-apps\"] or [\"saas\", \"developer-tools\"]. Give only tags that are true of the product: a product without AI features leaves out ai-tools, so places that only take AI products drop out. web-apps also counts as software and websites; saas also counts as software, web-apps, and websites. Without tags, places limited to some products count as unknown.",
                "items": {
                  "enum": ["software", "web-apps", "websites", "saas", "mobile-apps", "mac-apps", "desktop-apps", "browser-extensions", "services", "ai-tools", "ai-developer-tools", "developer-tools", "no-code-tools", "marketing-tools", "open-source", "kids-apps", "ecommerce", "agencies", "media-buyers", "products-with-confetti", "computing-topics", "designs", "free-online-tools", "single-purpose-utilities", "converters", "ai-tool-aggregators", "mobile-only-apps", "waitlist-only", "adult", "gambling", "crypto", "mlm"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "released": {
                "description": "true if the product is publicly released and usable, false if it is pre-release or in beta.",
                "type": "boolean"
              },
              "strict": {
                "description": "true to drop places where any fact the query needs isn't on record. Default false: they stay in, with the unknown facts listed.",
                "type": "boolean"
              },
              "subdivision": {
                "description": "ISO 3166-2 state or province, when a place is limited to one (US-WA). Implies the country.",
                "pattern": "^[A-Za-z]{2}-[A-Za-z0-9]{1,3}$",
                "type": "string"
              },
              "within_days": {
                "description": "The listing must go live within this many days on the free path. A place whose wait isn't on record counts as unknown.",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find places to submit a startup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3803fcd709d9adb7fddaeadbfdcd473202c5d1f46d92e6e7efab8d94c2acffb1"
        },
        {
          "name": "get_directory",
          "title": "Get one place's facts",
          "description": "Every fact about one place on the list, for when a founder asks about a specific directory or launch site. Returns a short summary (cost and catch, what the free path needs, the wait, review, backlink, rowUrl), then the full record: the list's notes and Free? label, structured facts (cost, what it accepts, free-path requirements, wait, review, backlink), where each fact came from and when, the status of the maintainer's own attempt, and links. Look it up by id (from find_directories or search), name, or website URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id_or_name": {
                "description": "The place's id (for example \"indie-hackers\"), its name (\"Indie Hackers\"), or its website (\"indiehackers.com\").",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one place's facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50285559ee81c1a528cc37217bc0e9ac3a2de998cd74d0d9f5260f361ded2098"
        },
        {
          "name": "list_filters",
          "title": "List the allowed filter values",
          "description": "The allowed values for find_directories: product types (and the types each implies), audiences, formats, sections of the list, requirements for cannot, the limited regions on record, price currencies, counts, and example arguments for common questions.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the allowed filter values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1d80980d00ffff5ce255d6ab4e327d3183c4e4829eb69ea67c56bedde4bbc89"
        },
        {
          "name": "search",
          "title": "Search the list",
          "description": "Keyword search over the list of places to submit a startup. A place's exact name or website (\"Indie Hackers\", \"indiehackers.com\") puts it first. Asking for free (\"free\", \"no cost\", \"$0\") leaves out places that are paid only. Product words (\"web app\", \"SaaS\", \"AI tool\", \"mobile app\") keep only places that take that kind of product. Kind-of-place words (\"launch site\", \"directory\", \"community\") put places of that kind first. Other words match names, websites, regions, and the list's notes. For example \"free launch sites for a web app\", \"AI tool directories\", or \"Australia\". Returns up to 20 places, best match first, each with id, title, url (its row on submitmystartup.com, for citing), and a one-line summary. A query with no specific words returns the best free places. Use fetch with an id for the full record, and find_directories to shortlist by a founder's product and limits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "What to look for, in a few words.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "Best match first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "The place's id, for fetch.",
                      "type": "string"
                    },
                    "text": {
                      "description": "Cost, kind of place, what the free path needs, and when it was last checked.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The place's name.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The place's row on the website.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "text", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the list"
          },
          "behavior": {
            "destructive": false,
