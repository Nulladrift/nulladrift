                        "minItems": 2,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Expected Shortfall"
                  },
                  "horizon_days": {
                    "exclusiveMinimum": 0,
                    "maximum": 3650,
