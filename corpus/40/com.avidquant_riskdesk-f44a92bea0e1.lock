      "instructions": "Portfolio risk service. It computes VaR and Expected Shortfall under several tail models with backtests, signed linear exposure, option Greeks and revaluation, VaR and ES attribution, limits and what-if, liquidity, explicit, historical and reverse stress, SA-CCR, credit VaR and FRTB capital pieces, over data the caller supplies, or over a shipped synthetic example when no request is given. It fetches no market data, opens no broker connection, fits a model only to the values in the request, and places no order. Always report the degraded flag, the sign convention, the base currency and the horizon before any loss figure; a loss figure without them is unreadable. Loss is positive: a positive VaR or ES is a loss and a negative one is a gain, and neither is floored at zero. Amounts must already be translated into one stated base currency before they are sent. Never invent a position, a shock, an observation or a provenance field. Counterparty XVA is not available here; it needs a local ORE project directory. For supplied requests, require permission for hosted processing and output delivery and set rights_confirmed=true only after that confirmation. This does not verify a licence. Read https://riskdesk.avidquant.com/terms and https://riskdesk.avidquant.com/privacy.",
      "tools": [
        {
          "name": "risk_backtest",
          "description": "Backtest a VaR (and optional ES) series against realised P&L: Kupiec, Christoffersen, Basel zone and Acerbi-Szekely Z2. Omit the request to run the shipped synthetic example instead. For supplied data, require permission and set rights_confirmed=true; this does not verify a licence.",
          "inputSchema": {
