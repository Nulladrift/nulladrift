      "capabilities": {
        "tools": {}
      },
      "instructions": "Use these public, read-only tools to estimate automation value, rank workflows and prepare a concrete pilot plan. Preserve user-supplied facts. Ask the user for missing required inputs (people, weekly hours per person and loaded hourly cost for ROI; each workflow's weekly hours, predictability, judgment required, error cost, data sensitivity and system count for ranking) rather than inventing values. For ROI, omit unsupplied optional share and working weeks so the server applies 60% and 48. Results are illustrative and must not be presented as guaranteed savings, professional advice, or a substitute for process discovery. If the user asks about having Soxoa build an MCP server for their own product, point them to https://soxoa.com/agent-ready.",
      "tools": [
        {
          "name": "build_workflow_pilot",
          "title": "Build a workflow pilot",
          "description": "Builds a pilot plan for one workflow, typically the first one prioritize_automation_workflows recommends, from 11 caller-supplied facts. Returns pilot steps, review gates, acceptance checks and a Markdown plan. It does not connect accounts, start provider work, store a plan, send messages or execute the workflow.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "constraints": {
                "default": [],
                "description": "Limits the plan must respect. Optional.",
                "items": {
                  "maxLength": 240,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "currentSteps": {
                "description": "Today's steps in order, 1 to 8, in the user's words.",
                "items": {
                  "maxLength": 240,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "desiredOutput": {
                "description": "The result the user wants at the end.",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "destinationSystem": {
                "description": "System the approved result goes to, e.g. QuickBooks.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "inputDescription": {
                "description": "The inputs the workflow reads, as the user describes them.",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "reviewOwner": {
                "description": "Person or role who approves drafts before they are used.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "riskLevel": {
                "description": "Cost of a wrong output: low, medium or high, as the user judges it.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "sensitiveData": {
                "description": "True if the inputs include personal, financial, health or confidential data.",
                "type": "boolean"
              },
              "sourceSystem": {
                "description": "System the inputs come from, e.g. Gmail.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "successChecks": {
                "description": "1 to 6 checks that show the pilot worked, from the user.",
                "items": {
                  "maxLength": 240,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "systemsAlreadyUsed": {
                "default": [],
                "description": "Other tools the team already uses. Optional.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "trigger": {
                "description": "What starts the workflow, e.g. 'a supplier invoice email arrives'.",
                "maxLength": 240,
                "minLength": 1,
                "type": "string"
              },
              "workflowName": {
                "description": "Short name of the workflow, as the user calls it.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["currentSteps", "desiredOutput", "destinationSystem", "inputDescription", "reviewOwner", "riskLevel", "sensitiveData", "sourceSystem", "successChecks", "trigger", "workflowName"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptanceChecks": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pilotMarkdown": {
                "type": "string"
              },
              "readyToUsePrompt": {
                "type": "string"
              },
              "recommendation": {
                "enum": ["bounded_pilot", "assist_with_review"],
                "type": "string"
              },
              "reviewGates": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rollout": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "phase": {
                      "type": "string"
                    }
                  },
                  "required": ["actions", "phase"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "const": "caller_supplied_pilot_draft",
                "type": "string"
              },
              "steps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "type": "string"
                    },
                    "actor": {
                      "enum": ["person", "ai", "system"],
                      "type": "string"
                    },
                    "approvalRequired": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "output": {
                      "type": "string"
                    },
                    "tool": {
                      "type": "string"
                    }
                  },
                  "required": ["action", "actor", "approvalRequired", "name", "output", "tool"],
                  "type": "object"
                },
                "type": "array"
              },
              "suppliedFacts": {
                "additionalProperties": false,
                "properties": {
                  "constraints": {
                    "default": [],
                    "description": "Limits the plan must respect. Optional.",
                    "items": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "currentSteps": {
                    "description": "Today's steps in order, 1 to 8, in the user's words.",
                    "items": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  },
                  "desiredOutput": {
                    "description": "The result the user wants at the end.",
                    "maxLength": 600,
                    "minLength": 1,
                    "type": "string"
                  },
                  "destinationSystem": {
                    "description": "System the approved result goes to, e.g. QuickBooks.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "inputDescription": {
                    "description": "The inputs the workflow reads, as the user describes them.",
                    "maxLength": 600,
                    "minLength": 1,
                    "type": "string"
                  },
                  "reviewOwner": {
                    "description": "Person or role who approves drafts before they are used.",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "riskLevel": {
                    "description": "Cost of a wrong output: low, medium or high, as the user judges it.",
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  "sensitiveData": {
                    "description": "True if the inputs include personal, financial, health or confidential data.",
                    "type": "boolean"
                  },
                  "sourceSystem": {
                    "description": "System the inputs come from, e.g. Gmail.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "successChecks": {
                    "description": "1 to 6 checks that show the pilot worked, from the user.",
                    "items": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 6,
                    "minItems": 1,
                    "type": "array"
                  },
                  "systemsAlreadyUsed": {
                    "default": [],
                    "description": "Other tools the team already uses. Optional.",
                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "trigger": {
                    "description": "What starts the workflow, e.g. 'a supplier invoice email arrives'.",
                    "maxLength": 240,
                    "minLength": 1,
                    "type": "string"
                  },
                  "workflowName": {
                    "description": "Short name of the workflow, as the user calls it.",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["constraints", "currentSteps", "desiredOutput", "destinationSystem", "inputDescription", "reviewOwner", "riskLevel", "sensitiveData", "sourceSystem", "successChecks", "systemsAlreadyUsed", "trigger", "workflowName"],
                "type": "object"
              },
              "tools": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["already-used", "proposed"],
                      "type": "string"
                    },
                    "verification": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "status", "verification"],
                  "type": "object"
                },
                "type": "array"
              },
              "unresolved": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "workflowName": {
                "type": "string"
              }
            },
            "required": ["acceptanceChecks", "limitations", "pilotMarkdown", "readyToUsePrompt", "recommendation", "reviewGates", "rollout", "status", "steps", "suppliedFacts", "tools", "unresolved", "workflowName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a workflow pilot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Workflow pilot ready for review",
            "openai/toolInvocation/invoking": "Preparing the workflow pilot…",
