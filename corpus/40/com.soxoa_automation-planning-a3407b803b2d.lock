          "digest": "sha256:16d29b5b84e1acd555129b44b9da5a166226db74526d268720f6d2010ef34f87"
        },
        {
          "name": "estimate_automation_roi",
          "title": "Estimate automation ROI",
          "description": "Estimates reclaimable team capacity and an illustrative payback period from caller-supplied workload figures. Requires people, weekly hours per person and loaded hourly cost; when automatable share or working weeks are omitted, the server uses 60% and 48. Payback is calculated only when an implementation cost is supplied. Returns weekly and annual hours reclaimed, annual capacity value, payback months, the assumptions used and a recommended next step. Results are planning estimates, not guaranteed savings or financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "automatableShare": {
                "default": 0.6,
                "description": "Fraction of repetitive time that can be reclaimed (0.6 means 60%). Optional; defaults to 0.6 when omitted. An explicit value is used as given.",
                "maximum": 0.95,
                "minimum": 0.05,
                "type": "number"
              },
              "implementationCost": {
                "description": "Implementation cost in the same currency as the hourly labor cost. Optional; when omitted, no payback estimate is calculated.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "loadedHourlyCost": {
                "description": "Loaded hourly labor cost in the user's stated currency, supplied by the user.",
                "maximum": 500,
                "minimum": 10,
                "type": "number"
              },
              "people": {
                "description": "Number of people supplied by the user.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "weeklyHoursPerPerson": {
                "description": "Weekly hours each person spends on this workflow, supplied by the user.",
                "maximum": 60,
                "minimum": 0.5,
                "type": "number"
              },
              "workingWeeks": {
                "default": 48,
                "description": "Working weeks per year, 1 to 52. Optional; defaults to 48 when omitted. An explicit value is used as given.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["loadedHourlyCost", "people", "weeklyHoursPerPerson"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annualCapacityValue": {
                "type": "number"
              },
              "annualHoursReclaimed": {
                "type": "number"
              },
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "estimatedPaybackMonths": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "recommendedNextStep": {
                "type": "string"
              },
              "status": {
                "const": "illustrative_estimate",
                "type": "string"
              },
              "weeklyHoursReclaimed": {
                "type": "number"
              }
            },
            "required": ["annualCapacityValue", "annualHoursReclaimed", "assumptions", "estimatedPaybackMonths", "recommendedNextStep", "status", "weeklyHoursReclaimed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate automation ROI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Automation estimate ready",
            "openai/toolInvocation/invoking": "Estimating automation ROI…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b4580bd908822934b56e0a618d258fc687a5c6cf92f35a87a37d4569e8b214bc"
        },
        {
          "name": "prioritize_automation_workflows",
          "title": "Prioritize automation workflows",
          "description": "Ranks 1 to 12 caller-described workflows by value, predictability, judgment, data sensitivity and integration complexity, and labels each automate, assist or discovery. Each workflow requires a name, weekly hours, predictability, judgment required, error cost, data sensitivity and system count. Returns each workflow's score, recommendation, human-review flag and rationale, plus a recommended first workflow and guardrails. It does not connect to or change any system.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "workflows": {
                "items": {
                  "description": "One recurring workflow the user described. Ask for any field you lack.",
                  "properties": {
                    "dataSensitivity": {
                      "description": "How sensitive the data handled is.",
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "errorCost": {
                      "description": "Cost of a mistake reaching a customer or record.",
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "judgmentRequired": {
                      "description": "How much human judgment each case needs.",
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Workflow name, in the user's words.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "predictability": {
                      "description": "How often the steps follow the same pattern.",
                      "enum": ["low", "medium", "high"],
                      "type": "string"
                    },
                    "systemsCount": {
                      "description": "Number of systems the workflow touches, 1 to 20.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "weeklyHours": {
                      "description": "Total team hours per week spent on it, from the user.",
                      "maximum": 500,
                      "minimum": 0.25,
                      "type": "number"
                    }
                  },
                  "required": ["dataSensitivity", "errorCost", "judgmentRequired", "name", "predictability", "systemsCount", "weeklyHours"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["workflows"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guardrails": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rankedWorkflows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "humanReviewRequired": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rationale": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "recommendation": {
                      "enum": ["automate", "assist", "discovery"],
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    }
                  },
                  "required": ["humanReviewRequired", "name", "rationale", "recommendation", "score"],
                  "type": "object"
                },
                "type": "array"
              },
              "recommendedFirstWorkflow": {
                "type": "string"
              }
            },
            "required": ["guardrails", "rankedWorkflows", "recommendedFirstWorkflow"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prioritize automation workflows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Workflow ranking ready",
            "openai/toolInvocation/invoking": "Ranking workflows…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c4fa645dba96132f8a6550914eb52f7541de65466c20132d179bb70279d96dde"
        }
