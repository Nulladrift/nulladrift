      "serverInfo": {
        "name": "seekinweb",
        "title": "SeekinWeb — AI visibility",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SeekinWeb checks how AI assistants see a website. Use check_ai_recommendations to see whether an AI assistant with web search recommends a business when a customer asks for what it offers (who it names instead, which sites it relies on, what it says about the business); scan_website for the technical AI-readability score with fixes; generate_llms_txt to draft its llms.txt. Results are the assistant's answer at that moment, not a ranking or a guarantee. Pass lang:\"es\" for Spanish output.",
      "tools": [
        {
          "name": "check_ai_recommendations",
          "title": "Check AI recommendations",
          "description": "Checks whether an AI assistant with live web search recommends a business when a customer asks for what it offers, without naming it. Returns how many answers named the business, which brands were named instead, which websites the assistant relied on (the sources to be present on), and what the assistant says about the business. Runs in the background on first use (about a minute): if it reports that the test is running, call it again shortly. Free, no account.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Output language: \"en\" (default) or \"es\".",
                "enum": ["en", "es"],
                "type": "string"
              },
              "url": {
                "description": "Domain or URL of the site, e.g. \"example.com\" or \"https://example.com\". Use your own site or one you are authorized to review.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI recommendations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:703bdae10ecd401128a6741d8c8403c87d70c03e5546659d9c491c483c0981a5"
        },
        {
          "name": "generate_llms_txt",
          "title": "Generate llms.txt",
          "description": "Drafts an llms.txt file (llmstxt.org convention) for the root of a domain: a structured summary of the site for language models and agents, derived from the page's real content. Returns the file text. Note: llms.txt is an emerging convention with unproven impact.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Output language: \"en\" (default) or \"es\".",
                "enum": ["en", "es"],
                "type": "string"
              },
              "url": {
                "description": "Domain or URL of the site, e.g. \"example.com\" or \"https://example.com\". Use your own site or one you are authorized to review.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate llms.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ae93df23da99837a599af78ddef8b98ad5e8d0a40f37ab9298af81f3f50841d"
        },
        {
          "name": "scan_website",
          "title": "Scan AI readability",
          "description": "Scans a website and returns its AI Visibility Score (0-100): whether AI crawlers and agents can find, read and cite it. Eight weighted signals (content readable without JavaScript, AI crawler access in robots.txt, structured data, semantic structure, metadata, performance, llms.txt, sitemap), each with a concrete fix when it fails. Free, no account.",
          "inputSchema": {
            "properties": {
