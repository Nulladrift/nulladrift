        {
          "name": "ask_result",
          "title": "BYO: Fetch Published Verdict",
          "description": "Fetch the published verdict for an ask_prepare session (status: pending, published, or unknown). This is the app panel's polling surface, so the verified answer renders inside the panel that prepared the question. As the connected model you normally never need it: write your draft and call ask_submit_draft. Exception: if you are asked to submit for a session whose composed prompt is no longer in your context, call this with include_prompt true to receive that session's exact prompt again, then draft and submit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_prompt": {
                "description": "set true to receive the pending session's composed prompt messages again, e.g. when the ask_prepare result is no longer in your context; the same caller already received this prompt at prepare time",
                "type": "boolean"
              },
              "prepare_key": {
                "description": "the session_id value returned by the prepare tool",
                "type": "string"
              }
            },
            "required": ["prepare_key"],
            "type": "object"
          },
