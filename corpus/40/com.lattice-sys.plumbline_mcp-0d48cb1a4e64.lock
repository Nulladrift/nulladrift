        {
          "name": "cross_check",
          "title": "Cross-Check a Figure",
          "description": "Corroborate a figure you obtained (e.g. from run_sql) against the verified fact store: it re-derives the named value_key from the same SQL the verified pipeline uses and compares. AGREE lifts an otherwise-unverified session to 'corroborated'; DISAGREE marks a CONFLICT (worse than unverified). This is the only way a raw figure earns trust back, and it can only ever agree with a number the fact store itself computed. Resolvable keys cover the single-snapshot fact concepts plus temporal and per-department growth keys (e.g. indexed_people.<dept>); per-question keys (a named department's median, one person's direct-report count) return unmapped.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "the figure you obtained (e.g. from run_sql) to corroborate against the verified fact store",
                "type": "string"
              },
              "value_key": {
                "description": "the claimable fact key naming the verified concept to re-derive, e.g. people, indexed_active_people, median_income_cents, or a per-department growth key like indexed_people.engineering (the keys a verified answer exposes as CLAIMABLE FACT KEYS)",
                "type": "string"
              }
            },
            "required": ["value", "value_key"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "prompto": {
                "additionalProperties": true,
                "properties": {
                  "tool": {
                    "type": "string"
                  }
                },
                "required": ["tool"],
                "type": "object"
              },
              "value": {}
            },
            "required": ["prompto"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cross-Check a Figure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b402a81ab86390e4b1fb6baaf660504c5f445fcf714bd30d8c2a06ccb37480d"
        },
