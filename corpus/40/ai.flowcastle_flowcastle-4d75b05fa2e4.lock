        {
          "name": "update_pulse_item",
          "description": "Change one Pulse item's state. Every action changes the queue for the WHOLE workspace — an item belongs to the workspace, not to whoever called the tool, so dismissing a recommendation hides it from every member and records who decided that. `acknowledge` closes an attention item as seen, with no reason and no note — it is the only hand-close an `automatic` item accepts. `resolve` closes with a resolutionCode and is refused for an `automatic` item. Both need the permission for the item's source (manage_broadcasts for a broadcast, manage_automation for a flow, sequence or operation), and a critical item that is not `manual` by policy can be closed only by an owner or admin (a workspace key counts as owner); `resolve` on such an item also needs a note. Closing a card does not fix its cause, and it hides the problem: an item closed by hand is NOT raised again for 14 days, even while its detector still observes the condition. Only an anomaly the platform closed itself (resolutionCode `source_condition_cleared`) reopens at once when the condition returns. A dismissed recommendation returns by itself after the same cooldown. Does not apply a recommendation's proposed change — that is a dashboard action.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "acknowledge: close an attention item as seen (the only hand-close an `automatic` item accepts). resolve: close it with a reason (refused for an `automatic` item). dismiss/restore: hide or unhide a recommendation for the workspace. snooze: hide it from the workspace queue until a time.",
                "enum": ["acknowledge", "resolve", "dismiss", "restore", "snooze"],
                "type": "string"
              },
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "itemId": {
                "description": "Required. Pulse item id, as returned by list_pulse_items.",
                "type": "string"
              },
              "note": {
                "description": "Free-text note stored with a `resolve`. Required when resolving a critical item that is not `manual` by policy. Ignored by `acknowledge`, which stores no note.",
                "type": "string"
              },
              "reason": {
                "description": "Optional reason recorded with a `dismiss`, so a teammate can see why it was waved off.",
                "type": "string"
              },
              "resolutionCode": {
                "description": "Required for `resolve`. reviewed = looked at it, no_action_needed = not a real problem, fixed_elsewhere = handled outside the platform.",
                "enum": ["reviewed", "no_action_needed", "fixed_elsewhere"],
                "type": "string"
              },
              "snoozeUntil": {
                "description": "Required for `snooze`. ISO 8601 timestamp in the future, e.g. \"2026-09-15T09:00:00Z\".",
                "type": "string"
              }
            },
            "required": ["action", "itemId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update Pulse item"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f215ee0b43c51fe03d7d731a0686cc17cc07375b8b099ffdeaff3e94b5d750af"
        },
        {
          "name": "update_task",
          "description": "Change one CRM task: its fields, its status, or which contacts it is linked to, in one call. Tasks live in CRM → Tasks. A task may stand alone or be linked to contacts. While leads are on for the workspace, linking parks the contact's open lead until the task is done (parkLeads, default true), and marking the task done brings the linked leads back to Waiting on us so someone tells them the result (Won and Lost leads are left alone unless named in returnContactIds). Deleting a task, or unlinking a contact, brings a lead parked on it back to Waiting on us. A task is internal work for the team: nothing is sent to anyone. Setting status \"done\" is what brings the linked leads back; it does not message anyone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "doneNote": {
                "description": "With status \"done\": a note added to the history of the leads that come back, e.g. what was found.",
                "type": "string"
              },
              "dueAt": {
                "description": "New due date, ISO 8601; null clears it.",
                "type": ["string", "null"]
              },
              "link": {
                "description": "New link; null clears it.",
                "type": ["string", "null"]
              },
              "linkContactIds": {
                "description": "Contacts to link, as returned by list_contacts. Already linked ones are skipped.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "New notes in Markdown; null clears them.",
                "type": ["string", "null"]
              },
              "ownerUserId": {
                "description": "New owner (a workspace member); null for nobody.",
                "type": ["string", "null"]
              },
              "parkLeads": {
                "description": "With linkContactIds: park the newly linked contacts' open leads until the task is done. Defaults to true.",
                "type": "boolean"
              },
              "returnContactIds": {
                "description": "With status \"done\": which linked contacts come back to Waiting on us. Omit for every linked lead that is not Won or Lost. Leads parked on the task that are not named are Resolved.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "todo, in_progress or done. Moving a done task back reopens it and changes no lead.",
                "enum": ["todo", "in_progress", "done"],
                "type": "string"
              },
              "taskId": {
                "description": "Required. Task id, as returned by list_tasks or create_task.",
                "type": "string"
              },
              "title": {
                "description": "New title.",
                "type": "string"
              },
              "unlinkContactIds": {
                "description": "Contacts to unlink. A lead parked on this task comes back to Waiting on us.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update CRM task"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5acad986341e7d9578298594e505e1a5b707e8047a241a30c38a7cf7f353fb35"
