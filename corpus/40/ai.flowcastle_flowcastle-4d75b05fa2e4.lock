        {
          "name": "list_contacts",
          "description": "List and search contacts in the application, paginated, newest first. Read-only. Filters combine as AND; search matches name, username, email, phone, and platformId; `tags` / `tagIds` keep only contacts carrying at least one of those tags (UTM attribution tags are named \"utm: <slug>\" — discover them with list_contact_tags). `total` is the full match count, so `limit: 1` counts an audience cheaply. Returns compact contact summaries without variable values — use get_contact for one contact's variables. Remember platformId is unique only per bot, so the same person talking to two bots appears as two contacts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "botId": {
                "description": "Only contacts belonging to this bot (must be one of the application's bots). Omit for all bots in the application.",
                "type": "string"
              },
              "isActive": {
                "description": "True for active contacts only, false for deactivated only. Omit for both.",
                "type": "boolean"
              },
              "kinds": {
                "description": "Only rows of these kinds: \"user\" (wrote to the bot privately), \"member\" (seen in a group), \"group\" and \"channel\" (chats the bot was added to; platformId is the chat ID), \"web_chat\". Contacts recorded before kinds existed have none and match no kind. Omit for all.",
                "items": {
                  "enum": ["user", "member", "group", "channel", "web_chat"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Contacts per page, between 1 and 100. Defaults to 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "page": {
                "description": "1-based page number. Defaults to 1.",
                "minimum": 1,
                "type": "number"
              },
              "search": {
                "description": "Case-insensitive substring matched against first/last name, username, email, phone, and platformId. Omit to list without searching.",
                "type": "string"
              },
              "status": {
                "description": "Only contacts with this subscription status (\"subscribed\" or \"unsubscribed\"). Omit for both.",
                "enum": ["subscribed", "unsubscribed"],
                "type": "string"
              },
              "tagIds": {
                "description": "Same as `tags`, by tag id (from list_contact_tags).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tags": {
                "description": "Only contacts carrying at least one of these tags, by exact tag name (case-insensitive), e.g. [\"utm: tgads_official_0905\"]. A name no contact in scope carries is an error listing what is missing. Combine with tagIds (union).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
