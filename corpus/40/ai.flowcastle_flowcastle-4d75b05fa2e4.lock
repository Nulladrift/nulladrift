        {
          "name": "update_contact",
          "description": "Update a contact's profile fields and/or contact-variable values. Requires the manage_broadcasts permission. Only the fields you pass are changed — omitted fields keep their current value — so the call is idempotent. The variables map takes variable NAMES (or full folder paths when a name is ambiguous), not ids; an unknown name fails with 422 before anything is written. Variable writes propagate to the live bot immediately (the runtime's cached values are invalidated). Setting status to \"unsubscribed\" stops broadcasts, sequences and direct sends for the contact. Setting it back to \"subscribed\" works only when a person on the team unsubscribed them; a contact who blocked the bot or used an unsubscribe link is refused with 409 and comes back only by writing to the bot again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "contactId": {
                "description": "Required. Contact id, as returned by list_contacts.",
                "type": "string"
              },
              "email": {
                "description": "New email. Omit to leave unchanged; empty string clears it.",
                "type": "string"
              },
              "firstName": {
                "description": "New first name. Omit to leave unchanged; empty string clears it.",
                "type": "string"
              },
              "lastName": {
                "description": "New last name. Omit to leave unchanged; empty string clears it.",
                "type": "string"
              },
              "phone": {
                "description": "New phone. Omit to leave unchanged; empty string clears it.",
                "type": "string"
              },
              "status": {
                "description": "New subscription status (\"subscribed\" or \"unsubscribed\"). Omit to leave unchanged.",
                "enum": ["subscribed", "unsubscribed"],
                "type": "string"
              },
              "username": {
                "description": "New platform username. Omit to leave unchanged; empty string clears it.",
                "type": "string"
              },
              "variables": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Contact variable values to set, as { \"variableName\": \"value\" }. Keys are variable NAMES or full folder paths (not ids). Only the listed variables change.",
                "type": "object"
              }
