        {
          "name": "get_action_schema",
          "description": "Read-only, needs no API key. The action-authoring contract apply_actions batches are validated against. With NO arguments, returns an INDEX of block types, actions, action kinds and topics with descriptions and sizes. Then request only what this bot uses. Detail responses include essential rules and basic shapes; follow `seeWhen` before using specialized features: templateExpressions for computed CEL expressions, groupVariables for sender/chat variable ownership, triggerDetails for webhook/module events and trigger output mappings. Responses return whole sections within the budget. Request `omitted` names again; `alsoRelevant` lists referenced topics that did not fit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actionKinds": {
                "description": "ACTION-block action kinds whose config you need, from the index (e.g. [\"SET_VARIABLE\",\"HTTP_REQUEST\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "actions": {
                "description": "Action names whose contract you need, from the index (e.g. [\"create_block\",\"create_link\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "blockTypes": {
                "description": "Block types whose payload contract you need, from the index (e.g. [\"MESSAGE\",\"AI_TOOL_ROUTER\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "includeCore": {
                "description": "Leave this out on your FIRST detail call to receive placeholder rules and always-on invariants; the index reports their size as coreChars. Pass false only on LATER detail calls in the same session after receiving those rules.",
                "type": "boolean"
              },
              "topics": {
                "description": "Topics whose rules you need, from the index (e.g. [\"knowledgeBases\",\"broadcasts\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get action schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
