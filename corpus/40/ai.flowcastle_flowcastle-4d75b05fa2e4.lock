        {
          "name": "create_contact",
          "description": "Create a contact manually — for imports or externally-sourced audiences; contacts who message a bot are created automatically. Requires the manage_broadcasts permission. platformId must be unique within the bot (duplicate fails with 409); botId may be omitted only when the application has exactly one bot. The variables map takes variable NAMES (or full folder paths when a name is ambiguous) — not ids — and unknown names fail with 422. NOT idempotent: retrying a success creates nothing new only because the duplicate platformId is rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "botId": {
                "description": "Bot the contact belongs to. Optional only when the application has exactly one bot; otherwise the call fails listing the candidate bots.",
                "type": "string"
              },
              "email": {
                "description": "Email address.",
                "type": "string"
              },
              "firstName": {
                "description": "First name.",
                "type": "string"
              },
              "lastName": {
                "description": "Last name.",
                "type": "string"
              },
              "phone": {
                "description": "Phone number.",
                "type": "string"
              },
              "platformId": {
                "description": "Required. Platform-side user id (e.g. the Telegram user id). Must be unique within the bot.",
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "Initial subscription status. Defaults to \"subscribed\".",
                "enum": ["subscribed", "unsubscribed"],
