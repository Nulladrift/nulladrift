        {
          "name": "search_flows",
          "description": "Find every flow and block whose contents contain a keyword. Read-only. Searches message text and its translations, button labels and URLs, action names and configs, action input/output field paths and values, condition operands, trigger commands and payloads, custom-code files, and flow names and descriptions. A keyword matching a VARIABLE NAME also returns the blocks that reference that variable, which plain text search cannot do because blocks store variable ids, not names. `truncated` is true whenever a limit dropped something, and `cappedBy` names which: FLOW_LIMIT (more flows matched than `limit`), ROW_LIMIT (the 1000-match ceiling was hit; lower-ranked matches were not read), MATCHED_VARIABLES (the keyword matched more than 25 variable names — only the 25 closest, shortest name first, are resolved to the blocks that reference them, so blocks reading the others are MISSING), MATCHES_PER_FLOW (a flow lists at most 12 matches; its matchCount is the real number), MATCHES_PER_BLOCK (a block lists at most 3). A truncated answer is not proof that nothing else matches: narrow the keyword, or search the full variable name, before you rename or remove something on the strength of it. Use this instead of walking flows with get_flow_context when you know what the content says but not where it lives. Broadcast-backed flows and operation graphs are excluded — use list_broadcasts and the operations tools for those.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum flows to return. Defaults to 30; values above 100 are clamped to 100. Check `truncated` and `cappedBy`: this is only one of the limits that can cut the answer.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Required. Case-insensitive substring, at least 2 characters. Matched against text, not tokenised — search a distinctive phrase or a variable name rather than a single common word.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search flows by keyword"
