        {
          "name": "update_application",
          "description": "Update application-level settings (name, active state, default language, language for everyone else, incoming-message behavior). Requires the manage_settings permission in that application. Only the fields you pass are changed; omitted fields keep their current value, so the call is idempotent. Returns the updated application.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "defaultLanguage": {
                "description": "New default language. It is the SOURCE language of the application's content: every block text is taken to be written in it, and translations are made from it. Any ISO 639 base language tag is accepted and normalised to its lowercase base form (\"de\", \"pt-BR\" → \"pt\"); a value that is not a 2-3 letter tag (for example \"german\") is rejected with INVALID_LANGUAGE — nothing falls back to \"en\". Changing it translates NOTHING: the texts already written are simply treated as written in the new language from then on, and the new default is dropped from the list of additional languages. Omit to leave unchanged.",
                "type": "string"
              },
              "fallbackLanguage": {
                "description": "Language for everyone else: the content language a contact gets when their own language is not one of the bot's languages (or unknown). Must be the default language or an enabled language; \"\" resets to the default language. Omit to leave unchanged.",
                "type": "string"
              },
              "incomingMessageBehavior": {
                "description": "What happens to an inbound message that matches no trigger: LIVE_CHAT routes it to a human operator, EXECUTE_FLOW runs the flow named by incomingMessageFlowId. Side effect of EXECUTE_FLOW: the platform also adds an \"any message\" MESSAGE trigger with originModuleKey \"incoming_message_behavior\" to that flow's start block, and removes it when this setting moves to another flow or back to LIVE_CHAT. It is system-owned: when you later resend that block's triggers with update_block, resend it unchanged with its id.",
                "enum": ["LIVE_CHAT", "EXECUTE_FLOW"],
                "type": "string"
              },
              "incomingMessageFlowId": {
                "description": "Flow of this application to run for unmatched inbound messages. Required when incomingMessageBehavior is EXECUTE_FLOW.",
                "type": "string"
              },
              "isActive": {
                "description": "Set false to deactivate the application — its bots stop responding. Omit to leave unchanged.",
                "type": "boolean"
              },
              "name": {
                "description": "New display name. Omit to leave unchanged.",
                "type": "string"
              }
            },
            "type": "object"
          },
