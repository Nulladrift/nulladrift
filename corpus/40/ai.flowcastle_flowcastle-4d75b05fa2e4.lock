        {
          "name": "apply_actions",
          "description": "Validate and apply a batch of flow-builder actions — the single write path for editing flows, blocks, variables, broadcasts, sequences, and folders. Call this directly; a separate validate_actions call beforehand is unnecessary. Broadcasts have no dedicated tool and are managed here: create_broadcast makes a DRAFT (it owns its flow via data.flowId — add the message blocks in the same batch, no separate create_flow), optionally with create_recurrence_schedule + attach_recurrence_to_broadcast for recurring — like every edit it starts at the next deploy_application and sends nothing before, so confirm the time and audience with the user before deploying. For a one-time broadcast, a later update_broadcast with status SCHEDULED and scheduledAt is what schedules/sends it. The full recipe is in get_action_schema under `broadcasts`. DESTRUCTIVE: the batch may include delete_block, delete_link, delete_flow, delete_variable, delete_operation, and delete_broadcast. Confirm with the user before applying deletions. delete_operation also removes the operation's hidden graph flow and run history; delete_broadcast also removes the broadcast's delivery history and its content flow, and neither can be undone. IRREVERSIBLE SIDE EFFECTS: run_operation starts a real operation run, which may send broadcasts to real contacts and write application variables. It cannot be undone or recalled, is not idempotent, and is available only through this tool — confirm with the user before applying a batch containing one, and never blindly retry a timed-out call that did. Validation always runs first and an invalid batch applies nothing. If an action fails mid-batch, execution stops and the server tries to undo the steps already applied: `reverted: true` means nothing from the batch remains (fix the reported error and resend); `reverted: false` on a failure means part of it may still be applied (`errorClass: \"partial_write\"`) — re-read state with get_flow_context before retrying rather than blindly resending the batch. `errorClass` is one of validation | rule | conflict | permission | partial_write | unknown. update_block patches: a setting you leave out of data.data (or out of an object inside it) is KEPT; a list you send (menu.buttons, triggers, actions, media) replaces the stored list, so resend the items you keep with their ids; an explicit null clears a setting that may be empty, and is refused on data.menu, data.triggers, data.actions and data.media (send [] or the full list). A key a step does not have is refused as UNKNOWN_CONFIG_KEY with its path and the nearest real key, so one retry can fix it; a setting a step requires is refused as MISSING_REQUIRED_CONFIG_KEY. Not idempotent — resending a batch of create_* actions creates duplicates. Read get_action_schema for the action contract and get_design_guidelines before any structural edit. Returns { success, validated, reverted, errorClass (on failure), changes, errors, warnings, actionId } plus an idRemap mapping placeholder ids to the real ids that were created. Applying does NOT publish. Edits land on the draft graph and connected bots keep serving the previously published version until deploy_application runs — finish a round of edits, then deploy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Ordered batch of at least one action, applied in array order. An invalid batch is rejected up front and applies nothing, but execution itself is NOT atomic: if an action fails mid-batch, execution stops there and the actions before it stay applied — re-read state before retrying.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "description": "The action kind to perform. Call get_action_schema for the required fields of each kind.",
                      "enum": ["create_variable", "create_block", "update_block", "create_link", "create_flow", "update_flow", "create_broadcast", "create_recurrence_schedule", "attach_recurrence_to_broadcast", "update_broadcast", "create_sequence", "update_sequence", "create_folder", "move_flow_to_folder", "create_operation", "run_operation", "delete_block", "delete_link", "delete_flow", "delete_operation", "delete_broadcast", "delete_variable", "update_variable", "create_media_from_url", "create_media_from_attachment", "create_knowledge_base", "create_knowledge_base_text_document", "update_knowledge_base_text_document", "edit_knowledge_base_text_document", "delete_knowledge_base_document", "import_website_into_knowledge_base", "update_custom_code_file", "edit_custom_code_file", "patch_content"],
                      "type": "string"
                    },
                    "data": {
                      "additionalProperties": {},
                      "description": "Action payload. Shape depends on `action` — get_action_schema returns the required and optional fields per kind.",
                      "type": "object"
                    },
                    "target": {
                      "description": "Id of the entity the action operates on (block, flow, variable, broadcast, ...). To reference an entity created earlier in the same batch, use its placeholder id — flow_1, block_1, var_1, broadcast_1, schedule_1, button_1, media_1, operation_1. get_action_schema lists the full placeholder set.",
                      "type": "string"
                    },
                    "validation": {
                      "description": "Optional assertions to check before applying, as returned by get_action_schema.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["action", "data"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "conversationId": {
                "description": "Optional id used to group the resulting audit records under one editing session.",
                "type": "string"
              },
              "flowId": {
                "description": "Default flow id for actions in the batch that do not carry their own. Optional when every action targets an explicit flow.",
                "type": "string"
              }
            },
            "required": ["actions"],
            "type": "object"
          },
