        {
          "name": "create_follow_up_task",
          "description": "Create a follow-up reminder for a person to get back to a contact. For work the team owes (checking a database, fixing a bug, a refund), use create_task instead. Creates persistent state and is NOT idempotent: calling it twice creates two reminders. Nothing is sent when it comes due — it is a to-do, not an automation; use send_message or a broadcast to actually message someone. It stays open until someone completes it: a reply from the contact does not close a reminder created here (only the automatic \"no reply for N days\" follow-ups close on a reply). Created with a personal API key it is assigned to that user; with a workspace key it lands unassigned. While leads are on for the workspace, a reminder about a person creates no follow-up: their lead is parked until dueAt instead (made a lead first if needed) and reasonText goes into the lead history; the result says so and has task null.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "contactId": {
                "description": "Contact the reminder is about, as returned by list_contacts. Omit for a standalone reminder with no conversation behind it.",
                "type": "string"
              },
              "dueAt": {
                "description": "Required. When it should surface, ISO 8601 and in the future, e.g. \"2026-09-12T09:00:00Z\".",
                "type": "string"
              },
              "reasonCode": {
                "description": "Required. Short machine-readable slug for why, e.g. \"pricing_question\".",
