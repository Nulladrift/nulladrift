        {
          "name": "list_follow_up_tasks",
          "description": "List follow-up tasks — reminders for a person to get back to a contact. Read-only, ordered by due time so overdue work comes first. A follow-up sends nothing by itself. Scopes: `mine` is the open work assigned to the key's owner and needs a personal key; `unassigned` is unowned open work; `team` is all open work; `completed` is closed history. `unassigned`, `team` and `completed` reach past the caller's own tasks ONLY for an owner or admin of the application, or a workspace API key. For any other personal key `unassigned` and `team` return the same as `mine`, and `completed` returns only their own closed tasks — the result's `scope.narrowedToOwn` is true when that happened. Without a scope a personal key reads `mine` and a workspace key reads `team`. `completionReason` tells a person closing a task apart from the platform closing it (customer_replied, expired_unanswered).",
          "inputSchema": {
