            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Display name for the new application. Defaults to a localized \"My First Application\" when omitted or blank.",
                "type": "string"
              },
              "preferredLanguage": {
                "description": "The new application's default language. It is the SOURCE language of the application's content: every block text is taken to be written in it, and translations are made from it. Any ISO 639 base language tag is accepted and normalised to its lowercase base form (\"de\", \"pt-BR\" → \"pt\"); a value that is not a 2-3 letter tag (for example \"german\") is rejected with INVALID_LANGUAGE — nothing falls back to \"en\". Omit for \"en\". The seeded starter flows and the default name exist only in en, ru, es: for any other language they are seeded in English, and the result says so.",
                "type": "string"
              },
              "skipDefaultFlows": {
                "description": "Set true to create an empty application with no seeded starter flows. Defaults to false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
