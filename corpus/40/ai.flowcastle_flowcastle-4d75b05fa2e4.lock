                "type": "number"
              },
              "scope": {
                "description": "Whose work to list. `mine` requires a personal API key; `unassigned`, `team` and `completed` widen past the caller's own tasks only for an owner, an admin or a workspace key.",
                "enum": ["mine", "unassigned", "team", "completed"],
                "type": "string"
              },
              "search": {
                "description": "Substring match on the contact's name, username, or platform id.",
                "type": "string"
