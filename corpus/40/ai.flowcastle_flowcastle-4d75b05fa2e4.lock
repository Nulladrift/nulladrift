        {
          "name": "query_flow_logs",
          "description": "Read the bot execution log (flow_execution_log) — the record of what the runtime actually did, and the only place that separates \"the action ran\" from \"the action produced output\". Read-only; requires the view_logs permission. Two modes: without groupBy it returns the newest matching rows, with groupBy it returns a grouped rollup (\"what is failing right now\") — group by `error` for distinct failures, `action` for which step, `flow` for where, `day` for whether it is new, then re-run with the same filters and no groupBy to read the rows behind a group. The window is always bounded: it defaults to the last 24 hours and cannot exceed 14 days. For one contact's history, get_contact_activity with includeFlowRuns is the narrower read. Rows are redacted: URL query values read `?param=***`, HTTP request and response bodies keep their first 200 characters, and SECRET variable values read `********` — a masked value is not a missing one. Besides runtime rows, each deploy writes compile warnings (level WARNING, metadata.stage \"compile\", action = the kind): config_key_dropped, trigger_config_invalid, start_trigger_blank_command_catch_all, start_trigger_event_unreachable, start_rule_operand_unwritten, listener_triggers_ignored, condition_rules_stored_shape, owner_consistency, http_literal_credential, flow_link_loop. Runtime warnings to search for: variable_not_found, attachment_dropped, blank_button_dropped, reply_answer_mismatch, node_ref_unresolved (the run stopped at a step the published bot does not contain), mtproto_watched_group_unresolved (a userbot watched-groups row matches no chat, so that chat is never read), and a message that was not sent (metadata.deliverySkipReason: owner_not_linked, owner_unreachable, peer_empty, dm_no_subject, target_unsupported).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Exact action name, as it appears in the `action` field of a returned row.",
                "type": "string"
              },
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "blockId": {
                "description": "Only rows produced by this block.",
                "type": "string"
              },
              "botId": {
                "description": "Only this bot's rows. Omit for every bot in the application.",
                "type": "string"
              },
              "contactId": {
                "description": "Only rows for this contact — one person's trace through the bot.",
                "type": "string"
              },
              "endDate": {
                "description": "End of the window, ISO 8601. Defaults to now.",
                "type": "string"
              },
              "flowId": {
                "description": "Only rows produced while running this flow.",
                "type": "string"
              },
              "groupBy": {
                "description": "Return a rollup grouped by this dimension instead of raw rows.",
                "enum": ["action", "level", "flow", "bot", "day", "error"],
                "type": "string"
              },
              "level": {
                "description": "Only rows at this level or worse: `WARNING` returns warnings and errors, and is the usual starting point (a failed send is a warning).",
                "enum": ["INFO", "WARNING", "ERROR"],
                "type": "string"
              },
              "limit": {
                "description": "Rows (max 200, default 50) or groups (max 100, default 25) to return.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "search": {
                "description": "Substring match on the message or the error message.",
                "type": "string"
              },
              "startDate": {
                "description": "Start of the window, ISO 8601. Defaults to 24 hours before endDate.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query flow execution logs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1a88c0b7cf4c9735eb76bf35c32a3acec38c793a623aca7bfd7f37ab56675b68"
        },
        {
          "name": "read_messages",
          "description": "Read the message transcript: what users sent the bot and what the bot sent back, newest first. Source is the runtime's own message ledger, written by the bot as it handled each turn — inbound messages are recorded before any routing decision, so messages that matched no trigger are here too. Filter by contactId for one conversation, botId for one channel, direction for one side, actor_type for who wrote it (contact / bot / agent — a human replying from Live Chat or over mail), and startDate/endDate for a window. Page further into the past by passing the returned nextCursor back as `cursor`. Text only. A photo or document contributes its caption; the file is not stored. Button taps are NOT messages and never appear here — use get_contact_activity for those. Message wording is redacted after the content retention window (the response says how long), leaving text null on old rows. Read-only. Requires the view_logs permission: this is raw personal message content of your end users.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actor_type": {
                "description": "Who wrote the message. Narrower than direction, which cannot tell a bot reply from a human one: agent = a person replying from Live Chat or over mail, so this is how you find the conversations automation did not finish. Omit for all three.",
                "enum": ["contact", "bot", "agent"],
                "type": "string"
              },
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "botId": {
                "description": "Limit to messages handled by one bot. Omit to read across every bot of the application.",
                "type": "string"
              },
              "contactId": {
                "description": "Limit to one conversation — the globally unique FlowCastle contact id. Find it with list_contacts.",
                "type": "string"
              },
              "cursor": {
                "description": "Continue a previous read: pass the nextCursor value from the last response to get the next page of older messages. Omit to start from the newest.",
                "type": "string"
              },
              "direction": {
                "description": "incoming = messages from the user; outgoing = messages from the bot or a human agent. Omit for both sides interleaved.",
                "enum": ["incoming", "outgoing"],
                "type": "string"
              },
              "endDate": {
                "description": "Only messages at or before this moment. ISO 8601.",
                "type": "string"
              },
              "limit": {
                "description": "Messages to return, 1-100. Defaults to 20.",
                "type": "number"
              },
              "startDate": {
                "description": "Only messages at or after this moment. ISO 8601, e.g. \"2026-08-01\" or \"2026-08-01T00:00:00Z\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read message transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d9204c3d0fc8f7ea1fd44dc0cde42c94ec20fe54176bae7ce6b7ab98e9a17cbc"
        },
        {
          "name": "restore_release",
          "description": "Put an earlier release back into the editor: every flow, step, menu, action and variable returns exactly as it was, under the same ids, so running conversations, scheduled steps and buttons users already received keep working. Nothing is lost: the current editor state is saved first as a RESTORE_SAFETY release, or, when it already equals a recent release, that release is reused (either way returned as safetyReleaseNumber); restoring that one undoes this. Steps added since are soft-deleted, so their message history and contacts' stored values stay. Values the bot itself keeps (application variable values) are not changed. By default the bots keep running what they run until deploy_application; pass publish=true to publish right away (a rollback of a broken publish). Refused while the AI assistant is changing the bot. This replaces the user's unpublished edits in the editor, so confirm with the user first. Requires the manage_automation permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
