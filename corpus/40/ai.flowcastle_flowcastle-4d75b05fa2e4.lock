        {
          "name": "run_flow_autotest",
          "description": "Runs deterministic behavioural tests against flows that are ALREADY applied (compiles them to an AST and simulates a user). Call after apply_actions to verify a build; read `summary` and the failed checks, patch with apply_actions, re-run. Mutates nothing. The smoke layer runs on its own with no input: it walks every entry, taps every button, answers every input step, and reports crashes, dead buttons, unresolved placeholders, and values the bot failed to store. Pass `scenarios` to also replay specific user journeys (at most 6) — that is the only way to assert exact texts or exact stored values. Returns { passed, smoke, scenarios, summary }. `passed` is false when any scenario fails or is unverified. Harness gaps are reported separately and never mean the bot is broken. A `summary` saying coverage is \"none\" means nothing was testable. Nothing is sent to real users and no state is written. An outside GET call no scenario fixture answers is answered from a recorded real response: one the server itself fetched for this application in the last 24 h (the endpoint check apply_actions runs), used only for exactly the same address and query values. `outsideCalls` says how many calls were answered that way, how many stayed coverage gaps, and when each answer was recorded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "flowIds": {
                "description": "Required. Ids of the ALREADY-APPLIED flows to test — normally the flows apply_actions just created or changed, taken from its idRemap. Flows they link into are compiled too but are not crawled as entries. Flows that link INTO them compile too and are crawled only for a requested flow with no trigger of its own (a flow opened from a menu button is tested through the flow that opens it); a requested flow nobody can start fails with a no_entry check.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "scenarios": {
                "description": "Optional user journeys to replay on top of the smoke crawl. Omit to run the smoke layer alone.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assume": {
                      "additionalProperties": false,
                      "description": "Simulator assumptions this journey runs under.",
                      "properties": {
                        "actors": {
                          "description": "actors: who the people of this scenario are when it starts, as a list of { id, platformId?, workspaceOwner?, tags? }. id is the as_contact id of the person, or \"$SELF\" for the default one. platformId is an exact numeric Telegram user id for bots that compare a literal id; omit it to derive a stable test id. workspaceOwner: true makes that person the workspace's REAL owner: the simulator gives them the owner's own Telegram id (the one in the workspace facts), so {{sysvar|isWorkspaceOwner}} is true for them and false for everyone else, and a message for the owner reaches them; leave platformId out for that person. A send to the owner's id or @username is a send to the owner, never to \"another user\". When no owner has linked Telegram, nobody is the owner and the owner checks fail naming the Connect Telegram step: that is expected, not a bug to fix. tags are the tag NAMES they carry, as {{sysvar|tags}} lists them. A tag or an owner is never set with seed_var.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "id": {
                                "description": "The as_contact id of the person, or \"$SELF\" for the default one.",
                                "type": "string"
                              },
                              "platformId": {
                                "description": "Exact numeric Telegram user id, for example the id a legacy admin gate compares against.",
                                "pattern": "^[1-9]\\d{0,15}$",
                                "type": "string"
                              },
                              "tags": {
                                "description": "Tag NAMES this person carries when the scenario starts.",
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "telegramMembership": {
                                "description": "What getChatMember reports for this actor; overrides the scenario-wide membership.",
                                "enum": ["member", "not_member"],
                                "type": "string"
                              },
                              "workspaceOwner": {
                                "description": "true: this person is an owner of the workspace ({{sysvar|isWorkspaceOwner}} is true for them only).",
                                "type": "boolean"
                              }
                            },
                            "required": ["id"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "aiOutput": {
                          "description": "The exact text EVERY AI step answers in this scenario. No AI runs in the simulator: unset, AI steps answer \"[AI output]\", so a condition comparing the AI-written variable takes its NO branch and a failure behind it is reported as inconclusive. Pin the value the branch under test compares against (e.g. \"hot\"). It does NOT steer an AI assistant block (AI_TOOL_ROUTER): to take one of its exits, set aiChooses on the send step the block answers.",
                          "type": "string"
                        },
                        "httpResponses": {
                          "description": "Mock outside HTTP calls for this scenario. These are local responses; no request is sent to the service.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "body": {
                                "description": "JSON body returned to the bot code."
                              },
                              "method": {
                                "description": "Optional uppercase HTTP method to match.",
                                "type": "string"
                              },
                              "networkError": {
                                "description": "Reject the request with this transport error instead of returning an HTTP response.",
                                "type": "string"
                              },
                              "requestBodyContains": {
                                "description": "Optional literal substring required in the outgoing request body.",
                                "minLength": 1,
                                "type": "string"
                              },
                              "status": {
                                "maximum": 599,
                                "minimum": 100,
                                "type": "integer"
                              },
                              "times": {
                                "description": "Answer at most this many matching calls, then use the next fixture.",
                                "exclusiveMinimum": 0,
                                "type": "integer"
                              },
                              "urlPattern": {
                                "description": "Substring of the outgoing URL to match.",
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["urlPattern"],
                            "type": "object"
                          },
                          "maxItems": 12,
                          "type": "array"
                        },
                        "telegramMembership": {
                          "description": "What a Telegram membership gate reports. Default \"member\".",
                          "enum": ["member", "not_member"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "description": "Short unique slug for this scenario, e.g. \"buy_premium\". The report keys its lines off it.",
                      "type": "string"
                    },
                    "steps": {
                      "description": "Ordered steps, alternating an ACTION with an ASSERTION about the reply to the action right before it. When accepted checks are supplied, use {\"do\":\"expect_check\",\"checkId\":\"<accepted id>\"} for their outcomes; the server selects the observation channel. Optional contains:[\"literal journey value\"] strengthens message/notification checks only. An expect_check about someone other than the acting person (an outcome for person \"other\") needs \"other\": \"<as_contact id>\", the id that person has in this scenario (\"$SELF\" is the first person, once another one acts), or \"<numeric chat id>\" of the channel or group the bot posts to — the same value the scenario seeded into the bot's chat-id variable, with no as_contact for a chat; e.g. {\"do\":\"start\",\"command\":\"/start\"}, {\"do\":\"tap\",\"button\":\"Apply\"}, {\"do\":\"as_contact\",\"id\":\"admin\"}, {\"do\":\"tap\",\"button\":\"Approve\"}, {\"do\":\"expect_check\",\"checkId\":\"c2\",\"other\":\"$SELF\"}. Each step is one object keyed by `do`: {\"do\":\"start\",\"command\":\"/start\"}, {\"do\":\"send\",\"text\":\"...\"}, {\"do\":\"send\",\"text\":\"...\",\"aiChooses\":\"<exit name>\"} (the AI assistant block answering this message takes that exit: an intent or tool name as the block lists it, or \"no_match\" / \"frustration\" — no AI runs in tests, so without aiChooses the block only chats and no branch behind an exit runs), {\"do\":\"send_media\",\"kind\":\"photo\"|\"video\"|\"audio\"|\"document\",\"caption\":\"...\"}, {\"do\":\"tap\",\"button\":\"<substring of the label>\"}, {\"do\":\"pay\"}, {\"do\":\"abandon_payment\",\"text\":\"...\"}, {\"do\":\"resume_delays\"}, {\"do\":\"simulate_event\",\"event\":\"member_join\"|\"join_request\"}, {\"do\":\"expect\",\"anyOf\":[\"verbatim fragment the bot really sends\"],\"not\":[\"text that must NOT appear\"]} (expect needs anyOf: a list of at least one verbatim fragment of what the bot sends after the action right before it; not (texts that must NOT appear) is optional and is checked only beside anyOf, because an expect with only not passes when the bot says nothing; a text in anyOf or not that the bot cannot send is removed: a {{…}} template, an internal id (no spaces, joined by _ . : or -), and, when the bot's texts are known, a button label or words it never writes; a removed text makes the scenario an invalid test), {\"do\":\"expect_var\",\"name\":\"<variable handle>\",\"contains\":\"...\",\"changed\":true}, {\"do\":\"seed_var\",\"name\":\"...\",\"value\":\"...\"} (seed_var value \"$SELF\" becomes the simulated user id, for a gate that compares the user id with a stored owner-id variable; a workspace-owner or tag gate is opened with assume.actors, never with seed_var), {\"do\":\"as_contact\",\"id\":\"user_b\"} (every later step acts as a SECOND person — for anything two people do together: one builds or sends, the other sees it; after the switch that person sees what the bot sent them earlier and can tap its buttons, and cannot tap a button on another person's screen), {\"do\":\"expect_peer_message\",\"to\":\"user_b\",\"contains\":\"...\",\"mediaType\":\"IMAGE\"} (mediaType is optional; assert proof photos/files on the same peer message), {\"do\":\"expect_http_request\",\"urlContains\":\"/orders\",\"method\":\"POST\",\"bodyContains\":\"orderId\",\"count\":1} (assert the outgoing request; method, bodyContains and count are optional). A scenario with no expect / expect_var / expect_peer_message step asserts nothing. At most 15 steps; malformed or truncated steps make the scenario an invalid test, never a pass.",
                      "items": {
                        "additionalProperties": {},
                        "type": "object"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "title": {
                      "description": "One line saying what the scenario checks — shown in the report.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "steps", "title"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["flowIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run flow autotest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ad82ab057a5e715e64d3a1b64e8bcbc4b34aab4ea688ae9659e8c67402c2a16a"
        },
        {
          "name": "save_tribute_product",
          "description": "Set up a product of the connected Tribute account for sale in this application, or change one already set up (one saved product per Tribute product, so calling it again updates). Requires manage_automation. Returns the saved product; its id is the productBindingId of a Payment block with provider TRIBUTE. A purchase always runs the Paid branch of that block; adding a number to a contact variable is optional. Once the product is published, what it adds is fixed (TRIBUTE_IMMUTABLE_BENEFIT): to change it the owner creates a new product in Tribute. Messages stay editable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addsToVariable": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "description": "Positive whole number added once per purchase and taken back on a refund.",
                        "type": ["string", "number"]
                      },
                      "variablePersistentId": {
                        "description": "A number contact variable: numberVariables[].variablePersistentId from get_tribute_setup.",
                        "type": "string"
                      }
                    },
                    "required": ["amount", "variablePersistentId"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional balance top-up (credits, days, lessons). Omit to keep what is saved (nothing for a new product). null removes it. When set, the Paid branch must not add the same number again."
              },
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "messages": {
                "description": "The owner's own messages to the buyer, per language. Omit to keep the saved ones; an array REPLACES all of them, and [] goes back to the built-in texts, which reach each buyer in their own language. Plain text up to 3000 characters; {product}, {price}, {amount}, {currency} and {added} are filled in. Leave out unless the owner wants their own wording.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "language": {
                      "description": "Bot content language tag, e.g. \"en\".",
                      "type": "string"
                    },
                    "paid": {
                      "description": "Sent after a verified payment. Empty or omitted means the built-in text.",
                      "type": ["string", "null"]
                    },
                    "refunded": {
                      "description": "Sent after a refund. Empty or omitted means the built-in text.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["language"],
                  "type": "object"
                },
                "type": "array"
              },
              "productId": {
                "description": "Required. The Tribute product id: products[].productId from list_tribute_account_products. It must be an approved digital product.",
                "type": "string"
              }
