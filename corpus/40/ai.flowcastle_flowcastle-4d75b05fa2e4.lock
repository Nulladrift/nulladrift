              }
            ]
          },
          "digest": "sha256:a3a76643f95374c8488f9cebf02412e773574e12b38b4cee6c09de9746a0003a"
        },
        {
          "name": "send_message",
          "description": "Send a message to ONE contact right now, outside any flow. For reaching many contacts use a broadcast instead. Target the contact with contactId (globally unique — preferred), or with platformId (the platform-side id, e.g. the Telegram user id). platformId is NOT globally unique: it is unique only per bot, so the same Telegram user talking to two of your bots is two contacts sharing one platformId. Pass botId alongside it whenever the application has more than one bot; without botId the call succeeds only if exactly one contact in the application matches, and otherwise fails listing the candidate bots. `{{var|name}}` placeholders in the text resolve against that contact's variable context. Requires the manage_broadcasts permission. Formatting: plain text by default, so tags arrive exactly as written. Pass parseMode \"HTML\" to send Telegram HTML (<b>, <i>, <u>, <s>, <code>, <pre>, <a href=\"…\">, <tg-spoiler>, <blockquote>; escape a literal <, > or & as &lt; &gt; &amp;); the flow tokens [[b]]…[[/b]], [[i]], [[u]] and [[a|url]]…[[/a]] work too. Values filled in from what people typed are escaped, so they show as text and never add formatting. HTML that Telegram cannot parse is sent once more as plain text with the tags removed. Telegram bots and web chat only (web chat: not with media); refused for Instagram, mail, Telegram user accounts and SDK bots. Markdown is never rendered. Media: pass up to 10 attachments as publicly reachable http(s) URLs; the text becomes the caption (max 1024 characters) and may be empty. Several attachments send as one album. The kind is inferred from the URL's file extension — override with type when the URL has none. Not supported for SDK bots or for Telegram user-account bots (telegram_mtproto, text only) — the call is rejected and nothing is sent. Buttons: up to 8, each carrying EXACTLY ONE destination — a `url` (http(s) or tg://) the recipient opens, or a `flowId`, an already-applied INTERACTIVE flow that runs for that recipient when they tap it. The two kinds mix freely in one keyboard, so a custom text with flow-wired buttons needs no wrapper flow. A flow button starts its flow from the start block with the recipient's own variable context, and re-runs on every tap. Broadcast and operation flows are rejected, as are flow buttons on SDK bots (taps never reach the runtime there). Buttons of either kind are rejected for telegram_mtproto bots: a user account cannot send buttons, so put the link in the text. To send a WHOLE flow as the message instead of wiring one behind a button, use send_flow_to_contacts. Buttons cannot be combined with media; send those as two messages. Delivery is asynchronous: a successful response means the bot accepted the send, not that the platform delivered it. A send that fails afterwards (a broken media URL, a contact that blocked the bot, a chat not found) is not returned here: it is written to the flow logs as an error row for that contact with action `direct_message` (read it with query_flow_logs or get_contact_activity), and no outgoing message is added to the transcript. Unsubscribed contacts and inactive bots are rejected. A telegram_mtproto bot (a Telegram user account) sends nothing until its owner turns on \"Sending from this account\" in the dashboard (Bot settings → Account). It is OFF for every newly connected account and no tool changes it. While it is off the call is rejected, except to the account's own Saved Messages (platformId \"me\"). Hand-off: pass expectReply true when a PERSON on the team wants the contact's answer, not the bot. The contact becomes a lead Waiting on them (a closed lead reopens) and their next messages go to Live Chat instead of the bot until the lead closes — by hand, or by the workspace's quiet close — and then the bot answers again. Needs leads switched on for the workspace; with leads off the call is rejected and nothing is sent. The result has handedToPerson and handoffNote; group and channel contacts are sent the message but stay with the bot. Omit it for messages the bot should keep handling. NOT idempotent and not reversible — each call sends another message to a real person, and a sent message cannot be recalled. Confirm the recipient and text with the user before calling, and never retry a timed-out call blindly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "botId": {
                "description": "Bot to send from. Required in practice when targeting by platformId in a multi-bot application; without it the call succeeds only if exactly one contact matches, and otherwise fails listing the candidate bots.",
                "type": "string"
              },
              "buttons": {
                "description": "Up to 8 buttons, rendered one per row under the message. Each needs exactly one of url or flowId; the two kinds may be mixed. Rejected together with media.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "flowId": {
                      "description": "Id of an already-applied INTERACTIVE flow to run for the recipient when they tap the button (from apply_actions' idRemap or get_application_context). Broadcast and operation flows are rejected. Set this OR url, never both.",
                      "type": "string"
                    },
                    "text": {
                      "description": "Required. Label shown on the button.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Where the button leads — http(s) or tg:// only. Set this OR flowId, never both.",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "contactId": {
                "description": "Preferred way to target the recipient: the globally unique FlowCastle contact id. Supply either this or platformId.",
                "type": "string"
              },
              "expectReply": {
                "description": "Set true to hand the conversation to a person: the contact's answer goes to Live Chat, not the bot, until their lead closes. Needs leads on; rejected (nothing sent) when they are off.",
                "type": "boolean"
              },
              "media": {
                "description": "Up to 10 attachments. Several items send as one album with `text` as the shared caption.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "filename": {
                      "description": "Filename shown for DOCUMENT sends. Defaults to the URL's basename.",
                      "type": "string"
                    },
                    "type": {
                      "description": "Attachment kind. Inferred from the URL's file extension when omitted (.mp3/.m4a/.aac/.wav/.flac → AUDIO, a music track; .ogg/.oga/.opus → VOICE, a voice note); unrecognized extensions fall back to DOCUMENT.",
                      "enum": ["IMAGE", "IMAGE_URL", "VIDEO", "VIDEO_NOTE", "DOCUMENT", "VOICE", "AUDIO", "STICKER"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Required. Publicly reachable http(s) URL of the file; the platform downloads it from there.",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "parseMode": {
                "description": "Set to \"HTML\" to send the text (or caption) as Telegram HTML. Omit for plain text.",
                "enum": ["HTML"],
                "type": "string"
              },
              "platformId": {
                "description": "Platform-side user id (e.g. the Telegram user id). NOT globally unique — unique only per bot — so pass botId alongside it when the application has more than one bot.",
                "type": "string"
              },
              "text": {
                "description": "Message body. Required unless media is passed; with media it becomes the caption (max 1024 characters) and may be omitted. `{{var|name}}` placeholders resolve against the recipient's variable context. Plain text unless parseMode is \"HTML\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send message to one contact"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["workspace"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:668fd31a02629598593eea789d77769c70d9df952a02a58c286eaa4ecf21bbed"
        },
        {
          "name": "set_watched_groups",
          "description": "Replace a telegram_mtproto userbot's watched-groups list — the chats it monitors. Requires the manage_settings permission. SET semantics: send the COMPLETE desired list every time (call list_watched_groups first and include existing entries you want to keep — omitting one removes it). Each entry needs a chatId (e.g. \"-100…\") or a public username/t.me link, and it must be a group or channel the account has JOINED. Every entry is checked against the account before saving: a username no chat has, a chat the account is not in, or a person/bot refuses the WHOLE list with MTPROTO_WATCHED_INVALID naming each bad row (nothing is saved) — fix the spelling or join the chat with the account, then resend. Confirmed rows come back with checkStatus \"ok\" and their chat id and title filled in; when the userbot cannot answer (offline) the list is saved and rows come back \"unverified\". The running userbot picks the change up within a few minutes, no restart. An empty list means \"watch every joined chat\" — NOT \"watch nothing\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "botId": {
                "description": "The telegram_mtproto bot. Omit when the application has exactly one userbot.",
                "type": "string"
              },
              "groups": {
                "description": "The complete replacement list. Empty array = watch every joined chat.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "chatId": {
                      "description": "Marked chat id (e.g. \"-1004441063705\") of a chat the account is in. Supply this or username.",
                      "type": "string"
                    },
                    "mode": {
                      "description": "Always \"joined\" (the default, may be omitted): a chat the account is a member of. No other mode exists.",
                      "enum": ["joined"],
                      "type": "string"
                    },
                    "title": {
                      "description": "Optional display label shown in the dashboard panel.",
                      "type": "string"
                    },
                    "username": {
                      "description": "Public @username or t.me link of a chat the account is in. Supply this or chatId.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["groups"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set watched groups"
