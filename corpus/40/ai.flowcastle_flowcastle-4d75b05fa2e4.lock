          "description": "Read what customers ANSWERED in this workspace's surveys. A survey is any flow marked isSurvey: its choice questions record which option each contact tapped, and its free-text questions store the reply the contact typed. Called with NO flowId it lists every survey flow with how many people it reached, how many answered, the response rate and how many wrote a free-text answer. Called with a flowId it returns that survey per question: every option with its share of the people who answered it, and the written answers in the customers' own words. These are stated reasons, not inferred ones — the strongest evidence available for what to change, and far stronger than a dropoff rate, which only shows where people stopped and never why. Counts are DISTINCT contacts. Read-only, computed on demand over the last 30 days unless you pass days.",
