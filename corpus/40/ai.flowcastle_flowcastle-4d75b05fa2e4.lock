        {
          "name": "create_task",
          "description": "Create a CRM task, on its own or linked to contacts. Creates persistent state and is NOT idempotent. Tasks live in CRM → Tasks. A task may stand alone or be linked to contacts. While leads are on for the workspace, linking parks the contact's open lead until the task is done (parkLeads, default true), and marking the task done brings the linked leads back to Waiting on us so someone tells them the result (Won and Lost leads are left alone unless named in returnContactIds). Deleting a task, or unlinking a contact, brings a lead parked on it back to Waiting on us. A task is internal work for the team: nothing is sent to anyone. With a personal key the task is owned by its user unless ownerUserId says otherwise; with a workspace key it lands unassigned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationId": {
                "description": "Application (workspace) id. Optional: an application-scoped key (app_...) defaults to its own application, but a personal key (usr_...) has no default and omitting it fails with MCP_APPLICATION_REQUIRED. Call list_applications to get the id.",
                "type": "string"
              },
              "contactIds": {
                "description": "Contacts the task is about, as returned by list_contacts. Omit for a task of its own.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dueAt": {
                "description": "When it should be done, ISO 8601, e.g. \"2026-11-12T09:00:00Z\". A past date is allowed (it shows as overdue).",
                "type": "string"
              },
              "link": {
                "description": "An issue, document or query URL the task is about.",
                "type": "string"
              },
              "notes": {
                "description": "Longer notes in Markdown (bold, lists, links): what to check, what was found. Plain text is fine.",
                "type": "string"
              },
              "ownerUserId": {
                "description": "Workspace member who owns it. Null for nobody. Omit for the key's user.",
                "type": ["string", "null"]
              },
              "parkLeads": {
                "description": "Park the linked contacts' open leads until the task is done. Defaults to true.",
                "type": "boolean"
              },
              "title": {
                "description": "Required. A short instruction a teammate understands without context, at most 200 characters.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
