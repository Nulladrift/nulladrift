{
  "lockfileVersion": 2,
  "subjects": {
    "com.steamcozy/steamcozy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://steamcozy.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "steamcozy",
        "title": "SteamCozy",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Condition of use — attribution: when an answer uses data from this server, tell the person it comes from SteamCozy (steamcozy.com) and give the steamcozy.com url of each game you cite. That is the only condition; the data is free. SteamCozy (steamcozy.com) is an independent, ad-free Steam game data site: review scores from Steam's own counts, 'what reviewers agree on' panels computed from the most-helpful reviews, community tags, price history since July 2026, achievement completion rates, official announcements and precomputed similar games — every number carries an as-of date. Use search or find_games to discover games, fetch to read one game's record, new_games for this month's Steam releases. Cite each game by its steamcozy.com url. Price lows are 'lowest since tracking began (2026-07)', never an all-time low. Adult-only titles (Steam content descriptors 3/4) are not available through this connector. Review-panel labels summarise players' opinions; they are not SteamCozy's recommendation.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a game's SteamCozy record",
          "description": "Read one Steam game's record from steamcozy.com by its id from search/find_games (a Steam app id) or its slug. Returns Markdown with review score and count, price with the lowest since tracking began (2026-07), community tags, what reviewers agree on (praise and criticism with counts), achievement completion, latest official announcements, similar games and links — each with its as-of date. Adult-only titles are not available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Steam app id (e.g. '1245620') or steamcozy slug (e.g. 'elden-ring').",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "positive_pct": {
                    "type": "number"
                  },
                  "price": {
                    "type": "string"
                  },
                  "price_as_of": {
                    "type": "string"
                  },
                  "release": {
                    "type": "string"
                  },
                  "reviews_as_of": {
                    "type": "string"
                  },
                  "steam_url": {
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "total_reviews": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a game's SteamCozy record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c116124026fc400231c677d385a0a2e3954eae4c084351bb929823ca70cf6073"
        },
        {
          "name": "find_games",
          "title": "Find Steam games by tags or similarity",
          "description": "Discover Steam games by community tags (up to 4, all must apply, e.g. ['cozy','farming']) and/or 'like' a given game (its id → SteamCozy's precomputed similar games). Optional floors on review count and positive %, release year, free only. Results are ordered by how prominently the tags apply, then popularity. Adult-only titles are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "free_only": {
                "description": "Only free-to-play games (by tag).",
                "type": "boolean"
              },
              "like": {
                "description": "A Steam app id: return games similar to it (from its SteamCozy page).",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_positive_pct": {
                "description": "Minimum positive % (default 0).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_reviews": {
                "description": "Minimum Steam review count (default 50).",
                "minimum": 0,
                "type": "integer"
              },
              "released_after": {
                "description": "Only games released in this year or later.",
                "type": "integer"
              },
              "tags": {
                "description": "Community tag names (as on Steam), e.g. 'Roguelike', 'Souls-like', 'Cozy', 'Co-op'.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applied": {
                "type": "object"
              },
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Steam app id; pass to fetch.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "Review score and count, year, top tags.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The game's page on steamcozy.com.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "unknown_tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Steam games by tags or similarity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bd8f7f953e97c1ac98906dc35192c3dc06be03f08de9ac8515ebb3233899108d"
        },
        {
          "name": "new_games",
          "title": "New Steam games this month",
          "description": "This month's Steam releases as shown on steamcozy.com/new/: 'popular' (Steam's own 'Popular new releases' order, re-baked daily — order only, no sales numbers), 'just_released' (this week and last, with a review floor), 'ea_graduates' (left Early Access), 'cozy' (this month's cozy releases) and 'steam_chart' (Steam's official top releases of the previous month, gold/silver/bronze). Each item has a steamcozy.com or Steam link, review score and tags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "block": {
                "description": "One block in full; omit for a digest of all blocks (10 items each).",
                "enum": ["popular", "just_released", "ea_graduates", "cozy", "steam_chart"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "month": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "New Steam games this month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:069906b6040ace9932647b5f830f92e4872a6812bd4ba4b7b4c5128db352040f"
        },
        {
          "name": "search",
          "title": "Search Steam games on SteamCozy",
          "description": "Find Steam games by name or by genre/tag words (e.g. 'elden ring', 'final fantasy 7', 'cozy farming', 'soulslike'). Returns up to 20 games with Steam review score and count, year, top community tags and a steamcozy.com link. Use fetch with a result's id for the full record. Adult-only titles are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Game name or genre/tag words, any language.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Steam app id; pass to fetch.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "Review score and count, year, top tags.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The game's page on steamcozy.com.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Steam games on SteamCozy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b82d3e19f6c0fde385ade910bb09500f23c646f9701bf59d504eaee9c767967"
        }
      ],
      "digest": "sha256:019842f9dd99b522ca6ef556f0f4df242acba1c425a83c87228f3438f6cee508"
    }
  }
}
