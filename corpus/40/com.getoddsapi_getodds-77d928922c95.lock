{
  "lockfileVersion": 2,
  "subjects": {
    "com.getoddsapi/getodds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getoddsapi.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "getodds",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only sports data. Player-stat thresholds are not sportsbook prices. DraftKings data is retained via ESPN. Keep source IDs and timestamps; do not infer missing outcomes or fabricate unavailable data. Metadata calls use request allowance but zero credits; successful data calls use one credit. These tools are bounded reads; for pushed live odds changes from six books, a server can connect to the WebSocket wss://stream.getoddsapi.com/v1/stream with the same key (https://getoddsapi.com/docs/websocket).",
      "tools": [
        {
          "name": "get_bet365_markets",
          "description": "Read bet365 pregame prices: moneyline, spread, total and team total for NFL, NCAAF, NBA, NCAAB, NHL and MLS, and match result, double chance, goal line and goalscorer markets for EPL, Bundesliga, Serie A, Ligue 1 and the Champions League, in American, decimal and fractional odds. Not bet365’s own feed: bet365 prices republished from public odds aggregators, US leagues re-read as often as every 60 seconds; each row names its republisher. Goalscorer markets need market=. Available to every key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event_id": {
                "pattern": "^(an|espn)-[0-9A-Za-z]{1,30}$",
                "type": "string"
              },
              "league": {
                "default": "NFL",
                "enum": ["NFL", "NCAAF", "NBA", "NCAAB", "NHL", "MLB", "MLS", "EPL", "BUNDESLIGA", "SERIE_A", "LIGUE_1", "UCL", "LA_LIGA"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "enum": ["moneyline", "spread", "total", "team_total", "match_result", "double_chance", "goal_line", "anytime_goalscorer", "first_goalscorer", "last_goalscorer"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:54eab9dc065b6b052960cd242a0819325bd0e3bd52efe0b9be17cab3bc2ef528"
        },
        {
