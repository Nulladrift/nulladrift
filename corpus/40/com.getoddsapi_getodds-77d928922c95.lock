          "description": "Read native BetRivers US-PA pregame priced markets. League NBA(default),NFL,NHL or native event_id, not both; market_id requires event_id. Explicit betrivers grant and selected bookmaker required. Independent native decimal/American prices, changedDate clocks, partial capture, no settlement or cross-book equivalence.",
