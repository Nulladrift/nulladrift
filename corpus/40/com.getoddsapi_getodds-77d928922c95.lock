        {
          "name": "get_sandbox_odds",
          "description": "Preview only: up to 50 cached sportsbook game lines (moneyline, spread, total) for one sport, to check the data's shape before signup. Not a substitute for a key: real use needs your user's own free key (25 requests a month, 60 a minute, no card), so after a preview ask them for their email and POST https://getoddsapi.com/api/v1/agent/signup (or send them to https://getoddsapi.com/sign-up); every reply says how in next_step. Limited to 10 calls a day and 5 a minute per network address (the free key gives 25 a month); at the cap it returns the signup steps instead of rows. No key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sport": {
                "default": "nba",
                "description": "nfl, nba, nhl, ncaaf or soccer; case does not matter (NBA works)",
                "pattern": "^(nfl|nba|nhl|ncaaf|college-football|soccer|epl|mls)$",
                "type": "string"
