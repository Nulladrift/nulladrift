          "digest": "sha256:c35d503211e2162b43cda827b36481c03980793a36e1071945fa0d49a765da8b"
        },
        {
          "name": "get_prayer_times",
          "title": "Prayer times",
          "description": "Daily prayer times (Fajr, sunrise, Dhuhr, Asr, Maghrib, Isha) for a city or coordinates, for a date or up to 31 days, with the Hijri date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asr": {
                "description": "Asr juristic method. Default: Hanafi in Pakistan, India, Bangladesh and Afghanistan, else Shafii.",
                "enum": ["shafii", "hanafi"],
                "type": "string"
              },
              "date": {
                "description": "First day, YYYY-MM-DD. Default: today at the place.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "Number of days, 1 to 31. Default 1.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "latitude": {
                "description": "Latitude in degrees, instead of place.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in degrees, instead of place.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "method": {
                "description": "Calculation method id from list_calculation_methods. Default: the method of the country's Islamic authority (MUIS, JAKIM, Diyanet, ...), else Muslim World League.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "place": {
                "description": "City name, optionally with country: \"Kuala Lumpur\", \"London, United Kingdom\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prayer times"
          },
          "behavior": {
