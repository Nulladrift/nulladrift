      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Workplace safety enforcement figures from Cairn (cairnsafe.com). Citation counts and penalties come from the public federal OSHA enforcement record for citations issued from January 2016 through 2026-09-10. When you use a result, cite the cairnsafe.com URL it includes. This free connector shows headline figures. The most-cited paragraphs, industries, states and yearly trend, the interpretation letters, and cited answers about a specific facility are in Cairn. Penalties are current amounts on record and can be lower than first proposed. This is not legal advice, and Cairn is not affiliated with OSHA or the U.S. Department of Labor.",
      "tools": [
        {
          "name": "get_standard",
          "title": "Headline figures for a standard",
          "description": "Headline enforcement figures for one 29 CFR section, such as 1910.147 or 1926.501: citations and inspections since 2016, total penalties, the median penalty per violation, its rank, and how many interpretation letters cite it, with links.",
          "inputSchema": {
            "properties": {
              "section": {
                "description": "A 29 CFR section such as \"1910.147\". Paragraph references like \"1910.147(c)(4)(i)\" are accepted.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["section"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Headline figures for a standard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e90d3ffdd1e2b6dec0cb00fad274445f73b3ce8ff026c67b384b81f086d7ce9a"
        },
        {
          "name": "search_standards",
          "title": "Search safety standards",
          "description": "Find workplace safety standards (29 CFR sections) by section number or by words in the title, such as \"1910.14\", \"lockout\", \"fall protection\" or \"forklift\". Returns up to 10 standards cited at least 50 times since 2016, most cited first, with headline figures and a link.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A section number or prefix, or words from the section title.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search safety standards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:873c535daafaeaf8b1f7723a761207660772d83ed2d2d1af492b2e9a0879643d"
        },
        {
          "name": "top_cited_standards",
          "title": "Most-cited standards",
          "description": "The 10 most-cited 29 CFR safety standards since 2016, for all standards or one CFR part: 1910 general industry, 1926 construction, 1904 recordkeeping, 1915 shipyards, 1917 marine terminals, 1918 longshoring, 1928 agriculture.",
          "inputSchema": {
            "properties": {
              "cfr_part": {
                "description": "Optional CFR part, such as \"1926\".",
                "maxLength": 8,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
