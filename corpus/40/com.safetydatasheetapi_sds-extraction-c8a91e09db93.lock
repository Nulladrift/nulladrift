{
  "lockfileVersion": 2,
  "subjects": {
    "com.safetydatasheetapi/sds-extraction": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://safetydatasheetapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "safetydatasheetapi",
        "title": "SafetyDataSheetAPI",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Extracts Safety Data Sheet (SDS/MSDS) PDFs into normalized 16-section JSON, with a confidence score and warnings. Use extract_sds for one document; use submit_bulk_extraction then get_bulk_job for up to 10 documents. Each document is billed from the account's prepaid credit (see get_account for the balance and price; a failed extraction is not billed, and a 402 insufficient_credit error means credit must be added). Route results with warnings or a low confidence_score to human review before using them for compliance decisions. Documentation: https://safetydatasheetapi.com/api-docs/",
      "tools": [
        {
          "name": "extract_sds",
          "title": "Extract one SDS",
          "description": "Extract one Safety Data Sheet PDF into a normalized 16-section record (product identification, hazards, composition, first aid, transport, regulatory, and more) plus a confidence_score and warnings. Provide the PDF as file_url (a public https URL) or file_base64. Billed per document from prepaid credit (failures are not billed). Requires an API key.",
          "inputSchema": {
            "oneOf": [
              {
                "required": ["file_url"]
              },
              {
                "required": ["file_base64"]
              }
            ],
            "properties": {
              "file_base64": {
                "description": "Base64-encoded SDS PDF bytes (use for small files).",
                "type": "string"
              },
              "file_url": {
                "description": "Public https URL of the SDS PDF.",
                "format": "uri",
                "type": "string"
              },
              "filename": {
                "description": "Optional file name, for example acetone-sds.pdf.",
                "type": "string"
              },
              "include_formats": {
                "description": "Also return the XML and/or CSV renderings. Omitted by default to keep results compact.",
                "items": {
                  "enum": ["xml", "csv"],
                  "type": "string"
                },
                "type": "array"
              },
              "language_hint": {
                "description": "Optional language hint such as en, de, fr.",
                "type": "string"
              },
              "schema_version": {
                "description": "Optional output schema version.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Extract one SDS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5161d2c1b044d87168b44969caa6b2fd29ab0255bace678fa51e5cf9bbe83ac"
        },
        {
          "name": "get_account",
          "title": "Get account balance and usage",
          "description": "Get the prepaid credit balance, price per document, and the last 30 days of usage for the account that owns the API key. Read-only. Requires a per-customer API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get account balance and usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a81939a2b3ffd301ef439115c923fdc8c1c162921f73a175b712c33e2de389ef"
        },
        {
          "name": "get_bulk_job",
          "title": "Get bulk job status",
          "description": "Get the status and per-file results of a bulk extraction job created by submit_bulk_extraction. Read-only and safe to repeat. Requires an API key.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job_id returned by submit_bulk_extraction.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get bulk job status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9b646bb6d26e54a226f0cb7d591e69712606e2c4f0b19702a1125244577cc61"
        },
        {
          "name": "submit_bulk_extraction",
          "title": "Submit a bulk extraction job",
          "description": "Submit up to 10 SDS PDFs (public https URLs) as one asynchronous job. Returns a job_id; poll get_bulk_job until status is completed or failed. Reuse the same idempotency_key when retrying so no duplicate job is created. Billed per document from prepaid credit, reserved up front and released for any file that fails. Requires an API key.",
          "inputSchema": {
            "properties": {
              "callback_url": {
                "description": "Optional https URL that receives a signed webhook when the job finishes.",
                "format": "uri",
                "type": "string"
              },
              "file_urls": {
                "description": "Public https URLs of SDS PDFs.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Caller-chosen unique key; a repeat returns the existing job.",
                "type": "string"
              },
              "language_hint": {
                "type": "string"
              },
              "schema_version": {
                "type": "string"
              }
            },
            "required": ["file_urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a bulk extraction job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64bb8cdc382e85a5b0a83377204848c78a90e992a15b119568eb4f2a8196f788"
        }
      ],
      "digest": "sha256:a53ffebd5868a3849c63188d5a1e6355fb787a5d5c3a0316a62403e2416e3d5d"
    }
  }
}
