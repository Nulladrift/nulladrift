{
  "lockfileVersion": 2,
  "subjects": {
    "ai.yourmelody/song-gifts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.yourmelody.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "YourMelody",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_song_samples",
          "title": "Find YourMelody sample songs",
          "description": "Find published sample tracks by occasion, recipient, or genre. Every result is an existing English-language recording. Ask before broadening filters when no samples match.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "genre": {
                "enum": ["acoustic_pop", "piano_ballad", "rnb_soul", "country", "upbeat_pop", "rock", "hip_hop", "indie_folk", "hymn_gospel", "kids_party", "gentle_kids"],
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "enum": ["birthday", "anniversary", "christmas", "valentines", "mothers_day", "fathers_day", "love", "wedding", "graduation", "new_baby", "retirement", "thank_you", "just_because", "memorial"],
                "type": "string"
              },
              "recipient": {
                "enum": ["partner", "child", "friend", "parent", "grandparent", "sibling", "someone"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "samples": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "audioUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "genre": {
                      "enum": ["acoustic_pop", "piano_ballad", "rnb_soul", "country", "upbeat_pop", "rock", "hip_hop", "indie_folk", "hymn_gospel", "kids_party", "gentle_kids"],
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "isSample": {
                      "const": true,
                      "type": "boolean"
                    },
                    "language": {
                      "const": "en",
                      "type": "string"
                    },
                    "listenUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "occasion": {
                      "enum": ["birthday", "anniversary", "christmas", "valentines", "mothers_day", "fathers_day", "love", "wedding", "graduation", "new_baby", "retirement", "thank_you", "just_because", "memorial"],
                      "type": "string"
                    },
                    "recipient": {
                      "enum": ["partner", "child", "friend", "parent", "grandparent", "sibling", "someone"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["audioUrl", "genre", "id", "isSample", "language", "listenUrl", "occasion", "recipient", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["samples"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:660173da4f7fd25af9c164d96cef9635221c4e6c18872febf7feef5ccce4c7d8"
        },
        {
          "name": "prepare_song_brief",
          "title": "Prepare a song gift brief",
          "description": "Organize a personalized song gift and suggest a musical style. Use general details and leave names, contact details, and private stories for the website.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "pattern": "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,4})?$",
                "type": "string"
              },
              "memory": {
                "description": "A non-sensitive shared memory. Save names and private details for the website.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "What you want them to hear. Leave sensitive details for the website.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "occasion": {
                "enum": ["birthday", "anniversary", "christmas", "valentines", "mothers_day", "fathers_day", "love", "wedding", "graduation", "new_baby", "retirement", "thank_you", "just_because", "memorial"],
                "type": "string"
              },
              "recipient": {
                "enum": ["partner", "child", "friend", "parent", "grandparent", "sibling", "someone"],
                "type": "string"
              },
              "traits": {
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["occasion", "recipient"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "properties": {
                  "details": {
                    "additionalProperties": false,
                    "properties": {
                      "message": {
                        "maxLength": 300,
                        "minLength": 1,
                        "type": "string"
                      },
                      "moment": {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "language": {
                    "type": "string"
                  },
                  "occasion": {
                    "enum": ["birthday", "anniversary", "christmas", "valentines", "mothers_day", "fathers_day", "love", "wedding", "graduation", "new_baby", "retirement", "thank_you", "just_because", "memorial"],
                    "type": "string"
                  },
                  "recipient": {
                    "enum": ["partner", "child", "friend", "parent", "grandparent", "sibling", "someone"],
                    "type": "string"
                  },
                  "traits": {
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["details", "language", "occasion", "recipient"],
                "type": "object"
              },
              "copyableBrief": {
                "type": "string"
              },
              "createUrl": {
                "format": "uri",
                "type": "string"
              },
              "nextQuestions": {
                "items": {
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "suggestedStyle": {
                "additionalProperties": false,
                "properties": {
                  "genre": {
                    "enum": ["acoustic_pop", "piano_ballad", "rnb_soul", "country", "upbeat_pop", "rock", "hip_hop", "indie_folk", "hymn_gospel", "kids_party", "gentle_kids"],
                    "type": "string"
                  },
                  "mood": {
                    "enum": ["playful", "happy_tears", "celebratory", "romantic", "warm_remembrance", "peaceful", "grateful"],
                    "type": "string"
                  },
                  "voice": {
                    "enum": ["female", "male"],
                    "type": "string"
                  }
                },
                "required": ["genre", "mood", "voice"],
                "type": "object"
              }
            },
            "required": ["brief", "copyableBrief", "createUrl", "nextQuestions", "suggestedStyle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:793d5f7f0d06be0fc626850807269ddafd905796f1c7d9e83bfd3b853bb1f374"
        }
      ],
      "digest": "sha256:f7734d5dfb0351df30a995a682274250faf29a1a3a09fbb8ade58180cac24e4e"
    }
  }
