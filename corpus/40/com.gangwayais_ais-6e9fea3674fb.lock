        {
          "name": "port_vessels",
          "title": "Expected, in port, arrived, departed",
          "description": "A port's list of vessels: expected (bound for it), in port now, arrived or departed over the last 7 days. Filter by kind, flag and length. Credits: 1 per vessel returned. Needs a paid plan: a paid Watch plan, or the Data API by agreement (write to desk@gangwayais.com).",
