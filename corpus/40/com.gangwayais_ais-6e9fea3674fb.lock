        {
          "name": "check_route",
          "title": "Check a passage",
          "description": "Check a planned route leg by leg against land, depth (her draught plus the under-keel clearance), sea room and the traffic separation schemes, with plain-language warnings for what it finds. A planning aid: it finds what our charts and data show, never everything; not for navigation. At most 30 a minute. Credits: 10. Needs a paid plan: a paid Watch plan, or the Data API by agreement (write to desk@gangwayais.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "air_draught_m": {
                "description": "Her air draught in metres",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "beam_m": {
                "description": "Her beam in metres",
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              },
              "draught_m": {
                "description": "Her draught in metres",
                "maximum": 30,
                "minimum": 0.1,
                "type": "number"
              },
              "length_m": {
                "description": "Her length overall in metres",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              },
              "sea_room_nm": {
                "description": "Sea room to keep off danger, in nautical miles",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "ukc_m": {
                "description": "Under-keel clearance to keep, in metres",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "waypoints": {
                "description": "The route's turning points in order, each [lat, lon]",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "maxItems": 200,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["waypoints"],
            "type": "object"
          },
