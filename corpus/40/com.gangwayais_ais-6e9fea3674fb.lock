        {
          "name": "port_events",
          "title": "Port events",
          "description": "Recent events from AIS: arrivals, departures, anchoring, weighing anchor and approaches by default; also pilot, tug, bunkering, waiting, renamed and more. Optionally inside a box (at most 400 square degrees). Since defaults to the last 24 hours, at most 30 days back. Credits: 1 per event. Needs a paid plan: a paid Watch plan, or the Data API by agreement (write to desk@gangwayais.com).",
