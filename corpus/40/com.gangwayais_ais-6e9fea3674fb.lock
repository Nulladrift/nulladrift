        {
          "name": "get_vessel",
          "title": "Vessel now",
          "description": "One vessel now: her last position, speed, course, heading and navigational status from a source we may pass on, with her particulars (name, IMO, call sign, type, size, flag) and voyage (destination, ETA, draught). Give her MMSI, or her IMO number (then she is found by search first, 1 credit more). Credits: 1. Free accounts too: their answers are 24 hours behind, with a box of at most 1 square degree and 1,000 credits a month; paid plans are live.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "imo": {
                "description": "The vessel's IMO number, seven digits",
                "maximum": 9999999,
                "minimum": 1000000,
                "type": "integer"
              },
              "mmsi": {
                "description": "The vessel's MMSI, nine digits",
                "maximum": 999999999,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
