      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gangway AIS answers about vessels and ports from licensed AIS sources: where a vessel is now and where she has been, vessels in an area or near a point, a port's picture (expected, in port, at anchor), arrivals and departures, port calls, waiting times at anchor, congestion, events, sanctions checks, depth and passage routes. Use search_vessels to turn a vessel's name into an MMSI, and give ports by UN/LOCODE or name. Every tool needs a Gangway AIS key: a free account's key answers search_vessels, get_vessel, vessels_in_area, vessels_near, search_ports, resolve_destination, port_now, data_sources and account_usage (24 hours behind), the rest need a paid plan. Each answer costs the API's credits and says what it used and what is left this month. When an answer holds less than our chart shows, it says why and gives the chart's link: pass that link on. Answers carry the sources' credits; show them with the data. AIS data can be missing, delayed or wrong: never use it for navigation.",
