        {
          "name": "port_calls_on_date",
          "title": "Calls on a day",
          "description": "The seagoing vessels alongside in a port on one UTC day (default today), with when each made fast and left. Reach back: as set in your Data API agreement. Credits: 1 per call. Needs a paid plan: a paid Watch plan, or the Data API by agreement (write to desk@gangwayais.com).",
