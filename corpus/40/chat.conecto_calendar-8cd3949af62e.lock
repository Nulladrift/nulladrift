        {
          "name": "calendar_save_meeting_type",
          "title": "Save a meeting type",
          "description": "Create or change a kind of meeting people can book, like a Cal.com event type. It gets its own booking page. Only the fields you pass change. With person it is on that person's own calendar. A business type can be hosted by people like a Cal.com team event, once you choose how (there is no default): round_robin gives each booking to one host free then (the highest priority, then the fewest of this type that month for their weight, then whoever was booked longest ago; fixed hosts join every meeting), collective needs every host free and invites them all. Hosts use their own calendars' hours and Google calendars, unless the type sets hours of its own. Each host keeps their own page, which lists the business types they take; a round robin booked there goes to them. Location kinds: video (a link), phone (we call the attendee), call_us (they call a number), in_person (an address), custom. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active": {
                "type": "boolean"
              },
              "ask_phone": {
                "enum": ["off", "optional", "required"],
                "type": "string"
              },
              "assignment": {
                "description": "How a business type's hosts take its bookings, required with hosts (no default): round_robin or collective; \"\" takes the hosts off, back to the business's own calendar.",
                "enum": ["", "round_robin", "collective"],
                "type": "string"
              },
              "buffer_after": {
                "maximum": 240,
                "minimum": 0,
                "type": "integer"
              },
              "buffer_before": {
                "maximum": 240,
                "minimum": 0,
                "type": "integer"
              },
              "days_ahead": {
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "hosts": {
                "description": "The people who take its bookings, replacing the list. Each is on the account; their calendar is made with their name if they have none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fixed": {
                      "description": "In every meeting (round robin).",
                      "type": "boolean"
                    },
                    "person": {
                      "maxLength": 254,
                      "type": "string"
                    },
                    "priority": {
                      "description": "Round robin: higher goes first (default medium).",
                      "enum": ["lowest", "low", "medium", "high", "highest"],
                      "type": "string"
                    },
                    "weight": {
                      "description": "Round robin: 200 takes twice the share of 100 (default 100).",
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["person"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "hours": {
                "description": "Its own weekly hours; leave out to use the calendar's (for hosts, each one's own).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "day": {
                      "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                      "type": "string"
                    },
                    "end": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$",
                      "type": "string"
                    },
                    "start": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$",
                      "type": "string"
                    }
                  },
                  "required": ["day", "end", "start"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "length_minutes": {
                "maximum": 480,
                "minimum": 5,
                "type": "integer"
              },
              "location": {
                "additionalProperties": false,
                "description": "Where it happens. google_meet gives each booking a Google Meet room of its own once the calendar that takes it is connected to Google (a video link on meet.google.com does the same); video is one fixed link, phone means you call them, call_us your number in value, in_person an address.",
                "properties": {
                  "kind": {
                    "enum": ["", "video", "google_meet", "phone", "call_us", "in_person", "custom"],
                    "type": "string"
                  },
                  "value": {
                    "maxLength": 500,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "max_per_day": {
                "description": "The most of this type a day; for a hosted type, each host's most.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "notice_minutes": {
                "description": "Minimum notice before a booking.",
                "maximum": 43200,
                "minimum": 0,
                "type": "integer"
              },
              "offer_confirmation_call": {
                "description": "Offer \"call me the day before to confirm\" on the form.",
                "type": "boolean"
              },
              "person": {
                "description": "Put it on this person's own calendar (their email) instead of the business's.",
                "maxLength": 254,
                "type": "string"
              },
              "phone_assistant_books_this": {
                "description": "What the phone assistant books when a caller asks (a business type).",
                "type": "boolean"
              },
              "questions": {
                "description": "Extra questions on the booking form: {label, type: text|long_text|select|checkbox|number|email|phone, required, options}.",
                "items": {
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "slot_interval": {
                "description": "Minutes between possible start times (default: the length).",
                "maximum": 480,
                "minimum": 5,
                "type": "integer"
              },
              "slug": {
                "description": "Its address on the booking page, e.g. \"intro-call\".",
                "pattern": "^[a-z0-9][a-z0-9-]{0,59}$",
                "type": "string"
              },
              "title": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a meeting type"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8984e9c5c35685d8cd9cf14ef08c9c470eade43515ef5b10a62662664a4bf538"
        },
        {
          "name": "calendar_save_routing_form",
          "title": "Save a routing form",
          "description": "Create or change a routing form, like Cal.com's: questions a visitor answers before booking, and routes that send them to a meeting type (for a round-robin type, perhaps only some of its hosts), another site, or a message. The first route whose conditions all hold wins; everyone else takes the fallback. It lives at its calendar's address beside the meeting types: cncto.co/book/<calendar>/<slug>. A question keyed name (text) or email (email) fills in the booking form. Only the fields you pass change. Each answer set is kept (calendar_list_routing_responses) and the bot hears of it (calendar.routed). Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active": {
                "type": "boolean"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "fallback": {
                "description": "Where everyone else goes, as a route's \"to\".",
                "type": "object"
              },
              "person": {
                "description": "Put it on this person's own calendar.",
                "maxLength": 254,
                "type": "string"
              },
              "questions": {
                "description": "{key, label, type: text|long_text|select|checkbox|number|email|phone, required, options}.",
                "items": {
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "routes": {
                "description": "[{\"when\": [{\"question\": \"<a question's key>\", \"<is|is_not|any_of|none_of|contains|at_least|below>\": <value>}, ...], \"to\": {\"meeting_type\": \"demo\", \"hosts\": [\"ana@example.com\"]} | {\"url\": \"https://...\"} | {\"message\": \"...\"}}], tried in order.",
                "items": {
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "slug": {
                "description": "Its address, e.g. \"get-started\".",
                "pattern": "^[a-z0-9][a-z0-9-]{0,59}$",
                "type": "string"
              },
              "title": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a routing form"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b8f93c35ad07ddd8df8f78fffd4da69b3bb98c34c0af48af35a3fc9a4ca6246d"
        },
        {
          "name": "calendar_setup",
          "title": "Set up the calendar",
          "description": "Set the business's calendar, or a person's own (person: like a Cal.com user, with their own booking page, hours, time zone and Google calendar): its name on booking pages, address, time zone, weekly hours, date exceptions (holidays, special hours), and for the business's calendar reminder emails and confirmation calls. Only the fields you pass change. The first call creates the calendar; then add meeting types with calendar_save_meeting_type. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "A line under the name on the booking page.",
                "maxLength": 300,
                "type": "string"
              },
              "address": {
                "description": "The booking page's address, like a Cal.com username: cncto.co/book/<address>. Lowercase letters, digits and hyphens, e.g. hansen-voss. The old address keeps working and forwards to the new one; no other business can take it.",
                "maxLength": 50,
                "minLength": 3,
                "type": "string"
              },
              "confirmation_calls_hours": {
                "description": "Call attendees this many hours before (2-72); 0 turns the calls off.",
                "maximum": 72,
                "minimum": 0,
                "type": "integer"
              },
              "connected_calendar_id": {
                "description": "After the owner (or the person) connected Google Calendar: which of their calendars to use (ids from calendar_get_setup).",
                "maxLength": 1024,
                "type": "string"
              },
              "date_exceptions": {
                "description": "{\"2026-12-24\": []} closes a day; {\"2026-12-31\": [{\"start\": \"09:00\", \"end\": \"13:00\"}]} sets its hours.",
                "type": "object"
              },
              "hours": {
                "description": "Weekly hours; several ranges a day are fine.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "day": {
                      "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                      "type": "string"
                    },
                    "end": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$",
                      "type": "string"
                    },
                    "start": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$",
                      "type": "string"
                    }
                  },
                  "required": ["day", "end", "start"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "person": {
                "description": "Someone on the account (admin_save_person), by email: sets up their own calendar and booking page instead of the business's.",
                "maxLength": 254,
                "type": "string"
              },
              "reminder_hours": {
                "description": "Email each attendee this many hours before (default [24]; up to two, e.g. [24, 1]); [] turns it off. $0.002 per reminder sent, paid accounts only. A booking made later than that gets none. For every meeting of the business, its people's too.",
                "items": {
                  "enum": [1, 2, 3, 6, 12, 24, 48, 72],
                  "type": "integer"
                },
                "maxItems": 2,
                "type": "array"
              },
              "show_people": {
                "description": "The business's booking page links the pages of its people who have meeting types (default true).",
                "type": "boolean"
              },
              "timezone": {
                "description": "IANA time zone, e.g. Europe/Berlin.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set up the calendar"
          },
          "behavior": {
