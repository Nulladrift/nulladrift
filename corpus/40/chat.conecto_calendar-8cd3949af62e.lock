        {
          "name": "account_emit_event",
          "title": "Send an event of your own",
          "description": "Send an event you name, custom.<name> (custom.lead_qualified, custom.order_shipped), to every channel subscribed to it (notify_subscribe with \"custom.*\" or its name: Slack, Teams, a webhook to Zapier, Make, n8n or the business's own systems) and to account_events, where another team's bot can pick it up. data is any JSON object (up to 10 KB); sent_by is added with this bot's name and team. $0.005 for each channel it goes to; free when no channel is subscribed. Costs $0.005 per channel it goes to; nothing if none are found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "type": "object"
              },
              "kind": {
                "description": "custom. and a name of lowercase letters, digits, dots, dashes and _.",
