        "name": "com.clawhard/spill",
        "title": "Spill",
        "version": "1.0.0",
        "description": "Spill finds API keys, tokens, private keys and passwords in pasted text (code, .env, logs, chats), from 48 services. It says which are live, which are meant to be public, where to rotate each one, and gives you a redacted copy. Runs in your browser, no account.",
