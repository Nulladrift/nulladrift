          "description": "Browse the UGC presenter avatar and voice catalogs. (UGC videos themselves are generated through adgpt_campaigns, adgpt_single_asset and adgpt_in_action.) Actions: avatarsPaginated, voices. Call adgpt_capabilities with the operationId to see an action's parameters.",
