          "digest": "sha256:de317844527f2f9ad2126c3c2bb2c84927103e94797eed5a0f59ab4402bf2edb"
        },
        {
          "name": "generate_hdri",
          "title": "AI HDRI Generator",
          "description": "360-degree equirectangular HDRI panorama / skybox from a text prompt, true HDR (.hdr) plus an LDR preview image. Realistic or stylized skies, interiors, landscapes. Asynchronous: returns a generation id; poll get_generation. Spends credits (refunded automatically on failure). Typical time: 150 s.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Optional. Same key = same generation, never charged twice. Default: derived from the parameters for 10 minutes; pass a new value to intentionally run the same prompt again.",
                "maxLength": 80,
                "type": "string"
              },
              "max_credits": {
                "description": "Highest price the user accepted (from quote_generation). The call fails with confirmation_required if missing.",
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "Scene, e.g. \"golden hour over a misty pine forest, clear sky\".",
                "maxLength": 1000,
                "type": "string"
              },
              "resolution": {
                "default": "4k",
                "description": "2k = 2048x1024, 4k = 4096x2048, 8k = 8192x4096.",
                "enum": ["2k", "4k", "8k"],
                "type": "string"
              },
              "save_to_library": {
                "default": false,
                "description": "Optional. When the generation succeeds, publish it in the public 3DTexel community library and add it to the user's library (free). Only if the user asked for it.",
                "type": "boolean"
              },
              "seed": {
                "description": "Optional, for reproducibility.",
                "maximum": 999999,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["max_credits", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "AI HDRI Generator"
