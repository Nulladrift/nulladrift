        {
          "name": "download_asset",
          "title": "Download an asset",
          "description": "Get signed download URLs for an asset (valid about 30 minutes). Free CC0 assets: no cost. AI assets: charges their price ONCE (then free forever, added to the user's library) — pass max_credits after the user accepted the price. Requires a connected account.",
          "inputSchema": {
            "properties": {
              "asset_id": {
                "type": "integer"
              },
              "max_credits": {
                "description": "Highest price the user accepted. Required when the asset is not free.",
                "minimum": 0,
                "type": "integer"
              },
              "resolution": {
                "description": "Optional, e.g. 2k, 4k, 8k when the asset offers several.",
                "type": "string"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Download an asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:581e14475713dab8ce83b7d9dc158ed2e7a09d322fb78395d8a6e5786861e5b6"
        },
        {
          "name": "generate_3d_model",
          "title": "AI 3D Model Generator",
          "description": "Textured 3D model (GLB) from an image or a text prompt. texel-3d-pro = state of the art, highest quality, HD texture with PBR maps (base color, metal/roughness, normal); texel-3d-alt = another excellent option, PBR maps; texel-3d-express = fast, decent quality (~20K triangles, PBR); texel-3d-draft = very fast drafts and distant props, color texture only, not for final quality. Without image_url, a reference image is generated from the prompt first. Asynchronous: returns a generation id; poll get_generation. Spends credits (refunded automatically on failure). Typical time: 180 s.",
          "inputSchema": {
            "properties": {
              "faces": {
                "description": "texel-3d-pro only: target face count. Omit for automatic (maximum detail).",
                "maximum": 2000000,
                "minimum": 10000,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional. Same key = same generation, never charged twice. Default: derived from the parameters for 10 minutes; pass a new value to intentionally run the same prompt again.",
                "maxLength": 80,
                "type": "string"
              },
              "image_url": {
                "description": "Optional https URL of a reference image (one object, plain background works best).",
                "format": "uri",
                "type": "string"
              },
              "max_credits": {
                "description": "Highest price the user accepted (from quote_generation). The call fails with confirmation_required if missing.",
                "minimum": 1,
                "type": "integer"
              },
              "mesh": {
                "default": "500k",
                "description": "texel-3d-alt only: triangle count.",
                "enum": ["20k", "50k", "150k", "500k", "1m"],
                "type": "string"
              },
              "model": {
                "default": "texel-3d-pro",
                "description": "texel-3d-pro (default, best), texel-3d-alt, texel-3d-express (fast), texel-3d-draft (cheapest, color only).",
                "enum": ["texel-3d-pro", "texel-3d-alt", "texel-3d-express", "texel-3d-draft"],
                "type": "string"
              },
              "object": {
                "description": "texel-3d-draft only: name of the object to extract (e.g. \"chair\"). Omit on a plain background.",
                "maxLength": 60,
                "type": "string"
              },
              "prompt": {
                "description": "Object to create, e.g. \"a medieval wooden treasure chest\". Required when no image_url is given.",
                "maxLength": 1000,
                "type": "string"
              },
              "save_to_library": {
                "default": false,
                "description": "Optional. When the generation succeeds, publish it in the public 3DTexel community library and add it to the user's library (free). Only if the user asked for it.",
                "type": "boolean"
              }
            },
            "required": ["max_credits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "AI 3D Model Generator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
