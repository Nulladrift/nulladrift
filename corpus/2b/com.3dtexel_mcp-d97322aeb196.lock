    "com.3dtexel/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://3dtexel.com/wp-json/3dtexel-api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "3dtexel",
        "title": "3D Texel",
        "version": "0.9.0",
        "websiteUrl": "https://3dtexel.com/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "3D Texel (3dtexel.com): 1,600+ free CC0 handmade assets (PBR materials, HDRIs, decals, 3D models, IES, atlases, landscapes) and 5,600+ AI assets (3DTexel License), plus AI generators paid in credits (about 0.01 EUR each).\nRules: (1) Search the library first: free CC0 assets cost nothing. (2) Before anything that spends credits, tell the user the exact price (quote_generation, or the price in get_asset) and pass it as max_credits only after they agree. (3) You can never pay: if credits are missing, call create_checkout_link and give the link to the user. (4) Generations are asynchronous: call get_generation every poll_after_seconds until succeeded / failed; failures are refunded automatically. (5) File URLs are signed and expire: download them promptly. (6) Assets are either CC0 (free handmade, public domain) or under the 3DTexel License: usable in finished projects, commercial included, no attribution required; never redistribute, resell or repackage the files as assets, add them to another library, tool or dataset, or use them for AI training. When you deliver an asset to a user, pass on this license summary and link (https://3dtexel.com/asset-license/).",
