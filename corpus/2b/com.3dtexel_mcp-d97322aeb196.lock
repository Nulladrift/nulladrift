        {
          "name": "generate_pbr_material",
          "title": "AI PBR Material Generator",
          "description": "Seamless PBR material from a text prompt: albedo (base color), normal, roughness and height maps. Realistic or stylized. Precise layouts (herringbone, chevron, Versailles parquet, basket weave, hexagon tiles...) are drawn exactly so they tile. Asynchronous: returns a generation id; poll get_generation. Spends credits (refunded automatically on failure). Typical time: 120 s.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Optional. Same key = same generation, never charged twice. Default: derived from the parameters for 10 minutes; pass a new value to intentionally run the same prompt again.",
                "maxLength": 80,
                "type": "string"
              },
              "max_credits": {
                "description": "Highest price the user accepted (from quote_generation). The call fails with confirmation_required if missing.",
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "default": "texel-quality",
                "description": "texel-quality = best (1K / 2K / 4K), texel-express = fastest and cheapest (1K only: any other resolution is delivered and charged in 1K), texel-classic = alternative look (1K / 2K / 4K). The 4K is native.",
                "enum": ["texel-quality", "texel-express", "texel-classic"],
                "type": "string"
              },
              "output_format": {
                "default": "png",
                "enum": ["png", "jpeg", "tga"],
                "type": "string"
              },
              "prompt": {
                "description": "Material description, e.g. \"mossy medieval cobblestone, wet\".",
                "maxLength": 1000,
                "type": "string"
              },
              "resolution": {
                "default": "4k",
                "description": "4k_native is accepted as 4k (the 4K is native). texel-express always runs in 1K.",
                "enum": ["1k", "2k", "4k", "4k_native"],
                "type": "string"
              },
              "save_to_library": {
                "default": false,
                "description": "Optional. When the generation succeeds, publish it in the public 3DTexel community library and add it to the user's library (free). Only if the user asked for it.",
                "type": "boolean"
              },
              "style": {
                "default": "realistic",
                "enum": ["realistic", "stylized"],
                "type": "string"
              }
            },
            "required": ["max_credits", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "AI PBR Material Generator"
