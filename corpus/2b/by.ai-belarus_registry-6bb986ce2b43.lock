        {
          "name": "search_companies",
          "title": "Find a legal entity by name or UNP",
          "description": "Search collected Belarusian legal entities by name fragment or UNP. Only legal entities are found by name (sole proprietors never are). Absence here is not absence in the state registry. Поиск юрлица по названию или УНП среди собранного.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Максимум возвращаемых субъектов, 1–25 (по умолчанию 10).",
                "type": "integer"
              },
              "query": {
                "description": "Фрагмент наименования юридического лица ИЛИ его УНП. Индивидуальные предприниматели по названию не находятся (только по УНП через lookup_company/check_counterparty).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Найденные юрлица из собранного плюс границы охвата, либо отказ (error).",
            "properties": {
              "coverage": {
                "description": "Охват собранного относительно запроса"
              },
              "data_boundary": {
                "description": "Граница данных (public_projection)",
                "type": "string"
              },
