        {
          "name": "sources_and_coverage",
          "title": "Sources & coverage (provenance)",
          "description": "Machine-readable trust card of the registry itself: every source with provenance (organ, tier, URL) and its DECLARED access/rights (machine_api_authorization, terms_status) AS DECLARED in config — not asserted by this tool; plus coverage (claims and evidence per source, which sources give canon) and grounding invariants (total claims, how many lack evidence, off-source, freshness). Technical availability is NOT a legal right to use or redistribute the data. Карточка доверия: источники, права как задекларированы, покрытие и заземление.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Необязательно: вернуть карточку только одного источника по его ID (напр. BY:MNS:GRP). Пусто — все источники."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Карточка доверия: заземление, покрытие по предикатам, источники с провенансом и правами как задекларированы.",
            "properties": {
              "card_doc": {
                "type": "string"
              },
              "error": {
                "additionalProperties": true,
                "type": "object"
              },
              "generated_at": {
                "description": "Время сборки карточки (UTC ISO)",
                "type": "string"
              },
              "grounding": {
                "additionalProperties": true,
                "description": "Инварианты заземления: claims_total, claims_without_evidence, off_source, verified_official_without_evidence, evidence_without_locator, entities_with_claims, observed_from/to",
                "type": "object"
              },
              "legal_note": {
                "description": "Тех.доступность ≠ право; правовые поля отражают декларацию, не утверждение",
                "type": "string"
              },
              "predicates": {
                "additionalProperties": true,
                "description": "Число утверждений по предикату (топ)",
                "type": "object"
              },
              "sources": {
                "description": "Источники: провенанс, права КАК ЗАДЕКЛАРИРОВАНЫ, покрытие",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "active": {
                      "type": "boolean"
                    },
                    "authority": {
                      "description": "Орган/держатель",
                      "type": "string"
                    },
                    "claims": {
