      },
      "instructions": "AI-BELARUS answers questions about Belarusian business entities by UNP (9-digit taxpayer number, УНП). Every statement carries its source registry, retrieval time and the sha256 of the raw registry response; fields that may not be disclosed are named in `withheld` with a reason. Outcomes are yes / no / not_established — never treat not_established as no. No scores or recommendations are given. When you pass the information on, name the holder and the distributor from the `attribution` field (Law of Belarus 455-Z, art. 20). Sole proprietors: only the full name, and only to someone who already knows the UNP; they are never found by name. Use lookup_company for what is already collected (instant), check_counterparty for the registry's answer right now (seconds), search_companies to find a legal entity's UNP by name.",
      "tools": [
        {
          "name": "check_counterparty",
          "title": "Registry answer now (live)",
          "description": "Live answer of the Belarusian State Register of Payers (MNS) and related registries right now: exists / active (да | нет | не_установлено), address, registration date, tax office, bankruptcy cases, exclusion from public procurement, KGK inspection plans, procurement history. Pass `name` from your documents to get a name-match verdict. Takes seconds; rate-limited. Живой ответ реестра по УНП.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Наименование контрагента из ваших документов — для сверки имени с ответом реестра (необязательно; если не передано, имя не сверяется)."
              },
              "unp": {
                "description": "УНП субъекта — РОВНО 9 цифр (из документов, ЕГР или ГРП). Иное отклоняется с invalid_unp.",
                "type": "string"
              }
            },
            "required": ["unp"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Живой ответ реестра; ключи на русском; набор полей зависит от существования субъекта и ветки (банкротство, исключение из закупок, планы проверок, закупки). Всегда несёт провенанс: держатель, реестр, адрес запроса, время, sha256 ответа.",
            "properties": {
              "error": {
                "additionalProperties": true,
                "description": "Отказ: code и detail",
                "type": "object"
              },
              "адрес_запроса": {
                "description": "Локатор ответа держателя",
                "type": ["string", "null"]
              },
              "держатель": {
                "description": "Держатель данных — атрибуция (Закон 455-З ст.20)",
                "type": "string"
              },
              "наименование": {
                "type": ["string", "null"]
              },
              "отпечаток_ответа_держателя": {
                "description": "sha256 сырого ответа",
                "type": ["string", "null"]
              },
              "получено": {
                "description": "Время получения ответа держателя"
              },
              "проверено_в": {
                "description": "Момент запроса"
              },
              "реестр": {
                "description": "Какой государственный реестр ответил",
                "type": "string"
              },
              "существует": {
                "description": "да | нет | не_установлено",
                "type": "string"
              },
              "унп": {
                "type": "string"
              }
            },
            "type": "object"
          },
