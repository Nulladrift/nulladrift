                "type": "boolean"
              },
              "meaning": {
                "description": "Пояснение смысла, когда не найдено (НЕ значит «не существует»)",
                "type": "string"
              },
              "page": {
                "description": "Ссылка на карточку (только если это юрлицо)",
                "type": ["string", "null"]
              },
