        {
          "name": "entity_timeline",
          "title": "Change timeline by UNP (stored)",
          "description": "Change timeline of a Belarusian entity by UNP from collected data: an ordered log of canon changes per predicate (created / reaffirmed / superseded / conflict_detected), each event carrying old and new value, source registry and time (effective_at, observed_at). Lets an agent read anomalies over time (sudden address/head/activity change). Instant, no registry call. Хронология изменений субъекта по УНП из собранного.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 100,
                "description": "Максимум событий в ответе, 1–500 (по умолчанию 100); новейшие первыми.",
                "type": "integer"
              },
              "unp": {
                "description": "УНП субъекта — РОВНО 9 цифр (из документов, ЕГР или ГРП). Иное отклоняется с invalid_unp.",
                "type": "string"
              }
            },
            "required": ["unp"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Хронология изменений субъекта (claim_history_events + значения из claims), новейшие первыми; либо «не найдено»/отказ.",
            "properties": {
              "entity_id": {
                "description": "Внутренний UUID субъекта",
                "type": "string"
              },
              "error": {
                "additionalProperties": true,
                "type": "object"
              },
              "event_count": {
                "type": "integer"
              },
              "events": {
                "description": "События изменения канона, новейшие первыми",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "effective_at": {
                      "description": "Когда изменение вступило в силу",
                      "type": ["string", "null"]
                    },
                    "event_type": {
                      "description": "created | reaffirmed | superseded | conflict_detected",
                      "type": "string"
                    },
                    "new_value": {
                      "description": "Новое значение предиката"
                    },
                    "observed_at": {
                      "description": "Когда наблюдено держателем/реестром",
                      "type": ["string", "null"]
                    },
                    "old_value": {
                      "description": "Предыдущее значение (если было)"
                    },
                    "predicate": {
                      "description": "Какой предикат изменился (legal_name/status/...)",
                      "type": "string"
                    },
                    "source_id": {
                      "description": "Источник события",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "found": {
                "type": "boolean"
              },
              "meaning": {
                "description": "Пояснение, когда не найдено (НЕ значит «не существует»)",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "unp": {
                "type": "string"
              }
            },
            "type": "object"
          },
