                "description": "Отказ: code (напр. empty_query)",
                "type": "object"
              },
              "results": {
                "description": "Публичные проекции найденных юрлиц",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "search_backend": {
                "description": "Каким механизмом выполнен поиск",
                "type": "string"
              }
            },
            "type": "object"
          },
