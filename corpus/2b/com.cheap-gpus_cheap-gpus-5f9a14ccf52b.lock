        {
          "name": "cheapest_model_route",
          "title": "Cheapest LLM providers",
          "description": "Cheapest inference providers for one LLM (e.g. \"deepseek-v3\", \"gpt-oss-120b\";\n        use find_model if unsure of the name). Prices are USD per 1M tokens; estimated_cost_usd\n        is for the given input/output token counts. One row per provider, cheapest first. limit: 1-10.",
          "inputSchema": {
            "properties": {
              "input_tokens": {
                "default": 1000000,
                "description": "Input (prompt) tokens to price, for estimated_cost_usd. Default 1M.",
                "title": "Input Tokens",
                "type": "integer"
              },
              "limit": {
                "default": 5,
                "description": "Maximum rows to return, 1-10; values outside the range are clamped.",
                "title": "Limit",
                "type": "integer"
              },
              "model": {
                "description": "LLM name or slug (e.g. \"gpt-oss-120b\", \"deepseek-v3\"). Use find_model if unsure of the name.",
                "examples": ["gpt-oss-120b", "deepseek-v3"],
                "title": "Model",
                "type": "string"
              },
              "output_tokens": {
                "default": 1000000,
                "description": "Output (completion) tokens to price, for estimated_cost_usd. Default 1M.",
                "title": "Output Tokens",
                "type": "integer"
              }
            },
            "required": ["model"],
            "title": "cheapest_model_routeArguments",
            "type": "object"
          },
          "outputSchema": {
