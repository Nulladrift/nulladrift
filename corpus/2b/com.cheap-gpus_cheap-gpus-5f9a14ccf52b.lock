        {
          "name": "find_model",
          "title": "Find an LLM",
          "description": "Search the LLM catalog by name (e.g. \"deepseek v3\", \"gpt-oss\", \"llama 70b\").\n        Returns model slugs to pass to cheapest_model_route / gpus_needed_for_model,\n        most widely offered first. limit: 1-10.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum rows to return, 1-10; values outside the range are clamped.",
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "Part of a model name; words can be in any order (e.g. \"deepseek v3\", \"llama 70b\").",
                "examples": ["deepseek v3", "gpt-oss"],
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "find_modelArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ModelMatch": {
                "properties": {
                  "model": {
                    "description": "Model slug to pass to cheapest_model_route or gpus_needed_for_model.",
                    "title": "Model",
                    "type": "string"
                  },
                  "name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Display name as a provider lists it.",
                    "title": "Name"
                  },
                  "provider_count": {
                    "description": "Providers serving this model.",
                    "title": "Provider Count",
                    "type": "integer"
                  },
                  "source_url": {
                    "description": "Matching cheap-gpus.com page for this result.",
                    "title": "Source Url",
                    "type": "string"
                  }
                },
                "required": ["model", "name", "provider_count", "source_url"],
                "title": "ModelMatch",
                "type": "object"
              }
            },
            "properties": {
              "attribution": {
                "description": "Data source credit.",
                "title": "Attribution",
                "type": "string"
              },
              "models": {
                "description": "Matches, exact match first, then most widely offered.",
                "items": {
                  "$ref": "#/$defs/ModelMatch"
                },
                "title": "Models",
                "type": "array"
              },
              "query": {
                "description": "The search text as given.",
                "title": "Query",
                "type": "string"
              },
              "total_matches": {
                "description": "All matches before the limit was applied.",
                "title": "Total Matches",
                "type": "integer"
              }
            },
            "required": ["attribution", "models", "query", "total_matches"],
            "title": "ModelMatches",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an LLM"
