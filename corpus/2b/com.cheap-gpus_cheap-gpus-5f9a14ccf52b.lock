      },
      "instructions": "Live GPU rental prices (USD per GPU-hour) across ~37 cloud providers, LLM inference prices (USD per 1M tokens) across ~24 providers, and market-implied future GPU prices from prediction markets and futures. Prices refresh every 6-8 hours; every row carries synced_at and a stale flag. Use list_gpu_families / find_model to resolve names first. Each result includes a source_url for the matching cheap-gpus.com page.",
      "tools": [
        {
          "name": "cheapest_gpu",
          "title": "Cheapest GPU rentals",
          "description": "Cheapest current rental offers for one GPU family (e.g. \"H100\", \"RTX 5090\",\n        \"b200\"), in USD per GPU-hour, cheapest first, one row per provider.\n        pricing_type is \"on_demand\" (default; can't be interrupted) or \"spot\"\n        (cheaper, the provider can reclaim the machine). limit: 1-10.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "description": "GPU family name, case-insensitive; aliases work (e.g. \"H100\", \"rtx 5090\", \"5090\", \"b200\"). Call list_gpu_families for the full list.",
                "examples": ["H100", "RTX 5090"],
                "title": "Gpu",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum rows to return, 1-10; values outside the range are clamped.",
                "title": "Limit",
                "type": "integer"
              },
              "pricing_type": {
                "default": "on_demand",
                "description": "\"on_demand\" (fixed price, can't be interrupted) or \"spot\" (cheaper; the provider can reclaim the machine).",
                "enum": ["on_demand", "spot"],
                "title": "Pricing Type",
                "type": "string"
              }
            },
            "required": ["gpu"],
            "title": "cheapest_gpuArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "GpuOffer": {
                "properties": {
                  "gpu_name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The provider's own name for the GPU or instance.",
                    "title": "Gpu Name"
                  },
                  "location": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Region or data center, when the provider reports one.",
                    "title": "Location"
                  },
                  "provider": {
                    "description": "Provider display name.",
                    "title": "Provider",
                    "type": "string"
                  },
                  "stale": {
                    "description": "True if this provider's last sync failed and this is its last known price (up to 3 days old).",
                    "title": "Stale",
                    "type": "boolean"
                  },
                  "synced_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "When this price was last fetched from the provider (ISO 8601, UTC).",
                    "title": "Synced At"
                  },
                  "usd_per_hour": {
                    "description": "Price in USD per GPU-hour.",
                    "title": "Usd Per Hour",
                    "type": "number"
                  }
                },
                "required": ["gpu_name", "location", "provider", "stale", "synced_at", "usd_per_hour"],
                "title": "GpuOffer",
                "type": "object"
              }
            },
            "properties": {
              "attribution": {
                "description": "Data source credit.",
                "title": "Attribution",
                "type": "string"
              },
              "gpu_family": {
                "description": "Canonical GPU family the request resolved to.",
                "title": "Gpu Family",
                "type": "string"
              },
              "median_usd_per_hour": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Median of each provider's cheapest offer.",
                "title": "Median Usd Per Hour"
              },
              "offers": {
                "description": "Each provider's cheapest offer, cheapest first.",
                "items": {
                  "$ref": "#/$defs/GpuOffer"
                },
                "title": "Offers",
                "type": "array"
              },
              "pricing_type": {
                "description": "\"on_demand\" or \"spot\".",
                "title": "Pricing Type",
                "type": "string"
              },
              "provider_count": {
                "description": "Providers with a current offer of this type.",
                "title": "Provider Count",
                "type": "integer"
              },
              "source_url": {
                "description": "Matching cheap-gpus.com page for this result.",
                "title": "Source Url",
                "type": "string"
              },
              "unit": {
                "description": "Always \"USD per GPU-hour\".",
                "title": "Unit",
                "type": "string"
              }
            },
            "required": ["attribution", "gpu_family", "median_usd_per_hour", "offers", "pricing_type", "provider_count", "source_url", "unit"],
            "title": "GpuOffers",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest GPU rentals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bcd79f8dd03a2f5922d19ba23a97c4edee16c25a32bc1c8799442005a44eace"
