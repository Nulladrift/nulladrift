      "serverInfo": {
        "name": "cheap-gpus",
        "title": "cheap-gpus.com",
        "version": "1.0.0",
        "description": "GPU rental, LLM inference, and GPU price-forecast data",
        "websiteUrl": "https://cheap-gpus.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Live GPU rental prices (USD per GPU-hour) across ~37 cloud providers, LLM inference prices (USD per 1M tokens) across ~24 providers, and market-implied future GPU prices from prediction markets and futures. Prices refresh every 6-8 hours; every row carries synced_at and a stale flag. Use list_gpu_families / find_model to resolve names first. Each result includes a source_url for the matching cheap-gpus.com page.",
      "tools": [
        {
          "name": "cheapest_gpu",
          "title": "Cheapest GPU rentals",
          "description": "Cheapest current rental offers for one GPU family (e.g. \"H100\", \"RTX 5090\",\n        \"b200\"), in USD per GPU-hour, cheapest first, one row per provider.\n        pricing_type is \"on_demand\" (default; can't be interrupted) or \"spot\"\n        (cheaper, the provider can reclaim the machine). limit: 1-10.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "title": "Gpu",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "pricing_type": {
                "default": "on_demand",
                "title": "Pricing Type",
                "type": "string"
              }
            },
            "required": ["gpu"],
            "title": "cheapest_gpuArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "cheapest_gpuDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest GPU rentals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c38fad27b15f82fdd6647ad28a27e42ccff1a2a233a98f9fad1393ad02226ec"
        },
        {
