                    ],
                    "description": "Context window in tokens, when the provider reports it.",
                    "title": "Context Length"
                  },
                  "estimated_cost_usd": {
                    "description": "Cost for the requested input_tokens and output_tokens, USD.",
                    "title": "Estimated Cost Usd",
                    "type": "number"
                  },
                  "input_usd_per_1m": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Input (prompt) price, USD per 1M tokens.",
                    "title": "Input Usd Per 1M"
                  },
                  "model_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The provider's own model id, to use in its API.",
                    "title": "Model Id"
                  },
                  "output_usd_per_1m": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Output (completion) price, USD per 1M tokens.",
                    "title": "Output Usd Per 1M"
                  },
                  "provider": {
                    "description": "Provider display name.",
                    "title": "Provider",
                    "type": "string"
                  },
                  "stale": {
                    "description": "True if this provider's last sync failed and this is its last known price (up to 3 days old).",
                    "title": "Stale",
                    "type": "boolean"
                  },
                  "synced_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "When this price was last fetched from the provider (ISO 8601, UTC).",
                    "title": "Synced At"
                  }
                },
                "required": ["context_length", "estimated_cost_usd", "input_usd_per_1m", "model_id", "output_usd_per_1m", "provider", "stale", "synced_at"],
                "title": "ModelRoute",
                "type": "object"
              }
            },
            "properties": {
              "attribution": {
                "description": "Data source credit.",
                "title": "Attribution",
                "type": "string"
              },
              "input_tokens": {
                "description": "Input tokens the cost estimate is for.",
                "title": "Input Tokens",
                "type": "integer"
              },
              "model": {
                "description": "Resolved model slug.",
                "title": "Model",
                "type": "string"
              },
              "output_tokens": {
                "description": "Output tokens the cost estimate is for.",
                "title": "Output Tokens",
                "type": "integer"
              },
              "provider_count": {
                "description": "Providers serving this model.",
                "title": "Provider Count",
                "type": "integer"
              },
              "routes": {
                "description": "Each provider's cheapest route, cheapest estimated cost first.",
                "items": {
                  "$ref": "#/$defs/ModelRoute"
                },
                "title": "Routes",
                "type": "array"
              },
              "source_url": {
                "description": "Matching cheap-gpus.com page for this result.",
                "title": "Source Url",
