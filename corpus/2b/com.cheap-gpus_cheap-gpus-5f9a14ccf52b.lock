          "title": "GPUs needed to host a model",
          "description": "How many GPUs it takes to self-host an open-weight LLM at a given quantization,\n        and the cheapest rental setups for it right now. quant is one of: fp16, bf16, fp8,\n        mxfp8, int8, q6, fp6, q5, q4km, nvfp4, awq, mxfp4, gptq, int4, q3, q2, iq2, iq1.\n        Estimates memory only (weights + 20% runtime overhead), not throughput. limit: 1-10.",
          "inputSchema": {
