      "serverInfo": {
        "name": "neural-system",
        "title": "Neural System",
        "version": "1.0.0",
        "websiteUrl": "https://www.neuralsystem.com.br"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Neural System (Brazil) sells (1) computer vision subscriptions that turn existing IP/CCTV cameras into alerts and dashboards (PPE, danger zones, people/vehicle/animal/production counting, queues, falls, fire and smoke, cattle counting by drone, etc.) and (2) Windows apps for files, photos, email, phones and disks, with a free trial. Use search_neural first to find what fits the user. Use quote_vision for camera pricing and get_desktop_app for app plans. Only call request_contact after the user explicitly agrees to share their name and email with Neural System. Answer in the user's language; pass language=pt for Brazilian Portuguese (prices in BRL), es for Spanish, en otherwise (USD).",
      "tools": [
        {
          "name": "get_desktop_app",
          "title": "Get a Neural Windows app",
          "description": "Details of one Windows app: what it does, plans and prices, FAQ, free download and the link where the user buys it (secure Stripe checkout on the app site).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "App id from list_desktop_apps (e.g. repair, rescue, backup, photos, pdf).",
                "type": "string"
              },
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:224215191a2a057cd5773acbc23735c0a5798ea898d1592b1220658e52cee5e8"
        },
        {
          "name": "get_vision_solution",
          "title": "Get a computer vision solution",
          "description": "Details of one computer vision solution: what it detects, use cases, metrics, availability, price and links for demo and contact.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Solution id from search_neural or list_vision_solutions (e.g. epi, fluxo_pessoas, contagem_animais).",
                "type": "string"
              },
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
