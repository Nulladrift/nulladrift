            "readOnly": true
          },
          "digest": "sha256:2d0150ab9726d2da93c41ff230864ab7956e740dad304a16e6c17aedba85c120"
        },
        {
          "name": "list_vision_solutions",
          "title": "List computer vision solutions",
          "description": "List the computer vision solutions by industry, with status (live, lab, on demand), monthly price per camera and page link.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              },
              "segment": {
                "description": "Optional industry id (e.g. industria, varejo, seguranca, logistica, agronegocio, saude, educacao, construcao-mineracao, energia, vendas-marketing).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a863fc5f6c5d7db00e35fe6cbbaef8eae5065b1a67c3ad0e268c02b0319f6f33"
        },
        {
          "name": "quote_vision",
          "title": "Quote a computer vision subscription",
          "description": "Price estimate for the computer vision subscription: number of cameras and models per camera. Returns monthly fee, setup and volume discount. The final price is confirmed by the Neural team.",
          "inputSchema": {
            "properties": {
              "cameras": {
                "description": "Number of cameras.",
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              },
              "models": {
                "description": "Solution ids to run on all cameras (e.g. [\"epi\",\"zona_de_risco\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["cameras", "models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75d18131ba36142f2507504a9797ecb5965d850fda85d5c0c6f807c245a2810a"
        },
        {
          "name": "request_contact",
          "title": "Ask Neural to contact the user",
          "description": "Send the user's contact request to the Neural System sales team (demo, quote, free test with their own video). ONLY call after the user explicitly agreed to share their name and email with Neural System for this purpose. The user receives a confirmation email.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "interest": {
                "description": "Solution or app of interest.",
                "type": "string"
              },
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              },
              "message": {
                "description": "What the user needs: cameras, site, problem, timeline.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "phone": {
                "description": "Phone or WhatsApp with country code.",
                "type": "string"
              },
              "user_consent": {
                "description": "true only if the user explicitly agreed to share this data with Neural System.",
                "type": "boolean"
              }
            },
            "required": ["email", "message", "name", "user_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00b70353cc94f585994f44aef975d213413828f711e294f74297519a50672d0b"
        },
        {
          "name": "search_neural",
          "title": "Search Neural solutions and apps",
          "description": "Find which Neural System product solves a problem. Searches the computer vision solutions (camera analytics for safety, counting, retail, logistics, agribusiness, healthcare, mining…) and the Windows apps (file repair, data recovery, backup, photos, email, PDF, phone, disk…). Returns the best matches with links.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              },
              "query": {
                "description": "The user problem or need, in any language, e.g. \"detect workers without helmet\" or \"recover a corrupted Excel file\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
