            "readOnly": true
          },
          "digest": "sha256:2f6d6a0846faa279f415a21d4b36c1a240635acc920ef77396b1c67f2521f08e"
        }
      ],
      "digest": "sha256:5f3f457d0f714ec19bf7f3c67fc1ca2c13aacb448a087bbe9d9da70f4bb583b2"
    }
  }
