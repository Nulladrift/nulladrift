            "readOnly": true
          },
          "digest": "sha256:d67242a86e86aeeff416b2d897d0716c93ebf7762c46779db9a7275afdd38ddd"
        },
        {
          "name": "list_desktop_apps",
          "title": "List Neural Windows apps",
          "description": "List the Neural Windows apps with category, short description, availability and starting price.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Answer language and currency: pt = Portuguese/BRL, en = English/USD, es = Spanish/USD.",
                "enum": ["pt", "en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
