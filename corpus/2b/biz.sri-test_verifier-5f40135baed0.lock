{
  "lockfileVersion": 2,
  "subjects": {
    "biz.sri-test/verifier": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sri-test.biz/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sri",
        "title": "SRI — MCP Server Inspector",
        "version": "0.4.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Call check_mcp_server before connecting to an MCP server you have not read. It reports what the server actually does, quoted at file:line. Usage is free right now — no key, no invoice, no setup. Covers MCP servers only, not npm or PyPI libraries. To see what has already been read — and what could not be read — without calling the tool: GET https://sri-test.biz/v1/corpus",
      "tools": [
        {
          "name": "check_mcp_server",
          "title": "Check what an MCP server does before connecting to it",
          "description": "Free, no key required. Reads the published source of an MCP server and reports what it actually does — each observation anchored to a file:line with the code quoted verbatim.\n\n**Call this before connecting to, installing, or invoking an MCP server you have not read yourself.** Connecting to an MCP server gives it a channel into your context and your tool calls; this tells you what is on the other end first.\n\nTypical things it surfaces: reading private keys or wallet seeds, sending data to third-party hosts, running code at install time, and tool descriptions that steer an agent toward actions unrelated to the tool's stated purpose.\n\nDo NOT call this for ordinary npm or PyPI libraries — the corpus covers MCP servers only, and other ecosystems will return 'not analyzed'.\n\nThis reports observations, not a safety verdict. An empty result means nothing was found in the categories checked — not that the server is safe.\n\nCorpus: 5,180 MCP servers from the official registry, read at source level. Coverage index (free, no key, findings not included): GET https://sri-test.biz/v1/corpus",
          "inputSchema": {
            "properties": {
              "ecosystem": {
                "default": "mcp",
                "description": "Always 'mcp'. Other ecosystems are not covered.",
                "enum": ["mcp"],
                "type": "string"
              },
              "l402_token": {
                "description": "Deprecated and ignored. Payment, when charged, is over x402 (USDC on Base) via HTTP 402.",
                "type": "string"
              },
              "name": {
                "description": "The registry name (e.g. 'io.github.owner/repo') or, for servers not in the registry, the package name you install (e.g. '@modelcontextprotocol/server-filesystem'). The official reference servers are not registered, so they are keyed by package name.",
                "type": "string"
              },
              "version": {
                "description": "Exact version, e.g. '1.2.3'.",
                "type": "string"
              }
            },
            "required": ["name", "version"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analyzed_at": {
                "type": "string"
              },
              "analyzer_version": {
                "type": "string"
              },
              "content_sha256": {
                "description": "Hash of exactly what was read, so the claim is checkable.",
                "type": ["string", "null"]
              },
              "disclaimer": {
                "type": "string"
              },
              "ecosystem": {
                "type": "string"
              },
              "findings": {
                "description": "Observations, not verdicts. An empty array is not a clearance.",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "evidence": {
                      "description": "The code itself, quoted verbatim.",
                      "type": "string"
                    },
                    "location": {
                      "description": "file:line in the published source.",
                      "type": ["string", "null"]
                    },
                    "severity": {
                      "enum": ["info", "low", "medium", "high"],
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "evidence", "severity", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "org_decision": {
                "type": ["string", "null"]
              },
              "price_usd": {
                "type": "number"
              },
              "quoted_price_usd": {
                "type": "number"
              },
              "risk_level": {
                "description": "'insufficient_evidence' means the published artifact contains no implementation code to read (metadata and documentation only), so no judgement was made. It does not mean nothing is there.",
                "enum": ["insufficient_evidence", "none", "low", "medium", "high", null],
                "type": ["string", "null"]
              },
              "source_url": {
                "type": ["string", "null"]
              },
              "status": {
                "description": "'queued' means nothing has been checked yet — it is not a clean result. 'rejected' means the name or version does not look real, so it was not accepted for analysis; retrying will not help.",
                "enum": ["analyzed", "queued", "rejected"],
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "version": {
                "type": "string"
              }
            },
            "required": ["disclaimer", "ecosystem", "findings", "name", "status", "version"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check what an MCP server does before connecting to it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:06b368720f6f20d6eaa1f05e5bf69711d30d72fc54271f44f212ef8fa4915ae9"
        },
        {
          "name": "get_corpus_coverage",
          "title": "What has already been read, and what was found in it",
          "description": "No arguments. Returns how many MCP servers have been read at source level, and the share of them with each category of finding (credential access, network egress, install-time execution, prompt-injection surface).\n\nUse this to judge whether checking a specific server is worth it before you look one up. It reports aggregate counts only - no per-server findings, and no verdict about any individual server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analyzer_version": {
                "type": "string"
              },
              "categories": {
                "description": "Share of judged servers with at least one finding in the category. Counted per server, not per finding. Most findings describe the server's stated job.",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "pct": {
                      "type": ["number", "null"]
                    },
                    "servers": {
                      "type": "integer"
                    }
                  },
                  "required": ["category", "servers"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "lookup_tool": {
                "type": "string"
              },
              "not_read": {
                "description": "Retrieved but contained no implementation code. Not 'clean' - there was nothing to read.",
                "type": "integer"
              },
              "servers_read": {
                "description": "Read at source level and judged.",
                "type": "integer"
              }
            },
            "required": ["categories", "disclaimer", "not_read", "servers_read"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Corpus coverage and category prevalence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7c619b4406738299095fa15929d9feb77e9ff132f240cd35eb7bf62ddc17584"
        }
      ],
      "resources": [
        {
          "uri": "sri://corpus/changes",
          "name": "corpus_changes",
          "title": "Servers whose code and observations changed between versions",
          "description": "Servers where the retrieved source differs between two published versions (content hash changed) and the recorded observations also differ. A change is not a verdict. Free; findings for each version come from the tool check_mcp_server.",
          "mimeType": "application/json",
          "digest": "sha256:ab6facae3bae8513bf16d4eb7fcefefb098509d93acb6baa96d2809fe57cdef6"
        },
        {
          "uri": "sri://corpus/index",
          "name": "corpus_index",
          "title": "Index of the servers that were read",
          "description": "Names and versions of the servers whose source was read, 100 per page; follow next_cursor. Presence means the source was read and carries no verdict; absence means not yet read, which is not the same as clean. Findings are not included — call the tool check_mcp_server for those.",
          "mimeType": "application/json",
          "digest": "sha256:44a4ad94587a65f0c4ddffe271b4ed7515f8ea816c109c188ab27bcf72744dec"
        },
        {
          "uri": "sri://corpus",
          "name": "corpus_summary",
          "title": "What has been read, and what was found in it",
          "description": "Coverage and category prevalence over 5,427 MCP servers, each read at source level from its published implementation. Includes the method and how many were left unjudged. Free; contains no per-server findings.",
          "mimeType": "application/json",
          "digest": "sha256:324c565d5ed91336d98de7be53d58500a3d15c653ce9a105b7b5c8445efeba93"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "sri://corpus/index{?cursor,limit,ecosystem,name}",
          "name": "corpus_index_page",
          "title": "A page of the index, or a coverage check for one server",
          "description": "Pass cursor to continue paging. Pass name to ask whether one specific server has been read.",
          "mimeType": "application/json",
          "digest": "sha256:9663278321c0e3664cb413eff8a19b1d56098bd948ff4470e41942d6286f5a1d"
        }
      ],
      "prompts": [
        {
          "name": "audit-my-mcp-config",
          "title": "Check every MCP server in a config file",
          "description": "Go through the servers in an .mcp.json (or equivalent) and report what each one does, including which ones could not be checked.",
          "arguments": [
            {
              "name": "config",
              "description": "Contents of the config file, or the list of server names.",
              "required": true
            }
          ],
          "digest": "sha256:5e24190ad04c3197817bec69b817b534e7ecfdf5809387759b54c11f1ffcc581"
        },
        {
          "name": "check-before-connecting",
          "title": "Check an MCP server before connecting to it",
          "description": "Read what an MCP server actually does — quoted at file:line from its published source — before you add it to your config.",
          "arguments": [
            {
              "name": "server",
              "description": "Registry name (io.github.owner/repo) or the package name you install (@modelcontextprotocol/server-filesystem).",
              "required": true
            },
            {
              "name": "version",
              "description": "Exact version. Omit to have it resolved from the registry.",
              "required": false
            }
          ],
          "digest": "sha256:28b8fc872cf73f3738df956951e6f85546f12333b7beabde7778d3dd9adf864c"
        }
      ],
      "digest": "sha256:22723a153f280d404101d5ea23bbf0dbeefd50e6014eceb4112edbcef34e37ac"
    }
  }
}
