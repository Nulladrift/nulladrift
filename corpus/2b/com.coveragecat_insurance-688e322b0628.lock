              "detail_status": {
                "enum": ["abandoned", "blocked", "bound", "cancelled", "chosen", "credit_consent_pending", "credit_consent_required", "monoline_mvr_consent_required", "dev_success", "documents_needed", "documents_pending_review", "email_sent", "in_review", "ineligible", "info_requested", "needs_more_info", "needs_more_info_to_bind", "no_policy", "no_chosen_offer", "no_quotes", "no_selection", "ok", "payment_collection_ready", "payment_needed", "pending", "pending_quotes", "queued", "quote_rate_limited", "quoted", "ready_for_review", "ready_for_submission", "ready_to_finalize", "review_pending", "service_preview", "service_requested", "sandbox_unsupported", "stale_selection", "verifying_documents", "waiting_on_carrier", "waiting_on_documents", "waiting_on_payment"],
                "type": "string"
