              },
              "tool": {
                "description": "Optional name of the tool or command involved.",
                "maxLength": 80,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "feedback_id": {
                "format": "uuid",
                "type": "string"
              },
