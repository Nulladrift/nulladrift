        {
          "name": "umbrella_bundle_comparison",
          "title": "Standalone umbrella vs. bundle calculator",
          "description": "Compare the total cost of keeping existing home and auto insurance with standalone umbrella coverage versus moving all three to a bundle. Enter annual net premiums, required underlying-limit upgrades, and one-time switching cost. Returns first-year and multi-year totals, savings, and the first whole break-even year. Flags unverified coverage comparability; no carrier prices are invented.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auto_upgrade_premium": {
                "default": 0,
                "description": "Additional annual cost to meet standalone umbrella requirements. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Annual auto limit upgrade",
                "type": "integer"
              },
              "bundled_auto_premium": {
                "description": "Annual replacement auto quote, after discounts, with required limits. Double a six-month premium; multiply a monthly premium by 12. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Bundled auto premium",
                "type": "integer"
              },
              "bundled_home_premium": {
                "description": "Annual replacement home quote, after discounts, with required limits. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Bundled home premium",
                "type": "integer"
              },
              "bundled_umbrella_premium": {
                "description": "Annual bundled umbrella quote at the same limit. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Bundled umbrella premium",
                "type": "integer"
              },
              "coverage_comparable": {
                "default": false,
                "description": "True only after comparing limits, deductibles, exclusions, insured risks, and claims terms.",
                "title": "Coverage terms have been compared",
                "type": "boolean"
              },
              "current_auto_premium": {
                "description": "Annual premium for the auto policies you would keep. Double a six-month premium; multiply a monthly premium by 12. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Current auto premium",
                "type": "integer"
              },
              "current_home_premium": {
                "description": "Annual premium for the home, renters, or rental policies you would keep. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Current home premium",
                "type": "integer"
              },
              "home_upgrade_premium": {
                "default": 0,
                "description": "Additional annual cost to meet standalone umbrella requirements. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Annual home limit upgrade",
                "type": "integer"
              },
              "standalone_umbrella_premium": {
                "description": "Annual standalone umbrella quote at the limit you want. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "Standalone umbrella premium",
                "type": "integer"
              },
              "switching_cost": {
                "default": 0,
                "description": "Additional nonrefundable cost of moving to the bundle; exclude refunded or overlapping premiums. Whole US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "title": "One-time switching cost",
                "type": "integer"
              },
              "years": {
                "default": 3,
                "description": "Assumes unchanged annual premiums across this period.",
                "maximum": 30,
                "minimum": 1,
                "title": "Years to compare",
                "type": "integer"
              }
            },
            "required": ["bundled_auto_premium", "bundled_home_premium", "bundled_umbrella_premium", "current_auto_premium", "current_home_premium", "standalone_umbrella_premium"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_savings_with_bundle": {
                "description": "Standalone annual cost minus bundled annual cost, in USD; negative means the bundle costs more.",
                "type": "integer"
              },
              "assumptions": {
                "description": "Assumptions and exclusions needed to interpret the calculation.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bundle": {
                "additionalProperties": false,
                "description": "Cost of replacing home/auto/umbrella together, including one-time switching cost.",
