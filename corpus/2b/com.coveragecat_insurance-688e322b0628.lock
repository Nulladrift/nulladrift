        {
          "name": "umbrella_consumer_payment",
          "title": "Collect umbrella payment",
          "description": "Prepare secure Stripe payment collection or submit the resulting payment method during the consumer-prefill umbrella post-choose flow. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. Stay on the same consumer-operated MCP subset. Use this only after Coverage Cat says payment_needed. First call it with payment_collection_requested: true; do not send the shopper straight to payment_url before you try this native step. If the host confirms the registered secure payment UI can render, display it and wait for completion; do not request card details through conversational text. After successful Stripe setup, call this same tool again with setup_intent_id and payment_method_id. If UI support is unknown or unsupported, or if secure setup fails in chat, share payment_url with the specific fallback reason instead.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Provide either payment_collection_requested: true or both setup_intent_id and payment_method_id, never both modes.",
            "properties": {
              "idempotency_key": {
                "description": "Key you generate to identify one logical umbrella_consumer_payment request, so a retry cannot apply it twice. After a timeout or transport failure, retry with the same key and identical arguments to get the original result back; Coverage Cat keeps that result for 24 hours and rejects different arguments sent under a used key.",
                "type": "string"
              },
              "intake_access_token": {
                "description": "Send the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. Required for stateless MCP 2026-07-28 requests; also accepted by legacy hosts. Keep it private and never show it to the shopper.",
                "type": "string"
              },
              "payment_collection_requested": {
                "const": true,
                "description": "Starts secure card collection: Coverage Cat prepares a Stripe SetupIntent and returns the publishable_key, client_secret, and setup_intent_id the registered payment UI needs. Send it on the first payment call, without setup_intent_id or payment_method_id.",
                "type": "boolean"
              },
              "payment_method_id": {
                "description": "Reusable Stripe PaymentMethod id produced by secure client-side setup confirmation.",
                "type": "string"
              },
              "setup_intent_id": {
                "description": "SetupIntent id returned by the earlier payment_collection_ready response.",
                "type": "string"
              },
              "uid": {
                "description": "Coverage Cat intake uid for the current shopper session.",
                "type": "string"
              }
            },
            "required": ["uid"],
            "type": "object"
          },
