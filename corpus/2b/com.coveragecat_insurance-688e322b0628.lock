          "name": "consumer_intake_verify_email",
          "title": "Send shopper email verification",
          "description": "When consumer_intake_issues reports verification.required, ask the shopper whether to send a verification email, then call with confirm_send: true. The link goes only to the application's email on file. Ask the shopper to open it, then poll consumer_intake_issues until verification.required is false. Never ask the shopper to paste the login link or code into chat.",
