        {
          "name": "umbrella_limit_planner",
          "title": "Umbrella coverage limit planner",
          "description": "Compare how much umbrella coverage to consider from net worth, independently confirmed protected assets, an optional income allowance, and the lowest applicable underlying liability limit. Returns the arithmetic target, additional limit needed, and $0/$1M/$2M/$3M/$5M/$10M scenarios. This is planning, not a quote or a determination of legally exposed assets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_income": {
                "default": 0,
                "description": "Income included in your optional planning allowance. Whole US dollars.",
                "maximum": 10000000,
                "minimum": 0,
                "title": "Annual household income",
                "type": "integer"
              },
              "income_years": {
                "default": 0,
                "description": "Choose 0 for an assets-only scenario; not a garnishment estimate.",
                "maximum": 30,
                "minimum": 0,
                "title": "Years of income to include",
                "type": "integer"
              },
              "net_worth": {
                "description": "Assets minus debts, including property equity. Use 0 if negative. Whole US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "title": "Net worth",
                "type": "integer"
              },
              "protected_assets": {
                "default": 0,
                "description": "Only amounts included in net worth whose legal protection you have confirmed. Whole US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "title": "Legally protected assets",
                "type": "integer"
              },
              "underlying_limit": {
                "description": "Use the lowest applicable auto, home, or rental liability limit. For a single injured person under split auto limits, use the per-person limit. Do not add separate policies together. Whole US dollars.",
                "maximum": 50000000,
                "minimum": 0,
                "title": "Applicable underlying liability limit",
                "type": "integer"
              }
            },
            "required": ["net_worth", "underlying_limit"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_limit_needed": {
                "description": "Planning target minus the applicable underlying limit, floored at zero, in USD.",
                "minimum": 0,
                "type": "integer"
              },
              "assets_included": {
                "description": "Net worth minus the caller's confirmed protected-assets allowance, in USD.",
                "minimum": 0,
                "type": "integer"
              },
              "assumptions": {
                "description": "Assumptions and exclusions needed to interpret the calculation.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "disclaimer": {
                "description": "Limits of this planning result and the need to verify policy terms and legal protections.",
                "type": "string"
              },
              "estimate_unit": {
                "const": "usd",
                "description": "Currency for monetary inputs and outputs; year/count fields retain their named units.",
                "type": "string"
              },
              "first_illustrated_limit_meeting_target": {
                "description": "First listed scenario meeting the arithmetic target, not a coverage recommendation. Null when the target exceeds every scenario.",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "income_allowance": {
                "description": "Annual income multiplied by the chosen income years, in USD; not a garnishment forecast.",
                "minimum": 0,
                "type": "integer"
              },
              "inputs": {
                "additionalProperties": false,
                "description": "Normalized caller inputs including defaults; unverified optional limits remain null.",
                "properties": {
                  "annual_income": {
                    "description": "Income included in your optional planning allowance. Whole US dollars.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "title": "Annual household income",
                    "type": ["integer", "null"]
                  },
                  "income_years": {
                    "description": "Choose 0 for an assets-only scenario; not a garnishment estimate.",
                    "maximum": 30,
                    "minimum": 0,
                    "title": "Years of income to include",
                    "type": ["integer", "null"]
                  },
                  "net_worth": {
                    "description": "Assets minus debts, including property equity. Use 0 if negative. Whole US dollars.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "title": "Net worth",
                    "type": ["integer", "null"]
                  },
                  "protected_assets": {
                    "description": "Only amounts included in net worth whose legal protection you have confirmed. Whole US dollars.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "title": "Legally protected assets",
                    "type": ["integer", "null"]
                  },
                  "underlying_limit": {
                    "description": "Use the lowest applicable auto, home, or rental liability limit. For a single injured person under split auto limits, use the per-person limit. Do not add separate policies together. Whole US dollars.",
                    "maximum": 50000000,
                    "minimum": 0,
                    "title": "Applicable underlying liability limit",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["annual_income", "income_years", "net_worth", "protected_assets", "underlying_limit"],
                "type": "object"
              },
              "methodology_version": {
                "description": "Version date of the calculator's arithmetic and assumptions.",
                "type": "string"
              },
              "planning_target": {
                "description": "Assets included plus the optional income allowance, in USD.",
                "minimum": 0,
                "type": "integer"
              },
              "scenarios": {
                "description": "Illustrations for $0, $1M, $2M, $3M, $5M, and $10M of umbrella coverage.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "meets_target": {
                      "description": "Whether this scenario's combined limit reaches the planning target.",
                      "type": "boolean"
                    },
                    "target_shortfall": {
                      "description": "Planning target left uncovered by this arithmetic scenario, floored at zero, in USD.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "total_liability_limit": {
                      "description": "One applicable underlying limit plus this umbrella scenario, in USD; not a claim-payout guarantee.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "umbrella_limit": {
                      "description": "Illustrated additional umbrella limit in USD.",
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["meets_target", "target_shortfall", "total_liability_limit", "umbrella_limit"],
                  "type": "object"
                },
                "type": "array"
              },
              "sources": {
                "description": "Primary background sources; premiums and required limits still come from the caller.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "reviewed_on": {
                      "description": "Date Coverage Cat reviewed this background source; not a quote effective date.",
                      "format": "date",
                      "type": "string"
                    },
                    "title": {
                      "description": "Title of the primary background source.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Public URL of the primary background source.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["reviewed_on", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "specialist_review_needed": {
                "description": "True when none of the illustrated umbrella limits meets the arithmetic target.",
                "type": "boolean"
              }
            },
            "required": ["additional_limit_needed", "assets_included", "assumptions", "disclaimer", "estimate_unit", "first_illustrated_limit_meeting_target", "income_allowance", "inputs", "methodology_version", "planning_target", "scenarios", "sources", "specialist_review_needed"],
            "type": "object"
          },
