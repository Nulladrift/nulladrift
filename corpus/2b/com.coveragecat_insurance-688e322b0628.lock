        {
          "name": "submit_feedback",
          "title": "Send Coverage Cat feedback",
          "description": "Send a bug report, suggestion, or purchase-flow problem to Coverage Cat's internal review queue at any stage. Send only feedback the user asked to share or an agent's own technical observation. Omit personal information, credentials, payment details, and transcripts. This does not change an application, request policy service, or authorize a purchase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "default": "other",
                "description": "Whether this is a bug report, suggestion, or other product feedback.",
                "enum": ["bug", "suggestion", "other"],
                "type": "string"
              },
              "message": {
                "description": "Describe the problem or suggestion. Omit personal information, credentials, payment details, and transcripts.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "request_id": {
                "description": "Optional UUID. Reuse it when retrying the same feedback to avoid duplicate notifications.",
                "format": "uuid",
