                "description": "Number of drivers in the household who are younger than 22.",
                "minimum": 0,
                "type": "integer"
              },
              "jet_skis": {
                "description": "Count of personal watercraft such as jet skis.",
                "minimum": 0,
                "type": "integer"
              },
              "large_watercraft": {
                "description": "Count of boats of any size; personal watercraft go under jet_skis.",
                "minimum": 0,
                "type": "integer"
              },
              "motorcycles": {
                "description": "How many motorcycles should be added to the total vehicle exposure.",
                "minimum": 0,
                "type": "integer"
              },
              "moving_violations": {
                "description": "Total moving violations across all household drivers. Omitted counts as none; a high count can move the profile to specialized review or make it ineligible for instant pricing.",
                "minimum": 0,
                "type": "integer"
              },
