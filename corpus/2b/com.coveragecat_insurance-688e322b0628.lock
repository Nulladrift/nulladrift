          "name": "homeowners_consumer_service",
          "title": "Preview or open homeowners service request",
          "description": "Preview or open a cancellation, refund, or support request for a consumer homeowners policy. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. Stay on the same consumer-operated MCP subset after bind. Preview the consequences first, then send confirm_request: true only after the shopper approves opening the request. Do not describe a cancellation, refund, or support issue as completed until Coverage Cat confirms the final outcome.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "requested_effective_date is required when request_type is policy_cancellation.",
            "properties": {
              "confirm_request": {
                "description": "Whether to open the request now. false, the default, returns a preview of the consequences without opening anything; send true only after the shopper approves that preview.",
                "type": "boolean"
              },
              "details": {
                "description": "Shopper-approved context beyond the short reason, such as the specifics of a billing dispute, recorded on the request and its preview.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Key you generate to identify one logical homeowners_consumer_service request, so a retry cannot apply it twice. After a timeout or transport failure, retry with the same key and identical arguments to get the original result back; Coverage Cat keeps that result for 24 hours and rejects different arguments sent under a used key.",
                "type": "string"
              },
              "intake_access_token": {
                "description": "Send the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. Required for stateless MCP 2026-07-28 requests; also accepted by legacy hosts. Keep it private and never show it to the shopper.",
                "type": "string"
              },
              "reason": {
                "description": "Short shopper-approved reason for the request.",
                "type": "string"
              },
              "request_type": {
                "description": "What the shopper wants done after purchase. `policy_cancellation` asks the carrier to end the policy on requested_effective_date; `refund_request` asks the carrier or billing provider to review a refund or outstanding balance without changing coverage; `support_case` opens a general support case for anything else.",
                "enum": ["policy_cancellation", "refund_request", "support_case"],
                "type": "string"
              },
              "requested_effective_date": {
                "description": "Day the shopper wants a cancellation to take effect; used only for policy_cancellation. It is a request: the carrier reviews it and may set a different date.",
                "format": "date",
                "type": "string"
              },
              "uid": {
                "description": "Coverage Cat intake uid for the current shopper session.",
                "type": "string"
              }
