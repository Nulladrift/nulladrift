        {
          "name": "umbrella_consumer_policy",
          "title": "Get umbrella policy",
          "description": "Read the current bound or cancelled umbrella policy record, policy documents, and any existing cancellation, refund, or support request history. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. This request records access attribution and rotates follow-up access, but does not advance or change policy state. Use it after Coverage Cat reports a policy on file, or after a service request is opened, to show policy facts without switching to delegated tools.",
