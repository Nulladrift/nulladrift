      "serverInfo": {
        "name": "coverage-cat-product-mcp",
        "title": "Coverage Cat Insurance",
        "version": "0.1.0",
        "description": "Help a personal insurance agent start Coverage Cat's real umbrella shopping flows, use read-only calculators, and browse setup docs from one MCP connection.",
        "websiteUrl": "https://www.coveragecat.com/developers/mcp",
        "icons": [
          {
            "src": "https://www.coveragecat.com/images/general/original/logo-opengraph.png",
            "mimeType": "image/png",
            "sizes": ["1640x856"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Umbrella shopping and research calculators are public. Existing homeowners policy support remains available. If Coverage Cat MCP tools are unavailable in a runtime that supports MCP, stop and ask a short choice question. Ask the question on its own line exactly as:\n\nWould you like to install the Coverage Cat MCP (recommended) or use the REST/CLI tools instead?\nIf the shopper wants Coverage Cat to shop for or buy umbrella insurance, start with `umbrella_consumer_prefill`, not the read-only umbrella calculator, then stay on the same consumer subset through quoted offers, declarations upload, payment_needed, optional agentic payment collection, payment_url fallback, and post-bind policy/support follow-up with `consumer_intake_issues`, `consumer_intake_patch`, `umbrella_consumer_select`, `umbrella_consumer_bind`, `umbrella_consumer_attach`, `umbrella_consumer_payment`, `umbrella_consumer_policy`, and `umbrella_consumer_service`. Use `sandbox: true` only on the first umbrella prefill call for a synthetic rehearsal, and try `umbrella_consumer_payment` first when Coverage Cat returns `payment_needed`.\nNew homeowners applications and quotes are retired. For an existing policy, use consumer_intake_issues, homeowners_consumer_policy, and homeowners_consumer_service with the existing authorized intake.\nUntil submission, say explicitly that the application is not submitted yet. Use `docs_list_topics`, `docs_search`, and `docs_get_resource` for quickstart, auth, sandbox, and OpenAPI help. Delegated MCP/OpenAPI: https://www.coveragecat.com/api/agent/mcp and https://www.coveragecat.com/api/agent/openapi.yaml. Consumer REST/OpenAPI: https://www.coveragecat.com/api/consumer and https://www.coveragecat.com/api/consumer/openapi.yaml.\nFor stateless MCP requests, carry the latest intake_access_token as an explicit tool argument on every shopper follow-up. Do not depend on cookies or a prior connection.",
      "tools": [
        {
          "name": "auto_estimates",
          "title": "Auto insurance estimates",
          "description": "Estimate monthly auto premiums for one driver and vehicle profile across several carriers. Returns each carrier's id, name, and monthly premium spread (lowest, lower, median, upper, and highest modeled premium) in US dollars, plus the normalized inputs the model used. These are model estimates for research, not bindable quotes.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "age": {
                "description": "Age in years of the driver being priced; the model converts it to a birth year.",
                "minimum": 16,
                "type": "integer"
              },
              "collision_deductible": {
                "description": "Dollars the driver pays toward a collision repair before collision coverage pays the rest. Omitted means $1,000.",
                "type": "integer"
              },
              "comprehensive_deductible": {
                "description": "Dollars the driver pays toward non-collision damage, such as theft, hail, or vandalism, before comprehensive coverage pays the rest. Omitted means $1,000.",
                "type": "integer"
              },
              "gender": {
                "description": "Driver gender code the pricing model rates on: `M` for male, `F` for female, or `N` when not specified.",
                "type": "string"
              },
              "make": {
                "description": "Vehicle manufacturer, such as `Toyota` or `Honda`.",
                "type": "string"
              },
              "model": {
                "description": "Vehicle model, such as `Camry` or `Civic`.",
                "type": "string"
              },
              "seed": {
                "description": "Optional deterministic seed for the estimate sample when a caller wants stable repeat runs.",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code for the garaging address or rating state.",
                "type": "string"
              },
              "style": {
                "description": "Vehicle trim, body style, or submodel when you want to narrow the vehicle match.",
                "type": "string"
              },
              "year": {
                "description": "Vehicle model year. With make and model it prices a specific car; omit it to price a generic vehicle instead.",
                "type": "integer"
              },
              "zip": {
                "description": "ZIP code for the driver or garaging location being priced.",
                "type": "string"
              }
            },
            "required": ["age", "gender", "state", "zip"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "carriers": {
                "description": "One estimate per carrier the model could price.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "carrier": {
                      "description": "Carrier id, such as `geico`.",
                      "type": "string"
                    },
                    "monthly": {
                      "additionalProperties": false,
                      "description": "Modeled monthly premium spread for this carrier. Whole US dollars per month.",
                      "properties": {
                        "lower": {
                          "description": "Lower end of the typical range.",
                          "type": "integer"
                        },
                        "max": {
                          "description": "Highest modeled premium.",
                          "type": "integer"
                        },
                        "median": {
                          "description": "Median modeled premium.",
                          "type": "integer"
                        },
                        "min": {
                          "description": "Lowest modeled premium.",
                          "type": "integer"
                        },
                        "upper": {
                          "description": "Upper end of the typical range.",
                          "type": "integer"
                        }
                      },
                      "required": ["lower", "max", "median", "min", "upper"],
                      "type": "object"
                    },
                    "name": {
                      "description": "Carrier display name.",
                      "type": "string"
                    }
                  },
                  "required": ["carrier", "monthly", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "description": "Notice that these figures are informational estimates, not binding quotes; relay it with the numbers.",
                "type": "string"
              },
              "estimate_unit": {
                "description": "Unit of the monthly premium spreads: `monthly_premium_usd`.",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": true,
                "description": "Driver, vehicle, and deductible values the model used, with defaults filled in for omitted inputs.",
                "type": "object"
              }
            },
            "required": ["carriers", "disclaimer", "estimate_unit", "inputs"],
            "type": "object"
          },
