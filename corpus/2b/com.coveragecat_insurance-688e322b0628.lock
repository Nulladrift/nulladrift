                          "description": "Typical annual premium.",
                          "type": "integer"
                        }
                      },
                      "required": ["coverage_millions", "high", "low", "mid"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "umbrella_class": {
                    "description": "Class used for pricing; it adds `_with_youth` to a standard class when any driver is under 22.",
                    "type": "string"
                  }
                },
                "required": ["class", "prices", "umbrella_class"],
                "type": "object"
              },
              "estimate_unit": {
                "description": "Unit of every price: `annual_premium_usd`, annual premium in US dollars.",
                "type": "string"
              },
              "factor_impacts": {
