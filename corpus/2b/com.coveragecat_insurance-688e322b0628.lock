        {
          "name": "umbrella_consumer_select",
          "title": "Umbrella consumer offer select",
          "description": "Continue the consumer-prefill umbrella flow after quotes are ready. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. Stay on the same consumer-operated MCP subset, use the returned selection_token, collect the real user's consumer-report authorization for insurance underwriting here, and let Coverage Cat enter the normal post-choose workflow without switching to delegated tools. A selected Monoline offer also requires the separate returned MVR authorization; show its full text and source URL and collect both receipts in the same turn. If the quote payload exposed selection_guidance.same_reply_requirements for the chosen offer, send those answers under intake on this first select call. If Coverage Cat returns a consent-required response with a bind-stage next_question, ask for all returned authorizations and details together, then retry this same tool with the receipts and intake.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "credit_consent": {
                "additionalProperties": false,
                "description": "The real user's response to Coverage Cat's current consumer-report authorization for insurance underwriting, collected only after Coverage Cat returns the disclosure.",
                "properties": {
                  "answer": {
                    "description": "Records the shopper's own Yes, No or Revoke reply. Preserve declines and revocations; never infer or convert another answer into Yes.",
                    "enum": ["Yes", "No", "Revoke"],
                    "type": "string"
                  },
                  "collected_from_user": {
                    "const": true,
                    "description": "Attests that the shopper personally answered the displayed authorization in this conversation, rather than the agent assuming their response.",
                    "type": "boolean"
                  },
                  "disclosure_hash": {
                    "description": "The text_hash from credit_consent_disclosure.",
                    "type": "string"
                  },
                  "disclosure_version": {
                    "description": "The version from credit_consent_disclosure.",
                    "type": "string"
                  },
                  "presentation_reference": {
                    "description": "Optional opaque conversation or message reference; do not include message contents or personal information.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "presented_at": {
                    "description": "RFC 3339 timestamp from the assistant runtime for when the complete disclosure was shown. It must be within the prior 24 hours and no more than five minutes in the future.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "shown_to_user": {
                    "const": true,
                    "description": "Attests that the complete returned disclosure text was presented verbatim before the shopper answered.",
                    "type": "boolean"
