                "description": "Total at-fault accidents across all household drivers. Omitted counts as none; a high count can move the profile to specialized review or make it ineligible for instant pricing.",
                "minimum": 0,
                "type": "integer"
              },
              "auto_count": {
                "description": "How many cars, trucks, or SUVs are in the household auto profile.",
                "minimum": 0,
                "type": "integer"
