        {
          "name": "file_a_claim",
          "title": "Auto claim filing break-even calculator",
          "description": "Estimate whether filing an auto collision claim costs more than paying for the repair yourself. Returns monthly premium spreads with and without one claim, the monthly and multi-year premium increase, the collision deductible, the total cost of filing (deductible plus premium increase), and a file_claim or pay_out_of_pocket recommendation with the estimated savings. These are model estimates, not carrier quotes.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "age": {
                "description": "Age in years of the driver being priced; the model converts it to a birth year.",
                "minimum": 16,
                "type": "integer"
              },
              "collision_deductible": {
                "description": "Dollars the driver pays toward a collision repair before collision coverage pays the rest. Omitted means $1,000.",
                "type": "integer"
              },
              "comprehensive_deductible": {
                "description": "Dollars the driver pays toward non-collision damage, such as theft, hail, or vandalism, before comprehensive coverage pays the rest. Omitted means $1,000.",
                "type": "integer"
              },
              "gender": {
                "description": "Driver gender code the pricing model rates on: `M` for male, `F` for female, or `N` when not specified.",
                "type": "string"
              },
              "make": {
                "description": "Vehicle manufacturer, such as `Toyota` or `Honda`.",
                "type": "string"
              },
              "model": {
                "description": "Vehicle model, such as `Camry` or `Civic`.",
                "type": "string"
              },
              "repair_estimate": {
                "description": "Approximate dollar amount you expect to pay to repair the vehicle if you do not file a claim.",
                "minimum": 0,
                "type": "integer"
              },
              "seed": {
                "description": "Optional deterministic seed for the estimate sample when a caller wants stable repeat runs.",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code for the garaging address or rating state.",
                "type": "string"
              },
              "style": {
                "description": "Vehicle trim, body style, or submodel when you want to narrow the vehicle match.",
                "type": "string"
              },
              "year": {
                "description": "Vehicle model year. With make and model it prices a specific car; omit it to price a generic vehicle instead.",
                "type": "integer"
              },
              "zip": {
                "description": "ZIP code for the driver or garaging location being priced.",
                "type": "string"
              }
            },
            "required": ["age", "gender", "repair_estimate", "state", "zip"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim_monthly": {
                "additionalProperties": false,
                "description": "Monthly premium spread after filing one claim. Whole US dollars per month.",
                "properties": {
                  "lower": {
                    "description": "Lower end of the typical range.",
                    "type": "integer"
                  },
                  "max": {
                    "description": "Highest modeled premium.",
                    "type": "integer"
                  },
                  "median": {
                    "description": "Median modeled premium.",
                    "type": "integer"
                  },
                  "min": {
                    "description": "Lowest modeled premium.",
                    "type": "integer"
                  },
                  "upper": {
                    "description": "Upper end of the typical range.",
                    "type": "integer"
                  }
                },
                "required": ["lower", "max", "median", "min", "upper"],
                "type": "object"
              },
              "deductible": {
                "description": "Collision deductible paid when filing.",
                "type": "integer"
              },
              "disclaimer": {
                "description": "Notice that these figures are informational estimates, not binding quotes; relay it with the numbers.",
                "type": "string"
              },
              "estimate_unit": {
                "description": "Currency of every dollar figure: `usd`.",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": true,
                "description": "Driver, vehicle, and deductible values the model used, with defaults filled in for omitted inputs.",
                "type": "object"
              },
              "monthly_increase": {
                "description": "Median monthly premium increase after the claim.",
                "type": "integer"
              },
              "no_claim_monthly": {
                "additionalProperties": false,
                "description": "Monthly premium spread with no claim on record. Whole US dollars per month.",
                "properties": {
                  "lower": {
                    "description": "Lower end of the typical range.",
                    "type": "integer"
                  },
                  "max": {
                    "description": "Highest modeled premium.",
                    "type": "integer"
                  },
                  "median": {
                    "description": "Median modeled premium.",
                    "type": "integer"
                  },
                  "min": {
                    "description": "Lowest modeled premium.",
                    "type": "integer"
                  },
                  "upper": {
                    "description": "Upper end of the typical range.",
                    "type": "integer"
                  }
                },
                "required": ["lower", "max", "median", "min", "upper"],
                "type": "object"
              },
              "premium_impact_years": {
                "description": "Years the higher premium is assumed to last.",
                "type": "integer"
              },
              "premium_increase": {
                "description": "Total extra premium over premium_impact_years.",
                "type": "integer"
              },
              "recommendation": {
                "additionalProperties": false,
                "description": "Whether filing or paying out of pocket costs less; null when no repair estimate was read.",
                "properties": {
                  "action": {
                    "description": "`file_claim` when repair_estimate exceeds total_claim_cost, otherwise `pay_out_of_pocket`.",
                    "type": "string"
                  },
                  "estimated_savings": {
                    "description": "Dollars saved by taking action instead of the alternative.",
                    "type": "integer"
                  }
                },
                "required": ["action", "estimated_savings"],
                "type": ["object", "null"]
              },
              "repair_estimate": {
                "description": "The repair estimate you sent.",
                "type": "integer"
              },
              "total_claim_cost": {
                "description": "Total cost of filing: deductible plus premium_increase.",
                "type": "integer"
              }
            },
            "required": ["claim_monthly", "deductible", "disclaimer", "estimate_unit", "inputs", "monthly_increase", "no_claim_monthly", "premium_impact_years", "premium_increase", "repair_estimate", "total_claim_cost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
