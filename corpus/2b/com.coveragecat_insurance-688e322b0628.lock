        {
          "name": "consumer_intake_issues",
          "title": "Get consumer intake status",
          "description": "Read the status of an umbrella application or an existing homeowners policy. Records request attribution and rotates follow-up access. In the umbrella sandbox, polling advances checkout and can create a synthetic policy; it does not issue real coverage. Returns the intake's status and detail_status, whether the application is submitted, the staged review and next_question, quoted offers with their selection_token, and any post-choose, payment, policy, or conversation state. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. Stay on the default consumer-operated subset and, before submission, say explicitly that the application is not submitted yet. For umbrella, keep missing fields hidden until Coverage Cat stages the single pre-submit review turn, then ask only for the explicitly missing shopper-owned fields in `next_question` and invite corrections instead of re-keying reviewed values. Coverage Cat will not resume or expose a prior consumer umbrella draft based on email alone. Continue an existing consumer draft only through the issued uid plus the current hidden MCP session or latest intake_access_token handoff. Normalize shopper birthdays from MM-DD-YYYY to YYYY-MM-DD before you patch Coverage Cat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intake_access_token": {
                "description": "Send the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. Required for stateless MCP 2026-07-28 requests; also accepted by legacy hosts. Keep it private and never show it to the shopper.",
                "type": "string"
              },
              "uid": {
                "description": "Coverage Cat intake uid for the existing authorized intake or returned by `umbrella_consumer_prefill` and echoed on every follow-up response. Reuse it for each follow-up call on the same application.",
                "type": "string"
              }
            },
            "required": ["uid"],
            "type": "object"
          },
