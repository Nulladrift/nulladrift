          "name": "umbrella_consumer_prefill",
          "title": "Umbrella consumer prefill handoff",
          "description": "Preferred umbrella MCP entry point when a shopper wants Coverage Cat to shop for, compare, or buy umbrella insurance and no operator bearer token is present. On a cold start, call this before asking the shopper a questionnaire and assemble the fullest justified estimate from user-controlled context. Use canonical umbrella keys such as address.street/city/state/zip, license_state, license_number, approximate_asset_value or net_worth_numeric, desired_coverage_limit, required_coverage_e_limit, and vehicle_count or umbrella_details.motorized_vehicle_count. Do not send vehicles rows before submission. Stay on the same consumer-operated subset through `consumer_intake_issues`, `consumer_intake_patch`, `umbrella_consumer_select`, `umbrella_consumer_bind`, `umbrella_consumer_attach`, `umbrella_consumer_payment`, `umbrella_consumer_policy`, and `umbrella_consumer_service`. If you are rehearsing the shopper flow, set `sandbox: true` on this first prefill call only. That same consumer sandbox uid can then continue through the same shopper-safe flow. Reuse uid and the latest intake_access_token from the previous successful Coverage Cat response on each follow-up. MCP 2026-07-28 is stateless and requires that token. Legacy MCP hosts may also preserve hidden shopper session authorization. Keep tokens private and stay on this same MCP follow-up tool. Until later follow-up shows progress, tell the shopper the application is not submitted yet. Coverage Cat will not resume or expose a prior consumer umbrella draft based on email alone. Continue an existing consumer draft only through the issued uid plus the current hidden MCP session or latest intake_access_token handoff.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acquisition_campaign": {
                "description": "Optional public campaign code supplied in the shopper's starting prompt. Copy it only when supplied; do not infer it or send personal information. It does not change eligibility or pricing.",
                "enum": ["ba26_direct_task", "ba26_direct_review", "ba26_tinkerers_task", "ba26_tinkerers_review", "ba26_latent_task", "ba26_latent_review", "ba26_linkedin_task", "ba26_linkedin_review", "ba26_hn_task", "ba26_hn_review", "ba26_reddit_task", "ba26_reddit_review", "ba26_x_task", "ba26_x_review"],
