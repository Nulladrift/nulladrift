                "type": "boolean"
              },
              "field_estimates": {
                "description": "Provenance for intake values you inferred from context rather than heard from the shopper, one row per inferred value. On the initial umbrella handoff, add rows only for fields that already appear in the current umbrella review; otherwise send `intake` alone.",
                "items": {
                  "additionalProperties": true,
