        {
          "name": "add_new_place",
          "title": "Add a missing place",
          "description": "Adds a place that is not on the map yet, and saves it for the user (want to go, or been). Only after search_places did not find it. The name must be the place's real name, never an address; the coordinates come from read_place_link, from an address search_places returned, or from the user. It becomes a place everyone can find, so confirm the name and where it is with the user first. Returns a place_ref for add_trip_idea and update_trip_idea.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Its address, when known.",
                "maxLength": 200,
                "type": "string"
              },
              "category": {
                "description": "One word for what it is, e.g. restaurant, cafe, bar, museum, viewpoint, beach, shop.",
                "maxLength": 40,
                "type": "string"
              },
              "lat": {
                "description": "Where it is.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Where it is.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "name": {
                "description": "The place's name, e.g. \"Bodega La Fuente\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "note": {
                "description": "The user's own words about it.",
                "maxLength": 280,
                "type": "string"
              },
              "state": {
                "description": "Default want_to_go.",
                "enum": ["want_to_go", "been"],
                "type": "string"
              }
            },
            "required": ["lat", "lng", "name"],
            "type": "object"
