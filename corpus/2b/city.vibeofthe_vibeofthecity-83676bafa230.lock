          "description": "Logs an activity the user did on a trip — a tour, a tasting, a class, a boat trip, often a GetYourGuide or Viator link — with their verdict, and with publish true recommends it on the trip city's Things to do. An activity is not a place: it needs no pin and never has to be added as one. Pass idea_id when it is already on the plan (from get_trip), else text and url to add it. Ask how it was first; publish only when they say so. A published recommendation shows the activity, the link and their tip to everyone once we have reviewed it; their name only to their contacts.",
