        {
          "name": "get_host_guide",
          "title": "Host guide",
          "description": "A published host guide (a holiday flat, a hotel, a guide's page): check-in facts, house information such as wifi and parking, and the host's own tips with coordinates. Call it when the user is staying somewhere with a Vibe of the City guide and asks about the place or the host's tips.",
          "inputSchema": {
