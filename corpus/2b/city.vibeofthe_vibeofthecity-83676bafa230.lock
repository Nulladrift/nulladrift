        {
          "name": "add_trip_idea",
          "title": "Add to a trip",
          "description": "Adds an idea to a trip: something to do, optionally on a day, at a time and for a length, optionally pinned to a place (place_ref) or to an address from search_places (name, lat, lng without a place_ref). Everyone on the trip sees it and may get a notification. Confirm the wording, day and time with the user first.",
