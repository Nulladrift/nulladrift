      "serverInfo": {
        "name": "vibeofthecity",
        "title": "Vibe of the City",
        "version": "1.0.0-beta"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vibe of the City reads how people travel and matches each traveller with travellers who share their vibe. Call it for four things your own knowledge lacks: what a covered city is like and what is on there over the next 14 days (find_city, get_city_vibe, get_city_week); what travellers with the user's vibe chose: which city suits them and why, and where to stay (explain_city_match, where_to_stay); the user's group: which city suits them and their friends, their shared trips and who owes what (compare_city_vibes, get_trip, get_trip_balances); and the user's own saved places and trips (list_saved_places, list_my_trips). Don't call it for flights, trains, hotel prices or booking, opening hours or directions, visas, or a generic itinerary. City tools work before sign-in; tools that read or change the user's own trips, places or vibe ask them to sign in. When you use our facts, cite the url the tool returns. Get a city_slug from find_city before city tools, and a trip_id from list_my_trips before trip tools. To plan a day or a weekend of a trip, use plan_trip_days rather than adding ideas one by one; it puts nothing on the trip until add_planned_day. Before any tool that saves, adds, changes or reports something (save_place, add_new_place, add_trip_idea, update_trip_idea, set_trip_stay, add_trip_day_trip, add_planned_day, report_problem), tell the user exactly what you will do, and go ahead only once they agree. For questions about how the app works, read get_app_help and answer only from it.",
      "tools": [
        {
          "name": "adapt_my_vibe",
          "title": "Adapt my travel vibe",
          "description": "Adapts the user's travel vibe from what they say they like (\"I love the harbour, the ships, the fish restaurants by the water, and how clean it is\") or from a city they say they like. Only ever adds or raises: it never lowers or removes what they set. Call it first without apply: that saves nothing and returns what would change and why. Tell them in a sentence or two what you would adapt and why, in their own words, and ask. Only when they agree, call it again with the same arguments and apply true. Read get_my_vibe first so you don't offer what they already have.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apply": {
                "description": "true saves the changes. Only after the user agreed to the preview.",
                "type": "boolean"
              },
              "avoids": {
                "description": "What spoils a day for them, comma-separated, from: wind, jellyfish, dust_smog, thunderstorm, fog.",
                "maxLength": 120,
                "type": "string"
              },
              "because": {
                "description": "Their reason, in a short sentence in their words, e.g. \"loves the harbour and the clean streets of Málaga\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "cares": {
                "description": "Practical things they care about, comma-separated, from: solo_safety, transit, english, tap_water.",
                "maxLength": 120,
                "type": "string"
              },
              "interests": {
                "description": "What they are into, in a word or two each, comma-separated, e.g. \"seafood, sailing, boating, viewpoints\". Each is matched to the app's interests; what matches none comes back under not_in_catalog.",
                "maxLength": 300,
                "type": "string"
              },
              "like": {
                "description": "Travel types to raise to \"like\", comma-separated, from: beach, culture, nature, active, food, nightlife, wellness, romance. A harbour, ships or the sea is beach; restaurants food; bars or a casino nightlife.",
                "maxLength": 120,
                "type": "string"
              },
              "liked_city_slug": {
                "description": "A city they said they like, from find_city (\"I like it here\": the city they are in). Adds up to three travel types the city is strongest on, at \"like\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "love": {
                "description": "Travel types they said they love or can't do without, comma-separated, same ids as like.",
                "maxLength": 120,
                "type": "string"
              },
              "values": {
                "description": "What they value in a place, comma-separated, from: clean_streets, quiet_streets, walkable, architecture, heritage, cycling.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["because"],
            "type": "object"
          },
