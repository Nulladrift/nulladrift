                "description": "The day, within the trip's dates.",
                "format": "date",
                "type": "string"
              },
              "duration_minutes": {
                "description": "How long it lasts, when the user gave a length or an end time (10:00–10:30 is 30; 22:00–01:00 is 180). Needs a date and a time. Leave it out for an open end.",
                "maximum": 1440,
                "minimum": 5,
                "type": "integer"
              },
              "lat": {
                "description": "Required for a place_ref not starting with poi:, and for an address pin.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Required for a place_ref not starting with poi:, and for an address pin.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "name": {
                "description": "Required for a place_ref not starting with poi:, and for an address pin.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "note": {
                "description": "One line: booking number, meeting point, what to bring.",
