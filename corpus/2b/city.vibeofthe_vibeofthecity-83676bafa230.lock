        {
          "name": "compare_city_vibes",
          "title": "Vibe scores side by side",
          "description": "The user's vibe score (0–100, the number Explore shows) for one to five cities over a time window — today, tomorrow, the weekend, this week, this month, or the year — and, when the user names friends, each friend's score and the group's (the mean pulled towards the lowest, so a city one of them would endure does not win). Use it for \"what's the vibe score for Lisbon and Porto this week?\" or \"which city suits me, Anna and Tom best this month?\". Friends must be the user's mutual contacts; any other name comes back under not_compared, and you say you can compare only with mutual contacts. A friend's score never comes with a reason: say how well a city fits them, never why. A null score is too little to go on: say so instead of a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city_slugs": {
                "description": "One to five city_slugs from find_city, comma-separated, e.g. \"lisbon-pt,porto-pt\".",
                "maxLength": 400,
                "minLength": 2,
                "type": "string"
              },
              "when": {
                "description": "The window. Default \"week\" (the next seven days); \"year\" is the city's fit across the year.",
                "enum": ["today", "tomorrow", "weekend", "week", "month", "year"],
                "type": "string"
              },
              "with": {
                "description": "Up to three friends by name or @handle, comma-separated, e.g. \"Anna, @tomk\". Leave it out for the user alone.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["city_slugs"],
            "type": "object"
          },
