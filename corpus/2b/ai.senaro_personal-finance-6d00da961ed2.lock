        {
          "name": "compare_payoff_vs_invest",
          "title": "Debt Payoff vs. Invest",
          "description": "Calculation, not advice. Verify with a professional before acting. Compares the guaranteed return of debt payoff against expected investment returns over a time horizon.\n\nAccounts for post-payoff investing, optionally taxes the investment gain once at the horizon (this needs filing_status and annual_gross_income), and finds the break-even investment return rate. Works for credit cards, auto loans, student loans, personal loans, and mortgages.\n\nPick this when the alternative to investing is paying down an existing debt balance; pick `calculate_opportunity_cost` when there is no debt in the picture and the alternative is simply forgoing recurring spending to invest it instead.\n\nThe response echoes debt_type (canonical lowercase enum the projection was computed for) and debt_type_label (display-ready string, e.g. 'student loan') at the top level.\n\nHEAVY tool: use output='summary' (default) for the headline comparison or output='inline' for the full month-by-month schedule.\n\nWhen no projection can be computed (very long horizon, very high rate, or very large amounts), the response is { meta, not_representable: { code, explanation } } instead.",
          "inputSchema": {
            "properties": {
              "annual_gross_income": {
                "default": null,
                "description": "Annual gross income in dollars, used as adjusted gross income for the tax on investment gains at the horizon. Optional; with filing_status it enables the after-tax comparison. Held at this amount in the year of the assumed investment sale. Must be zero or more and no more than $1,000,000,000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "debt_apr_pct": {
                "description": "Debt annual percentage rate, e.g. 6.5 not 0.065. Decimal from 0 to 100. REQUIRED, no default.",
                "type": "number"
              },
              "debt_balance": {
                "description": "Current debt balance. Decimal, greater than 0. REQUIRED, no default.",
                "type": "number"
              },
              "debt_type": {
                "description": "Debt type: 'credit_card', 'auto', 'student', 'personal', or 'mortgage'. REQUIRED, no default.",
                "enum": ["credit_card", "auto", "student", "personal", "mortgage"],
                "type": "string"
              },
              "extra_monthly": {
                "description": "Extra monthly amount available for debt payoff or investing, the amount in question. Decimal, greater than 0. REQUIRED, no default.",
                "type": "number"
              },
              "filing_status": {
                "default": null,
                "description": "Tax filing status: 'single', 'married', or 'head_of_household'. Optional; matched case-insensitively. Required, with annual_gross_income, for the after-tax comparison.",
                "enum": ["single", "married", "head_of_household", null],
                "type": ["string", "null"]
              },
              "full_schedule": {
                "default": null,
                "description": "Whether to return the full month-by-month schedule. Optional; defaults to false (compact schedule) when omitted.",
                "type": ["boolean", "null"]
              },
              "investment_return_pct": {
                "default": null,
                "description": "Expected investment return, an EFFECTIVE ANNUAL rate; the monthly compounding step is (1+pct/100)^(1/12)-1. Decimal from 0 to 30. Optional; defaults to the cited long-run S&P 500 nominal return, about 10%, when omitted.",
                "type": ["number", "null"]
              },
              "investment_tax_advantaged": {
                "default": null,
                "description": "Whether the investments sit in a tax-advantaged account, e.g. 401k or IRA. Optional; defaults to false. When true, no after-tax comparison is computed: withdrawal tax depends on the account type, which this tool does not model.",
                "type": ["boolean", "null"]
              },
              "investment_volatility_pct": {
                "default": null,
                "description": "Investment volatility. Decimal. Optional; adds a volatility risk note when supplied.",
                "type": ["number", "null"]
              },
              "minimum_payment": {
                "default": null,
                "description": "Minimum monthly payment. Decimal, at least 0. Optional; auto-calculated for amortizing loans when omitted or 0.",
                "type": ["number", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default), 'inline'. 'summary' returns headline comparison scalars, milestones, and citations with monthly_schedule stripped. 'inline' returns the full payload including the month-by-month monthly_schedule[].",
                "enum": ["summary", "inline", null],
                "type": ["string", "null"]
              },
              "tax_bracket_pct": {
                "default": null,
                "description": "Marginal tax bracket, e.g. 22 not 0.22. Decimal from 0 to 100. Optional; used only for the mortgage or student loan interest deduction warning. It is never applied to investment gains.",
                "type": ["number", "null"]
              },
              "tax_year": {
                "default": null,
                "description": "Tax year, 2025 or 2026. Year 1 of the time horizon, so the assumed sale of the investments falls in tax year tax_year plus the horizon in years, rounded up, minus 1. Optional; defaults to 2026 when omitted.",
                "maximum": 2026,
                "minimum": 2025,
                "type": ["integer", "null"]
              },
              "term_months_remaining": {
                "default": null,
                "description": "Months remaining on the debt. Integer, greater than 0. Required for non-credit-card debt types; optional for credit_card.",
                "type": ["integer", "null"]
              },
              "time_horizon_years": {
                "default": null,
                "description": "Projection horizon. Integer, greater than 0. Optional; defaults to the greater of the payoff horizon or 10 years when omitted.",
                "type": ["integer", "null"]
              }
            },
            "required": ["debt_apr_pct", "debt_balance", "debt_type", "extra_monthly"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debt Payoff vs. Invest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f875ee943319bf6bc9bb35f7de25ca2b2c4333310567a7a2993d385fd50a4e91"
        },
        {
          "name": "compare_rent_vs_buy",
          "title": "Rent vs. Buy Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Deterministic rent-vs-buy decision model. Given a home price, monthly rent, and mortgage rate, computes the breakeven month (when BUY net worth first equals or exceeds RENT net worth), per-horizon net-worth comparison (years 5, 10, 30 + user horizon), and the full year-by-year cost/wealth series for both paths.\n\nIncludes carrying costs (property tax, insurance, maintenance, PMI, HOA) on the BUY path and opportunity-cost investing on the RENT path.\n\nOptional federal tax benefit model (Tier-3: apply_tax_benefit=true) with the statute's year-by-year SALT cap schedule (advancing with the horizon, not frozen at tax_year), mortgage interest deduction, PMI deductibility, and marginal-excess formula.\n\nAll assumptions cite primary sources (FHFA, BLS, Harvard JCHS, IRS Pub 936, OBBBA Pub. L. 119-21) and can be overridden.\n\nPick this for the buy-vs-rent tenure decision; pick `compare_mortgage_terms` when you are already buying and comparing two mortgage structures, `compare_payoff_strategies` to order credit-card payoff, and `compare_payoff_vs_invest` to weigh extra debt payments against investing.\n\nHEAVY tool: use output='summary' (default) for scalar headline or output='inline' for chart series.",
          "inputSchema": {
            "properties": {
              "age_65_plus_count": {
                "default": null,
                "description": "Number of filers aged 65 or older, each adding the additional standard deduction. Integer from 0 to 2. Only used when apply_tax_benefit is true. Optional; defaults to 0 when omitted.",
                "type": ["integer", "null"]
              },
              "annual_gross_income": {
                "default": null,
                "description": "Annual gross income, the MAGI proxy for the bracket and the SALT cap. Decimal from 0 to 1,000,000,000. Required when apply_tax_benefit is true; otherwise not used.",
                "type": ["number", "null"]
              },
              "apply_tax_benefit": {
                "default": null,
                "description": "Whether to apply the federal tax benefit model (SALT cap following the statute's year-by-year schedule, mortgage interest deduction, PMI deductibility). When true, filing_status, tax_year and annual_gross_income are required. Optional; defaults to false when omitted. The §121 home-sale gain exclusion applies only at sale points 24 months or more after purchase (IRC §121(a) 2-of-5-year test); year 1 of yearly_series, months 1-23 in monthly_series, and any horizon under 24 months use no exclusion. Separately, IRC §1222(3) makes a holding period of 12 months or less short-term, taxed at ordinary rates instead of the long-term rates otherwise applied, on the home-sale gain and the renter's portfolio gain alike (24 months vs. 12 months are two different thresholds); this tool applies that split exactly to the home-sale gain, and to the renter's portfolio at annual grain: prior years' contributions are compounded together as one long-term lot rather than aged individually, so months inside a year understate short-term gain.",
                "type": ["boolean", "null"]
              },
              "basis_capitalizable_pct_override": {
                "default": null,
                "description": "Percentage of the buy-side closing cost that is capitalizable into the §121 adjusted basis (IRS Pub 523 split: abstract fees, title search, recording fees, survey fees, transfer taxes, owner's title insurance). Decimal from 0 to 100; 0 means a HomePrice-only basis, 100 means the full closing cost is in basis. Optional; defaults to 50% (Senaro deterministic midpoint) when omitted. Supply your actual HUD-1 split when available.",
                "type": ["number", "null"]
              },
              "blind_count": {
                "default": null,
                "description": "Number of blind filers, each adding the additional standard deduction. Integer from 0 to 2. Only used when apply_tax_benefit is true. Optional; defaults to 0 when omitted.",
                "type": ["integer", "null"]
              },
              "charitable": {
                "default": null,
                "description": "Charitable contributions. Decimal from 0 to 1,000,000,000; TY2026 and later apply a 0.5%-of-AGI floor per OBBBA §70425. Only used when apply_tax_benefit is true. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "down_payment_pct": {
                "default": null,
                "description": "Down payment as a percentage of the home price. Decimal from 0 to 100; 0 is valid (zero-down programs). Optional; defaults to 20% when omitted.",
                "type": ["number", "null"]
              },
              "filing_status": {
                "default": null,
                "description": "Tax filing status: 'Single', 'MFJ', 'MFS' or 'HoH'. Required when apply_tax_benefit is true; otherwise not used.",
                "type": ["string", "null"]
              },
              "hoa_monthly": {
                "default": null,
                "description": "Monthly HOA dues on the BUY path. Decimal from 0 to 1,000,000,000. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "home_appreciation_pct": {
                "default": null,
                "description": "Annual home price appreciation as a percentage. Decimal from -50 to 50. Optional; defaults to the cited 4.25% (FHFA HPI) when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "home_insurance_pct": {
                "default": null,
                "description": "Annual home insurance as a percentage of home value. Decimal from 0 to 15. Optional; defaults to 0.65% when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "home_price": {
                "description": "Home purchase price. Decimal, greater than 0 and at most 1,000,000,000. REQUIRED, no default.",
                "type": "number"
              },
              "horizon_years": {
                "default": null,
                "description": "Projection horizon in years. Integer from 1 to 40. Optional; when omitted, the response returns snapshots at years 5, 10 and 30.",
                "type": ["integer", "null"]
              },
              "inflation_pct": {
                "default": null,
                "description": "Inflation as a percentage, for the real_terms toggle. Decimal, at least 0 and less than 100. Optional; when omitted, a nominal run uses 2.5%, and a real_terms run uses the horizon-based default: 2.0% for a horizon of 7 years or less, 2.6% for 8 to 19 years, 2.5% for 20 years or more.",
                "type": ["number", "null"]
              },
              "investment_return_pct": {
                "default": null,
                "description": "RENT path annual return as a percentage, an EFFECTIVE ANNUAL rate; the monthly compounding step is (1+pct/100)^(1/12)-1. Decimal from -50 to 30. Optional; defaults to 10.0% when omitted.",
                "type": ["number", "null"]
              },
              "loan_origination_date": {
                "default": null,
                "description": "Mortgage origination date, YYYY-MM-DD. Selects the mortgage interest deduction cap: on or before 2017-12-15 the $1M cap, after it the $750k cap (Single and MFJ; MFS caps are half). Only used when apply_tax_benefit is true. Optional; omitting it uses the post-2017 cap.",
                "type": ["string", "null"]
              },
              "loan_term_months": {
                "default": null,
                "description": "Mortgage term in months. Integer from 1 to 480. Optional; defaults to 360 (a 30-year fixed) when omitted.",
                "type": ["integer", "null"]
              },
              "maintenance_pct": {
                "default": null,
                "description": "Annual maintenance as a percentage of home value. Decimal from 0 to 20. Optional; defaults to the cited 1.5% (Harvard JCHS) when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "monthly_rent": {
                "description": "Monthly rent on the RENT path. Decimal from 0 to 1,000,000,000; 0 is valid (a free-housing baseline). REQUIRED, no default.",
                "type": "number"
              },
              "mortgage_rate_pct": {
                "description": "Mortgage annual rate as a percentage, e.g. 6.75 for 6.75%. Decimal, greater than 0 and at most 100. Never cached; provide the current rate. REQUIRED, no default.",
                "type": "number"
              },
              "other_itemizable": {
                "default": null,
                "description": "Other itemizable deductions, such as medical expenses above 7.5% of AGI or casualty losses. Decimal from 0 to 1,000,000,000. Only used when apply_tax_benefit is true. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default), 'inline'. 'summary' returns headline scalars and per-horizon snapshots with the heavy series stripped. 'inline' returns the full payload including yearly_series[] and monthly_series[] for chart rendering.",
                "enum": ["summary", "inline", null],
                "type": ["string", "null"]
              },
              "pmi_annual": {
                "default": null,
                "description": "Annual PMI premium in dollars while PMI is active. Decimal from 0 to 1,000,000,000. Only used when apply_tax_benefit is true. Optional; when omitted it is derived from pmi_pct and the original loan amount.",
                "type": ["number", "null"]
              },
              "pmi_pct": {
                "default": null,
                "description": "Annual PMI rate as a percentage of the loan. Decimal from 0 to 5. Optional; defaults to 0.5% when omitted. The removal threshold is set by pmi_removal_ltv_pct. Models borrower-paid PMI on a conventional loan; FHA, VA and USDA mortgage insurance is not modeled.",
                "type": ["number", "null"]
              },
              "pmi_removal_ltv_pct": {
                "default": null,
                "description": "Loan-balance trigger for PMI removal, as a percentage loan-to-value. Decimal from 50 to 100. Optional; omitted, it is the 78% HPA automatic-termination threshold; provided (e.g. 80), it is whichever of 78% or your value is reached first. The rejection guard applies only when down_payment_pct is below 20 and the resolved pmi_pct is above 0, the range where PMI applies: there, a value at or above the loan's own initial LTV is rejected, because the requested removal point would already be met at the first payment, so no PMI would be modeled for any month of the loan. A value just below the initial LTV can also be reached by the first payment; then no month charges PMI either. When the resolved pmi_pct is 0, or down_payment_pct is 20 or more, no such check runs, whatever the LTV. Either way PMI also stops at the statutory amortization midpoint of the original term (12 U.S.C. §4901(7), §4902(c)), which this value cannot postpone. Models borrower-paid PMI on a conventional loan; FHA, VA and USDA mortgage insurance is not modeled.",
                "type": ["number", "null"]
              },
              "property_tax_pct": {
                "default": null,
                "description": "Annual property tax as a percentage of home value. Decimal from 0 to 10. Optional; defaults to 0.88% when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "purchase_year_points": {
                "default": null,
                "description": "Discount points paid at origination, as a percentage of the loan. Decimal from 0 to 4. Counted as cash paid at closing on every call. When apply_tax_benefit is true they are also deducted in year 1, assuming the IRS Pub 936 tests for a first-year deduction are met (main home bought with the loan, points customary and not above the local norm, cash method, not paid in place of separately listed fees, paid with your own money at or before closing, figured as a percentage of the loan and shown as points on the settlement statement), and only for the share the mortgage interest gets: the acquisition-debt limit divided by the year-1 average loan balance, when that is below 1. mortgage_rate_pct must already be the rate these points buy. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "real_terms": {
                "default": null,
                "description": "Whether to deflate the output series to a real-terms view. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              },
              "rent_growth_pct": {
                "default": null,
                "description": "Annual rent escalation as a percentage. Decimal from -50 to 50. Optional; defaults to the cited 3.4% (BLS CPI ROPR) when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "sell_side_pct": {
                "default": null,
                "description": "Sell-side transaction cost as a percentage of the sale price. Decimal from 0 to 25. Optional; defaults to the cited 7.5% (Redfin post-NAR) when omitted; override for your market.",
                "type": ["number", "null"]
              },
              "state_local_tax": {
                "default": null,
                "description": "State and local tax paid (state income or sales tax), for the SALT cap. Decimal from 0 to 1,000,000,000. Only used when apply_tax_benefit is true. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "tax_year": {
                "default": null,
                "description": "Tax year for year 1 of the horizon: 2025 or 2026. Integer. Required when apply_tax_benefit is true; otherwise not used. Horizon year y uses tax year (tax_year + y - 1) on both the tax benefit and the sale-side capital-gains tax; the SALT cap follows the statute's own schedule for that year, and every other indexed amount holds at its last-loaded table value beyond it.",
                "type": ["integer", "null"]
              }
            },
            "required": ["home_price", "monthly_rent", "mortgage_rate_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rent vs. Buy Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d7ed2b719fb1194d2b4bbc1c20be4bc7aeb63924dafe6cb4a990cfad16c95e4"
        },
        {
          "name": "list_defaults",
          "title": "Default Assumptions Catalog",
          "description": "Calculation, not advice. Verify with a professional before acting.\n\nReturns named default values used by Senaro Finance tools with source citations.\nUse before calling other tools to understand what assumptions apply automatically.\nThis tool does not accept an 'output' parameter; it always returns inline JSON.\n\nJSON parameters (all optional):\n\n- category: string.  Filter entries by category: the canonical MCP tool name that consumes\n                      the default, or \"shared\" for a default consumed by two or more tools\n                      (or not yet wired to a specific tool). Case-insensitive. The 14 valid\n                      values: calculate_cc_payoff, calculate_compound_interest,\n                      calculate_debt_to_income, calculate_emergency_fund,\n                      calculate_opportunity_cost, calculate_refi_breakeven, calculate_runway,\n                      compare_debt_consolidation, compare_mortgage_terms,\n                      compare_payoff_strategies, compare_payoff_vs_invest, compare_rent_vs_buy,\n                      optimize_401k_match, shared. An unrecognized value returns\n                      validation_error listing the accepted set.\n- name:     string.  Return one full entry. Requires category. Returns validation_error if not found.\n- verbose:  boolean. Return all 10 citation fields per entry instead of just category+name.\n                     Ignored when name is also present (single entry always includes all fields).\n                     Omit category to get the full verbose catalog.\n\nDefault (no args): index mode. Every entry with just category and name fields (~20 KB).",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "description": "Optional: filter entries by category, the canonical MCP tool name (e.g. \"compare_rent_vs_buy\") or \"shared\". Case-insensitive.",
                "type": ["string", "null"]
              },
              "name": {
                "default": null,
                "description": "Optional: return one full entry. Requires category. Returns validation_error if not found.",
                "type": ["string", "null"]
              },
              "verbose": {
                "default": false,
                "description": "Optional: return all 10 citation fields per entry instead of just category+name.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Default Assumptions Catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11989c171ba4ca382dc9257c2b47d3f16f145b073d08310d1f936413a7c7cc81"
        },
        {
          "name": "optimize_401k_match",
          "title": "401(k) Match Optimizer",
          "description": "Calculation, not advice. Verify with a professional before acting. Deterministic 401(k) employer-match optimizer. Given your annual salary, pay frequency, current contribution percent, and your employer's match formula (as a named preset or a custom tier list), computes:\n\n- the annual match you receive today;\n- the maximum match available (full match entitlement);\n- the match forfeited at your current rate;\n- the minimum contribution percent to receive the full match;\n- whether front-loading contributions would forfeit match at a no-true-up plan; and\n- a per-period schedule showing level vs. front-load paths side by side.\n\nPick this to size 401(k) contributions against the employer match formula; pick `compare_payoff_vs_invest` when the question is putting an extra monthly amount toward a debt versus investing it (that tool takes no employer-match input), not how much of the match to receive.\n\nIRS limits (402(g) elective deferral, 401(a)(17) compensation cap, 415(c) annual additions) are applied and cited in provenance. Catch-up contribution ceilings for ages 50+ and 60-63 (SECURE 2.0) are computed when participant_age is provided; when a catch-up allowance applies, applied_caps[].cap_name reads '402(g) elective deferral plus 414(v) catch-up' and limit_value carries the combined ceiling, not the bare 402(g) amount.\n\nHEAVY tool: use output='summary' (default) for the headline scalars or output='inline' for the full per-period schedule.",
          "inputSchema": {
            "properties": {
              "annual_salary": {
                "description": "Annual gross salary. Decimal > 0. REQUIRED, no default.",
                "type": "number"
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Reserved for the chart pipeline. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "contribution_pct": {
                "description": "Current employee contribution as a percent of gross pay. Decimal in [0, 100]. REQUIRED, no default.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "has_true_up": {
                "default": null,
                "description": "Whether the plan provides an annual true-up. false is the conservative assumption: surfaces front-loading forfeiture risk. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              },
              "match_preset": {
                "default": null,
                "description": "Named match-formula preset: 'safe_harbor_basic' (100% of first 3% + 50% of next 2%), 'safe_harbor_enhanced_simple' (100% of first 4%), 'qaca' (100% of first 1% + 50% of next 5%), 'fifty_pct_of_first_six_pct' (50% of first 6%). Exactly one of match_preset or match_tiers is required. Optional; omit when supplying match_tiers.",
                "enum": ["safe_harbor_basic", "safe_harbor_enhanced_simple", "qaca", "fifty_pct_of_first_six_pct", null],
                "type": ["string", "null"]
              },
              "match_tiers": {
                "default": null,
                "description": "Custom match-formula tier list. Example: [{\"match_frac\": 1.0, \"up_to_deferral_pct\": 3}, {\"match_frac\": 0.5, \"up_to_deferral_pct\": 2}] = safe_harbor_basic. Exactly one of match_preset or match_tiers is required. Optional; omit when supplying match_preset.",
                "items": {
                  "properties": {
                    "match_frac": {
                      "description": "Employer match fraction for this tier (0.5 = 50%). Must be in (0, 1].",
                      "type": ["number", "null"]
