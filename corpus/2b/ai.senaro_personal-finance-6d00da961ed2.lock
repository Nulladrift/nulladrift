        {
          "name": "calculate_refi_breakeven",
          "title": "Refinance Break-Even Analysis",
          "description": "Calculation, not advice. Verify with a professional before acting. Deterministic mortgage refinance break-even analysis. Given your current loan (balance, rate, remaining term) and a refinance offer (new rate, new term, closing costs, optional points), computes:\n\n- monthly P&I savings;\n- the cash-flow break-even month (Senaro's formula: total refinance cost divided by monthly savings, rounded up to a whole month, built on the payback test the CFPB toolkit describes);\n- the interest delta over your remaining-term horizon, and each loan's interest over its whole schedule (the current loan's remaining term, the new loan's full term);\n- a term-matched scenario that isolates the rate cut from a term reset;\n- a term-reset-trap flag (a longer term and a lower payment, but more interest over the new loan's full term than over the current loan's remaining term); and\n- the economic break-even (net-worth crossover) month under an equal-outflow model: both sides spend the same each month; the side that keeps the current loan starts with the upfront refinance cost invested at month 0 (nothing when costs are rolled in); money not spent on a payment is invested at investment_return_pct. The search runs to the end of the longer loan term, and stops earlier where a loan's term ends with money still owed.\n\nRate-and-term refis only (cash-out and tax effects are out of scope).\n\nPick this when refinancing your existing mortgage into a new rate and term is the question; pick `compare_mortgage_terms` when comparing two mortgage structures on a purchase you have not yet taken out.\n\nAll defaults cite primary sources (LodeStar/ALTA closing-cost data, the CFPB toolkit's payback test). Scalar output, no chart series. payoff_months and payoff_month_shift use {status, value, explanation}; the two break-evens use {code, month, explanation}.",
          "inputSchema": {
            "properties": {
              "chart_title": {
                "default": null,
                "description": "Reserved for the chart pipeline; validated but not yet used. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "closing_costs": {
                "default": null,
                "description": "Explicit closing costs in dollars, excluding points; total upfront cost is closing_costs plus the points cost. Decimal from 0 to 1,000,000,000. Optional; omitting it uses the cited default of 0.67% of the current balance (LodeStar 2026). An IMMEDIATE break-even requires total upfront cost to be zero AND monthly_savings to be non-negative AND roll_costs_into_loan false, i.e. closing_costs AND points both 0, not closing_costs alone; a zero-total-cost refi into a worse deal (negative monthly_savings) reports NEAR_ZERO_OR_NEGATIVE_SAVINGS instead.",
                "type": ["number", "null"]
              },
              "compute_economic_break_even": {
                "default": null,
                "description": "Whether to compute the economic (net-worth crossover) break-even. When false, economic_break_even reports NOT_REQUESTED; every other field is still returned. Optional; defaults to true when omitted.",
                "type": ["boolean", "null"]
              },
              "current_annual_rate_pct": {
                "description": "Current loan's annual rate as a percentage, e.g. 6.5 not 0.065. Decimal from 0 to 20. REQUIRED, no default.",
                "type": "number"
              },
              "current_balance": {
                "description": "Outstanding principal you would refinance. Decimal, greater than 0 and at most 1,000,000,000. REQUIRED, no default.",
                "type": "number"
              },
              "current_monthly_payment": {
                "default": null,
                "description": "Your actual statement P&I payment. Decimal, greater than 0 and at most 1,000,000,000. Optional; when supplied it overrides the formula-derived payment, so match your statement. Rounded to the cent, it must be greater than the first month's interest: current_balance rounded to the cent, times current_annual_rate_pct / 100 / 12, rounded to the cent.",
                "type": ["number", "null"]
              },
              "investment_return_pct": {
                "default": null,
                "description": "Annual return used for the economic (net-worth crossover) break-even, an EFFECTIVE ANNUAL rate: it compounds money not spent on a payment and, when costs are paid upfront, the upfront refinance cost that keeping the current loan leaves invested. The monthly compounding step is (1+pct/100)^(1/12)-1. Decimal from 0 to 30. Optional; omitting it uses the cited long-run S&P 500 nominal total-return default, about 10%; call list_defaults for the exact current value.",
                "type": ["number", "null"]
              },
              "new_annual_rate_pct": {
                "description": "The offered refinance rate as a percentage. Decimal from 0 to 20. REQUIRED, no default.",
                "type": "number"
              },
              "new_term_months": {
                "description": "The new loan term in months. Integer from 1 to 480. REQUIRED, no default.",
                "maximum": 480,
                "type": "integer"
              },
              "points": {
                "default": null,
                "description": "Discount points paid at closing, where 1.0 means 1% of the loan amount: the current balance when costs are paid upfront, or, when roll_costs_into_loan is true, the new loan amount, which includes the financed closing costs and points. Decimal from 0 to 4. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "remaining_term_months": {
                "description": "Months left on the current loan. Integer from 1 to 480. REQUIRED, no default.",
                "type": "integer"
              },
              "roll_costs_into_loan": {
                "default": null,
                "description": "Whether closing costs and points are added to the new principal instead of paid upfront. When true, points are a percentage of the new loan amount; cash-flow break-even reports COSTS_ROLLED_INTO_LOAN; and the economic break-even, when requested, compares the two loans with the financed costs in the new principal and no upfront cash. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["current_annual_rate_pct", "current_balance", "new_annual_rate_pct", "new_term_months", "remaining_term_months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Refinance Break-Even Analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edd3a2d423ca529d188be1111951e553f4c07bfad0739b159936c48bbe673729"
        },
        {
          "name": "calculate_runway",
          "title": "Cash Runway Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Deterministic cash-runway calculator. Given your liquid savings, monthly essential expenses, optional ongoing inflows (partner income, side income, severance paid as a monthly stream, unemployment benefits), and an optional expense-inflation rate, computes how many months the fund lasts before it hits zero, plus a month-by-month drawdown schedule.\n\nSingle scenario per call: to compare 'status quo' vs 'cutbacks' vs 'cutbacks + unemployment', call once per scenario with the matching expenses and inflows.\n\nWhen inflows meet or exceed expenses (and expenses are not inflating), the fund does not draw down and a self-describing does-not-deplete outcome is returned instead of a month.\n\nYield on the fund is treated as 0% in v1 (conservative). All assumptions cite their source.\n\nPick this to project how many months current savings will last against expenses and inflows; pick `calculate_emergency_fund` when the question is the fund's target size, not how long it lasts.\n\nHEAVY tool: use output='summary' (default) for the headline or output='inline' for the full schedule.",
          "inputSchema": {
            "properties": {
              "annual_inflation_rate_pct": {
                "default": null,
                "description": "Annual expense-inflation rate as a percentage. When greater than 0, expenses grow each month by the monthly equivalent of this annual rate; when 0, expenses are constant. Decimal, at least 0 and less than 100. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "chart_title": {
                "default": null,
                "description": "Reserved for the chart pipeline; validated but not yet used. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "current_savings": {
                "description": "Liquid fund available to draw down. Decimal from 0 to 1,000,000,000; 0 is valid (an already-empty fund). REQUIRED, no default.",
                "type": "number"
              },
              "monthly_essential_expenses": {
                "description": "Monthly outflow at the chosen expense basis. Decimal, greater than 0 and at most 1,000,000,000. REQUIRED, no default.",
                "type": "number"
              },
              "monthly_inflows": {
                "default": null,
                "description": "Ongoing monthly income that continues during the drawdown (partner income, side income, unemployment benefit, severance paid monthly), modeled as a flat monthly stream; a one-time severance lump and time-limited benefits are not modeled in v1. Decimal from 0 to 1,000,000,000. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default), 'inline'. 'summary' returns headline scalars (depletion month or does-not-deplete) and citations with the schedule stripped. 'inline' returns the full payload including the month-by-month schedule[] for chart rendering.",
                "enum": ["summary", "inline", null],
                "type": ["string", "null"]
              },
              "use_essential_expenses": {
                "default": null,
                "description": "Expense basis: true means essential-only spending (survival runway), false means total spending (current-pace runway). Labels the reported expense_basis. Optional; defaults to true when omitted.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["current_savings", "monthly_essential_expenses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cash Runway Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:371ca2aae8d6212ce73317f5a4a4421ea682e10cf91aadc69fd0e72100ed037d"
        },
        {
          "name": "compare_debt_consolidation",
          "title": "Debt Consolidation Comparison",
          "description": "Calculation, not advice. Verify with a professional before acting. Compares keeping cards vs. consolidation loan vs. optional balance transfer offers (single offer or head-to-head multi-offer comparison via bt_offers[]).\n\nSupports partial balance transfers via bt_transfer_limit: transfers only up to that dollar amount (choosing cards by highest APR, highest balance, or manually), then runs a combined simulation of the BT card + remaining original-card balances together, so freed minimum payments are correctly redistributed.\n\nShows total cost, interest saved, monthly payment change, origination fee breakeven, hidden risks (reracking), promo-trap detection per offer, and what-if scenarios. Works with multiple cards including cash advance balances.\n\nPick this to weigh a consolidation loan (required input), plus any balance-transfer offers, against keeping current cards; pick `calculate_cc_payoff` for a single payoff timeline with no consolidation option, and pick `compare_payoff_strategies` to compare avalanche against snowball ordering on the cards as they stand.\n\nThe response includes `chart_hints` with rendering directives any client can use.\n\nHEAVY tool: use output='summary' (default) for the headline comparison or output='inline' for the full payload.",
          "inputSchema": {
            "properties": {
              "bt_apr_pct": {
                "default": null,
                "description": "Balance-transfer APR as a percentage, 0-100, e.g. 0 for a 0% promo. Required when include_balance_transfer is true and bt_offers is omitted. bt_offers, when supplied, overrides this and the other three bt_* scalars below. The 0-100 range applies only when include_balance_transfer is true and bt_offers is omitted; a non-number is rejected in every case.",
                "type": ["number", "null"]
              },
              "bt_fee_pct": {
                "default": null,
                "description": "Balance-transfer fee as a percentage of the transferred balance, 0-10. Optional; defaults to 3.0 when omitted. bt_offers, when supplied, overrides this. The 0-10 range applies only when include_balance_transfer is true and bt_offers is omitted; a non-number is rejected in every case.",
                "type": ["number", "null"]
              },
              "bt_manual_transfers": {
                "default": null,
                "description": "Exact per-card transfer amounts. Required when bt_transfer_strategy is 'manual'; each entry's card_name must match a name in cards[]. Optional otherwise; a JSON null is treated as omitted, the same as leaving the field out.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Dollar amount to transfer from this card, greater than $0, up to $1,000,000,000. Required per entry.",
                      "type": ["number", "null"]
                    },
                    "card_name": {
                      "description": "Card name; must match a name in cards[]. Required per entry. Max 120 characters.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"]
              },
              "bt_offers": {
                "default": null,
                "description": "Balance-transfer offers to compare head-to-head, 1 to 10, preferred over the four scalar bt_* fields above when comparing two or more offers: when supplied, bt_offers overrides bt_apr_pct, bt_promo_months, bt_regular_apr_pct, and bt_fee_pct, and their range checks are skipped. The response includes a balance_transfer_offers block with per-offer simulation results, selected_offer_index, selected_offer_label, selected_offer_reason, and all_offers_trap. Optional; a JSON null is rejected, unlike bt_manual_transfers and windfalls below, where a JSON null is treated as omitted.",
                "items": {
                  "properties": {
                    "apr_pct": {
                      "description": "Offer APR as a percentage, 0-100, e.g. 0 for a 0% promo. Required per offer.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "fee_pct": {
                      "description": "Balance-transfer fee for this offer, as a percentage of the transferred balance, 0-10. Optional; defaults to 3.0 when omitted.",
                      "type": ["number", "null"]
                    },
                    "label": {
                      "description": "Label for this offer. Optional; defaults to '<apr_pct>% / <promo_months>mo' when omitted. Max 120 characters.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    },
                    "promo_months": {
                      "description": "This offer's promo period in months, 1-60. Optional; defaults to 18 when omitted.",
                      "type": ["integer", "null"]
                    },
                    "regular_apr_pct": {
                      "description": "APR that applies after this offer's promo period ends, as a percentage, 0-100. Optional; defaults to 25.20 when omitted.",
                      "type": ["number", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "maxItems": 10,
                "type": ["array", "null"]
              },
              "bt_promo_months": {
                "default": null,
                "description": "Balance-transfer promo period in months, 1-60. Optional; defaults to 18 when omitted. bt_offers, when supplied, overrides this. The 1-60 range applies only when include_balance_transfer is true and bt_offers is omitted; a non-number is rejected in every case.",
                "type": ["integer", "null"]
              },
              "bt_regular_apr_pct": {
                "default": null,
                "description": "APR that applies after the promo period ends, as a percentage, 0-100. Optional; defaults to 25.20 when omitted. bt_offers, when supplied, overrides this. The 0-100 range applies only when include_balance_transfer is true and bt_offers is omitted; a non-number is rejected in every case.",
                "type": ["number", "null"]
              },
              "bt_transfer_limit": {
                "default": null,
                "description": "Cap on the total dollar amount transferred to the balance-transfer card, at least $0.01. When set, only this amount moves to the BT card; remaining balances stay on original cards, and a combined simulation runs both halves together, correctly redistributing freed minimum payments. Optional; when omitted, the entire balance is transferred (legacy behavior). Needs include_balance_transfer or bt_offers.",
                "minimum": 0.01,
                "type": ["number", "null"]
              },
              "bt_transfer_strategy": {
                "default": null,
                "description": "How to choose which balances move when bt_transfer_limit is less than your total debt: 'highest_apr_first' (transfer from highest-APR segments first, maximizes interest savings), 'highest_balance_first' (transfer largest balances first), or 'manual' (use bt_manual_transfers to specify exact amounts per card). Optional; defaults to 'highest_apr_first' when omitted. Needs bt_transfer_limit.",
                "type": ["string", "null"]
              },
              "cards": {
                "description": "Credit cards to include, 1 to 20. Required: omitting the field answers contract_error MISSING_REQUIRED_FIELD, while an explicit JSON null answers parse_error (\"cards must be a JSON array.\"); the two are not the same rejection. segments and stop_spend_month are not supported by this tool and are rejected; a non-zero monthly_spend, annual_fee, or plan_fees_monthly is rejected too, but zero (including an explicit 0) is accepted and dropped for all three: this tool always reads the flat purchase_balance / cash_advance_balance fields on each card below, never segments[] balances, and card-level fees and ongoing spend are not modeled here. Those five fields are supported by calculate_cc_payoff and compare_payoff_strategies instead.",
                "items": {
                  "properties": {
                    "cash_advance_apr_pct": {
                      "description": "Cash advance APR as a percentage, greater than 0, up to 100. Required when cash_advance_balance is greater than 0.",
                      "type": ["number", "null"]
                    },
                    "cash_advance_balance": {
                      "description": "Cash advance balance in dollars, $0 to $1,000,000,000. Optional; defaults to 0 when omitted.",
                      "type": ["number", "null"]
                    },
                    "minimum_payment": {
                      "description": "Minimum payment in dollars, $0 to $1,000,000,000. Optional; 0 or omitted auto-calculates the bank minimum. Used as the locked floor for the constant keep-cards payment: each card pays max(your minimum, the bank minimum), held constant and rolled forward as cards clear.",
                      "type": ["number", "null"]
                    },
                    "name": {
                      "description": "Card label, e.g. 'Chase Sapphire'. Optional; a card without a name is auto-numbered ('Card 1', 'Card 2', ...). Max 120 characters.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    },
                    "purchase_apr_pct": {
                      "description": "Purchase APR as a percentage, 0-100, e.g. 22.99. Required per card.",
                      "type": ["number", "null"]
                    },
                    "purchase_balance": {
                      "description": "Purchase balance in dollars, $0 to $1,000,000,000. Required per card.",
                      "type": ["number", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Optional; must not contain an em dash or en dash. Max 120 characters.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "consolidation_loan": {
                "description": "Loan terms for the consolidation option. Required: omitting the field answers contract_error MISSING_REQUIRED_FIELD, while an explicit JSON null answers parse_error (\"consolidation_loan must be an object.\"); the two are not the same rejection.",
                "properties": {
                  "annual_rate_pct": {
                    "description": "Annual interest rate for the consolidation loan, as a percentage, 0-36, e.g. 10.99. This is the loan's note interest rate, not the disclosed APR. The APR already reflects the origination fee, so entering it here counts the fee twice. Required.",
                    "type": ["number", "null"]
                  },
                  "include_fee_in_principal": {
                    "description": "Whether the origination fee is rolled into the loan principal rather than paid upfront. Optional; defaults to true when omitted. A JSON null is rejected; omit the field instead of sending null.",
                    "type": ["boolean", "null"]
                  },
                  "origination_fee_flat": {
                    "description": "Flat-dollar origination fee, $0 to $10,000. Optional; defaults to 0 when omitted, and takes precedence over origination_fee_pct when it produces a larger fee. A JSON null is rejected; omit the field instead of sending null.",
                    "type": ["number", "null"]
                  },
                  "origination_fee_pct": {
                    "description": "Origination fee as a percentage of loan principal, 0-10. Optional; defaults to 0 when omitted. A JSON null is rejected, unlike every other optional field on this tool; omit the field instead of sending null.",
                    "type": ["number", "null"]
                  },
                  "term_months": {
                    "description": "Consolidation loan term in months, 12-84. Required.",
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              },
              "current_strategy": {
                "default": null,
                "description": "Your current payoff strategy, compared against the consolidation loan / balance-transfer alternative: 'avalanche' or 'snowball'. In partial consolidation it ranks the loan against the kept cards, and the part it ranks first, the loan or the kept cards, receives the extra payment and any windfalls. Optional; defaults to 'avalanche' when omitted. Case-sensitive.",
                "enum": ["avalanche", "snowball", null],
                "type": ["string", "null"]
              },
              "extra_monthly_payment": {
                "default": null,
                "description": "Extra monthly payment in dollars, $0 to $1,000,000,000, applied on top of the required minimums for keep-cards and any balance transfer, and on top of the loan's own required payment for consolidation. In partial consolidation, the extra payment and any windfalls go to the part current_strategy ranks first, the loan or the kept cards. Optional; defaults to 0 when omitted. fixed_payments is not a parameter of this tool, unlike calculate_cc_payoff: the keep-cards baseline is always simulated under the canonical constant rolled-forward payment (see comparison_basis in the response); supplying fixed_payments returns an unknown_parameter error.",
                "type": ["number", "null"]
              },
              "full_schedule": {
                "default": null,
                "description": "Whether to return the full month-by-month amortization schedule instead of the compact default. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              },
              "include_balance_transfer": {
                "default": null,
                "description": "Whether to run a single-offer balance-transfer scenario using the four scalar bt_* fields below. Optional; defaults to false when omitted. Ignored once bt_offers is supplied; use bt_offers when comparing two or more offers.",
                "type": ["boolean", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default), 'inline'. summary: compact response with a data_preview block; no heavy array exists on this response today, so summary and inline are currently identical in content. inline: full payload (currently identical to summary; will diverge once a heavy array is added for chart rendering).",
                "enum": ["summary", "inline", null],
                "type": ["string", "null"]
              },
              "windfalls": {
                "default": null,
                "description": "One-time principal payments, at most 12, same shape as calculate_cc_payoff. Optional; a JSON null is treated as omitted, the same as leaving the field out. When non-empty, the response adds windfalls_applied[] and windfalls_unused[] on keep_cards, on each balance_transfer scenario (and on each offer in balance_transfer_offers.offers[]), on consolidation_loan (single-row per windfall since the loan is a single-balance instrument), and on optimized_consolidation.loan and optimized_consolidation.keep_subset (each windfall dollar is listed once across the two). All scenarios use with-windfalls totals so cross-option ranking stays apples-to-apples, except what_if.same_budget_accelerated, a windfall-free hypothetical about extra-payment behavior, not your actual lump-sum schedule.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Dollar amount of the windfall, greater than 0. Required per entry.",
                      "type": ["number", "null"]
                    },
                    "label": {
                      "description": "Optional label for this windfall, e.g. 'Tax refund' or 'Year-end bonus'. Max 120 characters.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    },
                    "month": {
                      "description": "Month index the windfall is applied, 0 or more. 0 means applied before month 1's interest; N >= 1 applies at the end of calendar month N. Required per entry.",
                      "type": ["integer", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"]
              }
            },
            "required": ["cards", "consolidation_loan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debt Consolidation Comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fcc3133b3249b8fa8bf7269e674d495f4d03dafbf6fb9f63b26bfa54351b9bf"
        },
        {
          "name": "compare_mortgage_terms",
          "title": "Mortgage Terms Comparison",
          "description": "Calculation, not advice. Verify with a professional before acting. Compare two fixed-rate mortgage options side-by-side:\n\n- 15 vs 30 year,\n- different rates,\n- points vs no points, or\n- any two terms.\n\nShows total interest, monthly payment breakdown (with tax, insurance, PMI, HOA), equity buildup, and, critically, what happens if you take the cheaper mortgage and invest the monthly savings. Finds the break-even investment return rate.\n\nIncludes tax deduction analysis (itemizing vs standard deduction), PMI auto-removal tracking per the Homeowners Protection Act, and, when invest_the_difference is on (the default) and filing_status and annual_gross_income are given, an after-tax net worth comparison.\n\nPick this to compare two mortgage structures on a purchase, such as 15 versus 30 year or points versus no points; pick `calculate_refi_breakeven` when the comparison is against your existing loan and a refinance offer, and pick `compare_payoff_strategies` when the question is payoff strategy on revolving debt, not a mortgage term.\n\nNote: ARM (adjustable-rate) mortgages are not yet supported.",
          "inputSchema": {
            "properties": {
              "annual_gross_income": {
                "default": null,
                "description": "Annual gross income in dollars, used as adjusted gross income for the tax on investment gains at the horizon. Optional; with filing_status it enables the after-tax comparison. Held at this amount in the year of the assumed investment sale. Must be zero or more and no more than $1,000,000,000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "closing_cost_pct": {
                "default": null,
                "description": "Closing costs as a percentage of the loan amount, 0-20, points excluded. Optional; defaults to the Urban Institute loan-size regressive schedule (about 4.6% at a $97K loan down to about 1.4% at a $679K loan) when omitted. Pass 0 to model zero closing costs.",
                "type": ["number", "null"]
              },
              "down_payment_amount": {
                "default": null,
                "description": "Down payment in dollars. Optional; overrides down_payment_pct entirely, including its provenance row, when supplied. Must be at least $0 and strictly below home_price.",
                "type": ["number", "null"]
              },
              "down_payment_pct": {
