                  },
                  "type": "object"
                },
                "type": "array"
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Optional; must not contain an em dash or en dash. Max 120 characters.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "extra_monthly_payment": {
                "default": null,
                "description": "Extra monthly payment in dollars, $0 to $1,000,000,000, applied on top of the required minimums. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default), 'inline'. summary returns the headline comparison with a data_preview block; inline returns the full payload.",
