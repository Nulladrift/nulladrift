        {
          "name": "calculate_compound_interest",
          "title": "Compound Interest Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Standard compound interest calculator. Returns future value, total contributions, interest earned, effective annual rate, and milestones. Pick this for a balance that grows with contributions. Pick `calculate_opportunity_cost` when the money is recurring spending being priced against investing, and `calculate_loan_payoff` when the balance amortizes down under a fixed payment. The response includes `chart_hints` with rendering directives any client can use.",
          "inputSchema": {
            "properties": {
              "annual_rate_pct": {
                "description": "Annual interest rate as a percentage, e.g. 7 not 0.07. Decimal from 0 to 100. REQUIRED, no default.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "apply_default_inflation": {
                "default": null,
                "description": "When true and inflation_rate_pct is 0, auto-selects inflation via MacroeconomicDefaults.ForHorizon. Ignored when inflation_rate_pct is greater than 0 or rate_convention is 'real'. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "compounds_per_year": {
                "default": null,
                "description": "Compounding periods per year. Integer, greater than 0. Optional; defaults to 12 when omitted.",
                "type": ["integer", "null"]
              },
              "inflation_rate_pct": {
                "default": null,
                "description": "Inflation rate as a percentage. Decimal: -1 (deprecated suppress, same as 0), 0 (no real-value overlay), or greater than 0 and less than 100 (explicit percentage, e.g. 3.5). Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "monthly_contribution": {
                "default": null,
                "description": "Additional contribution added each month. Decimal, at least 0. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "principal": {
                "description": "Starting balance. Decimal, at least 0. REQUIRED, no default.",
                "maximum": 1000000000,
                "type": "number"
              },
              "rate_convention": {
                "default": null,
                "description": "'nominal' or 'real'. 'real' unconditionally suppresses the inflation overlay; use when annual_rate_pct is already inflation-adjusted. Optional; defaults to 'nominal' when omitted.",
                "enum": ["nominal", "real", null],
                "type": ["string", "null"]
              },
              "years": {
                "description": "Time horizon in years. Integer, at least 1. REQUIRED, no default.",
                "type": "integer"
              }
            },
            "required": ["annual_rate_pct", "principal", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
