        {
          "name": "calculate_debt_to_income",
          "title": "Debt-to-Income Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Calculate your debt-to-income ratio and check qualification for conventional, FHA, VA, and USDA mortgage programs. Accepts existing debts and an optional proposed new debt or home price. Pick this to measure DTI ratios and mortgage-program qualification against existing debts; pick `compare_debt_consolidation` when the question is whether a consolidation loan costs less than keeping the current credit cards, and pick `compare_rent_vs_buy` when the question is whether to buy a home at all rather than what DTI a given price implies.\n\nReturns current DTI, front-end and back-end ratios with proposed housing, maximum affordable home price, and what-if scenarios showing the resulting DTI and which programs would then qualify if a given debt were paid off, plus income-increase and home-price-reduction variants. Includes the 10-month rule (Fannie Mae) for debts near payoff.\n\n`qualification.<program>.qualification_status` is a tri-state verdict ('qualifies' | 'underwriting_dependent' | 'ineligible'):\n\n- 'underwriting_dependent' means the manual-underwriting baseline is exceeded but further underwriting can still approve it, an automated-underwriting system for conventional and FHA, either automated or manual underwriting for USDA, or a supervisory underwriter's written justification under 38 CFR 36.4340(c)(2) for VA (never an automated decision), so `qualification.<program>.qualifies=false` does NOT by itself mean the borrower is blocked\n- Read qualification_status, not the bare qualifies boolean, for the real answer; `qualification.<program>.note` explains the specific underwriting or hard-cap context, naming which mechanism applies\n- VA's back-end overage alone never returns 'ineligible' either (38 CFR 36.4340(c)(2)/(c)(3) both contemplate approval above 41%), and conventional is now the only program that ever returns 'ineligible', since FHA, VA and USDA are each disclosure-only above their baselines\n- `what_if.scenarios[].qualifies_va` and `changes_qualification_va` are decided on the scenario's unrounded VA ratio rounded to a whole percent under 38 CFR 36.4340(d), not on `new_back_end_dti_va` (two decimals), so a scenario showing 41.44 can qualify; `qualification.va.your_back_end_compared` states the rounded figure VA's row compares with `max_back_end`",
          "inputSchema": {
            "properties": {
              "additional_income": {
                "default": null,
                "description": "Additional monthly income: side income, rental income, or bonuses. Optional; defaults to 0 when omitted. Must be zero or more.",
                "type": ["number", "null"]
              },
              "annual_income": {
                "default": null,
                "description": "Annual gross income in dollars, divided by 12 to get monthly income. Exactly one of gross_monthly_income or annual_income is required. Must be at least $0.01, one cent, the smallest amount of money.",
                "minimum": 0.01,
                "type": ["number", "null"]
              },
              "existing_debts": {
                "default": null,
                "description": "Existing debts to include in the DTI calculation. Optional; omit it or send an empty array for no existing debts. A JSON null is rejected; omit the field instead. At most 50 debts are allowed.",
                "items": {
                  "properties": {
                    "apr_pct": {
                      "description": "Annual percentage rate, as a percentage (0-100), e.g. 18.5 for 18.5%. Optional.",
                      "type": ["number", "null"]
                    },
                    "balance": {
                      "description": "Current balance in dollars. Optional; used for payoff cost analysis in what-if scenarios.",
                      "type": ["number", "null"]
                    },
                    "monthly_payment": {
                      "description": "Monthly payment in dollars. Required per debt; must be positive.",
                      "type": ["number", "null"]
                    },
                    "months_remaining": {
                      "description": "Months remaining on this debt. Optional; used for the 10-month rule exclusion.",
                      "type": ["integer", "null"]
                    },
                    "name": {
                      "description": "Optional label for this debt, e.g. 'Car Loan'. At most 120 characters.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    },
                    "type": {
                      "description": "Debt type: 'auto', 'student', 'credit_card', 'personal', 'mortgage', 'heloc', 'child_support', or 'other'. Optional, defaults to 'other' when omitted. An unrecognized value of at most 120 characters warns rather than rejects; a longer one is rejected.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "maxItems": 50,
                "type": ["array", "null"]
              },
              "family_size": {
                "default": null,
                "description": "Household size for the VA residual income guideline. Supply family_size and property_state together, or neither. Optional; must be between 1 and 20.",
                "maximum": 20,
                "type": ["integer", "null"]
              },
              "gross_monthly_income": {
                "default": null,
                "description": "Gross monthly income in dollars. Exactly one of gross_monthly_income or annual_income is required. Must be at least $0.01, one cent, the smallest amount of money.",
                "minimum": 0.01,
                "type": ["number", "null"]
              },
              "hoa_monthly": {
                "default": null,
                "description": "Monthly homeowners association dues in dollars. Optional; defaults to 0 when omitted. Must be zero or more.",
                "type": ["number", "null"]
              },
              "home_insurance_annual": {
                "default": null,
                "description": "Annual home insurance in dollars. Optional; if omitted, estimated at 0.65% of the proposed home price. Must be zero or more.",
                "type": ["number", "null"]
              },
              "include_what_if": {
                "default": null,
                "description": "Whether to generate what-if scenarios showing how paying off a debt, increasing income, or reducing the home price would improve DTI. Optional; defaults to true when omitted.",
                "type": ["boolean", "null"]
              },
              "monthly_maintenance_and_utilities": {
                "default": null,
                "description": "Estimated monthly maintenance and utilities for the proposed property. 38 CFR 36.4340 calls for a realistic estimate of this figure for the property and local utility rates and sets no numeric multiplier itself, but VA underwriting guidance (the Lender's Handbook, Pamphlet 26-7) publishes a per-square-foot multiplier for this same estimate. Applying it needs the property's square footage, which this tool does not currently collect, so Senaro has no default to offer here and you supply the aggregate monthly amount instead. Supplying BOTH this field and monthly_taxes_and_retirement_withholding, together with proposed_home_price and a computable family_size/property_state, computes qualification.va.residual_income_comparison: your ACTUAL monthly residual income, its ratio to the va_residual_income_guideline figure, and whether residual_income_meets_review_waiver_margin (residual income at or above 120% of the guideline) is met. The shelter expense used here excludes any PMI (VA loans carry no monthly PMI; 38 CFR 36.4313(e) sets a funding fee instead, commonly financed into the loan; see va_funding_fee_financed_monthly for the financed-fee field). 38 CFR 36.4340(c)(3)'s review-waiver condition is CONJUNCTIVE: it also requires the back-end debt-to-income ratio, rounded to a whole percent under 38 CFR 36.4340(d) (qualification.va.your_back_end_compared), to exceed 41%, which this field does not by itself confirm. Check both fields together. Even when both hold, (c)(3) only WAIVES a second-level review requirement; it is not itself an approval. Whether this file is actually approved is an underwriting determination Senaro does not make and no input combination here determines. Missing any one of the needed inputs reads qualification.va.residual_income_comparison.status 'not_computable' with every reason named. Optional; must be zero or more.",
                "type": ["number", "null"]
              },
              "monthly_taxes_and_retirement_withholding": {
                "default": null,
                "description": "Your federal, state, and FICA tax withholding, plus any amount paid or withheld for retirement, monthly. 38 CFR 36.4340(f)(13) treats these as one class of deduction from gross income. Optional; must be zero or more.",
                "type": ["number", "null"]
              },
              "pmi_monthly": {
                "default": null,
                "description": "Monthly PMI (private mortgage insurance) in dollars. Optional; if omitted, auto-estimated at 0.5% of the loan annually when loan-to-value exceeds 80%. Feeds the conventional-basis PITI, so it moves with_proposed.front_end_dti, with_proposed.back_end_dti, with_proposed.front_end_breakdown, the conventional qualification row, and what_if.scenarios[].new_front_end_dti and new_back_end_dti. VA carries no PMI, and FHA and USDA always compute their own upfront-plus-annual mortgage insurance instead, at every loan-to-value, never this override. Must be zero or more.",
                "type": ["number", "null"]
              },
              "property_state": {
                "default": null,
                "description": "Two-letter USPS state code, or 'DC'/'PR'/'GU'/'VI'/'AS'/'MP'. Supply family_size and property_state together, or neither. Together these compute the VA residual income guideline (38 CFR 36.4340(e)) in va_residual_income_guideline: the dollar amount VA's tables require for this family size, region, and loan amount (derived from proposed_home_price; not computable without it), plus the 38 CFR 36.4340(c)(3) review-waiver figure. Computed only for family_size 1-7 and a property_state among the 50 states, DC, or PR (not GU, VI, AS, or MP; 38 CFR 36.4340(e) assigns no region to those four); outside those bounds, or without proposed_home_price, va_residual_income_guideline.status reads 'not_computable' with the reason instead. This block alone is a LOOKUP, not a verdict: it never compares against your actual residual income by itself. Optional.",
                "type": ["string", "null"]
              },
              "property_tax_annual": {
                "default": null,
                "description": "Annual property tax in dollars. Optional; if omitted, estimated at 0.88% of the proposed home price. Must be zero or more.",
                "type": ["number", "null"]
              },
              "proposed_debt": {
                "default": null,
                "description": "A proposed new debt, as an alternative to proposed_home_price. Provide at most one of proposed_debt or proposed_home_price; providing neither computes the current DTI only. Optional; a JSON null is treated as omitted, the same as leaving the field out.",
                "properties": {
                  "includes_tax_insurance": {
                    "description": "Whether monthly_payment already includes tax and insurance. Optional, defaults to true when omitted; if false and type is 'mortgage', warns that lenders use full PITI for DTI.",
                    "type": ["boolean", "null"]
                  },
                  "monthly_payment": {
                    "description": "Monthly payment in dollars. Required; must be positive.",
                    "type": ["number", "null"]
                  },
                  "name": {
                    "description": "Optional label for this proposed debt. At most 120 characters.",
                    "maxLength": 120,
                    "type": ["string", "null"]
                  },
                  "type": {
                    "description": "Debt type: 'auto', 'student', 'credit_card', 'personal', 'mortgage', 'heloc', 'child_support', or 'other'. Optional, defaults to 'mortgage' when omitted; an unrecognized value is rejected.",
                    "enum": ["credit_card", "auto", "student", "personal", "mortgage", "heloc", "child_support", "other", null],
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "proposed_down_payment_pct": {
                "default": null,
                "description": "Down payment as a percent of the proposed home price, e.g. 20 for 20%. Optional; defaults to 20 when omitted. Must be between 0 and 99.9 (100% cash purchases are not supported).",
                "type": ["number", "null"]
              },
              "proposed_home_price": {
                "default": null,
                "description": "Proposed home purchase price in dollars. Provide at most one of proposed_debt or proposed_home_price; providing neither computes the current DTI only. Auto-calculates full PITI (principal, interest, taxes, insurance). Optional; must be at least $0.01, one cent, the smallest amount of money.",
                "minimum": 0.01,
                "type": ["number", "null"]
              },
              "proposed_rate_pct": {
                "default": null,
                "description": "Proposed mortgage interest rate as a percent, e.g. 7.0 for 7.0%. Optional; the 7.0% default applies whenever this field is omitted, whether the proposal is proposed_debt or proposed_home_price. The default-rate warning fires only when proposed_home_price is used. Must be between 0 and 20.",
                "type": ["number", "null"]
              },
              "proposed_term_years": {
                "default": null,
                "description": "Proposed mortgage term in years. Optional; defaults to 30 when omitted. Must be between 1 and 40.",
                "type": ["integer", "null"]
              },
              "transaction_purpose": {
                "default": null,
                "description": "Mortgage transaction purpose: 'purchase', 'refinance', or 'streamlined_assist'. Optional, defaults to 'purchase' when omitted. Affects USDA only, and only what is disclosed. USDA's 32% PITI and 44% Total Debt figures are purchase-transaction waiver conditions (HB-1-3555 11.3.A.2), disclosed rather than applied as ceilings: Senaro cannot observe how the file is underwritten, so a USDA ratio overage is never 'ineligible' on any transaction purpose. For a refinance, 11.3.B states debt ratios 'are not limited to the maximum purchase debt ratio thresholds', so where the note fires it names both figures and states that neither applies. Streamlined-assist refinances require no debt ratio calculation at all. Conventional, FHA and VA are unaffected.",
                "enum": ["purchase", "refinance", "streamlined_assist", null],
                "type": ["string", "null"]
              },
              "va_funding_fee_financed_monthly": {
                "default": null,
                "description": "The additional monthly payment from financing a VA funding fee into the loan balance, if any. 38 CFR 36.4313(e)'s applicable percentage depends on down payment, prior VA-loan use, and service category, none of which Senaro collects, so there is no default. If omitted while any VA figure that depends on it is produced, meaning qualification.va.your_back_end and its verdict, any what_if VA ratio, what_if.max_affordable_home.va, or qualification.va.residual_income_comparison, a VA_FUNDING_FEE_NOT_MODELED warning discloses that no fee is assumed. The home-price-reduction what_if scenario's hypothetical price is fixed before the fee is considered, so a supplied fee is scaled to that EXACT hypothetical loan size, since 38 CFR 36.4313(e)'s fee is a percentage of loan principal. what_if.max_affordable_home.va is a two-pass approximation instead, so its supplied fee is scaled to an ESTIMATE of the hypothetical loan size, not the exact figure reported; the published price itself passes an exact forward VA check under 38 CFR 36.4340(d) with that reserved fee, and one dollar more fails it, so only this fee-scaling step is approximate. Without proposed_home_price there is no reference loan size to scale from either way, so the raw fee is reserved unscaled instead, and a VA_FUNDING_FEE_NOT_SCALED warning discloses it. This is mutually exclusive with VA_FUNDING_FEE_NOT_MODELED by construction, since one requires the fee omitted and the other requires it supplied. Optional; must be zero or more.",
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debt-to-Income Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1899e7a124726e491e9055caaaeb14774f4a542296dbab75a93da51edb605e1"
        },
        {
          "name": "calculate_emergency_fund",
          "title": "Emergency Fund Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Size an emergency fund target based on the borrower's monthly essential expenses, job stability, dependents, and income redundancy. Returns a tier breakdown (minimum, target, conservative; the target row is omitted when it equals the 3-month minimum, and the conservative row is omitted when it equals the 12-month ceiling), the gap between current savings and the target, and time-to-target at the supplied monthly savings cadence. Pick this to size an emergency-fund target; pick `calculate_runway` when savings are already fixed and the question is how many months they will last, not what the target is. Pairs with debt-payoff content for the recurring 'save vs pay debt' question. Target months are clamped to [3, 12]: never below the 3-month personal-finance minimum, never above 12.",
          "inputSchema": {
            "properties": {
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "current_savings": {
                "default": null,
                "description": "What you have in liquid emergency-accessible savings today. Decimal from 0 to $1,000,000,000. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "dependents": {
                "default": null,
                "description": "Number of dependents. Integer from 0 to 20. +1 target month per dependent, capped at +3. Optional; defaults to 0 when omitted.",
                "type": ["integer", "null"]
              },
              "has_dual_income": {
                "default": null,
                "description": "When true, partner income reduces the buffer by 1 month. Optional; defaults to false when omitted.",
                "type": ["boolean", "null"]
              },
              "job_stability": {
                "default": null,
                "description": "'stable_w2' | 'variable_income' | 'self_employed' | 'between_jobs'. Drives the target-months multiplier: stable_w2 salaried W-2 with consistent paycheck (+0 months); variable_income W-2 with commission/bonus/shift-based pay (+1 month); self_employed 1099 contractor/freelancer/sole proprietor (+3 months); between_jobs actively job hunting, no current paycheck (+5 months). Optional; defaults to 'stable_w2' when omitted.",
                "enum": ["stable_w2", "variable_income", "self_employed", "between_jobs", null],
                "type": ["string", "null"]
              },
              "monthly_essential_expenses": {
                "description": "Rent/mortgage + utilities + food + insurance + minimum debt payments. NOT discretionary spending. Decimal from $0.01 to $1,000,000,000. REQUIRED, no default.",
                "minimum": 0.01,
                "type": "number"
              },
              "monthly_savings_capacity": {
                "default": null,
                "description": "What you can contribute toward the gap each month. Drives months_to_target. Decimal, either 0 or from $0.01 to $1,000,000,000. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              }
            },
            "required": ["monthly_essential_expenses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Emergency Fund Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec3ab4c30789a7796b914c6b60e8c214f6d6ee7202a77277737876f092717c50"
        },
        {
          "name": "calculate_loan_payoff",
          "title": "Loan Payoff Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Standard amortizing loan calculator. Pick this for a single fixed-rate installment loan (mortgage, auto, student, personal) with one amortization schedule; pick `calculate_cc_payoff` for a credit card, which carries revolving balances, multiple APR segments, and a snowball or avalanche strategy this tool does not model.\n\nReturns:\n\n- monthly payment, total interest, and a payoff date (null when the loan does not clear within its term)\n- a bucketed Analysis suitable for chart rendering. The Analysis includes KPIs, annotations (e.g. crossover month), and summary strings\n\nWhen extra_monthly_payment is supplied, every computed figure in the response outside with_extra describes this loan without the extra payment, including monthly_payment, payoff_months, total_paid, total_interest, remaining_balance_at_term, payoff_date, months_to_halfway_principal, months_to_interest_flip, and every value under analysis; a warnings[] entry names this.\n\nThe response includes `chart_hints` with rendering directives any client can use. This tool does not support output: 'inline' on any transport.",
          "inputSchema": {
            "properties": {
              "annual_rate_pct": {
                "description": "Loan annual interest rate (the note rate in the loan contract, not the disclosed APR, which can differ when fees are financed), e.g. 6.5 not 0.065. Decimal from 0 to 100. REQUIRED, no default.",
                "type": "number"
              },
              "chart_bucket": {
                "default": null,
                "description": "Time-axis granularity of analysis.buckets[]: 'auto', 'monthly', 'quarterly', 'yearly', or 'biennial'. Optional; defaults to 'auto', which selects by term length (<=24 months: monthly; <=60: quarterly; <=360: yearly; else biennial).",
                "enum": ["auto", "monthly", "quarterly", "yearly", "biennial", null],
                "type": ["string", "null"]
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "extra_monthly_payment": {
                "default": null,
                "description": "Extra principal paid each month beyond the regular payment. Decimal, at least 0. Optional; defaults to 0 when omitted.",
                "type": ["number", "null"]
              },
              "loan_type": {
                "default": null,
                "description": "'personal', 'auto', 'student', or 'mortgage'. Optional; defaults to 'personal' when omitted.",
                "enum": ["personal", "auto", "student", "mortgage", null],
                "type": ["string", "null"]
              },
              "output": {
                "description": "Valid values: 'summary' (default). 'summary' returns the full payload including analysis.buckets[] inline.",
                "enum": ["summary", null],
                "type": ["string", "null"]
              },
              "principal": {
                "description": "Loan principal to amortize. Decimal, greater than 0. REQUIRED, no default.",
                "type": "number"
              },
              "term_months": {
                "description": "Loan term. Integer, greater than 0. REQUIRED, no default.",
                "maximum": 480,
                "type": "integer"
              }
            },
            "required": ["annual_rate_pct", "principal", "term_months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loan Payoff Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baceac6f5feb5327b38dba2343a53ea2bfa8951bb8f1d90732d76cf41d61575a"
        },
        {
          "name": "calculate_opportunity_cost",
          "title": "Opportunity Cost Calculator",
          "description": "Calculation, not advice. Verify with a professional before acting. Calculate the true cost of recurring spending by showing what that money would be worth if invested. Pick this when the input is recurring spending. Pick `calculate_compound_interest` when the input is a balance and its contributions with no spending to price, and `compare_payoff_vs_invest` when the alternative to investing is paying down debt. The response includes `chart_hints` with rendering directives any client can use.",
          "inputSchema": {
            "properties": {
              "annual_gross_income": {
                "default": null,
                "description": "Annual gross income in dollars, used as adjusted gross income for the tax on investment gains at the horizon. Optional; with filing_status it enables the after-tax opportunity cost. Held at this amount in the year of the assumed investment sale. Must be zero or more and no more than $1,000,000,000.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "annual_return_pct": {
                "description": "Effective annual investment return, e.g. 8 not 0.08; the monthly compounding step is (1+pct/100)^(1/12)-1. Decimal from 0 to 100. REQUIRED, no default.",
                "type": "number"
              },
              "chart_title": {
                "default": null,
                "description": "Override for the chart title. Must not contain em-dashes or en-dashes. Max 120 characters. Optional.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "filing_status": {
                "default": null,
                "description": "Tax filing status: 'single', 'married', or 'head_of_household'. Optional; matched case-insensitively. Required, with annual_gross_income, for the after-tax opportunity cost.",
                "enum": ["single", "married", "head_of_household", null],
                "type": ["string", "null"]
              },
              "label": {
                "default": null,
                "description": "What the spending is, e.g. 'coffee' or 'streaming subscriptions'. Optional. Max 120 characters.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "monthly_spending": {
                "description": "Monthly spending to price against investing. Decimal, at least $0.01. The opportunity cost of spending $0 is degenerate and is rejected. REQUIRED, no default.",
                "minimum": 0.01,
                "type": "number"
              },
              "tax_bracket_pct": {
                "default": null,
                "description": "Not used. Kept so older calls still work; an after-tax figure needs filing_status and annual_gross_income. Decimal from 0 to 100. Optional.",
                "type": ["number", "null"]
              },
              "tax_year": {
                "default": null,
                "description": "Tax year, 2025 or 2026. Year 1 of the horizon, so the assumed sale of the investments falls in tax year tax_year + years - 1. Optional; defaults to 2026 when omitted.",
                "maximum": 2026,
                "minimum": 2025,
                "type": ["integer", "null"]
              },
              "years": {
                "description": "Time horizon in years. Integer, greater than 0. REQUIRED, no default.",
                "type": "integer"
              }
            },
            "required": ["annual_return_pct", "monthly_spending", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Opportunity Cost Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
