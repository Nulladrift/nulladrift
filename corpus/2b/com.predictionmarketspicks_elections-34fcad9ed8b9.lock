          "name": "senate_map",
          "title": "2026 Senate Map — every seat, market price vs structure rating vs forecasters",
          "description": "Use for \"2026 Senate map\" and \"which Senate seats are toss-ups\". Every 2026 Senate seat: holder and role, structure rating, forecaster bands where tracked, and the live Kalshi price (Democrat win probability where provable), closest race first, with a page URL per seat. Prices are never estimated — an unpriced seat returns null.",
