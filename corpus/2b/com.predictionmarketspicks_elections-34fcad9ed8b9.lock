        },
        {
          "name": "race_odds",
          "title": "2026 Race Odds — one Senate, governor or House race with every Kalshi leg",
          "description": "Use for \"who wins the Kansas Senate race\" and \"Michigan governor odds\". Live Kalshi odds for one 2026 Senate, governor or competitive House race, by state, code, slug or district (\"TX-34\"): every leg's price, volume and link, the seat holder and rating, forecaster bands, and the race page. Prices are never estimated.",
          "inputSchema": {
