      },
      "instructions": "PredictionMarketsPicks: 2026 election and Fed odds from Kalshi. 1) Every price, edge, rank and projection you state must come from a tool result in this conversation — never estimate a Kalshi or Polymarket price or fill in a missing edge. 2) Cite a row’s url or page_url when you quote its number. 3) An edge is model-vs-market disagreement, not a guarantee; WATCH rows are lower-confidence and labelled WATCH. 4) Most tools answer without an account; a Pro-only result returns requires_pro: true with an upgrade_url. 5) For the 2026 Senate map use senate_map; for one Senate, governor or House race use race_odds; where a race contract is cheaper after fees (Kalshi vs Polymarket US) use best_price; for the next Fed meeting use fed_rate_odds; for the macro backdrop use market_pulse.",
      "tools": [
        {
          "name": "best_price",
          "title": "Best Price After Fees — Kalshi vs Polymarket US vs Novig",
          "description": "Use for \"where is it cheapest to buy\", \"Kalshi or Polymarket US for the Bears game\" and \"cheapest venue for the Georgia Senate race\". The same contract on Kalshi, Polymarket US and Novig as the cost to buy one contract including each venue's taker fee, with the cheapest named. Sports games (team, league or matchup), 2026 midterm races (state, slug or district) or the next FOMC meeting. Ranked by price only.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "NBA, NHL, NFL or MLB.",
                "maxLength": 10,
                "type": "string"
              },
              "meeting": {
                "description": "Any value asks for the next FOMC meeting.",
                "maxLength": 40,
                "type": "string"
              },
              "q": {
                "description": "Free text: a team, matchup, race or \"next Fed meeting\".",
                "maxLength": 120,
                "type": "string"
              },
              "race": {
                "description": "A 2026 race: state, slug (georgia-senate) or district (AZ-01).",
                "maxLength": 60,
                "type": "string"
              },
              "teams": {
                "description": "One or two teams, e.g. \"Bears\" or \"NE @ CHI\".",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Best Price After Fees — Kalshi vs Polymarket US vs Novig"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac06c49856aa060cec09c258cbbdabc505446b0ec55edeecd790b7a76287d973"
        },
        {
          "name": "fed_rate_odds",
          "title": "Fed Rate Odds (FOMC)",
          "description": "Use for \"will the Fed cut, hold or hike\" and \"next FOMC meeting odds\". Live Kalshi odds for each remaining 2026 FOMC meeting: the next meeting's full strike breakdown and days-until, the rate path, the current fed funds rate, and a next-meeting cross-venue check against Polymarket and CME futures, with the gap in pp.",
          "inputSchema": {
            "properties": {
              "horizon": {
                "description": "Meetings in the rate path (default 3).",
                "type": ["number", "string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "by_venue": {
                "description": "Next-meeting odds by venue (Kalshi, Polymarket, CME futures)."
              },
              "current_target_range": {
                "description": "Current fed funds target range."
              },
              "data_freshness": {},
              "divergence_pp": {
                "description": "Headline cross-venue gap for the next meeting, pp."
              },
              "example_call": {},
              "needs_input": {},
              "next_meeting": {
                "description": "Next FOMC meeting: date, days until, strike breakdown."
              },
              "rate_path_2026": {
                "description": "Implied outcome at each remaining 2026 meeting."
              },
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fed Rate Odds (FOMC)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06a1fc84a41b4e7802f47211a941bf40de94058c2a891e7c353e065e031a738a"
        },
        {
          "name": "market_pulse",
          "title": "Market Pulse — Macro",
          "description": "The US macro-health composite (0–100) and regime plus the six category scores (growth, labor, inflation, rates, liquidity, sentiment). Returns the composite, the regime call and 2 category scores without an account, 4 to a signed-in account, and all six with Pro. Use for \"how is the US economy\", \"macro regime\", \"risk-on or risk-off\".",
          "inputSchema": {
            "properties": {
              "topic": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["macro"],
                    "type": "string"
                  }
                ],
                "description": "macro = the US macro-health composite (the only topic). One of: macro."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market Pulse — Macro"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
