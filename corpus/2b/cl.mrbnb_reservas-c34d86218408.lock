        {
          "name": "cotizar",
          "title": "Cotizar un departamento / Quote an apartment",
          "description": "Desglose de precio de un departamento para unas fechas: noches, precio por noche, limpieza, descuento por largo de estadía (`descuento`, `descuento_porcentaje`), total en la moneda de `moneda` (el mismo monto que se cobra en mrbnb.cl), forma de `pago` (tarjeta o transferencia), estadía mínima y link de reserva. Si no está disponible, dice por qué. Price breakdown for one apartment and dates: nights, nightly prices, cleaning fee, long-stay discount (`descuento`, `descuento_porcentaje`), total in the `moneda` currency (the same amount charged at mrbnb.cl), payment method (`pago`: card or transfer), minimum stay and booking link.",
