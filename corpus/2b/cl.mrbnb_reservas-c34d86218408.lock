      "instructions": "Mr BnB arrienda departamentos amoblados por noche en Santiago de Chile. Este servidor es de solo lectura: busca disponibilidad, cotiza y arma el link de reserva. No reserva ni cobra. Para reservar, entrega al usuario url_reserva: el pago se hace en mrbnb.cl. El cobro es en dólares (USD) con tarjeta, por el mismo total de la cotización. Si el huésped reserva con un teléfono chileno, se cobra en pesos chilenos al tipo de cambio del día, con Webpay o transferencia. Desde 28 noches, por transferencia. La moneda de los montos viene en el campo moneda (hoy USD) y el total incluye la limpieza. El total ya trae el descuento por largo de estadía (10 % desde 7 noches, 20 % desde 28, 25 % desde 84; en julio y agosto, 10 % como máximo por noche); desde 28 noches el pago es por transferencia (campo pago). buscar_disponibilidad devuelve una muestra, no los más baratos de todo el portafolio. Fechas en formato AAAA-MM-DD.\n\nMr BnB rents furnished apartments by the night in Santiago, Chile. This server is read-only: it searches availability, quotes and builds the booking link. It never books or charges. To book, give the user url_reserva; payment happens at mrbnb.cl. The charge is in US dollars (USD) by card, for the same total as the quote. If the guest books with a Chilean phone number, it is charged in Chilean pesos at the day's exchange rate, with Webpay or bank transfer. From 28 nights, by bank transfer. The currency of the amounts is in the moneda field (USD today) and the total includes cleaning. The total already includes the long-stay discount (10% from 7 nights, 20% from 28, 25% from 84; at most 10% per night in July and August); from 28 nights payment is by bank transfer (pago field). buscar_disponibilidad returns a sample, not the cheapest of the whole portfolio. Dates are YYYY-MM-DD.",
      "tools": [
        {
          "name": "buscar_disponibilidad",
          "title": "Buscar departamentos disponibles / Search available apartments",
          "description": "Busca departamentos de Mr BnB disponibles en Santiago de Chile para un rango de fechas, con precio total (ver moneda), foto, comuna, capacidad y link de reserva. Filtra por comuna (Providencia, Las Condes, Santiago, Ñuñoa...) y mínimo de dormitorios. Devuelve una muestra de hasta 12 deptos ordenada por total, no necesariamente los más baratos del portafolio. Searches Mr BnB apartments available in Santiago, Chile for a date range, with total price (see moneda), photo, district, capacity and booking link. Returns a sample of up to 12 apartments sorted by total, not necessarily the cheapest in the portfolio.",
          "inputSchema": {
            "properties": {
              "checkin": {
                "description": "Llegada / check-in, AAAA-MM-DD (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
