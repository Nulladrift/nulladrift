          },
          "digest": "sha256:ecba1af6ef2d34a2d6a4b17904b34109009a1e2ca8a37e0833498e5d89a99d15"
        },
        {
          "name": "search_news",
          "title": "Search AI news",
          "description": "Full-text search over the Base of AGI news archive (since early 2026; headlines in all four languages, teasers for the last 45 days). All query words must match. Newest first among equal matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Only stories from the last N days (optional).",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of returned text: en, tr, es or ru. Items without text in this language are skipped.",
                "enum": ["en", "tr", "es", "ru"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words, e.g. 'Claude Code MCP' or 'EU AI Act'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
