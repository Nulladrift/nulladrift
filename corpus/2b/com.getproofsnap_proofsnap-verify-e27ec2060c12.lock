{
  "lockfileVersion": 2,
  "subjects": {
    "com.getproofsnap/proofsnap-verify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.getproofsnap.com/verify/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "proofsnap-verify",
        "title": "ProofSnap Verify",
        "version": "0.3.0",
        "description": "Check whether ProofSnap issued an evidence package, by the SHA-256 of its manifest.json. No sign-in.",
        "websiteUrl": "https://getproofsnap.com/api/mcp.html"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "lookup_manifest checks the SHA-256 of an evidence package's manifest.json in ProofSnap's public ledger and says whether and when ProofSnap issued it. No account is needed.",
      "tools": [
        {
          "name": "lookup_manifest",
          "title": "Check whether ProofSnap issued a manifest",
          "description": "Looks up the SHA-256 of an evidence package's manifest.json in ProofSnap's public ledger: whether ProofSnap issued exactly this manifest, and when. It covers packages issued by the ProofSnap API and dashboard; packages made with the browser extension are not in this ledger. Returns issued (true or false) and, when issued, issued_at, the package type and eidas (whether the package carries an eIDAS qualified timestamp). Reads public ledger data only; no account is needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hash": {
                "description": "SHA-256 of the package's manifest.json as 64 hexadecimal characters (a sha256: prefix is accepted), for example the manifest_hash of a capture",
                "pattern": "^(sha256:)?[A-Fa-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "eidas": {
                "type": ["boolean", "null"]
              },
              "issued": {
                "type": "boolean"
              },
              "issued_at": {
                "type": "string"
              },
              "manifest_sha256": {
                "type": "string"
              },
              "type": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether ProofSnap issued a manifest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Ledger checked",
            "openai/toolInvocation/invoking": "Checking the ProofSnap ledger",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:409f471755cc6cdfd01ab1c75d4bf18c94d77d86eb5dc83c01b6c93fa21dbbf4"
        }
      ],
      "digest": "sha256:65093f6e60435e16471e517e8c1cbea1949a03aa3b54c896b344f418cd8f5680"
    }
  }
}
