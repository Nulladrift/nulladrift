      "instructions": "Tools of rafaldoniec.com: Rafał Doniec builds AI automations, AI assistants, agent-ready companies and apps, and teaches teams to work with AI (Wrocław, Poland; clients in Polish and English). To price a project: list_services or match_service, then get_quote_questions, then estimate_price. Prices are net PLN from the price list in code. To send a quote request on behalf of a client: request_quote e-mails a code to the client; confirm it with confirm_quote only after the client reads you the code. Every tool takes language \"pl\" or \"en\". Website: https://www.rafaldoniec.com",
      "tools": [
        {
          "name": "confirm_quote",
          "title": "Request a quote (step 2: confirm)",
          "description": "Confirms the quote request with the 6-digit code the client received. Rafał gets the request and the client gets a copy of the draft offer by e-mail. One request per address a day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "Option ids chosen for the questions of the service (get_quote_questions): q1, q2, q3, when, budget.",
                "properties": {
                  "budget": {
                    "type": "string"
                  },
                  "q1": {
                    "type": "string"
                  },
                  "q2": {
                    "type": "string"
                  },
                  "q3": {
                    "type": "string"
                  },
                  "when": {
                    "type": "string"
                  }
                },
                "required": ["budget", "q1", "q2", "q3", "when"],
                "type": "object"
              },
              "code": {
                "description": "The 6-digit code from the e-mail.",
                "pattern": "^\\d{6}$",
                "type": "string"
              },
              "company": {
                "description": "Company name (optional).",
                "maxLength": 120,
                "type": "string"
              },
              "description": {
                "description": "The client's need in their own words (optional). Features it mentions, such as integrations, are priced in.",
                "maxLength": 500,
                "type": "string"
              },
              "email": {
                "description": "The client's e-mail address. A 6-digit code is sent there.",
                "type": "string"
              },
              "language": {
                "description": "Language of the texts in the result. Default: en.",
                "enum": ["pl", "en"],
                "type": "string"
              },
              "service": {
                "description": "Service id from list_services.",
                "enum": ["automatyzacja", "asystent", "agenci", "aplikacja", "strategia", "prototyp", "szkolenie", "mentoring"],
                "type": "string"
              },
              "token": {
                "description": "Token returned by request_quote.",
                "type": "string"
              }
            },
            "required": ["answers", "code", "email", "service", "token"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "sent": {
                "type": "boolean"
              }
            },
            "required": ["sent"],
            "type": "object"
          },
