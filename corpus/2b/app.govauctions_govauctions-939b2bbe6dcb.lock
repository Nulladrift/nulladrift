          "digest": "sha256:4cdc4ba1e3875028ad4e88cfbbf1ecd905e3b48f2e0da1c276dc99343dd18a78"
        },
        {
          "name": "search_listings",
          "title": "Search live GSA listings",
          "description": "Search live GSA federal-surplus auction listings (facts only — no images). Filter by state, category, keyword, price, or distance from a US ZIP code. Works signed out (up to 25 rows per page). Raw listings cover sanctioned federal sources; sold-price comps span the full market.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "country": {
                "default": "US",
                "enum": ["US"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Rows per page. Signed out, capped at 25.",
                "maximum": 100,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "type": "integer"
              },
              "priceMax": {
                "type": "number"
              },
              "priceMin": {
                "type": "number"
              },
              "q": {
                "description": "Title keyword",
                "type": "string"
              },
              "radiusMiles": {
                "default": 100,
                "description": "Radius from `zip`, in miles (default 100, max 500). Requires `zip`.",
                "maximum": 500,
                "type": "number"
              },
              "sort": {
                "description": "Result order. Default is soonest-ending (nearest-first when `zip` is given). Use `newest` to order by the lot's own listing date, newest first - that is the ordering a recurring \"what is new\" check needs, because under the default a brand-new lot can sit anywhere in the results.",
                "enum": ["ending-soonest", "newest"],
                "type": "string"
              },
              "source": {
                "default": "gsa",
                "enum": ["gsa"],
                "type": "string"
              },
              "state": {
                "description": "2-letter state code",
                "type": "string"
              },
              "zip": {
                "description": "US 5-digit ZIP to search around. Limits results to lots within radiusMiles, orders them nearest-first, and adds distanceMiles to each.",
                "type": "string"
              }
            },
            "type": "object"
          },
