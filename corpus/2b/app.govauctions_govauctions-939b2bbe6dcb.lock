          "digest": "sha256:c2178c7e4c8dc6e12e10e49db68b4f2d8d69b2eb89a3e9ac721e6cf8f7fe6ffb"
        },
        {
          "name": "get_sold_comps_batch",
          "title": "Sold-price comps, many at once",
          "description": "get_sold_comps for a list of items in one call. Each query is either a string ('2015 Ford F-150') or an object with its own q/category/country/state. Each item costs one valuation lookup, exactly as if sent alone; an item that comes back without a range is not charged. If the monthly allowance runs out part-way, the items already priced are returned and `batch.truncated` names the rest. Batch size is capped by plan (10 on the free allowance). Requires sign-in or an API key.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "US",
                "description": "Default market for every query.",
                "enum": ["US", "UK", "CA", "AU", "DE", "FR", "NL"],
                "type": "string"
              },
              "queries": {
                "items": {
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "category": {
                          "type": "string"
                        },
                        "country": {
                          "enum": ["US", "UK", "CA", "AU", "DE", "FR", "NL"],
                          "type": "string"
                        },
                        "q": {
                          "type": "string"
                        },
                        "state": {
                          "type": "string"
                        }
                      },
                      "required": ["q"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "state": {
                "description": "Default 2-letter state/region code for every query.",
                "type": "string"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sold-price comps, many at once"
