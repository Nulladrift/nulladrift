      "instructions": "GovAuctions.app is a free public site where people search live government surplus auctions (vehicles, equipment, electronics, seized property) and check what comparable lots actually sold for before bidding. This server exposes that same data to code: live listings, sold-price comps, price trends, and the Flip Score resale signal.",
