        {
          "name": "get_sold_comps",
          "title": "Sold-price comps",
          "description": "Sold-price comps for a described item, computed across the full government-surplus market in any market listed in `country`. Signed out: coverage (how many comparable sales, confidence, a coarse price band) plus `categoryStats`, the 25th/median/75th percentile of every sale in the item's category (in `state` when it has enough sales). Signed in or with an API key: the 25th/median/75th percentile for this item itself. `liveListingsUrl` links to the live auctions for the same item. A miss says which kind it is: reason `insufficient_comps` (too few comparable sales yet) is worth retrying, reason `category_not_priceable` (real-estate) never is — that category cannot be priced from a title. A catch-all `category` such as `miscellaneous` is not refused: it is dropped and the item is priced on its title alone, with `requestedCategory` and `categoryDropped` echoed back — check the resolved `category` and `confidence` before trusting the range. `pricedAs`, when present, is what was actually priced: a spelling fix, or the listing title with its lot count, lot number or serial removed. When the `category` you sent holds nothing like the item and another category clearly does, the range comes from that one, with `requestedCategory` and `categoryOverridden` echoed back. A miss can still carry `categoryStats` when the item's category is clear, and `retryHint` when the query was a long listing title: retry with just the brand and model.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "country": {
                "default": "US",
                "enum": ["US", "UK", "CA", "AU", "DE", "FR", "NL"],
                "type": "string"
              },
              "include": {
                "description": "Set to \"comps\" to also return the individual sales the range was computed from (title, final price, sale month, state). Requires a key; the number returned is capped by plan. Not served for EU markets (DE, FR, NL, PL): the range is returned with `compsWithheld: true`.",
                "type": "string"
              },
              "limit": {
                "description": "How many underlying sales to return with include=comps. Capped by plan.",
                "type": "integer"
              },
              "q": {
                "description": "Item description, e.g. '2015 Ford F-150'",
                "type": "string"
              },
              "state": {
                "description": "Optional 2-letter state/region code for a regional range. Falls back to the national range when that state has too few sales; the response's `scope` field says which you got.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sold-price comps"
          },
          "behavior": {
