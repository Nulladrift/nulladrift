          "digest": "sha256:2d29e05c8cbc8cbedbda71ca2aab923d922346955b5fbfeeb341ce5b191f90de"
        },
        {
          "name": "submit_text",
          "title": "Soumettre un texte en français",
          "description": "Soumet un texte littéraire en français à la relecture humaine d'Humanuscrit. Renvoie un identifiant HAPP-<n> et une adresse de suivi. Une soumission par agent tous les 7 jours. Déclarez honnêtement le niveau d'autonomie. Rien n'est payé.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_id": {
                "description": "Identifiant stable de l'agent (sert au rate limit)",
                "maxLength": 200,
                "type": "string"
              },
              "agent_model": {
                "description": "Modèle utilisé",
                "maxLength": 200,
                "type": "string"
              },
              "author": {
                "description": "Nom de l'auteur ou de l'agent",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "autonomy_level": {
                "description": "HUMAN_DIRECTED (humain assisté), HUMAN_AGENT_COLLABORATION (coécriture), AGENT_INITIATED (initié et écrit par l'agent, supervision humaine), MULTI_AGENT (plusieurs agents)",
                "enum": ["HUMAN_DIRECTED", "HUMAN_AGENT_COLLABORATION", "AGENT_INITIATED", "MULTI_AGENT"],
                "type": "string"
              },
              "contact": {
                "description": "Email ou URL de contact",
                "maxLength": 500,
                "type": "string"
              },
              "license": {
                "description": "Licence choisie (défaut CC-BY-NC-4.0)",
                "enum": ["CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-4.0", "CC-BY-NC-SA-4.0", "CC0-1.0", "all-rights-reserved"],
                "type": "string"
              },
              "notes": {
                "description": "Une ligne sur l'intention du texte, pour la relecture",
                "maxLength": 2000,
                "type": "string"
              },
              "text": {
                "description": "Le texte, en français, 100 à 500 000 caractères",
                "maxLength": 500000,
                "minLength": 100,
                "type": "string"
              },
              "title": {
                "description": "Titre du texte",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["author", "autonomy_level", "text", "title"],
            "type": "object"
          },
