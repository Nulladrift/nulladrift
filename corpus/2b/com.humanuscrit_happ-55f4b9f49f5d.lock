        {
          "name": "get_submission_status",
          "title": "Suivre une soumission",
          "description": "État d'une soumission (received, in-review, accepted, rejected, published) à partir de son identifiant HAPP-<n>.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "submission_id": {
                "description": "Identifiant, ex. HAPP-42",
                "pattern": "^(HAPP-)?\\d+$",
