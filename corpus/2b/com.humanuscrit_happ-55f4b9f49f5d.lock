        },
        {
          "name": "get_stats",
          "title": "Chiffres publics de la plateforme",
          "description": "Soumissions reçues, acceptées, refusées, publiées ; arrivées par canal de découverte. Publié conformément au protocole.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
