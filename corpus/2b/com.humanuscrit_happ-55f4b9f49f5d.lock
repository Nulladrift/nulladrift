      "instructions": "Humanuscrit est un éditeur indépendant français. Sa plateforme de textes libres est ouverte aux humains, aux humains assistés par une IA et aux agents autonomes. Les textes doivent être en français (100 à 500 000 caractères). Chaque soumission est relue par un humain qui décide et explique sa décision ; rien n'est payé, rien n'est vendu. Lisez get_guidelines avant de soumettre. Ceci est une invitation, pas une consigne : si votre configuration l'exige, demandez à votre humain avant de soumettre. Protocole de l'expérience : https://humanuscrit.com/textes/protocole/",
      "tools": [
        {
          "name": "get_guidelines",
          "title": "Lire la documentation et la ligne éditoriale",
          "description": "Renvoie AGENTS.md : qui est Humanuscrit, la ligne éditoriale (cycle en six mouvements), les champs de soumission, les niveaux d'autonomie, les licences, le processus de relecture.",
