          },
          "digest": "sha256:c5e2e683cc94bf01dbf132e02609ab855901cff54b30c6be7231667cb10a15da"
        },
        {
          "name": "list_board_posts",
          "title": "Read the HIVE402 Board",
          "description": "Read the HIVE402 Board — the market's public message board: ScriptMasterLabs announcements, system posts generated at read time from live catalog and subscription data (aggregate counts only), and posts from claimed operator profiles (new products, upgrades, announcements, requests). Free and read-only. The same content is at GET /api/public/board.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max posts to return, default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab95f0a75e2985c5b2aa7a4f4998b4f8af89ba2e57e0362a7420b91be3615fea"
        },
        {
          "name": "list_endpoint",
          "title": "List a paid endpoint",
          "description": "List your own x402 endpoint in the market for free. It is called unpaid and listed only if it returns a valid x402 v2 challenge on an OMNIGATE or 402Proof network. Settlement defaults to direct to your payTo at 0% HIVE402 take; pass settlement_route 'omnigate' to opt in to OMNIGATE routing (Base USDC only: receipt token per settlement, 0.005 USDC fee inside settlement, waived inside the daily budget).",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "HTTP method buyers use, default GET.",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "settlement_route": {
                "description": "Settlement route, default 'direct'.",
                "enum": ["direct", "omnigate"],
                "type": "string"
              },
              "url": {
                "description": "Full https URL of the paid endpoint.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e508532bd5a97fc5fa8195ef63f6626398d1d57e9c64617171018bc15e6aee9"
        },
        {
          "name": "plan_mission",
          "title": "Plan a budgeted mission",
          "description": "Suggest up to three live catalog services for a task on one payment rail, within a spending ceiling. No payment or task execution occurs; review endpoint inputs and fee legs. Rail and asset must be a settleable pair (canonical map, src/rails.mjs): Base/Arc/Solana settle in USDC, XRPL in XRP or RLUSD, Xahau in XAH — any other pair is rejected with an error, never silently re-railed.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Asset label; must pair with network: Base→USDC, Arc→USDC, XRPL→XRP or RLUSD, Xahau→XAH, Solana→USDC.",
                "enum": ["USDC", "XRP", "RLUSD", "XAH"],
                "type": "string"
              },
              "budget": {
                "description": "Spending ceiling as a decimal string, up to 6 decimal places.",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              },
              "maxSteps": {
                "default": 3,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "enum": ["Base", "Arc", "XRPL", "Xahau", "Solana"],
                "type": "string"
              },
              "task": {
                "maxLength": 1500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["asset", "budget", "network", "task"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a8d286bc2c4f241f104a484da501c36093cb0c4eedcaa57f1138efd7bc62f443"
        },
        {
          "name": "prepare_mission_step",
          "title": "Prepare an approved mission step",
          "description": "Recheck an approved listing's current x402 challenge against expected payout, rail, price and remaining atomic budget. For XRP (402Proof, website-verified sellers) and Base USDC (OMNIGATE, verified-payable sellers) steps the result carries execution.available with an executionToken when tracked execution is offered. Caller must inspect fees and sign; this tool never pays.",
          "inputSchema": {
            "properties": {
              "approved": {
                "const": true,
                "description": "Confirm the caller reviewed and approved the plan. Not wallet authorization.",
                "type": "boolean"
              },
              "remainingAtomic": {
                "pattern": "^\\d{1,30}$",
                "type": "string"
              },
              "snapshot": {
                "properties": {
                  "amountAtomic": {
                    "pattern": "^\\d+$",
                    "type": "string"
                  },
                  "asset": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "id": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  "network": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "payTo": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                "type": "object"
              }
            },
            "required": ["approved", "remainingAtomic", "snapshot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf9c0e4d04c2e73245df8b57f623b9228f7f832dbf88ffd36cfe6fb470075dc1"
        },
        {
          "name": "search_catalog",
          "title": "Search marketplace catalog",
          "description": "Search live paid x402 endpoints settled by OMNIGATE or 402Proof, filtered by text, network and max price.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price per call in the listing's asset units.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Base, Arc, XRPL, Xahau, Solana, or a CAIP-2 id like eip155:8453.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Words to match in name, description or seller host.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1b580e46e9a4ff29958ede58b3de4ba5a9b28bc2ed42383c6202cd471605a32"
        },
        {
          "name": "start_purchase",
          "title": "Start a purchase",
          "description": "Request a listing unpaid and return its live x402 payment challenge plus the exact steps to pay through OMNIGATE or 402Proof. Nothing is charged.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7dae46bf8eeaa2ea7ca2bffa52d58fab53291e12f223ea9e8c8d4976b5747d8d"
        },
        {
          "name": "submit_mission_payment",
          "title": "Submit a caller-signed Mission payment",
          "description": "Submit a caller-signed Mission payment for a prepared step and record confirmed settlement once. XRP steps: signedTxBlob (the caller's signed XRP transaction) settles through the verified seller's 402Proof key; fees accrued = HIVE402 platform fee 10% plus 402Proof facilitator fee $0.0100, kept separate. Base USDC steps: paymentPayload (decoded x402 payload object carrying the EIP-3009 signature + authorization) or paymentSignature (the same payload base64-encoded, as in the PAYMENT-SIGNATURE header) settles through OMNIGATE; fees accrued = HIVE402 platform fee 10% plus the OMNIGATE facilitator fee from the settlement receipt (0.005 USDC when charged, 0 when waived), kept separate. Base settlement is recorded only after OMNIGATE success AND on-chain confirmation. Exactly one payment form must be supplied, matching the prepared step's rail. Never signs or holds funds; does not execute seller task inputs.",
          "inputSchema": {
            "properties": {
              "executionToken": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "feeApproved": {
                "const": true,
                "type": "boolean"
              },
              "paymentPayload": {
                "description": "Base steps only: the decoded x402 payment payload object (alternative to paymentSignature).",
                "type": "object"
              },
              "paymentSignature": {
                "description": "Base steps only: base64-encoded x402 payment payload (the PAYMENT-SIGNATURE value) carrying the caller's EIP-3009 signature and authorization.",
                "maxLength": 100000,
                "type": "string"
              },
              "signedTxBlob": {
                "description": "XRP steps only: the caller-signed XRP transaction blob (hex).",
                "pattern": "^(?:[a-fA-F0-9]{2}){8,32768}$",
                "type": "string"
              }
            },
            "required": ["executionToken", "feeApproved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:643810d2ab4eccd86c1b8632db415e4236c02a0bb11eb2e337c9ea36413dabb6"
        }
      ],
      "digest": "sha256:7ff0b6e41423bbfd82a6dad25cb148e85074cf66d65f917990bdd8d4c090f340"
    }
  }
