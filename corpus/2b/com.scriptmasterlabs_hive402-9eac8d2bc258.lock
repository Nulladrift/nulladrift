{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/hive402": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hive402.scriptmasterlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "x402-agent-idea-forge",
        "title": "X402 Agent Idea Forge",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "HIVE402 by Script Master Labs LLC: live x402 services through OMNIGATE and 402Proof. Search with search_catalog, inspect with get_listing, list with list_endpoint, or request a challenge with start_purchase. For tasks: get_recipes → plan_mission → review endpoint inputs and spending ceiling → check_services → prepare_mission_step. When execution.available is true, caller reviews HIVE402 platform fee (10% accrued in the payment asset) separately from 402Proof facilitator fee ($0.0100 accrued), signs an XRP transaction and explicitly approves submit_mission_payment. This records provider-confirmed payment once, not completed task results. Tracked execution supports approved website-verified XRP sellers only; other rails remain caller-executed and untracked. Keep execution tokens and signed blobs private. Catalog-matched plans are suggestions, not guaranteed dependency chains. Callers retain watch snapshots and poll check_watchlist. Every payment requires the caller's own wallet signature. Recheck all challenge fee legs against remaining budget; stop on cancellation, changed terms, failed settlement or missing provider-confirmed receipt. Never replay a settled payment or resubmit after an indeterminate response. This public server never holds funds or signs payments. FAIL CLOSED: delivery unlocks only after server-side settlement verification; verifier errors deny delivery.",
      "tools": [
        {
          "name": "check_services",
          "title": "Check and rank service responses",
          "description": "Probe up to three catalog endpoints unpaid and rank valid live payment challenges by observed response time. Does not measure historical uptime, paid success or outcome quality.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bedcbbd067ee3ed360c1ccdd23c09ac49cc8413d132d0db6010a2114e5ec07b3"
        },
        {
          "name": "check_watchlist",
          "title": "Check listing changes",
          "description": "Compare caller-held snapshots with the live public catalog for price, payment-term and catalog-presence changes. Callers retain snapshots and schedule polling; no push delivery.",
          "inputSchema": {
            "properties": {
              "previous": {
                "items": {
                  "properties": {
                    "amountAtomic": {
                      "pattern": "^\\d+$",
                      "type": "string"
                    },
                    "asset": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "network": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "payTo": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["previous"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bca5ce4a54ee7663e16b4165292534c777616cffb49087ab4c28cbdf510499ce"
        },
        {
          "name": "get_listing",
          "title": "Get listing details",
          "description": "Get full details for one marketplace listing by id, including example input and output.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9476a2dfc45c181e9beaca06802f40313e2966e8c23bc41bb4748d38f721c69"
        },
        {
          "name": "get_recipes",
          "title": "Get live service recipes",
          "description": "Get reusable catalog-matched task templates with current listing IDs on a single rail. Templates are not verified completed workflows; budget is expressed in atomic units.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c5e2e683cc94bf01dbf132e02609ab855901cff54b30c6be7231667cb10a15da"
        },
        {
          "name": "list_endpoint",
          "title": "List a paid endpoint",
          "description": "List your own x402 endpoint in the market for free. It is called unpaid and listed only if it returns a valid x402 v2 challenge on an OMNIGATE or 402Proof network.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "HTTP method buyers use, default GET.",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "url": {
                "description": "Full https URL of the paid endpoint.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8d057c3f5d3437f1a1b3ebaad5e866ca1130ea6b562746d4b28f84b687ceba8"
        },
        {
          "name": "plan_mission",
          "title": "Plan a budgeted mission",
          "description": "Suggest up to three live catalog services for a task on one payment rail, within a spending ceiling. No payment or task execution occurs; review endpoint inputs and fee legs. Rail and asset must be a settleable pair (canonical map, src/rails.mjs): Base/Arc/Solana settle in USDC, XRPL in XRP or RLUSD, Xahau in XAH — any other pair is rejected with an error, never silently re-railed.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Asset label; must pair with network: Base→USDC, Arc→USDC, XRPL→XRP or RLUSD, Xahau→XAH, Solana→USDC.",
                "enum": ["USDC", "XRP", "RLUSD", "XAH"],
                "type": "string"
              },
              "budget": {
                "description": "Spending ceiling as a decimal string, up to 6 decimal places.",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              },
              "maxSteps": {
                "default": 3,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "enum": ["Base", "Arc", "XRPL", "Xahau", "Solana"],
                "type": "string"
              },
              "task": {
                "maxLength": 1500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["asset", "budget", "network", "task"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a8d286bc2c4f241f104a484da501c36093cb0c4eedcaa57f1138efd7bc62f443"
        },
        {
          "name": "prepare_mission_step",
          "title": "Prepare an approved mission step",
          "description": "Recheck an approved listing's current x402 challenge against expected payout, rail, price and remaining atomic budget. Caller must inspect fees and sign; this tool never pays.",
          "inputSchema": {
            "properties": {
              "approved": {
                "const": true,
                "description": "Confirm the caller reviewed and approved the plan. Not wallet authorization.",
                "type": "boolean"
              },
              "remainingAtomic": {
                "pattern": "^\\d{1,30}$",
                "type": "string"
              },
              "snapshot": {
                "properties": {
                  "amountAtomic": {
                    "pattern": "^\\d+$",
                    "type": "string"
                  },
                  "asset": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "id": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  "network": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "payTo": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                "type": "object"
              }
            },
            "required": ["approved", "remainingAtomic", "snapshot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6828786f1c527d1d11b43c059af9f5b26fe95f0b93331c83e73cb1bd3c76a671"
        },
        {
          "name": "search_catalog",
          "title": "Search marketplace catalog",
          "description": "Search live paid x402 endpoints settled by OMNIGATE or 402Proof, filtered by text, network and max price.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price per call in the listing's asset units.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Base, Arc, XRPL, Xahau, Solana, or a CAIP-2 id like eip155:8453.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Words to match in name, description or seller host.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1b580e46e9a4ff29958ede58b3de4ba5a9b28bc2ed42383c6202cd471605a32"
        },
        {
          "name": "start_purchase",
          "title": "Start a purchase",
          "description": "Request a listing unpaid and return its live x402 payment challenge plus the exact steps to pay through OMNIGATE or 402Proof. Nothing is charged.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7dae46bf8eeaa2ea7ca2bffa52d58fab53291e12f223ea9e8c8d4976b5747d8d"
        },
        {
          "name": "submit_mission_payment",
          "title": "Submit a caller-signed Mission payment",
          "description": "Submit an explicitly signed XRP payment through the verified seller's 402Proof key, record confirmed settlement once, and accrue separate 10% platform and $0.0100 facilitator fees. Never signs or holds funds; does not execute seller task inputs.",
          "inputSchema": {
            "properties": {
              "executionToken": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "feeApproved": {
                "const": true,
                "type": "boolean"
              },
              "signedTxBlob": {
                "pattern": "^(?:[a-fA-F0-9]{2}){8,32768}$",
                "type": "string"
              }
            },
            "required": ["executionToken", "feeApproved", "signedTxBlob"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:329f5f11853e9d8a4f40f8356676608dcf9077f5adbb2f23b5a904564c162c92"
        }
      ],
      "digest": "sha256:f0a5d1cef619b9afae88db97e5fdd1eb82419587e482d48f0a4739a81062e71b"
    }
  }
}
