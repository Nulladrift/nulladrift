{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/hive402": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hive402.scriptmasterlabs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "x402-agent-idea-forge",
        "title": "X402 Agent Idea Forge",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HIVE402 by Script Master Labs LLC: live x402 services through OMNIGATE and 402Proof. Search with search_catalog, inspect with get_listing, list with list_endpoint, or request a challenge with start_purchase. For tasks: get_recipes → plan_mission → review endpoint inputs and spending ceiling → check_services → prepare_mission_step. When execution.available is true, caller reviews HIVE402 platform fee (10% accrued in the payment asset) separately from 402Proof facilitator fee ($0.0100 accrued), signs an XRP transaction and explicitly approves submit_mission_payment. This records provider-confirmed payment once, not completed task results. Tracked execution supports approved website-verified XRP sellers only; other rails remain caller-executed and untracked. Keep execution tokens and signed blobs private. Catalog-matched plans are suggestions, not guaranteed dependency chains. Callers retain watch snapshots and poll check_watchlist. Every payment requires the caller's own wallet signature. Recheck all challenge fee legs against remaining budget; stop on cancellation, changed terms, failed settlement or missing provider-confirmed receipt. Never replay a settled payment or resubmit after an indeterminate response. This public server never holds funds or signs payments.",
      "tools": [
        {
          "name": "check_services",
          "title": "Check and rank service responses",
          "description": "Probe up to three catalog endpoints unpaid and rank valid live payment challenges by observed response time. Does not measure historical uptime, paid success or outcome quality.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c09422b04a6fcbac71e0ed114caab6025e1b654e7d8a58294346b78eb4ec4b6f"
        },
        {
          "name": "check_watchlist",
          "title": "Check listing changes",
          "description": "Compare caller-held snapshots with the live public catalog for price, payment-term and catalog-presence changes. Callers retain snapshots and schedule polling; no push delivery.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "previous": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amountAtomic": {
                      "pattern": "^\\d+$",
                      "type": "string"
                    },
                    "asset": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "network": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "payTo": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["previous"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d06484b16bc6b363907b1a359a19abeac12dc0cb4fc52cc7db568f16be1013f"
        },
        {
          "name": "get_listing",
          "title": "Get listing details",
          "description": "Get full details for one marketplace listing by id, including example input and output.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df22adb59909a16412a502e759e3885f933d59186a965d469241a520379fff96"
        },
        {
          "name": "get_recipes",
          "title": "Get live service recipes",
          "description": "Get reusable catalog-matched task templates with current listing IDs on a single rail. Templates are not verified completed workflows; budget is expressed in atomic units.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2011db9f31e0b5cb99519dbc5e43f8c7af63ce3ea6505fe614559cb08a37cb07"
        },
        {
          "name": "list_endpoint",
          "title": "List a paid endpoint",
          "description": "List your own x402 endpoint in the market for free. It is called unpaid and listed only if it returns a valid x402 v2 challenge on an OMNIGATE or 402Proof network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "method": {
                "description": "HTTP method buyers use, default GET.",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "url": {
                "description": "Full https URL of the paid endpoint.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d68295f59d0e5cdf2edfb599ecc4f17dada907d83b04c66b3d8e52fe5801da6"
        },
        {
          "name": "plan_mission",
          "title": "Plan a budgeted mission",
          "description": "Suggest up to three live catalog services for a task on one payment rail, within a spending ceiling. No payment or task execution occurs; review endpoint inputs and fee legs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "budget": {
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              },
              "maxSteps": {
                "default": 3,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "enum": ["Base", "Arc", "XRPL", "Xahau", "Solana"],
                "type": "string"
              },
              "task": {
                "maxLength": 1500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["asset", "budget", "network", "task"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:84b4a8b8b7b01ee2fb8340e76f87db3d9f7d883894280d0b59131ad9391f47db"
        },
        {
          "name": "prepare_mission_step",
          "title": "Prepare an approved mission step",
          "description": "Recheck an approved listing's current x402 challenge against expected payout, rail, price and remaining atomic budget. Caller must inspect fees and sign; this tool never pays.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "approved": {
                "const": true,
                "description": "Confirm the caller reviewed and approved the plan. Not wallet authorization.",
                "type": "boolean"
              },
              "remainingAtomic": {
                "pattern": "^\\d{1,30}$",
                "type": "string"
              },
              "snapshot": {
                "additionalProperties": false,
                "properties": {
                  "amountAtomic": {
                    "pattern": "^\\d+$",
                    "type": "string"
                  },
                  "asset": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "id": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  "network": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "payTo": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                "type": "object"
              }
            },
            "required": ["approved", "remainingAtomic", "snapshot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d2100459d94e8f67e03c93f3fb1c38ebb562ffef287749833c6266fe9670e89"
        },
        {
          "name": "search_catalog",
          "title": "Search marketplace catalog",
          "description": "Search live paid x402 endpoints settled by OMNIGATE or 402Proof, filtered by text, network and max price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results, default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price per call in the listing's asset units.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Base, Arc, XRPL, Xahau, Solana, or a CAIP-2 id like eip155:8453.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Words to match in name, description or seller host.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14af7ff9e269292d976e357cb076459f0f3839d120a40e6a8c1d22646b62b19e"
        },
        {
          "name": "start_purchase",
          "title": "Start a purchase",
          "description": "Request a listing unpaid and return its live x402 payment challenge plus the exact steps to pay through OMNIGATE or 402Proof. Nothing is charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6069d4844f9547325502bc2f0a1ce6bd26c45292cf9b5e6792372a618cec72f1"
        },
        {
          "name": "submit_mission_payment",
          "title": "Submit a caller-signed Mission payment",
          "description": "Submit an explicitly signed XRP payment through the verified seller's 402Proof key, record confirmed settlement once, and accrue separate 10% platform and $0.0100 facilitator fees. Never signs or holds funds; does not execute seller task inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "executionToken": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "feeApproved": {
                "const": true,
                "type": "boolean"
              },
              "signedTxBlob": {
                "pattern": "^(?:[a-fA-F0-9]{2}){8,32768}$",
                "type": "string"
              }
            },
            "required": ["executionToken", "feeApproved", "signedTxBlob"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66f4c6cd3ad1871af5f9415062961be9c2195fcd83c4ddc9408c74d41a64daae"
        }
      ],
      "digest": "sha256:84598abbff0713d239f28592991b29e6469ebdcabbec46993bf6791e7f65f173"
    }
  }
}
