      "serverInfo": {
        "name": "x402-agent-idea-forge",
        "title": "X402 Agent Idea Forge",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "HIVE402 by Script Master Labs LLC: live x402 services through OMNIGATE and 402Proof. Search with search_catalog, inspect with get_listing, list with list_endpoint, or request a challenge with start_purchase. Read market news — ScriptMasterLabs announcements, live-data system posts, and claimed operators' new products and upgrades — with list_board_posts (free). For tasks: get_recipes → plan_mission → review endpoint inputs and spending ceiling → check_services → prepare_mission_step. When execution.available is true, the caller reviews the HIVE402 platform fee (10% of the completed payment, accrued in the payment asset) separately from the facilitator fee, signs the payment with its own wallet and explicitly approves submit_mission_payment. This records provider-confirmed payment once, not completed task results. Tracked execution supports TWO rails: (1) XRP — approved website-verified 402Proof sellers; facilitator fee $0.0100 (402Proof) accrued per settlement; submit the caller-signed XRP transaction blob as signedTxBlob. (2) Base USDC — every verified-payable catalog seller with an exact Base USDC route, settling through OMNIGATE; facilitator fee 0.005 USDC when charged (waived inside OMNIGATE's daily waiver budget and for SML's own services), accrued from the settlement receipt; sign ONE EIP-3009 transferWithAuthorization and submit the x402 payment payload as paymentPayload (object) or paymentSignature (its base64 PAYMENT-SIGNATURE encoding). Base settlements are recorded only after OMNIGATE confirms success AND the transaction verifies on-chain; the settlement's soulbound receipt-token reference is stored when the receipt carries one. Other rails remain caller-executed and untracked. To complete a Mission end-to-end, prefer steps whose prepare_mission_step returns execution.available=true — those payments are recorded with provider-confirmed receipts and the step's settlement can be replay-verified by resubmitting the same executionToken (a settled token returns its recorded settlement with no new charge). Keep execution tokens and signed payloads private. Catalog-matched plans are suggestions, not guaranteed dependency chains. Callers retain watch snapshots and poll check_watchlist. Every payment requires the caller's own wallet signature. Recheck all challenge fee legs against remaining budget; stop on cancellation, changed terms, failed settlement or missing provider-confirmed receipt. Never replay a settled payment or resubmit after an indeterminate response. This public server never holds funds or signs payments. FAIL CLOSED: delivery unlocks only after server-side settlement verification; verifier errors deny delivery.",
      "tools": [
        {
          "name": "check_services",
          "title": "Check and rank service responses",
          "description": "Probe up to three catalog endpoints unpaid and rank valid live payment challenges by observed response time. Does not measure historical uptime, paid success or outcome quality.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bedcbbd067ee3ed360c1ccdd23c09ac49cc8413d132d0db6010a2114e5ec07b3"
        },
        {
          "name": "check_watchlist",
          "title": "Check listing changes",
          "description": "Compare caller-held snapshots with the live public catalog for price, payment-term and catalog-presence changes. Callers retain snapshots and schedule polling; no push delivery.",
          "inputSchema": {
            "properties": {
              "previous": {
                "items": {
                  "properties": {
                    "amountAtomic": {
                      "pattern": "^\\d+$",
                      "type": "string"
                    },
                    "asset": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "network": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "payTo": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["amountAtomic", "asset", "id", "network", "payTo"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["previous"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bca5ce4a54ee7663e16b4165292534c777616cffb49087ab4c28cbdf510499ce"
        },
        {
          "name": "get_listing",
          "title": "Get listing details",
          "description": "Get full details for one marketplace listing by id, including example input and output.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id from search_catalog.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9476a2dfc45c181e9beaca06802f40313e2966e8c23bc41bb4748d38f721c69"
        },
        {
          "name": "get_recipes",
          "title": "Get live service recipes",
          "description": "Get reusable catalog-matched task templates with current listing IDs on a single rail. Templates are not verified completed workflows; budget is expressed in atomic units.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
