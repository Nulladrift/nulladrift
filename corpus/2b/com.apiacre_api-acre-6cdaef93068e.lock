        {
          "name": "data.ecb-fx-reference",
          "description": "Convert an amount between two supported currencies using one validated ECB daily reference-rate observation. The underlying ECB statistics are available free from the ECB Data Portal; the fee covers bounded retrieval, validation, clearly labelled cross-rate calculation, and x402 delivery.",
          "inputSchema": {
            "properties": {
              "amount": {
                "default": "1",
                "description": "Positive decimal amount with at most 15 integer and 8 fractional digits",
                "examples": ["100"],
                "maxLength": 24,
                "minLength": 1,
                "pattern": "^(?:0|[1-9][0-9]{0,14})(?:\\.[0-9]{1,8})?$",
                "title": "Amount",
                "type": "string"
              },
              "base_currency": {
                "description": "Three-letter currency converted from, for example GBP",
                "enum": ["AUD", "BRL", "CAD", "CHF", "CNY", "CZK", "DKK", "EUR", "GBP", "HKD", "HUF", "IDR", "ILS", "INR", "ISK", "JPY", "KRW", "MXN", "MYR", "NOK", "NZD", "PHP", "PLN", "RON", "SEK", "SGD", "THB", "TRY", "USD", "ZAR"],
                "examples": ["GBP"],
                "maxLength": 3,
                "minLength": 3,
                "title": "Base Currency",
                "type": "string"
              },
              "on_or_before": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional date whose latest available ECB reference observation is used; omit for the latest available common business day",
                "examples": ["2026-08-18"],
                "title": "On Or Before"
