            "properties": {
              "expected_currency": {
                "anyOf": [
                  {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO 4217 currency expected by the buyer",
                "examples": ["GBP"],
                "title": "Expected Currency"
              },
              "maximum_price": {
                "anyOf": [
                  {
                    "maximum": 1000000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,13}|(?=[\\d.]{1,20}0*$)\\d{0,13}\\.\\d{0,6}0*$)",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional maximum price in expected_currency; comparison is null when the publisher reports another currency",
                "examples": ["49.99"],
                "title": "Maximum Price"
              },
              "url": {
                "format": "uri",
                "maxLength": 2083,
                "minLength": 1,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "ProductPriceInput",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "additionalProperties": false,
                "description": "Structured Live product price snapshot result",
