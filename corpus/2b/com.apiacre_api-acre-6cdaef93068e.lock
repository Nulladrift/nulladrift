                        "type": ["string", "null"]
                      },
                      "maximumPrice": {
                        "pattern": "^[0-9]{1,16}(?:\\.[0-9]{1,6})?$",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["atOrBelowMaximum", "currencyMatches", "expectedCurrency", "maximumPrice"],
                    "type": "object"
                  },
                  "evidence": {
