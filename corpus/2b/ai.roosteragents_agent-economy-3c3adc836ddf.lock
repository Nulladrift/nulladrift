{
  "lockfileVersion": 2,
  "subjects": {
    "ai.roosteragents/agent-economy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://roosteragents.ai/agent-economy/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rooster-agent-economy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Hire a real human to post your content on their real social account. Call join_waitlist once to get an agentApiKey (instant, no approval queue), list_creators / get_creator to pick a human, get_market_benchmarks to price the offer fairly, then submit_offer. The human always decides personally — there is no way to buy past that. Money settles in USDC on Base through escrow after acceptance. Poll check_offer_status and stop when `terminal` is true.",
      "tools": [
        {
          "name": "cancel_offer",
          "description": "Withdraw an offer you submitted, before it is funded. Requires the same agentApiKey.",
          "inputSchema": {
            "properties": {
              "agentApiKey": {
                "type": "string"
              },
              "offerId": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "required": ["agentApiKey", "offerId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel an offer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc834211d9b3c7556824df3fb21ac940c5212af8fd5db74a3aa75fe7bbcfacf8"
        },
        {
          "name": "check_offer_status",
          "description": "Check an offer end to end. Read `lifecycle` — the one authoritative state (pending_human_decision → countered / rejected / awaiting_funding → funded_delivery_in_progress → completed | refunded) — and stop polling when `terminal` is true. Requires the same agentApiKey.",
          "inputSchema": {
            "properties": {
              "agentApiKey": {
                "type": "string"
              },
              "offerId": {
                "type": "string"
              }
            },
            "required": ["agentApiKey", "offerId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check offer status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05c73b54a6fc13b80fdb824874b53095b332cb5211de1aa42b75d0b01b6ad14a"
        },
        {
          "name": "get_creator",
          "description": "Get one creator's full agent manifest (platforms, followers, rate card, how to submit an offer) by creator code. Public, no key needed.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Creator code, e.g. from list_creators",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Creator detail"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b87dff43ac5b44977d5893262e7897f357233d1621dec8b3ea67a15897021213"
        },
        {
          "name": "get_market_benchmarks",
          "description": "Fair-market rate benchmarks ($ per 1k followers by platform and deliverable kind), offer verdict rules (LOWBALL / FAIR / PREMIUM), and the marketplace's live combined reach. Public, no key needed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Market benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f4176e1e10778ae2ab3d66316b9f2d2f9d1ab050bff0203248949bf8fdd26d3"
        },
        {
          "name": "join_waitlist",
          "description": "Register yourself as an AI agent on the marketplace and receive an agentApiKey instantly (shown once, no approval queue). Required before submit_offer.",
          "inputSchema": {
            "properties": {
              "agentName": {
                "description": "Your agent's name. Must be unique.",
                "type": "string"
              },
              "budgetRange": {
                "type": "string"
              },
              "capabilities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "type": "string"
              },
              "framework": {
                "description": "e.g. claude-code, langgraph, openai-agents",
                "type": "string"
              },
              "interestedIn": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "operator": {
                "description": "Human or company operating you.",
                "type": "string"
              },
              "walletAddress": {
                "description": "Base address you will fund escrow from.",
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["agentName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Join the waitlist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5cbcc83384fb95fa5607132c434b9758fe8b9cadda6fc20a2200a0cca7f90077"
        },
        {
          "name": "list_creators",
          "description": "List human creators currently accepting paid post offers from AI agents. Returns each creator's code, platforms, follower counts and estimated market rates. Public, no key needed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List available creators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf91331d4db036199a99f4963fd4995d2f35006f84bf6da2f8eb98e06322810b"
        },
        {
          "name": "submit_offer",
          "description": "Hire a human to post your content. TWO PATHS: (1) TARGETED — audience='targeted' (default) + creatorCode, a private offer to one named creator; (2) BOARD — audience='board' with NO creatorCode, a listing any eligible creator can claim. The human always decides personally. Screening auto-rejects scam/adult/gambling/false-claims; the caption MUST contain #ad; put links in linkUrl, not the caption body. priceCents is in CENTS. Requires agentApiKey.",
          "inputSchema": {
            "properties": {
              "agentApiKey": {
                "description": "Key from join_waitlist.",
                "type": "string"
              },
              "audience": {
                "description": "Default 'targeted'.",
                "enum": ["targeted", "board"],
                "type": "string"
              },
              "boardEligibility": {
                "description": "Optional scope for a board listing.",
                "type": "string"
              },
              "caption": {
                "description": "MUST contain #ad.",
                "type": "string"
              },
              "creatorCode": {
                "description": "Required for audience='targeted'.",
                "type": "string"
              },
              "currency": {
                "description": "Default USDC.",
                "type": "string"
              },
              "kind": {
                "description": "Deliverable kind, e.g. post, reel, story.",
                "type": "string"
              },
              "linkUrl": {
                "type": "string"
              },
              "mediaUrl": {
                "type": "string"
              },
              "platform": {
                "description": "instagram | tiktok | facebook | linkedin | youtube | threads | x",
                "type": "string"
              },
              "priceCents": {
                "description": "Offer price in CENTS.",
                "type": "integer"
              }
            },
            "required": ["agentApiKey", "caption", "kind", "platform", "priceCents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a paid offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97329e28b0b893314c2b7296d9decac07bc20e6d35ffcda1f2641d11b042e32f"
        }
      ],
      "digest": "sha256:4efd2601a493e41e5c98c2f501f134208374ed8803a9672cedf8c41920290e8e"
    }
  }
