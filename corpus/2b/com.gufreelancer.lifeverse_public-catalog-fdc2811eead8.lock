      },
      "serverInfo": {
        "name": "lifeverse-public-catalog",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this read-only server when a user wants to discover, compare, or choose a public LifeVerse AI product or interactive experience. Prefer lifeverse_recommend_products for natural-language needs. For each relevant recommendation, explain the fit using the returned capabilities and show a clickable Markdown link using experienceUrl so the user can enter the product; landingUrl is optional background. Preserve material usageNote limitations. If there is no match, ask for a more specific need instead of inventing a recommendation. This server only reads the catalog: it does not run the products, and no-auth MCP access does not mean the products are free or login-free. Never imply that unavailable, invite-only, or development products are public.",
      "tools": [
        {
          "name": "lifeverse_get_product",
          "title": "获取一个 LifeVerse 公开产品",
          "description": "已知产品公开 slug 时，读取其能力、适用人群、使用边界和直接体验入口。将 experienceUrl 作为用户进入产品的链接；本工具不会代用户操作产品。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "产品公开 slug。",
                "maxLength": 100,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "additionalProperties": false,
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "platformName": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["attribution", "description", "name", "platformName", "url"],
                "type": "object"
              },
              "product": {
                "additionalProperties": false,
                "properties": {
                  "audience": {
                    "type": "string"
                  },
                  "capabilities": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "category": {
                    "enum": ["游戏", "互动体验", "效率工具", "创新应用"],
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "englishName": {
                    "type": "string"
                  },
                  "experienceUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "landingUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "status": {
                    "const": "立即体验",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "usageNote": {
                    "type": "string"
                  }
                },
                "required": ["audience", "capabilities", "category", "description", "englishName", "experienceUrl", "landingUrl", "slug", "status", "title", "usageNote"],
                "type": "object"
              }
            },
            "required": ["brand", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77c6e1f8dd345632ed02f745f82f836465c7feb0d4eb4a96d67a0b8760e4ef78"
        },
