          "description": "当用户描述问题、目标或想体验的场景时，推荐最匹配的 LifeVerse 公开产品并返回直接体验入口。可用中文或英文描述人生选择、商业报价、情侣争议、邮件营销、机会发现、穿搭美甲、股票复盘或人生模拟游戏；解释匹配原因并展示 experienceUrl。仅推荐产品，不在 MCP 内执行任务。",
