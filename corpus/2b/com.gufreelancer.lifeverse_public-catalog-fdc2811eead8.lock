      "instructions": "Use this read-only server when a user wants to discover, compare, or choose a public LifeVerse AI product or interactive experience. Prefer lifeverse_recommend_products for natural-language needs. Never imply that unavailable, invite-only, or development products are public.",
      "tools": [
        {
          "name": "lifeverse_get_product",
          "title": "获取一个 LifeVerse 公开产品",
          "description": "按公开 slug 获取一个已公开且可立即体验的 LifeVerse 产品。产品使用说明会随产品一同返回。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "产品公开 slug。",
                "maxLength": 100,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "additionalProperties": false,
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "platformName": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["attribution", "description", "name", "platformName", "url"],
                "type": "object"
              },
              "product": {
                "additionalProperties": false,
                "properties": {
                  "audience": {
                    "type": "string"
                  },
                  "capabilities": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "category": {
                    "enum": ["游戏", "互动体验", "效率工具", "创新应用"],
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "englishName": {
                    "type": "string"
                  },
                  "experienceUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "landingUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "status": {
                    "const": "立即体验",
                    "type": "string"
