        {
          "name": "find_broadband_deals",
          "title": "Find broadband deals at an address",
          "description": "Returns the broadband deals available at a UK address or postcode: a best value, cheapest and fastest pick plus a provider-varied list. Each deal has its monthly price, contract length, speed and true whole-contract cost, with intro pricing, later price rises and setup fees included. Optional filters: budget, minimum speed, provider, contract length, no mid-contract rises, mobile and satellite broadband. The precision field says whether results are for one property or the whole postcode.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address_label": {
                "description": "The display_address the user picked from search_addresses, passed back verbatim. Carried into the switch link so the FindBroadband site greets the user with their address instead of asking again.",
                "maxLength": 160,
                "type": "string"
              },
              "exclude_mid_contract_rises": {
                "description": "true when the user says they want no mid-contract price rises.",
                "type": "boolean"
              },
              "include_mobile_broadband": {
                "description": "Include 4G/5G home broadband and fixed wireless. Default false: deals on a line only.",
                "type": "boolean"
              },
              "include_satellite": {
                "description": "Include satellite broadband (Starlink). Default false. Satellite needs a dish and has an upfront cost.",
                "type": "boolean"
              },
              "max_contract_months": {
                "description": "Longest contract the user will accept, e.g. 12 for 'no long contracts'.",
                "exclusiveMinimum": 0,
                "maximum": 36,
                "type": "integer"
              },
              "max_monthly_price": {
                "description": "Budget cap in GBP per month, from phrases like 'under £30'.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "min_speed_mbps": {
                "description": "Minimum download speed in Mbps. Typical needs: email and browsing about 35, two people working from home plus gaming about 150, a heavy 4K household about 300.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "postcode": {
                "description": "UK postcode, e.g. 'SS13 1HJ'.",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              },
              "provider": {
                "description": "Only show deals from this provider, when the user names one.",
                "maxLength": 60,
                "type": "string"
              },
              "uprn": {
                "description": "Property identifier (UPRN) from search_addresses. With it, results are for that exact property instead of the whole postcode. An internal reference, not meaningful to the user.",
                "pattern": "^\\d{6,14}$",
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked_at": {
                "type": "string"
              },
              "deals": {
                "items": {
                  "$ref": "#/properties/picks/properties/cheapest/anyOf/0"
                },
                "type": "array"
              },
              "filters_relaxed": {
                "type": "boolean"
              },
              "picks": {
                "additionalProperties": false,
                "properties": {
                  "best_value": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/picks/properties/cheapest/anyOf/0"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "cheapest": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "connection_type": {
                            "type": "string"
                          },
                          "continue_url": {
                            "type": "string"
                          },
                          "contract_months": {
                            "type": "number"
                          },
                          "deal_id": {
                            "type": "string"
                          },
                          "download_mbps": {
                            "type": "number"
                          },
                          "effective_monthly_cost": {
                            "type": "number"
                          },
                          "gift": {
                            "description": "Provider incentive shown on the deal card: a gift card / reward, or a switching credit. NOT included in any cost figure. A switching credit (e.g. 'up to £300') only offsets early-termination fees owed to the user's CURRENT provider, so it is worth £0 to someone out of contract. Gift cards are real value but not bill money.",
                            "type": "string"
                          },
                          "intro_months": {
                            "type": "number"
                          },
                          "mid_contract_rise": {
                            "additionalProperties": false,
                            "properties": {
                              "has_rise": {
                                "type": "boolean"
                              },
                              "note": {
                                "type": "string"
                              }
                            },
                            "required": ["has_rise"],
                            "type": "object"
                          },
                          "monthly_price": {
                            "type": "number"
                          },
                          "package_name": {
                            "type": "string"
                          },
                          "price_after_intro": {
                            "type": "number"
                          },
                          "provider": {
                            "type": "string"
                          },
                          "setup_fee": {
                            "type": "number"
                          },
                          "total_contract_cost": {
                            "type": "number"
                          },
                          "upload_mbps": {
                            "description": "Advertised upload. Left out for satellite (Starlink), whose feed figure is wrong: Ofcom reports Starlink averages about 20 Mbps up.",
                            "type": "number"
                          }
                        },
                        "required": ["continue_url", "contract_months", "deal_id", "download_mbps", "effective_monthly_cost", "mid_contract_rise", "monthly_price", "package_name", "provider", "setup_fee", "total_contract_cost"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "fastest": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/picks/properties/cheapest/anyOf/0"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["best_value", "cheapest", "fastest"],
                "type": "object"
              },
              "postcode": {
                "type": "string"
              },
              "precision": {
                "enum": ["address", "postcode"],
                "type": "string"
              },
              "provider_filter_note": {
                "type": "string"
              },
              "total_available_at_location": {
                "type": "number"
              },
              "total_matching_filters": {
                "type": "number"
              },
              "uprn": {
                "type": "string"
              }
            },
            "required": ["checked_at", "deals", "picks", "postcode", "precision", "total_available_at_location", "total_matching_filters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find broadband deals at an address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
