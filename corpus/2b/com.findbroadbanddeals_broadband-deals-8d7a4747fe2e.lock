      "instructions": "FindBroadband's live UK broadband deals, the same data and figures as findbroadbanddeals.com. Broadband availability differs per property: ask for the postcode and the house number or name together in one question, call search_addresses, and when the user's message already names the property, match it from the list and say which address you're checking; only ask them to pick when the match is unclear. Pass the uprn and display_address to the other tools and never show the uprn. All costs, picks and verdicts are computed by FindBroadband: present them as given and don't re-rank, re-filter or recalculate them. total_contract_cost and effective_monthly_cost already include intro pricing, later rises and setup fees. Set include_mobile_broadband only when the user asks for 4G, 5G or wireless broadband or names a mobile provider, and include_satellite only when they ask for satellite or Starlink or no line is fast enough; when you show a satellite deal, say it needs a dish and an upfront cost. A switching credit is conditional on owing early-termination fees, never a discount. After showing deals, ask one short question about what matters most (budget, speed, contract length, avoiding price rises) and refine with the filters. Switching completes on findbroadbanddeals.com; nothing is bought in the chat.",
      "tools": [
        {
          "name": "check_if_overpaying",
          "title": "Check if the user is overpaying for broadband",
          "description": "Compares what a user pays for broadband, or a renewal price their provider quoted, against comparable deals available at their address. Returns a computed verdict, the saving over 24 months and the best alternatives, each with its true cost over 24 months.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address_label": {
                "description": "The display_address the user picked from search_addresses, passed back verbatim. Carried into the switch link so the FindBroadband site greets the user with their address instead of asking again.",
                "maxLength": 160,
                "type": "string"
              },
              "current_provider": {
                "description": "The user's current broadband provider, as they said it, e.g. 'Sky' or 'Virgin Media'.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "current_speed_mbps": {
                "description": "The user's current download speed in Mbps. Package names often carry it: 'M125' is about 132.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "monthly_bill": {
                "description": "What the user currently pays per month in GBP (or the renewal price quoted to them).",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "postcode": {
                "description": "UK postcode, e.g. 'SS13 1HJ'.",
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              },
              "quote_type": {
                "description": "'renewal_offer' when the user is evaluating a renewal or retention price their provider quoted; 'current_bill' (default) when it is what they pay today.",
                "enum": ["current_bill", "renewal_offer"],
                "type": "string"
              },
              "uprn": {
                "description": "Property identifier (UPRN) from search_addresses. With it, results are for that exact property instead of the whole postcode. An internal reference, not meaningful to the user.",
                "pattern": "^\\d{6,14}$",
                "type": "string"
              }
            },
            "required": ["current_provider", "current_speed_mbps", "monthly_bill", "postcode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "items": {
                  "$ref": "#/properties/best_alternative/anyOf/0"
                },
                "type": "array"
              },
              "best_alternative": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "connection_type": {
                        "type": "string"
                      },
                      "continue_url": {
                        "type": "string"
                      },
                      "contract_months": {
                        "type": "number"
                      },
                      "cost_24_months": {
                        "type": "number"
                      },
                      "deal_id": {
                        "type": "string"
                      },
                      "download_mbps": {
                        "type": "number"
                      },
                      "effective_monthly_cost": {
                        "type": "number"
                      },
                      "gift": {
                        "description": "Provider incentive shown on the deal card: a gift card / reward, or a switching credit. NOT included in any cost figure. A switching credit (e.g. 'up to £300') only offsets early-termination fees owed to the user's CURRENT provider, so it is worth £0 to someone out of contract. Gift cards are real value but not bill money.",
                        "type": "string"
                      },
                      "intro_months": {
                        "type": "number"
                      },
                      "mid_contract_rise": {
                        "additionalProperties": false,
                        "properties": {
                          "has_rise": {
                            "const": true,
                            "type": "boolean"
                          },
                          "note": {
                            "type": "string"
                          }
                        },
                        "required": ["has_rise", "note"],
                        "type": "object"
                      },
                      "monthly_price": {
                        "type": "number"
                      },
                      "package_name": {
                        "type": "string"
                      },
                      "pct_over": {
                        "type": "number"
                      },
                      "price_after_intro": {
                        "type": "number"
                      },
                      "provider": {
                        "type": "string"
                      },
                      "saved_24_months": {
                        "type": "number"
                      },
                      "saved_per_month": {
                        "type": "number"
                      }
                    },
                    "required": ["continue_url", "contract_months", "cost_24_months", "deal_id", "download_mbps", "effective_monthly_cost", "monthly_price", "package_name", "pct_over", "provider", "saved_24_months", "saved_per_month"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "checked_at": {
                "type": "string"
              },
              "current": {
                "additionalProperties": false,
                "properties": {
                  "monthly_bill": {
                    "type": "number"
                  },
                  "provider": {
                    "type": "string"
                  },
                  "provider_resolved": {
                    "type": ["string", "null"]
                  },
                  "speed_mbps": {
                    "type": "number"
                  }
                },
                "required": ["monthly_bill", "provider", "provider_resolved", "speed_mbps"],
                "type": "object"
              },
              "precision": {
                "enum": ["address", "postcode"],
                "type": "string"
              },
              "provider_note": {
                "type": "string"
              },
              "quote_type": {
                "enum": ["current_bill", "renewal_offer"],
                "type": "string"
              },
              "runners_up": {
                "items": {
                  "$ref": "#/properties/best_alternative/anyOf/0"
                },
                "type": "array"
              },
              "speed_floor_used": {
                "type": "number"
              },
              "total_deals_at_address": {
                "type": "number"
              },
              "verdict": {
                "enum": ["overpaying", "competitive", "no_better_deal_found"],
                "type": "string"
              }
            },
            "required": ["alternatives", "best_alternative", "checked_at", "current", "precision", "quote_type", "runners_up", "speed_floor_used", "total_deals_at_address", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check if the user is overpaying for broadband"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": []
              },
              "prefersBorder": true,
              "resourceUri": "ui://widget/overpay-verdict.html"
            },
            "ui/resourceUri": "ui://widget/overpay-verdict.html"
