                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "workspace_id": {
                "description": "Selected business ID from list_shvl_workspaces. Ask the user to choose if several businesses are available; never infer another business.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["workspace_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "generated_at is the view time; source records the import or completed-sync time. summary contains overdue counts, overdue_total_minor in currency minor units and attention counts. priority_cases contains case IDs, priority, suggested action and reason. Counts describe this selected business, not live bank receipts.",
