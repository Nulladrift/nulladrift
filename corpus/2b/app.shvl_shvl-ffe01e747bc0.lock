                    "format": "date",
                    "type": "string"
                  },
                  "exclude_case_statuses": {
                    "description": "Exclude these case-workflow statuses, including when searching invoices.",
                    "items": {
                      "enum": ["active", "paused", "promised", "disputed", "closed"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "exclude_statuses": {
                    "description": "Statuses to exclude. Invoice searches use invoice status; cases and contacts use case status.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "max_amount_minor": {
                    "description": "Inclusive outstanding amount maximum in the selected currency.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "max_days_overdue": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "min_amount_minor": {
                    "description": "Inclusive outstanding amount minimum in the selected currency; cases use overdue balance.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "min_days_overdue": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "promise_from": {
                    "description": "Inclusive recorded payment-promise date; excludes cases without a promise.",
                    "format": "date",
                    "type": "string"
                  },
                  "promise_to": {
                    "format": "date",
                    "type": "string"
                  },
                  "readiness_status": {
                    "description": "Exact payment-readiness state of the associated case.",
                    "enum": ["unchecked", "ready", "missing_reference", "missing_evidence", "portal_not_submitted", "receipt_unconfirmed", "waiting_approval", "wrong_contact", "query_open"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "as_of_date": {
                "format": "date",
                "type": "string"
              },
              "case_count": {
                "type": "integer"
              },
              "cases": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "case_id": {
                      "type": "string"
                    },
                    "case_status": {
                      "type": "string"
                    },
                    "currency": {
