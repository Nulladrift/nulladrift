          "description": "Return one customer contact summary and up to 50 sales invoices from the signed-in owner’s latest completed SHVL Xero sync. Read-only. Excludes email addresses, postal addresses and Xero IDs. Results are paged. applied_filters echoes validated predicates and calculation date. Use next_cursor with the same filters until has_more is false; total_count counts all filtered matches. Data changes invalidate continuation. Amount filters require currency; case/contact dates use oldest positive overdue date in the selected currency when supplied and amounts use the selected currency overdue subtotal. Returned summaries retain all currencies. Detail filters apply to invoice history, not case metadata.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
