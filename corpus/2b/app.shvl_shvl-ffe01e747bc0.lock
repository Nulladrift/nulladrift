                    "format": "date",
                    "type": "string"
                  },
                  "promise_to": {
                    "format": "date",
                    "type": "string"
                  },
                  "readiness_status": {
                    "description": "Exact payment-readiness state of the associated case.",
                    "enum": ["unchecked", "ready", "missing_reference", "missing_evidence", "portal_not_submitted", "receipt_unconfirmed", "waiting_approval", "wrong_contact", "query_open"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "as_of_date": {
                "format": "date",
                "type": "string"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "case_status": {
                    "type": ["string", "null"]
                  },
                  "currency": {
                    "type": ["string", "null"]
                  },
                  "customer_id": {
                    "type": "string"
                  },
                  "has_contact_email": {
                    "type": "boolean"
                  },
                  "invoice_count": {
                    "type": "integer"
                  },
