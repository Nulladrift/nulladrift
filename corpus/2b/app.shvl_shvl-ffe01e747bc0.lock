        {
          "name": "get_credit_control_case",
          "title": "Get a credit-control case",
          "description": "Return one case from the signed-in SHVL workspace, including status, payment-readiness state, bounded invoice summaries and communication evidence. Excludes email addresses, message content, provider IDs and payment records. Results are paged. applied_filters echoes validated predicates and calculation date. Use next_cursor with the same filters until has_more is false; total_count counts all filtered matches. Data changes invalidate continuation. Amount filters require currency; case/contact dates use oldest positive overdue date in the selected currency when supplied and amounts use the selected currency overdue subtotal. Returned summaries retain all currencies. Detail filters apply to invoice history, not case metadata.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "UTC date for days-overdue filters. Defaults to today and is fixed across continuation pages.",
                "format": "date",
                "type": "string"
              },
              "case_id": {
                "description": "Stable SHVL case ID returned by another SHVL tool.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "case_status": {
                "description": "Exact case-workflow status, including for invoice searches.",
                "enum": ["active", "paused", "promised", "disputed", "closed"],
                "type": "string"
              },
              "currency": {
                "description": "ISO currency. Required with amount bounds; no currency conversion.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the preceding page. Repeat the same filters; changed data requires restarting.",
                "maxLength": 2048,
                "type": "string"
              },
              "customer_id": {
                "description": "Exact SHVL customer ID.",
                "maxLength": 120,
                "type": "string"
              },
              "due_from": {
                "description": "Inclusive due date; cases use oldest overdue invoice date.",
                "format": "date",
                "type": "string"
              },
              "due_to": {
                "format": "date",
                "type": "string"
              },
              "exclude_case_statuses": {
                "description": "Exclude these case-workflow statuses, including when searching invoices.",
                "items": {
                  "enum": ["active", "paused", "promised", "disputed", "closed"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "exclude_statuses": {
                "description": "Statuses to exclude. Invoice searches use invoice status; cases and contacts use case status.",
                "items": {
                  "enum": ["authorised", "overdue", "paid", "voided", "deleted"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "description": "Invoice-history page size; defaults to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_amount_minor": {
                "description": "Inclusive outstanding amount maximum in the selected currency.",
                "minimum": 0,
                "type": "integer"
              },
              "max_days_overdue": {
                "minimum": 0,
                "type": "integer"
              },
              "min_amount_minor": {
                "description": "Inclusive outstanding amount minimum in the selected currency; cases use overdue balance.",
                "minimum": 0,
                "type": "integer"
              },
              "min_days_overdue": {
                "minimum": 0,
                "type": "integer"
              },
              "promise_from": {
                "description": "Inclusive recorded payment-promise date; excludes cases without a promise.",
                "format": "date",
                "type": "string"
              },
              "promise_to": {
                "format": "date",
                "type": "string"
              },
              "readiness_status": {
                "description": "Exact payment-readiness state of the associated case.",
                "enum": ["unchecked", "ready", "missing_reference", "missing_evidence", "portal_not_submitted", "receipt_unconfirmed", "waiting_approval", "wrong_contact", "query_open"],
                "type": "string"
              },
              "workspace_id": {
                "description": "Selected business ID from list_shvl_workspaces. Ask the user to choose if several businesses are available; never infer another business.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["case_id", "workspace_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "case contains the selected SHVL case and readiness; invoices contains bounded invoice summaries and invoices_truncated signals omitted rows. communication_evidence distinguishes provider acceptance from delivery, bounce and reply evidence. source gives completed-sync provenance; amounts ending in _minor use currency minor units.",
            "properties": {
              "applied_filters": {
