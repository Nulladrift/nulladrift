                    },
                    "currency_totals": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "amount_minor": {
                            "type": "integer"
                          },
                          "currency": {
                            "type": "string"
                          }
                        },
                        "required": ["amount_minor", "currency"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "customer_name": {
                      "type": "string"
                    },
                    "invoice_count": {
                      "type": "integer"
                    },
                    "next_action_at": {
                      "type": ["string", "null"]
                    },
                    "oldest_due_at": {
                      "type": ["string", "null"]
                    },
                    "overdue_total_minor": {
                      "description": "Null for multiple currencies; use currency_totals without conversion.",
                      "type": ["integer", "null"]
                    },
                    "readiness_status": {
