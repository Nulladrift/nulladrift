                      "type": "string"
                    }
                  },
                  "required": ["case_id", "case_status", "customer_name", "invoice_count", "next_action_at", "oldest_due_at", "overdue_total_minor", "readiness_status", "source"],
                  "type": "object"
                },
                "maxItems": 20,
