        {
          "name": "get_credit_control_brief",
          "title": "See which overdue invoices need attention",
          "description": "Use when someone asks who owes money, which invoices are overdue or which customers need a payment reminder. Return the selected business's overdue totals and up to five customers to check first. Read-only. Uses the latest SHVL import or completed accounting sync and never sends a reminder.",
