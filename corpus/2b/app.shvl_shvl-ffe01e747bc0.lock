                        "type": "string"
                      },
                      "updated_at": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["next_action", "owner", "status", "updated_at"],
                    "type": "object"
                  },
                  "source": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  }
                },
                "required": ["case_id", "closed_reason", "customer_name", "last_contacted_at", "next_action_at", "pause_reason", "promised_payment_at", "readiness", "source", "status"],
                "type": "object"
