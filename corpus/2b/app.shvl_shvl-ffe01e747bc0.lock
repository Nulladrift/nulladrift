        {
          "name": "get_xero_financial_report",
          "title": "Get a live Xero financial report",
          "description": "Read one live Xero Profit and Loss, Balance Sheet or Trial Balance for explicit dates. Capped at 250 stripped rows and never writes to Xero. Requires the matching read-only Xero report permission and a Xero user with Reports access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Snapshot date for Balance Sheet or Trial Balance, supplied by the user; omit for Profit and Loss.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from_date": {
                "description": "Inclusive start date of the Profit and Loss period requested by the user; omit for snapshot reports.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "report": {
                "description": "The live Xero report requested by the user; Profit and Loss needs a period, the others need a snapshot date.",
                "enum": ["profit_and_loss", "balance_sheet", "trial_balance"],
                "type": "string"
              },
              "to_date": {
                "description": "Inclusive end date of the Profit and Loss period requested by the user; omit for snapshot reports.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "workspace_id": {
                "description": "Selected business ID from list_shvl_workspaces. Ask the user to choose if several businesses are available; never infer another business.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["report", "workspace_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "tenant_name identifies the selected Xero organisation. report, report_name, report_date and parameters identify the requested report and dates. rows contains typed, nested display cells, section and depth; preserve the provider headers and units when interpreting values. row_count counts returned rows and truncated signals omissions. is_live and data_source identify a live Xero report; updated_at may be null.",
            "properties": {
              "data_notice": {
                "type": "string"
              },
              "data_source": {
                "enum": ["live_xero_report"],
                "type": "string"
              },
              "is_live": {
                "enum": [true],
                "type": "boolean"
              },
              "parameters": {
                "additionalProperties": false,
                "properties": {
                  "date": {
                    "type": ["string", "null"]
                  },
                  "from_date": {
                    "type": ["string", "null"]
                  },
                  "to_date": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["date", "from_date", "to_date"],
                "type": "object"
              },
              "report": {
                "enum": ["profit_and_loss", "balance_sheet", "trial_balance"],
                "type": "string"
              },
              "report_date": {
                "type": ["string", "null"]
              },
              "report_name": {
                "type": "string"
              },
              "row_count": {
                "maximum": 250,
                "minimum": 0,
                "type": "integer"
              },
              "rows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cells": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "depth": {
                      "maximum": 8,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "section": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "enum": ["header", "section", "row", "summary", "unknown"],
                      "type": "string"
                    }
                  },
                  "required": ["cells", "depth", "section", "type"],
                  "type": "object"
                },
                "maxItems": 250,
                "type": "array"
              },
              "tenant_name": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "updated_at": {
                "type": ["string", "null"]
              }
            },
            "required": ["data_notice", "data_source", "is_live", "parameters", "report", "report_date", "report_name", "row_count", "rows", "tenant_name", "truncated", "updated_at"],
            "type": "object"
