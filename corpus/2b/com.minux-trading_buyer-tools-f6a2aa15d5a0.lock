  "lockfileVersion": 2,
  "subjects": {
    "com.minux-trading/buyer-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.minux-trading.com/api/agents/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.minux-trading/buyer-tools",
        "title": "Minux buyer tools",
        "version": "1.0.0",
        "description": "Container load plans, HS codes and the Minux stone and porcelain catalogue, with links buyers can open.",
        "websiteUrl": "https://www.minux-trading.com/en/tools"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Minux Trading Group is an Iran-based B2B sourcing and export partner for natural stone, porcelain tiles and slabs. These read-only tools compute container loads, HS codes and catalogue lookups with the same engines as minux-trading.com. Always give the buyer the link a tool returns, so they can open and check the exact result; links exist in English (en), Russian (ru) and Arabic (ar) — answer in the buyer's language. Never state or estimate prices, availability or lead times: they are confirmed per inquiry. When the buyer asks, give the quote_form link; the buyer reviews and sends it, nothing is sent for them. Load figures are planning estimates for typical export packing; HS codes are a classification aid, not a binding ruling.",
      "tools": [
        {
          "name": "build_quote_link",
          "title": "Build a quote link",
          "description": "A link to the Minux quote form, prefilled with a product and/or a container plan (a planner query such as preset=60x60-9&c=40hc&q=3000&qu=m2). Opening it sends nothing: the buyer reviews the form, adds contact details and sends it. Use it whenever the buyer asks for a price, availability or a lead time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "plan_query": {
                "description": "A container planner query (the part after ? in a plan link).",
                "maxLength": 600,
                "type": "string"
              },
              "product_slug": {
                "description": "A product slug from search_products.",
                "maxLength": 120,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a quote link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:14e91637690dcf9deb4e021f83148d7bf9b262cdd1e4dc63a3782e865395c183"
        },
        {
          "name": "find_hs_code",
          "title": "Find the HS code",
          "description": "The HS 2022 six-digit customs code for natural stone, porcelain/ceramic tiles, engineered stone or ceramic sanitary ware, from the same decision table as the public HS code finder. It states only what the answers decide: when a test value is missing (tile water absorption) it returns the heading and every candidate subheading with the value that selects it. A classification aid, not a binding ruling; national tariffs add digits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "For sanitary ware: porcelain or other ceramic body.",
                "enum": ["porcelain", "other"],
                "type": "string"
              },
              "form": {
                "description": "For stone: block, sawn (merely cut into rectangles), cut-to-size, worked (polished/honed/shaped) or mosaic. For ceramic: tile, mosaic (cubes under 7 cm) or finishing (trims, skirting).",
                "enum": ["block", "sawn", "cut-to-size", "worked", "mosaic", "tile", "finishing"],
                "type": "string"
              },
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "material_family": {
                "description": "stone (natural stone), ceramic (tiles, mosaic, trims), engineered (agglomerated/quartz stone) or sanitary (ceramic sanitary ware).",
                "enum": ["stone", "ceramic", "engineered", "sanitary"],
                "type": "string"
              },
              "stone": {
                "description": "For stone: the stone.",
                "enum": ["marble", "travertine", "alabaster", "limestone", "granite", "sandstone", "quartzite", "basalt"],
                "type": "string"
              },
              "water_absorption": {
                "description": "For ceramic tiles: tested water absorption — le-0.5 (≤ 0.5%, porcelain), 0.5-10, gt-10 (> 10%), or unknown.",
                "enum": ["le-0.5", "0.5-10", "gt-10", "unknown"],
                "type": "string"
              }
            },
            "required": ["material_family"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the HS code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ab88c3dadfb55ce4bcd368b3b26bc81098c4d4bce8e8307e73222c9d093aa54"
        },
        {
          "name": "get_product",
          "title": "Get a product",
          "description": "One catalogue product by its slug (from search_products): description, sizes, thickness, finish, origin, HS code as listed, minimum order as listed, the product page and a prefilled quote form for the buyer. No prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "slug": {
                "description": "The product slug, e.g. as returned by search_products.",
                "maxLength": 120,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f178a27557a50cd5163e35dfc61192afb88806e20e2c8dcf3b270f8c34391a4"
        },
        {
          "name": "list_load_presets",
          "title": "List load presets",
          "description": "The packing presets the container planner knows: common porcelain tile, paver and slab formats and marble, travertine, granite and quartzite slabs, with their export packing and the format page that answers 'how much fits in a container' for each. Use an id as plan_container_load's preset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List load presets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ef53ccb20eb5de5afbf23dd467dcfd0cec123c6b681e216c9415992b0a11ffb"
        },
        {
          "name": "plan_container_load",
          "title": "Plan a container load",
          "description": "Plan how porcelain/ceramic tiles (on pallets) or stone/porcelain slabs (on A-frames) load into a 20ft, 40ft or 40ft high-cube container, with the engine behind the public planner at minux-trading.com. Returns m², pallets or slabs, cargo weight, what limits the load (weight or space), the 60/40 balance, an optional order split across containers, and links that open the exact plan, its engineering loading drawing, and a prefilled quote form for the buyer. Start from a preset (see list_load_presets) and override any field. A planning estimate for typical export packing, not a loading instruction and not a price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_stacking": {
                "description": "Tiles only: allow stacking pallets two high when the height allows. Default true.",
                "type": "boolean"
              },
              "boxes_per_pallet": {
                "description": "boxes per pallet (tiles only; tiles 1–200). Overrides the preset.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "container": {
                "description": "20gp (20ft), 40gp (40ft) or 40hc (40ft high cube). Default 20gp.",
                "enum": ["20gp", "40gp", "40hc"],
                "type": "string"
              },
              "density_kg_per_m3": {
                "description": "stone density, kg/m³ (slabs only; slabs 1500–3200). Overrides the preset.",
                "maximum": 3200,
                "minimum": 1500,
                "type": "number"
              },
              "frame_kg_per_row": {
                "description": "frame weight per row, kg (slabs only; slabs 0–800). Overrides the preset.",
                "maximum": 800,
                "minimum": 0,
                "type": "number"
              },
              "kg_per_box": {
                "description": "kg per box (tiles only; tiles 1–400). Overrides the preset. From the buyer's packing list; leave out to estimate.",
                "maximum": 400,
                "minimum": 1,
                "type": "number"
              },
              "kg_per_slab": {
                "description": "kg per slab (slabs only; slabs 5–2000). Overrides the preset. From the buyer's packing list; leave out to estimate.",
                "maximum": 2000,
                "minimum": 5,
                "type": "number"
              },
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "m2_per_box": {
                "description": "m² per box (tiles only; tiles 0.05–20). Overrides the preset. From the buyer's packing list; leave out to estimate.",
                "maximum": 20,
                "minimum": 0.05,
                "type": "number"
              },
              "mode": {
                "description": "tiles (boxes on pallets) or slabs (upright on A-frames). Needed only without a preset.",
                "enum": ["tiles", "slabs"],
                "type": "string"
              },
              "order_quantity": {
                "description": "The order size (1–1000000), with order_unit. Returns how many containers of each size it needs.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "order_unit": {
                "description": "m2, boxes or pallets for tiles; m2 or slabs for slabs.",
                "enum": ["m2", "boxes", "pallets", "slabs"],
                "type": "string"
              },
              "packaging_kg_per_slab": {
                "description": "packaging per slab, kg (slabs only; slabs 0–60). Overrides the preset.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "pallet_height_cm": {
                "description": "pallet height with load, cm (tiles only; tiles 10–260). Overrides the preset.",
                "maximum": 260,
                "minimum": 10,
                "type": "number"
              },
              "pallet_length_cm": {
                "description": "pallet length, cm (tiles only; tiles 40–400). Overrides the preset.",
                "maximum": 400,
                "minimum": 40,
                "type": "number"
              },
              "pallet_tare_kg": {
                "description": "pallet tare, kg (tiles only; tiles 0–300). Overrides the preset.",
                "maximum": 300,
                "minimum": 0,
                "type": "number"
              },
              "pallet_width_cm": {
                "description": "pallet width, cm (tiles only; tiles 40–240). Overrides the preset.",
                "maximum": 240,
                "minimum": 40,
                "type": "number"
              },
              "payload_limit_kg": {
                "description": "Cargo weight limit in kg (1000–32000, capped at the container's rating). Default 26000; road limits at origin or destination are often lower.",
                "maximum": 32000,
                "minimum": 1000,
                "type": "number"
              },
              "pieces_per_box": {
                "description": "pieces per box (tiles only; tiles 1–60). Overrides the preset.",
                "maximum": 60,
                "minimum": 1,
                "type": "number"
              },
              "preset": {
                "description": "A packing preset id (e.g. 60x120-9, marble-320x160-20) or format page slug (e.g. porcelain-tiles-60x60-9mm). Implies tiles or slabs.",
                "enum": ["60x120-11", "60x60-9", "60x120-9", "80x80-9", "30x60-9", "120x120-9", "80x160-9", "60x60-20", "porcelain-160x320-6", "porcelain-160x320-12", "porcelain-120x240-6", "marble-320x160-20", "marble-300x180-20", "travertine-280x160-20", "granite-300x180-30", "quartzite-300x180-20", "porcelain-tiles-60x120-11mm", "porcelain-tiles-60x120-9mm", "porcelain-tiles-60x60-9mm", "porcelain-tiles-80x80-9mm", "porcelain-tiles-30x60-9mm", "porcelain-tiles-120x120-9mm", "porcelain-tiles-80x160-9mm", "porcelain-pavers-60x60-20mm", "porcelain-slabs-160x320-6mm", "porcelain-slabs-160x320-12mm", "porcelain-slabs-120x240-6mm", "marble-slabs-160x320-20mm", "marble-slabs-180x300-20mm", "travertine-slabs-160x280-20mm", "granite-slabs-180x300-30mm", "quartzite-slabs-180x300-20mm"],
                "type": "string"
              },
              "rack_allowance_mm": {
                "description": "A-frame allowance per row, mm (slabs only; slabs 0–1200). Overrides the preset.",
                "maximum": 1200,
                "minimum": 0,
                "type": "number"
              },
              "slab_length_cm": {
                "description": "slab length, cm (slabs only; slabs 50–400). Overrides the preset.",
                "maximum": 400,
                "minimum": 50,
                "type": "number"
              },
              "slab_width_cm": {
                "description": "slab width, cm (slabs only; slabs 30–260). Overrides the preset.",
                "maximum": 260,
                "minimum": 30,
                "type": "number"
              },
              "slabs_per_bundle": {
                "description": "slabs per bundle (slabs only; slabs 1–200). Overrides the preset.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "spacer_mm": {
                "description": "spacer between slabs, mm (slabs only; slabs 0–30). Overrides the preset.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "thickness_mm": {
                "description": "thickness, mm (tiles and slabs; tiles 3–40, slabs 3–60). Overrides the preset.",
                "maximum": 60,
                "minimum": 3,
                "type": "number"
              },
              "tile_length_cm": {
                "description": "tile length, cm (tiles only; tiles 5–400). Overrides the preset.",
                "maximum": 400,
                "minimum": 5,
                "type": "number"
              },
              "tile_width_cm": {
                "description": "tile width, cm (tiles only; tiles 5–200). Overrides the preset.",
                "maximum": 200,
                "minimum": 5,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a container load"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5411eb914fcdd7ab31da442300f84c128bc0283061ffc9ab7ac39d99ed890ef"
        },
        {
          "name": "search_products",
          "title": "Search the catalogue",
          "description": "Search the live Minux catalogue (porcelain tiles and slabs, natural stone) by name, category and format. Returns names, specifications and product page links in the buyer's language. No prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "porcelain, ceramic, stone or mosaic.",
                "enum": ["porcelain", "ceramic", "stone", "mosaic"],
                "type": "string"
              },
              "format": {
                "description": "tile or slab.",
                "enum": ["tile", "slab"],
                "type": "string"
              },
              "limit": {
                "description": "How many products (1–20). Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the returned links and texts: en (English), ru (Russian) or ar (Arabic). Default en.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "query": {
                "description": "Words from the product name, e.g. 'travertine', 'calacatta', 'grey'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the catalogue"
          },
          "behavior": {
            "destructive": false,
