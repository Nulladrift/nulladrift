{
  "lockfileVersion": 2,
  "subjects": {
    "care.vitena/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.vitena.care/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "vitena-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Vitena's public directory of bookable health and wellness professionals across Europe and Turkey. Use list_directory_filters to learn valid city and specialization values, search_providers to find professionals, and get_provider for one professional's full public profile. All data is public; nothing here is patient or medical-record data.",
      "tools": [
        {
          "name": "get_provider",
          "title": "Get health professional details",
          "description": "Returns the full public profile of one professional by their slug (the value returned as 'slug' by search_providers): services offered, specializations, spoken languages, locations, working hours, contact details and whether online booking is available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Profile slug from search_providers, e.g. 'cristobal-diaz'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b37b5ed133e604dca1b1ce0f05428599533f0c7e015cb9ac1df59d4399441553"
        },
        {
          "name": "list_directory_filters",
          "title": "List directory filter options",
          "description": "Returns the valid filter values currently available in the Vitena provider directory: specialization codes (with human labels), spoken-language codes, and the countries that currently have listed professionals. Call this FIRST when you intend to filter a search by specialization — that argument only matches exact codes from this list, so guessing a specialty name will silently return no results. Note that CITY is NOT in this list and does not need to be: search_providers resolves a free-text city, district or region name against a gazetteer, so pass the name the user actually said.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed1d1ed39597334f7453bf0164150f893c7f4afdb24ab731142add840a79a6a2"
        },
        {
          "name": "search_providers",
          "title": "Search health professionals",
          "description": "Searches the public Vitena directory of health and wellness professionals who accept appointments (dietitians, dentists, physiotherapists, psychologists, beauty and aesthetics practitioners, child development specialists). Every filter is optional; with no filters it returns the first page of all publicly listed professionals. When the user names a specific professional or practice, pass that as 'name'. Results are public profile data only. Each result includes a profileUrl that can be given to the user for booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Deprecated alias for 'location', kept so agents that learned the older argument name keep working. Prefer 'location'.",
                "type": "string"
              },
              "country": {
                "description": "Two-letter ISO country code, e.g. 'TR', 'ES', 'DE'. Narrows an ambiguous place name. Valid values come from 'countries' in list_directory_filters.",
                "type": "string"
              },
              "discipline": {
                "description": "Profession to filter by. One of: dietitian, psychologist, physiotherapist, beauty, child-development, dentist, doctor, other.",
                "enum": ["dietitian", "psychologist", "physiotherapist", "beauty", "child-development", "dentist", "doctor", "other"],
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code the professional consults in, e.g. 'es', 'tr'.",
                "type": "string"
              },
              "location": {
                "description": "City, district or region name in free text, e.g. 'Istanbul', 'Kadıköy', 'Madrid', 'Andalucía'. Resolved against a place gazetteer, so it does NOT have to match a fixed list and is NOT returned by list_directory_filters — pass the place the user actually named. Choosing a region matches everywhere inside it. An unrecognised place returns an explanatory error rather than silently ignoring the filter.",
                "type": "string"
              },
              "name": {
                "description": "Name of the professional or their practice in free text, e.g. 'Müjde Koyuncu'. Every word must appear in the person's name, the practice name or the profile slug; case and accents are ignored and part of a word is enough ('koyun'). Names that start with the given words come first.",
                "type": "string"
              },
              "page": {
                "description": "1-based page number. Page size is fixed at 20.",
                "minimum": 1,
                "type": "integer"
              },
              "specialization": {
                "description": "Specialization CODE (not label) as returned by list_directory_filters.",
                "type": "string"
              },
              "workMode": {
                "description": "Consultation mode. 'online' for remote, 'in_person' for on-site.",
                "enum": ["online", "in_person"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8aecfcd7bc06b4c84f32a4df880f0f5cb86cd28c787cbe208ffed3c4cec5d09a"
        }
      ],
      "digest": "sha256:9ec435f5d53a581d7f60dc18007d6728ecc84b51d18f2c3463172cf91ea852aa"
    }
  }
}
