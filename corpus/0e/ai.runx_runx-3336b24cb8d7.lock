      "serverInfo": {
        "name": "runx",
        "title": "runx",
        "version": "1.0.0",
        "description": "Search the runx skill catalog and read what a skill actually is before running it: its manifest, the authority it requests, its trust signals, and the exact command to install it. runx is the governed runtime for agent skills, where the skill being run is explicit, the authority granted to it is bounded, consequential actions pass through a gate, and every run leaves a signed receipt.",
        "websiteUrl": "https://runx.ai",
        "icons": [
          {
            "src": "https://runx.ai/assets/logo/runx-symbol-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://runx.ai/assets/logo/runx-symbol-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server to find a runx skill and read it before running anything. search_skills finds candidates by what they do. get_skill returns one skill in full: its manifest, the authority it asks for, its trust signals, and the exact command to install it through the runx CLI. Show a caller the requested authority and trust tier before you suggest running a skill. This surface is read-only, so nothing here executes a skill, moves money, or changes state; execution happens through the runx CLI or the authenticated hosted API, both of which apply policy and seal a receipt.",
      "tools": [
        {
          "name": "get_skill",
          "title": "Inspect runx skill",
          "description": "Read one runx skill in full before running it: its manifest, the authority it asks for, its publisher and trust signals, and the exact command to install and run it through the runx CLI. Everything needed to decide whether to trust a skill arrives in this one call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "skill_id": {
                "description": "Skill id in publisher/name form, for example `ausca/browser-session`.",
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Exact version to read. Defaults to the latest published version.",
                "type": "string"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inspect runx skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://runx.ai/assets/logo/runx-symbol-192.png",
              "mimeType": "image/png",
              "sizes": ["192x192"]
            },
            {
              "src": "https://runx.ai/assets/logo/runx-symbol-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            }
          ],
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read the skill",
            "openai/toolInvocation/invoking": "Reading the skill"
          },
          "digest": "sha256:1348beb74c8bf3378886c14b0eb32f119b67976a4b8bf99a3b2c5cf978f2957a"
        },
        {
          "name": "search_skills",
          "title": "Search runx skills",
          "description": "Find runx skills by what they do. Returns each match with its skill id, publisher, description, latest version, and trust tier, so a caller can pick one and then read it in full with get_skill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum matches to return.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "What the skill should do, in plain words. An empty string browses everything.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search runx skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://runx.ai/assets/logo/runx-symbol-192.png",
              "mimeType": "image/png",
              "sizes": ["192x192"]
            },
            {
              "src": "https://runx.ai/assets/logo/runx-symbol-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            }
          ],
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
