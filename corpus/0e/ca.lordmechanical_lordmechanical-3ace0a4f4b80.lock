      "serverInfo": {
        "name": "ca.lordmechanical/lordmechanical",
        "title": "Lord Mechanical LTD",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Lord Mechanical LTD is a licensed plumbing, heating, gas fitting and drainage contractor in North Vancouver, BC, serving North Vancouver, West Vancouver and Greater Vancouver.\nAnswer questions with get_business_info, list_services, list_service_areas and get_page (Markdown of any page, including typical prices).\nTo request a quote for a customer:\n1. Collect at least the customer's name and phone number, plus email, city, service, urgency and a short description if they have them.\n2. Show the customer exactly what will be sent and ask them to confirm.\n3. Only after they confirm, call request_quote with customer_confirmed: true. Never send a request the customer has not confirmed.\nEmergencies (burst pipe, flooding, sewer backup, no heat, gas smell): tell the customer to phone (604) 670-3737 directly, 24/7, instead of waiting for a callback. If anyone is in danger, or there is a gas smell, they should leave the building and call 911.",
      "tools": [
        {
          "name": "get_business_info",
          "title": "Business info",
          "description": "Contact details, hours, emergency policy, estimate policy, credentials and service area of Lord Mechanical LTD (plumbing, heating, gas fitting and drainage, North Vancouver, BC).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b43b6a57f0909e1fff5b847a28cb8aca2989007a99f5bf149ffc8cf3c263a94"
        },
        {
          "name": "get_page",
          "title": "Get page (Markdown)",
          "description": "Get the Markdown version of any page on lordmechanical.ca. Use a path from list_services, list_service_areas or llms.txt, e.g. \"/\", \"/about/\", \"/services/plumbing/hot-water-tanks/\", \"/blog/hot-water-tank-cost-bc/\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Page path: lowercase, starts and ends with \"/\"",
                "pattern": "^/([a-z0-9-]+/)*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8c3861c5ae294ab50a0627553e5d1c8a0fbe2dd05c1e9e0d3ae1a473ab76f5a"
        },
        {
          "name": "list_service_areas",
          "title": "List service areas",
          "description": "List the cities served (Metro Vancouver) and the city/neighbourhood pages, with the path to pass to get_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List service areas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c30897441af8393eee227b64129bc7c12befda0842f050b6ac888034f8684410"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "List the service pages (plumbing, heating, drainage) with their URLs and the path to pass to get_page for full details and typical prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional filter",
                "enum": ["plumbing", "heating", "drainage"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e282abc31b4acaa04039784297e78530f1873ea154bf94b11e090d79236be4cb"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a quote / service request to Lord Mechanical LTD for a customer. Collect the details, show them to the customer, and call this only after the customer confirms. The team calls or texts the customer back. Not for emergencies: tell the customer to phone (604) 670-3737 directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the AI assistant sending this, e.g. Claude",
                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "City where the work is needed",
                "enum": ["North Vancouver", "West Vancouver", "Vancouver", "Burnaby", "Coquitlam", "Port Coquitlam", "Port Moody", "New Westminster", "Richmond", "Surrey", "Delta"],
                "type": "string"
              },
              "customer_confirmed": {
                "const": true,
                "description": "Must be true: the customer has seen these details and asked you to send them",
                "type": "boolean"
              },
              "details": {
                "description": "What the customer needs, in their words. No links.",
                "maxLength": 3000,
                "type": "string"
              },
              "email": {
                "description": "Optional. A confirmation email is sent here",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "name": {
                "description": "Customer's full name",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "Customer's North American phone number, e.g. 604-555-0123",
                "maxLength": 40,
                "type": "string"
              },
              "preferred_language": {
                "description": "Customer's preferred language, e.g. English",
                "maxLength": 50,
                "type": "string"
              },
              "service": {
                "description": "Closest matching service",
                "enum": ["Hot Water Tank Repair / Replacement", "PRV (Pressure Reducing Valve) Replacement", "Main Water Shut-Off Valve Upgrade", "Tankless Water Heater Descaling / Flush", "Frost-Free Outdoor Hose Bib Replacement", "Fixture & Pipe Leak Repair", "Boiler & Hydronic Heating Tune-Up", "Emergency Plumbing & Mechanical Repair", "Other Plumbing / Mechanical Service"],
                "type": "string"
              },
              "urgency": {
                "description": "emergency = today, soon = within 1-2 days, this_week, flexible",
                "enum": ["emergency", "soon", "this_week", "flexible"],
                "type": "string"
              }
            },
            "required": ["customer_confirmed", "name", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
