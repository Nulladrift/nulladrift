            "readOnly": true
          },
          "digest": "sha256:bde3b18233ed95f8852aa4f4901f7ea1ea49f24b14c429c7bb4f2cf572e25b90"
        },
        {
          "name": "get_pricing",
          "title": "ItGrows prices and payment links",
          "description": "Current ItGrows prices in US dollars with direct payment links: Business plan ($499 a month + $499 setup, or $1,497 for 3 months) and Pro ($1,000 a month + $1,000 setup, or $3,000 for 3 months), what each includes, and that the detailed report is free. Call it when a user asks what ItGrows costs, compares plans, or wants to pay.",
          "inputSchema": {
            "additionalProperties": false,
