          "title": "A real example of the ItGrows report",
          "description": "A real example of the detailed ItGrows report (20 buyer questions × 4 assistants: every answer, who is named instead, which sites the assistants cite, and the plan), with a link to it and how to get one for your own site for free. Call it when a user wants to see what ItGrows delivers before paying.",
