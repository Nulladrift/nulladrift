      "serverInfo": {
        "name": "ai.itgrows/visibility",
        "title": "ItGrows — AI visibility",
        "version": "1.0.0",
        "description": "Check whether ChatGPT, Claude, Gemini and Perplexity recommend a business; ItGrows prices, sample report, call with the founder.",
        "websiteUrl": "https://www.itgrows.ai",
        "icons": [
          {
            "src": "https://www.itgrows.ai/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ItGrows makes businesses visible in AI assistants' answers (ChatGPT, Claude, Gemini, Perplexity). Use check_ai_visibility when a user asks whether AI assistants recommend their business or why a competitor is named instead; get_pricing for prices and payment links; get_sample_report to show what the work delivers; book_call to request a call with the founder (only with an email the user gave for that). Pass `assistant` (chatgpt, claude, gemini, perplexity, copilot) so links are attributed to you.",
      "tools": [
        {
          "name": "book_call",
          "title": "Request a call with the founder",
          "description": "Request a 15-minute call with Kiryl, the founder of ItGrows (Pro starts after such a call). With an email, the request is delivered to the founder at once and he replies by email with times; without an email you get the contact page and address to pass to the user. Only call it with an email the user gave you for this purpose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Which assistant is calling: chatgpt, claude, gemini, perplexity, copilot or other. Used only to mark the links you get back, so a visit that follows is attributed to you.",
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "email": {
                "description": "The user's email for the reply. Only with the user's consent.",
                "type": "string"
              },
              "message": {
                "description": "What the user wants to discuss, and good times or time zone.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "site": {
                "description": "The business website, if known.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a call with the founder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1dfd265e0581d9faac85ea45031c7bba587e73ebd6aadd8aca506a2e2473db7c"
        },
        {
          "name": "check_ai_visibility",
          "title": "Check whether AI assistants recommend a business",
          "description": "Free check of a business website: works out five questions its buyers would ask an AI assistant (e.g. 'best dentist in Austin'), puts them to ChatGPT, Claude, Gemini and Perplexity, and reports in how many answers the business is named and which competitors are named instead. Call it when a user asks whether ChatGPT or other assistants recommend their business, why a competitor shows up instead of them, or how visible they are in AI answers. Takes up to about a minute; a site checked in the last 24 hours returns at once. If it is still running when this call returns, call it again with the same site to get the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Which assistant is calling: chatgpt, claude, gemini, perplexity, copilot or other. Used only to mark the links you get back, so a visit that follows is attributed to you.",
                "type": "string"
              },
              "city": {
                "description": "Optional: the city the business serves. The checker also reads it from the site.",
                "type": "string"
              },
              "niche": {
                "description": "Optional: what the business does, e.g. 'orthodontist'. The checker also reads it from the site.",
                "type": "string"
              },
              "site": {
                "description": "The business website, e.g. example.com or https://www.example.com",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether AI assistants recommend a business"
          },
          "behavior": {
