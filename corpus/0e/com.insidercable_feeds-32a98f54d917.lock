{
  "lockfileVersion": 2,
  "subjects": {
    "com.insidercable/feeds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://insidercable.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "insidercable",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "One tool per feed. Calls without `paid` return the free tier (delayed 1 day, per-feed record cap; the tier block says what was withheld). Pass paid=true to get the x402 v2 PaymentRequired as an isError result, attach the signed payment at _meta[\"x402/payment\"] and retry; the settlement comes back at _meta[\"x402/payment-response\"]. A subscription token in the URL (/mcp/<token>) or Authorization header serves live data.",
      "tools": [
        {
          "name": "congress_trades",
          "description": "US Congress stock transactions from official Senate ePTR and House Clerk disclosures (public domain). Every record carries happened_at (transaction date), disclosed_at (filing date) and observed_at (when this pipeline first saw it). Because the STOCK Act permits ~45 days between trade and disclosure, disclosed_at is the field to use for point-in-time work. Senate data is parsed to ticker level; House filings are metadata only.",
          "inputSchema": {
            "properties": {
              "chamber": {
                "enum": ["Senate", "House"],
                "type": "string"
              },
              "name": {
                "description": "Substring match on member name",
                "type": "string"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Only transactions on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "description": "Filter to one ticker, e.g. NVDA",
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated tickers (max 100)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81fe4cdab0b11af4633bece75444106e5cc627748da03bad356a8d304e45c447"
        },
        {
          "name": "etf_flows",
          "description": "Spot bitcoin ETF creation/redemption flows, computed as change in shares outstanding times NAV so price moves are removed and only genuine creations/redemptions remain. This series cannot be backfilled -- the issuer publishes only a current snapshot -- so every row was banked on the day it existed. span_days above 1 marks a row that spans a gap.",
          "inputSchema": {
            "properties": {
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Only rows on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "description": "Fund ticker, e.g. IBIT",
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated fund tickers",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:011fc974d5fe4f500b417722dc0c20e40a40652ecb14c38ee6b79569733ec5d8"
        },
        {
          "name": "insider_buys",
          "description": "SEC Form 4 open-market insider BUYS (public domain). Form-4 code P only: grants, option exercises, tax withholding and gifts are excluded because they are compensation events rather than conviction. An officer or director spending their own money is the signal this feed isolates. Carries observed_at (when recorded here) and happened_at (transaction date on the filing). For disposals use insider_sells. Since 2026-09-01 the feed also carries Schedule 13D/13G beneficial-ownership stakes (form=13D active intent, form=13G passive; direction=buy on an initial filing or a percent increase versus the last filing seen); filter with form=4 for Form 4 only.",
          "inputSchema": {
            "properties": {
              "form": {
                "description": "SEC form; omit for all",
                "enum": ["4", "13D", "13G"],
                "type": "string"
              },
              "min_value": {
                "description": "Minimum transaction value in USD (Form 4 rows only carry a value)",
                "type": "number"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Only transactions on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated tickers (max 100)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e9c1a180b0bceb8810b053c3661ad11f0bfaffdd7e5e8f2219d8bb688f35027"
        },
        {
          "name": "insider_sells",
          "description": "SEC Form 4 open-market insider SELLS (public domain). Form-4 code S only. Read these with care: insiders sell for diversification, tax and pre-scheduled 10b5-1 plans, so a sale carries far less information than a purchase. Carries observed_at (when recorded here) and happened_at (transaction date on the filing). For acquisitions use insider_buys. Also carries Schedule 13D/13G stake DECREASES and exits below 5% (form=13D|13G, direction=sell versus the last filing seen); filter with form=4 for Form 4 only.",
          "inputSchema": {
            "properties": {
              "form": {
                "description": "SEC form; omit for all",
                "enum": ["4", "13D", "13G"],
                "type": "string"
              },
              "min_value": {
                "description": "Minimum transaction value in USD (Form 4 rows only carry a value)",
                "type": "number"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Only transactions on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated tickers (max 100)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cc14e9920e6aead22a82a2681696fd131edb3b94f577d73ee82694231f75c38"
        },
        {
          "name": "launch_ledger",
          "description": "Robinhood Chain (chain id 4663) token launches that cleared a first-hour activity floor, with the early-buyer cohort: the first ~25 distinct wallets that bought (transaction sender, never the router), each with block delta from launch and quote spent. Every launch is graded at 24h and 7d (price multiple vs first buy, liquidity, holders). Launchpad is identified from the Uniswap v4 hook. Recorded forward from 2026-09-03 straight from chain logs: happened_at is the launch block time, observed_at is when the cohort was banked. Not backfilled.",
          "inputSchema": {
            "properties": {
              "launchpad": {
                "description": "Substring match, e.g. doppler, launchhook, none",
                "type": "string"
              },
              "min_buyers": {
                "description": "Minimum distinct early buyers captured",
                "type": "number"
              },
              "min_usd": {
                "description": "Minimum first-hour buy volume, USD estimate",
                "type": "number"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "quote": {
                "description": "Quote asset: ETH, WETH, USDG, or a stock token symbol",
                "type": "string"
              },
              "since": {
                "description": "Only launches on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "description": "Token symbol as the deployer named it (untrusted text)",
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated token symbols",
                "type": "string"
              },
              "wallet": {
                "description": "Launches this address was early in, or deployed",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1916269b6a2db526cd39c9f0ec0311a7dca855b37e50ffb4bf36657ff7a08ad"
        },
        {
          "name": "launch_wallets",
          "description": "Wallet book derived from launch_ledger: every address seen in an early-buyer cohort, with how many launches it was early in, its 24h hit rate (launch traded at 2x or more vs its first buy), dead rate (no trades or below 0.2x), average block delta, launchpads used, tokens, and whether it also deployed launches. Repeat early buyers with a high hit rate are the cohort worth watching; this feed ranks, it does not recommend. Recomputed at each publish from the forward-only ledger.",
          "inputSchema": {
            "properties": {
              "launchpad": {
                "description": "Wallets active on this launchpad",
                "type": "string"
              },
              "min_launches": {
                "description": "Minimum launches early in",
                "type": "number"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Wallets last seen on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "description": "Wallets that were early in this token symbol",
                "type": "string"
              },
              "wallet": {
                "description": "One address",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f73beb8c883eb0eab5cf711f2fd3a38e8bc1d69782130b9a1e1e160e58d19b21"
        },
        {
          "name": "options_iv",
          "description": "Daily US equity option-chain structure per ticker, recorded forward from 2026-06-27 (~230 names, weekday close). Derived metrics only -- no quotes, strikes, greeks or spot are re-served: atm_iv_30d / atm_iv_90d (implied vol at the ~30d and ~90d expiries), iv_term (30d/90d; above 1 = backwardation/stress), skew_25d (25-delta put IV minus call IV; positive = put demand), iv_rank (percentile of today's 30d IV within THIS series' own history, with iv_hist_days saying how long that history is -- a rank over 10 days is not a rank), put/call ratios by open interest and by volume, net dealer gamma sign, max-OI call/put strikes as percent from spot, and an unusual-activity read (uoa_lean call/put/mixed from contracts with volume >= 3x open interest; EOD delayed data, no prints, so buyer vs seller is unknowable). happened_at is the trading day; observed_at is the day the chain was banked. Not backfilled; the source publishes only the current chain, so nobody can reconstruct these days.",
          "inputSchema": {
            "properties": {
              "lean": {
                "description": "Unusual-activity lean on the day",
                "enum": ["call", "put", "mixed"],
                "type": "string"
              },
              "max_iv_rank": {
                "description": "Maximum iv_rank, 0-1 (e.g. 0.1 = vol cheap)",
                "type": "number"
              },
              "min_hist_days": {
                "description": "Only rows whose iv_rank rests on at least this many days of history",
                "type": "number"
              },
              "min_iv_rank": {
                "description": "Minimum iv_rank, 0-1 (e.g. 0.9 = vol rich)",
                "type": "number"
              },
              "paid": {
                "description": "true = request the pay-per-call (x402) quote or the live tier. Without a payment attached the call returns the x402 PaymentRequired object as an isError result; attach the signed payment at _meta[\"x402/payment\"] (or the PAYMENT-SIGNATURE header) and retry. Omit for the free, delayed tier.",
                "type": "boolean"
              },
              "since": {
                "description": "Only trading days on/after this YYYY-MM-DD",
                "type": "string"
              },
              "ticker": {
                "description": "One ticker, e.g. NVDA",
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated tickers (max 100)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d49c1822abad177aa361a7b71f0bdccb0702895c65a9bf8395a952e8d3e3f8bb"
        }
      ],
      "digest": "sha256:38ef100b0dfc431daffe59b32b66cf2603537279570b66a6860c5fc652ac6545"
    }
  }
}
