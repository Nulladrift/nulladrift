      "instructions": "Windpaint generates images, video, audio and text through capabilities (image.generate, image.edit,\nmask.segment, media.upscale, video.generate, audio.speech, video.lipsync, text.llm). Every job is\nasynchronous and billed in credits; credits are held when a job starts and settled when it finishes.\nCheck get_balance or the `available_credits` in estimates before large runs.\nNot every capability has a served model yet: check `available`.\n\nFor a common task, check list_workflows first: a workflow (e.g. text-to-clip, product-to-ad) runs a whole\nmulti-step pipeline from one form (run_workflow). Otherwise compose capabilities yourself.\n\nTypical capability flow: list_capabilities -> upload_asset (references, start frames, audio) -> estimate_cost ->\ngenerate (wait=true for images; wait=false then wait_for_job for video) -> download_asset.\n\nInputs go in named slots (`inputs`: {slot: [asset_id, ...]}); list_capabilities shows each capability's\nslots. Pass asset ids from upload_asset or from earlier jobs' `outputs`, which is how steps chain.\nAn input may also be a public https URL or a data: URI (up to 5 MB decoded): the API fetches or decodes it at\nsubmit and stores it as an asset. Local files still go through upload_asset. All assets and jobs live in a project;\nomit `project` to use the caller's default.\n",
