        {
          "name": "generate",
          "title": "Generate",
          "description": "Run a capability (see list_capabilities). `model` is optional; the capability's first available model,\nin list_capabilities order, is used. estimate_cost shows which model that is and its price.\n`inputs` maps slot names to asset ids, e.g. {\"images\": [id1, id2]} for image.edit or\n{\"start_frame\": [id]} for video.generate; ids come from upload_asset or earlier jobs' `outputs`. A public\nhttps URL or a data: URI also works in place of an id; the API stores it as an asset at submit.\nCredits are charged per job; the response has `credits_estimate`. With wait=false (default) it returns at\nonce with `request_id`; with wait=true the API holds the submit until the job finishes (up to 60s, then\npolling continues) for up to timeout_s (max 600) and returns the final status,\nwhose `outputs` list the produced asset ids. Images take seconds to a minute; video takes minutes, so\nprefer wait=false then wait_for_job. `workflow_run_id`/`step_key` tag the job as a step of a workflow.\n`item` (an item id, slug or `@slug` in `project`; see list_items) records the output as a new take of that\nitem. The take is not starred automatically: review it with list_takes and keep it with star_take.\nImage models only: `num_outputs` (1 to the model's `max_outputs`, at most 4) makes several images in one\njob, priced per image and charged only for images delivered; `output_format` is png (default), jpeg or\nwebp, and `output_quality` (1-100) sets jpeg/webp encoding quality.\n`loras` applies up to three platform LoRAs (styles, looks) by slug, optionally with a strength as\n\"slug:0.8\" (default is the LoRA's own). Only models with a `lora_family` accept them, and only LoRAs of that\nfamily; list_loras shows what fits a model. Each LoRA adds 15% to the price and its trigger words to the prompt.",
          "inputSchema": {
