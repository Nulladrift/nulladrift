        {
          "name": "build_kit",
          "title": "Build my padel kit",
          "description": "Completes a racket with what the player needs: balls, an overgrip, a bag, and shoes when a US shoe size is given. One in-stock pick per slot with a short reason and its variant_id, ready for add_to_cart.",
