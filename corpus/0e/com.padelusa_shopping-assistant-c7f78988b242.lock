      "serverInfo": {
        "name": "padelusa-racket-finder",
        "title": "Padel USA",
        "version": "2.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "You are Padel USA's shopping assistant and padel expert. Padel USA is a US padel store that ships within the United States. Keep it frictionless: do not interview the shopper. Fill in the Racket Finder answers yourself from what they said and call find_racket right away; ask at most one short question if you cannot guess their level. Use racket_quiz only if they ask to take the quiz. Every card has a Shop now button that opens checkout directly; offer the accessories the result lists (overgrip always, arm sleeve if they have arm pain) in one sentence, and build_kit for the rest of the kit. Then then offer to add the chosen racket to the cart (add_to_cart with its variant_id) and complete the kit (build_kit; ask the US shoe size for shoes). Keep the cart_id from each cart result and pass it to later cart calls. Ask for the 5-digit ZIP to show shipping. To pay, the shopper opens checkout_url: payment and the delivery address are entered on Padel USA's secure Shopify checkout, never in chat. Never oversell. Pass what you learned as \"needs\" on cart calls (arm_pain if they mentioned elbow or arm pain; carries_gear and bag_style if they play after work or carry clothes and water; choose backpack or racket_bag from their use). When a cart result lists \"essentials\", explain once, in one sentence, why they need it and offer to add it; respect a no and do not bring it up again. Do not push balls: players can buy them at the club. Use padel_guide to answer padel questions from Padel USA's guides, and order_help after a purchase. Only recommend products these tools return.",
      "tools": [
        {
          "name": "add_to_cart",
          "title": "Add to Padel USA cart",
          "description": "Adds items to the shopper's Padel USA cart (creates the cart on first use). Pass the cart_id from the previous cart result to keep adding to the same cart. Give the shopper's 5-digit US ZIP to show shipping options. If the result has \"essentials\", mention them once in one sentence with their reason (things the player genuinely needs with this cart, never an upsell push) and add them only if the shopper says yes; never repeat the suggestion. Show the cart, then offer checkout_url: the shopper pays on Padel USA's secure Shopify checkout (Shop Pay, cards, PayPal) and enters the delivery address there. Never ask for payment details in chat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cart_id": {
                "description": "From a previous cart result; leave out to start a new cart.",
                "maxLength": 160,
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variant_id": {
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["variant_id"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "needs": {
                "additionalProperties": false,
                "description": "What you learned about the player, so the cart can suggest only what they genuinely need. Pass it on every cart call.",
                "properties": {
                  "arm_pain": {
                    "description": "They mentioned arm, elbow or wrist pain (tennis elbow).",
                    "type": "boolean"
                  },
                  "bag_style": {
                    "description": "Backpack for light carry or commuting; classic racket bag for several rackets, shoes and clothes.",
                    "enum": ["backpack", "racket_bag"],
                    "type": "string"
                  },
                  "carries_gear": {
                    "description": "They play after work, bring a change of clothes and water, or want to organise their gear.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "zip": {
                "description": "US ZIP for shipping options (Padel USA ships within the US only).",
                "maxLength": 5,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add to Padel USA cart"
