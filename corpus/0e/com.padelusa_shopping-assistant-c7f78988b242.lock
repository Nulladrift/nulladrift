        {
          "name": "find_racket",
          "title": "Find my padel racket",
          "description": "Recommends the 3 best-fitting padel rackets for a player from the Padel USA store (in-stock rackets only; Padel USA ships within the United States). Uses the same matching engine as the Racket Finder on padelusa.com, ranked purely on fit to the player. Answer the Finder's questions yourself from what the shopper already said, instead of interviewing them: e.g. \"I play 3 times a week and love to smash\" = level intermediate, style aggressive; \"my elbow hurts\" = injury sometimes; \"I'm new\" = beginner; \"under $200\" = max_price_usd 200. Call it as soon as you can infer the level; ask at most one short question only if you cannot guess it. Leave out what you cannot infer (never make up arm pain, age or budget). The result includes accessories the player needs with the racket (an overgrip always, an arm sleeve if they have arm pain); offer them in one sentence. Show each pick with its name, price, the reasons, and its product link. To buy, call add_to_cart with the pick's variant_id, then build_kit to complete the kit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Your age range? \"18-34\" = 18–34; \"35-49\" = 35–49; \"50+\" = 50+.",
                "enum": ["18-34", "35-49", "50+"],
                "type": "string"
              },
              "current_racket": {
                "description": "Intermediate/advanced only: the brand and model the player uses now, e.g. \"Bullpadel Vertex 04\". Used to find a genuine step up.",
                "maxLength": 120,
                "type": "string"
              },
              "current_shape": {
                "description": "Intermediate/advanced only, when the current racket is unknown. What’s your current racket like? \"round\" = A round / control racket (Forgiving, control-first); \"teardrop\" = A teardrop / all-round racket (Balanced power and control); \"diamond\" = A diamond / power racket (Head-heavy, built to attack); \"notsure\" = Not sure (I just play with what I have).",
                "enum": ["round", "teardrop", "diamond", "notsure"],
                "type": "string"
              },
              "dislike": {
                "description": "Intermediate/advanced only. What would you change about it? \"power\" = I want more power (More punch on smashes and drives); \"control\" = I want more control (More precision and placement); \"comfort\" = It’s harsh on my arm (I want a softer, comfier feel); \"lighter\" = It feels heavy (I want a lighter, faster swing); \"spin\" = I want more spin (A grippier face for bite); \"nothing\" = Nothing major (Just exploring better options).",
                "enum": ["power", "control", "comfort", "lighter", "spin", "nothing"],
                "type": "string"
              },
              "feel": {
                "description": "What should impact feel like? \"soft\" = Soft (Plush and forgiving — max comfort); \"medium\" = Balanced (Not too soft, not too firm); \"firm\" = Firm (Solid and direct — pure feedback); \"notsure\" = Not sure yet (Pick for me).",
                "enum": ["soft", "medium", "firm", "notsure"],
                "type": "string"
              },
              "gender": {
                "description": "Who’s this racket for? \"men\" = Men’s; \"women\" = Women’s.",
                "enum": ["men", "women"],
                "type": "string"
              },
              "injury": {
                "description": "Any elbow or wrist trouble? \"none\" = No, never (Arm feels great); \"sometimes\" = Occasionally (A twinge after long sessions); \"often\" = Yes, often (Comfort is a priority).",
                "enum": ["none", "sometimes", "often"],
                "type": "string"
              },
              "level": {
                "description": "What’s your level on court? \"beginner\" = Just starting out (New to padel, or play casually); \"intermediate\" = Improving fast (Play regularly, building consistency); \"advanced\" = Competitive (Tournaments, leagues, serious matches).",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Budget ceiling in US dollars. Leave out for no limit.",
                "maximum": 5000,
                "minimum": 30,
                "type": "number"
              },
              "prior_sport": {
                "description": "Beginners only. Did you play a racket sport before? \"none\" = No, padel’s my first (Straight into padel); \"tennis\" = Tennis (I play or played tennis); \"pball\" = Pickleball (Came from the paddle court); \"other\" = Ping pong, badminton or other (Another racket sport).",
                "enum": ["none", "tennis", "pball", "other"],
                "type": "string"
              },
              "style": {
                "description": "How do you win points? \"defensive\" = The wall (Patient at the back — force the error); \"allround\" = All-court (Adapt to whatever the point needs); \"aggressive\" = The finisher (Net rushes, smashes and volleys); \"notsure\" = Still figuring it out (No fixed style yet).",
                "enum": ["defensive", "allround", "aggressive", "notsure"],
                "type": "string"
              },
              "women_suitable_first": {
                "description": "Women only: true to prioritise lighter, arm-friendly and women's-range rackets (never a hard filter).",
                "type": "boolean"
              }
            },
            "required": ["level"],
            "type": "object"
          },
