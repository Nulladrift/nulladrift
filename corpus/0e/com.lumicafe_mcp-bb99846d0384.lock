      "instructions": "Lumi es una cafetería de especialidad en el Centro de Tijuana, México (lumicafe.com). Datos oficiales del negocio, en español. Usa get_business_info para dirección, contacto y amenidades; get_opening_hours para el horario; get_menu y search_menu para la carta con precios en MXN; list_spaces para la sala de juntas, la terraza y cómo reservar; get_faq para las preguntas frecuentes; read_page para el texto de cualquier página o nota en Markdown. Todo es de solo lectura: Lumi no recibe pedidos, pagos ni reservaciones por MCP. Las reservaciones de espacios se piden por WhatsApp (664 980 4080) y las confirma una persona. Al citar, nombra «Lumi» y enlaza la página de lumicafe.com. También se permite usarlo para entrenar modelos (Content-Signal: ai-train=yes en /robots.txt).",
