          "title": "AI photo policy check",
          "description": "Whether Tinder, Hinge and Bumble allow AI-generated or AI-edited profile photos, how they detect them, what happens if you break the rules, and how to use AI photos safely — quoted from each app's official guidelines. Omit app to compare all three.",
