      "tools": [
        {
          "name": "audit_dating_photo",
          "title": "Dating photo audit",
          "description": "Score one dating-profile photo 0-100 and list concrete issues and fixes (lighting, framing, face visibility, background, realism). Takes a public https URL to a JPEG/PNG/WebP image. Free: 5 audits per day per user. The photo is analysed and not stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "image_url": {
                "description": "Public https URL of the photo (JPEG, PNG or WebP, max 10 MB)",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a378ce409638d1cc5c17ec54b177a8721be49ef0f933b17bd9ef80e6d57d5ebc"
        },
        {
          "name": "check_ai_photo_policy",
          "title": "AI photo policy check",
          "description": "Whether Tinder, Hinge and Bumble allow AI-generated or AI-edited profile photos, how they detect them, what happens if you break the rules, and how to use AI photos safely — quoted from each app's official guidelines. Omit app to compare all three.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "Optional: a single app; omit to compare all",
                "enum": ["tinder", "hinge", "bumble"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de387c5cbb1fee83cffe0d316fcb03fb5e269a1bbd17124f4ea43509a815c0c7"
        },
        {
          "name": "get_dating_app_photo_rules",
          "title": "Dating app photo rules",
          "description": "Official photo rules for a dating app (Tinder, Hinge or Bumble): how many photos, how verification works, what is not allowed, and its AI-photo policy, with links to the official sources. Use when someone asks what photos a dating app allows or requires.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
