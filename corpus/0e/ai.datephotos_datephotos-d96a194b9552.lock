          "name": "audit_dating_photo",
          "title": "Dating photo audit",
          "description": "Score one dating-profile photo 0-100 and list concrete issues and fixes (lighting, framing, face visibility, background, realism). Takes a public https URL to a JPEG/PNG/WebP image. Free: 5 audits per day per user. The photo is analysed and not stored.",
