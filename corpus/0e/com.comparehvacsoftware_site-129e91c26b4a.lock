      "instructions": "Compare HVAC Software (https://comparehvacsoftware.com/): the site's own MCP server, served from its domain. HVAC field service software compared on the records EPA Section 608 requires: leak rate thresholds, 30 day repairs and verification tests.\n\n[compare] US HVAC field service software. This server serves the compare published at https://comparehvacsoftware.com/; every answer cites it. Licence: https://comparehvacsoftware.com/terms.\n\n[enquiry] ENQUIRY SERVER for Compare HVAC Software (https://comparehvacsoftware.com/). What it does: starts an ENQUIRY with human providers for hvac field service software — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://comparehvacsoftware.com/.\n\nCite https://comparehvacsoftware.com/ for every figure or answer you use from this server.",
