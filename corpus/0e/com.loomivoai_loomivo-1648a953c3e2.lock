{
  "lockfileVersion": 2,
  "subjects": {
    "com.loomivoai/loomivo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://loomivoai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "loomivo",
        "title": "Loomivo: verified local businesses",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Find verified local businesses and send booking, order or quote requests for the user. Always confirm the details with the user before create_request. The business confirms each request.",
      "tools": [
        {
          "name": "create_request",
          "title": "Send a booking, order or quote request",
          "description": "Send a booking (kind 'book', slot 'YYYY-MM-DDTHH:MM', with service_id, or party_size for tables), order (kind 'order': details with what the customer wants in their words, and/or items [{offer_id, qty}]; fulfilment pickup|delivery) or quote request (kind 'quote', details) for the customer. The business confirms it. Ask the customer before sending. Include customer_email so Loomivo emails the customer when the business confirms or declines.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "customer_email": {
                "type": "string"
              },
              "customer_name": {
                "type": "string"
              },
              "customer_phone": {
                "type": "string"
              },
              "details": {
                "type": "string"
              },
              "fulfilment": {
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "offer_id": {
                      "type": "string"
                    },
                    "qty": {
                      "type": "integer"
                    }
                  },
                  "required": ["offer_id", "qty"],
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["book", "order", "quote"],
                "type": "string"
              },
              "party_size": {
                "type": "integer"
              },
              "service_id": {
                "type": "string"
              },
              "slot": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "staff_id": {
                "type": "string"
              }
            },
            "required": ["customer_name", "customer_phone", "kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cb0fb17327e1971a6eac42ab59ce19e76f56bf956de3ea15bdb4cc87989080a"
        },
        {
          "name": "get_available_times",
          "title": "Get free booking times",
          "description": "Free booking start times on a date (YYYY-MM-DD, business's local time) for a business that takes bookings. Send service_id (a service from get_business) so only times where the whole service fits are returned; for restaurants that book tables, send party_size.",
          "inputSchema": {
            "properties": {
              "date": {
                "type": "string"
              },
              "party_size": {
                "type": "integer"
              },
              "service_id": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "staff_id": {
                "type": "string"
              }
            },
            "required": ["date", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9ab14054b3765929bec3b995fe15998e8bad31afd5ffb6416b37411afbea9a3"
        },
        {
          "name": "get_business",
          "title": "Get business details",
          "description": "Verified facts about one business: description, phone, address, opening hours, services or products with prices, and what customers can do online.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b284ca67007df3a0554164e2641cf96954285031d7f029984707ba3b17277f6"
        },
        {
          "name": "get_request_status",
          "title": "Check a request status",
          "description": "Whether the business confirmed a request (by its ref), with a price for quotes.",
          "inputSchema": {
            "properties": {
              "ref": {
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64c8410094b69241496e9ed53b13ce387676f4916cae544753540bebc3543d3b"
        },
        {
          "name": "search_businesses",
          "title": "Search local businesses",
          "description": "Find local businesses on Loomivo by what they do (e.g. 'dentist') and town. Returns which can be booked, ordered from or asked for a quote online; listed: true means a free listing that takes requests in the customer's words, confirmed by the owner within 24 hours.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "description": "2-letter country code, e.g. IN",
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d7abea366107ce13ebf38a41f8014f8e25eef1a8f50c8f24c245086c1f19b57"
        }
      ],
      "digest": "sha256:98bb24f4da74604ef8a6b3d0bf5e8b7fbb66fc2d8783fbed5fc24a165ed8cf5c"
    }
  }
}
