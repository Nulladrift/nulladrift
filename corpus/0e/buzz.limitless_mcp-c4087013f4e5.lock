        },
        {
          "name": "list_listing_targets",
          "description": "Read the shared Get listed catalog: supported destinations, manual requirements and paid options. Listing availability is independent of trading. No payment or submission.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b807b4e87dba0f3bb8a477b2528834f055a9ad2cd809ac40b3374d8ee142557"
        },
        {
          "name": "submit_listing",
          "description": "Prepare or dispatch supported listing requests through the website’s shared Get listed backend. Requires proof from the token creator. Omit signature and issuedAt to get the exact message to sign locally, then repeat with both. Manual forms remain action_required; paid targets remain payment_required. No paid submission, wallet signing or blockchain transaction. A prepared packet is not provider acceptance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "issuedAt": {
                "maximum": 9999999999,
                "minimum": 1,
                "type": "integer"
              },
              "mint": {
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              },
              "signature": {
                "description": "Base58 Ed25519 signature over the exact listing message. Never a private key.",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{64,88}$",
                "type": "string"
              },
              "target": {
                "default": "all",
                "enum": ["all", "dexscreener", "geckoterminal", "birdeye", "jupiter", "solscan", "coingecko", "coinmarketcap"],
                "type": "string"
              },
              "wallet": {
                "maxLength": 44,
                "minLength": 32,
                "type": "string"
              }
            },
            "required": ["mint", "wallet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44ab3b9040f200a70d707591a0b5fb6f797061d471e9542f0f48052b83b31ed8"
        }
      ],
      "digest": "sha256:da25f64946f43bc68acbb47094bc77e752f19683f206bf4a850398c2d72f8fb5"
    }
