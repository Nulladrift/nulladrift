            "readOnly": true
          },
          "digest": "sha256:ccf132e17a9b1ef97ac323b3adba837f88729a06db25d2cc09be2e2ee1306df8"
        },
        {
          "name": "get_trending",
          "description": "Return the public Limitless discovery feed sorted by its upstream trending score. Pending tokens may appear.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
