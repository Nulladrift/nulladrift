          "digest": "sha256:ad2997262398af9f2a7c8c453410166befb9e81664c301adf287de0717f30b30"
        },
        {
          "name": "search_near_postcode",
          "title": "Schools near a postcode",
          "description": "List schools, nurseries and childcare near an England postcode (full postcode or district such as SE22), nearest first, by straight-line distance from the postcode centre. Each school shows its latest Ofsted outcome, whether it is selective (grammar) and its religious character from the official register, and whether a last distance offered has been published; the figure itself is shown to signed-in Catchmently pass holders.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "faith": {
                "default": "any",
                "description": "Schools with a religious character: \"only\" or \"exclude\", per the official register.",
                "enum": ["any", "only", "exclude"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "phase": {
                "default": "any",
                "description": "Only this kind of school. \"other\" is special, independent and other schools.",
                "enum": ["any", "primary", "secondary", "nursery", "other"],
                "type": "string"
              },
              "postcode": {
                "description": "Full postcode (e.g. SE22 8DL) or postcode district (e.g. SE22).",
                "maxLength": 10,
                "type": "string"
              },
              "published_distance_only": {
                "default": false,
                "description": "Only schools with a published last distance offered.",
                "type": "boolean"
              },
              "radius_miles": {
                "default": 1,
                "description": "Straight-line radius in miles, at most 3.",
                "maximum": 3,
                "minimum": 0.1,
                "type": "number"
              },
              "selective": {
                "default": "any",
                "description": "Selective (grammar) schools: \"only\" or \"exclude\", per the official register.",
                "enum": ["any", "only", "exclude"],
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
