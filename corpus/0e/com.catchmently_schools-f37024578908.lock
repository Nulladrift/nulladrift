          "title": "Last distances offered and catchment",
          "description": "Every published last distance offered for one school (by entry year and intake, as the council or the school published it, with sources) and the council catchment or priority area. Free without sign-in until 4 January 2027.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "school_id": {
                "description": "Catchmently ID, e.g. gias:138342 or ofsted:EY546961.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "required": ["school_id"],
            "type": "object"
          },
          "annotations": {
