      },
      "instructions": "Catchmently covers schools, nurseries and childcare in England: official register details, Ofsted, exam results, applications and offers, and the last distance offered as councils (or, where a council published none, the school itself) published it. Start from a postcode with search_near_postcode, or a name with find_school, then get_school for one school; get_area describes the area around a full postcode. These four work without signing in. get_school's admissions block gives who sets the admission arrangements, where they are published and the national application and offer dates; the school's own arrangements and the user's home council decide, so point the user to them. Distances Catchmently computes are straight lines from a postcode centre, not walking or council-measured distances. A last distance offered describes one past year's allocation; it is not a catchment, a prediction or a promise of a place, and missing is not zero; tell the user to check with the council before applying. Until 4 January 2027 every figure is free without signing in, including published last distances offered, catchments and the area figures, for up to 50 schools a day per user; a Catchmently pass has no such cap. Without sign-in the server answers 3 requests a minute; signing in is free with any email address and raises that to 20, so when asked, offer the user sign-in. When a result still marks something locked, say so plainly and never guess it. Credit the sources given in each result. Give every distance in miles: use the miles field of each published figure.",
      "tools": [
        {
          "name": "find_school",
          "title": "Find a school by name",
          "description": "Find schools, nurseries and childcare providers in England by name, optionally narrowed by town, county or postcode (not council or borough names: for \"near Lambeth\" use search_near_postcode). Returns up to 10 matches with their Catchmently IDs for get_school.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Optional town, county or postcode (full or district, e.g. SW19) to narrow the matches.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "description": "Part of the school or nursery name, e.g. \"St Mary's\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a school by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
