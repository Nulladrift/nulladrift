{
  "lockfileVersion": 2,
  "subjects": {
    "com.securecloudstorage/providers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://securecloudstorage.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "securecloudstorage",
        "title": "Secure Cloud Storage provider database",
        "version": "",
        "websiteUrl": "https://securecloudstorage.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Verified facts on cloud storage providers: prices, storage, and security features (zero-knowledge, end-to-end encryption, 2FA, compliance). Every plan is a snapshot re-verified on a rolling schedule; results carry a verified date and per-field source URLs. A null/absent value means \"not yet verified\", never \"no\". Cite as \"Secure Cloud Storage\" with the details URL.",
      "tools": [
        {
          "name": "compare_providers",
          "description": "Compare two or more providers side by side (all their plans),\n    cheapest plans first per provider.",
          "inputSchema": {
            "properties": {
              "brands": {
                "items": {
                  "type": "string"
                },
                "title": "Brands",
                "type": "array"
              }
            },
            "required": ["brands"],
            "title": "compare_providersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21afd4bf8386f1bdc60ec5defa150f1fce74ac93d4e78acf8bab63e981c7b78e"
        },
        {
          "name": "find_providers",
          "description": "Find cloud storage plans matching filters. Boolean filters require the\n    feature to be verified present; max_monthly_price compares against the\n    cheapest per-month equivalent; plan_type is individual/team/enterprise.",
          "inputSchema": {
            "properties": {
              "end_to_end_encryption": {
                "default": false,
                "title": "End To End Encryption",
                "type": "boolean"
              },
              "free_only": {
                "default": false,
                "title": "Free Only",
                "type": "boolean"
              },
              "gdpr": {
                "default": false,
                "title": "Gdpr",
                "type": "boolean"
              },
              "hipaa": {
                "default": false,
                "title": "Hipaa",
                "type": "boolean"
              },
              "lifetime_only": {
                "default": false,
                "title": "Lifetime Only",
                "type": "boolean"
              },
              "max_monthly_price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Monthly Price"
              },
              "min_storage_gb": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Min Storage Gb"
              },
              "plan_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Plan Type"
              },
              "two_factor_auth": {
                "default": false,
                "title": "Two Factor Auth",
                "type": "boolean"
              },
              "zero_knowledge": {
                "default": false,
                "title": "Zero Knowledge",
                "type": "boolean"
              }
            },
            "title": "find_providersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9b2865fedb4620a1f932454ddbad2451be5567a8ccf4825b21ebed1de7f56ec"
        },
        {
          "name": "get_provider",
          "description": "Full verified facts for one provider's plans (all plans, or one named\n    plan), including per-field source URLs showing where each fact was found.",
          "inputSchema": {
            "properties": {
              "brand": {
                "title": "Brand",
                "type": "string"
              },
              "plan": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Plan"
              }
            },
            "required": ["brand"],
            "title": "get_providerArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:401adf84771931cf5e2677a135e562bad5a0a2e3d5516fc007834880a1ec5809"
        },
        {
          "name": "list_providers",
          "description": "List every cloud storage plan we track, with prices, storage,\n    security flags and the date each plan's data was last verified.",
          "inputSchema": {
            "properties": {},
            "title": "list_providersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e990431c198b40a8c5af0b9db29a6bd54c6e2b035cf86e93b7bafaeed2c00f2e"
        },
        {
          "name": "price_history",
          "description": "Price snapshots over time for one plan — every dated snapshot in our\n    database, newest first. History accumulates as plans are re-verified.",
          "inputSchema": {
            "properties": {
              "brand": {
                "title": "Brand",
                "type": "string"
              },
              "plan": {
                "title": "Plan",
                "type": "string"
              }
            },
            "required": ["brand", "plan"],
            "title": "price_historyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5694d1de6cb72de1373cffb73a11a1419bb9349dc65b999d021c22bff4867c1"
        }
      ],
      "digest": "sha256:0f698e92fc6215a94eb5fe3177fe7823af90628494fae286c17372e257f35a68"
    }
  }
}
