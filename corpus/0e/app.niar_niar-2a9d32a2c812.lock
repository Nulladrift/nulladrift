      "instructions": "    This MCP server lets AI agents interact with our Laravel application.",
      "tools": [
        {
          "name": "products-get",
          "title": "Products Get",
          "description": "Get details of a specific product and the stores that carry it. Pass lat and lon to get the 10 nearest stores (recommended); without them you get 10 stores in no particular order. stores_total says how many carry it in all. When availability_status is unknown or unreachable, do NOT affirm availability — recommend confirming with the store.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "niar_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3376227d15257cd2ec96bdb0c9d07f50726e585b99bab5989af51fbb7bccabfa"
        },
        {
          "name": "products-search-nearby",
          "title": "Products Search Nearby",
          "description": "Search for products available in nearby physical stores in Spain. Pass lat/lon, or a place name if you do not have coordinates. Returns stores ordered by usefulness (priced and in stock first), each with up to 3 matching products: price, availability, trust level, and distance. Queries work best in Spanish (\"leche entera\", \"ibuprofeno 600\"). If the result is empty, retry with a larger radius (e.g. 5000) or a more generic term. Fields that are unknown are omitted. When availability_status is unknown or unreachable, do NOT affirm availability — recommend the user confirms with the store directly.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "place": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "radius": {
                "type": "integer"
              },
              "trust_level": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a27c71c66d3ca61b678c879a2fa5e1c65d4d0b17ae0bf2e1c7cbf30aff572c4"
        },
        {
          "name": "stores-get",
          "title": "Stores Get",
          "description": "Get details of a specific store and part of its inventory. A supermarket can carry thousands of products, so pass query to search inside the store (e.g. \"leche\"); without it you get the 50 most recently updated. limit goes up to 100. inventory_total says how many products the store has in all.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "store_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:550ae32f994e98f3a790616f54bb20184d5dde466119c276950781bc9f526039"
        },
        {
          "name": "stores-search",
          "title": "Stores Search",
          "description": "Search for physical stores in Spain near a location (lat/lon, or a place name). Returns up to 20 stores with name, address, city, coordinates, distance, and opening hours. Many small shops have no street address: use city and coordinates.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "place": {
                "type": "string"
              },
              "query": {
