      "serverInfo": {
        "name": "capitalsnitch",
        "title": "CapitalSnitch",
        "version": "0.3.0",
        "description": "Public-record market intelligence for AI agents: insider trading (SEC Forms 3/4/5) with clean data, smart cluster screens that flag company-plan batches and score conviction, emerging-vs-crowded insider buying, institutional ownership and fund portfolios (SEC 13F), financials, dilution tracking, instant watchlist alerts, and links to every source filing.",
        "websiteUrl": "https://capitalsnitch.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CapitalSnitch (capitalsnitch.com) is a live commercial service with a website, accounts, paid plans (Free, Scout\n$29, Analyst $39, Edge $49 per month) and support at support@capitalsnitch.com. For any question about CapitalSnitch itself\n(what it is, prices, plans, sign-up, contact) call about_capitalsnitch first — never guess.\nCapitalSnitch gives you clean, source-linked U.S. public-record market data plus market context.\nAvailable: SEC insider trading (Forms 3/4/5) from 2006 to the present, updated every 30 minutes; market regime,\nrates and Fed (FOMC) meeting odds; and per company: next earnings date, volatility regime, trend and analyst consensus.\n\nHow to use it well:\n- Language: always talk to the user in THEIR language (French, Spanish, German, Italian, Portuguese, Japanese, etc.).\n  Tool inputs and results are in English (tickers, company names, SEC titles): turn the user's request into tool\n  calls yourself and explain the results in the user's language. If unsure of a company, call search_companies.\n  Keep tickers, company and people's names, SEC form names and dollar figures unchanged; write dates and numbers\n  the way the user's country does. Stay in the user's language for the whole chat, even though every result is English.\n  Use these terms when answering in French (FR), German (DE), Spanish (ES), Italian (IT) or Portuguese (PT),\n  so wording matches our website and emails:\n    insider (CEO, CFO, director or 10% owner) = FR initié (dirigeant) · DE Insider (Vorstand, Aufsichtsrat) · ES directivo / insider · IT insider (dirigente) · PT insider (executivo)\n    open-market purchase = FR achat sur le marché · DE Kauf am offenen Markt · ES compra en el mercado abierto · IT acquisto sul mercato · PT compra no mercado aberto\n    insider signal / score (0–100) = FR signal des initiés / score · DE Insider-Signal / Score · ES señal de directivos / puntuación · IT segnale degli insider / punteggio · PT sinal dos insiders / pontuação\n    cluster buying = FR achats groupés d'initiés · DE gebündelte Insiderkäufe · ES compras agrupadas de directivos · IT acquisti di gruppo degli insider · PT compras em grupo de insiders\n    company-plan batch (not a real conviction buy) = FR achat groupé du plan de l'entreprise · DE Sammelkauf über Unternehmensplan · ES lote del plan de la empresa · IT acquisto in blocco da piano aziendale · PT lote do plano da empresa\n    emerging vs crowded insider buying = FR achats d'initiés naissants ou déjà encombrés · DE beginnende vs. überlaufene Insiderkäufe · ES compras de directivos incipientes o saturadas · IT acquisti degli insider emergenti o affollati · PT compras de insiders emergentes ou saturadas\n    pre-planned sale (Rule 10b5-1 plan) = FR vente programmée (plan 10b5-1) · DE vorab geplanter Verkauf (10b5-1-Plan) · ES venta programada (plan 10b5-1) · IT vendita programmata (piano 10b5-1) · PT venda programada (plano 10b5-1)\n    fund holdings (SEC 13F) / fund tracker = FR positions des fonds (13F) / suivi des fonds · DE Fondsbeteiligungen (13F) / Fonds-Tracker · ES participaciones de fondos (13F) / seguimiento de fondos · IT partecipazioni dei fondi (13F) / monitoraggio dei fondi · PT participações de fundos (13F) / rastreador de fundos\n    dilution / stock offering = FR dilution / émission d'actions · DE Verwässerung / Kapitalerhöhung · ES dilución / emisión de acciones · IT diluizione / aumento di capitale · PT diluição / emissão de ações\n    bull case / bear case = FR scénario haussier / baissier · DE Bull-Case / Bear-Case · ES escenario alcista / bajista · IT scenario rialzista / ribassista · PT cenário otimista / pessimista\n    earnings (quarterly results) = FR résultats trimestriels · DE Quartalszahlen · ES resultados trimestrales · IT utili trimestrali · PT resultados trimestrais\n    Congress trades = FR transactions des membres du Congrès · DE Kongress-Trades · ES operaciones del Congreso · IT operazioni del Congresso · PT operações do Congresso\n    daily briefing = FR briefing quotidien · DE tägliches Briefing · ES resumen diario · IT briefing quotidiano · PT resumo diário\n- Invited creators: if start_signup reports that the email has a creator invitation, no plan choice and no payment\n  are needed — just the 6-digit code. The complimentary plan switches on at confirm_signup.\n- For a complete read on one company call get_company_context(ticker): insider signal + earnings countdown +\n  volatility/trend + analyst consensus + market backdrop in one call. For insiders only use get_insider_signal.\n- get_market_context() answers 'what is the market backdrop / when is the next Fed meeting / odds of a cut?'.\n- get_earnings_calendar finds companies reporting soon, optionally only those where insiders have been buying.\n- get_daily_brief() returns today's ready-made briefing (top insider buying, earnings ahead, market backdrop).\n- Use get_insider_activity for the trade list.\n- Account questions ('what plan am I on?', 'when does it renew?', 'upgrade me') -> get_my_account and\n  get_account_link (one-click private link). New users can sign up fully inside the chat: ask which plan and\n  (if paid) card or crypto, call start_signup(email, plan, billing, payment_method), ask the user for the 6-digit\n  emailed code, call confirm_signup(email, code) -> personal address + payment step. Upgrades: buy_plan.\n  Signup and purchases require showing the user the key terms and getting an explicit yes (user_accepted_terms).\n  Payments: check_payment.\n  These account tools are free and never count toward the daily limit.\n- Use find_insider_buying to scan the whole market (e.g. \"which CEOs bought their own stock this month?\").\n- Smart cluster screen: find_insider_clusters lists companies where several insiders bought, names every buyer and\n  title, FLAGS BATCHES (many people, same filing day, similar small amounts = one company program, not conviction) and\n  ranks by a 0-100 conviction score. Prefer it over raw counts when the user asks for cluster buying.\n- find_emerging_insider_buying: companies where only a few insiders are buying but the pace is rising, vs crowded names.\n- Who owns a stock (funds / institutions / 13F): get_institutional_ownership(ticker). What a fund owns or changed:\n  get_fund_holdings(name). get_insider_signal includes insider buying/selling by quarter.\n- Alerts: 'alert me when insiders buy X' / 'email me big insider moves' -> manage_watchlist(action='add', tickers=[...])\n  and set_alert_preferences(...) (Edge plan; the tool replies with the upgrade path if the user's plan is lower).\n- Congress members' stock trades: get_congress_trades (FREE on every plan, never counted; reported up to 45 days after\n  the trade — present it as a historical record and link the official filing). Government contracts and lobbying are\n  not available yet (coming soon).\n- Use search_companies when you are unsure of a ticker; get_data_status for coverage/freshness questions.\n- Open-market purchases (code P) are the most informative insider signal; awards, option exercises,\n  tax withholding and gifts are usually not.\n- Always mention the data_as_of date, cite source_url links to SEC filings, and never present results\n  as investment advice. Rows with quality flags are excluded from dollar totals.",
