        {
          "name": "start_signup",
          "title": "Sign up or sign in from the chat (step 1: email code)",
          "description": "Create a CapitalSnitch account — or sign back in and get a new connection address — entirely from the chat,\nno website needed. Step 1 of 2: emails the user a 6-digit code. Then ask the user for the code and call\nconfirm_signup(email, code). Before calling, ask the user which plan they want (Free, Scout $29, Analyst $39,\nEdge $49 per month; yearly = 2 months free, one-time, never auto-renews) and, for a paid plan, card or crypto.\nThe user must agree to the key terms first: call once without user_accepted_terms to get them, show them, and\nonly after an explicit 'yes' set user_accepted_terms=true. Free to call.",
          "inputSchema": {
            "properties": {
              "billing": {
                "default": "monthly",
                "description": "Paid plans: monthly, or annual (2 months free).",
                "enum": ["monthly", "annual"],
                "title": "Billing",
                "type": "string"
              },
              "crypto_asset": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Crypto only, e.g. 'USDC-base' (recommended), 'USDT-solana', 'BTC-bitcoin', 'ETH-base', 'SOL-solana'.",
                "title": "Crypto Asset"
              },
              "email": {
                "description": "The user's email address. A 6-digit code is sent there.",
                "title": "Email",
                "type": "string"
              },
              "payment_method": {
                "anyOf": [
                  {
                    "enum": ["card", "wallet", "crypto"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Paid plans: 'card' (credit/debit via Square; monthly renews automatically), 'wallet' (Apple Pay / Google Pay / Cash App Pay, one-time, no auto-renew) or 'crypto' (USDC/USDT/BTC/ETH/SOL, one-time, no auto-renew).",
                "title": "Payment Method"
              },
              "plan": {
                "default": "free",
                "description": "Plan the user wants. Ask them; describe the options if unsure.",
                "enum": ["free", "scout", "analyst", "edge"],
                "title": "Plan",
                "type": "string"
              },
              "user_accepted_terms": {
                "default": false,
                "description": "True ONLY after you showed the user the key terms (returned when this is false) and the user explicitly said they agree.",
                "title": "User Accepted Terms",
                "type": "boolean"
              }
            },
