          "name": "find_insider_buying",
          "title": "Market-wide insider buying scan",
          "description": "Scan ALL U.S. companies for insider open-market PURCHASES — the strongest insider signal. Ranks companies by\ntotal value bought, number of distinct insiders buying ('cluster buying'), or recency. Use for 'which insiders\nare buying right now?', 'CEO purchases this month', 'companies where 3+ insiders bought'.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "description": "Look-back window in days (1–365).",
                "maximum": 365,
                "minimum": 1,
                "title": "Days",
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Max companies (1–50).",
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_insiders": {
                "default": 1,
                "description": "Minimum number of distinct insiders buying (cluster buying).",
                "maximum": 50,
                "minimum": 1,
                "title": "Min Insiders",
                "type": "integer"
              },
              "min_total_value_usd": {
                "default": 100000,
                "description": "Minimum total purchase value per company.",
                "minimum": 0,
                "title": "Min Total Value Usd",
                "type": "number"
              },
              "roles": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["CEO", "CFO", "COO", "President", "Chair", "Executive Officer", "Officer", "Director", "10% Owner", "Other"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only count buyers with these roles, e.g. ['CEO','CFO']. Omit for all.",
                "title": "Roles"
              },
              "sort_by": {
                "default": "value",
                "description": "Ranking.",
                "enum": ["value", "insiders", "recent"],
                "title": "Sort By",
                "type": "string"
              }
            },
            "title": "find_insider_buyingArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Latest SEC filing date included in the data (YYYY-MM-DD).",
                "title": "Data As Of"
              },
              "disclaimer": {
                "default": "Public-record data for research and education. Not investment advice. Insider trades can be routine (pre-planned 10b5-1 sales, taxes, diversification); correlation is not causation.",
                "title": "Disclaimer",
                "type": "string"
              },
              "notes": {
                "description": "Caveats, data-quality notes, next steps.",
                "items": {
                  "type": "string"
                },
