      "serverInfo": {
        "name": "artemisia-aguassb",
        "title": "Artemisia · asistente de IA de Aguas SB",
        "version": "0.5.12",
        "websiteUrl": "https://aguassb.com/artemisia/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Artemisia · Aguas SB (aguassb.com). Información de solo consulta sobre tratamiento de agua: agua de consumo y pozo, vertidos industriales, reutilización, control de cloro y pH y lavado de áridos. obtener_conocimiento, orientar_caso_agua, procedimiento, estimar_depuracion y consultar_depuradora (dato declarado, normativa y ficha de cualquiera de las 2.174 depuradoras urbanas de España del Observatorio) son deterministas, sin modelo de lenguaje. consultar_aguas_sb responde con un modelo a partir del material publicado. preparar_solicitud_estudio devuelve un texto que la persona envía en https://aguassb.com/contacto/. Es orientación general, no un compromiso: el diseño se fija con analítica y, si procede, ensayo. Más información: https://aguassb.com/artemisia/",
      "tools": [
        {
          "name": "consultar_aguas_sb",
          "title": "Consultar a Artemisia (Aguas SB)",
          "description": "Responde a una pregunta libre con un modelo de lenguaje a partir de lo publicado por Aguas SB (potabilización doméstica y de pequeñas comunidades, depuración industrial con oxidación avanzada, reutilización, control de cloro y pH, lavado de áridos, ensayos y alquiler), y enlaza la página de origen. Es la única herramienta que usa un modelo: útil cuando los documentos de obtener_conocimiento no cubren la pregunta o se pide una respuesta redactada, también en inglés. Solo consulta; no envía nada.",
          "inputSchema": {
            "properties": {
              "idioma": {
                "description": "Idioma de la respuesta (por defecto, el de la pregunta)",
                "enum": ["es", "en"],
                "type": "string"
              },
              "pregunta": {
                "description": "La pregunta en lenguaje natural (español o inglés). Sin datos personales.",
                "maxLength": 1200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["pregunta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bbd9931c97cfd7137a91b1d5a750b50eeba6159b7fe42d7eb20c8d64523c9bf"
        },
        {
          "name": "consultar_depuradora",
          "title": "Datos públicos de una depuradora urbana de España",
          "description": "Busca una depuradora urbana de España en el Observatorio de Aguas SB (2.174 plantas del registro europeo Waterbase-UWWTD, dato declarado del año 2022) por su código oficial o por nombre, municipio o provincia, y devuelve el dato declarado (capacidad y carga en habitantes equivalentes, tratamiento, nitrógeno, fósforo, UV), la normativa que le aplica (demarcación y organismo que autoriza el vertido a cauce, norma o ordenanza de referencia de su comunidad para el alcantarillado, tramo de la Directiva (UE) 2024/3019), el escenario energético publicado (estimación, no consumo real) y la URL de su ficha. Determinista, sin modelo de lenguaje. No dice quién la gestiona ni si cumple: es un dato declarado, no una inspección.",
          "inputSchema": {
            "properties": {
              "codigo": {
                "description": "Código oficial del registro europeo (p. ej. ES12270190000000E), si se conoce",
                "maxLength": 30,
                "type": "string"
              },
              "municipio": {
                "maxLength": 80,
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de la depuradora o del municipio (p. ej. \"Foz\", \"Galindo\", \"Sur\")",
                "maxLength": 80,
                "type": "string"
              },
              "provincia": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4652dde4aeaffc56a0e667e7e75671ea604b74493f139c41a0d3946a8d8fcc56"
        },
        {
          "name": "estimar_depuracion",
          "title": "Estimar la depuración de un vertido (cuenta de manual)",
          "description": "Cuenta en orden de magnitud para la depuración de un vertido: con el caudal y la DQO o la DBO₅ devuelve la carga diaria, los habitantes equivalentes, cuánto hay que quitar para cumplir un límite, el tamaño, la energía y el fango de un biológico aerobio (parámetros de manual), los riesgos de cada camino, el primer paso según el sector y qué tipo de especialista consultar. Determinista, sin modelo de lenguaje. Útil cuando se conoce el caudal y la carga de un agua residual. No es un proyecto: el diseño real se hace con analítica y, en oxidación avanzada, con ensayo.",
          "inputSchema": {
            "properties": {
              "caudal_m3_dia": {
                "description": "Caudal de agua residual en m³ al día",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "dbo5_mg_l": {
                "description": "DBO₅ media en mg/L (si se conoce)",
                "type": "number"
              },
              "destino": {
                "enum": ["alcantarillado", "cauce", "no_se"],
                "type": "string"
              },
              "dqo_mg_l": {
                "description": "DQO media en mg/L (si se conoce)",
                "type": "number"
              },
              "limite_dqo_mg_l": {
                "description": "Límite de DQO de la ordenanza o la autorización, en mg/L (opcional)",
                "type": "number"
              },
              "produccion": {
                "description": "Cómo es la producción: regular todo el año, irregular (paradas, picos) o de campaña",
                "enum": ["regular", "irregular", "campana"],
                "type": "string"
              },
              "sector": {
                "enum": ["queseria", "tortillas", "obrador", "bodega", "carnica", "lavadero", "taladrinas", "lavanderia", "vivienda", "otro"],
                "type": "string"
              }
            },
            "required": ["caudal_m3_dia"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a2d8f29c1af5000afe0ec452a7bb5fbac3f51901bdbbe7a32dab2b195fb55bf"
        },
        {
          "name": "obtener_conocimiento",
          "title": "Documentos públicos por tema",
          "description": "Devuelve los documentos públicos de Aguas SB sobre un tipo de agua: qué mide cada parámetro, qué decide el tratamiento, cómo trabaja la empresa y qué datos hacen falta. Determinista, sin modelo de lenguaje. Útil para responder preguntas generales sobre ese tipo de agua. Material público revisado. Solo consulta.",
          "inputSchema": {
            "properties": {
              "filtro": {
                "description": "Opcional: palabra o tema para devolver solo los documentos que lo tratan (p. ej. \"perla\", \"ensayo\", \"nitratos\", \"cloro\"). Si nada coincide, se devuelven todos.",
                "maxLength": 80,
                "type": "string"
              },
              "incluir_metodo": {
                "description": "Opcional (por defecto true): incluir el documento «cómo trabaja Aguas SB».",
                "type": "boolean"
              },
              "tipo_de_agua": {
                "enum": ["consumo", "residual", "reutilizacion", "aridos"],
                "type": "string"
              }
            },
            "required": ["tipo_de_agua"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d835e80e731ec3df29d2307492888fa7683b0d80dfa47e0857369731472ad87"
        },
        {
          "name": "orientar_caso_agua",
          "title": "Orientar un caso de agua",
          "description": "Para un tipo de agua, cómo plantea Aguas SB el caso: qué decide el tratamiento, qué ofrece, qué datos conviene aportar y en qué página seguir (y qué herramienta de cálculo hay, si la hay). Determinista, sin IA. Solo consulta.",
          "inputSchema": {
            "properties": {
              "descripcion": {
                "description": "Descripción breve del caso (opcional). Sin datos personales.",
                "maxLength": 600,
                "type": "string"
              },
              "tipo_de_agua": {
                "description": "consumo (pozo, manantial, vivienda), residual (depuración y vertido), reutilizacion (agua depurada que se quiere volver a usar) o aridos (lavado de áridos)",
                "enum": ["consumo", "residual", "reutilizacion", "aridos"],
                "type": "string"
              }
            },
            "required": ["tipo_de_agua"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d183dd371708c3b3577fca11ece5f61f634098ea7f4a8dbc0981a2f4de378541"
        },
        {
          "name": "preparar_solicitud_estudio",
          "title": "Redactar solicitud de estudio",
          "description": "Redacta el texto de una solicitud de estudio del agua para Aguas SB a partir del caso, con los datos que conviene añadir. No envía nada ni maneja datos personales: devuelve el texto y la dirección del formulario (https://aguassb.com/contacto/), que la persona revisa y envía.",
          "inputSchema": {
            "properties": {
              "descripcion": {
                "description": "El caso con las palabras de la persona. Sin datos personales.",
                "maxLength": 1200,
                "minLength": 10,
                "type": "string"
              },
              "tipo_de_agua": {
                "enum": ["consumo", "residual", "reutilizacion", "aridos"],
                "type": "string"
              }
            },
            "required": ["descripcion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
