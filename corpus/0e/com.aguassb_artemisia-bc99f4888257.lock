            "readOnly": true
          },
          "digest": "sha256:3ca2b4249cf81a86d804602a8772ab056bed3744ddf7df7610b694dddb29a736"
        },
        {
          "name": "procedimiento",
          "title": "Procedimientos y trámites del agua",
          "description": "Paso a paso de un trámite habitual en España: pedir una autorización de vertido (alcantarillado o cauce), pedir información pública sobre una depuradora, encargar una analítica de agua de consumo, o solicitar un estudio a Aguas SB. Con el marco legal y las competencias. Orientación general; no tramita.",
          "inputSchema": {
            "properties": {
              "tarea": {
                "enum": ["autorizacion_vertido", "informacion_publica_depuradora", "analitica_agua_consumo", "estudio_aguas_sb"],
                "type": "string"
              }
            },
            "required": ["tarea"],
            "type": "object"
          },
          "annotations": {
