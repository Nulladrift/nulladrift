{
  "lockfileVersion": 2,
  "subjects": {
    "com.cazimedia.agentnative/official-provenance-aggregations-insights-free-samples-open-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
