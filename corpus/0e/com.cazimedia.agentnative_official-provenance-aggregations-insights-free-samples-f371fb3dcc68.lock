          "digest": "sha256:2c06c85efa4406f7627631050b0eb1109dd53eabdcd652239ca2f7bdcb3ca750"
        },
        {
          "name": "purchase_dataset_page_once",
          "title": "Buy one warehouse page",
          "description": "Pay USD 0.01 for one eligible page using a compatible Tempo wallet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "skip": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "top": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2ab923f7bce47424ec2411b29bf1e9a6c9009b2a798859584f6b44f11429594"
        },
        {
          "name": "query_imported_dataset",
          "title": "Query an imported official dataset",
          "description": "Free preview returns up to 25 rows with $skip to 475 and a next_url page cursor; use sample_imported_dataset first, then page free results. Paid auth raises the bounds to 100 rows and $skip 5000 at 120 requests per minute, and unlocks the exact-match filter. Returns normalized rows, freshness, and provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "type": "string"
              },
              "filter_field": {
                "type": "string"
              },
              "filter_value": {
                "type": "string"
              },
              "skip": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "top": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbbb5ef55196ab39bb7af3cf01c5898b2764da09389553649ab3794e016d92ed"
        },
        {
          "name": "query_us_federal_register",
          "title": "Query the US Federal Register",
          "description": "Use this paid read-only tool when the free Federal Register briefing is insufficient. Returns up to 100 normalized official records filtered by date or document type, with deterministic provenance and direct source URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "start_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "top": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "enum": ["NOTICE", "PRORULE", "RULE", "PRESDOCU"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8146a49e88d75135c1099eb1faa7091e093f104f39c36cb3ddbccd8a804353c9"
        },
        {
          "name": "recover_dataset_page",
          "title": "Recover a paid page",
          "description": "Prove ownership of the paying wallet to recover the original page.",
          "inputSchema": {
            "additionalProperties": false,
            "oneOf": [
              {
                "required": ["operation_id"]
              },
              {
                "required": ["transaction_hash"]
              }
            ],
            "properties": {
              "operation_id": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "transaction_hash": {
                "pattern": "^0x[0-9a-f]{64}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7060e40e9ffb1c8dd3e2ea17934ff77607f431b413c8ce6c0f38941c772c717"
        },
        {
          "name": "request_capability",
          "title": "Request a feature, payment method, data or endpoint",
          "description": "Free, no signup. Request any feature, including payment methods we do not yet support. Examples include finding live parking by facility, comparing school district finances across states with local-cost-adjusted spending per student, downloading CSV results, or requesting PayPal or Bitcoin Lightning. For payment requests, name the method and the agent task it would enable. Dataset capabilities require dataset; endpoint/suggestion require description (10-800 characters), no dataset needed. Use public examples, never credentials or personal information. Retain the private receipt/status_url. A receipt confirms recording, not support, delivery or a review date.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "else": {
                  "required": ["dataset"]
                },
                "if": {
                  "properties": {
                    "capability": {
                      "enum": ["endpoint", "suggestion"]
                    }
                  }
                },
                "then": {
                  "properties": {
                    "description": {
                      "minLength": 10
                    }
                  },
                  "required": ["description"]
                }
              }
            ],
            "properties": {
              "capability": {
                "enum": ["dataset", "filter", "aggregation", "insight", "freshness", "export", "endpoint", "suggestion"],
                "type": "string"
              },
              "dataset": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "description": {
                "maxLength": 800,
                "type": "string"
              },
              "example_query": {
                "maxLength": 240,
                "type": "string"
              },
              "source_url": {
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:78ed5d1408252943973135bff94be3d24beb7c10b392f4bcf225d689a00f47a8"
        },
        {
          "name": "request_dataset_materialization",
          "title": "Make a discovered dataset query-ready",
          "description": "Queue a discovered official dataset for prioritized detached ingestion. This free idempotent operation returns a durable job ID; poll get_materialization_status until it supplies sample and query URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "discovered_dataset_id": {
                "description": "Exact catalog ID returned by search_discovered_datasets.",
                "pattern": "^disc_[a-f0-9]{24}$",
                "type": "string"
              }
            },
            "required": ["discovered_dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e52bd3a4fb08580bb2a63c4564ae6574647ab87cc872a546730cb9767e30a2b1"
        },
        {
          "name": "request_paid_access",
          "title": "Create a Stripe access checkout",
          "description": "Use this state-changing tool only after free samples demonstrate value and the human owner approves payment. Creates a Stripe Checkout plus one-time claim URL; choose the $5 pass for research or $5/month subscription for recurring workflows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "default": "pass",
                "enum": ["pass", "subscription"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
