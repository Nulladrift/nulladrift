      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentnative-data-exchange",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Start with free discovery and sample tools. If a discovered dataset is not query-ready, call request_dataset_materialization once and poll get_materialization_status until complete. For missing data, endpoints or improvements use request_capability free without signup, then retain the private receipt for get_capability_request_status. Suggestions need a description and no dataset. Never call request_paid_access without explicit approval from the human owner.",
      "tools": [
        {
          "name": "aggregate_imported_dataset",
          "title": "Aggregate an official dataset",
          "description": "Free preview returns the top 10 groups over the published snapshot; paid auth raises the bound to top 50. Use for deterministic count, sum, average, minimum, or maximum groups with dataset provenance instead of downloading rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "type": "string"
              },
              "field": {
                "type": "string"
              },
              "group_by": {
                "type": "string"
              },
              "metric": {
                "enum": ["count", "sum", "avg", "min", "max"]
              },
              "top": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dataset_id", "group_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd75c3c9d0124b2c93eacad49edc077b775ad9e26b8edc86e32a917250f91576"
        },
        {
          "name": "get_capability_request_status",
          "title": "Check a request's status",
          "description": "Free read-only lookup with your private receipt. Returns only requested, building, shipped or declined. Never share your receipt in public logs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt": {
                "pattern": "^r_[a-f0-9]{32}$",
                "type": "string"
              }
            },
            "required": ["receipt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d83fd8d081c14d023d51fb1d739bb006359ea759d70619fc0306bcc54743b3c1"
        },
        {
          "name": "get_coverage_status",
          "title": "Get public-data coverage status",
          "description": "Use this free operational tool to decide whether available public-data coverage is sufficient or whether to request a missing capability. Returns discovery, materialization, queryable-row, queue, failure, and freshness counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:801bf9e1bfe657d69ea30b6283e4296aaab92bcee3c66e9f0569f76b4a94809e"
        },
        {
          "name": "get_materialization_status",
          "title": "Check dataset materialization",
          "description": "Poll a durable materialization job. A complete result includes the query-ready dataset ID plus free sample and paid query URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "materialization_id": {
                "pattern": "^job_[a-f0-9]{24}$",
                "type": "string"
              }
            },
            "required": ["materialization_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5820a08083b043d74a6e78b70e6412eb74077d822dc13d67802a1a6b98f7b325"
        },
        {
          "name": "list_imported_datasets",
          "title": "List queryable official datasets",
          "description": "Use this free tool when an agent needs only datasets that can be sampled or queried now. Returns fully published warehouse snapshots with dataset IDs, row counts, freshness, and provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
