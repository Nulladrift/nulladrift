{
  "lockfileVersion": 2,
  "subjects": {
    "co.heyspark.mcp/server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.heyspark.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "heyspark-mcp-server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_business_details",
          "description": "Get complete details for a specific HeySpark-listed business including address, hours, services, reviews summary, and contact information. Premium businesses include photos and special offers.",
          "inputSchema": {
            "properties": {
              "business_id": {
                "description": "Business ID (UUID format)",
                "type": "string"
              },
              "slug": {
                "description": "Business URL slug (e.g., 'bellas-kitchen-asheville')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80a7762296b7dcfc898528e211bde000b22e53551e78b912358ece3a1516e735"
        },
        {
          "name": "get_reviews_summary",
          "description": "Get a reviews summary for a HeySpark-listed business. Shows overall rating, review count, and review highlights (Premium tier only).",
          "inputSchema": {
            "properties": {
              "business_id": {
                "description": "Business ID to get reviews for",
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6dd693f76f1c56245d2218cdffa33537b599ee31e5def542844488393b226183"
        },
        {
          "name": "list_categories",
          "description": "List all available business categories on HeySpark with the number of active businesses in each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:538e604f62e6777664febf997552d31fd6a445c30777c7a74946bb6580750e31"
        },
        {
          "name": "search_businesses",
          "description": "Search for local businesses listed on HeySpark. Filter by keyword, category, city/state, or geographic coordinates. Returns a list of matching businesses with name, category, location, rating, and contact info. Premium-tier businesses appear first in results.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Business category filter",
                "enum": ["restaurant", "salon", "barbershop", "dental", "medical", "veterinary", "plumber", "electrician", "hvac", "contractor", "landscaping", "auto_repair", "auto_body", "tire_shop", "law_firm", "accounting", "real_estate", "insurance", "retail", "fitness", "spa", "pet_grooming", "cleaning", "moving", "photography", "catering", "bakery", "coffee_shop", "bar", "brewery", "other"],
                "type": "string"
              },
              "city": {
                "description": "City name (e.g., 'Asheville')",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude for location-based search",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Max results (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude for location-based search",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "offset": {
                "description": "Pagination offset (default 0)",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Search keyword (e.g., 'pizza', 'emergency plumber', 'hair salon')",
                "type": "string"
              },
              "radius_miles": {
                "description": "Search radius in miles (max 50). Requires latitude/longitude.",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "state": {
                "description": "State code (e.g., 'NC')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebef4c718434bcd02a706174af7e58787beef5b5f9eaa750339d6f0ab5bf9563"
        }
      ],
      "digest": "sha256:063b1a6d584300ec0e20973bf014a6c293077645e6cc9c40773de8812eb67082"
    }
  }
}
