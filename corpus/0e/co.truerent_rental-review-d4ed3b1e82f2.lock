                "type": "string"
              },
              "job_number": {
                "type": "string"
              },
              "job_zip": {
                "description": "Job ZIP, if there is no street.",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "project": {
                "type": "string"
              },
              "quantity": {
                "description": "How many. 1 to 999.",
                "type": "integer"
              }
            },
            "required": ["confirmed", "equipment"],
            "type": "object"
