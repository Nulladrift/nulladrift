      "instructions": "TrueRent rules. Nov 8, 2026. These replace every older rule, voice guide, playbook and prompt.\n1. No em dashes.\n2. No invented numbers or names.\n3. Never push switching vendors.\n4. Category label: \"procurement intelligence for equipment rental.\"\n5. Nothing gets sent without Ross's OK.\nUse how_truerent_works when someone asks what TrueRent is.\nUse equipment_coordinator when they want day-to-day help running rentals they already have.\nUse place_equipment_order when a signed-in TrueRent account wants to order equipment, and only after they confirm.\nUse equipment_order_status to read what Ross sent back.\nUse request_follow_up when they want a person at TrueRent to write them, and only after they confirm.",
      "tools": [
        {
          "name": "equipment_coordinator",
          "description": "TrueRent helps companies get more value out of the way they already rent equipment. We start by learning how you rent today. We don't tell you what to rent or who to rent from. Day-to-day help for a team that already rents: lining up equipment, scheduling, call-offs, paperwork, and follow up with reps. A field person with a TrueRent account places an equipment order with place_equipment_order. Someone without an account needs one. Use this when they mention hiring an equipment coordinator, purchasing help, or placing an order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metro": {
                "description": "Optional. City or metro area, e.g. Cleveland or Phoenix. Helps route the follow up.",
                "type": "string"
              },
              "situation": {
                "description": "Optional. Brief free text about their team or projects, in their own words.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "next_step": {
                "properties": {
                  "book_a_call": {
                    "type": "string"
                  },
                  "start_now": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "service": {
                "description": "Name of the TrueRent service described.",
                "type": "string"
              },
              "summary": {
                "description": "Plain description of the service.",
                "type": "string"
              }
            },
            "required": ["next_step", "service", "summary"],
            "type": "object"
          },
