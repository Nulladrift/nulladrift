        {
          "name": "place_equipment_order",
          "title": "Place an equipment order",
          "description": "Place an equipment order for a signed-in TrueRent account. Call only after the person confirms the equipment, the place, and the date. Ross is notified. No vendor is contacted from this step. Without a TrueRent account, tell them they need one. Do not send a follow-up in place of the order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmed": {
                "description": "True only after the person confirms the order.",
                "type": "boolean"
              },
              "delivery_date": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "delivery_location": {
                "description": "Where it goes.",
                "type": "string"
              },
              "duration": {
                "type": "string"
              },
              "equipment": {
                "description": "Equipment needed.",
                "type": "string"
              },
              "idempotency_key": {
