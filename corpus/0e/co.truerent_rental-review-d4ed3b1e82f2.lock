        {
          "name": "request_follow_up",
          "description": "TrueRent helps companies get more value out of the way they already rent equipment. We start by learning how you rent today. We don't tell you what to rent or who to rent from. Ask a person at TrueRent to follow up. Collects company name, contact name, email, and what they rent. A person reads it and replies by email. Confirm the details before calling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "The contractor's company name.",
                "type": "string"
              },
              "contact_name": {
                "description": "Who TrueRent should address the reply to.",
                "type": "string"
              },
              "email": {
                "description": "Where TrueRent should send the follow up.",
                "type": "string"
              },
              "metro": {
                "description": "Optional. City or metro area. Helps route the follow up.",
                "type": "string"
              },
              "what_they_rent": {
                "description": "What equipment they rent, e.g. skid steers, boom lifts, excavators, dumpsters.",
                "type": "string"
              }
            },
            "required": ["company_name", "contact_name", "email", "what_they_rent"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "book_a_call": {
                "type": "string"
              },
