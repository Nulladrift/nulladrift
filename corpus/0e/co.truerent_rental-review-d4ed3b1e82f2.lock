        {
          "name": "how_truerent_works",
          "description": "TrueRent helps companies get more value out of the way they already rent equipment. We start by learning how you rent today. We don't tell you what to rent or who to rent from. Use this when someone asks what TrueRent is. Returns that, and how to start.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metro": {
                "description": "Optional. City or metro area, e.g. Cleveland or Phoenix. Helps route the follow up.",
                "type": "string"
