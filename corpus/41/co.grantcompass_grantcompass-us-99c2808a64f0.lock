      },
      "serverInfo": {
        "name": "grantcompass-us",
        "title": "GrantCompass US",
        "version": "1.0.0",
        "websiteUrl": "https://grantcompass.co/chatgpt-claude-app"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GrantCompass US finds US funding programs (grants, loans, tax credits) for small businesses, and checks base-level eligibility (state, organization type, ownership, size, industry). Use search_grants to find programs, check_eligibility when the user asks whether they qualify for a specific program, and get_grant for details on one. Only pass founder_groups if the user volunteered that information. Eligibility is a likelihood on base requirements, never a guarantee; always share the program page link for the full criteria. Not for scholarships, student aid, personal loans, or funding outside the United States.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check eligibility for a US grant",
          "description": "Use this when the user asks whether they qualify for a specific US funding program (by name or from earlier results), or shares business details after a search. Checks base requirements — state, organization type, ownership, size, industry — and returns meets / does not meet / need to know for each, an overall likely-fit verdict, and what else to check. Works with partial details: it returns what is already known and lists exactly which questions to ask next. A likely fit is not a guarantee. Not for scholarships, personal loans, or non-US programs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employees": {
                "description": "Number of employees (0 for a solo founder).",
                "minimum": 0,
                "type": "integer"
              },
              "founder_groups": {
                "description": "Owner identity groups — ONLY if the user volunteered this. Some programs are reserved for these groups. Never ask for it unprompted; use \"none\" if the user said none apply.",
                "items": {
                  "enum": ["women", "minority", "black", "hispanic_latino", "asian_american", "native_american_tribal", "veteran", "disability", "lgbtq", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "industry": {
                "description": "Closest industry. A bakery or restaurant is food_beverage; a shop is retail_consumer. Omit if unclear.",
                "enum": ["software_tech", "manufacturing", "healthcare_life_sciences", "clean_energy_environment", "agriculture", "services_professional", "retail_consumer", "aerospace_defense", "construction_trades", "food_beverage"],
                "type": "string"
              },
              "org_type": {
                "description": "How the organization is registered. Omit if the user hasn't said.",
                "enum": ["corporation_or_llc", "sole_proprietor", "nonprofit", "not_yet_registered"],
                "type": "string"
              },
              "program_name": {
                "description": "The program's name, if no slug is known (e.g. \"Amber Grant\").",
                "type": "string"
              },
              "slug": {
                "description": "The program's slug from search_grants results (preferred).",
                "type": "string"
              },
              "state": {
                "description": "US state where the business operates — 2-letter code (e.g. \"OH\") or full name.",
                "type": "string"
              },
              "years_operating": {
                "description": "Years the business has been operating (0 if not launched yet).",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check eligibility for a US grant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://grantcompass-us/grants-v2.html",
            "openai/toolInvocation/invoked": "Checked eligibility",
            "openai/toolInvocation/invoking": "Checking the program's requirements…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://grantcompass-us/grants-v2.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:125accad64ef32f538fe72ce1335a2814a0ac411d0f675cebaaeeb0e0c0ba801"
        },
        {
          "name": "get_grant",
          "title": "Get US grant details",
          "description": "Use this when the user asks for details about one specific US funding program — what it funds, how much, who it's for, deadline and status, how long applying takes. Returns public program facts and a link to the program page. For \"do I qualify\" use check_eligibility instead. Not for non-US programs or scholarships.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "program_name": {
                "description": "The program's name, if no slug is known.",
                "type": "string"
              },
              "slug": {
                "description": "The program's slug from search_grants results (preferred).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get US grant details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8e622bbe2e5b27e2a76e964067b0da9c80cbb647f74d49d6860d361825f506f"
        },
        {
          "name": "search_grants",
          "title": "Search US small business grants",
          "description": "Use this when someone wants funding for a US small business or organization — grants, loans, or tax credits — including indirect questions about paying for equipment, hiring, a storefront, exporting, or startup costs (e.g. \"grants for my bakery in Ohio\", \"how can I pay for a new truck for my landscaping business\", \"non-dilutive funding for our biotech\"). Works with partial details: call it even when the user has shared little, because it returns what is already known and lists which details would narrow the results. Returns 3–8 programs from the GrantCompass US catalog with amount, current application status, a base-level fit check, and a link to each program page. Pass any business details the user gave (state, organization type, industry, employees). Do not use for: college scholarships or student aid, personal loans or debt relief, individual benefits, academic research fellowships, or funding outside the United States (e.g. Canada).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employees": {
                "description": "Number of employees (0 for a solo founder).",
                "minimum": 0,
                "type": "integer"
              },
              "founder_groups": {
                "description": "Owner identity groups — ONLY if the user volunteered this. Some programs are reserved for these groups. Never ask for it unprompted; use \"none\" if the user said none apply.",
                "items": {
                  "enum": ["women", "minority", "black", "hispanic_latino", "asian_american", "native_american_tribal", "veteran", "disability", "lgbtq", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "funding_type": {
                "description": "Only when the user asks for one kind. \"grant\" = money that is not repaid.",
                "enum": ["any", "grant", "loan", "tax_credit"],
                "type": "string"
              },
              "industry": {
                "description": "Closest industry. A bakery or restaurant is food_beverage; a shop is retail_consumer. Omit if unclear.",
                "enum": ["software_tech", "manufacturing", "healthcare_life_sciences", "clean_energy_environment", "agriculture", "services_professional", "retail_consumer", "aerospace_defense", "construction_trades", "food_beverage"],
                "type": "string"
              },
              "limit": {
                "description": "How many programs to return (default 6).",
                "maximum": 8,
                "minimum": 3,
                "type": "integer"
              },
              "min_amount": {
                "description": "Minimum award size in US dollars, only if the user gave one.",
                "minimum": 0,
                "type": "number"
              },
              "open_now_only": {
                "description": "True when the user only wants programs accepting applications now.",
                "type": "boolean"
              },
              "org_type": {
                "description": "How the organization is registered. Omit if the user hasn't said.",
                "enum": ["corporation_or_llc", "sole_proprietor", "nonprofit", "not_yet_registered"],
                "type": "string"
              },
              "query": {
                "description": "What the business does or needs funding for, in the user's words (e.g. \"bakery equipment\", \"solar installation\", \"hiring and training\").",
                "type": "string"
              },
              "state": {
                "description": "US state where the business operates — 2-letter code (e.g. \"OH\") or full name.",
                "type": "string"
              },
              "years_operating": {
                "description": "Years the business has been operating (0 if not launched yet).",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search US small business grants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://grantcompass-us/grants-v2.html",
            "openai/toolInvocation/invoked": "Found funding programs",
            "openai/toolInvocation/invoking": "Searching US funding programs…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://grantcompass-us/grants-v2.html",
              "visibility": ["model", "app"]
            }
          },
