            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 500,
                    "minLength": 5,
                    "type": "string"
                  },
                  "categories": {
