                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "photos": {
                    "items": {
                      "format": "uri",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "start_date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "start_time": {
                    "anyOf": [
                      {
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "title": {
                    "maxLength": 200,
                    "minLength": 3,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "expected_updated_at": {
                "description": "Latest updated_at from get_sale; prevents overwriting concurrent edits.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "management_token": {
                "description": "Private token returned after verified publication, or the seller’s emailed edit code.",
                "maxLength": 100,
                "minLength": 20,
                "type": "string"
              },
              "slug": {
                "pattern": "^[A-Za-z0-9_-]{1,600}$",
                "type": "string"
              }
            },
            "required": ["changes", "expected_updated_at", "management_token", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
