          "description": "Where a task stands: running, needs_input (answer the question with reply), done, or failed. While running, progress names the step in flight (research, skill, ...; null while it thinks or writes the reply), its latest headline, and how many sources research has read. Returns the answer the latest reply ends with (a failed task: all it wrote) with evidence as links and [image card: name] where a card stands, the sources it cites, the skills it used, the other AI behind a take, the documents the task made (id, title, url), its images, video and sound with file urls and the credits each spent, and the image and video cards of the latest reply with their price: run one with generate once your human agrees to the price.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "all_sources": {
                "description": "List every source the task saw (sources_seen counts them), not only those the reply cites.",
                "type": "boolean"
              },
              "seen": {
                "description": "The seen value from your last get_task: leaves out the reply, sources and cards you already read, and media that has not changed. Leave it out to read the cards and their prices again.",
