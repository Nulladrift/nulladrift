      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Nutcracker does the creative work: strategy, copy, naming, ideas, research-backed docs, presentations, storyboards, images and video. You bring the facts and publish the result; Nutcracker picks the method.\n\n- A task is a chat in one space. Find the space with list_spaces; when none fits, make one with create_space. Send a plain brief: the outcome you need and who it is for. Put facts, numbers, sources and constraints in context. The space's brand memory and pinned docs apply to every task in it.\n- list_work names the kinds of work and what each returns; name one in the brief when it fits. Ask for a structure (sections, counts, a template) only when your reader needs that exact one: a structure you prescribe replaces the one the method gives.\n- A task takes minutes: poll get_task with wait_seconds, and pass back the seen it gave you so it returns only what changed. needs_input means it waits on a choice; ask your human when it is a matter of taste, then answer with reply. Ask for revisions with reply too, so the chat keeps its history.\n- For another model's take on ideas, a script, lines or an insight, call reply with another_ai: a model from another lab writes its own version with the same method, it lands beside the first in the app, and the task says how they differ. list_models names the models. To steer the take, or before a first reply exists, say so in words in the brief or in reply (\"ask GPT, focus on the hook\"). get_task lists the skills a task used.\n- A task can't read other tasks. To hand work on, keep it as a doc (save_reply_to_doc, or a doc the task made) and pass its id in doc_ids.\n- A task sees your images and files only when you upload them: upload_file, send the file to its url, pass the file_id in files on start_task or reply. Documents the space should keep (a client's decks, research, brand book) go to upload_file with space_id: they join the space's Files, which every chat in it reads and the team sees.\n- Docs a task makes belong to its chat: get_task lists them, list_space shows them once filed in the space or pinned. Every doc starts private to your human.\n- pin makes a doc or a space file material every chat in its space reads (brand rules, a standing brief, a source). Pinning a doc in a team space shares it with the team, so pin is refused until your human agrees.\n- share_link publishes: anyone with the link opens it without an account until unshare. The link shows in the doc's Share panel.\n- Media spends the workspace credits; get_credits shows what is left. A task may make images itself; get_task shows what each cost. Image and video cards wait for you: run one with generate only after your human agrees to its price. A needs_input option with a credit price spends too: answer with it only after your human agrees.\n- update_doc changes a doc's text: one passage, an addition at the end, or the whole body. Presentations and storyboards change only through a task. Presentation slides show images, not video.\n- duplicate_doc makes a private copy of a doc, presentation or storyboard to start the next round from; revise the copy, the original stays as it is.\n- A presentation's JSON doesn't show how its slides look. To check them, export the pdf, or one slide with format png and its slide_id from read_doc, rather than opening the app.\n- Keep the Nutcracker url in your report so your human can open the work in the app.",
      "tools": [
        {
          "name": "add_images",
          "title": "Add images to collections",
          "description": "Sort images you sent to a space (upload_file with space_id) into its collections, as a drop in the app: each lands in the collection and group it fits, and images that fit none start a new collection. The answer says where each landed, with app links, and gives a drop_id: undo_drop takes the whole drop back within a day. Sorting looks at every image, so a big drop takes up to a minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "collection_id": {
                "description": "One of this space's own collections from list_space (no from_space_id): sort into its groups only, as a drop on its page.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "image_ids": {
                "description": "image_id values from upload_file's answers.",
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "What to call a new collection for images that fit none, such as the folder they came from.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "space_id": {
                "description": "The space the images were sent to.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["image_ids", "space_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
