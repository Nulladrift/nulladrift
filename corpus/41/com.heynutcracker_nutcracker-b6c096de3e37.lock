        },
        {
          "name": "create_doc",
          "title": "Create doc",
          "description": "Make a new doc in a space from your Markdown, for material a task should read (pass its id in doc_ids) or a text your human wants kept. It starts private to your human; the team sees it once shared or pinned. A body in a file on your disk: leave out content, then send the file to the upload_url you get, e.g. curl -T <path> '<upload_url>'; the answer is the new doc, and each send makes another. The link works for 15 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "The doc body as Markdown. Leave out to send it from a file.",
                "type": "string"
              },
              "space_id": {
                "description": "A space id from list_spaces.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "title": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["space_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7cc09667a361a1b0e63d3bd099f77dd5589a9b3b33bbc8d3a139b8e26ea0d60"
        },
        {
          "name": "create_element",
          "title": "Create element",
          "description": "Make an @element in a space from images, a video or a voice you sent there, so every image and video made in the space and its sub-spaces keeps that character, product or place the same when a prompt names @name. Send each file with upload_file and space_id first. The answer has the element_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "Who or what it is, in a line a prompt can lean on.",
                "maxLength": 500,
                "type": "string"
              },
              "media_ids": {
                "description": "media_id values from upload_file's answers with space_id, or from list_elements: up to 4 images (the first is the face) or one video instead, plus one voice or sound. A video runs at least 3 s and audio at least 5 s; a model uses the first seconds it takes of a longer one.",
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "What a prompt calls it after @: letters, digits and _, with a letter, up to 30.",
                "maxLength": 30,
                "pattern": "^[A-Za-z0-9_]*[A-Za-z_][A-Za-z0-9_]*$",
                "type": "string"
              },
              "space_id": {
                "description": "A space id from list_spaces.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["media_ids", "name", "space_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:55bfe7abdd8e2e8472844e0a7cdd52633d2fbca7f2c54d0830a384925a784b67"
        },
        {
          "name": "create_space",
          "title": "Create space",
          "description": "Make a space when list_spaces has none that fits. If this place already has a space with the name, that one comes back with created: false instead of a second. A sub-space (parent_id) also reads its parent's pinned docs and elements, and takes its parent's scope. Otherwise scope decides who sees it: personal, the default, is your human alone; team is everyone in the workspace, so make a team space only when your human agrees.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "parent_id": {
                "description": "A space id from list_spaces, to make a sub-space of it.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "scope": {
                "description": "Who sees a top-level space. Default personal.",
                "enum": ["personal", "team"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
