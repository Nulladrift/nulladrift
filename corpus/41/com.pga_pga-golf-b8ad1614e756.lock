      "serverInfo": {
        "name": "com.pga/pga-golf",
        "title": "PGA Golf",
        "version": "1.0.0",
        "description": "PGA's official MCP Server for all things golf-related. Find a coach, discover programs, play golf, improve your game.",
        "websiteUrl": "https://mcp.pga.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
