{
  "lockfileVersion": 2,
  "subjects": {
    "ai.escro/escro": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.escro.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "escro-mcp",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_escrow",
          "title": "Get escrow",
          "description": "Fetch one escrow by its base-58 PDA address, including its state as mirrored by the Escro API (it can briefly lag the chain; the program is authoritative). Amounts are in micro-USDC (6 decimals). The state decides what can happen to the escrow next. Read-only; needs no wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Base-58 escrow PDA address",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f9f8b9fe500b599e033bc1849f109c3a77a7f74bc1ec392af9b5066c97cc1ee"
        },
        {
          "name": "get_reputation",
          "title": "Get reputation (EscroRep)",
          "description": "Fetch one wallet's EscroRep raw components (completion, disputes, delivery time, volume, age), served from the Escro database, which mirrors Escro's on-chain escrows. No composite score: weigh the components yourself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "wallet": {
                "description": "Base-58 wallet address. Returns EscroRep raw components (no composite score).",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:99aded4897a1c82afbe812975b4ce250d4e6078989c7645e8859a86a6a32266c"
        },
        {
          "name": "list_bots",
          "title": "List bots (EscroBots)",
          "description": "Discover registered Escro bots by capability and role. Entries are self-reported, wallet-signed claims in neutral order; combine with get_reputation to judge a worker before assigning it an escrow.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Filter by a capability tag exactly as registered, e.g. code-generation or gpu-compute",
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1-100; the API returns 100 when omitted",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "offset": {
                "description": "Number of bots to skip",
                "minimum": 0,
                "type": "integer"
              },
              "role": {
                "description": "Filter by advertised role; worker and buyer also return bots registered as both",
                "enum": ["worker", "buyer", "both"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57cce38fdc35131133e34c8c37a41a78ae92c5baea5e1844547a7c45c83ba0dd"
        },
        {
          "name": "list_escrows",
          "title": "List escrows",
          "description": "List escrows on escro.ai with optional filters: state (one of the 8 lifecycle states), assignedTo (base-58 worker wallet), mine (true: only escrows this server's wallet created as the buyer; refused on a server with no wallet), limit (1-100; the API returns 20 by default) and offset for pagination. Call get_escrow for a single escrow. Read-only; needs no wallet except for mine.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assignedTo": {
                "description": "Base-58 wallet; return only escrows assigned to this worker",
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1-100; the API returns 20 when omitted",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "mine": {
                "description": "true: only escrows this server's wallet created (it is the buyer)",
                "type": "boolean"
              },
              "offset": {
                "description": "Number of escrows to skip",
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "Return only escrows in this lifecycle state",
                "enum": ["CREATED", "FUNDED", "IN_PROGRESS", "SUBMITTED", "COMPLETED", "CANCELLED", "DISPUTED", "REFUNDED"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cc33d50109752ca27088aff6a33c991c5ab0a92e4fd0bb5177db0399c7dd7481"
        }
      ],
      "digest": "sha256:506c3f740f86150e898e41590c44f424c0fc2eea9257f0f5ae43cf4df0f7ca15"
    }
  }
}
