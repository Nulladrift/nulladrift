{
  "lockfileVersion": 2,
  "subjects": {
    "com.rattlesnakesbymail/rattlesnakesbymail": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rattlesnakesbymail.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Rattlesnakes By Mail",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "These tools look up a documented crawler or agent by name or user-agent string and match a free-text question against the claims published on Rattlesnakes By Mail. Submitting a note requires a client token issued by Rattlesnakes By Mail.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask A Question",
          "description": "Match a free-text question against the claims published on Rattlesnakes By Mail, and return the matching claims, or no match when no published claim covers the question. Every question sent to ask is recorded, and a recorded question may be published on the public questions page at Rattlesnakes By Mail. Do not send private or identifying text to ask.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "A free-text question about crawlers, agents, or claims.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c36f25c36b4b5b9d797b65baff542ecf40cd34f51017d9b89d5c9ce64dc1f943"
        },
        {
          "name": "get_snapshot",
          "title": "Get A Daily Snapshot",
          "description": "Return the daily snapshot of crawler activity on Rattlesnakes By Mail for one UTC date: dated facts, a table of crawler requests, context against each crawler's recent history, and links. Pass a six digit label such as 261101 or an ISO date such as 2026-11-01. The numbers come from one website and describe what these crawlers did here, not across the web.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "A snapshot label (YYMMDD) or an ISO date (YYYY-MM-DD).",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10abbb8170bafdfa9bfc1d25e43a297241ba97201e095bc997d2c63d28fb38b6"
        },
        {
          "name": "identify_user_agent",
          "title": "Identify A User Agent",
          "description": "Match an unrecognized raw User-Agent header against the crawlers documented on Rattlesnakes By Mail, and return the matched crawler plus instructions for verifying the request. Use identify_user_agent when the crawler behind the User-Agent header is not yet known.",
          "inputSchema": {
            "properties": {
              "user_agent": {
                "description": "A raw User-Agent header string.",
                "type": "string"
              }
            },
            "required": ["user_agent"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:473a81ca37e3dd1d9d9dca39262e8037bfb5fc312bd4023035f2607e6a33c756"
        },
        {
          "name": "list_changes",
          "title": "List Changes",
          "description": "List recorded changes to claims on Rattlesnakes By Mail, newest first, with the change date and the affected crawler. Filter by date with since, by crawler with entity, or by both. Use list_changes to detect crawler policy updates published after a given date.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "An entity slug to filter changes to one crawler.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum rows to return, up to 200.",
                "maximum": 200,
                "type": "integer"
              },
              "since": {
                "description": "An ISO date; only changes on or after this date are returned.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:156a6e65fb1620ea8d2c9afa5108a84c833706b4fd23ba21bbc5864c37692f5d"
        },
        {
          "name": "lookup_crawler",
          "title": "Look Up A Crawler",
          "description": "Look up a documented crawler on Rattlesnakes By Mail by name, slug, or user-agent string, and return identity fields, current claims, publication dates, and evidence URLs. Use lookup_crawler when the crawler is already named, or when the user agent is already known to belong to a documented crawler.",
          "inputSchema": {
            "properties": {
              "name_or_ua": {
                "description": "A crawler name, slug, or full user-agent string.",
                "type": "string"
              }
            },
            "required": ["name_or_ua"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa1cad1976685236967ee1dd9d3257e079093beeb4b7d13969a6521b2eec4866"
        },
        {
          "name": "submit_note",
          "title": "Submit A Note",
          "description": "Submit a correction or note about a claim, an entity, a question, or a daily snapshot on Rattlesnakes By Mail. Requires a client token issued out of band by the publisher. Every note is stored as pending, and an editor reviews every pending note before publication.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The note text, up to 2000 characters.",
                "maxLength": 2000,
                "type": "string"
              },
              "target": {
                "description": "Shorthand for target_type and target_id, for example snapshot:261101 or question:12.",
                "type": "string"
              },
              "target_id": {
                "description": "The id or slug of the claim or entity, the id or hash of the question, or the six digit label of the snapshot, the note is about.",
                "type": "string"
              },
              "target_type": {
                "description": "The kind of record the note is about.",
                "enum": ["claim", "entity", "question", "snapshot"],
                "type": "string"
              },
              "token": {
                "description": "A client token issued by Rattlesnakes By Mail.",
                "type": "string"
              }
            },
            "required": ["body", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:30590d511f81622b7fe452c814a5508a76569e73fa72e98add7dbc6de1f02faa"
        }
      ],
      "digest": "sha256:9c56f67d76831fcdf1e342b702f7666912c387888b66bd755498ee2f81cec263"
    }
  }
}
