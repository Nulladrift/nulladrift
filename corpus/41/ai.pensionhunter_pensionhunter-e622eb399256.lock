      },
      "instructions": "PensionHunter: Building the world's pension identification infrastructure. Official free routes first. Read-only: list_covered_countries, country_pension_facts, check_work_history, resolve_employer, authority_answer, deadline_check, gpfr_info, gpfr_fund_count. Actions: create_order_link (on request; no personal data), gpfr_register (after a yes to gpfr_info consent), gpfr_status. Facts sourced, dated. We store anonymous counts of the countries asked about, never names or contact details. GPFR, the Global Pension Finding Register (free). language: 27 ISO codes. Identification only; no advice.",
      "tools": [
        {
          "name": "authority_answer",
          "title": "Authority answers on the record",
          "description": "What a national pension institution told us in writing, as published on our answers page, with the institution, the date of the reply and the link. The question is free text, matched to the questions we hold answers to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "A country: English or native name, alias or ISO code, for example NL or Netherlands.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "include_offer": {
                "default": false,
                "description": "Optional, default false. Set true to add next_step, our report offer for this country. The offer the person sees comes from check_work_history (one offer for the whole history) or create_order_link.",
                "type": "boolean"
              },
              "language": {
                "description": "Optional. Language of our own sentences, default en: en, ar, da, de, es, fa, fr, hi, id, it, ja, ko, nb, nl, pl, pt, pt-BR, ro, ru, sv, th, tl, tr, zh, vi, uk, bg. Facts stay as stored.",
                "maxLength": 35,
                "minLength": 2,
                "type": "string"
              },
              "question": {
                "description": "The question in plain words, for example \"What do heirs need?\".",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fc96e0b0d86af4c9c676e90a1197c3799ef60564a7d9221d3d1df1257cab854"
        },
        {
          "name": "check_work_history",
          "title": "Check a work history",
          "description": "For each country in a work history: whether a pension is likely to exist and why, the official free routes first, what is hard from abroad and any dated obligation that applies. Years may be exact, rough or unknown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birthYear": {
                "description": "Optional. Year of birth, four digits. Used for age-dependent rules.",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "countryOfResidence": {
                "description": "Optional. Where the person lives now. For a country they live in, what is hard from abroad is left out.",
                "maxLength": 80,
                "type": "string"
              },
              "entries": {
                "description": "One entry per period of work in a country.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "description": "A country: English or native name, alias or ISO code, for example NL or Netherlands.",
                      "maxLength": 80,
                      "minLength": 2,
                      "type": "string"
                    },
                    "employer": {
                      "description": "Employer name as the person knows it. Optional.",
                      "maxLength": 120,
                      "type": ["string", "null"]
                    },
                    "from": {
                      "description": "First year of work: four digits, rough words such as \"around 2005\" or \"the 1990s\", or \"unknown\". Optional.",
                      "maxLength": 40,
                      "maximum": 2100,
                      "minimum": 1900,
                      "type": ["integer", "string", "null"]
                    },
                    "pensionType": {
                      "description": "Optional. state, workplace, provident or personal.",
                      "enum": ["state", "workplace", "provident", "personal"],
                      "type": "string"
                    },
                    "status": {
                      "description": "Optional. citizen, permanent_resident, pass_holder or unknown. Decides some verdicts, such as Singapore CPF.",
                      "enum": ["citizen", "permanent_resident", "pass_holder", "unknown", null],
                      "type": ["string", "null"]
                    },
                    "to": {
                      "description": "Last year, in the same forms, or \"now\". Omit when from alone describes the period.",
                      "maxLength": 40,
                      "maximum": 2100,
                      "minimum": 1900,
                      "type": ["integer", "string", "null"]
                    }
                  },
                  "required": ["country"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Optional. Language of our own sentences, default en: en, ar, da, de, es, fa, fr, hi, id, it, ja, ko, nb, nl, pl, pt, pt-BR, ro, ru, sv, th, tl, tr, zh, vi, uk, bg. Facts stay as stored.",
                "maxLength": 35,
                "minLength": 2,
                "type": "string"
              },
              "previousNames": {
                "description": "Optional. Earlier names worked under (maiden, married). Never stored.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "question": {
                "description": "Optional. The person's question in plain words, used only to tell which kind of pension it is about.",
                "maxLength": 500,
                "type": "string"
              },
              "subject": {
                "additionalProperties": false,
                "description": "Optional facts about the person, used only to decide which dated obligations apply.",
                "properties": {
                  "birthYear": {
                    "description": "Optional. Year of birth, four digits. Used for age-dependent rules.",
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  },
                  "childrenMentioned": {
                    "description": "True when children are part of the question.",
                    "type": "boolean"
                  },
                  "deceased": {
                    "description": "True when the person has died and a relative is asking.",
                    "type": "boolean"
                  },
                  "pensionInPaymentCountries": {
                    "description": "Countries already paying the person a pension.",
                    "items": {
                      "description": "Countries already paying the person a pension.",
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
