        {
          "name": "create_order_link",
          "title": "Get an order link for a report",
          "description": "Returns our order page with the report and countries filled in. Fees: Country $99, Enhanced $129 for two countries, Global $149 for three or more. Payment opens only when the person chooses to pay there, so send only countries and the tier, never personal details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "The countries to order for, as names or ISO codes, for example [\"NL\", \"United Kingdom\"]. Only countries we cover.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 41,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Optional. Language of our own sentences, default en: en, ar, da, de, es, fa, fr, hi, id, it, ja, ko, nb, nl, pl, pt, pt-BR, ro, ru, sv, th, tl, tr, zh, vi, uk, bg. Facts stay as stored.",
                "maxLength": 35,
                "minLength": 2,
                "type": "string"
