        {
          "name": "resolve_employer",
          "title": "Place an employer in a country",
          "description": "Places an employer name in a country and lists the employers we hold that it may mean, each with a confidence from 0 to 1. For employers we researched it adds what the employer became and its workplace pension plan, each fact with source and read date. Legal entities only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional. The country worked in: a name, alias or ISO code. Matches are then taken from that country only.",
                "maxLength": 80,
                "type": "string"
              },
              "include_offer": {
                "default": false,
                "description": "Optional, default false. Set true to add next_step, our report offer for this country. The offer the person sees comes from check_work_history (one offer for the whole history) or create_order_link.",
                "type": "boolean"
