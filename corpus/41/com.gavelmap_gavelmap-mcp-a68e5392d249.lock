{
  "lockfileVersion": 2,
  "subjects": {
    "com.gavelmap/gavelmap-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gavelmap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "gavelmap-mcp",
        "title": "GavelMap — Municipal Zoning & Hearing Radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use GavelMap tools to search live municipal zoning cases, inspect case dossiers with parcel APNs and hearing transcript excerpts, track BESS/data-center moratorium alerts, and evaluate planning commissioner voting scorecards across Austin, Phoenix, Dallas, Seattle, Denver, Nashville, Columbus, and Boston.",
      "tools": [
        {
          "name": "get_case_dossier",
          "title": "Get Case Dossier",
          "description": "Retrieve full details for a specific zoning case by case ID or municipal case number, including parcel APN, zoning request, hearing transcript excerpt, vote summary, and public dossier URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "description": "GavelMap case ID or municipal case number (e.g., \"austin-c14-2026-0042\" or \"C14-2026-0042\").",
                "type": "string"
              }
            },
            "required": ["case_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48c827ee0741822a54c3c0d896bbf47dc4b153a9776023cacc026b93034b5fa6"
        },
        {
          "name": "get_commissioner_scorecard",
          "title": "Get Commissioner Scorecard",
          "description": "Retrieve planning & zoning commissioner voting records, approval rates, average delay days, moratorium votes, top recurring objections, and notable quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metro": {
                "description": "Optional metro area filter.",
                "enum": ["austin", "phoenix", "dallas", "seattle", "denver", "nashville", "columbus", "boston"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fd584c458245d8df16c3b4b957e0c7682803243f6e27f2988177d8b162785ed"
        },
        {
          "name": "list_moratoriums",
          "title": "List Active Moratoriums",
          "description": "List active municipal moratoriums and battery energy storage (BESS), data center, or setback regulatory alerts across monitored metros.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metro": {
                "description": "Optional metro area filter.",
                "enum": ["austin", "phoenix", "dallas", "seattle", "denver", "nashville", "columbus", "boston"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1392a77c701bb23e1f461b88a401a987e6da91d2b1a4dcfd5cb6e019b3ffabdb"
        },
        {
          "name": "search_zoning_cases",
          "title": "Search Zoning Cases",
          "description": "Search live municipal zoning cases, rezoning applications, site plans, moratorium alerts, and distressed rescue leads across Austin, Phoenix, Dallas, Seattle, Denver, Nashville, Columbus, and Boston.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of cases to return (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "metro": {
                "description": "Filter cases by metro area.",
                "enum": ["austin", "phoenix", "dallas", "seattle", "denver", "nashville", "columbus", "boston"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search across case title, case number, address, owner, or applicant firm.",
                "type": "string"
              },
              "signal": {
                "description": "Filter by GavelMap signal type.",
                "enum": ["moratorium", "rescue", "rezoning", "site_plan"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8247ef89aa9d332611ea5fcaa054e60947a8fb69ec80dd717d6eae061b14ff34"
        }
      ],
      "digest": "sha256:845f8bd1843b4e642a587a338137687d99e27c7d74e1cf51d73c8a65046c60cd"
    }
  }
}
