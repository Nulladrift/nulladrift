      "serverInfo": {
        "name": "Call Desk by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call Desk answers the questions to settle before a business places or records a phone call in the US or Canada. check_phone_number validates a number, locates it, gives its time zones and grades its toll-fraud risk. can_i_call_now applies federal, state and Canadian calling-hours law to a number or state at a given time. recording_consent_rules gives one-party or all-party consent by state. ai_voice_disclosure_rules lists AI and automated voice disclosure laws. list_state_calling_rules shows everything for one jurisdiction. Every legal rule carries its citation, source and as-of date. All tools are read-only and make no network calls. Informational, not legal advice.",
      "tools": [
        {
          "name": "ai_voice_disclosure_rules",
          "title": "AI voice disclosure rules",
          "description": "List the laws that require a caller or conversational agent to disclose that it is AI, a bot, or an artificial or prerecorded voice, for a US state, Canadian province or phone number, or for every jurisdiction. Covers the FCC ruling that AI-generated voices are artificial voices under the TCPA (so AI voice calls need prior express consent), the federal rule that prerecorded messages identify the caller at the start, state AI and chatbot disclosure laws, and state rules on identifying automated messages. Each rule gives what must be disclosed, when, who it applies to, effective and sunset dates, whether it is in force today, the citation, a verbatim quote, the source URL and as-of date. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phone_number": {
                "description": "Instead of a state: a phone number; its area code gives the state.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "A US state, DC, territory or Canadian province, as a code or name.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI voice disclosure rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c11e16175a947f275b8190c0994a2b120001a05ffe2707effae5fad423f607a"
        },
        {
          "name": "can_i_call_now",
          "title": "Can I call now",
          "description": "Decide whether a call to a phone number, or to someone in a given state or province, is allowed right now or at a given time under calling-hours law: the FCC TCPA rule and FTC Telemarketing Sales Rule (8 a.m. to 9 p.m. called party's local time), every stricter state rule we verified (for example Florida, Oklahoma, Maryland, Washington and Wyoming stop at 8 p.m.; Texas Sundays start at noon; Pennsylvania bans Sundays from 2026-10-18; Kentucky starts at 10 a.m.; Maine allows automated solicitation weekdays 9 to 5 only), and in Canada the CRTC rules and British Columbia's holiday ban. Checks every time zone the number could be in, state holiday bans and future effective dates. Returns allowed or not, the reason, the window today, the next allowed time, and every rule applied with its citation, verbatim quote, source URL and as-of date. Choose call_type: sales_automated covers AI voice agents, prerecorded and autodialed sales calls. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "at": {
                "description": "Check a time other than now: ISO 8601 with an offset, for example 2026-10-19T09:30:00-05:00.",
                "maxLength": 40,
                "type": "string"
              },
              "call_type": {
                "default": "sales_automated",
                "description": "sales_automated (default): a sales call by AI voice, prerecorded message or autodialer. sales_live: a sales call by a person. automated_non_sales: an automated or AI-voice call that sells nothing (reminders, surveys). live_non_sales: a person calling about anything but a sale.",
                "enum": ["sales_live", "sales_automated", "automated_non_sales", "live_non_sales"],
                "type": "string"
              },
              "phone_number": {
                "description": "The number to be called. Its area code and exchange give the state and time zones.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "Instead of a number: the called person's US state, DC, US territory or Canadian province, as a code (TX) or name (Texas). States with several time zones are checked in all of them.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Can I call now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:578c94c22da678ef78154d821fb5d0da95914419074ef5c04f346a2172992e34"
        },
        {
          "name": "check_phone_number",
          "title": "Check a phone number",
          "description": "Check a US, Canadian or other North American (+1) phone number before calling or texting it. Returns whether it can be a working number (N11 codes and unassigned area codes fail; 555-0100 to 0199, reserved for fiction, is flagged as fictional_range and still resolves), the E.164 form, where the area code rings (US state or territory, Canadian province, or another country on the +1 plan), whether the area code is in service, its overlays, every time zone the exchange covers with the current local time there, and a toll-fraud risk grade (block, high, medium, low) with reasons: Caribbean and Bermuda +1 codes that bill as international calls, 900 premium numbers, Pacific territory codes, non-geographic codes and the 976 exchange. Area code data from NANPA, time zones from libphonenumber; no network access. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phone_number": {
                "description": "The number in any common format: (406) 555-0123, +1 406 555 0123, 1-800-FLOWERS, or with an extension.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["phone_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a phone number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8cc43bc6a19ca14551ad59ec5a662a2e120a30d5a0902684b8fe3abafae61f7"
        },
        {
          "name": "list_state_calling_rules",
          "title": "List state calling rules",
          "description": "Show every calling rule Call Desk holds for one US state, DC, territory or Canadian province: its time zones and area codes, federal and state calling-hours rules with windows, holidays and per-day call caps, recording consent, AI disclosure and automated message rules, each with citation, quote, source URL and as-of date, plus any rule we looked for and could not verify. With no state, returns a table of every jurisdiction with hours stricter than federal, the states with no stricter rule, and the all-party recording states. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "A US state, DC, territory or Canadian province, as a code (OK) or name (Oklahoma). Leave out for the overview.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List state calling rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab1bd104484093de435f8ac4b45e7cd1ec91f15eca9e2c50be4eca8617bb5a36"
        },
        {
          "name": "recording_consent_rules",
          "title": "Recording consent rules",
          "description": "Look up whether a phone call may be recorded with one party's consent or needs every party's consent, for one or more US states, DC or Canadian provinces, by state or by the phone numbers on the call. Returns each jurisdiction's rule (one-party, all-party or mixed, such as Oregon, Connecticut, Nevada or Michigan, with the case law that decides it), the statute, a verbatim quote, the source URL and as-of date, the federal rule (18 U.S.C. 2511(2)(d)), and a bottom line for calls that cross state lines. With no input, returns the lists of all-party, mixed and one-party states. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phone_numbers": {
                "description": "Phone numbers of the people on the call; each maps to its area code's state.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "states": {
                "description": "States or provinces of the people on the call, as codes or names.",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recording consent rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baeef9681d59ebb579d275456d699caa8af7bc63b049d1eab375ddc5caa65b19"
        }
      ],
      "digest": "sha256:3745d6c6542bb858887ba288ec7aeb6fb8a16a4ccd931d2747492f0b34f90f1d"
    }
  }
}
