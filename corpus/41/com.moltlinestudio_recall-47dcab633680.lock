        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moltline-recall",
        "version": "1.1.0"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "A portable knowledge-graph memory over MCP. Free: graph_upsert, graph_search, graph_diff, graph_lint. Premium (license): graph_at_time, graph_compact. The graph is passed in and returned - no database, no embedding key, no account, and nothing of yours is stored on this server.",
      "tools": [
        {
          "name": "graph_at_time",
          "title": "Graph At Time",
          "description": "See the memory as it stood on a given day, optionally faded by age. PREMIUM (license).\n\nRelations carrying since and until are filtered to those in force on the\ndate; with a half-life, confidence decays exponentially with age so a\ntwo-year-old belief does not weigh the same as last week's. Typical input\n{\"graph\": {...}, \"as_of\": \"2026-06-01\", \"half_life_days\": 180} returns\n{\"as_of\": \"2026-06-01\", \"graph\": {...}, \"dropped\": {\"not_yet\": 1,\n\"expired\": 2}, \"decayed\": 4}.\n\nUse when the answer depends on when you ask. Not for what changed between\ntwo points - that is graph_diff, which does not need dates at all. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"as_of must be a date like 2026-06-01\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "The date to view the memory as of, ISO 8601, e.g. \"2026-06-01\".",
                "type": "string"
              },
              "graph": {
                "additionalProperties": true,
                "description": "The graph document.",
                "type": "object"
              },
              "half_life_days": {
                "default": 0,
                "description": "Days over which a relation's confidence halves. 0, the\ndefault, disables decay and leaves confidence untouched.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["as_of", "graph"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph At Time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:2db9d8aa92112f4d7b9d8fd57a1b1c5bf423b3074d2397188d01894e0d44acc3"
        },
        {
          "name": "graph_compact",
          "title": "Graph Compact",
          "description": "Shrink a memory to the part that still earns its place. PREMIUM (license).\n\nRanks entities by how connected they are and how much is recorded about\nthem, keeps anything you name outright, and drops the rest along with the\nrelations that pointed at them. Typical input {\"graph\": {...},\n\"max_entities\": 50, \"keep\": [\"Acme Corp\"]} returns {\"graph\": {...},\n\"kept\": 50, \"dropped_entities\": [\"Old Note\", ...], \"dropped_relations\": 12,\n\"ranking\": \"degree, then observation count, then name\"}.\n\nUse when a graph has outgrown the context you can spend on it. Not for\nremoving wrong facts - graph_lint finds those, and deleting them is a\ndecision you should make deliberately rather than by ranking. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "graph": {
                "additionalProperties": true,
                "description": "The graph document to compact.",
                "type": "object"
              },
              "keep": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Entity names to keep regardless of rank, e.g. [\"Acme Corp\"].\nMatched case-insensitively."
              },
              "max_entities": {
                "default": 50,
                "description": "How many entities to keep. Default 50.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["graph"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph Compact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c0b731ad9c27c2e1ec42df9143fa9793e8b958c9598c2b2e38a72025cd58f12a"
        },
        {
          "name": "graph_diff",
          "title": "Graph Diff",
          "description": "Say exactly what changed between two versions of a memory. FREE.\n\nThe audit trail a database gives you for free, without the database.\nTypical input {\"before\": {...}, \"after\": {...}} returns\n{\"entities_added\": [\"Beta Ltd\"], \"entities_removed\": [],\n\"observations_added\": {\"Acme Corp\": [\"renewed in March\"]},\n\"relations_added\": [...], \"changed\": true}.\n\nUse after an upsert to record what a session learned, or between two\nagents to see what one knows that the other does not. Not for merging the\ntwo - feed the differences back through graph_upsert for that. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "additionalProperties": true,
                "description": "The later graph document.",
                "type": "object"
              },
              "before": {
                "additionalProperties": true,
                "description": "The earlier graph document.",
                "type": "object"
              }
            },
            "required": ["after", "before"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph Diff"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:75ed3301dc2e62c86e017dc96f09371bbbc95eae7388f62dfc1ddf7a2dbaf5d9"
        },
        {
          "name": "graph_lint",
          "title": "Graph Lint",
          "description": "Find the breaks a memory graph accumulates as it grows. FREE.\n\nRelations pointing at entities that do not exist, entities nothing points\nat, near-duplicate names, and observations that contradict each other on\nthe same entity. Typical input {\"graph\": {...}} returns {\"ok\": false,\n\"dangling_relations\": [{\"from\": \"Acme Corp\", \"to\": \"Beta Ltd\", \"missing\":\n[\"Beta Ltd\"]}], \"orphan_entities\": [\"Old Note\"], \"near_duplicates\":\n[[\"Acme Corp\", \"Acme  Corp.\"]], \"contradictions\": []}.\n\nUse before trusting a graph you did not build, or on a schedule as memory\ngrows. Not for comparing two graphs (graph_diff) and not for shrinking one\n(graph_compact). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "graph": {
                "additionalProperties": true,
                "description": "The graph document to check.",
                "type": "object"
              }
            },
            "required": ["graph"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph Lint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:fa5058be9d0047b92685b31a09468a424296137bdcf408550dbb87e1e63b9094"
        },
        {
          "name": "graph_search",
          "title": "Graph Search",
          "description": "Find what the graph knows about something, plus its neighbourhood. FREE.\n\nScores entities by how many query words appear in the name, type and\nobservations, then pulls in whatever is within the requested number of\nhops - because the useful answer to \"what do we know about Acme\" is\nusually Acme plus who it is connected to. Typical input {\"graph\": {...},\n\"query\": \"acme renewal\", \"hops\": 1} returns {\"matches\": [{\"name\": \"Acme\nCorp\", \"score\": 3, \"why\": [\"name\", \"observation\"]}], \"neighbourhood\":\n{\"entities\": [...], \"relations\": [...]}, \"hops\": 1}.\n\nUse to read memory back before answering. Not for writing (graph_upsert)\nand not for narrowing by date, which graph_at_time does. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"query must contain at least one word or number\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "graph": {
                "additionalProperties": true,
                "description": "The graph document to search.",
                "type": "object"
              },
              "hops": {
                "default": 1,
                "description": "How far to expand from each match along relations. 0 returns\nmatches only; 3 is the maximum. Default 1.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Maximum entities to return. Default 20, maximum 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. \"acme renewal\". Matching is on whole\nlowercase words, so it is exact and repeatable rather than fuzzy.",
                "type": "string"
              }
            },
            "required": ["graph", "query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:231d43d4bf58f1b2080c5c517fd277a04d23f7417f60a70c2aee8acca0f7c51b"
        },
        {
          "name": "graph_upsert",
          "title": "Graph Upsert",
          "description": "Fold new facts into a memory graph and get the whole graph back. FREE.\n\nIdempotent by construction: re-adding the same entity, observation or\nrelation changes nothing, so an agent that replays its own history does not\nend up with a graph full of duplicates. Typical input {\"graph\": {\"entities\":\n[], \"relations\": []}, \"entities\": [{\"name\": \"Acme Corp\", \"type\":\n\"company\", \"observations\": [\"renewed in March\"]}]} returns {\"graph\": {...},\n\"added\": {\"entities\": 1, \"observations\": 1, \"relations\": 0}, \"merged\": 0}.\n\nUse as the single write path for memory. Not for reading it back\nselectively - that is graph_search - and not for finding out what a write\nchanged, which graph_diff answers precisely. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"graph exceeds <value> entities; split it\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entities": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Entities to add or extend, each {\"name\": ..., \"type\": ...,\n\"observations\": [...]}. Observations are appended and deduplicated;\nan existing entity keeps its type unless a new one is supplied."
              },
              "graph": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The existing graph document, or omitted to start a new one.\nShape: {\"entities\": [...], \"relations\": [...]}."
              },
              "relations": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Relations to add, each {\"from\": ..., \"to\": ..., \"type\":\n..., and optionally \"since\", \"until\", \"confidence\"}. Dates are\nISO 8601 (YYYY-MM-DD); confidence is 0 to 1."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graph Upsert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:4d96e2e1a8b5466d6bd004294140cdcc56b29627c365eaa30d452c761ed7a5b7"
        }
      ],
      "digest": "sha256:f2e7f9906e143c6c903c84853b9019d41da04921dfadef1df5e48ada43234cd9"
    }
  }
