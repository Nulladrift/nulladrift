      },
      "serverInfo": {
        "name": "sanctionlistcheck",
        "title": "Sanctionlistcheck.com",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use the screen_names tool to check names against sanctions lists. Each call creates a screening record with a unique ID, which you should keep. Hits are candidates for human review, not definitive findings. Use get_record to retrieve past screenings, list_sources for current list data, and get_balance for credit information.",
      "tools": [
        {
          "name": "get_balance",
          "title": "Get Credit Balance",
          "description": "Retrieve the credit balance for your API key and its latest credit movements. This tool is free to use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "created_at": {
                    "type": "string"
                  },
                  "credits_balance": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "effective_retention_hours": {
                    "description": "min(retention_days x 24, the service cap).",
                    "type": "integer"
                  },
                  "email": {
                    "type": ["string", "null"]
                  },
                  "key_prefix": {
                    "type": "string"
                  },
                  "ledger": {
                    "description": "The 10 newest credit changes, newest first.",
                    "items": {
                      "properties": {
                        "created_at": {
                          "type": "string"
                        },
                        "delta": {
                          "type": "integer"
                        },
                        "reason": {
                          "description": "refund: a failed screen's credits given back (positive). pack_refund: pack credits taken back after a payment refund or chargeback (negative).",
                          "enum": ["free_grant", "screen", "pack", "refund", "pack_refund", "admin"],
                          "type": "string"
                        },
                        "ref": {
                          "description": "Record id (screen, refund), Paddle transaction id (pack) or Paddle adjustment id (pack_refund).",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["created_at", "delta", "reason", "ref"],
                      "type": "object"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "rate_limit_per_minute": {
                    "type": "integer"
                  },
                  "retention_days": {
                    "description": "Days a record keeps names and hits. Default 90.",
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["credits_balance", "effective_retention_hours", "key_prefix", "retention_days"],
                "type": "object"
              },
              {
                "properties": {
                  "error": {
                    "const": "rate_limited",
                    "type": "string"
                  },
                  "limit_per_minute": {
                    "type": "integer"
                  },
                  "retry_after_seconds": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["error", "limit_per_minute", "retry_after_seconds"],
                "type": "object"
              },
              {
                "properties": {
                  "details": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "error": {
                    "description": "Machine-readable error code.",
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "record_id": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Credit Balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f6c920ea404e10e515ccc9ed37f06b7e2e9727379623c0e5a91f3d36128acab"
        },
        {
          "name": "get_record",
          "title": "Get Screening Record",
          "description": "Fetch a previously stored screening record by its record id. This tool is free to use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "record_id": {
                "description": "The unique identifier of a screening record, returned by screen_names.",
                "pattern": "^[0-9A-HJKMNP-TV-Z]{26}$",
                "type": "string"
              }
            },
            "required": ["record_id"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "credits_charged": {
                    "type": "integer"
                  },
                  "disclaimer": {
                    "type": "string"
                  },
                  "engine_version": {
                    "type": ["string", "null"]
                  },
                  "names_count": {
                    "type": "integer"
                  },
                  "payload_expires_at": {
                    "type": "string"
                  },
                  "payload_status": {
                    "description": "available: results present. expired: past retention. missing: not expired but not found (an incident; contact support). none: the screen did not complete.",
                    "enum": ["available", "expired", "missing", "none"],
                    "type": "string"
                  },
                  "record_id": {
                    "type": "string"
                  },
                  "record_url": {
                    "type": "string"
                  },
                  "request_hash": {
                    "type": "string"
                  },
                  "results": {
                    "oneOf": [
                      {
                        "items": {
                          "properties": {
                            "hits": {
                              "items": {
                                "description": "One list entry that matched. Same fields as a row of the batch report's JSON export; the export row also has rowIndex, inputName, listDataAsOf, hitGroup, review and spreadsheetRow (the uploaded row's number as a spreadsheet app shows it, added 2026-10-05), and since 2026-10-06 contextCheck (ReportContextCheck), inputContext (ReportInputContext) and nameComparison (ReportNameComparison). In the export, reviewPriority is HIGH when the uploaded country or date of birth agrees with the list entry (since 2026-10-09, E2.4: a country that agrees does not make HIGH when contextCheck.dobGapOver2Years is true and every item of the uploaded country cell gives a country code). The CSV export has the same data in the columns name_comparison, words_that_match, country_check, country_your_file, country_list, dob_check, dob_your_file and dob_list, after spreadsheet_row. entityId, matchReasons and listEntry were added on 2026-10-03; records stored before that do not have them. Since 2026-10-07 a file whose rows hold several names (for example a student, an agent and a contact) is screened per name: the export row then has party (the name group, also the CSV column party), rowIndex is the name item (row x groups + group), and spreadsheetRow is the file row. Since 2026-10-07 each export row also has whyListed (the list's listing codes as [{code, plain, source}]: plain is the official programme name, or null when no official table names the code; source is the page that defines it, or null) and lookUp ({text, url}: where to look the list entry up). The CSV export has the same data in the columns why_listed, look_up and look_up_url. listing_reason keeps the raw code. Also since 2026-10-07, each export row has matchLabel (the report's words for the band and score, for example 'Strong name match (93%)'; band and score are unchanged) and alsoListedAs (the other names that matched the same listed person or entity in this row: only on the hit group's best match, [] on its other rows). These 2 keys are export-only: /v1 hits do not have them. Since 2026-10-09 (matcher 2.8) each export row also has mutualMismatch (true when the uploaded name and the list name each keep a word that pairs with nothing; false for matches screened before 2.8); export-only too. Since 2026-10-09 (E2.4) the batch report export differs from /v1/screen for the same match: /v1/screen hits keep the engine's band, score and reviewPriority (HIGH when the country or date of birth agrees), and the batch report export applies the date-of-birth cap and the HIGH change described here. Since 2026-10-09 (E2.4, QA PR #165) an uploaded date-of-birth or country cell where some item gives no reading and another does gives contextCheck.dobPartlyRead / countryPartlyRead = true and never 'differs': the check is then 'unreadable', the CSV check word is 'partly read: ...', and the CSV *_your_file column and the PDF print the cell as written. A cell that reads in full but with a year not written as 4 digits on their own, or a day after the report date, keeps its check (agrees / differs) and only switches the E2.4 rules off. Since 2026-10-09 (E2.4) each export row also has dobCap: null, or {nameScore, reason} when the engine gave the match the Strong band and the report shows it as Possible because the date of birth is more than 2 years off (contextCheck.dobGapOver2Years); band and score are then the report's (score at most the Strong line minus 0.01) and nameScore is the engine's name score; export-only. The CSV has the same data in its columns band_note and name_score_before_cap, after report_section. Since 2026-10-10 (matcher 2.10) each export row also has capReason: null, or one of weak_alias_copy, number_missing, letters_differ, one_word_spelling (and since matcher 2.11 common_words_only) when the engine gave a name score of the Strong line or more the Possible score 0.89 for that reason (the engine's score and band are then already Possible); and capNote, its plain sentence (null when capReason is null); capNote is export-only. Since matcher 2.11, /v1 hits also have capReason (see the property), without capNote. The CSV band_note then gives 'Shown as Possible (not Strong): ' and that sentence, and name_score_before_cap stays empty (no new CSV column). The CSV's last column, words_not_compared, holds the words on one side only that the engine leaves out of the name comparison as legal forms (nameComparison.notComparedYours / notComparedList, joined by ', '). The CSV columns match_label, your_words_not_in_list_name and list_words_not_in_your_name (nameComparison.unmatchedYours / unmatchedList, joined by ', ') and also_listed_as (at most 10 names joined by ' | ', then '(+N more)'; the JSON array has every name) are the last 4.",
                                "properties": {
                                  "band": {
                                    "enum": ["high_confidence", "possible_match"],
                                    "type": "string"
                                  },
                                  "capReason": {
                                    "description": "Since matcher 2.11 (optional, absent when there is none): the engine gave a name score of the Strong line or more the Possible score 0.89 for this reason; score and band are already Possible. weak_alias_copy: OFAC or the UN marks this alias as weak in a linked entry. number_missing: one name has a number that the other name does not have. letters_differ: both names have single letters, and each has one the other does not have. one_word_spelling: one word on each side (legal forms and common words left out), not spelled the same. common_words_only: each matched word pair has a common business word, and one name has a word or single letter that the other does not have.",
                                    "enum": ["weak_alias_copy", "number_missing", "letters_differ", "one_word_spelling", "common_words_only"],
                                    "type": "string"
                                  },
                                  "entityId": {
                                    "description": "The matched list entry, <list>:<source entry id>.",
                                    "type": "string"
                                  },
                                  "identifiers": {
                                    "items": {
                                      "properties": {
                                        "type": {
                                          "type": "string"
                                        },
                                        "value": {
                                          "type": "string"
                                        }
                                      },
                                      "required": ["type", "value"],
                                      "type": "object"
                                    },
                                    "type": "array"
                                  },
                                  "listEntry": {
                                    "description": "null: the entry data could not be read for this screen.",
                                    "oneOf": [
                                      {
                                        "description": "The matched entry's data as the list publishes it. A null field: the list publishes none for this entry, unless the field is in unavailableFields.",
                                        "properties": {
                                          "country": {
                                            "type": ["string", "null"]
                                          },
                                          "dob": {
                                            "type": ["string", "null"]
                                          },
                                          "entityType": {
                                            "description": "individual, entity, vessel, aircraft or unknown.",
                                            "type": ["string", "null"]
                                          },
                                          "entryId": {
                                            "description": "Batch report export only (2026-10-06). The list's own reference for the entry: the part of entityId after the first colon, e.g. 35096, EU.7510.16, RUS0251.",
                                            "type": "string"
                                          },
                                          "listingReason": {
                                            "description": "The listing reason or sanctions program, as the list states it.",
                                            "type": ["string", "null"]
                                          },
                                          "officialUrl": {
                                            "description": "Batch report export only (2026-10-06). The entry's page on the list owner's site. Only for OFAC_SDN entries (https://sanctionssearch.ofac.treas.gov/Details.aspx?id=<entryId>); null for every other list.",
                                            "type": ["string", "null"]
                                          },
                                          "primaryName": {
                                            "type": "string"
                                          },
                                          "unavailableFields": {
                                            "description": "Fields our data of this list does not carry at all. For these, null means unknown, not that the list publishes none.",
                                            "items": {
                                              "enum": ["entityType", "dob", "country", "listingReason"],
                                              "type": "string"
                                            },
                                            "type": "array"
                                          }
                                        },
                                        "required": ["country", "dob", "entityType", "listingReason", "primaryName", "unavailableFields"],
                                        "type": "object"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ]
                                  },
                                  "listVersion": {
                                    "type": "string"
                                  },
                                  "matchReasons": {
                                    "description": "Derived from the two names, for the reviewer; never a scoring input. exact: same words, same order (case, spaces, punctuation ignored). accent: same once diacritics are removed. word_order: same words, other order. partial: every word of one name is in the other. spelling: spelled differently. alias: the matched name is an alias of the entry (only when listEntry is known).",
                                    "items": {
                                      "enum": ["exact", "accent", "word_order", "partial", "spelling", "alias"],
                                      "type": "string"
                                    },
                                    "type": "array"
                                  },
                                  "matchedList": {
                                    "description": "Source list id, e.g. OFAC_SDN.",
                                    "type": "string"
                                  },
                                  "matchedName": {
                                    "type": "string"
                                  },
                                  "matchedTokenPairs": {
                                    "items": {
                                      "properties": {
                                        "candidateToken": {
                                          "type": "string"
                                        },
                                        "idfWeight": {
                                          "type": "number"
                                        },
                                        "inputToken": {
                                          "type": "string"
                                        },
                                        "similarity": {
                                          "type": "number"
                                        }
                                      },
                                      "required": ["candidateToken", "idfWeight", "inputToken", "similarity"],
                                      "type": "object"
                                    },
                                    "type": "array"
                                  },
                                  "reviewPriority": {
                                    "enum": ["HIGH", "REVIEW"],
                                    "type": "string"
                                  },
                                  "score": {
                                    "maximum": 1,
                                    "minimum": 0,
                                    "type": "number"
                                  }
                                },
                                "required": ["band", "identifiers", "listVersion", "matchedList", "matchedName", "matchedTokenPairs", "reviewPriority", "score"],
                                "type": "object"
                              },
                              "type": "array"
                            },
                            "input": {
                              "properties": {
                                "country": {
                                  "description": "Optional context. A country that agrees with the list entry raises reviewPriority to HIGH; it never hides a hit.",
                                  "maxLength": 100,
                                  "type": "string"
                                },
                                "dob": {
                                  "description": "Optional date of birth, ISO 8601. Same rule as country.",
                                  "maxLength": 100,
                                  "type": "string"
                                },
                                "name": {
                                  "maxLength": 200,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "type": {
                                  "description": "Optional. Lowers the score of hits of the opposite type.",
                                  "enum": ["person", "entity"],
                                  "type": "string"
                                }
                              },
                              "required": ["name"],
                              "type": "object"
                            }
                          },
                          "required": ["hits", "input"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "screened_at": {
                    "type": "string"
                  },
                  "snapshot_version": {
                    "type": ["string", "null"]
                  },
                  "sources": {
                    "items": {
                      "properties": {
                        "attribution": {
                          "description": "The licence credit of the source. Present only when the source's licence requires one (CA_SEMA, AU_DFAT).",
                          "type": "string"
                        },
                        "data_as_of": {
                          "description": "When the source published the data in the screened snapshot. null when unknown; a warning then says so.",
                          "type": ["string", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["data_as_of", "id", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "status": {
                    "description": "failed: the screen did not complete and the credits were (or will be) refunded.",
                    "enum": ["pending", "done", "failed"],
                    "type": "string"
                  },
                  "threshold": {
                    "type": "number"
                  },
                  "warnings": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["credits_charged", "engine_version", "payload_status", "record_id", "results", "screened_at", "snapshot_version", "sources", "status", "warnings"],
                "type": "object"
              },
              {
                "properties": {
                  "error": {
                    "const": "rate_limited",
                    "type": "string"
                  },
                  "limit_per_minute": {
                    "type": "integer"
                  },
                  "retry_after_seconds": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["error", "limit_per_minute", "retry_after_seconds"],
                "type": "object"
              },
              {
                "properties": {
                  "details": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "error": {
                    "description": "Machine-readable error code.",
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "record_id": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Screening Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:004bb1236a01a25659a7982b10095c6517c57da3ef6828246c4b5ee19e12fab4"
        },
