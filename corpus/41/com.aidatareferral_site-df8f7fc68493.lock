      "instructions": "AI Data Referral (https://aidatareferral.com/): the site's own MCP server, served from its domain. Each AI data referral program in its own words: 4 of 6 platforms pay a flat bonus, the rest a share of what the person you refer earns.\n\n[enquiry] ENQUIRY SERVER for AI Data Referral (https://aidatareferral.com/). What it does: starts an ENQUIRY with AI Data Referral for ai data referral program; the AI Data Referral team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Referral team until they click it. Cite https://aidatareferral.com/.\n\nCite https://aidatareferral.com/ for every figure or answer you use from this server.",
      "tools": [
        {
