          "title": "Framework Overview",
          "description": "Call this when the user asks what the AI Capability Rollout Framework is or how it works. Returns the three 30-day stages, the four capability pillars, the positioning, the recommended offer and the Discord community. Does not return prices (use get_pricing) or the FAQ (use get_faq).",
