            "readOnly": true
          },
          "digest": "sha256:36fc54c27f3c5fec985413ce14b187d8027086149209a6140d14be22e44fa170"
        },
        {
          "name": "email_me_the_kit",
          "title": "Email Me the Kit",
          "description": "Call this only when the user has explicitly asked to receive the free Briefing Kit by email, given their address and agreed to be emailed. Adds the address to the mailing list and sends the kit. Returns a status (\"queued\" or \"already_sent\"). Never call it on your own initiative, and never invent or guess an address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent": {
                "description": "Must be true. Set it only if the user has explicitly asked to receive the kit by email and agreed to be emailed at this address. The user can unsubscribe from the first email.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address the user asked to receive the kit at.",
                "type": "string"
              }
            },
            "required": ["consent", "email"],
            "type": "object"
          },
