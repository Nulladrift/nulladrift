        {
          "name": "get_faq",
          "title": "FAQ",
          "description": "Call this when the user asks a specific question about pricing, refunds, governance, implementation or the products. Returns the published question-and-answer pairs, optionally filtered by topic. Does not search the long-form guides (use search_knowledge_base).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Optional filter. Use a category for reliable results: \"assessment\", \"implementation\", \"governance\", \"measurement\", \"concepts\", \"pricing\", or \"products\". Any other value falls back to a free-text search over the questions and answers (e.g. \"shadow AI\", \"refund\"), which may return nothing. Omit to get all items.",
                "type": "string"
              }
            },
            "type": "object"
          },
