        {
          "name": "get_faq",
          "title": "FAQ",
          "description": "Returns published questions and answers, optionally filtered by topic. Use it for specific questions about pricing, governance, implementation or the products. It does not search the long-form guides; use search_knowledge_base for that. To check readiness, use assess_ai_readiness.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Optional filter. Use a category for reliable results: \"assessment\", \"implementation\", \"governance\", \"measurement\", \"concepts\", \"pricing\", or \"products\". Any other value falls back to a free-text search over the questions and answers (e.g. \"shadow AI\", \"refund\"), which may return nothing. Omit to get all items.",
                "type": "string"
              }
            },
            "type": "object"
