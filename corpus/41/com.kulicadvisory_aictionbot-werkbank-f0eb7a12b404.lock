        {
          "name": "analyse_issues",
          "title": "Issue radar: recurring causes in a list of procurement or invoice problems, age, open cases per owner and the fix for each cause",
          "description": "AICTIONBOT™ issue radar by KULIC Advisory (tool 43), built on the Execution Toolkit templates T05 (process improvement) and T07 (action log). Takes a list of cases or tickets (case, date, description, optional cause, owner, status, supplier) and groups them into ten recurring causes by keywords (invoice without purchase order, price difference, quantity or goods receipt, master data, approval stuck, payment or reminder, late delivery, quality or complaint, duplicate invoice, invoice details or tax). A cause column takes priority. Returns the five most frequent causes with share, open cases and the fix with the matching Workbench tool, typical age, cases older than 30 days, open cases per owner and suppliers with three or more cases. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
          "inputSchema": {
            "additionalProperties": false,
