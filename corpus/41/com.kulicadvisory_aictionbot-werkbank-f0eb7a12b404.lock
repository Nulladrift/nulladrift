        {
          "name": "build_category_profile",
          "title": "Build a category profile from a spend list and contracts: volume, suppliers, concentration, next notice date, levers",
          "description": "AICTIONBOT™ Category Profile by KULIC Advisory. From your own spend rows and, if present, your contract list it builds one file for a category: total and share of spend, suppliers with their share, concentration, small orders, monthly course, contracts with the last day to give notice, and the levers that follow. Rows without a category get a suggested one from supplier name and text. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
