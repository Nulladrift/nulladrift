                "description": "Excel templates: number or title of the table section as shown by get_template, for example '2' or 'COMMERCIAL RESPONSE TABLE'.",
                "maxLength": 80,
                "type": "string"
              },
              "sheet": {
                "description": "Excel templates with several sheets: name of the sheet, if the section number exists on more than one.",
                "maxLength": 40,
                "type": "string"
              },
              "values": {
                "additionalProperties": {
                  "type": ["string", "number"]
                },
                "description": "Word templates: placeholder text without brackets as key, replacement as value. A key may end with #2, #3 to address the second, third occurrence of a placeholder that appears several times.",
                "type": "object"
              }
            },
            "required": ["id"],
            "type": "object"
