          "description": "AICTIONBOT™ expense checker by KULIC Advisory (tool 51). Takes a travel expense list (employee, start and end date, hours away for one-day trips, destination as country or city, km, vehicle, claimed meals, travel and hotel, receipt yes or no, meals provided such as \"2 breakfasts\") and checks every trip against the official rates as of 1 January 2026: meals in Germany 14 euros (more than 8 hours, arrival and departure day) and 28 euros (24 hours) under section 9 (4a) EStG, cut by 20 % per breakfast and 40 % per lunch or dinner provided; mileage 0.30 euros per km by car and 0.20 euros by other motor vehicles; overnight without receipt 20 euros in Germany; abroad the country and city rates of the German Federal Ministry of Finance letter of 5 December 2025 (all 214 entries built in, countries not listed use the Luxembourg rate). Also flags trips submitted twice, overlapping trips of the same person, missing receipts and weekend trips. Returns red and yellow findings per trip, claimed versus allowed per person and in total. Without a list, a destination returns its rates. Rates are fixed in the tool with source and date, nothing is fetched. Not tax advice. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
