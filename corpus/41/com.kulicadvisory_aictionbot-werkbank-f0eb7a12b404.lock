          },
          "digest": "sha256:5d65ab3d7e2b3f4ebf2e0b0256741ee6e3a08178445de6ec0a4d82002743fc06"
        },
        {
          "name": "check_vendor_master",
          "title": "X-ray a vendor master list: duplicates, invalid IBAN and VAT ID, gaps, dormant vendors and risk signals",
          "description": "AICTIONBOT™ Vendor Master X-ray by KULIC Advisory. Takes a vendor (creditor) master list and returns duplicate groups with the reason and a suggested leading record, risk signals (one IBAN under two names, one VAT ID or tax number under two names, bank country different from the country of residence, BIC not matching the IBAN), format errors (IBAN check digits and length, VAT ID format per country and the German check digit, postcode, e-mail, BIC, date), gaps in required fields, dormant vendors without activity and a clean-up list with a proposal per record. Column names in German or English are recognised (Kreditor, Name, Straße, PLZ, Ort, Land, USt-IdNr., Steuernummer, IBAN, BIC, E-Mail, Telefon, Letzte Bewegung, Sperre; no, name, street, zip, city, country, vat_id, tax_number, iban, bic, email, phone, last_activity, blocked). Check digits and formats do not prove that an account belongs to the supplier. Up to 1,000 vendors per call; larger lists run in the browser tool on the user's own device. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Reference date for dormant vendors, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "csv": {
                "description": "Alternative to rows: the list as CSV or tab-separated text. The first line is the header.",
                "maxLength": 400000,
                "type": "string"
              },
              "dormant_months": {
                "description": "Months without activity from which a vendor counts as dormant. Default 24.",
                "maximum": 120,
                "minimum": 6,
                "type": "integer"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Entries shown per section in the text. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "rows": {
                "description": "The vendor master as rows: one object per vendor, column name to value. The name is required. Up to 1,000 vendors per call.",
                "items": {
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "similarity_threshold": {
                "description": "Name similarity from which two records count as duplicates. Default 0.88.",
                "maximum": 0.99,
                "minimum": 0.75,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Vendor master X-ray"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81b2231807fa7cd67adda133c2d8fe74f13a3b41bc7e16dc1e50656d03202e0d"
