        {
          "name": "check_invoice_payment",
          "title": "Check an invoice against the vendor master before paying: new bank account, unknown supplier, blocked vendor",
          "description": "AICTIONBOT™ Zahlungsschutz by KULIC Advisory. Matches the supplier on an invoice to the vendor master by VAT ID, IBAN and name similarity, validates the IBAN checksum, and flags a changed or unknown bank account, a blocked vendor, a dormant vendor and a first payment. Returns a verdict (stop, check, ok) with the next step. Deterministic, no AI, nothing stored. Findings in German.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "invoice": {
                "description": "supplier (name), vat_id, iban, amount, currency, date (YYYY-MM-DD).",
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "iban": {
                    "type": "string"
                  },
                  "supplier": {
                    "type": "string"
                  },
                  "vat_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "vendor_master": {
                "description": "Vendor master rows: no (vendor number), name, vat_id, iban, country, last_payment (YYYY-MM-DD or null), blocked (bool).",
                "items": {
                  "type": "object"
                },
                "maxItems": 20000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["invoice", "vendor_master"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
