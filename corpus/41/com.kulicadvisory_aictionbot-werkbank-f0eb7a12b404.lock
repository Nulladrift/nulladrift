          "description": "AICTIONBOT™ NDA check by KULIC Advisory (tool 68). Takes the full text of a non-disclosure agreement you received and checks it by keywords against twelve standard points. Red when the text contains something that goes beyond a usual NDA: contractual penalty, non-solicitation, non-compete or exclusivity, transfer of rights to results, unlimited liability or indemnity, a duty without an end. Yellow when a usual point is missing or unclear: applies to both sides, the usual exceptions, duration (more than five years or none stated), return or deletion, disclosure to staff and advisers, exception for court and authority, law and jurisdiction. Returns each point with the sentence found in the text, the requests to make to the other side and the next step. Recognises German and English texts. Deterministic, no AI, nothing stored. Keyword based: it does not replace reading. Not legal advice. To write your own NDA use create_nda, for an AI review of a contract use review_contract. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
