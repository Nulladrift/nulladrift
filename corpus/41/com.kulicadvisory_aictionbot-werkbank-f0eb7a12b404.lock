          "title": "Sourcing plan old against new: dropped categories, lowered or removed targets, postponed dates, changed approach, planned effect before and after",
          "description": "Takes the old and the new version of a sourcing plan with one row per category (category, annual volume, approach, savings target in percent, due date, owner) and matches the rows by category. Returns the critical changes (red: a category dropped from the plan, a target removed or cut by a third or more, a due date moved by more than 90 days), the other changes (yellow: moderately lowered target, moved date, changed approach, no owner), raised targets, new categories and changed volumes for information, the planned effect per year before and after (volume times target), the questions to answer before approval and the next step. Pass two arrays (old_rows and new_rows) or one array rows with a version column (Old or New; German: Alt or Neu). The effect is the plan's own target, not a promise. To work out the route for one category use plan_sourcing. Licence, or one free check every 30 days.",
