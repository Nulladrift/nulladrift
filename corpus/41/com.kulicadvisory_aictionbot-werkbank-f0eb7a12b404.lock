        {
          "name": "build_acceptance_tests",
          "title": "Acceptance test builder: process steps become positive, negative, authorisation and interface test cases plus an acceptance record",
          "description": "Takes the steps of a process or system change (step, role, system, expected result; or plain text with one step per line) and writes the test cases: one positive case per step, negative cases by fixed rules (approval above the limit and absent approver for approval steps, empty mandatory field and duplicate entry for create steps, invoice differing from the order for invoice steps, change after approval for change steps), an authorisation case per role and an interface case where the system changes between steps. Each case has an ID, expected result and fields for result, tester and date, followed by an acceptance record to sign. To check a system cutover use check_switchover. Licence, or one free check every 30 days.",
