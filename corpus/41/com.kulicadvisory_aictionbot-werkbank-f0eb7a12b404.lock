        {
          "name": "automation_portfolio",
          "title": "Automation portfolio with benefit calculation: hours and euros per year per use case, payback and a phase plan, from your own figures",
          "description": "AICTIONBOT™ automation portfolio by KULIC Advisory (tool 70). Takes a list of automation or AI use cases with cases per year, minutes per case before and after, the implementation effort in days and whether the case needs AI. Returns per use case the hours and euros saved per year, the one-off cost and the payback in months, sorted into phase 1 (pays off within 6 months), phase 2 (7 to 18 months) and phase 3 (more than 18 months, put on hold), the cases that save no time, the cases that already work without AI, the totals and the next step. Uses your hourly rate and day rate; without them it assumes 45 euros per hour and 800 euros per implementation day and says so. Deterministic, no AI, nothing stored. The result is an estimate from your figures, not a promise. For a single process step use process_lever, to rate one AI use case use check_ai_use_case. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day_rate_eur": {
                "description": "Optional: cost per implementation day in euros. Default 800.",
                "type": "number"
              },
              "hourly_rate_eur": {
                "description": "Optional: internal cost per hour in euros. Default 45.",
                "type": "number"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "rows": {
                "description": "One row per use case: use_case, volume (cases per year), minutes_before, minutes_after, effort_days, ai (yes or no). German column names work too (anwendungsfall, vorgaenge, minuten_vorher, minuten_nachher, aufwand, ki).",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
