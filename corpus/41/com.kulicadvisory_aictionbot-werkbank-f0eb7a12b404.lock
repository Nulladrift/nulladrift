          "title": "Statement reconciliation: a supplier's statement against your own open items and payments, with paid, open, blocked, unknown and duplicate documents and the reply letter",
          "description": "AICTIONBOT™ statement reconciliation by KULIC Advisory (tool 53). Takes the supplier's statement of account (documents with amount) and your own items for that supplier (document, amount, status open, paid or blocked, payment date, block reason) and matches them by document number, tolerant of prefixes, spaces and leading zeros. Returns per supplier document: paid with the payment date, open with due date and days overdue, blocked with the reason, unknown on your side, listed twice on the statement, amount differs; plus items booked on your side that the statement does not show, such as credit notes not deducted. Totals show what the supplier claims and how much of it is paid, open, blocked, unknown or duplicated. Ends with a ready reply letter to the supplier. Pass two arrays (statement, ledger) or one array rows with a side column (Supplier or We). Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
