          "description": "Takes the lines of your purchase order and of the supplier's order confirmation and matches them by item number, otherwise by description. Returns every deviation in price (with the price effect), quantity, unit, delivery date, lines not confirmed and lines confirmed but not ordered, plus differences in payment terms, Incoterms and currency, and a ready reply asking for a corrected confirmation. Red: higher price, different unit, later date by more than 7 days, line not confirmed or changed header terms. To match invoice, order and goods receipt use match_documents. Licence, or one free check every 30 days.",
