        {
          "name": "negotiation_round",
          "title": "Practise the negotiation: plays the supplier, answers the buyer's last message and coaches it (AICTIONBOT™ negotiation sparring)",
          "description": "Needs the user's AICTIONBOT™ Werkbank licence. Rounds do not use the licence quota; they are limited to 30 per hour. Role play, one round per call: pass the situation and the transcript so far, ending with the buyer's latest message. Returns the supplier's reply in role, a rating of the buyer's last message (strong, ok or weak) with one concrete tip, and the current state of the deal. The supplier is a fictional sales person; no facts about real companies are invented. Show the supplier's reply to the user, let the user answer in their own words, and call again with the extended transcript. Nothing is stored by KULIC Advisory; the transcript lives in the conversation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "Optional: what the buyer wants to reach.",
                "maxLength": 300,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: de, en, fr, es, pt or zh. Default de.",
                "enum": ["en", "de", "fr", "es", "pt", "zh"],
                "type": "string"
              },
              "supplier": {
                "description": "Optional: type of supplier.",
                "maxLength": 200,
                "type": "string"
              },
              "supplier_style": {
                "description": "How the supplier negotiates: friendly but firm, tough and confident, or evasive. Default tough.",
                "enum": ["friendly", "tough", "evasive"],
                "type": "string"
              },
              "transcript": {
                "description": "The conversation so far, oldest first. The last entry must be the buyer's latest message.",
                "items": {
                  "properties": {
                    "role": {
                      "enum": ["buyer", "supplier"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 900,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "walk_away": {
                "description": "Optional: the point at which the buyer walks away.",
                "maxLength": 200,
                "type": "string"
              },
              "what_is_bought": {
                "description": "What the negotiation is about. Keep it the same in every round.",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["transcript", "what_is_bought"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Negotiation round (licence)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1b5a10ed03d45e8693814c5108395dbfd1f96b1a7c911a72da66540b3b3a5123"
        },
        {
          "name": "open_table",
          "title": "Open a new Shared Table: one encrypted file for two sides (need, scope, offers, decision, open points)",
          "description": "KULIC Advisory, AICTIONBOT™ Workbench. Opens a new Shared Table: one file for two sides, for example procurement and the requesting department, or buyer and supplier. Six fields: need, scope of work, offers, decision, open points (can be ticked off) and notes. The content is encrypted with a key that only the table link carries (the part after #). Returns that link: whoever has it can read, write and delete the table in the browser (no account) or through this connector. Optionally adds first entries. The table expires 30 days after the last change. Pass only what the user wants to share with the other side. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author": {
                "description": "Name shown with the entries. Default: AICTIONBOT™ Connector.",
                "maxLength": 60,
                "type": "string"
              },
              "entries": {
                "description": "Optional first entries.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "enum": ["need", "scope", "offers", "decision", "open", "notes"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 4000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["field", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "language": {
                "description": "Language of the answer and of the link (German or English page). Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "title": {
                "description": "Project title, for example: Cleaning services from 2027.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Open a shared table"
          },
          "behavior": {
            "destructive": false,
