        {
          "name": "build_business_case",
          "title": "Business case for a procurement improvement: annual value band, ROI band, payback band and where the value comes from",
          "description": "From the user's own assumptions (annual addressable spend, estimated value leakage, annual transactions, minutes of manual effort per transaction, hourly cost, error or rework rate, planned investment and a scenario) it returns directional bands, never exact promises: annual value band, ROI band, payback band, economic relevance, where the value comes from (shares of manual effort, rework and value leakage) and the cost of waiting per week as a band. Same formula and bands as the ROI calculator on kulicadvisory.com. Needs the investment, a scenario and either spend with a leakage rate or transactions with minutes and hourly cost; with spend given, a missing leakage rate, investment or scenario is filled with a marked example value (1.5 %, EUR 75,000, realistic). Directional and based on user-entered assumptions only; not a guarantee of results. Licence, or one free check every 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_spend_eur": {
                "description": "Annual addressable spend in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "annual_transactions": {
