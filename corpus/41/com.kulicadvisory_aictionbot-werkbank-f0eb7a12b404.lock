                "type": "array"
              },
              "people": {
                "description": "People list. Each person: name, status (active, left, absent), left_on, absent_until, system_role (yes/no).",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["matrix", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Approval matrix check"
          },
          "behavior": {
