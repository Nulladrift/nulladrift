          "description": "AICTIONBOT™ contract register check by KULIC Advisory, built on the Execution Toolkit template T20 (contract management). Takes the user's contract list (one row per contract) and returns, sorted by urgency: notice deadlines within the window (default 90 days, under 14 days flagged as urgent), contracts whose deadline was missed and that renew silently with the next possible notice date, contracts that end by themselves, gaps in the list (no end date, no notice period, no renewal rule), contracts without an owner and the annual value at stake. Per contract: name, supplier, start or end, initial term, renewal (months or yes/no), notice period (e.g. 3 months, 6 weeks, 30 days), owner, annual value, status (cancelled). German or English column names are recognised (Vertrag, Lieferant, Beginn, Ende, Laufzeit, Verlängerung, Kündigungsfrist, Verantwortlich, Jahreswert). The deadline is the last day notice must reach the other party, calculated as in calculate_notice_deadline. Deterministic, no AI, nothing stored. Not legal advice. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
