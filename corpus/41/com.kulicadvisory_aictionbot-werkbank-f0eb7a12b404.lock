          "description": "KULIC Advisory Execution Toolkit Library. Purely mechanical, no AI and no calculation. For an Excel template: pass the id, the section (number or title from get_template) and rows as objects keyed by column name. Returns the rows in the template's column order, the exact cell for every value (for example F10) so the values can be written into the downloaded file, and notes: columns the file calculates are left out, unknown fields and values outside a dropdown are named, rows beyond the prepared rows are listed without a cell. For a Word template (master service agreement, NDA, SLA): pass the id and values keyed by placeholder text without brackets, for example { \"Party A\": \"Muster GmbH\" }; returns the text with these placeholders replaced and the list of placeholders still open. Nothing is stored. The result is a working draft, not legal advice. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
