        {
          "name": "screen_supplier_risk",
          "title": "Early warning check for a supplier list: red, yellow or green by KULIC Advisory's rules L-01 to L-10, plus sanctions screening",
          "description": "For each supplier the user passes the warning signals observed (L-01 asks for prepayment or shorter payment terms, L-02 partial deliveries and postponed dates pile up, L-03 leadership changes or contacts hard to reach, L-04 complaints rising on a proven part, L-08 high price increase shortly after an agreement, L-09 new owner, office, name or bank account, L-10 insolvency filed) and amplifiers (L-05 own tools at the supplier without a list, L-06 single source for a critical part, L-07 own volume is a large share of the supplier's revenue). Returns per supplier a light: yellow for one signal or several in the same field; red for signals from two fields, a signal with an amplifier, price jump with prepayment, L-09 with a sanctions match, or L-10; green if no signal is given (which does not mean safe). With the reasons, what to do per rule, the date to check again, and a screening of each name against the EU, UN, US and UK sanctions lists (up to 15 names per call; set screen_sanctions false for up to 25 without screening). Rules signed off by Dario Kulić. Licence, or one free check every 30 days.",
