        {
          "name": "create_einvoice",
          "title": "Write an invoice: German e-invoice as ZUGFeRD/Factur-X EN 16931 or XRechnung 3.0 (CII XML), with the mandatory details checked under section 14 UStG",
          "description": "Takes seller, buyer, invoice number and dates, payment terms and lines (description, quantity, UN/ECE unit code, net unit price, VAT rate or category) and returns a structured e-invoice as UN/CEFACT Cross Industry Invoice XML: ZUGFeRD/Factur-X profile EN 16931 or XRechnung 3.0 for German public authorities (Leitweg-ID as buyer_reference). Calculates in cents (line amounts, VAT per category and rate, totals), checks the mandatory details of section 14 (4) UStG, the EN 16931 business rules and the German XRechnung rules (BR-DE: contact, phone, e-mail, IBAN, buyer reference), validates IBAN check digits and VAT ID format, and handles small business (section 19 UStG), reverse charge (section 13b UStG), intra-community supply and export with the exemption reason. Red findings block the XML, yellow ones are notes. The Workbench page https://www.kulicadvisory.com/workbench/write-invoice/ turns the same data into a PDF/A-3 with the XML embedded. Generated invoices passed XSD, the official EN 16931 and KoSIT XRechnung schematron and veraPDF. Licence, or one free check every 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "description": "name, street, postcode, city, country, vat_id, email",
                "type": "object"
              },
              "buyer_reference": {
                "description": "Buyer reference; for XRechnung to authorities the Leitweg-ID (required for xrechnung)",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency code. Default EUR.",
                "type": "string"
              },
              "delivery_date": {
                "description": "Delivery or service date (or use period_start and period_end)",
                "type": "string"
              },
              "due_date": {
                "description": "Due date",
                "type": "string"
              },
              "issue_date": {
                "description": "Invoice date YYYY-MM-DD or DD.MM.YYYY",
                "type": "string"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "lines": {
                "description": "Rows: description, quantity, unit (C62 piece, HUR hour, DAY, MON, KGM, MTR, MTK, LTR, KMT, LS lump sum, SET), unit_price (net), vat_rate (19, 7), category (standard, small_business, reverse_charge, intra_community, export, not_taxable).",
                "items": {
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "note": {
                "description": "Free note on the invoice",
                "type": "string"
              },
              "number": {
