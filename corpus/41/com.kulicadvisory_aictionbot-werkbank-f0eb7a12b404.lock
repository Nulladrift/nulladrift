        {
          "name": "check_kpis",
          "title": "Check source-to-pay KPIs as a traffic light: PO coverage, invoices without PO, after-the-fact POs, cycle times, exceptions, payment on time, cash discount",
          "description": "AICTIONBOT™ S2P KPI check by KULIC Advisory, built on the Execution Toolkit template T04 (end-to-end S2P KPI dashboard). Either takes an export with one row per invoice (amount, PO number, invoice, PO, requisition, approval, due and payment dates, exception yes/no, cash discount available and taken) and calculates PO coverage by spend, share of invoices without a PO, after-the-fact POs, requisition-to-PO and invoice-to-approval cycle times (median), invoice exceptions and first-time match, payment on time and cash discount captured with the amount left on the table; or takes finished figures (kpi, actual, target) and rates them. Every figure gets red, amber or green against a target (the user's own or a stated suggestion; amber within 20 percent of the target) and the base it was calculated on. Fields that are missing are named instead of guessed. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
          "inputSchema": {
