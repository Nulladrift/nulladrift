      "instructions": "Procurement tools for small and mid-sized businesses by KULIC Advisory (Cologne). check_price_increase compares a supplier's price increase with official Eurostat data for Germany, screen_sanctions screens a supplier name against the EU, UN, US and UK sanctions lists, calculate_notice_deadline gives the last day to give notice on a contract, check_discount_window finds expiring early-payment discounts in an open-items list, check_approval_matrix checks an approval matrix against the people list, check_invoice_payment checks an invoice against the vendor master before paying, check_rasci_matrix checks a RASCI matrix against the people list, check_catalog compares a supplier's new price list with the old one, build_category_profile builds a category file from spend rows and contracts, find_in_list finds a document, order or supplier number in a list the user provides, analyse_spend analyses a spend export (volume, small orders, bundling, tail), match_documents matches requisition, purchase order, order confirmation, goods receipt and invoice line by line (pass the fields you read from the documents), check_vendor_master X-rays a vendor master list for duplicates, invalid IBAN and VAT ID, gaps and risk signals, build_business_case turns the user's own assumptions into annual value, ROI and payback bands. For looking things up: atlas_overview, find_painpoint and get_painpoint open the Painpoint Atlas (49 recurring procurement pain points from practice, 12 open to read), search_library and get_article open the published articles, practice cases and method pages; quote them with KULIC Advisory as the source and the link. list_templates, get_template and fill_template open the Execution Toolkit Library: 44 working templates (RFQ, sourcing evaluation, contract management, NDA, MSA, SLA, business case, action log and more), their structure read from the files, and a mechanical fill that maps the user's values to columns, cells and placeholders; the files are free to download and in English. All deterministic and without AI, open without sign-in. With the user's AICTIONBOT™ Werkbank licence (sign-in on first use) review_contract, compare_offers, check_invoice, write_scope_of_work and write_meeting_minutes add AI analyses that count against the licence quota, plan_negotiation, negotiation_round and evaluate_negotiation run the negotiation sparring (plan, role play round by round, evaluation), werkbank_licence shows plan and remaining analyses, and get_painpoint_full reads any of the 49 pain points of the full Painpoint Atlas with its findings (no AI, up to 60 different findings per month). Pass document text, not files; extract text from PDFs first. Integration guide, partner terms and test keys: https://www.kulicadvisory.com/workbench/partner/ (German: https://www.kulicadvisory.com/de/werkbank/partner/).",
      "tools": [
        {
          "name": "analyse_spend",
          "title": "Analyse a spend or order export: who carries the volume, small orders, bundling, tail and possible duplicate postings",
          "description": "AICTIONBOT™ Spend Cube by KULIC Advisory. Takes the rows of a spend, invoice or order export and returns total volume, documents and suppliers, how many suppliers carry 80 % of the volume, the top 10 suppliers with their share, volume by category with a suggested category where none is given, small orders under a threshold, rows without an order number, possible duplicate postings, categories bought from three or more suppliers (bundling) and the tail X-ray: who carries the last 5 % of volume, one-time suppliers and a suitable channel per category. Column names in German or English are recognised. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "rows": {
                "description": "Spend rows as objects: supplier (Lieferant) and amount (Betrag, net) are required; date (Datum), category (Warengruppe), order_no (Bestellnummer) and description (Beschreibung) are optional.",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "small_order_threshold": {
                "description": "Small order threshold in EUR. Default 250.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Spend cube"
          },
