          "description": "AICTIONBOT™ request to offer by KULIC Advisory (tool 50), built on the Execution Toolkit templates T10 (RFQ) and T11 (sourcing evaluation). For traders and job shops: takes the customer request (item, customer, quantity, unit, customer deadline), the mark-up and optional supplier offers (supplier, unit price, delivery days, valid until). Returns a dated route (send request today, reminder, compare, offer to the customer), the offers with validity and lead time checks, the cheapest valid offer, the selling price with mark-up and gross margin, and RFQ and reminder texts in German and English to copy. Nothing is sent. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
