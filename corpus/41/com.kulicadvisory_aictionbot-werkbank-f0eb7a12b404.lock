        {
          "name": "analyse_spend",
          "title": "Analyse a spend or order export: who carries the volume, small orders, bundling, tail and possible duplicate postings",
          "description": "AICTIONBOT™ Spend Cube by KULIC Advisory. Takes the rows of a spend, invoice or order export and returns total volume, documents and suppliers, how many suppliers carry 80 % of the volume, the top 10 suppliers with their share, volume by category with a suggested category where none is given, small orders under a threshold, rows without an order number, possible duplicate postings, categories bought from three or more suppliers (bundling) and the tail X-ray: who carries the last 5 % of volume, one-time suppliers and a suitable channel per category. Column names in German or English are recognised. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
          "inputSchema": {
