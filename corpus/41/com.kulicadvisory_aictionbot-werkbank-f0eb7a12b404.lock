          "name": "order_to_payment_status",
          "title": "Order-to-payment status overview: from one export what is stuck where, per cost centre, with the next step and who has to act",
          "description": "AICTIONBOT™ order-to-payment status overview by KULIC Advisory (tool 66). Takes an export with one row per case (requisition, order number, cost centre, requester, supplier, order value, value received, value invoiced, block, date) and puts every row into one status from its fields: invoice waiting for goods receipt (red), blocked (red), open to order, open to receive, goods receipt without invoice, or done. Returns count and value per status, open cases per cost centre, and the next steps sorted by urgency and age, each with who has to act (purchasing, the requester or accounting) and what to do. Deterministic, no AI, nothing stored. To check a single invoice against order and goods receipt use match_documents. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
