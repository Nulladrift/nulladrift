          "description": "Takes the surcharges or extra charges on an invoice (type and amount) and the facts of the deal: Incoterm, fixed price yes/no, escalation clause yes/no and whether it covers this surcharge, agreed in writing, proof provided, order date and the date the surcharge applies from. Returns per charge whether it is owed: freight, insurance or import duty the seller bears under the Incoterm (for example duty under DDP), one-sided surcharges on a fixed price without clause, surcharges on orders placed before they applied, missing proof. Shows the Incoterms 2020 split (risk transfer, main freight, insurance, export clearance, import duty) and writes a reply. For index-based price increases use check_price_increase. Licence, or one free check every 30 days.",
