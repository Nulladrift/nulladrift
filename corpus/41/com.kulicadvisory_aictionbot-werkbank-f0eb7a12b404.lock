          "description": "Uses one AI analysis of the licence. Reviews a contract or general terms and conditions the buyer is asked to sign, clause by clause (term, renewal, notice, price adjustment, payment, liability, warranty, penalties, acceptance, exclusivity, data protection, jurisdiction). Returns a summary and, per clause, the exact reference, the plain-language meaning, a rating (ok, pruefen = check, kritisch = critical), why it matters for the buyer and a counter-proposal; deadline dates only when the start date is known. Also returns datenblatt, the key data of the contract as stated (supplier, subject, target value, payment terms, items) for entry into an ERP or accounting system. Pass the full contract text (extract text from PDFs or images first). The text is processed for this answer only and is not stored by KULIC Advisory.",
