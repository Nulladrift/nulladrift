      "serverInfo": {
        "name": "aictionbot-werkbank",
        "title": "AICTIONBOT™ Werkbank",
        "version": "1.3.0",
        "websiteUrl": "https://www.kulicadvisory.com/de/werkbank/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Procurement tools for small and mid-sized businesses by KULIC Advisory (Cologne). check_price_increase compares a supplier's price increase with official Eurostat data for Germany, screen_sanctions screens a supplier name against the EU, UN, US and UK sanctions lists, calculate_notice_deadline gives the last day to give notice on a contract, check_discount_window finds expiring early-payment discounts in an open-items list, check_approval_matrix checks an approval matrix against the people list, check_invoice_payment checks an invoice against the vendor master before paying, check_rasci_matrix checks a RASCI matrix against the people list, check_catalog compares a supplier's new price list with the old one, build_category_profile builds a category file from spend rows and contracts, find_in_list finds a document, order or supplier number in a list the user provides, analyse_spend analyses a spend export (volume, small orders, bundling, tail), match_documents matches requisition, purchase order, order confirmation, goods receipt and invoice line by line (pass the fields you read from the documents), check_vendor_master X-rays a vendor master list for duplicates, invalid IBAN and VAT ID, gaps and risk signals. All deterministic and without AI, open without sign-in. With the user's AICTIONBOT™ Werkbank licence (sign-in on first use) review_contract, compare_offers, check_invoice, write_scope_of_work and write_meeting_minutes add AI analyses that count against the licence quota, plan_negotiation, negotiation_round and evaluate_negotiation run the negotiation sparring (plan, role play round by round, evaluation), and werkbank_licence shows plan and remaining analyses. Pass document text, not files; extract text from PDFs first. Integration guide, partner terms and test keys: https://www.kulicadvisory.com/workbench/partner/ (German: https://www.kulicadvisory.com/de/werkbank/partner/).",
      "tools": [
        {
          "name": "analyse_spend",
          "title": "Analyse a spend or order export: who carries the volume, small orders, bundling, tail and possible duplicate postings",
          "description": "AICTIONBOT™ Spend Cube by KULIC Advisory. Takes the rows of a spend, invoice or order export and returns total volume, documents and suppliers, how many suppliers carry 80 % of the volume, the top 10 suppliers with their share, volume by category with a suggested category where none is given, small orders under a threshold, rows without an order number, possible duplicate postings, categories bought from three or more suppliers (bundling) and the tail X-ray: who carries the last 5 % of volume, one-time suppliers and a suitable channel per category. Column names in German or English are recognised. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "rows": {
                "description": "Spend rows as objects: supplier (Lieferant) and amount (Betrag, net) are required; date (Datum), category (Warengruppe), order_no (Bestellnummer) and description (Beschreibung) are optional.",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "small_order_threshold": {
                "description": "Small order threshold in EUR. Default 250.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Spend cube"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ad32fa4b28bfb321ba6f0a41471909c6318f8e0f8a5bb0fa4a9b91f95cd44a9"
        },
        {
          "name": "build_category_profile",
          "title": "Build a category profile from a spend list and contracts: volume, suppliers, concentration, next notice date, levers",
          "description": "AICTIONBOT™ Category Profile by KULIC Advisory. From your own spend rows and, if present, your contract list it builds one file for a category: total and share of spend, suppliers with their share, concentration, small orders, monthly course, contracts with the last day to give notice, and the levers that follow. Rows without a category get a suggested one from supplier name and text. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category to profile. Default: the largest category in the data.",
                "maxLength": 120,
                "type": "string"
              },
              "contracts": {
                "description": "Optional contracts: supplier, subject, end (date), notice (e.g. 3 months), auto_renewal (yes/no), category.",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "type": "array"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "spend": {
                "description": "Spend rows: supplier, amount, date (YYYY-MM-DD or DD.MM.YYYY), category (optional), text (optional), document (optional).",
                "items": {
                  "type": "object"
                },
                "maxItems": 20000,
                "minItems": 1,
                "type": "array"
              },
              "today": {
                "description": "Reference date, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["spend"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Category profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:434b7eefacd3b961e2ede99210a588497cfa9a1e7dd4670ad8fc0a9b751fa6f7"
        },
        {
          "name": "calculate_notice_deadline",
          "title": "Calculate the last day to give notice on a contract",
          "description": "AICTIONBOT™ deadline guard by KULIC Advisory. From contract start, initial term, automatic renewal and notice period it calculates the current term end, the last day notice must reach the other party, the days left and what happens if the date is missed. Deterministic, no AI. Not legal advice: the wording of the contract decides.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract_start": {
                "description": "First day of the contract, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "initial_term_months": {
                "description": "Initial (minimum) term in months.",
                "maximum": 240,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "notice_period": {
                "description": "Notice period before the end of the term: number plus unit d (days), w (weeks) or m (months), e.g. 3m.",
                "pattern": "^\\d{1,3}\\s*(d|w|m)$",
                "type": "string"
              },
              "renewal_months": {
                "description": "Automatic renewal period in months after the initial term; 0 if the contract ends without renewal. Default 12.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "today": {
                "description": "Optional reference date, YYYY-MM-DD. Default today (Europe/Berlin).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["contract_start", "initial_term_months", "notice_period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Notice deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a786d83c0019da15dcf17d16bc5475048adf80890a27e0f9adc883dc9309de07"
        },
        {
          "name": "check_approval_matrix",
          "title": "Check an approval matrix against the people list: who approves although they left, lack a role or have no deputy",
          "description": "AICTIONBOT™ Freigabematrix-Prüfer by KULIC Advisory. Checks an approval matrix (area, level, approver, limits, deputy, system) against a people list (status, leaving date, absence, system role) and optional open approvals, and returns the rows that need action: approvers who left, are absent without a cover, lack a system role, missing deputies, limit gaps and overlaps, plus open approvals stuck with those people. Deterministic, no AI, nothing stored. Findings are written in German. Keys may be German (bereich, stufe, freigeber, limit_von, limit_bis, waehrung, vertreter, system; person, status, austritt, abwesend_bis, systemrolle; beleg, bereich, betrag, wartet_bei, seit) or English (area, level, approver, limit_from, limit_to, currency, deputy, system; person, status, left_on, absent_until, system_role; document, area, amount, waiting_with, since).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Reference date, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "matrix": {
                "description": "Approval matrix rows.",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "open_approvals": {
                "description": "Optional open approvals: document, area, amount, waiting_with, since, system.",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "people": {
                "description": "People list. Each person: name, status (active, left, absent), left_on, absent_until, system_role (yes/no).",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["matrix", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Approval matrix check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8633bc45bb0744ec577c6038035fa1d47c7ec4f74f0410a7583c2fd4e222d43"
        },
        {
          "name": "check_catalog",
          "title": "Check a supplier's new price list against the old one before loading it: increases per item, hidden unit changes, new and dropped items",
          "description": "AICTIONBOT™ Catalog Checker by KULIC Advisory. Puts a supplier's new price list (catalog) next to the old one and returns what needs attention before it is loaded: increases per item against a threshold, hidden changes in unit, price unit or content, new and dropped items, duplicates, implausible prices, invalid EANs, and the weighted change and extra cost per year when annual quantities are given. Without an old list it checks the new list on its own. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "new_list": {
                "description": "New price list rows: article_no, description, price, unit, price_unit (price per how many units, default 1), content (e.g. sheets per pack), min_order, ean, currency.",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "old_list": {
                "description": "Optional old price list in the same form, plus annual_quantity (per year, in sales units of the old list) to weight the change.",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "threshold_percent": {
                "description": "Increase per item that needs a look, in percent. Default 5. Three times the threshold is a stop.",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["new_list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Catalog check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:047c2b5773335b9b1b7914094c5abd38cf5a2fa5ca7213aa8d45e4e03f900f45"
        },
        {
          "name": "check_discount_window",
          "title": "Find early-payment discounts (Skonto) that expire in the next days, and which payment run still catches them",
          "description": "AICTIONBOT™ Skonto-Radar by KULIC Advisory. Takes an open-items list (invoices with discount terms) and optional clarification cases from other checks, and returns which discounts expire within the window, which are blocked by a payment hold or an open clarification, which are already lost, and the last payment run that still catches each one. Deterministic, no AI, nothing stored. Findings are written in German. Keys may be given in German (beleg, lieferant, bestellung, rechnungsdatum, eingang, betrag, skonto_pct, skonto_tage, netto_tage, skonto_bis, faellig, sperre) or English (document, supplier, order, invoice_date, received, amount, discount_percent, discount_days, net_days, discount_until, due, blocked).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Reference date, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "clarifications": {
                "description": "Optional open clarification cases from other checks: document, order, reason (grund), with (bei), result (ergebnis).",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "type": "array"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "open_items": {
                "description": "Open invoices. Each item: document, supplier, order, invoice_date (YYYY-MM-DD or DD.MM.YYYY), received, amount (negative for credit notes), discount_percent, discount_days, net_days, discount_until, due, blocked (yes/no).",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "payment_run_weekdays": {
                "description": "Weekdays of the payment runs, 1 = Monday. Default [2, 5] (Tuesday, Friday).",
                "items": {
                  "maximum": 7,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "window_days": {
                "description": "Days ahead that count as 'expiring soon'. Default 10.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["open_items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Early-payment discount radar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c5a35403b74adcb32344464e61de504597f4cecff8d8d9331bef470fec787b5"
        },
        {
          "name": "check_invoice",
          "title": "Check a supplier invoice against order and goods receipt (AICTIONBOT™ invoice check)",
          "description": "Needs the user's AICTIONBOT™ Werkbank licence; each call uses one AI analysis from the licence quota. Checks a supplier invoice like an accounts payable clerk doing a three-way match: line by line against the purchase order or contract and the goods receipt (price, quantity, new or missing items), totals and tax, payment term and early payment discount, and for German invoices the mandatory content under § 14 UStG. Returns the lines with status and notes, the mandatory content check and what to clarify before paying. Not tax advice. The texts are processed for this answer only and are not stored by KULIC Advisory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goods_receipt": {
                "description": "Optional: what was actually received, e.g. quantities per item.",
                "maxLength": 1500,
                "type": "string"
              },
              "invoice_text": {
                "description": "Text of the invoice.",
                "maxLength": 30000,
                "minLength": 30,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: de, en, fr, es, pt or zh. Default de.",
                "enum": ["en", "de", "fr", "es", "pt", "zh"],
                "type": "string"
              },
              "reference_text": {
                "description": "Optional: text of the purchase order or contract to compare against.",
                "maxLength": 30000,
                "type": "string"
              }
            },
            "required": ["invoice_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check invoice (licence)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9a1a254077eeb4e3bd183b25b6b75bb0aa1ffce8931ddef4502ef9805afce8ec"
        },
        {
          "name": "check_invoice_payment",
          "title": "Check an invoice against the vendor master before paying: new bank account, unknown supplier, blocked vendor",
          "description": "AICTIONBOT™ Zahlungsschutz by KULIC Advisory. Matches the supplier on an invoice to the vendor master by VAT ID, IBAN and name similarity, validates the IBAN checksum, and flags a changed or unknown bank account, a blocked vendor, a dormant vendor and a first payment. Returns a verdict (stop, check, ok) with the next step. Deterministic, no AI, nothing stored. Findings in German.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "invoice": {
                "description": "supplier (name), vat_id, iban, amount, currency, date (YYYY-MM-DD).",
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "iban": {
                    "type": "string"
                  },
                  "supplier": {
                    "type": "string"
                  },
                  "vat_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "vendor_master": {
                "description": "Vendor master rows: no (vendor number), name, vat_id, iban, country, last_payment (YYYY-MM-DD or null), blocked (bool).",
                "items": {
                  "type": "object"
                },
                "maxItems": 20000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["invoice", "vendor_master"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Payment protection check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf8d2f9c1bb0938d845c9e7e5e8bc96aaf344e307f10b57a85842c89bd05184b"
        },
        {
          "name": "check_price_increase",
          "title": "Check a supplier price increase against official market data (Germany)",
          "description": "AICTIONBOT™ price increase check by KULIC Advisory. Compares a supplier's requested price increase with the official Eurostat producer price index (goods) or services producer price index plus labour cost index (services) for Germany since the last price agreement. Returns market change, gap in percentage points, a verdict (in line, slightly above, clearly above, market fell), an evidence-based counter-offer level and the source. Deterministic, no AI, no personal data. Not legal advice. Use list_categories to pick a category code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_volume_eur": {
                "description": "Optional annual spend with this supplier in EUR, to express the gap in euros.",
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "Category code from list_categories (e.g. C17 for paper and packaging, N81 for cleaning) or its German or English name.",
                "type": "string"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "last_agreement": {
                "description": "Month of the last agreed price, YYYY-MM (2019-01 or later).",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "requested_increase_percent": {
                "description": "Increase the supplier requests, in percent (e.g. 9.5).",
                "maximum": 200,
                "minimum": -50,
                "type": "number"
              }
            },
            "required": ["category", "last_agreement", "requested_increase_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Price increase check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:686cfb786849a0e2a58b5bb0f0172de8b06a834520c0360691453fe3ff10b68c"
        },
        {
          "name": "check_rasci_matrix",
          "title": "Check a RASCI matrix against the people list: tasks without an A, several A, no R, roles without an active person",
          "description": "AICTIONBOT™ RASCI Checker by KULIC Advisory. Checks a RASCI matrix (tasks by roles or people, codes R, A, S, C, I, also A/R) against an optional people list (role, status, leaving date, absence). Returns the tasks that need action: no accountable role, several A, no R, too many R or C, and roles or people that hold an A or R but left, are absent or are unknown. Deterministic, no AI, nothing stored. Requests without sign-in are limited to 20 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Reference date, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "people": {
                "description": "Optional people list: person, role, status (active, left, absent), left_on (YYYY-MM-DD), absent_until (YYYY-MM-DD).",
                "items": {
                  "type": "object"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "tasks": {
                "description": "One object per task: task (name), process (optional), assignments (object: role or person name -> code such as R, A, A/R, S, C, I). Instead of assignments the role names may be given as further keys of the task object.",
                "items": {
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tasks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "RASCI check"
          },
          "behavior": {
            "destructive": false,
