          "description": "AICTIONBOT™ Vendor Master X-ray by KULIC Advisory. Takes a vendor (creditor) master list and returns duplicate groups with the reason and a suggested leading record, risk signals (one IBAN under two names, one VAT ID or tax number under two names, bank country different from the country of residence, BIC not matching the IBAN), format errors (IBAN check digits and length, VAT ID format per country and the German check digit, postcode, e-mail, BIC, date), gaps in required fields, dormant vendors without activity and a clean-up list with a proposal per record. Column names in German or English are recognised (Kreditor, Name, Straße, PLZ, Ort, Land, USt-IdNr., Steuernummer, IBAN, BIC, E-Mail, Telefon, Letzte Bewegung, Sperre; no, name, street, zip, city, country, vat_id, tax_number, iban, bic, email, phone, last_activity, blocked). Check digits and formats do not prove that an account belongs to the supplier. Up to 1,000 vendors per call; larger lists run in the browser tool on the user's own device. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
