        {
          "name": "build_business_case",
          "title": "Business case for a procurement improvement: annual value band, ROI band, payback band and where the value comes from",
          "description": "AICTIONBOT™ Business Case Builder by KULIC Advisory. From the user's own assumptions (annual addressable spend, estimated value leakage, annual transactions, minutes of manual effort per transaction, hourly cost, error or rework rate, planned investment and a scenario) it returns directional bands, never exact promises: annual value band, ROI band, payback band, economic relevance, where the value comes from (shares of manual effort, rework and value leakage) and the cost of waiting per week as a band. Same formula and bands as the ROI calculator on kulicadvisory.com. Needs the investment, a scenario and either spend with a leakage rate or transactions with minutes and hourly cost; with spend given, a missing leakage rate, investment or scenario is filled with a marked example value (1.5 %, EUR 75,000, realistic). Directional and based on user-entered assumptions only; not a guarantee of results. Deterministic, no AI, nothing stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_spend_eur": {
                "description": "Annual addressable spend in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "annual_transactions": {
                "description": "Transactions per year, e.g. invoices or purchase orders.",
                "minimum": 0,
                "type": "number"
              },
              "error_rate_percent": {
                "description": "Estimated error or rework rate in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hourly_cost_eur": {
                "description": "Fully loaded hourly cost in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "investment_eur": {
                "description": "Estimated implementation or advisory investment in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "leakage_percent": {
                "description": "Estimated value leakage in percent of that spend, e.g. 1.5.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minutes_per_transaction": {
                "description": "Average manual effort per transaction in minutes.",
                "minimum": 0,
                "type": "number"
              },
              "scenario": {
                "description": "How much of the gross potential is assumed to be reachable: conservative 25 %, realistic 50 %, ambitious 75 %.",
                "enum": ["conservative", "realistic", "ambitious"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business case builder"
          },
          "behavior": {
