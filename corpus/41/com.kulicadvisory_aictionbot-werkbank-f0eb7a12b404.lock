                "type": "string"
              },
              "period_start": {
                "description": "Start of the service period, YYYY-MM-DD.",
                "type": "string"
              },
              "profile": {
                "description": "zugferd (default, EN 16931) or xrechnung (XRechnung 3.0, for public authorities)",
                "enum": ["zugferd", "xrechnung"],
                "type": "string"
              },
              "seller": {
                "description": "name, street, postcode, city, country (ISO code, default DE), vat_id, tax_number, register, email, phone, contact, iban, bic, account_holder",
                "type": "object"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
