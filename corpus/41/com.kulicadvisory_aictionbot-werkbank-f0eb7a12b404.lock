        {
          "name": "create_contract_draft",
          "title": "Draft a contract: service agreement, SLA, framework agreement, master service agreement or supply agreement",
          "description": "Drafts one of five business-to-business contracts in German or English from the KULIC Advisory contract templates: service agreement (service), service level agreement (sla), framework agreement for call-offs (framework), master service agreement with statements of work (msa), or supply agreement for production materials, materials and related services (supply). Inputs: two parties with address and representative, start date, term and notice, payment term and early payment discount, liability, governing law, place of jurisdiction, and details per contract type. Every draft names one contact per side, requires e-invoices quoting the order number, and pays to a changed bank account only after a call-back to a known number. Returns the full text with numbered clauses, the list of annexes and signature blocks, plus the link to the web tool that creates the same draft as Word and PDF in the browser. For an NDA use create_nda. Working template written for German law, not legal advice: have it reviewed by a lawyer before signing. Licence, or one free check every 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptance_days": {
                "description": "msa only: review period for deliverables in working days. Default 10.",
                "enum": [5, 10, 15],
                "type": "integer"
              },
              "amount_eur": {
                "description": "service only: fixed fee, monthly fee, or cap for time and materials.",
                "minimum": 0,
                "type": "number"
              },
              "buyer_tooling": {
                "description": "supply only: tooling owned by the buyer at the supplier. Default true.",
                "type": "boolean"
              },
              "confidentiality_years": {
                "description": "Confidentiality after the end of the contract. Default 3.",
                "enum": [2, 3, 5],
                "type": "integer"
              },
              "delivery_place": {
                "description": "supply only: named place for the Incoterm.",
                "maxLength": 120,
                "type": "string"
              },
              "discount": {
                "additionalProperties": false,
                "description": "Optional early payment discount, for example 2 percent within 14 days.",
                "properties": {
                  "days": {
                    "description": "Days within which the discount applies, e.g. 14.",
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "percent": {
                    "description": "Discount in percent, e.g. 2.",
                    "maximum": 5,
                    "minimum": 0.5,
                    "type": "number"
                  }
                },
                "required": ["days", "percent"],
                "type": "object"
              },
              "effective_date": {
                "description": "Start date as YYYY-MM-DD. Default: today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "expected_volume": {
                "description": "framework only, optional non-binding annual volume, for example 120,000 euros.",
                "maxLength": 60,
                "type": "string"
              },
              "fee_model": {
                "description": "service only. Default fixed.",
                "enum": ["fixed", "time_and_materials", "monthly"],
                "type": "string"
              },
              "forecast": {
                "description": "supply only: forecast with binding call-offs (4 weeks production, 8 weeks material). Default true.",
                "type": "boolean"
              },
              "governing_law": {
                "description": "germany (default), austria, switzerland, england_wales, or the name of another jurisdiction.",
                "maxLength": 80,
                "type": "string"
              },
              "hourly_rate_eur": {
                "description": "service only, time_and_materials: hourly rate in euros.",
                "minimum": 0,
                "type": "number"
              },
              "incoterm": {
                "description": "supply only. Default DAP.",
                "enum": ["DAP", "DDP", "FCA", "EXW"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional place of jurisdiction, for example Cologne.",
                "maxLength": 80,
                "type": "string"
              },
              "language": {
                "description": "Language of the contract and the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "late_delivery_penalty": {
                "description": "supply only: 0.2 percent per working day, capped at 5 percent. Default false.",
                "type": "boolean"
              },
              "lead_time_days": {
                "description": "framework only: lead time in working days. Default 10.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "level": {
                "description": "sla only: response and resolution targets. Priority 1 response in 4 hours (basic), 2 hours (standard, default) or 30 minutes (premium).",
                "enum": ["basic", "standard", "premium"],
                "type": "string"
              },
              "liability": {
                "description": "statutory: liability by law (default for framework and supply). annual_fees or double_fees: slight negligence capped at one or two years of fees (default annual_fees for service and msa). amount: capped at liability_cap_eur.",
                "enum": ["statutory", "annual_fees", "double_fees", "amount"],
                "type": "string"
              },
              "liability_cap_eur": {
                "description": "Cap in euros when liability is amount.",
                "minimum": 1,
                "type": "number"
              },
              "main_agreement": {
                "description": "sla only: the main agreement it supplements, for example service agreement dated 1 March 2026.",
                "maxLength": 160,
                "type": "string"
              },
              "notice_months": {
                "description": "Notice period in months. Default 3.",
                "enum": [1, 3, 6],
                "type": "integer"
              },
              "party_a": {
                "additionalProperties": false,
                "description": "Client (service, sla, msa) or buyer (framework, supply).",
                "properties": {
                  "address": {
                    "description": "Postal address.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "company": {
                    "description": "Company name.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "representative": {
                    "description": "Person who signs.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "title": {
                    "description": "Position of the person who signs.",
                    "maxLength": 120,
                    "type": "string"
                  }
                },
                "required": ["company"],
                "type": "object"
              },
              "party_b": {
                "additionalProperties": false,
                "description": "Service provider (service, sla, msa) or supplier (framework, supply).",
                "properties": {
                  "address": {
                    "description": "Postal address.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "company": {
                    "description": "Company name.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "representative": {
                    "description": "Person who signs.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "title": {
                    "description": "Position of the person who signs.",
                    "maxLength": 120,
                    "type": "string"
                  }
                },
                "required": ["company"],
                "type": "object"
              },
              "payment_days": {
                "description": "Payment term in days after receipt of a verifiable invoice. Default 30.",
                "enum": [14, 30, 45, 60],
                "type": "integer"
              },
              "place_of_performance": {
                "description": "service only, optional.",
                "maxLength": 120,
                "type": "string"
              },
              "price_adjustment": {
                "description": "framework and supply: after the fixed period. index (default): by an official price index named in Annex 1.",
                "enum": ["index", "annual_negotiation", "none"],
                "type": "string"
              },
              "price_fixed_months": {
                "description": "framework and supply: prices fixed for this many months. Default 12.",
                "enum": [6, 12, 24],
                "type": "integer"
              },
              "quality_agreement": {
                "description": "supply only: quality assurance agreement as annex. Default true.",
                "type": "boolean"
              },
              "reporting": {
                "description": "sla only. Default monthly.",
                "enum": ["monthly", "quarterly"],
                "type": "string"
              },
              "service_credits": {
                "description": "sla only: 5 percent of the monthly fee per missed target, capped at 15 percent. Default true.",
                "type": "boolean"
              },
              "service_hours": {
                "description": "sla only. office: Mon to Fri 8 to 17 (default). extended: Mon to Fri 7 to 20 and Sat 8 to 14. 24_7: around the clock.",
                "enum": ["office", "extended", "24_7"],
                "type": "string"
              },
              "service_name": {
                "description": "sla only: name of the service, for example invoice verification.",
                "maxLength": 120,
                "type": "string"
              },
              "spare_parts_years": {
                "description": "supply only: spare parts after end of series. Default 10.",
                "enum": [0, 5, 10, 15],
                "type": "integer"
              },
              "subject": {
                "description": "Optional, one sentence: the service (service), the goods (framework), the type of services (msa) or the contract products (supply). Without it the draft refers to Annex 1.",
                "maxLength": 240,
                "type": "string"
              },
              "term_months": {
                "description": "Initial term in months, then renewing by twelve months; 0 = indefinite. Default 24, for msa 0. Not used for sla (it ends with the main agreement).",
                "enum": [0, 12, 24, 36],
                "type": "integer"
              },
              "type": {
                "description": "service: service agreement for one service. sla: service level agreement supplementing a main agreement. framework: framework agreement with prices for call-offs. msa: master service agreement with statements of work. supply: supply agreement for production materials, materials and related services.",
                "enum": ["service", "sla", "framework", "msa", "supply"],
                "type": "string"
              },
              "warranty_months": {
                "description": "framework and supply: limitation period for defects. Default 24.",
                "enum": [12, 24, 36],
                "type": "integer"
              }
            },
            "required": ["party_a", "party_b", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
