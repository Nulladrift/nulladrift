          "description": "AICTIONBOT™ Document Match by KULIC Advisory. Compares the documents of one purchase line by line: purchase requisition, purchase order, order confirmation, goods receipt and invoice, in any combination of two or more. Returns the verdicts (requisition, order confirmation, 2-way match, 3-way match), the header fields that differ (order reference, supplier, currency, payment terms, Incoterms, cost centre, approval), per line the quantity, unit price and delivery date of every document with a status, and ready-made queries to the supplier and for internal clarification. Without a purchase order the next best document becomes the reference. Read the fields from the documents yourself and pass them as data; the tool does not read files. Numbers as JSON numbers, dates as YYYY-MM-DD. German keys work too (nummer, bestellbezug, datum, lieferant, waehrung, zahlungsziel, kostenstelle, freigabe, summe, positionen with pos, material, text, menge, einheit, preis, preiseinheit, betrag, liefertermin). With vendor_master the bank details of the invoice are checked as in check_invoice_payment. Deterministic, no AI, nothing stored. Needs sign-in: runs with an AICTIONBOT™ Werkbank licence; without a licence one check per connection every 30 days is free (sign in with “Connect without a licence”).",
