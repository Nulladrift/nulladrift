        {
          "name": "calculate_notice_deadline",
          "title": "Calculate the last day to give notice on a contract",
          "description": "From contract start, initial term, automatic renewal and notice period it calculates the current term end, the last day notice must reach the other party, the days left and what happens if the date is missed. Deterministic, no AI. Not legal advice: the wording of the contract decides. Licence, or one free check every 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract_start": {
                "description": "First day of the contract, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "initial_term_months": {
                "description": "Initial (minimum) term in months.",
                "maximum": 240,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of the answer. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "notice_period": {
                "description": "Notice period before the end of the term: number plus unit d (days), w (weeks) or m (months), e.g. 3m.",
                "pattern": "^\\d{1,3}\\s*(d|w|m)$",
                "type": "string"
              },
              "renewal_months": {
                "description": "Automatic renewal period in months after the initial term; 0 if the contract ends without renewal. Default 12.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "today": {
                "description": "Optional reference date, YYYY-MM-DD. Default today (Europe/Berlin).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["contract_start", "initial_term_months", "notice_period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Notice deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25147fd6483af88f7ffda80123011503b268b46c3415b3a095aa12a65bf2a346"
        },
        {
          "name": "check_discount_window",
          "title": "Find early-payment discounts (Skonto) that expire in the next days, and which payment run still catches them",
          "description": "Takes an open-items list (invoices with discount terms) and optional clarification cases from other checks, and returns which discounts expire within the window, which are blocked by a payment hold or an open clarification, which are already lost, and the last payment run that still catches each one. With critical_suppliers it adds a payment run priority: invoices of critical suppliers that must go into the next run, blocked ones with the reason and who clears the block. Findings are written in German. Keys may be given in German (beleg, lieferant, bestellung, rechnungsdatum, eingang, betrag, skonto_pct, skonto_tage, netto_tage, skonto_bis, faellig, sperre) or English (document, supplier, order, invoice_date, received, amount, discount_percent, discount_days, net_days, discount_until, due, blocked). Licence, or one free check every 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Reference date, YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "clarifications": {
                "description": "Optional open clarification cases from other checks: document, order, reason (grund), with (bei), result (ergebnis).",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "type": "array"
              },
              "critical_suppliers": {
                "description": "Optional critical suppliers (sole suppliers, running production, delivery stop threatened): names or objects { supplier, reason }. Adds a payment run priority: which of their invoices must go into the next payment run, which are blocked, the reason and who clears the block.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 500,
                "type": "array"
              },
              "language": {
                "description": "Language of the answer: de or en. Default de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "open_items": {
                "description": "Open invoices. Each item: document, supplier, order, invoice_date (YYYY-MM-DD or DD.MM.YYYY), received, amount (negative for credit notes), discount_percent, discount_days, net_days, discount_until, due, blocked (yes/no).",
                "items": {
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "payment_run_weekdays": {
                "description": "Weekdays of the payment runs, 1 = Monday. Default [2, 5] (Tuesday, Friday).",
                "items": {
                  "maximum": 7,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "window_days": {
                "description": "Days ahead that count as 'expiring soon'. Default 10.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["open_items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Early-payment discount radar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28177626872958193751adcb2d0c7675e7027b9dc799b58a32a9af1e68bd7610"
        },
        {
          "name": "check_invoice",
          "title": "Check a supplier invoice against order and goods receipt (AICTIONBOT™ invoice check)",
          "description": "Uses one AI analysis of the licence. Checks a supplier invoice like an accounts payable clerk doing a three-way match: line by line against the purchase order or contract and the goods receipt (price, quantity, new or missing items), totals and tax, payment term and early payment discount, and for German invoices the mandatory content under § 14 UStG. Returns the lines with status and notes, the mandatory content check and what to clarify before paying. The texts are processed for this answer only and are not stored by KULIC Advisory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goods_receipt": {
                "description": "Optional: what was actually received, e.g. quantities per item.",
                "maxLength": 1500,
                "type": "string"
              },
              "invoice_text": {
                "description": "Text of the invoice.",
                "maxLength": 30000,
                "minLength": 30,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: de, en, fr, es, pt or zh. Default de.",
                "enum": ["en", "de", "fr", "es", "pt", "zh", "hr", "sr"],
                "type": "string"
              },
              "reference_text": {
                "description": "Optional: text of the purchase order or contract to compare against.",
                "maxLength": 30000,
                "type": "string"
              }
            },
            "required": ["invoice_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check invoice (licence)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a87f43dd34519749e543598729e448b9deb2319e5ae7bcb722ce5442499fc87"
        },
