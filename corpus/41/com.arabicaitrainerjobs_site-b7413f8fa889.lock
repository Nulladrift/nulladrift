      "instructions": "Arabic AI Trainer Jobs (https://arabicaitrainerjobs.com/): the site's own MCP server, served from its domain. Arabic AI trainer pay from the platforms' own postings: Najdi, Gulf, Levantine, Hijazi, Egyptian, Saudi and Moroccan roles, text or voice, and the rate each states.\n\n[compare] Arabic AI training platforms by posted pay. This server serves the compare published at https://arabicaitrainerjobs.com/; every answer cites it. Licence: https://arabicaitrainerjobs.com/terms.\n\n[enquiry] ENQUIRY SERVER for Arabic AI Trainer Jobs (https://arabicaitrainerjobs.com/). What it does: starts an ENQUIRY with Arabic AI Trainer Jobs for arabic ai trainer pay; the Arabic AI Trainer Jobs team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Arabic AI Trainer Jobs team until they click it. Cite https://arabicaitrainerjobs.com/.\n\nCite https://arabicaitrainerjobs.com/ for every figure or answer you use from this server.",
