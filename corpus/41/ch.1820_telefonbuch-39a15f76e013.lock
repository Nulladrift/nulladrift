        {
          "name": "reverse_phone_lookup",
          "title": "Reverse phone lookup",
          "description": "Looks up the public directory entry (or entries) associated with a Swiss phone number. Accepts national (\"079 123 45 67\"), E.164 (\"+41791234567\"), or compact notation. Returns an empty result list when the number has no findable public listing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Response language: de, fr, it, or en. Defaults to de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "phone_number": {
                "description": "The phone number to look up, in any common Swiss notation (national, E.164, or compact).",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["phone_number"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "additionalProperties": false,
                      "properties": {
                        "canton": {
                          "type": "string"
                        },
                        "country": {
                          "type": "string"
                        },
                        "locality": {
                          "type": "string"
                        },
                        "post_code": {
                          "type": "string"
                        },
                        "street": {
                          "type": "string"
                        },
                        "street_number": {
                          "type": "string"
                        }
                      },
                      "type": ["null", "object"]
                    },
                    "entry_id": {
                      "type": "string"
                    },
                    "entry_type": {
                      "type": "string"
                    },
                    "locality": {
                      "type": "string"
                    },
                    "match_kind": {
                      "type": "string"
                    },
                    "matched_e164": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["match_kind", "matched_e164"],
                  "type": "object"
