        {
          "name": "get_directory_entry",
          "title": "Get a directory entry",
          "description": "Fetches the full public detail for one directory entry by its entry_id (public_id), including phone numbers, opening hours, and links when the entry has them. Use get_directory_entry for phone numbers and opening hours; use search_swiss_directory or browse_business_category to find an entry_id first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry_id": {
                "description": "The entry's public_id, as returned by search_swiss_directory, browse_business_category, or reverse_phone_lookup.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Response language: de, fr, it, or en. Defaults to de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              }
            },
            "required": ["entry_id"],
            "type": "object"
          },
          "outputSchema": {
