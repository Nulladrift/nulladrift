        {
          "name": "browse_business_category",
          "title": "Browse a business category",
          "description": "Lists public directory entries in one business category, optionally narrowed to a locality/postcode/canton. Use search_swiss_directory instead for a free-text query.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "The business category slug (e.g. \"restaurant\", \"coiffeur\", \"sanitaer\"). Valid slugs are the slug values in categories, as returned by get_directory_entry, or a top-level group slug such as \"bau-handwerk\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Response language: de, fr, it, or en. Defaults to de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results, 1-20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Locality, postcode, or canton (e.g. \"Baden\", \"5400\", \"ZH\") to narrow the category to. Always put a place name here.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "advertising_block_note": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "additionalProperties": false,
                      "properties": {
                        "canton": {
                          "type": "string"
                        },
                        "country": {
                          "type": "string"
                        },
                        "locality": {
                          "type": "string"
                        },
                        "post_code": {
                          "type": "string"
                        },
                        "street": {
                          "type": "string"
                        },
                        "street_number": {
                          "type": "string"
                        }
                      },
                      "type": ["null", "object"]
                    },
                    "advertising_block": {
                      "type": "boolean"
                    },
                    "category": {
                      "type": "string"
                    },
                    "entry_id": {
                      "type": "string"
                    },
                    "entry_type": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["advertising_block", "entry_id", "entry_type"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "retrieved_at": {
                "type": "string"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              }
            },
            "required": ["advertising_block_note", "results", "retrieved_at", "source"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Browse a business category"
          },
