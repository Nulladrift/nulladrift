      "serverInfo": {
        "name": "pruviq-verdicts",
        "title": "PRUVIQ strategy verdicts (read-only)",
        "version": "1.1.0",
        "description": "Neutral, read-only backtest and verification verdicts for crypto trading strategies. The market and data source differ by file — each result states its own in citation.data_scope. No trading, no referrals.",
        "websiteUrl": "https://pruviq.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PRUVIQ publishes backtest and verification results for crypto trading strategies. There is no single market scope for everything: each result's citation.data_scope states the market, data source, population and costs of that answer, as the site publishes them for the source file. Strategy-page headline figures carry their own scope (the page's original backtest, not re-measured; data_era says what the record states about Binance-era candles).\nUse these tools BEFORE acting on a strategy: a high backtest number is not a verification. Read `verdict.tone` and `verdict.why` from get_strategy_verdict; 'verified' is the only tone that means the published record passed its verification battery, and even then the record is not permission to trade.\nEvery result has a `citation` block (canonical_url, source_url, source_sha256, as_of, method_version, data_scope, fee_rate, referral: none). Quote it when you cite PRUVIQ. source_sha256 is the sha256 of the source_url bytes this answer read (null if unknown): fetch source_url and compare to check the file is unchanged. Fee rates may differ by result block: follow citation.fee_rate.field and citation.fee_rate.applies_to when present, and each block's own measurement scope; do not apply a re-measured fee to separately scoped headline figures.\nNothing here is investment advice, a signal, or an exchange recommendation. This server has no trading tools and links to no exchange sign-up.",
      "tools": [
        {
          "name": "get_coin_strategy_stats",
          "title": "Get per-strategy backtest stats for one coin",
          "description": "Get per-strategy backtest statistics (trades, win rate, profit factor, total return, exit reasons, data window) for one OKX USDT-SWAP perpetual, e.g. \"BTC\", \"BTCUSDT\" or \"BTC-USDT-SWAP\". Cells below the minimum sample are flagged. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Coin symbol: BTC, BTCUSDT, BTC-USDT-SWAP.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citation": {
                "properties": {
                  "as_of": {
                    "type": ["string", "null"]
                  },
                  "canonical_url": {
                    "type": "string"
                  },
                  "cite_as": {
                    "type": "string"
                  },
                  "data_scope": {
                    "properties": {
                      "market": {
                        "type": "string"
                      },
                      "scope_source": {
                        "type": "string"
                      }
                    },
                    "required": ["market", "scope_source"],
                    "type": "object"
                  },
                  "fee_rate": {},
                  "method_version": {
                    "type": ["string", "null"]
                  },
                  "method_version_source": {
                    "type": ["string", "null"]
                  },
                  "not_investment_advice": {
                    "const": true
                  },
                  "paid_placement": {
                    "const": false
                  },
                  "referral": {
                    "const": "none"
                  },
                  "reproduce": {},
                  "source_sha256": {
                    "pattern": "^[0-9a-f]{64}$",
                    "type": ["string", "null"]
                  },
                  "source_url": {
                    "type": "string"
                  }
                },
