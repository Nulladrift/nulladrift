                    },
                    "remedy": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["products", "recallNumber", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok", "unavailable"],
                "type": "string"
              }
            },
            "required": ["notice", "query", "status"],
            "type": "object"
          },
