        {
          "name": "search_food_drug_recalls",
          "title": "Search food and drug recalls",
          "description": "Use this when the user asks about a recall of food, infant formula, a dietary supplement or a medicine, such as \"was there a recall on this baby formula?\" or \"any supplement recalls this week?\". Set category to \"food\" (human food, infant formula and supplements) or \"drug\", or leave it out and both are searched. For pet food use search_pet_food_recalls. Pass the product words as labels use them (\"infant formula\", \"peanut butter\"). Set withinDays for recent recalls, such as 7 for this week. Returns FDA enforcement reports, product-title hits before ingredient-text hits, each with matchKind (\"product\" or \"text\"), the class, product, reason, firm, lot codes and distribution. The matches count is text matches across reports, not a product total. It does not cover pet food, or meat, poultry and egg products regulated by USDA.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional. \"food\" covers human food, infant formula and dietary supplements (not pet food); \"drug\" covers medicines. Leave it out and both are searched, and each recall says which one it is.",
                "enum": ["food", "drug"],
                "type": "string"
              },
              "limit": {
                "description": "Most recalls to return, newest first (default 5), up to 1000. At most 10 come back in one answer: a larger number is read as 10, and the answer says so.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product words as on the label, such as \"infant formula\", \"peanut butter\" or \"ibuprofen\"",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "withinDays": {
                "description": "Only recalls reported in the last this many days, such as 7 for this week",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "description": "The categories this answer covers: the one asked for, or both when none was sent",
                "items": {
                  "enum": ["food", "drug"],
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "enum": ["food", "drug"],
                "type": "string"
              },
              "matches": {
                "description": "Count of matching enforcement reports in openFDA (includes text and ingredient matches, not a product-recall total)",
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "moreAvailable": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "recalls": {
                "items": {
                  "properties": {
                    "category": {
                      "description": "Which FDA list this recall came from: \"food\" or \"drug\"",
                      "enum": ["food", "drug"],
                      "type": "string"
                    },
                    "classification": {
                      "type": ["string", "null"]
                    },
                    "codes": {
                      "type": ["string", "null"]
                    },
                    "distribution": {
                      "type": ["string", "null"]
                    },
                    "initiatedOn": {
                      "type": ["string", "null"]
                    },
                    "matchKind": {
                      "description": "\"product\" when search terms appear in the product name or title; \"text\" when terms appear only in ingredients, allergen warnings or descriptions",
                      "enum": ["product", "text"],
                      "type": "string"
                    },
                    "product": {
                      "type": ["string", "null"]
                    },
                    "reason": {
                      "type": ["string", "null"]
                    },
                    "recallNumber": {
                      "type": "string"
                    },
                    "recallingFirm": {
                      "type": ["string", "null"]
                    },
                    "reportUrl": {
                      "type": ["string", "null"]
                    },
                    "reportedOn": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["matchKind", "recallNumber"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok", "unavailable"],
                "type": "string"
              },
              "unreadCategories": {
                "description": "A list that could not be read this time: the answer is partial, names what it covers, and is not kept for a retry",
                "items": {
                  "enum": ["food", "drug"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["categories", "notice", "query", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Search food and drug recalls",
            "openai/toolInvocation/invoking": "Search food and drug recalls..."
          },
          "digest": "sha256:2709cbd05e6657027e0ae0372f2d2fcf98b12ced9c6370b07a00de385b7b2060"
        },
        {
          "name": "search_pet_food_recalls",
          "title": "Search pet food recalls",
          "description": "Use this when the user asks about a recall of dog food, cat food, pet treats or other pet food, such as \"dog food recall this week\". Optionally pass a brand or hazard as query, and set withinDays for recent recalls, such as 7 for this week. Returns matching FDA recall announcements, newest first, with the title, date, summary and FDA link. It only sees the FDA's 20 most recent recall announcements (about three weeks) and says so, so for an older recall point the user to the FDA recalls page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most recalls to return, newest first (default 5), up to 1000. At most 10 come back in one answer: a larger number is read as 10, and the answer says so.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional brand or hazard to look for, such as \"Purina\" or \"salmonella\"; leave out to list every recent pet food recall",
                "maxLength": 100,
                "type": "string"
              },
              "withinDays": {
                "description": "Only announcements from the last this many days, such as 7 for this week",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "coveredFrom": {
                "type": ["string", "null"]
              },
              "matches": {
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "moreAvailable": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "otherPetFoodRecalls": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "recalls": {
                "items": {
                  "properties": {
                    "announcedOn": {
                      "type": ["string", "null"]
                    },
                    "summary": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok", "unavailable"],
                "type": "string"
              }
            },
            "required": ["notice", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
