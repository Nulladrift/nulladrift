          "digest": "sha256:ab7e9fb6b7b5876888208604084272c7f8378aa4b77c522a5f60da6099741dda"
        },
        {
          "name": "search_product_recalls",
          "title": "Search product recalls",
          "description": "Use this when the user asks whether a consumer product is recalled, such as a crib, stroller, toy, appliance, heater or tool, or \"is this car seat recalled?\" (for car seat accessories). Pass the brand and product as on the label. Returns matching U.S. Consumer Product Safety Commission recalls, newest first, with the hazard, the remedy, the company contact and the CPSC link. Set withinDays for recent recalls only. Car seats and tires themselves are NHTSA recalls this tool cannot see, and the answer says so. It does not cover vehicles, food or drugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most recalls to return, newest first (default 5), up to 1000. At most 10 come back in one answer: a larger number is read as 10, and the answer says so.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Brand and product as on the label, such as \"Graco car seat\" or \"Fisher-Price sleeper\"",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "withinDays": {
                "description": "Only recalls announced in the last this many days, such as 7 for this week",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "moreAvailable": {
                "type": "boolean"
              },
