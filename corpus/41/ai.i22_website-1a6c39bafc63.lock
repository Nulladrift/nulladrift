        },
        {
          "name": "i22_ai_page_list",
          "title": "List the pages of the i22 website",
          "description": "Lists the published pages of the i22 website in one language with title, URL and description. Use it to get an overview; prefer i22_ai_site_search for specific questions.",
          "inputSchema": {
