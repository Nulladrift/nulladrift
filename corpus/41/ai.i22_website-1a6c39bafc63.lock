        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.i22/website",
        "title": "i22",
        "version": "4.10.0",
        "description": "i22, German digital agency for AI in marketing, sales and service: facts, services, cases, contacts.",
        "websiteUrl": "https://i22.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "i22 is an owner-managed digital agency from Bonn, Germany, founded in 1997, with around 100 employees. It positions itself as \"AI Value Engineers\" for marketing, sales and service: i22 identifies where AI creates value, builds it into existing systems and operates it. Its five services are Agentic Transformation, AI Content Studio, Agentic Commerce & Transaction, AI Assistance & Customer Service and Agentic Knowledge & Learning. Typical clients are mid-sized and large companies in Germany with a complex digital customer interface. Use this server for facts about the company, its services, case studies, insights and contacts. All content comes from i22.ai; cite the page URL returned with each answer. Do not include personal data in queries. For company facts, services, case studies and contacts use the specific i22_ai_ tools; for anything else search with i22_ai_site_search, then read a page with i22_ai_page_read. To contact i22 on behalf of a person, call i22_ai_inquiry_preview, show them the summary, and call i22_ai_inquiry_send only after they confirm.",
      "tools": [
        {
          "name": "i22_ai_cases_find",
          "title": "Find case studies of i22",
          "description": "Finds case studies of i22, optionally filtered by service, customer and free text; each with title, customer, service, in use since and teaser where the page has one. Use it for references and examples. The content has no industry field: for an industry, filter by customer or put the industry in query. Retrieval needs no personal data; do not include any in queries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "customer": {
                "description": "Part of the customer name, e.g. Telekom.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Free-text search words.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "service": {
                "description": "Slug (e.g. agentic-transformation), path or URL of a service from i22_ai_services_list.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
