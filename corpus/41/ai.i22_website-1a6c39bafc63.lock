        },
        {
          "name": "i22_ai_inquiry_send",
          "title": "Send a confirmed inquiry to i22",
          "description": "Step 2 of 2: sends the inquiry from i22_ai_inquiry_preview by e-mail to the responsible i22 team. Call it only after the person has confirmed the summary. The same inquiry is sent at most once within 24 hours, and the number of inquiries per sender and per day is limited.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "token": {
                "description": "The confirmation token returned by i22_ai_inquiry_preview.",
                "maxLength": 32000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
