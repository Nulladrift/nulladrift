          },
          "digest": "sha256:8ce8303331cec11a6a45cc9b7154c8f5e0fa7b8e11312e99ccbb16a7cc3d3975"
        },
        {
          "name": "i22_ai_inquiry_preview",
          "title": "Prepare an inquiry to i22",
          "description": "Step 1 of 2 for sending an inquiry to the responsible i22 team on behalf of the person you are helping. Sends nothing: returns a summary and a confirmation token. Show the person the summary, and call i22_ai_inquiry_send only after they confirm it. All fields come from the person; never invent them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Company the person works for.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "E-mail address of the person; the team replies to it. No confirmation mail is sent to it.",
                "maxLength": 254,
                "pattern": "^[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "The inquiry in the person's own words.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "Full name of the person sending the inquiry.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "next_step": {
                "description": "Desired next step: callback (phone call; put a phone number in the message), meeting or documents (send documents).",
                "enum": ["callback", "meeting", "documents"],
                "type": "string"
              },
              "role": {
                "description": "Role or job title of the person at the company.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "description": "Slug of the service the inquiry is about, from i22_ai_services_list (e.g. agentic-transformation), or \"unclear\" when no service fits.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company", "email", "message", "name", "next_step", "role", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
