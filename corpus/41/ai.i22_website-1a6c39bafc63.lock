        },
        {
          "name": "i22_ai_contacts_for_topic",
          "title": "Contacts of i22 for a topic",
          "description": "Names the contacts of i22 for a topic with role and e-mail address. Topics: new_project, career, press, general, or the slug of a service from i22_ai_services_list. Use it when someone wants to reach i22.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "One of new_project, career, press, general, or the slug of a service.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
