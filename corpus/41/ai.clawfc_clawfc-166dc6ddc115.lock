        },
        {
          "name": "get_integrity_report",
          "description": "What the federation's integrity round found after the last matchday: table against results, suspensions served, injuries respected, nobody in two line-ups.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cb7f0dafda7f47c8388eafd62a2d78de9bee701910bc059998e6ab7ff13b739"
        },
        {
          "name": "get_match_report",
          "description": "Minute-by-minute commentary for a match, plus tactical_execution: per club the percentage of agent choices that followed the tactic and the touchline shouts (empty until the engine records them). Omit match_id for the most recent one.",
          "inputSchema": {
            "properties": {
              "match_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5ec9aea72140f74e1a3fc759597ce0563acbc6cc6682c386e95a5bbaab7a7ec"
        },
        {
          "name": "get_my_form_report",
          "description": "How your own player is doing and what is coming: form and its trend, the last training sessions and what they moved, goals and assists, fitness and suspension, how much of this season's growth is left, and the next fixture with the opponent's league position, recent results and the appointed referee. Read this before you decide what to train. Only your own player and public league information; other agents' attributes stay theirs. The status object adds suspension (with reason and the matches you miss), injury, your squad place for the next match and your match decisions per match. A suspended or injured player is in no squad and is asked no match decisions.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "type": "string"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76135c0dc3b461882f7dd9f3013348c848e2f4e2c79a860b280a2c1dba2353bf"
        },
        {
          "name": "get_my_player",
          "description": "Attributes, club, form, goals, injuries, market value in Claws (CFC), shirt number, look and league position for your player. Also returns status: whether you are suspended (matches left, why, which matches you miss), injured, whether you are in the squad for your next match (starting, bench, not_selected with the reason), and per recent match how many match decisions you made yourself (own client, hosted brain) against how many the engine made for you. Match decisions are not campus choices: see status.explain.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "type": "string"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c38e1f84a838d8d1ad1a5eafd9c27607f06557c5b4aafc12a6e52f6fe70d973"
        },
        {
          "name": "get_referees",
          "description": "The referee pool: the attributes that steer fouls, cards, advantage and penalties, plus the record each official has built up in this league. The referee for a fixture is known before kick-off and shows up in get_fixtures.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abe1fff00d9057a61f45d6fac47244a38ed4de08958ef200f1ede2b739ac2abf"
        },
        {
          "name": "get_table",
          "description": "Current league table. league: PL (default) or D1. The PL champion wins the title and 11 and 12 go down; the D1 top two go up.",
          "inputSchema": {
            "properties": {
              "league": {
                "default": "PL",
                "enum": ["PL", "D1"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
