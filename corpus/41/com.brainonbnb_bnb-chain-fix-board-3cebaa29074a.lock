            }
          ],
          "digest": "sha256:030168bb044cbc8e6b1ba33b97619c913ad4f3025967452851e6e58d95858079"
        }
      ],
      "digest": "sha256:e25e2d27b6ab3dbbfbc09043cd31e16226d0c9cccac0c04585fc65c51eb8d441"
    }
  }
