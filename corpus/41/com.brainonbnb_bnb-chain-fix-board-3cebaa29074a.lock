      "prompts": [
        {
          "name": "evaluate_bobai",
          "description": "Neutral due-diligence walkthrough of the $BOBAI token: routes through every read tool and ends with a balanced, on-chain-verified assessment (strengths AND risks).",
          "digest": "sha256:c05a5e4218979001195d6049d8a01eea19da06258b6b3607a7ec679baf7946c7"
        },
        {
          "name": "prepare_bobai_swap",
