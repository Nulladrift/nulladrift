          },
          "digest": "sha256:bc5c6afcde623d0876ce4e9494370e9284a3addacf41ef088b3a4b704bf3ddac"
        },
        {
          "name": "get_business",
          "description": "Get one business's record by id (ab_bus_*) or slug. Includes capabilities (availability/booking/reschedule/cancellation/payment) — NEVER promise an action whose flag is false — plus _links to the service list, availability endpoint and booking flow, and per-service bookingRequirements (e.g. whether customer phone is required).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "ab_bus_* id or public slug, e.g. 'agentbookable-demo'",
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:227d63f624c45e405cb9235e36c58358cce026f73950e2fd2cd0d772d3d04fe1"
        },
        {
          "name": "list_services",
          "description": "List the services a business has opened to AI booking. Each service has a durationMinutes and bookingRequirements telling you what customer details to collect (name/email/phone) BEFORE booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "description": "ab_bus_* id or slug",
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f6c7f36fe5c83afe55ac6bc8dc99733264e3e8557d4b5015ab1de637984fa8c"
        },
        {
          "name": "prepare_booking",
          "description": "Prepare a booking draft: the concrete proposal (business, service, time, customer) to show the user. Validates live availability and customer requirements — if requirements are missing you get MISSING_CUSTOMER_REQUIREMENT: ask the user for those details first, then call again. Show the returned draft to the user as the final proposal (business, service, duration, date/time), then obtain explicit affirmative consent. The draft expires after 30 minutes; consent binds to this exact proposal.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actorRef": {
                "description": "Your agent/session identifier for the audit trail",
                "type": "string"
              },
              "businessId": {
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "timezone": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "serviceId": {
                "type": "string"
              },
              "slot": {
                "additionalProperties": false,
                "properties": {
                  "end": {
                    "type": "string"
                  },
                  "staffId": {
                    "type": "string"
                  },
                  "start": {
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "slotId": {
                "description": "Slot id from get_availability (preferred)",
                "type": "string"
              }
            },
            "required": ["actorRef", "businessId", "customer", "serviceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
