{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentbookable/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentbookable.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentbookable",
        "version": "3.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_booking",
          "description": "Create a REAL appointment. CONSEQUENCEFUL: only after the user has explicitly chosen a slot and authorized the booking in their own words. Flow: (1) check the service's bookingRequirements and collect any required customer details (e.g. phone); (2) create a mandate via the create_mandate tool with the user's exact instruction; (3) call this tool with the mandateRef. The mandate is single-use and expires in 15 minutes. On SLOT_NO_LONGER_AVAILABLE offer the returned alternatives — never rebook unilaterally.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "description": "Required when the service's bookingRequirements.phone is 'required'",
                    "type": "string"
                  },
                  "timezone": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "draftId": {
                "description": "Booking draft the user consented to (from prepare_booking). When given, the request must match the draft exactly or booking fails with CONSENT_DRAFT_MISMATCH.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Stable key; safe retries return the original booking",
                "type": "string"
              },
              "mandateRef": {
                "description": "From create_mandate (or create_mandate_for_draft) — records the user's authorization",
                "type": "string"
              },
              "serviceId": {
                "type": "string"
              },
              "slot": {
                "additionalProperties": false,
                "properties": {
                  "end": {
                    "type": "string"
                  },
                  "staffId": {
                    "type": "string"
                  },
                  "start": {
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "slotId": {
                "description": "Slot id from get_availability (preferred)",
                "type": "string"
              }
            },
            "required": ["businessId", "customer", "mandateRef", "serviceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:654f0234fa58343ef9f60b06cee1e0f86116128ab9da0a39740942a67bf94069"
        },
        {
          "name": "create_mandate",
          "description": "Legacy: record the user's authorization WITHOUT a booking draft. Prefer the draft flow: prepare_booking → show proposal → user agrees → create_mandate_for_draft → create_booking with draftId. The draft flow binds consent to the exact appointment the user saw.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["create_booking", "reschedule_booking", "cancel_booking"],
                "type": "string"
              },
              "actorRef": {
                "description": "Your agent/session identifier, recorded in the audit trail",
                "type": "string"
              },
              "businessId": {
                "description": "Bind the mandate to this business",
                "type": "string"
              },
              "instruction": {
                "description": "The user's exact words — never fabricate or paraphrase",
                "type": "string"
              },
              "serviceId": {
                "type": "string"
              }
            },
            "required": ["action", "actorRef", "businessId", "instruction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cc3db6923acc1a53bbc87755e2f8793ad673c733441062540f0fac119766c2a9"
        },
        {
          "name": "create_mandate_for_draft",
          "description": "After the user explicitly agrees to the exact proposal in the draft (an affirmative reply such as 'yes, book it' — the user having already seen business, service, date and time), assert consent here to get a single-use mandate bound to that draft. consentObtained must be true; this assertion is audited. If anything consequential changes (different time, service or business), prepare a NEW draft and get fresh consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actorRef": {
                "description": "Your agent/session identifier, recorded in the audit trail",
                "type": "string"
              },
              "consent": {
                "additionalProperties": false,
                "properties": {
                  "consentMethod": {
                    "description": "How, e.g. 'chat reply: yes, book it' or 'spoken yes'",
                    "type": "string"
                  },
                  "consentObtained": {
                    "const": true,
                    "type": "boolean"
                  },
                  "consentedBy": {
                    "description": "Who consented, e.g. 'the customer'",
                    "type": "string"
                  },
                  "draftId": {
                    "type": "string"
                  },
                  "instruction": {
                    "description": "The user's exact consenting words, for the audit trail",
                    "type": "string"
                  }
                },
                "required": ["consentObtained", "draftId"],
                "type": "object"
              },
              "draftId": {
                "description": "The draft the user consented to (from prepare_booking)",
                "type": "string"
              }
            },
            "required": ["actorRef", "consent", "draftId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:329c9168e1f00c30c199971a421370b65b8f76e217499f3d96446f793b135c96"
        },
        {
          "name": "find_businesses",
          "description": "Search the AgentBookable registry for businesses that accept AI bookings. Search by free text, category, city, service name or geo radius. ALWAYS start here — the results include capability flags and _links telling you the exact next endpoints.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "city": {
                "description": "e.g. 'Civray'",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "longitude": {
                "type": "number"
              },
              "query": {
                "description": "Free text on name/category/description/services, e.g. 'hairdresser'",
                "type": "string"
              },
              "radiusKm": {
                "type": "number"
              },
              "service": {
                "description": "Service name, e.g. 'Haircut'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bec46e84c1230d6f7b87c96bd0b0090dc40f459df6f8c5c26c30ab3385beb4e7"
        },
        {
          "name": "get_availability",
          "description": "Find LIVE availability for a service. Always call this immediately before create_booking — slots are temporary (~60s) and revalidated at booking. Pass an ISO-8601 window; use a slot id from the result when booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businessId": {
                "type": "string"
              },
              "from": {
                "description": "ISO-8601 window start, e.g. 2026-09-01T00:00:00Z",
                "type": "string"
              },
              "serviceId": {
                "type": "string"
              },
              "to": {
                "description": "ISO-8601 window end",
                "type": "string"
              }
            },
            "required": ["businessId", "from", "serviceId", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ec0e2830e48e919283518246a9975acf1d295d599f5a0d21054ba2d07d8e0637"
        },
        {
          "name": "get_booking",
          "description": "Retrieve a booking by its AgentBookable id (bb_bkg_*). Requires the mandateRef issued for that booking (from create_booking / create_mandate). Provider identity is never returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bookingId": {
                "type": "string"
              },
              "mandateRef": {
                "description": "Mandate ref returned when the booking was authorized/created",
                "type": "string"
              }
            },
            "required": ["bookingId", "mandateRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
