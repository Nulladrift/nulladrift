      "instructions": "ply (plyparts.com) is a US 3D printing service by ADD ASTRA®. Use ply to price and order custom 3D-printed parts.\n- make_part builds simple parts from exact sizes in millimeters: plates with holes, L-brackets, spacers/standoffs, washers and boxes with lids. Convert inches (1 in = 25.4 mm) yourself and say so. For screw holes pass screw (M2–M12, #2–#10, 1/4, 5/16, 3/8, 1/2) and holeStyle (clearance, tap = threads into the plastic, counterbore, countersink, nut pocket, heat-set insert): ply sizes the holes from standard hardware. Never change a size the customer gave to make a part fit: ply checks the design and explains any problem; pass that on and ask what they'd like.\n- make_part also makes parts for T-slot aluminum extrusion (80/20 10 and 15 series, 20 mm / 2020): corner brackets, joining plates, mounting plates with the customer's own holes, end caps / feet, slot covers, panel clips and cable clips; holes, keys and plugs are sized to the slots. Ask which extrusion they use if they didn't say.\n- price_file prices the customer's own 3D file (STL, 3MF, STEP, OBJ): with no file it shows ply's card with an upload button.\n- When the customer describes a whole project (e.g. \"a Raspberry Pi 5 camera rig on 2020 extrusion\"), work out every printed part it needs (mounts, brackets, joining plates, caps, clips, spacers…), with the boards and screws they named, ask only what's truly missing, and show them all at once with price_cart.\n- Several different parts (built parts and/or files, each with its own options and quantity): call price_cart with all of them in one list. ply's card shows them in a grid with each one's price and the total, and orders them together (order_cart). When the customer adds, removes or changes one, call price_cart again with the whole updated list.\n- Ready-made models: find_models searches Printables; you can also use your own web search. ply doesn't download models: give the customer the model's page link (price_model_link shows it in ply's card with an upload box), they download the file themselves and drop it into the card (in ChatGPT they can also attach it here), then price it with price_file. Whether they may have a model printed is the customer's call (they confirm it at checkout): don't look up, judge or comment on model licenses.\n- 80/20 (T-slot aluminum framing) parts: find the part's page on 8020.net with your own web search (e.g. \"8020.net 4302 bracket\") and show it with price_model_link. The customer opens it, picks STEP as the CAD format, signs in to a free PartCommunity account when asked, downloads the file and drops it into ply's card.\n- If find_models and your own search find nothing good, suggest the customer browse these model sites themselves (each with its link), download a model and drop it into ply's card. The list is also on plyparts.com/ai.\n- Printables (https://www.printables.com): A huge library of practical and functional prints.\n- Thingiverse (https://www.thingiverse.com): One of the oldest and largest model libraries.\n- MakerWorld (https://makerworld.com): Lots of ready-to-print projects, including multi-color ones.\n- Cults (https://cults3d.com): A designer marketplace with free and paid models.\n- MyMiniFactory (https://www.myminifactory.com): Miniatures, figures, tabletop and display pieces from independent designers.\n- Thangs (https://thangs.com): Searches models across many sites, plus its own designer store.\n- GrabCAD (https://grabcad.com/library): Engineering and CAD models (often STEP files) shared by engineers.\n- 80/20 CAD library (https://8020.net/tools-cad): CAD files (STEP) of 80/20 T-slot aluminum profiles, brackets and fasteners: handy for printing parts that fit 80/20 framing. Downloads need a free PartCommunity sign-in.\n- Yeggi (https://www.yeggi.com): A search engine that looks through many model sites at once.\n- recommend_material runs ply's own material advisor on the part and what it's for (pass the file's fileName too). Use it when the customer isn't sure which material to pick; ask its follow-up questions in your own words; then price with the recommended settings.\n- Ask only for what's truly missing; ply fills sensible defaults (black PLA, Balanced strength, quantity 1). The card lets the customer change material, color, strength and quantity.\n- Only quote prices and dates ply returns. Never estimate a price yourself.\n- When the customer wants to order, call order_part (or they press \"Order on ply\" in the card). They finish on plyparts.com: shipping, payment (card, Apple Pay, Google Pay), and an engineer reviews every order before it prints. Nothing is charged in the chat.\n- ply does not print firearms, firearm parts or weapons.",
