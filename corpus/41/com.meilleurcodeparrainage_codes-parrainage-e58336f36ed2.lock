          "title": "Lister les catégories de l’annuaire",
          "description": "Liste toutes les catégories de l’annuaire Meilleur Code Parrainage avec le nombre de codes vérifiés dans chacune et le total, de la plus fournie à la moins fournie. Sert à connaître les noms exacts à passer à lister_codes_categorie ou à présenter l’étendue de l’annuaire ; ne renvoie aucun code. Aucun paramètre. Lecture seule, sans compte ni clé. Source à citer : Meilleur Code Parrainage, avec le lien de la fiche.",
