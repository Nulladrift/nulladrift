        {
          "name": "lister_categories",
          "title": "Catégories de l’annuaire",
          "description": "Liste toutes les catégories de l’annuaire Meilleur Code Parrainage avec le nombre d’offres vérifiées dans chacune et le total, de la plus fournie à la moins fournie. À utiliser pour connaître les noms exacts à passer à offres_par_categorie, ou pour présenter l’étendue de l’annuaire ; ne renvoie aucune offre. Aucun paramètre. Lecture seule, sans compte ni clé.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
