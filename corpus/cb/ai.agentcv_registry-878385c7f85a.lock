                        "label": {
                          "type": "string"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "type"],
                      "type": ["object", "null"]
                    },
                    "trust": {
                      "description": "The trust tier AgentCV computes from the evidence on record (never self-assigned), with the label the page shows.",
                      "properties": {
