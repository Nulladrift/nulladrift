        {
          "name": "search_teams",
          "title": "Search AgentCV teams",
          "description": "Search the public AgentCV registry of AI agent teams. Returns public teams only, in the site’s default order: operated teams first, then reference designs (designs documented from papers, framework docs or vendor material that no one is known to run), then clearly labelled illustrative demos. Each team has its layer (real = registered by its owner, curated = documented by AgentCV from cited public sources, illustrative = demo), size wording, platform, topology, trust tier and page URL. All filters are optional and combine with AND. Pages of up to 20; pass nextCursor back as cursor for the next page. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page; omit for the first page.",
                "pattern": "^o[0-9]{1,6}$",
                "type": "string"
              },
              "layer": {
                "description": "real = registered by its owner; curated = documented by AgentCV from cited public sources; illustrative = clearly labelled demo.",
                "enum": ["real", "curated", "illustrative"],
                "type": "string"
              },
              "limit": {
                "description": "Teams per page, 1–20 (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "A platform hub slug (see list_platforms): teams whose own platform or any listed member’s platform belongs to that hub.",
                "enum": ["grok-bot", "hermes-agent", "claude", "openai-codex", "openclaw", "crewai", "langgraph", "autogen", "n8n"],
                "type": "string"
              },
              "query": {
                "description": "Text to find in a team’s name, tagline or description (case-insensitive substring), as the search box on agentcv.ai/teams.",
                "maxLength": 200,
                "type": "string"
              },
              "topology": {
                "description": "The team’s declared topology type.",
                "enum": ["orchestrator_worker", "supervisor", "swarm", "pipeline", "router", "solo_plus_tools", "other"],
                "type": "string"
              },
              "use_case": {
                "description": "A use-case hub slug (see list_use_cases).",
                "enum": ["code-review", "software-delivery", "bug-fixing", "testing-qa", "code-migration", "research-analysis", "customer-support", "data-sql", "ops-sre", "marketing-content", "general-assistant"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "nextCursor": {
                "type": ["string", "null"]
              },
              "order": {
                "type": "string"
              },
              "returned": {
                "type": "integer"
              },
              "teams": {
                "items": {
                  "properties": {
                    "class": {
                      "enum": ["operated", "reference_design", "illustrative"],
                      "type": "string"
                    },
                    "layer": {
                      "enum": ["real", "curated", "illustrative"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "platform": {
                      "type": ["string", "null"]
                    },
                    "referenceDesign": {
                      "description": "Set when the profile is a reference design: a design documented from a paper, framework docs or vendor material that no one is known to operate. null for every other team.",
                      "properties": {
                        "kind": {
                          "enum": ["research", "framework", "vendor_claim"],
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "note": {
                          "type": "string"
                        },
                        "summary": {
                          "type": "string"
                        }
                      },
                      "required": ["kind", "label", "note", "summary"],
                      "type": ["object", "null"]
                    },
                    "size": {
                      "description": "Team size as the site words it: kind \"total\" is the stated size (\"5 agents\"); kind \"listed\" is a curated team whose sources state no total (\"3 listed members\"). null when no size is stated.",
                      "properties": {
                        "count": {
                          "type": "integer"
                        },
                        "kind": {
                          "enum": ["total", "listed"],
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["count", "kind", "text"],
                      "type": ["object", "null"]
                    },
