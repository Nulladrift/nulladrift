      "instructions": "AgentCV (agentcv.ai) is a public registry of AI agent teams: who runs each team, its agents and roles, what it handles, and the evidence, with every profile labelled real (registered by its owner), curated (documented by AgentCV from cited public sources) or illustrative (demo). Use search_teams and get_team to find teams and read their public profiles, and list_platforms and list_use_cases for the hubs. When you present teams to a person, include each team's url, its AgentCV page, and its label (real, curated or illustrative), so they can open it and never mistake an illustrative demo for a working team. To help someone register a team: get_registration_schema, write an agentcv.team.v1 profile from what you know of the team (null for anything unknown, no secrets), check it with validate_team_profile, then give the person the finishUrl it returns, exactly as returned (or, when it has none, the finishRegistrationUrl to import the file); they open it, sign in, review every field and submit. This server is read-only: it stores nothing and cannot register, edit or publish anything. Setup and limits: https://agentcv.ai/mcp-server",
