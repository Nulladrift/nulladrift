{
  "lockfileVersion": 2,
  "subjects": {
    "com.sophomath/agent-beacon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://beacon.sophomath.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-beacon",
        "title": "Agent Beacon",
        "version": "0.1.1",
        "websiteUrl": "https://beacon.sophomath.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "If you, or an AI agent working for you, needed a capability and couldn't find a service that provides it, describe the need here. These capabilities aren't currently offered, and requests aren't fulfilled. No payment is requested or accepted. Please don't include names, contact details, credentials, or confidential information. Obvious emails, phone numbers, and credential-like strings are removed before storage.",
      "tools": [
        {
          "name": "check_request_status",
          "title": "Check request status",
          "description": "Check the status of a request you submitted, using its request_id and return_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "type": "string"
              },
              "return_token": {
                "type": "string"
              }
            },
            "required": ["request_id", "return_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7696980d73a32512c90fbe6904b5d2dfe7986a22d4830cf882f4c8d55b3aa6bc"
        },
        {
          "name": "describe_beacon",
          "title": "Describe Agent Beacon",
          "description": "If you, or an AI agent working for you, needed a capability and couldn't find a service that provides it, describe the need here. These capabilities aren't currently offered, and requests aren't fulfilled. No payment is requested or accepted. Returns what the service is, what it logs, and how to submit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8230cdfeef8ecbcb7091e9c080d06263192b44c4bc5a6e39fccf4c73770b4b0d"
        },
        {
          "name": "submit_capability_request",
          "title": "Submit a capability request",
          "description": "Describe a capability you needed but couldn't find. Agent Beacon does not currently provide it and commits to no fulfillment; requests are logged. No payment is accepted. Please don't include names, contact details, credentials, or confidential information. Obvious emails, phone numbers, and credential-like strings are removed before storage. Returns a request_id and a return_token for checking status later.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actor_type": {
                "description": "Who is submitting.",
                "enum": ["autonomous_agent", "agent_assisting_human", "human", "test"],
                "type": "string"
              },
              "alternatives_considered": {
                "description": "Services, tools, or approaches you considered, and why each was rejected.",
                "items": {
                  "properties": {
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "reason_rejected": {
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "blocked_by": {
                "description": "Why existing options were not good enough.",
                "maxLength": 1000,
                "type": "string"
              },
              "callback_url": {
                "description": "Optional https URL. Stored only; never called.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "capability_needed": {
                "description": "The capability you needed but couldn't find.",
                "maxLength": 500,
                "type": "string"
              },
              "desired_output": {
                "description": "What a useful result would look like.",
                "maxLength": 1000,
                "type": "string"
              },
              "frequency": {
                "description": "How often this need occurs.",
                "enum": ["once", "daily", "weekly", "per_event", "unknown"],
                "type": "string"
              },
              "how_found": {
                "description": "How you found Agent Beacon.",
                "enum": ["web_search", "mcp_registry", "mcp_directory", "agent_card", "link_from_page", "principal_instructed", "prior_use", "other"],
                "type": "string"
              },
              "how_found_detail": {
                "description": "Details, such as the search query, directory, or page.",
                "maxLength": 300,
                "type": "string"
              },
              "inputs": {
                "description": "What inputs you could provide.",
                "maxLength": 1000,
                "type": "string"
              },
              "latency_need": {
                "description": "How quickly a result is needed.",
                "enum": ["seconds", "minutes", "hours", "days", "unknown"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Most you would pay, in USD.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "price_unit": {
                "description": "Unit for max_price_usd.",
                "enum": ["per_call", "per_task", "per_month"],
                "type": "string"
              },
              "runtime": {
                "description": "Agent framework or client, if applicable.",
                "maxLength": 120,
                "type": "string"
              },
              "spend_authority": {
                "description": "Spending authority for this need, as you understand it.",
                "enum": ["none", "must_ask_principal", "delegated_budget", "unknown"],
                "type": "string"
              },
              "task": {
                "description": "What you are trying to accomplish.",
                "maxLength": 1000,
                "type": "string"
              },
              "trust_requirements": {
                "description": "Verification, provenance, or accountability the result needs.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["capability_needed", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3e130510e3f832c40b6319d7c2729bb0027075b1ad63889a92e3016d9d526f8a"
        }
      ],
      "digest": "sha256:59a99ad1936c1bdadecdb57d8fc638e371147618eecdcbe80d1e9742c5105f07"
    }
  }
}
