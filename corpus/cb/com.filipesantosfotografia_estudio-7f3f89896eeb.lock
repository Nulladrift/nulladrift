                "enum": ["casamento", "batizado", "corporativo", "empresa_ambientes", "retratos_empresa", "photobooth", "sessao_casal", "pedido_casamento", "sessao_exterior", "sessao_natal", "sessao_tematica", "evento_estudio", "impressoes", "outro"],
