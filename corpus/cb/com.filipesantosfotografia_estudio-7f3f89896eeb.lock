                "enum": ["base", "completo", "equipa", "familia", "natal", "aluguer_2h", "aluguer_4h", "aluguer_8h"],
                "type": "string"
              },
              "to_date": {
                "description": "Last day to check, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
