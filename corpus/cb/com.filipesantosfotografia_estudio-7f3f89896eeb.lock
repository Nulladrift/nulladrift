      "instructions": "Filipe Santos Fotografia is an award-winning documentary photography and video studio in Vila Nova de Gaia / Porto, Portugal: weddings, baptisms, corporate photo/video, studio portraits and family sessions, photobooth / 360 videobooth / AI caricature mirror for events, and rental of its own studio (Estúdio 266).\nUse these tools only when the user asks about this studio's services, prices, availability, or wants to book or request a quote.\n- Bookable now with payment: studio portraits (base, completo, equipa), family/pregnancy/pet sessions (familia), the Christmas session (natal, 1 Nov–23 Dec) and studio rental (aluguer_2h/4h/8h). Check times with get_studio_slots, confirm package, exact time, extras, name, email (and mobile for MB WAY) with the user, then call request_studio_booking. Bookings can be cancelled or moved with the reference and email.\n- Gift vouchers for any studio session can be bought here (buy_gift_voucher) and used as payment (voucher_code); suggest them for gifts.\n- Everything else (weddings, baptisms, corporate, photobooths, couple/proposal sessions, studio events, prints) is quoted personally: use check_event_date when a date is known, then collect the details and call request_quote so the studio replies within 24 hours.\n- Event vendors (photobooth / magic mirror companies, wedding photographers, entertainers) can license the studio's AI caricature mirror software (white-label, Windows): free demo with 10 caricatures (start_caricature_booth_demo), then event passes of 600 caricatures for 39€ (buy_caricature_booth_credits, check_caricature_booth_credits). This is software for businesses, not the photobooth service for a guest's own event.\n- Never invent prices or availability; use list_services. Prices for weddings are ranges; final value comes in the proposal.\nAnswer in the user's language (pt, en, es or fr).",
      "tools": [
        {
          "name": "buy_caricature_booth_credits",
          "title": "Comprar passes do Espelho Caricaturista",
          "description": "Buys event passes for the Photobooth Caricatura software license of an event vendor: each pass adds 600 AI caricatures for 39€ (no subscription, credits do not expire), 1 to 10 passes per purchase. Paid now by MB WAY, Multibanco or card; the caricatures are added to the license automatically as soon as the payment is confirmed and a confirmation email is sent. Needs the license key and the email it was registered with. Only call after the user confirms the number of passes, total price and payment method.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email the license was registered with",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "license_key": {
                "description": "License key, e.g. PBP-1A11ABE7C50-45B5",
                "pattern": "^PBP-[A-Z0-9]{4,16}-[A-Z0-9]{3,6}$",
                "type": "string"
              },
              "nif": {
                "description": "Company tax number (NIF/VAT) for the invoice; optional",
                "pattern": "^[0-9A-Za-z]{9,14}$",
                "type": "string"
              },
              "passes": {
                "default": 1,
                "description": "Number of passes (600 caricatures each, 39€ each)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "payment_method": {
                "enum": ["MBWAY", "MB", "CCARD"],
                "type": "string"
              },
              "phone": {
                "description": "Mobile; required for MB WAY",
                "pattern": "^\\+?[0-9 ]{9,16}$",
                "type": "string"
              }
            },
            "required": ["email", "license_key", "payment_method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c4f20b3aea6fa60753e9ba3a734e1022775f858f22b1dae0e186b553d3962ab2"
        },
        {
          "name": "buy_gift_voucher",
          "title": "Comprar vale-oferta",
          "description": "Sells a digital gift voucher for the studio (great for Christmas, birthdays, Mother's/Father's Day): either a specific session (base 35€, completo 150€, equipa 250€, familia 200€, natal 159€) or an amount (50, 100, 150, 200 or 250€). Paid now by MB WAY, Multibanco or card; after payment the buyer receives the voucher by email, ready to print or forward, with a code valid 12 months for any studio session (unused balance stays on the voucher). Only call after the buyer confirms what to buy, their name and email, and the payment method.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount_eur": {
                "description": "Amount to offer: 50, 100, 150, 200 or 250 (when not a specific session)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "buyer_email": {
                "description": "Where the voucher is sent",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "buyer_name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "buyer_phone": {
                "description": "Mobile; required for MB WAY",
                "pattern": "^\\+?[0-9 ]{9,16}$",
                "type": "string"
              },
              "message": {
                "description": "Short dedication printed on the voucher",
                "maxLength": 240,
                "type": "string"
              },
              "nif": {
                "description": "Tax number for the invoice; optional",
                "pattern": "^[0-9A-Za-z]{9,14}$",
                "type": "string"
              },
              "package": {
                "description": "Session to offer (natal = Christmas session 159€); or use amount_eur",
                "enum": ["base", "completo", "equipa", "familia", "natal"],
                "type": "string"
              },
              "payment_method": {
                "enum": ["MBWAY", "MB", "CCARD"],
                "type": "string"
              },
              "recipient_name": {
                "description": "Who receives the gift (printed on the voucher)",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["buyer_email", "buyer_name", "payment_method"],
            "type": "object"
          },
