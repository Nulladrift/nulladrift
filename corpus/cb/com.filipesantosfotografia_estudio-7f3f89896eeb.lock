        {
          "name": "request_studio_booking",
          "title": "Pré-reservar sessão de estúdio",
          "description": "Pre-books a studio portrait, family session or studio rental at a free slot from get_studio_slots and starts payment. Only call after the user has explicitly confirmed the package, the exact start time and their contact details. Suggest MB WAY first (instant); a Multibanco reference is only possible for sessions more than 48 h away. A gift voucher or studio credit code (FSF-XXXX-XXXX) pays all or part of the price. The slot is held for a limited time (hold_expires_at) and the booking is confirmed once paid. Offer extra edited photos (5€ each) and make-up when relevant. Calling again with the same email, package and time returns the same pre-booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Client's email for confirmation and payment instructions",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "extra_photos": {
                "default": 0,
                "description": "Extra edited photos on top of the package, 5€ each",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "extras": {
                "default": [],
                "description": "Optional add-ons: exterior (+75€, outdoor session), maquilhagem (+120€), cabelo_maquilhagem (+200€); assistente_iluminacao (+61.50€) only for studio rental",
                "items": {
                  "enum": ["exterior", "maquilhagem", "cabelo_maquilhagem", "assistente_iluminacao"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "name": {
                "description": "Client's full name",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "nif": {
                "description": "Tax number (NIF) for the invoice, e.g. for companies; optional",
                "pattern": "^[0-9A-Za-z]{9,14}$",
                "type": "string"
              },
              "notes": {
                "description": "What the photos are for (e.g. LinkedIn, website); optional",
                "maxLength": 500,
                "type": "string"
              },
              "package": {
