{
  "lockfileVersion": 2,
  "subjects": {
    "com.pinsharing/maps": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pinsharing.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pinsharing",
        "title": "MapIron Maps",
        "version": "0.1.0",
        "websiteUrl": "https://mapiron.com/docs/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MapIron: geocoding, reverse geocoding and static map images from OpenStreetMap data, plus a privacy area map that shows roughly where a place is without revealing the exact point, and US property parcel lookups (parcel_lookup; Growth plans and up). Each geocode call counts 1 address lookup and each map image 1 static image against the account's monthly cap; caps are hard and nothing is billed for overage. Results may be stored (30 days on the Free plan, indefinitely on paid plans). Always show the attribution \"© OpenStreetMap contributors\" with results and maps.",
      "tools": [
        {
          "name": "district_lookup",
          "title": "Find Texas special taxing districts (MUD, WCID, PID) at a point",
          "description": "List the Texas special taxing districts that contain a latitude/longitude: municipal utility districts (MUD), water control and improvement districts (WCID), fresh water supply, levee and management districts statewide (TCEQ), and public improvement districts (PID) where cities publish them (coverage in the answer). For each: name, type, status, counties, the district's self-reported tax rate per $100 of taxable value with its report year, outstanding debt (Texas Comptroller), website, and the statute for the purchaser's notice (Texas Water Code §49.452 or Property Code §5.014). Geocode an address first (geocode tool) or use a point inside the parcel (parcel_lookup). result is districts_found, none_found or outside_coverage. none_found is NOT proof that no district applies; near_boundary and nearby mean the lot may straddle a boundary. Report null figures as unknown, never infer a tax rate, and never say whether a notice is required: cite the statute and the district's own notice form. Growth plans and up; counts 1 address lookup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "none",
                "description": "Include each district's boundary",
                "enum": ["none", "simplified", "full"],
                "type": "string"
              },
              "include_inactive": {
                "default": false,
                "description": "Also list inactive or dissolved districts",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude of the property (a point inside the parcel is best)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the property",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Texas special taxing districts (MUD, WCID, PID) at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b17ddff93dfbebd7b3cbb9e9fca4da5a702f5f3ace3a6e698afbb3e5cc9f209"
        },
        {
          "name": "geocode",
          "title": "Geocode an address or place",
          "description": "Look up an address, place name or point of interest and get coordinates (lat, lon), a readable label and address parts, from OpenStreetMap data. Use it before static_map or privacy_area_map when you only have an address. Counts 1 address lookup against the account's monthly cap. Results may be stored: up to 30 days on the Free plan, indefinitely on paid plans. Show \"© OpenStreetMap contributors\" with results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bbox": {
                "description": "[min_lon, min_lat, max_lon, max_lat]",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "lang": {
                "description": "Preferred language for names, e.g. en, de, fr",
                "maxLength": 8,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of matches",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Prefer matches near this point",
                "properties": {
                  "lat": {
                    "description": "Latitude in decimal degrees (WGS84)",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude in decimal degrees (WGS84)",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "query": {
                "description": "Address, place or point of interest, e.g. \"233 S Wacker Dr, Chicago\" or \"Oswego, Illinois\"",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Geocode an address or place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f223d2897122aa5bddea1a4d21eefceb0451d786b338495a9a3ea411c7b838ef"
        },
        {
          "name": "map_setup",
          "title": "Get code to show an interactive map",
          "description": "Get ready-to-paste HTML/JavaScript for an interactive, zoomable MapIron map in a web page (MapLibre GL JS vector map, Leaflet or OpenLayers raster map), or the raster tile URL template for any other library. Replace YOUR_KEY with a key restricted to the website. Needs no key and uses no quota; the map itself counts map tiles when viewed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "library": {
                "description": "maplibre = vector map (sharpest); leaflet or openlayers = raster tiles; tile_url = just the XYZ URL template",
                "enum": ["maplibre", "leaflet", "openlayers", "tile_url"],
                "type": "string"
              },
              "style": {
                "default": "light",
                "description": "Map style: light (default), dark, white or grayscale",
                "enum": ["light", "dark", "white", "grayscale"],
                "type": "string"
              }
            },
            "required": ["library"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get code to show an interactive map"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74de6eec761ff444a3b0ff2c9132a6cd71202f3a94cc82caacc6381812789a15"
        },
        {
          "name": "parcel_lookup",
          "title": "Find the property parcel at a point",
          "description": "Get the property parcel (lot) at a latitude/longitude, or by parcel_id: its boundary, the county parcel number (APN), area in m² and acres, and the public source and date. US coverage from open government data only (see mapiron.com/docs/parcels for the counties covered); owner names and values are never included. Lines are approximate and not a survey. Growth plans and up; counts 1 address lookup. Results from open-licensed sources may be stored indefinitely on paid plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "simplified",
                "description": "Boundary detail: simplified (about 1 m, smaller), full, or none",
                "enum": ["simplified", "full", "none"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of a point inside the parcel (use with lon)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a point inside the parcel (use with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "parcel_id": {
                "description": "A parcel_id from an earlier lookup, e.g. us-37183-0794123456 (instead of lat/lon)",
                "maxLength": 48,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the property parcel at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d6f4b04c3017ffa3999cc8055d05c13e4d1b33cebf0e75de0d2f1484f07ec43"
        },
        {
          "name": "privacy_area_map",
          "title": "Map an approximate area without revealing the exact point",
          "description": "Show roughly where a place is without revealing the exact point. The point is snapped to a grid and drawn as a shaded circle that always contains the true point, with no pin; every address in the same grid cell gets the identical image, so the exact location cannot be recovered or averaged out across listings. Use it for real-estate, rental and marketplace listings, people's homes, or any location that should stay private. The image is returned inline, with a reusable URL that contains only the snapped point. Counts 1 static image against the account's monthly cap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Circle colour as hex, e.g. 0f766e",
                "pattern": "^#?[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "format": {
                "default": "png",
                "description": "Image format. jpg and webp are smaller than png",
                "enum": ["png", "jpg", "webp"],
                "type": "string"
              },
              "height": {
                "default": 400,
                "description": "Image height in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude of the exact place to hide. It is snapped to the grid before use and never returned",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the exact place to hide. It is snapped to the grid before use and never returned",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_m": {
                "default": 1000,
                "description": "Minimum circle radius in metres; it is raised if needed so the circle always contains the true point",
                "maximum": 25000,
                "minimum": 100,
                "type": "number"
              },
              "scale": {
                "default": 1,
                "description": "Pixel density: 2 renders a sharper image for high-density screens at double the pixel size",
                "enum": [1, 2],
                "type": "integer"
              },
              "snap_deg": {
                "default": 0.01,
                "description": "Grid size in degrees (0.01 is about 1 km). 0 turns snapping off and is not recommended",
                "maximum": 0.1,
                "minimum": 0,
                "type": "number"
              },
              "style": {
                "default": "light",
                "description": "Map style: light (default), dark, white or grayscale",
                "enum": ["light", "dark", "white", "grayscale"],
                "type": "string"
              },
              "width": {
                "default": 600,
                "description": "Image width in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Map an approximate area without revealing the exact point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a554a0ad205a0717eeceb780bf919d3ef9bb135af86c1155d230f66a623e1e0"
        },
        {
          "name": "reverse_geocode",
          "title": "Find the address at a point",
          "description": "Find the nearest address or place to a latitude/longitude, from OpenStreetMap data. Counts 1 address lookup against the account's monthly cap. Same storage terms and attribution as geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Preferred language for names, e.g. en, de, fr",
                "maxLength": 8,
                "minLength": 2,
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point to look up, in decimal degrees (WGS84)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 1,
                "description": "Maximum number of nearby addresses or places to return",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude of the point to look up, in decimal degrees (WGS84)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the address at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38994cee6660a6af05ec8d24f6ff358f489a91c73f6d316f0a928effc5b3f8bd"
        },
        {
          "name": "static_map",
          "title": "Render a static map image",
          "description": "Render a map as an image (returned inline) with optional pins (markers) and a line (path, e.g. a route). Give center and zoom, or just markers and/or path and the view is fitted automatically. Also returns a reusable image URL for web pages (add your key). Counts 1 static image against the account's monthly cap. Do not use this to show a private address such as someone's home; use privacy_area_map instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "center": {
                "additionalProperties": false,
                "description": "Map centre; use with zoom",
                "properties": {
                  "lat": {
                    "description": "Latitude in decimal degrees (WGS84)",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude in decimal degrees (WGS84)",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "format": {
                "default": "png",
                "description": "Image format. jpg and webp are smaller than png",
                "enum": ["png", "jpg", "webp"],
                "type": "string"
              },
              "height": {
                "default": 400,
                "description": "Image height in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              },
              "markers": {
                "description": "Pins to draw",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lat": {
                      "description": "Latitude in decimal degrees (WGS84)",
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude in decimal degrees (WGS84)",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "maxItems": 25,
                "type": "array"
              },
              "padding": {
                "description": "Space in pixels kept around markers and paths when the view is fitted automatically",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "parcel_id": {
                "description": "Highlight one parcel (a parcel_id from parcel_lookup, e.g. us-37183-0794123456); the view fits it if no center is given",
                "maxLength": 48,
                "type": "string"
              },
              "parcels": {
                "default": false,
                "description": "Draw property parcel lines (visible from zoom 13; Growth plans and up). Not available on privacy_area_map",
                "type": "boolean"
              },
              "path": {
                "description": "A line through these points, in order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lat": {
                      "description": "Latitude in decimal degrees (WGS84)",
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude in decimal degrees (WGS84)",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 2,
                "type": "array"
              },
              "scale": {
                "default": 1,
                "description": "Pixel density: 2 renders a sharper image for high-density screens at double the pixel size",
                "enum": [1, 2],
                "type": "integer"
              },
              "style": {
                "default": "light",
                "description": "Map style: light (default), dark, white or grayscale",
                "enum": ["light", "dark", "white", "grayscale"],
                "type": "string"
              },
              "width": {
                "default": 600,
                "description": "Image width in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              },
              "zoom": {
                "description": "0 = world, 10 = city, 15 = streets, 18 = buildings",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Render a static map image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5928ae9b1fc39d54a0d487cad77791b2026484c67e07ac3e2f5c6673809078e5"
        }
      ],
      "digest": "sha256:4e33d5a34d040c256c812a2cfe84d340f06fe314547b77c139764b14fc05e720"
    }
  }
}
