        {
          "name": "find_funders",
          "title": "Rank foundations for a nonprofit",
          "description": "Ranks the private foundations most likely to fund a US nonprofit, from their 990-PF giving. Takes the organization's EIN, or its state and causes. Returns how many foundations passed every check and the top 3, each with its fit, why, whether it takes requests (with the filing year and any dated website check), how to apply from its filing, and recent grants to similar groups. Quote the filing years and check dates. A past grant shows what a foundation funded, not that it accepts requests now or that this organization is eligible; never promise funding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "causes": {
                "description": "Up to 3 causes. Required without an EIN.",
                "items": {
                  "enum": ["education", "health", "human-services", "youth", "arts", "environment", "animals", "community", "faith"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "ein": {
                "description": "The organization's 9-digit EIN from find_organization. State and causes come from the IRS file unless passed.",
                "pattern": "^\\d{2}-?\\d{7}$",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code. Required without an EIN.",
                "maxLength": 30,
                "minLength": 2,
                "type": "string"
              },
              "zip": {
                "description": "Optional 5-digit ZIP, to favor foundations that gave nearby.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rank foundations for a nonprofit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
