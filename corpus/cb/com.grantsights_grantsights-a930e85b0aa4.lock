                      },
                      "reviewedOn": {
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      "stagedApplication": {
                        "additionalProperties": false,
                        "description": "Stages reviewed for the named cycle. A conflict preserves the source alternatives and gives no resolved deadline. These stages are separate from federal new and resubmission date fields.",
                        "properties": {
                          "serviceArea": {
                            "maxLength": 200,
                            "minLength": 1,
