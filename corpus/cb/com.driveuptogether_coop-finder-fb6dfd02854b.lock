      "serverInfo": {
        "name": "gamevato-coop-finder",
        "title": "Gamevato Co-op Finder",
        "version": "1.0.0",
        "websiteUrl": "https://driveuptogether.com/tools/coop-finder"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Co-op Game Finder: finds PC co-op games on Steam for a group of friends and ranks them by fit (group size, budget, mood, session length, online or same-screen, platform). Data: a curated catalog of about 30 co-op games; prices (US Steam store), Steam review labels and platforms are refreshed daily from Steam's public data. Made by Gamevato; its own game is part of the catalog, ranked by the same rules and labeled made_by_publisher when it appears. Read-only, no account, nothing about the user is stored.",
      "tools": [
        {
          "name": "find_coop_games",
          "title": "Find co-op games for a group",
          "description": "Finds PC co-op games on Steam that fit a group of friends and ranks them by how well they fit: group size, budget in US dollars, mood or type tags, typical session length, online or same-screen play, and platform. Each result has the current US Steam price, Steam's user-review label and the Steam store link. Use it when someone asks which co-op game they should play with friends or a group. It searches a curated catalog of co-op games on Steam (PC only, no console or mobile), refreshed daily from Steam's public store and review data; group sizes and tags are curated, session length is an editorial guide from the game type. The catalog includes a game made by Gamevato, the publisher of this tool; it is ranked by the same rules and labeled made_by_publisher when shown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many games to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "local_or_online": {
                "description": "online = everyone on their own PC; local = same screen / couch; either (default).",
                "enum": ["online", "local", "either"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Highest price per copy in US dollars (US Steam store). 0 = only games with no charge.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Operating system every player uses. Omit for any.",
                "enum": ["windows", "mac", "linux"],
                "type": "string"
              },
              "players": {
                "description": "Group size including the user. Only games that support at least this many players are returned.",
                "maximum": 32,
                "minimum": 2,
                "type": "integer"
              },
              "session_length": {
                "description": "How long a typical play session should be: short (quick rounds), medium (about an hour), long (multi-hour campaigns or worlds).",
                "enum": ["short", "medium", "long"],
                "type": "string"
              },
              "tags": {
                "description": "Mood or type wanted; a game must match at least one, more matches rank higher. funny (silly, chaotic fun with friends); physics (physics-driven movement and slapstick); climbing (climbing to the top together); driving (driving or vehicles); horror (scary, horror atmosphere); party (party game with short rounds); puzzle (puzzle solving and story campaign); survival (survival and crafting); sandbox (open sandbox to build and explore); shooter (shooting action); cozy (relaxed, cozy farming or building); rage (hard, rage-inducing challenge); competitive (players compete against each other); tethered (players are tied or chained together).",
                "items": {
                  "enum": ["funny", "physics", "climbing", "driving", "horror", "party", "puzzle", "survival", "sandbox", "shooter", "cozy", "rage", "competitive", "tethered"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "type": "integer"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "type": "object"
              },
              "results": {
                "items": {
                  "properties": {
                    "appid": {
                      "type": "integer"
                    },
                    "fit": {
                      "properties": {
                        "matched": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "score": {
                          "type": "integer"
                        },
                        "unconfirmed": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "type": "object"
                    },
                    "made_by_publisher": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "platforms": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "play_modes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "players_max": {
                      "type": ["integer", "null"]
                    },
                    "price": {
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "usd": {
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["label", "usd"],
                      "type": "object"
                    },
                    "publisher_note": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "reviews": {
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "positive_percent": {
                          "type": ["integer", "null"]
                        },
                        "total": {
                          "type": "integer"
                        }
                      },
                      "required": ["label"],
                      "type": "object"
                    },
                    "session_guide": {
                      "type": ["string", "null"]
                    },
                    "steam_url": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["appid", "made_by_publisher", "name", "price", "reviews", "steam_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "object"
              }
            },
            "required": ["matches", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find co-op games for a group"
          },
          "behavior": {
