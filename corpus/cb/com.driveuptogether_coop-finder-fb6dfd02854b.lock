        {
          "name": "get_game_details",
          "title": "Get details of a co-op game",
          "description": "Returns the stored details of one game from the co-op finder's catalog by its Steam app id: current US Steam price, Steam's user-review label and counts, maximum players, online / same-screen play, platforms, tags, Steam genres, release date and the Steam store link. Use it after find_coop_games when the user asks about one of the games it returned. Only games in the catalog are available; other app ids return an error.",
