{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/ghana-contacts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/ghana-contacts"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-ghana-contacts",
        "title": "Ghana Contacts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana Contacts gives the customer-care, complaints and emergency numbers of banks, mobile networks, utilities and public offices in Ghana, each read on the organisation's own website. Use contacts.find for a named organisation and contacts.check_number when someone was given a number. Give the source and date with each number. Never say a number is safe, and always pass on the warning about PINs and codes.",
      "tools": [
        {
          "name": "contacts.check_number",
          "title": "Check who publishes a phone number in Ghana",
          "description": "Use this when someone was given a phone number said to belong to a bank, mobile network or public office in Ghana and asks whether it is really theirs (for example \"is 0800 422 422 really GCB\"). It says which organisation on its list publishes that number on its own website, or that none does. A number that is not found may still be genuine, and the tool says so. Do not use it to look up who owns a private number, to trace a caller, or for numbers outside Ghana.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "The phone number or short code as given, for example \"0800 422 422\", \"+233 30 261 1611\" or \"292\".",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "number": {
                "type": "string"
              },
              "published_by": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "found", "number", "published_by", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cce235db3d81ba76b47b55305de60663551e6b7e4b597f693bdd1c3871fe7494"
        },
        {
          "name": "contacts.find",
          "title": "Contact numbers of an organisation in Ghana",
          "description": "Use this when someone asks for the customer-care, complaints or emergency number of a bank, mobile network, electricity company, payments company or public office in Ghana (for example \"what is the GCB customer care number\" or \"how do I reach the passport office\"). It returns numbers read on the organisation's own website, with the page and the date. Give those numbers rather than one from memory or from a web search. Do not use it for a shop, a school, a hospital, a person, or an organisation outside Ghana: it covers a fixed list and says when a name is not on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "organisation": {
                "description": "The organisation's name or usual short name, for example \"GCB\", \"MTN\", \"ECG\", \"passport office\" or \"police\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["organisation"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "not_published": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "organisations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "organisations", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6701fa21beb77a3280e4e5d710c4ff60f2f1c9de63f77858142a6092b9a89fe"
        },
        {
          "name": "contacts.list",
          "title": "Organisations in Ghana whose contacts are listed",
          "description": "Use this when someone asks which organisations this tool has numbers for, or wants the emergency numbers or the places to report fraud in Ghana all at once. Do not use it when one organisation is named: use contacts.find.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "One group: emergency, regulator, network, bank, payments, utility, public_service. Leave out for the names of all.",
                "enum": ["emergency", "regulator", "network", "bank", "payments", "utility", "public_service"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "groups": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "not_published": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "organisations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "groups", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb9d865875c1d51b755ac5b9e84dd8328c1938db51878dfd352a29c4a524856f"
        }
      ],
      "digest": "sha256:425c5e21b50f65d94d2f27f874496f8fe4a1c73b284661cb790b94e9a90bcc8c"
    }
  }
}
