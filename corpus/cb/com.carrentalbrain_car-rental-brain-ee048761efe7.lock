        {
          "name": "build_search_link",
          "title": "Build search link",
          "description": "A link for the PERSON to open: live prices for their exact dates and needs, ranked by the total they will actually pay, where they can book. Use whenever the person has dates and wants to see or book cars. Works for any place; coverage says whether Car Rental Brain has measured it (not_measured: no figures of ours exist there - say so, quote none).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Main driver's age in years (default 35). Under 25 or over 70 often costs more.",
                "maximum": 99,
                "minimum": 18,
                "type": "integer"
              },
              "airport": {
                "description": "Airport id, IATA code or name, e.g. 'faro', 'FAO', 'Faro Airport'",
                "type": "string"
              },
              "automatic": {
                "description": "True for automatic gearbox only.",
                "type": "boolean"
              },
              "car_type": {
                "description": "Car size; omit for every size.",
                "enum": ["small", "medium", "large", "suv", "estate", "vans", "premium"],
                "type": "string"
              },
              "currency": {
                "description": "EUR, GBP, USD...",
                "type": "string"
              },
              "debit_card": {
                "description": "True if the driver has no credit card - only cars whose desk takes a debit card for the deposit.",
                "type": "boolean"
              },
              "dropoff_airport": {
                "description": "Optional return airport (code or name) when it differs from the pick-up - a one-way hire. One-way fees are not measured: the live search shows them in each total",
                "type": "string"
              },
              "dropoff_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "dropoff_time": {
                "description": "HH:MM",
                "type": "string"
              },
              "extra_driver": {
                "description": "True if a second driver will drive - their fee is then in every total.",
                "type": "boolean"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "pickup_time": {
                "description": "HH:MM",
                "type": "string"
              },
              "place": {
                "description": "Any city/place if not a measured airport",
                "type": "string"
              },
              "residence": {
                "description": "Two-letter country of residence, e.g. GB",
                "type": "string"
              }
            },
            "type": "object"
