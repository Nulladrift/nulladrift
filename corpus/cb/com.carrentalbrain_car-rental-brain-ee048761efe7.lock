      },
      "instructions": "Car Rental Brain measures what car hire really costs at 170+ airports (Europe, the UK, Turkey, the US and more): the rental, the rental with a second driver, with full excess cover, with no deposit, the deposit held, debit-card acceptance and desk opening hours - from our own repeated searches (each airport reports its exact search count in basis.searches) covering many thousands of DiscoverCars offers. Use it to answer 'where/when is car hire cheapest', 'what will this really cost', 'which supplier holds the smallest deposit'. Figures are dated aggregates, not quotes; build_search_link returns the page where a person sees live prices for their dates and books themselves. Prices are EUR per day for a 7-day hire unless a field says otherwise.",
      "tools": [
        {
          "name": "airport_costs",
          "title": "Airport costs",
          "description": "The true cost of hiring a car at one airport: per-day price for the car alone, with a second driver, with full cover, automatic, no-deposit (from + typical); by pick-up month; second-driver fees; deposits; debit-card acceptance; desk closing times and out-of-hours fees; policies; Brain's pick per car size (the well-rated supplier that is usually cheapest here, measured - say 'usually'). Use when someone asks what car hire really costs at one airport, or about deposits, fees or desk hours there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airport": {
                "description": "Airport id, IATA code or name, e.g. 'faro', 'FAO', 'Faro Airport'",
                "type": "string"
              },
              "month": {
                "description": "Optional pick-up month YYYY-MM",
                "type": "string"
              },
              "trip_days": {
                "description": "Optional trip length in days",
                "type": "integer"
              }
            },
            "required": ["airport"],
            "type": "object"
