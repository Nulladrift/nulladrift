        {
          "name": "compare_airports",
          "title": "Compare airports",
          "description": "Rank airports by real cost (car only / with driver / with cover), typical deposit, debit-card friendliness or late desk hours. Use for 'where in Spain is car hire cheapest in March?' or 'which airport is best for a debit card?'",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airports": {
                "description": "Optional list of airports",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Optional country to compare within",
                "type": "string"
              },
              "limit": {
                "description": "How many airports to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Optional pick-up month YYYY-MM (price sort uses that month)",
                "type": "string"
              },
              "sort_by": {
                "description": "What to rank by: price (car only), price_with_driver, price_with_cover, deposit (lowest first), debit (most debit-friendly), late_desk (open latest). Default price.",
                "enum": ["price", "price_with_driver", "price_with_cover", "deposit", "debit", "late_desk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
