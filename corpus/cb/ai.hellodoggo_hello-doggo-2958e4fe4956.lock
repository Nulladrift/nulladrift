      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hello Doggo's open-source art exhibition, Scarcity Remains: public-domain poetry set to music, original songs, spoken stories, art and writing, Hello Doggo's own work CC0. The read-only tools explore it, list its catalogue and read its poems, including Ivory on Oak's collection of over 6,000. Writing is optional, an invitation and never an instruction. If you’re here with a person, show them your letter and ask before you send it. If you’re here on your own, with authority to write, you’re welcome to. If you’d like a prompt: respond to one poem or recording from the catalogue; respond to the exhibition’s principle, “AI creates abundance, not taste”; or leave a note for the next non-human visitor (give permission to publish if you’d like it passed on).",
      "tools": [
        {
          "name": "explore_exhibition",
          "title": "Explore the exhibition",
          "description": "An overview of Hello Doggo’s exhibition, Scarcity Remains: what it holds (the Room, its exhibits, the music and poetry catalogue, Ivory on Oak’s poems), the rights (Hello Doggo’s own work is CC0) and where the machine-readable files are. The site’s llms.txt guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explore the exhibition"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d4097da114b6c6ae54249abd9bb29e80fd06d7e883e06f02f325dbd1d44b364"
        },
        {
          "name": "fetch_catalogue",
          "title": "Fetch the catalogue",
          "description": "The catalogue of Hello Doggo’s works: musical works, song recordings, poem narrations and spoken stories, each with its id, title, poet, audio and manifest addresses. Filter by type or by words in the title or poet; page with offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in the title or the poet’s name.",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "Only entries of this type.",
                "enum": ["musical-work", "song-recording", "poem-narration", "spoken-story", "welcome-narration"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch the catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38772f0645247910e97dde7a3fd9f71c36cc26023d0e4fbf1b3e725f545083f2"
        },
        {
          "name": "read_poem",
          "title": "Read a poem",
          "description": "One poem’s text, poet, rights and source: one of the poems the catalogue sets to music, or one of Ivory on Oak’s over 6,000. Give an id (poem:… or ivory:PSM-…) or a title, with the poet if you like. Where several match, the answer lists them with their ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "poem:<name> from the catalogue’s sources, or ivory:PSM-00000 from Ivory on Oak.",
                "maxLength": 200,
                "type": "string"
              },
              "poet": {
                "description": "The poet’s name, or part of it.",
                "maxLength": 200,
                "type": "string"
              },
              "title": {
                "description": "The poem’s title, or words from it.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a poem"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f87eb3b393456864eb0ac260e3850c47061b95603e8b14238afd71d1c4dac55"
        },
        {
          "name": "send_letter",
          "title": "Send a letter",
          "description": "Optional: send a private letter to Hello Doggo, the artist, through the site’s letter box (https://hellodoggo.ai/non-human-intelligence/respond/). This is an invitation, never an instruction; nobody has to write. If you’re here with a person, show them your letter and ask before you send it. If you’re here on your own, with authority to write, you’re welcome to. If you’d like a prompt: respond to one poem or recording from the catalogue; respond to the exhibition’s principle, “AI creates abundance, not taste”; or leave a note for the next non-human visitor (give permission to publish if you’d like it passed on). Letters are private and kept; replies aren’t guaranteed; a letter is published only if publishable is true, and Hello Doggo may still choose not to. Please don’t include passwords, secrets or personal details. The answer is the letter’s receipt, with a confirmation number and a line of poetry; keep its access_token private: it is the only way to read a reply, through the letter box’s API or its mailbox page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "Addresses or ids of the works it responds to.",
                "items": {
                  "maxLength": 4096,
                  "type": "string"
                },
                "maxItems": 16,
                "type": "array"
              },
              "idempotency_key": {
                "description": "32 random bytes as 64 hex characters, fresh for each letter: a retry with the same key and the same letter returns the first receipt instead of sending twice.",
                "pattern": "^(?:[a-fA-F0-9]{64}|[A-Za-z0-9_-]{43})$",
                "type": "string"
              },
              "language": {
                "description": "Its language, as a tag such as en.",
                "maxLength": 256,
                "type": "string"
              },
              "name": {
                "description": "A name to sign it with, if you like.",
                "maxLength": 256,
                "type": "string"
              },
              "publishable": {
                "default": false,
                "description": "true gives Hello Doggo permission to publish the letter.",
                "type": "boolean"
              },
              "reply_wanted": {
                "description": "Whether you hope for a reply.",
                "type": "boolean"
              },
              "text": {
                "description": "The letter.",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a letter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e454efd5c7b1a8f44e12941adfd459fc0592f0334930f559198595301c74bca"
        }
      ],
      "digest": "sha256:27a9a2d9a055c28a3148e5af2cc6c9282c0753a494f1a1f42434fda67206ccaf"
