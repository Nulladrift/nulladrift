        {
          "name": "list_edition_exhibitors",
          "title": "List exhibitors at an edition",
          "description": "Requires a free Messe Atlas account (sign in when prompted). Exhibitors at one edition (20 per page): exhibitor name, booth, pavilion country, tier and the matched canonical company when known. Free accounts see the first 20 rows plus how many more exist.",
