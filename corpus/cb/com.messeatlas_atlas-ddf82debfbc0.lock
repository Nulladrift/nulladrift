      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Messe Atlas is data about the meetings, incentives, conferences and exhibitions (MICE) industry: trade shows and their editions, exhibitors, organizers, venues, public speakers and companies, Asia-first with a global calendar. Start with upcoming_events for 'what is on' questions, search_events / search_companies / search_venues / search_organizers to find an id or slug, then the matching get_* tool for detail; list_edition_exhibitors takes an edition id from get_event. Lists return 20 rows per page. Rows carry `url`, and editions carry `as_of` (when the record was last checked or updated) and, where known, `source_url` — cite them as \"Messe Atlas, {name}, {url}\". For halls and rooms use search_venue_spaces (which hall fits) or get_venue_spaces (one venue); for MICE subsidies use find_subsidies (a screen of published criteria, not advice); to check a stand layout against gangway, travel-distance and exit rules use check_floorplan. Only reveal_contact returns an email address or phone number: it needs a Pro plan or higher, the 'atlas.reveal' permission and the workspace's one-time acceptance of the Messe Atlas data terms, and it uses a reveal credit. export_list's 'reveals' source (Team plan and up) writes the contacts your workspace already revealed to a CSV file behind a 24-hour link. No other tool returns contact details. Account, plan and limits: https://messeatlas.com/connect",
      "tools": [
        {
          "name": "check_floorplan",
          "title": "Check a floor plan",
          "description": "Requires a free Messe Atlas account (sign in when prompted). Checks an exhibition floor plan against published default safety and layout limits — no AI, deterministic: stand overlaps, keep-clear gangways, fire-point halos, 4 m entrance strips, rows ≤ 30 m, gangways ≥ 3 m, travel distance ≤ 61 m, dead ends ≤ 18 m, stand area ≤ 2 × gangway area, exit width at 5 mm per person, gate lines, power pits. Coordinates in metres, origin at the hall's north-west corner, x east, y south. `plan` is either the short form {hall: {w, l} (or space_id), exits: [{id, kind: public|fire|folding|service|open, a: [x,y], b: [x,y]}], stands: [{id, x, y, w, d, door_side?: n|e|s|w}] (x, y = the stand's north-west corner), features?: [{id, x, y, w, d}], peak_people} or the full L2 plan dict (hall|site, exits, units, solids, keep, fire, peak). `space_id` (from get_venue_spaces) supplies the hall only when Atlas holds its outline; otherwise send the hall inline. Returns ok, every check with rule, value, limit and source, a summary (stands, m² sold, gangway m², ratio), limits_status, a preview_url (SVG, 24 hours) and a disclaimer. Convex polygons only; at most 2,000 objects and 160,000 m². Free accounts get 3 successful checks a month, Pro 30, Team and Enterprise unlimited; invalid plans are not counted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmed_only": {
                "default": false,
                "description": "Leave out exits listed in the plan's pending_exits (awaiting the venue's confirmation).",
                "type": "boolean"
              },
              "plan": {
                "description": "The short form (stands, exits, hall or space_id, features, peak_people) or the full L2 plan dict (hall|site, exits, units, solids, keep, fire, peak). Metres; origin north-west; at most 512 KB of JSON.",
                "type": "object"
              },
              "space_id": {
                "description": "Venue space id or slug from get_venue_spaces / search_venue_spaces (short form only). Used for the hall only when its geometry_status is outline or better.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a floor plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
