        {
          "name": "exhibitor_history",
          "title": "Company exhibitor history",
          "description": "Requires a Pro plan. Every edition one company exhibited at or sponsored, newest first (20 per page): event, year, dates, city, country, tier, booths and the edition's `as_of`. Filter by role and year range; pass `cursor` from the previous answer for the next page. `history_truncated` is set for very large histories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company slug or uuid, as returned by search_companies.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from the previous page's `next_cursor`.",
                "maxLength": 300,
                "type": "string"
              },
              "from_year": {
                "description": "Earliest edition year (inclusive).",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "role": {
                "default": "any",
                "description": "Only exhibitor or sponsor records. Defaults to both.",
                "enum": ["exhibitor", "sponsor", "any"],
                "type": "string"
              },
              "to_year": {
                "description": "Latest edition year (inclusive).",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["company"],
            "type": "object"
          },
