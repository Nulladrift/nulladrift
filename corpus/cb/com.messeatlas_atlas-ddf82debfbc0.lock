        {
          "name": "find_subsidies",
          "title": "MICE subsidies",
          "description": "Requires a free Messe Atlas account (sign in when prompted). Convention-bureau and tourism-board support schemes for an exhibition, conference, meeting or incentive (optionally in one country). Each active scheme is screened against its published criteria: `match` is `likely` (every published criterion supplied and met) or `check` (something is unknown, late or stale), with the reasons; schemes that do not appear to fit are listed under `not_matched` with the reason. Returns benefits and amounts as published, `url`, `apply_url`, `as_of` and `stale`. Not advice: confirm eligibility, amounts and deadlines with the body.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attendees": {
                "description": "Expected attendees (delegates / participants / visitors).",
                "maximum": 10000000,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "ISO-3166 alpha-2 (TH, DE, JP …).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "event_type": {
                "description": "What kind of event.",
                "enum": ["exhibition", "conference", "meeting", "incentive"],
                "type": "string"
              },
              "international_pct": {
                "description": "Expected share of international participants, in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "start_date": {
                "description": "Event start (YYYY-MM-DD), to screen application lead times.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["event_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "MICE subsidies"
