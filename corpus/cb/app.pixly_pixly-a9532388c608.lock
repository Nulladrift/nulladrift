      "serverInfo": {
        "name": "pixly",
        "title": "Pixly",
        "version": "1.5.0",
        "websiteUrl": "https://pixly.app"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pixly turns real-estate listing photos into staged photos and cinematic videos. Typical flow: a generation tool (virtual_staging, enhance_photo, cinematic_motion, …) with imageUrl → get_job until status is completed → download the result URLs. Photos go in as imageUrl: a public https URL or a base64-encoded data URI. A chat attachment is neither — if the file is local and you cannot upload bytes yourself, ask the user to add it at https://pixly.app/app, then call list_library with type \"uploads\" to get its r2Path. Generation tools spend credits from the signed-in user's Pixly balance; get_credit_balance shows what's left.",
      "tools": [
        {
          "name": "before_after_image",
          "title": "Before & After Image",
          "description": "Free (no credits): one comparison image from a before and an after photo of the same place — e.g. an empty room and its virtual staging, a daylight shot and its dusk version, a room before and after a restyle. Side by side, stacked, or split by a line; original shape, square, 4:5 or 9:16. Write the labels in the user's language. Returns a finished image at once.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "afterImageUrl": {
                "description": "The AFTER photo (e.g. the staged room, the dusk version). Public https URL or data: URI; or afterR2Path.",
                "minLength": 1,
                "type": "string"
              },
              "afterLabel": {
                "description": "Label text for the after photo, in the user's language (default \"After\").",
                "maxLength": 24,
                "type": "string"
              },
              "afterR2Path": {
                "description": "Storage path of the after photo — the alternative to afterImageUrl.",
                "minLength": 1,
                "type": "string"
              },
              "aspect": {
                "default": "original",
                "description": "Shape of the image: original (follows the photos), 1:1 square, 4:5 Instagram post, 9:16 Stories/Reels.",
                "enum": ["original", "1:1", "4:5", "9:16"],
                "type": "string"
              },
              "beforeImageUrl": {
                "description": "The BEFORE photo (e.g. the empty room, the daylight shot). Public https URL or data: URI; or beforeR2Path.",
                "minLength": 1,
                "type": "string"
              },
              "beforeLabel": {
                "description": "Label text for the before photo, in the user's language (default \"Before\").",
                "maxLength": 24,
                "type": "string"
              },
              "beforeR2Path": {
                "description": "Storage path of the before photo — the alternative to beforeImageUrl. For a Pixly result, its original photo is the job's source.",
                "minLength": 1,
                "type": "string"
              },
              "labels": {
                "default": true,
                "description": "Show the Before / After labels.",
                "type": "boolean"
              },
              "layout": {
                "default": "side",
                "description": "side = next to each other, stack = one above the other, vsplit = one frame split by a vertical line, diagonal = split by a slanted line.",
                "enum": ["side", "stack", "vsplit", "diagonal"],
                "type": "string"
              },
              "listingId": {
                "description": "A property folder (from list_listings or create_listing) to put the result in. Results of a photo that is already in a folder go there by themselves.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "completedAt": {
                "type": "string"
              },
              "createdAt": {
                "type": "string"
              },
              "creditsCharged": {
                "type": ["number", "null"]
              },
              "error": {
                "type": "string"
              },
              "jobId": {
                "description": "Pass to get_job to poll",
                "type": "string"
              },
              "jobs": {
                "description": "Several jobs at once (get_job with jobIds, or a plan's steps): each one's jobId, status and results",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "quote": {
                "description": "Present when status is \"awaiting_confirmation\": nothing ran and nothing was charged yet — the price and settings the user is asked to confirm",
                "type": "object"
              },
              "resultPaths": {
                "description": "Storage path of each result — pass one as r2Path (or beforeR2Path, a photos[] item) to run another tool on this result",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resultUrls": {
                "description": "Present when completed; valid 7 days",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "pending | processing | completed | failed — anything not completed/failed is still running",
                "type": "string"
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["jobId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Before & After Image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d924fb64d0ad399a7e832f8345a5aa211d9553b3c7c6deb7ca47ccea9e2a9d0"
        },
        {
          "name": "before_after_reel",
          "title": "Before & After Video",
          "description": "Before and after video: animate a before→after transformation (e.g. empty room → staged, or a renovation, or a daylight photo → its Day to Night version with videoIntent day_to_night) into a social-ready reveal reel from two photos. Both photos are required. Only have one? Make the other first with a photo tool — virtual_staging (empty room → furnished), remove_furniture (furnished → empty), day_to_night, restyle_room, makeover_exterior and the other edit tools — and pass its result as afterImageUrl (or beforeImageUrl). Costs credits from the user's Pixly balance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "afterImageUrl": {
                "description": "End frame (e.g. the staged result) — https URL or data: URI",
                "minLength": 1,
                "type": "string"
              },
              "afterR2Path": {
                "description": "R2 path of the end frame — the alternative to afterImageUrl.",
                "minLength": 1,
                "type": "string"
              },
              "beforeImageUrl": {
                "description": "Start frame (e.g. the empty room photo) — https URL or data: URI",
                "minLength": 1,
                "type": "string"
              },
              "beforeR2Path": {
                "description": "R2 path of the start frame — the alternative to beforeImageUrl.",
                "minLength": 1,
                "type": "string"
              },
              "durationSeconds": {
                "anyOf": [
                  {
                    "const": 5,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  }
                ],
                "default": 5
              },
              "format": {
                "default": "original",
                "description": "Video shape. original (default) keeps the photos' own shape; 9:16, 16:9 or 1:1 crop both photos, centred, to that shape first.",
                "enum": ["original", "9:16", "16:9", "1:1"],
                "type": "string"
              },
              "listingId": {
                "description": "A property folder (from list_listings or create_listing) to put the result in. Results of a photo that is already in a folder go there by themselves.",
                "type": "string"
              },
              "revealStyle": {
                "default": "smooth",
                "description": "How the transformation is revealed",
                "enum": ["smooth", "slideIn", "dropLand", "glowBuild", "movers"],
                "type": "string"
              },
              "videoIntent": {
                "default": "staging_reveal",
                "description": "staging_reveal: an empty room becoming a furnished one (or a renovation). day_to_night: Before is a daylight photo and After its dusk version (a Pixly Day to Night result and its original) — the video turns day into the lit evening; revealStyle does not apply.",
                "enum": ["staging_reveal", "staging_reveal_reverse", "construction_timelapse", "day_to_night"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "completedAt": {
                "type": "string"
              },
              "createdAt": {
                "type": "string"
              },
              "creditsCharged": {
