        {
          "name": "draw_floor_plan",
          "title": "Draw Floor Plan",
          "description": "Free (no credits): draw a clean 2D floor plan from a layout YOU write — read the user's description, or look at their hand sketch or brochure plan, and send every room as a rectangle in metres (or feet) plus doors and windows. Returns the drawn plan (areas and dimensions on it) at once, saved so the user can fine-tune it in Pixly's floor plan editor. If the layout has problems (overlapping rooms, a door between rooms that don't touch) you get exactly what to fix — fix it and call again. To change a plan, call again with its planId and the whole updated layout; the new version is saved as its own plan and the earlier one is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "doors": {
                "default": [],
                "items": {
                  "properties": {
                    "from": {
                      "description": "A room id.",
                      "type": "string"
                    },
                    "kind": {
                      "default": "door",
                      "description": "door = hinged door, doorway = open gap with no door, sliding = sliding/patio door.",
                      "enum": ["door", "doorway", "sliding"],
                      "type": "string"
                    },
                    "side": {
                      "description": "Only for to = \"outside\": which wall of the room the entrance is on.",
                      "enum": ["top", "right", "bottom", "left"],
                      "type": "string"
                    },
                    "to": {
                      "description": "Another room id that shares a wall with it, or \"outside\".",
                      "type": "string"
                    },
                    "width": {
                      "minimum": 0.1,
                      "type": "number"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              },
              "listingId": {
                "description": "A property folder (from list_listings or create_listing) to put the result in. Results of a photo that is already in a folder go there by themselves.",
                "type": "string"
              },
              "planId": {
                "description": "To CHANGE a plan you drew before: its planId from that result, with the whole updated layout — saved as a new plan beside it (nothing is overwritten). Omit for a new plan.",
                "maxLength": 40,
                "type": "string"
              },
              "rooms": {
                "description": "Every room as an axis-aligned rectangle. Neighbouring rooms must share the wall exactly (one's right edge = the other's left edge) and must not overlap. An L-shaped space = two rectangles joined by a doorway. Lay out a typical sensible plan when the user gives only rough sizes.",
                "items": {
                  "properties": {
                    "depth": {
                      "description": "Size along y.",
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "id": {
                      "description": "Your own short handle for the room (\"kitchen\", \"bed1\"); doors and windows refer to it.",
                      "maxLength": 30,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Label on the plan when the type isn't enough (\"Bedroom 2\", \"Master bedroom\").",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "type": {
                      "description": "What the room is; sets its colour and default label.",
                      "enum": ["living", "kitchen", "dining", "bedroom", "bathroom", "wc", "hall", "office", "laundry", "storage", "garage", "balcony", "terrace", "utility", "other"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Size along x.",
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "x": {
                      "description": "Left edge. The plan's x runs to the right.",
                      "type": "number"
                    },
                    "y": {
                      "description": "Top edge. The plan's y runs DOWN (the top of the drawing is 0).",
                      "type": "number"
                    }
                  },
                  "required": ["depth", "id", "type", "width", "x", "y"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Address or listing name for the plan's title block.",
                "maxLength": 80,
                "type": "string"
              },
              "units": {
                "default": "m",
                "description": "Units of every number below, and of the labels on the plan.",
                "enum": ["m", "ft"],
                "type": "string"
              },
              "windows": {
                "default": [],
                "items": {
                  "properties": {
                    "count": {
                      "default": 1,
                      "maximum": 4,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "full": {
                      "default": false,
                      "description": "Floor-to-ceiling glass (French window, balcony door).",
                      "type": "boolean"
                    },
                    "room": {
                      "description": "A room id.",
                      "type": "string"
                    },
                    "side": {
                      "description": "Which wall; it must be an outside wall (not shared with another room).",
                      "enum": ["top", "right", "bottom", "left"],
                      "type": "string"
                    },
                    "width": {
                      "minimum": 0.1,
                      "type": "number"
                    }
                  },
                  "required": ["room", "side"],
                  "type": "object"
                },
                "maxItems": 80,
                "type": "array"
              }
            },
            "required": ["rooms"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "completedAt": {
                "type": "string"
              },
              "createdAt": {
                "type": "string"
              },
              "creditsCharged": {
                "type": ["number", "null"]
              },
              "error": {
                "type": "string"
              },
              "jobId": {
                "description": "Pass to get_job to poll",
                "type": "string"
              },
              "jobs": {
                "description": "Several jobs at once (get_job with jobIds, or a plan's steps): each one's jobId, status and results",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "quote": {
                "description": "Present when status is \"awaiting_confirmation\": nothing ran and nothing was charged yet — the price and settings the user is asked to confirm",
                "type": "object"
              },
              "resultPaths": {
                "description": "Storage path of each result — pass one as r2Path (or beforeR2Path, a photos[] item) to run another tool on this result",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resultUrls": {
                "description": "Present when completed; valid 7 days",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "pending | processing | completed | failed — anything not completed/failed is still running",
                "type": "string"
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["jobId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Draw Floor Plan"
          },
          "behavior": {
