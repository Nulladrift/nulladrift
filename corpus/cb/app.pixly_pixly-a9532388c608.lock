        {
          "name": "create_upload_ticket",
          "title": "Upload a Local Photo",
          "description": "Get a presigned upload URL for a LOCAL image file — the one case a URL can't cover. PUT the file to uploadUrl with the same Content-Type, then pass the returned r2Path to a generation tool instead of imageUrl. Ticket expires in 1 hour.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "contentType": {
                "description": "MIME type the PUT request will send",
                "enum": ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "image/tiff"],
                "type": "string"
              },
              "filename": {
                "description": "Original filename, used for the extension",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sizeBytes": {
                "description": "Exact byte size of the file. Recommended: when given it is signed into the URL, so the upload is bounded server-side.",
                "exclusiveMinimum": 0,
                "maximum": 10485760,
                "type": "integer"
              }
            },
            "required": ["contentType", "filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Upload a Local Photo"
          },
