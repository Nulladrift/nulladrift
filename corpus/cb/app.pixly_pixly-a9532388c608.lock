                "items": {
                  "enum": ["floor"],
                  "type": "string"
                },
                "type": "array"
              },
              "imageUrl": {
                "description": "Public https URL of the source photo, or a data: URI. Either imageUrl or r2Path is required.",
                "minLength": 1,
                "type": "string"
              },
              "listingId": {
                "description": "A property folder (from list_listings or create_listing) to put the result in. Results of a photo that is already in a folder go there by themselves.",
                "type": "string"
