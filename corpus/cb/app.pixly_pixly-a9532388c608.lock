        {
          "name": "cinematic_motion",
          "title": "Cinematic Motion",
          "description": "Photo to video: turn a single listing photo into a short cinematic real estate video with a professional camera move (zoom, orbit, fly-through, crane up…). No second frame needed. Costs credits from the user's Pixly balance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cameraMove": {
                "default": "zoom",
                "description": "Camera-move preset",
                "enum": ["zoom", "fly-through", "orbit", "pan", "aerial", "pull-back", "crane-up", "tilt-up", "boom-down", "drone-orbit", "flyover", "pull-away", "handheld"],
                "type": "string"
              },
              "direction": {
                "description": "The direction the camera travels, for the moves that have one (orbit, pan, drone-orbit). 'left-to-right' sends the camera rightward, 'right-to-left' leftward. Ignored by every other move; omit to use the move's own default.",
                "enum": ["left-to-right", "right-to-left"],
                "type": "string"
              },
              "durationSeconds": {
                "anyOf": [
                  {
                    "const": 5,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  }
                ],
                "default": 5,
                "description": "Clip length in seconds. Leave out for the default 5 s; 10 s costs about twice as much — use it only when the user asks for a longer video."
              },
              "format": {
                "default": "original",
                "description": "Video shape. original (default) keeps the photo's own shape; 9:16 or 16:9 crop the photo, centred, to that shape before it is animated.",
                "enum": ["original", "9:16", "16:9"],
                "type": "string"
              },
              "imageUrl": {
                "description": "Public https URL of the source photo, or a data: URI. Either imageUrl or r2Path is required.",
