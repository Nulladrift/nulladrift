                "minimum": 0,
                "type": "number"
              },
              "filing": {
                "description": "Spouses: family (one NPWP, default) or separate (MT, chosen by the spouse, or PH, separate property). Both are compared",
                "enum": ["family", "separate"],
                "type": "string"
              },
              "filing_date": {
