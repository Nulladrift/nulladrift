        {
          "name": "indonesia_income_tax_return",
          "title": "Indonesia: full income tax return 2026",
          "description": "The complete Indonesia income tax computation for 2026, as on the return. Covers: PPh 21 month by month with TER categories A/B/C and the December (or last month) reconciliation, per employer; PTKP by status and dependants, spouse's income combined (K/I), family vs separate (MT/PH) filing compared; Biaya jabatan and biaya pensiun with their caps; JHT, JP, DPLK and zakat through the employer; BPJS Ketenagakerjaan (JHT, JP, JKK, JKM) and Kesehatan, employee and employer, with the wage caps; Business: PP 55 final 0.5% with the Rp 500 million exemption, NPPN norm, bookkeeping with losses; the cheapest allowed; and more. Returns the tax, the balance still to pay or to be refunded after taxes already paid, every option the law offers compared, and each step with its legal reference. All amounts in IDR; everything is optional, give only what applies. What is not modelled is listed in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "An individual's income tax return for Indonesia, tax year 2026 (calendar year). Amounts in rupiah for the year unless stated; leave out what does not apply.",
            "properties": {
              "business": {
                "additionalProperties": false,
                "description": "Business or free profession",
                "properties": {
                  "expenses": {
                    "description": "Deductible costs (bookkeeping), rupiah",
                    "minimum": 0,
                    "type": "number"
                  },
                  "final_paid": {
                    "description": "PP 55 final tax already paid this year, rupiah",
                    "minimum": 0,
                    "type": "number"
                  },
                  "free_profession": {
                    "description": "Doctor, lawyer, accountant, consultant, notary, artist and similar: no PP 55",
                    "type": "boolean"
                  },
                  "loss_brought_forward": {
                    "description": "Business losses of the last 5 years not yet used (bookkeeping), rupiah",
                    "minimum": 0,
                    "type": "number"
                  },
                  "method": {
                    "description": "auto (cheapest allowed, default), final05 (PP 55 final 0.5% above Rp 500 million), norma (deemed-profit norm, NPPN) or books (bookkeeping)",
                    "enum": ["auto", "final05", "norma", "books"],
                    "type": "string"
                  },
                  "norma_pct": {
                    "description": "NPPN norm for the business and area as a fraction, e.g. 0.5 (PER-17/PJ/2015)",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "turnover": {
                    "description": "Gross turnover (peredaran bruto), rupiah",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "dependants": {
                "default": 0,
                "description": "Dependants (relatives in a straight line and one adopted child), 0-3",
                "maximum": 3,
                "minimum": 0,
                "type": "number"
              },
