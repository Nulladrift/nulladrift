      "instructions": "Calculators for Dutch income tax, benefits and related figures from AtlaMint (atlamint.com), using the published 2026 Dutch rates. Each result includes a link to the full step-by-step calculation and its official source. Results are estimates, not tax advice. Users ask in any language. The tools take numbers in euros and fixed options, so translate the question into the arguments, and write the answer in the language the user writes in (the result text is English). Keep the official Dutch term in brackets the first time it comes up, e.g. \"holiday allowance (vakantiegeld)\", \"healthcare allowance (zorgtoeslag)\", \"pension room (jaarruimte)\", so the user recognises it on Dutch letters and forms. Each result has url (English page) and url_nl (the same calculation on the Dutch page): give url_nl to someone writing in Dutch, url otherwise. net_salary_abroad gives take-home pay in 16 other countries (India, China, Poland, Turkey, Germany and more) in their own rules and currency, and salary_country_comparison sets one against a Dutch salary; each cites the tax authority of that country. Each of those 16 countries also has a full income tax return tool, named after it (india_income_tax_return, germany_income_tax_return, poland_income_tax_return, united_states_income_tax_return…): every kind of income, deductions and credits, family situation, the options the law offers compared, tax already withheld, late-payment interest and the balance to pay or get back, each step with its legal reference. Use it for anyone with income in that country who asks about their tax return there. Besides the calculators: dutch_term_explained for Dutch words (job-ad terms in 20 languages), dutch_tax_deadlines for what is due and when, dutch_tax_figures for official figures with sources. Resources hold the full figures, glossary, job-ad terms, guides and the accuracy record (nltaxcalculator.nl/dutch-tax/accuracy); prompts guide common tasks (tax return, M-form, job offer, a Belastingdienst letter, the 30% ruling, buying a home, moving here).",
      "tools": [
