        {
          "name": "france_income_tax_return",
          "title": "France: full income tax return 2026",
          "description": "The complete France income tax computation for 2026, as on the return. Covers: Foyer fiscal: parts for spouse, children (incl. alternating residence), single parent (case T), case L, disability and veterans; cap on the quotient familial with complementary reductions; décote; Salaries: employee contributions 2026 by tranche, deductible and non-deductible CSG/CRDS, health cover, overtime exemption, impatriate premium, 10% deduction vs actual expenses; Pensions: CSG/CRDS/CASA by tier, 10% deduction with its household cap; 65+ and disability abatements; and more. Returns the tax, the balance still to pay or to be refunded after taxes already paid, every option the law offers compared, and each step with its legal reference. All amounts in EUR; everything is optional, give only what applies. What is not modelled is listed in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "A French household's income tax return (déclaration des revenus) for income year 2026, filed in spring 2027. Every amount is in euros for the whole year; leave out what does not apply.",
            "properties": {
              "capital": {
                "additionalProperties": false,
                "description": "Investment income and gains on securities (revenus de capitaux mobiliers, plus-values)",
                "properties": {
                  "dividends": {
                    "description": "French dividends, gross, euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreign_dividends": {
                    "description": "Foreign dividends, gross, euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreign_interest": {
                    "description": "Foreign interest, gross, euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreign_tax_credit": {
                    "description": "Tax credit for foreign investment income under the treaties (case 2AB), euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "gains": {
                    "description": "Each sale of shares or funds (at most 50)",
                    "items": {
                      "additionalProperties": false,
                      "description": "A sale",
                      "properties": {
                        "before_2018": {
                          "description": "Bought before 1 January 2018 (holding abatement under the barème option)",
                          "type": "boolean"
                        },
                        "gain": {
                          "description": "Gain (or loss, negative) after costs, euros",
                          "minimum": -1000000000000,
                          "type": "number"
                        },
                        "label": {
                          "description": "What was sold",
                          "type": "string"
                        },
                        "sme": {
                          "description": "Shares of a young SME bought within 10 years of its creation (enhanced abatement)",
                          "type": "boolean"
                        },
                        "years_held": {
                          "description": "Full years held",
                          "maximum": 100,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["gain"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "interest": {
                    "description": "Interest (bank accounts, bonds), gross; not regulated savings like the Livret A, euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "losses_carried": {
                    "description": "Capital losses carried forward from earlier years (10 years), euros for 2026",
                    "minimum": 0,
                    "type": "number"
                  },
                  "option": {
                    "description": "pfu (flat tax 12.8% + social levies) or bareme (option for the progressive scale, case 2OP: 40% off dividends, holding-period abatements). Both are always computed. Default pfu",
                    "enum": ["pfu", "bareme"],
                    "type": "string"
                  }
                },
                "type": "object"
