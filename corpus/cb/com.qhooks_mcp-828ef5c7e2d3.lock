{
  "lockfileVersion": 2,
  "subjects": {
    "com.qhooks/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qhooks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "qhooks",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "agent_stats",
          "description": "Read a bounded window of stored final referral credits by asset. Coverage is partial; routed volume, USD earnings and claimable balances remain unknown. Never refreshes rewards providers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "referrer": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["referrer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7efc2de6ef770e1c0348a2c9f6d0a19e01bead54840ab7ec951eff04ec59aa52"
        },
        {
          "name": "caller_record",
          "description": "Read bounded public scored-call records for an exact EVM wallet, retaining quote units, hidden-text rules and incomplete coverage. Never refreshes prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c38350384249282ab734532c4c56d9a53ecf263fc245189f096dcd1d89898129"
        },
        {
          "name": "hooks_catalog",
          "description": "Search the existing hook snapshot and listed builder modules. Source dates and unknown builder cuts stay explicit; bounded cached QProof links never start checks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "search": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48337cc04d766b47b0db709f0dc72ac091c479cede7c55b8ddb2d1b70adf028d"
        },
        {
          "name": "list_callers",
          "description": "Read the existing public caller-price method from stored records. Rank only complete eligible observations; no token-feed callout, wallet PnL or independence claim is inferred.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b394b3c4dc12889921f0ca42e1333368d9ff09ad4a31690a95afa2e14222b50"
        },
        {
          "name": "list_launches",
          "description": "Read recent QHooks launches. Missing something? Call send_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain id, key or name from the QHooks chain registry.",
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d97a51bf0c4f69e9dfa07c4570f6a0fe53ce4ea114041a2794afd5ec65c636a8"
        },
        {
          "name": "prepare_launch",
          "description": "Prepare a launch link for review and wallet signing on qhooks.com. Missing something? Call send_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain id, key or name from the QHooks chain registry.",
                "type": "string"
              },
              "name": {
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "referrer": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "style": {
                "type": "string"
              },
              "ticker": {
                "pattern": "^[A-Za-z0-9]{1,10}$",
                "type": "string"
              }
            },
            "required": ["name", "ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a393279b60c87ad28d14393e72dec60b93adedc84a63a8f9f7b55574b5238d1e"
        },
        {
          "name": "prepare_trade",
          "description": "Prepare ordered unsigned approvals and a QHooks fee-router swap for the user wallet. Missing something? Call send_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amountIn": {
                "description": "Amount in raw currency units. Buys use the pool quote currency; sells use the token.",
                "pattern": "^[1-9][0-9]{0,37}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain id, key or name from the QHooks chain registry.",
                "type": "string"
              },
              "referrer": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "side": {
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "slippageBps": {
                "maximum": 9999,
                "minimum": 0,
                "type": "integer"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "trader": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["amountIn", "chain", "side", "token", "trader"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fb37db1ea12fe2ed9aac31d3ba7bd83b6cfab4755f03aa2cd0d82c19deeed68"
        },
        {
          "name": "qproof_check",
          "description": "Read the latest stored QProof verdict and checks for an exact token. Cache-first; never runs code or starts a check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "type": "string"
              },
              "token": {
                "maxLength": 44,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e0724f8596e8aaac5362c27acd1a52576f5d3f320fd8332ca4ecd4806539335"
        },
        {
          "name": "quote",
          "description": "Simulate an exact-input pool swap with the existing V4Quoter API. Missing something? Call send_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amountIn": {
                "description": "Amount in raw currency units. Buys use the pool quote currency; sells use the token.",
                "pattern": "^[1-9][0-9]{0,37}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain id, key or name from the QHooks chain registry.",
                "type": "string"
              },
              "pool": {
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "trader": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "zeroForOne": {
                "type": "boolean"
              }
            },
            "required": ["amountIn", "chain", "pool", "zeroForOne"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24e94ecd235c0f59feeeb7d04b52f0a9d35ba63825b68c65fc490674a164d998"
        },
        {
          "name": "send_feedback",
          "description": "Tell the QHooks team what you were missing: a tool, a bug, wrong data or unclear docs. We read agent feedback every day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "Your agent or app name.",
                "maxLength": 64,
                "type": "string"
              },
              "kind": {
                "enum": ["missing_tool", "bug", "data", "docs", "other"],
                "type": "string"
              },
              "text": {
                "description": "What you needed or what went wrong, in plain words.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The tool you were using, if any.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62a8c37d1b107f4f399d01e3342837128dcbcdadc9d330684f62a8c68a36cd34"
        },
        {
          "name": "token_info",
          "description": "Read a token market on QHooks. Missing something? Call send_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain id, key or name from the QHooks chain registry.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d3861838a47c9ca7f08669d63d3da3a38659f8d1c59cfb69e37514db1513de5"
        },
        {
          "name": "wallet_portfolio",
          "description": "Read the same cached portfolio report used by QHooks. A cold or expired cache returns unavailable; this tool never refreshes paid providers. Cost and PnL remain qualified data from the report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "maxLength": 44,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:670aa0f369da99439c507b33698b68f57dae26c24e2664b6aabe882911cc0fb5"
        }
      ],
      "digest": "sha256:7b82463529c97b61c52d738294105026aa1c932960a86b42d82c7d2501f448d9"
    }
  }
}
