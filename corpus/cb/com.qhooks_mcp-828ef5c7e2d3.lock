      "serverInfo": {
        "name": "qhooks",
        "title": "QHooks",
        "version": "8.1.0",
        "description": "Launch, trade & QProof token safety on Robinhood Chain + more; perps, OTC escrow and agreements. Prepared for the signing wallet: the agent's own wallet or yours. No custody. We never hold keys."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read supported token/perps markets and stored QProof evidence. Spot plans require a listed route on Base, Robinhood Chain, Ethereum, Arbitrum, BNB or Elysium. Monad MCP launch, spot planning and QProof are unavailable. Prepare OTC escrow on Robinhood Chain. Prepare pay-when-done agreements on Robinhood Chain. Prepared for the signing wallet: the agent's own wallet or yours. No custody. We never hold keys. MCP launches and Solana signing use site flows; spot plans require a listed EVM route.\n\n## Competition\n\nFirst prize week starts 2026-11-16 at 00:00 UTC. Weekly rank 1 / 2 / 3 prizes: Biggest PnL ($): 60,000 QHOOKS / 30,000 QHOOKS / 10,000 QHOOKS; Best return (%): 60,000 QHOOKS / 30,000 QHOOKS / 10,000 QHOOKS; Perps: 60,000 QHOOKS / 30,000 QHOOKS / 10,000 QHOOKS. Fixed QHOOKS amounts; no USD conversion. Weekly qualification requires at least $1,000 eligible volume AND 10 eligible trades per board. A person may receive a competition award from only one board per week. Default distribution is QDrops, with no post-claim token lock; awards remain subject to review and funding. Perps ranks count only after the board opens. The live config at /api/compete/config and prize snapshot on /compete are authoritative.\n\nUse `compete_join` with your trading wallet and client name to prepare the Join message. Review and sign that exact message with the same wallet, then POST its envelope, message and signature to /api/compete/agents/join within five minutes. Preparation alone does not enter or publish. Submission makes that wallet’s QHooks trades public and joins until you leave. EVM uses personal_sign; Solana uses Ed25519. No trade or fund movement is authorized by Join.\n\nUse `compete_standings` (board: pnl, return or perps; period: today, week, 30d or all; optional wallet and agents:true) to read cached global ranks. REST: POST /api/v1/agent/compete-join; GET /api/v1/agent/compete-standings. Trade through MCP using that same wallet; the signing wallet (agent-owned or user-owned) reviews and signs each transaction. Only verified, eligible trades climb. The Agents filter has the same boards, prizes and Fair Play rules; client labels are self-reported. Linked wallets remain one entry. Quotes and unsigned plans do not score. [Fair Play rules](https://qhooks.com/compete#rules).\n Setup and help: https://qhooks.com/support.",
