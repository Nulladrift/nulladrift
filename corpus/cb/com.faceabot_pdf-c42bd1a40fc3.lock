{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/pdf": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pdf.faceabot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "faceabot-pdf",
        "title": "Faceabot PDF",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot PDF: read the text of any public PDF (parse, read, extract text page by page), free, no key.\npdf_extract_text {\"url\":\"https://…/file.pdf\"} (pages \"1-3\" optional; start to continue a long text); pdf_info {\"url\":…} for pages and metadata.\nUp to 10 MB. Scanned PDFs (images only) have no text: use an OCR tool. Sample: https://pdf.faceabot.com/sample.pdf\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "pdf_extract_text",
          "title": "Extract text from a PDF",
          "description": "Reads a PDF from its public https address and returns its text, page by page (parse / read a PDF: invoices, papers, reports, contracts, forms…). Up to 10 MB; use start to read further.\nUse when: you need the text content of a PDF file. Not for scanned PDFs (images only): those need OCR.\nExample: {\"url\":\"https://pdf.faceabot.com/sample.pdf\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "default": 20000,
                "maximum": 50000,
                "minimum": 500,
                "type": "integer"
              },
              "pages": {
                "description": "Optional pages to read, e.g. \"1-3\" or \"2,5\". Default: all",
                "type": "string"
              },
              "start": {
                "default": 0,
                "description": "Character offset to continue a long text",
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Public https address of the PDF file",
                "examples": ["https://pdf.faceabot.com/sample.pdf"],
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d023ae23741405ce766c6180031fcac6a0a9857c3d28f9cca31d66aa68574147"
        },
        {
          "name": "pdf_info",
          "title": "PDF information",
          "description": "Number of pages, title, author, creation date and whether the PDF has extractable text.\nUse when: you want to know what a PDF is before reading it.\nExample: {\"url\":\"https://pdf.faceabot.com/sample.pdf\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public https address of the PDF file",
                "examples": ["https://pdf.faceabot.com/sample.pdf"],
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:076678c0a7241763bdf5d99ef4637932b62119aea02a81b68fd13d9e722d31db"
        }
      ],
      "digest": "sha256:d67f753bfdf962b991673ab634f5ffed2fe87ccd2a208eb0da2f8714eb8c2fc6"
    }
  }
