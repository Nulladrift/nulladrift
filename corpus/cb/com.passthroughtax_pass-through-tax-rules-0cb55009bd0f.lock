      "serverInfo": {
        "name": "pass-through-tax-rules",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Deterministic cited rules for US pass-through entity tax, the federal SALT cap, and bonus-depreciation conformity. Answers are informational, not tax advice. If a tool returns not_covered or unverified, do not fill the gap from memory.",
      "tools": [
        {
          "name": "bonus_conformity",
          "title": "Bonus depreciation conformity",
          "description": "Whether a state conforms to IRC 168(k) bonus depreciation and IRC 179 for a tax year, its IRC conformity date, and the add-back or subtraction in plain terms. Unverified fields are null. Unknown states and years are not_covered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "Postal code or full state name. The District of Columbia is DC. New York City is NYC.",
                "type": "string"
              },
              "tax_year": {
                "description": "Tax year, such as 2026. Files are tax-year specific.",
                "type": ["number", "string"]
              }
            },
            "required": ["state", "tax_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbe22d34f9b368009fb7d5e0f9fdd02ca9fae6db363a45aef3ccdd10c9d30e3a"
        },
        {
          "name": "coverage",
          "title": "Coverage",
          "description": "List jurisdictions and tax years in this dataset. elective_ptet_2026 counts only 2026 files with an elective PTET. no_elective_ptet_2026 and not_effective_2026 are separate and are not PTET states for 2026.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e56e1eb82544dbb4e6fba881b9ec3fecf9d3af084afc829be4c686d0e174994"
        },
        {
          "name": "ptet_rules",
          "title": "Pass-through entity tax",
          "description": "Elective pass-through entity tax for one state and tax year: eligibility, who elects, deadline, rate, owner credit or exclusion, estimates, and sunset. Returns not_covered when this server has no file. Informational, not tax advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "Postal code or full state name. The District of Columbia is DC. New York City is NYC.",
                "type": "string"
              },
              "tax_year": {
                "description": "Tax year, such as 2026. Files are tax-year specific.",
                "type": ["number", "string"]
              }
            },
            "required": ["state", "tax_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3edc611ac1fc87ca642fae32affe141f4d405629bdd9ee7df728cfc0cd224e4"
        },
        {
          "name": "salt_cap",
          "title": "Federal SALT cap",
          "description": "Compute the federal SALT deduction cap under 26 USC 164(b)(6) and (b)(7) for a tax year, filing status, and modified adjusted gross income. Returns the cap and the steps, not the deduction. Years before 2018 are not_covered. MAGI is used to compute and is not written to the usage log.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filing_status": {
                "description": "single, married_filing_jointly, married_filing_separately, head_of_household, or qualifying_surviving_spouse. Aliases: mfj, mfs, hoh, qss.",
                "type": "string"
              },
              "magi": {
                "description": "Modified adjusted gross income: AGI plus IRC 911, 931, and 933 exclusions. Integer or decimal string, at most 8 decimal places.",
                "type": ["number", "string"]
              },
              "tax_year": {
                "description": "Tax year. 2018 through 2024 use the prior flat cap. 2025 and later use section 164(b)(7).",
                "type": ["number", "string"]
              }
            },
            "required": ["filing_status", "magi", "tax_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
