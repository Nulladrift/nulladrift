        {
          "name": "match_jobs",
          "title": "Match jobs to a candidate",
          "description": "Find and rank the best live postings for one specific candidate, such as someone who shared a resume or described their experience, skills or visa needs. Slow: it reads each posting's full description, so a call can take 10 to 15 seconds. For browsing, listing or counting postings, use search_jobs, which answers in under a second. Filters active jobs by title terms (any of them; a term matches when the title holds all its words), excluded title terms, companies, locations and posting window, then takes the newest 300 of that pool (pool_total says how many matched) and reads each full description. It drops postings with no usable description, postings whose stated minimum years of experience exceed candidate_years by more than 1, and, with needs_sponsorship, postings that refuse sponsorship or require citizenship or a clearance; dropped counts each reason. The rest are ranked by how many skills appear in the description, then newest first. Each result carries skills_matched, years_bar, flags and up to 6 requirement sentences. The screening is heuristic: read finalists in full with get_job.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "candidate_years": {
                "description": "Candidate years of professional experience; drops postings that require more than one year beyond it.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "companies": {
                "description": "Exact company names from list_companies. With titles, a posting must match both.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              },
              "exclude_companies": {
                "description": "Company names to leave out, case-insensitive, e.g. the current employer.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              },
              "exclude_titles": {
                "description": "Title terms that remove a posting, matched like titles, e.g. \"senior\", \"staff\", \"lead\", \"manager\".",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              },
              "include_anywhere": {
                "default": true,
                "description": "With locations, also keep fully remote \"Anywhere\" postings. Default true.",
                "type": "boolean"
              },
              "limit": {
                "default": 15,
                "description": "Results to return, default 15.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "country-XX (ISO alpha-2) for a country, or state and city identifiers from search_locations. Omit for worldwide.",
                "items": {
                  "maxLength": 100,
                  "pattern": "^(?:country-[A-Za-z]{2}|state-[A-Za-z]{2}-(?=\\S)[^-\\r\\n]{1,64}|city-[A-Za-z]{2}-(?=\\S)[^-\\r\\n]{1,64}-\\S{1,80})$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "needs_sponsorship": {
                "default": false,
                "description": "Drop postings that refuse visa sponsorship or require citizenship or a security clearance. Default false.",
                "type": "boolean"
              },
              "posted_within": {
                "default": "7d",
                "description": "Posting window: 24h, 7d (default) or 30d.",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "skills": {
                "description": "Specific skills and domain terms from the resume, as whole words or phrases. They rank results and never filter.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "titles": {
                "description": "Title terms, any of which may match. A term matches when the title contains all its words as whole words, in any order: \"software engineer\" also matches \"Engineer, Software\". Required unless companies is given.",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              },
              "work_mode": {
                "description": "Only postings explicitly marked remote or hybrid.",
                "enum": ["remote", "hybrid"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df8d68f3b448005095474a4001057e62ee64e04e77f8f8ffaf7b142ae35f0d21"
        },
        {
          "name": "search",
          "title": "Search JobYap (deep research)",
          "description": "Search JobYap job postings by natural-language query. Matches job titles, falling back to significant keywords when the full phrase finds little. Returns result ids, titles and citable URLs for use with fetch. For structured filtering (location, company, remote, freshness) prefer search_jobs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8d7d99be98b151bd57114f732eb80376aea97d237314fad9465ddbd80a60b93"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search JobYap's aggregated job postings with structured filters. Fast (under a second): use it to browse, list, count or page through postings and to answer general questions about who is hiring. To find the best postings for one specific person (a resume, or their experience, skills or visa needs), use match_jobs instead. The text query matches job titles only (case-insensitive substring) — try synonyms or shorter tokens when results are thin. Company names must exactly match values from list_companies; locations must be identifiers from search_locations. work_mode matches jobs explicitly marked remote or hybrid (unmarked means unstated, not onsite). Results are active listings, newest first by default; sort=popular ranks by discussion activity. To paginate, pass next_cursor back as cursor and keep every other argument identical.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "companies": {
                "description": "Exact company names from list_companies.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "cursor": {
                "description": "Opaque cursor from a previous next_cursor.",
                "maxLength": 512,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "has_comments": {
                "description": "Only jobs with community discussion.",
                "type": "boolean"
              },
              "include_total": {
                "description": "Also compute the total match count (slower).",
                "type": "boolean"
              },
              "locations": {
                "description": "Location identifiers from search_locations, e.g. city-US-CA-san_francisco.",
                "items": {
                  "maxLength": 100,
                  "pattern": "^(?:country-[A-Za-z]{2}|state-[A-Za-z]{2}-(?=\\S)[^-\\r\\n]{1,64}|city-[A-Za-z]{2}-(?=\\S)[^-\\r\\n]{1,64}-\\S{1,80})$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "page_size": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "posted_within": {
                "description": "Hard freshness filter on the publish date.",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "query": {
                "description": "Substring matched against job titles only.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "description": "recent (default) or popular (most discussed).",
                "enum": ["recent", "popular"],
                "type": "string"
              },
              "work_mode": {
                "enum": ["remote", "hybrid"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e22a679a04279882d7cbe2fc63950c1ec3d2de53e838693b6f2f527a80ad858"
        },
        {
          "name": "search_locations",
          "title": "Search locations",
          "description": "Resolve a free-text place name (\"toronto\", \"Japan\", \"Texas\") to the location identifiers search_jobs accepts (country-XX, state-XX-YY, city-XX-YY-name). Searches every place JobYap knows, not only those with current openings, so an identifier may match no jobs. City display omits the state, and the list can be shorter than limit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Place name fragment, minimum 2 characters.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:856daf9263f0c006f17ac98500dbb7ac05577693c89891c4fa81d8fb279473a6"
        }
      ],
      "digest": "sha256:ff34f858cc9c99a8bdd2534189ba2bf2e787ba0ac956641761ef86f7a6413cd7"
    }
  }
