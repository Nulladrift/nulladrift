          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 2147483647,
                    "type": "integer"
                  },
                  {
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Numeric JobYap job id, a full jobyap.com job URL, or a job page slug."
