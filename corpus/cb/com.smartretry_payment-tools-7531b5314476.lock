{
  "lockfileVersion": 2,
  "subjects": {
    "com.smartretry/payment-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tools.mcp.smartretry.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "smartretry-tools",
        "title": "SmartRetry Payment Tools",
        "version": "1.0.0",
        "websiteUrl": "https://www.smartretry.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SmartRetry Payment Tools: free, read-only lookups for card payments. Use lookup_bin to identify a card from its first 6 to 8 digits (BIN / IIN), lookup_issuer to find a card issuing bank, lookup_mcc for merchant category codes, and lookup_decline_code to explain why a payment was declined or failed. Never send full card numbers.",
      "tools": [
        {
          "name": "lookup_bin",
          "title": "BIN lookup",
          "description": "BIN / IIN lookup (card BIN checker). Returns the card network (Visa, Mastercard, Amex and others), card type (credit, debit, prepaid), card level, issuing bank and country for the first 6 to 8 digits of a card number. Use it to identify a card or where it was issued. Never pass a full card number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bin": {
                "description": "The first 6 to 8 digits of a card number (the BIN / IIN). Digits only. Never send a full card number.",
                "pattern": "^\\d{6,8}$",
                "type": "string"
              }
            },
            "required": ["bin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b910de697d185f2d5df8a3acc6c19069623b34f5c4ebb4f3e0406c49bdb456d"
        },
        {
          "name": "lookup_decline_code",
          "title": "Decline code lookup",
          "description": "Explain why a card payment was declined or failed. Accepts a decline code, response code, refusal reason or error message (for example \"51\", \"05\", \"do_not_honor\" or \"insufficient funds\") from card networks and processors such as Visa, Mastercard, Stripe and Adyen. Optionally narrow by provider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "A decline code or message, for example \"51\", \"05\", \"do_not_honor\" or \"insufficient funds\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "provider": {
                "description": "Optional provider or card network to narrow the result, for example \"Visa\", \"Mastercard\" or \"Stripe\".",
                "maxLength": 50,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:febc87aac9a988e7094aab5e551e9119a15a717940961163934d857c166f4950"
        },
        {
          "name": "lookup_issuer",
          "title": "Issuing bank lookup",
          "description": "Find card issuing banks by name, with their country, website and phone number. Accepts partial or misspelled names. Use it to confirm the bank behind a card or to find how to contact an issuer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Issuing bank name or part of it, for example \"chase\" or \"Barclays\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c25266d5bec9efccfab95f071aa5ce0d195dc75371b2a4f1e7f50d9b5b3caa9a"
        },
        {
          "name": "lookup_mcc",
          "title": "Merchant category code (MCC) lookup",
          "description": "Merchant category code (MCC) lookup. Pass a 4-digit MCC for its full definition (category group, high-risk flag, Visa and Mastercard definitions), or describe a business (for example \"grocery store\" or \"software\") to find the matching MCC.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A 4-digit merchant category code (for example \"5411\") or a business type (for example \"grocery\").",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cea1138b8bacd2ce040acffca9cfa5bef8ed565b7f559aa2ad4209765e7f74d1"
        }
      ],
      "digest": "sha256:1118021239dc38c481cc6846183c9223b57727a279e2eb47184572527f177324"
    }
  }
}
