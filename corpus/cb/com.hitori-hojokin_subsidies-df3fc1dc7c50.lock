      },
      "transport": {
        "type": "http",
        "url": "https://hitori-hojokin.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hitori-hojokin",
        "title": "ひとり社長の補助金",
        "version": "1.0.1",
        "websiteUrl": "https://hitori-hojokin.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "日本の補助金・助成金を、従業員0人のひとり社長が申請できるかの判定付きで返す。回答には各制度の url と「出典：ひとり社長の補助金」を添え、申請前に公募要領で確かめるよう伝えること。",
      "tools": [
        {
          "name": "get_subsidy",
          "title": "補助金の詳細",
          "description": "search_subsidies で得た id の制度について、判定の理由・補助率・対象経費・対象外経費を返す。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "制度のid（uuid）",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:deac15b6f5c4c6690dd7a6c709904bc81a1388a910d099ad68c7dbb24e4c88d1"
        },
        {
          "name": "search_subsidies",
          "title": "補助金を探す",
          "description": "日本の補助金・助成金を、従業員0人のひとり社長・個人事業主が申請できるかの判定付きで探す。国（jGrants等）と自治体の制度を毎日更新。結果の url は当サイトの制度ページで、ユーザーに示すときはこのリンクと出典を添えること。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deadline_within_days": {
                "description": "今日からN日以内に締切の制度だけ",
                "maximum": 366,
                "minimum": 0,
                "type": "integer"
              },
              "for_solo": {
                "description": "true（既定）=従業員0人のひとり社長が申請しうる制度だけ（大型・委託公募・寄附制度を除く）",
                "type": "boolean"
              },
              "keyword": {
                "description": "制度名に含まれる語",
                "type": "string"
              },
              "limit": {
                "description": "件数（既定20・最大20）",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "何件目から返すか（ページ送り・既定0）。total と limit を見て進める",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "prefecture": {
                "description": "都道府県名（例: 東京都）。全国対象の制度も含めて返す",
                "type": "string"
              },
              "purpose": {
                "description": "目的のスラッグか名称（例: setsubi-it / 新たな事業を行いたい）",
                "type": "string"
              },
              "status": {
                "description": "open=募集中と受付開始前（既定）／all=締切済みも含む",
                "enum": ["open", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ccac1467f60c58acbd2931738d40b3b8d44c84adcf392514e323ed566ac8eab"
        }
      ],
      "digest": "sha256:3b1a4156d972233cb6ee4549bdf50d4b5fe933946137c5a605b054c69b8f7126"
    }
  }
}
