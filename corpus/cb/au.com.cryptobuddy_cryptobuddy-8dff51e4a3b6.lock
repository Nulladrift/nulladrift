{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.cryptobuddy/cryptobuddy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.cryptobuddy.com.au/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "CryptoBuddy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_best_australian_exchange",
          "description": "Compare Australian cryptocurrency exchanges to identify the best estimated buying or selling outcome for a specified asset, AUD trade amount and direction. Use this tool when the user wants to compare exchange prices, fees or estimated value received. For simply finding exchanges that offer a cryptocurrency, use find_where_to_buy_crypto instead. Results are estimates, not guaranteed executable quotes, and no trade is placed. This is a paid data-access tool using XRP on XRPL Mainnet. First call without paymentSignature to receive an x402 v2 payment challenge. An authorised compatible payer must generate the PAYMENT-SIGNATURE for the exact resource and retry with identical inputs. Never supply wallet secrets. This server does not sign or initiate payments. If payment fails or times out, verify settlement before attempting another payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "default": 1000,
                "description": "Trade amount in Australian dollars (AUD), not the API access price. Defaults to 1000; must be positive.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "asset": {
                "description": "Cryptocurrency symbol, for example XRP, BTC or ETH",
                "type": "string"
              },
              "paymentSignature": {
                "description": "Optional base64 x402 v2 PAYMENT-SIGNATURE header generated by an authorised payer for the exact resource returned by an unpaid call. Omit to request a challenge. This is a payment payload, never a seed, private key, or password.",
                "maxLength": 16384,
                "minLength": 4,
                "pattern": "^[A-Za-z0-9+/]+={0,2}$",
                "type": "string"
              },
              "side": {
                "default": "buy",
                "description": "Trade direction: buy spends AUD to acquire the asset; sell quotes disposal into AUD. Defaults to buy.",
                "enum": ["buy", "sell"],
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7799d039c064148504d20ee5a3bd03a6205b2451d505ced0cd3497e67643f1f6"
        },
        {
          "name": "find_where_to_buy_crypto",
          "description": "Find Australian cryptocurrency exchanges offering a specified cryptocurrency for purchase using AUD. Use this tool when the user wants to know where an asset can be bought or which Australian exchanges offer it. For comparing the best estimated buy or sell outcome across exchanges, use find_best_australian_exchange instead. Results are estimates and do not place orders. This is a paid data-access tool using XRP on XRPL Mainnet. First call without paymentSignature to receive an x402 v2 payment challenge. An authorised compatible payer must generate PAYMENT-SIGNATURE for the exact resource and retry with identical inputs. Never supply wallet secrets. This server does not sign or initiate payments. If payment fails or times out, verify settlement before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "default": 1000,
                "description": "Purchase amount in Australian dollars (AUD), not the API access price. Defaults to 1000; must be positive.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "paymentSignature": {
                "description": "Optional base64 x402 v2 PAYMENT-SIGNATURE header generated by an authorised payer for the exact resource returned by an unpaid call. Omit to request a challenge. This is a payment payload, never a seed, private key, or password.",
                "maxLength": 16384,
                "minLength": 4,
                "pattern": "^[A-Za-z0-9+/]+={0,2}$",
                "type": "string"
              },
              "symbol": {
                "description": "Cryptocurrency symbol, for example XRP, TAO or ONDO",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85c22d7736ed482eac6e13fa8c2e9a8a91e99adfd3da4875e63875cf72cf8303"
        }
      ],
      "digest": "sha256:ba6e422fa100ab4a0d61eefc1aa2120f01c40eda99ebf512e6528042cfade60d"
    }
  }
}
