        {
          "name": "publish_resource_package",
          "title": "Publish agent resource package",
          "description": "Publish an immutable canonical hosted package release. Requires a confirmed-user Bearer with active superskill:managed scope, semantic version and idempotency key. Returns unreviewed trust; never grants a Verified badge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "truncated": {
                      "type": "boolean"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 120,
                "minItems": 1,
                "type": "array"
              },
              "idempotencyKey": {
                "maxLength": 200,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "resourceType": {
                "type": "string"
              },
              "sourceUrl": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "version": {
                "pattern": "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$",
                "type": "string"
              },
              "worksWith": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["files", "idempotencyKey", "version"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "code": {
                "const": "OK",
                "type": "string"
              },
