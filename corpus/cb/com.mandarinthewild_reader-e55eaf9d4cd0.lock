          },
          "digest": "sha256:79c14a45e26dc68cab648311e6bb7bd12123d03de9b5726a9a7c20d91779bd09"
        },
        {
          "name": "inspect_mandarin_word",
          "title": "Understand a word in its sentence",
          "description": "Inspect the Mandarin word or pattern at a Unicode code-point offset in the exact supplied passage. Returns MTW’s contextual word card with expected pinyin, meaning status, parts and offered alternatives. Count Unicode code points, not UTF-16 units; preserve the original passage. A null card means no applicable Mandarin target. Does not save or grade learning.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Zero-based Unicode code-point position in the original text.",
                "maximum": 4095,
                "minimum": 0,
                "type": "integer"
              },
              "text": {
                "description": "Exact original Mandarin passage, including punctuation and whitespace; at most 4,096 Unicode code points. Do not translate or rewrite it.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["offset", "text"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "__schema0": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "items": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "type": "array"
                  },
                  {
