        {
          "name": "save_mandarin_word",
          "title": "Save a chosen Mandarin word to Backpack",
          "description": "Use this when the learner explicitly asks to save, keep or remember a word: saves one word from the exact passage to the connected MTW Backpack, where Review brings it back. Re-inspects the word through MTW; for an ambiguous meaning, pass only the sense ID the learner selected from the offered choices. Preserve text, context and title. Use one operation UUID for this save and reuse it after a lost reply. Does not mark the word known, grade recall, or save the entire passage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "choice": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "confirm": {
                "const": "save",
                "type": "string"
              },
              "destination": {
                "description": "Destination returned by get_mandarin_account. A consistency check, never account authority.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "offset": {
                "maximum": 4095,
                "minimum": 0,
                "type": "integer"
              },
              "operation": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "text": {
                "description": "The Mandarin passage exactly as the learner gave it, or exactly as you wrote it for them, including punctuation and whitespace; at most 4,096 Unicode code points. Never translate or rewrite a learner's text.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 240,
                "type": "string"
              },
              "zone": {
                "description": "The learner's IANA time zone, when known, so the save counts on their own day.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["confirm", "destination", "offset", "operation", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
