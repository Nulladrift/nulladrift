                      "type": "string"
                    },
                    "type": "object"
                  }
                ]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "card": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "engine": {
                "type": "string"
              },
              "kind": {
                "const": "inspection",
                "type": "string"
              },
