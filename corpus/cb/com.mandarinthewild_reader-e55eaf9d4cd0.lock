        {
          "name": "read_mandarin",
          "title": "Read real Mandarin",
          "description": "Open an interactive reader for a Mandarin article excerpt, message or subtitle passage the user supplies. Hover or tap words for meaning in context, pinyin, parts and uncertainty. Keeps the original text; anonymous and does not save it. Use inspect_mandarin_word for one specific word. Does not fetch links or transcribe media.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "Exact original Mandarin passage, including punctuation and whitespace; at most 4,096 Unicode code points. Do not translate or rewrite it.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "__schema0": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "items": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "type": "array"
                  },
                  {
                    "additionalProperties": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "propertyNames": {
                      "type": "string"
