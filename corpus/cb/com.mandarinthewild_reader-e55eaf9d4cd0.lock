        {
          "name": "read_mandarin",
          "title": "Read real Mandarin",
          "description": "Use this when the learner wants to read Mandarin text: an article excerpt, message or subtitle they paste, or a short passage, story or dialogue you write for them when they ask to practice reading. Opens an interactive reader where they hover or tap words for meaning in context, pinyin, parts and uncertainty, and can save a word to review later. Keeps the text exactly; reading is anonymous and saves nothing. Use inspect_mandarin_word for one specific word. Does not fetch links or transcribe media.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The Mandarin passage exactly as the learner gave it, or exactly as you wrote it for them, including punctuation and whitespace; at most 4,096 Unicode code points. Never translate or rewrite a learner's text.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "__schema0": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "items": {
                      "$ref": "#/$defs/__schema0"
                    },
