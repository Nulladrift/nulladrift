              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://mandarin-the-wild/reader-v1.html"
          },
          "digest": "sha256:5b5003d3eb4f9d8d08d407ea6d4e15d4bae6f0a366a42ff775a47adeb62ec58d"
        }
