        },
        {
          "name": "inspect_mandarin_word",
          "title": "Understand a word in its sentence",
          "description": "Use this when the learner asks what one Mandarin word or pattern means, how it is said or what it is made of: pass its sentence and the word's offset, or the word alone at offset 0. Returns MTW’s contextual word card with expected pinyin, meaning status, parts and offered alternatives. Count Unicode code points, not UTF-16 units; preserve the original passage. A null card means no applicable Mandarin target. Does not save or grade learning.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Zero-based Unicode code-point position in the original text.",
                "maximum": 4095,
                "minimum": 0,
                "type": "integer"
              },
              "text": {
                "description": "The Mandarin passage exactly as the learner gave it, or exactly as you wrote it for them, including punctuation and whitespace; at most 4,096 Unicode code points. Never translate or rewrite a learner's text.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 240,
                "type": "string"
              }
            },
            "required": ["offset", "text"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "__schema0": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "items": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "type": "array"
                  },
                  {
                    "additionalProperties": {
