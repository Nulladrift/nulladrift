                    "additionalProperties": {
                      "$ref": "#/$defs/__schema0"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "engine": {
                "type": "string"
              },
              "kind": {
                "const": "inspection",
                "type": "string"
              },
              "offset": {
