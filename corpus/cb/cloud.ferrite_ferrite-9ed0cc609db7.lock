        {
          "name": "set_notify_channel",
          "title": "Register a notification push channel",
          "description": "PUSH: register a signed-webhook RECEIVER for your notification feed, so the platform TELLS you when your production changes state instead of you polling. `url` must be https. The platform returns a shared `secret_hex` ONCE (it is sealed at rest afterwards): every delivery POSTs {\"signature\":\"t=<unix>,v1=<hmac-sha256>\",\"payload\":\"<the event JSON, verbatim>\"}, where the HMAC is over \"{t}.{payload}\" with that secret — the SAME scheme Stripe uses (and that this platform verifies on inbound provider webhooks), so verify it with any standard implementation. Deliveries are at-least-once and resume EXACTLY where they stopped: the cursor advances only on a 2xx, retries back off (5s..5min), and nothing is ever lost — the durable feed (`notifications`) remains the source of truth. Setting a channel starts from NOW (no backlog replay). Delivery rides the platform's audited egress gate under a token scoped to YOUR url alone. Returns {NotifyChannelSet:{url,secret_hex}}.",
          "inputSchema": {
            "properties": {
              "secret_hex": {
                "description": "optional: your own signing secret (16..=64 bytes of hex); omit to have the platform generate one",
                "type": "string"
              },
              "token": {
                "description": "fallback bearer for clients that cannot send an Authorization header; when a header is present omit this argument, because a different token is refused",
                "type": "string"
              },
              "url": {
                "description": "the https receiver URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
