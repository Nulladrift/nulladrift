        {
          "name": "cut_release",
          "title": "Cut an immutable release",
          "description": "Cut an IMMUTABLE release name for a committed revision (a reproducible snapshot). 'reference' is a branch name or commit id (omit for the 'main' head). When the platform requires tests, the commit must carry a PASSING verdict (a release is a tested snapshot). Returns {Released:{app,release,commit}}, {AlreadyReleased}, or {Rejected}.",
