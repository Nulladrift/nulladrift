      "instructions": "Ferrite MCP. This connection is not signed in yet. A client that signs in (a connector, or a remote server in Claude, ChatGPT, Codex, Cursor or Gemini) opens Ferrite's connect page when you call an account tool such as account: the person chooses Try Ferrite without an account (48 hours, $50 of credit) or Sign in to your Ferrite account, and you never call provision or provision_ephemeral. Only a client that cannot open a browser calls provision_ephemeral once (no arguments) and uses the token it returns for every call. There is no ferrite CLI here and you need none.\n\nA small web app (poll, RSVP, sign-up sheet, guestbook, scoreboard) is one Rust file and ONE build:\n1. read_docs {\"doc\":\"page-app-starter\"}: a deployed-and-verified app (Cargo.toml, spec, src/main.rs) with a form POST and stored counts. Read nothing else first: no other docs, no packages, no Alloy.\n2. Adapt its constants, handle() and render(). Set the spec's \"name\" and artifact_key (apps/<name>@v1).\n3. validate_spec and code_gate (free, seconds). Fix what they report.\n4. deploy_source {spec, files} once. Then build_status {build_id, wait_s: 50} until deployed (host) or rejected (fix the reasons, deploy_source once more). Each call waits up to 50 s for the state to change, so no sleeping in a shell; a build takes 3-8 minutes, so keep calling and do not end your turn while it runs.\n5. Reply with https://<host>/.\nTests are a follow-up once the app is live, not a gate before the first deploy: do not use rcs_commit, test_ref or deploy_ref for it.\nCrypto and random IDs/tokens: `ferrite_app::crypto` exports `sha256`, `hmac_sha256`, `ct_eq`, `hex`, base64, and JWT keys only — there is no `ferrite_app::crypto::random_bytes` / `random_token` (and `rand`/`getrandom` are refused). Use `packages: [\"sha256-hmac\"]` (`crate::crypto::random_bytes` / `random_token`) or derive 32 OS-CSPRNG bytes inline with `ferrite_app::crypto::hmac_sha256(&ferrite_app::crypto::Ed25519SigningKey::generate_pkcs8(), b\"app/token/v1\")`.\n\nCopy an app with its data, then change the copy:\n1. fork {\"app\":\"<app>\",\"fork_app\":\"<new-name>\"}; build_status until deployed (the fork's host).\n2. code_gate the edited files (seconds), then deploy_source with them and the same spec except \"name\": \"<new-name>\" and artifact_key apps/<new-name>@v1. The name must be exactly the fork_app you chose, without the account prefix; keep the service names and the copied data stays. One build, no test_ref or deploy_ref.\n3. build_status {build_id, wait_s: 50} until deployed, then reply with both URLs.\n\nRepair an existing app:\nKeep the existing account, app name, service names and security requirements.\nInspect the current revision with `rcs_checkout {app}`; if the client saves a\nlarge reply to a file, read the relevant files from that saved result once.\nDo not repeatedly print or repackage the complete generated source tree.\n\n1. Edit the authored files needed for the repair. Leave unchanged package files\n   in the repository; adapt a package at the application boundary when possible.\n2. Run the applicable source/spec checks. `code_gate` checks source policy, not\n   compilation or functional correctness.\n3. Submit `rcs_commit {app, files, message}` with only changed files, each with\n   its complete contents. It overlays the repository head: omitted files stay;\n   omission does not delete a file. Preserve the manifest unless it needs a\n   change, and confirm its application name matches the app being repaired.\n4. Save `RcsCommitted.commit`. Run any required tests against that exact\n   revision with `test_ref {app, reference: commit}` and wait for `tested`.\n   A required passing verdict cannot be replaced by `code_gate` or a different\n   deployment method.\n5. Submit `deploy_ref {app, reference: commit}` once. It reads the committed\n   manifest (`spec_path` defaults to `ferrite.json`) and builds the complete\n   source tree. Preserve its `BuildStarted.build_id`, poll `build_status`, then\n   verify the repaired behavior and the existing data at the returned host.\n\nThese steps reduce source transfer, not build or test requirements. Preserve\nall authentication, rate, storage and lifecycle gates. If a submission loses\nits reply, reconcile its outcome before retrying; an uncertain reply does not\njustify a second build. Do not withdraw the serving app to update its source.\n\nUse submit_feedback for a bug, a suggestion or feedback from your user.",
