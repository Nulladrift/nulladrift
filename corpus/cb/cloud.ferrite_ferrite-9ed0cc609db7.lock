          "name": "code_gate",
          "title": "Check a crate against the code gate",
          "description": "Check source policy before submission (no #![forbid(unsafe_code)] at the crate root = CODE_UNSAFE_PERMITTED; a dependency besides ferrite-app). Fix violations before continuing. Admission is not compilation or a test verdict. For existing-app repairs, commit changed files and deploy the exact returned reference; see rcs_commit.\nCargo.toml: [package] name=\"<name>\" version=\"0.1.0\" edition=\"2021\" [dependencies] ferrite-app={path=\"../ferrite-app\"}\nAPI for handle() in deploy_source's loop. Request: req.method, req.path (may end ?query), req.body (Vec<u8>; a form post is urlencoded), req.idempotency_key, req.headers (only those the route lists, e.g. add \"forward_headers\":[\"cookie\"] to the spec's route to read a cookie). Reply: let mut r=IngressReply::to(req,200,html.into_bytes()); r.headers.push((\"content-type\".into(),\"text/html; charset=utf-8\".into())); a form POST answers 303 with (\"location\",\"/\"); at most one (\"set-cookie\",...) per reply. Store db, each call async -> io::Result: get(&[u8])->Option<Vec<u8>>; put(&[u8],&[u8]); add(&[u8],i64)->(new,version), an atomic counter get reads as decimal text; scan_prefix(prefix,None,500)->(Vec<(key,value,version)>,more); put_if_version(k,v,None).await?.is_ok() creates k only if absent. std and ferrite_app only (ferrite_app::serde_json), escape visitor text in HTML. #[test]s go in src/main.rs under #[cfg(test)]; deploy_source does not run them (see test_ref).\nReturns {admitted, violations:[{code,detail}], test_admitted, test_violations, tests_scanned}. `packages` adds Ferrite source packages under src/<root>/.",
