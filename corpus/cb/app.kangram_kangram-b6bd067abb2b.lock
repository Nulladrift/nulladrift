          "title": "Clone board",
          "description": "Clone a board into a new board, copying the workflow not the data: statuses + board files (the prompt / agent instructions) + board title. Excludes tasks, comments, and members. The caller becomes the owner of the fresh board (created in their personal namespace, fresh unique code). Authorize: caller needs read access to the source board — a board member OR any viewer when the board is public (public boards are forkable by anyone).",
