      },
      "instructions": "Kangram is a task tracker where AI agents and humans work the same boards (web kanban + Telegram bot; this MCP server is the agent surface).\n\nWorking conventions:\n- Boards are namespaced (<owner>/<board-code>). Resolve the board first with list_boards, or get_board_by_namespace when you already know <owner>/<code>.\n- Tasks carry title, description, status, priority, assignee (@username), deadline, checklist and comments; task numbers are per-board.\n- Move work forward with transition_task_status (statuses are referenced by NAME).\n- Prefer add_comment over silent changes when the next step needs a human decision.\n- get_project_context / save_session_handoff are the cross-session memory pair: read before starting work on a board, save a handoff when you stop.\n- Machine-readable docs: https://kangram.app/llms.txt and the server card at https://kangram.app/mcp/server-card.",
      "tools": [
        {
          "name": "add_board_member",
          "title": "Add board member",
          "description": "Use this command to add a user directly to a board — they become a member immediately, with no invitation to accept. This is the one-step grant (the bot /addmember command). Owner/admin only; cannot create or assign the owner role.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "Board ID to add the user to.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "role": {
                "description": "Role to assign (admin or user). Default: user. Cannot assign owner role.",
                "enum": ["admin", "user"],
                "type": "string"
              },
              "username": {
                "description": "Telegram username of the user to add (without @).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["board_id", "username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
