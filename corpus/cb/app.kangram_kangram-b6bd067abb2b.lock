        {
          "name": "clone_board",
          "title": "Clone board",
          "description": "Clone a board into a new board, copying the workflow not the data: statuses + board files (the prompt / agent instructions) + board title. Excludes tasks, comments, and members. The caller becomes the owner of the fresh board. The new board is created in the caller's personal namespace with a fresh unique code. Authorize: caller needs read access to the source board — a board member OR any viewer when the board is public (public boards are forkable by anyone). Authorization is enforced imperatively in execute.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "Optional 3-character code (A-Z/0-9) for the new board; must be unique in your namespace. Auto-generated if omitted.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "source_board_id": {
                "description": "Board ID to clone the workflow from.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "title": {
                "description": "Optional title for the new board. Defaults to \"<source title> (copy)\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["source_board_id"],
            "type": "object"
