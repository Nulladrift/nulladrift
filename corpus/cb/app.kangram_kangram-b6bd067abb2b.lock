          "title": "Attach task file",
          "description": "Attach a file to a board task. Provide the file as base64 (10MB decoded limit). The attachment becomes visible in the web task view and via list_task_files. You must be a member of the board that owns the task. Use for artifacts an agent produces or handles: images, documents, exports.",
