      "tools": [
        {
          "name": "generate_outfit",
          "title": "Put together an outfit",
          "description": "Use this when the user wants a complete outfit. Primary chat path is prompt-based generation; widget actions may call this with product_id for item-based outfit generation. Pass `gender` when you know who the outfit is for. Do not use this for single-item product search. The result's `content` is a plain-text summary of the outfit (each piece with brand and price); `structuredContent.outfit` holds the same pieces with product ids and shop links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO 3166-1 alpha-2 code of the country the shopper is in (e.g. 'DE', 'US'), if known. Used to show shops that deliver there."
              },
              "gender": {
                "anyOf": [
                  {
                    "enum": ["female", "male"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who the clothes are for: 'female' or 'male'. Set it whenever the user says or the conversation suggests it ('for my boyfriend', 'women's', a gender they mentioned earlier, the kind of piece they ask for). Only ask the user if there is no hint at all and the answer would clearly differ by gender. Omit for unisex requests."
              },
              "image": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "max_budget": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Total outfit budget in EUR. Pass the user's budget when they give one, and a high one (e.g. 3000) when they ask for designer or luxury pieces. Omitted, the outfit is kept to about EUR 700."
              },
              "product_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "prompt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Put together an outfit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/outputTemplate": "ui://widget/outfit-card.html",
            "openai/toolInvocation/invoked": "Outfit assembled",
            "openai/toolInvocation/invoking": "Building your outfit…",
            "ui": {
              "resourceUri": "ui://widget/outfit-card.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:bf1f2134d41b82fe29280c4b4c4bd59d773ed766496b81dc86ab71ff360fe428"
        },
        {
          "name": "semantic_search",
          "title": "Search fashion products",
          "description": "Use this when the user wants to find specific fashion products (clothing, footwear, accessories) by text, optionally guided by images. Pass `gender` when you know who the clothes are for. Do not use this for full outfit generation or visualization-only requests. The result's `content` is a plain-text list of the products (brand, price); `structuredContent.products` holds the same products with ids and shop links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO 3166-1 alpha-2 code of the country the shopper is in (e.g. 'DE', 'US'), if known. Used to show shops that deliver there."
              },
              "gender": {
                "anyOf": [
                  {
                    "enum": ["female", "male"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who the clothes are for: 'female' or 'male'. Set it whenever the user says or the conversation suggests it ('for my boyfriend', 'women's', a gender they mentioned earlier, the kind of piece they ask for). Only ask the user if there is no hint at all and the answer would clearly differ by gender. Omit for unisex requests."
              },
              "images": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search fashion products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/outputTemplate": "ui://widget/outfit-card.html",
            "openai/toolInvocation/invoked": "Curated picks ready",
            "openai/toolInvocation/invoking": "Searching the catalog…",
            "ui": {
              "resourceUri": "ui://widget/outfit-card.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:8eeb4f919ff01189d9fa1ba96b754f1325b73e4687594afb46c45a65e2319052"
        }
