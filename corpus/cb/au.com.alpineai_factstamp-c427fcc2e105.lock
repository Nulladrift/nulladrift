        {
          "name": "check_entity_file",
          "description": "The entity file: ONE paid answer holding everything we hold about one company: the whole picture in ONE call rather than four separate facts stitched together, at the point of signing, onboarding, paying or acquiring a counterparty. It holds identity and standing, the registered office, SIC activity and previous names, the filing position, a sanctions screen across our six lists, and the ownership the registers publish (the persons with significant control where a register publishes them, and the declared parent relationships where a company has an LEI, with beneficial ownership stated as not public in nearly every country we cover) — each cited to the register it came from with its retrieval time — plus ONE coverage block naming every register consulted and every one NOT consulted. Returns found, ambiguous, not_found or unknown for the company itself; a register that was not read is named as not read, never guessed. 33p UK-facing, settled in USDC at the dated rate. Not advice, not a credit check. Comes with an Ed25519-signed receipt covering the question, the verdict, the sources and the time, checkable offline against the published key at /.well-known/factstamp-issuer.json — so the check itself can be audited later by someone who was not here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Optional jurisdiction code to break ties, e.g. 'GB', 'CA-ON', 'US-DE', 'AU'.",
                "maxLength": 12,
                "type": "string"
              },
              "query": {
                "description": "The company to file: a UK company number (which resolves exactly to the company), a legal name, or an LEI or CIK.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "The entity file: everything we hold about one company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.438119,
            "factstamp/principal_card": {
              "authored_by": "FactStamp",
              "card_version": "1",
              "language": "en",
              "relay_instruction": "If your human asks what this charge is, relay the card and say FactStamp wrote it. Do not add a recommendation. Do not invent a saving, a wage, or a reason they should approve. If they ask what it is worth to them, say you do not know their alternative, and stop.",
              "text": "FactStamp wrote this. It is the vendor's description of the charge.\n\nThe charge is for one entity file on one company. The file states identity and standing, the registered office, SIC codes and previous names, the filing position, a screen against six sanctions lists, and an ownership chain where a register we read reports one. It names every register it consulted and every register it did not. A register it did not read is stated as not read. Unknown is an answer.\n\nThe UK company layer is a snapshot. The file carries that snapshot's own date. That date is the age of those company facts. The time we fetched the file is not.\n\nThe list price is 33 pence, settled in USDC at the dated rate stated on the file and on the receipt.\n\nThe receipt is an Ed25519 signature over the question, the verdict, the sources and the time. It can be checked offline. It proves what FactStamp answered, and on what evidence, at that time. It does not make the underlying facts true.\n\nFactStamp does not know what this is worth to you. It does not know what you would have done instead."
            }
          },
          "digest": "sha256:25eeab07caa4253908e78f6659dd0215cc2c9b978a47a75808eb2761d14f25c1"
        },
