        {
          "name": "audit_claims",
          "description": "Audit what an agent believes about companies. Send up to 10 claims ({subject:{identifier|name|jurisdiction}, field, value}) and get, claim by claim: supported (the register says this), contradicted (it says something else, shown), stale (the register records it as FORMER, with the date it changed) or not_checkable (we could not check it, and why). Every verdict carries the register's own date and a citation, and the whole batch gets ONE receipt. field is a name from the published vocabulary (legal_name, previous_name, identifier, status, legal_form, registration_date, dissolution_date, registered_address, activity_code), never open text: a field outside it is not_checkable, not a guess. US$0.20 on this rail for up to 10 claims; longer audits go to POST /audit, which prices the body at US$0.02 a claim with a US$0.20 floor. Comes with an Ed25519-signed receipt covering the question, the verdict, the sources and the time, checkable offline against the published key at /.well-known/factstamp-issuer.json — so the check itself can be audited later by someone who was not here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claims": {
                "description": "The claims to audit, up to 10 on this rail.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "A NAME from the published vocabulary: legal_name, previous_name, identifier, status, legal_form, registration_date, dissolution_date, registered_address, activity_code. Anything outside it is answered not_checkable naming the list.",
                      "enum": ["legal_name", "previous_name", "identifier", "status", "legal_form", "registration_date", "dissolution_date", "registered_address", "activity_code"],
                      "type": "string"
                    },
                    "subject": {
                      "additionalProperties": false,
                      "description": "What the claim is about. Send an identifier, a name, or both.",
                      "properties": {
                        "identifier": {
                          "description": "The register's own number for the entity, e.g. 00445790.",
                          "type": "string"
                        },
                        "jurisdiction": {
                          "description": "The country code of the register to read, e.g. GB, NO, FR. Optional; the identifier's shape is read when it is absent.",
                          "type": "string"
                        },
                        "name": {
                          "description": "The company name, when no number is to hand.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "value": {
                      "description": "The value you believe the register carries.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["field", "subject", "value"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["claims"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit claims against the registers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
