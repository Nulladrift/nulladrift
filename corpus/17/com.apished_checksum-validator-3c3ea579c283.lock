        },
        {
          "name": "luhn_validate",
          "description": "Validates a numeric string against the Luhn (mod-10) checksum — payment card numbers, IMEI numbers, and similar identifiers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
