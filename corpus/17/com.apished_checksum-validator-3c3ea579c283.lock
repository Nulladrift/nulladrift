          "digest": "sha256:e05251701587076787bc959f13fe337c213463a6119878483d3a86f3849b8c52"
        },
        {
          "name": "swiftbic_validate",
          "description": "Structural format validation only for a SWIFT/BIC code: 8 or 11 characters (4 letters bank code + 2 letters country code + 2 alphanumeric location code + optional 3 alphanumeric branch code). The country code is not cross-checked against ISO 3166-1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
