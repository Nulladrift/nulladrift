            "readOnly": false
          },
          "digest": "sha256:17578b926542267effa863e7d666020ebd0460e774702f527c99aef0d489593e"
        },
        {
          "name": "isbn_validate",
          "description": "Validates a 10- or 13-character ISBN. ISBN-10 uses weights 10..1 over 10 characters (last may be X, worth 10), sum mod 11 must be 0. ISBN-13 uses the same GTIN checksum as barcodes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "identifier or value to check",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
