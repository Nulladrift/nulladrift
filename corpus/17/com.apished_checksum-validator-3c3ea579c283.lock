      "tools": [
        {
          "name": "ean_validate",
          "description": "Validates an 8-digit (EAN-8), 12-digit (UPC-A), 13-digit (EAN-13), or 14-digit (GTIN-14) barcode checksum: alternating weights 1 3 applied right-to-left, check digit is (10 - sum mod 10) mod 10.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "identifier or value to check",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:199bb701fbc05a21dd8ced7bb1b9bdd1ec44549f4cce1752f384a7d5b4d21af6"
        },
        {
          "name": "iban_validate",
          "description": "Validates an IBAN's length for its issuing country (per the SWIFT IBAN registry) and its mod-97 checksum. Does not decompose the BBAN into a bank code/account number or resolve a BIC.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "identifier or value to check",
                "type": "string"
              }
            },
            "required": ["value"],
