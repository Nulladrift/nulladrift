{
  "lockfileVersion": 2,
  "subjects": {
    "com.hobbycardindex/card-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hobbycardindex.com/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hobbycardindex",
        "title": "HobbyCardIndex Card Prices",
        "version": "1.1.0",
        "websiteUrl": "https://hobbycardindex.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sold prices for sports cards and trading cards from HobbyCardIndex (16 million cards: baseball, basketball, football, hockey, soccer, Pokemon and other TCGs). Needs a HobbyCardIndex API key, sent as the X-API-Key header (or Authorization: Bearer). Keys: https://hobbycardindex.com/developers. Call search_cards with the card as a collector would describe it (year, set, player or character, card number), then get_card_prices with a card_id for every grade. Every result links to the card page on hobbycardindex.com, which has recent sales and price history; share that link with the user. No key yet: list_plans shows the Commercial API plans and prices, and start_checkout opens a Stripe card page for the user; both work without a key.",
      "tools": [
        {
          "name": "get_card_prices",
          "title": "Card prices by grade",
          "description": "Current sold prices for one card at every grade: raw (ungraded), PSA 7, PSA 8, PSA 9, PSA 10, BGS 9.5, CGC 10 and SGC 10, in US dollars, with the link to the card page for recent sales and price history. Take the card_id from search_cards. Needs a HobbyCardIndex API key.",
          "inputSchema": {
            "properties": {
              "card_id": {
                "description": "The card_id returned by search_cards.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "card": {
                "properties": {
                  "card_id": {
                    "type": "integer"
                  },
                  "category": {
                    "type": ["string", "null"]
                  },
                  "image_url": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "number": {
                    "type": ["string", "null"]
                  },
                  "player": {
                    "type": ["string", "null"]
                  },
                  "set": {
                    "type": ["string", "null"]
                  },
                  "url": {
                    "type": "string"
                  },
                  "year": {
                    "type": ["integer", "string", "null"]
                  }
                },
                "required": ["card_id", "name", "url"],
                "type": "object"
              },
              "currency": {
                "type": "string"
              },
              "prices": {
                "properties": {
                  "bgs9_5": {
                    "type": ["number", "null"]
                  },
                  "cgc10": {
                    "type": ["number", "null"]
                  },
                  "psa10": {
                    "type": ["number", "null"]
                  },
                  "psa7": {
                    "type": ["number", "null"]
                  },
                  "psa8": {
                    "type": ["number", "null"]
                  },
                  "psa9": {
                    "type": ["number", "null"]
                  },
                  "raw": {
                    "type": ["number", "null"]
                  },
                  "sgc10": {
                    "type": ["number", "null"]
                  },
                  "updated": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              }
            },
            "required": ["card", "prices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Card prices by grade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:930bb580fde7ebba581f322b43ad7e57c74a6933e22842316e4b43e249918f96"
        },
        {
          "name": "list_plans",
          "title": "Commercial API plans and prices",
          "description": "The HobbyCardIndex plans a user can buy right now: the Commercial API sizes (requests, photo scans, sold-sale lookups, cert lookups) and the app plans Pro, Dealer and Enterprise (scans a month, dealer tools, API key on Enterprise), with monthly prices in US dollars, the terms and how to buy. Pass use_case to get the size and add-ons that fit what the user wants to do. Works without an API key.",
          "inputSchema": {
            "properties": {
              "use_case": {
                "description": "Optional. display_prices: show prices in their app or site. copy_all_prices: keep their own copy of every price (catalogue sync). photo_scans: identify cards from photos. sold_sales: show individual sold sales. certs_and_pop: cert lookups and population reports. own_use: price their own collection only.",
                "enum": ["display_prices", "copy_all_prices", "photo_scans", "sold_sales", "certs_and_pop", "own_use"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Commercial API plans and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f9e324c6d788c7241747d00bc76da8ea5def5d3bc8530e0b4ac16240d0ae369"
        },
        {
          "name": "search_cards",
          "title": "Search card prices",
          "description": "Find a sports or trading card and its current sold price. Describe the card the way a collector would, for example \"1989 Upper Deck Ken Griffey Jr 1\", \"2018 Topps Update Acuna US250\" or \"Charizard Base Set\". Returns up to 5 matching cards with the raw (ungraded) and PSA 10 price, a card_id, and the link to the card page. Use get_card_prices for every grade of one card. Needs a HobbyCardIndex API key.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: baseball, basketball, football, hockey, soccer, pokemon, magic, yugioh, one piece ...",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Year, set, player or character, and card number if known.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "card_id": {
                      "type": "integer"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "image_url": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["string", "null"]
                    },
                    "player": {
                      "type": ["string", "null"]
                    },
                    "prices": {
                      "properties": {
                        "psa10": {
                          "type": ["number", "null"]
                        },
                        "raw": {
                          "type": ["number", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "set": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    },
                    "year": {
                      "type": ["integer", "string", "null"]
                    }
                  },
                  "required": ["card_id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search card prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05ad9e39efe97a3483f256c63dbad9edc407cef452fbd93917bc505b837600d4"
        },
        {
          "name": "start_checkout",
          "title": "Buy a Commercial API plan",
          "description": "Start buying a Commercial API plan for the user. Returns a Stripe checkout_url where the user pays by card (HobbyCardIndex never sees the card) and a status_url that returns the API key once, after payment. Only call this after the user has picked a plan from list_plans and agreed to the terms (accept_terms: true). Use the user's own email: the receipt and the account sign-in go there. Works without an API key.",
          "inputSchema": {
            "properties": {
              "accept_terms": {
                "description": "true only if the user agreed to the HobbyCardIndex Terms of Service (https://hobbycardindex.com/terms/), including section 8 for a Commercial API plan.",
                "type": "boolean"
              },
              "company": {
                "description": "Optional: the company name for the receipt.",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "description": "The buyer's email address.",
                "maxLength": 254,
                "type": "string"
              },
              "plan": {
                "description": "A plan id from list_plans: a Commercial API size (\"lite\", \"growth_lite\", \"growth\") or an app plan (\"pro\", \"dealer\", \"enterprise\"), monthly.",
                "type": "string"
              },
              "with_addon": {
                "description": "Optional: add the pop reports + cert lookups add-on.",
                "type": "boolean"
              },
              "with_price_files": {
                "description": "Optional, growth_lite or growth only: add the daily price files ($450 a month), a daily download of current prices for the whole catalogue. Use it when the user wants to keep their own copy of the prices, instead of paging search.",
                "type": "boolean"
              }
            },
            "required": ["accept_terms", "email", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy a Commercial API plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f51970dc465859708d1874d95b8796594c0e62d0f228ed55617c98460419e9c"
        }
      ],
      "digest": "sha256:e4af2f2132d34b1bad76f4942ec3a318247f1c49a6ea7e36316cd8d84287a981"
    }
  }
