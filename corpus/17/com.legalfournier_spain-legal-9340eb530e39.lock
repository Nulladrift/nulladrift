        {
          "name": "check_beckham_eligibility",
          "title": "Check Beckham Eligibility",
          "description": "Screen Spain's Beckham regime using qualitative gatechecks, returning the rule trace, review level, and canonical MCP resources for follow-up.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "director_entity_is_patrimonial": {
                "type": "boolean"
              },
              "director_is_related_party": {
                "type": "boolean"
              },
              "election_deadline_met": {
                "description": "Confirm the election deadline and required registration/evidence dates were met.",
                "type": "boolean"
              },
              "employment_type": {
                "description": "Employment structure that will support the move.",
                "enum": ["spanish_employee", "foreign_remote_employee", "director_lt25", "director_gte25", "self_employed", "highly_qualified_professional", "unknown"],
                "type": "string"
              },
              "income_mix_requirement_met": {
                "description": "For the qualifying professional branch, confirm the applicable greater-than-40-percent remuneration requirement.",
                "type": "boolean"
              },
              "move_reason": {
                "description": "Main reason for relocating to Spain.",
                "enum": ["new_spanish_job", "foreign_remote_work", "startup_or_innovation", "intragroup_transfer", "director_appointment", "qualifying_professional_activity", "family_move", "other"],
                "type": "string"
              },
              "move_year": {
                "description": "Calendar year of the relocation supporting the current article 93 entry path.",
                "maximum": 2100,
                "minimum": 2023,
                "type": "integer"
              },
              "no_disqualifying_permanent_establishment": {
                "description": "Confirm no disqualifying permanent-establishment income under the applicable article 93 entry branch.",
                "type": "boolean"
              },
              "ownership_band": {
                "description": "Optional ownership context for director-style cases.",
                "enum": ["none", "under_25", "25_or_more"],
                "type": "string"
              },
              "prior_tax_periods_confirmed": {
                "description": "True only when the supplied tax-residence year list completely covers all five tax periods before move_year.",
                "type": "boolean"
              },
              "qualifying_activity_confirmed": {
                "description": "Confirm the statutory activity and exclusions: qualifying ordinary/statutory employment excluding professional sport; an eligible director appointment; an approved entrepreneur activity; or eligible startup services/training/R&D/innovation for the professional branch.",
                "type": "boolean"
              },
              "relocation_link_confirmed": {
                "description": "Confirm the causal link and permitted timing between the qualifying activity and the move to Spain.",
                "type": "boolean"
              },
              "spanish_tax_resident_years": {
                "items": {
                  "maximum": 2100,
                  "minimum": 1900,
                  "type": "integer"
                },
                "maxItems": 100,
                "type": "array"
              },
              "years_since_last_spanish_residency": {
                "description": "Deprecated elapsed-year gap; the five prior tax periods require the move year and tax-residence years.",
                "maximum": 120,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["employment_type", "move_reason"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "blocking_issues": {
                "description": "Blocking or weakening issues.",
                "items": {
                  "description": "Issue currently blocking or weakening eligibility.",
                  "type": "string"
                },
                "type": "array"
              },
              "current_verification_flags": {
                "description": "Live-verification warnings for fact-sensitive or time-sensitive Beckham points.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "description": "Area of the answer that may need live verification.",
                      "type": "string"
                    },
                    "check_when": {
                      "description": "When the agent should stop and verify the current rule or practice.",
                      "type": "string"
                    },
                    "official_source_hint": {
                      "description": "Official-source hint for the verification step.",
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why the answer cannot safely freeze this point as timeless.",
                      "type": "string"
                    }
                  },
                  "required": ["area", "check_when", "official_source_hint", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "decision_trace": {
                "description": "Structured trace of the main Beckham screening factors.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "factor": {
                      "description": "Fact bucket or legal factor that was evaluated.",
                      "type": "string"
                    },
                    "finding": {
                      "description": "What the tool concluded about that factor.",
                      "type": "string"
                    },
                    "impact": {
                      "description": "How the finding changed the legal analysis.",
                      "type": "string"
                    }
                  },
                  "required": ["factor", "finding", "impact"],
                  "type": "object"
                },
                "type": "array"
              },
              "key_rules_applied": {
                "description": "Stable rules applied by the tool.",
                "items": {
                  "description": "Stable rule that drove the Beckham screen.",
                  "type": "string"
                },
                "type": "array"
              },
              "next_steps": {
                "description": "Suggested next steps.",
                "items": {
                  "description": "Immediate next action for the applicant or agent.",
                  "type": "string"
                },
                "type": "array"
              },
              "official_legal_sources": {
                "description": "Official legal sources anchoring the Beckham analysis.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "authority": {
                      "description": "Official authority publishing the source.",
                      "type": "string"
                    },
                    "relevance": {
                      "description": "Why this source matters to the tool or resource output.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Title or pinpoint label for the legal source.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Official source URL.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["authority", "relevance", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "qualifying_paths": {
                "description": "Potential qualifying paths.",
                "items": {
                  "description": "Recognized regime entry path that may apply.",
                  "type": "string"
                },
                "type": "array"
              },
              "reasons": {
                "description": "Positive signals supporting the result.",
                "items": {
                  "description": "Positive signal supporting eligibility.",
                  "type": "string"
                },
                "type": "array"
              },
              "references": {
                "description": "Secondary Legal Fournier references.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "Short label for the external reference.",
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why the external reference may still help after using the MCP result.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Secondary follow-up URL for optional human or website context.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "reason", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "related_resource_uris": {
                "description": "Canonical MCP resources an agent can read next without leaving the server.",
                "items": {
                  "description": "Canonical `legalfournier://` MCP resource URI for follow-up context.",
                  "type": "string"
                },
                "type": "array"
              },
              "review_level": {
                "description": "How much human review is still advisable before treating the result as filing-ready.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "status": {
                "description": "High-level Beckham eligibility outcome.",
                "enum": ["eligible", "not_eligible", "needs_more_info"],
                "type": "string"
              },
              "suggested_follow_up_tools": {
                "description": "Tool calls that are likely to advance the analysis.",
                "items": {
                  "description": "Tool name that would be useful as a next step.",
                  "enum": ["search", "fetch", "find_legal_fournier_tool", "run_legal_fournier_tool", "get_paid_consultation_options", "get_paid_call_availability", "get_visa_options", "check_beckham_eligibility", "get_residency_path", "explain_nie_process", "compare_tax_regimes", "route_to_legal_fournier_help", "create_legal_fournier_contact_request"],
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "One-line explanation of the result.",
                "type": "string"
              }
            },
            "required": ["blocking_issues", "current_verification_flags", "decision_trace", "key_rules_applied", "next_steps", "official_legal_sources", "qualifying_paths", "reasons", "references", "related_resource_uris", "review_level", "status", "suggested_follow_up_tools", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Beckham Eligibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
