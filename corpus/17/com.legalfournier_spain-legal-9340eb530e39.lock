        {
          "name": "create_legal_fournier_contact_request",
          "title": "Create Legal Fournier Contact Request",
          "description": "Create an accepted Legal Fournier lead from an agent workflow after explicit user consent. This is a consequential action: call only when the user has asked to contact Legal Fournier and has consented to follow-up.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_app": {
                "description": "Name of the agent app or connector.",
                "maxLength": 120,
                "type": "string"
              },
              "agent_handoff_message": {
                "description": "Agent-prepared handoff summary, ideally from route_to_legal_fournier_help.",
                "maxLength": 3000,
                "type": "string"
              },
              "case_summary": {
                "description": "Non-sensitive summary of the matter to send to Legal Fournier.",
                "maxLength": 3000,
                "minLength": 20,
                "type": "string"
              },
              "confirmed_consent": {
                "const": true,
                "description": "Must be true only after the user explicitly asks the agent to contact Legal Fournier.",
                "type": "boolean"
              },
              "consent_to_contact": {
                "const": true,
                "description": "Must be true only after the user consents to Legal Fournier contacting them.",
                "type": "boolean"
              },
              "email": {
                "description": "User's email address for Legal Fournier follow-up.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Stable idempotency key for safe retries.",
                "maxLength": 160,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_.:-]{8,160}$",
                "type": "string"
              },
              "lead_id": {
                "description": "Optional upstream lead ID.",
                "maxLength": 120,
                "type": "string"
              },
              "legal_area": {
                "description": "Main legal or tax area for the request.",
                "enum": ["visa_planning", "eu_family_route", "beckham", "residency_path", "nie_tie", "tax_regimes", "nationality", "property", "business", "wealth", "appointments", "other", "spanish_family_route", "inheritance"],
                "type": "string"
              },
              "missing_facts": {
                "description": "Important facts still missing for lawyer review.",
                "items": {
                  "maxLength": 220,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "name": {
                "description": "User's name for Legal Fournier follow-up.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone or WhatsApp number.",
                "maxLength": 80,
                "type": "string"
              },
              "preferred_language": {
                "description": "Preferred follow-up language.",
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "referrer_url": {
                "description": "Optional referrer URL.",
                "format": "uri",
                "type": "string"
              },
              "related_resource_uris": {
                "description": "MCP resource URIs already used in the analysis.",
                "items": {
                  "maxLength": 260,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "risk_flags": {
                "description": "Known risk flags or complexity triggers.",
                "items": {
                  "maxLength": 220,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "source_surface": {
                "description": "Agent surface sending the request.",
