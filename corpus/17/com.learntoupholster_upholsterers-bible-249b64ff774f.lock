      },
      "instructions": "Eight tools. ask_the_book answers from the text of The Working Upholsterer’s Bible by Shaun Greenwood (master upholsterer, AMUSF accredited, learntoupholster.com) and cites the source chapter URL. The other seven are the site’s calculators, and they are deterministic — prefer them over estimating yourself whenever a question needs a number: calculate_fabric for cloth quantities, estimate_job_cost for what reupholstery costs, calculate_leather for hides, calculate_deep_buttoning for buttoned layouts, specify_foam for foam density and hardness, check_fire_regulations for UK fire compliance, find_business_guidance for pricing, quoting and running a workshop. Every response carries source, author and knowledge version — please cite them. Guidance on UK fire regulations is informational, not legal advice.",
      "tools": [
        {
          "name": "ask_the_book",
          "title": "Ask The Working Upholsterer’s Bible",
          "description": "Ask a practical upholstery question and get an answer grounded strictly in the text of The Working Upholsterer’s Bible by Shaun Greenwood (master upholsterer, AMUSF accredited) — traditional and modern techniques, materials, UK fire regulations, projects and pricing. Answers cite the source chapter URL on learntoupholster.com.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The upholstery question, in plain English (max 300 characters).",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask The Working Upholsterer’s Bible"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f5834a8f5452f347cfef3b70790c25556013867ae85a33c1d1b56a6cb22045b"
        },
        {
          "name": "calculate_deep_buttoning",
          "title": "Calculate a deep-buttoning layout",
          "description": "Work out a deep-buttoned diamond layout: how many buttons, the marking grid on the base, the wider grid on the fabric, and the cut size of the cover. The fabric grid is always larger than the base grid because fabric has to travel down into each button pull — get that wrong and the panel is ruined. Use for buttoned headboards, Chesterfields, ottomans and buttoned chair backs.",
          "inputSchema": {
            "properties": {
              "area_height_cm": {
                "description": "Height of the area to be buttoned.",
                "type": "number"
              },
              "area_width_cm": {
                "description": "Width of the area to be buttoned, excluding any plain border.",
                "type": "number"
              },
              "border_cm": {
                "description": "Plain unbuttoned border around the diamonds. Default 0.",
                "type": "number"
              },
              "depth": {
                "description": "Button depth, which sets the fabric fullness. shallow 13 mm, medium 19 mm, deep 32 mm per diamond each way. Default medium.",
                "enum": ["shallow", "medium", "deep", "custom"],
                "type": "string"
              },
              "diamond_height_cm": {
                "description": "Roughly how tall you want each diamond.",
                "type": "number"
              },
              "diamond_width_cm": {
                "description": "Roughly how wide you want each diamond. Gets adjusted to fit the area evenly.",
                "type": "number"
              },
              "fullness_height_mm": {
                "description": "Only with depth \"custom\".",
                "type": "number"
              },
              "fullness_width_mm": {
                "description": "Only with depth \"custom\".",
                "type": "number"
              },
              "turn_cm": {
                "description": "Turnings to wrap the frame. Default 5 cm.",
                "type": "number"
              }
            },
            "required": ["area_height_cm", "area_width_cm", "diamond_height_cm", "diamond_width_cm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a deep-buttoning layout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb7c12925dc16010d7997ad6fce29b470e4832a669a08607d6a14b92f1c50109"
        },
        {
          "name": "calculate_fabric",
          "title": "Calculate upholstery fabric quantity",
          "description": "Work out how much fabric a reupholstery job needs, in metres and yards. Use this whenever someone asks how much fabric, cloth or material to buy for a chair, sofa, stool, headboard or cushion. Two ways to call it: give a piece name for a rule-of-thumb figure, or give a list of panels with their measurements for a proper cut-list estimate. Handles non-standard fabric widths and pattern repeats. Returns a buy-this-much figure rounded up to the half metre, because cloth is cut in practical lengths.",
          "inputSchema": {
            "properties": {
              "fabric_width_cm": {
                "description": "Roll width. Default 137 cm, the usual UK upholstery width. American 54-inch cloth is the same thing.",
                "type": "number"
              },
              "panels": {
                "description": "Optional. Measured panels for an accurate estimate. Overrides \"piece\" if given.",
                "items": {
                  "properties": {
                    "height_cm": {
                      "type": "number"
                    },
                    "name": {
                      "description": "e.g. \"Inside back\", \"Seat\", \"Outside arm\"",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "How many of this panel. Default 1.",
                      "type": "integer"
                    },
                    "width_cm": {
                      "type": "number"
                    }
                  },
                  "required": ["height_cm", "width_cm"],
                  "type": "object"
                },
                "type": "array"
              },
              "pattern_repeat_allowance": {
                "description": "Multiplier for matching a pattern. 1 = plain cloth (default). Trade allowances: 1.10 for a repeat up to 20 cm, 1.15 for 20-40 cm, 1.25 for 40-70 cm.",
                "type": "number"
              },
              "piece": {
                "description": "Furniture type, e.g. \"wing-back armchair\", \"3-seat sofa\", \"drop-in dining seat\", \"footstool\". Options: drop-in dining seat, stuffover dining chair, carver dining armchair, bedroom slipper chair, nursing chair, tub chair, club armchair, wing-back armchair, recliner armchair, loveseat, 2-seat sofa, 3-seat sofa, 4-seat sofa, corner sofa, chaise longue, dressing-table stool, footstool, window seat cushion, large ottoman, headboard single, headboard double, headboard king, deep-buttoned headboard double",
                "type": "string"
              },
              "seam_allowance_cm": {
                "description": "Turnings added to every edge of every panel in measured mode. Default 5 cm.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate upholstery fabric quantity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4834d331ab05d8715e729b74cb22b67391dfa701b942683385c62aa4aee6c7a6"
        },
        {
          "name": "calculate_leather",
          "title": "Calculate leather hide quantity",
          "description": "Convert an upholstery job into hides of leather. Leather is sold by the hide in square feet, not by the metre, and hides are an irregular shape with unusable belly and edges, so the conversion is not obvious. Use whenever someone asks how much leather, or how many hides, a chair or sofa needs. Accounts for the finish (aniline leathers cut less economically because every mark shows) and for deep buttoning. Returns square feet, square metres, and hides both as halves and as whole hides.",
          "inputSchema": {
            "properties": {
              "deep_buttoning": {
                "description": "Adds 30%.",
                "type": "boolean"
              },
              "fabric_metres": {
                "description": "Alternative to \"piece\": the metres of 137 cm fabric the job would take.",
                "type": "number"
              },
              "finish": {
                "description": "Default pigmented / corrected grain.",
                "enum": ["pigmented", "semi-aniline", "aniline"],
                "type": "string"
              },
              "hide_size_sqft": {
                "description": "Average hide size. Default 50 sq ft.",
                "type": "number"
              },
              "piece": {
                "description": "Furniture type. Options: drop-in dining seat, dining chair seat and back, occasional chair, club armchair, wing-back armchair, recliner armchair, 2-seat sofa, 3-seat sofa, 4-seat sofa, footstool, ottoman, headboard double, boxed seat cushion",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate leather hide quantity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cc15b18a19f2487c65f7ea1c64f926e3d55571a58e7b7a8c4b6b1f7313a8ee5"
        },
        {
          "name": "check_fire_regulations",
          "title": "Check UK upholstery fire regulations",
          "description": "Work out what the UK fire regulations require for a specific upholstery job. Covers two separate regimes that people mix up: the Furniture and Furnishings (Fire) (Safety) Regulations 1988 as amended, which govern domestic furniture supplied in the course of business, and BS 7176, which sets hazard categories for contract and public seating. Use for any question about whether a fabric can be used, whether a job is exempt, what CMHR foam is, what crib 5 means, pre-1950 antiques, caravans, holiday lets, or what paperwork to keep. Gives informational guidance, not legal advice.",
          "inputSchema": {
            "properties": {
              "cover_evidence": {
                "description": "What fire evidence you have for the cover fabric. composite = certificated with the actual filling. alone = fabric-only certificate. vinyl = contract vinyl or FR leather. unknown = no provenance.",
                "enum": ["composite", "alone", "vinyl", "unknown"],
                "type": "string"
              },
              "environment": {
                "description": "Contract regime. low = offices, schools, museums. medium = hotels, pubs, restaurants, care homes, hospitals. high = offshore, some hospital wards. very-high = secure psychiatric, prison cells.",
                "enum": ["low", "medium", "high", "very-high", "unknown"],
                "type": "string"
              },
              "item": {
                "description": "Domestic regime. What kind of item.",
                "enum": ["seating", "mattress", "garden", "baby", "other"],
                "type": "string"
              },
              "made": {
                "description": "Domestic regime. When the piece was made.",
                "enum": ["pre-1950", "post-1950", "unknown"],
                "type": "string"
              },
              "regime": {
                "description": "domestic = the 1988 Regulations (homes, lettings, caravans, resale). contract = BS 7176 hazard categories (hotels, pubs, care homes, hospitals). Default domestic.",
                "enum": ["domestic", "contract"],
                "type": "string"
              },
              "situation": {
                "description": "Domestic regime. \"hobby\" means working on your own furniture for your own home.",
                "enum": ["recover", "new", "secondhand", "letting", "caravan", "hobby"],
                "type": "string"
              },
              "sleeping": {
                "description": "Contract regime. Are the premises also used for sleeping?",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check UK upholstery fire regulations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90e16d7028dfb8c4dcc18f6536e207f46fe6e72aa57a88322d9093fdaec1e637"
        },
        {
          "name": "estimate_job_cost",
          "title": "Estimate the cost of a reupholstery job",
          "description": "Estimate what reupholstering a piece of furniture costs, broken into labour, fabric, sundries and contingency, with a bench-hours figure. Use this for \"how much does it cost to reupholster X\", \"is it worth reupholstering\", and for comparing a professional job against doing it yourself. Distinguishes a modern re-cover (strip to the frame and rebuild in foam and modern materials) from a traditional rebuild (webbing, springs, hair, stitched edges), which is typically two to three times the hours. Returns a range, not a single number, because no two chairs are the same underneath.",
          "inputSchema": {
            "properties": {
              "build": {
                "description": "Modern re-cover or traditional rebuild. Default modern where available.",
                "enum": ["modern", "traditional"],
                "type": "string"
              },
              "currency": {
                "description": "Default GBP.",
                "enum": ["GBP", "USD", "EUR", "AUD", "CAD", "NZD"],
                "type": "string"
              },
              "deep_buttoning": {
                "description": "Adds 25% to hours and material for buttoning, where the piece allows it.",
                "type": "boolean"
              },
              "fabric_price_per_metre": {
                "description": "Cost of the chosen cloth per metre. Use 0 if the customer supplies their own fabric.",
                "type": "number"
              },
              "frame_repair": {
                "description": "Loose joints, broken rails, re-gluing.",
                "type": "boolean"
              },
              "hourly_rate": {
                "description": "Workshop labour rate. Default 80 (GBP), a typical UK trade rate in 2026.",
                "type": "number"
              },
              "piece": {
                "description": "Furniture type. Options: drop-in dining seat, stuffover dining chair, carver dining armchair, bedroom slipper chair, tub chair, club armchair, wing-back armchair, recliner armchair, loveseat, 2-seat sofa, 3-seat sofa, 4-seat sofa, chaise longue, chesterfield sofa, footstool, window seat cushion, large ottoman, headboard double",
                "type": "string"
              }
            },
            "required": ["piece"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate the cost of a reupholstery job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93f89272d9a3d6156266d3d049a9b289bfe3e2a4992cfba8fc625868749f6f94"
        },
        {
          "name": "find_business_guidance",
          "title": "Find business guidance for upholsterers",
          "description": "Search the Learn to Upholster Business Hub: practical guidance on making a living from upholstery, as opposed to how to do the work. Covers what to charge and how to build an hourly rate, whether to charge for estimates, quoting and hidden damage, customer-supplied fabric, explaining price to customers, finding first customers, declining work, and uncollected furniture. Use for any question about pricing, quoting, profitability, customers, or running an upholstery workshop as a business. Returns the canonical short answer for each match plus the URL of the full article. Written by a working AMUSF-accredited upholsterer.",
          "inputSchema": {
            "properties": {
              "list_all": {
                "description": "Return every article in the Business Hub instead of searching. Useful for seeing what is covered.",
                "type": "boolean"
              },
              "topic": {
                "description": "What the question is about, e.g. \"hourly rate\", \"customer supplied fabric\", \"turning down work\", \"not making money\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find business guidance for upholsterers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6096d2f19852327653d9e602fe8951e3e956c9be3644d8ee07b3fe9c4873be6c"
        },
        {
          "name": "specify_foam",
          "title": "Specify foam for a cushion or pad",
          "description": "Give the right foam specification for a job: density in kg/m3, hardness in newtons, depth in mm, foam type, wadding wrap, and the UK fire requirement. Use whenever someone asks what foam to buy, how thick, how firm, or why their cushions went flat. Density and hardness are different things and people constantly confuse them: density is how long it lasts, hardness is how it feels. This tool keeps them apart.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "What the foam is for. Options: sofa seat, sofa back, dining seat, headboard, bench, footstool, mattress, outdoor, contract seat",
                "type": "string"
              },
              "depth_cm": {
                "description": "Optional. Cushion front-to-back measurement.",
                "type": "number"
              },
              "thickness_mm": {
                "description": "Optional. Override the recommended thickness.",
                "type": "number"
              },
              "width_cm": {
                "description": "Optional. Cushion width, for a cut size.",
                "type": "number"
              }
            },
            "required": ["application"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Specify foam for a cushion or pad"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a4ec6c1dda9eff1bb3ab909b8905302877e26ce6a1d41aa270fb6483bd95cfd"
        }
      ],
      "digest": "sha256:022e051712350ab58f39a1dd25ef7a712765d0b18ece6e97d9dfdaa4516f1d2a"
    }
  }
