      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Firmenwatch liefert einen übernommenen Zefix/LINDAS-Stammbestand sowie erfasste SHAB-Publikationen und daraus abgeleitete Ereignisse. Der Bestand ist kein Vollständigkeitsnachweis. Firmendetails enthalten aktuelle amtliche MWST-, FINMA- und SECO-Screenings mit Frische, Abdeckung und Grenzen; sie sind weder amtliche Bestätigung noch abschliessende Rechts- oder Sanktionsprüfung. Firmensuche, Firmendetails, UID-Prüfung, Registerbefunde, Tagesbriefing und Datenstand sind ohne Konto lesbar und werden gegen Missbrauch begrenzt. Ein Firmenwatch-API-Schlüssel schaltet Bestandsabgleich, historische Stichtage, Ereignisabfragen und eigene Prüffälle frei. Historische Stichtage sind erst ab 2025-01-03 verfügbar; frühere Stände werden nicht aus heutigen Daten zurückgerechnet und eine vollständige amtliche Gesamthistorie wird nicht zugesichert. Nenne bei jeder Auskunft den Datenstand und die Quelle. Die Angaben sind nicht rechtsverbindlich — dafür braucht es den Auszug des zuständigen kantonalen Handelsregisteramtes. Über natürliche Personen werden ausschliesslich die im Register publizierten Funktionsdaten geliefert; erstelle daraus keine Personenprofile und keine Bewertungen.",
