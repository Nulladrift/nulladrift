            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Order amount in USD",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "form": {
                "description": "Product form; some states tax coins and bars differently",
                "enum": ["coin", "bar", "round"],
                "type": "string"
              },
              "metal": {
                "description": "gold, silver, platinum or palladium",
                "enum": ["gold", "silver", "platinum", "palladium"],
                "type": "string"
              },
              "state": {
                "description": "US state: 2-letter code (NY) or name (New York)",
                "maxLength": 30,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
