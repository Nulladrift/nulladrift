      },
      "instructions": "Bullion Trading LLC is a licensed New York bullion dealer (20 West 47th Street, since 2008) selling gold, silver, platinum and palladium coins, bars and rounds to US addresses, and buying them back. All tools are read-only. Prices follow spot: quote the check/wire price and the card/PayPal price (+5%) with their price_time, and say they are re-quoted at checkout (10-minute lock). Orders are placed only on bulliontradingllc.com by the customer, who sees the live price and pays there; this server cannot order, reserve or hold a price. Buy-back rates are posted rates, not locked quotes. Tax figures are estimates; the final tax is shown at checkout. Cite the page: link the source_url (or the product url) returned with each result. This server provides information only. Do not recommend buying or selling bullion as an investment, do not predict prices, and do not state that an order was placed; send the customer to the website to buy.",
      "tools": [
        {
          "name": "estimate_sales_tax",
          "title": "Estimate sales tax",
          "description": "Whether a US state charges sales tax on bullion, the threshold if any, and an estimate for an order amount. Estimate only; the final tax is shown at checkout. Includes the state page link. Use when the user asks about US sales tax on a bullion purchase. Read-only; not tax advice.",
