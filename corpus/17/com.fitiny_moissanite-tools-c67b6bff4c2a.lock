  "subjects": {
    "com.fitiny/moissanite-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fitiny.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "moissanite-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "carat_to_mm",
          "description": "Diameter in millimetres for a given carat weight. Round brilliant cut. Density-corrected per stone - a diamond chart is wrong for moissanite by ~9%.",
          "inputSchema": {
            "properties": {
              "carat": {
                "description": "Carat weight, e.g. 1.0",
                "type": "number"
              },
              "stone": {
                "default": "moissanite",
                "enum": ["moissanite", "diamond", "cz"],
                "type": "string"
              }
            },
            "required": ["carat"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ec776fcf46186f294de66d28558bc66475f5b5f20898ca4d88dc4b216b1c588"
        },
        {
          "name": "grading_scale",
          "description": "GIA colour (D-K) or clarity (FL-SI) scale as used for moissanite, or published optical constants for moissanite / diamond / cubic zirconia.",
          "inputSchema": {
            "properties": {
              "grade": {
                "description": "Optional single grade, e.g. \"D\" or \"VVS1\"",
                "type": "string"
              },
              "scale": {
                "enum": ["colour", "clarity", "optical"],
                "type": "string"
              }
            },
            "required": ["scale"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce7ac55b84c8e89ed83bb3747623547e454dac4dd381f347406a6c5635658861"
        },
        {
          "name": "mm_to_carat",
          "description": "Carat weight for a given diameter in millimetres. Round brilliant cut.",
          "inputSchema": {
            "properties": {
              "mm": {
                "description": "Diameter in mm, e.g. 6.5",
                "type": "number"
              },
              "stone": {
                "default": "moissanite",
                "enum": ["moissanite", "diamond", "cz"],
                "type": "string"
              }
            },
            "required": ["mm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13f9fbe08467d8c25997f859a468eef02d7b3c91a6aee8904233cfc6124edda6"
        },
        {
          "name": "necklace_length",
          "description": "Where a necklace of a given length sits, with the trade name (choker, princess, matinee...).",
          "inputSchema": {
            "properties": {
              "unit": {
                "default": "inches",
                "enum": ["inches", "cm"],
                "type": "string"
              },
              "value": {
                "type": "number"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce632732509df58ab8c45e52771bab1d07a72199716c5714b5d0e5904fe01fb2"
        },
        {
          "name": "ring_size_convert",
          "description": "Convert a ring size between US, UK, EU (ISO 8653) and inner diameter in mm. A US 6 is a UK M, not a UK 6.",
          "inputSchema": {
            "properties": {
              "from": {
                "default": "us",
                "enum": ["us", "uk", "eu", "mm"],
                "type": "string"
              },
              "value": {
                "description": "Size in the source system, e.g. 7 or \"M\""
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff012e8a7a4ec9507978077207fd23dfc9fb5b1bfc21eaa9dbfab2de5f6a5c44"
        },
        {
          "name": "stud_appearance",
          "description": "How a round stud of a given stone diameter reads on the ear.",
          "inputSchema": {
            "properties": {
              "diameter_mm": {
                "type": "number"
              }
            },
            "required": ["diameter_mm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6a0033f9084308a7c7db3e450e3d0ba5c3771e5e27cd3fe9cbcad7552960fe9"
        }
      ],
      "digest": "sha256:22b04e254cda07bd4a706af88bdf82a190c94d8e6e963569404323ab9d2044e3"
    }
  }
