      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RateSonar is a point-in-time archive of what Australian banks and lenders advertised since 2026-06-12. find_products turns a lender and words into institution_id and product_id. compare_rates ranks current rates for a category. rate_history and rate_details read one product: pass both ids, because a product is the pair (institution_id, product_id). rate_changes lists recent moves. list_series and series give standard series and spreads. bank_position and bank_analysis compare a chosen deposit/loan pair against peers and dated records. yield_curve reads exact RBA curve observations; curve_pipeline_status reports freshness. Cite each rate's observed_date. A carried-forward or derived point is not a record. Bank rates only: no advice and no applications. HTTP on this host: GET /v1/catalog, /v1/series, /v1/changes, /v1/tiers and POST /v1/ask. Free use has a daily limit; a refused call says when it resets. For more usage, the person can email contact@ratesonar.com.",
      "tools": [
        {
          "name": "bank_analysis",
          "description": "An evidence-checked AI reading of bank_position. Supports savings or term deposits against variable/fixed home loans, card purchase rates, personal, car or business loans. Returns cited claims, inference labels and dated records; partial readings name withheld sections; unavailable or rejected AI leaves the records intact. No supplied rates accepted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "default": 50000,
                "enum": [50000, 250000, 1000000],
                "type": "number"
              },
              "depositKey": {
                "description": "Optional exact contract key from the cohort.",
                "maxLength": 512,
                "type": "string"
              },
              "depositKind": {
                "default": "savings",
                "enum": ["savings", "3", "6", "12", "24"],
                "type": "string"
              },
              "institutionId": {
                "description": "Institution id from find_products or the bank desk.",
                "type": "string"
              },
              "loanKey": {
                "maxLength": 512,
                "type": "string"
              },
              "loanKind": {
                "default": "home",
                "enum": ["home", "home-fixed", "card", "personal", "car", "business"],
                "type": "string"
              },
              "payment": {
                "default": "maturity",
                "enum": ["maturity", "monthly", "yearly"],
                "type": "string"
              },
              "question": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["institutionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
