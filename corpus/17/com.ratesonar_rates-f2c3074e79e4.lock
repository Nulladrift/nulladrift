        {
          "name": "rate_changes",
          "description": "Recent change-events, newest first: a rate moved, a product was added, or a product was withdrawn. Each event has the lender, the product's name and category, and field-level deltas (e.g. rate [6.09, 5.89], bps -20). Filter by institutionId, category, kind and direction. Returns `limit` events (default 50, at most 200); `truncated` says more match. This is a diff of RateSonar's consecutive captured observations.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional product category, e.g. term_deposit.",
                "enum": ["home_loan", "savings", "term_deposit", "credit_card", "personal_loan", "car_loan", "business_loan"],
                "type": "string"
              },
              "direction": {
                "description": "Optional: only rate rises (up) or cuts (down).",
                "enum": ["up", "down"],
                "type": "string"
              },
              "institutionId": {
                "description": "Optional, e.g. \"cba\". Omit for all lenders.",
                "type": "string"
              },
              "kind": {
                "description": "Optional event kind.",
                "enum": ["rate_change", "product_added", "product_removed"],
                "type": "string"
              },
              "limit": {
                "description": "Events to return. Default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "sinceDays": {
                "description": "Look-back window in days. Default 14.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate changes"
