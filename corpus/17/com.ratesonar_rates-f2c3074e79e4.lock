        {
          "name": "find_products",
          "description": "Find current products by lender and words in the product name, e.g. institution \"CBA\" and query \"standard variable\". Returns institution_id and product_id for each match, with category, rate and observed_date. A product is the pair (institution_id, product_id): pass both to rate_history or rate_details. Use compare_rates instead to rank lenders for a category.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional product category.",
                "enum": ["home_loan", "savings", "term_deposit", "credit_card", "personal_loan", "car_loan", "business_loan"],
                "type": "string"
              },
              "institution": {
                "description": "A lender id or name, e.g. \"cba\", \"Westpac\", \"Bendigo Bank\".",
                "type": "string"
              },
              "limit": {
                "description": "Products to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the product name, e.g. \"standard variable\" or \"bonus saver\".",
                "type": "string"
              }
            },
            "type": "object"
          },
