                "type": "string"
              },
              "institutionId": {
                "description": "Institution id, e.g. \"nab\".",
                "type": "string"
              },
              "productId": {
                "description": "CDR product id.",
                "type": "string"
              }
            },
            "required": ["institutionId", "productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22ac1e9a3a512a92cee204d0bd7620f21a0d2f7a9683808a498eea96eba84912"
        },
        {
          "name": "rate_history",
          "description": "Advertised rate history for one product (institutionId and productId). Returns each recorded rate, comparison rate and fees between two dates, with the date each was recorded. RateSonar's record starts 2026-06-12. Pass grid:true to also get `grid`, one point per day: status 'observed' on a recorded day; 'carried-forward' with sourceDate and fill {from, through, ageDays, reason:'no-record'} on a day RateSonar has no record for, carrying the last recorded rate (never the next one) until the next record. After the last record it carries only while RateSonar's gap ledger shows the product still expected but unrecorded (not withdrawn), for at most 14 days. A carried-forward value is not an observation. History is limited to the caller's plan window (free and anonymous 31 days, Enthusiast 366, Pro full); an older `from` is raised to it and the answer says windowClamped:true.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Start date YYYY-MM-DD (inclusive). Optional.",
                "type": "string"
              },
              "grid": {
                "description": "Also return `grid`: one labelled point per day (observed or carried-forward), at most 367 days. A wider window returns `gridError` (pass from/to) and keeps `observations`. Default false.",
                "type": "boolean"
              },
              "institutionId": {
                "description": "Institution id, e.g. \"cba\". Pass it with every productId: a product is the pair (institutionId, productId).",
                "type": "string"
              },
              "productId": {
                "description": "Product id from find_products or compare_rates, e.g. \"f1d6fcc359804f3c9365d576c56356fc\" with institutionId \"cba\" (CBA Standard Variable Rate Home Loan, owner occupied).",
                "type": "string"
              },
              "to": {
                "description": "End date YYYY-MM-DD (inclusive). Optional.",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be61f777d7a5dbc4f43f093cb351d2f20187483b233963750f44b76079f56053"
        },
        {
          "name": "series",
          "description": "Standardized rate series: named LEVEL series (hl.var.oo.pi = headline variable home loan; sav.max; td.12m; biz.loan.var; cash = RBA cash rate…) and SPREAD series in bps (spread.hl.var-cash = lending pass-through; spread.hl.var-sav.max = the margin; spread.hl.var-hl.fix.36m = variable vs 3yr fixed…), per institution per day. Last-known values are explicitly status:'carried-forward' with sourceDate and fill {from, through, ageDays, reason:'no-record'} (through = the next recorded date; null = the gap is open, or no record within 60 days after the window end). Between two records the last rate is carried until the next one. After an institution's last record it is carried only while RateSonar's gap ledger shows the product that holds that rate still expected but unrecorded (not withdrawn), for at most 14 days, then the series stops; medians and spreads use the same points, so a stale value never feeds them past 14 days. The RBA cash series publishes on business days only, so its carried points have no fill; it is carried at most 14 days after its last row. Spreads and medians are status:'derived' with sourceDates; they are not observations. Pass median:true for a market-median line. Unauthenticated access and free access are clamped to the last 31 days, Enthusiast to 366 (windowClamped:true in the response). Pro tiers query deeper history in windows of at most 367 inclusive dates; large multi-series median requests may require smaller windows.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Start date YYYY-MM-DD.",
                "type": "string"
              },
              "institutions": {
                "description": "Institution ids, e.g. [\"cba\",\"anz\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "median": {
                "description": "Add a _median market line per slug.",
                "type": "boolean"
              },
              "slugs": {
                "description": "Series slugs from list_series, e.g. [\"hl.var.oo.pi\", \"spread.hl.var-cash\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "description": "End date YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab48d101bdec3c89048c6cc55f14af13dd1c28e955283a65deacf4a971a7ed85"
        },
        {
          "name": "yield_curve",
          "description": "RBA curve nodes for an exact date or the latest publication: cash and bond yields as published, and the RBA's fitted zero, forward and discount curves (each point says whether it is observed or derived), with optional exact comparison date, instrument details, source digest and convention. Eight distinct cash/government families; no intraday OIS, BBSW, swap or futures feed. Zero/forward fitted data publish monthly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compareDate": {
                "description": "Optional exact second observation date.",
                "type": "string"
              },
              "date": {
                "description": "Exact observation date YYYY-MM-DD; omit for latest. No silent carry-forward.",
                "type": "string"
              },
              "family": {
                "default": "government-zero",
                "enum": ["government-zero", "government-bond", "government-security", "government-indexed", "government-forward", "government-discount", "cash-rate", "cash-target"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Yield curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86ef96421ca0fe919af71e281611ae46bb5d3e686252a2d8798b9e9facd2d288"
        }
      ],
