        {
          "name": "compare_rates",
          "description": "Current comparison across institutions for a product category (home_loan | savings | term_deposit | credit_card | personal_loan | car_loan | business_loan): each product at its own most recent observation (observedDate tells you how fresh). Home loans can be filtered by loanPurpose/repaymentType/rateType — the headline home-loan rate is the owner-occupied P&I rate whose LVR band covers 80%. Term deposits take termMonths (the published rate for that term, e.g. 6 or 12) and deposits take customerSegment. Standard products only unless audience says otherwise. Returns the best `limit` rows (default 25, at most 40); `truncated` says more exist. It has no lender filter: for one lender's products use find_products. Fees are summarised (name, type, amount or rate, frequency); rate_details has every fee field.",
          "inputSchema": {
            "properties": {
              "asOf": {
                "description": "Historical snapshot date YYYY-MM-DD. Defaults to each product's latest observation.",
                "type": "string"
              },
              "audience": {
                "description": "Who the product is for. Default standard (untagged rows count as standard); \"any\" includes green, veteran, SMSF, construction and other special-purpose products.",
                "enum": ["standard", "green", "veteran", "first_responder", "smsf", "bridging", "construction", "first_home", "reverse_mortgage", "line_of_credit", "other_niche", "any"],
                "type": "string"
              },
              "category": {
                "description": "Product category to compare.",
                "enum": ["home_loan", "savings", "term_deposit", "credit_card", "personal_loan", "car_loan", "business_loan"],
                "type": "string"
              },
              "customerSegment": {
                "description": "savings and term_deposit only: personal or business products.",
                "enum": ["consumer", "business"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, best first. Default 25, at most 40.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "loanPurpose": {
                "description": "Loans only: filter by purpose.",
                "enum": ["owner_occupied", "investment"],
                "type": "string"
              },
              "rateType": {
                "description": "Loans only: rate structure.",
                "enum": ["variable", "fixed"],
                "type": "string"
              },
              "repaymentType": {
                "description": "Loans only: principal-and-interest vs interest-only.",
                "enum": ["pi", "io"],
                "type": "string"
              },
              "termMonths": {
                "description": "term_deposit only: rank each product's published rate for this term in months (6, 12, 24 …).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
