{
  "lockfileVersion": 2,
  "subjects": {
    "com.remotenomadjobs/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.remotenomadjobs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Remote Nomad Jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Remote Nomad Jobs (remotenomadjobs.com) is a job board for fully remote, work-from-anywhere roles. Listings are filtered for worldwide remote work: hybrid, on-site, and \"remote in one country only\" roles are not listed.\n\nTools:\n- search_jobs: open jobs by keyword, category, employment type, company, minimum salary, or perk. Returns the newest matches with links.\n- get_job: the full description of one job, by id or job URL.\n- search_companies / get_company: employers with open work-from-anywhere jobs.\n- list_filters: valid category, employment type, and perk values.\n\nEvery job and company includes a remotenomadjobs.com URL. Applications are made from the job page.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get company profile",
          "description": "A company's profile on Remote Nomad Jobs: what it does, how many work-from-anywhere jobs it has open, its main job categories, and its newest open jobs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name (e.g. 'GitLab') or its remotenomadjobs.com company URL.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get company profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6be724afb799a363bc194f0454ca74b9be35621ef74dc3d08a23041015bbcb5e"
        },
        {
          "name": "get_job",
          "title": "Get job details",
          "description": "Full details of one job: description, salary, benefits, experience level, dates, and its remotenomadjobs.com job page, where the application is made. Accepts the id from search_jobs or a remotenomadjobs.com job URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job": {
                "description": "Job id (24 characters) or a remotenomadjobs.com job URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get job details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26886be1bc95b21ab82b4d49df86478c0ee7a6c30085dd03cb021c08d2616d7c"
        },
        {
          "name": "list_filters",
          "title": "List search filters",
          "description": "Valid values for the search_jobs filters: job categories, employment types, and perks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List search filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6ddaed78aa6d47b1b2850e9ae4b57341d84df54c7c3a81a36301a0e80ce6fae"
        },
        {
          "name": "search_companies",
          "title": "Search work-from-anywhere companies",
          "description": "Find employers that currently have open work-from-anywhere jobs, by name. With no query, returns the companies with the most open jobs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the company name, e.g. 'auto'.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search work-from-anywhere companies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08bfee6a19cc16ea08274cc394f3652ee0d6975742a7ba4ab8556f62a500669d"
        },
        {
          "name": "search_jobs",
          "title": "Search work-from-anywhere jobs",
          "description": "Search open remote jobs that can be done from anywhere in the world. All filters are optional; with no filters it returns the newest jobs. Results are sorted newest first and include salary when the employer published one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Job category. See list_filters for the full list.",
                "enum": ["account management", "accounting", "administrative", "business intelligence", "consulting", "customer service", "cybersecurity", "design", "devops and sysadmin", "editing", "education", "finance", "healthcare", "hr", "insurance", "it", "journalism", "legal", "marketing", "media", "operations", "product", "project management", "retail", "research", "real estate", "science", "sales", "translation", "travel", "writing"],
                "type": "string"
              },
              "company": {
                "description": "Exact company name, e.g. 'GitLab'.",
                "maxLength": 100,
                "type": "string"
              },
              "employment_type": {
                "enum": ["Full Time", "Part Time", "Contract", "Freelance", "Internship"],
                "type": "string"
              },
              "entry_level": {
                "description": "Only jobs open to people without prior experience.",
                "type": "boolean"
              },
              "min_salary_usd": {
                "description": "Minimum yearly salary in USD. Only jobs that publish a salary can match.",
                "maximum": 1000000,
                "minimum": 10000,
                "type": "integer"
              },
              "perk": {
                "description": "Special filter, e.g. 'no-phone' or 'hiring-immediately'.",
                "enum": ["no-phone", "unlimited-pto", "high-paying", "overnight", "weekend", "no-degree", "chat-support", "hiring-immediately"],
                "type": "string"
              },
              "query": {
                "description": "Keywords matched against job title, company, category, and tags, e.g. 'customer support' or 'react'.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "company_url": {
                      "type": ["string", "null"]
                    },
                    "employment_type": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "posted_date": {
                      "type": ["string", "null"]
                    },
                    "salary": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "company", "company_url", "employment_type", "id", "posted_date", "salary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "more_results": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "all_results_url": {
                        "type": "string"
                      },
                      "not_shown": {
                        "type": "number"
                      },
                      "note": {
                        "type": "string"
                      },
                      "plans_url": {
                        "type": "string"
                      }
                    },
                    "required": ["all_results_url", "not_shown", "note"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "total_matches": {
                "type": "number"
              }
            },
            "required": ["jobs", "more_results", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search work-from-anywhere jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a30097b99735b8289546f419c82e5e50abc3a122123f278206f3fa8feb48f32"
        }
      ],
      "digest": "sha256:edf1e6970408c74997d3de6a05bb5ecf6cbfdbe19da9377685c0889c4f97e5f4"
    }
  }
}
