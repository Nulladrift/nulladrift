      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bastion-helix-agent-lens",
        "title": "Bastion Helix Agent Lens",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Web pages for AI agents. Free: site (what a website offers agents and its AI rules) and preflight (may this page be used, which engine it needs). Paid: read (Markdown), extract (structured facts as JSON), delta (only what changed since your last check), actions (forms and buttons with selectors), screenshot. Paid tools charge only on success, with an API key (Authorization: Bearer bhk_…) or x402 (USDC on Base).",
      "tools": [
        {
          "name": "actions",
          "title": "List what can be clicked or filled",
          "description": "Returns the forms (with every field, its label and whether it is required), buttons and links on a page, each with a CSS selector an automation tool can use. Uses the rendered page when the HTML alone has none. Charged only on success. Price: US$0.004 per successful call (API key credits or x402).",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "auto",
                "enum": ["auto", "fetch", "kitesurf", "chromium"],
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List what can be clicked or filled"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.004
          },
          "digest": "sha256:38168f6fcbe12670767c01882dc62796ddc75a902740fe1ee7b763ca11400441"
        },
        {
          "name": "credits",
          "title": "Credits left on your API key",
          "description": "Free. Credits remaining on the API key sent in the Authorization header (1 credit = US$0.001).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Credits left on your API key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b5e94baf944ef2d28499e9cc9d206c51eb1e9fff1ffabdb819f33f01a272be4"
        },
        {
          "name": "delta",
          "title": "What changed since last time",
          "description": "For pages an agent checks again and again. The first call returns the page as sections plus a fingerprint; send that fingerprint back as \"previous\" next time and get only the sections that changed (and the headings of removed ones), or changed:false. Uses HTTP ETag/Last-Modified when the site supports them. Nothing is stored on our side: the fingerprint lives with the agent. Saves tokens on every re-check. Charged only on success. Price: US$0.001 per successful call (API key credits or x402).",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "auto",
                "enum": ["auto", "fetch", "kitesurf", "chromium"],
                "type": "string"
              },
              "previous": {
                "description": "The \"fingerprint\" object from your last delta call for this URL. Leave out on the first call.",
                "type": "object"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What changed since last time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:506551ece7cc8bb26139a41d6ea8e935d7b7b4ec9d5b1d300059e6e2f811e5cd"
        },
        {
          "name": "extract",
          "title": "Get the facts a page publishes, as JSON",
          "description": "No AI model involved: returns the structured data the page already publishes — JSON-LD / schema.org objects (products, articles, events, organisations, breadcrumbs), prices and offers, meta and Open Graph tags, canonical URL, language versions, licence, RSS/Atom/JSON feeds, and HTML data tables as columns + rows. Exact values instead of guesses from text. Charged only on success. Price: US$0.002 per successful call (API key credits or x402).",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "auto",
                "enum": ["auto", "fetch", "kitesurf", "chromium"],
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the facts a page publishes, as JSON"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.002
          },
          "digest": "sha256:69f49c25d211bfd1587c8b983b58503f02bbc9a13e6b7c2bf2e411ed9a2d5214"
        },
        {
          "name": "preflight",
          "title": "Check a page before using it",
          "description": "Free. Before an agent spends money or time on a URL: is it allowed (robots.txt for this service and, if you pass user_agent, for your own bot; Content Signals such as ai-input and ai-train; meta robots), does a bot check or sign-in stand in the way, and which engine each task needs — plain fetch, Kitesurf (Cloudflare's lightweight agent browser) or Chromium. Rate-limited per IP.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page (http or https)",
                "type": "string"
              },
              "user_agent": {
                "description": "Your own bot's robots.txt name (e.g. \"MyAgentBot\") to check its rules too",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a page before using it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1c634b8ebdbfdc84475ca2ce32d1de630b7703a2e1c7c7efb46c26458731172f"
        },
        {
          "name": "read",
          "title": "Read a page as clean Markdown",
          "description": "Returns the main content of a web page as clean Markdown with absolute links. Tries the cheapest way that works: plain fetch, then Kitesurf, then Chromium, and reports which one worked. Refuses (and charges nothing) when the site's robots.txt or Content Signals say no, or when a bot check answers instead of the page. Charged only on success. Price: US$0.004 per successful call (API key credits or x402).",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "auto",
                "enum": ["auto", "fetch", "kitesurf", "chromium"],
                "type": "string"
              },
              "max_chars": {
                "default": 100000,
                "maximum": 400000,
                "minimum": 1000,
                "type": "integer"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a page as clean Markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.004
          },
          "digest": "sha256:0bb78fe36017beb7b28f8c34f7df3a4f5f8fb5240d73e96b1cdf08919e601307"
        },
        {
          "name": "screenshot",
          "title": "Screenshot a page",
          "description": "PNG screenshot of a page at 1280×800 (or the full page). engine \"auto\" uses Kitesurf unless the page needs video or WebGL, then Chromium. Charged only on success. Price: US$0.008 per successful call (API key credits or x402).",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "auto",
                "enum": ["auto", "kitesurf", "chromium"],
                "type": "string"
              },
              "full_page": {
                "default": false,
                "type": "boolean"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screenshot a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.008
          },
          "digest": "sha256:c2e4155b9dcf0b2466403a0e8884f46b57f743fce237e59d0436d1a5c190f191"
        },
        {
          "name": "site",
          "title": "Site card for agents",
          "description": "Free. Everything an agent should know about a website before using it: its llms.txt (and llms-full.txt), sitemap (page count and first URLs), feeds, language versions, Content Signals, and which known AI crawlers and agents its robots.txt allows. Rate-limited per IP.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Any page of the site",
                "type": "string"
              },
              "user_agent": {
                "description": "Your bot's robots.txt name, to check its rules too",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Site card for agents"
          },
