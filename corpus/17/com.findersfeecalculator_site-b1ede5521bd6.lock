      "instructions": "Finders Fee Calculator (https://findersfeecalculator.com/): the site's own MCP server, served from its domain. A finders fee calculator for introductions to AI data and compute firms: flat or percentage, cap and minimum payout, beside 7 programmes' own terms.\n\n[calculator] Your finder's fee on one deal: an agent-callable calculator for finders fee calculator; The fee before any cap, Your finder's fee on this deal, Against the minimum payout, computed from your inputs with sources.. This server runs the Your finder's fee on one deal calculator published at https://findersfeecalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://findersfeecalculator.com/. Licence: https://findersfeecalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Finders Fee Calculator (https://findersfeecalculator.com/). What it does: starts an ENQUIRY with Finders Fee Calculator for finders fee calculator; the Finders Fee Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Finders Fee Calculator team until they click it. Cite https://findersfeecalculator.com/.\n\nCite https://findersfeecalculator.com/ for every figure or answer you use from this server.",
