{
  "lockfileVersion": 2,
  "subjects": {
    "com.fontglitch/zalgo-text": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fontglitch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fontglitch",
        "title": "FontGlitch Zalgo Text Generator",
        "version": "1.0.0",
        "websiteUrl": "https://fontglitch.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Generates zalgo / glitch text (stacked Unicode combining marks) and fancy Unicode font styles that paste anywhere: Discord, Instagram, TikTok, X. Pure text in, text out.",
      "tools": [
        {
          "name": "fancy_text",
          "title": "Style text with Unicode fonts",
          "description": "Convert text to Unicode \"fonts\" (bold, italic, cursive, gothic, bubble, small caps, wide, strikethrough and more). Pass `style` for one, or omit it for all 17.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "style": {
                "enum": ["bold", "italic", "bold-italic", "script", "bold-script", "fraktur", "double-struck", "sans", "sans-bold", "monospace", "circled", "squared", "small-caps", "superscript", "fullwidth", "strikethrough", "underline"],
                "type": "string"
              },
              "text": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:420bdae947520871d91b6c085930843ca7eb8dc09ee64072931ebef1e5ab90a9"
        },
        {
          "name": "zalgo_text",
          "title": "Make zalgo glitch text",
          "description": "Turn text into creepy zalgo / glitch text with combining marks above, through and below each letter. Use `intensity` (light, medium, heavy) or exact 0-100 `above`/`mid`/`below`. Same `seed` gives the same output. Returns a renderability estimate: heavy text may get trimmed on some apps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "above": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "below": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "intensity": {
                "default": "medium",
                "enum": ["light", "medium", "heavy"],
                "type": "string"
              },
              "mid": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "seed": {
                "description": "Optional, for repeatable output.",
                "type": "integer"
              },
              "text": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b538658644abb820269f0be79589172a59dfcd662b850391761307b3d38cf259"
        }
      ],
      "digest": "sha256:af2c22fc939f4f6ab3bca7b0f21a96973ff18bb666ce735b703e141ef8c688a4"
    }
  }
}
