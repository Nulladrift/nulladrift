        {
          "name": "manage_instance",
          "title": "Manage Instance",
          "description": "Change what the panel's Manage Instance page controls on a specific instance (by id or exact name): its display name, connection hostname, primary domain, web redirect, streamer mode, server timezone, and auto-update-on-start. Only the fields you pass are changed; everything else is left alone. This does not touch game config files (use set_settings) or power state (use start_instance, stop_instance, restart_instance). Changing the hostname changes the address players connect with, so confirm with the user first.",
          "inputSchema": {
            "properties": {
              "auto_update_on_start": {
                "description": "Whether SteamCMD games update on every start. Only valid for steamcmd-based games.",
                "type": "boolean"
              },
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, restating each new value and how it affects the server address and getting their approval.",
                "type": "boolean"
              },
              "domain_id": {
                "description": "Id of the primary domain to pair with the hostname, from the instance's available domains.",
                "type": "string"
              },
              "hostname": {
                "description": "New subdomain, without the domain part (e.g. \"my-server\"). Letters, numbers and dashes only. Unavailable while streamer mode is on.",
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "New display name for the instance, shown in the header and on the instance list.",
                "minLength": 1,
                "type": "string"
              },
              "streamer_mode": {
                "description": "Hide the server IP across the panel and mask client IPs in the console.",
                "type": "boolean"
              },
              "timezone": {
                "description": "IANA timezone the game server runs in, e.g. \"America/Chicago\". Affects in-game events only, not automated tasks.",
                "type": "string"
              },
              "web_redirect": {
                "description": "Whether browser traffic to the server address redirects to the Nodecraft website.",
                "type": "boolean"
              }
            },
            "required": ["confirm", "instance"],
            "type": "object"
          },
