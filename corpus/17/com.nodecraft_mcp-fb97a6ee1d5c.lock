        },
        {
          "name": "search_player",
          "title": "Search Player",
          "description": "Look up one player account on the platform itself: a Minecraft Java username, a Steam SteamID64, an Xbox gamertag, or a Hytale identifier. Returns the account's id, username, avatar and any platform metadata. This searches the platform's own player directory, not the server: it cannot tell you whether that player has joined, is whitelisted, or is banned. Use list_online_players for who is on the server right now. An instance is required only to authorize the lookup. The match is exact, so a partial or misspelled identifier reports no match.",
          "inputSchema": {
            "properties": {
              "instance": {
                "description": "Instance id (preferred) or exact instance name. Used only to authorize the lookup; it does not scope the search.",
                "minLength": 1,
                "type": "string"
              },
              "platform": {
                "description": "Which platform to look the player up on.",
                "enum": ["minecraft", "steam", "xbox", "hytale"],
                "type": "string"
              },
              "query": {
                "description": "The player identifier to look up. Format depends on platform: a Java username, a SteamID64, an Xbox gamertag, or a Hytale identifier.",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["instance", "platform", "query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2342bdfc79dbc5c86ed9b7dabcad516248af6150e4e88191eacb9357bcb0d9e2"
        },
        {
          "name": "send_console_command",
          "title": "Send Console Command",
          "description": "Send a console command to a running game server. The server must be online. Requires the caller to set `confirm: true`. Surface the exact command text to the user before doing so, since commands can be destructive (e.g. `stop`, `op`, `ban`).",
          "inputSchema": {
            "properties": {
              "command": {
                "description": "The raw console command to send, without a leading slash unless the game requires one.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be sent, quoting the exact command and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["command", "confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e59663cebec378e8f0bc766e38ea159c60dae262adf9dd078905fa82ac88372c"
        },
        {
          "name": "set_jit_share",
          "title": "Change Share Link Settings",
          "description": "Change the share link settings on a Lite server (by id or exact name): the password used to start the server through the link, whether a password is required at all, whether the link is locked, and the Discord invite shown on the share page. Only the fields you pass are changed. Setting `password` replaces it, so the previous one stops working.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, restating the new share settings and getting their approval.",
                "type": "boolean"
              },
              "discord_url": {
                "description": "Discord invite URL shown on the share page. Pass an empty string to clear it.",
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "locked": {
                "description": "Whether the share link is locked, preventing it from being used to start the server.",
                "type": "boolean"
              },
              "password": {
                "description": "New share password. Replaces the existing one.",
                "type": "string"
              },
              "password_enabled": {
                "description": "Whether starting the server through the share link requires the password.",
                "type": "boolean"
              }
            },
            "required": ["confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff29022fc5d43f5d787e645078ee466e0a4cc0c702f1d173b5f410ba054975cb"
        },
        {
          "name": "set_settings",
          "title": "Change Instance Settings",
          "description": "Change one or more validated settings on a specific instance (by id or exact name), then save them. This is the correct way to change server configuration, since it runs the same validation as the panel and writes config files the game actually reads, unlike hand-editing files. Call get_settings first to get exact field ids, current values and allowed options. All changes are saved together, or none are.",
          "inputSchema": {
            "properties": {
              "changes": {
                "description": "The settings to change. Each entry needs the exact `field` id from get_settings and the new `value`, typed as the setting expects (boolean for toggles, number for numeric settings, one of the listed option values for choices).",
                "items": {
                  "properties": {
                    "field": {
                      "description": "Exact field id from get_settings, e.g. \"minecraft:difficulty\".",
                      "type": "string"
                    },
                    "value": {
                      "description": "The new value for this setting."
                    }
                  },
                  "required": ["field", "value"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, including the old and new value of each setting and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["changes", "confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68d14a4b4b91028fc003de0a96b5afec71915ad77f16c7bae9fdb9e64f123c99"
        },
        {
          "name": "set_user_permissions",
          "title": "Set User Permissions",
          "description": "Grant or revoke specific permissions for an account on a specific instance (by id or exact name). Pass only the nodes you want to change. Every other node keeps its current value. Call list_instance_users first to see who has access and what they hold. The owner's own access cannot be changed, and `instance.view` is always kept.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, naming the user and each permission they gain or lose and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "permissions": {
                "description": "Permission flags to apply, keyed by node, e.g. {\"instance.console.**\": true, \"instance.files.read\": true}. A `.**` node covers its whole group, and a single node like \"instance.status.start\" grants just that action. Only the listed nodes change. \"instance.permissions.manage\" lets them change everyone's access, including their own.",
                "minProperties": 1,
                "type": "object"
              },
              "user": {
                "description": "Account id, or an exact username of 3+ characters to look up.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "permissions", "user"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7366103a4fd0c592ceedc923b67664419c4d10261e9c957e6e9c5e2650d3ca6f"
        },
        {
          "name": "start_instance",
          "title": "Start Instance",
          "description": "Start a specific game server instance (by id or exact name). Fails if the instance is already running or not in a startable state.",
