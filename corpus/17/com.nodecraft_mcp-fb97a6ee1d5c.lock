        {
          "name": "search_files",
          "title": "Search Files",
          "description": "Search a specific instance (by id or exact name) for files whose name matches a glob, plus files whose text contains the glob's literal part (so \"**/*motd*\" also finds files containing \"motd\"). Each hit's `matched_by` says whether its name, its content, or both matched. Names match case-insensitively, and binary files such as .jar only match by name. Leading folder names scope the search: \"mods/*mek*\" only looks inside /mods. Use this instead of walking the tree with list_files when you know roughly what a file is called or what is written in it. To search inside one known file, use read_file with `contains`.",
          "inputSchema": {
            "properties": {
              "glob": {
                "description": "Glob pattern relative to the instance root, e.g. \"**/*.properties\" or \"mods/*mekanism*\". A plain string with no glob characters is matched as \"**/*<value>*\" inside its folder. The response echoes the folder and glob actually searched.",
                "minLength": 1,
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["glob", "instance"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f577e5adc4d64cafa19bee215185d8bc356940831b1a5c9298ceb5b0f97c6252"
        },
        {
          "name": "search_game_files",
          "title": "Search Modpacks & Server Versions",
          "description": "Search the one-click installer catalog for a game: modpacks (e.g. FTB, All the Mods), server variants and mod loaders (e.g. Paper, Forge, Fabric). Each result has a file_id and its latest release. Pass a file_id to create_instance to install it on a new server, or to list_file_releases for older versions. `base_game` is the game itself; its file_id also works with list_file_releases to pick an older game version.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "Game slug, e.g. \"minecraft\". Must match a slug from get_game or list_instances.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many results to return. Defaults to 20, at most 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the name, e.g. \"ftb evolution\" or \"atm10\". Omit to list the most installed files.",
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:db2235ea0ac66b36f802b036eb3cd957a42c13ba13ab06f845760c200e50aba6"
        },
        {
          "name": "search_knowledgebase",
          "title": "Search Nodecraft Knowledgebase",
          "description": "Search the Nodecraft knowledgebase for articles covering game server setup, configuration, troubleshooting, and Nodecraft platform features. Returns article titles, canonical URLs to share with the user, Markdown URLs for reading the article, category, and a short preview.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "Optional game slug to scope results to a single game (e.g. \"minecraft\", \"valheim\"). Omit to search across all games.",
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "Maximum number of articles to return (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural language search query, e.g. a game name, error message, or feature.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
