        },
        {
          "name": "update_task",
          "title": "Update Automated Task",
          "description": "Change an existing automated task: rename it, reorder or replace its jobs, move its schedule, or enable/disable it. Only the fields you pass are changed, except `jobs`, which replaces the whole ordered list. Call list_tasks first to get the task id and its current jobs, and show the user the resulting task before confirming.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, restating the trigger, the timezone, and each job in plain language and getting their approval.",
                "type": "boolean"
              },
              "days": {
                "description": "schedule only: weekday names (for example \"monday\") or ints where 0 is Sunday.",
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", 0, 1, 2, 3, 4, 5, 6],
                  "type": ["string", "integer"]
                },
                "type": "array"
              },
              "enabled": {
                "description": "Whether the task runs. Set false to pause a task without deleting it.",
                "type": "boolean"
              },
              "events": {
                "description": "event only: server events that trigger this task.",
                "items": {
                  "enum": ["status.start", "status.online", "status.stop", "player.join", "player.part", "players.empty"],
                  "type": "string"
                },
                "type": "array"
              },
              "hours": {
                "description": "timer only: hours between runs.",
                "minimum": 0,
                "type": "integer"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "jobs": {
                "description": "Ordered jobs to run strictly from first to last each time the task fires. Preserve the user-requested order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arg": {
                      "description": "Argument for jobs that need one: the console command for status.input, a URL for the webhook jobs, whole minutes (1-60) for utility.wait, and \"halt\" (graceful) or \"kill\" (force) for status.stop. Omit for jobs that take no argument.",
                      "type": ["string", "number"]
                    },
                    "type": {
                      "description": "What this job does. Available jobs: status.start: Start server. status.stop: Stop server. status.restart: Restart server. status.input: Run console command. files.backup: Create backup. utility.wait: Pause/wait. utility.webhook: POST to a webhook URL. utility.discord_webhook: POST to a Discord webhook URL.",
                      "enum": ["status.start", "status.stop", "status.restart", "status.input", "files.backup", "utility.wait", "utility.webhook", "utility.discord_webhook"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "minutes": {
                "description": "timer only: minutes between runs, added to hours.",
                "minimum": 0,
                "type": "integer"
              },
              "name": {
                "description": "Short, human-readable title shown in the panel. Use spaces and title case, not underscores or identifier-style names.",
                "minLength": 1,
                "type": "string"
              },
              "task_id": {
                "description": "Id of the task to change, as returned by list_tasks.",
                "minLength": 1,
                "type": "string"
              },
              "times": {
                "description": "schedule only: 24-hour HH:MM clock times.",
                "items": {
                  "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                  "type": "string"
                },
                "type": "array"
              },
              "timezone": {
                "description": "schedule only: IANA timezone for the days and times. Defaults to the instance's own timezone, or UTC when it has none.",
                "type": "string"
              },
              "type": {
                "description": "schedule runs on chosen days at clock times, timer repeats from midnight, event runs when a server event fires.",
                "enum": ["schedule", "timer", "event"],
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e73e7d4d8dad43281023e9c0684727d7e0bd91683fe87f474b22a02dec6a5de"
        },
        {
          "name": "wake_instance",
          "title": "Wake Hibernating Instance",
          "description": "Wake a hibernating server so it comes back online. Lite servers hibernate when nobody is playing and have to be woken before anyone can connect. A user reporting they \"can't join\" or that their server \"is asleep\" usually needs this. Waking takes a minute or two; poll get_instance_info for the status afterwards.",
          "inputSchema": {
            "properties": {
