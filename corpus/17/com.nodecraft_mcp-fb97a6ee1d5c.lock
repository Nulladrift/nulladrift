        {
          "name": "restore_backup",
          "title": "Restore Backup",
          "description": "Restore a backup onto an instance. This DELETES every other file in the instance's file area and replaces it with the backup's contents, so anything created since that backup is lost. Call list_backups first and confirm with the user which backup, by name and date, they mean.",
          "inputSchema": {
            "properties": {
              "backup_id": {
                "description": "Id of the backup to restore, from list_backups.",
                "minLength": 1,
                "type": "string"
              },
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be restored, naming the backup and warning that all current files in the instance will be deleted and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["backup_id", "confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
