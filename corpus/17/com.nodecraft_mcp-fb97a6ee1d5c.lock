                "type": "string"
              }
            },
            "required": ["confirm", "contents", "instance", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44c7fc5a684a337a76b954eb1258bea2ea9aa66f41861fed972d163ec301f1b4"
        }
