        {
          "name": "stop_instance",
          "title": "Stop Instance",
          "description": "Stop a specific game server instance (by id or exact name). Set `force: true` to forcefully kill a hung process (may cause data loss).",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be stopped, naming the server and warning that anyone playing on it will be disconnected and getting their approval.",
                "type": "boolean"
              },
              "force": {
                "default": false,
                "description": "If true, issue a kill command instead of a graceful stop. Use only if the server is hung. May cause data loss.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
