{
  "lockfileVersion": 2,
  "subjects": {
    "com.nodecraft/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.nodecraft.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.nodecraft/mcp",
        "title": "Nodecraft",
        "version": "1.0.0",
        "description": "Manage your Nodecraft game servers: start, stop, files, backups, console, players and settings",
        "websiteUrl": "https://nodecraft.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Each user can make up to 120 Nodecraft tool calls a minute, and up to 30 of those can make changes. Pace bulk work, such as checking or changing many servers, to stay under that. If a tool returns `mcp.rate_limited`, wait `retry_after_seconds` before calling again.\n\nFields named `jit_*` describe Nodecraft Lite servers, which hibernate when idle and start again on demand. Call them Lite servers when talking to the user, never JIT.",
      "tools": [
        {
          "name": "add_port",
          "title": "Add Port Mapping",
          "description": "Expose an extra port on a specific instance (by id or exact name). Use this when the server listens on a port players cannot reach, such as a mod, a voice server, or a web map. The server picks the next free public port in the instance's block; you choose only the internal port the game listens on. Game-required ports are already mapped automatically, so check get_connection_info first. Port mappings apply to shared-IP servers only.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be added (the server will expose an extra public port) and getting their approval.",
                "type": "boolean"
              },
              "container": {
                "description": "The internal port the game or service listens on, 1024-65535.",
                "maximum": 65535,
                "minimum": 1024,
                "type": "integer"
              },
              "description": {
                "description": "Longer note about what the port is for, shown in the panel.",
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Short label for the mapping, shown in the panel, e.g. \"Voice Chat\".",
                "type": "string"
              }
            },
            "required": ["confirm", "container", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2968a9c8a5757d971c08bb8bfb35d572994aaf2a92e673906e9c19b947a43c81"
        },
        {
          "name": "compress_paths",
          "title": "Compress Paths Into an Archive",
          "description": "Compress files and/or folders on a specific instance (by id or exact name) into a single archive. All paths must be in the same folder, and the archive is written into that same folder. Only .zip and .tar.zstd are supported; a name with any other extension gets .tzst appended. Nothing is deleted, so this needs no confirmation, but it can take a while for large folders.",
          "inputSchema": {
            "properties": {
              "archive_name": {
                "description": "Name for the archive, e.g. \"world-backup.zip\". Only .zip and .tar.zstd (.tzst/.tar.zst/.tar.zstd/.zst) are supported; anything else gets .tzst appended.",
                "minLength": 1,
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "paths": {
                "description": "Files and/or folders to include, from the instance root. Every path must share the same parent folder.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["archive_name", "instance", "paths"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73a6ab347b6c4ccc8c9dbfa32a16fbebbc21eb386ff48ad02a0c719a07802da7"
        },
        {
          "name": "copy_path",
          "title": "Copy File or Folder",
          "description": "Copy a file or folder on a specific instance (by id or exact name). Useful for taking a quick backup of a config file before editing it. Copying is additive and needs no confirmation, unless `overwrite` is set, which destroys whatever is already at the destination and requires `confirm: true`.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "const": true,
                "description": "Required only when `overwrite` is true. Show the user what will be replaced before setting this.",
                "type": "boolean"
              },
              "from": {
                "description": "File or folder to copy, from the instance root.",
                "minLength": 1,
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "overwrite": {
                "default": false,
                "description": "Allow replacing an existing file at `to`. Anything already there is lost, so this also requires `confirm`.",
                "type": "boolean"
              },
              "to": {
                "description": "Destination, from the instance root.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["from", "instance", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b99d90c7248e8f5fcf0c18a2d38f6bee882810b3f47e545bc3486b70c57a99a"
        },
        {
          "name": "copy_user_access",
          "title": "Copy User Access To Other Servers",
          "description": "Give one account the same access they already have on a specific instance (by id or exact name) on other servers the user owns. The permissions copied are whatever is currently stored on the source instance. Servers the account already has access to are skipped and reported. Use list_instance_users on the source first to confirm the account and what they hold.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be copied (the user gains the same access on each listed server) and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "The source instance whose access should be copied, by id or exact name.",
                "minLength": 1,
                "type": "string"
              },
              "target_instances": {
                "description": "Instances to copy the access to, each by id or exact name. Each must be a server this account owns; the source itself is ignored.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "user": {
                "description": "Account id, or an exact username of 3+ characters to look up.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "target_instances", "user"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:908e83dcd9581e2c099af39b9c1c9fbefbd33a0567a2dd24a1bd2332927a7b4e"
        },
        {
          "name": "create_backup",
          "title": "Create Backup",
          "description": "Create a full backup of a specific instance (by id or exact name), covering everything in its file area. Worth doing before any risky change, since restoring later replaces the whole file area. The backup is built on the game node and appears in list_backups once it finishes, which can take several minutes for a large server. If this instance's backup storage is already full, creating another automatically deletes the oldest unlocked backups, so this asks for confirmation first.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be deleted, when this instance's backup storage is full and older backups have to make room and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04095105a04e91b8fbe054a0fecec3bb72cac1e348d3302788a29dfcbe99c14e"
        },
        {
          "name": "create_database",
          "title": "Create Database",
          "description": "Provision a MySQL database for a specific instance (by id or exact name), generating its hostname, database name, username and password. Many plugins use MySQL instead of flat files for performance. Fails if the server already has one, so call get_database_info first to check.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be created (a new MySQL database and credentials will be provisioned for this server) and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c88ae82d5127ed0ebd490c8ac27479cc032ea1e251ff9aeaa5391acb6087ec5"
        },
        {
          "name": "create_directory",
          "title": "Create Directory",
          "description": "Create a folder on a specific instance (by id or exact name), including any missing parent folders. Succeeds without complaint if the folder already exists. This only adds a folder, so it needs no confirmation.",
          "inputSchema": {
            "properties": {
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "path": {
                "description": "Folder to create, from the instance root, e.g. \"/plugins/MyPlugin\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["instance", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ed54b0543431eb688891a2fd56998c92c668e0d46f968c091792ff7588b58dd"
        },
        {
          "name": "create_instance",
          "title": "Create Saved Server",
          "description": "Create a new saved server configuration. This costs nothing and does not bring anything online. It produces a saved server that deploy_instance can then put into a free slot. Always call this with dry_run: true first and show the user the returned plan (what will be installed, location, connection address, and any licence they must accept); only call again with dry_run: false once they have approved it. Without file_id or release_id this installs the game's latest version. For a modpack, server variant or mod loader, find its file_id with search_game_files; for an older version, find its release_id with list_file_releases. To replace a running server with the new one while keeping the old one saved, follow up with swap_instance.",
          "inputSchema": {
            "properties": {
              "auto_update_on_start": {
                "default": false,
                "description": "Update the game to the latest version each time the server starts. Defaults to false; leave it off when the user asked for a specific version.",
                "type": "boolean"
              },
              "confirm": {
                "description": "Must be true when dry_run is false. Set it only after showing the user the dry-run plan and getting their approval.",
                "type": "boolean"
              },
              "domain_id": {
                "description": "Optional connection domain id. Defaults to the game's first available domain, which is almost always right.",
                "type": "string"
              },
              "dry_run": {
                "default": true,
                "description": "True (the default) resolves and returns the plan without creating anything. Only pass false after the user has approved that exact plan.",
                "type": "boolean"
              },
              "file_id": {
                "description": "Optional modpack or server variant to install, from search_game_files. Omit to install the game itself.",
                "type": "string"
              },
              "game": {
                "description": "Game slug, e.g. \"minecraft\", \"valheim\", \"palworld\". Must match a slug from get_game or list_instances.",
                "minLength": 1,
                "type": "string"
              },
              "license_confirmation": {
                "description": "Required for Minecraft and its variants. Set true ONLY if the user has themselves confirmed they accept the licence named in the dry run. Never set this on your own behalf or on an assumption, since it records their acceptance of a legal agreement.",
                "type": "boolean"
              },
              "location": {
                "description": "Location id or exact name from list_locations. Ask the user which region their players are closest to, since changing it later needs a redeploy.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "What to call the server in the dashboard. Also becomes its connection hostname, so ask the user rather than inventing one.",
                "minLength": 1,
                "type": "string"
              },
              "release_id": {
                "description": "Optional specific version of that file (or of the game itself when file_id is omitted), from list_file_releases. Defaults to the latest.",
                "type": "string"
              }
            },
            "required": ["game", "location", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e27a8c4d91e699df076f9eba630a0d0fcf3bd4873af4e313a6dbe75b76a6e32"
        },
        {
          "name": "create_task",
          "title": "Create Automated Task",
          "description": "Create an automated task on an instance, such as a nightly restart, a recurring backup, or a console command that runs on a server event. The task is enabled as soon as it is created and will act on the live server, so confirm the schedule with the user first. Call list_tasks afterwards to verify it.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be created, restating the trigger, the timezone, and each job in plain language and getting their approval.",
                "type": "boolean"
              },
              "days": {
                "description": "schedule only: weekday names (for example \"monday\") or ints where 0 is Sunday.",
                "items": {
                  "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", 0, 1, 2, 3, 4, 5, 6],
                  "type": ["string", "integer"]
                },
                "type": "array"
              },
              "events": {
                "description": "event only: server events that trigger this task.",
                "items": {
                  "enum": ["status.start", "status.online", "status.stop", "player.join", "player.part", "players.empty"],
                  "type": "string"
                },
                "type": "array"
              },
              "hours": {
                "description": "timer only: hours between runs.",
                "minimum": 0,
                "type": "integer"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "jobs": {
                "description": "Ordered jobs to run strictly from first to last each time the task fires. Preserve the user-requested order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arg": {
                      "description": "Argument for jobs that need one: the console command for status.input, a URL for the webhook jobs, whole minutes (1-60) for utility.wait, and \"halt\" (graceful) or \"kill\" (force) for status.stop. Omit for jobs that take no argument.",
                      "type": ["string", "number"]
                    },
                    "type": {
                      "description": "What this job does. Available jobs: status.start: Start server. status.stop: Stop server. status.restart: Restart server. status.input: Run console command. files.backup: Create backup. utility.wait: Pause/wait. utility.webhook: POST to a webhook URL. utility.discord_webhook: POST to a Discord webhook URL.",
                      "enum": ["status.start", "status.stop", "status.restart", "status.input", "files.backup", "utility.wait", "utility.webhook", "utility.discord_webhook"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "minutes": {
                "description": "timer only: minutes between runs, added to hours.",
                "minimum": 0,
                "type": "integer"
              },
              "name": {
                "description": "Short, human-readable title shown in the panel. Use spaces and title case, not underscores or identifier-style names.",
                "minLength": 1,
                "type": "string"
              },
              "times": {
                "description": "schedule only: 24-hour HH:MM clock times.",
                "items": {
                  "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                  "type": "string"
                },
                "type": "array"
              },
              "timezone": {
                "description": "schedule only: IANA timezone for the days and times. Defaults to the instance's own timezone, or UTC when it has none.",
                "type": "string"
              },
              "type": {
                "description": "schedule runs on chosen days at clock times, timer repeats from midnight, event runs when a server event fires.",
                "enum": ["schedule", "timer", "event"],
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "jobs", "name", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9739928d7b462de1b66d1668478733c8c9d9a98353e26435fd839ce2316f5f22"
        },
        {
          "name": "create_ticket",
          "title": "Create Support Ticket",
          "description": "Open a new support ticket for the signed-in account. The message body is the whole ticket. There is no subject or category field. Write it in the user's own words: what they were doing, what went wrong, and any error text they saw. A support agent replies on the ticket, which get_ticket reads and the user can also see on the Support page at app.nodecraft.com.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be sent to Nodecraft support as a new ticket and getting their approval.",
                "type": "boolean"
              },
              "message": {
                "description": "The full ticket message. Include what the user was doing, what went wrong, and any error output.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1b8465c7dd078541fba4157f76a91b1945341ecbb6b4ae44c2b23dfba5fac97"
        },
        {
          "name": "delete_database",
          "title": "Delete Database",
          "description": "Destroy the MySQL database provisioned for a specific instance (by id or exact name), deleting every table and row inside it. There is no undo and no export. Call get_database_info first and make sure the user understands what is stored in it.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be permanently deleted (the database and everything stored in it is destroyed and cannot be recovered) and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f435c5ee1e5a373110715591a02fd9e2353feb06e84370b3f0f738ea13e0d56"
        },
        {
          "name": "delete_path",
          "title": "Delete File or Folder",
          "description": "Permanently delete a file or folder on a specific instance (by id or exact name). Deleting a folder removes everything inside it. There is no undo and no recycle bin, so the only recovery is a backup. Requires `confirm: true`; always show the user the exact path and, for folders, what it contains before setting it.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "const": true,
                "description": "Must be set to true. This operation is irreversible, so list the folder's contents and get explicit user approval before setting this.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "path": {
                "description": "File or folder to delete, from the instance root. Deleting a folder is recursive.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c810d235b7590261f9c78a0c0f12d01e66d59c270f572e375efdb0883fc3358"
        },
        {
          "name": "delete_port",
          "title": "Delete Port Mapping",
          "description": "Remove a custom port mapping from a specific instance (by id or exact name). The public port is freed immediately and anything connecting through it stops working. Game-required ports cannot be removed. Call get_connection_info first and show the user the mapping you are about to remove. Port mappings apply to shared-IP servers only.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be deleted, naming the internal port and the public port it frees and getting their approval.",
                "type": "boolean"
              },
              "container": {
                "description": "The internal port of the mapping to delete, from get_connection_info.",
                "maximum": 65535,
                "minimum": 1024,
                "type": "integer"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "container", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1afb520c98c4d99b3457d74153af39937f772e005e274730496737f9cd4d1f4c"
        },
        {
          "name": "delete_task",
          "title": "Delete Automated Task",
          "description": "Permanently delete an automated task from an instance. This cannot be undone. If the user only wants the task to stop running for now, call update_task with enabled set to false instead.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be deleted, naming the task and describing what it currently does and getting their approval.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "task_id": {
                "description": "Id of the task to delete, as returned by list_tasks.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "instance", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2665ac61f9226ba2c0ea67a77076ba8e670e35e816a1f03c367f12520e69fd60"
        },
        {
          "name": "deploy_instance",
