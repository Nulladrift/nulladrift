        },
        {
          "name": "update_port",
          "title": "Update Port Mapping",
          "description": "Change the name or description of an existing port mapping on a specific instance (by id or exact name). The internal and public ports cannot be changed. To change them, delete the mapping and add a new one. Game-required ports cannot be edited at all. Call get_connection_info first to see the current mappings. Port mappings apply to shared-IP servers only.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true. Set this only after showing the user exactly what will be changed, naming the internal port it applies to and getting their approval.",
                "type": "boolean"
              },
              "container": {
                "description": "The internal port of the mapping to change, from get_connection_info.",
                "maximum": 65535,
                "minimum": 1024,
                "type": "integer"
              },
              "description": {
                "description": "New description for the mapping. Pass an empty string to clear it.",
                "type": "string"
              },
              "instance": {
                "description": "Instance id (preferred) or exact instance name.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "New label for the mapping.",
                "type": "string"
              }
            },
            "required": ["confirm", "container", "instance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
