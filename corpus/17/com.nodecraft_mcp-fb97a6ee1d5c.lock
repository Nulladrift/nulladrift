              "location": {
                "description": "Filter by location id (e.g. \"us-chicago\") or a case-insensitive substring of the location name.",
                "type": "string"
              },
              "name_contains": {
                "description": "Case-insensitive substring match against the instance name.",
                "type": "string"
              },
              "server_status": {
                "description": "Filter by live run state, e.g. \"offline\" to find servers that are currently down. Hibernating instances have no run state and are excluded by any value here.",
                "enum": ["online", "offline", "started", "stopping"],
                "type": "string"
              },
              "status": {
                "default": "deployed",
                "description": "Filter by deploy status (whether the server occupies a slot, not whether it is running). Use `server_status` for that. Defaults to \"deployed\", which also includes hibernating Lite servers, since they keep their slot while asleep.",
                "enum": ["deployed", "archived", "any"],
