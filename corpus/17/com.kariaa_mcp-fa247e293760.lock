      "instructions": "Kariaa helps people find work. Two parts here: job search and career tools, and DataHouse data tasks.\nJobs (no key needed): search_jobs finds live openings for a role near a place or remote, with links to apply on the employer's page; get_job opens one in full (use it to tailor a resume or cover letter to the posting); check_job_post lists scam warning signs in a post or offer with the quoted lines (pass it in English); estimate_pay gives what employers state for a role in a place. With a key, save_job and my_saved_jobs keep a list.\nApplying to board jobs happens on the employer's page: give the person the link. Never pay anyone to get a job. Listings come from job boards; tell the person to check the details with the employer.\nDataHouse: data tasks (record a clip, photograph an object, read sentences aloud, label text). The samples are UNPAID verification; paid work follows at the task's rate. Browse with list_tasks and get_task.\nTo act for a person you need their API key as a Bearer token (they create one at https://www.kariaa.com/datahouse/connect or by sending /apikey to Kariaa in chat).\nDataHouse flow: whoami (profile ready?) -> update_profile if basics are missing -> apply_to_task with the required answers -> for each sample request_upload + PUT the file + confirm_upload (or add_text_sample for text) -> submit_samples -> get_submission for the review -> my_earnings / request_payout for Kariaa balance and payouts.\nIf you cannot send file bytes yourself (a chat app), call get_upload_link after apply_to_task and give the person the link: they pick the files on their phone and submit there. remove_sample takes back a wrong file before submitting.\nThe samples are unpaid: they only verify that the person can do the task and that the content is their own. One application per task, up to 10 files of 100 MB each, kinds per task. Verified people are offered paid work at the task's rate (or the preferred rate they stated, if the reviewer agrees).\nEvery task carries its own material (instructions: the sentences to read, the texts to label, the answers to rate), how-to steps (sample.how_to), what a good sample looks like (sample.looks_like) and rules (rules + program_rules): read them to the person before they record or write. When a task bans AI-written answers, the answers must come from the person.\nNever upload files the person did not make themselves; never paste the API key into a message.\nSubmitting means the person agrees to the DataHouse terms (https://www.kariaa.com/terms#datahouse): samples don't guarantee paid work or a job, and may be shared with the task's reviewers and clients. The key's owner is responsible for everything done with the key, including by their agent.",
