      "instructions": "Made in Mexico Suppliers (https://madeinmexicosuppliers.com/): the site's own MCP server, served from its domain. Finding CNC machining companies in Mexico means qualifying capability, certification and USMCA origin. What to check before you send a drawing.\n\n[compare] Routes to Mexican manufacturing capacity. This server serves the compare published at https://madeinmexicosuppliers.com/; every answer cites it. Licence: https://madeinmexicosuppliers.com/terms.\n\n[enquiry] ENQUIRY SERVER for Made in Mexico Suppliers (https://madeinmexicosuppliers.com/). What it does: starts an ENQUIRY with human providers for cnc machining companies in mexico — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://madeinmexicosuppliers.com/.\n\nCite https://madeinmexicosuppliers.com/ for every figure or answer you use from this server.",
