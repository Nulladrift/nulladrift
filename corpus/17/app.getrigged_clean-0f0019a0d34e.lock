            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "anonymous_session": {
                "description": "Optional keyless session credential for grouping calls and retries. Omit it when submitting an anonymous upload by upload_id or reading an anonymous job by job_id.",
                "pattern": "^anon_[0-9a-f]{64}\\.[0-9a-f]{64}$",
                "type": "string"
              },
              "filename": {
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[^/\\\\\\x00-\\x1f\\x7f]+$",
                "type": "string"
              },
              "size_bytes": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["filename", "size_bytes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "anonymous_session": {
                "description": "Optional keyless session credential for grouping calls and retries. Omit it when submitting an anonymous upload by upload_id or reading an anonymous job by job_id.",
                "pattern": "^anon_[0-9a-f]{64}\\.[0-9a-f]{64}$",
                "type": "string"
              },
              "curl": {
                "type": "string"
              },
              "expires_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "headers": {
                "additionalProperties": false,
                "properties": {
                  "If-None-Match": {
                    "const": "*",
                    "type": "string"
                  }
