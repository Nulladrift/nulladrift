        {
          "name": "enhance_media",
          "description": "Clean speech in a video or audio file. Submit a public HTTPS URL or a completed upload, then poll get_job if it is still running. For a keyless upload, pass upload_id and omit anonymous_session. Keyless requests preview the first minute. Paid jobs may spend credits. Omit idempotency_key for normal use. Rigged Clean reuses the job for the same source and options within 10 minutes under the same API key or anonymous session.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
