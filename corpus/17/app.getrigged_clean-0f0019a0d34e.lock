      "serverInfo": {
        "name": "app.getrigged/clean",
        "title": "Rigged Clean",
        "version": "0.1.1",
        "description": "Clean the speech in a video. Every other stream comes back untouched.\n\nPicture, extra audio tracks and subtitles are copied packet for packet in the same order. Chapters are preserved.\n\nCompleted jobs include a receipt with a video packet hash, stream checks, A/V lag in milliseconds, loudness and before-and-after quality scores when available. A job that fails a quality check is free.\n\nFirst 60 seconds free, no account. Full files cost 1 cent per minute, billed per second, from a $5 pack."
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_upload",
          "description": "Get a signed PUT for a local file. Upload exactly the declared byte count, then pass upload_id to enhance_media. For a keyless upload, upload_id is sufficient. Keep the ID and upload URL private.",
