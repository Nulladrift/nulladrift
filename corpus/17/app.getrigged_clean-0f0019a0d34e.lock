              "upload_url": {
                "maxLength": 4096,
                "pattern": "^[Hh][Tt][Tt][Pp][Ss]?:",
                "type": "string"
              }
            },
            "required": ["curl", "expires_at", "headers", "upload_id", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8620cfd33699a533388fb87bd102ee0bfc55e6f968db346286758d708d79e480"
