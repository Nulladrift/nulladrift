        {
          "name": "income_tax_estimate",
          "title": "Income tax & take-home estimate (57 countries)",
          "description": "Estimate personal income tax and take-home pay from gross annual income for 57 countries, using the engine's effective-dated brackets with each country's own levies, offsets and social contributions as its scheme defines them. Covered: AE, AR, AT, AU, BD, BE, BR, CA, CH, CL, CN, CO, CR, CZ, DE, DK, EE, EG, ES, FI, FR, GB, GR, GT, HU, ID, IE, IL, IN, IS, IT, JM, JP, KE, KR, LU, LV, MX, MY, NG, NL, NO, NZ, PH, PK, PL, PT, SA, SE, SG, SI, SK, TH, TR, US, VN, ZA. Any other country returns 'not covered' rather than a guess; its headline rates live in tax_rate_lookup. Pass region for a state, province or nation where the scheme has one (CA: 13 regions, e.g. AB, BC, MB; ES: 3 regions, e.g. AN, CT, MD; GB: SCT (Scotland); US: 51 regions, e.g. AK, AL, AR); without it the answer is national only and says so in its assumptions. For Finland pass `municipality` (Finnish or Swedish name, e.g. 'Tampere' or 'Helsingfors') for that municipality's own rate — otherwise the national average is used and the answer says so — plus `church` for a parish member and `age` where it changes the contributions; Finland also returns the tax-card rate (veroprosentti). The figure is for EMPLOYMENT income (salary or wages) wherever a country applies an employee-only item — India's salary standard deduction, UK Class 1 National Insurance, US FICA — and the first assumption says so. For freelance or self-employed profit pass incomeType \"self-employed\": India and the UK compute it, countries where it is taxed the same answer it, and the rest refuse with what differs rather than return a salaried figure. This is a resident-individual estimate, not a filing calculation: relay the assumptions it returns. Each answer cites the income-tax source and date for that country — not the GST/VAT one. For AU HELP/HECS use student_loan_repayment. Results may include one sourced background fact (relatedFact); the figures do not depend on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Finland only: age at the end of the tax year. Changes the employee pension and unemployment contributions and, from 66, the earned-income credit; omit to assume a working age (18–64 from 2026, when the 53–62 pension surcharge ended; 18–52 for 2025)",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "church": {
                "default": "none",
                "description": "Finland only: parish membership, for church tax. Needs `municipality`, because each parish sets its own rate",
                "enum": ["none", "evangelical-lutheran", "orthodox"],
                "type": "string"
              },
              "country": {
                "description": "2-letter ISO code of a covered country (upper case)",
                "enum": ["AE", "AR", "AT", "AU", "BD", "BE", "BR", "CA", "CH", "CL", "CN", "CO", "CR", "CZ", "DE", "DK", "EE", "EG", "ES", "FI", "FR", "GB", "GR", "GT", "HU", "ID", "IE", "IL", "IN", "IS", "IT", "JM", "JP", "KE", "KR", "LU", "LV", "MX", "MY", "NG", "NL", "NO", "NZ", "PH", "PK", "PL", "PT", "SA", "SE", "SG", "SI", "SK", "TH", "TR", "US", "VN", "ZA"],
                "type": "string"
              },
              "income": {
                "description": "Gross annual income in local currency, before tax",
                "minimum": 0,
                "type": "number"
              },
              "incomeType": {
                "description": "What the income is: \"employment\" (salary or wages, the default) or \"self-employed\" (freelance or sole-trader profit after business expenses). Countries that do not model self-employed income refuse it with what differs instead of returning the employment figure",
                "enum": ["employment", "self-employed"],
                "type": "string"
              },
              "municipality": {
                "description": "Finland only: the municipality (kunta) of residence on 31 December of the previous year, in Finnish or Swedish, e.g. 'Helsinki', 'Espoo', 'Tampere', 'Åbo'. Sets the municipal and parish tax rates; omit to use the national average municipal rate",
                "maxLength": 60,
                "type": "string"
              },
              "region": {
                "description": "Optional state, province or nation code, where the country's scheme has one: CA: 13 regions, e.g. AB, BC, MB; ES: 3 regions, e.g. AN, CT, MD; GB: SCT (Scotland); US: 51 regions, e.g. AK, AL, AR",
                "maxLength": 8,
                "type": "string"
              },
              "taxYear": {
                "description": "Tax year as people write it, e.g. '2026-27' or '2026/27' (AU/NZ/GB/IN), '2026' (calendar-year countries), 'YA 2027' (Singapore), 'Tax Year 2027' (Pakistan, which names a year by its end); omit for the current tax year. A year not on file is refused with the years on file",
                "type": "string"
              }
            },
            "required": ["country", "income"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "description": "Assumptions the figures depend on — relay them with the numbers; the first is always the income basis",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "averageRate": {
                "description": "Total tax over gross, as a fraction",
                "type": "number"
              },
              "churchRate": {
                "description": "Finland: church-tax rate applied, as a fraction (0 for a non-member)",
                "type": "number"
              },
              "country": {
                "description": "Country estimated (2-letter ISO code)",
                "type": "string"
              },
              "currency": {
                "description": "Currency of every monetary field",
                "type": "string"
              },
              "dataVerifiedOn": {
                "description": "ISO date the rate data was last confirmed against the authority",
                "type": "string"
              },
              "disclaimer": {
                "description": "General-information note that must accompany any figure shown to a person",
                "type": "string"
              },
              "gross": {
                "description": "Gross annual income used",
                "type": "number"
              },
              "incomeBasis": {
                "description": "What income the figure was computed for: employment (employee-only items applied), self-employed, or any (nothing depends on the income type). The first assumption says the same in words",
                "enum": ["employment", "self-employed", "any"],
                "type": "string"
              },
              "incomeTax": {
                "description": "Income tax before levies and offsets",
                "type": "number"
              },
              "levies": {
                "description": "Charges on top of the offset tax, by name (social contributions, regional tax) — empty array when none apply",
                "items": {
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "lito": {
                "description": "Kept for compatibility: AU Low Income Tax Offset only, 0 for every other country. See `offsets` for the general figure.",
                "type": "number"
              },
              "marginalRate": {
                "description": "Marginal rate on the next unit of income, as a fraction",
                "type": "number"
              },
              "mayBeStale": {
                "description": "True once the verification date is over a year old — re-confirm with the authority",
                "type": "boolean"
              },
              "medicareLevy": {
                "description": "Kept for compatibility: AU Medicare levy only, 0 for every other country. See `levies` for the general figure.",
                "type": "number"
              },
              "municipalRate": {
                "description": "Finland: municipal income-tax rate applied, as a fraction",
                "type": "number"
              },
              "municipality": {
                "description": "Finland: the municipality whose rates were used, or \"national average\"",
                "type": "string"
              },
              "offsets": {
                "description": "Credits that reduced the tax, by name — empty array when none apply",
                "items": {
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "region": {
                "description": "State, province or nation whose tax was included — present only when region was passed",
                "type": "string"
              },
              "relatedFact": {
                "additionalProperties": false,
                "description": "One sourced background fact about the country's income tax; the figures do not depend on it. Absent when no sourced fact fits.",
                "properties": {
                  "context": {
                    "description": "Present on a state or provincial answer: the fact is about the country as a whole",
                    "enum": ["national"],
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter ISO code of the country the fact is about",
                    "type": "string"
                  },
                  "detail": {
                    "description": "Longer supporting detail, when the corpus has it",
                    "type": "string"
                  },
                  "fact": {
                    "description": "The fact, in one or two sentences",
                    "type": "string"
                  },
                  "kind": {
                    "description": "'origin' = when the tax began and what it replaced; 'anniversary' = the same, on the anniversary of its start date; 'story' = a dated story from the facts corpus",
                    "enum": ["origin", "story", "anniversary"],
                    "type": "string"
                  },
                  "more": {
                    "description": "The tool that returns the full sourced fact set for this country",
                    "enum": ["tax_facts"],
                    "type": "string"
                  },
                  "sourceName": {
                    "description": "Who the fact is sourced to",
                    "type": "string"
                  },
                  "sourceUrl": {
                    "description": "Link to that source — always present",
                    "type": "string"
                  },
                  "topic": {
                    "description": "Which tax the fact is about",
                    "enum": ["gst", "income", "company", "cgt", "super", "studentloan", "general"],
                    "type": "string"
                  },
                  "verifiedDate": {
                    "description": "ISO date the fact was last checked against its source, when recorded",
                    "type": "string"
                  }
                },
                "required": ["country", "fact", "kind", "more", "sourceName", "sourceUrl", "topic"],
                "type": "object"
              },
              "separatelyWithheld": {
                "description": "Finland: employee pension and unemployment contributions for the year, to the cent — withheld by the employer on top of the tax card",
                "type": "number"
              },
              "source": {
