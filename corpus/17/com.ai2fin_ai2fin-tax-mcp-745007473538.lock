        {
          "name": "tax_rate_lookup",
          "title": "Country tax rate lookup",
          "description": "Look up one country's headline tax rates: GST/VAT standard and reduced rates, top personal income tax rate, and company tax rate — national rates for 193 countries, plus state and provincial sales tax for CA and US when you pass region. Use it for a single country; to see several countries side by side use compare_countries, and to apply GST/VAT to an amount use compute_gst_vat. Rates come from a fixed dataset verified against the national tax authority — every answer names its source and verification date, and an unsupported country returns a clear error rather than a guess. Results may include one sourced background fact (relatedFact); the figures do not depend on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "2-letter ISO 3166-1 code of the country to look up (case-insensitive)",
