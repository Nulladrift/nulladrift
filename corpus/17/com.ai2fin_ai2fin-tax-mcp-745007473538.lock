              },
              "countriesWithFacts": {
                "description": "Every country code that has curated facts",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Country name (country scope only)",
                "type": "string"
              },
              "disclaimer": {
                "description": "Note that must accompany facts shown to a person",
                "type": "string"
              },
              "facts": {
                "description": "The facts, each with its own source. Show the source alongside any fact you repeat",
