                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "topic": {
                "description": "Optional: only facts about this tax — 'gst' (GST/VAT and other consumption taxes), 'income', 'company', 'cgt', 'super', 'studentloan' or 'general'. Omit for every fact",
                "enum": ["gst", "income", "company", "cgt", "super", "studentloan", "general"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "2-letter ISO code (country scope only)",
