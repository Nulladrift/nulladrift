        {
          "name": "compare_countries",
          "title": "Multi-country tax comparison",
          "description": "Compare headline tax rates — GST/VAT, top personal income tax and company tax — across several countries at once. Use it to shortlist or contrast jurisdictions (relocation, expansion, pricing); for one country's full detail use tax_rate_lookup, and to apply a rate to an amount use compute_gst_vat. Pass income to add, per country, the income_tax_estimate result for that income (income tax, total tax, take-home, average rate, with its own source). The same number is read in each country's own currency and is not converted between currencies. Income tax is estimated for 57 countries; any other row reports 'not covered' for that part and still shows its headline rates. Codes the dataset does not cover are reported back in unmatchedCodes rather than silently dropped; every matched row cites its national tax authority. Results may include one sourced background fact (relatedFact); the figures do not depend on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Countries to compare — two or more makes a meaningful comparison",
                "examples": [
                  ["AU", "GB", "SG"]
                ],
                "items": {
                  "description": "2-letter ISO 3166-1 country code (case-insensitive)",
                  "maxLength": 2,
                  "minLength": 2,
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "income": {
                "description": "Optional gross annual income, before tax. The same number is applied in EACH country's own local currency — it is NOT converted (120000 means AUD 120,000 in AU, GBP 120,000 in GB and SGD 120,000 in SG). When given, each row adds an income-tax estimate for that income",
                "examples": [120000],
                "minimum": 0,
                "type": "number"
              },
              "taxYear": {
                "description": "Optional, only with income: the tax-year label passed to the income-tax estimate for every country, e.g. '2025-26' (AU/NZ/GB/IN) or '2026' (calendar-year countries). Labels differ by country; a country without that year reports the years it has instead of a figure. Omit for each country's current tax year",
                "type": "string"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataVerifiedOn": {
                "description": "ISO date the rate data was last confirmed against the authority",
                "type": "string"
              },
