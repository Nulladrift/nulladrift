                "type": "number"
              },
              "otherTaxableIncome": {
                "default": 0,
                "description": "Other taxable income in AUD — only used to test the Division 293 high-earner threshold",
                "minimum": 0,
                "type": "number"
              },
              "personalDeductible": {
                "default": 0,
                "description": "Personal contributions claimed as a tax deduction in AUD (also concessional)",
                "minimum": 0,
                "type": "number"
              },
              "salarySacrifice": {
                "default": 0,
