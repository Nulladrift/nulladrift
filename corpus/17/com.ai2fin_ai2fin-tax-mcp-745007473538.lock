        {
          "name": "compute_gst_vat",
          "title": "GST/VAT add or remove calculator",
          "description": "Add or remove a country's GST/VAT — or its other national consumption tax, such as Japan's consumption tax or Malaysia's SST — on a monetary amount, returning the net / tax / gross split. Use it to convert between tax-exclusive and tax-inclusive prices (invoices, quotes, receipts); for the rates themselves use tax_rate_lookup. Pure arithmetic on the current standard rate, rounded to 2 decimals, in the local currency. Pass region for a state or provincial rate (CA, US): in Canada that is GST plus the provincial tax, in the US the state sales tax. A country with no national rate (the US without a region, or a country with no consumption tax) returns an explanatory error instead of a wrong number. Results may include one sourced background fact (relatedFact); the figures do not depend on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The monetary amount in the local currency — tax-exclusive when mode=add, tax-inclusive when mode=remove",
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "2-letter ISO 3166-1 code of the country whose GST/VAT rate applies (case-insensitive)",
                "examples": ["AU", "GB"],
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "mode": {
                "default": "add",
                "description": "'add' puts tax on top of a net amount; 'remove' extracts the tax already inside a gross amount",
                "enum": ["add", "remove"],
                "type": "string"
              },
              "region": {
                "description": "Optional state or province code, for sub-national sales tax. Held for CA (13 provinces and territories), US (51 states incl. DC). E.g. 'ON' (Ontario) with country CA, or 'CA' (California) with country US. Answered from that state's or province's own cited rate; US figures are the state rate only — local sales taxes are not included.",
                "examples": ["ON", "CA", "NY"],
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["amount", "country"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "2-letter ISO country code",
                "type": "string"
              },
              "country": {
                "description": "Country name",
                "type": "string"
              },
              "dataVerifiedOn": {
                "description": "ISO date the rate data was last confirmed against the authority",
                "type": "string"
              },
              "disclaimer": {
                "description": "General-information note that must accompany any figure shown to a person",
                "type": "string"
              },
              "gross": {
                "description": "Amount including tax (local currency, 2 dp)",
                "type": "number"
              },
              "mayBeStale": {
                "description": "True once the verification date is over a year old — re-confirm with the authority",
                "type": "boolean"
              },
              "mode": {
                "description": "Which conversion was performed",
                "enum": ["add", "remove"],
                "type": "string"
              },
              "net": {
                "description": "Amount before tax (local currency, 2 dp)",
                "type": "number"
              },
              "rate": {
                "description": "Standard rate applied, as a fraction",
                "type": "number"
              },
              "region": {
                "description": "State or province whose rate was applied — present only when region was passed",
                "type": "string"
              },
              "regionName": {
                "description": "What applies in that region, in a sentence",
                "type": "string"
              },
              "relatedFact": {
                "additionalProperties": false,
                "description": "One sourced background fact about the country's consumption tax; the figures do not depend on it. Absent when no sourced fact fits.",
                "properties": {
                  "context": {
                    "description": "Present on a state or provincial answer: the fact is about the country as a whole",
                    "enum": ["national"],
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter ISO code of the country the fact is about",
                    "type": "string"
                  },
                  "detail": {
                    "description": "Longer supporting detail, when the corpus has it",
                    "type": "string"
                  },
                  "fact": {
                    "description": "The fact, in one or two sentences",
                    "type": "string"
                  },
                  "kind": {
                    "description": "'origin' = when the tax began and what it replaced; 'anniversary' = the same, on the anniversary of its start date; 'story' = a dated story from the facts corpus",
                    "enum": ["origin", "story", "anniversary"],
                    "type": "string"
                  },
                  "more": {
                    "description": "The tool that returns the full sourced fact set for this country",
                    "enum": ["tax_facts"],
                    "type": "string"
                  },
                  "sourceName": {
                    "description": "Who the fact is sourced to",
                    "type": "string"
                  },
                  "sourceUrl": {
                    "description": "Link to that source — always present",
                    "type": "string"
                  },
                  "topic": {
                    "description": "Which tax the fact is about",
                    "enum": ["gst", "income", "company", "cgt", "super", "studentloan", "general"],
                    "type": "string"
                  },
                  "verifiedDate": {
                    "description": "ISO date the fact was last checked against its source, when recorded",
                    "type": "string"
                  }
                },
                "required": ["country", "fact", "kind", "more", "sourceName", "sourceUrl", "topic"],
                "type": "object"
              },
              "source": {
                "description": "The national tax authority the figures were verified against (e.g. 'ATO — ato.gov.au')",
                "type": "string"
              },
              "sourceUrl": {
                "description": "https link to the authority page the rate was verified against. Present only on rate answers backed by a verified ledger row — absent (never empty) otherwise, so its presence is itself the claim",
                "type": "string"
              },
              "tax": {
                "description": "The GST/VAT portion (local currency, 2 dp)",
                "type": "number"
              },
              "taxLocalName": {
                "description": "The tax's local name, e.g. 'GST', 'VAT'",
