        {
          "name": "tax_facts",
          "title": "Sourced tax facts and origin stories",
          "description": "Sourced facts about a country's tax system: when and why its GST/VAT was introduced, what it replaced, and memorable, true stories (court cases, elections, odd rulings) — each fact linked to its own source. Omit country for a primer on what a consumption tax is plus famous tax stories from history. Pass topic to keep only facts about one tax (each fact lists its topics). Use it for background, explainers, teaching or a conversation opener; for any rate or amount use tax_rate_lookup, compute_gst_vat or the estimate tools, because facts are dated stories, not live figures. Countries without curated facts return the list of countries that have them rather than an invented one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "2-letter ISO code, e.g. AU, GB, JP. Omit for the global primer and famous tax stories",
