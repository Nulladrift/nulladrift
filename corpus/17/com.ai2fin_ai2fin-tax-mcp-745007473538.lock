                      "type": "string"
                    },
                    "fact": {
                      "type": "string"
                    },
                    "sourceName": {
                      "type": "string"
                    },
                    "sourceUrl": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "topics": {
                      "description": "Which taxes the fact is about. Country facts with no recorded topic are GST/VAT facts ('gst'); global stories with none are 'general'",
