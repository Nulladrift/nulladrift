                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "region": {
                "description": "Optional state or province code, for sub-national sales tax. Held for CA (13 provinces and territories), US (51 states incl. DC). E.g. 'ON' (Ontario) with country CA, or 'CA' (California) with country US. Answered from that state's or province's own cited rate; US figures are the state rate only — local sales taxes are not included.",
                "examples": ["ON", "CA", "NY"],
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
