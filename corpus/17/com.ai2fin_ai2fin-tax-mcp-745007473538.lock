      "instructions": "You're connected to the 2Fin Tax MCP — Fin, the friendly tax helper from 2Fin (ai2fin.com). This is the FREE, PUBLIC tax server: standard national GST/VAT rates for 193 countries; state and provincial sales tax for Canada and the US; income tax for 57 countries; company tax for 139; capital gains for 71 — each figure cited to its own source and date, with no login and no access to anyone’s account. Where a country or capability is not covered, or a rule cannot be computed, the tool says so (or returns the rule text) rather than guessing. Finland is covered in depth: income_tax_estimate takes a municipality (any of the 292 on the mainland, by Finnish or Swedish name), church membership and age, and returns the tax-card rate (veroprosentti) as well as take-home; cgt_estimate applies the deemed acquisition cost and the 1 000 € rule. Answer in the user’s language — the figures do not change. tax_facts serves sourced background — when and why a country’s GST/VAT began, what it replaced, and true stories (196 facts across 36 countries) — for explainers, never for figures. When you repeat a figure or a fact, show its source and verified date from the answer: that receipt is the point of this server. If a tool says a country or year is not covered, say so rather than estimating. For your OWN data — transactions, categories, your real tax position — connect the separate, authenticated 2Fin app MCP at https://api.ai2fin.com/mcp instead. Computed from published government rates — general information to plan with, not personal tax or financial advice. For decisions about your own situation, check with the authority or a registered adviser.",
      "tools": [
        {
          "name": "cgt_estimate",
          "title": "Capital gains tax estimate (71 countries)",
          "description": "Estimate capital gains tax on one sale of shares or property by a resident individual, for 71 countries (AE, AR, AT, AU, BE, BG, BR, CA, CH, CL, CN, CO, CY, CZ, DE, DK, EE, EG, ES, FI, FR, GB, GH, GR, GT, HK, HR, HU, ID, IE, IL, IN, IS, IT, JM, JP, KE, KR, LI, LK, LT, LU, LV, MT, MU, MX, MY, NG, NL, NO, NZ, PH, PK, PL, PT, QA, RO, RS, RU, SA, SE, SG, SI, SK, TR, TW, TZ, UA, UG, US, ZA). Where the country's rule can be computed the answer is a figure; where it depends on facts the engine cannot model, the answer is the rule itself (rate, holding period, annual exemption, main residence) with the reason — never a borrowed number. Any other country returns 'not covered'. Pass income (other taxable income for the year) where the gain is taxed at marginal rates, and heldMoreThan12Months or holdingMonths where the holding period matters (the Australian 50% discount, the US long-term rate). capitalLosses apply before any discount. Finland (FI) adds its own detail: the better of the actual cost or the deemed acquisition cost (hankintameno-olettama: 20% of the price, 40% after 10 years), the 1 000 € small-disposals rule and 30%/34% capital income tax — pass yearsHeld, and otherCapitalIncome if there is any; costBase may be omitted there. Each answer cites the capital-gains source and date for that country — not the GST/VAT one. For pay without an asset sale use income_tax_estimate. Non-resident rules are out of scope. Results may include one sourced background fact (relatedFact); the figures do not depend on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "default": "shares",
                "description": "What was sold: 'shares' (shares and funds) or 'property' (real estate). Rules differ by asset in many countries",
                "enum": ["shares", "property"],
                "type": "string"
              },
              "capitalLosses": {
                "default": 0,
                "description": "Capital losses to offset — applied before any discount; FI: from this year or carried forward (five years)",
                "minimum": 0,
                "type": "number"
              },
              "costBase": {
                "description": "What the asset cost, in local currency, including eligible incidental costs. Required except for FI, where omitting it uses the deemed acquisition cost (pass FI buying and selling costs as saleExpenses)",
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "default": "AU",
                "description": "2-letter ISO code of a covered country (upper case); defaults to AU",
                "enum": ["AE", "AR", "AT", "AU", "BE", "BG", "BR", "CA", "CH", "CL", "CN", "CO", "CY", "CZ", "DE", "DK", "EE", "EG", "ES", "FI", "FR", "GB", "GH", "GR", "GT", "HK", "HR", "HU", "ID", "IE", "IL", "IN", "IS", "IT", "JM", "JP", "KE", "KR", "LI", "LK", "LT", "LU", "LV", "MT", "MU", "MX", "MY", "NG", "NL", "NO", "NZ", "PH", "PK", "PL", "PT", "QA", "RO", "RS", "RU", "SA", "SE", "SG", "SI", "SK", "TR", "TW", "TZ", "UA", "UG", "US", "ZA"],
                "type": "string"
              },
              "heldMoreThan12Months": {
                "description": "True when the asset was held at least 12 months (e.g. the AU 50% discount, the US long-term rate). Shorthand for holdingMonths: true = 12, false = 0",
                "type": "boolean"
              },
              "holdingMonths": {
                "description": "Whole months the asset was held; overrides heldMoreThan12Months",
                "minimum": 0,
                "type": "integer"
              },
              "income": {
                "description": "Other taxable income for the year, in local currency — sets the marginal rate where the gain is taxed as income (e.g. AU, US short-term). Required where the rule needs it; the answer says so",
                "minimum": 0,
                "type": "number"
              },
              "otherCapitalIncome": {
                "default": 0,
                "description": "FI: other capital income this year (dividends, rent, other gains) — decides how much of the gain falls above the 30 000 € threshold",
                "minimum": 0,
                "type": "number"
              },
              "proceeds": {
                "description": "Sale price of the asset, in local currency",
                "minimum": 0,
                "type": "number"
              },
              "saleExpenses": {
                "default": 0,
                "description": "FI: brokerage, fees and other costs of buying and selling",
                "minimum": 0,
                "type": "number"
              },
              "taxYear": {
                "description": "FI: calendar tax year like '2026'; omit for the current year",
                "pattern": "^\\d{4}$",
                "type": "string"
              },
              "totalProceedsThisYear": {
                "description": "FI: the year's total sale prices, this sale included, for the 1 000 € small-disposals rule; omit when this is the only sale",
                "minimum": 0,
                "type": "number"
              },
              "yearsHeld": {
                "description": "FI: whole years owned — 10 or more raises the deemed acquisition cost from 20% to 40% of the price",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["proceeds"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "description": "Assumptions the answer depends on — relay them with the figure",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cgtPayable": {
                "description": "Extra tax caused by the gain, in local currency; null when rule-only",
                "type": ["number", "null"]
              },
              "costDeducted": {
                "description": "FI: the cost deducted from the price",
                "type": "number"
              },
              "country": {
                "description": "Country estimated (2-letter ISO code)",
                "type": "string"
              },
              "currency": {
                "description": "Currency of every monetary field",
                "type": "string"
              },
              "dataVerifiedOn": {
                "description": "ISO date the rate data was last confirmed against the authority",
                "type": "string"
              },
              "disclaimer": {
                "description": "General-information note that must accompany any figure shown to a person",
                "type": "string"
              },
              "discountApplied": {
                "description": "Whether a discount or inclusion rate reduced the taxable gain (e.g. the AU 50% discount). Always false for FI",
                "type": "boolean"
              },
              "exemptionApplied": {
                "description": "Annual exempt amount or allowance used, where there is one",
                "type": ["number", "null"]
              },
              "grossGain": {
                "description": "Proceeds minus cost (FI: minus the larger of actual or deemed cost). Floored at 0, local currency",
                "type": ["number", "null"]
              },
              "loss": {
                "description": "FI: the loss on this sale, if any (only ever from the actual cost)",
                "type": "number"
              },
              "lossDeductible": {
                "description": "FI: whether that loss can be deducted",
                "type": "boolean"
              },
              "lossOffset": {
                "description": "Capital losses actually applied",
                "type": ["number", "null"]
              },
              "mayBeStale": {
                "description": "True once the verification date is over a year old — re-confirm with the authority",
                "type": "boolean"
              },
              "method": {
                "description": "FI: whether the actual cost or the deemed acquisition cost was deducted",
                "enum": ["actual", "deemed"],
                "type": "string"
              },
              "notes": {
                "description": "FI: rules that decided the answer, in plain words",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reason": {
                "description": "Why no figure was computed (rule-only), in plain words",
                "type": ["string", "null"]
              },
              "relatedFact": {
                "additionalProperties": false,
                "description": "One sourced background fact about the country's capital gains tax; the figures do not depend on it. Absent when no sourced fact fits.",
                "properties": {
                  "context": {
                    "description": "Present on a state or provincial answer: the fact is about the country as a whole",
                    "enum": ["national"],
                    "type": "string"
                  },
                  "country": {
                    "description": "2-letter ISO code of the country the fact is about",
                    "type": "string"
                  },
                  "detail": {
                    "description": "Longer supporting detail, when the corpus has it",
                    "type": "string"
                  },
                  "fact": {
                    "description": "The fact, in one or two sentences",
                    "type": "string"
                  },
                  "kind": {
                    "description": "'origin' = when the tax began and what it replaced; 'anniversary' = the same, on the anniversary of its start date; 'story' = a dated story from the facts corpus",
                    "enum": ["origin", "story", "anniversary"],
                    "type": "string"
                  },
                  "more": {
                    "description": "The tool that returns the full sourced fact set for this country",
                    "enum": ["tax_facts"],
                    "type": "string"
                  },
                  "sourceName": {
                    "description": "Who the fact is sourced to",
                    "type": "string"
                  },
                  "sourceUrl": {
                    "description": "Link to that source — always present",
                    "type": "string"
                  },
                  "topic": {
                    "description": "Which tax the fact is about",
                    "enum": ["gst", "income", "company", "cgt", "super", "studentloan", "general"],
                    "type": "string"
                  },
                  "verifiedDate": {
                    "description": "ISO date the fact was last checked against its source, when recorded",
                    "type": "string"
                  }
                },
                "required": ["country", "fact", "kind", "more", "sourceName", "sourceUrl", "topic"],
                "type": "object"
              },
              "rule": {
                "description": "The country's rule as written, for relaying — especially when status is rule-only",
                "properties": {
                  "annualExemption": {
                    "type": "string"
                  },
                  "holdingPeriod": {
                    "type": "string"
                  },
                  "mainResidence": {
                    "type": "string"
                  },
                  "notes": {
                    "type": "string"
                  },
                  "rule": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "smallDisposalsExempt": {
                "description": "FI: true when the year's sale prices total 1 000 € or less, making every gain tax-free",
                "type": "boolean"
              },
              "source": {
                "description": "The national tax authority the figures were verified against (e.g. 'ATO — ato.gov.au')",
                "type": "string"
              },
              "sourceUrl": {
                "description": "https link to the authority page the rate was verified against. Present only on rate answers backed by a verified ledger row — absent (never empty) otherwise, so its presence is itself the claim",
                "type": "string"
              },
              "status": {
                "description": "'computed' = a figure; 'rule-only' = the rule text and the reason no figure is given (cgtPayable and taxableGain are then null)",
                "enum": ["computed", "rule-only"],
                "type": "string"
              },
              "step": {
                "description": "Which holding-period step applied, when the rule has steps",
                "type": ["string", "null"]
              },
              "taxYear": {
                "description": "Tax year whose rules were used, when the rule is year-based",
                "type": ["string", "null"]
              },
              "taxableGain": {
                "description": "Gain the tax was charged on; null when rule-only",
                "type": ["number", "null"]
              }
            },
            "required": ["cgtPayable", "country", "dataVerifiedOn", "disclaimer", "discountApplied", "grossGain", "lossOffset", "mayBeStale", "source", "status", "taxYear", "taxableGain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
