              "settings": {
                "additionalProperties": false,
                "description": "Page settings, as the dashboard editor has them, keyed by page: welcome{startWithPayment}, capture{captureCount 1-10, captureCountdown 1-15, prepTimeout, captureTimeout, selfPhotoDuration, gifEnabled, gifSpeed, recordingEnabled, recordingSpeed}, retake{enabled, retakeTimeout, maxRetakeCount, maxRetakeSession}, select{enabled, selectionTimeout}, frame{displayFrameTitle}, filter{enabled, useLivePreview, applyAfterCapture}, checkout{enabled, checkoutTimeout, promoEnabled}, payment{enabled, paymentTimeout}, result{resultTimeout, askUserConsent, emailEnabled, reprintEnabled, reprintTimeout}. Prices and packages are set in the dashboard, not here.",
                "properties": {
                  "capture": {
                    "additionalProperties": false,
                    "properties": {
                      "captureCount": {
                        "maximum": 10,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "captureCountdown": {
                        "maximum": 15,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "captureTimeout": {
                        "maximum": 1800,
                        "minimum": 30,
                        "type": "integer"
                      },
                      "gifEnabled": {
                        "type": "boolean"
                      },
                      "gifSpeed": {
                        "maximum": 5000,
                        "minimum": 200,
                        "type": "integer"
                      },
                      "prepTimeout": {
                        "maximum": 300,
                        "minimum": 5,
                        "type": "integer"
                      },
                      "recordingEnabled": {
                        "type": "boolean"
                      },
                      "recordingSpeed": {
                        "maximum": 4,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "selfPhotoDuration": {
                        "maximum": 1800,
                        "minimum": 30,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "checkout": {
                    "additionalProperties": false,
                    "properties": {
                      "checkoutTimeout": {
                        "maximum": 600,
                        "minimum": 10,
                        "type": "integer"
                      },
                      "enabled": {
                        "type": "boolean"
                      },
                      "promoEnabled": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "filter": {
                    "additionalProperties": false,
                    "properties": {
                      "applyAfterCapture": {
                        "type": "boolean"
                      },
                      "enabled": {
                        "type": "boolean"
                      },
                      "useLivePreview": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "frame": {
                    "additionalProperties": false,
                    "properties": {
