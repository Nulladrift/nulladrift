              "prompt": {
                "description": "The booth, from what the operator said and what you gathered, up to 1000 characters. Start with what the operator asked for, in their words and language, written as a description rather than a request: drop the wrapper ('design me a', 'make me', 'can you', 'buatkan', 'bikinin', 'tolong') and do not put it in quotation marks — the Studio prints quoted words as they are. Then add the brief. Never swap a choice they made for one you prefer; fill only what they left open. Write facts and art direction, not marketing copy. Include: the occasion or business, with names, ages, dates and places exactly as given; one visual reference in words — theirs if they gave one, otherwise one you pick from the occasion and name to them (e.g. '1970s Indonesian film poster', 'hand-painted warung sign', 'Swiss minimalist poster'); do not ask them for one; 2-3 colours; 2-4 concrete objects or motifs (e.g. 'enamel tin mugs', 'pressed jasmine'). Do not write the headline or taglines — the Studio writes the copy — unless the operator gave exact wording to print; then quote only that wording and say it must appear as written. Quotation marks are for nothing else. No emoji, no praise words ('stunning', 'elegant', 'magical', 'vibrant', 'intricate', 'high quality', '4k', 'unforgettable'), no sparkles, glitter, bokeh, lens flare, glow, glossy 3D unless asked. Do not name brands, characters or franchises; the image model refuses them.",
