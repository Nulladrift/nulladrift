                        "type": "boolean"
                      },
                      "paymentTimeout": {
                        "maximum": 900,
                        "minimum": 30,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "result": {
                    "additionalProperties": false,
                    "properties": {
