        {
          "name": "update_booth_draft",
          "title": "Change a booth draft's settings",
          "description": "Change a booth draft without a redraw: its title, link name, welcome button text, colours, capture mode, language, which frames and filters it carries, its AI effect, and the page settings the dashboard editor offers (photo count, countdown, timeouts, GIF/recording, retake, checkout, payment, result). Use it after check_generation shows the draft and the operator asks for one of these; what it sets is applied when create_booth runs. It cannot change the welcome headline or subtext of an AI-designed welcome (those are painted into the image — use refine_booth with what='welcome' and headline), and prices or packages are set in the dashboard. Answers at once with the updated draft, `applied` (what landed) and `rejected` (what did not, and why) — relay a rejection as a sentence, never as success. It never touches a booth that already exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aiEffectTitle": {
                "description": "The title of a public AI effect to add, exactly as the operator named it; an empty string removes the one chosen before.",
                "maxLength": 80,
                "type": "string"
              },
              "buttonText": {
                "description": "The welcome screen's button label, e.g. 'Mulai' or 'Start'.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "captureMode": {
                "description": "'standard' = classic strip, 'frame-based' = frame mode.",
                "enum": ["standard", "frame-based"],
                "type": "string"
              },
              "draftId": {
                "description": "The draft to change, from check_generation or get_booth_draft.",
                "pattern": "^dft_[a-f0-9]{24}$",
                "type": "string"
              },
              "filterIds": {
                "description": "Filters the booth should carry (replaces the draft's list): e.g. one made with create_filter. The default 'Normal' is added anyway.",
                "items": {
                  "pattern": "^[a-f0-9]{24}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "frameIds": {
                "description": "Frames the booth should carry (replaces the draft's list): e.g. one saved with save_frame, or catalogue ids. create_booth adds starter frames anyway.",
                "items": {
                  "pattern": "^[a-f0-9]{24}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "headline": {
                "description": "Welcome headline. Only drafts whose welcome is laid out as text accept it; on an AI-designed welcome it is painted into the image: use refine_booth with what='welcome' and headline instead.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language code of the booth's own text: 'id', 'en', 'es'.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "palette": {
                "additionalProperties": false,
                "description": "Theme colours as #RRGGBB: primaryColor, secondaryColor, backgroundColor. Only the ones given change.",
                "properties": {
                  "backgroundColor": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "primaryColor": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "secondaryColor": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
