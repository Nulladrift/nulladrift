                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "what": {
                "type": "string"
              }
            },
            "required": ["jobId", "kind", "state", "what"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
