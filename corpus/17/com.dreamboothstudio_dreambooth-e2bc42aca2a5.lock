        {
          "name": "preview_filter",
          "title": "Preview a photo filter",
          "description": "Show what a filter would look like BEFORE creating it: the Studio renders its sample photo (or the operator's own preview photo, if they set one in the dashboard) through the exact pipeline the booth uses, and returns an image URL. Free and read-only — call it whenever the operator is designing a filter, adjust the numbers from their reaction ('warmer', 'less contrast'), preview again, and call create_filter with the same adjustments only once they are happy. Some adjustments (shadows, highlights, whites, blacks, clarity, dehaze, vibrance, texture) are applied by the booth but cannot be shown here; the result lists them as notPreviewed so you can say so. Nothing is created by this tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjustments": {
                "additionalProperties": false,
                "description": "Only include what the operator asked to change. An omitted adjustment keeps its neutral value; sending every field at its neutral value creates a filter that does nothing. A look is a few small moves, not every slider: most need 2-5 adjustments, each within about 25 of neutral (75-125 on the 0-200 scales) unless the operator asks for something strong ('high contrast', 'black and white'). Booth photos are faces under venue light, so keep skin believable: leave hueRotate at 0 unless they ask for a surreal colour shift (it turns skin green or blue), and keep tint within 15 of 0. Do not stack vignette, grain, clarity and dehaze to make it 'cinematic'; one of them, lightly, is usually the whole effect.",
                "properties": {
                  "blacks": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "blur": {
                    "description": "0 = off, in pixels",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "brightness": {
                    "description": "100 = unchanged",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "clarity": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "contrast": {
                    "description": "100 = unchanged",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "dehaze": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "exposure": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "grain": {
                    "description": "0 = off",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "grayscale": {
                    "description": "0 = off, 100 = black and white",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "highlights": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "hueRotate": {
                    "description": "0 = unchanged, in degrees",
                    "maximum": 360,
                    "minimum": 0,
