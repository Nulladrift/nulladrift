        {
          "name": "refine_booth",
          "title": "Refine a booth draft",
          "description": "Change a booth draft from start_booth, using the draftId check_generation returned. what='welcome' redraws the welcome screen from an instruction ('warmer colours', 'bigger headline', 'less clutter') while keeping the design; add orientation 'phone' or 'laptop' to redraw only that screen (1 redraw) — without it both screens are redrawn (2). To change the words on the welcome screen (the couple's names, a new headline), pass headline with the exact new words: it is stored on the draft and both screens are repainted with it (2 redraws). Never use orientation for that, or the phone and laptop screens say different things. what='app-background' redraws the calmer backdrop behind the rest of the booth (1 redraw). what='everything' rebuilds the whole draft from a NEW full description (spends 1 of the draft's 3 full generations) — only when the operator wants a different booth, not a tweak. A draft has 5 redraws in total; check_generation reports what is left. Title, headline, link name and colours cannot be edited directly: they change only through a redraw instruction, or at create time (title, slug). Returns a job id; call check_generation. Call only when the operator asks for a change — never iterate on your own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "draftId": {
                "description": "The draft to change, from check_generation's result for start_booth.",
                "pattern": "^dft_[a-f0-9]{24}$",
                "type": "string"
              },
              "headline": {
                "description": "Only with what='welcome': the new welcome headline exactly as it should read, in the booth's language (e.g. 'Sania & Senya'). Both screens are redrawn with it.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "instruction": {
                "description": "For 'welcome' / 'app-background': what to change, up to 300 characters — the current design is kept and only this is applied. State the change and nothing else, starting from the operator's own words: what changes, to what, and what to keep if that matters ('background to deep green #1F3B2D, keep the motifs where they are'). Turn a vague word into a concrete change ('more festive' → which colour, motif or density moves). Do not restate the original design or add mood or praise words. For 'everything': the new full description of the booth, up to 1000 characters, written the way start_booth's prompt is: Start with what the operator asked for, in their words and language, written as a description rather than a request: drop the wrapper ('design me a', 'make me', 'can you', 'buatkan', 'bikinin', 'tolong') and do not put it in quotation marks — the Studio prints quoted words as they are. Then add the brief. Never swap a choice they made for one you prefer; fill only what they left open. Write facts and art direction, not marketing copy. Include: the occasion or business, with names, ages, dates and places exactly as given; one visual reference in words — theirs if they gave one, otherwise one you pick from the occasion and name to them (e.g. '1970s Indonesian film poster', 'hand-painted warung sign', 'Swiss minimalist poster'); do not ask them for one; 2-3 colours; 2-4 concrete objects or motifs (e.g. 'enamel tin mugs', 'pressed jasmine'). Do not write the headline or taglines — the Studio writes the copy — unless the operator gave exact wording to print; then quote only that wording and say it must appear as written. Quotation marks are for nothing else. No emoji, no praise words ('stunning', 'elegant', 'magical', 'vibrant', 'intricate', 'high quality', '4k', 'unforgettable'), no sparkles, glitter, bokeh, lens flare, glow, glossy 3D unless asked.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "orientation": {
                "description": "Only with what='welcome': redraw just the phone (portrait) or laptop (landscape) screen. Omit to redraw both. Never with headline.",
                "enum": ["phone", "laptop"],
                "type": "string"
              },
              "what": {
                "description": "Which part to change. 'everything' is a full rebuild from a new description.",
                "enum": ["welcome", "app-background", "everything"],
                "type": "string"
              }
            },
            "required": ["draftId", "instruction", "what"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "draftId": {
                "type": "string"
              },
