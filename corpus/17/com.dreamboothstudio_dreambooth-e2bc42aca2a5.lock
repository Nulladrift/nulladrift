          "name": "start_frame",
          "title": "Start designing a photo frame",
          "description": "Start designing a new photo frame for this operator's booths from a description of the look they want — 'batik motifs in warm gold', 'minimal Scandinavian, lots of white space'. It opens a design thread and makes the FIRST version. It returns immediately with a job id; call check_generation to see the result, and do NOT describe the frame as made until that says so. The result is a preview in the thread — nothing is in the operator's frame list until save_frame is called with the generation they choose. To change a result, call refine_frame with the threadId that check_generation returns, rather than starting again. Every generation spends part of the account's free daily allowance, so do not call this speculatively, twice for the same request, or while another generation is still running.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "layout": {
                "description": "How many photos and how they sit. 'strip-3': the classic photo strip — 3 photos stacked, printed as a pair on a 4x6; 'strip-4': a taller strip — 4 photos stacked, printed as a pair on a 4x6; 'grid-4': 4 photos in a 2x2 grid on one 4x6; 'hero-3': one large photo with two smaller ones beneath it; 'pair-2': two landscape photos, one above the other. Ask if it is not obvious from what the operator said; 'strip-3' is what most people mean by a photobooth strip.",
                "enum": ["strip-3", "strip-4", "grid-4", "hero-3", "pair-2"],
                "type": "string"
              },
              "prompt": {
                "description": "What the frame should look like: decoration, colour, occasion. Not the photo slots — those come from the layout. Start with what the operator asked for, in their words and language, written as a description rather than a request: drop the wrapper ('design me a', 'make me', 'can you', 'buatkan', 'bikinin', 'tolong') and do not put it in quotation marks — the Studio prints quoted words as they are. Then add the brief. Never swap a choice they made for one you prefer; fill only what they left open. Write it as a designer's brief, not a caption. Keep their specifics exactly (names, colours, motif names such as kawung or mega mendung, the occasion) and make concrete: one technique (e.g. risograph, linocut, screen print, paper cut-out, gouache, batik tulis); 2-3 colours, named or hex; 1-3 named motifs and where they sit (top band, corners, along the edge); how dense it is — a plain paper colour or texture around the photos is a valid choice, say which. Add nothing they did not ask for: no sparkles, glitter, bokeh, lens flare, glow, glossy 3D, no praise words ('stunning', 'elegant', 'magical', 'vibrant', 'intricate', 'high quality', '4k'). If it is too vague to fill these in, ask one question, or pick one direction and tell the operator which. Do not name brands, characters or franchises; the image model refuses them.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "shape": {
                "description": "The shape the photos are cut to. Defaults to rectangular. Not every layout comes in every shape; the Studio picks the closest available.",
                "enum": ["rect", "rounded", "circle", "oval", "square"],
                "type": "string"
              }
            },
            "required": ["layout", "prompt"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": "string"
              },
