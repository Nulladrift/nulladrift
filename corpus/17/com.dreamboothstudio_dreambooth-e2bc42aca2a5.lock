        {
          "name": "create_filter",
          "title": "Create a photo filter",
          "description": "Create a new photo filter on this operator's account from a description of the look they want — 'warm and slightly faded', 'high contrast black and white'. Translate the description into the adjustment numbers yourself; the ranges are in the schema. Call this only when the operator asks for a filter to be CREATED. It does not change an existing filter, and there is no tool that does — to edit or delete one, send them to the dashboard. Creating the same filter twice makes two filters, so do not retry a call that may have gone through.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjustments": {
                "additionalProperties": false,
                "description": "Only include what the operator asked to change. An omitted adjustment keeps its neutral value; sending every field at its neutral value creates a filter that does nothing. A look is a few small moves, not every slider: most need 2-5 adjustments, each within about 25 of neutral (75-125 on the 0-200 scales) unless the operator asks for something strong ('high contrast', 'black and white'). Booth photos are faces under venue light, so keep skin believable: leave hueRotate at 0 unless they ask for a surreal colour shift (it turns skin green or blue), and keep tint within 15 of 0. Do not stack vignette, grain, clarity and dehaze to make it 'cinematic'; one of them, lightly, is usually the whole effect.",
                "properties": {
                  "blacks": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "blur": {
                    "description": "0 = off, in pixels",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "brightness": {
                    "description": "100 = unchanged",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "clarity": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "contrast": {
                    "description": "100 = unchanged",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "dehaze": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "exposure": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "grain": {
                    "description": "0 = off",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "grayscale": {
                    "description": "0 = off, 100 = black and white",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "highlights": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "hueRotate": {
                    "description": "0 = unchanged, in degrees",
                    "maximum": 360,
                    "minimum": 0,
                    "type": "number"
                  },
                  "saturation": {
                    "description": "100 = unchanged, 0 = grey",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sepia": {
                    "description": "0 = off",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "shadows": {
                    "description": "0 = unchanged, positive = lifted",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "temperature": {
                    "description": "0 = unchanged, positive = warmer",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "tint": {
                    "description": "0 = unchanged, positive = magenta",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "vibrance": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "vignette": {
                    "description": "0 = off",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "whites": {
                    "description": "0 = unchanged",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "isPublic": {
                "description": "Leave unset unless the operator explicitly asks for the filter to be shared. Default is private to their account.",
                "type": "boolean"
              },
              "name": {
                "description": "What the operator will see in their filter list. Use their words if they named it; otherwise a short descriptive name, not 'Untitled'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["adjustments", "name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjustments": {
                "additionalProperties": {
                  "type": "number"
                },
                "type": "object"
              },
              "dashboardUrl": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "isPublic": {
                "type": "boolean"
              },
              "kind": {
                "const": "filter",
                "type": "string"
              },
