                  "sepia": {
                    "description": "0 = off",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "shadows": {
                    "description": "0 = unchanged, positive = lifted",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "temperature": {
                    "description": "0 = unchanged, positive = warmer",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "tint": {
                    "description": "0 = unchanged, positive = magenta",
                    "maximum": 100,
                    "minimum": -100,
                    "type": "number"
                  },
                  "vibrance": {
                    "description": "0 = unchanged",
                    "maximum": 100,
