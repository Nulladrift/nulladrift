          "title": "Cost segregation year 1",
          "description": "Year-1 cost segregation worksheet. Land percent and cost-segregation percent are required because the form has no default for them. Bonus percent comes from tax-params.json when you pass acquired_date and placed_year. Otherwise it uses the form field's stored default. Estimates for planning; not tax advice.",
