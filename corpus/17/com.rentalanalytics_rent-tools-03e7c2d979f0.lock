{
  "lockfileVersion": 2,
  "subjects": {
    "com.rentalanalytics/rent-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rentalanalytics.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "RentalAnalytics rent tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools over the calculators and public-data files on rentalanalytics.com. HUD Fair Market Rent is the 40th-percentile voucher figure. estimate_rent is the site's statistical median. If a tool says a ZIP or county is missing, do not substitute a number.",
      "tools": [
        {
          "name": "advise_lease_renewal",
          "title": "Lease renewal",
          "description": "Lease renewal advisor. Market rent is estimate_rent for the ZIP. The recommended rent follows the page's gap bands: hold inside 5%, blend 65% of the gap when under market, blend 50% when over market. Turnover cost is the page's illustrative 1 to 2 months of current rent, not a measured local figure. If the rent estimate has no median, this tool stops.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "default": 2,
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "current_rent": {
                "type": "number"
              },
              "property_type": {
                "default": "apartment",
                "enum": ["apartment", "single_family", "townhouse", "condo", "duplex_unit"],
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": ["current_rent", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6bd5f6fdd1f4c0af8f68b2bdc609dc8b442388a1b3c54376ea3e2aaaa755882"
        },
        {
          "name": "calculate_amortization",
          "title": "Amortization",
          "description": "Fully amortizing mortgage schedule from the amortization calculator. Interest is rounded to the cent each month. Pass include_schedule true to get every row. Otherwise the tool returns the payment, payoff date, total interest, and total paid.",
          "inputSchema": {
            "properties": {
              "annualRatePct": {
                "type": "number"
              },
              "extraMonthly": {
                "type": "number"
              },
              "firstPaymentDate": {
                "description": "YYYY-MM-DD. Optional.",
                "type": "string"
              },
              "include_schedule": {
                "type": "boolean"
              },
              "principal": {
                "type": "number"
              },
              "years": {
                "type": "number"
              }
            },
            "required": ["annualRatePct", "principal", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96494b4e79550c38ca8610e5dd8d0cafcbb6645d9618909fa9e7d1136ee4e067"
        },
        {
          "name": "calculate_cap_rate",
          "title": "Cap rate",
          "description": "Cap rate calculator: NOI divided by purchase price, compared with the band stored in cap-rate-benchmarks.json for the ZIP's metro tier. Unknown ZIPs use the file's Tier 2 band, which is what the page does. Cash-on-cash, when financed, uses the page's 3% closing estimate. Bands are the file's estimated survey ranges, not a new comp.",
          "inputSchema": {
            "properties": {
              "annual_gross_rent": {
                "type": "number"
              },
              "down_payment_pct": {
                "type": "number"
              },
              "financed": {
                "type": "boolean"
              },
              "interest_pct": {
                "type": "number"
              },
              "loan_term_yrs": {
                "type": "number"
              },
              "op_expenses_annual": {
                "type": "number"
              },
              "property_type": {
                "enum": ["single_family", "small_multifamily_2_4", "multifamily_5_plus", "condo"],
                "type": "string"
              },
              "purchase_price": {
                "type": "number"
              },
              "vacancy_pct": {
                "description": "Percent, 0 to 100.",
                "type": "number"
              },
              "zip": {
                "description": "Optional. Used only to pick a tier already stored in zip_to_tier.",
                "type": "string"
              }
            },
            "required": ["annual_gross_rent", "op_expenses_annual", "property_type", "purchase_price", "vacancy_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe1542f1c2dddf6fb36bd1e761de07ed7350a9ebef9e87259822d2b8644f671a"
        },
        {
          "name": "calculate_cash_flow",
          "title": "Cash flow",
          "description": "Cash flow analyzer. Itemized P&L, cap rate, gross yield, cash-on-cash, and break-even occupancy from the inputs you pass. Closing costs in the cash-on-cash line are the page's 3% estimate. Taxes and insurance are annual; maintenance is monthly.",
          "inputSchema": {
            "properties": {
              "dpPct": {
                "description": "Down payment percent.",
                "type": "number"
              },
              "insurance": {
                "description": "Annual insurance.",
                "type": "number"
              },
              "intPct": {
                "type": "number"
              },
              "maintenance": {
                "description": "Monthly maintenance reserve.",
                "type": "number"
              },
              "mgmtPct": {
                "description": "Management fee as a percent of effective gross income.",
                "type": "number"
              },
              "purchase": {
                "type": "number"
              },
              "rent": {
                "description": "Monthly rent.",
                "type": "number"
              },
              "taxes": {
                "description": "Annual property tax.",
                "type": "number"
              },
              "term": {
                "description": "Loan term in years.",
                "type": "number"
              },
              "vacancy": {
                "description": "Vacancy percent.",
                "type": "number"
              }
            },
            "required": ["purchase", "rent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5deebe8a60c2245167dcd6e3c5ffac738d4fc5382285753f785b2e12c5304ab7"
        },
        {
          "name": "calculate_dscr",
          "title": "DSCR",
          "description": "DSCR calculator. NOI is rent times 12 times (1 minus vacancy) minus taxes, insurance, HOA, and other annual costs. Debt service is the fully amortizing payment times 12. DSCR is NOI divided by debt service. Max loan is the principal whose payment equals NOI divided by the target DSCR you pass. 1.25 is not assumed.",
          "inputSchema": {
            "properties": {
              "hoaAnnual": {
                "type": "number"
              },
              "insuranceAnnual": {
                "type": "number"
              },
              "loanAmount": {
                "type": "number"
              },
              "monthlyRent": {
                "type": "number"
              },
              "otherAnnual": {
                "type": "number"
              },
              "ratePct": {
                "type": "number"
              },
              "targetDscr": {
                "description": "Optional. Omit it and max loan stays empty.",
                "type": "number"
              },
              "taxesAnnual": {
                "type": "number"
              },
              "termYears": {
                "type": "number"
              },
              "vacancyPct": {
                "type": "number"
              }
            },
            "required": ["loanAmount", "monthlyRent", "ratePct", "termYears"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c9cfcd0922683e7c23159a6ddf23accc6fed9f49acabb97537786af413091e8"
        },
        {
          "name": "calculate_gross_yield",
          "title": "Gross yield from rent and value",
          "description": "Gross yield for a monthly rent and value you pass, using the site's half-up hundredths formula: floor((rent * 12 * 10000 + floor(value / 2)) / value). It does not look up a price.",
          "inputSchema": {
            "properties": {
              "monthly_rent": {
                "type": "number"
              },
              "value": {
                "type": "number"
              }
            },
            "required": ["monthly_rent", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63c72c5fefcd19bf70adacac090c012351abb3f5f19b2b4773591d2b63868f89"
        },
        {
          "name": "calculate_opex",
          "title": "Operating expense benchmark",
          "description": "Operating-expense lines as a percent of effective gross income, compared with the illustrative national bands in opex-benchmarks.json. Those bands are labeled illustrative in the file. They are not a metro measurement.",
          "inputSchema": {
            "properties": {
              "egi": {
                "description": "Annual effective gross income when mode is annual.",
                "type": "number"
              },
              "insurance": {
                "type": "number"
              },
              "maintenance": {
                "type": "number"
              },
              "mgmt_dollars": {
                "type": "number"
              },
              "mgmt_mode": {
                "default": "pct",
                "enum": ["pct", "dollars"],
                "type": "string"
              },
              "mgmt_pct": {
                "type": "number"
              },
              "mode": {
                "default": "annual",
                "enum": ["annual", "monthly"],
                "type": "string"
              },
              "monthly_rent": {
                "type": "number"
              },
              "taxes": {
                "type": "number"
              },
              "vacancy_pct": {
                "type": "number"
              }
            },
            "required": ["insurance", "maintenance", "taxes"],
            "type": "object"
          },
