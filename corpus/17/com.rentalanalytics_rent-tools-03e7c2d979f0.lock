        },
        {
          "name": "compare_str_ltr",
          "title": "Short-term vs long-term rent",
          "description": "STR vs long-term comparison. Short-term revenue is nightly rate times occupied nights. Long-term rent is the monthly rent you pass, or, if you omit it, the ACS B25031 cell for that ZIP and bedroom when the sample has one, otherwise the HUD FMR for bedrooms 0 through 4. If neither source has a rent, pass monthly_rent. The tool does not invent one.",
          "inputSchema": {
            "properties": {
              "avgNightsPerStay": {
                "type": "number"
              },
              "bedrooms": {
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "cleaningPerStay": {
                "type": "number"
              },
              "hoaAnnual": {
                "type": "number"
              },
              "insuranceAnnual": {
                "type": "number"
              },
              "ltrMgmtPct": {
                "type": "number"
              },
              "monthlyRent": {
                "type": "number"
              },
              "nightlyRate": {
                "type": "number"
              },
              "occupancyPct": {
                "type": "number"
              },
              "otherAnnual": {
                "type": "number"
              },
              "platformFeePct": {
                "type": "number"
              },
              "strMgmtPct": {
                "type": "number"
              },
              "taxesAnnual": {
                "type": "number"
              },
              "vacancyPct": {
                "type": "number"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": ["nightlyRate", "occupancyPct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:324cd237380798cf79af19b075b33cff739dd28a60faf2892cf15d3b3fc5a3e3"
        },
        {
          "name": "estimate_rent",
          "title": "Statistical median rent",
          "description": "The rent estimator on /tools/rent-estimator. Hero is the HUD FY2027 50th-percentile area rent scaled onto the ZIP FMR or SAFMR when that area is in hud-50th-sample.json, then aged with the BLS CPI Shelter rate in the script and a property-type multiplier. FMR stays the labeled 40th-percentile voucher figure. ACS B25031 is a second anchor when the sample has that ZIP. A ZIP missing from both the sample and the Section 8 extract returns an error. No national rent is invented for a missing ZIP.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "default": 2,
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "property_type": {
                "default": "apartment",
                "enum": ["apartment", "single_family", "townhouse", "condo", "duplex_unit"],
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1bb7d85f518c3a8e6774b5cd5ecbcaef048d1c79437a8ecad4231eb0ac84370b"
        },
