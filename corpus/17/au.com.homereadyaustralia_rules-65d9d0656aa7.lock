      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "homeready-rules",
        "title": "HomeReady Australia rules",
        "version": "1.1.0",
        "websiteUrl": "https://homereadyaustralia.com.au/stamp-duty-rules-data.html",
        "icons": [
          {
            "src": "https://homereadyaustralia.com.au/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Australian stamp duty, first home buyer and foreign buyer surcharge rules from HomeReady Australia, rules file version 2026.11.7, built 2026-11-25. Each rule links to its official sources with the date HomeReady read each one; its verified date is the latest of those. Quote a rule with its condition and dates. calculate_stamp_duty works out transfer duty and any foreign buyer surcharge on a price; give its notes with the figure, and say when exact is false. Eligibility for a concession, and whether a buyer is a foreign person, is decided by the revenue office. Terms: Free to use. You may call this API or the MCP endpoint and use its answers in your own products and answers, if you credit HomeReady Australia (homereadyaustralia.com.au). Do not copy, republish or resell the dataset in bulk. General information only, not financial, legal or tax advice: check the official source linked with each rule before relying on it.",
      "tools": [
        {
          "name": "calculate_stamp_duty",
          "title": "Calculate Australian stamp duty",
          "description": "Works out transfer (stamp) duty, any foreign buyer surcharge and the total on an established home bought whole, in any Australian state or territory, from HomeReady Australia's rules file: general rates, home and owner-occupier rates, first home buyer exemptions and concessions. Returns the figures, the rate or concession used, notes giving the conditions, exact=false where a lower amount may apply that isn't worked out, and the rules used. Not covered: new homes, off-the-plan, vacant land, a purchase where only some buyers are foreign persons, and Queensland claims on part of a property. General information only; the revenue office decides eligibility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "first_home_buyer": {
                "description": "Every buyer is a first home buyer (default false)",
                "type": "boolean"
              },
              "foreign_buyer": {
                "description": "Every buyer is a foreign person for the state's surcharge (default false: none is)",
                "type": "boolean"
              },
              "live_in": {
                "description": "A buyer will live in it as their home (default: the same as first_home_buyer). In Queensland a buyer who won't live in it gets no concession on their share, and Western Australia's first home owner rate needs every buyer to live there: the notes say so.",
                "type": "boolean"
              },
              "price": {
                "description": "Price (or dutiable value) in whole Australian dollars",
                "maximum": 100000000,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "State or territory where the home is",
                "enum": ["NSW", "VIC", "QLD", "WA", "SA", "TAS", "ACT", "NT"],
                "type": "string"
              }
            },
            "required": ["price", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate Australian stamp duty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a8ce71c6b5d45d7e9c4f5c73b00919d46673303b4579eb621cc940782a9d239"
        },
        {
          "name": "get_rule",
          "title": "Get one rule",
          "description": "Returns one rule by id (from list_rules): the value (duty bands, thresholds or rates), the condition it applies under, effective dates and which date decides, and links to the official sources with the dates they were read. Eligibility is decided by the revenue office.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The rule's id, exactly as list_rules returns it (for example nsw.duty.general)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84f9fd744b2e06195242e0b1d49a3537028866842da11b01aa89545ac9759c17"
        },
        {
          "name": "list_rules",
          "title": "List Australian property duty rules",
          "description": "Lists HomeReady's checked rules for Australian stamp (transfer) duty scales, first home buyer exemptions and concessions, and foreign buyer surcharges, by state or territory. Returns each rule's id, title, status and the date its sources were last checked, with the rules file version and terms. General information only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Optional state or territory filter",
                "enum": ["NSW", "VIC", "QLD", "WA", "SA", "TAS", "ACT", "NT"],
                "type": "string"
              },
              "topic": {
                "description": "Optional topic filter",
                "enum": ["first_home_buyer", "foreign_purchaser_surcharge", "owner_occupier_concession", "transfer_duty_scale"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Australian property duty rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01d8a066c87d6119e4ed98b3a8222d725dac3382216d4ab3dca39ae556e48e51"
        }
      ],
      "digest": "sha256:27a4fc2dd1e8c8cffe45ca614f4447b1f87797330388e8af5f4b46669ca9befa"
    }
  }
