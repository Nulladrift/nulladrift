        "websiteUrl": "https://homereadyaustralia.com.au/stamp-duty-rules-data.html"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Australian stamp duty, first home buyer and foreign buyer surcharge rules from HomeReady Australia, rules file version 2026.11.4, built 2026-11-19. Each rule links to its official sources with the date HomeReady read each one; its verified date is the latest of those. Quote a rule with its condition and dates. Eligibility for a concession, and whether a buyer is a foreign person, is decided by the revenue office. Terms: Free to use. You may call this API or the MCP endpoint and use its answers in your own products and answers, if you credit HomeReady Australia (homereadyaustralia.com.au). Do not copy, republish or resell the dataset in bulk. General information only, not financial, legal or tax advice: check the official source linked with each rule before relying on it.",
      "tools": [
        {
          "name": "get_rule",
          "title": "Get one rule",
          "description": "Returns one rule by id (from list_rules): the value (duty bands, thresholds or rates), the condition it applies under, effective dates and which date decides, and links to the official sources with the dates they were read. Eligibility is decided by the revenue office.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a89803695c1e3f70e3a9060fd40914d3413ab1daa2496f03fd4dc096b3e6e5b9"
        },
        {
          "name": "list_rules",
          "title": "List Australian property duty rules",
          "description": "Lists HomeReady's checked rules for Australian stamp (transfer) duty scales, first home buyer exemptions and concessions, and foreign buyer surcharges, by state or territory. Returns each rule's id, title, status and the date its sources were last checked, with the rules file version and terms. General information only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "enum": ["NSW", "VIC", "QLD", "WA", "SA", "TAS", "ACT", "NT"],
                "type": "string"
              },
              "topic": {
                "description": "Optional topic filter",
                "enum": ["first_home_buyer", "foreign_purchaser_surcharge", "owner_occupier_concession", "transfer_duty_scale"],
                "type": "string"
              }
