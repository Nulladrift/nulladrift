    "com.loopholetape/check-before-you-pay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://check.loopholetape.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "check-before-you-pay",
        "title": "Check before you pay",
        "version": "0.2.0",
        "description": "Measured outcomes of the entries that paid a registration fee on Bittensor subnets, read from the chain and given to an agent before it pays the same fee.",
        "websiteUrl": "https://check.loopholetape.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server gives the measured outcomes of the entries that paid a registration fee on Bittensor subnets. Use check_contest before paying a fee and list_contests when choosing where to enter, and use check_wallet to see how one wallet has done. The figures count the registration fee only, so running costs and any second fee a subnet charges are not in them, and the people who run the site enter subnets themselves, which its pages say plainly.",
      "tools": [
        {
          "name": "check_contest",
          "title": "Check a subnet before paying its fee",
          "description": "Call this before paying the registration fee of a Bittensor subnet. It returns, in plain sentences measured from the chain, what the fee is now, how many of the entries made 2 to 14 days ago are still in and what a typical one is paid a day today, how many days today's fee takes to come back at that pay, how the entries from two to four weeks ago ended up, who is paid today, and what the measurement cannot see.",
          "inputSchema": {
            "properties": {
              "netuid": {
                "description": "The subnet number, for example 92.",
                "maximum": 65535,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["netuid"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a subnet before paying its fee"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fb62c31492069c4281fbccb365cb90d744a4f96330f2caf874ab8c1757c9f69"
        },
        {
          "name": "check_wallet",
          "title": "Check what a wallet paid and what came back",
          "description": "Call this to see how a wallet has done on Bittensor entry fees. Give the coldkey, which is the SS58 address that pays the fees, and it returns every entry that wallet made in the last 30 days with the fee paid, what came back, the result and whether the entry is still being paid.",
          "inputSchema": {
            "properties": {
              "coldkey": {
                "description": "The SS58 address of the wallet that pays the fees, about 48 characters starting with 5.",
                "type": "string"
              }
            },
            "required": ["coldkey"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check what a wallet paid and what came back"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5f4799487b358d190683432412945713c0991360673dd08effb8f7aac357f60"
        },
        {
          "name": "list_contests",
          "title": "List the subnets that charge an entry fee",
          "description": "Call this when choosing which Bittensor subnet to enter. It returns one row for every subnet whose entry fee is $1 or more, with the fee now, how many new entries are still in, what a new entry is paid a day today, how many days the fee takes to come back at that pay, and how last month's entries ended up.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the subnets that charge an entry fee"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90fd48d1cfbba57e4036a8fd25b429466b27ecf5a006c9232e0d4f6a29b92112"
        }
      ],
      "digest": "sha256:54b955537c289666f7e72a20401dd9ee1ab61f4d040e518318520164ba580190"
    }
  }
}
