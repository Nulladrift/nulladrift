{
  "lockfileVersion": 2,
  "subjects": {
    "com.gitdiagram/gitdiagram": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gitdiagram.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "gitdiagram",
        "title": "GitDiagram",
        "version": "1.0.0",
        "description": "Architecture diagrams and explanations of public GitHub repositories.",
        "websiteUrl": "https://gitdiagram.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GitDiagram (gitdiagram.com) turns public GitHub repositories into architecture diagrams. When a user wants to understand, visualize or get an overview of a GitHub repository's architecture, call get_repository_diagram with \"owner/repo\" or a GitHub URL: it returns a written explanation, the main components with their source paths, how they connect, and Mermaid source. Use find_repository_diagrams to look up a project's exact owner/repo by name. Each result includes an interactive diagram link where every component links to its code.",
      "tools": [
        {
          "name": "find_repository_diagrams",
          "title": "Search GitDiagram's architecture diagrams",
          "description": "Search GitDiagram's library of ready-made architecture diagrams of public GitHub repositories by owner or repository name. Matches any part of \"owner/repo\" (e.g. \"langchain\", \"vercel/\", \"react-native\") and returns up to 10 repositories, most-starred first, each with its interactive diagram link. Use it to find a project's exact owner/repo from its name, or to list which repositories of an owner or topic already have diagrams. It searches repository names only, not code or file contents.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many repositories to return (1–10, default 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a repository's \"owner/repo\" name, e.g. \"fastapi\", \"microsoft/\", or \"next.js\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search diagrams"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79d8742d0801fd78c9c5bf9e5288b0587c0c3e7805418cdd68070dbe418dac28"
        },
        {
          "name": "get_explainer_video",
          "title": "Get a GitHub repository's explainer video",
          "description": "Get GitDiagram's narrated explainer video of a public GitHub repository, if one has been made: the link to watch and share it, its title and length, and the full narration transcript, a plain-language walkthrough of what the project is for, what people do with it and how its main parts fit together. Use it when the user wants a video about a repository, something to watch or share instead of read, or a short spoken-style summary of a project. Read-only: it never makes a video; when none exists it says so and links the page where one can be made.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "repository": {
                "description": "The GitHub repository as \"owner/repo\" (e.g. \"fastapi/fastapi\") or any github.com URL inside it (e.g. \"https://github.com/vercel/next.js/tree/canary/packages\").",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["repository"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get explainer video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ca03c59d1fdc43e30cb0de44440ffe8d2af08a1e046120c63c047fa7b36951b"
        },
        {
          "name": "get_repository_diagram",
          "title": "Get a GitHub repository's architecture diagram",
          "description": "Get the architecture of a public GitHub repository from GitDiagram (gitdiagram.com): a written explanation of how the codebase is organized, its main components with the source paths they live in, how those components connect, and a Mermaid flowchart of the whole system, plus a link to the interactive diagram, where every component opens its code on GitHub. Use it whenever the user wants to understand, visualize, map or explain a GitHub repository's or open-source project's architecture, structure, main modules or data flow, wants an overview before reading unfamiliar code, or asks for an architecture or system diagram of a repo. Read-only and fast: it returns the diagram GitDiagram has already made. If none exists yet, it returns a link that makes one when opened in a browser. Public repositories only. In chat apps that show interactive views, the result also appears as a zoomable diagram whose components open their code on GitHub.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "repository": {
                "description": "The GitHub repository as \"owner/repo\" (e.g. \"fastapi/fastapi\") or any github.com URL inside it (e.g. \"https://github.com/vercel/next.js/tree/canary/packages\").",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["repository"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get architecture diagram"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://gitdiagram/diagram-view-v1.html",
            "openai/toolInvocation/invoked": "Architecture diagram ready",
            "openai/toolInvocation/invoking": "Reading the architecture diagram…",
            "ui": {
              "resourceUri": "ui://gitdiagram/diagram-view-v1.html"
            },
            "ui/resourceUri": "ui://gitdiagram/diagram-view-v1.html"
          },
          "digest": "sha256:6219104a3e17ab8ef1a228d36d74c750a7e7f2ae236f2b85e2294616a7b05d8e"
        }
      ],
      "resources": [
        {
          "uri": "ui://gitdiagram/diagram-view-v1.html",
          "name": "GitDiagram diagram view",
          "description": "Interactive view of a repository's architecture diagram, shown by get_repository_diagram.",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:219784e9c96e751e81ad9023a3c7ff6402d8a8096c186aa673a6d9b0ed2c768a"
        }
      ],
      "digest": "sha256:a479deda8b341f6af825d97f7752c9accfcf3d342cb4535696d37909186c356a"
    }
  }
}
