{
  "lockfileVersion": 2,
  "subjects": {
    "com.basepic/basepic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://basepic.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "basepic",
        "title": "BasePic",
        "version": "1.0.0",
        "websiteUrl": "https://basepic.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BasePic hosts images and edits them. Use upload_image first (url or image_base64), then edit_image with the returned id. For a file on the user's disk a path or file:// link does not work as url: if you can run commands, upload it with curl -F \"image=@photo.jpg\" https://basepic.com/api/v1/images (the path goes after @) — the JSON answer has the same id, links and delete_key, and the id works with edit_image. Every result has page_url (best for sharing), image_url (direct image) and download_url. Edits create a new image; the original stays. Keep delete_key if the user may want to delete the image.",
      "tools": [
        {
          "name": "delete_image",
          "title": "Delete image",
          "description": "Delete an image from BasePic. Needs the delete_key returned when it was uploaded or created by edit_image. Its links stop working.",
          "inputSchema": {
            "properties": {
              "delete_key": {
                "description": "The delete_key returned for this image by upload_image, edit_image or POST /api/v1/images",
                "type": "string"
              },
              "id": {
                "description": "Image id returned by upload_image or edit_image (e.g. \"vqSvesFU\")",
                "type": "string"
              }
            },
            "required": ["delete_key", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete image"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b02c075df77ab7e283df6c4273885a41fedb0f9f07d5355fbb83c4818cdf8c08"
        },
        {
          "name": "edit_image",
          "title": "Edit image",
          "description": "Edit an uploaded image: rotate, flip, crop (pixels or aspect ratio), resize (width/height, percent, megapixels), grayscale (black & white), sepia, brightness, contrast, warm, cool, invert, blur, sharpen — applied in order. Optionally change the format (jpeg/png/webp) or make the file at most max_kb kilobytes (1 KB = 1,000 bytes). Creates a NEW image with its own page_url, image_url and download_url; the original stays unchanged.",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Optional file name for the new image, e.g. \"beach-small.jpg\". Its extension is set to match the output format. If omitted: the original name + \"-edited\".",
                "type": "string"
              },
              "format": {
                "description": "Output format: jpeg, png or webp. If omitted, the new image keeps the original format (a GIF becomes png). jpeg has no transparency: transparent areas turn white.",
                "enum": ["jpeg", "png", "webp"],
                "type": "string"
              },
              "id": {
                "description": "Image id returned by upload_image or edit_image (e.g. \"vqSvesFU\")",
                "type": "string"
              },
              "max_kb": {
                "description": "Largest file size in KB, 1 KB = 1,000 bytes (jpeg/webp)",
                "minimum": 5,
                "type": "integer"
              },
              "operations": {
                "description": "Example: [{\"op\":\"rotate\",\"degrees\":90},{\"op\":\"resize\",\"width\":1080},{\"op\":\"grayscale\"}]",
                "items": {
                  "properties": {
                    "aspect": {
                      "description": "crop: centered crop to a ratio like \"1:1\", \"4:5\", \"16:9\"",
                      "type": "string"
                    },
                    "degrees": {
                      "description": "rotate: 90, 180, 270 (clockwise) or -90",
                      "type": "integer"
                    },
                    "direction": {
                      "description": "flip",
                      "enum": ["horizontal", "vertical"],
                      "type": "string"
                    },
                    "height": {
                      "description": "crop height, or resize target height (keeps proportions)",
                      "type": "integer"
                    },
                    "megapixels": {
                      "description": "resize: target megapixels",
                      "type": "number"
                    },
                    "op": {
                      "enum": ["rotate", "flip", "crop", "resize", "grayscale", "sepia", "brightness", "contrast", "warm", "cool", "invert", "blur", "sharpen"],
                      "type": "string"
                    },
                    "percent": {
                      "description": "resize: 1–400",
                      "type": "number"
                    },
                    "radius": {
                      "description": "blur: 1–10",
                      "type": "integer"
                    },
                    "value": {
                      "description": "brightness / contrast: -100 to 100",
                      "type": "number"
                    },
                    "width": {
                      "description": "crop width, or resize target width (keeps proportions)",
                      "type": "integer"
                    },
                    "x": {
                      "type": "integer"
                    },
                    "y": {
                      "type": "integer"
                    }
                  },
                  "required": ["op"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "quality": {
                "description": "JPEG/WebP quality, 1–100 (default 90). png ignores it (lossless). With max_kb, the highest quality tried.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "return_preview": {
                "description": "Also return a small preview of the image so you can look at it (default false)",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3d1be0a23cf8482a95841241799178aaa0c286bbbe799f9f607e601674d5bf22"
        },
        {
          "name": "get_image",
          "title": "Get image",
          "description": "Get the links and details (size, dimensions, type) of an image on BasePic by its id.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Image id returned by upload_image or edit_image (e.g. \"vqSvesFU\")",
                "type": "string"
              },
              "return_preview": {
                "description": "Also return a small preview of the image so you can look at it (default false)",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01b28a76d35c52191ceceb8ad20dec206e0ac605a5c7912e20c6764365d39e6a"
        },
        {
          "name": "upload_image",
          "title": "Upload image",
          "description": "Upload an image to BasePic and get links: page_url (short link to share), image_url (direct image) and download_url. Give either a public \"url\" (an image, or a post on X/Instagram/Facebook) or \"image_base64\". Returns an id for edit_image and a delete_key. Images up to 50 MB. The image is private: only people with the link can see it. A file on your disk: a path or file:// link does not work as url — if you can run commands, upload it with curl -F \"image=@photo.jpg\" https://basepic.com/api/v1/images instead (same JSON answer; its id works with edit_image).",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Optional file name, e.g. \"beach.jpg\"",
                "type": "string"
              },
              "image_base64": {
                "description": "The image as base64 (a data: URL works too)",
                "type": "string"
              },
              "return_preview": {
                "description": "Also return a small preview of the image so you can look at it (default false)",
                "type": "boolean"
              },
              "url": {
                "description": "Public https link to the image",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Upload image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1546b66138a232938946f95111c3c72ce33319eed93670eaa3778c5ae5520d9"
        }
      ],
      "digest": "sha256:20cbe94f6d710b8ed2ed93e2cdeafdadd215b2013bbeaf8de883dcbf3ce2c3f3"
    }
  }
}
