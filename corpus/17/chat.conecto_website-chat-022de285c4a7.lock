                    "maxLength": 40,
                    "type": "string"
                  },
                  "url": {
                    "maxLength": 600,
                    "type": "string"
                  }
                },
                "required": ["url"],
                "type": "object"
              },
              "point": {
                "items": {
                  "properties": {
                    "id": {
                      "maxLength": 8,
                      "minLength": 1,
                      "type": "string"
                    },
                    "say": {
                      "maxLength": 90,
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "text": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["conversation_id", "text"],
            "type": "object"
