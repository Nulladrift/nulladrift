        {
          "name": "chat_reply",
          "title": "Reply in a chat",
          "description": "Answer the visitor as the business. A closed conversation reopens. A visitor who left gets the reply by email if they gave one. internal: true adds a private note instead of a reply. blocks adds rich content (cards with a picture, title, price and link; images; buttons). In Beside, point highlights things on the visitor's screen one after another (ids from page.elements in the chat.message_received event), and open_page takes them to another page of the site; one of the two per reply. The visitor sees the reply labelled as an AI agent's unless by_person says a person wrote it. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "blocks": {
                "description": "Like [{\"type\": \"cards\", \"items\": [{\"title\": \"Tabor gravel bike\", \"price\": \"$1,890\", \"image\": \"https://...\", \"url\": \"https://...\"}]}].",
                "items": {
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "by_person": {
                "default": false,
                "description": "true when a person at the business wrote this reply. Otherwise the visitor sees it labelled as an AI agent's (EU AI Act Art. 50). A person's reply also stops a webhook brain from answering this chat.",
                "type": "boolean"
              },
              "conversation_id": {
                "minimum": 1,
                "type": "integer"
              },
              "internal": {
                "default": false,
                "type": "boolean"
              },
              "open_page": {
                "properties": {
