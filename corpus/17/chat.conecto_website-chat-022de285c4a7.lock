        {
          "name": "chat_setup",
          "title": "Set up the website chat",
          "description": "Create or change the business's website chat widget, which you answer: each visitor message reaches you as a chat.message_received event (subscribe a webhook to it, or use chat_wait) and you reply with chat_reply. Or answer_with webhook: your own brain (your server, n8n, Flowise) gets each message as a signed POST and its reply goes to the visitor at once. Or answer_with model: a model on the business's own key answers, with instructions and knowledge you give. Conecto pays for no model in it. Only the fields you pass change. A model without its key (none kept, or a new provider), or the keys named in ask_owner_for, come from the owner: the answer is a link where they type them on a Conecto page, so they never pass through the chat (from_a_terminal does the same from a terminal), and nothing changes until they do (account.credential_added says when). The reply has the HTML snippet to put on the website. $0.05 per conversation, charged on the visitor's first message; messages and replies are free. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "The name your replies are signed with, e.g. \"Acme Support\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "answer_with": {
                "description": "bot (the default): you answer through events and chat_reply. webhook: each visitor message is POSTed to webhook_url and its reply goes to the visitor at once. model: a model on the business's own key answers (model_provider, model, model_api_key).",
                "enum": ["bot", "webhook", "model"],
                "type": "string"
              },
              "ask_owner_for": {
                "description": "Keys the owner types on a Conecto page: the answer is a link, and nothing changes until they do.",
                "items": {
                  "enum": ["model_api_key", "webhook_token"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array",
                "uniqueItems": true
              },
              "cant_answer": {
                "description": "What the chat says when your webhook or model gave no reply; it then asks for the visitor's email. Needed for languages other than en, de, es, fr, it, nl, pt and sv.",
                "maxLength": 300,
                "type": "string"
              },
              "color": {
                "description": "Accent colour, e.g. #1a73e8.",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "experience": {
                "description": "chat: the classic chat widget. beside: Beside, which also tells you the page the visitor is on (its address, title and text) with each message. Same price.",
                "enum": ["chat", "beside"],
                "type": "string"
              },
              "greeting": {
                "description": "The first line visitors see.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "instructions": {
                "description": "answer_with model: how the model answers (tone, scope, what to offer), in the business's words.",
                "maxLength": 4000,
                "type": "string"
              },
              "knowledge": {
                "description": "answer_with model: facts it answers from (prices, delivery, opening hours). Replaces what was given before; empty removes it. The published help center is used as well.",
                "maxLength": 50000,
                "type": "string"
              },
              "language": {
                "description": "Widget language, e.g. en, de.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "model": {
                "description": "The provider's model name, e.g. gpt-5.4-mini or claude-sonnet-5-5; for azure the deployment name. It must support tool calling.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "model_api_key": {
                "description": "The business's API key for model_provider. Kept encrypted, never shown again; its usage is billed by the provider to the business.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string",
                "writeOnly": true
              },
              "model_base_url": {
                "description": "azure only: the resource's address, like https://acme.openai.azure.com/openai/v1/.",
                "maxLength": 300,
                "type": "string"
              },
              "model_provider": {
                "description": "Whose model answers with answer_with model.",
                "enum": ["openai", "anthropic", "openrouter", "mistral", "groq", "azure"],
                "type": "string"
              },
              "name": {
                "description": "The business name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "rotate_secret": {
                "default": false,
                "description": "Make a new webhook_secret (the old one stops working).",
                "type": "boolean"
              },
              "starter_questions": {
                "description": "Beside: up to 3 questions visitors can tap to start.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "webhook_token": {
                "description": "Sent as Authorization: Bearer, for brains that want a key (Flowise, n8n header auth). Empty removes it.",
                "maxLength": 500,
                "type": "string",
                "writeOnly": true
              },
              "webhook_url": {
                "description": "Your brain's https endpoint for each visitor message.",
                "maxLength": 500,
                "type": "string"
              },
              "website": {
                "description": "The website it goes on.",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
