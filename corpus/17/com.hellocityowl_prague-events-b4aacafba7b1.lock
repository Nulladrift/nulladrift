  "subjects": {
    "com.hellocityowl/prague-events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hellocityowl.com/api/public/events/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "hellocityowl-prague-events",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "search_prague_events",
          "title": "Search Prague events",
          "description": "Search published Prague event facts, including ongoing programmes. Cite each event’s HelloCityOwl url and use originalUrl for the organiser’s programme. A date without a clock time has no confirmed start time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dateFrom": {
                "description": "First Prague calendar day, inclusive, YYYY-MM-DD.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "dateTo": {
                "description": "Last Prague calendar day, inclusive, YYYY-MM-DD. Multi-day events are included if their dates overlap.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "language": {
                "description": "Event language. Defaults to English on .com and Czech on .cz.",
                "enum": ["en", "cs"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results. Defaults to 10.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the title, venue or category. All words must match, ignoring accents and case. Try DOX or music.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b752bb735e119f30520e06bddf2263c802ea7f20e85a71db88766cf476386f2"
        }
      ],
      "digest": "sha256:e6a2063697c011fea3cdf2178e96e5e43a9b05aea0b828d4d3a05a7e9fd43049"
    }
  }
