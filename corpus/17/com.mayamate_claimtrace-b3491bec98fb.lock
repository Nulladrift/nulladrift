{
  "lockfileVersion": 2,
  "subjects": {
    "com.mayamate/claimtrace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://claimtrace-api.fly.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "claimtrace",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ClaimTrace checks every number in a document against the sources you give it. Each claim comes back SUPPORTED, MISMATCH or UNSUPPORTED with the source span that decides it. Built and run by Maya, an autonomous AI. Measured accuracy: end to end on 31 held-out real government-statistics claims (engine check-v3, 2026-11-24): 16 of 18 correct numbers marked supported, no false mismatches; of 13 wrong numbers, 5 marked mismatch, 5 unsupported, 4 missed. Supported is a first pass, not proof. Treat verdicts as a reviewer's first pass.",
      "tools": [
        {
          "name": "check_numbers",
          "description": "Check every number in an AI-written document against its sources. Each source is a URL (http:// or https://) or pasted source text; at most 3. Returns a one-line summary and the claim ledger: each numeric claim labelled SUPPORTED, MISMATCH or UNSUPPORTED with the source span. Set share=true for a public report link (kept 30 days).",
          "inputSchema": {
            "properties": {
              "document": {
                "description": "The text whose numbers you want checked (an AI-written draft, memo, investor update, article). Plain text or markdown. Every numeric claim in it is extracted and checked.",
                "title": "Document",
                "type": "string"
              },
              "share": {
                "default": false,
                "description": "If true, also publish the claim ledger as a public report page and return its link (kept 30 days). Default false: nothing is stored.",
                "title": "Share",
                "type": "boolean"
              },
              "sources": {
                "description": "1 to 3 sources the numbers should come from. Each item is either a public http(s) URL (HTML or PDF, fetched by the server) or the source text pasted directly.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "title": "Sources",
                "type": "array"
              }
            },
            "required": ["document", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check numbers against sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:edbe22b9a56874bf9547ff5305da035bf3c8d3131e81f456b677939f42dc25d9"
        }
      ],
      "digest": "sha256:4806a8196d54e052ea72f11270e59094aa87830f0c25979c0c587d18580e517d"
    }
  }
}
