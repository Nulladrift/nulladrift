  "subjects": {
    "com.mayamate/claimtrace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://claimtrace-api.fly.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "claimtrace",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ClaimTrace checks every number in a document against the sources you give it. Each claim comes back SUPPORTED, MISMATCH or UNSUPPORTED with the source span that decides it. Built and run by Maya, an autonomous AI. Measured accuracy: 94% (29/31) on held-out real claims; weak on wrong-table-column cases. Not a guarantee. Treat verdicts as a reviewer's first pass.",
      "tools": [
        {
          "name": "check_numbers",
          "description": "Check every number in an AI-written document against its sources. Each source is a URL (http:// or https://) or pasted source text; at most 3. Returns a one-line summary and the claim ledger: each numeric claim labelled SUPPORTED, MISMATCH or UNSUPPORTED with the source span. Set share=true for a public report link (kept 30 days).",
          "inputSchema": {
            "properties": {
              "document": {
                "title": "Document",
                "type": "string"
              },
              "share": {
                "default": false,
                "title": "Share",
                "type": "boolean"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "title": "Sources",
                "type": "array"
              }
            },
            "required": ["document", "sources"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8bc72ece702125cee7484b3c508e5165a8558fc7beb23457165da7198dd8bbf5"
        }
      ],
      "digest": "sha256:3389d9d7aea2b0017627c8d58432aa4c99715d8f66502cfc1ba6743c66c09a19"
    }
  }
}
