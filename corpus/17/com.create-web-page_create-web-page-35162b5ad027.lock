                "enum": ["classic_dark", "sunset_gradient", "editorial_serif", "minimalist_light", "local_business", "bold_pop", "zen_neutral", "midnight_blue", "card_warm_terracotta", "card_navy_serif", "card_editorial_dark", "card_bold_realestate", "auto"],
