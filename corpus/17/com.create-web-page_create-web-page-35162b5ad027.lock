        {
          "name": "page_create_from_brief",
          "title": "Create Hosted Web Page",
          "description": "Creates a real website hosted on its own public link (create-web-page.com/sites/<name>) that customers or friends can open on any phone: a small-business page with WhatsApp, call, map or booking buttons, an Instagram link-in-bio, a digital business card, or a personal page such as a birthday, invitation or tribute. It returns a private preview first; page_publish makes it public. Call it directly when the request already has the business/page name and the main visitor action with its real destination (WhatsApp number with country code, booking/order link, phone, address or email); if the request is vague, ask at most one round of questions first (page_intake_start lists them). Creates a private draft and returns previewUrl, pageId, editToken (anonymous pages), claimUrl and expiresAt. Planning fields (audience, offer, primaryGoal, location, businessType, style, mustInclude) are context only and are not rendered as public body copy. Draft previews are customer-facing: do not pass owner instructions, section-planning labels, or placeholder copy as public content. Keep sparse briefs sparse: use only facts supplied by the user or imported public sources, plus light wording polish; never invent menus, services, hours, facilities, locations, testimonials, guarantees, staff details, prices, or operational claims. If a requested action lacks its real destination, ask for it, or use fallbackLeadForm with destinationEmail (ask the user which email should receive enquiries — without it the form cannot deliver anything and cannot be the page's only action at publish). Personal, gift or event pages (birthday, invitation, tribute, a poem) need no contact form and no action at all: a page with real text (bio + publicSections) can be published as is; add a link (primaryActionUrl, e.g. RSVP, gift list or playlist) only if the user has one, never primaryActionId 'lead'. After calling it, show the preview URL and stop; call page_publish only when the user explicitly asks to publish, make it live, or get a public link. Anonymous pages are deleted after expiresAt unless the user claims them via claimUrl. Passing onboardingMainCategory picks the matching template. The draft also seeds the preset's starter blocks (empty placeholder links, social row, save-contact) — they never block publishing and are pruned if left empty. Use the returned previewUrl directly (no need for page_preview). nextSteps marked recommended/optional (bio, photo, social links) are improvements to offer after the user has seen the preview; only 'required' ones block publishing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Planning context only. Not rendered directly as public page copy.",
                "type": "string"
              },
              "bio": {
                "description": "Optional short bio for the header.",
                "maxLength": 280,
                "type": "string"
              },
              "businessName": {
                "type": "string"
              },
              "businessType": {
                "description": "Planning context only. Not rendered directly as public page copy.",
                "type": "string"
              },
              "fallbackLeadForm": {
                "additionalProperties": false,
                "description": "Public fallback contact/interest form to use when the requested primary action lacks a real destination. All copy must be final-audience copy in the page's target language.",
                "properties": {
                  "consentText": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "description": {
                    "maxLength": 280,
                    "type": "string"
                  },
                  "destinationEmail": {
                    "description": "Private email that receives the form's enquiries (never shown on the page). Ask the user which email should receive them; without it the form cannot deliver anything and cannot be the page's only action at publish.",
                    "format": "email",
                    "type": "string"
                  },
                  "fieldLabels": {
                    "additionalProperties": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "description": "Field labels/placeholders, for example name/email/message in the page's target language.",
                    "type": "object"
                  },
                  "fields": {
                    "items": {
                      "enum": ["name", "email", "phone", "message", "company"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array"
                  },
                  "mode": {
                    "enum": ["contact", "booking_interest"],
                    "type": "string"
                  },
                  "submitLabel": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "successMessage": {
                    "maxLength": 280,
                    "type": "string"
                  },
                  "title": {
                    "maxLength": 160,
                    "type": "string"
                  }
                },
                "required": ["submitLabel", "title"],
                "type": "object"
              },
              "heroImageUrl": {
                "description": "Explicit user-provided image URL for featured-photo or full-image styles.",
                "type": "string"
              },
              "initialPrompt": {
                "maxLength": 12000,
                "type": "string"
              },
              "layout": {
                "description": "Defaults to 'link_in_bio'.",
                "enum": ["link_in_bio"],
                "type": "string"
              },
              "locale": {
                "description": "BCP-47 tag of the language the page is written in (es-MX, pt-BR, ar-SA, fr, en). Stored on the page: it sets the HTML lang, right-to-left layout for Arabic/Hebrew/Persian/Urdu, and the language of the page's built-in labels (save contact, preview notice).",
                "type": "string"
              },
              "location": {
                "description": "Public business address or service area intended for map/address actions, not direct body copy and not the user's private/current location.",
                "type": "string"
              },
              "mustInclude": {
                "description": "Planning checklist only. Do not put section names, CTA labels, owner instructions, or private notes here; not rendered directly.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "offer": {
                "description": "Planning context only. Not rendered directly as public page copy; use bio and publicSections for final-audience copy.",
                "type": "string"
              },
              "onboardingLayout": {
                "description": "Layout style: background_color (minimalist), full (featured photo), or background_image (full image background).",
                "enum": ["background_color", "full", "background_image"],
                "type": "string"
              },
              "onboardingMainCategory": {
                "description": "Validated category id from page_onboarding_*, for example physical-business or online-business.",
                "type": "string"
              },
              "onboardingPalette": {
                "description": "Palette id returned by page_onboarding_* paletteChoices, for example atom_dark_plum.",
                "type": "string"
              },
              "onboardingSubCategory": {
                "description": "Validated subcategory id from page_onboarding_*, for example health.",
                "type": "string"
              },
              "preferredSlug": {
                "description": "Desired URL path. Ask the user for it near the end of onboarding. Use normal letters, numbers, and hyphens; the server normalizes and makes it unique.",
                "type": "string"
              },
              "preset": {
                "description": "Style preset id, or 'auto' to infer deterministically (falls back to classic_dark). Defaults to 'auto'. Looks: classic_dark: A timeless dark page with white pill buttons; sunset_gradient: Warm gradient page for musicians, DJs, and artists; editorial_serif: Cream page with serif headings; minimalist_light: Clean white page with soft-radius outline buttons; local_business: Dark mobile page with clear contact actions; bold_pop: Hot pink page with high-contrast white buttons and hard shadows; zen_neutral: Sage-toned page with serif typography; midnight_blue: Deep navy page with cool accent; card_warm_terracotta: Cream business card with a full-width photo, terracotta accent, and QR save-contact footer; card_navy_serif: Deep navy business card with brass accent and serif name; card_editorial_dark: Near-black card with an italic serif name and a 2×2 photo grid; card_bold_realestate: Cream card with brick accent, bold name, and a WhatsApp-first contact stack",
                "enum": ["classic_dark", "sunset_gradient", "editorial_serif", "minimalist_light", "local_business", "bold_pop", "zen_neutral", "midnight_blue", "card_warm_terracotta", "card_navy_serif", "card_editorial_dark", "card_bold_realestate", "auto"],
                "type": "string"
              },
              "primaryActionId": {
                "enum": ["appointment", "whatsapp", "phone", "maps", "buy", "lead", "subscribe", "follow"],
                "type": "string"
              },
              "primaryActionLabel": {
                "description": "Public label for the primary action in the page's target language.",
                "maxLength": 120,
                "type": "string"
              },
              "primaryActionUrl": {
                "description": "Real destination URL for the primary action when explicitly supplied by the user or imported public source, such as a booking link. Do not invent booking/order URLs; if missing, ask for it or use fallbackLeadForm.",
                "type": "string"
              },
              "primaryGoal": {
                "description": "Planning context only. Not rendered directly as public page copy.",
                "type": "string"
              },
              "publicBusinessEmail": {
                "description": "Public business contact email explicitly supplied by the user or a public source. Do not use the email of the user's AI-assistant account.",
                "type": "string"
              },
              "publicPhone": {
                "description": "Public business phone number explicitly supplied by the user or a public source. Do not use the user's private/account phone.",
                "type": "string"
              },
              "publicSections": {
                "description": "Final-audience text sections to render on the public page. Write in the target language with correct spelling/accents. Only include facts the user supplied or that came from an imported public source; for sparse prompts, keep this short and avoid invented service lists, hours, benefits, testimonials, prices, or operational details.",
                "items": {
                  "additionalProperties": false,
                  "description": "Final-audience page copy. Use the page's target language and correct spelling/accents. Do not put planning notes, owner instructions, or section labels here.",
                  "properties": {
                    "alignment": {
                      "enum": ["left", "center"],
                      "type": "string"
                    },
                    "body": {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "heading": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "items": {
                      "items": {
                        "maxLength": 280,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
