                    "additionalProperties": false,
                    "description": "Partial props patch for this block type. Include only fields you want to change.",
                    "properties": {
                      "items": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "label": {
                              "maxLength": 64,
                              "type": "string"
                            },
                            "platform": {
                              "enum": ["instagram", "tiktok", "youtube", "x", "facebook", "linkedin", "spotify", "apple_music", "soundcloud", "github", "pinterest", "threads", "twitch", "discord", "telegram", "snapchat", "vimeo", "behance", "dribbble", "medium", "substack", "website", "other", "email", "phone", "whatsapp"],
