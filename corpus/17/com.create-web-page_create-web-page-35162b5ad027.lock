          "description": "Patch one content block by stable blockId. Provide a props patch (merged into existing props) and/or a new type. Block types and props are validated against the strict per-type schema. On an already-published page this saves a new draft revision only: the live page does not change until page_publish runs, which should happen only when the user explicitly asks to update the live page. The edit never takes the live page down.",
          "inputSchema": {
            "description": "Patch one block. Choose the oneOf variant whose type matches the existing block, unless intentionally changing the block type.",
            "oneOf": [
