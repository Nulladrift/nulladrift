      },
      "transport": {
        "type": "http",
        "url": "https://hamitaperim.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hamitaperim",
        "title": "המיטאפרים · Israel tech meetups",
        "version": "1.2.0",
        "websiteUrl": "https://hamitaperim.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Upcoming tech meetups across Israel, from the hamitaperim.com community board (Hebrew, updated daily). Dates are YYYY-MM-DD and times HH:MM, both Asia/Jerusalem. In-person meetups by default; pass mode=online for Israeli online sessions or mode=any for both. Each meetup has mode (in-person or online) and area (dan, sharon, jlm, north, south or online). Start with list_upcoming_meetups (when=week for this week). Use search_meetups for a topic, keyword or date range, and list_topics to see the topic tags. Use url to register for scheduled meetups. Cancelled meetups have no registration or calendar link. Cite as המיטאפרים (hamitaperim.com).",
      "tools": [
        {
          "name": "get_meetup",
          "title": "Get meetup",
          "description": "Full details of one meetup by id (ids come from the list and search tools).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85dc10e38a98b2f3283e64322481798ff668b06b0ecf1c87684102b09b28ceeb"
        },
        {
          "name": "list_sources",
          "title": "List sources",
          "description": "The public calendars, Meetup groups, Luma pages, conferences, venues and company event pages the list is updated from daily. Filter by kind or free text (name or topic).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Exact kind label as returned in results, e.g. Meetup, Luma, Eventbrite, \"לוח אירועים\", \"כנס\", \"מרכז אירועים\", \"אירועי חברה\".",
                "maxLength": 40,
                "type": "string"
              },
              "q": {
                "description": "Free text over name and topics, e.g. \"python\" or \"security\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c40d4297e84e80057f605c67b291a38cacd0c679fc6c5eccc5612cd965f6f4e7"
        },
        {
          "name": "list_topics",
          "title": "List topics",
          "description": "Topic tags with how many upcoming in-person meetups each has, plus the number of online sessions. Pass a tag id to search_meetups.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ae54e812d37d3c743f0021fefa2bb67587ade541f8e95bdf911e81c137fce25"
        },
        {
          "name": "list_upcoming_meetups",
          "title": "List upcoming meetups",
          "description": "Upcoming tech meetups in Israel, soonest first. In-person by default; mode=online for online sessions. Use when=week for \"what's on this week\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exclude_paid": {
                "default": false,
                "description": "Leave out meetups known to cost money. Most meetups are free.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum meetups to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "in-person",
                "description": "in-person (default, the site's main list), online (Israeli online sessions, the site's «אונליין» tab) or any.",
                "enum": ["in-person", "online", "any"],
                "type": "string"
              },
              "when": {
                "default": "all",
                "description": "Time window in Asia/Jerusalem: today, tomorrow, week (today + 6 days) or all upcoming.",
                "enum": ["all", "today", "tomorrow", "week"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa3ab658df3ba5e84043ebfb2d397b268fcca82df08b988adeaa5663923e229c"
        },
        {
          "name": "search_meetups",
          "title": "Search meetups",
          "description": "Search upcoming meetups. Combine any of: free text (title, topic, organizer, venue; Hebrew or English, every word must match), a topic tag, a date range, a time window, mode (in-person by default) and exclude_paid. Tags: ai (AI וסוכנים), startups (יזמות וסטארטאפים), makers (דיפטק וחומרה), data (דאטה וענן), software (פיתוח תוכנה), community (קהילה וקריירה), security (סייבר ואבטחה), product (מוצר ועיצוב), web3 (ווב3).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "First date, inclusive, YYYY-MM-DD (Asia/Jerusalem).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Last date, inclusive, YYYY-MM-DD (Asia/Jerusalem).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exclude_paid": {
                "default": false,
                "description": "Leave out meetups known to cost money. Most meetups are free.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum meetups to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "in-person",
                "description": "in-person (default, the site's main list), online (Israeli online sessions, the site's «אונליין» tab) or any.",
                "enum": ["in-person", "online", "any"],
                "type": "string"
              },
              "q": {
                "description": "Free-text query, e.g. \"kubernetes\" or \"AI agents\".",
                "maxLength": 200,
                "type": "string"
              },
              "tag": {
                "description": "Topic tag (see list_topics).",
                "enum": ["ai", "startups", "makers", "data", "software", "community", "security", "product", "web3"],
                "type": "string"
              },
              "when": {
                "default": "all",
                "description": "Time window in Asia/Jerusalem: today, tomorrow, week (today + 6 days) or all upcoming.",
                "enum": ["all", "today", "tomorrow", "week"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
