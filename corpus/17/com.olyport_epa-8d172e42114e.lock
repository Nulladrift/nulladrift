      "tools": [
        {
          "name": "get_annual_air_quality",
          "description": "Get annual air quality summary data for a US state.\n\n    Returns annual statistics from the EPA Air Quality System (AQS),\n    including mean concentrations, max values, and exceedance counts\n    for the specified pollutant across all monitoring sites in the state.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY').\n        parameter: Pollutant to query. Options: 'PM2.5', 'Ozone', 'SO2', 'NO2', 'CO'.\n                   Default is 'PM2.5'.\n        start_year: Start year for the query range (e.g. 2020). Default is 2020.\n        end_year: End year for the query range (e.g. 2023). Default is 2023.\n    ",
          "inputSchema": {
            "properties": {
              "end_year": {
                "default": 2023,
                "title": "End Year",
                "type": "integer"
              },
              "parameter": {
                "default": "PM2.5",
                "title": "Parameter",
                "type": "string"
              },
              "start_year": {
                "default": 2020,
                "title": "Start Year",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_annual_air_qualityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_annual_air_qualityOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa3278ea2502d5a370e08d897043301e0036c03a31ba60e22dbfe8b7cdeb0267"
        },
        {
          "name": "get_aqi_forecast",
          "description": "Get the air quality forecast for a ZIP code.\n\n    Returns forecast AQI values and health categories for upcoming days,\n    typically covering today and the next 1-2 days.\n\n    Args:\n        zip_code: US ZIP code (e.g. '20001').\n    ",
          "inputSchema": {
            "properties": {
              "zip_code": {
                "title": "Zip Code",
                "type": "string"
              }
            },
            "required": ["zip_code"],
            "title": "get_aqi_forecastArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_aqi_forecastOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fd1d16f3f947ae944886b5747f7ccdd221e4df0055d639807d8de855a9a88ec"
        },
        {
          "name": "get_current_aqi",
          "description": "Get the current Air Quality Index (AQI) for a location.\n\n    Provide either a zip_code OR latitude/longitude coordinates.\n    Returns AQI values, pollutant levels, and health category for\n    each measured pollutant at the nearest monitoring station.\n\n    Args:\n        zip_code: US ZIP code (e.g. '20001').\n        latitude: Latitude of the location (e.g. 38.9).\n        longitude: Longitude of the location (e.g. -77.0).\n    ",
          "inputSchema": {
            "properties": {
              "latitude": {
                "default": null,
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "default": null,
                "title": "Longitude",
                "type": "number"
              },
              "zip_code": {
                "default": null,
                "title": "Zip Code",
                "type": "string"
              }
            },
            "title": "get_current_aqiArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_current_aqiOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:292316421c790ff9a5393d61ed2e0573019e89846fb7151777465194d94b3927"
        },
        {
          "name": "get_superfund_sites",
          "description": "Get active Superfund (National Priorities List) sites in a state.\n\n    Returns hazardous waste cleanup sites listed on the EPA's National\n    Priorities List, including site names, locations, and status information.\n    No API key required.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'NJ', 'CA').\n        limit: Maximum number of sites to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_superfund_sitesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_superfund_sitesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af72f16aa2bc71300e189519ae6da76bbded7c561e2ad620dcdd4ffcad111242"
        },
        {
          "name": "get_tri_facilities",
          "description": "Get Toxics Release Inventory (TRI) facilities in a state.\n\n    Returns facilities that report toxic chemical releases to the EPA,\n    including facility names, addresses, and industry information.\n    No API key required.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        city: Optional city name to filter results.\n        limit: Maximum number of facilities to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "default": null,
                "title": "City",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_tri_facilitiesArguments",
            "type": "object"
          },
          "outputSchema": {
