{
  "lockfileVersion": 2,
  "subjects": {
    "com.isoligne/index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://isoligne.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "isoligne-index",
        "title": "Isoligne Index: what an AI can read on websites",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "The Isoligne Index publishes what an AI assistant can read on websites. Isoligne decides which measurements are published, one company at a time, after notifying the company. Client status plays no part: being an Isoligne client neither gets a site published nor improves its rank. Any company can have its page removed on request, with no reason required. Sector rankings are ordered by score alone and cover published sites only, not the whole market. A missing domain is not a bad site: it has not been measured, or has not been published. Tool answers are written in French.",
      "tools": [
        {
          "name": "agent_readiness",
          "title": "A site's score",
          "description": "Returns the published Agent Readiness Score of a domain: what an AI assistant can read and understand from its pages without running JavaScript. Also returns the per-axis breakdown, the date, the scoring scale, and what the measurement does not say. Only published measurements are returned; see the server instructions for who decides.",
          "inputSchema": {
            "properties": {
              "domaine": {
                "description": "a host name, e.g. renault.fr",
                "type": "string"
              }
            },
            "required": ["domaine"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A site's score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae14380cba5d182c57703cb2cf0c558130b0c46e8f33ab8da2c677f21eba045b"
        },
        {
          "name": "ce_qui_manque",
          "title": "What lowers the score",
          "description": "Returns the weakest axes of a published domain, with the measured finding behind each, and the buying questions no page can ever answer because the answer depends on the customer.",
          "inputSchema": {
            "properties": {
              "domaine": {
                "description": "a host name, e.g. renault.fr",
                "type": "string"
              }
            },
            "required": ["domaine"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What lowers the score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04333033de8f5b8c9de71a5ddf2e5d85b52e3ec2177c196307c7e9affce5a218"
        },
        {
          "name": "devis",
          "title": "A price for a specific case, computed from the company's own price list",
          "description": "Computes an exact price for a specific case (quantities, options, period) from the price list a company has itself deposited with Isoligne, and returns the calculation line by line with its source and date. Only companies that have deposited a price list are covered, which in practice means Isoligne clients; this is unrelated to the published Index and rankings. Example: entreprise = example.com, question = \"how much for 800 units in 6 variants per month?\". A missing quantity is never guessed: the answer says which one to provide.",
          "inputSchema": {
            "properties": {
              "entreprise": {
                "description": "the company's domain (e.g. example.com) or name",
                "type": "string"
              },
              "question": {
                "description": "the price question, with quantities, in any language",
                "type": "string"
              }
            },
            "required": ["entreprise", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A price for a specific case, computed from the company's own price list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a942acc3a98e74b41aa8de5deff23a09a0fdf44b0f3d03fed4b38d4550404849"
        },
        {
          "name": "secteur",
          "title": "A sector ranking",
          "description": "Returns the published sites of a sector, grouped by level and ordered by score alone. Scores less than 5 points apart are not separated. The ranking covers published sites only, not the whole market. Isoligne decides which sites are published, after notifying each company; client status plays no part in inclusion or order.",
          "inputSchema": {
            "properties": {
              "secteur": {
                "description": "sector key from secteurs_disponibles, e.g. assurance",
                "type": "string"
              }
            },
            "required": ["secteur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A sector ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71c715395a4bbfbda24f6d3a02a3d4e99dca1ae54d9dbd3b6edd35470bdc5964"
        },
        {
          "name": "secteurs_disponibles",
          "title": "Sectors in the Index",
          "description": "Lists the sectors with at least one published company.",
