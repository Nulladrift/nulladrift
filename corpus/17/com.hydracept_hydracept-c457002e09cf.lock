              "requirements": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional object matching CapabilityResolutionRequest.requirements (e.g. modality tags). Default {}. runnableNow requires an authenticated project workspace on the API.",
                "title": "Requirements"
