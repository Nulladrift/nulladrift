        {
          "name": "hydracept_run",
          "title": "Run a capability",
          "description": "Run a capability (paid). Use when the user wants execution — not for quotes (hydracept_quote_capability), status (hydracept_job_status), or receipts (hydracept_get_receipt). Default wait=true waits until the job finishes; use hydracept_submit_job when this call must return immediately. Picks invoke vs durable job from the capability descriptor. Requires bearer key. Settles at actual provider cost plus any managed service fee; no per-call minimum. May create jobs, artifacts, and provider usage. Returns: Terminal hydracept.run-result.v1 or job envelope when wait=false. Errors: WORKSPACE_KEY_REQUIRED, INVALID_ARGUMENT, FundingRequired, EXECUTION_FAILED, job timeout when wait exhausts.",
          "inputSchema": {
            "properties": {
              "body": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Required capability input object (schema fields). Merged with session project context when bound.",
                "title": "Body"
              },
              "capability_key": {
                "description": "Required capability registry key for POST .../jobs.",
                "title": "Capability Key",
                "type": "string"
              },
              "idempotency_key": {
                "default": "",
                "description": "Optional string; server generates run-{uuid} when empty. Reuse for safe retries.",
                "title": "Idempotency Key",
                "type": "string"
              },
              "input": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Alias for body; do not pass both.",
                "title": "Input"
              },
              "max_cost": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional number (USD): sets execution.executionConstraints.maxCostUsd before submit.",
                "title": "Max Cost"
              },
              "timeout": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Seconds to poll when wait=true; omit to poll until terminal with no tool-side limit (the MCP client request timeout may end the call first). On timeout, status may stay running — call hydracept_job_status.",
                "title": "Timeout"
              },
              "wait": {
                "default": true,
                "description": "Boolean, default true. When true, poll until succeeded/failed/canceled or timeout. When false, return job id and poll with hydracept_job_status.",
                "title": "Wait",
                "type": "boolean"
              }
            },
