              "capability_key": {
                "description": "Required capability registry key unless only legacy aliases are passed.",
                "title": "Capability Key",
                "type": "string"
              },
              "input": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
