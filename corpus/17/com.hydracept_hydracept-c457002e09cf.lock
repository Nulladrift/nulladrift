      },
      "instructions": "Hydracept executes external capabilities for agents. Pass the user's words to hydracept_resolve_capability. Do not ask for a capability key and do not pick a key from memory. Then optionally hydracept_quote_capability, then hydracept_run on the resolved key. Call hydracept_job_status only when the result says to poll. If you no longer have the job id, call hydracept_jobs_find. Call hydracept_cancel_job only when the user asks to cancel the job itself; stopping a polling loop is not a cancellation. Call hydracept_download_artifact and hydracept_get_receipt when the job produced them. Specialists such as hydracept_invoke (POST /mcp/full), pinned inference, and provenance tools are not listed here; use POST /mcp/full for the full specialist tools/list. One capability call is enough; do not assume repeated usage is required. Authenticate with a Hydracept API key bearer token. Project apply/sync/watch require stdio MCP in the project checkout; this host does not execute local project commands.",
      "tools": [
        {
          "name": "hydracept_cancel_job",
          "title": "Cancel a job",
          "description": "Request cancellation of one job. Use only when the user explicitly asks to cancel the job itself; stopping a local polling loop is not a cancellation. Returns whether the request was accepted, whether the job is already terminal, and the next action. Never promise that upstream provider work stopped or that already-incurred cost is refunded. Safe to retry: a terminal job reports its terminal state. Requires bearer key. Returns: Cancellation outcome envelope with job status, terminal flag, and next action. Errors: WORKSPACE_KEY_REQUIRED, NOT_FOUND, INVALID_ARGUMENT.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Required job id to cancel. Use hydracept_jobs_find if the id is unknown.",
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "hydracept_cancel_jobArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "hydracept_cancel_jobDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel a job"
          },
          "behavior": {
