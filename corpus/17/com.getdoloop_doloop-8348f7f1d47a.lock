        {
          "name": "create_loop",
          "title": "Create a loop",
          "description": "Create an empty loop (a queue of tasks). Add tasks with enqueue_task.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cron": {
                "description": "Cron schedule, 5 fields; only the date fields (day of month, month, weekday) matter: minute and hour are ignored, so write them as \"0 0\" (e.g. \"0 0 * * 1\" = Mondays). Alternative to dow and every_days (one schedule system at a time). Do not use \"*/N\" in the day field for \"every N days\": it restarts each month; use every_days.",
                "type": ["string", "null"]
              },
              "description": {
                "description": "Longer notes.",
                "type": ["string", "null"]
              },
              "dow": {
                "description": "Days of the week as a bitmask: Monday=1, Tuesday=2, Wednesday=4, Thursday=8, Friday=16, Saturday=32, Sunday=64. 127 = every day, 31 = weekdays. 0 = none (use with cron or every_days).",
                "maximum": 127,
                "minimum": 0,
                "type": "integer"
              },
              "end_date": {
                "description": "Last day it applies, YYYY-MM-DD. null clears it.",
                "format": "date",
                "type": ["string", "null"]
              },
              "every_days": {
                "description": "Strict interval: due every N days, counted from start_date (the anchor; defaults to today in the user's time zone). A missed day does not shift the cycle. Schedule tasks/loops only, and instead of dow and cron (send dow 0 / cron null with it). null removes it.",
                "minimum": 1,
                "type": ["integer", "null"]
              },
              "is_active": {
                "description": "false pauses it without deleting it.",
                "type": "boolean"
              },
              "loop_type": {
                "description": "\"loop\" (default): advances to the next task at each arming pass. \"schedule\": only on its dow, cron or every_days days (exactly one of them).",
                "enum": ["loop", "schedule"],
                "type": "string"
              },
              "name": {
                "description": "Loop name.",
                "type": "string"
              },
              "start_date": {
                "description": "First day it applies, YYYY-MM-DD; with every_days, the first day of the interval. null clears it.",
                "format": "date",
                "type": ["string", "null"]
              }
            },
            "required": ["name"],
            "type": "object"
          },
