      "instructions": "DoLoop organises recurring work as tasks and loops.\n- A task is a unit of work. \"armed\" means it is due now; checking it marks it done (ticker +1), skipping it (abort_task) means \"not this time\": abortions +1, and its loop moves on at the next arming pass. Both only act on an armed task. The app calls this action Skip; the API keeps the name abort.\n- task_type \"schedule\": due on the days given by ONE schedule system: dow (bitmask Monday=1 ... Saturday=32, Sunday=64; 127 = every day), a cron expression, or every_days (strictly every N days from start_date, e.g. every_days=3 for every third day across month ends). Optionally bounded by start_date/end_date. \"loop\": a member of a loop's queue. \"subtask\": armed every \"every\" runs of its parent_task_id.\n- A loop is an ordered queue of tasks; it arms one task at a time (current_task_id) and moves to the next when the user runs the arming pass (arm_all). Arming is the user's decision: run arm_all only when the user asks for it, never on your own initiative.\n- todays_tasks lists what is due now. Use check_task / abort_task to record what the user did.\nAsk the user before calling a tool marked destructive (update, abort_task/skip, dequeue, arm_all, delete): deletions cannot be undone.",
      "tools": [
        {
          "name": "abort_task",
          "title": "Skip a task",
          "description": "Skip an armed task: not this time; the loop moves on. The task is unarmed and its abortions count goes up by 1. On a task that is not armed it changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The task's id (from list_tasks, todays_tasks or a loop's tasks).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Skip a task"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9881f0210175a4ed830612ef5b56a4b3767a396e1add25ece5445895be1c7a07"
        },
        {
          "name": "arm_all",
          "title": "Run the arming pass",
          "description": "Run the arming pass the user asked for, in the user's time zone. 1) A scheduled \"drop\" task still armed from an earlier day is skipped automatically (missed); one armed today is kept; \"reschedule\" tasks stay armed. 2) Arms every active scheduled task due today that is not armed, except one the user already checked or skipped today. 3) Moves each active loop to its next task, except a loop whose current task is still armed and a schedule loop on a day outside its schedule. A second run on the same day skips nothing and does not bring back scheduled tasks checked or skipped today, but it still advances every loop whose current task is no longer armed (checked, skipped, unarmed or deleted since): not idempotent. Only when the user asks: arming is the user's act.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Run the arming pass"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b0407b7d24b6effe6dc6da6364d00ce233ac7dade91a6742a1f1eb5b07edfdc6"
        },
