        {
          "name": "group-trip-cost-splitter",
          "title": "Group Trip Cost Splitter: Yacht Charter, Villa and Private Jet",
          "description": "Divides one total between up to 12 parties: equally per person, equally per party, by person-nights, or by room weighting × nights (e.g. 1.5 for a master suite). Shares are whole cents (largest-remainder method) and add up exactly to the total. With amounts already paid, returns each party’s balance (paid − share) and settle-up transfers; anything unpaid is owed to the suppliers (to: null). Lists are comma-separated, one value per party, in the same order. The page supports several costs with a method each; this API takes one total. No sourced facts: all figures are the caller’s. Web page: https://globalluxagency.com/tools/group-trip-cost-splitter",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "GBP",
                "description": "Currency of the amounts (labels only; nothing is converted).",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "method": {
                "default": "person",
                "description": "How to split: person (equally per person), party (equally per party), night (by person-nights), room (by room weighting × nights).",
                "enum": ["person", "party", "night", "room"],
                "type": "string"
              },
              "nights": {
                "description": "Nights (or days) each party is present, comma-separated (default 7 for every party). Used by the night and room methods.",
                "maxLength": 120,
                "pattern": "^\\d+(\\.\\d+)?(,\\d+(\\.\\d+)?){0,11}$",
                "type": "string"
              },
              "paid": {
                "description": "Amount each party has already paid, comma-separated (default 0).",
                "maxLength": 240,
                "pattern": "^\\d+(\\.\\d+)?(,\\d+(\\.\\d+)?){0,11}$",
                "type": "string"
              },
              "partySizes": {
                "description": "People in each party, comma-separated, e.g. \"2,2,4\" (1–50 each, up to 12 parties).",
                "maxLength": 120,
                "pattern": "^\\d+(\\.\\d+)?(,\\d+(\\.\\d+)?){0,11}$",
                "type": "string"
              },
              "roomWeights": {
                "description": "Cabin or room weighting per party, comma-separated (default 1; e.g. 1.5 for a master suite). Used by the room method.",
                "maxLength": 120,
                "pattern": "^\\d+(\\.\\d+)?(,\\d+(\\.\\d+)?){0,11}$",
                "type": "string"
              },
              "total": {
                "description": "The shared cost to split, e.g. the charter fee.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["partySizes", "total"],
