          "title": "UK TOMS VAT Calculator",
          "description": "Per-package estimate of VAT under the UK Tour Operators’ Margin Scheme (HMRC VAT Notice 709/5). Works out the margin, apportions it between UK and non-UK margin scheme supplies and in-house supplies by cost, and applies the VAT fraction (one-sixth at 20%) to the UK share. The real liability is calculated annually across all packages; this is guidance only, not tax advice. Web page: https://globalluxagency.com/tools/toms-vat-calculator",
