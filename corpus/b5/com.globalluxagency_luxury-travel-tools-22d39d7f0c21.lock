                "minimum": 0,
                "type": "number"
              },
              "optionADrinks": {
                "default": 0,
                "description": "Option A: drinks package or bar spend, per person per night.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "optionAExcursions": {
                "default": 300,
                "description": "Option A: shore excursions, per person, for the cruise.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "optionAFare": {
                "default": 6000,
                "description": "Option A: cruise fare per person.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "optionAFlights": {
                "default": 600,
                "description": "Option A: flights and transfers, per person, for the cruise.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "optionAGratuities": {
                "default": 0,
                "description": "Option A: gratuities and service charges, per person per night (or a percentage of the fare, up to 50, when the gratuity basis is percent).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "optionAGratuityBasis": {
                "default": "pppn",
                "description": "Option A: pppn (per person per night) or percent (of the fare).",
                "enum": ["pppn", "percent"],
                "type": "string"
              },
              "optionAGuests": {
                "default": 2,
                "description": "Option A: number of guests.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "optionAIncluded": {
                "default": "tgdsw",
                "description": "Option A: items included in the fare (zeroed), as letters: t = port taxes and fees, g = gratuities and service charges, d = drinks package or bar spend, s = speciality dining, w = wi-fi, x = shore excursions, f = flights and transfers, i = travel insurance. Empty = none.",
