        {
          "name": "net-rate-sheet-generator",
          "title": "Net Rate Sheet Generator",
          "description": "Works out the net rate from a retail price (net = retail × (1 − commission)) or the retail price from a net rate (retail = net ÷ (1 − commission)), or the same with a markup on net, then rounds the worked-out price and reports the commission the reseller really keeps after rounding. Optionally prices a child at a % of the adult price. Commission rates are negotiated; the defaults are examples. Web page: https://globalluxagency.com/tools/net-rate-sheet-generator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "childRatePercent": {
                "default": 0,
