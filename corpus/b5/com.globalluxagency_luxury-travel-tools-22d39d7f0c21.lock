        {
          "name": "yacht-charter-cost-calculator",
          "title": "Yacht Charter True-Cost Calculator",
          "description": "Estimates the all-in cost of a crewed yacht charter from the headline charter fee. Adds the charter tax for the cruising area (sourced default, overridable), APA (advance provisioning allowance), delivery fees, per-guest local fees, other costs and a crew gratuity, and returns totals per guest and per guest per day. It does not fetch live prices or availability. Web page: https://globalluxagency.com/tools/yacht-charter-cost-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apaPercent": {
                "default": 30,
                "description": "APA as % of the charter fee. Typical range 25–40%; the default of 30% is a modelling choice.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "area": {
                "default": "croatia",
                "description": "Cruising area: croatia (Croatia), greece (Greece), italy (Italy), france (France & Monaco), spain (Spain & Balearics), montenegro (Montenegro), turkey (Türkiye), bahamas (Bahamas), bvi (British Virgin Islands), usvi (US Virgin Islands).",
                "enum": ["croatia", "greece", "italy", "france", "spain", "montenegro", "turkey", "bahamas", "bvi", "usvi"],
                "type": "string"
              },
              "charterFee": {
                "description": "Headline charter fee as quoted, excluding tax, in the quote currency.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "Quote currency (ISO 4217). Defaults to the area's usual quote currency.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "Charter length in days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "deliveryFee": {
                "default": 0,
                "description": "Delivery or redelivery fee, taxed like the charter fee.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "guests": {
                "default": 10,
                "description": "Number of guests.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "otherCosts": {
                "default": 0,
                "description": "Anything else outside the APA (flights, transfers, special requests).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "perPersonPerDayFee": {
                "description": "Local fee per guest per day (e.g. a cruising permit). Defaults to the area's sourced fee when quoting in USD, otherwise 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "percentOutsideEu": {
                "default": 0,
                "description": "For areas taxed pro rata by time in EU waters: % of charter time outside EU waters (must be provable).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "taxRate": {
                "description": "Charter tax rate in percent. Defaults to the cruising area's sourced rate; required where no reliable default exists.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "tipPercent": {
                "default": 10,
                "description": "Crew gratuity as % of the charter fee (MYBA guideline 5–15%).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["charterFee"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
