        {
          "name": "is-the-upgrade-worth-it-calculator",
          "title": "Is the Upgrade Worth It? Flight and Hotel Upgrade Calculator",
          "description": "All prices and values are the caller’s own: the tool holds no fares or upgrade prices, and the defaults are an illustrative example. Cash: upgrade cost = upgradedPrice − basePrice (never below 0). Points: upgradePoints × pencePerPoint ÷ 100 + upgradePointsCash. Flight benefits: sleep hours (capped at flight hours, only if sleepMatters = yes) × sleepValuePerHour + flightHours × comfortPerHour + lounge + baggage + fastTrack; hotel benefits: nights × (roomValuePerNight + includedPerNight). Both add flexibility + other. Worth it when benefits ≥ cost. Prices are per person (flight) or for the stay (hotel). Web page: https://globalluxagency.com/tools/is-the-upgrade-worth-it-calculator",
          "inputSchema": {
