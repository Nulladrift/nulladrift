      "instructions": "Calculators for the luxury travel industry from Luxury Travel Tools by Global Lux Agency. Every tool is read-only and returns an estimate with its inputs, sourced default figures (with source URLs and verification dates), a disclaimer and an openInBrowser link to the same calculation on the website. Results are estimates and general guidance, not quotes or tax, legal or financial advice. Show the disclaimer and link to openInBrowser when presenting results to a person.",
      "tools": [
        {
          "name": "avios-value-calculator",
          "title": "Avios Value Calculator: Pence per Point for Any Redemption",
          "description": "All prices and points are the caller’s own: the tool holds no award charts, fares or room rates, and the defaults are an illustrative example. Value per point = 100 × (cash price − cash paid on the award) ÷ (points used + points the cash booking would earn), in hundredths of the currency. With a target value, net saving = cash saved − points given up × target ÷ 100, and the best option is the highest net saving (or paying cash if none is positive). marginalValue compares each option with the option using fewer points. For Avios with no targetValue given, the target defaults to a published 1p ball-park (opinion, low confidence). Web page: https://globalluxagency.com/tools/avios-value-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cashPrice": {
                "default": 3200,
                "description": "Cash price of the same booking (same flight and cabin, or room and dates).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of all amounts (no conversion). Values per point are in hundredths of it (pence for GBP, cents for EUR/USD).",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "earnOnCash": {
                "default": 0,
                "description": "Points the cash booking would earn (opportunity cost). 0 to ignore.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "option1Cash": {
                "default": 600,
                "description": "Option 1: cash paid with the points (taxes, fees, carrier charges, or the money part of points + money).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "option1Points": {
                "default": 100000,
                "description": "Option 1 (“All points”): points used. 0 leaves the option out.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "option2Cash": {
                "default": 1300,
                "description": "Option 2: cash paid with the points (taxes, fees, carrier charges, or the money part of points + money).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "option2Points": {
                "default": 50000,
                "description": "Option 2 (“Points + money”): points used. 0 leaves the option out.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "option3Cash": {
                "default": 0,
                "description": "Option 3: cash paid with the points (taxes, fees, carrier charges, or the money part of points + money).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "option3Points": {
                "default": 0,
                "description": "Option 3 (“Another mix”): points used. 0 leaves the option out.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "programme": {
                "default": "avios",
                "description": "avios, virgin-points, hotel or other. Labels the result; for avios the default target is a published ball-park value.",
                "enum": ["avios", "virgin-points", "hotel", "other"],
                "type": "string"
              },
              "targetValue": {
                "description": "Your target value per point in hundredths of the currency (e.g. pence). 0 = no target. Omitted: 1 for avios (a published ball-park), none otherwise.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Avios Value Calculator: Pence per Point for Any Redemption"
          },
          "behavior": {
