        {
          "name": "package-travel-regulations-checker",
          "title": "Package Travel Regulations Checker: Is This a Package?",
          "description": "Applies the decision tree in the Package Travel and Linked Travel Arrangements Regulations 2018 (as amended by SI 2026/455 from 6 April 2027). Returns the outcome (package, linked-travel-arrangement, neither or outside-scope), the regulation that decides it, the reasoning steps and the organiser or trader duties that follow. Guidance only, not legal advice; it does not judge borderline facts such as whether a tourist service is an essential feature. Web page: https://globalluxagency.com/tools/package-travel-regulations-checker",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodation": {
                "default": false,
                "description": "Includes accommodation that is not part of the carriage and not residential.",
                "type": "boolean"
              },
              "combination": {
                "default": "separately-booked",
                "description": "How the services were put together. One of: single-contract, single-point-of-sale, inclusive-price, sold-as-package, gift-box, data-passed-24h, separate-payment-single-visit, targeted-link-24h, separately-booked.",
                "enum": ["single-contract", "single-point-of-sale", "inclusive-price", "sold-as-package", "gift-box", "data-passed-24h", "separate-payment-single-visit", "targeted-link-24h", "separately-booked"],
                "type": "string"
              },
              "flight": {
                "default": false,
                "description": "The transport includes a flight (ATOL pointer). Ignored if transport is false.",
                "type": "boolean"
              },
              "generalAgreement": {
                "default": false,
                "description": "Bought under a general agreement for business travel (exclusion, reg. 3(2)(c)).",
                "type": "boolean"
              },
              "notForProfit": {
                "default": false,
                "description": "Offered occasionally, not for profit, to a limited group (exclusion, reg. 3(2)(b)).",
                "type": "boolean"
              },
              "otherAfterStart": {
                "default": false,
                "description": "The other tourist service was selected and bought after the transport, stay or car hire had started (reg. 2(6)(b)).",
                "type": "boolean"
              },
              "otherSignificant": {
                "default": false,
                "description": "The other tourist service is a significant proportion of the value (rule of thumb 25%+) or an essential feature. Only relevant with exactly one of transport, accommodation or vehicle hire.",
                "type": "boolean"
              },
              "otherTourist": {
                "default": false,
                "description": "Includes other tourist services (excursions, tours, tickets, ski passes, spa treatments).",
                "type": "boolean"
              },
              "rules": {
                "default": "before-2027-04-06",
                "description": "Which rules apply, by the date the contract is concluded. \"from-2027-04-06\" applies the 2026 amendments (no linked travel arrangements).",
                "enum": ["before-2027-04-06", "from-2027-04-06"],
                "type": "string"
              },
              "sameTrip": {
                "default": true,
                "description": "All the services are for the same trip or holiday.",
                "type": "boolean"
              },
              "transport": {
                "type": "boolean",
                "default": false,
                "description": "Includes carriage of passengers (flight, train, coach, ferry, transfer)."
              },
              "under24Hours": {
                "default": false,
                "description": "Covers less than 24 hours with no overnight accommodation (exclusion, reg. 3(2)(a)).",
                "type": "boolean"
              },
              "vehicleHire": {
                "default": false,
                "description": "Includes car, motor vehicle or motorcycle hire.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Package Travel Regulations Checker: Is This a Package?"
          },
          "behavior": {
