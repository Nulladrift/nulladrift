        {
          "name": "revpar-calculator",
          "title": "RevPAR Calculator: ADR, Occupancy, TRevPAR and GOPPAR",
          "description": "From rooms, nights in the period, room nights sold and rooms revenue, returns occupancy (sold ÷ available), ADR (rooms revenue ÷ sold) and RevPAR (rooms revenue ÷ available, = ADR × occupancy). Optional total revenue gives TRevPAR and the rooms share of revenue; optional gross operating profit gives GOPPAR and GOP margin (null when not supplied). With a target RevPAR, returns the ADR needed at a given occupancy (default: actual) and the occupancy needed at the current ADR. Rooms sold are capped at rooms available. Web page: https://globalluxagency.com/tools/revpar-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "GBP",
