        {
          "name": "yacht-crew-tip-calculator",
          "title": "Yacht Crew Tip Calculator: Tipping Guide for Yachts, Jets and Villas",
          "description": "Tipping norms are customs, not rules. Yacht: % of the base charter fee (MYBA guideline 5–15%, 10% standard), split equally across the crew. Villa: % of the villa rental (villa agencies’ guidance roughly 5–15%, low confidence; 10% typical is a modelling choice), split across the staff. Private jet: US$ per pilot and per cabin attendant per flight (US practice, low confidence: pilots $50–100, attendants $30–75), typical at the midpoint; those US$ figures are defaults only when currency is USD and are never converted; other currencies need the caller’s own amounts. Percentages and amounts can be overridden. Web page: https://globalluxagency.com/tools/yacht-crew-tip-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attendantHigh": {
                "description": "Jet: high tip per cabin attendant per flight, in the chosen currency (default US$75 when currency is USD).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "attendantLow": {
                "description": "Jet: low tip per cabin attendant per flight, in the chosen currency (default US$30 when currency is USD).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "attendants": {
                "default": 1,
                "description": "Jet: number of cabin attendants.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "context": {
                "description": "Who is being tipped: yacht (charter crew), jet (private jet crew) or villa (villa staff).",
                "enum": ["yacht", "jet", "villa"],
                "type": "string"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of the fee or jet amounts. The sourced jet figures are US dollars and are used as defaults only when currency is USD; they are never converted.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "fee": {
                "default": 150000,
                "description": "Yacht: base charter fee before VAT and APA. Villa: villa rental. Ignored for jet.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "flights": {
                "default": 1,
                "description": "Jet: flights (legs) being tipped for. Use 1 to tip once for the trip.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "highPercent": {
                "description": "Override the high percentage (yacht/villa; default 15).",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "lowPercent": {
                "description": "Override the low percentage (yacht/villa; default 5).",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "pilotHigh": {
                "description": "Jet: high tip per pilot per flight, in the chosen currency (default US$100 when currency is USD).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "pilotLow": {
                "description": "Jet: low tip per pilot per flight, in the chosen currency (default US$50 when currency is USD; needed in other currencies).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "pilots": {
                "default": 2,
                "description": "Jet: number of pilots.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "staff": {
                "description": "Crew or staff sharing the tip, for the per-person split (default 8 for yacht, 5 for villa). 0 skips the split.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "typicalPercent": {
                "description": "Override the typical percentage (yacht/villa; default 10).",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["context"],
            "type": "object"
          },
