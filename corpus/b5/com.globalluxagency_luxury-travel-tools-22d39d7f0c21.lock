        {
          "name": "hotel-overbooking-calculator",
          "title": "Hotel Overbooking Calculator: How Many Rooms to Overbook",
          "description": "Models each booking as showing independently with probability 1 − (no-show % + late-cancellation %) (binomial). For each overbooking level it returns the expected shows, the probability of walking at least one guest, expected walks, expected rooms occupied and the expected net gain (room revenue less walk cost) compared with not overbooking, and recommends the level that maximises it: the newsvendor critical-ratio rule, adding bookings while P(shows ≥ rooms) < revenue ÷ (revenue + walk cost). The rates and costs are the caller's own; nothing is assumed. Assumes demand fills the extra bookings. Web page: https://globalluxagency.com/tools/hotel-overbooking-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "GBP",
                "description": "Currency of the amounts.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "lateCancelPercent": {
                "default": 0,
                "description": "Cancellations too late to resell, % of bookings on the books for the night.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "noShowPercent": {
                "description": "No-shows, % of bookings on the books for the night (your own history).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "roomRevenue": {
                "description": "Revenue from one extra room sold (e.g. ADR net of VAT).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "rooms": {
                "description": "Rooms available to sell for the night.",
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "walkCost": {
                "description": "All-in cost of walking one guest: relocation room, transport, goodwill and compensation.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["noShowPercent", "roomRevenue", "rooms", "walkCost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hotel Overbooking Calculator: How Many Rooms to Overbook"
          },
          "behavior": {
            "destructive": false,
