                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of the price.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "model": {
                "default": "commission",
                "description": "commission = % of the retail price; markup = % added to the net price.",
                "enum": ["commission", "markup"],
                "type": "string"
              },
              "price": {
                "description": "The price you set, per person or per group, in the terms given by priceEntered.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "priceEntered": {
                "default": "retail",
                "description": "retail = price is the public (rack) price, work out the net; net = price is your net, work out the retail.",
                "enum": ["retail", "net"],
                "type": "string"
              },
              "ratePercent": {
                "default": 15,
                "description": "Commission or markup %. Commission is capped at 95%. Default 15% is a modelling choice (midpoint of the typical retail travel agent range).",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "roundTo": {
                "default": "1",
                "description": "Round the worked-out price to this step (0 = to 2 decimal places).",
                "enum": ["0", "1", "5", "10", "50"],
                "type": "string"
              },
              "roundingDirection": {
                "default": "nearest",
                "description": "Rounding direction.",
                "enum": ["nearest", "up", "down"],
                "type": "string"
              }
            },
            "required": ["price"],
            "type": "object"
