              "currency": {
                "default": "GBP",
                "description": "Currency of the amounts.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "departureDate": {
                "description": "Departure (or service start) date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "depositType": {
                "default": "percent",
                "description": "Whether depositValue is a percentage of the total or a fixed amount.",
                "enum": ["percent", "amount"],
                "type": "string"
              },
              "depositValue": {
                "default": 25,
                "description": "Deposit due at booking (percent or amount; example default 25%).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "instalments": {
                "default": "",
                "description": "Optional extra instalments as \"daysBefore:percent\" pairs, e.g. \"120:25\" (up to 6).",
                "maxLength": 200,
                "pattern": "^\\s*\\d+(\\.\\d+)?\\s*:\\s*\\d+(\\.\\d+)?\\s*(,\\s*\\d+(\\.\\d+)?\\s*:\\s*\\d+(\\.\\d+)?\\s*)*$",
                "type": "string"
              },
              "today": {
                "description": "Reference date for flagging deadlines that have passed, YYYY-MM-DD. Defaults to today (UTC).",
