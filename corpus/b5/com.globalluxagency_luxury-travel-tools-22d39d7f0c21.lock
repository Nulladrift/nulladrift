                "description": "Cancellation tiers as \"daysBefore:percentForfeited\" pairs (up to 8), e.g. \"84:25,56:50,29:75,0:100\".",
                "maxLength": 200,
                "pattern": "^\\s*\\d+(\\.\\d+)?\\s*:\\s*\\d+(\\.\\d+)?\\s*(,\\s*\\d+(\\.\\d+)?\\s*:\\s*\\d+(\\.\\d+)?\\s*)*$",
                "type": "string"
              },
              "clientBufferDays": {
                "default": 7,
