        {
          "name": "luxury-travel-carbon-calculator",
          "title": "Luxury Travel Carbon Calculator: Private Jet, Yacht and First Class",
          "description": "Flights: passenger-km × the DESNZ factor for the band and cabin (bands: domestic = within the UK; short = UK to/from Europe and North Africa; long = UK to/from elsewhere; intl = between non-UK countries). Use great-circle km: the factors already include the 8% routing uplift. Domestic has an average factor only; short-haul first uses the first/business factor. Private jet: fuel burned × the aviation turbine fuel factor, per litre or per kg; yacht: litres × the marine gas oil or diesel factor. The caller supplies all fuel figures: the tool holds no fuel burn for any aircraft or yacht. Radiative forcing (default on) applies DESNZ’s 1.7 multiplier to aviation CO2 only. Hotel stay: room-nights × the DESNZ country factor, or the caller’s own kg CO2e per room-night (stayCountry=custom, e.g. for a villa). Excludes well-to-tank emissions. An estimate; offsets are not endorsed. Web page: https://globalluxagency.com/tools/luxury-travel-carbon-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "flights": {
                "default": "long*first*5500*2",
                "description": "Scheduled flight legs separated by \";\", each band*cabin*km*passengers, e.g. \"long*first*5500*2;short*business*1100*2\". Bands: domestic, short, long, intl. Cabins: average, economy, premium, business, first. Up to 6 legs; \"none\" for no scheduled flights. Defaults to an example long-haul first-class leg.",
                "maxLength": 300,
                "pattern": "^(none|(domestic|short|long|intl)\\*(average|economy|premium|business|first)\\*\\d+(\\.\\d+)?\\*\\d+(;(domestic|short|long|intl)\\*(average|economy|premium|business|first)\\*\\d+(\\.\\d+)?\\*\\d+){0,5})$",
                "type": "string"
              },
              "jetFuelPerHour": {
                "default": 0,
                "description": "Private jet fuel burn per hour from the operator, in jetFuelUnit.",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "jetFuelTotal": {
                "default": 0,
                "description": "Total jet fuel for the trip, in jetFuelUnit. If above 0, used instead of hours × burn.",
                "maximum": 2000000,
                "minimum": 0,
                "type": "number"
              },
              "jetFuelUnit": {
                "default": "litre",
                "description": "litre or kg.",
                "enum": ["litre", "kg"],
                "type": "string"
              },
              "jetHours": {
                "default": 0,
                "description": "Private jet flight hours (used with jetFuelPerHour).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "radiativeForcing": {
                "default": true,
                "description": "Include the 1.7 radiative forcing multiplier on aviation CO2 (flights and jet fuel).",
                "type": "boolean"
              },
              "stayCountry": {
                "default": "France",
                "description": "Country for the DESNZ hotel-stay factor, or custom to use stayKgPerRoomNight.",
                "enum": ["Australia", "Belgium", "Brazil", "Canada", "Chile", "China", "Colombia", "Costa Rica", "Egypt", "France", "Germany", "Hong Kong, China", "India", "Indonesia", "Italy", "Japan", "Jordan", "Korea", "Malaysia", "Maldives", "Mexico", "Netherlands", "Oman", "Philippines", "Portugal", "Qatar", "Russian Federation", "Saudi Arabia", "Singapore", "South Africa", "Spain", "Switzerland", "Thailand", "Turkey", "United Arab Emirates", "United Kingdom", "United Kingdom (London)", "United States", "Vietnam", "custom"],
                "type": "string"
              },
              "stayKgPerRoomNight": {
                "default": 0,
                "description": "Your own kg CO2e per room-night, used when stayCountry is custom.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "stayNights": {
                "default": 7,
                "description": "Nights of accommodation (0 for none).",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "stayRooms": {
                "default": 1,
                "description": "Rooms occupied (the factor is per room, not per guest).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "travellers": {
                "default": 2,
                "description": "Travellers sharing the trip, for the per-person figure.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "yachtFuel": {
                "default": "mgo",
                "description": "mgo (marine gas oil) or diesel.",
                "enum": ["mgo", "diesel"],
                "type": "string"
              },
              "yachtHours": {
                "default": 0,
                "description": "Yacht engine (and generator) hours, used with yachtLitresPerHour.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "yachtLitresPerHour": {
                "default": 0,
                "description": "Yacht fuel burn per hour, litres, from the captain or broker.",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "yachtLitresTotal": {
                "default": 0,
                "description": "Total yacht fuel for the charter, litres. If above 0, used instead of hours × burn.",
                "maximum": 2000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
