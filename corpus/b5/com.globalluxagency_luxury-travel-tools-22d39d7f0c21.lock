        {
          "name": "experience-pricing-calculator",
          "title": "Experience Pricing Calculator",
          "description": "Prices a private or small-group experience from its costs. Takes fixed costs per departure, variable costs per guest and overhead, then returns the net price per guest that hits a target margin, the public (rack) price that still leaves that net after the agent or OTA commission (grossing up, not adding commission on top), the break-even group size, and a table of cost, price and profit for each group size. Web page: https://globalluxagency.com/tools/experience-pricing-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "commissionPercent": {
                "default": 20,
                "description": "Commission the agent or OTA keeps, % of the public price (default 20% is a modelling choice; see sources for typical ranges).",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of the amounts.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "fixedCostsPerDeparture": {
                "description": "Costs paid once per departure whatever the group size (guide, vehicle, venue hire, permits), in total.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "maxGuests": {
                "default": 8,
                "description": "Largest group size to model.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "minGuests": {
                "default": 2,
                "description": "Smallest group size to model.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "netPriceOverride": {
                "default": 0,
                "description": "Your own net price per guest. 0 = use the suggested price.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "overheadPerDeparture": {
                "default": 0,
                "description": "Share of business overheads allocated to each departure.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "pricingGuests": {
                "default": 4,
                "description": "Group size the suggested net price is based on.",
                "maximum": 60,
                "minimum": 1,
