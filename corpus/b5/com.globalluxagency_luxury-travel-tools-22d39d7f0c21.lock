        {
          "name": "currency-exposure-calculator",
          "title": "Currency Exposure Calculator for Travel Agencies",
          "description": "For a travel booking sold to the client in one currency (e.g. GBP) with supplier costs in another (e.g. EUR), returns the margin at the quoted rate, at the rate now and when the client currency moves up or down by each scenario percentage, the break-even rate, the margin at risk from the largest adverse move, and an optional comparison with a locked rate. Rates are units of supplier currency per 1 unit of client currency and must be supplied by the caller (no live or reference rates are provided). A deposit or balance already paid or fixed is entered with its rate and is no longer exposed. Not financial or hedging advice. Web page: https://globalluxagency.com/tools/currency-exposure-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balanceDate": {
                "description": "Balance due date, YYYY-MM-DD (optional).",
                "format": "date",
                "type": "string"
              },
              "balanceFixedRate": {
                "default": 0,
                "description": "Rate at which the balance was paid or fixed; 0 = still open.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "clientCurrency": {
                "default": "GBP",
                "description": "Currency the client pays in.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "clientPrice": {
                "description": "Price agreed with the client, in the client currency.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "depositDate": {
                "description": "Deposit due date, YYYY-MM-DD (optional).",
                "format": "date",
                "type": "string"
              },
              "depositFixedRate": {
                "default": 0,
                "description": "Rate at which the deposit was paid or fixed; 0 = still open.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "depositPercent": {
                "default": 30,
                "description": "Share of the supplier cost due as a deposit, %; the rest is the balance (example default 30%).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "lockedRate": {
                "default": 0,
                "description": "Optional locked rate to compare for the open amount (e.g. a rate offered by your FX provider); 0 = none.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "quotedRate": {
                "description": "Rate used when quoting: units of supplier currency per 1 unit of client currency (e.g. 1.18 for 1 GBP = 1.18 EUR). Ignored when the currencies match.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "rateNow": {
                "description": "Rate now, or the rate you expect to pay at, same convention. Defaults to quotedRate.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "scenarioMoves": {
                "default": "2,5,10",
                "description": "Comma-separated % moves in the client currency, each applied up and down from the rate now (up to 6; example default \"2,5,10\").",
                "maxLength": 60,
                "pattern": "^\\s*\\d+(\\.\\d+)?\\s*(,\\s*\\d+(\\.\\d+)?\\s*)*$",
                "type": "string"
              },
              "supplierCost": {
                "description": "Total supplier cost, in the supplier currency.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "supplierCurrency": {
                "default": "EUR",
                "description": "Currency the supplier is paid in.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "today": {
                "description": "Reference date for days to each payment, YYYY-MM-DD. Defaults to today (UTC).",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["clientPrice", "quotedRate", "supplierCost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Currency Exposure Calculator for Travel Agencies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:500ee5d8bc502bc9dd4d69ef10e7e9920d0de9ecbc607fd0f8c69da53a81f1d6"
        },
        {
          "name": "direct-booking-vs-ota-calculator",
          "title": "Direct Booking vs OTA Savings Calculator",
          "description": "Compares the net room revenue a hotel keeps per booking from an OTA (after commission and, for pay-at-hotel bookings, card fees) and from a direct booking (after rate discount, booking engine, marketing, per-booking costs and card fees). Returns annual distribution costs by channel, the saving from moving a number of percentage points of room nights from OTAs to direct, and break-even direct costs. Direct-channel costs start at 0: pass your own. Web page: https://globalluxagency.com/tools/direct-booking-vs-ota-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adr": {
                "description": "Average daily rate (room revenue per occupied room night).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "bookingEnginePercent": {
                "default": 0,
                "description": "Booking engine fee, % of direct booking value.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "cardFeeFixed": {
                "default": 0.2,
                "description": "Card processing fee, fixed amount per booking (example default 0.2, in GBP).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "cardFeePercent": {
                "default": 1.5,
                "description": "Card processing fee, % of the amount charged (example default 1.5%).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of the amounts.",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "directCostPerBooking": {
                "default": 0,
                "description": "Fixed cost per direct booking (cost-per-click spend, per-booking engine fee, perk value).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "directDiscountPercent": {
                "default": 0,
                "description": "Direct-booking rate discount (e.g. member rate), % off the ADR.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "marketingPercent": {
                "default": 0,
                "description": "Metasearch, paid search and other marketing, % of direct booking value.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "nightsPerBooking": {
                "default": 2.5,
                "description": "Average nights per booking (example default 2.5).",
                "maximum": 365,
                "minimum": 1,
                "type": "number"
              },
              "otaCommissionPercent": {
                "default": 18,
                "description": "OTA commission, % of booking value, including any visibility programme uplift. Typical 15–30%; the default of 18% is a modelling choice.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "otaPayment": {
                "default": "ota",
                "description": "'ota' = prepaid to the OTA, which pays you net; 'property' = pay at hotel, you take the card payment.",
                "enum": ["ota", "property"],
                "type": "string"
              },
              "otaSharePercent": {
                "default": 22.2,
                "description": "Share of room nights booked through OTAs, %. Default: 22.2% (five-star hotels in Europe, 2023).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "roomNights": {
                "description": "Room nights sold per year, all channels.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "shiftPoints": {
                "default": 5,
                "description": "Percentage points of room nights moved from OTAs to direct (example default 5).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["adr", "roomNights"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Direct Booking vs OTA Savings Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0aa9c1ac05f3b0d6ccfa83715cac54d3b4f02adc65c4cbc196ffd7d9783ea94d"
