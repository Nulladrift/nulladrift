                "type": "string"
              },
              "grossOperatingProfit": {
                "default": 0,
                "description": "Gross operating profit (USALI), can be negative. 0 = not supplied.",
                "maximum": 1000000000000,
                "minimum": -1000000000000,
                "type": "number"
              },
              "nights": {
                "description": "Nights (days) in the period, e.g. 30 or 365.",
                "maximum": 3660,
                "minimum": 0,
                "type": "integer"
              },
              "roomNightsSold": {
                "description": "Room nights sold in the period.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
