        {
          "name": "payment-timeline-builder",
          "title": "Payment & Cancellation Timeline Builder",
          "description": "Builds a dated payment and cancellation timeline for a trip: deposit, optional instalments and balance (with client due dates set a buffer ahead of the supplier deadlines) and the cancellation charge that applies on each date. Default terms are examples only; pass the terms from the supplier contract. Web page: https://globalluxagency.com/tools/payment-timeline-builder",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balanceDaysBefore": {
                "default": 84,
                "description": "Balance due this many days before departure.",
                "maximum": 1830,
                "minimum": 0,
                "type": "integer"
              },
              "bookingDate": {
                "description": "Booking date, YYYY-MM-DD. Defaults to today (UTC).",
