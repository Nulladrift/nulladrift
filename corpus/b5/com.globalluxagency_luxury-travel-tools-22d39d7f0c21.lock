        {
          "name": "cruise-true-cost-calculator",
          "title": "Cruise Cost Calculator: The True Cost of a Cruise, Compared",
          "description": "All prices are the caller’s own: the tool holds no cruise fares, gratuity rates, package prices or inclusions, and the defaults are an illustrative example, not quotes. Per option: fare × guests, plus each add-on (per person, per person per night or per booking as described) unless listed in Included, less onboard credit capped at the onboard spend. Returns totals, per person and per person per night, and differences against the cheaper option per person per night. The page compares up to three options. Web page: https://globalluxagency.com/tools/cruise-true-cost-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "GBP",
                "description": "Currency of all amounts (no conversion).",
                "enum": ["GBP", "EUR", "USD", "CHF", "AED", "AUD", "CAD", "SGD", "HKD", "JPY", "ZAR"],
                "type": "string"
              },
              "optionADining": {
                "default": 0,
                "description": "Option A: speciality dining, per person, for the cruise.",
