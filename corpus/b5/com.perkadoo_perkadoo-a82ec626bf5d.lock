        {
          "name": "create_share_card",
          "title": "Make a share card",
          "description": "Make a card for a win, streak, perk, giveaway entry or winner announcement. Returns a public page and PNG image in square, story or link size. Uses supplied text; it does not verify a winner, grant a perk or publish a social post. Never put private tokens or coupon codes in a card.",
          "inputSchema": {
            "properties": {
              "fields": {
                "additionalProperties": {
                  "maxLength": 500,
                  "type": "string"
                },
                "description": "Template text: winner uses name, prize, from; streak uses days, habit, optional name; perk uses milestone, perk, from; entered uses giveaway, prize, from; announce uses title, winners (one per line), from.",
                "propertyNames": {
                  "maxLength": 30,
                  "type": "string"
                },
                "type": "object"
              },
              "site": {
                "description": "Optional website backlink. Query strings and fragments are removed.",
                "format": "uri",
                "maxLength": 300,
                "type": "string"
              },
              "size": {
                "default": "square",
                "enum": ["square", "story", "link"],
                "type": "string"
              },
              "template": {
                "enum": ["winner", "streak", "perk", "entered", "announce"],
                "type": "string"
              },
              "theme": {
                "default": "ink",
                "enum": ["ink", "light", "sun", "cobalt"],
                "type": "string"
              }
            },
            "required": ["fields", "template"],
            "type": "object"
