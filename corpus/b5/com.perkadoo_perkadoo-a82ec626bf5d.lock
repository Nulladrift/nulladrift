        {
          "name": "get_draw",
          "title": "Read a draw result",
          "description": "Read and verify a Winner Picker result from its public slug. If randomness is now available, completes the previously committed draw. Returns the original winners and share image; never picks a replacement winner.",
          "inputSchema": {
            "properties": {
              "slug": {
                "pattern": "^[2-9a-z]{10}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
