        {
          "name": "build_prebuild_from_site",
          "title": "Build my giveaway and streak from my site",
          "description": "Give Doo your site's address. Doo reads it and builds your giveaway, daily streak and perks in your brand colors, then returns a private preview link. Nothing goes live until you make it yours from that page.",
