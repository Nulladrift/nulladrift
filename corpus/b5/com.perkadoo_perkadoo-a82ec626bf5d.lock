              "drawMethod": {
                "description": "single: one winner. multiple: equal winners. placed: 1st, 2nd, 3rd…",
                "enum": ["single", "multiple", "placed"],
                "type": "string"
              },
              "entryPage": {
                "description": "The hosted entry page's headline, description, image, brand color and bonuses.",
                "properties": {
                  "bonusActions": {
                    "additionalProperties": {
                      "properties": {
                        "enabled": {
                          "type": "boolean"
                        },
                        "entries": {
                          "description": "Entries this action is worth.",
                          "maximum": 10,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "url": {
                          "anyOf": [
                            {
                              "format": "uri",
                              "maxLength": 1000,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Where the follow or visit action sends people."
                        }
                      },
                      "required": ["enabled"],
                      "type": "object"
                    },
                    "description": "Bonus entries on offer: referral, share, follow and visit. Pro and up.",
                    "propertyNames": {
                      "enum": ["referral", "share", "follow", "visit"],
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "brandColor": {
                    "anyOf": [
                      {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "description": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "headline": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "imageUrl": {
                    "anyOf": [
