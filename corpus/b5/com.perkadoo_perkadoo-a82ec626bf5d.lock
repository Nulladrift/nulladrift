        {
          "name": "create_perk",
          "title": "Create a perk",
          "description": "Create a reward a brand can give members: a coupon code, a link or a message. Milestone rewards set in the dashboard are perks too.",
          "inputSchema": {
            "properties": {
              "brandId": {
                "description": "Brand ID, the project that offers the perk.",
                "format": "uuid",
                "type": "string"
              },
              "expiresAt": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the perk stops being shown, as an ISO 8601 time."
              },
              "kind": {
                "description": "coupon (a code), url (a link) or message (text).",
                "enum": ["coupon", "url", "message"],
                "type": "string"
              },
              "name": {
                "description": "What the brand calls this perk.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "uniqueCodes": {
                "description": "Coupons only. true when each member needs their own code, like a gift card: members wait for one until codes are added, and never get the value.",
                "type": "boolean"
              },
              "validDays": {
                "anyOf": [
                  {
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How many days a member has to use it after it's given, like 30. Null keeps it until the perk's own expiry."
              },
              "value": {
                "description": "The coupon code, link or message.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "valueCents": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "What the perk is worth to a member, in cents."
              }
            },
            "required": ["brandId", "kind", "name", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
