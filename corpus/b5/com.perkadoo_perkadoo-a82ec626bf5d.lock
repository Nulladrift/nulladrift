        {
          "name": "create_giveaway",
          "title": "Create a giveaway",
          "description": "Draft a hosted giveaway: prize, dates, draw, entry page, bonus entries and official rules. It starts as a draft with a preview link. A signed-in person approves it at dashboardUrl before it goes live; send them that link.",
          "inputSchema": {
            "properties": {
              "brandId": {
                "description": "Brand ID, the project that runs the giveaway.",
                "format": "uuid",
                "type": "string"
              },
              "closesAt": {
                "description": "When entries close, as an ISO 8601 time. Must be after opensAt.",
                "format": "date-time",
                "type": "string"
              },
              "drawMethod": {
                "default": "single",
                "description": "single: one winner. multiple: equal winners. placed: 1st, 2nd, 3rd…",
                "enum": ["single", "multiple", "placed"],
                "type": "string"
              },
              "entryPage": {
                "default": {},
                "description": "The hosted entry page's headline, description, image, brand color and bonuses.",
                "properties": {
                  "bonusActions": {
                    "additionalProperties": {
                      "properties": {
                        "enabled": {
                          "type": "boolean"
                        },
                        "entries": {
                          "description": "Entries this action is worth.",
                          "maximum": 10,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "url": {
                          "anyOf": [
                            {
                              "format": "uri",
                              "maxLength": 1000,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Where the follow or visit action sends people."
                        }
                      },
                      "required": ["enabled"],
                      "type": "object"
                    },
                    "description": "Bonus entries on offer: referral, share, follow and visit. Pro and up.",
                    "propertyNames": {
                      "enum": ["referral", "share", "follow", "visit"],
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "brandColor": {
                    "anyOf": [
                      {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "description": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "headline": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "imageUrl": {
                    "anyOf": [
                      {
                        "format": "uri",
                        "maxLength": 1000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "language": {
                "description": "The language entrants see: en or es. Left out, the language of the brand's country, else en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "description": "The giveaway's name, shown as its title.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "opensAt": {
                "description": "When entries open, as an ISO 8601 time.",
                "format": "date-time",
                "type": "string"
              },
              "prizes": {
                "default": [],
                "description": "One prize per place for placed draws; otherwise the first prize goes to every winner.",
                "items": {
                  "properties": {
                    "label": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "perkId": {
                      "anyOf": [
                        {
                          "format": "uuid",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "A perk from this brand to give the winner of this place."
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "rules": {
                "default": {
                  "document": null,
                  "fields": {}
                },
                "description": "The official rules. sponsorCountry and countries default to the brand's own country. A person approves them before the giveaway goes live.",
                "properties": {
                  "fields": {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "maxLength": 2000,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "boolean"
                        },
                        {
                          "items": {
                            "maxLength": 200,
                            "type": "string"
                          },
                          "maxItems": 60,
                          "type": "array"
                        }
                      ]
                    },
                    "default": {},
                    "description": "The official rules generator's operator fields: sponsor, eligibility and so on.",
                    "propertyNames": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "timezone": {
                "description": "The time zone the official rules and dashboard use, e.g. Europe/London. Left out, the brand's own: from its site's country domain, then its saved zone.",
                "maxLength": 64,
                "type": "string"
              },
              "winnerCount": {
                "default": 1,
                "description": "How many winners to draw.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["brandId", "closesAt", "name", "opensAt"],
            "type": "object"
          },
