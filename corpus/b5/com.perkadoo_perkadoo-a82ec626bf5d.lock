        {
          "name": "draw_from_post",
          "title": "Pick winners from a post's comments",
          "description": "Pick random winners from the people who commented on a public post, from its link, with no account: YouTube videos, Bluesky posts and Reddit threads. Each commenter gets one entry. Reads the comments and draws in one step, with public drand randomness anyone can check. Returns the winners and a public results link to share. An Instagram post needs its owner: the answer is a link for them.",
          "inputSchema": {
            "properties": {
              "link": {
                "description": "The post's link, as copied from its share button: a YouTube video, a Bluesky post or a Reddit thread.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "method": {
                "default": "single",
                "description": "single: one winner. multiple: several equal winners. placed: 1st, 2nd, 3rd… with a prize per place.",
                "enum": ["single", "multiple", "placed"],
                "type": "string"
              },
              "prizes": {
                "description": "Prize labels. For placed draws, one per place in order; otherwise one prize for every winner.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
