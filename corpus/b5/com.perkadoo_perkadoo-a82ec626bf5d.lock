                "maxItems": 100,
                "type": "array"
              },
              "title": {
                "description": "A name for the giveaway, shown on the results page. Default: the post's title.",
                "maxLength": 120,
                "type": "string"
              },
              "winnerCount": {
                "default": 1,
                "description": "How many winners to pick.",
                "maximum": 100,
