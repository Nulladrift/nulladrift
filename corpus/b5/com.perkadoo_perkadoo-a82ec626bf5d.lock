              "name": {
                "description": "The giveaway's name, shown as its title.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "opensAt": {
                "description": "When entries open, as an ISO 8601 time.",
                "format": "date-time",
                "type": "string"
