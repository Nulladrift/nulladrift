        {
          "name": "decide",
          "title": "Decide",
          "description": "智能决策（System One 类型化判断）：输入业务状态与若干类型化问题，返回每题的校准概率，不生成文本。\n适用：工单分类、风控判定、质检评估等结构化判断场景。无上下文记忆，每次请求独立。\nquestions 为 {题目id: 题目} 映射（1-32 题），type 三种：choice（多选一，criteria={选项名:描述}）、\nnoul（是否判断，criteria 可选 {true:描述,false:描述}）、score（有序等级打分，criteria=[等级描述...]），可选 instructions 说明该问什么。\n示例：{\"team\":{\"type\":\"choice\",\"criteria\":{\"refund\":\"退款\",\"logistics\":\"物流\"}},\"urgent\":{\"type\":\"noul\"},\"severity\":{\"type\":\"score\",\"criteria\":[\"轻微\",\"一般\",\"严重\"]}}\nanswers 按同键回传，含选中项、置信度与全选项概率。\n计费按输入 token（约 2 元/百万，输出免费），失败不计费。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "questions": {
                "additionalProperties": true,
                "type": "object"
              },
              "state": {}
            },
            "required": ["questions", "state"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
