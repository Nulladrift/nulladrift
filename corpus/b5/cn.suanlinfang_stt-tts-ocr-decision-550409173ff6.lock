        {
          "name": "synthesize_speech",
          "title": "Synthesize Speech",
          "description": "把文本合成为语音（≤3000 UTF-8 字节，约 1000 汉字），同步返回现签下载链接（url，GET 即得音频，1 小时内有效）。\n请提醒用户及时下载转存——链接过期后只能重新合成（重复计费）。\n更长的文本请改用 submit_speech_task（异步任务）。speaker 音色代码先用 list_tts_voices 查询。\n计费约 2 元/万字符，失败不计费。",
