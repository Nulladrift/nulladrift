        {
          "name": "recognize_image",
          "title": "Recognize Image",
          "description": "识别图片中的文字（png/jpg/webp/bmp，≤20MB，公网 URL），同步返回逐行文本。\ntier：standard 标准档（快速，适合清晰打印件/截图）；accurate 精准档（表格、多栏、倾斜拍摄等复杂版面）。\nprompt 仅精准档生效：自定义识别指令（如「只提取表格金额列」），≤2000 字符，缺省识别全部文字。\n计费按页（单图=1 页，约 0.5~1.5 分/页）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_url": {
                "type": "string"
              },
              "prompt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "tier": {
                "enum": ["standard", "accurate"],
                "type": "string"
              }
            },
            "required": ["image_url", "tier"],
            "type": "object"
