        {
          "name": "transcribe_audio",
          "title": "Transcribe Audio",
          "description": "把一段短音频（公网 URL）转成文字。适用于 ≤3 分钟、≤20MB 的录音/语音消息，同步秒级返回。\n更长的音频请改用 submit_transcription_task（异步任务）。\nlanguage 留空自动检测（支持普通话、英语及 22 种中文方言）；指定时用语种代码（如 zh、en）。\ncontext 可传热词（人名、术语、品牌，逗号分隔），专有名词按所列写法优先转写——会议转写建议填与会人名。\n返回全文纯文本（不含时间戳/分句时间轴）。计费按音频实际时长（约 0.5 元/小时，精确到秒），失败不计费。",
          "inputSchema": {
