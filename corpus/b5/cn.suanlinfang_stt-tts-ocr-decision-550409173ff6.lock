        {
          "name": "get_image_task",
          "title": "Get Image Task",
          "description": "查询生图任务状态。status：queued/running（进行中，快档常在数十秒内出图，慢档可能数分钟——视模型档位与当前空闲算力）、\nsuccess（resultUrl 为图片现签下载链接，1 小时内有效；链接过期后重新查询即换新链）、\nfailed（errorMsg 为失败原因，不扣费）、expired（结果已过保留期）。\n建议每 5~10 秒查询一次。generate_image 等待超时降级后用本工具续查。",
