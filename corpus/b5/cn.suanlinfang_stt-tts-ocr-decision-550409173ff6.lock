        {
          "name": "submit_transcription_task",
          "title": "Submit Transcription Task",
          "description": "提交长音频转写任务（会议录音/播客/网课，最长 2 小时、≤500MB，wav/mp3/flac/m4a/ogg/aac）。\n平台自动按 180 秒切段逐段转写并拼接全文（纯文本，不含时间戳）。提交后用 get_transcription_task 轮询结果。\nlanguage 留空自动检测，指定时用语种代码（如 zh、en）；context 可传热词（人名、术语、品牌，逗号分隔），对全部音频段生效。\n计费按实际时长（约 0.5 元/小时），余额不足会在提交时被拒绝。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "type": "string"
              },
