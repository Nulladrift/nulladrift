      "instructions": "算邻坊 AI 能力（suanlinfang.cn，按量计费，失败不计费）。生图为引流主推能力：generate_image 一次调用出图（文生图/图生图合一，默认自动选模型）。另有语音识别（STT）、语音合成（TTS）、文字识别（OCR）三族能力。所有工具调用需 API Key（nk- 前缀，suanlinfang.cn/consume-web/api-keys.html 创建，新用户赠 ¥10 体验金）。",
      "tools": [
        {
          "name": "generate_image",
          "title": "Generate Image",
          "description": "AI 生图（1024×1024 PNG，按张计费，失败不计费）：传 prompt 即文生图；再传 init_image_url（参考图公网 URL，png/jpg/jpeg ≤10MB）即图生图（换装/换景/改背景等编辑指令写在 prompt 里）。\n本工具一次调用内完成「提交→等待→出结果」，默认最多等 120 秒（wait_seconds 可调 10~300）；\n出图成功返回 resultUrl（现签下载链接，1 小时内有效，请提醒用户及时下载转存）。\nmodel 留空自动选：文生图=flux2-klein（快而省），图生图=qwen-image-edit-2511；要更高质量可传 z-image-turbo，在线模型与实时牌价先用 list_image_models 查询。\nseed（非负整数）可复现同图：同 prompt + 同 seed 生成一致结果。\n若等待超时仍未完成，返回 taskNo（任务不丢失、不计排队费），调用 get_image_task 继续查询。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "init_image_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "prompt": {
                "type": "string"
              },
              "seed": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "wait_seconds": {
                "default": 120,
                "type": "integer"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
