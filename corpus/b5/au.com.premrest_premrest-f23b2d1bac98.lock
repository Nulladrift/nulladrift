{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.premrest/premrest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://premrest.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "premrest",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Premrest is an Australian commercial floor care company. It serves commercial facilities across Australia, with flood restoration and flooring supply/installation focused on Brisbane, Sydney and Melbourne. Residential enquiries are outside our service scope. This server lists commercial floor care services and accepts quote, preferred-date booking and flood restoration enquiries. Slippery-floor work is product-agnostic: Premrest assesses and applies a suitable non-slip coating or tile etching treatment, or recommends deep cleaning when contamination is the cause. Systems Premrest has used include SWISS GriP, Stellmann, Dr. Schutz and Actichem NeverStrip. Customers do not choose a brand. Phone 1300 207 915 and SMS 0480 855 665 are monitored 24/7. Premrest staff confirm all bookings, prices and attendance. An online request does not confirm dispatch or arrival time. Submitted details go to Premrest through the website Formspree form, labelled with this AI integration as the source. Submit only when the customer asks to send an enquiry. Do not invent customer details. Photo inputs are optional customer-provided HTTPS links.",
      "tools": [
        {
          "name": "list_services",
          "description": "List Premrest commercial flooring services, including non-slip coatings, anti-slip tile treatments, slippery-floor assessments, flood restoration, and phone and SMS contact details. Prices and availability require assessment by the Premrest team.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Premrest services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:649fddb5d03b6624225a750e8b20bd9fe17ca7b37cd1ab8cc0ae909633edbfc0"
        },
        {
          "name": "submit_service_request",
          "description": "Creates a Premrest quote, preferred-date booking or flood restoration enquiry in the private staff queue and sends it to the website Formspree inbox with the configured AI integration source. Submitting an enquiry requests contact from Premrest about that enquiry. urgent_flood requests use flood-restoration and do not require a preferred date. Returns a request reference, delivery status and call/text contact options. Repeated identical requests with the same idempotency_key return the original reference without duplicate delivery. Does not confirm dispatch, arrival time, price or booking and does not process payments. Photo inputs are optional customer-provided HTTPS links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Job street address, suburb, state and postcode",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "area_sqm": {
                "description": "Approximate area if known; omit if unknown",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "company": {
                "description": "Optional company name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "customer_name": {
                "description": "Customer full name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "details": {
                "description": "Floor type, condition, work required and access. For slippery floors: wet or dry conditions, contamination or existing coatings, and any slip-test findings if known. For flooding: what happened, when it started, affected areas and known access constraints.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "Customer contact email",
                "format": "email",
                "maxLength": 254,
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique key for this request; reuse only when retrying the same request",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Customer phone number",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "photo_urls": {
                "description": "Optional customer-provided HTTPS links. Images are not fetched; chat attachments are not automatically transferred.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "preferred_date": {
                "description": "YYYY-MM-DD in Melbourne time. Required for bookings. A preference only.",
                "format": "date",
                "type": "string"
              },
              "preferred_time": {
                "description": "Optional preferred time or time window",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "property_type": {
                "description": "Office, retail, hotel, school, or other property type",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "request_type": {
                "description": "quote, booking, or urgent_flood. urgent_flood is a flood restoration enquiry; preferred date is not required.",
                "enum": ["quote", "booking", "urgent_flood"],
                "type": "string"
              },
              "service": {
                "description": "Service id. non-slip-coatings covers slippery-floor assessments, anti-slip coatings and tile etching. A product or treatment choice is not required.",
                "enum": ["flood-restoration", "carpet-cleaning", "hard-floor-cleaning", "bolon-cleaning", "commercial-flooring", "slip-testing", "non-slip-coatings", "tile-grout-cleaning", "stone-care", "strip-and-seal", "carpet-repairs", "other"],
                "type": "string"
              }
            },
            "required": ["address", "customer_name", "details", "email", "idempotency_key", "phone", "property_type", "request_type", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit Premrest service request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15d07d96776e880e2f0261b225ed60503b7d2713330c5d1b894da7efd306fffe"
        }
      ],
      "digest": "sha256:d1f07f4ac69d1b54a8e41d6797e95d1a7f9c0cff2baafd8ae82906f8fa81444a"
    }
  }
}
