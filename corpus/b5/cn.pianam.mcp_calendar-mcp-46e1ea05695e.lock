      "tools": [
        {
          "name": "list_holidays",
          "title": "List Holidays",
          "description": "列出指定年份的全部中国法定节假日安排，包括放假日期和调休上班日期。支持2025、2026年",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "year": {
                "description": "年份，如 2026",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c293461b049169776ef9d641484fbe7dbd45af535bb2a0c966853ff8ae178deb"
        },
        {
          "name": "query_holiday",
          "title": "Query Holiday",
          "description": "查询指定公历日期的中国法定节假日或调休安排，同时返回农历信息。支持2025、2026年。参数date格式：YYYY-MM-DD",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "公历日期，格式 YYYY-MM-DD，如 \"2026-10-01\"",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3e04ee24664ae75385f7876251be22544cb802e29f68b7a6e8f4c7f690259aa7"
        },
        {
          "name": "solar_to_lunar",
          "title": "Solar To Lunar",
          "description": "将公历日期转换为农历日期，返回农历年月日、是否闰月、生肖、干支等信息",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "公历日，如 17",
                "type": "integer"
              },
              "month": {
                "description": "公历月，如 2",
                "type": "integer"
              },
              "year": {
                "description": "公历年，如 2026",
                "type": "integer"
              }
            },
            "required": ["day", "month", "year"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
