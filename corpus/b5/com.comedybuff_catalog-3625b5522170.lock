        {
          "name": "search_comedy_videos",
          "title": "Find comedy videos",
          "description": "Find videos by literal keywords in video title/description or channel title, optionally in a returned channelId and/or with a ready transcript. Newest-first bounded pages; metadata search does not search spoken content. Availability is reported catalog state, not a guarantee. Open the website to watch under normal access rules.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "channelId": {
                "exclusiveMinimum": 0,
                "maximum": 2147483647,
                "type": "integer"
              },
              "hasTranscript": {
                "type": "boolean"
              },
              "limit": {
                "default": 3,
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "videos": {
                    "additionalProperties": false,
                    "properties": {
                      "hasMore": {
                        "type": "boolean"
                      },
                      "items": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "availability": {
                              "enum": ["UNKNOWN", "WORKING", "UNAVAILABLE"],
                              "type": "string"
                            },
                            "channel": {
                              "additionalProperties": false,
                              "properties": {
                                "description": {
                                  "type": ["string", "null"]
                                },
                                "id": {
                                  "exclusiveMinimum": 0,
                                  "maximum": 2147483647,
                                  "type": "integer"
                                },
                                "imageUrl": {
                                  "anyOf": [
                                    {
                                      "format": "uri",
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "slug": {
                                  "type": "string"
                                },
                                "title": {
                                  "type": "string"
                                },
                                "url": {
                                  "format": "uri",
                                  "type": "string"
                                }
                              },
                              "required": ["description", "id", "imageUrl", "slug", "title", "url"],
                              "type": "object"
                            },
                            "description": {
                              "type": ["string", "null"]
                            },
                            "durationSeconds": {
                              "anyOf": [
                                {
                                  "exclusiveMinimum": 0,
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "id": {
                              "exclusiveMinimum": 0,
                              "maximum": 2147483647,
                              "type": "integer"
                            },
                            "imageUrl": {
                              "anyOf": [
                                {
                                  "format": "uri",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "publishedAt": {
                              "anyOf": [
                                {
                                  "format": "date-time",
                                  "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "slug": {
                              "type": "string"
                            },
                            "title": {
                              "type": "string"
                            },
                            "transcript": {
                              "additionalProperties": false,
                              "properties": {
                                "available": {
                                  "type": "boolean"
                                },
                                "url": {
                                  "anyOf": [
                                    {
                                      "format": "uri",
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                }
                              },
                              "required": ["available", "url"],
                              "type": "object"
                            },
                            "url": {
                              "format": "uri",
                              "type": "string"
                            }
                          },
                          "required": ["availability", "channel", "description", "durationSeconds", "id", "imageUrl", "publishedAt", "slug", "title", "transcript", "url"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "nextOffset": {
                        "anyOf": [
                          {
                            "maximum": 10000,
                            "minimum": 0,
