              "maxChars": {
                "default": 2000,
                "maximum": 4000,
                "minimum": 100,
                "type": "integer"
              },
              "query": {
                "description": "Optional literal case-insensitive phrase, searched only within this selected source; not global transcript search.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sourceId": {
                "exclusiveMinimum": 0,
                "maximum": 2147483647,
                "type": "integer"
              },
              "sourceType": {
                "enum": ["track", "special", "video"],
                "type": "string"
              },
              "textOffset": {
                "default": 0,
                "description": "Unicode character offset, not bytes or seconds. Use returned nextInput.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "trackOffset": {
                "default": 0,
                "description": "Special only: offset among its available transcript tracks, in catalog order. Keep unchanged while paging within a track.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["sourceId", "sourceType"],
