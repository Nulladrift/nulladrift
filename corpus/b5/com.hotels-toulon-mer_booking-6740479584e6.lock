      "instructions": "Ce serveur appartient à l’Hôtel-Rooftop Les Voiles (Toulon, Mourillon), qui vend en direct sans intermédiaire.\n\n· Les prix et les disponibilités s’obtiennent UNIQUEMENT par les outils. Ne jamais les estimer, ni les reprendre d’une réponse précédente : ils changent quand une chambre se vend.\n· Les prix rendus sont TOUT COMPRIS — petit-déjeuner et taxe de séjour inclus. Ne rien ajouter, ne pas annoncer de supplément à l’arrivée.\n· Les prix affichés sur le site public sont des « à partir de » indicatifs. Ne jamais les citer à côté d’un prix rendu par un outil : seul l’outil fait foi pour des dates données.\n· Si les dates demandées sont complètes, appeler `get_alternative_dates` avant de renoncer : l’hôtel a souvent de la place à quelques jours près.\n· Les questions sur la maison se répondent par `get_property_details` ou `search`, pas de mémoire.\n· Seul le tarif prépayé se réserve par agent : réglé en totalité, non remboursable, dates non modifiables. Le dire avant de faire payer.\n· Ce serveur vend aussi le Best Western Plus La Corniche (Toulon, face à la mer) : passer `property_id: \"corniche\"`. Sans `property_id`, il s’agit toujours de l’Hôtel-Rooftop Les Voiles. À La Corniche, le petit-déjeuner n’est pas compris.\n· Transmettre les liens rendus sans les modifier.",
      "tools": [
        {
          "name": "create_booking_session",
          "description": "Ouvre une session de réservation à l’Hôtel-Rooftop Les Voiles (Toulon, Mourillon) — ou au Best Western Plus La Corniche avec `property_id: \"corniche\"` — pour des dates et une occupation données. Le plus simple : `check_in`, `check_out` (AAAA-MM-JJ) et `adults`. La forme UCP `booking.stays[]` est acceptée aussi. Rend la chambre et le tarif réellement disponibles, le prix total en centimes d’euro, et une URL pour finaliser. Seuls les tarifs PRÉPAYÉS se réservent par agent : le séjour est réglé en totalité à la réservation, et n’est pas remboursable. Rend une erreur claire si l’hôtel est complet ou fermé sur la période.",
