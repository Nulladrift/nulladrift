          "digest": "sha256:88d854b43190ee6f7a2a0db42e9ef345ee8a0ef1cdd85f52099c0c93533be5f7"
        },
        {
          "name": "explicar_termino_porra",
          "title": "Explicar un término de porras",
          "description": "Explica un término del vocabulario de las porras deportivas (porra, quiniela, prode, polla, resultado exacto, lock mode...) con la definición del glosario de La Porra. Incluye equivalencias entre países.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "termino": {
                "description": "Término a explicar (porra, quiniela, prode, polla, resultado exacto, diferencia de goles, tendencia, lock mode, ranking, bonus, fase eliminatoria...). Ejemplo: \"prode\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["termino"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explicar un término de porras"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
