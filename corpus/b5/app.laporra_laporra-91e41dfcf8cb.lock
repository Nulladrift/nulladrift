        {
          "name": "listar_reglas_competicion",
          "title": "Listar reglas de una competición",
          "description": "Lista las reglas de una porra para una competición (LaLiga, Champions, F1, NBA, Mundial): jornadas, puntuación por defecto, sistemas de puntos y modos de cierre. Responde a cómo se juega o puntúa una porra de esa competición.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "competicion": {
                "description": "Competición concreta; si se omite se listan todas. Ejemplo: \"laliga\"",
                "enum": ["laliga", "champions", "f1", "nba", "mundial"],
                "type": "string"
              }
            },
            "type": "object"
