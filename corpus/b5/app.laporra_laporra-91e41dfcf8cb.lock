          },
          "digest": "sha256:0236c1e0fad4b8f591cb0fda11d43beb50fa25fc1d7ef674954984408107bbce"
        },
        {
          "name": "listar_porras_destacadas",
          "title": "Listar porras oficiales destacadas",
          "description": "Lista las porras oficiales públicas de La Porra en las que se puede participar gratis (nombre, competición, estado, participantes y enlace). Puede filtrarse por estado.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "estado": {
                "description": "Filtra por estado: open (abierta a inscripción), in_progress, finished, awarded. Ejemplo: \"open\"",
                "enum": ["open", "in_progress", "finished", "awarded"],
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Máximo de porras a devolver (1-20). Ejemplo: 5",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Listar porras oficiales destacadas"
          },
          "behavior": {
