      },
      "instructions": "Servidor MCP público y de solo lectura de La Porra (laporra.app), app de porras deportivas entre amigos. Calcula el bote de una porra, los puntos de un pronóstico, explica el vocabulario y lista las porras oficiales abiertas. No hay datos personales ni acciones de escritura. La Porra no gestiona dinero: solo lleva las cuentas. Responde siempre en español y, cuando des un dato o un cálculo, cita la fuente con el enlace de laporra.app que devuelve la herramienta. Usa calcular_bote_porra para repartos de dinero, calcular_puntos_porra para puntos de un pronóstico, explicar_termino_porra para vocabulario y listar_porras_destacadas para porras abiertas a las que unirse.",
      "tools": [
        {
          "name": "calcular_bote_porra",
          "title": "Calcular el bote de una porra",
          "description": "Calcula cuánto dinero acumula una porra con bote (los últimos de cada jornada ponen) y cómo se reparte entre los primeros. Responde a preguntas como cuánto se juntará o cuánto le toca a cada puesto en una porra entre amigos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aportacion_eur": {
                "description": "Euros que aporta cada pagador por jornada (0,5-50). Ejemplo: 2",
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "jornadas": {
                "description": "Jornadas con bote (1-60). LaLiga: 38, Champions: 17, F1: 24. Ejemplo: 38",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "pagadores": {
                "description": "Cuántos de los últimos de cada jornada ponen dinero (1-10, menos que los participantes). Ejemplo: 2",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "participantes": {
                "description": "Número de participantes de la porra (2-500). Ejemplo: 20",
                "maximum": 500,
                "minimum": 2,
                "type": "integer"
              },
              "reparto": {
                "description": "Porcentaje del bote por puesto, del primero hacia abajo; se normaliza a 100. Por defecto [60,25,15]. Ejemplo: [70,30]",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "number"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["aportacion_eur", "jornadas", "pagadores", "participantes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcular el bote de una porra"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5bee4cee14ae441badfc57b9aac91752b27274950636aa7b82c006a3f746f864"
        },
        {
          "name": "calcular_puntos_porra",
          "title": "Calcular los puntos de un pronóstico",
          "description": "Calcula cuántos puntos da un pronóstico de marcador frente al resultado real con las reglas de La Porra (exacto, diferencia de goles, tendencia, fallado). Sirve para dudas de puntuación y para comparar sistemas de puntos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "marcador_real": {
                "description": "Resultado real del partido",
                "properties": {
                  "local": {
                    "description": "Goles reales del equipo local (0-30). Ejemplo: 2",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "visitante": {
                    "description": "Goles reales del visitante (0-30). Ejemplo: 1",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["local", "visitante"],
                "type": "object"
              },
              "multiplicador_fase": {
                "default": 1,
                "description": "Multiplicador de la fase: 1 normal, 1.5 eliminatorias, 2 semifinales, 3 final. Se redondea al entero. Ejemplo: 1.5",
                "maximum": 10,
                "minimum": 0.1,
                "type": "number"
              },
              "pronostico": {
                "description": "Pronóstico del participante",
                "properties": {
                  "local": {
                    "description": "Goles pronosticados del local (0-30). Ejemplo: 3",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "visitante": {
                    "description": "Goles pronosticados del visitante (0-30). Ejemplo: 2",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["local", "visitante"],
                "type": "object"
              },
              "puntos_personalizados": {
                "description": "Solo con sistema \"personalizado\". Ejemplo: {\"exacto\":6,\"diferencia\":3,\"tendencia\":1,\"fallado\":0}",
                "properties": {
                  "diferencia": {
                    "description": "Puntos por diferencia de goles",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "exacto": {
                    "description": "Puntos por resultado exacto",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "fallado": {
                    "description": "Puntos por fallo",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tendencia": {
                    "description": "Puntos por tendencia (1X2)",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["diferencia", "exacto", "fallado", "tendencia"],
                "type": "object"
              },
              "sistema": {
                "default": "4-3-2-0",
                "description": "Sistema de puntos exacto-diferencia-tendencia-fallado. Por defecto 4-3-2-0, el de La Porra. Ejemplo: \"3-2-1\"",
                "enum": ["4-3-2-0", "3-2-1", "5-2-1", "personalizado"],
                "type": "string"
              }
            },
            "required": ["marcador_real", "pronostico"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcular los puntos de un pronóstico"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
