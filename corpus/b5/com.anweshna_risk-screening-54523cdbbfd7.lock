{
  "lockfileVersion": 2,
  "subjects": {
    "com.anweshna/risk-screening": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://anweshna.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "anweshna",
        "title": "Anweshna — M&A risk screening",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Screen M&A deal documents for risk across 15 categories and retrieve the resulting scored analysis. Every call is billed against the caller's Anweshna plan and is subject to that plan's upload quota. Results are document-level risk screening, not full due diligence: there is no independent verification and no primary research.",
      "tools": [
        {
          "name": "bulk_screen",
          "description": "Upload up to 25 documents and screen them as one batch. Waits for text extraction, then starts scoring and returns job ids; poll get_bulk_status until the batch is finished. Each item is {title, content_base64 | text, filename?}. The 25-document limit is not the binding one for large files: the whole call must stay under 32 MB including base64 overhead, so send fewer, larger documents per batch rather than filling all 25 slots. Exceeding it is a bare HTTP 413 from the transport, before this tool runs. To RESUME a batch that was uploaded but not scored — this tool timed out waiting for extraction, or scoring failed to start — call it again with 'bulk_job_id' instead of 'documents'. That re-uses the existing upload and does NOT spend the account's quota a second time. If the batch is rejected because one or more documents are too large for the plan's scan engine, retry with force_precision=true to scan those documents truncated to the recall window (coverage beyond it is excluded).",
          "inputSchema": {
            "properties": {
              "bulk_job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Bulk Job Id"
              },
              "deal_room_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Deal Room Id"
              },
              "document_type": {
                "default": "Report",
                "title": "Document Type",
                "type": "string"
              },
              "documents": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Documents"
              },
              "engine": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Engine"
              },
              "force_precision": {
                "default": false,
                "title": "Force Precision",
                "type": "boolean"
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Industry"
              }
            },
            "title": "bulk_screenArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4991a31bec9cd1794793661b0b479f1fa507fc64883ba07853781c992cf96e7"
        },
        {
          "name": "get_analysis",
          "description": "Retrieve the stored risk analysis for a document already screened by this account. Read-only.",
          "inputSchema": {
            "properties": {
              "document_id": {
                "title": "Document Id",
                "type": "string"
              }
            },
            "required": ["document_id"],
            "title": "get_analysisArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8698675a6350664dd318a1102134d892ce3a33546c038a89c56127b7df335e27"
        },
        {
          "name": "get_bulk_status",
          "description": "Check progress of a batch started by bulk_screen. Pass the upload_job_id, the analyze_job_id, or both.",
          "inputSchema": {
            "properties": {
              "analyze_job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Analyze Job Id"
              },
              "upload_job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Upload Job Id"
              }
            },
            "title": "get_bulk_statusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5319f74dc18833171d869dad33781b1b625d26c5b7b42d0ff26d4ca82ee921c4"
        },
        {
          "name": "screen_document",
          "description": "Upload a deal document and score it for risk across 15 categories. Returns the overall score, rating, whether the deal is flagged as blocked, and per-category findings. Provide the file either as 'content_base64' (PDF, DOCX, TXT or CSV) or as plain 'text'. The whole call must stay under 32 MB, and base64 adds about a third, so the document itself should be under roughly 24 MB — a larger one is rejected by the transport before this tool runs, which surfaces as a bare HTTP 413 rather than a normal tool error. Use the REST upload endpoint for anything bigger.",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Content Base64"
              },
              "deal_room_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Deal Room Id"
              },
              "document_type": {
                "default": "Report",
                "title": "Document Type",
                "type": "string"
              },
              "engine": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Engine"
              },
              "filename": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Filename"
              },
              "force_precision": {
                "default": false,
                "title": "Force Precision",
                "type": "boolean"
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Industry"
              },
              "text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Text"
              },
              "title": {
                "title": "Title",
                "type": "string"
              }
            },
            "required": ["title"],
            "title": "screen_documentArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a10a48122cc89029993a3dc83ef53fbb5bba20a607dc78b428526911dad45b1"
        }
