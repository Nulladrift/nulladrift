                      },
                      "type": "array"
                    },
                    "title": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["items", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "language": {
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "vocabulary": {
                "type": "string"
              },
              "word": {
                "type": "string"
              }
            },
            "required": ["groups", "language", "type", "vocabulary", "word"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
