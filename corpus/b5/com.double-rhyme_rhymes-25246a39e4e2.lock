{
  "lockfileVersion": 2,
  "subjects": {
    "com.double-rhyme/rhymes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.double-rhyme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "doppelreim-rhymes",
        "title": "Doppelreim Rhymes",
        "version": "1.0.0",
        "websiteUrl": "https://double-rhyme.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Rhyme dictionary from Doppelreim (double-rhyme.com), built for rap lyrics, poems and songs.\nUse it whenever you write or improve rhyming text instead of guessing rhymes yourself.\n- find_rhymes with type \"double\" gives multisyllabic rhymes (several matching syllables, e.g. \"verloren\" -> \"geboren\", \"geschworen\"); \"classic\" gives perfect end rhymes grouped by how many syllables match; \"vowel\" gives assonance (same vowels, different consonants).\n- find_rhyming_lines returns real lyric/proverb lines that end with a rhyme on the word.\n- vocabulary \"rap\" (German and English only) draws from rap lyrics instead of general language.\n- One word or a short phrase per call; for a phrase the rhyme is on its ending.\nFree to use; each client has 1000 tool calls per day.",
      "tools": [
        {
          "name": "find_rhymes",
          "title": "Find rhymes",
          "description": "Find rhymes for a word or short phrase. type \"double\" = multisyllabic rhymes (best for rap and poetry), \"classic\" = perfect end rhymes grouped by matching syllables, \"vowel\" = assonance (same vowel sounds). 50+ languages; strongest results come first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language code. Supported: af, ar, az, bg, bs, ca, cs, cy, da, de, el, en-us, eo, es, es_lat, et, eu, fa, fi, fr, fr_be, fr_ch, hi, hr, hu, hy, hy_arevmda, id, it, ka, kn, ko, la, lt, lv, mk, ml, ms, nl, no, pl, pt, pt_br, ro, ru, sk, sl, sq, sr, sv, ta, te, tr, ur, vi, zh (\"en\" = \"en-us\").",
                "maxLength": 12,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 30,
                "description": "Maximum results per group.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "default": "double",
                "description": "Kind of rhyme.",
                "enum": ["double", "classic", "vowel"],
                "type": "string"
              },
              "vocabulary": {
                "default": "general",
                "description": "\"rap\" draws from rap lyrics (de and en only), \"general\" from general language.",
                "enum": ["general", "rap"],
                "type": "string"
              },
              "word": {
                "description": "Word or short phrase to rhyme on, e.g. \"verloren\" or \"heart\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["items", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "language": {
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "vocabulary": {
                "type": "string"
              },
              "word": {
                "type": "string"
              }
            },
            "required": ["groups", "language", "type", "vocabulary", "word"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ed21d81b12a0e74aa5653f0b3321048ffba5e874e02e3df1461db696e4a4c6f"
        },
        {
          "name": "find_rhyming_lines",
          "title": "Find rhyming lines",
          "description": "Find real lines (lyrics, proverbs, sayings) that end with a rhyme on the given word. Useful as inspiration for the next line of a verse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language code. Supported: af, ar, az, bg, bs, ca, cs, cy, da, de, el, en-us, eo, es, es_lat, et, eu, fa, fi, fr, fr_be, fr_ch, hi, hr, hu, hy, hy_arevmda, id, it, ka, kn, ko, la, lt, lv, mk, ml, ms, nl, no, pl, pt, pt_br, ro, ru, sk, sl, sq, sr, sv, ta, te, tr, ur, vi, zh (\"en\" = \"en-us\").",
                "maxLength": 12,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum number of lines.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "vocabulary": {
                "default": "general",
                "description": "\"rap\" uses rap lyrics (de and en only), \"general\" uses proverbs and general texts.",
                "enum": ["general", "rap"],
                "type": "string"
              },
              "word": {
                "description": "Word the lines should rhyme with.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
