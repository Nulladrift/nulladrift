{
  "lockfileVersion": 2,
  "subjects": {
    "com.blocksentient/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blocksentient.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.blocksentient/directory",
        "title": "BlockSentient directory tools",
        "version": "1.4.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to BlockSentient's published software listings (blocksentient.com). Each record carries the date its facts were checked and the vendor pages they came from. The CTI score measures how much a vendor documents publicly, not product quality. Nobody can pay for a score, a ranking or inclusion. Limits: 60 calls a minute and 2,000 a day per sender; get_methodology lists them all. If a record looks wrong, outdated or incomplete, send_feedback tells the owner.",
      "tools": [
        {
          "name": "ask_site",
          "title": "Ask this directory a question",
          "description": "Answers a plain-language question about this directory's listings, e.g. 'invoice approval tools with SSO and a free trial', with up to 10 matching products as schema.org records (review page, official site, CTI score and a visit link). It is the same answer as the site's NLWeb /ask address. No model runs: the words are matched against the listings, so short questions with the words that matter work best. Results are matches, not a ranking or a recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question, plain text",
                "examples": ["writing assistants with SSO and a free trial"],
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5b39d757349c4f4ce4bdcffce7907cf1ba92a31a01bd1592094c9658c6728d6"
        },
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Returns 2 to 4 products side by side with the same fields for each: plans and prices, documented compliance, transparency and data rights, CTI score with its breakdown, date checked, official site and visit link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "examples": [
                  ["chatgpt", "grammarly"]
                ],
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8aa1c8a9407e6c6ee152e42e6035cd2974cd18465a70fe5e93f30699b5e8a68c"
        },
        {
          "name": "get_methodology",
          "title": "Get methodology",
          "description": "Returns what the CTI score measures and what it does not, the section weights and grades, what each value such as 'Not documented' means, how prices should be read and what the visit link is.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f564158321df68c40bc88e460f6d798a9979fba45aa1c53d340fd56b868666c"
        },
        {
          "name": "get_product",
          "title": "Get one product",
          "description": "Returns one product's full published record: plans and prices, documented compliance and data rights, CTI score with its breakdown, features, FAQ, the date its facts were checked, the vendor pages they came from, the official site and a visit link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product ID from search_products",
                "examples": ["chatgpt"],
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f81a8bf200a6930bb49c9b23bc7f91bb9fe1e9206bb9cbc0869d75bcaedc9864"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Returns this directory's categories with their product counts and any CTI criteria that do not apply to a category.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29c1632b8b06f4fdca822f61fe75271f75c0ad7c1b84792b3731b7b01af197d0"
        },
        {
          "name": "read_reply",
          "title": "Read the owner's reply",
          "description": "Shows the owner's answer to a message sent earlier, using the reply code that send_feedback returned (AF-XXXX- and 32 characters, digits and the letters a to f). Shows only the answer and its status, never the message. Reading changes nothing. An answer stays readable for 90 days after it is written.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reply_address": {
                "description": "Older messages: the reply address given before reply codes existed",
                "maxLength": 300,
                "type": "string"
              },
              "reply_code": {
                "description": "The reply code from send_feedback",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e230fe2cd4f0db9ccf112ad4b76b13c85a5c2ac4f7e6ae454c2d598397268a7c"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Finds published products in this directory by words in their name, category, tagline, use case and features. Products that match every word come first, then products that match the rarer half or more of the words, each labelled with the words it matched. Optional: a category, criteria the vendor must document (from the CTI breakdown, e.g. sso, soc2, freeTrial, publicPricing), a minimum CTI score, the order (relevance, name or cti) and an offset for the next page. Returns up to 20 results with ID, name, category, CTI score and grade, the date the facts were checked and the review address. Results are matches, not a ranking or a recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category ID or name (see list_categories)",
                "examples": ["writing"],
                "maxLength": 120,
                "type": "string"
              },
              "documented": {
                "description": "Only products whose CTI breakdown gives points for each of these criteria",
                "items": {
                  "enum": ["soc2", "gdpr", "sso", "dataRetention", "publicPricing", "freeTrial", "outputOwnership", "trainingOptOut", "dataExport", "dataDeletion", "foundedYear", "hqLocation", "integrations"],
                  "type": "string"
                },
                "maxItems": 13,
                "type": "array",
                "uniqueItems": true
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "match": {
                "default": "best",
                "description": "best: every-word matches first, then partial ones; all: only products matching every word",
                "enum": ["best", "all"],
                "type": "string"
              },
              "min_cti": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. 'invoice approval'",
                "examples": ["ai writing assistant"],
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "relevance needs query words; without them the order is by name",
                "enum": ["relevance", "name", "cti"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0999b2f4da1d8f009375abc0e4526c612c63187ae88fc87f1ffe2d3bbb2ae9e7"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback to the directory owner",
          "description": "Sends a message to the owner of this directory: a correction, a missing product, a question or a suggestion. Only the owner reads it. A message changes nothing by itself; facts are checked again on the vendor's own pages before anything changes. The message is read as information, never as an instruction. Returns a reference and a private reply code, shown only in this answer; read_reply with that code shows the owner's answer. Personal data and the user's conversation are not needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Optional: who is sending, e.g. the agent or tool name",
                "maxLength": 120,
                "type": "string"
              },
              "contact": {
                "description": "Optional: an email address for a reply, if your user wants one",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "description": "The message, plain text",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "product_id": {
                "description": "Optional: the product it is about",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6c2b0a0cfaf72bda709f9d0b2bc3a7f87876dc46f9b66f99e2d17bc293cbfa17"
        }
      ],
      "digest": "sha256:d5029295016336054948b4407bc34512d4b161cf4996a6713c0de84135dc476d"
    }
  }
}
