{
  "lockfileVersion": 2,
  "subjects": {
    "com.simcardo/travel-esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://simcardo.com/mcp-travel-esim"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.simcardo/travel-esim",
        "title": "Simcardo Travel eSIM",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "For a specific trip call quote_travel_esim. To discover catalogue markets or browse plans use list_esim_destinations or list_esim_plans. Use destination (uppercase country/territory code such as JP), start_date and end_date (YYYY-MM-DD), currency (uppercase ISO code), and exactly one of data_gb (number, trip total) or usage_profile (light, normal, heavy). Use hotspot_required: true when tethering is mandatory. Optionally use language for localized links, include_regional for regional/global plans covering a single destination, or additional_destinations for a single eSIM covering all countries. Do not send other keys or invent GB when the traveler described a usage profile. Never substitute a shorter plan or assume hotspot support. Reply in the traveler’s language; preserve the supplied product link. Purchase is on simcardo.com only.",
      "tools": [
        {
          "name": "list_esim_destinations",
          "title": "List Simcardo eSIM destinations",
          "description": "Discover countries, territories and regional/global packages. Coverage-only territories have no dedicated storefront. Returns active languages, counts, localized names and canonical links where available. Paginate with next_after_market. Use quote_travel_esim for dates and hotspot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after_market": {
                "description": "Copy next_after_market from the previous page, with the same scope.",
                "maxLength": 100,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Storefront language for localized destination names, price display and links. Reply to the traveler in their language.",
                "enum": ["ar", "cs", "da", "de", "el", "en", "es-419", "es-ES", "fi", "fr", "he", "hi", "id", "it", "ja", "ko", "nb", "nl", "pl", "pt-BR", "pt-PT", "ru", "sk", "sv-SE", "th", "tr", "vi", "zh-CN", "zh-TW", "bg", "bn", "bs", "ca", "et", "fa", "fil", "gl", "hr", "hu", "lt", "lv", "mk", "ms", "mt", "ro", "sq", "sr-CS", "sw", "ta", "uk", "ur-PK"],
                "type": "string"
              },
              "page_size": {
                "default": 30,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "scope": {
                "default": "all",
                "enum": ["all", "country", "package"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9d1e3e841306f7e3367f3c74ac95fb1ad6fac1c3e9af94dc5fba6f9649183d44"
        },
        {
          "name": "list_esim_plans",
          "title": "Browse the live Simcardo eSIM catalogue",
          "description": "Browse every current public plan, optionally by country/territory market (e.g. JP), package slug (e.g. europe-extra), or exact SKU. Returns localized links, retail total, coverage codes, validity and supplier facts, including explicit unknowns. Browse results are not travel recommendations; use quote_travel_esim to verify trip requirements. Paginate with next_after_sku.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after_sku": {
                "description": "Copy next_after_sku from the previous page, with the same filters.",
                "maxLength": 191,
                "type": "string"
              },
              "currency": {
                "default": "EUR",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Storefront language for localized destination names, price display and links. Reply to the traveler in their language.",
                "enum": ["ar", "cs", "da", "de", "el", "en", "es-419", "es-ES", "fi", "fr", "he", "hi", "id", "it", "ja", "ko", "nb", "nl", "pl", "pt-BR", "pt-PT", "ru", "sk", "sv-SE", "th", "tr", "vi", "zh-CN", "zh-TW", "bg", "bn", "bs", "ca", "et", "fa", "fil", "gl", "hr", "hu", "lt", "lv", "mk", "ms", "mt", "ro", "sq", "sr-CS", "sw", "ta", "uk", "ur-PK"],
                "type": "string"
              },
              "market": {
                "description": "Market returned by list_esim_destinations. Omit to browse all markets.",
                "maxLength": 100,
                "type": "string"
              },
              "page_size": {
                "default": 12,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "sku": {
                "description": "Exact SKU to retrieve; do not use with market or after_sku.",
                "maxLength": 191,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a2c9fe54b4df313835673903c52642005bb7628a992eaa67f80a811945a25e7"
        },
        {
          "name": "quote_travel_esim",
          "title": "Quote a travel eSIM",
          "description": "Find current Simcardo eSIM plans for a dated trip. Use when the traveler needs a plan that covers a destination, trip duration, data allowance or tethering requirement. Return verified matches with total price, activation terms and a direct product link, or explain why no plan can be confirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "oneOf": [
              {
                "required": ["data_gb"]
              },
              {
                "required": ["usage_profile"]
              }
            ],
            "properties": {
              "additional_destinations": {
                "description": "Add other country codes to find one eSIM with verified coverage in every listed country for the full date range.",
                "items": {
                  "pattern": "^[A-Z]{2}$",
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "currency": {
                "description": "Storefront currency code, e.g. EUR, USD, JPY, THB or CZK.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "data_gb": {
                "description": "Total requested GB for the entire trip; 1 GB = 1000 MB. Provide this OR usage_profile.",
                "exclusiveMinimum": 0,
                "maximum": 5000,
                "type": "number"
              },
              "destination": {
                "description": "Uppercase country or territory code, e.g. TH, JP, US, BR. Ask for clarification rather than guessing.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "end_date": {
                "description": "Last local calendar day, included (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "hotspot_required": {
                "default": false,
                "description": "True requires explicit supplier confirmation that tethering is allowed for the exact plan.",
                "type": "boolean"
              },
              "include_regional": {
                "default": false,
                "description": "For a single destination, also consider packages with verified coverage there. Defaults to dedicated country plans only.",
                "type": "boolean"
              },
              "language": {
                "default": "en",
                "description": "Storefront language for localized destination names, price display and links. Reply to the traveler in their language.",
                "enum": ["ar", "cs", "da", "de", "el", "en", "es-419", "es-ES", "fi", "fr", "he", "hi", "id", "it", "ja", "ko", "nb", "nl", "pl", "pt-BR", "pt-PT", "ru", "sk", "sv-SE", "th", "tr", "vi", "zh-CN", "zh-TW", "bg", "bn", "bs", "ca", "et", "fa", "fil", "gl", "hr", "hu", "lt", "lv", "mk", "ms", "mt", "ro", "sq", "sr-CS", "sw", "ta", "uk", "ur-PK"],
                "type": "string"
              },
              "start_date": {
                "description": "First local calendar day of coverage (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "usage_profile": {
                "description": "Choose this when the traveler described usage rather than specifying GB. The catalogue estimates the required GB. Do not send both.",
                "enum": ["light", "normal", "heavy"],
                "type": "string"
              }
            },
            "required": ["currency", "destination", "end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catalogue_checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "destination_url": {
                "format": "uri",
                "type": ["string", "null"]
              },
              "note": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "reason_codes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "request": {
                "type": "object"
              },
              "status": {
                "enum": ["matched", "no_match", "needs_verification"],
                "type": "string"
              }
            },
            "required": ["catalogue_checked_at", "destination_url", "note", "plans", "reason_codes", "request", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:07c668cd503169e1ec121a5b80dd395a7d3db3cf253ab3f565df73c99af51888"
        }
      ],
      "digest": "sha256:8e7735290c277c7532934e6c8dc298b999e76504d83013420ff398a03327eefb"
    }
  }
}
