{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobven/jobven": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.jobven.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "jobven",
        "title": "Jobven",
        "version": "1.0.0",
        "description": "Job postings collected directly from employer career sites, through the Jobven API.",
        "websiteUrl": "https://jobven.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Jobven serves job postings collected directly from employer career sites. search_jobs and get_job read jobs, search_companies and get_company read employers, and each result carries the REST request it made, as a URL and a curl command, ready to use in code. webhook_example returns a signed sample webhook delivery with verification code. Calls are metered like the REST API: each job returned and each company profile counts toward the key's monthly allowance; search_companies is free, and webhook_example needs no key.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a company",
          "description": "One employer's profile by id (GET /v1/public/company-profiles/{id}): what it does, industry, size, founding year, headquarters and social links. Counts as one toward the monthly allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "A company id from search_companies",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "company": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "request": {
                "additionalProperties": false,
                "description": "The REST call this result came from. curl reads the key from $JOBVEN_API_KEY.",
                "properties": {
                  "curl": {
                    "type": "string"
                  },
                  "method": {
                    "const": "GET",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["curl", "method", "url"],
                "type": "object"
              }
            },
            "required": ["company", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87fd5f63d05019c54d884f6cdd737ece26d7e4623d20fa9acfe47b1f942cc126"
        },
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "One Jobven job posting by id, with the full description (GET /v1/public/jobs/{id}). Counts as one job toward the monthly allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "descriptionFormat": {
                "description": "Description as plain text (default) or markdown",
                "enum": ["plain", "markdown"],
                "type": "string"
              },
              "id": {
                "description": "A job id from search_jobs",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "job": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "request": {
                "additionalProperties": false,
                "description": "The REST call this result came from. curl reads the key from $JOBVEN_API_KEY.",
                "properties": {
                  "curl": {
                    "type": "string"
                  },
                  "method": {
                    "const": "GET",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["curl", "method", "url"],
                "type": "object"
              }
            },
            "required": ["job", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861d786f0db827e3d169e6a295fbccf70fe4b244b0f485ec27c75e7512ffdbfa"
        },
        {
          "name": "search_companies",
          "title": "Search companies",
          "description": "Find employers Jobven collects jobs from by name (GET /v1/public/companies). Returns id, name and website; get_company has the profile. Free: company searches do not count toward the allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "isVerified": {
                "description": "Only verified, or only unverified, companies",
                "type": "boolean"
              },
              "limit": {
                "description": "Companies per page, default 10, at most 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number, from 1",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Company name or website contains this text",
                "maxLength": 200,
                "type": "string"
              },
              "sortBy": {
                "description": "Sort field",
                "enum": ["name", "foundedYear", "totalJobsPosted", "activeJobsCount", "createdAt"],
                "type": "string"
              },
              "sortOrder": {
                "enum": ["ASC", "DESC"],
                "type": "string"
              },
              "status": {
                "description": "\"active\" or \"inactive\"; both when unset",
                "enum": ["active", "inactive"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "companies": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "request": {
                "additionalProperties": false,
                "description": "The REST call this result came from. curl reads the key from $JOBVEN_API_KEY.",
                "properties": {
                  "curl": {
                    "type": "string"
                  },
                  "method": {
                    "const": "GET",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["curl", "method", "url"],
                "type": "object"
              }
            },
            "required": ["companies", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search companies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c367c245a34d431de59ee88c0477381ffa6ed4961808d539c56a2ef7a32d3dc4"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search Jobven job postings with the filters of GET /v1/public/jobs. Returns 10 jobs by default (at most 25) with a plain-text excerpt of each description; get_job has the full text. Pass nextCursor back as cursor, with the same filters, for the next page. Each job returned counts toward the monthly allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ats": {
                "description": "Platform the posting is published on, any of, e.g. [\"workday\", \"greenhouse\"]",
                "items": {
                  "enum": ["adp", "appvault", "ashby", "avature", "bamboohr", "beesite", "brassring", "breezy", "catsone", "ceipal", "clearcompany", "collage", "comeet", "cornerstone", "darwinbox", "dayforce", "deel", "directemployers", "dover", "easyapply", "eightfold", "gem", "getnoticed", "greenhouse", "hibob", "hireology", "hrsmart", "icims", "jazzhr", "jobdiva", "jobvite", "join", "kula", "lever", "njoyn", "oracle", "paradox", "paycor", "paylocity", "personio", "phenom", "pinpoint", "prevue", "radancy", "recruitee", "rippling", "smartrecruiters", "successfactors", "talentnest", "taleo", "teamtailor", "ukg", "workable", "workday"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "city": {
                "description": "City, comma-separated; case and accents are ignored",
                "maxLength": 500,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"US\", \"CA\", \"GB\". \"XX\" matches jobs with no location at all.",
                "maxLength": 2,
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from the previous search_jobs result, same filters",
                "maxLength": 1000,
                "type": "string"
              },
              "descriptionQuery": {
                "description": "Search job descriptions for a whole-word phrase, matched literally, case-insensitive. Slower than the other filters; pair it with postedAfter.",
                "maxLength": 200,
                "type": "string"
              },
              "employmentType": {
                "description": "Employment type, any of",
                "items": {
                  "enum": ["full_time", "part_time", "contract", "internship", "seasonal", "volunteer", "temporary", "per_diem", "other"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "experienceLevel": {
                "description": "Experience level, any of",
                "items": {
                  "enum": ["entry", "mid", "senior", "lead", "executive"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "hasRelocation": {
                "description": "true: postings that offer relocation help; false: postings that say they do not",
                "type": "boolean"
              },
              "hasVisaSponsorship": {
                "description": "true: postings that offer visa sponsorship; false: postings that say they do not",
                "type": "boolean"
              },
              "includeTotal": {
                "description": "Also count every match (slower)",
                "type": "boolean"
              },
              "industry": {
                "description": "Industries, any of (up to 10)",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Required spoken language, ISO 639-1 code, e.g. \"fr\"",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Jobs per page, default 10, at most 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "listedAfter": {
                "description": "Listed at or after (Unix seconds), by listedAt: for incremental sync",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "location": {
                "description": "Free-text location: city, region or country",
                "maxLength": 200,
                "type": "string"
              },
              "maxSalary": {
                "description": "Maximum yearly starting pay, as minSalary",
                "minimum": 0,
                "type": "number"
              },
              "minSalary": {
                "description": "Minimum yearly pay; hourly, daily, weekly and monthly pay is compared per year. In each job's own currency unless salaryCurrency is set",
                "minimum": 0,
                "type": "number"
              },
              "order": {
                "description": "Default DESC",
                "enum": ["ASC", "DESC"],
                "type": "string"
              },
              "postedAfter": {
                "description": "Posted at or after (Unix seconds)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "postedBefore": {
                "description": "Posted before (Unix seconds)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Search job titles by whole word. Words are ANDed in any order; \"double quotes\" match an exact phrase, OR matches either side, and a leading - excludes a word. Case-insensitive. Does not search descriptions (see descriptionQuery).",
                "maxLength": 200,
                "type": "string"
              },
              "remoteType": {
                "description": "Remote type, any of",
                "items": {
                  "enum": ["onsite", "remote", "hybrid", "flexible"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "salaryCurrency": {
                "description": "ISO 4217 currency code of the salary, e.g. USD, EUR, PLN",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "skills": {
                "description": "Skills, any of (up to 10), e.g. [\"typescript\", \"react\"]",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "sortBy": {
                "description": "Sort field (default postedAt)",
                "enum": ["postedAt", "listedAt", "title", "company"],
                "type": "string"
              },
              "state": {
                "description": "State, province or region, comma-separated: full name (\"Ontario\") or, for the US and Canada, the postal code (\"ON\")",
                "maxLength": 500,
                "type": "string"
              },
              "status": {
                "description": "\"active\" (the default) or \"closed\"",
                "enum": ["active", "closed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hasMore": {
                "type": "boolean"
              },
              "jobs": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "type": "string"
              },
              "request": {
                "additionalProperties": false,
                "description": "The REST call this result came from. curl reads the key from $JOBVEN_API_KEY.",
                "properties": {
                  "curl": {
                    "type": "string"
                  },
                  "method": {
                    "const": "GET",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["curl", "method", "url"],
                "type": "object"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["hasMore", "jobs", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fbab728e09d1c52d17993003969ad2af02a426b20a3cace3c94864e8fb1fe95"
        },
        {
          "name": "webhook_example",
          "title": "Webhook example",
          "description": "A sample Jobven webhook delivery for one event: the raw body and headers exactly as a receiver gets them, signed with an example secret, plus the signature verifier from the webhook docs in TypeScript, Python or Go. The verifier accepts the sample, so a receiver can be tested end to end. No API call, no key needed, free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "event": {
                "description": "The event to show a delivery of",
                "enum": ["job.created", "job.updated", "job.closed", "job.deleted"],
                "type": "string"
              },
              "language": {
                "description": "Language of the signature verifier",
                "enum": ["typescript", "python", "go"],
                "type": "string"
              }
            },
            "required": ["event", "language"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "event": {
                "type": "string"
              },
              "exampleSecret": {
                "type": "string"
              },
              "headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "language": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rawBody": {
                "type": "string"
              },
              "verifier": {
                "type": "string"
              }
            },
            "required": ["event", "exampleSecret", "headers", "language", "note", "rawBody", "verifier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Webhook example"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ba52d5e541a615e39eeb5c1b699f6b40a8ef64bd198406fc721f65a9db99490"
        }
      ],
      "digest": "sha256:d5254102afe7219317398e194b9132d970328940c6ac30648e256cc39dd980cd"
    }
  }
}
