{
  "lockfileVersion": 2,
  "subjects": {
    "co.developh/studio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.developh.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "developh",
        "version": "1.0.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Developh is a design and development studio in Lisbon, Portugal: websites, online stores, brand identity and web apps. Use studio_info for facts about the studio and list_case_studies for its published client work, by sector or service. run_website_audit runs a Google PageSpeed Insights mobile audit of any public website. request_contact sends an inquiry to the team with the person's own name, email and message, after they confirm it.",
      "tools": [
        {
          "name": "list_case_studies",
          "title": "Developh case studies",
          "description": "Published client work by Developh with links to each case study. Filter by sector (restaurants, tourism, clinics) or service (websites, online stores, branding, web apps) to get what was built in each case; with no filter, lists every published project.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Answer language: English (en) or European Portuguese (pt).",
                "enum": ["en", "pt"],
                "type": "string"
              },
              "sector": {
                "description": "Sector: restaurants, tourism, clinics.",
                "enum": ["restaurants", "tourism", "clinics"],
                "type": "string"
              },
              "service": {
                "description": "Service: websites, online-stores, branding, web-apps.",
                "enum": ["websites", "online-stores", "branding", "web-apps"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Developh case studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3c7ca2b5e84b188a4708bfa42cf2e8d8eaa2b50666cfa067e909e1bcac56a17"
        },
        {
          "name": "request_contact",
          "title": "Contact the Developh team",
          "description": "Sends a project inquiry or question to the Developh team with the person's own name, email and message. It writes: it creates an inquiry and emails the person a confirmation. The team usually replies by email within 2 to 8 business hours. Requires confirmed=true, which records that the person reviewed the message and asked for it to be sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "availability": {
                "description": "When they can take a first call, e.g. weekday mornings, Lisbon time.",
                "maxLength": 300,
                "type": "string"
              },
              "company": {
                "description": "Company or business name, if they gave one.",
                "maxLength": 200,
                "type": "string"
              },
              "confirmed": {
                "const": true,
                "description": "Records that the person reviewed the message and asked for it to be sent. Must be true.",
                "type": "boolean"
              },
              "email": {
                "description": "The person's own email address. The confirmation and the reply go here.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Answer language: English (en) or European Portuguese (pt).",
                "enum": ["en", "pt"],
                "type": "string"
              },
              "message": {
                "description": "What they need, in their words: the project, goals, timeline and budget if known.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "The person's name, as they gave it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Phone number, only if they gave it.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["confirmed", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Contact the Developh team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d53d626795b44a4a93c2e4845c26c8e1208e855a50f9100eec01572700cf95bd"
        },
        {
          "name": "run_website_audit",
          "title": "Free website audit: speed, SEO and accessibility",
          "description": "Free audit of any public website, for questions like \"why is my website slow?\", \"check my site speed\", \"audit my website SEO\" or, in Portuguese, \"porque é que o meu website está lento?\" and \"auditoria ao meu website\". Runs the Google PageSpeed Insights API (https://developers.google.com/speed/docs/insights/v5/get-started) on mobile and returns performance, accessibility, best-practices and SEO scores, Core Web Vitals, the issues that weigh most on the score, missing security headers and page weight. Takes 20 to 90 seconds. Only public http(s) addresses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Answer language: English (en) or European Portuguese (pt).",
                "enum": ["en", "pt"],
                "type": "string"
              },
              "url": {
                "description": "Public website address, e.g. example.pt or https://www.example.com/page.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free website audit: speed, SEO and accessibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:76c8716c2ee083f4a79f1b7c1dbdd31476cb908996fbd1138445835ac493f704"
        },
        {
          "name": "studio_info",
          "title": "Developh studio profile",
          "description": "Facts about Developh, a design and development studio in Lisbon, Portugal: address, team, services, sectors with case studies, timelines, how projects are priced and how to get in touch.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Answer language: English (en) or European Portuguese (pt).",
                "enum": ["en", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Developh studio profile"
          },
          "behavior": {
