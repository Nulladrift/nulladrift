{
  "lockfileVersion": 2,
  "subjects": {
    "com.fansfera/fansfera": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fansfera.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fansfera",
        "title": "Fansfera",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Fansfera is a worldwide sponsorship directory for niche sports. Use search_venues and sports_and_countries to find options, price_reference for a country-level panel price, and request_quote only after the user confirms. Never present the reference as a company price.",
      "tools": [
        {
          "name": "price_reference",
          "title": "Billboard price reference by country",
          "description": "Monthly reference (US$) of a printed and a digital panel in a country, with how it was obtained. Not a quote.",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Billboard price reference by country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:208336d3caac77d80c5cd48c9c9d49ee81efebf1085322e5335055bf24d58b53"
        },
        {
          "name": "request_quote",
          "title": "Request sponsorship quotes",
          "description": "Send a free quote request to Fansfera for one or more venues. Before calling, show the user the venues and their own data and get explicit confirmation. No payment is made.",
          "inputSchema": {
            "properties": {
              "budget_usd": {
                "type": "integer"
              },
              "company": {
                "type": "string"
              },
              "confirmed_by_user": {
                "description": "true only after the user explicitly confirmed",
                "type": "boolean"
              },
              "email": {
                "type": "string"
              },
              "language": {
                "enum": ["en", "pt", "es"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "months": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "venue_ids": {
                "items": {
                  "type": "integer"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["confirmed_by_user", "email", "name", "venue_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request sponsorship quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c42fb7e55e1d9dfd24abb1a16e8171b03cf4b9812abc9ea8c5745d92d309b45c"
        },
        {
          "name": "search_venues",
          "title": "Search sponsorship venues",
          "description": "Search companies (venues, chains, organisers) in niche sports where a brand can request sponsorship. Sports keys: kart=karting, surf=surf park / wave pool, padel=padel, beach=beach tennis, escalada=indoor climbing, trampolim=trampoline park, tunel=indoor skydiving, wake=wakeboard cable park, mergulho=scuba diving, neve=skiing and snow, hipismo=equestrian, rafting=rafting, volei=beach volleyball, kite=kitesurfing, vela=sailing. Countries use ISO codes (BR, US, ES...).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166 alpha-2 code",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "enum": ["kart", "surf", "padel", "beach", "escalada", "trampolim", "tunel", "wake", "mergulho", "neve", "hipismo", "rafting", "volei", "kite", "vela"],
                "type": "string"
              },
              "text": {
                "description": "name or city",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sponsorship venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:076cfb48442b552800b5004501b0beff06309dc1d09c0c96fda2afca41180d98"
        },
        {
          "name": "sports_and_countries",
          "title": "Sports and countries",
          "description": "How many companies are listed per sport and per country.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sports and countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6500c07165b7438a9234e95cfcdc4f7aaa3ecab19fd5524d0df181453c3ae638"
        },
        {
          "name": "venue_details",
          "title": "Venue details",
          "description": "Public details of one venue, the sponsorship formats that can be requested and the country price reference (not the company price).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Venue details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9bbafb99055cd6b05db11e412fdabe21d4421d8c5408b2a0d9069239d19800d"
        }
      ],
      "digest": "sha256:28ed02270ee497c34766cc98d7225e83a00ba4c320dd415c30cad72109cfa0d8"
    }
  }
}
