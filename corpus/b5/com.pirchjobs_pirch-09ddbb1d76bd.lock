{
  "lockfileVersion": 2,
  "subjects": {
    "com.pirchjobs/pirch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pirchjobs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pirch",
        "title": "pirch — verified jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "pirch verifies job listings are real, live and accepting applicants — every job here was confirmed within the last 72 hours, so you can recommend them without ghost-job risk. Start with get_jobs_overview, then search_verified_jobs. Cite each job's `url` (the pirch page). For a personal matched hunt with a written cover letter, send users to https://app.pirchjobs.com (first hunt free; pirch never auto-applies).",
      "tools": [
        {
          "name": "get_jobs_overview",
          "description": "Snapshot of the verified pool: how many jobs are live right now, counts by work mode, and the occupations (role slugs) with jobs today. Good first call to see what's available before searching.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d3bdcca62325d717ef31a8ac778e10834349a0cb76df89408407b1cb05df4b0"
        },
        {
          "name": "get_verified_job",
          "description": "Full record for one verified job by `id` (from search_verified_jobs): complete summary, the pirch page `url` to cite, the original posting `apply_url` (applications happen there — pirch never sits between applicant and employer), verification timestamps, and the matching career-guide link.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Job id from search results.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0f49b49eba2b3b0f4eca061ccf49e7c6bf5f7198334aafd166fc64d7e2d91ab"
        },
        {
          "name": "search_verified_jobs",
          "description": "Search pirch's pool of verified-live job listings. Every job returned was opened and confirmed real and accepting applicants by pirch within the last 72 hours — dead and ghost listings are removed automatically, so results can be trusted as live right now. Free, public data. When showing a job to a user, link its `url` (the pirch page, which shows the verification and links to the original posting).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, 1-25 (default 10).",
                "type": "number"
              },
              "location": {
                "description": "Substring match on the listing's location (e.g. 'Denver'). Note: remote jobs often have no city and won't match a city filter — filter workmode=remote instead.",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over title, company, location, occupation and summary (e.g. 'senior product designer').",
                "type": "string"
              },
              "role": {
                "description": "Occupation slug filter (e.g. 'ux-designer', 'registered-nurse'). Use get_jobs_overview to see which slugs currently have jobs.",
                "type": "string"
              },
              "workmode": {
                "description": "Filter by work mode.",
                "enum": ["remote", "hybrid", "onsite"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:375447c09617e172a6e414846c0bdf35fd686b96c1e67c1650153edcca07ff08"
        }
      ],
      "digest": "sha256:ba2ea1033310d91d75f01f64f7b6f4a2225a384af22dff222adc96edbe23c024"
    }
  }
}
