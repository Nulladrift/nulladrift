          "name": "get_calculator_inputs",
          "title": "Get a calculator's inputs",
          "description": "The JSON schema of one calculator's inputs (names, types, allowed values, defaults). Call before calculate when you are unsure of the input names.",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator id from find_calculator, e.g. \"uae-gratuity-calculator\"",
                "type": "string"
              }
            },
            "required": ["calculator"],
            "type": "object"
