              "nationality": {
                "default": "saudi",
                "description": "Employee",
                "enum": ["saudi", "nonsaudi"],
                "type": "string"
              },
              "phase": {
                "default": "2026",
                "description": "Contribution period Under the new law the pension rate rises by 0.5% each July until 2028.",
                "enum": ["2024", "2025", "2026", "2027", "2028"],
                "type": "string"
              },
              "system": {
                "default": "old",
                "description": "First registered with GOSI",
                "enum": ["old", "new"],
                "type": "string"
