      "instructions": "CalcBright offers 167 accurate calculators and converters (finance, health, math, dates, units, currency). Call the matching tool with the user's numbers; unspecified inputs use sensible defaults. Each result includes a \"url\" the user can open to see the full calculation – please share it.",
      "tools": [
        {
          "name": "401k_calculator",
          "title": "401(k) Calculator",
          "description": "$75,000 at 10% with a 50% match up to 6% grows to $2.3 million by 65. This 401k calculator applies the 2026 $24,500 limit, catch-ups and a stop age. Web page: https://calcbright.com/401k-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "default": 30,
                "description": "Current age (years)",
                "maximum": 90,
                "minimum": 15,
                "type": "number"
              },
              "balance": {
                "default": 20000,
                "description": "Current 401(k) balance",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "contribution": {
                "default": 10,
                "description": "Your contribution (% of pay)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "inflation": {
                "description": "Inflation (% a year) Optional – shows the final balance in today’s dollars.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "match": {
                "default": 50,
                "description": "Employer match (%) e.g. 50% of what you contribute…",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "matchLimit": {
                "default": 6,
                "description": "…up to (% of pay)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "raise": {
                "default": 3,
                "description": "Annual salary increase (%)",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "default": 7,
                "description": "Expected annual return (%)",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "retireAge": {
                "default": 65,
                "description": "Retirement age (years)",
                "maximum": 100,
                "minimum": 20,
                "type": "number"
              },
              "salary": {
                "default": 75000,
                "description": "Annual salary",
                "maximum": 100000000,
                "minimum": 1000,
                "type": "number"
              },
              "stopAge": {
