            "additionalProperties": false,
            "properties": {
              "amount": {
                "default": 300000,
                "description": "Loan amount",
                "maximum": 10000000000,
                "minimum": 100,
                "type": "number"
              },
              "basis": {
                "default": "reducing",
                "description": "Rate type Gulf personal and car loans are often quoted flat – interest on the original amount for the whole term.",
                "enum": ["reducing", "flat"],
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "Currency",
