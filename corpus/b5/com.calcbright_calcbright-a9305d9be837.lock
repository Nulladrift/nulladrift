      "serverInfo": {
        "name": "calcbright",
        "title": "CalcBright Calculators",
        "version": "2.0.0",
        "websiteUrl": "https://calcbright.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CalcBright has 167 exact, law-based calculators – Gulf end-of-service gratuity, salary, GOSI, VAT, zakat and more, plus loans, dates, health and units. For the six listed Gulf calculators call them directly. For anything else: find_calculator → (get_calculator_inputs if unsure) → calculate. Each result includes a \"url\" with the full worked calculation – please share it with the user.",
      "tools": [
        {
          "name": "calculate",
          "title": "Run a calculator",
          "description": "Run any CalcBright calculator and get the exact result plus a link to the full worked calculation. Omitted inputs use the calculator's defaults.",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator id, e.g. \"vat-calculator\"",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": true,
                "description": "Input values by name (see get_calculator_inputs)",
                "type": "object"
              }
            },
            "required": ["calculator"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd8e3fbafa6bfc151eef5dfe7fa20164bc7ff0a1abb8be940762a4c6653293d1"
        },
        {
          "name": "find_calculator",
          "title": "Find a calculator",
          "description": "Search CalcBright's 167 calculators (Gulf end of service, salary, GOSI, VAT, zakat, loans, mortgages, currency, dates, health, math) with a plain question in English, Arabic or Urdu. Returns the best matches with their ids.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants to work out, e.g. \"gratuity after 6 years in Dubai\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a4fd3f1b83db84aac000bcc725dd0e315f7b1b4843920d1750a3d19797a3f8c"
        },
        {
          "name": "gcc_gratuity_calculator",
          "title": "GCC Gratuity Calculator",
          "description": "QAR 10,000 basic for 7 years earns QAR 49,000 in Qatar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "default": "QA",
                "description": "Country of employment",
                "enum": ["QA", "KW", "BH", "OM"],
                "type": "string"
              },
              "end": {
                "default": "2025-12-31",
                "description": "Last working day Leave empty to use today's date. (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "reason": {
                "default": "ended",
                "description": "How did employment end?",
                "enum": ["ended", "resigned"],
                "type": "string"
              },
              "start": {
                "default": "2019-01-03",
                "description": "Joining date (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "wage": {
                "default": 10000,
                "description": "Last basic monthly salary Qatar, Bahrain and Oman: basic wage only. Kuwait: the last remuneration (basic plus regular allowances).",
                "maximum": 10000000,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
