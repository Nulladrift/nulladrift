              },
              "extra": {
                "default": 0,
                "description": "Extra payment / month Added to principal every month from the first payment.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "default": 6.5,
                "description": "Interest rate (% per year)",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
