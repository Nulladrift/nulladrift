{
  "lockfileVersion": 2,
  "subjects": {
    "com.clawhard/mend": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mend.clawhard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.clawhard/mend",
        "title": "Mend",
        "version": "1.1.0",
        "description": "Mend repairs broken JSON (trailing commas, single quotes, comments, Python literals, code fences, truncated output), tells you exactly where invalid JSON breaks, and outlines or queries big payloads. Runs in your browser, no account.",
        "websiteUrl": "https://mend.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mend: Mend repairs broken JSON (trailing commas, single quotes, comments, Python literals, code fences, truncated output), tells you exactly where invalid JSON breaks, and outlines or queries big payloads. Runs in your browser, no account. Use it when JSON from an LLM, API, log or config will not parse, or you need to validate, outline or extract fields from JSON without re-reading all of it. Tools: mend_repair_json (Repair broken or LLM-generated JSON); mend_outline_json (Outline the structure of a large JSON payload); mend_query_json (Extract values from JSON by path). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "mend_outline_json",
          "title": "Outline the structure of a large JSON payload",
          "description": "Use when you are about to read a big JSON response, log or export into context, before loading it: returns a compact outline of the structure (keys, types, array lengths, one example per repeated shape) so you can plan a query without spending tokens on the whole document. Repairs the JSON first if needed. Follow with mend_query_json to pull only the values you need. Up to 100,000 characters.",
          "inputSchema": {
            "properties": {
              "max_depth": {
                "description": "How many levels to expand. Default 4.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_items": {
                "description": "How many array items to show when items differ. Default 6.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "The JSON (or JSON-ish text).",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Outline the structure of a large JSON payload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mend/outline-v1.html",
            "openai/toolInvocation/invoked": "Outline ready",
            "openai/toolInvocation/invoking": "Outlining…",
            "ui": {
              "resourceUri": "ui://mend/outline-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/mend/result"
          },
          "digest": "sha256:e6820ed7143277180a031be77ddd2d3c53490cb6e035d8f00d20ca12c66fc2d2"
        },
        {
          "name": "mend_query_json",
          "title": "Extract values from JSON by path",
          "description": "Use when you need specific fields from a JSON document without reading all of it: $.users[0].name, $.items[*].id, $.a.b[-1], $.list[1:3], $..email (recursive). Returns each match with its exact path, type and value. Repairs the JSON first if needed, so broken input still works. Up to 100,000 characters.",
          "inputSchema": {
            "properties": {
              "max": {
                "description": "Maximum matches to return. Default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "path": {
                "description": "Path such as $.users[*].email, data.items[0], $..id, $.list[-1], $.list[1:3].",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "text": {
                "description": "The JSON (or JSON-ish text).",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Extract values from JSON by path"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mend/query-v1.html",
            "openai/toolInvocation/invoked": "Matches ready",
            "openai/toolInvocation/invoking": "Querying…",
            "ui": {
              "resourceUri": "ui://mend/query-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/mend/result"
          },
          "digest": "sha256:2367e15271405818ccdaca87bd960f8eccb713e6bc7ddd8a3799b8df8f5a126b"
        },
        {
          "name": "mend_repair_json",
          "title": "Repair broken or LLM-generated JSON",
          "description": "Use when JSON from an LLM, API, log, config or copy-paste fails to parse (JSON.parse error, \"Unexpected token\", \"Expecting property name\"), or the user pastes JSON with trailing commas, single quotes, unquoted keys, comments, Python True/False/None, NaN, missing commas or brackets, a ```json fence, text around it, or output that was cut off. Deterministic repair: returns valid, formatted JSON plus a list of every fix with line and column. Values are never rewritten, so big numbers, number formatting and key order stay exactly as written. If the text is already valid it says so. Up to 100,000 characters.",
          "inputSchema": {
            "properties": {
              "indent": {
                "description": "Spaces per indent level in the output. Default 2. Use 0 for one minified line.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "sort_keys": {
                "description": "Sort object keys alphabetically. Default false (keep the original order).",
                "type": "boolean"
              },
              "text": {
                "description": "The broken JSON, or any text that contains JSON (a chat reply, a log line, a code block).",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Repair broken or LLM-generated JSON"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mend/repair-v1.html",
            "openai/toolInvocation/invoked": "JSON repaired",
            "openai/toolInvocation/invoking": "Repairing JSON…",
            "ui": {
              "resourceUri": "ui://mend/repair-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/mend/result"
          },
          "digest": "sha256:bee723103eb442778e116c9ebca4e6b2f43b1dff7fbe53eaaf3c614c0d281fb8"
        }
      ],
