                "description": "A mall, hotel or attraction name to search within 1.5 km of, e.g. 'Pavilion KL', 'Suria KLCC', 'Mid Valley Megamall'. Unknown names are refused (use area or city instead). Coordinates are not accepted.",
                "title": "Near"
