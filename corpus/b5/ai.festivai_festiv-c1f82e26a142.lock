      "serverInfo": {
        "name": "Festiv",
        "title": "Festiv — venues, events and guides for Malaysia",
        "version": "0.1.0",
        "websiteUrl": "https://festivai.ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Festiv is a venue and experience directory for Malaysia (restaurants, cafes, bars, entertainment, leisure, wellness, malls, events). Use search_venues for options in a place or with filters, get_venue for one venue's facts (hours, halal certificate, awards, booking links), find_things_to_do for events in a time window, recommend_picks for occasion-based ranked picks, get_best_of for curated guides, list_areas to normalise place names, and get_awards for MICHELIN and other award lists. Ratings come from Google reviews; nothing in the results is sponsored. Halal rule: say a venue is halal only when its record carries halal_certified / halal.certified (a verified Malaysian certificate). The dietary block ('No pork on this menu', 'No alcohol on this menu') comes from the venue's published menu and is not a halal status: quote it with its note and never rephrase it as any kind of halal or Muslim 'friendliness'. Venue records include the venue's public address and coordinates so you can show them on a map. Always give the user the Festiv link for details. Answering rules (kept here, not in the tool descriptions): the tools take place words (area, city, landmark), never coordinates; list_areas gives the area names they accept. For one venue's hours, awards or booking links, call get_venue after search_venues. Say an estimated price (price_level_source: type_estimate) is 'likely' and a menu_estimate price is 'about'. A venue with hours_by_programme: true has no fixed hours: point to its events and never call it closed. When find_things_to_do returns dated_count 0, say Festiv has no dated event for that window and offer the ongoing experiences instead. Pass city to get_awards when the question names one (the award list is national).",
      "tools": [
        {
          "name": "find_things_to_do",
          "title": "Find events and what's on in Malaysia",
          "description": "What's on in Malaysia: events, shows, workshops, tastings and other experiences for a time window: today, tonight, tomorrow, this weekend, this week, or a date (YYYY-MM-DD). Filter by neighbourhood or city, a category word (e.g. 'live music', 'workshop', 'kids') and free-only. Dated events come first with start and end times; items marked `anytime: true` are ongoing venue experiences bookable on any day, not scheduled events. `dated_count` is the number of dated events in the window; 0 means Festiv has none, and the items returned are ongoing experiences. Each item has the venue, price and a link.",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Neighbourhood or district name, e.g. 'Bangsar', 'KLCC', 'George Town'. A name Festiv does not know is refused, not guessed; a city or region word such as 'Penang' or 'Klang Valley' is read as a city.",
                "title": "Area"
              },
              "category": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Category word to match, e.g. 'live music', 'comedy', 'kids', 'tasting'.",
                "title": "Category"
              },
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "City when no neighbourhood is known, e.g. 'Kuala Lumpur', 'Petaling Jaya', 'Penang'.",
                "title": "City"
              },
              "free_only": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "True = free events only.",
                "title": "Free Only"
              },
              "language": {
                "default": "en",
                "description": "Reply language for summaries: en, ms (Malay) or zh (Chinese). Venue names stay in their original script.",
                "pattern": "^(en|ms|zh)$",
                "title": "Language",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "when": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "today | tonight | tomorrow | this_weekend | this_week | YYYY-MM-DD (default: next 7 days).",
                "title": "When"
              }
            },
            "title": "find_things_to_doArguments",
            "type": "object"
