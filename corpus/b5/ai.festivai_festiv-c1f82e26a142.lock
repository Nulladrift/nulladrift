        {
          "name": "get_venue",
          "title": "Get venue details",
          "description": "Everything Festiv knows about one venue: type, neighbourhood (or `nearest_area` when it sits just outside one), address and coordinates, phone, website, weekly opening hours and whether it is open now (`hours_by_programme: true` = no fixed hours: they depend on what's on, and the venue is not closed), price level (price_level_source: type_estimate = estimated from the venue type, not a known price), cuisines, `halal` (present only when a verified halal certificate is on record: authority and valid-to date), `dietary` (menu observations such as 'No pork on this menu' with a provenance note — not a halal status), `alcohol_served` only when known, amenities, a short description, awards (MICHELIN and others) and press quotes with their sources, reservation and delivery links, the next few events at the venue, and the Festiv page link. Pass the venue name (add the area if the name is common) or a Festiv slug from an earlier result; if the name is not in Festiv the error lists the closest names instead of guessing.",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
