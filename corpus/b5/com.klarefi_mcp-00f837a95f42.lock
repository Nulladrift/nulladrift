          "name": "answer_fields",
          "title": "Answer intake fields",
          "description": "Answer structured requested facts by fact_id. Values must be strings; yes_no fields take \"yes\" or \"no\", and date fields use YYYY-MM-DD.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Applicant access token. Use it with session_id instead of url.",
                "type": "string"
              },
              "api_base_url": {
                "description": "Optional Klarefi deployment URL for local stdio use. The hosted MCP endpoint does not accept this override.",
                "type": "string"
              },
              "fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "String values keyed by fact_id.",
                "type": "object"
              },
              "session_id": {
                "type": "string"
              },
              "task_id": {
                "type": "string"
              },
              "url": {
