{
  "lockfileVersion": 2,
  "subjects": {
    "com.butterflydelta/preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://butterflydelta.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.butterflydelta/preflight",
        "title": "Butterfly Delta Preflight",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call delta_preflight immediately before every autonomous USD-pair crypto spot order. Continue only on PASS under your independent authorization and risk policy; fail closed on BLOCK or UNKNOWN.",
      "tools": [
        {
          "name": "delta_peek",
          "title": "Preview Butterfly Delta coverage",
          "description": "Free. Check whether a USD spot pair is covered and inspect the exact $0.01 Base USDC preflight price before paying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "trade": {
                "additionalProperties": false,
                "description": "Execution policy for one intended USD-pair spot order.",
                "properties": {
                  "baseSize": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "limitPrice": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "maxCrossVenueDivergenceBps": {
                    "default": 20,
                    "maximum": 10000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "maxEstimatedSlippageBps": {
                    "default": 25,
                    "maximum": 10000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "maxQuoteAgeSeconds": {
                    "default": 10,
                    "maximum": 3600,
                    "minimum": 0,
                    "type": "number"
                  },
                  "maxVenueSpreadBps": {
                    "default": 10,
                    "maximum": 10000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "minDepthCoveragePct": {
                    "default": 100,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "minHealthyVenues": {
                    "default": 2,
                    "maximum": 2,
                    "minimum": 1,
                    "type": "number"
                  },
                  "orderType": {
                    "default": "market",
                    "enum": ["market", "limit"],
                    "type": "string"
                  },
                  "pair": {
                    "description": "USD spot pair, for example BTC-USD.",
                    "pattern": "^[A-Za-z0-9]{2,15}[-/_]USD$",
                    "type": "string"
                  },
                  "side": {
                    "enum": ["buy", "sell"],
                    "type": "string"
                  },
                  "venue": {
                    "description": "Optional exact-order venue. Include with side and baseSize.",
                    "enum": ["coinbase", "gemini"],
                    "type": "string"
                  }
                },
                "required": ["pair"],
                "type": "object"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b38ba59d79acfd0765d3530b6528bfa7360d4b94d7daaa7b59a2dc904dee99a"
        },
        {
          "name": "delta_preflight",
          "title": "Gate a crypto order before submission",
          "description": "Paid via x402 or MPP: $0.01 USDC on Base. Send the exact order venue, side, and size immediately before submission to obtain a signed PASS, BLOCK, or UNKNOWN from live availability, spread, freshness, depth, slippage, and divergence checks. Fail closed on BLOCK or UNKNOWN.",
