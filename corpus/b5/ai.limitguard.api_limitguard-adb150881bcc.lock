        {
          "name": "check_agent_wallet",
          "description": "Check a counterparty agent's EVM wallet in one call: OFAC SDN digital-currency address list match, Base USDC and ETH balance, ERC-8004 identity registration (and, given an agent id, that agent's owner and payment wallet) and open ERC-8004 feedback, which is not scored. $0.005 by x402, $0.75 with an API key.\n\n            Returns verdict (block, review or no_findings) with verdict_reasons,\n            the components that ran and those that did not (with a reason), and\n            sanctions, balance, identity, reputation, wallet_risk and domain\n            (when a domain is given, else not_requested), each with its own\n            status (ok, unavailable or error). Reputation and domain are\n            descriptive only and never change the verdict. Base only; EVM\n            addresses only.\n\n            Args:\n                wallet: EVM wallet address (0x + 40 hex characters)\n                agent_id: Optional ERC-8004 agentId (decimal) the wallet claims\n                domain: Optional website domain the agent gives for itself (e.g. example.com)\n            ",
