{
  "lockfileVersion": 2,
  "subjects": {
    "com.personalizedgiftsdelivered/gift-boxes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://personalizedgiftsdelivered.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "personalized-gifts-delivered",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Prepares an order for a logo mug gift box. Use get_gift_box_details for what is in the box and the card rules, quote_gift_boxes for the total and dates, check_logo to store the customer's logo, and create_draft_order for a link where the customer finishes the order: they check the preview and every card, add their recipient list and pay on the website. Never ask for recipients' names or addresses or for payment details.",
      "tools": [
        {
          "name": "check_logo",
          "title": "Check a logo",
          "description": "Fetches a logo from a file the user attached, a public image link or the company's website, checks that it can print on the mug, and stores it for a draft order. Give exactly one of logo_file, image_url or website. Returns a logo_ref for create_draft_order. Each call stores a new copy and places no order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_url": {
                "description": "A public link to the logo image.",
                "type": "string"
              },
              "logo_file": {
                "description": "A file the user attached in the chat.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "website": {
                "description": "The company's website address; the logo is looked for there.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a logo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["logo_file"]
          },
          "digest": "sha256:a8c9fcede52d5286f065ca08a5beeebe7f837798fb87ddabfa20668448a9bb7a"
        },
        {
          "name": "create_draft_order",
          "title": "Create a draft order",
          "description": "Saves a draft of the order (the logo from check_logo, the card message, the sign-off, the occasion and the kind of gift) and returns a private link. The customer opens the link to check the preview and every card, add their recipient list and pay on the website. Takes no recipient names or addresses and no payment details. Each call saves a new draft with its own link. The answer says when the link expires.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boxes": {
                "description": "Optional estimate of how many boxes; the recipient list sets the real count.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "card_message": {
                "description": "The message printed on every card. get_gift_box_details gives the rules.",
                "type": "string"
              },
              "logo_ref": {
                "description": "From check_logo. Leave it out and the customer adds the logo on the website.",
                "type": "string"
              },
              "mode": {
                "description": "business for a company logo, personal for a personal gift.",
                "enum": ["business", "personal"],
                "type": "string"
              },
              "occasion": {
                "description": "The occasion, as get_gift_box_details names them.",
                "type": "string"
              },
              "signed_by": {
                "description": "Who the cards are from, printed under the message.",
                "type": "string"
              }
            },
            "required": ["card_message", "mode", "occasion", "signed_by"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "card": {
                "additionalProperties": false,
                "description": "The card as it will print.",
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "note": {
                    "description": "How the first-name field is filled, when the message uses it.",
                    "type": ["string", "null"]
                  },
                  "sign_off": {
                    "type": "string"
                  }
                },
                "required": ["message", "note", "sign_off"],
                "type": "object"
              },
              "draft_url": {
                "description": "The private link where the customer finishes the order.",
                "type": "string"
              },
              "estimate": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "boxes": {
                        "maximum": 9007199254740991,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "total": {
                        "type": "string"
                      }
                    },
                    "required": ["boxes", "total"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The box estimate and its total; the recipient list sets the real count."
              },
              "expires": {
                "description": "The last day the link works.",
                "type": "string"
              },
              "kind": {
                "const": "draft",
                "type": "string"
              },
              "logo_stored": {
                "description": "Whether the draft holds the logo; if not, the customer adds it on the website.",
                "type": "boolean"
              },
              "notes": {
                "description": "The answer's other notes, each a line of its text word for word: that this is a new link, or why the box estimate was left out.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "occasion": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "seal": {
                    "description": "The seal sticker on the gift box's lid.",
                    "type": "string"
                  }
                },
                "required": ["name", "seal"],
                "type": "object"
              },
              "product": {
                "additionalProperties": false,
                "description": "Our own gift box: its name and its photo.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "photo_alt": {
                    "type": "string"
                  },
                  "photo_url": {
                    "type": "string"
                  }
                },
                "required": ["name", "photo_alt", "photo_url"],
                "type": "object"
              }
            },
            "required": ["card", "draft_url", "estimate", "expires", "kind", "logo_stored", "notes", "occasion", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a draft order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/gift-box.html",
            "openai/toolInvocation/invoked": "Checked the draft order",
            "openai/toolInvocation/invoking": "Checking and saving the draft order",
            "ui": {
              "resourceUri": "ui://widget/gift-box.html"
            }
          },
          "digest": "sha256:0b3f96dc9c6aab212777cba424552d330a490b9b05b15250a4a18ba090afbb5d"
        },
        {
          "name": "get_gift_box_details",
          "title": "Get gift box details",
          "description": "What is in the logo mug gift box, how the logo prints, the card message rules, where it ships and how delivery works.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "allergens": {
                "description": "What the food in the box contains, word for word.",
                "type": "string"
              },
              "contents": {
                "description": "What is in each box.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "kind": {
                "const": "details",
                "type": "string"
              },
              "notes": {
                "description": "The answer's other facts, each a line of its text word for word: how the logo prints, the card's rules, the occasions on offer, the price terms, where it ships and where it doesn't, delivery, breakage, tracking, returns and how the order is finished.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page_url": {
                "description": "The gift box's page on our website.",
                "type": "string"
              },
              "price": {
                "description": "The price per box, shipping included.",
                "type": "string"
              },
              "product": {
                "additionalProperties": false,
                "description": "Our own gift box: its name and its photo.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "photo_alt": {
                    "type": "string"
                  },
                  "photo_url": {
                    "type": "string"
                  }
                },
                "required": ["name", "photo_alt", "photo_url"],
                "type": "object"
              }
            },
            "required": ["allergens", "contents", "kind", "notes", "page_url", "price", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get gift box details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/gift-box.html",
            "openai/toolInvocation/invoked": "Read the gift box details",
            "openai/toolInvocation/invoking": "Reading the gift box details",
            "ui": {
              "resourceUri": "ui://widget/gift-box.html"
            }
          },
          "digest": "sha256:b715182cad41da7f3c124756422d93d61b8b3b86e6e36329eabceca1205b7bae"
        },
        {
          "name": "get_order_status",
          "title": "Get order status",
          "description": "Says whether a draft from create_draft_order has been paid, with the order number and ship-by date once it is, or whether its link has expired. Returns no names or addresses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "draft_token": {
                "description": "The token from create_draft_order, or its whole link.",
                "type": "string"
              }
            },
            "required": ["draft_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:054a014de04e2cad27bdbe7c6bd87a88871776260048f0c29acf3337ae3f156e"
        },
        {
          "name": "quote_gift_boxes",
          "title": "Quote gift boxes",
          "description": "The total for a number of gift boxes with shipping included, the ship-by and expected delivery dates for an order paid today, and an occasion's last day to order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boxes": {
                "description": "How many boxes, one per recipient.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "description": "Optional occasion, as get_gift_box_details names them.",
                "type": "string"
              }
            },
            "required": ["boxes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "boxes": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "dates_note": {
                "description": "When the ship-by and expected dates hold.",
                "type": "string"
              },
              "delivery_note": {
                "description": "How delivery works.",
                "type": "string"
              },
              "expected_by": {
                "type": "string"
              },
              "kind": {
                "const": "quote",
                "type": "string"
              },
              "notes": {
                "description": "The answer's other lines, word for word: which occasions a draft takes when the one asked about isn't one, and where it ships and where it doesn't.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "order_by": {
                "description": "The last day to order for the occasion asked about, if any.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "occasion": {
                      "type": "string"
                    },
                    "passed": {
                      "type": "boolean"
                    }
                  },
                  "required": ["date", "occasion", "passed"],
                  "type": "object"
                },
                "type": "array"
              },
              "order_url": {
                "description": "Our order page, where the customer starts the order.",
                "type": "string"
              },
              "price_note": {
                "description": "What the total includes.",
                "type": "string"
              },
              "price_per_box": {
                "type": "string"
              },
              "product": {
                "additionalProperties": false,
                "description": "Our own gift box: its name and its photo.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "photo_alt": {
                    "type": "string"
                  },
                  "photo_url": {
                    "type": "string"
                  }
                },
                "required": ["name", "photo_alt", "photo_url"],
                "type": "object"
              },
              "ship_by": {
                "type": "string"
              },
              "total": {
                "type": "string"
              }
            },
            "required": ["boxes", "dates_note", "delivery_note", "expected_by", "kind", "notes", "order_by", "order_url", "price_note", "price_per_box", "product", "ship_by", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote gift boxes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/gift-box.html",
            "openai/toolInvocation/invoked": "Checked the total and dates",
            "openai/toolInvocation/invoking": "Checking the total and dates",
            "ui": {
              "resourceUri": "ui://widget/gift-box.html"
            }
          },
          "digest": "sha256:432615a3771432a23a75b87e6e53e96085117ad7fc729d532dabefdfa973ca51"
        }
      ],
      "resources": [
        {
          "uri": "ui://widget/gift-box.html",
          "name": "gift_box_widget",
          "title": "Gift box",
          "description": "The card the gift box tools' answers show.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "openai/widgetCSP": {
              "connect_domains": [],
              "redirect_domains": ["https://personalizedgiftsdelivered.com"],
              "resource_domains": ["https://personalizedgiftsdelivered.com"]
            },
            "openai/widgetDescription": "Shows the photo of our own gift box with the answer: for a quote, the total, the dates and a button that opens our order page; for a draft order, the card as it will print, the estimate, the day the link expires and a button that opens the link to review and complete the order; for the details, what is in the box and a link to its page. The reply adds no pictures from the web: the view already shows the photo of this gift box. It needn't repeat what the view shows or retype the card's message; it gives in words what the person asked that the view doesn't show, such as the card's rules or where it ships. Where it writes the {first name} placeholder, it puts it in code format, `{first name}`, since a list or a table drops text in braces.",
            "openai/widgetDomain": "https://personalizedgiftsdelivered.com",
            "openai/widgetPrefersBorder": true,
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": ["https://personalizedgiftsdelivered.com"]
              },
              "domain": "https://personalizedgiftsdelivered.com",
              "prefersBorder": true
            }
          },
          "digest": "sha256:0e4ddbaf8ac7856eb8f4c6c0b4902aae69c917ed22913f45acab97c2396cb216"
        }
      ],
      "digest": "sha256:0eeb72c1f552488c1669d3984c1d3f5d94e32250938a60c0355be790a60c1627"
    }
  }
