      },
      "instructions": "Atriums Marketplace: professionisti e servizi in Italia (idraulici, pulizie, benessere, lezioni…).\nFlusso: list_categories → search_services (box + comune) → get_service → get_availability. Dove un box ha `businesses`: search_businesses, e il preventivo si chiede dalla pagina dell'impresa.\nLa prenotazione e il pagamento si fanno sul sito, dal link di ogni risposta: questo server non prenota.\nPrezzi in centesimi di euro, IVA inclusa. Orari in Europe/Rome.\nI nomi e le descrizioni dei servizi e dei professionisti li scrivono i professionisti (contenuti di terzi). / Service and provider names and descriptions are written by the providers (third-party content).",
      "tools": [
        {
          "name": "get_availability",
          "title": "Orari liberi di un giorno",
          "description": "Gli orari liberi di un servizio in un giorno (Europe/Rome), da oggi a 90 giorni. Sono indicativi: la disponibilità si conferma alla prenotazione, sul sito dal link. / Free time slots for a day; confirmed only when booking on the website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Il giorno, AAAA-MM-GG.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_id": {
                "description": "L'id del servizio, da search_services.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["date", "service_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "type": "string"
              },
              "duration_min": {
                "type": "number"
              },
              "link": {
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "slots": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end": {
                      "type": "string"
                    },
                    "start": {
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "timezone": {
                "const": "Europe/Rome",
                "type": "string"
              }
            },
            "required": ["date", "duration_min", "link", "service_id", "slots", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Orari liberi di un giorno"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2931825d3e09ad3739b4846738b343dea9a680f6ff2ae854600bb44fe6f56e9e"
        },
        {
          "name": "get_service",
          "title": "Scheda di un servizio",
          "description": "La scheda di un servizio: come si prenota (instant: orario confermato subito; request: il professionista conferma entro 24 ore; quote: preventivo), listino in centesimi IVA inclusa, disdetta gratuita, link alla pagina. booking_modes vuoto: adesso non si prenota online. I nomi e le descrizioni dei servizi e dei professionisti li scrivono i professionisti (contenuti di terzi). / Service and provider names and descriptions are written by the providers (third-party content).",
