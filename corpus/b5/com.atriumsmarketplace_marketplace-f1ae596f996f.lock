        {
          "name": "list_categories",
          "title": "Categorie di servizi",
          "description": "Le categorie e i box di servizi di Atriums Marketplace. Con un comune, solo i box con almeno un professionista che lavora lì o online (`providers`) o un'impresa della zona non ancora iscritta (`businesses`). search_services poi mostra chi lavora nel comune: un box con soli professionisti online può dare zero servizi. Con `providers` 0 si usa search_businesses. / Service categories and boxes; with a municipality, only boxes with providers working there or online, or local businesses not yet on Atriums.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "comune": {
                "description": "Comune italiano, come nell'elenco ISTAT; con la sigla della provincia se ci sono omonimi («Samone, TO»).",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "boxes": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "businesses": {
                            "type": "number"
                          },
                          "name": {
                            "type": ["string", "null"]
                          },
                          "providers": {
