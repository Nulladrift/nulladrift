          "title": "Categorie di servizi",
          "description": "Le categorie e i box di servizi di Atriums Marketplace. Con un comune, solo i box con almeno un professionista che lavora lì o online, e quanti sono (`providers`). search_services poi mostra chi lavora nel comune: un box con soli professionisti online può dare zero servizi. / Service categories and boxes; with a municipality, only boxes with providers working there or online.",
