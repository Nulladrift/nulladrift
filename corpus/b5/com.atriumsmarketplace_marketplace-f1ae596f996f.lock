        {
          "name": "search_businesses",
          "title": "Imprese della zona",
          "description": "Le imprese di un box che lavorano nel comune e non sono ancora iscritte ad Atriums: al più 20, con il totale, prima quelle con la sede nel comune, poi le più vicine. Non si prenotano: dalla pagina dell'impresa (link) si chiede un preventivo e Atriums la contatta. I recapiti non si danno. I nomi vengono da elenchi pubblici. / Local businesses not yet on Atriums: request a quote from their page; Atriums contacts them.",
