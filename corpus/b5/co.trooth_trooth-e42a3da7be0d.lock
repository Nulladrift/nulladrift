          "title": "List what is left before the workspace's Trust Profile is published",
          "description": "Uses a trooth.co sign-in (or an agent key with profile:read). Takes only workspace, when the person belongs to several. Lists the steps left before the workspace's Trust Profile can be published, each with state done, todo or unknown and how to do it. A step that is the owner's own choice carries action_url, the trooth.co page where the owner takes it. Read only.",
