        {
          "name": "trooth_setup",
          "title": "Set up Semanto and the Trust Profile, one step at a time",
          "description": "Runs the whole guide, proving the domain, reading the site, reviewing and signing the facts, putting the signed copy on the site and checking it, and answers the one next call to make: next_action names the tool and its arguments. Each answer reflects the steps already done. A step only a person may take answers its trooth.co page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The company's bare domain, when setup does not know it yet.",
                "maxLength": 253,
                "type": "string"
              },
              "trooth_id": {
                "description": "The company's trooth_id. Leave it out to use the one your key or sign-in acts for.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
