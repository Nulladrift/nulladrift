        {
          "name": "trooth_profile_update",
          "title": "Change fields of the workspace's Trust Profile draft",
          "description": "Changes fields of the workspace's own Trust Profile DRAFT; the public page changes only on trooth_profile_publish. Uses a trooth.co sign-in if the person's role may edit the page (or an agent key with profile:write). Each change names one field by JSON Pointer (/tagline, /founders/-) with a value and its source { url, quote } from the company's own page, or state not_published with a reason. Returns each change as applied or rejected (with code and fix) and the new revision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "changes": {
                "description": "The changes, applied in order; a rejected change leaves the draft as it was and the ones after it still apply. Fields and their types: https://trooth.co/api/v1/profile/schema. Fields a person keeps (the page address, the theme, review marks) are rejected with code human_only.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "op": {
                      "description": "Optional. set (the default), remove, or append to a list.",
                      "enum": ["set", "remove", "append"],
                      "type": "string"
                    },
                    "path": {
                      "description": "The field, as an RFC 6901 JSON Pointer: /tagline, /security/contact, /founders/0/name, or /founders/- to add to the end of a list.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "reason": {
                      "description": "With state: one sentence on what the caller checked, for example: The security page does not mention penetration testing.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "source": {
                      "description": "Where the value came from. Required for every non-empty value: the https page it was read from, or person: true for the company's own statement no page carries, such as its phone number (kept as stated by the signed-in person, or by the agent key and the person who made it). Without either, the change is rejected with code source_required.",
                      "properties": {
                        "person": {
                          "description": "true: the company states this value itself, for example its phone number, and no page carries it. Kept as stated by the signed-in person, or by the agent key and its maker.",
                          "type": "boolean"
                        },
                        "quote": {
                          "description": "The words on that page, or what the person said.",
                          "maxLength": 2000,
                          "type": "string"
                        },
                        "retrieved_at": {
                          "description": "When the caller read the page (RFC 3339), optional.",
                          "maxLength": 40,
                          "type": "string"
                        },
                        "url": {
                          "description": "The https address of the company's own page the value was read from.",
                          "maxLength": 2000,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "state": {
                      "description": "Instead of a value: the company does not publish this (not_published) or it does not apply (not_applicable). Clears the field. Needs a reason.",
                      "enum": ["not_published", "not_applicable"],
                      "type": "string"
                    },
                    "value": {
                      "description": "The new value, of the field's type. Required unless state is given or op is remove. A picture (/logoUrl, /coverUrl, /founders/0/photoUrl) is a direct https link or the image file itself as a base64 data: URL (data:image/png;base64,..., PNG, JPEG or WebP, at most 140,000 bytes); trooth.co re-encodes and stores its own copy."
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "dry_run": {
                "description": "Optional. true checks every change and returns what would be kept, and saves nothing.",
                "type": "boolean"
              },
              "expected_revision": {
                "description": "Optional. The same as if_match, sent to trooth.co in the body. The revision the caller read; when the draft changed since, nothing is saved and the answer is code revision_changed. With if_match, both name the same revision.",
                "maxLength": 100,
                "type": "string"
              },
              "fields": {
                "description": "Optional, with dry_run. Only these parts of the draft the dry run would keep come back: top-level keys or JSON Pointers. Leave it out for the whole draft.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "pattern": "^[^,]+$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Optional. A key of the caller's choosing for this exact set of changes. Retrying with the same key and changes returns the first answer with no second write. When omitted, one is made and returned as idempotency_key.",
                "maxLength": 255,
                "type": "string"
              },
              "if_match": {
                "description": "Optional. The revision the caller read with trooth_profile_get. When someone changed the draft since, nothing is saved and the answer is code revision_changed with the new revision.",
                "maxLength": 100,
                "type": "string"
              },
              "workspace": {
                "description": "With the person's sign-in only: the workspace to act on when the person belongs to more than one, by its trooth.co key (Settings, Organizations). Leave it out for the caller's own workspace or the caller's only one.",
                "maxLength": 36,
                "pattern": "^cid_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["changes"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The profile tools and the workspace tab tools (T-21, T-23): what the trooth.co API answered for the workspace the agent key or sign-in belongs to. approval_required: a person approves the change first (response.approval_id). draft: the draft was read. diff: the fields where the draft and the public page differ were read (response.changes). validated: the checks ran and nothing was saved (response.checks). plan: the open items were proposed as changes, none applied (response.steps). saved: changes were saved to the draft (each change's result is in response.results). dry_run: changes were checked and nothing was saved. answered: the checklist was read. published: the draft is on the public page. started: a domain proof was started (the TXT record is in response.record). confirmed: the domain is proved. not_found: the TXT record is not visible yet. refused: trooth.co refused the call; error and response say why and what to do. unauthenticated: no agent key, or trooth.co did not accept it. bad_input: an argument could not be used and nothing was sent. unavailable: trooth.co did not answer in time or in JSON; for a write, call again with the same idempotency_key.",
