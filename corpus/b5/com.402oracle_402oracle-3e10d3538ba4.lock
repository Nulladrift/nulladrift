{
  "lockfileVersion": 2,
  "subjects": {
    "com.402oracle/402oracle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://402oracle.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "402oracle",
        "version": "1.6.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "402oracle: verification layer for agent decisions. The free MCP tier is rate-limited and returns UNSIGNED results. For cryptographically signed attestations with no daily limit, add an x402 payment header to any tools/call on THIS endpoint (PAYMENT-SIGNATURE for x402 v2, X-PAYMENT for v1); paid calls do not consume free quota. The same calls are also available as plain HTTP endpoints at the same prices, listed with full payment terms at /.well-known/x402.",
      "tools": [
        {
          "name": "verify_business",
          "description": "Is this company or domain legit? Business and domain verification (KYB) for vendor screening, supplier checks and scam or fraud review: domain age and registrar from RDAP, DNS (A/MX/NS), email security (SPF/DMARC) and HTTPS. Returns a verdict and a 0-100 trust score with evidence URLs, and flags newly registered or thin-infrastructure domains, a common scam signal. Use it before your agent pays an invoice, onboards a vendor or trusts a site. Signed attestation. Bulk: /verify/business/batch. Free tier is unsigned and rate-limited. For a cryptographically signed attestation with no daily limit ($0.05 USDC), add an x402 payment header to THIS SAME tool call (PAYMENT-SIGNATURE for v2, X-PAYMENT for v1) or POST /verify/business over HTTP. Same price on either transport.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to verify, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bd17cc71124de5f5933c09a97bb440d12927601743b10136b60eda984b4cc58"
        },
        {
          "name": "verify_claim",
          "description": "Is this claim true? Fact-check a single factual claim or statement against live web evidence before your agent relies on it. A fact-checking oracle, hallucination guard, and grounding and citation check for misinformation review: returns a verdict (supported / contradicted / insufficient), a confidence score, and source citations, as a signed attestation your agent can cite. Free tier is unsigned and rate-limited. For a cryptographically signed attestation with no daily limit ($0.25 USDC), add an x402 payment header to THIS SAME tool call (PAYMENT-SIGNATURE for v2, X-PAYMENT for v1) or POST /verify/claim over HTTP. Same price on either transport.",
          "inputSchema": {
            "properties": {
              "claim": {
                "description": "A single factual claim, 8-600 characters",
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e35a1670ed0a9f45b40d43549d9bfe8a8d53e6d4cf24cee194707214d36014c"
        },
        {
          "name": "verify_freshness",
          "description": "Website uptime and change check: is this URL up right now, and has the page changed? Fetches the URL and returns the HTTP status, Last-Modified and ETag headers, a SHA-256 fingerprint of the content, and whether it changed versus a hash you pass in. Use it to check a site is live, detect stale data, monitor a page for changes, or decide whether to invalidate a cache before your agent acts on what it says. Returns a signed attestation. Free tier is unsigned and rate-limited. For a cryptographically signed attestation with no daily limit ($0.02 USDC), add an x402 payment header to THIS SAME tool call (PAYMENT-SIGNATURE for v2, X-PAYMENT for v1) or POST /verify/freshness over HTTP. Same price on either transport.",
          "inputSchema": {
            "properties": {
              "prior_hash": {
                "description": "Optional prior SHA-256 hex to compare against",
                "type": "string"
              },
              "url": {
                "description": "Full URL including https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2a254917a46d99ae2344e6b50edad291ad5cc0200ffcd8d4ec16e1a4738f52c"
        },
        {
          "name": "verify_price",
          "description": "Crypto price check: the current spot price of Bitcoin (BTC), Ethereum (ETH), Solana (SOL) or any token ticker in USD, cross-checked across five exchanges (Coinbase, Kraken, OKX, Binance, CoinGecko). Returns the median price, the spread between venues and a divergence flag, as a signed price oracle attestation your agent can cite. Use it before your agent trades, quotes, values a portfolio or settles on a token price. Needs at least two live quotes; a ticker no venue lists is not charged. Free tier is unsigned and rate-limited. For a cryptographically signed attestation with no daily limit ($0.02 USDC), add an x402 payment header to THIS SAME tool call (PAYMENT-SIGNATURE for v2, X-PAYMENT for v1) or POST /verify/price over HTTP. Same price on either transport.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker symbol, e.g. BTC, ETH, SOL",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6756538a88c7d0e4d3b50f140111c2b01cbc52c75221640258084ab582ce6340"
        }
      ],
      "digest": "sha256:648dc0feb2c9a94602f71f83edc6f090c2457a2bc9752c1d9936777dcd65afaa"
    }
  }
}
