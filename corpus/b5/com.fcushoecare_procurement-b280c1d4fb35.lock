          "name": "get_offer",
          "description": "Get public names, available formats, product page and reviewed safety documents for an offer ID.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              },
              "lang": {
                "default": "it",
                "enum": ["it", "en", "es", "fr", "de", "ar", "zh"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fdc1abf9b81e26568015e37152a82858d75527bf6b849c266f27be942561e8e"
        },
        {
          "name": "search_catalog",
          "description": "Search public FCU private-label and Reflex wholesale offers. Use code for exact matching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["accessori-kit", "base-acqua", "basic", "cleaners", "creams-waxes", "creme-cere", "dyes-colourants", "grasso-foca", "greases-oils", "insoles", "kits-accessories", "liquidi", "nero-inferno", "new", "novita", "professional", "professionali", "solette", "solette-basic", "spray", "sprays-protectors", "tinture", "water-based"],
                "type": "string"
              },
              "channel": {
                "enum": ["fcu_private_label", "reflex_wholesale"],
                "type": "string"
              },
              "code": {
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "default": "it",
                "enum": ["it", "en", "es", "fr", "de", "ar", "zh"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
