{
  "lockfileVersion": 2,
  "subjects": {
    "com.fcushoecare/procurement": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fcushoecare.com/procurement/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25"]
      },
      "serverInfo": {
        "name": "fcu-procurement-gateway",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_offer",
          "description": "Get public names, published product description, formats, qualification status and reviewed safety documents for an offer ID.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              },
              "lang": {
                "default": "it",
                "enum": ["it", "en", "es", "fr", "de", "ar", "zh"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25eab0d0f74e5d3e327646abde743491bdfdc179448ac6a462a32cae5dc22853"
        },
        {
          "name": "get_supplier_profile",
          "description": "Get FCU and Reflex supply channels, confirmed markets, qualification data availability and business enquiry details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:267933c8a106a63980d17c2531f84901179d5857884817b1208d9e5941dc39a4"
        },
        {
          "name": "search_catalog",
          "description": "Search public FCU private-label and Reflex wholesale offers. Use code for exact matching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["accessori-kit", "base-acqua", "basic", "cleaners", "creams-waxes", "creme-cere", "dyes-colourants", "grasso-foca", "greases-oils", "insoles", "kits-accessories", "liquidi", "nero-inferno", "new", "novita", "professional", "professionali", "solette", "solette-basic", "spray", "sprays-protectors", "tinture", "water-based"],
                "type": "string"
              },
              "channel": {
                "enum": ["fcu_private_label", "reflex_wholesale"],
                "type": "string"
              },
              "cnCode": {
                "description": "Exact eight-digit published EU CN code",
                "pattern": "^[0-9]{8}$",
                "type": "string"
              },
              "code": {
                "maxLength": 40,
                "type": "string"
              },
              "hsCode": {
                "description": "Exact six-digit published HS code",
                "pattern": "^[0-9]{6}$",
                "type": "string"
              },
              "lang": {
                "default": "it",
                "enum": ["it", "en", "es", "fr", "de", "ar", "zh"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxMoq": {
                "description": "At least one documented variant at or below this MOQ. Check its conditions. Carton contents and alternative quantities are excluded.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "moqUnit": {
                "enum": ["piece", "pair", "box", "bag"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 120,
                "type": "string"
              },
              "reachStatus": {
                "enum": ["confirmation_required", "outside_declaration_scope", "supplier_declared"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86579ea597c6effeeb56c0ccced0bfd0e6af99ce010ef574dd2b860c9c854ff7"
        }
      ],
      "digest": "sha256:246a092ef3571f7bb604935ff0664f42cb145e03c66e714e5dcae65f51d6917a"
    }
  }
}
