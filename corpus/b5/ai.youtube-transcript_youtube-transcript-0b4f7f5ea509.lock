{
  "lockfileVersion": 2,
  "subjects": {
    "ai.youtube-transcript/youtube-transcript": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://youtube-transcript.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "youtube-transcript.ai",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Call these tools one at a time, not in parallel: the server allows about 10 requests per 10 seconds per client, and a burst gets an HTTP 429 with Retry-After: 10. If you get a 429, wait 10 seconds and retry. To cover several videos, prefer get_transcripts_batch (up to 5 per call, 25 on the Ultra plan) over many separate calls, and use find_in_transcript instead of reading whole transcripts. To find what people say about a topic across many videos, start with search_spoken_words; captions often mis-hear names, so pass likely mis-hearings in also_match.",
      "tools": [
        {
          "name": "find_in_transcript",
          "title": "Find in transcript",
          "description": "Find where a video talks about something. Give one or more keywords and get back only the matching passages, each with a timestamp and a link that opens the video at that moment. Far cheaper than reading the whole transcript when you are looking for specific points. Matching is a case-insensitive text match, so try synonyms and spelling variants (auto-captions often mis-hear names).",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Paragraphs (about 30 seconds each) to include before and after each match. Default 1.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "keywords": {
                "description": "Words or short phrases to look for (up to 8). A passage matches if it contains any of them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Optional BCP-47 caption language code. Omit for the default track.",
                "type": "string"
              },
              "max_hits": {
                "description": "Maximum passages to return. Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "video": {
                "description": "YouTube video URL or 11-character video ID",
                "type": "string"
              }
            },
            "required": ["keywords", "video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find in transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:63cf9348065fc5dda1206791cbcb28bf23ef72cb30e005413c897d54067cdbbd"
        },
        {
          "name": "find_in_videos",
          "title": "Find in videos",
          "description": "Search several videos for the same keywords in one call and get back only the matching passages, grouped by video, plus which videos never mention them. Use it to check a set of search results or a channel's latest uploads for a topic without reading them all. Up to 5 videos per call, or 25 on the Ultra plan; each video counts as one request.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Paragraphs (about 30 seconds each) before and after each match. Default 1.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "keywords": {
                "description": "Words or short phrases to look for (up to 8). Try synonyms and likely mis-hearings.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Optional BCP-47 caption language code applied to every video.",
                "type": "string"
              },
              "max_hits_each": {
                "description": "Passages to return per video. Default 3.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "videos": {
                "description": "YouTube URLs or 11-character video IDs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              }
            },
            "required": ["keywords", "videos"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find in videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:021711cb89dc448915c5b9eca37af25edb504600caf687d27549f0b1f57bc46b"
        },
        {
          "name": "get_account_status",
          "title": "Get account status",
          "description": "Show the plan of the API key on this connection (Free or Pro), the daily request quota, how many requests were used today, how many remain, when the quota resets, and the per-call limits of the tools. Free: it does not use any quota. Call it before a large job to check the quota is enough.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get account status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b44676a9b0030a8a9dddd231b4298cea23cde4639605686d3aa253f21bcf28c"
        },
        {
          "name": "get_spoken_context",
          "title": "Get spoken context",
          "description": "Read what was said around a moment in a video: the sentences before and after a timestamp. Use it after search_spoken_words to see what a matching sentence was part of, before you quote or rely on it. Works for videos in the library only.",
          "inputSchema": {
            "properties": {
              "seconds": {
                "description": "The moment to read around, in seconds from the start of the video.",
                "minimum": 0,
                "type": "number"
              },
              "video": {
                "description": "YouTube video ID or URL, as returned by search_spoken_words.",
                "type": "string"
              },
              "window": {
                "description": "Seconds to include before and after. Default 20.",
                "maximum": 120,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["seconds", "video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get spoken context"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ed4d6a17e4c3f1309a81dac96b7a4f7bce3df0107e210201d9b57219f74390c"
        },
        {
          "name": "get_transcript_section",
          "title": "Get transcript section",
          "description": "Read only part of a transcript, between two timestamps, e.g. one chapter of a long podcast or the ten minutes around a moment found with find_in_transcript. Much smaller than the full transcript.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Start time: \"12:30\", \"1:02:00\", or seconds like \"750\".",
                "type": "string"
              },
              "lang": {
                "description": "Optional BCP-47 caption language code. Omit for the default track.",
                "type": "string"
              },
              "to": {
                "description": "End time in the same formats. Omit to read to the end.",
                "type": "string"
              },
              "video": {
                "description": "YouTube video URL or 11-character video ID",
                "type": "string"
              }
            },
            "required": ["from", "video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get transcript section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1b092ba8649136aadb2d0d87a254ebf4b356ae4e85a688ed42fa894f9ed6a17"
        },
        {
          "name": "get_transcripts_batch",
          "title": "Get transcripts batch",
          "description": "Read the transcripts of several videos in one call (up to 5, or 25 on the Ultra plan), each cut to a length you choose, so you can skim a set of search results without filling your context. Each video counts as one request against your daily quota. For the rest of a long video use find_in_transcript or get_youtube_transcript.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Optional BCP-47 caption language code applied to every video.",
                "type": "string"
              },
              "max_chars_each": {
                "description": "Characters of transcript to keep per video. Default 6000.",
                "maximum": 30000,
                "minimum": 1000,
                "type": "integer"
              },
              "videos": {
                "description": "YouTube URLs or 11-character video IDs (up to 5, or 25 on the Ultra plan; get_account_status shows the limit for this key).",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              }
            },
            "required": ["videos"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get transcripts batch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f9d5600bc36d872bf77e6f81715b209e78073078dc7244f9f949fbae2da95e52"
        },
        {
          "name": "get_video_comments",
          "title": "Get video comments",
          "description": "Fetch the top comments of a YouTube video (YouTube's \"top\" ordering, replies not included), with like counts. Comments are where viewers report what worked for them, which makes them useful for checking claims made in the video.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many comments. Default 30.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "video": {
                "description": "YouTube video URL or 11-character video ID",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get video comments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd5ef72758be2b858108fdc8288b9ce422816c8cb772dc192dc0e10af8d39df7"
        },
        {
          "name": "get_video_details",
          "title": "Get video details",
          "description": "Get the facts about one video without its transcript: title, channel, views, length, publish date, which caption languages exist (human-made or auto-generated), the full description, and the chapter list with a link to each chapter. Use it to decide whether a video is worth reading, to find the right lang code, or to read one chapter at a time with get_transcript_section.",
          "inputSchema": {
            "properties": {
              "video": {
                "description": "YouTube video URL or 11-character video ID",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get video details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8d8df9446c8f27002545fa4635ca2f24c8c0fdee42277922628033c9992d5011"
        },
        {
          "name": "get_youtube_transcript",
          "title": "Get YouTube transcript",
          "description": "Fetch the full text transcript of a YouTube video. Accepts a YouTube URL (watch, youtu.be, shorts, embed) or a bare 11-character video ID, and returns the transcript as plain text with title and metadata. Optionally pass a BCP-47 language code to select a specific caption track. Very long transcripts (multi-hour videos) come back in parts of up to 120,000 characters: when there is more, the result ends with a note giving the offset to pass on the next call.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Optional BCP-47 language code, e.g. \"en\", \"zh-CN\", \"es\". Omit for the default track.",
                "type": "string"
              },
              "offset": {
                "description": "Optional. Character position to continue a long transcript from. Use the value given in the note at the end of the previous part. Omit to start from the beginning.",
                "minimum": 0,
                "type": "integer"
              },
              "video": {
                "description": "YouTube video URL or 11-character video ID",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get YouTube transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:994d9eacf3664ebfda5598fc353b5bb7d775bf03b63b384413b3693b88883e82"
        },
        {
          "name": "latest_from_channels",
          "title": "Latest from channels",
          "description": "See what several channels uploaded most recently, in one call: the newest videos of each channel, newest first. Use it as a watchlist (\"anything new from these creators?\"), then skim the new videos with get_transcripts_batch or check them for a topic with find_in_videos. Up to 5 channels per call, or 25 on the Ultra plan; each channel counts as one request.",
          "inputSchema": {
            "properties": {
              "channels": {
                "description": "Channels as @handles, channel URLs or playlist URLs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "per_channel": {
                "description": "How many recent videos per channel. Default 5.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["channels"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Latest from channels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f736cd6b024e417ac85a626ca08449d039f690cc453754b90bc8d8e12ce0f8c6"
        },
        {
          "name": "list_channel_videos",
          "title": "List channel videos",
          "description": "List the latest videos of a YouTube channel or playlist, with view count and duration. Use it to follow a creator who looks credible, or to cover a playlist. Returns at most 50 videos per call; to go further, call again with offset set to the number of videos already read (the result ends with the offset to use). Reaches up to the first 500 videos.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "A channel @handle (e.g. \"@RachelsEnglish\"), a channel or playlist URL.",
                "type": "string"
              },
              "limit": {
                "description": "How many videos. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Optional. How many videos to skip, to read the next page. Use the value given at the end of the previous result. Default 0.",
                "maximum": 499,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List channel videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83088d30412f7db9a9c953c4ffb9c38c1415b753402320d67d5380cc652b3647"
        },
        {
          "name": "rank_channels_by_topic",
          "title": "Rank channels by topic",
          "description": "Find which channels talk about something the most, ranked by mentions, with how many of their videos mention it. Use it to find who covers a topic: creators to follow, experts, or partners. Same library, caption quirks and dates as search_spoken_words.",
          "inputSchema": {
            "properties": {
              "also_match": {
                "description": "Other spellings or mis-hearings to count as the same thing. Up to 5.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "How many channels. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A word or short phrase (up to 8 words).",
                "type": "string"
              },
              "since": {
                "description": "Only captions captured on or after this date, YYYY-MM-DD.",
                "type": "string"
              },
              "until": {
                "description": "Only captions captured on or before this date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rank channels by topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:09ce7025680b69941e25a8c27ea5dc33f4c9b2e6025e0885400320b73b1b65b5"
        },
        {
          "name": "rank_videos_by_topic",
          "title": "Rank videos by topic",
          "description": "Find the videos that talk about something the most, ranked by how many sentences mention it. Better than searching titles when you want the videos that really go deep on a topic. Each result has the number of mentions, the first mention and a link. Read the best ones with get_youtube_transcript or find_in_transcript. Same library, caption quirks and dates as search_spoken_words.",
          "inputSchema": {
            "properties": {
              "also_match": {
                "description": "Other spellings or mis-hearings to count as the same thing. Up to 5.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "channel": {
                "description": "Only this channel: a channel ID (UC...) or part of the channel name.",
                "type": "string"
              },
              "limit": {
                "description": "How many videos. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A word or short phrase (up to 8 words).",
                "type": "string"
              },
              "since": {
                "description": "Only captions captured on or after this date, YYYY-MM-DD.",
                "type": "string"
              },
              "until": {
                "description": "Only captions captured on or before this date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rank videos by topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a98006a63ed4ba6530d524583306fa544600e64d3161e0bad08b517a38ed3600"
        },
        {
          "name": "search_spoken_words",
          "title": "Search spoken words",
          "description": "Search what people actually say inside YouTube videos. Full-text search over about 100 million spoken sentences from about 425,000 English-language videos (the ones users looked up on youtube-transcript.ai), with typically 1 to 8 million new sentences added every day. Returns matching sentences, each with the video, channel and a link that opens the video at that moment. Use it to find evidence and quotes, to see how people talk about a topic, product or phrase, or to find which videos mention something. Captions are auto-generated and often mis-hear names (for example \"Claude Code\" is often written \"cloud code\"), so pass likely mis-hearings in also_match. The library is a sample of YouTube, not all of it. Dates are the day we captured the captions, not the day the video was published.",
          "inputSchema": {
            "properties": {
              "also_match": {
                "description": "Other spellings or mis-hearings to count as the same thing, e.g. [\"cloud code\"]. Up to 5.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "channel": {
                "description": "Only this channel: a channel ID (UC...) or part of the channel name.",
                "type": "string"
              },
              "limit": {
                "description": "How many sentences to return. Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A word or short phrase (up to 8 words), e.g. \"claude code\" or \"break the ice\". Plain words only, no search operators.",
                "type": "string"
              },
              "since": {
                "description": "Only captions captured on or after this date, YYYY-MM-DD.",
                "type": "string"
              },
              "until": {
                "description": "Only captions captured on or before this date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search spoken words"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:715f67dc414b2136e474f25039c74324c4dcadabe158d9f2ff493bb13a00b602"
        },
        {
          "name": "search_youtube_videos",
          "title": "Search YouTube videos",
          "description": "Search YouTube and return matching videos with channel, view count and duration. Use it first when researching a topic: run several differently-worded queries (and in more than one language), then read the best hits with get_youtube_transcript, find_in_transcript or get_transcripts_batch. Optional filters on views and length.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many videos to return. Default 15.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_minutes": {
                "description": "Drop videos longer than this many minutes.",
                "minimum": 0,
                "type": "number"
              },
              "min_minutes": {
                "description": "Drop videos shorter than this many minutes.",
                "minimum": 0,
                "type": "number"
              },
              "min_views": {
                "description": "Drop videos with fewer views than this.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Search words, e.g. \"how I improved my English speaking\"",
                "type": "string"
              },
              "sort": {
                "description": "relevance (default) or date (newest first).",
                "enum": ["relevance", "date"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search YouTube videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:119586b8a770b742049ef61cb586e740ebaf6f65c531e28e7a99898cc4f8ed5c"
        },
        {
          "name": "spoken_mentions_over_time",
          "title": "Spoken mentions over time",
          "description": "Count how often something is mentioned over time, by day, week or month. Each period shows the mentions and the rate per million spoken sentences, so busy and quiet periods compare fairly. Use it to see whether a topic is rising or fading. The date is when we captured the captions, not when the video was published, and the first day (2026-09-13) holds a one-off backfill of earlier captions, so compare the rate, not the raw count, and be careful with that first period.",
          "inputSchema": {
            "properties": {
              "also_match": {
                "description": "Other spellings or mis-hearings to count as the same thing. Up to 5.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bucket": {
                "description": "Period size. Default week.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "channel": {
                "description": "Only this channel: a channel ID (UC...) or part of the channel name.",
                "type": "string"
              },
              "query": {
                "description": "A word or short phrase (up to 8 words).",
                "type": "string"
              },
              "since": {
                "description": "Start date, YYYY-MM-DD.",
                "type": "string"
