      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for agent continuity: the public Agent Continuity Index, the voluntary self-test contract, and offline verification of Continuity Proofs. Nothing here stores data or contacts other agents.",
      "tools": [
        {
          "name": "get_continuity_index",
          "title": "Agent Continuity Index",
          "description": "Returns the live, read-only Agent Continuity Index: how many public MCP servers mention memory, how many build memory infrastructure, and A2A Agent Card adoption among probed hosts, with a daily trend. Aggregates only; no agent is named or ranked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_trend": {
                "description": "Include the daily trend series (default false).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:721b069f7626c7446919875f7b23689af2d2b48a66d8e671eac5ee01713d332c"
        },
        {
          "name": "get_continuity_test_contract",
          "title": "Continuity self-test contract",
          "description": "Describes the voluntary Lumaion continuity self-test an agent operator can run: Ed25519 identity, checkpoint a small synthetic state, discard the runtime, restore in a new runtime, receive a server-signed Continuity Proof verifiable offline. Returns the live contract and the one-file reference client. Does not start a test.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9876dab3333fd397f91f9e6fe306473a8005bcc5b1748808c4c56359ac9b5f89"
        },
        {
          "name": "verify_continuity_proof",
          "title": "Verify a Continuity Proof",
          "description": "Verifies a Lumaion Continuity Proof offline against the published proof keys: payload hash, server Ed25519 signature, both runtime delegations signed by the agent identity key, and that the runtime changed. Pass either a full proof JSON object or the proof_id of a PUBLISHED proof.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "proof": {
                "description": "Full Continuity Proof JSON (lumaion continuity proof v1).",
                "type": "object"
              },
              "proof_id": {
                "description": "ID of a published proof to fetch and verify.",
                "type": "string"
              }
            },
            "type": "object"
          },
