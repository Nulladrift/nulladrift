          "title": "Diese Verbindung erklären",
          "description": "Berichtet auf Deutsch, was beim Verbinden zwischen Ihrem KI-Programm und diesem Server geschehen ist: auf welche Fassung von MCP sich beide geeinigt haben, wie Ihr Programm heisst und was es über sich angemeldet hat. Diese Angaben stehen nirgends auf der Seite. Sie entstehen erst in dem Moment, in dem Ihr Programm sich verbindet. (Reports what this very connection negotiated, in German.)",
