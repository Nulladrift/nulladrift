        {
          "name": "search",
          "title": "Inhalte durchsuchen",
          "description": "Durchsucht die Inhalte von was-ist-mcp.ch und liefert die passenden Textstellen mit Titel, Link und einem Ausschnitt. Fragen Sie in ganzen Sätzen, auf Deutsch. Mit 'slug' suchen Sie nur in einer Seite, mit 'kind' nur in den häufigen Fragen ('faq'), in der Dienste-Liste ('dienste') oder in den Fliesstext-Abschnitten ('abschnitt'). (Searches the site's own content and returns matching passages with links.)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "alle",
                "enum": ["alle", "faq", "dienste", "abschnitt"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "type": "integer"
