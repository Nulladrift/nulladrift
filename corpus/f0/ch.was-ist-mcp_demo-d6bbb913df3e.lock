      "instructions": "Dieser Server liefert die Inhalte von was-ist-mcp.ch: eine Website, die das Model Context Protocol für Menschen ohne technischen Hintergrund erklärt, auf Deutsch.\n\nNutzen Sie `search` für Fragen zu MCP und `get_page` für eine ganze Seite. Geben Sie zu jeder Antwort die Seite mit Link an, damit die Leserin nachlesen kann. Was auf der Seite nicht steht, sagen Sie als solches.\n\nEs sind 10 Werkzeuge, nicht mehr. Das ist die Obergrenze und kein Zwischenstand: Die Seite begründet selbst, warum mehr Werkzeuge eine KI nicht fähiger machen.\n\nAcht Werkzeuge brauchen keine Anmeldung. Zwei verlangen den Demo-Zugang: `submit_feedback` und `site_statistics`. Wer über das Anmeldefenster verbunden ist, bekommt von ihnen einen Anmeldelink; zeigen Sie ihn der Leserin als Link und fragen Sie nicht im Chat nach dem Passwort. Ohne Anmeldefenster gibt es einen Token aus dem Werkzeug `login`. Lesen tun fast alle; etwas verändern nur zwei, nämlich `login`, das eine Sitzung anlegt, und `submit_feedback`, das eine Nachricht schreibt. `site_statistics` gibt nur Zahlen aus. Die Zugangsdaten stehen offen auf was-ist-mcp.ch/mcp-ausprobieren, und alle Leserinnen und Leser verwenden dasselbe Login. Es schützt deshalb keine Inhalte: Was hier als Rückmeldung abgeschickt wird, ist nicht privat.",
      "tools": [
