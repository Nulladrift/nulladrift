        },
        {
          "name": "screen_bank",
          "title": "Screen bank / wire",
          "description": "Counterparty-bank and wire screening: give a BIC (SWIFT), IBAN, US ABA routing number or LEI, and/or a bank name and country, optionally the beneficiary name. Returns allow / review / block with reasons: identifier checksum, the institution from GLEIF (legal name, country, status), jurisdiction lists (FATF call-for-action and increased monitoring, EU high-risk third countries, FinCEN Section 311 jurisdictions, comprehensive US sanctions programmes), the bank on sanctions lists, FinCEN 311 / 9714 institutions, and enforcement actions naming the bank. Use before releasing a wire, onboarding a correspondent or paying a new supplier's bank.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beneficiary_name": {
                "description": "Beneficiary (payee) name on the wire, screened against sanctions lists",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country of the bank, if known",
                "type": "string"
              },
              "identifier": {
                "description": "BIC (e.g. DEUTDEFF), IBAN, 9-digit ABA routing number or 20-char LEI",
                "type": "string"
              },
              "name": {
                "description": "Bank name (used when the identifier is missing or cannot be resolved)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen bank / wire"
