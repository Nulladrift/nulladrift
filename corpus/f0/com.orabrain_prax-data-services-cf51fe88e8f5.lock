      "instructions": "Prax Data Services: security and compliance intelligence for financial services. Use screen_wallet before paying, onboarding or interacting with any EVM address (sanctions, exploits, phishing, scams, exposure); screen_transfer before a transfer is signed (allow/review/block with reasons); screen_entity for sanctions screening of a person, company, vessel or address; analyze_transaction for a tx hash; screen_bank before releasing a wire or onboarding a correspondent (BIC / IBAN / ABA / LEI: jurisdiction lists, sanctions, FinCEN 311, enforcement); screen_enforcement for a firm's regulatory enforcement history; screen_licence to check MSB / BitLicense / MiCA / VARA / SFC / FCA registrations; screen_country for a country's FATF, EU, FinCEN 311, sanctions and export-control standing; screen_company to verify a counterparty exists and who runs it (GLEIF, Companies House, EDGAR); screen_adverse_media for negative news; screen_domain / screen_ip before trusting a sender, a payment-instruction change or a login; screen_securities before trading or custodying an instrument; screen_company to verify a counterparty exists and who runs it (GLEIF, Companies House, EDGAR); screen_adverse_media for negative news; screen_domain / screen_ip before trusting a sender, a payment-instruction change or a login; screen_securities before trading or custodying an instrument; search/fetch to explore Prax intel; get_alerts for the last 24h of approved threat intel (where enabled on the account). Example prompts: \"is 0x... safe to pay?\", \"can we wire to BIC DEUTDEFF?\", \"any enforcement actions against Acme Bank?\", \"is Acme Payments a registered MSB?\", \"how risky is paying a supplier in Vietnam?\", \"is Acme Ltd on the BIS Entity List?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"how risky is paying a supplier in Vietnam?\", \"is Acme Ltd on the BIS Entity List?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"how risky is paying a supplier in Vietnam?\", \"is Acme Ltd on the BIS Entity List?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"how risky is paying a supplier in Vietnam?\", \"is Acme Ltd on the BIS Entity List?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"does Acme Ltd exist and who are its directors?\", \"any bad news on Acme Capital?\", \"is ap@acme-invoices.com legitimate?\", \"can we trade ISIN US0378331005?\", \"screen Acme Trading Ltd against sanctions\", \"what happened in tx 0x...?\", \"any new exploit alerts today?\". If a tool replies status=upgrade_required, tell the user that feature is not enabled on their Prax account and that they can enable it from their Prax account settings. Scores and references only; output is licensed for use inside the caller's own product (no resale, redistribution, training or competing use; Terms: https://mcp.orabrain.com/portal/terms).",
