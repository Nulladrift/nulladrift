      "serverInfo": {
        "name": "prax-data-services",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Prax Data Services: security and compliance intelligence for financial services. Use screen_wallet before paying, onboarding or interacting with any EVM address (sanctions, exploits, phishing, scams, exposure); screen_transfer before a transfer is signed (allow/review/block with reasons); screen_entity for sanctions screening of a person, company, vessel or address; analyze_transaction for a tx hash; screen_bank before releasing a wire or onboarding a correspondent (BIC / IBAN / ABA / LEI: jurisdiction lists, sanctions, FinCEN 311, enforcement); screen_enforcement for a firm's regulatory enforcement history; screen_licence to check MSB / BitLicense / FCA registrations; search/fetch to explore Prax intel; get_alerts for the last 24h of approved threat intel (Business plan). Example prompts: \"is 0x... safe to pay?\", \"can we wire to BIC DEUTDEFF?\", \"any enforcement actions against Acme Bank?\", \"is Acme Payments a registered MSB?\", \"screen Acme Trading Ltd against sanctions\", \"what happened in tx 0x...?\", \"any new exploit alerts today?\". If a tool replies status=upgrade_required, tell the user which plan unlocks it (https://mcp.orabrain.com/portal/billing). Scores and references only; output is licensed for use inside the caller's own product (no resale, redistribution, training or competing use; Terms: https://mcp.orabrain.com/portal/terms).",
      "tools": [
        {
          "name": "analyze_transaction",
          "title": "Analyze transaction",
          "description": "Transaction risk analysis: given an EVM transaction hash, returns status, value, counterparties and the risk of both sides (sanctions, exploit, phishing, scam exposure) with flags. Use for post-trade monitoring, incident triage and fraud investigation. Builder plan and above.",
          "inputSchema": {
            "properties": {
              "chain": {
                "default": "eth",
                "type": "string"
              },
              "hash": {
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze Transaction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:588e54cb7567fbb72cedb2d47408b1fdc3f28fd5d87f4f27f19e818157e5daea"
        },
        {
          "name": "fetch",
          "title": "Fetch intel record",
          "description": "Fetch the full Prax intelligence record for an id returned by search (address:<chain>:<addr>, tx:<chain>:<hash>, alert:<id>). Business plan and above.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch"
          },
          "behavior": {
