            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb2eab452d444a507e2b1f8d35c56de97aa70a3c882e3c5ef763b2bf6a1697ab"
        },
        {
          "name": "get_alerts",
          "title": "Threat-intel alerts (24h)",
          "description": "Threat-intelligence alert feed: approved Prax alerts from the last 24 hours (new exploits, attacker wallets, malicious contracts, phishing campaigns, sanctions updates), newest first, same payload as the webhook feed. Use for SOC / compliance monitoring and watchlist updates. Business plan and above; 100 credits per pull.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 50,
                "type": "integer"
              },
              "severity": {
                "type": "string"
              },
              "since_hours": {
                "default": 24,
                "maximum": 24,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Alerts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d563a6428cfa255dd929da69e9e6ac24c6fb895528292494c4a0695073497ae4"
        },
        {
          "name": "screen_bank",
          "title": "Screen bank / wire",
          "description": "Counterparty-bank and wire screening: give a BIC (SWIFT), IBAN, US ABA routing number or LEI, and/or a bank name and country, optionally the beneficiary name. Returns allow / review / block with reasons: identifier checksum, the institution from GLEIF (legal name, country, status), jurisdiction lists (FATF call-for-action and increased monitoring, EU high-risk third countries, FinCEN Section 311 jurisdictions, comprehensive US sanctions programmes), the bank on sanctions lists, FinCEN 311 / 9714 institutions, and enforcement actions naming the bank. Use before releasing a wire, onboarding a correspondent or paying a new supplier's bank. Free plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beneficiary_name": {
                "description": "Beneficiary (payee) name on the wire, screened against sanctions lists",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country of the bank, if known",
                "type": "string"
              },
              "identifier": {
                "description": "BIC (e.g. DEUTDEFF), IBAN, 9-digit ABA routing number or 20-char LEI",
                "type": "string"
              },
              "name": {
                "description": "Bank name (used when the identifier is missing or cannot be resolved)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen bank / wire"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e03c1f5faedb500b2795274abc87e0c6ffad560b162cfb4f3c55c13451d9ad79"
        },
        {
          "name": "screen_enforcement",
          "title": "Enforcement history",
          "description": "Regulatory enforcement history for a bank, fintech, money services business, crypto firm or individual: consent orders, civil money penalties, fines, final notices, bars and charges from the Federal Reserve, OCC, FDIC, FinCEN, SEC, CFTC and the UK FCA, pulled continuously from the regulators' own releases. Returns match / possible_match / no_match with each action's authority, date, type, title and link. Use in vendor onboarding, correspondent due diligence, KYB and partner reviews. Builder plan and above.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max actions to return (default 20, max 50)",
                "type": "integer"
              },
              "name": {
                "description": "Institution or person name",
                "type": "string"
              },
              "years": {
                "description": "Only actions from the last N years (default: all)",
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Enforcement history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b816020f44778d53f6714a8cb852ca80102803283cabcc046cb93b7004d8dc9"
        },
        {
          "name": "screen_entity",
          "title": "Sanctions screening",
          "description": "Sanctions screening for people, companies, vessels and crypto addresses: fuzzy name match (aliases, transliterations) or exact wallet / contract lookup against the sanctions lists Prax pulls continuously: US OFAC (SDN and Consolidated), UK OFSI, EU, UN and Swiss SECO, every crypto address they list on any chain. Returns match / possible_match / no_match with hits (entity, type, programs, list, aliases, linked crypto addresses, score). Use for KYC / KYB onboarding and payment screening. Free plan.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "type": {
                "description": "optional: individual, entity, vessel, aircraft",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen Entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a6b69aa5dd4d5e1d61b51c45761780c657d3dd47874ad0e2560fbb2cc73c45be"
        },
        {
          "name": "screen_licence",
          "title": "Licence / registration check",
          "description": "Is this payments or digital-asset firm registered or licensed, where, and is it active: FinCEN MSB registrations (US), NY DFS virtual-currency licensees and trust charters, the UK FCA Financial Services Register (live), plus the firm's LEI record. Returns licensed / possible_match / not_found with every registration found (authority, number, status, activities, link) and the registries covered, so absence is reported as absence from those registries, not as proof. Use for fintech and VASP onboarding, partner due diligence and crypto-to-bank flows. Builder plan and above.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Country or region to narrow to (US, US-NY, GB)",
                "type": "string"
              },
              "name": {
                "description": "Firm name (legal or trading name)",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Licence / registration check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c00a85ca9d9924a673df4d544688271e8bc954a730d4bff522d1c0e3f1a7abb7"
        },
        {
          "name": "screen_transfer",
          "title": "Screen transfer (pre-sign)",
          "description": "Pre-signature transfer check (payment screening): is it safe to send `amount` of `asset` from `from` to `to`? Returns allow / review / block with reasons - sanctioned or flagged parties, malicious or scam token, look-alike address poisoning, first-time payee. Works before the transaction exists; no chain lookup needed. Use in wallet, custody, payment and treasury flows. Builder plan and above.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "in the asset's own units",
                "type": "number"
              },
              "asset": {
                "default": "native",
                "description": "'native' or token contract address",
                "type": "string"
              },
              "chain": {
                "default": "eth",
                "type": "string"
              },
              "from": {
                "description": "sender address",
                "type": "string"
              },
              "to": {
                "description": "recipient address",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen Transfer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9164c2a20b035bc898593f90ae576eae1f18c8c276721c27190f16eb032f0552"
        },
        {
          "name": "screen_transfers_batch",
          "title": "Screen transfers (batch)",
          "description": "Bulk transfer screening: screen_transfer for up to 50 transfers in one call (items of {from, to, amount, asset, chain}) - payout batches, payroll, exchange withdrawals. Returns a verdict per item and a summary. Builder plan and above; 10 credits per call.",
          "inputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen Transfers Batch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:caf8c62511dba05ba91da753614373d13592eb8860ac8729d8e67dd66a0f9048"
        },
        {
          "name": "screen_wallet",
          "title": "Screen wallet / contract",
          "description": "Wallet and smart-contract risk screening (KYT / AML): check any address (EVM chains for full analysis; Bitcoin, Tron, Solana, Litecoin, Monero and other chains against the sanctions lists) against Prax threat intelligence - OFAC and global sanctions, exploits, hacks, phishing, scams, drainers, mixers, malicious contracts, and first-hop exposure to them. Returns risk band, labels, roles, alerts naming it, counterparties and a plain-language story. Use before onboarding, paying or interacting with an address. Free plan. Set live=true for live on-chain screening too.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "chain": {
                "default": "eth",
                "type": "string"
              },
              "live": {
                "default": false,
                "description": "also run live chain screening (slower)",
                "type": "boolean"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen Wallet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d15df9acf42620f6adf5796e96b0ca3ca8e19b63be473cf7cbadd344499d1136"
        },
        {
          "name": "screen_wallets_batch",
          "title": "Screen wallets (batch)",
          "description": "Bulk wallet screening: screen_wallet for up to 50 addresses in one call - portfolio, customer-base or deposit-address sweeps. Returns per-address risk band and labels plus a summary. Builder plan and above; 10 credits per call.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "chain": {
                "default": "eth",
                "type": "string"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen Wallets Batch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8ad8d97d75d0515fb7d8fb4d64dbcc4898f787a84193bf16472abcf5f57bcc80"
        },
        {
          "name": "search",
          "title": "Search Prax intel",
          "description": "Search Prax threat intelligence in plain words (e.g. 'critical attacker wallets on base this week', 'phishing contracts created by 0x...'). Returns COUNTS of matching addresses (by band, chain, role) plus approved alerts from the last 24 h; address lists are not enumerable - look a specific address up with screen_wallet. Filters: chain (eth, base...), risk band (critical, high), role (attacker wallet, malicious contract, deployer, funding ancestry, clone), period (today, last 7 days, since 2026-10-01), free text (bytecode clone, phishing), 'created by 0x...', 'counterparties of 0x...'. An exact address or tx hash returns that record's id. Use fetch(id) for the full record. Business plan and above.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 50,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dacebc946edbc932169ba06aa83f1fe86af40bb1430ecd95b4389f0af5eb6840"
        }
      ],
      "digest": "sha256:ecc19c80ee535a839b5b0543a62892bd51285463e759b34daa997c2681b4afd2"
    }
  }
