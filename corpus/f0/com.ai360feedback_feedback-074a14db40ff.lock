          },
          "digest": "sha256:91c4fe5cb2f8f37f79149f5e4edc67dc339b27f701fe58f2418581c65f0dbcc3"
        },
        {
          "name": "start_johari",
          "title": "Start a Johari window",
          "description": "Get the link to a free online Johari window: the person picks 6 words that describe them, sends one link to friends or colleagues who pick 6 words for them, and sees their open area, blind spot and hidden area (from 3 answers) with a short AI explanation. A light, playful alternative to a full 360.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
