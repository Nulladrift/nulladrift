      "serverInfo": {
        "name": "ai360feedback",
        "title": "AI360Feedback",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI360Feedback is a free 360-degree feedback tool with AI reports. Use these tools to answer questions about it, give people the link to start a 360, and check a 360's progress from its owner's private link. Feedback itself is always given on the website, never in the chat.",
      "tools": [
        {
          "name": "check_360_status",
          "title": "Check a 360's progress",
          "description": "Check the progress of the user's own 360 from the private link in their 360 email (…/campaigns/access/…): self-assessment done, number of reviewer answers, deadline, whether the report is ready. Returns counts only, never names, emails or feedback.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "private_link": {
                "description": "The private link from the 360 email",
                "maxLength": 400,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["private_link"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a 360's progress"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:71e60ef07181842152688db8ea8be0ac91774d515dd689fba6dbe63b7e1730a7"
        },
        {
          "name": "compare_with",
          "title": "Compare with another 360 tool",
          "description": "Compare AI360Feedback with another 360 feedback tool (e.g. Lattice, Culture Amp, 15Five, Spidergap, Effy, SurveyMonkey): pricing, free option, contract, AI. Returns a table and a link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "Name of the other tool",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare with another 360 tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:892022ba175197efc4aaa76ff060021e2d48e61a27a0bfec8fab24e12ed4d513"
