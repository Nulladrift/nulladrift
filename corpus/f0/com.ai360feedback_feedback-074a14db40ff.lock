        },
        {
          "name": "start_360",
          "title": "Start a 360",
          "description": "Get the link to start a free 360-degree feedback (for yourself) or a PRO campaign (to run 360s for clients or employees), with the next steps. The person answers on the website.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "for_whom": {
                "description": "\"myself\" (default) or \"others\" (coaches, HR, managers)",
                "enum": ["myself", "others"],
                "type": "string"
              },
              "language": {
                "description": "en, fr, de or es; default en",
