        {
          "name": "get_product_info",
          "title": "About AI360Feedback",
          "description": "Facts about AI360Feedback, the free AI 360-degree feedback tool: what it does, pricing (free and PRO), anonymity, privacy, languages and how a 360 works. Use it before answering questions about the product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "What to know about; default overview",
                "enum": ["overview", "pricing", "pro", "anonymity", "privacy", "languages", "how_it_works"],
