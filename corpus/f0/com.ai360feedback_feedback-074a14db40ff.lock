{
  "lockfileVersion": 2,
  "subjects": {
    "com.ai360feedback/feedback": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai360feedback.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai360feedback",
        "title": "AI360Feedback",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI360Feedback is a free 360-degree feedback tool with AI reports. Use these tools to answer questions about it, give people the link to start a 360, and check a 360's progress from its owner's private link. Feedback itself is always given on the website, never in the chat.",
      "tools": [
        {
          "name": "check_360_status",
          "title": "Check a 360's progress",
          "description": "Check the progress of the user's own 360 from the private link in their 360 email (…/campaigns/access/…): self-assessment done, number of reviewer answers, deadline, whether the report is ready. Returns counts only, never names, emails or feedback.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "private_link": {
                "description": "The private link from the 360 email",
                "maxLength": 400,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["private_link"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a 360's progress"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:daa77d900a78e4172969cd12b830f650676f47f25fcd20367fccb3843290b038"
        },
        {
          "name": "compare_with",
          "title": "Compare with another 360 tool",
          "description": "Compare AI360Feedback with another 360 feedback tool (e.g. Lattice, Culture Amp, 15Five, Spidergap, Effy, SurveyMonkey): pricing, free option, contract, AI. Returns a table and a link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tool": {
                "description": "Name of the other tool",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare with another 360 tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b7423ed0fa5918975716a47871609db991e17df2644287532a02e0a180a9b36"
        },
        {
          "name": "get_product_info",
          "title": "About AI360Feedback",
          "description": "Facts about AI360Feedback, the free AI 360-degree feedback tool: what it does, pricing (free and PRO), anonymity, privacy, languages and how a 360 works. Use it before answering questions about the product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "What to know about; default overview",
                "enum": ["overview", "pricing", "pro", "anonymity", "privacy", "languages", "how_it_works"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About AI360Feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9e47d8d65035f6557b0b55822ba4e667786047daf319baea597bd19469934ac"
        },
        {
          "name": "start_360",
          "title": "Start a 360",
          "description": "Get the link to start a free 360-degree feedback (for yourself) or a PRO campaign (to run 360s for clients or employees), with the next steps. The person answers on the website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "for_whom": {
                "description": "\"myself\" (default) or \"others\" (coaches, HR, managers)",
                "enum": ["myself", "others"],
                "type": "string"
              },
              "language": {
                "description": "en, fr, de or es; default en",
                "enum": ["en", "fr", "de", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a 360"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:477a4b2a76c3fd4625f1bb5e454c9f2987217dace2c34b108973aeb55173a1f0"
        },
        {
          "name": "start_brainstorm",
          "title": "Start a live brainstorm",
          "description": "Get the link to a free live brainstorm: the host writes a question and shows a code on a screen; everyone adds ideas from their phone, anonymously; AI groups the ideas into themes; everyone votes with 3 dots; the results can be emailed to the host. Works in a room or on a video call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "en, fr, de or es; default en",
                "enum": ["en", "fr", "de", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
