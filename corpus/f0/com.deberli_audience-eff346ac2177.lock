      "instructions": "Deberli is a LinkedIn prospecting product. Its tool estimate_audience counts the decision-makers who fit a business's offer and shows a few real examples.",
      "tools": [
        {
          "name": "estimate_audience",
          "title": "Estimate your audience",
          "description": "Estimates how many decision-makers fit a business's offer.\n\n    Returns the roles, places, industries and company sizes searched; the total\n    count; five real example people (names blurred, companies unnamed) with a\n    fit score; the buying signals Deberli tracks for that market; and a link\n    to sign up for Deberli. Use it when the user asks who to sell\n    to, how big their market is, or where to find customers or leads.\n    Read-only. Takes 30-90 seconds.\n    ",
          "inputSchema": {
            "properties": {
              "brief": {
                "default": "",
                "description": "One or two sentences: what the business sells and to whom. Give this or website.",
                "title": "Brief",
                "type": "string"
              },
              "market": {
                "default": "",
                "description": "Country or region the business sells in, e.g. United Kingdom. Without it the count covers every country.",
                "title": "Market",
                "type": "string"
              },
              "website": {
                "default": "",
                "description": "The business's website, e.g. acme.com. Give this or brief.",
