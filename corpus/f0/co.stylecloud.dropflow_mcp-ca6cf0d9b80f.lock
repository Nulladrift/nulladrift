{
  "lockfileVersion": 2,
  "subjects": {
    "co.stylecloud.dropflow/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dropflow.stylecloud.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "dropflow",
        "title": "DropFlow",
        "version": "1.7.0",
        "websiteUrl": "https://dropflow.stylecloud.co/docs/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DropFlow is a free-form canvas page builder for WordPress, made by StyleCloud. This server answers questions about DropFlow from its official docs, block library and changelog. It cannot see or change anyone's website. For how-to questions, call search_docs with 1-3 keywords, then get_doc on the best match, and link the doc URL in your answer. Library blocks are added to a page from the Library in the DropFlow builder.",
      "tools": [
        {
          "name": "get_changelog",
          "title": "DropFlow changelog",
          "description": "The latest DropFlow version and what changed in recent releases, newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many releases to return (default 5).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DropFlow changelog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:618cc3d084e42080288180e501468b709493fa0f55b943a3c2f53a2ae492b450"
        },
        {
          "name": "get_doc",
          "title": "Read a DropFlow doc",
          "description": "Read one DropFlow doc in full, as plain text, by the id from search_docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The doc id.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a DropFlow doc"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc2204a72d1fed7ee7186c0d5a523d4364a722a57121fda0fa121bc8b7817bed"
        },
        {
          "name": "get_library_block",
          "title": "Get a DropFlow library block",
          "description": "Details of one DropFlow Library block by slug: description, category, theme, the DropFlow version it needs, what it contains, and its preview image URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The block slug from list_library.",
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a DropFlow library block"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b21f8c665af1082d1e5f973282975785a01bbcdd0844e56af366c7968c672fee"
        },
        {
          "name": "list_library",
          "title": "Browse the DropFlow library",
          "description": "List ready-made DropFlow Library blocks (sections and pages), optionally filtered by keywords and a category slug. Returns slugs, names, categories and design themes, plus every category with its count. Get one block's details and preview image with get_library_block.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category slug from the categories list.",
                "pattern": "^[a-z0-9-]{1,100}$",
                "type": "string"
              },
              "limit": {
                "description": "How many blocks to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "How many matching blocks to skip, for paging.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Keywords matched against the name, description, category and theme, for example \"pricing\" or \"testimonials monde\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse the DropFlow library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:333e6374e057765de710554c9ba1c82f081220b36ff9c577ca3f6b631342efb8"
        },
        {
          "name": "search_docs",
          "title": "Search the DropFlow docs",
          "description": "Search the official DropFlow documentation. Use 1-3 keywords, for example \"scroll animation\" or \"mobile layout\". Returns matching docs with their id, section, URL and a short excerpt; read one in full with get_doc. Leave the query out to get the whole table of contents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many docs to return (default 5, or 100 for the table of contents).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords to look for.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the DropFlow docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f6463cb537aea0371fe96ccdaf09ce2674e3d2b0d6f8887c099a559159acdb2"
        }
      ],
      "digest": "sha256:c74d6da4547bde23eb38d84a2a92079e4b721cd108223759c6a882dd09139287"
    }
  }
}
