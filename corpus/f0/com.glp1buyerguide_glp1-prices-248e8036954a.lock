      "instructions": "GLP-1 Buyer Guide compares GLP-1 programs on recorded month-to-month price, fees, dose pricing, commitment, cancellation terms and transparency. Rankings are score-based, built from the published criteria. Every figure carries the provider page it was read from and the day it was checked. GLP-1 Buyer Guide and Surfbound Health are both operated by Open Water Rx LLC; that ownership is disclosed wherever Surfbound appears. Sponsored entries are labeled and scored on the same criteria. Compounded medications are not FDA-approved. This data is price and terms information, not medical advice.",
      "tools": [
        {
          "name": "find_glp1_prices",
          "title": "Find GLP-1 Prices",
          "description": "Current US self-pay prices of a compounded GLP-1 medication (semaglutide or tirzepatide, injectable) from GLP-1 Buyer Guide's dated records, returned in the guide's ranked order (score-based), standard month-to-month plans only. Each result names its source page and check date.",
