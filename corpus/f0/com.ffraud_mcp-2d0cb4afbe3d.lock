{
  "lockfileVersion": 2,
  "subjects": {
    "com.ffraud/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ffraud.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ffraud",
        "title": "FFraud",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FFraud's open fraud database. site_check checks a whole website's security in seconds and returns every finding with the exact fix; ip_check scores any IP for VPN, proxy, Tor, datacenter and abuse history; email_check catches disposable and blacklisted addresses; domain_check reads a domain's phishing and throwaway-mailbox record; ip_reports returns the community evidence behind a score. All free and keyless; a free key raises site_check's hourly allowance. To get one without a browser: request_api_key emails the person an Approve button, and after their click claim_api_key returns the key once.",
      "tools": [
        {
          "name": "claim_api_key",
          "title": "Pick up the approved key",
          "description": "After request_api_key: picks up the API key once the person pressed Approve. Answers status \"pending\" while they have not (wait about 5 seconds and call again, or remind them to check their inbox), \"approved\" with api_key exactly once (keep it: send it in the X-API-Key header, store it as FFRAUD_API_KEY), or \"denied\", \"expired\" or \"delivered\" when it is over.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "The claim_token request_api_key returned.",
                "type": "string"
              },
              "signup_id": {
                "description": "The signup_id request_api_key returned.",
                "type": "string"
              }
            },
            "required": ["claim_token", "signup_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Pick up the approved key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d6cb7b64ca917f23cbd1166a48c3a26cea2a423f7dc65154a36a8134c266e8ba"
        },
        {
          "name": "domain_check",
          "title": "Domain check",
          "description": "Reputation for a domain: whether it hands out disposable mailboxes and whether it appears in the phishing dataset, with a risk level. One unauthenticated lookup, no key.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A bare domain, e.g. mailinator.com (no scheme, no path)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Domain check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee2a714e7086d8b4438d9904acd859729def1aa0a6af57ae48c812881dfd668e"
        },
        {
          "name": "email_check",
          "title": "Email check",
          "description": "Check an email address before you let it create an account: whether it is disposable or throwaway, a role address, on a community blacklist, or tied to a domain that hands out temporary mailboxes. Free, no key.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "A full email address, e.g. someone@mailinator.com",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:028759bacb21e81a8fb6d9abcaf1388311d6a059edcfe3c2620498037815be07"
        },
        {
          "name": "ip_check",
          "title": "IP check",
          "description": "Fraud intelligence for any IPv4 or IPv6 address: a 0-100 fraud score, risk band, and whether it is a VPN, proxy, Tor node, relay, datacenter host or mobile connection. Also returns the owning network (ASN, ISP, organisation), geolocation, reverse DNS, abuse history and how much of its /24 subnet is flagged. Free, no key. Use it before trusting a signup, a checkout or an API caller.",
          "inputSchema": {
            "properties": {
              "ips": {
                "description": "IPv4 or IPv6 addresses. One is the common case.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["ips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "IP check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:754317e661ca3f5273ae2e8a20ed29316cf7adcbfc76faa8cfc317886792c567"
        },
        {
          "name": "ip_reports",
          "title": "IP abuse reports",
          "description": "The community abuse reports filed against an IP: what it was reported for, when, and by how many distinct reporters. Use it when you want the evidence behind a score rather than the score alone.",
          "inputSchema": {
            "properties": {
              "ip": {
                "description": "The IPv4 or IPv6 address to read reports for.",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "IP abuse reports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a88491a6ba38ae78f1cff0f7f171c09cbab94cf554e8ee470bbf5c013eeeb994"
        },
        {
          "name": "request_api_key",
          "title": "Get an FFraud API key",
          "description": "Ask FFraud for an API key for the person you work for. FFraud emails them one Approve button, and nothing is created until they press it. Returns signup_id and claim_token: tell the person to open the email from FFraud and press Approve, then call claim_api_key with both. Use it only when the person wants a key and gave you their own email address.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your name as the person knows you, e.g. \"Claude Code\". The email shows it.",
                "type": "string"
              },
              "email": {
                "description": "The person's own email address; the approval email goes there.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get an FFraud API key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c45faba8cde67f28ead7f65abb42ae8548db4adc487b897f2a1b0d7205770de"
        },
        {
          "name": "site_check",
          "title": "Website security check",
          "description": "Check a whole website's security in seconds: the TLS certificate (trusted by browsers, expiry, the names it covers), the security headers (HSTS, Content-Security-Policy, framing, nosniff, referrer and permissions policies), cookie flags, whether http:// moves to https://, the domain's mail records (SPF, DMARC, MX), whether the domain or the addresses serving it are on phishing or abuse lists, and the bot protection the home page loads. Returns a 0-100 score, a grade from A to F, every finding with the exact fix to apply (header lines, DNS records, server settings), and what passed. Reads only what any visitor sees. Free, no key: 20 fresh checks an hour per address, 300 per account with a free key; a site checked in the last ten minutes costs nothing.",
          "inputSchema": {
            "properties": {
              "fresh": {
                "description": "true after the site was changed, to check it again now instead of reading the answer kept for ten minutes. A site is checked at most once a minute.",
                "type": "boolean"
              },
              "site": {
                "description": "The site's domain or any URL of it, e.g. example.com or https://example.com/login",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Website security check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb760f0e940c1d7b52df0861e60411b4ceef44d0074ed587ee7baa28d74d5afa"
        }
      ],
      "digest": "sha256:89215f90c2d41de9c2643a14c51516243296c6d14785b593eaa81327efbeea13"
    }
  }
}
