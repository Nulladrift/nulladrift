            "additionalProperties": false,
            "properties": {
              "brands": {
                "items": {
                  "maxLength": 100,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "page_ids": {
                "items": {
                  "maxLength": 25,
                  "minLength": 3,
                  "pattern": "^[0-9]+$",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare advertisers"
          },
          "behavior": {
