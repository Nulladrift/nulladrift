      "serverInfo": {
        "name": "adspendspy",
        "title": "Meta Ad Library Spend MCP by AdSpendSpy",
        "version": "1.0.0",
        "websiteUrl": "https://www.adspendspy.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AdSpendSpy MCP reads your own AdSpendSpy account: tracked advertisers, their ads, saved lists, projects, alerts and AdSpendSpy spend estimates (estimates by AdSpendSpy, not figures reported by Meta). Find an advertiser with list_tracked_brands or search_tracked_brands, use its string page_id with list_brand_ads, then pass internal_ad_id as get_ad_details.ad_id. Estimated spend is cumulative EUR; timeframe is only a last-seen filter. Each executed authenticated tool consumes one API request; discovery and initialization do not. Prompts rebuild_landing_page and landing_page_teardown guide landing-page research and rebuilds; prompts never consume quota. search_advertisers, get_advertiser_ads, find_similar_advertisers and compare_advertisers work without signing in (one call per day, then sign up on adspendspy.com): they show tracked brands' top ads and a 30-day spend range. With a paid plan get_advertiser_ads can also look up an untracked brand live in the Meta Ad Library. Every other tool reads the user's own AdSpendSpy account and asks them to sign in. To research a new advertiser, explicitly add its known page_id and brand_name with track_brand first. This changes the account and uses a normal tracked-brand slot. Check remaining_slots; imports run in the background and ads may not be ready yet. All ad reads require active tracking, including saved ads. Removal is available only on the AdSpendSpy website, never through MCP. All other tools are read-only.",
      "tools": [
        {
          "name": "check_brands_tracked",
          "title": "Check advertiser tracking",
          "description": "Check whether each string Meta page ID is actively tracked by your account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_ids": {
                "items": {
                  "description": "Meta advertiser page ID, kept as a string.",
                  "pattern": "^[0-9]{5,25}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["page_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check advertiser tracking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b9ee334c1b85b9a6e91b693371c4dea693291293a8efcd458dbaf9f23c53e35"
        },
        {
          "name": "compare_advertisers",
          "title": "Compare advertisers",
          "description": "Compare 2 to 6 tracked advertisers side by side: category, active ads where known, estimated 30-day spend range and one top ad each. A name AdSpendSpy does not track is listed as not tracked and never replaced by a similar brand. No sign-in needed.",
