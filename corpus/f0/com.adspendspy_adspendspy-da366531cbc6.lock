        {
          "name": "get_advertiser_ads",
          "title": "Show an advertiser's Meta ads",
          "description": "Show one brand's active Meta ads (Facebook and Instagram). For brands AdSpendSpy tracks: active ad count, an estimated 30-day spend range split into EU/UK and US where available, and up to six top ads with image or video, headline, text, days running, platforms and landing domain. A brand name is matched exactly; if only similar names exist, it returns them as candidates and no ads. With live_lookup true and a paid AdSpendSpy plan, an untracked brand is looked up live in the Meta Ad Library (up to ten newest ads, no spend). No sign-in needed for tracked brands. Pass page_id when known, otherwise brand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Exact brand or advertiser name as the user wrote it, e.g. \"Gymshark\". Used only when no page_id is given; never matched to a differently named brand.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "default": "ALL",
                "description": "Two-letter ISO country code such as \"DE\", \"US\" or \"GB\" when the user names a country; \"ALL\" for worldwide.",
                "maxLength": 3,
                "minLength": 2,
                "type": "string"
              },
              "live_lookup": {
                "default": false,
                "description": "True only after a previous call returned candidates and none is the brand the user means. Needs a paid AdSpendSpy plan; live lookups are limited per conversation and per day.",
                "type": "boolean"
              },
              "page_id": {
                "description": "Numeric Meta page ID of the advertiser, as returned in earlier results. Preferred when known.",
