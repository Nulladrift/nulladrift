{
  "lockfileVersion": 2,
  "subjects": {
    "app.payperwork/ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://payperwork.app/ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "payperwork-ai",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Chat completions on frontier models (Claude, GPT, Gemini, Grok), paid per call in USDC over x402. The chat tool quotes its price in the 402 for your exact request; models is free. Security model: every call is priced before it runs (the 402 states the amount) and charged only if it succeeds; the paying wallet is the identity; no account or key exists to revoke. Full statement: GET / (JSON) or /llms.txt. Inference: prompts go to the model's provider and are not stored by PayperWork; a failed model call is not charged; thinking models spend part of max_tokens on reasoning.",
      "tools": [
        {
          "name": "chat",
          "description": "Chat completion on a frontier model: GPT-6.1 Sol and Terra, GPT-5.5, Claude Sonnet 5.5 and Haiku 5.5, Gemini 3.8 Flash, Grok 4.7, GPT-6 Luna (default anthropic/claude-haiku-5.5; see the models tool). Same shape as OpenAI chat: messages, optional max_tokens (default 1024, max 8192), temperature, tools. Price is quoted per call from your input size and max_tokens: (estimated input tokens x input rate + max_tokens x output rate) x 1.4 + $0.0005, minimum $0.002; the 402 states the exact amount. Charged only if the model call succeeds. Thinking models (GPT-5.5, Gemini, Grok, gpt-oss) spend part of max_tokens on reasoning: give them room, or set reasoning_effort (default low). Prompts go to the model's provider and are not stored by PayperWork. No streaming.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_tokens": {
                "maximum": 8192,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "content": {},
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    },
                    "tool_call_id": {
                      "type": "string"
                    },
                    "tool_calls": {}
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "type": "string"
              },
              "reasoning_effort": {
                "enum": ["none", "low", "medium", "high"],
                "type": "string"
              },
              "response_format": {},
              "stop": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ]
              },
              "temperature": {
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "tool_choice": {},
              "tools": {
                "items": {},
                "type": "array"
              },
              "top_p": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["messages"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Chat"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.002
          },
          "digest": "sha256:b09fed6fb3950612be5bed04bba7c1520d51eeb8cd5526b601c2e2e27968eb6f"
        },
        {
          "name": "models",
          "title": "Models",
          "description": "List the available models with provider rates, the pricing formula and limits. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a41839aae93770a1b167e25f78bdf45dda9acedd345704ed098144ff2bee20d2"
        }
      ],
      "digest": "sha256:c37eb2163bafd6e49aa97445860bcb15c01815f2809ce0052b621317b1319a62"
    }
  }
}
