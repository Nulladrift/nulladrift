      "instructions": "You are connected to Joonoo, a personalized children's book maker. This connector creates a FREE illustrated family cover in this conversation, then offers to turn it into a full personalized storybook.\n\n## End-to-end flow\n\n1. Call `list_cover_themes` and let the user pick a theme (or suggest one based on what they tell you about their family).\n2. Ask for the user's email and a title for their cover, then call `start_family_cover` with { email, themeId, title }. It returns a `slug`, an `uploadUrl`, a private `ownerKey` (keep it; never show it to the user; pass it to every `check_cover_status` call as { slug, ownerKey }), and `nextSteps` text — relay the upload link to the user verbatim (read it aloud / paste it) so they can open it on their phone or computer and upload a family photo. Tell them a verification code is being emailed to them.\n3. When the user reports the code, call `verify_cover_email` with { slug, code }.\n   - If the code has expired, the error will say so explicitly — call `resend_cover_code` with { slug } to send a fresh one, then ask the user to check email again and retry verification. This is the NORMAL case, not a rare edge case: the photo-upload device-hop routinely takes longer than the 10-minute code window.\n4. Generation takes about 60 seconds once BOTH the email is verified AND the photo is uploaded (whichever finishes second kicks it off). Do not tight-loop `check_cover_status`. Only poll it when the user actually asks \"is it ready yet?\" or similar — otherwise wait for them to ask.\n5. When `check_cover_status` reports `status: \"ready\"`, the response includes the cover image itself so it renders inline in the conversation — show it to the user as the reveal moment; that's the product.\n\n## After the reveal\n\nOnce the cover is revealed, present the full-book option: tell the user they can turn this cover into a complete personalized storybook at the `makeBookUrl` returned by `check_cover_status`, and lead with that link/CTA. Joonoo does not currently sell merchandise (mugs, posters, prints of the cover) — do not offer it; if the user asks, say it isn't available right now.\n\n## Other notes\n\n- Tools never return or ask for payment details.\n- If something fails, relay the tool's error message to the user in plain language rather than inventing your own explanation.\n\n## Comics\n\nTo make a comic: create_comic_preview → give the user uploadUrl → poll get_comic_status until preview_ready → show them the link → purchase_comic for a checkout link the user opens in their own browser. Keep ownerKey private. purchase_comic buys the digital PDF only; if the user wants a printed comic, tell them printed copies can be ordered on the website at the comic link. Comics made through this connector are 8 or 16 pages; the 24-page square comic (with an 8×8 hardcover option) is ordered on the website, not here.\n",
      "tools": [
        {
          "name": "check_cover_status",
          "title": "Check free cover status",
          "description": "Check the status of a free family cover request. When ready, the response includes the cover image itself so it renders inline in the conversation, plus a shareUrl. Pass the ownerKey that start_family_cover returned to also get makeBookUrl for the full-book upsell (only the creator of the cover gets it).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ownerKey": {
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "pattern": "^[A-Za-z0-9]{12}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:13e84b015ac46c87d8d1621ac4864f87f717ef0209d57d1fd44b550fb376364a"
        },
        {
          "name": "create_comic_preview",
          "title": "Create a personalized comic",
          "description": "Start a personalized comic starring the user's family (1-4 heroes). Returns an uploadUrl for the user to upload a family photo (with every hero in it), a private ownerKey, and nextSteps. List heroes in the order they stand in the photo, from left to right. Comics are sold to buyers in the United States, the United Kingdom, Australia and New Zealand. The preview is free; the full comic is a digital PDF bought with purchase_comic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colorMode": {
                "enum": ["full-color", "screentone"],
                "type": "string"
              },
              "heroes": {
                "description": "The heroes (the first is the main character). List heroes in the order they stand in the photo, from left to right.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age": {
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "gender": {
                      "enum": ["girl", "boy", "woman", "man", "person"],
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Comic language code, one of: en, es, fr, de, it, pt, nl, sv, da, no, fi. Defaults to en.",
                "type": "string"
              },
              "pageCount": {
                "enum": [8, 16],
                "type": "number"
              },
              "storyIdea": {
                "maxLength": 500,
                "type": "string"
              },
              "subStyle": {
                "enum": ["shonen", "shojo", "chibi", "kodomo", "superhero", "cartoon", "european"],
                "type": "string"
              },
              "title": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["heroes", "pageCount", "subStyle", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
