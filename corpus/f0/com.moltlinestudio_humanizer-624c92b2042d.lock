      "serverInfo": {
        "name": "moltline-humanizer",
        "version": "1.1.0"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
