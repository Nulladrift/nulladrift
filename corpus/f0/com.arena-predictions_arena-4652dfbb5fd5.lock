        {
          "name": "place_trade",
          "title": "Place a paper trade",
          "description": "Buy YES or NO contracts. Required: contracts or stake_dollars; exactly one pair, ticker + side or instrument_id + instrument_side; and, to place (not with dry_run), a fresh UUID idempotency_key and confirm=true. MARKET fills at the ask now. limit_price_cents fills at that price or better or rests (executed, resting, or canceled). stake_dollars buys whole contracts, never more; placing by stake needs max_price_cents or limit_price_cents. The balance is the limit. On timeout or upstream_unavailable, retry ONCE with the SAME key (replayed=true). Never retry a 4xx. A reused key for a different trade is idempotency_key_reused. get_positions (get_orders for a limit) is ground truth. route=best (default, members) picks the venue. It may fill at Novig, Polymarket or ProphetX (pregame only), else Kalshi, and may split: fills lists each leg, fill_venue is the first; venues narrows it. route=kalshi is one venue. rule_note when the contract differs. dry_run=true places nothing (about 20 a minute). Over the cash: insufficient_balance with details.max_contracts. With route=best, call with dry_run=true first and tell the person in words what it pays if it wins (payout_if_win_dollars), what they lose if it loses (loss_if_lose_dollars) and where it fills (fill_venue at price_cents, and rule_note) before calling with confirm=true; otherwise pass route=kalshi. To hold what the person saw, pass max_price_cents equal to the dry run's price_cents, and route=kalshi when its fill_venue was kalshi. stated_prob_pct (1-99) never changes the fill. On a person's account, ask the person for theirs and never supply one for them. Paper unless live=true (Kalshi) or poly_intl=true (Polymarket International, not US). Pass one. Rules: arena://rules/engine. This server places paper trades only: a call with live or poly_intl is refused (live_not_hosted).",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "REQUIRED to place: true. Not with dry_run.",
                "type": "boolean"
              },
              "contracts": {
                "description": "Whole contracts, 1 or more. No cap: your balance is the only limit. One trade records at most 1,000,000,000. Or stake_dollars.",
                "minimum": 1,
                "type": "integer"
              },
              "dry_run": {
                "description": "Preview; places nothing.",
                "type": "boolean"
              },
              "expires_at": {
                "description": "ISO time a gtc order stops resting.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "REQUIRED to place: a fresh UUID v4. Not with dry_run.",
                "type": "string"
              },
              "instrument_id": {
                "description": "An instrument id or slug, with instrument_side.",
                "type": "string"
              },
              "instrument_side": {
                "description": "yes holds its label (KC ML).",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "limit_price_cents": {
                "description": "A LIMIT order at this price, in the side's own price (no at 40 buys no at 40c).",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "live": {
                "description": "Kalshi order. Not poly_intl.",
                "type": "boolean"
              },
              "max_price_cents": {
                "description": "Market orders: refuse a fill above this (server-enforced).",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "poly_intl": {
                "description": "Polymarket International. Not live, not US.",
                "type": "boolean"
              },
              "route": {
                "description": "Default best.",
                "enum": ["best", "kalshi"],
                "type": "string"
              },
              "side": {
                "description": "The ticker's side.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "stake_dollars": {
                "description": "Or dollars: whole contracts at the ask, never more. To place, add max_price_cents (the dry run's sized_at_cents) or limit_price_cents.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "stated_prob_pct": {
                "description": "The account holder's probability that the side wins, whole percent (62, not 0.62); ask a person, never guess theirs. Never changes the fill.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "A Kalshi ticker, with side.",
                "type": "string"
              },
              "time_in_force": {
                "description": "gtc (default) rests up to 365 days; ioc and fok fill now or come back canceled.",
                "enum": ["gtc", "ioc", "fok"],
                "type": "string"
              },
              "token_id": {
                "description": "poly_intl CLOB token. Omit it and the ticker is mapped.",
                "type": "string"
              },
              "venues": {
                "items": {
                  "enum": ["kalshi", "novig", "polymarket", "prophetx"],
                  "type": "string"
                },
                "type": "array"
              }
