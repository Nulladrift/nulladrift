        {
          "name": "find_price_gaps",
          "title": "Find price gaps across venues",
          "description": "Price gaps across Kalshi, Novig, Polymarket and ProphetX after taker fees: the list without ref (arbitrage first), all pairs with ref. A pair buys YES on one venue and NO on another; edge = 1 - cost per $1 contract. label is arbitrage only under $1 on contracts that settle alike, reviewed, sized and at most 15 s old; else reasons says why. Nothing here is risk-free. Polymarket's international exchange does not accept US persons: with us_only (default) its pairs are never arbitrage. full adds legs and caveats. No sign-in.",
          "inputSchema": {
            "properties": {
              "full": {
                "type": "boolean"
              },
              "league": {
                "description": "The list.",
                "enum": ["nfl", "ncaaf", "mlb", "nhl", "epl", "nba", "ucl", "all"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_gap": {
                "description": "Cents, the list.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "ref": {
                "description": "One instrument; omit for the list.",
                "maxLength": 200,
                "type": "string"
              },
              "size": {
                "description": "Contracts a leg. Default 100.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": "integer"
              },
              "us_only": {
                "description": "Default true.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
