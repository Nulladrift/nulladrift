      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hourproof",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "add_entries",
          "description": "Append logged hours to an existing record. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "record_id": {
                "type": "string"
              }
            },
            "required": ["entries", "record_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1c6339f4f4e147dc2b2c8b2b8701c10f5f4789ea3d50b82bb2abdedb7535d6d"
        },
        {
          "name": "check_hours",
          "description": "Check a list of logged service/volunteer hours for internal consistency: bad dates, non-positive or impossible day totals, missing organization, and days above this service's 8-hour flag. Deterministic arithmetic only - no AI. It does NOT decide whether the hours satisfy any school or award requirement.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Treat this date as \"today\" (YYYY-MM-DD) when rejecting future dates. Defaults to the server date.",
                "type": "string"
              },
              "entries": {
                "description": "Entries to check. Each: {date:\"YYYY-MM-DD\", hours:number, activity:\"what was done\", organization:\"where\", category?:\"tutoring\", notes?}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27c255ab92a77138d09bbdbb6bd8dc86a8b7ec75445373e8521aadf56ef1818d"
        },
        {
          "name": "create_record",
          "description": "Open an hour ledger for one student (returns a record id). Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "period_end": {
                "type": "string"
              },
              "period_start": {
                "type": "string"
              },
              "program": {
                "description": "School, honor society, or program the hours are being collected for.",
                "type": "string"
              },
              "student_name": {
                "type": "string"
              }
            },
            "required": ["student_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:297b38addacfb0db1901f185f8a40f6e15637163853ffab063194ef24bfe9a6a"
        },
        {
          "name": "get_record_summary",
          "description": "Totals, per-category breakdown, and every issue found, for one record. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "record_id": {
                "type": "string"
              }
            },
            "required": ["record_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e8a71e16a462f286ed72980acf0cb84fcea992ed2a1f7a00b941ed215fcb4e8"
        },
        {
          "name": "get_rules",
          "description": "The exact rule table this service checks against, with the reason each rule is checkable, plus what it explicitly does not claim. Quote it if you need to explain a result.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6403d135b2cc82bd9b11b5b544dc3cf5eaf061465d9d2a8ed871d68c3b1704be"
        },
        {
          "name": "request_signoff",
          "description": "Create a one-time URL a supervisor can open to confirm the recorded hours. Requires a bearer key. The token is single use.",
          "inputSchema": {
            "properties": {
              "record_id": {
                "type": "string"
              },
              "supervisor_email": {
                "type": "string"
              },
              "supervisor_name": {
                "type": "string"
              }
            },
            "required": ["record_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
