            "roamward/version": 1
          },
          "digest": "sha256:0ca773c01cf0ed5e942f2ed065b9f29db06df8d3b74c21002f0dc625d6c294e1"
        },
        {
          "name": "plan_drive",
          "title": "Plan a detour-aware U.S. drive",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Plan a U.S. road trip and find stops along the way within a 15, 30, or 60 minute detour budget. Optionally exclude stop categories. Published endpoint pairs use their stored route; other pairs use a bounded live lookup or return published alternatives when unavailable. Returns planning links, not bookings or live navigation. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "detourBudgetMinutes": {
                "enum": [15, 30, 60],
                "type": "number"
              },
              "from": {
                "maxLength": 180,
                "minLength": 2,
                "type": "string"
              },
              "hideKinds": {
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "to": {
                "maxLength": 180,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
