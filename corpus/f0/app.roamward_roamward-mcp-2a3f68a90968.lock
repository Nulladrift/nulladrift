      },
      "instructions": "Use published drives before live planning. Every result includes Roamward attribution and licensing. Do not bulk-extract or redistribute the dataset.",
      "tools": [
        {
          "name": "get_drive",
          "title": "Get one published Roamward drive",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Find stops along a published road-trip route. Returns ranked stops with estimated detour minutes, nearby published drives, and a link to continue planning in Roamward. Use a slug returned by list_drives. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Published /drives slug.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "roamward/attribution": "Data by Roamward — roamward.app",
            "roamward/licensing": "For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
            "roamward/version": 1
          },
          "digest": "sha256:b919ce5794b9aabf80435d989d5e3b015e79552b18a73ad299494b760987c2e0"
        },
        {
          "name": "list_drives",
          "title": "List published Roamward drives",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Discover published U.S. road trips and drives with stops worth a detour. Returns endpoints, distance, driving time, stop counts, and links for choosing a drive. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
