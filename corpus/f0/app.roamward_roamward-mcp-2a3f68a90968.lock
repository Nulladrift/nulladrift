        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.roamward.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "roamward-mcp",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use published drives before live planning. Every result includes Roamward attribution and licensing. Do not bulk-extract or redistribute the dataset.",
      "tools": [
        {
          "name": "get_drive",
          "title": "Get one published Roamward drive",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Find stops along a published road-trip route. Returns ranked stops with estimated detour minutes, nearby published drives, and a link to continue planning in Roamward. Use a slug returned by list_drives. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Published /drives slug.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "roamward/attribution": "Data by Roamward — roamward.app",
            "roamward/licensing": "For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
            "roamward/version": 1
          },
          "digest": "sha256:906142f296e064c2e39ad15df6c87a0dbc6a6e324b00abe9ed5bdc8478446c1d"
        },
        {
          "name": "list_drives",
          "title": "List published Roamward drives",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Discover published U.S. road trips and drives with stops worth a detour. Returns endpoints, distance, driving time, stop counts, and links for choosing a drive. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "roamward/attribution": "Data by Roamward — roamward.app",
            "roamward/licensing": "For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
            "roamward/version": 1
          },
          "digest": "sha256:47ec95d24e93a24f2731d9097d1d317987dcef1028503b8583930db61b3c3893"
        },
        {
          "name": "plan_drive",
          "title": "Plan a detour-aware U.S. drive",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Plan a U.S. road trip and find stops along the way within a 15, 30, or 60 minute detour budget. Optionally exclude stop categories. Published endpoint pairs use their stored route; other pairs use a bounded live lookup or return published alternatives when unavailable. Returns planning links, not bookings or live navigation. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "detourBudgetMinutes": {
                "enum": [15, 30, 60],
                "type": "number"
              },
              "from": {
                "maxLength": 180,
                "minLength": 2,
                "type": "string"
              },
              "hideKinds": {
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "to": {
                "maxLength": 180,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "roamward/attribution": "Data by Roamward — roamward.app",
            "roamward/licensing": "For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
            "roamward/version": 1
          },
          "digest": "sha256:88a585169b6ab82004c7b4beb23378098dd30d6e558bf2cfdb6dfce1f1bad647"
        },
        {
          "name": "search_stops",
          "title": "Search Roamward stops",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Find road-trip stops by name or category, optionally within a U.S. state. Returns up to 10 catalog matches with descriptions and links; does not verify current opening hours or closures. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional USPS code or full state name.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "roamward/attribution": "Data by Roamward — roamward.app",
            "roamward/licensing": "For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
            "roamward/version": 1
          },
          "digest": "sha256:7e67b465c10d7d1ccbb038379b277a9e43f18fb88545880d5891b92d12ce7798"
        }
