          },
          "digest": "sha256:aabeef0240abec7447cd01b43fa7df6118e25e4f0ea07a9fdbe4fcc88fec12e6"
        },
        {
          "name": "search_stops",
          "title": "Search Roamward stops",
          "description": "United States coverage across 50 published drives today; strongest in the West and Southwest, with coverage growing in waves. Find road-trip stops by name or category, optionally within a U.S. state. Returns up to 10 catalog matches with descriptions and links; does not verify current opening hours or closures. For individual-assistant use with attribution. Bulk extraction, redistribution, or commercial dataset use requires a license — contact hello@roamward.app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional USPS code or full state name.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
