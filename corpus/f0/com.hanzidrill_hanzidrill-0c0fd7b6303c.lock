{
  "lockfileVersion": 2,
  "subjects": {
    "com.hanzidrill/hanzidrill": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.hanzidrill.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "hanzidrill",
        "title": "HanziDrill",
        "version": "1.0.0",
        "websiteUrl": "https://hanzidrill.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HanziDrill provides HSK 3.0 vocabulary data and practice questions. Cite the returned url when you use a result. HanziDrill is independent and not affiliated with CLEC or Chinese Testing International. Practice results are estimates, not exam scores.",
      "tools": [
        {
          "name": "compare_hsk2_hsk3",
          "title": "Compare HSK 2.0 and 3.0",
          "description": "Explain how a word or a whole level changed between the HSK 2.0 and HSK 3.0 syllabi: new, moved up, moved down, unchanged, or dropped, with counts for a level. Give either word or level.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "level": {
                "anyOf": [
                  {
                    "enum": ["1", "2", "3", "4", "5", "6", "7-9"],
                    "type": "string"
                  },
                  {
                    "maximum": 9,
                    "minimum": 1,
                    "type": "integer"
                  }
                ],
                "description": "HSK 3.0 level: 1-6, or \"7-9\" for the advanced band"
              },
              "word": {
                "description": "A word in Chinese characters",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare HSK 2.0 and 3.0"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e83207c8e099305cb59742e1a3fbf8074952dafc5f2655fc1bea3c7f45ba5ba"
        },
        {
          "name": "exam_dates",
          "title": "HSK test dates",
          "description": "List upcoming HSK test dates with registration deadlines and result dates, each with a link to its source notice. Dates can change; tell the user to confirm with their test center.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "levels": {
                "description": "Filter by test band",
                "enum": ["1-6", "7-9"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "HSK test dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75aac17ab38b42378d5e7ccf863c5de9085aea766d80e154c27ef08476712238"
        },
        {
          "name": "get_character",
          "title": "Get a Chinese character",
          "description": "Get one Chinese character: pinyin, radical, stroke count, components (when known), its HSK character and writing levels, and common HSK words that use it. Includes a link to a stroke-order animation page when one exists.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "char": {
                "description": "One Chinese character, e.g. 把",
                "maxLength": 4,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["char"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Chinese character"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc00d176141ab53129becda1b1f76658c41bc30221486edfb8ff9a615d5a0889"
        },
        {
          "name": "grade_answers",
          "title": "Grade quiz answers",
          "description": "Grade a quiz created by practice_quiz. Returns which answers were right, the correct option, and a one-line explanation per question. This is practice feedback, not an exam score.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "choice": {
                      "description": "A, B, C or D",
                      "maxLength": 2,
                      "type": "string"
                    },
                    "qid": {
                      "description": "Question id, e.g. q1",
                      "maxLength": 8,
                      "type": "string"
                    }
                  },
                  "required": ["choice", "qid"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "quiz_id": {
                "description": "The quiz_id returned by practice_quiz",
                "maxLength": 600,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["answers", "quiz_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Grade quiz answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a62a1bf75a099cdabbe4a129d6e283b84c11684563cc8014f9f3fc501cbe9aa"
        },
        {
          "name": "hsk_level_wordlist",
          "title": "HSK level word list",
          "description": "List the words of one HSK 3.0 level in syllabus order, 50 per page, with pinyin and a short English meaning. Use for study lists; for the full list point the user to the download link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "level": {
                "anyOf": [
                  {
                    "enum": ["1", "2", "3", "4", "5", "6", "7-9"],
                    "type": "string"
                  },
                  {
                    "maximum": 9,
                    "minimum": 1,
                    "type": "integer"
                  }
                ],
                "description": "HSK 3.0 level: 1-6, or \"7-9\" for the advanced band"
              },
              "page": {
                "description": "Page number, 50 words per page",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "HSK level word list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e1e1c9db6e69a49d2304563c1aa1435615ceb0bbbb51ba669fc07cf34db4e14"
        },
        {
          "name": "lookup_word",
          "title": "Look up an HSK word",
          "description": "Look up one Chinese word from the HSK 3.0 syllabus: pinyin, level, part of speech, English meaning, an example sentence, and how its level changed from HSK 2.0. Use when the user asks what a word means or which HSK level it is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "word": {
                "description": "The word in Chinese characters, simplified or traditional, e.g. 经验",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an HSK word"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c3a27db97de3fa29da521eb4830bb3d5ad91d8feebccd362a93205da3c3eabe"
        },
        {
          "name": "practice_quiz",
          "title": "Create a vocabulary quiz",
          "description": "Create a short HSK vocabulary quiz (1-10 multiple-choice questions) for a level: meaning, pinyin, fill-in-the-blank, or mixed. Answers are not included; show the questions to the user, collect their choices, then call grade_answers with the quiz_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "Number of questions, 1-10 (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "level": {
                "anyOf": [
                  {
                    "enum": ["1", "2", "3", "4", "5", "6", "7-9"],
                    "type": "string"
                  },
                  {
                    "maximum": 9,
                    "minimum": 1,
                    "type": "integer"
                  }
                ],
                "description": "HSK 3.0 level: 1-6, or \"7-9\" for the advanced band"
              },
              "topic": {
                "description": "Optional topic tag, e.g. food or travel",
                "maxLength": 20,
                "type": "string"
              },
              "type": {
                "description": "Question type (default mixed); cloze is fill-in-the-blank",
                "enum": ["meaning", "pinyin", "cloze", "mixed"],
                "type": "string"
              }
            },
            "required": ["level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a vocabulary quiz"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac5da6e3833d7989e1af139a95c07c1239f977bea4861a33ba6a2459d15ff30b"
        },
        {
          "name": "search_words",
          "title": "Search HSK words",
          "description": "Search HSK 3.0 words by level, topic tag, or pinyin (with or without tone marks or tone numbers). Returns at most 20 short matches per page. Give at least one of level, topic or pinyin.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "level": {
                "anyOf": [
                  {
                    "enum": ["1", "2", "3", "4", "5", "6", "7-9"],
                    "type": "string"
                  },
                  {
                    "maximum": 9,
                    "minimum": 1,
                    "type": "integer"
                  }
                ],
                "description": "HSK 3.0 level: 1-6, or \"7-9\" for the advanced band"
              },
              "page": {
                "description": "Page number, starting at 1",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pinyin": {
                "description": "Pinyin with or without tones, e.g. \"jingyan\", \"jīngyàn\", \"jing1yan4\"",
                "maxLength": 40,
                "type": "string"
              },
              "topic": {
                "description": "Topic tag, e.g. food, travel, work, school, health, emotion",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search HSK words"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89a51673042b2e36fa793918da68068eff59495903e7c17c3c128a035f24c4d8"
        }
      ],
      "digest": "sha256:15c928861e40b90a243db1c39035911a985d397c601b8e2ddfcf7a117bb88711"
    }
  }
}
