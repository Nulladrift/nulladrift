        {
          "name": "contexto_ler",
          "description": "Lê o contexto do advogado e o manual do Elden (somente leitura; não consome cota).\n• o_que=\"inicio\" (padrão): retorna estilos de peça, memória salva e saldo do plano. Chame no início da conversa ou antes de redigir peça; passe `chave` (CNJ ou cliente) para filtrar memórias do caso.\n• o_que=\"memoria\": busca lembranças por `chave` ou `consulta`.\n• o_que=\"estilo\" / \"estilo_json\": lê um estilo (`nome_estilo=\"padrao\"` ou personalizado) ou lista os disponíveis.\n• o_que=\"limite\": uso atual do plano e renovação.\n• o_que=\"manual\": guia de uso (`assunto`: memoria | estilo | citacao | tribunais | limites | planos | tudo).",
