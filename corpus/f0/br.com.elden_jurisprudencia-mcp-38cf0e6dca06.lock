      "instructions": "Elden entrega fontes jurídicas brasileiras (leis, súmulas, temas, acórdãos, processos) com texto, origem e limites, em 4 ferramentas: pesquisa_juridica (pesquisar e conferir, numa chamada só; somente leitura), buscar_fundamentacao (super-ferramenta que reúne legislação, súmulas/temas e acórdãos compactados com identificadores para leitura e aprofundamento), contexto_ler (estilo de peça, memória, limite do plano e manual; somente leitura) e contexto_gravar (gravar memória ou estilo, relatar erro). Não precisa ler o manual antes de pesquisar. Antes de redigir peça, leia o estilo do advogado com contexto_ler(). Identifique regime e âmbito do precedente, fatos relevantes, órgão e tipo do documento. Não presuma autoridade apenas pela proximidade do tribunal. Ementa, publicação e voto não implicam inteiro teor. Transcreva apenas texto efetivamente lido, identificando fonte, versão e localizador; não atribua à ementa razões de decidir ausentes. Data de coleta não é data de vigência. Busca vazia significa que não foi encontrado no universo consultado; falha de serviço não significa ausência da norma. Se citar processo/cliente, consulte contexto_ler(o_que=\"memoria\"); memórias de casos não alteram regras jurídicas.",
