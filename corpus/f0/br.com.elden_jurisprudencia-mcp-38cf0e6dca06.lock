        {
          "name": "pesquisa_juridica",
          "description": "PESQUISA JURÍDICA, EM UMA CHAMADA (somente leitura; comece por aqui; se for tese complexa ou nova, chame contexto_ler(o_que=\"inicio\") para ver o guia e estilos). Escreva a pergunta como o advogado faria e a ferramenta identifica o que é: uma TESE (\"dano moral por extravio de bagagem\") devolve súmulas/temas, os acórdãos mais próximos (ementa, órgão, link do tribunal) e artigos pertinentes; um ARTIGO (\"art. 14 do CDC\") devolve o texto exato, com vigência registrada e link oficial; uma SÚMULA ou TEMA (\"Súmula 479 do STJ\") confere e mostra o enunciado; um NÚMERO de processo (CNJ, \"REsp 2188655\") confere que existe e mostra ementa, órgão e link. Passe SEMPRE tribunal_da_causa (sigla, ex.: TJCE): o julgado local sobe sem excluir os demais; `tribunal` restringe a busca a um tribunal; `diploma` (sigla) restringe a lei. Para ler o VOTO, chame com abrir_inteiro_teor=\"<número CNJ>\" (planos pagos; texto longo vem em partes: continue com `inicio`, e `publicacao` quando a resposta indicar). Isto localiza fontes, não aprova tese: leia antes de citar e transcreva só texto efetivamente lido.",
