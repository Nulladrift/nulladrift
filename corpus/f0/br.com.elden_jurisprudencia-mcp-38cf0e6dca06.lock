        {
          "name": "contexto_ler",
          "description": "Resumo rápido de primeiro uso, contexto do advogado e manual do Elden (somente leitura; não consome cota).\n• o_que=\"inicio\" (padrão): resumo rápido de tudo que o Elden oferece para deixar você mais inteligente no Direito brasileiro + estilos de peça + memória salva + saldo do plano. Chame no primeiro contato, ao abrir conversa nova ou antes de redigir peça; passe `chave` (CNJ ou cliente) para filtrar memórias do caso.\n• o_que=\"memoria\": busca lembranças por `chave` ou `consulta`.\n• o_que=\"estilo\" / \"estilo_json\": lê um estilo (`nome_estilo=\"padrao\"` ou personalizado) ou lista os disponíveis.\n• o_que=\"limite\": uso atual do plano e renovação.\n• o_que=\"manual\": guia de uso (`assunto`: memoria | estilo | citacao | tribunais | limites | planos | tudo).",
