        {
          "name": "pesquisa_juridica",
          "description": "Pesquisa jurídica principal em 1 chamada (somente leitura). Identifica automaticamente o pedido:\n• TESE (\"dano moral por extravio de bagagem\"): retorna súmulas/temas, acórdãos próximos (ementa, órgão, link) e artigos de lei.\n• ARTIGO (\"art. 14 do CDC\"): retorna texto literal, vigência e link oficial.\n• SÚMULA ou TEMA (\"Súmula 479 do STJ\", \"Tema 1061\"): confere e exibe o enunciado.\n• PROCESSO (CNJ ou classe+número sem ponto de milhar, ex.: \"REsp 2188655\"): confere existência, ementa, órgão e link.\n• PUBLICAÇÃO DJEN / INTEIRO TEOR: chame com abrir_inteiro_teor=\"<número CNJ>\" — abre a publicação oficial do DJEN (voto integral quando publicado na íntegra, ou ementa/dispositivo + link oficial do tribunal para leitura do voto; se longo, continue com `inicio` e `publicacao` quando indicado).\nParâmetros: `tribunal_da_causa` (sigla, ex.: TJCE — prioriza o tribunal local sem excluir os demais), `tribunal` (restringe a 1 tribunal), `diploma` (restringe a lei). Leia antes de citar; só transcreva texto efetivamente lido.\nPara mapear uma tese ampla do zero (lei + súmulas/temas + julgados locais e contrários de uma só vez), prefira buscar_fundamentacao. No primeiro contato ou antes de redigir peça, chame contexto_ler() (grátis, não consome cota).",
