        {
          "name": "contexto_ler",
          "description": "CONTEXTO DO ADVOGADO (somente leitura; não conta na cota). o_que=\"inicio\" (padrão) devolve de uma vez: os estilos de peça disponíveis, a memória (planos Essencial, Profissional e Escritório) e o uso do plano. Chame no começo da conversa e SEMPRE antes de redigir uma peça. Passe chave=<número CNJ ou nome do cliente> para ver o que já se sabe daquele caso. Outros valores: \"memoria\" (chave, ou consulta=<assunto>), \"estilo\" (nome_estilo=\"padrao\" ou o nome de um estilo dele: devolve o guia de tipografia, estrutura e como citar, que você deve seguir à risca; sem nome, lista os estilos), \"estilo_json\" (o estilo como JSON, para editar), \"limite\" (quanto do plano foi usado, em %, e quando renova), \"manual\" (como usar o Elden; assunto = memoria | estilo | citacao | tribunais | limites | planos | tudo).",
