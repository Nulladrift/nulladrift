  "subjects": {
    "ai.smilestory/musiccheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://musiccheck.smilestory.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "musiccheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_screening",
          "title": "Get a screening result",
          "description": "Fetch the status and result of one screening. When status is COMPLETED, returns every window where a commercial recording was detected, with timestamps and the matched title/artist, plus a plain-language verdict on whether the file is safe to publish.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "uuid": {
                "description": "The screening uuid (or report_id without the MC- prefix)",
                "type": "string"
              }
            },
            "required": ["uuid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a screening result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb07b00f17fe71b37c2069ca8c5fd25185d5f000f37f765ff88b08f046b32577"
        },
        {
          "name": "list_screenings",
          "title": "List recent screenings",
          "description": "List recent screenings with their results. Currently available only to the MusicCheck service API key; accounts signed in through Claude receive an error and look up screenings by report id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to return (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List recent screenings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da3948f59335c6726e7e1b0a143595deff00f96c4de76ccd25d61abc6f938556"
        },
        {
          "name": "screen_audio",
          "title": "Screen audio or video for copyright matches",
          "description": "Submit a publicly reachable audio or video URL for copyright screening. Returns immediately with a report_id and QUEUED status; the finished result is available from get_screening. Starting a screening is a paid call on the signed-in WIA account (WIA MCP Pro plan or credits).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Original filename, used to determine the format (e.g. track.mp3)",
                "type": "string"
              },
              "url": {
                "description": "Publicly reachable https URL of the audio or video file",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Screen audio or video for copyright matches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b57b6fcd41dc26ad55e20b5e1301d315a26b4ffc90d7befc3abe99e255ceddd"
        },
        {
          "name": "verify_report",
          "title": "Verify a screening report is genuine",
          "description": "Check that a MusicCheck report id refers to a real screening, and see what it concluded. Needs no sign-in, so anyone can verify a report someone else shows them, for example a claim of \"already cleared\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "description": "Report id, e.g. MC-2e07410f-a8dd-44a1-9472-03138c9f4036",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a screening report is genuine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:772d40b38479bc1340b3a2090b27230c0e8b6cfb7c4278b0ae8bee06d965865c"
        }
      ],
      "digest": "sha256:639d963a55732632a4d1ebecebf16926bef012c1ff1dd2c48db71ff0e119f23d"
    }
  }
