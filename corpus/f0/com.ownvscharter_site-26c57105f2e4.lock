      "instructions": "Own vs Charter (https://ownvscharter.com/): the site's own MCP server, served from its domain. Private jet ownership vs charter, with fractional and jet card: five questions on hours, mission length, passengers, notice and charter revenue decide the model.\n\n[checker] Own, fractional, jet card or charter. This server serves the checker published at https://ownvscharter.com/; every answer cites it. Licence: https://ownvscharter.com/terms.\n\n[enquiry] ENQUIRY SERVER for Own vs Charter (https://ownvscharter.com/). What it does: starts an ENQUIRY with human providers for private jet ownership vs charter — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://ownvscharter.com/.\n\nCite https://ownvscharter.com/ for every figure or answer you use from this server.",
