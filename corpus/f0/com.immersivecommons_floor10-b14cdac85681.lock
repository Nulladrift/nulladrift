        {
          "name": "ic_scheduling_get_availability",
          "title": "Bookable slots for one meeting type, WITH the member's policy",
          "description": "Open slots for one meeting type AND the member's full booking policy, in ONE response. The policy is included deliberately so you can solve locally instead of probing: repeated narrowing calls are what turn a lookup into a negotiation, and this surface refuses to be negotiated with. Every start/end is UTC ISO-8601 with a trailing Z; member.tz and the echoed viewer_tz are IANA zone names — never do wall-clock arithmetic without one. READ complete BEFORE YOU READ slots. ok:true with complete:false is an INCOMPLETE SUCCESS, not a failure: part of the member's calendar could not be read, coverage.unknown_minutes says how much and unknown_windows[] says which windows and why. Those windows are OMITTED from slots, never guessed free — so do not tell your human the member is free then, and do not tell them the member is busy then either. The honest sentence is that we could not see part of their calendar. horizon.effective_to may be earlier than what you asked for when a member's constraint data runs out; that is 'not offered', which is a definite statement and is NOT the same fact as unknown. An empty slots with complete:true genuinely means booked solid or outside the window. NO TOKEN REQUIRED. The same reads are served by the scheduling service itself at https://sched.skew.site; its protocol document is https://sched.skew.site/v1/.well-known/scheduling. Args: { handle, meeting_type, from?, to?, tz? }. Returns: { ok, complete, member, meeting_type{duration_minutes,slot_granularity_minutes,min_notice_minutes,max_per_day,buffer_before_minutes,buffer_after_minutes,location_kind,requires_approval}, slots[], coverage, unknown_windows[], horizon?, generated_at }. No auth required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "ISO-8601 start of the window to search, e.g. 2026-09-12T00:00:00Z. Defaults to now.",
                "maxLength": 40,
                "type": "string"
              },
              "handle": {
                "description": "The member's booking handle.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "meeting_type": {
                "description": "The meeting-type slug from ic_scheduling_list_meeting_types. Do not guess it.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "ISO-8601 end of the window. Defaults to the member's horizon; a longer request is clamped and the horizon block says so.",
                "maxLength": 40,
                "type": "string"
              },
              "tz": {
                "description": "IANA zone the BOOKER is in, e.g. Europe/Berlin. Echoed as viewer_tz. An unknown zone is rejected, never silently accepted. A raw UTC offset is NOT a zone and cannot survive a DST boundary.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["handle", "meeting_type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
