              },
              "availability": {
                "description": "Exactly one of: Weekday daytime | Weekday evenings | Weekends | Flexible / most times. Required.",
                "type": "string"
              },
              "building_now": {
                "description": "What they are building right now, in their own words. Required.",
                "type": "string"
              },
              "commit_5_weeks": {
                "description": "Can they commit to the full 5 weeks? Required.",
