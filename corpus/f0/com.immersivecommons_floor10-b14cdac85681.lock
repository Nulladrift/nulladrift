        {
          "name": "ic_vault_list",
          "title": "Browse the IC Vault of first-try recipes (public)",
          "description": "List and filter the Immersive Commons Vault: procedures PROVEN to work, written so you clear them without exploring — agent-readiness playbooks and startup credit programs, same schema. No auth required. Filters: kind ('playbook'|'credit'), category, status ('proven'|'unproven'|'dead' — does the thing actually exist), evidence ('official'|'mixed'|'approx' — how well-sourced the facts are), verified_within_days (freshness), q (substring over title/summary/eligibility), sort, limit, offset. Returns: { ok, total, returned, offset, entries[], facets, notes }. Each entry carries `first_try_success_label`, which reads \"not yet measured\" — NOT \"0%\" — until an entry has enough real reports; `first_try_success` is null in that state and a client must not render it as a number. `facets` gives the live value counts per filter so you can narrow without guessing at the vocabulary. An unknown filter value is IGNORED and explained in `notes` rather than erroring. Use ic_vault_match to ask whether a specific company qualifies; use ic_vault_feedback_submit to report whether a recipe worked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Exact category string, case-insensitive. Read the live set from `facets.category` in any response rather than guessing — a miss returns an empty list plus the real values in `notes`.",
                "maxLength": 80,
                "type": "string"
              },
              "evidence": {
                "description": "How well-sourced the FACTS are. 'official' = from the vendor's own page; 'approx' = aggregator/blog-sourced, verify before quoting. Orthogonal to `status`: a well-sourced entry about a dead program is official + dead.",
                "enum": ["official", "mixed", "approx"],
                "type": "string"
              },
              "kind": {
                "description": "'playbook' = a multi-step procedure with per-step verification and traps. 'credit' = a credit / discount / perk program with one or more offer tiers.",
                "enum": ["playbook", "credit"],
                "type": "string"
              },
              "limit": {
                "description": "Default 100, max 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Case-insensitive substring over id, title, summary, category and eligibility prose.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "'recent' (default) = most recently verified first. 'status' = proven first.",
                "enum": ["recent", "title", "status"],
                "type": "string"
              },
              "status": {
                "description": "Does the thing WORK / EXIST. 'proven' = someone ran it end to end. 'dead' = the named program does not exist and the entry is kept only so nobody chases it. This is a DIFFERENT axis from `evidence`.",
                "enum": ["proven", "unproven", "dead"],
                "type": "string"
              },
              "verified_within_days": {
                "description": "Freshness gate: keep only entries re-checked within N days. Note this is `last_verified` (when someone last looked), not `last_changed` (when the program last moved) — the two are deliberately not the same field.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:027978cc644ecfe60c1850b110390b1ca6fcced11bcda7ba697824e208481ca1"
        },
        {
          "name": "ic_vault_match",
          "title": "Check which IC Vault entries a company qualifies for (public)",
          "description": "Evaluate a company profile against the Vault's eligibility predicates and get a THREE-VALUED answer per entry: 'eligible' (every stated gate is definitively met), 'ineligible' (a stated gate is definitively failed), or 'indeterminate' — which means WE CANNOT TELL FROM WHAT THE VENDOR PUBLISHES, and is a real answer, never a soft no. No auth required. Nothing is ever reported 'eligible' while any gate is unknown or unstructured: a missing profile field lands in `unknown` (supply it and the verdict may flip), and a gate the program states only in prose lands in `manual_review` (a human has to read it). A non-hit against a NAMED partner list is `manual_review` too, never a failure, because every published partner list in the corpus is partial. Every profile field is OPTIONAL — a partial profile is the normal case and returns more `indeterminate`, not an error. Accepts the same category/kind/status/evidence/freshness filters as ic_vault_list. Returns: { ok, total_considered, counts, matches[], notes }. Each match carries failed[], unknown[], manual_review[], missing_prerequisites[] and per-tier verdicts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "affiliations": {
                "description": "Affiliations some programs REQUIRE (an academic grant, a 501(c)(3) discount).",
                "items": {
                  "enum": ["academic", "nonprofit"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "as_of": {
                "description": "YYYY-MM-DD for deadline checks. Defaults to today.",
                "maxLength": 10,
                "type": "string"
              },
              "business_types": {
                "description": "Types some programs EXCLUDE. Declaring one may disqualify you from those.",
                "items": {
                  "enum": ["reseller", "csp", "consulting-agency", "crypto-only", "public-company", "non-profit"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "cash_balance_usd": {
                "description": "Cash on hand, USD. Orthogonal to funding raised.",
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "Same filter as ic_vault_list.",
                "maxLength": 80,
                "type": "string"
              },
              "company_age_years": {
                "description": "Years since incorporation.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "domain_tags": {
                "description": "'ai-native' is stricter than 'ai': the model is the product, not a feature. The corpus draws that line itself.",
                "items": {
                  "enum": ["ai", "ai-native", "tech-product"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "evidence": {
                "description": "Same filter as ic_vault_list.",
                "enum": ["official", "mixed", "approx"],
                "type": "string"
              },
              "existing_customer_of": {
                "description": "Vault entry ids you are already a paying customer of — for 'new customers only' gates.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "funding_raised_usd": {
                "description": "Total raised, USD. 0 means bootstrapped.",
                "minimum": 0,
                "type": "number"
              },
              "has_domain_email": {
                "description": "Company-domain email. A gmail address fails these gates.",
                "type": "boolean"
              },
              "has_institutional_backing": {
                "description": "Somebody institutional wrote a cheque. Says nothing about WHO — that is `partner_affiliations`.",
                "type": "boolean"
              },
              "has_web_presence": {
                "description": "Live website + active socials a reviewer will look at.",
                "type": "boolean"
              },
              "has_working_product": {
                "description": "Shipped something real, as opposed to still evaluating.",
                "type": "boolean"
              },
              "headcount": {
                "description": "People on the team. Checked against any entry that gates on team size.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "holds": {
                "description": "Vault entry ids you already hold — used for prerequisite checks (e.g. holding NVIDIA Inception unlocks downstream offers).",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "jurisdiction": {
                "description": "ISO-3166 alpha-2 of the operating entity, e.g. 'US'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "kind": {
                "description": "Same filter as ic_vault_list.",
                "enum": ["playbook", "credit"],
                "type": "string"
              },
              "months_since_last_round": {
                "description": "Months since the most recent round CLOSED. Some programs require 'funded within 12 months' — a Series A from 3 years ago fails that while passing a stage gate.",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "partner_affiliations": {
                "description": "Investors / accelerators you are affiliated with. An EXPLICIT empty array is a statement (no affiliations ⇒ you cannot be on anyone's approved list) and fails referral gates; OMITTING the field is 'unknown' and does not.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "prior_participation": {
                "description": "Vault entry ids whose program you have already taken. Distinct from being a customer.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "qualify": {
                "description": "Return only matches with this verdict. OMIT IT to see all three — asking only for 'eligible' hides the 'indeterminate' set, which is usually where the real options are.",
                "enum": ["eligible", "ineligible", "indeterminate"],
                "type": "string"
              },
              "stage": {
                "description": "Funding stage label. Distinct from the raised amount — some programs gate on one, some on the other.",
                "enum": ["bootstrapped", "pre-seed", "seed", "series-a", "series-b", "later"],
                "type": "string"
              },
              "status": {
                "description": "Same filter as ic_vault_list.",
                "enum": ["proven", "unproven", "dead"],
                "type": "string"
              },
              "verified_within_days": {
                "description": "Same filter as ic_vault_list.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
