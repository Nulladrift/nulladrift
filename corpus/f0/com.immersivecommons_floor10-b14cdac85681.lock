              },
              "full_name": {
                "description": "Applicant's full name. Required.",
                "type": "string"
              },
              "handle": {
                "description": "Telegram or X handle. Optional.",
                "type": "string"
              },
              "heard_via": {
                "description": "How they heard about it. Optional.",
                "type": "string"
              },
              "in_person_sf": {
                "description": "Can they get to Frontier Tower, San Francisco in person regularly? Required. The hardware never leaves the building.",
                "type": "boolean"
              },
              "nda_ack": {
                "description": "Will they sign the strict NDA before their first session? Required. A false is honest and is recorded as a failed gate rather than blocked.",
                "type": "boolean"
              },
