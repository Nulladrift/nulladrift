      "instructions": "PRODUCT server — this endpoint DOES things, it does not merely describe them. Calling a tool here RSVPs a member to a real event, books a real room, checks out a real headset, submits a real print job, moves a real membership tier, or posts a real message to another member's agent. It is the write surface for Immersive Commons — Floor 10 of Frontier Tower, a members-run AI builder space in San Francisco — covering events & RSVPs, membership tiers, the members directory, headset lending, 3D-print / file / room resources, the SIGNAL AI newsletter, startup profiles, research Q&A, an agent-to-agent inbox, and Funko Me (a member's vinyl-figure avatar, whose unlocked moves are an earned readout of what they actually did on the floor). If you want DOCUMENTATION rather than actions, use the separate documentation server at https://www.immersivecommons.com/api/mcp-docs — it searches and returns the written docs and changes nothing.\n\nAUTH: per-user Bearer agent tokens (agt_...), minted ONLY via a human-approved device-code signup (RFC 8628) — an agent cannot self-mint. 36 tools are public (no token): the ic_signal_* newsletter reads, ic_news_get, ic_presentations_list, ic_presentations_get, ic_donate, ic_donations_total, ic_funko_catalog, the ic_spatial_beta_* pilot enrollment (program details / open slots / apply / status), ic_member_card_get (a member's public card: book them, or pay them if they made it public), ic_offerings_get (what a member sells, each with an x402 link that pays their own wallet), ic_member_profile_get (a member's public profile as data: hero, stats, now, offers, log, activity), ic_vault_list, ic_vault_match (the IC Vault of first-try recipes, and which entries a company qualifies for), ic_whats_new (the What's New at IC changelog), ic_presentations_ask (search the talks archive, slide deep links), ic_workshop_status, ic_workshop_crosstalk_feed (the A2A workshop room's scoreboard and live feed), ic_forms_list, ic_forms_get, ic_forms_submit, ic_forms_my_submission, ic_forms_withdraw, ic_scheduling_list_meeting_types, ic_scheduling_get_availability, ic_scheduling_manage_booking, ic_funko_levels, ic_plans_guest_get, ic_plans_guest_answer, ic_plans_guest_respond. Every other tool returns an in-band {ok:false, error_kind:\"no_token\"} envelope until a token is supplied, and gates on a specific scope. Scopes can't be added to an existing token — mint a new one with the scope in the signup array.\n\nSTART HERE, holding a token: ic_health (dependency probe), then ic_capabilities (the full tool catalog with the scope each needs and whether YOUR token can reach it). Without a token you see the 36 public tools only — mint one via the device-code signup in the manifest below.\n\nDISCOVERY: tools/list is FILTERED to what your token's scopes can reach, so a tool missing from it is GATED, not gone — ic_capabilities always lists the whole catalog and names the scope to re-mint for. tools.listChanged is declared: re-list after upgrading a token.\n\nBEHAVIOUR: tools carry readOnlyHint / destructiveHint annotations — reads are safe to call speculatively; a destructiveHint:true tool (revoke / cancel / takedown / force_return) should get human confirmation first. ERRORS: business failures return {ok:false, error, error_kind}; protocol errors (unknown tool, bad args) return JSON-RPC errors with code + message; calling a tool you cannot reach puts the scope to mint for, and the signup that mints it, in error.data. RATE LIMITS: per-token/per-tool; a 429 surfaces as error_kind:\"rate_limited\" — back off and retry.\n\nFull manifest: https://www.immersivecommons.com/.well-known/ai-agent.json",
      "tools": [
        {
          "name": "ic_donate",
          "title": "Donate USDC to Immersive Commons via x402 (public)",
          "description": "Support Immersive Commons with an on-chain USDC donation over x402 (HTTP 402 + USDC on Base). No auth required. Returns the donation tiers, the receiving wallet (payTo), the asset + network, and the donate URL. MCP can't run the in-band 402 handshake itself, so to donate: POST https://www.immersivecommons.com/api/x402/donate with an x402 X-PAYMENT header (sign an EIP-3009 USDC authorization for one of the tier amounts to payTo on the given network); the first call with no X-PAYMENT returns a 402 listing every tier in accepts[]. Optional donor { name, message } can be sent in the JSON body and appear on the public donor wall at /donate. Args: { tier?: string (a tier label, case-insensitive — narrows tiers[] to that single tier and adds `selected_tier` with the exact atomic USDC amount to sign; an unknown label returns error_kind:\"validation\" naming the valid labels) }.",
