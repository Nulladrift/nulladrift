                "minLength": 1,
                "type": "string"
              },
              "form_id": {
                "description": "Which form.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "submission_id": {
                "description": "Needed only when reading by claim token rather than by identity.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
