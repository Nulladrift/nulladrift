          },
          "digest": "sha256:52e14d1d26184a6f7bcb2b321daa52882e47477c2d019d2cd3bf20dff2534262"
        },
        {
          "name": "contar_goles",
          "title": "Contar goles por grupo",
          "description": "Cuenta goles de Cristiano Ronaldo agrupados por equipo, rival, competición, torneo, año o jugada. Admite los mismos filtros que buscar_goles; por ejemplo, rivales más goleados en la Champions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agrupar_por": {
                "enum": ["equipo", "rival", "competicion", "torneo", "ano", "jugada"],
                "type": "string"
              },
              "ano": {
                "description": "Año natural del gol.",
                "maximum": 2100,
                "minimum": 2002,
                "type": "integer"
              },
              "competicion": {
                "description": "Competición, o parte del nombre. Ej.: \"Champions\" o \"Mundial 2018\".",
                "type": "string"
              },
              "desde": {
                "description": "Fecha mínima, AAAA-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "equipo": {
                "description": "Equipo con el que marcó.",
                "enum": ["sporting-cp", "manchester-united", "real-madrid", "juventus", "al-nassr", "portugal"],
                "type": "string"
              },
              "hasta": {
                "description": "Fecha máxima, AAAA-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jugada": {
                "description": "Tipo de jugada, cuando la base lo tiene.",
                "enum": ["juego", "penal", "tiro-libre"],
                "type": "string"
              },
              "limite": {
                "default": 25,
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "rival": {
                "description": "Rival, o parte del nombre. Sin distinguir tildes ni mayúsculas. Ej.: \"Atlético\".",
                "type": "string"
              }
            },
            "required": ["agrupar_por"],
            "type": "object"
          },
          "annotations": {
