        {
          "name": "goles_en_fecha",
          "title": "Goles en un día del calendario",
          "description": "Qué goles marcó Cristiano Ronaldo en un día y mes cualquiera, sumando todos los años (la app «El gol de tu cumpleaños»). Si ese día no marcó, dice el día con gol más cercano.",
          "inputSchema": {
