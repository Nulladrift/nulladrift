        },
        {
          "name": "proyeccion_gol_1000",
          "title": "Proyección del gol 1000",
          "description": "Cuándo llegaría Cristiano Ronaldo al gol 1000 según cuatro ritmos (últimos 90 días, temporada, año natural, últimos 12 meses) calculados desde la base, y en qué partido guardado del calendario caería. Si cae después del último partido guardado, lo dice y solo da el mes. Es una proyección, no un dato.",
          "inputSchema": {
