      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "caminoalmil",
        "title": "Camino al Mil",
        "version": "1.22.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Datos verificados de los goles de Cristiano Ronaldo, gol por gol, con fuentes. Responde en el idioma del usuario y cita caminoalmil.com con la URL que trae cada resultado. Sitio no oficial.",
      "tools": [
        {
          "name": "buscar_goles",
          "title": "Buscar goles",
          "description": "Lista goles de Cristiano Ronaldo con filtros (rival, equipo, competición, año, fechas, jugada), en orden cronológico. Cada gol trae fecha, rival, competición, resultado y fuentes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ano": {
                "description": "Año natural del gol.",
                "maximum": 2100,
                "minimum": 2002,
                "type": "integer"
              },
              "competicion": {
                "description": "Competición, o parte del nombre. Ej.: \"Champions\" o \"Mundial 2018\".",
                "type": "string"
              },
              "desde": {
                "description": "Fecha mínima, AAAA-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "equipo": {
                "description": "Equipo con el que marcó.",
                "enum": ["sporting-cp", "manchester-united", "real-madrid", "juventus", "al-nassr", "portugal"],
                "type": "string"
              },
              "hasta": {
                "description": "Fecha máxima, AAAA-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jugada": {
                "description": "Tipo de jugada, cuando la base lo tiene.",
                "enum": ["juego", "penal", "tiro-libre"],
                "type": "string"
              },
              "limite": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "orden": {
                "default": "antiguos",
                "enum": ["antiguos", "recientes"],
                "type": "string"
              },
              "rival": {
                "description": "Rival, o parte del nombre. Sin distinguir tildes ni mayúsculas. Ej.: \"Atlético\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24346461bff2b7aef05b0993ae641600b81dd9662c301c8f0e8051b7b48eeadc"
        },
        {
          "name": "buscar_trofeos",
          "title": "Explorar la vitrina de trofeos",
          "description": "Inventario documentado de títulos, premios, formación, amistosos, goleadores, equipos ideales, reconocimientos y podios de Cristiano Ronaldo. Devuelve ediciones, equipos, notas, fuentes y criterio de inclusión.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categoria": {
                "enum": ["individual", "club", "seleccion"],
                "type": "string"
              },
              "equipo": {
                "enum": ["sporting-cp", "manchester-united", "real-madrid", "juventus", "al-nassr", "portugal", "nacional", "portugal-sub20", "andorinha", "carrera"],
                "type": "string"
              },
              "nombre": {
                "description": "Nombre o parte del nombre del trofeo, sin distinguir tildes.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b0fb6b09ff45822ca93e970cc328776c50fc684377ac330b3f0232ba3508078"
        },
        {
          "name": "comparar_conteos",
          "title": "Comparar con otros conteos",
          "description": "Por qué no coinciden las cifras de goles de Cristiano Ronaldo: el total de otros sitios y proveedores con su fecha de consulta y diferencia, los goles en disputa uno por uno y los totales con otro criterio (por ejemplo, sin los seis goles del Campeonato Árabe de Clubes 2023). Opcional: filtrar por fuente.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuente": {
                "description": "Nombre o parte del nombre de la fuente. Ej.: \"Transfermarkt\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8141d6f6353d73763951f19b78c65a6fa5f445f4529e629a3372593a873e6c80"
        },
        {
          "name": "comparar_goleadores",
          "title": "Comparar con los máximos goleadores",
          "description": "Tabla de los máximos goleadores de la historia del fútbol (goles oficiales, con desglose por liga, copa, continental y selección) y el lugar de Cristiano Ronaldo. Opcional: filtrar por nombre.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jugador": {
                "description": "Nombre o parte del nombre. Ej.: \"Messi\".",
                "type": "string"
              },
              "limite": {
                "default": 15,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d15cf2680ce534275188a2095b3ad79f9ea6f0f369c0cea55de301c3083e8898"
        },
        {
          "name": "contador",
          "title": "Contador hacia los 1000 goles",
          "description": "Goles oficiales de Cristiano Ronaldo en su carrera, cuántos faltan para los 1000, fecha de corte, ritmo reciente, proyección y fuentes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
