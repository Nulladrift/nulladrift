          },
          "digest": "sha256:b27b30ff12e18855ac5f10f7c439e39f5377104784d952574171a9354840d131"
        },
        {
          "name": "gol_numero",
          "title": "Gol por número",
          "description": "El gol número N de la carrera de Cristiano Ronaldo (1 = el primero), con fecha, rival, competición y fuentes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "numero": {
                "minimum": 1,
                "type": "integer"
              }
