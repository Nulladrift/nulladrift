        {
          "name": "get_stig_rule",
          "title": "Get one STIG rule in full",
          "description": "Get the complete detail for one DISA STIG rule by its SV id (from search_stig): the requirement discussion, the exact check procedure an assessor runs, the fix text, severity, NIST control mapping, and whether it is SCAP-automatable. Call this when the user needs to implement or verify a specific rule.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sv_id": {
                "description": "Rule id, e.g. \"SV-257777r991589_rule\" (fragments matched if unique)",
                "type": "string"
              }
            },
            "required": ["sv_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "automation_level": {
                "type": "string"
              },
              "automation_source": {
                "type": "string"
              },
              "benchmark": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "check_text": {
                "description": "DISA's own check procedure - quote it rather than paraphrasing.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "fix_text": {
                "type": "string"
              },
              "nist_id": {
                "description": "CCI identifier, e.g. CCI-000366.",
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "severity": {
                "type": "string"
              },
              "severity_category": {
                "description": "CAT I / II / III, the vocabulary assessors use.",
                "type": "string"
              },
              "sv_id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["automation_level", "automation_source", "benchmark", "category", "check_text", "description", "fix_text", "nist_id", "product", "severity", "severity_category", "sv_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
