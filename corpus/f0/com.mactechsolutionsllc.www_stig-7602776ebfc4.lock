        {
          "name": "search_stig",
          "title": "Search DISA STIG rules",
          "description": "Search DISA STIG hardening rules across RHEL 8, RHEL 9, Windows 11, Windows Server 2022, and Cisco IOS Router NDM benchmarks - by keyword (matched against rule IDs and titles first, then descriptions), filterable by product, severity (high/medium/low, mapping to CAT I/II/III), category, and automation level. Call this when the user asks how to harden one of these platforms, what a STIG requires, or which rules cover a topic like SSH, passwords, or auditing. Returns summaries; use get_stig_rule for full check and fix text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "automation": {
                "enum": ["automated", "manual_only"],
                "type": "string"
              },
              "format": {
                "description": "\"summary\" (default) returns each rule inline as JSON. \"links\" returns MCP resource links, which hosts can render as pickable items the user opens on demand. Not smaller - the title and severity you need in order to choose are the bulk of either shape - so choose on how the client presents results, not to save tokens.",
                "enum": ["summary", "links"],
                "type": "string"
              },
              "limit": {
                "description": "Max results per page (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many matches. Pass the next_offset from a previous response to reach results beyond the first page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Limit to one benchmark",
                "enum": ["cisco_ios_router_ndm", "cisco_ios_router_rtr", "cisco_ios_switch_l2s", "cisco_ios_switch_ndm", "cisco_ios_switch_rtr", "cisco_ise_nac", "cisco_ise_ndm", "cisco_nxos_switch_l2s", "cisco_nxos_switch_ndm", "cisco_nxos_switch_rtr", "ubuntu2204", "rhel8", "rhel9", "windows11", "windows2022"],
                "type": "string"
              },
              "query": {
                "description": "Keyword or rule id fragment, e.g. \"ssh banner\" or \"SV-257777\"",
                "type": "string"
              },
              "severity": {
                "description": "high=CAT I, medium=CAT II, low=CAT III",
                "enum": ["high", "medium", "low"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
