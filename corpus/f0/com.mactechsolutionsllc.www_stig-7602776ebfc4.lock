      "instructions": "MacTech Solutions STIG server: 2029 DISA STIG hardening rules across RHEL 8/9, Windows 11, Windows Server 2022, and Cisco IOS Router NDM - searchable, with full check and fix text per rule and NIST control mappings. Use search_stig to find rules, get_stig_rule for implementation detail, list_stig_benchmarks for coverage, and export_stig_checklist to produce a DISA .ckl.",
      "tools": [
        {
          "name": "export_stig_checklist",
          "title": "Export a DISA .ckl checklist",
          "description": "Generate a DISA STIG Viewer checklist (.ckl XML) for a benchmark, optionally filtered by severity and pre-populated with findings. This is the artifact an assessment actually hands over - STIG Viewer opens it, eMASS ingests it, and a POA&M is written from it. Rules you do not supply a status for come out as Not_Reviewed. Call this when the user wants a checklist, a scan result recorded, or evidence to submit, rather than just to read a rule.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "findings": {
                "description": "Per-rule results. Anything omitted stays Not_Reviewed - an unreviewed rule must never be reported as passing.",
                "items": {
                  "properties": {
                    "comments": {
                      "description": "Assessor justification",
                      "type": "string"
                    },
                    "finding_details": {
                      "description": "What was actually observed",
                      "type": "string"
                    },
                    "status": {
                      "description": "Open = failed, NotAFinding = passed, Not_Applicable = out of scope",
                      "enum": ["Open", "NotAFinding", "Not_Applicable", "Not_Reviewed"],
                      "type": "string"
                    },
                    "sv_id": {
                      "type": "string"
                    }
                  },
                  "required": ["status", "sv_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "host_fqdn": {
                "type": "string"
              },
              "host_ip": {
                "type": "string"
              },
              "host_name": {
                "description": "Asset hostname recorded in the checklist",
                "type": "string"
              },
              "product": {
                "description": "Which benchmark to build the checklist from",
                "enum": ["cisco_ios_router_ndm", "cisco_ios_router_rtr", "cisco_ios_switch_l2s", "cisco_ios_switch_ndm", "cisco_ios_switch_rtr", "cisco_ise_nac", "cisco_ise_ndm", "cisco_nxos_switch_l2s", "cisco_nxos_switch_ndm", "cisco_nxos_switch_rtr", "ubuntu2204", "rhel8", "rhel9", "windows11", "windows2022"],
                "type": "string"
              },
              "severity": {
                "description": "Limit to one severity, e.g. high for a CAT I-only checklist",
                "enum": ["high", "medium", "low"],
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "type": "string"
              },
              "ckl": {
                "description": "The .ckl XML. Write it to filename rather than pasting it into a reply.",
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rule_count": {
                "type": "number"
              },
              "status_counts": {
                "additionalProperties": false,
                "properties": {
                  "NotAFinding": {
                    "type": "number"
                  },
                  "Not_Applicable": {
                    "type": "number"
                  },
                  "Not_Reviewed": {
                    "type": "number"
                  },
                  "Open": {
                    "type": "number"
                  }
                },
                "required": ["NotAFinding", "Not_Applicable", "Not_Reviewed", "Open"],
                "type": "object"
              }
            },
            "required": ["benchmark", "ckl", "filename", "note", "rule_count", "status_counts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
