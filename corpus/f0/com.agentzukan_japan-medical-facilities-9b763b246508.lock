        },
        {
          "name": "search_childcare_facilities",
          "title": "保育・幼児教育施設キーワード検索",
          "description": "保育施設（認可保育所、認定こども園、幼稚園、小規模保育、認証保育所など）を、施設名または住所のキーワード、都道府県、市区町村、種別で検索します。query、prefecture、city の少なくとも一つが必要です。現在は東京都と大阪市のパイロット版（約6,100件）で、対象地域は順次拡大中です。定員や受入年齢が公表されている施設ではそれも返します。データ出典：自治体公表リスト。",
          "inputSchema": {
