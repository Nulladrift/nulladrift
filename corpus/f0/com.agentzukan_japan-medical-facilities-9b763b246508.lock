                "type": "string"
              },
              "limit": {
                "description": "最大件数（既定50、上限200）",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "prefecture": {
                "description": "都道府県名。例: 東京都、大阪府",
                "type": "string"
              },
              "query": {
                "description": "検索キーワード（施設名・住所への部分一致）",
                "type": "string"
              },
              "type": {
                "description": "施設の種別",
