        {
          "name": "search_facilities",
          "title": "医療機関キーワード検索",
          "description": "全国の薬局・医科・歯科医療機関を、施設名または住所のキーワード、都道府県、種別で検索します。query と prefecture の少なくとも一方が必要です。open_now を true にすると現在時刻（日本時間）に診療中の施設だけを返します。day（mon〜sun、祝日は hol）と time（HH:MM）を指定すると、その曜日・時刻に診療中の施設だけを返します。結果には曜日別の診療時間（hours、データがない施設は null）が含まれます。",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "曜日。time と併せて指定",
                "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun", "hol"],
                "type": "string"
              },
              "limit": {
                "description": "最大件数（既定50、上限200）",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "open_now": {
                "description": "true で現在時刻（日本時間）に診療中の施設だけに絞る",
                "type": "boolean"
