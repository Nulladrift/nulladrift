      "serverInfo": {
        "name": "japan-medical-facilities",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "日本全国の薬局・医科・歯科医療機関（224,540件）と介護サービス事業所（189,943件）の検索、地点・半径ベースの商圏集計ができます。保育施設は東京都・大阪市のパイロット版（約6,100件）です。データ出典：地方厚生局の公表一覧（毎月更新）、診療時間は医療情報ネット、介護は介護サービス情報公表システム オープンデータ（いずれも厚労省）、保育は自治体公表リスト。",
      "tools": [
        {
          "name": "analyze_trade_area",
          "title": "商圏・地域分析（地点＋半径の集計）",
          "description": "緯度経度を中心に半径（m）以内の医療機関・介護サービス事業所・保育施設と人口を集計し、商圏分析・営業地域調査に使える形で返します。医療機関は種別（薬局/医科/歯科）・病院数・診療科別の件数（上位15）、診療時間データのカバー率、指定した曜日・時刻に開いている施設数（既定は現在時刻、日本時間）、平日19時以降も開いている施設数、日曜・祝日に開いている施設数、2021年以降に指定を受けた施設数、病床数の機械集計。介護は事業所数、サービス種別上位10、定員の合計、訪問系・通所系・入所系の事業所数。保育は施設数、種別内訳、定員の合計（現在は東京都と大阪市のパイロット収録分で、座標のある施設のみ）。人口側は令和2年国勢調査500mメッシュの合計（総数・年齢3区分・75歳以上・世帯数・高齢化率）と、人口1万人あたり施設数に加え、75歳以上1万人あたり介護事業所数と0〜14歳100人あたり保育定員の需給比。個別施設の一覧ではなく集計値のみを返します。",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "開いている施設数を数える曜日。time と併せて指定（既定は現在時刻）",
                "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun", "hol"],
                "type": "string"
              },
              "latitude": {
                "description": "中心の緯度。例: 35.681",
                "maximum": 46.5,
                "minimum": 20,
                "type": "number"
              },
              "longitude": {
                "description": "中心の経度。例: 139.767",
                "maximum": 154,
                "minimum": 122,
                "type": "number"
              },
              "radius_m": {
                "description": "半径m（既定1000、200〜10000）",
                "maximum": 10000,
                "minimum": 200,
                "type": "integer"
              },
              "time": {
                "description": "時刻 HH:MM（日本時間）。day と併せて指定",
                "pattern": "^([01]\\d|2[0-4]):[0-5]\\d$",
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c20684bc7ca12d78951c82b5972c206e3127a4a903ca4f684a31067adf2015d6"
        },
        {
          "name": "get_care_facility",
          "title": "介護事業所番号で詳細取得",
          "description": "介護事業所番号（10文字。数字のみ、または3文字目がA/Bの英字コード）を指定して、事業所の全項目と提供サービス（定員・利用可能曜日つき）を1件取得します。",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "介護事業所番号（10文字）。例: 1310110049、04A0700017",
                "pattern": "^[0-9]{2}[0-9AB][0-9]{7}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f49842cabce56f46baed73e6260daaa218d45dba38fad19b710f584c97d3373"
        },
        {
          "name": "get_childcare_facility",
          "title": "保育施設IDで詳細取得",
          "description": "保育施設のID（16桁の16進文字列）を指定して、施設の全項目（定員・受入年齢・開所時間・法人情報など、公表されている項目）を1件取得します。",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "保育施設ID。search_childcare_facilities の結果に含まれます",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a893ca15c540dec9db6bda880f687d5835c14e4317fb387cf589e9ea7b1aeb7"
        },
        {
          "name": "get_facility",
          "title": "医療機関コードで詳細取得",
          "description": "10桁の医療機関コードを指定して、施設の全項目（住所・電話・診療科・座標など）を1件取得します。診療時間データがある施設では曜日別の診療時間（hours）とその時点（hours_snapshot）も返します。",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "医療機関コード（10桁の数字）。例: 1310110049",
                "pattern": "^\\d{10}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92e628b3702ff9e22846b886284e5e7dc08a13f34f9c3d064a1963c524ab63b2"
        },
        {
          "name": "search_care_facilities",
          "title": "介護サービス事業所キーワード検索",
          "description": "全国の介護サービス事業所（約19万件）を、施設名または住所のキーワード、都道府県、サービスの種類（訪問介護、通所介護、居宅介護支援など35種）で検索します。query、prefecture、service の少なくとも一つが必要です。各事業所が提供するサービスの一覧も返します。データ出典：介護サービス情報公表システム オープンデータ（厚生労働省）。",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "最大件数（既定50、上限200）",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "prefecture": {
                "description": "都道府県名。例: 東京都",
                "type": "string"
              },
              "query": {
                "description": "検索キーワード（事業所名・住所への部分一致）",
                "type": "string"
              },
              "service": {
                "description": "サービスの種類。例: 訪問介護、通所介護、訪問看護、居宅介護支援、介護老人福祉施設",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d6cba3cf296e27e8c6ac43cdbf4f90accde6ae5df7a0b23de0bf03118d21cc7c"
        },
        {
          "name": "search_care_nearby",
          "title": "周辺の介護事業所検索",
          "description": "緯度経度を中心に半径（km）以内の介護サービス事業所を近い順に返します。service を指定すると、そのサービスを提供する事業所だけに絞ります。",
