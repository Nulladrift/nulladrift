  "subjects": {
    "com.fateandstars/tarot-knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fateandstars.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fate-and-stars-tarot-knowledge",
        "title": "Fate & Stars Tarot Knowledge",
        "version": "1.0.1",
        "websiteUrl": "https://fateandstars.com/tarot-mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public tarot reference only. Preserve source URLs and distinguish interpretation from fact. Use brief or sections to limit context; use search for topics and inspect suggestions for misspelled names. Educational Rider–Waite–Smith interpretations for reflection. Meanings vary by tradition; examples are editorial, not private readings. These tools do not predict events, infer private feelings, or provide medical, legal or financial advice.",
      "tools": [
        {
          "name": "get_card_meaning",
          "title": "Look up a tarot card",
          "description": "Read authored meanings with source links. Accepts names, slugs, numeric names and Coins aliases. Use brief for bounded plain-text excerpts (orientation meanings by default); sections selects exact normalized section IDs. availableSections and missingSections report content coverage; truncation is explicit. Unknown names return isError with suggestions, never an automatic substitute.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brief": {
                "default": false,
                "description": "Return plain-text excerpts up to 360 characters per section and 320 for overview. Without sections, only orientation meanings are included.",
                "type": "boolean"
              },
              "card": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "orientation": {
                "default": "both",
                "enum": ["both", "upright", "reversed"],
                "type": "string"
              },
              "sections": {
                "description": "Select sections; career replaces work. Orientation filters upright/reversed first. Missing sections are reported, not invented.",
                "items": {
                  "enum": ["keywords", "symbolism", "upright", "reversed", "love", "career", "money", "yes_no", "personality", "advice", "common_question", "reading_example", "comparison", "sources", "things_to_know", "scenarios", "faq", "related"],
                  "type": "string"
                },
                "maxItems": 18,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "availableSections": {
                "items": {
                  "enum": ["keywords", "symbolism", "upright", "reversed", "love", "career", "money", "yes_no", "personality", "advice", "common_question", "reading_example", "comparison", "sources", "things_to_know", "scenarios", "faq", "related"],
                  "type": "string"
                },
                "type": "array"
              },
              "brief": {
                "type": "boolean"
              },
              "category": {
                "enum": ["Major Arcana", "Wands", "Cups", "Swords", "Pentacles"],
                "type": "string"
              },
              "keywords": {
                "additionalProperties": false,
                "properties": {
                  "reversed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "upright": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "missingSections": {
                "items": {
                  "enum": ["keywords", "symbolism", "upright", "reversed", "love", "career", "money", "yes_no", "personality", "advice", "common_question", "reading_example", "comparison", "sources", "things_to_know", "scenarios", "faq", "related"],
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "orientation": {
                "enum": ["both", "upright", "reversed"],
                "type": "string"
              },
              "overview": {
                "type": "string"
              },
              "reflection": {
                "type": "string"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "enum": ["keywords", "symbolism", "upright", "reversed", "love", "career", "money", "yes_no", "personality", "advice", "common_question", "reading_example", "comparison", "sources", "things_to_know", "scenarios", "faq", "related"],
                      "type": "string"
                    },
                    "markdown": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "truncated": {
                      "type": "boolean"
                    }
                  },
                  "required": ["id", "markdown", "title", "truncated"],
                  "type": "object"
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "topics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["availableSections", "brief", "category", "keywords", "missingSections", "name", "notice", "orientation", "overview", "reflection", "sections", "slug", "topics", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f26dd4082cd7a1f8669c9539c241bdc4de25cab7dda2ffe4bd85c42001dece9d"
        },
        {
          "name": "get_tarot_spreads",
          "title": "Explore tarot spread positions",
          "description": "List educational one/three-card spread definitions, or inspect one spread. Returns positions and website guides; does not perform a reading.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "spread": {
                "enum": ["guidance", "situation", "timeline", "relationship", "feelings", "options", "career", "yesno", "yesnoquick"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "notice": {
                "type": "string"
              },
              "spreads": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cardCount": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "enum": ["guidance", "situation", "timeline", "relationship", "feelings", "options", "career", "yesno", "yesnoquick"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "positions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["cardCount", "description", "id", "name", "positions", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["notice", "spreads"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba70e86803593baa5456e6f2c7cfdb429a93d7cb774b593f487e0299f83815f0"
        },
        {
          "name": "search_tarot_cards",
          "title": "Search the 78 tarot cards",
          "description": "Rank English card names, curated topics, keyword synonyms, overview and guide text. Supports money/finances, love/relationships, career/jobs, new beginnings and hope/hopeful. All meaningful query terms must match. Exact names rank first, followed by themes and keywords. Returns match reasons and canonical source links. Empty query lists cards, optionally by family.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["Major Arcana", "Wands", "Cups", "Swords", "Pentacles"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["Major Arcana", "Wands", "Cups", "Swords", "Pentacles"],
                      "type": "string"
                    },
                    "keywords": {
                      "additionalProperties": false,
                      "properties": {
                        "reversed": {
                          "type": "string"
                        },
                        "upright": {
                          "type": "string"
                        }
                      },
                      "required": ["reversed", "upright"],
                      "type": "object"
                    },
                    "matchReasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "topics": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["category", "keywords", "matchReasons", "name", "slug", "summary", "topics", "url"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "category": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["cards", "category", "notice", "query", "total", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
