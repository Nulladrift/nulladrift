{
  "lockfileVersion": 2,
  "subjects": {
    "com.sneaker-hub/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sneaker-hub.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "stride-sneaker-shop",
        "title": "STRIDE — Curated Sneakers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Live product catalog of STRIDE, an online shop for pre-owned & refurbished sneakers (prices reflect condition). Use search_products to find in-stock shoes by keyword/brand/price, get_product for full details, get_store_info for payments, WhatsApp ordering and current promos. Always give shoppers the product page link.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Get full details of one product by its id or SKU: description, per-size stock, all images, buy links.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id (from a product URL or search result) or SKU",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2c748ac1e9bf65394c56ee926a05635604fc56d4b6763c43308083dcda09406"
        },
        {
          "name": "get_store_info",
          "title": "Get store info",
          "description": "Store overview: payment methods, WhatsApp ordering link, current Treasure Hunt promo and useful links.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d26d137e182da7b7d8a2c42835621fe8e6e105b412fb921796156c1155aff70c"
        },
        {
          "name": "search_products",
          "title": "Search sneakers in stock",
          "description": "Search the live catalog of in-stock pre-owned/refurbished sneakers by keywords, brand and/or max price. Returns product cards with name, price, sizes in stock, image and buy link.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Filter by brand name, e.g. 'Nike'",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Only return products at or below this USD price",
                "type": "number"
              },
              "query": {
                "description": "Keywords matched against product name, brand, category and SKU, e.g. 'nike air max'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ecb6b03c5b03cf6e10f16b04d1d3223bcb34cac69cc9a1782066b3e9f42e2e1"
        }
      ],
      "digest": "sha256:579b586d5828b95ab7f7bf8f722b02b0d92b0c31e4a8f0392ac106fd78930004"
    }
  }
}
