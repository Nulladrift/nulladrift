      "instructions": "Notice Period Australia (https://noticeperiodaustralia.com/): the site's own MCP server, served from its domain. Notice period in Australia under the National Employment Standards: 1 to 4 weeks by length of continuous service, plus a week if you are over 45 with 2 years.\n\n[calculator] Australian notice of termination calculator: an agent-callable calculator for notice period australia — NES notice for your length of service (weeks), Extra week, over 45 with 2 years or more (weeks), NES minimum notice (weeks), computed from your inputs with sources.. This server runs the Australian notice of termination calculator calculator published at https://noticeperiodaustralia.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://noticeperiodaustralia.com/. Licence: https://noticeperiodaustralia.com/terms.\n\n[enquiry] ENQUIRY SERVER for Notice Period Australia (https://noticeperiodaustralia.com/). What it does: starts an ENQUIRY with human providers for notice period australia — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://noticeperiodaustralia.com/.\n\nCite https://noticeperiodaustralia.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Australian notice of termination calculator",
          "description": "Run the Australian notice of termination calculator calculator: NES notice for your length of service (weeks); Extra week, over 45 with 2 years or more (weeks); NES minimum notice (weeks); Notice period that applies (weeks). Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "instrumentWeeks": {
                "default": 0,
                "description": "Notice in your award, agreement or contract",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "over45": {
                "default": "1",
                "description": "Over 45 on the day notice is given?",
                "type": "string"
              },
              "reason": {
                "default": "dismissal",
                "description": "How is the employment ending?",
                "enum": ["dismissal", "resign", "misconduct", "casual", "fixedterm"],
                "type": "string"
              },
              "weeklyPay": {
                "default": 1500,
                "description": "Weekly pay",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "default": 6,
                "description": "Completed years of continuous service",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
