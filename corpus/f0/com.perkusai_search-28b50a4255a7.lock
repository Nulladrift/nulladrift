      "instructions": "Perkusai searches real, in-stock products in amazon.com (prices in US dollars) and returns them with prices, ratings and affiliate buy links. Use `search_products` for any shopping request; present each result's `buy_url` as the purchase link.",
      "tools": [
        {
          "name": "search_products",
          "description": "Search Perkusai for real, in-stock products in amazon.com (prices in US dollars).\n\n    Describe what the shopper wants in natural language - e.g. \"a full-size basketball\", \"espresso machine under $200\", \"wireless earbuds for running\". Returns\n    matching products with title, price, rating, stock, market and an affiliate `buy_url` (present\n    it as the purchase link - the price is unchanged for the buyer), plus a `guide`, `coverage`\n    and a paste-ready `markdown` block.\n\n    Args:\n        query: The shopper's request, in natural language.\n        k: How many products to return (1-12).\n        lang: Response language hint. This catalogue is served in English.\n    ",
          "inputSchema": {
            "properties": {
              "k": {
                "default": 5,
                "description": "How many products to return (1-12).",
                "maximum": 12,
                "minimum": 1,
                "title": "K",
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Response language hint. This catalogue is served in English.",
                "title": "Lang",
                "type": "string"
              },
              "query": {
                "description": "The shopper's request, in natural language.",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_productsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_productsDictOutput",
            "type": "object"
          },
