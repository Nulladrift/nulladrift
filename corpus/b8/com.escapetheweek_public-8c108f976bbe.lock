      "serverInfo": {
        "name": "Escape the Week",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Plan and price a Friday-to-Monday city weekend and get a booking manifest to execute. Discover with list_cities, list_personas, list_origins and list_published_itineraries; price with estimate_itinerary; call booking_manifest for the ordered booking plan. Escape the Week never takes payment: every booking is made on a partner site and every payment needs the person's approval.",
      "tools": [
        {
          "name": "booking_checklist",
          "title": "Booking checklist",
          "description": "Booking links and checklist for a weekend, ordered by scarcity: first the steps that must be booked ahead (longest lead time first, each with reserve_days, a book_by date YYYY-MM-DD and an easier fallback), then flights, the hotel and the other bookable steps. An item's alternatives [{provider, url}] are other sites that book the same thing (the hotel on Klook beside Booking.com), not additional items.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from list_cities, e.g. lisbon.",
                "type": "string"
              },
              "friday": {
                "description": "The Friday of the weekend as a YYYY-MM-DD date (it must be a Friday); the weekend runs Friday to Monday. Enables a real fare.",
                "type": "string"
              },
              "lang": {
                "description": "BCP 47 language of the published text, e.g. es (default English).",
                "type": "string"
              },
              "origin": {
                "description": "Origin slug from list_origins, e.g. barcelona; adds flights.",
                "type": "string"
              },
              "persona": {
                "description": "Persona slug from list_personas, e.g. foodie.",
                "type": "string"
              },
              "tier": {
                "description": "Budget tier, cheapest to most lavish (default modest). Scales every price line.",
                "enum": ["cheap", "modest", "expensive", "luxury", "ultra"],
                "type": "string"
              },
              "travellers": {
                "description": "Group size, 1-20 (default 2). Prices are for the whole group.",
                "type": "integer"
              }
            },
            "required": ["city", "friday", "persona"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Booking checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2dcca818c461aeb39bb8478ece26673b18300752e8501891d8001d1ed167bec8"
        },
        {
          "name": "booking_manifest",
          "title": "Booking plan",
          "description": "The booking plan for one weekend, in booking order: items (flights, hotel and bookable steps; scarcest first) each with kind, title, when (date YYYY-MM-DD and local time HH:MM), the affiliate-tracked partner url with dates, party size and time prefilled where the partner supports it, provider, estimated_cost {cents, currency} for the whole party, reserve_days, book_by (YYYY-MM-DD), fallback and alternatives [{provider, url}]: other sites that book the same item (the hotel on Klook beside Booking.com), not additional items; plus needs_from_user (traveller names, contact, payment approval), a sequence_note, the total estimate in integer cents, cancellation_advice and a disclosure that the links are affiliate links. Escape the Week takes no payment: every booking and payment is made on the partner's site. Prices are estimates, not quotes.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from list_cities, e.g. lisbon.",
                "type": "string"
              },
              "friday": {
                "description": "The Friday of the weekend as a YYYY-MM-DD date (it must be a Friday); the weekend runs Friday to Monday. Enables a real fare.",
                "type": "string"
              },
              "lang": {
                "description": "BCP 47 language of the published text, e.g. es (default English).",
                "type": "string"
              },
              "origin": {
                "description": "Origin slug from list_origins, e.g. barcelona; adds flights.",
                "type": "string"
              },
              "party": {
                "description": "Who is travelling, to check the persona fits (optional); never changes a price.",
                "enum": ["solo", "couple", "friends", "family", "multigen"],
                "type": "string"
              },
              "persona": {
                "description": "Persona slug from list_personas, e.g. foodie.",
                "type": "string"
              },
              "tier": {
                "description": "Budget tier, cheapest to most lavish (default modest). Scales every price line.",
                "enum": ["cheap", "modest", "expensive", "luxury", "ultra"],
                "type": "string"
              },
              "travellers": {
                "description": "Group size, 1-20 (default 2). Prices are for the whole group.",
                "type": "integer"
              }
            },
            "required": ["city", "friday", "persona"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Booking plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
