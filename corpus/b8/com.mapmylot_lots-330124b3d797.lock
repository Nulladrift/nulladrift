        {
          "name": "mml_compare_lots",
          "title": "Compare lots",
          "description": "Returns side-by-side facts for 2 to 10 lots: one row per lot with the same facts as the\n    lot facts result, or that lot's error. Rows stay in the order given, or follow a requested\n    sort (by area, frontage, layers found, constraint score and so on); sorted_by states the\n    order used. The result is facts only, with no ranking of which lot is better. Each new lot\n    counts toward the day's lookups. Requires a MapMyLot Pro plan.",
          "inputSchema": {
            "$defs": {
              "SortBy": {
                "properties": {
                  "direction": {
                    "default": "asc",
                    "description": "asc: smallest or fewest first; desc: largest or most first",
                    "enum": ["asc", "desc"],
                    "title": "Direction",
                    "type": "string"
                  },
                  "key": {
                    "enum": ["area_m2", "perimeter_m", "frontage_m", "layers_present", "constraint_score", "unconstrained_area_m2", "suburb_percentile"],
                    "title": "Key",
                    "type": "string"
                  }
                },
                "required": ["key"],
                "title": "SortBy",
                "type": "object"
              }
            },
            "properties": {
              "lots": {
                "anyOf": [
                  {
                    "items": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "string"
                        }
                      ]
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "2 to 10 lots: row_ids returned by the lot search, or addresses, lot/plans or coordinates",
                "title": "Lots"
              },
              "saved": {
                "default": false,
                "description": "Compares the account's saved lots instead (up to 10, newest first)",
                "title": "Saved",
                "type": "boolean"
              },
              "sort": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/SortBy"
