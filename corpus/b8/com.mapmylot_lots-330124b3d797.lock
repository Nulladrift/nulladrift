      "instructions": "MapMyLot looks up land lots (parcels) from official cadastre data in Australia (QLD, NSW, VIC, TAS, ACT), New Zealand, Canada (BC, MB, NB, YK) and the UK (England, Wales, Scotland). Call mml_coverage to see what each area supports. mml_find_lot takes an address, lot/plan, UK postcode or coordinates and returns the lot and its row_id. mml_lot_facts then gives its area, frontage, planning and hazard layers and surroundings; mml_build_facts gives the facts that bear on building, without any verdict. Answers can be locked by the user's plan: a locked answer is unknown to you, never absent, so never say a locked layer does not apply. Quote the sources and data dates returned with each answer. These are facts from public data, not legal, planning or survey advice. MapMyLot gives facts, not verdicts: it does not say what can be built on a lot (the council decides) and orders compared lots only by the facts the user chooses. Plan limits: a free MapMyLot account gets 5 distinct lots a day, shared with mapmylot.com, and some planning and hazard answers stay locked; Pro gets every answer, 100 lots a day here, compare and watches; a report bought for a lot unlocks every answer for that lot. Areas outside the ones listed are not covered.",
