        {
          "name": "mml_find_lot",
          "title": "Find a lot",
          "description": "Finds the land lot for an address, lot/plan, UK postcode, INSPIRE ID or coordinates.\n    Returns the lot's MapMyLot id (row_id), lot/plan, area, perimeter, a point inside it, its\n    outline as GeoJSON, a link to view it on mapmylot.com, and the data sources. In hosts that\n    show apps the lot is also drawn on a map. Each new lot counts toward the account's daily\n    MapMyLot lookups. Requires a free MapMyLot account.",
