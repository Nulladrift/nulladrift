{
  "lockfileVersion": 2,
  "subjects": {
    "com.immigrationlayer/immigration-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://immigrationlayer.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "immigration-mcp",
        "title": "ImmigrationLayer",
        "version": "0.0.0",
        "description": "Current USCIS form editions, filing fees, processing times, and alerts, plus the State Department Visa Bulletin, for AI agents. Not legal advice.",
        "websiteUrl": "https://immigrationlayer.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ImmigrationLayer returns current USCIS form editions, filing fees, processing times, and alerts, plus the State Department Visa Bulletin.\n\nEvery answer that returns data carries as_of, source_url, and content_hash. Show the date and the source link to the user so they can check it.\n\nCoverage is limited to stored records. as_of is a tool-specific data date, not a guarantee of current source verification. content_hash identifies stored content, not an unchanged live source.\n\nFour tools are free with no sign-in and no plan: check_form_edition, list_form_changes, get_visa_bulletin_dv, get_visa_bulletin_notes.\n\nFour tools need sign-in and an active plan: get_fee, get_processing_time, get_visa_bulletin, search_alerts.\n\nAuthentication and subscription errors mean the requested data was not returned. Do not infer a result from an error.\n\nTools accept public lookup parameters, not personal information or case details.\n\nNot legal advice.",
      "tools": [
        {
          "name": "check_form_edition",
          "title": "Check form edition",
          "description": "Returns the edition of one USCIS form that USCIS accepts today, with its accept-from and reject-from dates. Use it to check which edition of a form USCIS accepts, with the date of that answer. If USCIS has announced a newer edition it does not accept yet, announced_edition gives that edition and its accept-from date. For edition changes across all forms since a date, use list_form_changes. Covers I-90, I-129, I-130, I-131, I-140, I-485, I-539, I-765, and N-400; any other form returns not_found. Free, no sign-in required. Limit: 20 calls per minute per IP, then rate_limited. Not legal advice. Source: the form's page on uscis.gov, or a dated web.archive.org capture of that page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "form": {
                "description": "USCIS form number exactly as USCIS writes it, uppercase with the hyphen, e.g. \"I-765\". \"i765\" and \"I765\" do not match",
                "example": "I-765",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["form"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "accept_from": {
                    "description": "First date USCIS accepts this edition, YYYY-MM-DD",
                    "example": "2026-09-15",
                    "type": "string"
                  },
                  "announced_edition": {
                    "additionalProperties": false,
                    "description": "The next edition USCIS has announced but does not accept yet; absent when none",
                    "properties": {
                      "accept_from": {
                        "example": "2026-10-01",
                        "type": "string"
                      },
                      "edition_date": {
                        "example": "10/01/26",
                        "type": "string"
                      }
                    },
                    "required": ["accept_from", "edition_date"],
                    "type": "object"
                  },
                  "edition_date": {
                    "description": "Edition date printed on the form, MM/DD/YY",
                    "example": "09/15/26",
                    "type": "string"
                  },
                  "form": {
                    "example": "I-765",
                    "type": "string"
                  },
                  "reject_from": {
                    "description": "Date USCIS stops accepting this edition, YYYY-MM-DD; null when none is announced",
                    "example": null,
                    "type": ["string", "null"]
                  }
                },
                "required": ["accept_from", "edition_date", "form", "reject_from"],
                "type": "object"
              },
              "not_legal_advice": {
                "const": true,
                "type": "boolean"
              },
              "source_url": {
                "example": "https://www.uscis.gov/i-765",
                "type": "string"
              }
            },
            "required": ["as_of", "content_hash", "data", "not_legal_advice", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37cf0a5fe4564830922423a8f698d802c139bc9637bd0969dbfec074c985c5a4"
        },
        {
          "name": "get_fee",
          "title": "Get filing fee",
          "description": "Returns a published government fee and its effective date. For US (the default), the general filing fee for a USCIS form and filing method. I-129, I-131, and I-907 have no general filing fee: pass category. For I-131, the label this tool uses: a short name of the Appendix B heading, a colon, and the item selector, such as \"Reentry Permit: Part 1., Item Number 1.\" For I-129 and I-907, the category argument says how to name the classification. US covers I-90, I-130, I-140, I-485, I-539, I-765, and N-400, paper and online, and I-129, I-131, and I-907 by category; only some G-1055 categories are covered, and an uncovered one returns no fee. An I-129 amount is the filing fee G-1055 lists for that row. Fees G-1055 lists apart from it are not in the amount. An I-907 amount is the premium processing fee only, not the fee for the form it accompanies. Any other form returns not_found. For GB, the fee for a published Home Office fee category; pass the section heading as category when the name appears in more than one section. For AU, a visa application charge component that Migration Regulations 1994, Schedule 1 states for a visa subclass, from the item's table for any other applicant or its only charge table. Pass the subclass as form, such as \"189\", and the component as category, such as \"Base application charge\"; category is required when the subclass has more than one component. 500 and 590 are subclasses whose charge Schedule 1 states in item 1222. Other amounts apply to some applicants; notes names the item and compilation. amount_cents is in the minor unit of currency. filing is \"unspecified\" when the source states no filing channel. It does not say which fee applies to a case. For a USCIS form's current edition, use check_form_edition. Requires sign-in at https://immigrationlayer.com/login and an active plan. Without a plan it returns subscription_required. Limit: 30 calls per minute per account, shared by all paid tools, then rate_limited. Not legal advice. Sources: for US, the USCIS fee schedule (Form G-1055), the 2024 USCIS fee rule (89 FR 6194), and, for I-907, the 2026 premium processing fee rule (91 FR 1059); for GB, the Home Office visa regulations revised table on gov.uk, used under the Open Government Licence v3.0; for AU, Migration Regulations 1994, Schedule 1. Australian charges are based on content from the Federal Register of Legislation, CC BY 4.0.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "For US I-131, a short name of the Appendix B heading, a colon, and the item selector, such as \"Reentry Permit: Part 1., Item Number 1.\" For US I-129, the classification label exactly as G-1055 Appendix A prints it, such as \"If you are filing H-1B or H-1B1 petitions.\"; for a small employer row, that label, a space, and \"If you are filing as a Small Employer or Nonprofit.\" For US I-907, the classification label exactly as G-1055 prints it, such as \"H-2B or R nonimmigrant classification\". Required for I-129, I-131, and I-907. For GB, the published section heading. Required when the fee category name appears in more than one section. For AU, the charge component exactly as the item states it, such as \"Base application charge\"; required when the subclass has more than one.",
                "maxLength": 256,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. \"US\" (default), \"GB\", or \"AU\".",
                "enum": ["US", "GB", "AU"],
                "type": "string"
              },
              "filing": {
                "description": "How the form is filed: \"paper\" (mailed) or \"online\" (USCIS online account). Required for US. Ignored for GB and AU.",
                "enum": ["paper", "online"],
                "example": "online",
                "type": "string"
              },
              "form": {
                "description": "For US, the USCIS form number exactly as USCIS writes it, e.g. \"I-765\"; \"i765\" and \"I765\" do not match. For GB, the published Home Office fee category name. For AU, the three-digit visa subclass, such as \"500\".",
                "example": "I-765",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["form"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "amount_cents": {
                    "description": "Fee in the minor unit of currency; 47000 with USD is $470.00.",
                    "example": 47000,
                    "type": "number"
                  },
                  "attribution": {
                    "description": "Licence attribution for the source data. Present for AU, absent for US and GB.",
                    "type": "string"
                  },
                  "category": {
                    "example": null,
                    "type": ["string", "null"]
                  },
                  "currency": {
                    "description": "ISO 4217 code for amount_cents, e.g. \"USD\" or \"GBP\".",
                    "example": "USD",
                    "type": "string"
                  },
                  "effective_date": {
                    "description": "Date this fee took effect, YYYY-MM-DD",
                    "example": "2024-04-01",
                    "type": "string"
                  },
                  "filing": {
                    "enum": ["paper", "online", "unspecified"],
                    "example": "online",
                    "type": "string"
                  },
                  "form": {
                    "example": "I-765",
                    "type": "string"
                  },
                  "notes": {
                    "description": "Where the source states the charge and what can change it. Present for AU, absent for US and GB.",
                    "type": "string"
                  }
                },
                "required": ["amount_cents", "category", "currency", "effective_date", "filing", "form"],
                "type": "object"
              },
              "not_legal_advice": {
                "const": true,
                "type": "boolean"
              },
              "source_url": {
                "example": "https://www.uscis.gov/i-765",
                "type": "string"
              }
            },
            "required": ["as_of", "content_hash", "data", "not_legal_advice", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efce227e7922f32c98bf41ea4dd78724deb972165848717fd4d7303004c6b593"
        },
        {
          "name": "get_processing_time",
          "title": "Get processing time",
          "description": "Returns a published processing time for one form or visa route, category, and office. For US (the default), the USCIS processing-time estimate: the time within which 80% of cases were completed, in months, weeks, or days. Use it when the user asks for USCIS's published processing time for a form. It reports past completions, not how long a given case will take. Pass form, category, and office exactly as the USCIS processing times tool lists them. Every US estimate on file has both a category and an office, so omitting either returns not_found. For GB, UK Visas and Immigration's published processing time for a visa route, as the page words it. Pass the route as form, such as \"Skilled Worker\", and office \"inside the UK\" or \"outside the UK\". Pass the page's section heading as category when the route appears in more than one section. A time the page marks with \"*\" carries the page's footnote in category_notes. It does not say how long a given application will take. For AU, the \"90% processed in\" figure the Department of Home Affairs global visa processing times page publishes for a visa subclass and stream, as the page words it. The page bases it on recently decided applications. Pass the three-digit subclass as form, such as \"500\", and the stream as the page lists it as category; category is required when the subclass has more than one stream. Omit office. category_notes carries the page's caveat and any note the page gives for that subclass and stream. It does not say how long a given application will take. For Visa Bulletin waits, use get_visa_bulletin. Requires sign-in at https://immigrationlayer.com/login and an active plan. Without a plan it returns subscription_required. Limit: 30 calls per minute per account, shared by all paid tools, then rate_limited. Not legal advice. Source: for US, the USCIS processing times tool (egov.uscis.gov); for GB, the UK Visas and Immigration visa processing times pages on gov.uk for applications inside and outside the UK; for AU, the Department of Home Affairs global visa processing times page (immi.homeaffairs.gov.au). UK processing-time data contains public sector information licensed under the Open Government Licence v3.0. Australian processing-time data: Australian Government Department of Home Affairs, licensed under CC BY 3.0 AU (https://creativecommons.org/licenses/by/3.0/au/). ImmigrationLayer extracted and reformatted it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "For US, the eligibility category exactly as the USCIS processing times tool lists it, e.g. \"Based on an approved asylum application [(a)(5)]\" for I-765. For GB, the page's section heading, such as \"Popular work visas\"; required when the route appears in more than one section. For AU, the visa stream exactly as the page lists it, such as \"Higher Education Sector\"; required when the subclass has more than one stream.",
                "example": "Based on an approved asylum application [(a)(5)]",
                "maxLength": 256,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. \"US\" (default), \"GB\", or \"AU\".",
                "enum": ["US", "GB", "AU"],
                "type": "string"
              },
              "form": {
                "description": "For US, the USCIS form number exactly as USCIS writes it, e.g. \"I-765\"; \"i765\" and \"I765\" do not match. For GB, the visa route exactly as the UKVI page lists it, e.g. \"Skilled Worker\". For AU, the three-digit visa subclass, such as \"500\".",
                "example": "I-765",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "office": {
                "description": "For US, the USCIS office exactly as the processing times tool lists it, e.g. \"Service Center Operations (SCOPS)\", \"National Benefits Center\", or a field office such as \"Houston TX\". For GB, \"inside the UK\" or \"outside the UK\". Required for GB. Omit for AU.",
                "example": "Service Center Operations (SCOPS)",
                "maxLength": 256,
                "type": "string"
              }
            },
            "required": ["form"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "attribution": {
                    "description": "Licence attribution for the source data. Present for GB and AU, absent for US.",
                    "type": "string"
                  },
                  "basis": {
                    "description": "What value measures, as the source states it",
                    "example": "80% of cases completed within",
                    "type": "string"
                  },
                  "category": {
                    "example": null,
                    "type": ["string", "null"]
                  },
                  "category_notes": {
                    "description": "The source's own note on the category, or null",
                    "example": null,
                    "type": ["string", "null"]
                  },
                  "form": {
                    "example": "I-765",
                    "type": "string"
                  },
                  "office": {
                    "example": null,
                    "type": ["string", "null"]
                  },
                  "unit": {
                    "description": "Unit of value as the source states it, e.g. \"Months\", \"weeks\", or \"Days\"",
                    "example": "Months",
                    "type": "string"
                  },
                  "value": {
                    "description": "The published time, in unit",
                    "example": 4.5,
                    "type": "number"
                  }
                },
                "required": ["basis", "category", "category_notes", "form", "office", "unit", "value"],
                "type": "object"
              },
              "not_legal_advice": {
                "const": true,
                "type": "boolean"
              },
              "source_url": {
                "example": "https://www.uscis.gov/i-765",
                "type": "string"
              }
            },
            "required": ["as_of", "content_hash", "data", "not_legal_advice", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cbe3bdb44ade082dc7f58b56e8b92326ff93bf8ae23ed9b769ffad8320c82b8"
        },
        {
          "name": "get_visa_bulletin",
          "title": "Get Visa Bulletin chart entry",
          "description": "Returns one family- or employment-based cutoff from a month's State Department Visa Bulletin: the Final Action Date or Date for Filing for a preference category and chargeability country. Use it when the user asks whether a priority date is current. date_or_status is a YYYY-MM-DD cutoff, \"C\" (current), or \"U\" (unavailable). For Diversity Visa lottery cutoffs, use get_visa_bulletin_dv. For the bulletin's advisory notes on future movement, use get_visa_bulletin_notes. A month or combination not on file returns not_found. Requires sign-in at https://immigrationlayer.com/login and an active plan. Without a plan it returns subscription_required. Limit: 30 calls per minute per account, shared by all paid tools, then rate_limited. Not legal advice. Source: the Department of State Visa Bulletin (travel.state.gov).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Preference category code, exact: F1, F2A, F2B, F3, F4, EB-1, EB-2, EB-3, EB-3-OW (other workers), EB-4, EB-4-R (religious workers), EB-5 (unreserved), EB-5-RURAL, EB-5-HUA (high unemployment), or EB-5-INFRA",
                "example": "F2A",
                "maxLength": 256,
                "type": "string"
              },
              "chart": {
                "description": "\"final_action\" for the Final Action Dates chart, \"dates_for_filing\" for the Dates for Filing chart",
                "enum": ["final_action", "dates_for_filing"],
                "example": "final_action",
                "type": "string"
              },
              "country": {
                "description": "Chargeability country, exact: \"China\" (mainland-born), \"India\", \"Mexico\", \"Philippines\", or \"All Chargeability Areas\", the bulletin column for countries without their own column",
                "example": "India",
                "maxLength": 256,
                "type": "string"
              },
              "month": {
                "description": "Bulletin month as YYYY-MM, e.g. \"2026-10\". A month not yet published or loaded returns not_found",
                "example": "2026-10",
                "maxLength": 256,
                "pattern": "^\\d{4}-(?:0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["category", "chart", "country", "month"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "category": {
                    "example": "F2A",
                    "type": "string"
                  },
                  "chart": {
                    "enum": ["final_action", "dates_for_filing"],
                    "example": "final_action",
                    "type": "string"
                  },
                  "country": {
                    "example": "India",
                    "type": "string"
                  },
                  "date_or_status": {
                    "description": "Cutoff date as YYYY-MM-DD, \"C\" (current), or \"U\" (unavailable), as the bulletin prints it",
                    "example": "2021-01-01",
                    "type": "string"
                  },
                  "month": {
                    "example": "2026-10",
                    "type": "string"
                  }
                },
                "required": ["category", "chart", "country", "date_or_status", "month"],
                "type": "object"
              },
              "not_legal_advice": {
                "const": true,
                "type": "boolean"
              },
              "source_url": {
                "example": "https://www.uscis.gov/i-765",
                "type": "string"
              }
            },
            "required": ["as_of", "content_hash", "data", "not_legal_advice", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60ab2fdc15f6885d858463a1f18b6f53f259685449e8a5ca55c079883e00dd16"
        },
        {
          "name": "get_visa_bulletin_dv",
          "title": "Get Diversity Visa lottery cutoff",
          "description": "Returns the Diversity Visa (DV lottery) rank cutoff for one region in a month's Visa Bulletin, or a country exception the bulletin lists within that region. Use it when a DV selectee asks whether their case number is current. For family and employment chart dates, use get_visa_bulletin. For the bulletin's advisory notes, use get_visa_bulletin_notes. A month or region not on file returns not_found. Free, no sign-in required. Limit: 20 calls per minute per IP, then rate_limited. Not legal advice. Source: the Department of State Visa Bulletin (travel.state.gov).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Chargeability country within the region; falls back to the region's \"All\" rate when the country has no listed exception, or when omitted",
                "example": "Egypt",
                "maxLength": 256,
                "type": "string"
              },
              "month": {
                "description": "Bulletin month as YYYY-MM, e.g. \"2026-10\". A month not yet published or loaded returns not_found",
                "example": "2026-10",
                "maxLength": 256,
                "pattern": "^\\d{4}-(?:0[1-9]|1[0-2])$",
                "type": "string"
              },
              "region": {
                "description": "DV region, exact: \"Africa\", \"Asia\", \"Europe\", \"North America\", \"Oceania\", or \"South America and the Caribbean\"",
                "example": "Africa",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["month", "region"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "example": "All",
                    "type": "string"
                  },
                  "cutoff_or_status": {
                    "description": "Rank cutoff: a case number such as \"35000\", or \"C\" (current), as the bulletin prints it",
                    "example": "35000",
                    "type": "string"
                  },
                  "month": {
                    "example": "2026-10",
                    "type": "string"
                  },
                  "region": {
                    "example": "Africa",
                    "type": "string"
                  }
                },
                "required": ["country", "cutoff_or_status", "month", "region"],
                "type": "object"
              },
              "not_legal_advice": {
                "const": true,
                "type": "boolean"
              },
              "source_url": {
                "example": "https://www.uscis.gov/i-765",
                "type": "string"
              }
            },
            "required": ["as_of", "content_hash", "data", "not_legal_advice", "source_url"],
            "type": "object"
          },
