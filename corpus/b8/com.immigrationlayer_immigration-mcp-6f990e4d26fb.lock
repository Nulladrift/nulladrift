                        "url": {
                          "example": "https://www.uscis.gov/newsroom/alerts/example",
                          "type": "string"
                        }
                      },
                      "required": ["content_hash", "forms_json", "id", "published_at", "source", "summary", "title", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "form_editions": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "accept_from": {
                          "example": "2026-09-15",
                          "type": "string"
                        },
