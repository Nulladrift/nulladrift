        {
          "name": "search_alerts",
          "title": "Search alerts",
          "description": "Searches published immigration announcements by keyword, newest first. For US (the default), USCIS newsroom alerts and Federal Register notices. Use it to find announcements about a form or topic, e.g. \"I-765\" or \"fee\". For GB, Home Office media statements and fact sheets that the Home Office in the media feed tags as immigration, matched by title. They are statements, not rule changes. GB results cover recent posts ImmigrationLayer has stored from the feed, not a full archive. Each GB item carries its feed categories and a licence attribution. Australian alerts list registered compilations of the Migration Regulations 1994, based on content from the Federal Register of Legislation, CC BY 4.0. AU titles state only the compilation number; search \"compilation\" to list them. Each AU item carries its start date and a licence attribution. To list everything published since a date without a keyword, use list_form_changes, which is free. Returns at most 100 matches per page. Pass next_cursor as cursor to continue until next_cursor is null. No match returns an empty list, not an error. Requires sign-in at https://immigrationlayer.com/login and an active plan. Without a plan it returns subscription_required. Limit: 30 calls per minute per account, shared by all paid tools, then rate_limited. Not legal advice. Sources: for US, USCIS newsroom alerts and Federal Register notices; for GB, the Home Office in the media blog feed (homeofficemedia.blog.gov.uk); for AU, the Federal Register of Legislation (legislation.gov.au). UK alert data contains public sector information licensed under the Open Government Licence v3.0. The top-level source URL identifies the exact aggregate query, including the page cursor; each result preserves its government URL, source, and content hash.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. \"US\" (default), \"GB\" or \"AU\".",
                "enum": ["US", "GB", "AU"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque navigation cursor from the preceding page's next_cursor. Omit for the first page.",
                "maxLength": 4096,
                "type": "string"
              },
              "query": {
                "description": "Keyword matched case-insensitively anywhere in an alert's title. A form number such as \"I-765\" also matches alerts tagged with that form. Summaries are not searched",
                "example": "I-765",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 date or date-time, e.g. \"2026-08-01\" or \"2026-08-01T09:30:00Z\"; limits results to alerts published on or after this instant. A date means midnight UTC; a date-time without an offset is UTC.",
                "maxLength": 256,
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$|^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d))|(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?)$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "example": "2026-09-15T00:00:00Z",
                "type": "string"
              },
              "content_hash": {
                "example": "sha256:example",
                "type": "string"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "alerts": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "attribution": {
                          "description": "Licence attribution for the source data. Present for GB and AU, absent for US.",
                          "type": "string"
                        },
                        "categories": {
                          "description": "The feed's category terms for the post. Present for GB, absent for US.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "content_hash": {
                          "example": "sha256:example",
                          "type": "string"
                        },
                        "forms_json": {
                          "example": "[\"I-539\",\"I-765\"]",
                          "type": "string"
                        },
