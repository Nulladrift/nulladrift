                          "type": ["string", "null"]
                        },
                        "content_hash": {
                          "example": "sha256:example",
                          "type": "string"
                        },
                        "doc_type": {
                          "type": ["string", "null"]
                        },
                        "effective_date": {
                          "type": ["string", "null"]
                        },
                        "forms_json": {
                          "example": "[\"I-539\",\"I-765\"]",
                          "type": "string"
                        },
                        "id": {
                          "example": "alert_123",
                          "type": "string"
                        },
                        "published_at": {
                          "example": "2026-08-14T00:00:00Z",
                          "type": "string"
                        },
                        "source": {
                          "enum": ["uscis_newsroom", "federal_register"],
                          "example": "uscis_newsroom",
                          "type": "string"
                        },
                        "summary": {
                          "example": null,
