        {
          "name": "list_recalls",
          "title": "List recalls",
          "description": "Use this when the user asks about recalls for a car model, such as \"any recalls on a 2018 Toyota Camry?\". Pass the year, make and model and optionally a limit of up to 25. Returns each recall's campaign number, date, component, summary, consequence and remedy, and whether NHTSA says to park the car. Recalls are listed by year, make and model, not by VIN: to check one specific car, use nhtsa.gov/recalls. A model with no recalls listed is not a safety guarantee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many recalls to return, newest first, up to 25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Manufacturer, such as \"Honda\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Model name without trim, such as \"CR-V\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "description": "Model year, such as 2018",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "make": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "more_available": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "recalls": {
                "items": {
                  "properties": {
                    "campaign": {
                      "type": "string"
                    },
                    "component": {
                      "type": ["string", "null"]
                    },
                    "consequence": {
                      "type": ["string", "null"]
                    },
                    "date": {
                      "type": ["string", "null"]
                    },
                    "over_the_air": {
                      "type": "boolean"
                    },
                    "park_it": {
                      "type": "boolean"
                    },
                    "park_outside": {
                      "type": "boolean"
                    },
                    "remedy": {
                      "type": ["string", "null"]
                    },
                    "summary": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok", "not_found", "unavailable"],
                "type": "string"
              },
              "total_recalls": {
                "type": "integer"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["make", "model", "notice", "status", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
