      "serverInfo": {
        "name": "cars",
        "title": "Car Check: Recalls, ratings and mpg",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Car Check: Recalls, ratings and mpg. Use these tools for questions about US cars by VIN or by year, make and model. Call decode_vin to turn a VIN into the vehicle's details and surface any error_codes it returns, list_recalls for NHTSA recalls, get_fuel_economy for EPA mpg figures, and get_vehicle_report for recalls, crash ratings, complaints and fuel economy together. Recalls and complaints are listed by year, make and model, not by VIN, so say so and point to nhtsa.gov/recalls to check one specific car. Complaints are reports from owners, not confirmed defects. A count of zero or a missing rating is not proof of safety. Name every vehicle variant the data returns instead of picking one. This is a data lookup, not a valuation, history report or inspection: do not give safety, mechanical, valuation or buying advice. US vehicles only. Credit NHTSA and the EPA. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "decode_vin",
          "title": "Decode a VIN",
          "description": "Use this when the user gives a 17-character vehicle identification number (VIN) and wants to know what car it is, such as \"what car is 1HGCM82633A004353?\". Returns the model year, make, model, trim, body class, engine, fuel, plant country and NHTSA's error codes and error text, which flag a wrong check digit or an incomplete decode. US-market vehicles. A data lookup, not a history report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vin": {
                "description": "The 17-character vehicle identification number (letters and digits, no I, O or Q)",
                "pattern": "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$",
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body_class": {
                "type": ["string", "null"]
              },
              "engine": {
                "type": ["string", "null"]
              },
              "error_codes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error_text": {
                "type": ["string", "null"]
              },
              "fuel": {
                "type": ["string", "null"]
              },
              "make": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "model": {
                "type": ["string", "null"]
              },
              "model_year": {
                "type": ["integer", "null"]
              },
              "notice": {
                "type": "string"
              },
              "plant_country": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["ok", "invalid", "unavailable"],
                "type": "string"
              },
              "trim": {
                "type": ["string", "null"]
              },
              "vin": {
                "type": "string"
              }
            },
            "required": ["error_codes", "notice", "status", "vin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
