                          "type": "string"
                        },
                        "count": {
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "fuel_economy": {
                "properties": {
                  "available": {
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["ok", "not_found", "unavailable"],
                    "type": "string"
                  },
                  "variants": {
                    "items": {
                      "properties": {
                        "annual_fuel_cost_usd": {
                          "type": ["number", "null"]
                        },
