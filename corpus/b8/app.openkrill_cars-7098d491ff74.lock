                          "type": ["number", "null"]
                        },
                        "fuel": {
                          "type": ["string", "null"]
                        },
                        "kwh_per_100_miles": {
                          "type": ["number", "null"]
                        },
                        "transmission": {
                          "type": ["string", "null"]
                        },
                        "variant": {
                          "type": "string"
                        },
                        "vehicle_class": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "recalls": {
                "properties": {
