        {
          "name": "get_fuel_economy",
          "title": "Get fuel economy",
          "description": "Use this when the user asks about mpg, electric range or fuel cost for a car, such as \"what mpg does a 2022 Toyota RAV4 hybrid get?\". Pass the year, make and model, and optionally words such as AWD or hybrid to narrow it. Returns the EPA's city, highway and combined mpg (mpge for electric vehicles) for each configuration, with electric range, tailpipe CO2 and estimated annual fuel cost, and lists the configurations not shown. EPA estimates, not a promise of real-world mileage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Manufacturer, such as \"Honda\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Model name without trim, such as \"CR-V\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "option": {
                "description": "Optional words to narrow the configuration, in any order, such as \"AWD\", \"hybrid\", \"manual\" or \"4Dr 2.0 L\"; every word must match",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "description": "Model year, such as 2018",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available": {
                "type": "integer"
              },
              "make": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "others": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "enum": ["ok", "not_found", "unavailable"],
                "type": "string"
              },
              "variants": {
                "items": {
                  "properties": {
                    "annual_fuel_cost_usd": {
                      "type": ["number", "null"]
                    },
                    "co2_tailpipe_g_per_mile": {
                      "type": ["number", "null"]
                    },
                    "efficiency": {
                      "properties": {
                        "city": {
                          "type": ["number", "null"]
                        },
                        "combined": {
                          "type": ["number", "null"]
                        },
                        "highway": {
                          "type": ["number", "null"]
                        },
                        "unit": {
                          "enum": ["mpg", "mpge"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "ev_range_miles": {
                      "type": ["number", "null"]
                    },
                    "fuel": {
                      "type": ["string", "null"]
                    },
                    "kwh_per_100_miles": {
                      "type": ["number", "null"]
                    },
                    "transmission": {
                      "type": ["string", "null"]
                    },
                    "variant": {
                      "type": "string"
                    },
                    "vehicle_class": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["make", "model", "notice", "status", "year"],
            "type": "object"
          },
