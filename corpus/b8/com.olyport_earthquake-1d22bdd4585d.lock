      "tools": [
        {
          "name": "get_earthquake_detail",
          "description": "Get full details of a specific earthquake event by its USGS event ID.\n\n    Returns comprehensive information including magnitude, location, depth,\n    felt reports, tsunami status, and tectonic summary when available.\n\n    Args:\n        event_id: The USGS event ID (e.g. 'us7000m1xh'). Get IDs from search results.\n    ",
          "inputSchema": {
            "properties": {
              "event_id": {
                "title": "Event Id",
                "type": "string"
              }
            },
            "required": ["event_id"],
            "title": "get_earthquake_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_earthquake_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcb489db69a78be144a1550f401e096e55324b723e4a44e982587187b8de3f51"
        },
        {
          "name": "get_earthquakes_near",
          "description": "Get earthquakes near a specific geographic location.\n\n    Searches for earthquakes within a radius of the given coordinates.\n    Useful for assessing local seismic risk or investigating felt reports.\n\n    Args:\n        latitude: Latitude of the center point (e.g. 37.7749 for San Francisco).\n        longitude: Longitude of the center point (e.g. -122.4194 for San Francisco).\n        radius_km: Search radius in kilometers (default 100, max 20001).\n        min_magnitude: Minimum magnitude to include (default 1.0).\n        days: Number of days to look back (default 30, max 365).\n    ",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "title": "Days",
                "type": "integer"
              },
              "latitude": {
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "title": "Longitude",
                "type": "number"
              },
              "min_magnitude": {
                "default": 1,
                "title": "Min Magnitude",
                "type": "number"
              },
              "radius_km": {
                "default": 100,
                "title": "Radius Km",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "title": "get_earthquakes_nearArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_earthquakes_nearOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bad8386aa215dae24f61f7fc6af2f65f8cca54def6ceb40be6e4254f265211ca"
        },
        {
          "name": "get_recent_earthquakes",
          "description": "Get recent earthquakes worldwide above a minimum magnitude.\n\n    Returns earthquake events from the USGS catalog sorted by time (newest first).\n    Useful for monitoring seismic activity globally.\n\n    Args:\n        min_magnitude: Minimum magnitude to include (default 2.5). Use 4.5+ for significant quakes only.\n        days: Number of days to look back (default 7, max 30).\n        limit: Maximum number of earthquakes to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "title": "Days",
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "min_magnitude": {
                "default": 2.5,
                "title": "Min Magnitude",
                "type": "number"
              }
            },
            "title": "get_recent_earthquakesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_recent_earthquakesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77a0be513d20a56749a4068f537cfa0c580b5b7d227a820147093ead2860c41c"
        }
      ],
      "digest": "sha256:dae3442a4f2485f69482bb201c2ae9c5758494ac8778efe19d78ba8966d00f47"
    }
  }
