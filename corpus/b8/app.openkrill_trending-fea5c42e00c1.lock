      "instructions": "Trending Now: Rising posts across the web. Call trending when the user wants what is popular or rising now. Pass topic as a niche slug or the user's own words, and window (1h, 6h, 24h, 3d, 7d; default 24h). Give each post's title, link, source, and its count with unit and velocity_per_hour. Say heat compares a post only with others from the same source. For a top list, take posts in rank order and say the rule: rank orders every post by heat, highest first; posts with equal heat (each source's top post has 100) go newer first. velocity_basis since_last_read is measured between two reads; since_published is the average since posting; list_order means the source gives no count (Product Hunt). Quote rising_keywords with change_percent only when keywords_baseline is ready; while it is building, give the post counts and say the comparison needs six days of data. Call trending_digest for a niche's daily digest or content ideas, and give its page link. If status is warming, say the first read is running and to ask again in a minute. If no_posts, suggest a longer window or a wider topic. Name any source whose status is failed. Reddit and X are not read: say so from not_read and never invent posts from them. Reddit is not read: its Data API terms need a separate agreement for commercial use. Answers hold titles and links only; do not invent post text, authors or counts. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
