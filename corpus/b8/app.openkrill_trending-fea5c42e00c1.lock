                      "type": ["number", "null"]
                    },
                    "heat": {
                      "description": "0 to 100, rank against the other posts of the same source",
                      "type": "integer"
                    },
                    "niches": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "published_at": {
                      "type": "string"
                    },
                    "rank": {
                      "description": "1-based place across all sources: heat, then the newer post at equal heat",
                      "type": "integer"
                    },
                    "source": {
                      "enum": ["hackernews", "devto", "github", "producthunt", "lobsters", "youtube"],
                      "type": "string"
                    },
                    "source_name": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "unit": {
                      "description": "points, reactions, stars or views; null for Product Hunt, which publishes no count",
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    },
                    "velocity_basis": {
                      "enum": ["since_last_read", "since_published", "list_order"],
                      "type": "string"
                    },
                    "velocity_per_hour": {
                      "description": "Gain in unit per hour",
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["engagement", "heat", "niches", "published_at", "rank", "source", "source_name", "title", "unit", "url", "velocity_basis", "velocity_per_hour"],
                  "type": "object"
