        {
          "name": "trending",
          "title": "Rising posts for a topic",
          "description": "Use this when the user wants what is trending or rising right now, such as \"what is trending in AI today?\" or \"rising posts about postgres this week\". Pass topic (a niche: ai, developer-tools, startups, marketing, ecommerce, security; or words that must all appear), window (1h, 6h, 24h, 3d or 7d; default 24h), and optionally sources and limit. Returns posts from Hacker News, DEV Community, GitHub, Product Hunt, Lobsters and YouTube, each with rank, link, publish time, count, gain per hour and heat, plus rising keywords and the status of each source. rank orders every post by heat, highest first; posts with equal heat (each source's top post has 100) go newer first. GitHub repositories that sell cracked or pre-activated software are dropped. Reddit and X are not read.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {}
            ],
            "properties": {
              "limit": {
                "description": "Most posts returned (default 15)",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "sources": {
                "description": "Read only these sources (default: all)",
                "items": {
                  "enum": ["hackernews", "devto", "github", "producthunt", "lobsters", "youtube"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "topic": {
                "description": "What to look at: a niche (ai, developer-tools, startups, marketing, ecommerce, security) or plain words that must all appear in a post's title or tags, such as \"claude code\" or \"postgres\". Leave it out for everything.",
                "maxLength": 80,
                "type": "string"
              },
              "window": {
                "description": "Posts published in this window (default 24h)",
                "enum": ["1h", "6h", "24h", "3d", "7d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
