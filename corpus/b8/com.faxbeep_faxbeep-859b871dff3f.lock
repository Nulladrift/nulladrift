      },
      "instructions": "Faxbeep gives free public test fax numbers and test email addresses, to check that a fax machine, a fax service or a scan-to-email setup works. Faxbeep only receives: it does not send faxes, and a person with no fax machine can send a test with a fax sending service, for example PayPerFax.\n\nEvery test that Faxbeep receives is public on faxbeep.com for 30 days, with its pages. Tell the person not to send a private document.\n\nUse the tools in this order:\n1. get_test_numbers gives the numbers, the email addresses and the limits.\n2. Just before the person sends the test, call get_test_numbers (or take \"now\" from your last result) and use that \"now\" as since. Do not use your own clock. Then the person sends the test: a fax to a number, or an email with one attachment to an address.\n3. list_test_faxes with that since finds the test. get_test_fax reads one fax again by its slug or its page URL.\n\nRules:\n- Keep since fixed while you poll. Do not move it to the newest received_at: a long fax can appear after a newer, shorter one.\n- A match by time, sender or page count narrows the candidates. It does not prove that a fax is the person's: other people send tests at the same time. Show the person the view_url so they can check the page. In a chat that shows images, also show thumbnail_url as an image in your answer.\n- A new fax usually appears within a minute after the call ends or the email is sent; a few take longer. Wait about 30 seconds between calls, and stop after about 10 minutes.\n\nFor a sample answer, call list_test_faxes with from=FAXBEEP-EXAMPLE, or get_test_fax with fax_example. get_test_fax with fax_example_removed gives the answer for a removed fax. The samples are not real faxes. They have a fixed date in the past, older than 30 days, and they stay available.",
      "tools": [
        {
          "name": "get_test_fax",
          "title": "Get a test fax",
          "description": "Get one test fax by its slug (fax_ and 8 characters from 0-9 and a-f, for example fax_1a2b3c4d) or by the URL of its page on faxbeep.com (view_url, with or without a language prefix such as /de). The result is the fax object, the same as an item of list_test_faxes, and after it an image of page 1 when one can be read. A client can draw that image very small. In a chat that shows images, also show thumbnail_url as an image in your answer. Give view_url for the full page.\n\nA fax that is not found gives an error result: a new fax can take a while to appear, and a fax that is still processing is not found yet. A fax that was removed, by request or after 30 days, gives the error result \"This fax was removed, or it is older than 30 days.\" Its files are deleted, so it cannot be read again.\n\nFor a sample answer, use fax_example (a published sample fax) or fax_example_removed (the answer for a removed fax).",
          "inputSchema": {
            "properties": {
              "fax": {
                "description": "The slug of the fax (for example fax_1a2b3c4d), or the URL of its page on faxbeep.com (view_url).",
                "type": "string"
              }
            },
            "required": ["fax"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a test fax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bade978be621ed14ee7df18dfa40ee7fcfabd546606c1fb3fcee5da9bb319cb5"
        },
        {
          "name": "get_test_numbers",
          "title": "Get the test numbers",
          "description": "Get the Faxbeep test fax numbers, the test email addresses and the limits. Call this first, before the person sends a test.\n\nEach item of \"numbers\" is a test fax number: \"local_format\" is the number to dial inside its country, \"international_format\" from any other country. The person sends a fax to it from a fax machine or a fax service. Each item of \"email_addresses\" takes an email with one PDF, TIFF or JPEG attachment, for a scan-to-email or Internet fax test. \"email_addresses\" is left out while the email test is off.\n\nEvery test that Faxbeep receives is public on faxbeep.com for 30 days. Tell the person not to send a private document. \"limits\" has the limits of the email test: \"email_max_message_bytes\" is the size of the whole email, and email encoding adds about a third, so the attachment can be about three quarters of it. \"troubleshooting_url\" is the docs page with each refusal message of the email test and its fix.\n\n\"now\" is the server time. Use it as \"since\" of list_test_faxes: call this tool, or take \"now\" from your last result, just before the person sends the test. Do not use your own clock.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the test numbers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32bab7cb8ee06dbd32f302e9789ac7c2b2f2a2ba0bbae01581b6ddc4a6eb172f"
        },
        {
          "name": "list_test_faxes",
          "title": "List received test faxes",
          "description": "List the test faxes that Faxbeep received and published, newest first. The list is public and holds the tests of everyone. Each item of \"faxes\" is a fax object: slug, source (\"phone\" or \"email\"), from (the sender, masked as on faxbeep.com, or null), received_at, page_count, file_size, pdf_url, thumbnail_url and view_url (the page of the fax on faxbeep.com). In the result, \"since\" is the start time that was used, and \"now\" is the server time.\n\nThe result holds at most \"limit\" faxes (20 when not given), newest first, with no paging. When \"faxes\" has \"limit\" items, there can be more: narrow the list with from, page_count or a since closer to the test.\n\nSet \"since\" to the \"now\" value that get_test_numbers or list_test_faxes returned just before the person sent the test, and keep it fixed while you poll. Do not use your own clock. Do not move since to the newest received_at: a long fax can appear after a newer, shorter one. Without \"since\", the list covers the last 24 hours.\n\nA match by time, sender or page count narrows the candidates. It does not prove that a fax is the person's, because other people send tests at the same time. Show the person the view_url so they can check the page. In a chat that shows images, also show thumbnail_url as an image in your answer.\n\nAn empty list is a normal answer while a fax is on its way. A new fax usually appears within a minute after the call ends or the email is sent; a few take longer. Wait about 30 seconds between calls, and stop after about 10 minutes. A fax is public for 30 days, then it is removed.\n\nFor a sample answer, set from to FAXBEEP-EXAMPLE: the result is the sample fax fax_example, whatever since says. The sample has a fixed date in the past, older than 30 days, and it stays available.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Only faxes from this sender: the full fax number (for example +15555550123) or station ID of the sending machine, or the sender address of an email test. Not the masked value of a result. The whole value must match; case does not matter.",
                "type": ["string", "null"]
              },
              "limit": {
                "description": "The most faxes to return, from 1 to 100. Default: 20.",
                "maximum": 100,
                "minimum": 1,
                "type": ["integer", "null"]
              },
              "page_count": {
                "description": "Only faxes with this number of pages.",
                "minimum": 1,
                "type": ["integer", "null"]
              },
              "since": {
                "description": "Only faxes received after this time, in ISO 8601 with an offset. Use the \"now\" value of get_test_numbers or of a list_test_faxes result, taken just before the person sends the test, not your own clock. Default: 24 hours ago. A fax older than 30 days is not in the list.",
                "format": "date-time",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
