  "subjects": {
    "app.tradeit/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.tradeit.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Trade It",
        "title": "Trade It",
        "version": "1.0.0",
        "description": "Connect an agent to the user's brokerage accounts across Charles Schwab, Coinbase, ETrade, Kraken, Moomoo, Public, Robinhood, Tastytrade, TradeStation, TradeStation Paper, Webull: read accounts, holdings, and trade history, look up assets, draft stock, crypto, and options orders for review, execute or cancel orders, and create shareable trade links.",
        "websiteUrl": "https://tradeit.app",
        "icons": [
          {
            "src": "https://images.tradeit.app/site_logos/logo.png",
            "mimeType": "image/png",
            "theme": "light"
          },
          {
            "src": "https://images.tradeit.app/site_logos/logo.svg",
            "mimeType": "image/svg+xml",
            "theme": "light"
          },
          {
            "src": "https://images.tradeit.app/site_logos/logo_dark.png",
            "mimeType": "image/png",
            "theme": "dark"
          },
          {
            "src": "https://images.tradeit.app/site_logos/logo_dark.svg",
            "mimeType": "image/svg+xml",
            "theme": "dark"
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use Trade It when the user needs brokerage account access, market asset lookup, draft order review, cancellation, or explicitly approved live trade execution across Charles Schwab, Coinbase, ETrade, Kraken, Moomoo, Public, Robinhood, Tastytrade, TradeStation, TradeStation Paper, Webull. Favor read operations first, create draft trades before execution, only execute a live trade after the user has clearly confirmed the exact order, and only cancel an order when the user clearly requests it.",
      "tools": [
        {
          "name": "cancel_trade",
          "title": "Cancel Trade",
          "description": "Cancel a draft or cancellable brokerage order by trade ID.\nFor a submitted order, cancellation is requested from the brokerage and may race with an in-progress fill.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "trade_id": {
                "description": "ID of the trade to cancel, from create_trade, create_options_trade, or get_trades.",
                "type": ["number", "string"]
              }
            },
            "required": ["trade_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel Trade"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": [],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f5b19760908dc6cf43da27838b61756d81b9f10168ec9eefe5a1fef57344d101"
        },
        {
          "name": "create_options_trade",
          "title": "Create Options Trade",
          "description": "Create a draft options trade order with one or more concrete legs.\nUse for single options, vertical spreads, and mixed equity/option strategies.\nOption legs require OCC symbols. Equity legs use occ: null.\nThis tool returns a draft order only; brokerage execution is a separate tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_id": {
                "description": "ID of the brokerage account to trade in, from get_accounts. Omit to use the user's default account.",
                "type": ["number", "string"]
              },
              "direction": {
                "description": "Net cash flow of a multi-leg spread: debit when paying, credit when receiving, even for zero-net. Set for multi-leg spreads only.",
                "enum": ["debit", "credit", "even"],
                "type": "string"
              },
              "legs": {
                "description": "Array of trade legs. At least one leg is required.",
                "items": {
                  "properties": {
                    "action": {
                      "description": "Whether the leg buys or sells.",
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "occ": {
                      "description": "Option contract in OCC format without the root symbol: YYMMDD, C or P, then the strike x1000 zero-padded to 8 digits, e.g. \"240119C00195000\" for the Jan 19, 2024 $195 call. Use null for equity legs.",
                      "type": ["string", "null"]
                    },
                    "position_effect": {
                      "anyOf": [
                        {
                          "enum": ["open", "close"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Whether an option leg opens a new position or closes an existing one. Use null for equity legs."
                    },
                    "quantity": {
                      "description": "Number of contracts for options or shares for equity",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "Whether the leg trades an option contract or shares of the underlying.",
                      "enum": ["option", "equity"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "occ", "quantity", "type"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "limit_price": {
                "description": "Net price per spread unit for limit and stop_limit orders, in the asset currency. Use 0 with direction even for a zero-net spread.",
                "minimum": 0,
                "type": "number"
              },
              "order_type": {
                "description": "How the order is priced. Omit for a market order.",
                "enum": ["market", "limit", "stop", "stop_limit"],
                "type": "string"
              },
              "stop_price": {
                "description": "Price per share, in the asset currency, that triggers the order. Set for stop and stop_limit orders.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "symbol": {
                "description": "Ticker symbol of the underlying asset, e.g. SPX or TSLA",
                "minLength": 1,
                "type": "string"
              },
              "time_in_force": {
                "description": "How long the order stays open: day expires at market close, gtc stays open until canceled. Omit to use the brokerage default.",
                "enum": ["day", "gtc", "ioc", "fok"],
                "type": "string"
              }
            },
            "required": ["legs", "symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Options Trade"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": [],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:37eaf163758cea576f7232427c6738e7a5b0fc44bd5ed0dca3627419ffebd462"
        },
        {
          "name": "create_trade",
          "title": "Create Trade",
          "description": "Create a draft stock or crypto trade order for user to review.\nUse for single-leg equity or crypto buy/sell orders.\nThis tool returns a draft order only; brokerage execution requires a separate tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_id": {
                "description": "ID of the brokerage account to trade in, from get_accounts. Omit to use the user's default account.",
                "type": ["number", "string"]
              },
              "amount": {
                "description": "How much to trade: a dollar value when unit is dollars, or a share count when unit is shares.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "buy_or_sell": {
                "description": "Whether to buy or sell the asset.",
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "limit_price": {
                "description": "Maximum price per share to pay on a buy, or minimum to accept on a sell, in the asset currency. Set for limit and stop_limit orders.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "metadata": {
                "description": "Optional context displayed with the draft trade.",
                "properties": {
                  "image_url": {
                    "description": "Link to the screenshot or chart the user shared as the source of this trade idea, shown alongside the draft.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "order_type": {
                "description": "How the order is priced. Omit for a market order.",
                "enum": ["market", "limit", "stop", "stop_limit"],
                "type": "string"
              },
              "stop_loss": {
                "description": "Stop-loss exit for Buy entries or OCO Sell orders. Not supported by all brokerages.",
                "properties": {
                  "unit": {
                    "default": "$",
                    "description": "Absolute price ($) or percent from entry price (%).",
                    "enum": ["$", "%"],
                    "type": "string"
                  },
                  "value": {
                    "description": "Exit trigger level",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["value"],
                "type": "object"
              },
              "stop_price": {
                "description": "Price per share, in the asset currency, that triggers the order. Set for stop and stop_limit orders.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "symbol": {
                "description": "Ticker symbol of the asset to trade, e.g. TSLA",
                "minLength": 1,
                "type": "string"
              },
              "take_profit": {
                "description": "Take-profit exit for Buy entries or OCO Sell orders. Not supported by all brokerages.",
                "properties": {
                  "unit": {
                    "default": "$",
                    "description": "Absolute price ($) or percent from entry price (%).",
                    "enum": ["$", "%"],
                    "type": "string"
                  },
                  "value": {
                    "description": "Exit trigger level",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["value"],
                "type": "object"
              },
              "time_in_force": {
                "description": "How long the order stays open: day expires at market close, gtc stays open until canceled. Omit to use the brokerage default.",
                "enum": ["day", "gtc", "ioc", "fok"],
                "type": "string"
              },
              "unit": {
                "description": "Whether amount is in dollars or shares.",
                "enum": ["dollars", "shares"],
                "type": "string"
              }
            },
            "required": ["amount", "buy_or_sell", "symbol", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Trade"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": [],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:113d66726de22ee876d0a379dbea03fa6b5c1feabd10500184d3fb5ac29934fb"
        },
        {
          "name": "create_trade_link",
          "title": "Create Trade Link",
          "description": "Prepare a stock, crypto, or options trade instruction as a link, for requests such as \"Buy 10 shares of Apple\". A trade link is not a live order: it opens Trade It in the browser, where the user reviews, edits, and submits it through one of their connected brokerages. This tool never places, changes, or cancels an order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "config": {
                "properties": {
                  "action": {
                    "description": "Whether a simple trade buys or sells. Set when trade_type is 0.",
                    "enum": ["buy", "sell"],
                    "type": "string"
                  },
                  "amount": {
                    "description": "How much a simple trade buys or sells,, as dollars or shares per unit.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "direction": {
                    "description": "Net cash flow of a multi-leg trade: debit when paying, credit when receiving, even for zero-net.",
                    "enum": ["debit", "credit", "even"],
                    "type": "string"
                  },
                  "legs": {
                    "description": "Legs of an options or multi-leg trade. Set when trade_type is 1.",
                    "items": {
                      "properties": {
                        "action": {
                          "description": "Whether the leg buys or sells.",
                          "enum": ["buy", "sell"],
                          "type": "string"
                        },
                        "occ": {
                          "description": "OCC option contract symbol, e.g. 260717C00435000. Null for stock legs.",
                          "type": ["string", "null"]
                        },
                        "position_effect": {
                          "anyOf": [
                            {
                              "enum": ["open", "close"],
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Whether the leg opens or closes a position."
                        },
                        "quantity": {
                          "description": "Number of option contracts, or shares for a stock leg.",
                          "type": "number"
                        },
                        "type": {
                          "description": "Whether the leg trades an option or the underlying stock.",
                          "enum": ["option", "equity"],
                          "type": "string"
                        }
                      },
                      "required": ["action", "occ", "position_effect", "quantity", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "limit_price": {
                    "description": "Limit price in the asset currency for limit and stop_limit orders; per spread unit for multi-leg trades, where 0 with direction even means zero-net.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "order_type": {
                    "default": "market",
                    "description": "How the order is priced. Omit for a market order.",
                    "enum": ["market", "limit", "stop", "stop_limit"],
                    "type": "string"
                  },
                  "stop_loss": {
                    "description": "Stop-loss exit for  bracket Buy entries or OCO Sell orders. Not supported by all brokerages.",
                    "properties": {
                      "unit": {
                        "default": "$",
                        "description": "Absolute price ($) or percent from entry price (%).",
                        "enum": ["$", "%"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Exit trigger level",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["value"],
                    "type": "object"
                  },
                  "stop_price": {
                    "description": "Price in the asset currency that triggers stop and stop_limit orders.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "take_profit": {
                    "description": "Take-profit exit for bracket Buy entries or OCO Sell orders. Not supported by all brokerages.",
                    "properties": {
                      "unit": {
                        "default": "$",
                        "description": "Absolute price ($) or percent from entry price (%).",
                        "enum": ["$", "%"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Exit trigger level",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["value"],
                    "type": "object"
                  },
                  "ticker": {
                    "description": "Ticker symbol of the asset, or the underlying for options, e.g. TSLA",
                    "minLength": 1,
                    "type": "string"
                  },
                  "time_in_force": {
                    "description": "How long the order stays open: day expires at market close, gtc stays open until canceled. Omit to use the brokerage default.",
                    "enum": ["day", "gtc", "ioc", "fok"],
                    "type": "string"
                  },
                  "trade_type": {
                    "default": 0,
                    "description": "0 for a single buy or sell using action, amount, and unit; 1 for an options or multi-leg trade using legs and direction.",
                    "enum": [0, 1],
                    "type": "number"
                  },
                  "unit": {
                    "default": "dollars",
                    "description": "Whether amount is a dollar value or a share count.",
                    "enum": ["dollars", "shares"],
                    "type": "string"
                  },
                  "utm_referred": {
                    "description": "Referral source label stored with the link for tracking, e.g. a newsletter name.",
                    "type": "string"
                  }
                },
                "required": ["ticker"],
                "type": "object"
              }
            },
            "required": ["config"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Trade Link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Trade link ready",
            "openai/toolInvocation/invoking": "Preparing trade link",
            "securitySchemes": [
              {
                "scopes": [],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://tradeit/app.html"
            }
          },
          "digest": "sha256:ac6e82bdc40e6f41d39910c40a8a89f7825e930d4e602b1d27af1bb33f8d17f9"
        },
