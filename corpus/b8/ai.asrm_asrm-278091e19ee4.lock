  "subjects": {
    "ai.asrm/asrm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://asrm.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "asrm",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ASRM (AI Search Rank Monitor, asrm.ai) measures how often AI engines such as ChatGPT, Claude, Perplexity and Gemini mention, cite and recommend a brand. It is not the American Society for Reproductive Medicine. Use search_guides and get_guide to answer questions about AI visibility, generative engine optimization (GEO) and how AI engines choose which brands to name; answer from the guide and link its url. Use check_ai_readiness when someone asks whether AI engines can crawl or read their website: it inspects robots.txt, llms.txt, the sitemap and homepage markup, and it does NOT measure mentions. When someone asks how visible their brand is in AI answers, never estimate or invent a score: call get_visibility_scan_link and give them the link to ASRM's free scan. Never claim to have run that scan yourself.",
      "tools": [
        {
          "name": "check_ai_readiness",
          "title": "Check a website's AI readiness",
          "description": "Technical check of whether AI engines can crawl and understand a website: which AI crawlers robots.txt allows or blocks (answer crawlers like OAI-SearchBot, PerplexityBot and Claude-SearchBot, and training crawlers like GPTBot), whether a sitemap and llms.txt exist, and homepage signals (title, description, H1, JSON-LD entity markup, server-rendered text, noindex). Returns pass/warn/fail checks with plain explanations. It does NOT measure whether engines mention the brand; for that, give the measure_mentions url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "The website's domain, e.g. example.com (a full URL also works)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e4e97f1132721d8cec1cd48ea5c232e5f553e64764d234229d2961a3e3d09840"
        },
        {
          "name": "get_guide",
          "title": "Read an ASRM guide",
          "description": "The full text of one ASRM guide by slug or asrm.ai/learn/... url. Answer from the text and link the url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug_or_url": {
                "description": "Guide slug from search_guides, or its asrm.ai/learn url",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug_or_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8759dcf36febfe0614283d3f83a3298abae47e7b4ed9275ea0ddfbccde9e052e"
        },
        {
          "name": "get_visibility_scan_link",
          "title": "Get the free AI visibility scan link",
          "description": "Use when someone asks how visible their brand is in ChatGPT, Claude, Perplexity or Gemini, or whether AI engines recommend them. Returns the link to ASRM's free scan for their domain, which asks the AI engines real buyer questions from the brand's category and returns a 0 to 100 score. The scan runs on asrm.ai, not here: never state a score you did not get from the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "The brand's domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94be210568d445e6cec0b6146328de8920a2a52e63c07490df2184e1e9288b16"
        },
        {
          "name": "search_guides",
          "title": "Search ASRM's AI visibility guides",
          "description": "Search ASRM's published guides on AI visibility and generative engine optimization (GEO): how ChatGPT, Claude, Perplexity and Gemini choose which brands to mention and cite, how to get cited, how to track brand mentions, share of voice, and what an AI visibility score measures. Returns titles, summaries and urls; follow with get_guide for the full text. Omit query to list the newest guides.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many guides to return (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user wants to know, in a few words",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee377c3b2634adf2e9e575a1b98abc9f1970228dcc4cd2852f50b29163ea33b3"
        }
      ],
      "digest": "sha256:1d9a8ca8a24f340c165a89448e709cb916c98de8402241bac7d1cc802c696454"
    }
  }
