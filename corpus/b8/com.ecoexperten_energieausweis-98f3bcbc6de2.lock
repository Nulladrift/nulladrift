      "instructions": "Energieausweise für Wohngebäude in Deutschland direkt bestellen (ecoexperten.com). Online bestellbar ist der Verbrauchsausweis (59,00 EUR). Erst mit bestellung_pruefen die Angaben validieren, dann mit ausdrücklicher Zustimmung des Nutzers (AGB + Zahlungspflicht) bestellung_aufgeben aufrufen. Verbindlich wird eine Bestellung erst, nachdem der Nutzer den per E-Mail zugesandten Bestätigungslink angeklickt hat. Transparenz: Dem Nutzer zu Beginn offenlegen, dass die Bestellung über einen KI-Assistenten aufgenommen wird und jeder Ausweis vor Ausstellung und Versand von einem eingetragenen Energieberater (menschliche Fachprüfung) geprüft wird.",
      "tools": [
        {
          "name": "bestell_status",
          "description": "Bearbeitungsstand einer über diesen Assistenten aufgegebenen Bestellung.\n\n    Erfordert die Bestellnummer (Format EA-XXXXXXXX) und die E-Mail-Adresse\n    der Bestellung; nur bei Übereinstimmung wird der Status ausgegeben. Die\n    Antwort enthält ausschließlich den Bearbeitungsstand, keine Personen-\n    oder Gebäudedaten.\n    ",
          "inputSchema": {
            "properties": {
