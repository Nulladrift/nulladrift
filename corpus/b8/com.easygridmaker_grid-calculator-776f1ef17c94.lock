{
  "lockfileVersion": 2,
  "subjects": {
    "com.easygridmaker/grid-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://easygridmaker.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.easygridmaker/grid-calculator",
        "title": "Easy Grid Maker — Drawing Grid & Aspect Ratio Calculator",
        "version": "1.0.0",
        "websiteUrl": "https://easygridmaker.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use calculate_drawing_grid to compute exact grid rows, columns, pixel/physical square sizes, scaling ratios, and margins/crop for transferring a reference photo to paper or canvas, or calculate_aspect_ratio_grid to find the best distortion-free square grids for standard paper sizes (A4, A3, Letter, etc.).",
      "tools": [
        {
          "name": "calculate_aspect_ratio_grid",
          "title": "Find optimal distortion-free square grids for standard paper sizes",
          "description": "Evaluate standard paper or canvas sizes (A4, A3, A5, Letter, Legal, Tabloid, 8x10in, 9x12in, 11x14in, 16x20in, or custom) and return ranked distortion-free square-grid configurations with physical square sizes, margins, and aspect-ratio fit metrics.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customHeight": {
                "description": "Custom paper/canvas height in unit. Required when paperSize is 'custom'.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "customWidth": {
                "description": "Custom paper/canvas width in unit. Required when paperSize is 'custom'.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "imageHeightPx": {
                "description": "Optional reference image height in pixels (provide together with imageWidthPx).",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "imageWidthPx": {
                "description": "Optional reference image width in pixels to match aspect ratio and compute fitted drawing area on the sheet.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "margin": {
                "description": "Optional uniform margin on each of the four sides in unit. Defaults to 1 cm (10 mm) for metric units or 0.5 in for inches.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "maxColumns": {
                "default": 16,
                "description": "Optional maximum column count to evaluate (2 to 50, >= minColumns). Defaults to 16.",
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              },
              "minColumns": {
                "default": 4,
                "description": "Optional minimum column count to evaluate (2 to 50). Defaults to 4.",
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              },
              "orientation": {
                "default": "auto",
                "description": "Sheet orientation: 'portrait', 'landscape', or 'auto' (matches image orientation when imageWidthPx/imageHeightPx are provided, otherwise portrait).",
                "enum": ["portrait", "landscape", "auto"],
                "type": "string"
              },
              "paperSize": {
                "default": "A4",
                "description": "Standard paper or canvas preset ('A4', 'A3', 'A5', 'Letter', 'Legal', 'Tabloid', '8x10in', '9x12in', '11x14in', '16x20in') or 'custom'. Defaults to 'A4'.",
                "enum": ["A4", "A3", "A5", "Letter", "Legal", "Tabloid", "8x10in", "9x12in", "11x14in", "16x20in", "custom"],
                "type": "string"
              },
              "unit": {
                "description": "Physical unit ('cm', 'mm', or 'in') for output and custom/margin inputs. Defaults to 'cm' for ISO/custom sizes and 'in' for US presets.",
                "enum": ["cm", "mm", "in"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edab1b0c4f3cf68fb242e72e85967773b95b61b1c64a0b3c703962caf4ddcdb5"
        },
        {
          "name": "calculate_drawing_grid",
          "title": "Calculate drawing grid dimensions for photo-to-canvas transfer",
          "description": "Compute exact grid columns, rows, per-square pixel size, physical square size on drawing paper or canvas (cm, mm, or in), scaling ratio, usable drawing area, unused/crop margins, and even-row column suggestions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cellSize": {
                "description": "Optional desired physical side length of each square on the target surface in surfaceUnit (e.g. 2 for 2 cm squares). Mutually exclusive with columns.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "columns": {
                "description": "Optional number of grid columns across the drawn width (1 to 100). Mutually exclusive with cellSize; defaults to 8 when neither is given.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "fitMode": {
                "default": "contain",
                "description": "'contain' fits the entire reference image inside the surface with unused margin; 'cover' fills the entire surface and reports image crop margin. Defaults to 'contain'.",
                "enum": ["contain", "cover"],
                "type": "string"
              },
              "imageHeightPx": {
                "description": "Reference image height in pixels, e.g. 1800.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "imageWidthPx": {
                "description": "Reference image width in pixels, e.g. 2400.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "surfaceHeight": {
                "description": "Target drawing paper or canvas height in surfaceUnit, e.g. 21 (cm) or 14 (in).",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "surfaceUnit": {
                "default": "cm",
                "description": "Physical unit for surfaceWidth, surfaceHeight, and cellSize ('cm', 'mm', or 'in'). Defaults to 'cm'.",
                "enum": ["cm", "mm", "in"],
                "type": "string"
              },
              "surfaceWidth": {
                "description": "Target drawing paper or canvas width in surfaceUnit, e.g. 29.7 (cm) or 11 (in).",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["imageHeightPx", "imageWidthPx", "surfaceHeight", "surfaceWidth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:686baf4d9559ce2fd79f1305754ab1bb5118edf81d95c999e3d8ea8f771bd8d5"
        }
      ],
      "digest": "sha256:0ebd5d601ef2a97a05624a2d5610861535c6e5218b53de503175ac816a00b53e"
    }
  }
}
