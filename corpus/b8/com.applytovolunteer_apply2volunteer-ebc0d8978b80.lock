        {
          "name": "create_form",
          "title": "Create a blank draft form",
          "description": "Create a blank draft form in the authenticated organization. Requires an org API key or OAuth sign-in with the forms:write scope. Same blank form as POST /api/v1/forms when no conversion, report, or preview is sent: title Volunteer application unless title is set, with First name and Email. Optional template volunteer-application-form or volunteer-interest-form seeds that template's fields instead, using the on-server parser. Workers AI stays off. An unknown template is an error and does not create a form. Title is at most 200 characters. MCP, an org API key, and OAuth share a limit of 60 creates per organization per hour. A website session is not counted. Returns formId and editorUrl (/app/forms/{formId}). Does not publish the form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "template": {
                "description": "Optional. volunteer-application-form or volunteer-interest-form. Seeds the draft with that template instead of First name and Email.",
                "enum": ["volunteer-application-form", "volunteer-interest-form"],
                "type": "string"
              },
              "title": {
                "description": "Optional title, at most 200 characters. Omitted uses Volunteer application, or the template title when template is set. Empty uses Volunteer application.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added": {
                "description": "Fields inserted by this call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "$ref": "#/properties/fields/items/properties/id"
                    },
                    "key": {
                      "$ref": "#/properties/fields/items/properties/key"
                    },
                    "label": {
                      "$ref": "#/properties/fields/items/properties/label"
                    },
                    "order": {
                      "$ref": "#/properties/fields/items/properties/order"
                    },
                    "required": {
                      "$ref": "#/properties/fields/items/properties/required"
                    },
                    "stageId": {
                      "type": ["string", "null"]
                    },
                    "type": {
