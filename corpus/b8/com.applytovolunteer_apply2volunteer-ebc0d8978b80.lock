        {
          "name": "discard_form",
          "title": "Discard an open draft",
          "description": "Discard the open draft of a form that belongs to the authenticated organization. Requires an org API key or OAuth sign-in with the forms:write scope. Same checks as POST /api/v1/forms/{id}/discard. An open draft is an unpublished version newer than the published snapshot. This deletes that draft and clears drafted public settings. The published form stays. Returns { ok: true }. A form with no open draft returns 404 { error: \"not found\", message: \"No open draft to discard.\" }. That includes a form that was never published and a published form with nothing left to discard. If the form changed since this discard was read, it writes nothing and returns 409 'This form changed. Reload and try again.' This does not delete the form. A form that belongs to another organization is not found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formId": {
                "description": "Form id in the authenticated organization.",
                "type": "string"
              }
            },
            "required": ["formId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ok": {
                "const": true,
                "description": "The open draft was discarded. The published form stays.",
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Discard an open draft"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:64f853b38df026b3ab02340bcbe8f276a3a2ce833396df82df98a3f52248447b"
        },
        {
          "name": "fetch",
          "title": "Fetch a document",
          "description": "Read one document by the id search returned. No API key. The result has id, title, text, url, and metadata. Template metadata includes trialUrl from the template sign-up link. An org API key or OAuth token with forms:read can read form:<id> for a live published form in that organization. The text lists field labels and types. url is the public form URL, and metadata includes the same share links as get_form. A draft, an archived form, a deleted form, an unknown id, and a form in another organization are not found. The result leaves out applicant data. Workers AI stays off. Anonymous search and fetch share 30 reads per network per hour and a daily cap that defaults to 300.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Id from a search hit. Public ids start with doc: or template:. Organization form ids start with form:.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
