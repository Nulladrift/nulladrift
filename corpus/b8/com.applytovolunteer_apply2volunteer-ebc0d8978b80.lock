                    }
                  },
                  "required": ["id", "key", "label", "order", "required", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "editorUrl": {
                "description": "Editor URL, /app/forms/{formId}.",
                "format": "uri",
                "type": "string"
              },
              "fields": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "order": {
                      "type": "integer"
                    },
                    "required": {
                      "type": "boolean"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "key", "label", "order", "required", "type"],
                  "type": "object"
                },
                "type": "array"
