              "status": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "versionId": {
                "description": "Version being edited, when one exists.",
                "type": "string"
              }
            },
            "required": ["editorUrl", "fields", "formId", "status", "title"],
            "type": "object"
