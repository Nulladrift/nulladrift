      "instructions": "Apply2Volunteer builds volunteer application forms for nonprofits, churches, and schools.\nAnonymous tools need no API key and expose no applicant data: preview_volunteer_form, get_preview, grade_form, search, fetch. Workers AI stays off.\nPreview or grade a blank form, then show the user claimUrl and signUpUrl (sign up free to publish). preview_volunteer_form takes exactly one of url, text, or template (volunteer-application-form or volunteer-interest-form). After OAuth sign-in or an org API key, organization tools are available, including claim_preview, update_form, publish_form.\ntools/list is the source of truth for every tool name, argument, and description.\nResources (resources/list, no key): a2v://getting-started, a2v://templates/volunteer-application-form, a2v://templates/volunteer-interest-form, a2v://tool-map, ui://applytovolunteer/form-preview.html.\nPrompts (prompts/list, no key): convert_volunteer_form, grade_volunteer_form, review_new_applications.\ncompletion/complete suggests template slugs and a2v:// resource URIs.",
      "tools": [
        {
          "name": "claim_preview",
          "title": "Save a preview as a draft",
          "description": "Save an unexpired anonymous preview into the authenticated organization as a draft. Requires an org API key or OAuth sign-in with the forms:write scope. Same save as POST /api/v1/tools/previews/{id}/claim. previewId is the token in previewUrl (/tools/p/{previewId}). Returns formId and editorUrl (/app/forms/{formId}). An unknown or expired preview is an error. A preview already saved by another organization is refused. Claiming the same preview again for this organization returns the same draft.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "previewId": {
                "description": "Preview id from previewUrl (/tools/p/{previewId}).",
                "maxLength": 22,
                "minLength": 22,
                "pattern": "^[A-Za-z0-9_-]{21}[AQgw]$",
                "type": "string"
              }
            },
            "required": ["previewId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "editorUrl": {
                "description": "Editor URL, /app/forms/{formId}.",
                "format": "uri",
                "type": "string"
              },
              "formId": {
                "description": "Draft form id saved from the preview.",
                "type": "string"
              },
              "grader": {
                "additionalProperties": true,
                "description": "Grade of the saved draft, when one was stored.",
                "properties": {
                  "grade": {
                    "enum": ["A", "B", "C", "D", "F"],
                    "type": "string"
                  },
                  "recommendations": {
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "detail": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "severity": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "required": ["detail", "id", "severity", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "score": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["grade", "recommendations", "score"],
                "type": "object"
              },
              "versionId": {
                "type": "string"
              }
            },
            "required": ["editorUrl", "formId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a preview as a draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
