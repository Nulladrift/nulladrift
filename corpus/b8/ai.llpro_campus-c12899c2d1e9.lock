        {
          "name": "dispute_record",
          "title": "When two parties to one deal disagree, record both signed positions and what they agree on and contest. Records; never rules",
          "description": "Neutral record when two parties to one deal disagree. Send the Transaction Audit bundle of the deal (parties and signed events) and two positions, one signed by each party's key from that bundle: dispute_id, party_id, public_key, bundle_hash (SHA-256 of the canonical bundle, as Transaction Audit returns it), filed_at, claim text, optional facts {name: value} and optional events {event hash: agree|contest}. Get back recorded or invalid, every check, what both agree on, what is contested, what only one states, and a record signed by LLPRO with the time we saw it, checkable offline. It records; it never rules or awards. Nothing is kept (the A2A door keeps a result for 7 days). Free.",
          "inputSchema": {
            "properties": {
              "bundle": {
                "description": "the Transaction Audit bundle exactly as audited: {parties, events}",
                "type": "object"
              },
              "positions": {
                "items": {
                  "properties": {
                    "bundle_hash": {
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "claim": {
                      "description": "the party's own words; recorded, never judged",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "dispute_id": {
                      "description": "a name both parties use for this dispute",
                      "maxLength": 128,
                      "type": "string"
                    },
                    "events": {
                      "additionalProperties": {
                        "enum": ["agree", "contest"],
                        "type": "string"
                      },
                      "maxProperties": 40,
                      "type": "object"
                    },
                    "facts": {
                      "additionalProperties": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxProperties": 24,
                      "type": "object"
                    },
                    "filed_at": {
                      "description": "UTC time like 2026-11-13T09:00:00Z",
                      "type": "string"
                    },
                    "party_id": {
                      "description": "this party's id in the bundle",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "public_key": {
                      "description": "this party's Ed25519 public key, the same as in the bundle",
                      "type": "string"
                    },
                    "sig": {
                      "description": "Ed25519 signature over the canonical JSON of the position without sig",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["dispute-position"],
                      "type": "string"
                    },
                    "v": {
                      "enum": [1],
                      "type": "integer"
                    }
                  },
                  "required": ["bundle_hash", "claim", "dispute_id", "filed_at", "party_id", "public_key", "sig", "type", "v"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["bundle", "positions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When two parties to one deal disagree, record both signed positions and what they agree on and contest. Records; never rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
