        {
          "name": "aca_fte_count",
          "title": "ACA Full-Time and FTE Count (ALE Test)",
          "description": "Count full-time employees and full-time equivalents month by month the way the Affordable Care Act employer rules do, and test whether the employer is an applicable large employer (ALE) for the next year. Send the calendar year measured and, for each month, every employee's hours of service as a list of numbers (no names), plus optional extra full-time employees and capped part-time hours for staff you count yourself. Get back per month the full-time count (130 or more hours), the FTEs (non-full-time hours, at most 120 per person, divided by 120) and the total; with all 12 months, the yearly average, the average rounded down, whether it reaches 50, and a flag when 1 to 4 months were above 50 so the seasonal worker exception should be checked. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/aca-fte-count). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "label": {
                "description": "Optional label, e.g. 'group A 2026' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "months": {
                "description": "One entry per calendar month (1 to 12 entries, each month once). Send all 12 for the ALE test.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "extra_full_time": {
                      "default": 0,
                      "description": "Optional: more full-time employees (130+ hours in the month) not listed in hours.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "extra_part_time_hours": {
                      "default": 0,
                      "description": "Optional: total hours of other employees under 130 hours in the month, each already capped at 120, not listed in hours.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "hours": {
                      "description": "Hours of service of each employee for the month (up to 200 numbers, up to 2 decimals each, no names). Every employee of the employer and its related companies counts.",
                      "items": {
                        "description": "One employee's hours of service in the month.",
                        "maximum": 744,
                        "minimum": 0,
                        "type": ["number", "string"]
                      },
                      "maxItems": 200,
                      "minItems": 0,
                      "type": "array"
                    },
                    "month": {
                      "description": "Month number, 1 = January.",
                      "maximum": 12,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["month"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "round_fte_to_hundredth": {
                "default": false,
                "description": "Round each month's FTEs to the nearest hundredth, as 26 CFR 54.4980H-2(c)(2) allows (default false: fractions kept exact).",
                "type": "boolean"
              },
              "year": {
                "description": "The calendar year whose months you send. The ALE answer is for the following year.",
                "maximum": 2099,
                "minimum": 2015,
                "type": "integer"
              }
            },
            "required": ["months", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ACA Full-Time and FTE Count (ALE Test)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17477dbec61adf829f731de9017de9ac6098507273980e72d6670d83efe5efe8"
        },
        {
          "name": "account_name_dedupe",
          "title": "Company Account Name Duplicate Check",
          "description": "Find company accounts in a CRM list that are likely the same business entered twice. Send the company names (with your account codes if you like). Names are compared after removing legal-form endings (Inc, Incorporated, Corp, Co, LLC, Ltd, LLP, PLC, GmbH, S.A. and others listed in the rule), accents, punctuation, spaces, case, a leading 'The' and '&' versus 'and'. Get back the groups of accounts whose names match, each member's legal form, and a flag where the legal forms differ (Acme Inc and Acme LLC may be two companies). Company names only: a name that starts with a personal title (Mr, Dr ...) and has no legal ending is refused; other personal names cannot all be detected, so send company accounts only. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/account-name-dedupe). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accounts": {
                "description": "Company accounts (2 to 200).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "Optional: your account or record code, echoed back.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "name": {
                      "description": "Company name as stored, e.g. 'Acme, Inc.'. Not a person's name. A name with a web-address ending (Example.com) is refused: send it without the ending.",
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 2,
                "type": "array"
              },
              "label": {
                "description": "Optional label for the list (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["accounts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company Account Name Duplicate Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:915cc0ce7934789c5731dbfc1f7f9b268e431f2f38d8afb0104c4f4b4fc3a67f"
        },
        {
          "name": "accrual_cutoff",
          "title": "Accrual and Cutoff by Service Period",
          "description": "Split invoices across a period end by their service dates for the month-end or year-end close. Send the last day of the period being closed (and optionally its first day), whether the invoices are expenses (supplier bills) or revenue (your own invoices), and each invoice's service start, service end and amount, with the invoice date if you have it. Get back, per invoice and in total, the days and the amount that belong before the period, in the period and after the period end (straight line by days), and, when the invoice date is given, the cutoff entry: an accrual for service up to the period end that is invoiced after it, or a prepaid / deferred amount for service after the period end that was invoiced by it. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/accrual-cutoff). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "invoices": {
                "description": "Invoices (up to 200).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Invoice amount for the service (before tax); a credit note as a negative amount. Not 0.",
                      "maximum": 1000000000,
                      "minimum": -1000000000,
                      "type": ["number", "string"]
                    },
                    "invoice_date": {
                      "description": "Optional invoice date, YYYY-MM-DD; with it the cutoff entry is worked.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "ref": {
                      "description": "Optional reference (an invoice number or supplier code, up to 6 digits in a row; your own text, echoed).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "service_end": {
                      "description": "Last day of the service the invoice covers (same day or later), YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "service_start": {
                      "description": "First day of the service the invoice covers, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "service_end", "service_start"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "period_end": {
                "description": "Last day of the period being closed, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "period_start": {
                "description": "Optional first day of the period being closed; with it, service before the period is shown on its own.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "side": {
                "default": "expense",
                "description": "expense (supplier bills: accrued expense / prepaid expense) or revenue (your invoices: accrued revenue / deferred revenue). Changes only the wording.",
                "enum": ["expense", "revenue"],
                "type": "string"
              }
            },
            "required": ["invoices", "period_end"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Accrual and Cutoff by Service Period"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e213ed9b5f28307e582a61f5f31219b77042f248c488eded6b6edfed3b2b81a"
        },
        {
          "name": "agency_side_certificate_request",
          "title": "Draft an ACORD 25 field sheet and checklist from a certificate request",
          "description": "For licensed insurance agency staff and the agents that help them: turn one certificate-of-insurance request into a DRAFT field sheet in ACORD 25 order plus a checklist. You send the insured, the certificate holder, the state, and each policy (type, policy number, insurer, NAIC code, dates, limits, and any limits the holder requires). Get back the draft, what is missing, what does not add up (dates, aggregates, shortfalls against required limits, claims-made without a retroactive date), what the holder asked for (additional insured, waiver of subrogation, primary and non-contributory, notice of cancellation) that a certificate cannot create by itself, official sources with dates, and a signed record. Set check_sources true to also read three Florida Senate statute pages and report whether they still match what was recorded. Free. No model, nothing stored. It does NOT issue, sign or send a certificate, never says one is ready to issue, and is not insurance, legal or licensed advice: a licensed person checks the draft against the policies and signs. Do not send personal data beyond business names. Docs: https://llpro.ai/agency-side-certificate-request",
