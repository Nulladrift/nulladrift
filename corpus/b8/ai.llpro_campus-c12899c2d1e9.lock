        {
          "name": "can_spam_footer_check",
          "title": "CAN-SPAM Footer Check",
          "description": "Check, before sending, whether a commercial email's text carries the elements the U.S. CAN-SPAM Act (15 U.S.C. 7704(a)(3) and (a)(5)) and the FTC's CAN-SPAM Rule (16 CFR 316) require: a notice of how to opt out with a way to do it (link, email address or reply), a U.S. postal address (street address, P.O. box or private mailbox), and an identification as an advertisement unless the recipients gave prior affirmative consent; and, for sexually oriented messages, the 'SEXUALLY-EXPLICIT: ' subject start of 16 CFR 316.4. Send the email text (plain text or HTML) and optionally the subject. Get back each element found or missing, the words or address that matched, and what to check by eye. A text check, not legal advice. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/can-spam-footer-check). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "primary_purpose": {
                "default": "commercial",
                "description": "Your reading of the message's primary purpose (16 CFR 316.3): 'commercial' (default) or 'transactional_or_relationship' (order confirmations, account notices and the other kinds the rule lists).",
                "enum": ["commercial", "transactional_or_relationship"],
                "type": "string"
              },
              "prior_affirmative_consent": {
                "default": false,
                "description": "True if every recipient gave prior affirmative consent to get this message: then the advertisement label (7704(a)(5)(B)) and the 316.4 rules are not required.",
                "type": "boolean"
              },
              "sexually_oriented": {
                "default": false,
                "description": "True if the message includes sexually oriented material (16 CFR 316.4).",
                "type": "boolean"
              },
              "subject": {
                "description": "Optional subject line. Searched for an ad label such as 'Ad:' and required when sexually_oriented is true.",
                "maxLength": 300,
                "type": "string"
              },
              "text": {
                "description": "The email's text or HTML (the whole message or its footer), up to 15,000 characters. Read only to find the elements; never stored; only the matched address and phrases are echoed.",
                "maxLength": 15000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
