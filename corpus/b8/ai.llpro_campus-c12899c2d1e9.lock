                      "type": "string"
                    },
                    "outcome": {
                      "description": "won = decided in the merchant's favour; lost = decided against; withdrawn = dropped by either side; open = not yet decided.",
                      "enum": ["won", "lost", "withdrawn", "open"],
                      "type": "string"
                    },
                    "reason_code": {
                      "description": "As the network prints it: 10.4, 13.1, 4837, 4853, F29, C08 ... No card numbers.",
