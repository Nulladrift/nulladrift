                    "enum": ["pass"],
                    "type": "string"
                  }
                },
                "required": ["log_sha256", "name", "result"],
                "type": "object"
              },
              "fingerprint": {
                "description": "sha256 of the release artifact or config, 64 hex characters (a 'sha256:' prefix is fine).",
                "pattern": "^\\s*(sha256:)?[0-9a-fA-F]{64}\\s*$",
