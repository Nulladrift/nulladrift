                "enum": ["annual", "monthly", "semimonthly", "biweekly", "weekly", "hourly"],
                "type": "string"
              },
              "hours_per_week": {
                "description": "Hours the pay is meant to cover each week (default 40). Annual hours = hours_per_week x 52. Send this or annual_hours, not both.",
                "maximum": 168,
                "minimum": 1,
