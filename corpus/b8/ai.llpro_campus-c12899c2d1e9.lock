        {
          "name": "meeting_cost",
          "title": "Meeting Cost",
          "description": "Work out what a meeting costs in pay. Send the attendees as rate rows (an hourly rate, or a yearly salary that is turned into an hourly rate, with how many people are paid that rate and an optional role word), the length in minutes, and how often it is held (once, every weekday, weekly, every 2 weeks, monthly). Optional: a loaded-cost multiplier for benefits, payroll taxes and overhead (1.3 = 30% on top), the hours in a work year used to turn salaries into hourly rates (2,080 by default), and a number of meetings to price as a series. Get back the cost per meeting, the cost per year for a recurring meeting, the cost of the series, the person-hours, and the hourly rate used for each row. Send no names: roles or nothing. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/meeting-cost). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attendees": {
                "description": "Rate rows (up to 100). One row per pay rate; people on the same rate can share a row through count.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "default": 1,
                      "description": "People paid this rate who attend (default 1).",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "rate": {
                      "description": "Pay rate in your currency: per hour, or per year when rate_per is year.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "rate_per": {
                      "default": "hour",
                      "description": "hour (default) or year (a yearly salary, divided by hours_per_year).",
                      "enum": ["hour", "year"],
                      "type": "string"
                    },
                    "role": {
                      "description": "Optional role word for the row (for example 'engineer'); not a person's name.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["rate"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "cost_multiplier": {
                "description": "Optional loaded-cost multiplier on pay for benefits, payroll taxes and overhead (1 = pay only, the default; 1.3 = 30% on top).",
                "maximum": 5,
                "minimum": 1,
                "type": ["number", "string"]
              },
              "frequency": {
                "default": "once",
                "description": "How often it is held: once (default), daily_weekdays (260 a year), weekly (52), every_2_weeks (26), monthly (12).",
                "enum": ["once", "daily_weekdays", "weekly", "every_2_weeks", "monthly"],
                "type": "string"
              },
              "hours_per_year": {
                "default": 2080,
