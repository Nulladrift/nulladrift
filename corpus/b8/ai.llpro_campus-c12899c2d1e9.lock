        {
          "name": "card_dispute_outcome_table_win",
          "title": "Build a card dispute outcome table: win rate and days to close by reason code, with sources and a signed record",
          "description": "Card dispute outcome table. Send one row per card dispute case you handled: network (visa, mastercard, amex, discover, other), reason code, outcome (won, lost, withdrawn, open), days to close, and optionally your own merchant label. Get back win rate (won out of decided cases, with a 95 percent interval) and days to close (median, 90th percentile, mean) by network reason code, by reason-code family across networks and by merchant label, the meaning of each Visa, Mastercard and American Express code, a flag for groups with too few cases, and the federal clocks (Regulation E 1005.11, Regulation Z 1026.13) with the date each rule was last amended. Set check_sources true to ask the eCFR whether either rule was amended since. Free. No model, nothing stored, signed record. Up to 500 rows. This version has no pooled data: the table is built from your rows only. Use merchant labels, never card numbers, names or emails. Not legal, banking or compliance advice.",
          "inputSchema": {
