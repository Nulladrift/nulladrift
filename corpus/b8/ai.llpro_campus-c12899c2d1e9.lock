                "maxLength": 80,
                "type": "string"
              },
              "contract_rates": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "CPT or HCPCS code (5 characters).",
                      "pattern": "^[A-Za-z0-9]{5}$",
                      "type": "string"
