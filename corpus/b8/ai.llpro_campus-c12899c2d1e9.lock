        {
          "name": "csv_check",
          "title": "CSV File Check",
          "description": "Look at a CSV file before importing it. Send the CSV as text (up to 20,000 characters) or as base64 of the file's bytes (up to about 19,000 bytes, so the encoding can be checked too), optionally the delimiter (default: detect it) and up to 3 key columns. Get back the delimiter used (and whether another fits as well), the encoding (UTF-8, UTF-16, or not UTF-8 with the first bad byte), byte-order mark, line endings, the header (empty, duplicate and padded names), the row count, ragged rows (wrong number of fields) and blank rows by line, blank and duplicate key values by line, and a guessed type for each column (integer, decimal, date, boolean, text; mixed columns and zero-padded codes said plainly). Data cell values are never echoed back; column names are. It finds what breaks an import; it does not check the data against your schema. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/csv-check). Not legal, tax or financial advice.",
