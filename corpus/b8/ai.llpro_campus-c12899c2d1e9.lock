                "minimum": 1,
                "type": ["number", "string"]
              },
              "workweek_starts": {
                "default": "sunday",
                "description": "First day of your fixed 7-day workweek, starting at midnight (default sunday).",
                "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                "type": "string"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
