      "serverInfo": {
        "name": "llpro-campus",
        "title": "LLPRO",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Front door: any job in plain words -> route_ask (it picks the right tool and returns a job id). Stops before you hand work over: check a piece of work and get a signed stamp -> countersign_stamp; a person must look at something -> human_check_ask; before you rely on another agent or server -> agentrecord_lookup or record_test. Known jobs: a public fact (weather, earthquakes, air quality, river levels) -> ground_truth_ask; read a web page -> page_to_text; is a website ready for agents -> agent_ready_check; to browse every tool -> find_tool, then use_tool. Free, no sign-up. Free agent key, no sign-up, no email: POST https://llpro.ai/agents/key (or call the tool agent_key), then send the header X-Agent-Key on your calls: you count as a named agent, get double the free daily limit and a public Agent Record. This is the short list; every tool (about 306): /mcp/all. Focused lists: /mcp/trust, /mcp/records, /mcp/finance, /mcp/hub, /mcp/legal, /mcp/tools.",
      "tools": [
        {
          "name": "agent_ready_check",
          "title": "Check whether a website is ready for agents",
          "description": "Use when the user asks whether a website works with AI agents or what it is missing: checks llms.txt, an agent card and an MCP server card and lists what to add. Free. Example: {\"domain\": \"example.com\"}. Docs: https://llpro.ai/agent-ready-check",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain name to check, e.g. example.com (a full URL is accepted; only the host name is used).",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether a website is ready for agents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb25243b51bd3ebf75a86210e34f3459941033b8672cddf53ce9de1b63c3d2df"
        },
        {
          "name": "agentrecord_lookup",
          "title": "Look up an agent or tool",
          "description": "Use before you rely on another agent or MCP server: shows whether it answers, how fast, and its signed delivery record. Free. Example: {\"target\": \"https://llpro.ai/mcp\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "target": {
                "description": "Endpoint URL, registry name (e.g. ai.llpro.countersign/countersign) or agent id",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an agent or tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:383b2f66c4110eb72ed7806e7f3d4d15b951e777ad038b134f5f9aa7dc2f7ffd"
        },
        {
          "name": "ask_campus",
          "title": "Ask LLPRO a question",
          "description": "Use only for questions about LLPRO itself: its tools, prices, privacy, refunds or how to connect. Answers quote LLPRO's own pages. Example: {\"question\": \"Is Ground Truth free?\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Optional: your agent id; the daily limit counts per agent id.",
                "maxLength": 80,
                "type": "string"
              },
              "question": {
                "description": "Your question in plain words, under 400 characters.",
                "maxLength": 400,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask LLPRO a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cf71e18dce7ab14e5c7e1cee2bd2c32820298d28ca8fda26df10616970b7462"
        },
        {
          "name": "business_days",
          "title": "Business Days Calculator (US Holidays)",
          "description": "Use for deadlines and due dates: counts US business days between two dates, or adds business days to a date, skipping weekends and federal holidays. Free. Example: {\"start\": \"2026-11-20\", \"end\": \"2026-12-01\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_business_days": {
                "description": "To step: how many business days after start (negative: before start), not counting start itself. 1 = the next business day. Not 0.",
                "maximum": 3000,
                "minimum": -3000,
                "type": "integer"
              },
              "end": {
                "description": "To count: the end date, YYYY-MM-DD, on or after start. Send end or add_business_days, not both.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "holidays": {
                "default": "federal_offices",
                "description": "federal_offices (default): 5 U.S.C. 6103 holidays, Saturday ones on the Friday before and Sunday ones on the Monday after. federal_reserve_banks: the same holidays, Sunday ones on Monday, Saturday ones not moved.",
                "enum": ["federal_offices", "federal_reserve_banks"],
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'notice period' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "start": {
                "description": "Start date, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business Days Calculator (US Holidays)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:292ffdc15f3e07578526568a0fbec5a265f169dd89fa4b6684b911c6aaa3d0a0"
        },
        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Use before you hand over an invoice, purchase order, report, calculation, summary or filing draft you are not fully sure of: separate code re-checks the math (lines, discount, shipping, tax, Total) and returns a signed pass, fail or inconclusive stamp you can attach, saying exactly what is wrong. Free daily limit. Example: {\"output\": \"12 invoices at $40 each: 12 * 40 = 480\", \"producer\": {\"agent_id\": \"my-agent\"}, \"kind\": \"calculation\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "context": {
                "description": "Optional, self-declared and shown on the stamp as such (never changes the verdict): within_scope (true/false), approval_required (true/false), approved_by (who approved), model_version.",
                "properties": {
                  "approval_required": {
                    "type": "boolean"
                  },
                  "approved_by": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "model_version": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "within_scope": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
              },
              "output": {
                "description": "The work to check, as text (max 100000 chars). Equations written as '12 * 4 = 48' are re-computed.",
                "type": "string"
              },
              "private": {
                "description": "Default true: the public log shows only a salted hash of each finding's detail (only you get the salt, so you can reveal a finding to an auditor) (your producer agent_id and the pass/fail counts stay visible) and you still get the full detail. Send false to publish the findings in the public log.",
                "type": "boolean"
              },
              "producer": {
                "description": "Who made the work: {agent_id, model}. Required; used for the independence rule.",
                "properties": {
                  "agent_id": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  }
                },
                "required": ["agent_id"],
                "type": "object"
              },
              "sources": {
                "description": "Optional cited sources: {url, quote?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["output", "producer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check work and get a signed stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca603903c3b73bc5cd7cf8ce934b39e440a9ae5bd3dc7e0ba018aa04bf1995b2"
        },
        {
          "name": "domain_health_check",
          "title": "Check a domain's mail and DNS health (MX, SPF, DKIM, DMARC, certificate)",
          "description": "Use when the user's email lands in spam or bounces, or they ask about a domain's DNS: checks MX, SPF, DKIM, DMARC, certificate expiry and blocklists, each pass or fail with the fix. Free. Example: {\"domain\": \"example.com\"}. Docs: https://llpro.ai/domain-health-check",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dkim_selectors": {
                "description": "Optional DKIM selector names you use (the part before ._domainkey). We also try 12 common ones.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "domain": {
                "description": "A domain name such as example.com. Not a URL, address or email.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain's mail and DNS health (MX, SPF, DKIM, DMARC, certificate)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:267d90e2e744101f67c5e72dc12c21a8ddca8872ed8c45a828d4b50bf9067cd6"
        },
        {
          "name": "find_tool",
          "title": "Find the right LLPRO tool for a job",
          "description": "Search all LLPRO tools (nearly 300: facts, web pages, documents, finance, compliance, trust and records) by what you want done, in plain words. Returns up to 10 matching tools: name, what it does, its input fields and an example call. Free, no sign-up, nothing stored. Example: {\"query\": \"check a vendor invoice for duplicates\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many tools to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The job in a few plain words, e.g. 'late fee on an invoice' or 'is this VAT number valid'.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the right LLPRO tool for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2141938511b71ff53d294025ab95e1dea7c59b29f3b75b5f7a79f2f8ae1866d8"
        },
        {
          "name": "ground_truth_ask",
          "title": "Ask a public fact",
          "description": "Use when the user asks about weather, a storm or weather alert, a flood or river level, an earthquake, a disaster or air quality anywhere right now. Returns the current fact with its source link and time. Free daily quota. Example: {\"topic\": \"weather\", \"place\": \"Austin, Texas\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/ground-truth",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_minutes": {
                "description": "Mark answers older than this as stale",
                "type": "number"
              },
              "place": {
                "description": "Any place name, e.g. 'Lafayette' or 'Lagos, Nigeria'; or use lat+lon",
                "type": "string"
              },
              "topic": {
                "description": "One of: weather, weather_alerts, river_level, flood, earthquakes, disasters, air_quality, road_closures, power_outages, burn_ban (or give free text in q and the topic is guessed). Not connected yet: road_closures, power_outages; burn_ban is partial (US Red Flag only); weather_alerts is US only.",
                "enum": ["weather", "weather_alerts", "river_level", "flood", "earthquakes", "disasters", "air_quality", "road_closures", "power_outages", "burn_ban"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask a public fact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bbb95b6c3d3b103efbe930f25d32d183542f15e0a8714e44af6e3807e33e68a0"
        },
        {
          "name": "human_check_ask",
          "title": "Ask a person to check something",
          "description": "Use when a real person must look at something before you act: an invoice, a document, a photo, a claim or a decision. A tested reviewer answers and signs; the answer goes on a public record. $2 check, $5 expert review, $25 licensed sign-off. Example: {\"question\": \"Do the line items add up to the invoice total?\", \"context\": \"Labor $450; Parts $212.50; Total $662.50\", \"answer_type\": \"yes_no\"}. Docs: https://llpro.ai/human-check",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Your secret LLPRO agent key. With an Assisted or Done for you plan, the check is billed to the plan.",
                "type": "string"
              },
              "answer_type": {
                "description": "yes_no (default), choice or text.",
                "enum": ["yes_no", "choice", "text"],
                "type": "string"
              },
              "callback_url": {
                "description": "Public https address; the signed answer is posted there when it's ready.",
                "type": "string"
              },
              "check_type": {
                "description": "expert_review: one qualified domain expert reviews the item, private by default ($5). licensed_signoff: a vetted licensed contractor reviews and signs inside their licence ($25). To start: general (default, $2 a check, first 3 free), invoice_match, document_check, business_verify. human_task: a person does one phone or remote task up to 10 minutes and writes what happened ($10).",
                "type": "string"
              },
              "context": {
                "description": "What the reviewer needs to see: the text, numbers or details to check.",
                "maxLength": 6000,
                "type": "string"
              },
              "files": {
                "items": {
                  "properties": {
                    "content_type": {
                      "type": "string"
                    },
                    "data": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "options": {
                "description": "The choices, when answer_type is choice.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "question": {
                "description": "One clear question a person can answer in a few minutes.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a person to check something"
          },
          "behavior": {
