          "description": "Is one public web page set up so search engines can find, read and list it? Send the page address; we fetch that page, then its robots.txt and one sitemap from the same site (3 fetches at most, each may follow up to 3 redirects, no crawling) and give pass / fix / unknown for ten things, each with the evidence we saw and what to change: title, description, headings, canonical, noindex signals, robots.txt, sitemap, structured data, image alt text, page weight (the HTML document only). The answer is dated and signed with our key so you can keep it as proof of what the page showed. Free, no sign-up, 100 checks a day per caller. Statements are about what the page showed, not about ranking or how any search engine will treat it. One page per call (no lists), nothing stored (short-lived rate counters only). This tool feeds Search for agents (road: agent-search): agents that look for a page-readiness check find it through MCP registries; it is reached through the Campus gateway (MCP, A2A and REST).",
