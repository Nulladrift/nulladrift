          "description": "Forecast sales from a CRM pipeline export. Send the deals (deal code, amount, expected close date, stage, forecast category and win probability). Get back the weighted pipeline (each open deal's amount times its probability), the commit, best-case and open-pipeline views the way CRM forecasts roll them up, the same figures by close month and by stage, and, if you send as_of, every open deal whose close date has already passed (inside or outside the period). Optional period_start and period_end keep only deals closing in that window (a month or a quarter) in the totals. Up to 200 deals or 30,000 bytes per call. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/weighted-pipeline). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Optional: today's date; open deals with a close date before it are listed as past due.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "deals": {
                "description": "Deals (up to 200) in one currency.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Deal amount (the amount your forecast uses: total, first-year or recurring).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "category": {
                      "description": "Forecast category: pipeline, best_case, commit (open deals), closed (won) or omitted (lost or left out).",
                      "enum": ["pipeline", "best_case", "commit", "closed", "omitted"],
                      "type": "string"
                    },
                    "close_date": {
                      "description": "Expected (or actual) close date, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "deal": {
                      "description": "Your deal code or CRM record ID, e.g. OPP-104, a Salesforce or Dynamics ID, or a HubSpot deal number (compared without regard to case; up to 12 digits in a row; web addresses and phone, Social Security or card shapes are refused). Not a person's name.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "probability_percent": {
                      "description": "Win probability in percent (required for pipeline, best_case and commit; ignored for closed and omitted).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
