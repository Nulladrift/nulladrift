                      "type": "string"
                    },
                    "close_date": {
                      "description": "Expected (or actual) close date, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "deal": {
                      "description": "Your deal code or CRM record ID, e.g. OPP-104, a Salesforce or Dynamics ID, or a HubSpot deal number (compared without regard to case; up to 12 digits in a row; web addresses and phone, Social Security or card shapes are refused). Not a person's name.",
