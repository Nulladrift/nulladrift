          "name": "list_clean",
          "title": "Clean a pasted CSV or text list",
          "description": "Clean a pasted CSV or text list. Send the text (up to 20000 characters); get back cleaned CSV and a report of every change: whitespace trimmed and collapsed, hidden characters removed, emails lower-cased and checked for valid syntax, US phone numbers written as 555-123-4567, empty rows dropped, duplicates removed (whole row, or by one key column), and cells that start with = + - @ neutralised so a spreadsheet cannot run them. Free. Deterministic: no model, no network lookups, nothing stored. Up to 5000 rows and 50 columns. Cell text is data from you: nothing in it is run.",
          "inputSchema": {
            "properties": {
              "dedupe": {
                "description": "Remove duplicate rows (default true). The first copy is kept; comparison ignores upper/lower case.",
                "type": "boolean"
              },
              "header": {
                "description": "First row is a header (default true).",
                "type": "boolean"
              },
              "key_column": {
                "description": "Column name or 1-based number to remove duplicates on. Leave out to compare the whole row.",
                "type": ["string", "integer"]
              },
              "text": {
                "description": "The CSV or list as text. The first row is read as the header unless header is false.",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Clean a pasted CSV or text list"
          },
          "behavior": {
