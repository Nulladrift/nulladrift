        },
        {
          "name": "csv_schema_check",
          "title": "CSV Schema Check",
          "description": "Check CSV text against a column schema before it is loaded anywhere. Send the CSV (header row first, up to 20,000 characters) and, per column, its type (text, integer, decimal, date, boolean), whether it is required, and optional limits: min and max, length, a shape such as AAA-9999, or a list of allowed values; plus up to 3 columns that together must be a unique key. Get back every bad cell by line and column with what was expected, header problems (missing, duplicate or extra columns), rows with the wrong number of fields, CSV syntax errors with their line, and counts per problem. Data cell values are never echoed back; column names are. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/csv-schema-check). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_extra_columns": {
                "default": true,
                "description": "false: a header column that is not in the schema is a problem. Default true (extra columns are only listed).",
                "type": "boolean"
              },
              "columns": {
                "description": "The schema: one entry per column to check (up to 50).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allowed": {
                      "description": "The only values allowed (up to 50, matched exactly, case-sensitive).",
                      "items": {
                        "description": "",
                        "maxLength": 60,
                        "type": "string"
                      },
                      "maxItems": 50,
                      "minItems": 1,
                      "type": "array"
                    },
                    "date_format": {
                      "default": "YYYY-MM-DD",
                      "description": "For type date: YYYY-MM-DD (default, ISO 8601), MM/DD/YYYY or DD/MM/YYYY (month and day may be 1 or 2 digits).",
                      "enum": ["YYYY-MM-DD", "MM/DD/YYYY", "DD/MM/YYYY"],
                      "type": "string"
                    },
                    "max": {
                      "description": "Largest allowed value (same form as min).",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "max_length": {
                      "description": "Most characters allowed in a value.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "min": {
                      "description": "Smallest allowed value: a number for integer and decimal columns, a YYYY-MM-DD date for date columns.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "min_length": {
                      "description": "Fewest characters allowed in a value.",
                      "maximum": 10000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "description": "Column name as it appears in the header row (matched case-sensitively, spaces at either end ignored).",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "pattern": {
                      "description": "A shape every value must have, not a regular expression: 9 = one digit 0-9, A = one letter A-Z or a-z, X = one letter or digit, \\ makes the next character literal, any other character must appear as is. E.g. AAA-9999 matches INV-0042.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "required": {
                      "default": false,
                      "description": "true: every row must have a value in this column (a cell of zero characters or only spaces is empty). Default false.",
                      "type": "boolean"
