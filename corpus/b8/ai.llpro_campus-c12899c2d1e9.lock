        {
          "name": "contract_notice_dates",
          "title": "Contract Renewal and Notice Dates",
          "description": "Work out a contract's term end dates, renewal dates and the last day to give notice of non-renewal. Send the start date, the initial term in months, whether it renews automatically, the renewal term, and the notice days (notice at least N days before the term ends, or before the renewal date). Optionally send as_of to see the current term, whether the notice window is still open and the next notice deadline, max_renewals if the contract caps them, and ny_gol_5_903 to get the window in which a provider of a New York service, maintenance or repair contract must send its reminder. Weekend notice deadlines are flagged with the Friday before as a safe send-by date. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/contract-notice-dates). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
