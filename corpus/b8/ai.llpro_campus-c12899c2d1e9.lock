              "records": {
                "description": "Record classes with creation date and retention period (1 to 200).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "created": {
                      "description": "Creation date of the record or of the batch, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "legal_hold": {
                      "default": false,
