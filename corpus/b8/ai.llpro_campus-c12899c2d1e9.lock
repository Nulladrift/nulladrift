        {
          "name": "loan_amortization",
          "title": "Loan Amortization Schedule",
          "description": "Work out a fixed-rate loan's monthly payment and amortization schedule (notes payable, equipment loans, mortgages). Send the principal, the yearly interest rate in percent and the number of monthly payments; optionally the first payment date, an extra amount paid toward principal each month, and how many schedule rows to return. Get back the payment, total interest, total paid, the payoff month and date, and the schedule rows (payment, interest, principal, balance), with the split between interest and principal for each year. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/loan-amortization). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Yearly interest rate in percent (6.5 for 6.5%), compounded monthly (rate / 12 each month).",
                "maximum": 60,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "extra_monthly": {
                "description": "Optional extra paid toward principal with every payment.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "first_payment_date": {
                "description": "Optional first payment date, YYYY-MM-DD (later payments fall on the same day of each month, or the month's last day).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "months": {
                "description": "Number of monthly payments (360 for 30 years).",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "payment_rounding": {
                "default": "up",
                "description": "up (default): the smallest whole-cent payment at or above the exact level payment whose last payment is not larger than the rest; nearest: the exact payment rounded to the nearest cent (the last payment can then be larger).",
                "enum": ["up", "nearest"],
                "type": "string"
              },
              "principal": {
                "description": "Amount borrowed.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": ["number", "string"]
              },
              "rows": {
                "default": 12,
                "description": "How many schedule rows to return from the start (default 12); the last row is always returned too.",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["annual_rate_percent", "months", "principal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
