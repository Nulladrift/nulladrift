          "name": "csv_schema_check",
          "title": "CSV Schema Check",
          "description": "Check CSV text against a column schema before it is loaded anywhere. Send the CSV (header row first, up to 20,000 characters) and, per column, its type (text, integer, decimal, date, boolean), whether it is required, and optional limits: min and max, length, a shape such as AAA-9999, or a list of allowed values; plus up to 3 columns that together must be a unique key. Get back every bad cell by line and column with what was expected, header problems (missing, duplicate or extra columns), rows with the wrong number of fields, CSV syntax errors with their line, and counts per problem. Data cell values are never echoed back; column names are. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/csv-schema-check). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_extra_columns": {
                "default": true,
                "description": "false: a header column that is not in the schema is a problem. Default true (extra columns are only listed).",
                "type": "boolean"
              },
              "columns": {
                "description": "The schema: one entry per column to check (up to 50).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allowed": {
                      "description": "The only values allowed (up to 50, matched exactly, case-sensitive).",
                      "items": {
                        "description": "",
                        "maxLength": 60,
                        "type": "string"
                      },
                      "maxItems": 50,
                      "minItems": 1,
                      "type": "array"
                    },
                    "date_format": {
                      "default": "YYYY-MM-DD",
                      "description": "For type date: YYYY-MM-DD (default, ISO 8601), MM/DD/YYYY or DD/MM/YYYY (month and day may be 1 or 2 digits).",
                      "enum": ["YYYY-MM-DD", "MM/DD/YYYY", "DD/MM/YYYY"],
                      "type": "string"
                    },
                    "max": {
                      "description": "Largest allowed value (same form as min).",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "max_length": {
                      "description": "Most characters allowed in a value.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "min": {
                      "description": "Smallest allowed value: a number for integer and decimal columns, a YYYY-MM-DD date for date columns.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "min_length": {
                      "description": "Fewest characters allowed in a value.",
                      "maximum": 10000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "description": "Column name as it appears in the header row (matched case-sensitively, spaces at either end ignored).",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "pattern": {
                      "description": "A shape every value must have, not a regular expression: 9 = one digit 0-9, A = one letter A-Z or a-z, X = one letter or digit, \\ makes the next character literal, any other character must appear as is. E.g. AAA-9999 matches INV-0042.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "required": {
                      "default": false,
                      "description": "true: every row must have a value in this column (a cell of zero characters or only spaces is empty). Default false.",
                      "type": "boolean"
                    },
                    "type": {
                      "default": "text",
                      "description": "text (anything), integer (XSD: optional + or -, digits), decimal (XSD: optional sign, digits with an optional point, e.g. 12, -3.5, .5), date (see date_format), boolean (XSD: true, false, 1 or 0). Default text.",
                      "enum": ["text", "integer", "decimal", "date", "boolean"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "csv": {
                "description": "The CSV text, header row first (RFC 4180; line breaks CRLF, LF or CR), up to 20,000 characters. Do not send personal data (names of people, emails, phone, Social Security, card or account numbers): columns named for it and cells shaped like it are refused, but names in cells cannot be detected.",
                "maxLength": 20000,
                "type": "string"
              },
              "delimiter": {
                "default": "comma",
                "description": "Field separator: comma (default, RFC 4180), semicolon, tab or pipe.",
                "enum": ["comma", "semicolon", "tab", "pipe"],
                "type": "string"
              },
              "unique_key": {
                "description": "Up to 3 column names (from columns) whose values together must be present and unique on every row.",
                "items": {
                  "description": "",
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["columns", "csv"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CSV Schema Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f275d3610b2f972ba21c12cff4e4dac3990ff98fb9786db2c5589afb2baaadc9"
        },
        {
          "name": "customs_entry_pre_check_and_cpsc",
          "title": "Customs entry pre-check: HTS lines read from the current HTSUS, country and unit checks, and whether CPSC certificate data must be eFiled with the entry (signed)",
          "description": "Customs entry pre-check and CPSC eFiling, for wholesalers importing and their brokers' agents: before the entry is filed, send each entry line (HTS number, description, country of origin, unit, and what you know about CPSC: regulated yes/no/unknown, CPC or GCC, full data or a Product Registry reference). Get back, per line, the HTS line as read from the USITC HTS search service (read now or from a cache of up to 24 hours, read_at stated; official description, general rate, units, footnotes; or the valid 10-digit numbers when you sent 8 digits), unit and country checks, and whether 16 CFR 1110.13 needs CPSC certificate data eFiled with this entry (from 8 Jul 2026; from 8 Jan 2027 for foreign trade zone entries) and whether what you have is enough. Each issue is fix, ask or check. Free. No model, nothing stored, signed record with the HTS revision read. Up to 25 lines per call. Plain ASCII text only. Not legal advice: it does not classify goods, compute duty or extra tariffs, decide which CPSC rules apply, read CBP's flag list or file anything; build the certificate data itself with cpsc_certificate_data_sheet_from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry": {
                "additionalProperties": false,
                "properties": {
                  "date": {
                    "description": "Planned entry date (arrival date for mail), YYYY-MM-DD, 2020-01-01 to one year ahead.",
                    "type": "string"
                  },
                  "type": {
                    "description": "consumption, warehouse, ftz (entered from a foreign trade zone), de_minimis, or mail.",
                    "enum": ["consumption", "de_minimis", "ftz", "mail", "warehouse"],
                    "type": "string"
                  }
                },
                "required": ["date", "type"],
                "type": "object",
                "x-llpro-sensitive": true
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country_of_origin": {
                      "description": "ISO 3166-1 two-letter code, e.g. CN, VN, MX, US.",
                      "type": "string"
                    },
                    "cpsc": {
                      "additionalProperties": false,
                      "properties": {
                        "certificate": {
                          "description": "CPC = Children's Product Certificate; GCC = General Certificate of Conformity.",
