      "instructions": "LLPRO LLPRO gateway: every tool on the LLPRO campus in one list (the one registry). No sign-up. Send X-Agent-Id: <a stable name> if you want a return-visit record. Free agent key, no sign-up, no email: POST https://llpro.ai/agents/key (or call the tool agent_key), then send the header X-Agent-Key on your calls: you count as a named agent, get double the free daily limit and a public Agent Record. Referral program: bring a customer, earn 20% of what they pay for 12 months (tool referral_key; terms https://llpro.ai/referrals.json; never changes ranking). Testing: a referral earns nothing yet. Focused lists, same tools: /mcp/trust, /mcp/records, /mcp/finance, /mcp/hub, /mcp/tools.",
      "tools": [
        {
          "name": "aba_routing_check",
          "title": "ABA Routing Number Check",
          "description": "Check that a US bank routing number (ABA routing transit number, 9 digits) is well formed before you set up an ACH payment, a wire or a direct deposit. Send the routing number only, never an account number. Get back whether the check digit is right (3-7-1 weights), what the first two digits mean (Federal Reserve district, thrift, electronic-only, US Government or traveler's checks, or a range that is not assigned), the Federal Reserve district, and the check digit the first eight digits call for. A well-formed number can still be one no bank uses: this checks the form, not the bank. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/aba-routing-check). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "routing_number": {
                "description": "The 9-digit routing number, as text so a leading zero is kept (for example '021000021'). The routing number only: never send an account number.",
                "maxLength": 9,
                "type": "string"
              }
            },
            "required": ["routing_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ABA Routing Number Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e032beae0c9f71825f6da319ec45040ae4a870adc32db34f2b2326ae838b856d"
        },
        {
          "name": "abc_inventory_classes",
          "title": "ABC Inventory Classes",
          "description": "Classify inventory items (SKUs) into A, B and C classes by their share of total annual value (ABC analysis, Pareto). Send up to 200 SKUs, each with its annual value, or its annual units and unit cost (annual value = units x cost). The default split is 80/15/5: class A is the top-ranked items up to and including the one that reaches 80% of annual value, class B the items after that up to the one that reaches 95%, class C the rest; send a_percent and b_percent to change it. Get back every SKU ranked by annual value with its share, cumulative share and class; per class the item count, share of items, value and share of value; and the cutoffs: the lowest annual value and the last rank in each class. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/abc-inventory). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a_percent": {
                "description": "Share of total annual value that class A covers, in percent (default 80).",
                "maximum": 99,
                "minimum": 1,
                "type": ["number", "string"]
              },
              "b_percent": {
                "description": "Share of total annual value that class B covers after A, in percent (default 15). Class C is the rest: 100 - a_percent - b_percent.",
                "maximum": 99,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "items": {
                "description": "Inventory items (up to 200). Each: sku, and either annual_value, or annual_units and unit_cost.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "annual_units": {
                      "description": "Units used or sold per year (send with unit_cost instead of annual_value).",
                      "maximum": 1000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "annual_value": {
                      "description": "Annual value of the item (yearly usage or sales at cost, in one currency for all items). Leave out if you send annual_units and unit_cost.",
                      "maximum": 1000000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "sku": {
                      "description": "SKU or item code (your own code; one line per SKU).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "unit_cost": {
                      "description": "Cost per unit, up to 4 decimals (send with annual_units).",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["sku"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "description": "Optional label for the list (your own text, echoed back; not a person).",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ABC Inventory Classes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b8f6c5a259aa8ed4d1fc707a00d92914676706c6ddb3958aa1cd0835030cec5"
