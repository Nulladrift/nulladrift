                    },
                    "revised": {
                      "default": false,
                      "description": "true for a revised tax audit report (never counted: para 11).",
                      "type": "boolean"
                    },
                    "signed_by": {
                      "description": "Code of the partner who signs (or signed) the report; must be in partners.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "signed_on": {
                      "description": "Date the report was signed, YYYY-MM-DD. Leave out if accepted and not yet signed (it is then counted as planned).",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["assessment_year", "category", "client", "ref", "signed_by"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "financial_year": {
                "description": "The financial year whose signed reports are counted, YYYY-YY (2026-27 or later: the 2025 Guidelines apply from 1 Apr 2026). A report counts in the year it is signed.",
                "maxLength": 7,
                "type": "string"
              },
              "partners": {
                "description": "Every partner of the firm (or the one member, for a proprietor or a member practising alone). Codes only.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "description": "Your code for the partner, e.g. P1. No names or membership numbers.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "practice": {
                      "default": "full_time",
                      "description": "full_time, or part_time (a part-time practising partner adds nothing to the firm's capacity: para 12.5).",
                      "enum": ["full_time", "part_time"],
                      "type": "string"
                    },
                    "signed_elsewhere": {
                      "default": 0,
                      "description": "Counted tax audit reports this partner signed in this financial year in another firm or in their own name (from their own record or the UDIN portal count). They count against the same 60 (paras 8, 9).",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["code"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["financial_year", "partners"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
