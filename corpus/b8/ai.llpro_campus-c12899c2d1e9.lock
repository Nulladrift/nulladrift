          "name": "cpsc_certificate_data_sheet_from",
          "title": "Build a CPSC certificate data sheet per SKU from the lab test report, checked against 16 CFR 1110.11 and the eCFR, with a signed record",
          "description": "CPSC certificate data sheet from the lab test report: one sheet per SKU with every data element 16 CFR 1110.11 asks a finished product certificate (CPC or GCC) to carry, in the rule's order, for the customs broker who eFiles it in ACE. Send what you read off the test report and the importer's records: product identifiers and description, each rule cited with the lab that tested it (or the testing exclusion claimed), the certifier, the records keeper, date and place of manufacture, and each lab with its test date. Get back, per SKU, each element marked ok, missing or check, a plain-text sheet, and whether each cited 16 CFR part exists in the eCFR and when it was last amended (read live). Free. No model, nothing stored, signed record. Up to 25 SKUs and 100,000 bytes per call. Plain ASCII text (an eFiled certificate must be in English). Not legal advice: it does not file, does not decide which rules apply, and does not check a lab against CPSC's accepted-lab list.",
          "inputSchema": {
            "properties": {
              "certificates": {
                "description": "One certificate per SKU (16 CFR 1110.13(a): each certificate describes only one product).",
                "items": {
                  "properties": {
                    "certifier": {
                      "description": "The importer (or domestic manufacturer or private labeler) certifying: name, street, city, state_province, country, email, phone.",
                      "type": "object"
                    },
                    "labs": {
                      "items": {
                        "properties": {
                          "city": {
                            "type": "string"
                          },
                          "country": {
                            "type": "string"
                          },
                          "cpsc_lab_id": {
                            "description": "CPSC lab ID of an accepted third party lab (needed for a CPC).",
                            "type": "string"
                          },
                          "email": {
                            "type": "string"
                          },
                          "key": {
                            "description": "Your short key for this lab, used in rules[].tested_by.",
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "phone": {
                            "type": "string"
                          },
                          "state_province": {
                            "type": "string"
                          },
                          "street": {
                            "type": "string"
                          },
                          "tested_on": {
                            "description": "Most recent test date, YYYY-MM-DD (or YYYY-MM).",
                            "type": "string"
                          }
                        },
                        "required": ["key"],
                        "type": "object"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "manufactured": {
                      "properties": {
                        "date": {
                          "description": "YYYY-MM (first day of the run, month and year at a minimum).",
                          "type": "string"
                        },
                        "place": {
                          "description": "Manufacturer name, street, city, state_province, country, email, phone.",
                          "type": "object"
                        }
                      },
                      "type": "object"
                    },
                    "product": {
                      "description": "At least one identifier (sku, gtin, upc, model, serial, registered_number, alternate_id) and a description that matches the product to the certificate. lot, style, color optional.",
                      "properties": {
                        "alternate_id": {
                          "type": "string"
                        },
                        "color": {
                          "type": "string"
                        },
                        "description": {
                          "type": "string"
                        },
                        "gtin": {
                          "type": "string"
                        },
                        "lot": {
                          "type": "string"
                        },
                        "model": {
                          "type": "string"
                        },
                        "registered_number": {
                          "type": "string"
                        },
                        "serial": {
                          "type": "string"
                        },
                        "sku": {
                          "type": "string"
                        },
                        "style": {
                          "type": "string"
                        },
                        "upc": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "records_keeper": {
                      "description": "The person (or always-staffed position title) keeping the test records: name, street, city, state_province, country, email, phone.",
                      "type": "object"
                    },
                    "records_url": {
                      "description": "Optional https link to the supporting records (1110.11(b)). Shown on the sheet, never fetched.",
                      "type": "string"
                    },
                    "rules": {
                      "items": {
                        "properties": {
                          "citation": {
                            "description": "A CPSC rule, e.g. '16 CFR 1250' or '16 CFR 1303.1', or a statute, e.g. 'CPSIA 101(a)' or '15 USC 1278a'.",
                            "type": "string"
                          },
                          "exclusion": {
                            "description": "The statutory or regulatory testing exclusion claimed for this rule, instead of a test (1110.11(c)).",
                            "type": "string"
                          },
                          "tested_by": {
                            "description": "key(s) of the lab(s) in labs whose testing this rule depends on.",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["citation"],
                        "type": "object"
                      },
                      "maxItems": 30,
                      "type": "array"
                    },
                    "type": {
                      "description": "CPC = Children's Product Certificate; GCC = General Certificate of Conformity.",
                      "enum": ["CPC", "GCC"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["certificates"],
            "type": "object"
          },
