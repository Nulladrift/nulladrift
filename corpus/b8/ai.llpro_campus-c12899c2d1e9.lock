          "name": "mx_record_check",
          "title": "MX Record Check (RFC 5321 / RFC 7505)",
          "description": "Check the MX answers for a domain, before you publish them or when mail to the domain bounces or never arrives. Send the MX records you got (preference and exchange host) and, optionally, the hosts that have an A or AAAA address answer, and the domain. Get back the order senders will try the hosts in (lowest preference first, equal preferences shared), whether it is a valid null MX (RFC 7505: the domain accepts no mail), and each problem with its RFC: duplicate records, the same host at two preferences, a null MX mixed with other records, an exchange that is an IP address or not a valid host name, and hosts with no address. No DNS query is made: you send the answers. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/mx-record-check). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address_hosts": {
                "description": "Optional: the host names that returned at least one A or AAAA address when you looked them up. Send it to find MX hosts with no address; leave it out and that check is not done.",
                "items": {
                  "description": "",
                  "maxLength": 255,
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "domain": {
                "description": "Optional: the domain the MX records are for (used to describe the case of no MX records).",
                "maxLength": 253,
                "type": "string"
              },
              "records": {
                "description": "The MX answers (up to 200). An empty list means the domain has no MX records.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "exchange": {
                      "description": "The mail exchanger host name as answered (a trailing dot is fine); '.' alone is the null MX.",
                      "maxLength": 255,
                      "type": "string"
                    },
                    "preference": {
                      "description": "MX preference, 0 to 65535 (lower is tried first).",
                      "maximum": 65535,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["exchange", "preference"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "MX Record Check (RFC 5321 / RFC 7505)"
