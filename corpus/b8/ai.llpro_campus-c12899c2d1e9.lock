              "minimum_monthly_charge": {
                "default": 0,
                "description": "Smallest charge for any month, in your currency (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "months": {
                "default": 12,
                "description": "How many months to estimate, 1 to 120 (default 12).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "size": {
                "description": "Size stored now, in the unit your prices use (for example 2500 for 2,500 GB).",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "size_basis": {
                "default": "start_of_month",
                "description": "start_of_month (default): month 1 is billed on the size you send, month 2 after one month of growth. end_of_month: month 1 is billed on the size after one month of growth.",
