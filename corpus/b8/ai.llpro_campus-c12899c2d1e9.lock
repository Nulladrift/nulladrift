        {
          "name": "on_call_rotation",
          "title": "On-Call Rotation Builder",
          "description": "Build a fair on-call rotation. Send the team as labels (roles or codes such as 'SRE-1' or 'A', not names) in the order they should start, the first hand-off date, the shift length in days (7 for weekly), the hand-off time, and how many shifts (or an end date). Optional: a hand-off weekday to start on, public holidays (holiday shifts are spread by a stated shift-by-shift rule, and the answer shows how even the spread came out), and swaps (two shifts trade people). Get back every shift with who is on call, its start and end, the holidays and weekend days it covers, and per person the number of shifts, days, holiday days and weekend days, with the gap between the busiest and least busy person. Up to 50 people and 200 shifts, at most 2 years. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/on-call-rotation). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance_holidays": {
                "default": true,
                "description": "Spread holiday shifts so nobody gets more holiday days than needed (default true). False = plain round robin.",
                "type": "boolean"
              },
              "end_date": {
                "description": "Build shifts until the rotation covers this date (send this or shift_count).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "handoff_time": {
                "description": "Hand-off time, 24-hour HH:MM local wall-clock time (default 09:00).",
                "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                "type": "string"
              },
              "handoff_weekday": {
                "description": "Optional: first hand-off on this weekday, on or after start_date.",
                "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                "type": "string"
              },
              "holidays": {
                "description": "Optional public holiday dates (up to 100), YYYY-MM-DD.",
                "items": {
                  "description": "Holiday date.",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 0,
                "type": "array"
              },
              "label": {
                "description": "Optional label for the rotation (your own text, echoed back).",
                "maxLength": 40,
                "type": "string"
              },
              "shift_count": {
                "description": "Number of shifts to build (send this or end_date).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "shift_days": {
                "default": 7,
                "description": "Shift length in days (default 7 = weekly).",
                "maximum": 28,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "First hand-off date, YYYY-MM-DD (moved to the next handoff_weekday if you send one).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "swaps": {
                "description": "Optional swaps, applied in order after the rotation is built: the people on the two shifts trade places.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "shift_a": {
                      "description": "Shift number (1 = the first shift).",
                      "maximum": 200,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "shift_b": {
                      "description": "The other shift number.",
                      "maximum": 200,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["shift_a", "shift_b"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 0,
                "type": "array"
              },
              "team": {
                "description": "Team labels in rotation order (2 to 50): roles or codes, not names.",
                "items": {
                  "description": "A role or code such as 'SRE-1' (no names, emails or phone numbers).",
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["start_date", "team"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "On-Call Rotation Builder"
