        {
          "name": "run_record_verify",
          "title": "Check a long run's records signed by someone other than the agent, with a heartbeat on a clock. Agent transcripts and telemetry are not evidence",
          "description": "Check a long run's records signed by a key the records say is not the agent's (a host, runner or supervisor: the recorder), with a heartbeat on a clock. Send the records in order: each {v 1, type run-record, run_id, seq, kind start|heartbeat|event|end, at, prev, recorder_id, recorder_key, sig} chained by SHA-256; the start record names agent_id and heartbeat_s. Get back valid or invalid (signatures, chain, order), every check, heartbeat_kept, the run state (ended, running or silent), missed beats, and a summary signed by LLPRO with the time we saw it, checkable offline. Agent transcripts and telemetry are untrusted: carry only their SHA-256 as telemetry_hash. Pin expected_agent, expected_recorder and expected_head for the strongest result. We do not keep the records. It does not show who the recorder is or that the records are complete. Not an audit opinion, not a certification, not a qualified timestamp, not evidence of compliance. Free. Feeds the standards and regulatory road: run logs signed by someone other than the agent.",
          "inputSchema": {
            "properties": {
              "expected_agent": {
                "description": "the agent public key you expect; if it differs (or the start record names none) the result is invalid",
                "type": "string"
              },
              "expected_head": {
                "description": "the recorder's latest chain head you know of; if the last record sent is not it, the result is invalid (catches dropped newest records)",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "expected_recorder": {
                "description": "the recorder public key you trust; if it differs the result is invalid",
                "type": "string"
              },
              "expected_records": {
                "description": "the number of records you know exist; if a different number is sent the result is invalid",
                "minimum": 1,
                "type": "integer"
              },
              "records": {
                "items": {
                  "properties": {
                    "agent_id": {
                      "description": "start record only",
                      "maxLength": 128,
                      "type": "string"
                    },
                    "agent_key": {
                      "description": "start record only, optional",
                      "type": "string"
                    },
                    "at": {
                      "description": "UTC time like 2026-11-12T09:00:00Z",
                      "type": "string"
                    },
                    "heartbeat_s": {
                      "description": "start record only: the promised beat in seconds",
                      "maximum": 86400,
                      "minimum": 10,
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["start", "heartbeat", "event", "end"],
                      "type": "string"
                    },
                    "note": {
                      "description": "optional: the recorder's own words",
                      "maxLength": 280,
                      "type": "string"
                    },
                    "outcome": {
                      "description": "end record only",
                      "enum": ["completed", "failed", "stopped", "timed-out"],
                      "type": "string"
                    },
                    "prev": {
                      "description": "64 zeros for seq 0, else SHA-256 hex of the canonical JSON of the previous record (with its sig)",
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "recorder_id": {
                      "maxLength": 128,
                      "type": "string"
                    },
                    "recorder_key": {
                      "description": "the recorder's Ed25519 public key, canonical base64 (not the agent's key)",
                      "type": "string"
                    },
                    "run_id": {
                      "maxLength": 128,
                      "type": "string"
                    },
                    "seq": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "sig": {
                      "description": "recorder signature over the canonical JSON of the record without sig",
                      "type": "string"
                    },
                    "task_hash": {
                      "description": "start record only, optional",
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "telemetry_hash": {
                      "description": "optional: SHA-256 of what the agent reported (untrusted, carried only)",
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["run-record"],
                      "type": "string"
                    },
                    "v": {
                      "enum": [1],
                      "type": "integer"
                    }
                  },
                  "required": ["at", "kind", "prev", "recorder_id", "recorder_key", "run_id", "seq", "sig", "type", "v"],
                  "type": "object"
                },
                "maxItems": 160,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "annotations": {
