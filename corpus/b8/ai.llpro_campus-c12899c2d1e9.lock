        {
          "name": "sla_deadline",
          "title": "SLA Deadline in Business Hours",
          "description": "Work out when a support or service response is due when the clock only runs in business hours, and whether a reply or fix time breached it. Send when the clock started (start), the IANA time zone of the business hours, the target (target_minutes or target_hours of business time), and optionally the weekly schedule (default Monday to Friday 09:00-17:00; split shifts and 24-hour days allowed), US federal holidays, your own closed dates and on-hold periods that stop the clock. Get back the due time in local time and UTC, the holidays and closed days skipped, and, if you send check_at (when the reply or fix happened), met or breached with the business minutes used and the margin. Daylight-saving changes are handled through the IANA time zone database. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/sla-deadline). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_at": {
                "description": "Optional: when the response or resolution happened, to judge met or breached.",
                "maxLength": 35,
                "type": "string"
              },
              "closed_dates": {
                "description": "Your own closed days in zone (YYYY-MM-DD, up to 200).",
                "items": {
                  "description": "Closed date.",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "holiday_calendar": {
                "default": "none",
                "description": "Holidays on which the clock stops: none (default), us_federal_offices (5 U.S.C. 6103; Saturday holidays on Friday, Sunday ones on Monday) or us_federal_reserve_banks (Sunday ones on Monday, Saturday ones not moved).",
                "enum": ["none", "us_federal_offices", "us_federal_reserve_banks"],
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'P2 first response' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "paused": {
                "description": "On-hold periods that stop the clock (e.g. waiting on the customer), up to 50.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end": {
                      "description": "Pause end.",
                      "maxLength": 35,
                      "type": "string"
                    },
                    "start": {
                      "description": "Pause start.",
                      "maxLength": 35,
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 0,
                "type": "array"
              },
              "schedule": {
                "description": "Weekly business hours, one entry per open span (default MO-FR 09:00-17:00). Several entries per day give split shifts; 00:00-24:00 is a full day.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "close": {
                      "description": "Closing time, HH:MM (24:00 for midnight).",
                      "maxLength": 5,
                      "type": "string"
                    },
                    "day": {
                      "description": "Day: MO TU WE TH FR SA SU.",
                      "enum": ["MO", "TU", "WE", "TH", "FR", "SA", "SU"],
                      "type": "string"
                    },
                    "open": {
                      "description": "Opening time, HH:MM.",
                      "maxLength": 5,
                      "type": "string"
                    }
                  },
                  "required": ["close", "day", "open"],
                  "type": "object"
                },
                "maxItems": 28,
                "minItems": 1,
                "type": "array"
              },
              "start": {
                "description": "When the SLA clock starts (ticket created). Clock time in zone, e.g. 2026-11-20T16:00, or an instant with offset, e.g. 2026-11-20T21:00:00Z.",
                "maxLength": 35,
                "type": "string"
              },
              "target_hours": {
                "description": "Target in business hours, e.g. 4 or 1.5 (send this or target_minutes).",
                "maximum": 1666,
