        {
          "name": "invoice_make",
          "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash",
          "description": "Make a clean PDF invoice from invoice fields, and get back a signed, dated receipt of the PDF's hash, so either side can later show which invoice was made and when. Send: number, issue_date (YYYY-MM-DD), optional due_date, currency (USD, EUR, GBP ... 43 supported), seller {name, address, tax_id, contact}, buyer {name, address, ...}, items [{description, quantity, unit_price}] (up to 40), optional tax_lines [{label, rate_percent OR amount}], notes, payment_terms. Every number, rate and tax line is yours: we only add them up (half-up rounding to the currency's smallest unit); no tax advice, no tax rules, no checking of tax ids. Moves no money and makes no payment link: web addresses and links (dotted names, IP addresses, schemes such as http: or pay:) are refused in every text field. Free, no sign-up, 100 invoices a day per caller. Stores nothing: the signed receipt holds the number, dates, totals and hashes, never names or addresses. Text must use Western European letters (the Windows-1252 set; accented Latin letters, euro, pound, yen). Answer: pdf_base64, totals, signed observation, receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "Up to 6 lines, 80 characters each."
                  },
                  "contact": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "tax_id": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "currency": {
                "description": "Three-letter code, for example USD, EUR, GBP, JPY.",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD, on or after the issue date.",
                "type": "string"
              },
              "issue_date": {
                "description": "YYYY-MM-DD (2000 to 2100).",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "More than 0 and at most 1,000,000, up to 4 decimal places (a number, or text such as \"2.5\")."
                    },
                    "unit_price": {
                      "description": "At most 1,000,000,000 in size, up to 4 decimal places; a line may not exceed 10,000,000,000 and the total 100,000,000,000; may be negative for a credit line (the invoice total may not be negative)."
                    }
                  },
                  "required": ["description", "quantity", "unit_price"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "maxLength": 500,
                "type": "string"
              },
              "number": {
                "description": "Invoice number: letters, digits, space and . _ / # - (1 to 40).",
                "maxLength": 40,
                "type": "string"
              },
              "payment_terms": {
                "description": "Plain words, for example 'Net 30. Bank transfer, account details sent separately.' No web addresses.",
                "maxLength": 300,
                "type": "string"
              },
              "seller": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "Up to 6 lines (list of strings, or one string with line breaks), 80 characters each."
                  },
                  "contact": {
                    "description": "An email address or phone number. No web addresses.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "tax_id": {
                    "description": "Printed as given. Not checked.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "tax_lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "A fixed tax amount instead of a rate (0 or more)."
                    },
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "rate_percent": {
                      "description": "0 to 100, up to 4 decimal places, applied to the subtotal. Your number, not ours."
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["buyer", "currency", "issue_date", "items", "number", "seller"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash"
          },
          "behavior": {
