        {
          "name": "capital_call_collection_chasing",
          "title": "Chase capital calls and check payment instructions for a change",
          "description": "Capital call collection chasing for syndicators and small funds. Send the call's due date, optional grace days and chase schedule, and per investor a label, the amount called and the amount received. Get back who is paid, partly paid, due, in grace or overdue, who is due a chase today, the chase dates, and draft wording per stage (nothing is sent). Optionally send the payment instructions printed on the call notice (routing number or IBAN, last 4 of the account, names; never a full account number): you get the routing-number and IBAN check-digit results and a fingerprint; send it back as previous_instruction_fingerprint on the next call to learn whether the instructions changed (the usual sign of payment-redirect fraud). Set check_sources true to also read two public FBI and FinCEN pages and, with sec_cik, the SEC EDGAR record for Form D filings. Free. No model, nothing stored, signed record. Up to 100 investors. Use your own investor labels, not names, emails or account numbers. Not legal, tax or investment advice; your fund documents decide default and remedies.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Date to evaluate on (default today, UTC).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "call_date": {
                "description": "YYYY-MM-DD the call notice was issued (optional).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "chase_offsets_days": {
                "description": "Days from the due date on which to chase (negative = before). Default [-5, 0, 3, 7, 14].",
                "items": {
                  "maximum": 120,
                  "minimum": -60,
                  "type": "integer"
                },
                "maxItems": 8,
                "type": "array"
              },
              "check_sources": {
                "description": "Also read the FBI IC3 and FinCEN pages (and EDGAR if sec_cik is sent) and report what they say today.",
                "type": "boolean"
              },
              "currency": {
                "description": "Three capital letters, e.g. USD (shape only, not checked against the ISO list).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD payment is due.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "fingerprint_salt": {
                "description": "Your own secret, the same each time, mixed into the fingerprint so nobody else can reproduce it. Not stored.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "fund_label": {
                "description": "Your own label for the fund or deal (not a person).",
                "maxLength": 80,
                "type": "string"
              },
              "grace_days": {
                "description": "Days after the due date before an unpaid amount counts as overdue. Your own number from your fund documents (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "investors": {
                "items": {
                  "properties": {
                    "amount_called": {
                      "description": "At most 2 decimals. As text (\"1250.50\") if you want it exact.",
                      "type": ["number", "string"]
                    },
                    "amount_received": {
                      "description": "Received so far (default 0).",
                      "type": ["number", "string"]
                    },
                    "investor_id": {
                      "description": "Your own label, e.g. LP-07. Not a name, email or account number.",
                      "pattern": "^[A-Za-z0-9_.-]{1,24}$",
                      "type": "string"
                    },
                    "last_reminder_date": {
                      "description": "When you last chased this investor (optional).",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount_called", "investor_id"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "payment_instructions": {
                "description": "The payment instructions printed on the call notice. Never a full account number.",
                "properties": {
                  "aba_routing": {
                    "pattern": "^[0-9]{9}$",
                    "type": "string"
                  },
                  "account_last4": {
                    "pattern": "^[0-9]{4}$",
                    "type": "string"
