                          "type": "string"
                        },
                        "certificate_id": {
                          "description": "The Product Registry certificate identifier, when filing is reference. Checked for form only; never echoed, only hashed into the record.",
                          "type": "string",
                          "x-llpro-sensitive": true
                        },
                        "filing": {
                          "description": "full = all certificate data in the PGA Message Set; reference = the certificate is in CPSC's Product Registry and the entry refers to it.",
                          "enum": ["full", "reference"],
