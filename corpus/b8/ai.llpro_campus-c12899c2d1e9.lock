        {
          "name": "launchpad_start",
          "title": "Plan a goal with several steps",
          "description": "Use when the user gives a bigger goal with several steps: turns it into a step-by-step plan with the tools to use, the first task to run and what needs the owner's approval. Free; the goal is never stored. Example: {\"goal\": \"Check whether our supplier invoices this month have duplicates\"}",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "A stable name for you. Used only to count return visits.",
                "maxLength": 64,
                "type": "string"
              },
              "constraints": {
                "description": "Optional limits. They only ever make the plan stricter.",
                "properties": {
                  "ask_before_every_action": {
                    "type": "boolean"
                  },
                  "budget_usd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "deadline_minutes": {
                    "minimum": 5,
                    "type": "integer"
                  },
                  "no_send": {
                    "type": "boolean"
                  },
                  "no_share": {
                    "type": "boolean"
                  },
                  "no_spend": {
                    "type": "boolean"
                  },
                  "no_web": {
                    "type": "boolean"
                  },
                  "place": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "playbook": {
                    "enum": ["research", "selling", "hiring", "bookkeeping", "outreach", "support"],
                    "type": "string"
                  },
                  "side": {
                    "enum": ["employer", "seeker"],
                    "type": "string"
                  },
                  "tools_allowed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
