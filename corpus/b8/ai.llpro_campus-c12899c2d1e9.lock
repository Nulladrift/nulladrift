          "description": "Retailer deduction dispute win table. Send one row per deduction you disputed: retailer (your own label), deduction code as the retailer prints it, outcome (won = credited back in full, partial, lost, withdrawn, open), and optionally a reason group, days to close, dollars disputed and dollars recovered. Get back, by retailer and deduction code, by retailer and by reason group: cases, win rate (won in full out of decided cases) and any-recovery rate (won or partial), each with a 95 percent interval, dollars recovered out of dollars disputed, days to close (median, 90th percentile, mean, longest), and a flag for groups with too few cases. Free. No model, nothing stored, nothing fetched, signed record. Up to 500 rows or 60,000 bytes, whichever comes first (about 330 fully filled rows). There is no pooled data: the table is built from your rows only, and no public source for retailer deduction codes exists, so no code meaning is claimed. Use retailer labels and codes, never invoice or PO numbers, names or emails. Not legal, tax or accounting advice.",
