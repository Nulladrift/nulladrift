        {
          "name": "recurring_dates",
          "title": "Recurring Date Expander (RRULE)",
          "description": "Turn a repeating schedule into its list of dates. Send the first date (start) and the rule in iCalendar RRULE form (RFC 5545): 'every 2nd Tuesday of the month' = FREQ=MONTHLY;BYDAY=2TU; 'every other Tuesday' = FREQ=WEEKLY;INTERVAL=2;BYDAY=TU; 'last business day of the month' = FREQ=MONTHLY;BYDAY=MO,TU,WE,TH,FR;BYSETPOS=-1; 'every 2 weeks on Monday and Wednesday' = FREQ=WEEKLY;INTERVAL=2;BYDAY=MO,WE; 'the 15th and the last day of each month' = FREQ=MONTHLY;BYMONTHDAY=15,-1. End it with COUNT, UNTIL or through, or get the first max_dates. Optionally move dates that land on a weekend, a US federal holiday or your own closed dates (following, preceding or modified following business day), each move shown with its reason. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/recurring-dates). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adjust": {
                "default": "none",
                "description": "Move a date that is not a business day: none (default), following (next business day), preceding (business day before), modified_following (next, unless that is in the next month, then the one before).",
                "enum": ["none", "following", "preceding", "modified_following"],
                "type": "string"
              },
              "closed_dates": {
                "description": "Your own non-business days for adjusting (YYYY-MM-DD, up to 200).",
                "items": {
                  "description": "Closed date.",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "holiday_calendar": {
                "default": "none",
                "description": "Holidays that are not business days when adjusting: none, us_federal_offices (5 U.S.C. 6103; Saturday holidays on Friday, Sunday ones on Monday) or us_federal_reserve_banks (Sunday on Monday, Saturday not moved).",
                "enum": ["none", "us_federal_offices", "us_federal_reserve_banks"],
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'board meeting' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "max_dates": {
                "default": 60,
                "description": "Most dates to list (1 to 366, default 60).",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "rrule": {
                "description": "Recurrence rule, RFC 5545 form, e.g. FREQ=WEEKLY;INTERVAL=2;BYDAY=MO,WE;COUNT=10. Parts: FREQ (DAILY, WEEKLY, MONTHLY, YEARLY), INTERVAL, COUNT, UNTIL (YYYYMMDD), BYDAY, BYMONTHDAY, BYMONTH, BYSETPOS, WKST.",
                "maxLength": 220,
                "type": "string"
              },
              "start": {
                "description": "First date of the series (DTSTART), YYYY-MM-DD. Listed only if it fits the rule.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "through": {
                "description": "Optional: list no rule dates after this date (YYYY-MM-DD).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["rrule", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recurring Date Expander (RRULE)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
