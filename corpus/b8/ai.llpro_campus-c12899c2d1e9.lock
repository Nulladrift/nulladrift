        {
          "name": "jwt_inspect",
          "title": "JWT Inspect",
          "description": "Read a JSON Web Token (the three-part signed kind, header.payload.signature): the header and claims decoded, expiry (exp), not-before (nbf) and issued-at (iat) checked against a time, optional issuer and audience checks, and the signature verified when you also send a public key (a PEM public key, a JWK, or a JWKS document pasted in). Supports RS256/384/512, PS256/384/512, ES256/384/512 and EdDSA. The token is not stored; claim values that look like a person's details are hidden. It does not fetch keys from a URL and never takes a secret: send a public key only. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/jwt-inspect). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_at": {
                "description": "Optional: the time to check exp, nbf and iat against, in Unix seconds. Default: the time of the call.",
                "maximum": 4102444800,
                "minimum": 0,
                "type": "integer"
              },
              "expected_audience": {
                "description": "Optional: an audience you expect; matches when aud equals it or is a list containing it (exact, case-sensitive).",
                "maxLength": 200,
                "type": "string"
              },
              "expected_issuer": {
                "description": "Optional: the iss value you expect, compared exactly (case-sensitive).",
                "maxLength": 200,
                "type": "string"
              },
              "leeway_seconds": {
                "description": "Optional clock-skew allowance in seconds (0 to 300, default 0) applied to exp, nbf and iat.",
                "maximum": 300,
                "minimum": 0,
                "type": "integer"
              },
              "public_key": {
                "description": "Optional, to verify the signature: a PEM public key ('-----BEGIN PUBLIC KEY-----'), one JWK (JSON), or a whole JWKS document (JSON with a 'keys' list; the token's kid picks the key). Public keys only: private keys, shared secrets and URLs are refused.",
                "maxLength": 6000,
                "type": "string"
              },
              "token": {
                "description": "The JWT, three base64url parts separated by dots. A leading 'Bearer ' is ignored. Treat tokens as secrets: this tool does not store the token.",
                "maxLength": 21000,
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "JWT Inspect"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
