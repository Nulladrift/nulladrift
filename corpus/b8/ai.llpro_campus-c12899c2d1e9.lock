                "enum": ["YYYY-MM-DD", "YYYYMMDD"],
                "type": "string"
              },
              "default_client": {
                "description": "Optional client code to use when a name has none (for a folder that holds one client's files).",
                "maxLength": 12,
                "type": "string"
              },
              "default_version": {
                "default": 1,
                "description": "Version to use when a name has none (default 1).",
