        {
          "name": "change_witness",
          "title": "Signed, dated receipt for a stated passing staged check before a shared layer; lookup by fingerprint",
          "description": "Get a signed, dated receipt that you stated a passing staged check for a change before it reached a shared layer. Send the change fingerprint (sha256 of the release artifact or config), the check you ran (name, result pass, sha256 of the check log) and the shared layer it is about to reach; LLPRO signs that it received these values at that time. A record needs fingerprint, check and layer. Later, {\"action\": \"lookup\", \"fingerprint\": ...} returns the stored signed records for that fingerprint. Does not run the check, see the code, say the change is safe or when it went out; the record does not name the sender and anyone who knows a fingerprint can record or look it up. Stores only the hashes and the signed record, 400 days. Free: 20 records a day per caller; paid records past that are staged on test money, not charging. Lookups are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "record (default; needs check and layer): witness a stated passing check. lookup: list the stored records for a fingerprint.",
                "enum": ["record", "lookup"],
                "type": "string"
              },
              "check": {
                "additionalProperties": false,
                "description": "For record (required): the staged check you ran.",
                "properties": {
                  "log_sha256": {
                    "description": "sha256 of the check log, 64 hex characters. Send the hash, never the log.",
                    "pattern": "^\\s*(sha256:)?[0-9a-fA-F]{64}\\s*$",
                    "type": "string"
                  },
                  "name": {
                    "description": "Check name, like staging-smoke or canary-5pct (letters, digits, spaces, . _ : / + # = -; no links). Public to anyone with the fingerprint.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "result": {
                    "description": "Only a passing check is recorded; any other result is refused and nothing is stored.",
                    "enum": ["pass"],
                    "type": "string"
                  }
                },
                "required": ["log_sha256", "name", "result"],
                "type": "object"
              },
              "fingerprint": {
                "description": "sha256 of the release artifact or config, 64 hex characters (a 'sha256:' prefix is fine).",
                "pattern": "^\\s*(sha256:)?[0-9a-fA-F]{64}\\s*$",
                "type": "string"
              },
              "layer": {
                "description": "For record (required): the shared layer the change is about to reach, like prod-config or global-edge. Public to anyone with the fingerprint.",
                "maxLength": 80,
                "type": "string"
              },
              "offset": {
                "description": "For lookup: skip this many records (oldest first, 20 per answer).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["fingerprint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
