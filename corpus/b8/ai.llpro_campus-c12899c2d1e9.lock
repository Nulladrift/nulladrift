                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "category", "close_date", "deal", "stage"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "description": "Optional label for the forecast, e.g. 'Q1 West' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "period_end": {
                "description": "Optional: count only deals closing on or before this date.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "period_start": {
                "description": "Optional: count only deals closing on or after this date.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["deals"],
            "type": "object"
          },
