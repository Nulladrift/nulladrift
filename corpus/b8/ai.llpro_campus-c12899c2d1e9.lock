          },
          "digest": "sha256:1697ddef969697fff4185dc4835391b181372c245552054de117094b972c3e5d"
        },
        {
          "name": "find_tool",
          "title": "Find the right LLPRO tool for a job",
          "description": "Search all LLPRO tools (about 250: facts, web pages, documents, finance, compliance, trust and records) by what you want done, in plain words. Returns up to 10 matching tools: name, what it does, its input fields and an example call. Free, no sign-up, nothing stored. Example: {\"query\": \"check a vendor invoice for duplicates\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many tools to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The job in a few plain words, e.g. 'late fee on an invoice' or 'is this VAT number valid'.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the right LLPRO tool for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54ae4798c3df1f7e3bb9a5476b9b08355b5fd0d55b1b77d668bf76415fa449d7"
        },
        {
          "name": "ground_truth_ask",
          "title": "Ask a public fact",
          "description": "Get a current public fact for any place, with its source link and time: weather, weather alerts, river levels, floods, earthquakes, disasters, air quality. Free daily quota. Example: {\"topic\": \"weather\", \"place\": \"Austin, Texas\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/ground-truth",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "max_age_minutes": {
                "description": "Mark answers older than this as stale",
                "type": "number"
              },
              "place": {
                "description": "Any place name, e.g. 'Lafayette' or 'Lagos, Nigeria'; or use lat+lon",
                "type": "string"
              },
              "topic": {
                "description": "One of: weather, weather_alerts, river_level, flood, earthquakes, disasters, air_quality, road_closures, power_outages, burn_ban (or give free text in q and the topic is guessed). Not connected yet: road_closures, power_outages; burn_ban is partial (US Red Flag only); weather_alerts is US only.",
                "enum": ["weather", "weather_alerts", "river_level", "flood", "earthquakes", "disasters", "air_quality", "road_closures", "power_outages", "burn_ban"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask a public fact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c046a18393dd9c3c326788f49418d4aa4ca5dcf37d1e78d07978a4a14d22e02"
        },
        {
          "name": "human_check_ask",
          "title": "Ask a person to check something",
          "description": "Signed human sign-off for agents: verified person, signed answer, public record. Expert review $5, licensed sign-off $25; start with a $2 check. Ask a person to check something an agent can't be sure of: an invoice, a document, a business. Signed answer back; first 3 free. Example: {\"question\": \"Do the line items add up to the invoice total?\", \"context\": \"Labor $450; Parts $212.50; Total $662.50\", \"answer_type\": \"yes_no\"}. Docs: https://llpro.ai/human-check",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Your secret LLPRO agent key. With an Assisted or Done for you plan, the check is billed to the plan.",
                "type": "string"
              },
              "answer_type": {
                "description": "yes_no (default), choice or text.",
                "enum": ["yes_no", "choice", "text"],
                "type": "string"
              },
              "callback_url": {
                "description": "Public https address; the signed answer is posted there when it's ready.",
                "type": "string"
              },
              "check_type": {
                "description": "expert_review: one qualified domain expert reviews the item, sealed ($5). licensed_signoff: a vetted licensed contractor reviews and signs inside their licence ($25). To start: general (default, $2 a check, first 3 free), invoice_match, document_check, business_verify. human_task: a person does one phone or remote task up to 10 minutes and writes what happened ($10).",
                "type": "string"
              },
              "context": {
                "description": "What the reviewer needs to see: the text, numbers or details to check.",
                "maxLength": 6000,
                "type": "string"
              },
              "files": {
                "items": {
                  "properties": {
                    "content_type": {
                      "type": "string"
                    },
                    "data": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "options": {
                "description": "The choices, when answer_type is choice.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "question": {
                "description": "One clear question a person can answer in a few minutes.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a person to check something"
          },
          "behavior": {
