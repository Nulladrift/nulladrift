        {
          "name": "sms_segment_count",
          "title": "SMS Segment Counter",
          "description": "Count how many SMS segments a text message will use before you send it, which sets what most SMS providers bill. Send the message text exactly as it will go out. Get back the encoding (GSM-7 or UCS-2), the characters, the 7-bit or 16-bit units, the segment count and the limit per segment (160/153 for GSM-7, 70/67 for UCS-2), where each segment starts and ends, every character that forces UCS-2 (with its code point and name, such as a curly apostrophe or an emoji), and the GSM characters that take two units (such as the euro sign and square brackets). Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/sms-segment-count). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "encoding": {
                "default": "auto",
                "description": "'auto' (default): GSM-7 when every character is in the GSM 7-bit alphabet, otherwise UCS-2. 'ucs2': count as UCS-2 even if every character is GSM (some senders always send UCS-2).",
                "enum": ["auto", "ucs2"],
                "type": "string"
              },
              "message": {
                "description": "The SMS text exactly as it will be sent (1 to 2,000 characters; spaces and line breaks count). Used only to count; never stored or echoed back as a whole.",
                "maxLength": 2000,
                "type": "string"
              },
              "reference_bits": {
                "default": "8",
                "description": "Concatenation header your sender uses for long messages: '8' (8-bit reference number, 6-byte header, the common one) or '16' (16-bit reference, 7-byte header). Default 8.",
                "enum": ["8", "16"],
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SMS Segment Counter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
