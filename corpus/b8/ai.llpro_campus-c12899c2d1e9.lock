                      "type": "string"
                    },
                    "line": {
                      "description": "Your line label, e.g. '1' or 'A'. No names or ID numbers.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "unit": {
                      "description": "The unit of quantity you will report, e.g. 'No.', 'prs.', 'kg', 'doz.'.",
                      "maxLength": 24,
                      "type": "string"
                    }
                  },
                  "required": ["hts"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array",
                "x-llpro-sensitive": true
              }
            },
            "required": ["entry", "lines"],
            "type": "object"
          },
          "annotations": {
