              },
              "payments": {
                "description": "Number of equal monthly payments (the term in months).",
                "maximum": 120,
                "minimum": 2,
                "type": "integer"
              },
              "prepay_after_payment": {
                "description": "Optional: pay off the loan right after this many payments have been made (0 = at once); gives the unearned interest and the payoff.",
