                  },
                  "no_send": {
                    "type": "boolean"
                  },
                  "no_share": {
                    "type": "boolean"
                  },
                  "no_spend": {
                    "type": "boolean"
                  },
                  "no_web": {
                    "type": "boolean"
                  },
                  "place": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "playbook": {
                    "enum": ["research", "selling", "hiring", "bookkeeping", "outreach", "support"],
