        },
        {
          "name": "pay_period_calendar",
          "title": "Pay Period Calendar (US Holidays)",
          "description": "Build a year's payroll calendar: every pay period and pay date for a weekly, biweekly, semimonthly or monthly schedule, with pay dates that fall on a weekend or a US federal holiday moved to the business day before (or after, if you choose). Send the year, the frequency, how many days after the period ends you pay, and for weekly or biweekly one period end date from your schedule. Holidays follow 5 U.S.C. 6103 as federal offices observe them (Saturday holiday on the Friday before, Sunday holiday on the Monday after) or, if you pay by direct deposit, as the Federal Reserve Banks do (a Saturday holiday is not moved). Get back each period's start and end, the scheduled and actual pay date with the reason it moved, the number of pay dates in the year, and the holidays used. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/pay-period-calendar). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frequency": {
                "description": "Pay frequency. Semimonthly periods are the 1st-15th and 16th-last day; monthly periods are calendar months.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly"],
                "type": "string"
              },
              "holidays": {
                "default": "federal_offices",
                "description": "federal_offices: 5 U.S.C. 6103 holidays with Saturday ones on Friday and Sunday ones on Monday. federal_reserve_banks: the same holidays, Sunday ones on Monday, Saturday ones not moved (banks open the Friday before).",
                "enum": ["federal_offices", "federal_reserve_banks"],
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'hourly staff' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "move_to": {
                "default": "previous_business_day",
                "description": "Where a pay date that falls on a weekend or holiday goes (default the business day before).",
                "enum": ["previous_business_day", "next_business_day"],
                "type": "string"
              },
              "pay_days_after_period_end": {
                "default": 0,
                "description": "Calendar days from the end of a period to its scheduled pay date (0 = pay on the last day of the period; default 0).",
                "maximum": 31,
                "minimum": 0,
                "type": "integer"
              },
              "period_end": {
                "description": "Weekly or biweekly only (required there): the last day of any one pay period in your schedule, YYYY-MM-DD; every other period is a whole number of weeks or two-week steps from it.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
