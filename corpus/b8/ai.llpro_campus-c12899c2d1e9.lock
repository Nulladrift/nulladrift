          "description": "Make a QR code that never expires. Send ONE of: text (plain text, or a link), url (a link), or stamp_id (a Countersign stamp id, so the printed code opens that stamp's verify page). Get back the code as SVG and PNG, plus a signed, dated record of exactly what was made. Free, no sign-up, 500 codes a day per caller. Size: up to 300 characters, and at most 271 bytes at level L, 213 at M, 151 at Q, 119 at H. The code is static: it holds the text itself, goes through no LLPRO server when scanned, cannot be switched off and is never counted. We store nothing; the signed record holds a salted hash, not your text. Links to private, local or unresolvable addresses are refused; this is an address check, not a phishing or malware check. No tracking, no short links, no logos, no styling.",
