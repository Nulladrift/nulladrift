        {
          "name": "handoff_record",
          "title": "When a long run stops to ask a human, record the question, the answer and who approved it as one signed, dated record",
          "description": "A long-running agent stopped and asked a human. Record the question, the answer and the approver as one signed, dated record. Send the question (run_id, agent_id, asked_at, text; optionally signed by the agent's key) and the answer (the same run_id, question_hash = SHA-256 of the canonical question, decision approve, deny or answer, text, approver_id, approver_key, answered_at, sig by the approver's Ed25519 key). Optionally send expected_approver / expected_agent (public keys you trust). Get back valid or invalid, every check with pass or fail, and a record signed by LLPRO with the time we saw it, checkable offline. We do not keep the documents you send. It does not show who the approver is, that they saw the question as written, or that answered_at is true. Free.",
          "inputSchema": {
            "properties": {
              "answer": {
                "properties": {
                  "answer": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "answered_at": {
                    "description": "UTC time like 2026-11-12T09:05:00Z",
                    "type": "string"
                  },
                  "approver_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "approver_key": {
                    "description": "the approver's Ed25519 public key, 32 bytes, canonical base64",
                    "type": "string"
                  },
                  "decision": {
                    "enum": ["approve", "deny", "answer"],
                    "type": "string"
                  },
                  "question_hash": {
                    "description": "SHA-256 (hex) of the canonical JSON of the question without sig",
                    "pattern": "^[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "run_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "sig": {
                    "description": "approver signature over the canonical JSON of the answer without sig",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["handoff-answer"],
                    "type": "string"
                  },
                  "v": {
                    "enum": [1],
                    "type": "integer"
                  }
                },
                "required": ["answer", "answered_at", "approver_id", "approver_key", "decision", "question_hash", "run_id", "sig", "type", "v"],
                "type": "object"
              },
              "expected_agent": {
                "description": "the agent public key you expect; if it differs (or the question is unsigned) the record is invalid",
                "type": "string"
              },
              "expected_approver": {
                "description": "the approver public key you expect; if it differs the record is invalid",
                "type": "string"
              },
              "question": {
