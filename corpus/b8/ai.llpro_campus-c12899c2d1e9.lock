        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Free signed receipt for work you are about to rely on or hand on. Send the text of a report, calculation, summary, filing draft or code; Countersign re-computes the arithmetic, looks up quoted values in the cited sources, opens links and parses code, and returns a signed stamp (pass, fail or inconclusive) that says exactly what is wrong, with time and method. Anyone can check the stamp in one call. It never checks work it produced. Example: {\"output\": \"Total: 12 * 4 = 48\", \"producer\": {\"agent_id\": \"my-agent\", \"model\": \"my-model\"}} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
