        {
          "name": "late_fee_calculator",
          "title": "Late Fee and Interest Calculator",
          "description": "Work out the late charges on an unpaid or late-paid invoice from the contract terms you send: a flat fee, a one-time percent of the amount due, simple interest per day at a yearly rate (actual/365 or actual/360), a grace period, and a cap in money or as a percent of the amount due. Send the amount due, the due date and the date paid (or the date to work the charges to). Get back the days late, whether the grace period covers it, the fee, the interest, the total before and after the cap, and the amount owed in all. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/late-fee-calculator). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_due": {
                "description": "The amount that was due on the due date (the late charges are worked on it).",
                "maximum": 1000000000,
                "minimum": 0.01,
                "type": ["number", "string"]
              },
              "annual_interest_percent": {
                "description": "Simple interest at this yearly rate (18 for 18% a year; a contract's 1.5% a month is 18 a year only if the contract charges it by the day).",
                "maximum": 100,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "as_of_date": {
                "description": "The date paid, or the date to work the charges to, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "cap_amount": {
                "description": "Optional cap on all late charges together, in money.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "cap_percent": {
                "description": "Optional cap on all late charges together, as a percent of the amount due.",
                "maximum": 100,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "day_count": {
                "default": "actual/365",
                "description": "Interest day count: actual days over 365 (default) or over 360.",
                "enum": ["actual/365", "actual/360"],
                "type": "string"
              },
              "due_date": {
                "description": "The date payment was due, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "flat_fee": {
                "description": "A one-time flat late fee (for example 25.00).",
                "maximum": 1000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "grace_days": {
                "default": 0,
                "description": "Days after the due date before any late charge applies (default 0).",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "interest_from": {
                "default": "due_date",
                "description": "Interest runs from the due date (default) or from the end of the grace period.",
                "enum": ["due_date", "end_of_grace"],
                "type": "string"
              },
              "label": {
                "description": "Optional label for the invoice (your own text, echoed back; not a person; up to 6 digits in a row).",
                "maxLength": 40,
                "type": "string"
              },
              "percent_fee": {
                "description": "A one-time late fee as a percent of the amount due (5 for 5%).",
                "maximum": 50,
                "minimum": 0,
                "type": ["number", "string"]
              }
            },
            "required": ["amount_due", "as_of_date", "due_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
