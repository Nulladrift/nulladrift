        {
          "name": "past_due_chaser_for_distributor",
          "title": "Past-due chaser for distributor trade credit: statement, disputes held back, promise-to-pay status and the next chase step, with bankruptcy stops (signed)",
          "description": "Past-due chaser for a distributor's trade credit (business customers only), one customer account per call. Send the as-of date, the open invoices (invoice code, due date, open amount; credits as negative amounts), the disputes the customer raised (invoice, amount, reason, date opened, status), its promises to pay (date made, pay-by date, amount) and the payments received. Get back a statement (each invoice's days past due, aging bucket, amount held by disputes and undisputed amount, with totals), each promise judged kept, partly kept, broken, pending or in grace, each dispute's age, the next chase step under a written cadence (reminder, statement and call, second notice, final notice and credit hold, a person decides on collection), worked after credits and escalated for broken promises, and issues marked fix, ask or check. If the customer has filed for bankruptcy, the step is to stop collecting claims from before the filing (automatic stay, 11 U.S.C. 362(a)(6)), and the payments and deliveries around the filing date are listed for counsel. Codes, dates, amounts and fixed choices only: no names, no notes. It sends nothing. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/past-due-chaser-for-distributor). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "Your customer account code (optional). Not a name, phone, tax or bank number: all-digit codes of 9 to 11 digits are refused.",
                "maxLength": 40,
                "type": "string",
                "x-llpro-sensitive": true
              },
              "as_of": {
                "description": "The statement date, YYYY-MM-DD. Days past due are counted to this date.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "bankruptcy_filed_on": {
                "description": "The date the customer filed a bankruptcy petition, if it has (optional).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "credit_limit": {
                "description": "The customer's credit limit (optional). Over it, the answer says hold new orders on credit.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "disputes": {
                "default": [],
                "description": "Disputes the customer raised, up to 100.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount disputed.",
                      "maximum": 1000000000,
                      "minimum": 0.01,
                      "type": ["number", "string"]
                    },
                    "invoice": {
                      "description": "The invoice code the dispute is about.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "opened_on": {
                      "description": "Date the customer raised it.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why the customer disputes it.",
                      "enum": ["pricing", "quantity_short", "damaged", "not_received", "wrong_item", "returned", "duplicate_billing", "terms", "quality", "other"],
                      "type": "string"
                    },
                    "status": {
                      "default": "open",
                      "description": "open (the amount is held from chasing); resolved_credit (you agreed to credit it and the credit memo is not in the open items yet: the amount stays held and you are told to issue the memo; once the memo is in the open items as a negative amount, leave this dispute out); resolved_customer_pays (the amount is owed again).",
                      "enum": ["open", "resolved_credit", "resolved_customer_pays"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "invoice", "opened_on", "reason"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 0,
                "type": "array",
                "x-llpro-sensitive": true
              },
              "grace_days": {
                "default": 0,
                "description": "Days after the due date before an invoice is chased, and after a pay-by date before a promise is called broken (0 to 30, default 0).",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "invoices": {
                "description": "The account's open items, up to 200.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "delivered_on": {
                      "description": "Date the customer received the goods (optional; used only when the customer has filed for bankruptcy).",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "due_date": {
                      "description": "Due date, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "invoice": {
                      "description": "Your invoice or credit memo code (unique in this call).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "open_amount": {
                      "description": "Amount still open; an unapplied credit or payment as a negative amount.",
                      "maximum": 1000000000,
                      "minimum": -1000000000,
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["due_date", "invoice", "open_amount"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array",
                "x-llpro-sensitive": true
              },
              "payments": {
                "default": [],
                "description": "Payments received from this customer (used to judge promises and, after a bankruptcy filing, the lists for counsel), up to 200.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount received.",
                      "maximum": 1000000000,
                      "minimum": 0.01,
                      "type": ["number", "string"]
                    },
                    "received_on": {
                      "description": "Date received.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "received_on"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array",
                "x-llpro-sensitive": true
              },
              "promises": {
                "default": [],
                "description": "Promises to pay the customer made, up to 50, each once.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount promised.",
                      "maximum": 1000000000,
                      "minimum": 0.01,
                      "type": ["number", "string"]
                    },
                    "made_on": {
                      "description": "Date the promise was made.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "pay_by": {
                      "description": "Date the customer said it would pay by.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "made_on", "pay_by"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 0,
                "type": "array",
                "x-llpro-sensitive": true
              }
            },
            "required": ["as_of", "invoices"],
            "type": "object"
          },
