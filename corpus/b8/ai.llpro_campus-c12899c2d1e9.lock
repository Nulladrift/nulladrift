                    "description": "Up to 6 lines (list of strings, or one string with line breaks), 80 characters each."
                  },
                  "contact": {
                    "description": "An email address or phone number. No web addresses.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "tax_id": {
                    "description": "Printed as given. Not checked.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "tax_lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "A fixed tax amount instead of a rate (0 or more)."
                    },
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "rate_percent": {
                      "description": "0 to 100, up to 4 decimal places, applied to the subtotal. Your number, not ours."
                    }
                  },
                  "required": ["label"],
