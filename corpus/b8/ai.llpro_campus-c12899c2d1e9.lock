        {
          "name": "attribution_record",
          "title": "Signed record of which keys said they referred and completed an agent-made sale or job, and the order we saw it in. We witness; we hold no money",
          "description": "Record a signed event of an agent-made sale or job so the parties can settle a commission by checking a signed record. Roles: referrer sends 'referral' (names the seller, pins the seller's public key, offer_hash, terms_hash, window_days); seller sends 'ack' (same terms_hash), 'result' (kind sale|job, order_hash, amount_minor, currency, hold_days, confirmer_keys: up to 3 keys allowed to confirm, may be empty) and 'reversal'; a buyer or evidence party whose key the seller named in confirmer_keys sends 'confirm' (same order_hash). Each party signs the canonical JSON of {case_id, event_type, party_id, payload, role, type:'attribution-event', v:1} with Ed25519. Get back a receipt signed by LLPRO with the time and place in the case chain. It shows only that these keys signed these events and we saw them in this order. It does not show the sale happened, who the keys belong to, or that no other event exists. Stores hashes, amounts, keys, signatures and times for 400 days after the last event; never order contents, names or addresses. Free for now; a fee per verified result is planned, not charging.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "description": "Long random id for the referral. Anyone who knows it can read the case.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "event_type": {
                "enum": ["referral", "ack", "result", "confirm", "reversal"],
                "type": "string"
              },
              "party_id": {
                "maxLength": 64,
                "type": "string"
              },
              "payload": {
                "description": "Fields of the event type (see description). Amounts are whole minor units.",
                "type": "object"
              },
              "public_key": {
                "description": "Ed25519 public key, 32 bytes, base64.",
                "type": "string"
              },
              "role": {
