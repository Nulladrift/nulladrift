        {
          "name": "lead_score_rules",
          "title": "Rule-Based Lead Score",
          "description": "Score sales leads with your own weighted rules and see each rule's points. Send the leads (your record code plus any of job title, company size, source and last activity date) and the rules: title or source contains or equals some words, company size or days since last activity at least, at most or between two numbers, each with its points (negative to subtract). Send as_of when a rule uses days since activity, and a threshold if you want each lead marked as meeting it. Get back every lead's total, the points from each rule that matched, the leads ranked highest first, and which rules could not be checked because a value was missing. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/lead-score-rules). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Date to count days since last activity from, YYYY-MM-DD (needed when a rule uses days_since_activity).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "label": {
                "description": "Optional label for the run (your own text, echoed back; not a person).",
                "maxLength": 40,
                "type": "string"
              },
              "leads": {
                "description": "Leads to score (up to 200).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company_size": {
                      "description": "Number of employees at the lead's company.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "last_activity_date": {
                      "description": "Date of the lead's last activity (visit, reply, form), YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "lead_id": {
                      "description": "Your CRM record code for the lead (not a name, email or phone).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "source": {
                      "description": "Lead source, for example referral, webinar, paid search.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "title": {
                      "description": "Job title, for example VP of Sales (not a name).",
                      "maxLength": 80,
                      "type": "string"
                    }
                  },
                  "required": ["lead_id"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "rules": {
                "description": "Scoring rules (up to 50), applied to every lead.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "What the rule looks at: title, source, company_size or days_since_activity.",
                      "enum": ["title", "source", "company_size", "days_since_activity"],
                      "type": "string"
                    },
                    "max": {
                      "description": "Upper bound (at_most, between), inclusive.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "min": {
                      "description": "Lower bound (at_least, between), inclusive.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "points": {
                      "description": "Points added when the rule matches (negative to subtract).",
                      "maximum": 1000,
                      "minimum": -1000,
                      "type": "integer"
                    },
                    "test": {
                      "description": "contains or equals (title, source); at_least, at_most or between (company_size, days_since_activity).",
                      "enum": ["contains", "equals", "at_least", "at_most", "between"],
                      "type": "string"
                    },
                    "text": {
                      "description": "Words to look for (contains, equals), for example vp or referral.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["field", "points", "test"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "threshold": {
                "description": "Optional: score at or above which a lead meets your bar (for example a marketing-qualified lead).",
                "maximum": 100000,
                "minimum": -100000,
                "type": "integer"
              }
            },
            "required": ["leads", "rules"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
