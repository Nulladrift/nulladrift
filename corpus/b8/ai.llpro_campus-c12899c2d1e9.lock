                  },
                  "run_id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "sig": {
                    "description": "optional: agent signature over the canonical JSON of the question without sig",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["handoff-question"],
                    "type": "string"
                  },
                  "v": {
                    "enum": [1],
                    "type": "integer"
                  }
                },
                "required": ["agent_id", "asked_at", "question", "run_id", "type", "v"],
                "type": "object"
              }
            },
            "required": ["answer", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
