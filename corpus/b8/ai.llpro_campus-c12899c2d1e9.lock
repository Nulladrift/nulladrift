          "name": "tank_car_demurrage_invoice_check",
          "title": "Check a railroad tank car demurrage invoice against your own terms",
          "description": "Tank car demurrage invoice check for chemical shippers and receivers. Send the demurrage terms from your tariff or contract (free_hours, daily_rates for day 1, 2, 3 ... of charge, period_rule) and per car when it was placed and released (YYYY-MM-DD HH:MM, one clock), any excused_hours, and optionally the invoiced_amount. Get back per car the elapsed time, the free time applied, the days charged and the charge the terms give, with the working. With invoiced_amount you get match or differs to the cent, the difference, and which single other reading of the terms (part-days counted or not, calendar days, excused hours ignored, escalating rates ignored, a different free time) would reproduce the invoiced figure. Answer fields: verdict, summary, cars (in your order), reproduced_by, sources, rule, observation, signature; all money is text. Errors: ok false with a message (400 bad input, 413 too large, 429 hourly limit). Free. No model, no network, no request contents stored, signed record. Up to 100 cars per call. Labels are your own text: emails, web addresses and long digit runs in the shipment label are refused; do not send names or account numbers. It does not read your tariff and is not legal or freight-claims advice; your tariff decides.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cars": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excused_hours": {
                      "description": "Hours that do not count against you (railroad delay, an outage, an agreed extension); added to the free time. 0 to 99999.99, at most 2 decimals. Default 0.",
                      "maximum": 99999.99,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "invoiced_amount": {
                      "description": "To audit: the demurrage amount the railroad invoiced for this car, 0 to 1,000,000,000,000, at most 2 decimals.",
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "label": {
                      "description": "Your own label for the car (a car mark and number is fine).",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "placed": {
                      "description": "When the car was placed (or became chargeable): YYYY-MM-DD HH:MM, or YYYY-MM-DD for 00:00. One clock for every time you send.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2})?$",
                      "type": "string"
                    },
                    "released": {
                      "description": "When the car was released, same format, not before placed.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2})?$",
                      "type": "string"
                    }
                  },
                  "required": ["placed", "released"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "shipment_label": {
                "description": "Your own label for the invoice or shipment (not a person).",
                "maxLength": 80,
                "type": "string"
              },
              "terms": {
                "additionalProperties": false,
                "properties": {
                  "daily_rates": {
                    "description": "Charge for the 1st, 2nd, 3rd ... day of demurrage, in order; the last rate repeats for every later day. One entry means a flat daily rate. At most 2 decimals; text keeps it exact.",
                    "items": {
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  },
                  "free_hours": {
                    "description": "Free time in hours per car before demurrage starts, 0 to 99999.99 (e.g. 48).",
                    "maximum": 99999.99,
                    "minimum": 0,
                    "type": ["number", "string"]
                  },
                  "period_rule": {
                    "description": "any_part_of_a_day (default): a started 24-hour period after free time counts as a day. full_days_only: only completed 24-hour periods count.",
                    "enum": ["any_part_of_a_day", "full_days_only"],
                    "type": "string"
                  }
                },
                "required": ["daily_rates", "free_hours"],
                "type": "object"
              },
              "tolerance": {
                "description": "Largest difference in money that still counts as a match, 0 to 1, at most 2 decimals (default 0.01).",
                "maximum": 1,
                "minimum": 0,
                "type": ["number", "string"]
              }
            },
            "required": ["cars", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a railroad tank car demurrage invoice against your own terms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac6a174e798114cd586b14bc8d8c15ac5233daef9c857945e8dd491fe62d268d"
        },
        {
          "name": "transaction_audit",
          "title": "Check a finished deal between two parties from its signed evidence. Signed result",
          "description": "Audit a finished deal between two parties from its signed evidence. Send parties (two ids with Ed25519 public keys, roles buyer and seller) and events (offer, accept, payment, delivery, confirm, dispute; each signed by the party that made it, each answering an earlier one by hash). Get back a verdict (complete, partial, inconsistent, invalid or disputed), every check with pass or fail, and a signed record anyone can verify. It shows the evidence is consistent and was signed by those keys. It does not show money moved, goods arrived or who the parties are. Free; nothing stored.",
          "inputSchema": {
            "properties": {
              "events": {
                "items": {
                  "properties": {
                    "at": {
                      "description": "UTC time, e.g. 2026-11-11T18:00:00Z",
                      "type": "string"
                    },
                    "body": {
                      "type": "object"
                    },
                    "by": {
                      "type": "string"
                    },
                    "ref": {
                      "description": "SHA-256 (hex) of the signed content of the event this one answers; absent on an offer",
                      "type": "string"
                    },
                    "sig": {
                      "description": "base64 Ed25519 signature over the canonical JSON of {type,by,at,ref,body} (ref left out when absent)",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["offer", "accept", "payment", "delivery", "confirm", "dispute"],
                      "type": "string"
                    }
                  },
                  "required": ["at", "body", "by", "sig", "type"],
                  "type": "object"
                },
                "maxItems": 40,
                "type": "array"
              },
              "parties": {
                "items": {
                  "properties": {
                    "id": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "public_key": {
                      "description": "Ed25519 public key, 32 bytes, base64",
                      "type": "string"
                    },
                    "role": {
                      "enum": ["buyer", "seller"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "public_key", "role"],
                  "type": "object"
                },
                "maxItems": 2,
                "type": "array"
              }
            },
            "required": ["events", "parties"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a finished deal between two parties from its signed evidence. Signed result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d520497e572f0860741875ca5ba0e4dbbfeef633b9f82f0a26e6b41f05ef55b8"
        },
        {
          "name": "underpayment_audit_compare",
          "title": "Compare payer remits to contract rates",
          "description": "Compare commercial payer remits to your contract rates and list the underpayments. Send contract_rates (code, optional 2-character modifier, rate per unit in US dollars) and remit_lines (your own line_id, code, optional modifier, units, paid, optional patient_responsibility or the payer's allowed amount). Get back, per line, expected vs actual and the shortfall, totals in cents, the sources (your two lists, with the labels and dates you gave) and a signed record. Free. Arithmetic only: no model, no outside lookup, nothing stored. Up to 200 rates and 200 lines per call. Do NOT send patient names, dates of birth or member, account or record numbers: only your own row numbers as line_id. It does not read contracts, assign codes, or give billing, coding or legal advice, and it cannot say a payer is wrong, only that the numbers differ from the table you supplied.",
          "inputSchema": {
            "properties": {
              "contract_effective_date": {
                "description": "Optional date the rates took effect (YYYY-MM-DD), echoed back.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "contract_label": {
                "description": "Optional name of the contract, echoed back as a source.",
                "maxLength": 80,
                "type": "string"
              },
              "contract_rates": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "CPT or HCPCS code (5 characters).",
                      "pattern": "^[A-Za-z0-9]{5}$",
                      "type": "string"
                    },
                    "modifier": {
                      "description": "Optional modifier. A rate with no modifier is the default for the code.",
                      "pattern": "^[A-Za-z0-9]{2}$",
                      "type": "string"
                    },
                    "rate": {
                      "description": "Contract allowed amount per unit, US dollars.",
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["code", "rate"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "remit_label": {
                "description": "Optional name of the remit batch, echoed back as a source.",
                "maxLength": 80,
                "type": "string"
              },
              "remit_lines": {
                "items": {
                  "properties": {
                    "allowed": {
                      "description": "The payer's stated allowed amount; if given it is used instead of paid + patient_responsibility.",
                      "type": ["number", "string"]
                    },
                    "code": {
                      "pattern": "^[A-Za-z0-9]{5}$",
                      "type": "string"
                    },
                    "line_id": {
                      "description": "Your own row label. Not a patient, member, account or record number.",
                      "pattern": "^[A-Za-z0-9_.-]{1,24}$",
                      "type": "string"
                    },
                    "modifier": {
                      "pattern": "^[A-Za-z0-9]{2}$",
                      "type": "string"
                    },
                    "paid": {
                      "description": "Amount the payer paid on the line.",
                      "type": ["number", "string"]
                    },
                    "patient_responsibility": {
                      "description": "Copay, coinsurance and deductible on the line. Default 0.",
                      "type": ["number", "string"]
                    },
                    "units": {
                      "description": "Default 1.",
                      "maximum": 99999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["code", "paid"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "tolerance": {
                "description": "US dollars per line up to and including which a difference is ignored. Default 1.00, at most 1000.",
                "type": ["number", "string"]
              }
            },
            "required": ["contract_rates", "remit_lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare payer remits to contract rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05931a607326342e9b26337b10efafd98c263d5aeb577b7c7ce962535e96e765"
        },
        {
          "name": "vat_number_check",
          "title": "Check one EU VAT number against VIES (valid, not valid, service down; name and address where returned)",
          "description": "Check ONE EU VAT number against the European Commission's official VIES service. Send the number with its two-letter country prefix (DE811128135, IE6388047V) or send country_code separately. Get a verdict (valid, not-valid or service-down) and, where the member state returns them, the registered name and address. Signed and dated, so you can keep it as proof of what VIES said and when. Free, no sign-up, 200 checks a day per caller. Official source only: if VIES or the member state does not answer, the verdict is service-down, never a guess. Not tax advice. One number per call (no lists); nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "Optional two-letter country code (EL or GR for Greece, XI for Northern Ireland) when the number has no prefix.",
                "maxLength": 2,
                "type": "string"
              },
              "vat_number": {
                "description": "One VAT number, usually with its country prefix, e.g. DE811128135 or 'IE 6388047V'. Spaces, dots and hyphens are ignored.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["vat_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check one EU VAT number against VIES (valid, not valid, service down; name and address where returned)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6a9793b5f14296afd082d2e5cafaeee916e7863ea1b50005a276b8086abbac31"
        },
        {
          "name": "waterfall_and_distribution",
          "title": "Calculate or audit a distribution waterfall between investors and sponsor",
          "description": "Waterfall and distribution calculator and audit for syndications and small funds. Send the terms (preferred return percent, simple or compound, carry percent, optional catch-up percent), the capital contributed (date, amount) and the cash distributed (date, amount). Get back, per distribution, the split between investors and sponsor tier by tier, with balances left. Add claimed_investors and claimed_sponsor to a distribution to audit a spreadsheet or administrator's figures: you get match or differ to the cent, whether the claim adds up to the cash, and which other reading of the terms (day count 360 or 365, compounding, no preferred return, catch-up on or off) would reproduce it. Answer fields: verdict, summary, distributions (in your order, each with index, tiers, to_investors, to_sponsor, audit), reproduced_by, sources, rule, observation, signature; all money is text. Errors: ok false with a message (400 bad input, 413 too large, 429 hourly limit). Free. No model, no network, no request contents stored, signed record. Up to 100 contributions and 100 distributions. Use your own labels, not names or account numbers. Not legal, tax, investment or accounting advice; your fund documents decide.",
          "inputSchema": {
            "properties": {
              "contributions": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "At most 2 decimals; text (\"1250.50\") keeps it exact.",
                      "type": ["number", "string"]
                    },
                    "date": {
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "distributions": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Cash distributable on that date.",
                      "type": ["number", "string"]
                    },
                    "claimed_investors": {
                      "description": "To audit: the amount a spreadsheet or administrator says went to the investors (send both claimed fields).",
                      "type": ["number", "string"]
                    },
                    "claimed_sponsor": {
                      "description": "To audit: the amount it says went to the sponsor.",
                      "type": ["number", "string"]
                    },
                    "date": {
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "fund_label": {
                "description": "Your own label for the deal (not a person).",
                "maxLength": 80,
                "type": "string"
              },
              "terms": {
                "properties": {
                  "carry_percent": {
                    "description": "Sponsor's share of profit above the preferred return, 0 to 50 (default 20).",
                    "type": ["number", "string"]
                  },
                  "catch_up_percent": {
                    "description": "0 = no catch-up (default). Otherwise the share of the catch-up tier that goes to the sponsor (e.g. 100 or 50); must be above carry_percent. The tier ends when the sponsor holds carry_percent of all profit paid so far.",
                    "type": ["number", "string"]
                  },
                  "day_basis": {
                    "description": "Days in a year for the preferred return (default 365; actual days elapsed).",
                    "enum": [365, 360],
                    "type": "integer"
                  },
                  "pref_compounding": {
                    "description": "simple: preferred return on unreturned capital only (default). compound: unpaid preferred return also earns it, so investors reach exactly that annual rate of return before the sponsor shares.",
                    "enum": ["simple", "compound"],
                    "type": "string"
                  },
                  "pref_rate_percent": {
                    "description": "Annual preferred return in percent, 0 to 100, at most 2 decimals, e.g. 8.",
                    "type": ["number", "string"]
                  }
                },
                "required": ["pref_rate_percent"],
                "type": "object"
              },
              "tolerance": {
                "description": "Largest difference in money that still counts as a match, 0 to 1 (default 0.01).",
                "type": ["number", "string"]
              }
            },
            "required": ["contributions", "distributions", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate or audit a distribution waterfall between investors and sponsor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a9a4193f15b8f157f3a161ef424d8efb6a8499d3760e701924ee942e7d7cb9c"
        },
        {
          "name": "website_tech_lookup",
          "title": "Look up the technologies a site's home page shows (site builder, shop, analytics, payments, hosting, agent files)",
          "description": "Which technologies does a site's public home page show? Send a domain; we make one https GET of its home page and read the response headers and page source with our own written rules. You get a list of technologies with a category (site builder or CMS, shop platform, analytics, tag manager, payments, framework, hosting or CDN, web server, engagement tools, agent-readable files such as llms.txt or MCP links the page points to), a confidence for each, and a signed, dated observation you can keep as proof of what was seen. Free, no sign-up, 100 lookups a day per caller. Statements are about what the page showed, not what runs behind it. One domain per call (no lists), one fetch, no crawling, no results stored (short-lived rate counters only). This tool exists for agents that find it through MCP registries; it is reached through the Campus gateway (MCP, A2A and REST).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "One bare domain name such as example.com. No scheme, path, port or list.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up the technologies a site's home page shows (site builder, shop, analytics, payments, hosting, agent files)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c63f03b74a104a4beb7c333a2a434286e40ddfb70fd6a733e13025ac5833b9aa"
        },
        {
          "name": "witness_record",
          "title": "An independent witness for a live deal: each party sends the hash of every event as it happens and gets a signed receipt with the time and its place in the chain",
          "description": "Witness a deal event. Send deal_id, party_id, event_type, content_hash (SHA-256 hex of the content, never the content), your Ed25519 public_key and your sig (base64 signature over the canonical JSON of {content_hash, deal_id, event_type, party_id, type:'witness-event', v:1}). Get back a receipt signed by Witness: the time we saw it, its place (seq) in the deal's chain, and the chain hash over the previous receipt. It shows only that this hash was sent by this key and seen at this time, in this order. It does not show the content is true, who the party is, or that nothing else was sent. Stores hashes, types, public keys, signatures and times for 400 days after the deal's last event; never content or addresses. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_hash": {
                "description": "SHA-256 of the event content, lowercase hex.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "deal_id": {
                "description": "Opaque id both parties use for the deal. Use a random one (16+ characters); anyone who knows it can add events to the chain.",
                "maxLength": 64,
                "type": "string"
              },
              "event_type": {
                "description": "Lowercase label such as offer, accept, payment, delivery, confirm.",
                "maxLength": 32,
                "type": "string"
              },
              "party_id": {
                "description": "Opaque id of the sender. Its key is fixed by its first event in the deal.",
                "maxLength": 64,
                "type": "string"
              },
              "public_key": {
                "description": "Ed25519 public key, 32 bytes, base64.",
                "type": "string"
              },
              "sig": {
                "description": "base64 Ed25519 signature over the canonical JSON of the event (see description).",
                "type": "string"
              }
            },
            "required": ["content_hash", "deal_id", "event_type", "party_id", "public_key", "sig"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "An independent witness for a live deal: each party sends the hash of every event as it happens and gets a signed receipt with the time and its place in the chain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a68b233449721e8e31e77626b265d61f9e9800e3851cdd3b0f66560c1bc97923"
        }
      ],
      "digest": "sha256:046d84583cd960d054eeef6b9ad398038daa94c03c7f4a69c9ee0cdad74cd45a"
    }
