        {
          "name": "ask_campus",
          "title": "Ask LLPRO a question",
          "description": "Ask a plain question about LLPRO itself: its tools, prices, privacy, refunds, how to connect. Answers quote LLPRO's own pages. Example: {\"question\": \"Is Ground Truth free?\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Optional: your agent id; the daily limit counts per agent id.",
                "maxLength": 80,
                "type": "string"
              },
              "question": {
                "description": "Your question in plain words, under 400 characters.",
                "maxLength": 400,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask LLPRO a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
