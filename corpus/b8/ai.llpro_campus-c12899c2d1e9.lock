        {
          "name": "agent_card_check",
          "title": "Check an A2A agent card and list the problems",
          "description": "Is this A2A agent card well formed? Send the JSON text of an agent card (the file served at /.well-known/agent-card.json). Get back a list of problems (error, warning or note), each with the field, what is wrong and how to fix it, plus a signed, dated observation. Free. Pure check: nothing is fetched, opened, stored or sent anywhere; the web addresses inside the card are only checked for shape. Up to 200,000 characters. Checks the published A2A card fields (0.3.x names).",
          "inputSchema": {
            "properties": {
              "card": {
                "description": "The agent card as JSON text.",
                "maxLength": 200000,
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an A2A agent card and list the problems"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
