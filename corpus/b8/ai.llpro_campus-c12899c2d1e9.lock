                      "type": "boolean"
                    },
                    "permanent": {
                      "default": false,
                      "description": "true when your schedule keeps this class permanently (no destruction date).",
                      "type": "boolean"
                    },
                    "record_class": {
                      "description": "Your name for the record class, for example 'vendor contracts' (your own text, echoed; not a person's name).",
