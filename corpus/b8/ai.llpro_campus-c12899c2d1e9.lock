        {
          "name": "double_brokering_and_identity",
          "title": "Screen a carrier's DOT or MC number and onboarding packet against the public FMCSA record",
          "description": "Carrier onboarding screen for freight brokers, shippers and factoring companies. Send a USDOT number and/or an MC number, and optionally what the carrier's packet claims (legal name, phone, email, street, city, state, zip). It reads the public FMCSA records and returns what to review before onboarding: not found, inactive, no active authority, a record under 180 days old, an MCS-150 not updated in 730 days, an MC number that belongs to a different DOT number, a claimed name, phone, email or address that is not the one on file, and the same phone or email on other carrier records that are no longer active (how double-brokering and carrier-identity fraud usually shows up in public data). Answer fields: verdict (nothing_to_review, review, incomplete, not_found), checks (each with status and plain detail), review (the short list), record (public fields, phone and email masked), sources with dates, rules, observation, signature; ok false with a message for bad input (400), a source that cannot be reached (502, or verdict incomplete when only the shared-contact lookup failed) or the hourly limit (429). Free for now; paid calls planned at $5 per check, not charging. No model, nothing stored, signed record. It does not say a carrier is a fraud or is safe, and it is not legal, insurance or credit advice.",
          "inputSchema": {
            "properties": {
              "claimed": {
                "description": "What the carrier's packet says; send only what you have. Each field is compared with the public record and not stored.",
                "properties": {
                  "city": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 190,
                    "type": "string"
                  },
                  "legal_name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 24,
                    "type": "string"
                  },
                  "state": {
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  "street": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "zip": {
                    "pattern": "^[0-9]{5}(-[0-9]{4})?$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "dot_number": {
                "description": "USDOT number, digits only, up to 8.",
                "type": ["string", "integer"]
              },
              "mc_number": {
                "description": "MC (docket) number, digits only (an 'MC' prefix is fine), up to 8.",
                "type": ["string", "integer"]
              }
            },
            "type": "object"
          },
          "annotations": {
