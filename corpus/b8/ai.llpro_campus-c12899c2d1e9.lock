                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD, on or after the issue date.",
                "type": "string"
              },
              "issue_date": {
                "description": "YYYY-MM-DD (2000 to 2100).",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "More than 0 and at most 1,000,000, up to 4 decimal places (a number, or text such as \"2.5\")."
                    },
                    "unit_price": {
                      "description": "At most 1,000,000,000 in size, up to 4 decimal places; a line may not exceed 10,000,000,000 and the total 100,000,000,000; may be negative for a credit line (the invoice total may not be negative)."
                    }
