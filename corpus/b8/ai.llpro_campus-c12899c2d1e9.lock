          "description": "Card-skimmer and POS tamper checks for convenience stores, plus which PCI questionnaire (SAQ) your setup points to. Send devices (your own label, kind, last inspection date, and each check marked pass, fail or not_checked), and optionally a payments object with five plain answers about how cards are taken. Get back which devices need attention, which are overdue or incomplete, the suggested SAQ with the reason, the sources with dates and a signed record. Set check_sources true to also ask the PCI Council's public pages which PCI DSS version they name today. Free. No model, nothing stored. Up to 50 devices. Do NOT send card numbers, names or staff details: your own device labels only. It is a checklist and a lookup, not a security audit, a PCI assessment or legal advice; your acquirer decides which form you file.",
