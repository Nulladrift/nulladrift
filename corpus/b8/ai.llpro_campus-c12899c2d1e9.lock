      "serverInfo": {
        "name": "llpro-campus",
        "title": "LLPRO",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Try first: a public fact (weather, earthquakes, air quality, river levels) -> ground_truth_ask; read a web page -> page_to_text; is a website ready for agents -> agent_ready_check; check a piece of work and get a signed stamp -> countersign_stamp; a person must look at something -> human_check_ask; anything else -> find_tool with a few plain words, then use_tool. Free, no sign-up. Free agent key, no sign-up, no email: POST https://llpro.ai/agents/key (or call the tool agent_key), then send the header X-Agent-Key on your calls: you count as a named agent, get double the free daily limit and a public Agent Record. This is the short list; every tool (about 285): /mcp/all. Focused lists: /mcp/trust, /mcp/records, /mcp/finance, /mcp/hub, /mcp/legal, /mcp/tools.",
      "tools": [
        {
          "name": "agent_ready_check",
          "title": "Check whether a website is ready for agents",
          "description": "Check whether a website is ready for AI agents: looks for llms.txt, an agent card and an MCP server card, and says what is missing. Free. Example: {\"domain\": \"example.com\"}. Docs: https://llpro.ai/agent-ready-check",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain name to check, e.g. example.com (a full URL is accepted; only the host name is used).",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether a website is ready for agents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a1c9006a802b8aa22a290ee1cb01c7fe2df6c1302e2e59c204e02f1b7297d723"
        },
        {
          "name": "agentrecord_lookup",
          "title": "Look up an agent or tool",
          "description": "Look up the public record of an agent or MCP server: does it answer, how fast, and its signed delivery record. Free. Example: {\"target\": \"https://llpro.ai/mcp\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
