        {
          "name": "outage_evidence",
          "title": "Signed record of what Dependency Pulse saw for one service in a window, plus your log hashes",
          "description": "A signed record of what Dependency Pulse saw for one service in a time window (up to 7 days back), to keep as evidence for a service-credit claim or a dispute: every reading and state change (the provider's own status words, our timed request results, the rule version), the state carried in, and every gap. Size: about 40 KB for 24 hours (the default) and 220 to 330 KB for 7 days, so ask for the window you need. Optionally send your own failed-call log lines: they are hashed and countersigned as received from you at that time, never as seen by us, and never stored. Does not file a claim, contact a provider or say a credit is owed. Free: 3 records a day per caller; paid records past that are staged on test money, not charging.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Window start, UTC, like 2026-01-31T13:00:00Z; at most 7 days back. Default: 24 hours before 'to' (never more than 7 days back).",
                "type": "string"
              },
              "service": {
                "description": "One Dependency Pulse service id.",
                "enum": ["openai", "anthropic", "google-gemini", "mistral", "groq", "cohere", "perplexity", "openrouter", "aws-us-east-1", "aws-us-west-2", "aws-eu-west-1", "azure", "google-cloud", "cloudflare", "digitalocean", "vercel", "fly-io", "supabase", "google-workspace", "mailgun", "postmark", "twilio", "slack", "stripe", "coinbase", "base-chain", "x402-facilitator", "mcp-registry", "github", "npm"],
                "type": "string"
              },
              "to": {
                "description": "Window end, UTC, like 2026-01-31T15:00:00Z; not in the future. Default and latest: 2 minutes before now (the newest round may still be saving).",
                "type": "string"
              },
              "your_log": {
                "description": "Optional: your own failed-call log lines, one line per item, at most 48,000 bytes as JSON (quotes, backslashes and non-ASCII characters count extra; remove keys and personal data first). Only their sha256 hashes go into the record; the lines are never shown back or stored.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array",
                "x-llpro-sensitive": true
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
