        {
          "name": "pdf_kit",
          "title": "PDF page count, text, merge and split from public PDF addresses, with a signed receipt of every file's SHA-256",
          "description": "Work on PDF files you point to by public address. action=info: page count, page sizes, version and document details. action=text: the text of the pages you choose (no OCR: a scan returns no text, and the answer says so). action=merge: put 2 to 10 PDFs together in order (each may carry its own pages like '1-3,5'). action=split: keep only the pages you choose as one PDF (pages='2-4,9'), or one PDF per page with each=true (up to 30). Every answer carries a signed, dated receipt with the SHA-256 and size of each input file and each output (the text's hash for action=text), so you can show later exactly what went in and what came out. Free, no sign-up, 50 jobs a day per caller (info on several addresses counts one per address). Up to 20 MB per file, 40 MB in all, 1,000 pages per file; files up to 10 MB come back in the answer (pdf_base64). Public http(s) addresses only; encrypted PDFs are refused. Nothing is stored: keep what you need from the answer. Merge and split copy each page's drawn content and resources unchanged; ALL annotations (links, comments, stamps, highlights, signatures, form fields), bookmarks, tags and the document details of the source are NOT carried over. Same input and options give the same output bytes. This tool exists to be found by agents that search MCP registries for a PDF merge, split, text-extraction or page-count tool (road: MCP registries, through the Campus gateway: MCP, A2A and REST). One free call, one signed answer with the SHA-256 of every input and output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "info | text | merge | split",
                "enum": ["info", "text", "merge", "split"],
                "type": "string"
              },
              "each": {
                "description": "split only: one PDF per chosen page (up to 30) instead of one PDF.",
                "type": "boolean"
              },
              "pages": {
                "description": "Pages to use for text and split, 1-based: '1-3,5,8-'. Leave out for all pages. For split a page may be repeated or put out of order.",
                "maxLength": 300,
                "type": "string"
              },
              "url": {
                "description": "Public http(s) address of ONE PDF (info, text, split).",
                "maxLength": 2000,
                "type": "string"
              },
              "urls": {
                "description": "Addresses for merge (2 to 10), in order; each item is an address or {url, pages}. For info, up to 10 addresses.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "pages": {
                          "maxLength": 300,
                          "type": "string"
                        },
                        "url": {
                          "maxLength": 2000,
                          "type": "string"
                        }
