              },
              "request": {
                "properties": {
                  "action": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "amount": {
                    "description": "decimal text above zero",
                    "type": "string"
                  },
                  "currency": {
                    "type": "string"
                  }
                },
                "required": ["action", "amount", "currency"],
                "type": "object"
              },
              "scope": {
                "properties": {
                  "actions": {
                    "items": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "agent": {
                    "description": "id of the agent the scope is for",
                    "maxLength": 128,
                    "type": "string"
                  },
                  "cap": {
                    "properties": {
                      "amount": {
                        "type": "string"
                      },
                      "currency": {
                        "type": "string"
                      }
                    },
                    "required": ["amount", "currency"],
                    "type": "object"
                  },
                  "id": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "max_per_action": {
                    "description": "optional decimal text, same currency",
                    "type": "string"
                  },
                  "not_after": {
                    "description": "UTC end date",
                    "type": "string"
                  },
                  "not_before": {
                    "description": "optional UTC time like 2026-11-11T18:00:00Z",
                    "type": "string"
                  },
                  "principal_key": {
                    "description": "owner's Ed25519 public key, 32 bytes, canonical base64",
                    "type": "string"
                  },
                  "sig": {
                    "description": "base64 Ed25519 signature over the canonical JSON of the scope without sig",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["spend-scope"],
                    "type": "string"
                  },
                  "v": {
                    "enum": [1],
