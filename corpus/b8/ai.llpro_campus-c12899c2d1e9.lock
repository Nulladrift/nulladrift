        {
          "name": "w_3pl_storage_and_handling_invoices",
          "title": "Build or check a 3PL storage and handling invoice from WMS activity",
          "description": "3PL storage and handling invoice built from WMS activity, with an audit trail, for third-party warehouses, the brands that pay them and freight auditors. Send the billing period, the rate card from the warehouse agreement (storage: method daily or split_month, rate, opening_units, which activity types move stock in and out; handling_rates per activity type; optional monthly_minimum) and the activity rows from the WMS export (ref, date, type, qty). Get back the invoice lines (storage, one per handling type, minimum top-up), each with the refs of the rows behind it, a day-by-day storage trail, the rows not billed and why (outside the period, no rate), rows that look like duplicates, and totals. Add invoiced_total to check the 3PL's bill: match or differs to the cent, the difference, and which single other common billing reading (receipt or shipment day not charged, shipments not subtracted, split-month variants, out-of-period rows billed, duplicates billed once, minimum added in full) gives that figure. Answer fields: verdict, lines, totals, storage_trail, checks, reproduced_by, sources, rule, observation, signature; all money is text. Errors: ok false with a message (400 bad input, 413 too large, 429 hourly limit); the campus gateway refuses lists over 200 items, objects over 60 fields, nesting deeper than 6 and text over 20,000 characters before the tool runs, with a plain error message. Free. No model, no network, no request contents stored, signed record. Up to 200 activity rows and 92 days per call. No sales tax. Not legal, tax or accounting advice; your warehouse agreement decides. Labels are your own text: emails, web addresses and runs of 6 or more digits in the invoice label are refused; do not send names of people or account numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activity": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Activity date YYYY-MM-DD. Rows outside the period are listed, not billed.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "qty": {
                      "description": "Quantity in the rate's unit, at most 2 decimals, up to 99,999,999.99.",
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "ref": {
                      "description": "The WMS transaction or document id; unique in the request.",
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._#/-]{0,39}$",
                      "type": "string"
                    },
                    "sku": {
                      "description": "Optional SKU or item label (used only to spot duplicates).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "type": {
                      "description": "Activity type code as on the rate card (lower case, digits, underscore).",
                      "pattern": "^[a-z][a-z0-9_]{0,39}$",
                      "type": "string"
                    }
                  },
                  "required": ["date", "qty", "ref", "type"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "handling_rates": {
                "additionalProperties": {
                  "minimum": 0,
                  "type": ["number", "string"]
                },
                "description": "Rate per unit of quantity for each activity type, e.g. {\"receive_pallet\": 8.5, \"pick_unit\": \"0.35\", \"ship_order\": 2.75}; at most 4 decimals. A storage move type may also carry a handling rate.",
                "maxProperties": 30,
                "propertyNames": {
                  "pattern": "^[a-z][a-z0-9_]{0,39}$"
                },
                "type": "object"
              },
              "invoice_label": {
                "description": "Your own label for the invoice (e.g. 'Client A October 2026'); not a person.",
                "maxLength": 80,
                "type": "string"
              },
              "invoiced_total": {
                "description": "To audit: the total the 3PL billed for these charges before tax, at most 2 decimals.",
                "minimum": 0,
                "type": ["number", "string"]
              },
              "monthly_minimum": {
                "description": "Minimum charge for the period from the agreement; if the charges are lower, a top-up line brings the total to it. Money, at most 2 decimals.",
                "minimum": 0,
                "type": ["number", "string"]
              },
              "period": {
                "additionalProperties": false,
                "properties": {
                  "end": {
                    "description": "Last day billed, YYYY-MM-DD, inclusive; at most 92 days from start. split_month needs exactly one calendar month.",
                    "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                    "type": "string"
                  },
                  "start": {
                    "description": "First day billed, YYYY-MM-DD.",
                    "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "storage": {
                "additionalProperties": false,
                "properties": {
                  "in_types": {
                    "description": "Activity types whose qty adds storage units (e.g. receive_pallet).",
                    "items": {
                      "pattern": "^[a-z][a-z0-9_]{0,39}$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "method": {
                    "description": "daily: rate per unit per day, units on hand each day (a unit counts on the day it arrives and on the day it leaves). split_month: rate per unit per month, opening units and units received on days 1-15 billed a full month, units received from day 16 billed half a month.",
                    "enum": ["daily", "split_month"],
                    "type": "string"
                  },
                  "opening_units": {
                    "description": "Units in storage at the start of the first day, at most 2 decimals. Default 0.",
                    "minimum": 0,
                    "type": ["number", "string"]
                  },
                  "out_types": {
                    "description": "Activity types whose qty removes storage units (e.g. ship_pallet).",
                    "items": {
                      "pattern": "^[a-z][a-z0-9_]{0,39}$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "rate": {
                    "description": "Storage rate per unit (per day for daily, per month for split_month), at most 4 decimals.",
                    "minimum": 0,
                    "type": ["number", "string"]
                  },
                  "unit": {
                    "description": "Name of the storage unit (pallet, bin, carton, cubic foot). Default 'unit'.",
                    "maxLength": 20,
                    "type": "string"
                  }
                },
                "required": ["method", "rate"],
                "type": "object"
              },
              "tolerance": {
                "description": "Largest difference that still counts as a match, 0 to 1, at most 2 decimals (default 0.01).",
                "maximum": 1,
                "minimum": 0,
                "type": ["number", "string"]
              }
            },
            "required": ["activity", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build or check a 3PL storage and handling invoice from WMS activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:696d45ed25e6a894df41bb7668cd78e22e090c4175490eade1b3bf6e2d9b0e51"
        },
        {
          "name": "waterfall_and_distribution",
          "title": "Calculate or audit a distribution waterfall between investors and sponsor",
          "description": "Waterfall and distribution calculator and audit for syndications and small funds. Send the terms (preferred return percent, simple or compound, carry percent, optional catch-up percent), the capital contributed (date, amount) and the cash distributed (date, amount). Get back, per distribution, the split between investors and sponsor tier by tier, with balances left. Add claimed_investors and claimed_sponsor to a distribution to audit a spreadsheet or administrator's figures: you get match or differ to the cent, whether the claim adds up to the cash, and which other reading of the terms (day count 360 or 365, compounding, no preferred return, catch-up on or off) would reproduce it. Answer fields: verdict, summary, distributions (in your order, each with index, tiers, to_investors, to_sponsor, audit), reproduced_by, sources, rule, observation, signature; all money is text. Errors: ok false with a message (400 bad input, 413 too large, 429 hourly limit). Free. No model, no network, no request contents stored, signed record. Up to 100 contributions and 100 distributions. Use your own labels, not names or account numbers. Not legal, tax, investment or accounting advice; your fund documents decide.",
          "inputSchema": {
            "properties": {
              "contributions": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "At most 2 decimals; text (\"1250.50\") keeps it exact.",
                      "type": ["number", "string"]
                    },
                    "date": {
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "distributions": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Cash distributable on that date.",
                      "type": ["number", "string"]
                    },
                    "claimed_investors": {
                      "description": "To audit: the amount a spreadsheet or administrator says went to the investors (send both claimed fields).",
                      "type": ["number", "string"]
                    },
                    "claimed_sponsor": {
                      "description": "To audit: the amount it says went to the sponsor.",
                      "type": ["number", "string"]
                    },
                    "date": {
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "fund_label": {
                "description": "Your own label for the deal (not a person).",
                "maxLength": 80,
                "type": "string"
              },
              "terms": {
                "properties": {
                  "carry_percent": {
                    "description": "Sponsor's share of profit above the preferred return, 0 to 50 (default 20).",
                    "type": ["number", "string"]
                  },
                  "catch_up_percent": {
                    "description": "0 = no catch-up (default). Otherwise the share of the catch-up tier that goes to the sponsor (e.g. 100 or 50); must be above carry_percent. The tier ends when the sponsor holds carry_percent of all profit paid so far.",
                    "type": ["number", "string"]
                  },
                  "day_basis": {
                    "description": "Days in a year for the preferred return (default 365; actual days elapsed).",
                    "enum": [365, 360],
                    "type": "integer"
                  },
                  "pref_compounding": {
                    "description": "simple: preferred return on unreturned capital only (default). compound: unpaid preferred return also earns it, so investors reach exactly that annual rate of return before the sponsor shares.",
                    "enum": ["simple", "compound"],
                    "type": "string"
                  },
                  "pref_rate_percent": {
                    "description": "Annual preferred return in percent, 0 to 100, at most 2 decimals, e.g. 8.",
                    "type": ["number", "string"]
                  }
                },
                "required": ["pref_rate_percent"],
                "type": "object"
              },
              "tolerance": {
                "description": "Largest difference in money that still counts as a match, 0 to 1 (default 0.01).",
                "type": ["number", "string"]
              }
            },
            "required": ["contributions", "distributions", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
