                "type": "boolean"
              },
              "trim_spaces": {
                "default": false,
                "description": "true: spaces, tabs and line breaks at either end of every cell (keys too) are ignored. Default false: they count (RFC 4180 rule 4).",
                "type": "boolean"
              }
            },
            "required": ["after", "before", "key"],
            "type": "object"
          },
