                "type": "string"
              },
              "employment_tax_due_date": {
                "description": "For employment_tax: the due date of the employment tax for the return period the records relate to, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "employment_tax_paid_date": {
                "description": "For employment_tax: the date that tax was paid, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "record_types": {
                "description": "IRS record types to date: general, refund_claim, bad_debt_or_worthless_securities, unreported_income_over_25_percent, no_return_filed, fraudulent_return, employment_tax, property. For property, send the dates of the return for the year you disposed of it.",
                "items": {
                  "description": "",
                  "enum": ["general", "refund_claim", "bad_debt_or_worthless_securities", "unreported_income_over_25_percent", "no_return_filed", "fraudulent_return", "employment_tax", "property"],
