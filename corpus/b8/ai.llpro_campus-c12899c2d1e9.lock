          "title": "Food supplier certificate of analysis and audit certificate check: expired, mismatched, missing record fields, share by supplier and ingredient (signed)",
          "description": "Incoming supplier document check for food makers: send the certificates of analysis (CoA) and audit certificates you received, as fields your agent read from them (type; supplier and ingredient as your own labels; the supplier and ingredient names you expect and as printed on the document; lot received and lot on the CoA; issue, expiry, test, report and audit dates, results in_spec or out_of_spec, whether the lab and method are named). Get each document's issues (expired, expiring soon, supplier, ingredient or lot mismatch, out of spec, CoA record fields missing under 21 CFR 117.475(c)(8), audit dates missing, annual onsite audit overdue under 117.430(b)(1) when you set annual_audit) and the share found expired or mismatched by supplier and by ingredient, with the rule sections and dates read. check_sources true also asks the eCFR whether the four sections were amended since (20 an hour per caller). Signed record. Stores nothing; no model. Free: 120 calls an hour per caller.",
