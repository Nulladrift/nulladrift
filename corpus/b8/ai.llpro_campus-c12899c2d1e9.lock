                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "job_under_3_business_days": {
                "default": false,
                "description": "true when the employment will last less than three business days (receipts are then not acceptable).",
                "type": "boolean"
              },
              "section1_status": {
                "description": "The box the employee checked in Form I-9 Section 1. Required when a Native American tribal document is sent (it decides whether that document counts for List B and List C, or List B only).",
                "enum": ["us_citizen", "noncitizen_national", "lawful_permanent_resident", "noncitizen_authorized_to_work"],
                "type": "string"
              },
              "under_18": {
                "default": false,
                "description": "true when the employee is under 18 (school, medical and day-care records are List B only for them).",
                "type": "boolean"
              }
            },
            "required": ["documents"],
            "type": "object"
          },
