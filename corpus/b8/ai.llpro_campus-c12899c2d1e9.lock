        {
          "name": "http_cache_freshness",
          "title": "HTTP Cache Freshness Check",
          "description": "Work out whether a cached HTTP response is still fresh, per RFC 9111 (HTTP Caching). Send the response header text (Cache-Control, Expires, Date, Age, Last-Modified, ETag; a status line is read if present) and optionally now, response_time and request_time, the status code and whether the cache is private (a browser) or shared (a CDN or proxy). Get back the freshness lifetime and where it came from (s-maxage, max-age, Expires or the heuristic, flagged), the current age worked step by step, fresh or stale with the seconds left or over, whether the response may be stored and reused without revalidation, and the validators available. Nothing is fetched. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/http-cache-freshness). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cache": {
                "default": "private",
                "description": "private (a browser or a single user's client, default) or shared (a CDN, proxy or gateway: s-maxage and private apply).",
                "enum": ["private", "shared"],
                "type": "string"
              },
              "headers": {
                "description": "The response header lines as text, one 'Name: value' per line (an 'HTTP/1.1 200 OK' line first is read for the status). Only Cache-Control, Expires, Date, Age, Last-Modified, ETag and Pragma are read; other lines are ignored and never echoed.",
                "maxLength": 8000,
                "type": "string"
              },
              "now": {
                "description": "The time of the check (UTC, 2026-11-19T10:00:00Z or an IMF-fixdate). Default: the response time (the age when it arrived).",
                "maxLength": 40,
                "type": "string"
              },
              "request_time": {
                "description": "When the request was sent. Default: the response time.",
                "maxLength": 40,
                "type": "string"
              },
              "response_time": {
                "description": "When the response was received. Default: the Date header (no network delay).",
                "maxLength": 40,
                "type": "string"
              },
              "status": {
                "description": "The response status code, if no status line is in headers (default 200). It decides whether heuristic freshness is allowed.",
                "maximum": 599,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["headers"],
            "type": "object"
          },
          "annotations": {
