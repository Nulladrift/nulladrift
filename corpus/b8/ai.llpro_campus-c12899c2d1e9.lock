          "digest": "sha256:850b70a376eb139cd4784dc17ec0f07d612f904668c72e8d43388e21ece88fcf"
        },
        {
          "name": "agent_identity_check",
          "title": "Check whether an agent's card, its domain and its published key agree. Shows control of a domain, not who the operator is in law",
          "description": "Does this agent's card agree with the domain that served it and the keys that domain publishes? Send an agent card URL (https) or a domain. We read the card through a safe fetcher and check: required fields; that the domain the card names is the host it was served from; that the operator publishes the same agent id or key at a well-known path on that domain (/.well-known/agent-identity.json or the JWKS); and that a key proves control (the card's own JWS signature, or a signed challenge: a key a card only names, without proof, gives cannot_tell). Get back matches, does_not_match or cannot_tell, every check listed, signed by LLPRO with the time we looked. Shows control of a domain and a consistent card, NOT who the operator is in law, NOT legal identity, NOT safety. It does not show that the agent does what it says, that the domain is not hijacked or the key not stolen, or anything before the time we looked. Not a certification and not a guarantee. Free. Your card address and challenge are not stored; no model. Feeds Identity and payment rails: one input to a decision to deal with an agent, never the whole decision. Limits: public https hosts only (port 443, ASCII domain names), one JSON card up to 200,000 characters, at most 4 fetches per call (a domain tries two card paths). Fetches with the user agent 'Countersign/1.0 (independent checker; LLPRO)'; robots.txt is not read.",
          "inputSchema": {
            "properties": {
              "card_url": {
                "description": "https URL of the agent card, for example https://example.com/.well-known/agent-card.json. Give this or domain.",
                "maxLength": 2000,
                "type": "string"
              },
              "challenge": {
                "description": "Optional proof you hold the key: sign the text 'llpro-agent-identity-check/v1', a newline, the domain, a newline, your nonce, a newline and the time (UTC like 2026-11-12T09:00:00Z, within 10 minutes of now) with the agent's Ed25519 key.",
                "properties": {
                  "at": {
                    "type": "string"
                  },
                  "nonce": {
                    "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                    "type": "string"
                  },
                  "signature": {
                    "description": "Ed25519 signature, base64",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "domain": {
                "description": "A bare domain such as example.com; we try /.well-known/agent-card.json then /.well-known/agent.json.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether an agent's card, its domain and its published key agree. Shows control of a domain, not who the operator is in law"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
