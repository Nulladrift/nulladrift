        {
          "name": "i9_document_combination",
          "title": "Form I-9 Document Combination Check",
          "description": "Check whether the documents a new employee chose to present for Form I-9 make an acceptable combination: one List A document, or one List B plus one List C document, per the USCIS Lists of Acceptable Documents. Send only the document types (codes from the list, such as us_passport, state_drivers_license_or_id, social_security_card_unrestricted), whether each is a receipt for a replacement of a lost, stolen or damaged document, two facts: whether the employee is under 18 and whether the job lasts under three business days, and, when a tribal document is sent, the Section 1 status the employee checked. Never send the documents, their numbers, names or dates of birth: the tool has no field for them. Get back whether the set is complete, which document fills which list, what is missing, and the receipt rules that apply. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/i9-document-combination). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "documents": {
                "description": "The documents presented (1 to 10), by type.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "document": {
                      "description": "Document type as on the Form I-9 Lists of Acceptable Documents (see the rule for each code's title).",
                      "enum": ["canadian_drivers_license", "clinic_doctor_hospital_record", "daycare_nursery_school_record", "dhs_employment_authorization_document", "dos_birth_abroad_certification", "employment_authorization_document_i766", "foreign_passport_temporary_i551", "foreign_passport_with_i94_work_endorsement", "fsm_rmi_passport_with_i94", "government_id_card", "i94_refugee_admission_receipt", "i94_temporary_i551_stamp_receipt", "merchant_mariner_card", "military_dependent_id_card", "native_american_tribal_document", "permanent_resident_card", "receipt_for_new_or_renewed_work_permit", "resident_citizen_id_card_i179", "school_id_with_photo", "school_record_or_report_card", "social_security_card_restricted", "social_security_card_unrestricted", "state_drivers_license_or_id", "us_birth_certificate", "us_citizen_id_card_i197", "us_military_card_or_draft_record", "us_passport", "us_passport_card", "voter_registration_card"],
                      "type": "string"
                    },
                    "expired": {
                      "default": false,
                      "description": "true when the document is expired (expired documents are not acceptable; see does_not on automatic extensions).",
                      "type": "boolean"
                    },
                    "replacement_receipt": {
                      "default": false,
                      "description": "true when what was shown is a receipt for an application to replace this document because it was lost, stolen or damaged.",
                      "type": "boolean"
                    }
