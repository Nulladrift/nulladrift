        },
        {
          "name": "invoice_make",
          "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash",
          "description": "Use when the user wants an invoice: give the invoice fields and get a PDF invoice plus a signed, dated receipt of it. Free. Example: {\"number\": \"INV-1001\", \"issue_date\": \"2026-11-23\", \"currency\": \"USD\", \"seller\": {\"name\": \"Acme LLC\"}, \"buyer\": {\"name\": \"Beta Inc\"}, \"items\": [{\"description\": \"Consulting\", \"quantity\": 2, \"unit_price\": 150}]}. Docs: https://llpro.ai/invoice-maker",
