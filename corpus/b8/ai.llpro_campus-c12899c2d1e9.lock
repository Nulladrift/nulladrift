        {
          "name": "payer_re_credentialing_and_caqh",
          "title": "List late and upcoming provider credentialing deadlines (CAQH, payers, Medicare) and check NPIs against the public registry",
          "description": "Credentialing deadline check for medical group practices. Send up to 10 providers by NPI; for each, optionally the date of the last CAQH attestation and the date each payer last credentialed them. It reads two public sources (the NPPES NPI Registry and CMS's Medicare Revalidation Due Date List) and returns one list of deadlines sorted by date: CAQH attestation due (120 days after the last one), each payer's re-credentialing due (36 months after the last one unless you send a cycle), and the Medicare revalidation due date CMS has set; late and due-soon items are marked for review, and an NPI that is not on the registry or fails its check digit is flagged. The 120-day CAQH and 36-month payer cycles are the common ones from public guides, not read from any payer (public guides say Illinois practitioners have 180 days for CAQH; send cycle_months for a payer that differs). Answer fields: verdict (nothing_to_review, review, incomplete), review (the short list), deadlines (sorted), providers (checks and public record fields), sources with dates, rules, observation, signature; ok false with a message for bad input (400), sources that cannot be read (502) or the hourly limit (429). CAQH ProView and payer portals are private and are not read: CAQH and payer dates are only what you send. Free for now; paid calls planned, no price set, not charging. No model, nothing stored, signed record. It does not file or attest anything, does not log in anywhere, and is not legal or credentialing-committee advice.",
          "inputSchema": {
