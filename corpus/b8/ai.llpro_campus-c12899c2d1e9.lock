          "description": "Check your own resume against one job post. Send resume_text (your resume as plain text), job_post (the post as plain text) and own_use true (it is your own resume). Answer: the skills, tools, credentials, years of experience and degree the post asks for, marked required, preferred or mentioned, each covered or missing in your resume (and in which resume section it shows); words the post repeats that your resume never uses; resume format problems (sections, contact details, dates, length, layout, keyword stuffing); a signed, dated receipt. Rules and a word list we wrote; no AI model; free, no sign-up, 30 checks a day per caller. The text of your resume and the post is never stored: it is dropped after the call (only short-lived call counters and salted hashes sit in memory for a day, to enforce the limits), and the answer never repeats your resume's words. Email addresses, phone numbers and web links are cut out of the resume before reading. English only. For the seeker's own resume only: never to rank or reject candidates for an employer. A missing word is not a missing skill, and a covered word is not proof; add a word only if it is true for you. Each answer offers the next job through the Hub (https://llpro.ai/hub) and the Job-Search Agent (https://llpro.ai/jobs).",
