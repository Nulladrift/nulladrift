                      "description": "Amount in this column (0 or more; leave out if none).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "type": {
                      "description": "Account type: asset, contra_asset (accumulated depreciation, allowance), liability, contra_liability (bond discount), equity, contra_equity (draws, dividends, treasury stock), revenue (send gains here), contra_revenue (returns, discounts), expense (send losses and cost of sales here).",
                      "enum": ["asset", "contra_asset", "liability", "contra_liability", "equity", "contra_equity", "revenue", "contra_revenue", "expense"],
                      "type": "string"
                    }
                  },
                  "required": ["account", "type"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
