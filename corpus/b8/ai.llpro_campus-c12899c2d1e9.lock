              "items": {
                "description": "Open monetary items (up to 100).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "carrying_amount": {
                      "description": "What the item is carried at in the books now, in the functional currency (at the original or the last revaluation rate).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "currency": {
                      "description": "Currency the item is owed or held in.",
                      "maxLength": 3,
                      "type": "string"
                    },
                    "foreign_amount": {
                      "description": "Open balance in the foreign currency (up to that currency's decimals).",
                      "maximum": 1000000000000,
                      "minimum": 0.0001,
                      "type": ["number", "string"]
                    },
                    "label": {
                      "description": "Optional label (your own text, echoed back; not a person or an account number).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "side": {
                      "description": "asset (cash, receivable, loan made, refundable deposit paid) or liability (payable, loan owed, refundable deposit held).",
