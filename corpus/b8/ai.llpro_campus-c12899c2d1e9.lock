                    "description": "optional: the agent's Ed25519 public key, canonical base64; send with sig",
                    "type": "string"
                  },
                  "asked_at": {
                    "description": "UTC time like 2026-11-12T09:00:00Z",
                    "type": "string"
                  },
                  "question": {
                    "maxLength": 2000,
