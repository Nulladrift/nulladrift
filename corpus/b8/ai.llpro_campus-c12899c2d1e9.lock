        {
          "name": "meeting_slot_finder",
          "title": "Meeting Slot Finder Across Time Zones",
          "description": "Find the meeting times that suit everyone. Send a date range (up to 31 days), the meeting length and, for each attendee (up to 20), their IANA time zone, working hours and working days (default Monday to Friday 09:00-17:00 in their own zone), their busy blocks (clock times in their zone, or UTC instants as calendars export them) and days off. Get back the common free windows, the meeting start times on a step grid (e.g. every 30 minutes) with each attendee's local time, how much working time and free time each attendee has, and, when nothing fits, why: working hours never overlap, the overlap is shorter than the meeting, or busy blocks fill it. Daylight-saving changes inside the range are handled through the IANA time zone database. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/meeting-slot-finder). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attendees": {
                "description": "Attendees (1 to 20).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "busy": {
                      "description": "Busy blocks (up to 200).",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "end": {
                            "description": "Busy until.",
                            "maxLength": 35,
                            "type": "string"
                          },
                          "start": {
                            "description": "Busy from.",
                            "maxLength": 35,
                            "type": "string"
                          }
                        },
                        "required": ["end", "start"],
                        "type": "object"
                      },
                      "maxItems": 200,
                      "minItems": 0,
                      "type": "array"
                    },
                    "days_off": {
                      "description": "Days off or holidays in their zone, YYYY-MM-DD (up to 60).",
                      "items": {
                        "description": "Day off.",
                        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                        "type": "string"
                      },
                      "maxItems": 60,
                      "minItems": 0,
                      "type": "array"
                    },
                    "label": {
                      "description": "Optional role or code, e.g. 'host' or 'London team' (your own text, echoed; not a person's name or email).",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "work_days": {
                      "description": "Working days (default MO TU WE TH FR).",
                      "items": {
                        "description": "MO TU WE TH FR SA SU.",
                        "enum": ["MO", "TU", "WE", "TH", "FR", "SA", "SU"],
                        "type": "string"
                      },
                      "maxItems": 7,
                      "minItems": 1,
                      "type": "array"
                    },
                    "work_end": {
                      "description": "Working hours end in their zone, HH:MM (default 17:00).",
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    },
                    "work_start": {
                      "description": "Working hours start in their zone, HH:MM (default 09:00).",
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    },
                    "zone": {
                      "description": "Attendee's IANA time zone, e.g. Europe/London.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["zone"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "duration_minutes": {
                "description": "Meeting length in minutes (5 to 720).",
                "maximum": 720,
                "minimum": 5,
                "type": "integer"
              },
              "end_date": {
                "description": "Last day to search (included), YYYY-MM-DD, in search_zone; at most 31 days after start_date counting both.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'quarterly review' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "max_results": {
                "default": 10,
                "description": "How many start times to list, earliest first (1 to 50; all are counted).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "search_zone": {
                "description": "IANA zone the date range and the start-time grid are read in (default: the first attendee's zone).",
                "maxLength": 40,
                "type": "string"
              },
              "start_date": {
                "description": "First day to search, YYYY-MM-DD, in search_zone.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "step_minutes": {
                "default": 30,
                "description": "Start times are on this grid of search_zone clock time (default 30: :00 and :30).",
                "maximum": 120,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["attendees", "duration_minutes", "end_date", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Meeting Slot Finder Across Time Zones"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fe18e63cc774b25ec79b0554f93d3ca2c1c3b7a1717c18313308522a32ce324"
        },
        {
          "name": "mrr_bridge",
          "title": "MRR Bridge and Net Revenue Retention",
          "description": "Explain how monthly recurring revenue (MRR) moved between two subscription snapshots. Send each customer's MRR at the start and at the end (customer code and amount), and mark customers at the end who had paid before the start snapshot but were at 0 in it (returning). Get back the MRR bridge: starting MRR, new, reactivation, expansion, contraction, churn and ending MRR, with the customer count for each movement, net and gross revenue retention, logo churn, the quick ratio, and the movement for every customer. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/mrr-bridge). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end": {
                "description": "End snapshot: each customer's MRR (up to 200; a customer missing here is read as 0).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "customer": {
                      "description": "Your customer code or billing-system customer ID, e.g. a Stripe cus_ ID (matched without regard to case, echoed as you sent it; up to 12 digits in a row; web addresses and phone, Social Security or card shapes are refused). Not a person's name or email.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "mrr": {
                      "description": "Monthly recurring revenue for this customer in the snapshot (0 if none).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    },
                    "returning": {
                      "default": false,
                      "description": "true if this customer paid before the start snapshot but had 0 MRR in it (counts as reactivation, not new). A customer at 0 at the start and above 0 at the end counts as new unless marked returning.",
                      "type": "boolean"
                    }
                  },
                  "required": ["customer", "mrr"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "end_date": {
                "description": "Optional: date of the end snapshot.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'Oct 2026' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "start": {
                "description": "Start snapshot: each customer's MRR (up to 200; an empty list for a business with no customers yet).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "customer": {
                      "description": "Your customer code or billing-system customer ID, e.g. a Stripe cus_ ID (matched without regard to case, echoed as you sent it; up to 12 digits in a row; web addresses and phone, Social Security or card shapes are refused). Not a person's name or email.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "mrr": {
                      "description": "Monthly recurring revenue for this customer in the snapshot (0 if none).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["customer", "mrr"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "start_date": {
                "description": "Optional: date of the start snapshot (echoed; the bridge covers the span between the two snapshots).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["end", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "MRR Bridge and Net Revenue Retention"
          },
          "behavior": {
            "destructive": false,
