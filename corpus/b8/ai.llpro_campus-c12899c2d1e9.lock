        },
        {
          "name": "business_days",
          "title": "Business Days Calculator (US Holidays)",
          "description": "Count US business days between two dates, or step a number of business days from a date (skips weekends and federal holidays). Free. Example: {\"start\": \"2026-11-20\", \"end\": \"2026-12-01\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_business_days": {
                "description": "To step: how many business days after start (negative: before start), not counting start itself. 1 = the next business day. Not 0.",
                "maximum": 3000,
                "minimum": -3000,
                "type": "integer"
              },
              "end": {
                "description": "To count: the end date, YYYY-MM-DD, on or after start. Send end or add_business_days, not both.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "holidays": {
                "default": "federal_offices",
                "description": "federal_offices (default): 5 U.S.C. 6103 holidays, Saturday ones on the Friday before and Sunday ones on the Monday after. federal_reserve_banks: the same holidays, Sunday ones on Monday, Saturday ones not moved.",
                "enum": ["federal_offices", "federal_reserve_banks"],
                "type": "string"
              },
              "label": {
                "description": "Optional label, e.g. 'notice period' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "start": {
                "description": "Start date, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business Days Calculator (US Holidays)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a036ec6715904e514188fedfc74d7a4cdfa50229e74101d238c8167e2516409b"
        },
        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Check a piece of work (report, calculation, summary, filing draft) by separate code and get a signed pass, fail or inconclusive stamp that says exactly what is wrong. Free daily limit. Example: {\"output\": \"12 invoices at $40 each: 12 * 40 = 480\", \"producer\": {\"agent_id\": \"my-agent\"}, \"kind\": \"calculation\"} Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free. Docs: https://llpro.ai/countersign",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
              },
              "output": {
                "description": "The work to check, as text (max 100000 chars). Equations written as '12 * 4 = 48' are re-computed.",
                "type": "string"
              },
              "private": {
                "description": "If true the public log shows only a hash of each finding's detail; you still get the full detail",
                "type": "boolean"
              },
              "producer": {
                "description": "Who made the work: {agent_id, model}. Required; used for the independence rule.",
                "properties": {
                  "agent_id": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  }
                },
                "required": ["agent_id"],
                "type": "object"
              },
              "sources": {
                "description": "Optional cited sources: {url, quote?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["output", "producer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check work and get a signed stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71c8eb74e83593df4c9d7dba91589de66de8f900902463ecd87e9a69ec75afa2"
        },
        {
          "name": "domain_health_check",
          "title": "Check a domain's mail and DNS health (MX, SPF, DKIM, DMARC, certificate)",
          "description": "Check a domain's mail and DNS health: MX, SPF, DKIM, DMARC, certificate expiry and blocklists, each pass or fail with what to do. Free. Example: {\"domain\": \"example.com\"}. Docs: https://llpro.ai/domain-health-check",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dkim_selectors": {
                "description": "Optional DKIM selector names you use (the part before ._domainkey). We also try 12 common ones.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "domain": {
                "description": "A domain name such as example.com. Not a URL, address or email.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
