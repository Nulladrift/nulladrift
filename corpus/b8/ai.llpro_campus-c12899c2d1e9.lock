        {
          "name": "mds_and_care_plan_documentation",
          "title": "Check an SNF MDS assessment's PDPM payment code (HIPPS) and the items that carry it",
          "description": "PDPM payment-accuracy check of one skilled nursing facility MDS 3.0 assessment (5-Day or Interim Payment Assessment, Medicare Part A, FY 2027), for MDS coordinators, billing and audit firms and their agents. Send the MDS item values by section (no names, numbers or dates) and optionally the HIPPS code that was billed. Get back the five-character HIPPS code worked exactly as CMS's RAI Manual v1.20.11 Chapter 6 worksheet says, with CMS's FY 2027 ICD-10-CM mappings: PT/OT, SLP, nursing and NTA groups with the scores and items behind each, carried_by (the items that each move a group on their own; every coded item must be supported by the record, these are the ones a single change would move), consistency flags, upper-group notes and match/differs by position against the billed code. Every answer lists its sources with dates and carries a signed record. Free. No model, no network, nothing stored. Not medical, coding, legal or billing advice. Errors: ok false with a message (400 bad input, 413 too large, 429 hourly limit).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimed_hipps": {
                "description": "The HIPPS code billed or in Z0100A, to compare position by position.",
                "pattern": "^[A-Za-z]{4}[0-9]$",
                "type": "string"
              },
              "hiv_aids_on_claim": {
                "description": "True when B20 is on the SNF claim: shows the NTA group and nursing add-on Medicare's pricing applies (the HIPPS code does not change).",
                "type": "boolean"
              },
              "mds": {
                "additionalProperties": false,
                "description": "MDS 3.0 item values by section. GG codes as \"05\" or 5, checkboxes 0/1, counts and days as numbers, a dash \"-\" for not assessed, ICD-10-CM codes as text with or without the dot. Items not sent count as not coded.",
                "properties": {
                  "A": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: A0310B",
                    "maxProperties": 1,
                    "properties": {
                      "A0310B": {
                        "description": "01 = 5-Day, 08 = Interim Payment Assessment.",
                        "enum": ["01", "08"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "B": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: B0100, B0700",
                    "maxProperties": 2,
                    "type": "object"
                  },
                  "C": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: C0100, C0500, C0700, C1000",
                    "maxProperties": 4,
                    "type": "object"
                  },
                  "D": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: D0160, D0600",
                    "maxProperties": 2,
                    "type": "object"
                  },
                  "E": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: E0100A, E0100B, E0200A, E0200B, E0200C, E0800, E0900",
                    "maxProperties": 7,
                    "type": "object"
                  },
                  "GG": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: GG0130A1, GG0130A5, GG0130B1, GG0130B5, GG0130C1, GG0130C5, GG0170B1, GG0170B5, GG0170C1, GG0170C5, GG0170D1, GG0170D5, GG0170E1, GG0170E5, GG0170F1, GG0170F5, GG0170I1, GG0170I5, GG0170J1, GG0170J5, GG0170K1, GG0170K5",
                    "maxProperties": 22,
                    "type": "object"
                  },
                  "H": {
                    "additionalProperties": {
                      "type": ["string", "integer"]
                    },
                    "description": "Items: H0100C, H0100D, H0200C, H0500",
                    "maxProperties": 4,
                    "type": "object"
