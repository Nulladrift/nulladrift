        {
          "name": "invoice_make",
          "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash",
          "description": "Make a clean PDF invoice from invoice fields, and get back a signed, dated receipt of the PDF's hash, so either side can later show which invoice was made and when. Send: number, issue_date (YYYY-MM-DD), optional due_date, currency (USD, EUR, GBP ... 43 supported), seller {name, address, tax_id, contact}, buyer {name, address, ...}, items [{description, quantity, unit_price}] (up to 40), optional tax_lines [{label, rate_percent OR amount}], notes, payment_terms. Every number, rate and tax line is yours: we only add them up (half-up rounding to the currency's smallest unit); no tax advice, no tax rules, no checking of tax ids. Moves no money and makes no payment link: web addresses and links (dotted names, IP addresses, schemes such as http: or pay:) are refused in every text field. Free, no sign-up, 100 invoices a day per caller. Stores nothing: the signed receipt holds the number, dates, totals and hashes, never names or addresses. Text must use Western European letters (the Windows-1252 set; accented Latin letters, euro, pound, yen). Answer: pdf_base64, totals, signed observation, receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer": {
