        {
          "name": "timesheet_check",
          "title": "Timesheet Check (Clock Punches)",
          "description": "Check one person's clock punches before payroll. Send each shift as a date with an in time and an out time (24-hour HH:MM; an out time earlier than the in time ends the next day), and optionally your rules: the day your workweek starts, a weekly hours line (default 40), a daily hours line, and a break rule (a break of at least N minutes before more than H hours of work in a row). Get back hours per day (split at midnight) and per workweek, hours over your lines, and every problem: missing in or out punches, overlapping shifts, in equal to out, missed breaks, and gaps under 20 minutes that federal rules usually count as paid rest time. Covers up to 62 calendar days and 200 shifts; a workweek only partly sent is marked partial_week. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/timesheet-check). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "break_after_hours": {
                "description": "Optional break rule: more than this many hours of work in a row without a break of at least break_minutes is reported.",
                "maximum": 24,
                "minimum": 0.5,
                "type": ["number", "string"]
              },
              "break_minutes": {
                "default": 30,
                "description": "Shortest gap between punches that counts as a break for the break rule (default 30).",
                "maximum": 240,
                "minimum": 1,
                "type": "integer"
              },
              "daily_hours_limit": {
                "description": "Optional: hours in a calendar day above which hours are reported as over (some states count daily overtime).",
                "maximum": 24,
                "minimum": 1,
                "type": ["number", "string"]
              },
              "entries": {
                "description": "Shifts (1 to 200) for one person; no names. Each: date the shift starts, in, out. Leave out in or out if that punch is missing.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Date the shift starts, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "in": {
                      "description": "Clock-in time, 24-hour HH:MM (leave out if the in punch is missing).",
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    },
                    "out": {
                      "description": "Clock-out time, 24-hour HH:MM (leave out if the out punch is missing). An out time earlier than the in time is on the next day.",
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    }
                  },
                  "required": ["date"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "description": "Optional label, e.g. 'crew B week 10' (your own text, echoed; not a person's name).",
                "maxLength": 40,
                "type": "string"
              },
              "weekly_hours_limit": {
                "default": 40,
                "description": "Hours in a workweek above which hours are reported as over (default 40, the federal overtime line).",
                "maximum": 168,
                "minimum": 1,
                "type": ["number", "string"]
              },
              "workweek_starts": {
                "default": "sunday",
                "description": "First day of your fixed 7-day workweek, starting at midnight (default sunday).",
                "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                "type": "string"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
