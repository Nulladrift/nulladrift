        {
          "name": "csv_diff",
          "title": "CSV Diff by Key",
          "description": "Compare two CSV extracts of the same records (before and after, header row first, up to 14,000 characters each and together within the 30,000-byte request) by a key column, or up to 3 key columns together. Get back the rows added, removed and changed (with the key, the line in each file and the names of the columns whose values changed), the count of unchanged rows, and the columns added or removed. Options: columns to ignore (e.g. an updated_at stamp), trim spaces, and compare numbers by value (1.50 = 1.5). Data cell values are never echoed back; only key values and column names are. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/csv-diff). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "The newer CSV text, header row first, same delimiter, up to 14,000 characters.",
                "maxLength": 14000,
                "type": "string"
              },
              "before": {
                "description": "The older CSV text, header row first (RFC 4180), up to 14,000 characters. Do not send personal data (names of people, emails, phone, Social Security, card or account numbers): columns named for it and cells shaped like it are refused, but names in cells cannot be detected.",
                "maxLength": 14000,
                "type": "string"
              },
              "delimiter": {
                "default": "comma",
                "description": "Field separator for both files: comma (default, RFC 4180), semicolon, tab or pipe.",
                "enum": ["comma", "semicolon", "tab", "pipe"],
                "type": "string"
              },
              "ignore_columns": {
                "description": "Columns not to compare (up to 50), e.g. a last-modified stamp.",
                "items": {
                  "description": "",
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "key": {
                "description": "The key column name, or up to 3 names that together identify a row (in both headers). Use a record code (order, invoice, SKU), not a person's name: key values are echoed back.",
                "items": {
                  "description": "",
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "numbers_by_value": {
                "default": false,
                "description": "true: two cells that are both XSD decimals (12, -3.50, +.5; spaces at either end ignored, as XSD whiteSpace collapse) are equal when their values are equal (1.50 = 1.5 = 01.5). Default false: text compared exactly.",
                "type": "boolean"
              },
              "trim_spaces": {
                "default": false,
                "description": "true: spaces, tabs and line breaks at either end of every cell (keys too) are ignored. Default false: they count (RFC 4180 rule 4).",
                "type": "boolean"
              }
            },
            "required": ["after", "before", "key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CSV Diff by Key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c4fd94337225d2772e90dab97ae140fd3e2059d002f6a123a535bca4619142e"
        },
