                  },
                  "beneficiary_name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "iban": {
                    "maxLength": 42,
                    "type": "string"
                  },
                  "reference": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "swift_bic": {
                    "maxLength": 11,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "previous_instruction_fingerprint": {
                "description": "instruction_fingerprint from your last check of these instructions.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "sec_cik": {
                "description": "SEC CIK of the fund or issuer; with check_sources, reports whether a Form D is on file.",
                "pattern": "^[0-9]{1,10}$",
