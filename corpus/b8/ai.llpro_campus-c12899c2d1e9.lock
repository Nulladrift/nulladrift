                "maximum": 3000,
                "minimum": 1000,
                "type": "integer"
              },
              "label": {
                "description": "Optional label for the meeting (your own text, echoed back).",
                "maxLength": 40,
                "type": "string"
              },
              "minutes": {
                "description": "Length of one meeting in minutes.",
                "maximum": 1440,
                "minimum": 1,
                "type": "integer"
              },
              "occurrences": {
                "description": "Optional: number of meetings to price as a series (for example 10 for a ten-week project).",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["attendees", "minutes"],
            "type": "object"
          },
          "annotations": {
