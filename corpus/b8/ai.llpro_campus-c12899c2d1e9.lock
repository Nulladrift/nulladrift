        {
          "name": "chemical_trade_credit_payment_days",
          "title": "Build a days-to-pay and dispute-rate table from your own invoices",
          "description": "Build a days-to-pay and dispute-rate table from YOUR OWN trade-credit invoices, by customer type and by freight-surcharge line (made for small chemical makers and distributors; works for any seller). Send up to 400 invoice rows: customer_type and surcharge_line (your own short labels, e.g. 'distributor', 'fuel'), invoice_date, paid_date (leave out if still open), optional terms_days, disputed true/false. Get back, per customer type, per surcharge line and per pair: invoices, paid, open, median and 90th-percentile days to pay, mean, how many paid or are now past their terms, and the dispute rate with a 95% range, plus the sources (your rows, with the label and as-of date you gave), the rule used, and a signed record. Free. Arithmetic only: no model, no outside lookup, nothing stored. Do NOT send customer names, invoice numbers or amounts: those fields are refused, and keep names out of the labels too (labels are your responsibility). There is NO pooled industry benchmark yet (nothing is stored, so nothing is pooled). It does not give credit, legal, tax or collections advice and cannot say why an invoice was paid late or disputed.",
          "inputSchema": {
