        {
          "name": "deferred_revenue_schedule",
          "title": "Deferred Revenue Schedule (Straight Line)",
          "description": "Turn subscription contracts into monthly recognized revenue and the deferred revenue balance at each month end (ratable, straight-line recognition over the service term, the time-elapsed measure under ASC 606 / IFRS 15). Send up to 100 contracts, each with the amount, the first day of service, the term (months or the last day) and optionally the billing date, and the method: daily (each month's share by days of service, the default) or monthly (an equal share per month). Get back, for every month, the amount billed, revenue recognized, revenue to date, the deferred revenue balance and any revenue recognized before it was billed (unbilled), a line per contract, and, with as_of_month, the figures for that month end. Rounding is carried forward so each contract adds up to its amount to the cent. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/deferred-revenue-schedule). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of_month": {
                "description": "Optional month end to report, YYYY-MM.",
                "maxLength": 7,
                "type": "string"
              },
              "contracts": {
                "description": "Subscription contracts (up to 100).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Contract price recognized over the term (the transaction price for this subscription).",
                      "maximum": 1000000000,
                      "minimum": 0.01,
                      "type": ["number", "string"]
                    },
                    "billing_date": {
                      "description": "Date the customer pays the whole amount or it falls due, whichever is earlier (an invoice sent before it is due does not count), YYYY-MM-DD; default start_date.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "end_date": {
                      "description": "Last day of service, inclusive, YYYY-MM-DD. Send months or end_date, not both.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    },
                    "label": {
                      "description": "Optional label for the contract (your own text, echoed back; not a person).",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "months": {
                      "description": "Term in months. Send months or end_date, not both.",
                      "maximum": 120,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "start_date": {
                      "description": "First day of service, YYYY-MM-DD.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "start_date"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "description": "Optional label for the schedule (your own text, echoed back).",
                "maxLength": 40,
                "type": "string"
              },
              "method": {
                "default": "daily",
                "description": "daily (default): a month's share = its service days / all service days; monthly: an equal share each month, starting in the month of start_date.",
                "enum": ["daily", "monthly"],
                "type": "string"
              }
            },
            "required": ["contracts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Deferred Revenue Schedule (Straight Line)"
          },
          "behavior": {
            "destructive": false,
