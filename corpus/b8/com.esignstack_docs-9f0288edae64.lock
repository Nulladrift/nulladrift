      "serverInfo": {
        "name": "eSignStack documentation",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public, read-only documentation for the eSignStack API, webhooks and MCP server. No authentication. Use search_docs to find a page, then read_doc to read it. To act on a workspace, connect to the separate operations server at /mcp with an API key.",
      "tools": [
        {
          "name": "read_doc",
          "title": "Read documentation page",
          "description": "Read one documentation page or API operation in full, by the slug that search_docs returned (for example \"webhooks\", \"mcp\" or \"api:post /webhook_endpoints\").",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The page slug from search_docs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read documentation page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da970e1e9739edea121baf731073fe1e2f98acbfcaef3311a798f0eeea733cd5"
        },
        {
          "name": "search_docs",
          "title": "Search documentation",
          "description": "Search the eSignStack guides and the API reference. Returns matching pages with a snippet; read one with read_doc.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, for example \"webhook signature\" or \"void envelope\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search documentation"
          },
