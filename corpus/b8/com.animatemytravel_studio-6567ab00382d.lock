                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["actionId", "input"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "agentToken": {
                "minLength": 20,
                "type": "string"
              },
              "baseRevision": {
