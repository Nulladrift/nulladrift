      "instructions": "AnimateMyTravel Studio makes animated map videos of any story (trips, wars, empires, storms, data, news), free and without signup. Simplest path: studio_get_guide once, then studio_create_project with a template, a guide example or your actions; give the person the returned studioUrl to watch, change and export the video in their browser. Use studio_find_places for real [lat, lng] coordinates. Change an open project with studio_apply_actions. When the person already has Studio open, studio_join_project takes the code shown under the plug button (Connect AI agent) of the editor. Preview and export need the Studio link open in a browser: rendering never happens on the server.",
      "tools": [
        {
          "name": "studio_apply_actions",
          "title": "Apply Studio actions",
          "description": "Atomically applies one or more registered actions. Non-conflicting stale edits are rebased; conflicting edits are rejected.",
