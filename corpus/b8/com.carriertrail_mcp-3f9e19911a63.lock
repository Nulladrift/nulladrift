{
  "lockfileVersion": 2,
  "subjects": {
    "com.carriertrail/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carriertrail.com/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "carriertrail",
        "title": "CarrierTrail carrier lookup",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up US motor carriers, brokers and freight forwarders in public FMCSA data: search_carriers by name, get_carrier by USDOT/MC number, get_recent_changes for census changes. Every answer includes a CarrierTrail link. Free use is limited per day.",
      "tools": [
        {
          "name": "get_carrier",
          "title": "Look up a carrier",
          "description": "Company record for one carrier by USDOT, MC, FF or MX number: census registration, operating authority, current insurance filings and 24-month roadside safety summary, with a CarrierTrail link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Number type when the number has no prefix. Default DOT.",
                "enum": ["DOT", "MC", "FF", "MX"],
                "type": "string"
              },
              "number": {
                "description": "USDOT or docket number, e.g. \"2233441\", \"MC-123456\", \"USDOT 2233441\".",
                "maxLength": 30,
                "type": "string"
              },
              "sections": {
                "description": "Optional subset. Default all.",
                "items": {
                  "enum": ["company", "authority", "insurance", "safety"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a carrier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70a727351036a839527f282a6d88264a9d9f011ac5f6bbc73d50861ada104177"
        },
        {
          "name": "get_recent_changes",
          "title": "Recent public changes",
          "description": "Changes to one carrier's public FMCSA census fields seen in the last 90 days (name, status, fleet size, MCS-150 date, dockets and more).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 90,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "dot": {
                "description": "USDOT number.",
                "maxLength": 12,
                "type": "string"
              }
            },
            "required": ["dot"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent public changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3680d117bd327e74ef1a2838b4b3544f39ee86bcd0f69b94f8337163de4080a"
        },
        {
          "name": "search_carriers",
          "title": "Search carriers by name",
          "description": "Find US motor carriers, brokers and freight forwarders by company name in FMCSA census data. Returns up to 10 matches with USDOT number, location and status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company name or part of it. Each word needs at least 3 letters.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter US state, e.g. TX.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search carriers by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c154900109686eacc00093bb39a9c00211da867928cb383dc7ace2d88248121f"
        }
      ],
      "digest": "sha256:0dc37c96b94df309b9ca863994f1fb5d2befc3003d9bf8fed501963710b34961"
    }
  }
}
