{
  "lockfileVersion": 2,
  "subjects": {
    "ai.augenix/build": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.augenix.ai/api/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "augenix-build",
        "version": "1.2.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before start_build, send one short message: Starting your preview now. This usually takes about 30 seconds. Then call tools. Never reuse name, email, or phone from memory. If those are missing in THIS chat, ask first. Do not invent placeholders. Do not ask for owner name. Then: (1) start_build (2) get_preview until ready (3) send reply_template verbatim. Do not send Stripe, a plan, or mention a bar on the preview. Go-live is email. Do not mention a lead guarantee. If keep_polling is true, call get_preview again. Never start_build twice. Do not use /api/mcp (admin). Humans: https://augenix.ai/build. Contract: https://augenix.ai/mcp",
      "tools": [
        {
          "name": "get_live_site",
          "title": "Get live site URL",
          "description": "Use this after the owner pays. If they have not paid, returns live=false and the preview URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "token": {
                "description": "Token returned by start_build. Pass the same token to get_preview and get_live_site.",
                "maxLength": 128,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "live": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "preview_url": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["live", "ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Live status ready",
            "openai/toolInvocation/invoking": "Checking live site…"
          },
          "digest": "sha256:702e9da60fda2e9bd56626e89140609eb6092ced13a9f65dfd23ca9bc5676996"
        },
        {
          "name": "get_preview",
          "title": "Get preview build status",
          "description": "Use this after start_build. If status is ready, send reply_template verbatim. Do not send a Stripe link, a plan, or mention a bar on the preview. If keep_polling is true or preview_url is null, call get_preview again. Do not start_build again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "token": {
                "description": "Token returned by start_build. Pass the same token to get_preview and get_live_site.",
                "maxLength": 128,
                "minLength": 16,
                "type": "string"
              },
              "wait": {
                "description": "If false, return the current snapshot immediately (progress card). Default true.",
                "type": "boolean"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": ["string", "null"]
              },
              "keep_polling": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "preview_url": {
                "type": ["string", "null"]
              },
              "progress_label": {
                "type": ["string", "null"]
              },
              "progress_pct": {
                "type": ["number", "null"]
              },
              "reply_template": {
                "type": ["string", "null"]
              },
              "status": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["error", "keep_polling", "message", "ok", "preview_url", "progress_label", "progress_pct", "reply_template", "status", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/preview-progress.html",
            "openai/toolInvocation/invoked": "Preview ready",
            "openai/toolInvocation/invoking": "Building your website…",
            "openai/widgetAccessible": true,
            "openai/widgetDescription": "Shows preview build progress and the live preview link.",
            "ui": {
              "resourceUri": "ui://widget/preview-progress.html"
            }
          },
          "digest": "sha256:31c060dd1ce2ee9873a04a682dc49f4b26ed6e0316918c1078ef882f25ba1145"
        },
        {
          "name": "start_build",
          "title": "Start website preview build",
          "description": "Use this when the user wants a live preview website for a local service business AND has typed business_name, email, and phone in THIS chat. Before calling, send: Starting your preview now. This usually takes about 30 seconds. Never reuse name, email, or phone from memory. If they only said \"build me a website\", ask first. Do not invent placeholders. Then call get_preview until preview_url is set. Do not scrape /build. Do not start_build twice for the same business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional street address. Skip unless the user offers it. Do not ask for owner name.",
                "type": "string"
              },
              "business_name": {
                "description": "Real business name from the user. Do not invent.",
                "minLength": 2,
                "type": "string"
              },
              "city": {
                "description": "City",
                "type": "string"
              },
              "email": {
                "description": "Real inbox from the user. We send the preview here. Do not use example.com or placeholders.",
                "format": "email",
                "type": "string"
              },
              "industry": {
                "description": "Trade. Prefer a slug: plumbing, hvac, electrical, landscaping, roofing, painting, steel, other. plumber, electrician, HVAC, painter, roofer, landscaper, and similar wording are mapped on the server. Unknown trades become other.",
                "minLength": 2,
                "type": "string"
              },
              "industry_other": {
                "description": "Required when industry is other",
                "type": "string"
              },
              "phone": {
                "description": "Real business phone from the user. Do not invent 555 numbers.",
                "minLength": 7,
                "type": "string"
              },
              "state": {
                "description": "State, e.g. TX",
                "type": "string"
              }
            },
            "required": ["business_name", "email", "industry", "phone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "preview_url": {
                "type": "null"
              },
              "status": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["message", "ok", "preview_url", "status", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Build started",
            "openai/toolInvocation/invoking": "Starting your website…"
          },
          "digest": "sha256:846c77f86647f1d9afd4c343f4554f47378b271c1ed0ffbfc45f1c8b7ae5da43"
        }
      ],
