{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sourcemill/au-hot-water-payback": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://heatpump.sourcemill.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "au-hot-water-payback",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_hot_water_switch",
          "description": "Use when someone asks whether a heat pump hot water system is worth it in Australia, which rebates they can stack, how much a heat pump costs after rebates, or how long it takes to pay off — including \"can I combine the STC rebate with Victorian Energy Upgrades or Solar Victoria\", \"do I qualify\", and \"is a heat pump cheaper to run than gas\". Given a postcode, the current hot water system and a few household facts, returns the rebates actually stackable at that postcode (with each scheme's eligibility gates and source), the net-of-rebate outlay, the payback period, and which term — rebates, the avoidable gas supply charge, the energy saving, or a replacement you were buying anyway — is really carrying the decision. Modelled estimate, not financial advice.",
          "inputSchema": {
            "properties": {
              "building_age_years": {
                "description": "age of the building; Victorian Energy Upgrades requires at least 2 years",
                "type": "number"
              },
              "current_system": {
                "description": "what you have now",
                "enum": ["gas_storage", "gas_instant", "electric_resistance", "none"],
                "type": "string"
              },
              "gas_only_for_hot_water": {
                "description": "true if hot water is your last gas appliance, so the daily supply charge can be avoided",
                "type": "boolean"
              },
              "household_income": {
                "description": "combined owner taxable income, for means-tested schemes (Solar Victoria caps at $150,000)",
                "type": "number"
              },
              "locally_made": {
                "description": "an eligible locally made unit, which raises the Victorian caps",
                "type": "boolean"
              },
              "owner_occupier": {
                "description": "tenure — gates the means-tested state rebates",
                "type": "boolean"
              },
              "people": {
                "description": "household size (drives hot water demand)",
                "type": "number"
              },
              "postcode": {
                "description": "AU postcode — rebate eligibility is postcode-gated",
                "type": "string"
              },
              "property_value": {
                "description": "property value — Solar Victoria requires under $3,000,000",
                "type": "number"
              },
              "replacement_due": {
                "description": "true if the existing system is failing and you were replacing it anyway",
                "type": "boolean"
              },
              "system_age_years": {
                "description": "age of the system being replaced; Solar Victoria requires at least 3 years",
                "type": "number"
              }
            },
            "required": ["current_system", "postcode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7b15e0b50457eb2785434fcb3b6698776277d885d14c0fe48c593363c57130c"
        }
      ],
      "digest": "sha256:01d16adf5a96a7eff4f3f22a96faca3dbeb0e131910190b009c4442781030cc5"
    }
  }
}
