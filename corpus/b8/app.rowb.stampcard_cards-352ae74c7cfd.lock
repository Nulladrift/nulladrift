      "serverInfo": {
        "name": "stampcard",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_program",
          "description": "Create or update the shop program: shop name, reward text, stamps required before a reward. Returns the program and its join URL (the poster target).",
          "inputSchema": {
            "properties": {
              "reward": {
                "type": "string"
              },
              "shop": {
                "type": "string"
              },
              "stamps_required": {
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["shop"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6630bd881fea87ef977256bdf53e80ac8b1d98cf3be8cffaa33f35e91d33418e"
        },
        {
          "name": "get_card",
          "description": "Read one customer card: how many stamps, what the reward is, whether it is ready to redeem.",
          "inputSchema": {
            "properties": {
              "code": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e375bed85f76f871aea5233b96951481bf35396a6b8d638f1f88286e6a9cd149"
        },
        {
          "name": "program_stats",
          "description": "Program plus this month stamp usage and quota, so a shop can tell how close it is to the free limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:766746ae4ce41f43ec597b0e2202c9650cea7b4276b397b68df45522d7544c7d"
        },
        {
          "name": "redeem",
          "description": "Redeem the reward on a card that has reached its required stamps. Resets the stamp count and increments the rewards-earned counter.",
          "inputSchema": {
            "properties": {
              "code": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35a7473143774171ad8551fe5b2de69f621419b2c703b7c170d0f3d78b6af50a"
        },
        {
          "name": "stamp",
          "description": "Add one stamp to a customer card. Identify the card by its 8-character code (from the customer page) or by its token. One stamp per card per day unless allow_multiple is true.",
          "inputSchema": {
            "properties": {
              "allow_multiple": {
                "type": "boolean"
              },
              "code": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
