          "description": "Search the 1network directory of US local businesses by category, place, rating, open now and \"accepts requests\". Free. Returns at most 25 businesses a page with their public phone and website, labelled sponsored or featured when paid. Use accepts_requests true to find the businesses that request_quotes can reach.",
