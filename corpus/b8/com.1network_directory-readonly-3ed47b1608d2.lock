                "description": "How many categories (default 25; at most 25 are shown in the text).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "parent": {
                "description": "Only the sub-categories of this parent category slug.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "search": {
