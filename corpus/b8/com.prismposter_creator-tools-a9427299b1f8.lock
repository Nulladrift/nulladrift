        {
          "name": "get_social_media_placement",
          "title": "Get one social media placement spec",
          "description": "Look up one social media placement by id and return its frame size, aspect ratio, first-party safe-area insets in px, usable box, and the official page the figures came from. Pass sourceWidth and sourceHeight together to also get the centre-crop and letterbox plan that fits your footage to this placement. Use this when you know the target placement; use list_social_media_placements to browse or compare, check_safe_area to test whether an element is clear of the platform UI, and calculate_aspect_ratio for a ratio that is not a platform placement. For TikTok the insets are null with a reason, because TikTok publishes no fixed safe area. Errors on an unknown id (the message lists valid ids) or on only one source dimension.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Placement id, camelCase (instagramReels) or kebab-case (instagram-reels), e.g. tiktok-video, youtube-shorts, youtube-channel-banner.",
