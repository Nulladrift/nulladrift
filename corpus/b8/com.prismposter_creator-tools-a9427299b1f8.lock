      },
      "instructions": "Deterministic calculators for video and social creators. Every tool is read-only with no side effects, and the same input always returns the same output. Platform figures come from first-party documentation and carry their source URL; where a platform publishes no fixed safe area (TikTok), tools say so instead of inventing one.",
      "tools": [
        {
          "name": "calculate_aspect_ratio",
          "title": "Calculate aspect ratio and crop/pad plan",
          "description": "Reduce any pixel size to its simplest aspect ratio (1920x1080 is 16:9) and the nearest even size an H.264 encoder accepts, and, given a target ratio, solve the missing width or height and return the centre-crop and letterbox/pillarbox plans with the px trimmed or added per edge. Use this for arbitrary sizes and ratios (cinema 2.39:1, a client's 4:5); when the target is a named platform placement, use get_social_media_placement with sourceWidth/sourceHeight instead, which picks the right ratio for you. Errors on a non-integer or out-of-range size, or on only one of targetRatioW/targetRatioH.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Frame height in px.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "targetRatioH": {
                "description": "Height term of the target ratio, e.g. 16 for 9:16. Requires targetRatioW.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "targetRatioW": {
                "description": "Width term of the ratio to crop or pad to, e.g. 9 for 9:16 or 2.39 for 2.39:1. Requires targetRatioH.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "width": {
                "description": "Frame width in px.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["height", "width"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cropPlan": {
                "anyOf": [
                  {
                    "properties": {
                      "areaLost": {
                        "type": "number"
                      },
                      "kept": {
                        "properties": {
                          "height": {
                            "type": "integer"
                          },
                          "width": {
                            "type": "integer"
                          }
                        },
                        "required": ["height", "width"],
                        "type": "object"
                      },
                      "trim": {
                        "properties": {
                          "bottom": {
                            "type": "integer"
                          },
                          "left": {
                            "type": "integer"
                          },
                          "right": {
                            "type": "integer"
                          },
                          "top": {
                            "type": "integer"
                          }
                        },
                        "required": ["bottom", "left", "right", "top"],
                        "type": "object"
                      }
                    },
                    "required": ["areaLost", "kept", "trim"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "evenEncoderSize": {
                "anyOf": [
                  {
                    "properties": {
                      "height": {
                        "type": "integer"
                      },
                      "width": {
                        "type": "integer"
                      }
                    },
                    "required": ["height", "width"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "formattedRatio": {
                "type": ["string", "null"]
              },
              "input": {
                "properties": {
                  "height": {
                    "type": "integer"
                  },
                  "width": {
                    "type": "integer"
                  }
                },
                "required": ["height", "width"],
                "type": "object"
              },
              "padPlan": {
                "anyOf": [
                  {
                    "properties": {
                      "barShare": {
                        "type": "number"
                      },
                      "bars": {
                        "properties": {
                          "bottom": {
                            "type": "integer"
                          },
                          "left": {
                            "type": "integer"
                          },
                          "right": {
                            "type": "integer"
                          },
                          "top": {
                            "type": "integer"
                          }
                        },
                        "required": ["bottom", "left", "right", "top"],
                        "type": "object"
                      },
                      "frame": {
                        "properties": {
                          "height": {
                            "type": "integer"
                          },
                          "width": {
                            "type": "integer"
                          }
                        },
                        "required": ["height", "width"],
                        "type": "object"
                      }
                    },
                    "required": ["barShare", "bars", "frame"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ratio": {
                "anyOf": [
                  {
                    "properties": {
                      "h": {
                        "type": "number"
                      },
                      "w": {
                        "type": "number"
                      }
                    },
                    "required": ["h", "w"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "referenceToolUrl": {
                "type": "string"
              },
              "solvedHeightForWidth": {
                "type": ["number", "null"]
              },
              "solvedWidthForHeight": {
                "type": ["number", "null"]
              },
              "targetRatio": {
                "type": ["string", "null"]
              }
            },
            "required": ["cropPlan", "evenEncoderSize", "formattedRatio", "input", "padPlan", "ratio", "referenceToolUrl", "solvedHeightForWidth", "solvedWidthForHeight", "targetRatio"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate aspect ratio and crop/pad plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15027b8035a55bb07832debeb91710f74b96d00853be1226cf91ed1a1b9bcb99"
        },
        {
          "name": "check_safe_area",
          "title": "Check an element against a placement safe area",
          "description": "Check whether a rectangle (a caption, logo or button, in px on the placement's own frame, origin top-left) stays inside the placement's safe area, and by how many px it intrudes past each edge if not. Use this to validate a layout before export; use get_social_media_placement for the raw insets. Returns verdict \"inside\", \"intrudes\" or \"unknown\"; \"unknown\" means the platform publishes no fixed safe area (TikTok) and comes with the reason instead of a guess. Errors on an unknown placement id or a box with non-positive size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Element height in px.",
                "minimum": 1,
                "type": "integer"
              },
              "placementId": {
                "description": "Placement id, camelCase or kebab-case, e.g. instagram-reels.",
                "enum": ["instagramReels", "instagramStory", "instagramFeedTall", "instagramFeedPortrait", "instagramFeedSquare", "instagramFeedLandscape", "tiktokInFeed", "tiktokSquare", "tiktokLandscape", "youtubeShorts", "youtubeLandscape", "youtubeThumbnail", "youtubeBanner", "facebookReels", "facebookFeed", "linkedinFeedSquare", "linkedinFeedLandscape", "xFeedLandscape", "xFeedPortrait", "instagram-reels", "instagram-story", "instagram-feed-tall", "instagram-feed-portrait", "instagram-feed-square", "instagram-feed-landscape", "tiktok-video", "tiktok-in-feed", "tiktok-square", "tiktok-landscape", "youtube-shorts", "youtube-video", "youtube-landscape", "youtube-thumbnail", "youtube-channel-banner", "youtube-banner", "facebook-reels", "facebook-feed", "linkedin-video", "linkedin-feed-square", "linkedin-feed-landscape", "x-video", "x-feed-landscape", "x-feed-portrait"],
                "type": "string"
              },
              "width": {
                "description": "Element width in px.",
                "minimum": 1,
                "type": "integer"
              },
              "x": {
                "description": "Element's left edge in px from the frame's left edge.",
                "type": "integer"
              },
              "y": {
                "description": "Element's top edge in px from the frame's top edge.",
                "type": "integer"
              }
            },
            "required": ["height", "placementId", "width", "x", "y"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "box": {
                "properties": {
                  "height": {
                    "type": "integer"
                  },
                  "width": {
                    "type": "integer"
                  },
                  "x": {
                    "type": "integer"
                  },
                  "y": {
                    "type": "integer"
                  }
                },
                "required": ["height", "width", "x", "y"],
                "type": "object"
              },
              "firstPartySourceUrl": {
                "type": ["string", "null"]
              },
              "frame": {
                "properties": {
                  "height": {
                    "type": "integer"
                  },
                  "width": {
                    "type": "integer"
                  }
                },
                "required": ["height", "width"],
                "type": "object"
              },
              "intrusionPx": {
                "anyOf": [
                  {
                    "properties": {
                      "bottom": {
                        "type": "integer"
                      },
                      "left": {
                        "type": "integer"
                      },
                      "right": {
                        "type": "integer"
                      },
                      "top": {
                        "type": "integer"
                      }
                    },
                    "required": ["bottom", "left", "right", "top"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "placementId": {
                "type": "string"
              },
              "referenceToolUrl": {
                "type": "string"
              },
              "safeAreaKind": {
                "enum": ["published", "unpublished", "noOverlay", "region"],
                "type": "string"
              },
              "safeRectPx": {
                "anyOf": [
                  {
                    "properties": {
                      "height": {
                        "type": "integer"
                      },
                      "width": {
                        "type": "integer"
                      },
                      "x": {
                        "type": "integer"
                      },
                      "y": {
                        "type": "integer"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "unpublishedReason": {
                "type": ["string", "null"]
              },
              "verdict": {
                "enum": ["inside", "intrudes", "unknown"],
                "type": "string"
              },
              "withinFrame": {
                "type": "boolean"
              }
            },
            "required": ["box", "firstPartySourceUrl", "frame", "intrusionPx", "placementId", "referenceToolUrl", "safeAreaKind", "safeRectPx", "unpublishedReason", "verdict", "withinFrame"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an element against a placement safe area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc11fe0652046842b0b1c69fc6b8ab5c8040b9df6dbc8376afd71769f1949c3d"
        },
        {
          "name": "convert_subtitles",
          "title": "Convert subtitles between SRT and WebVTT",
          "description": "Convert subtitle text between SubRip (srt) and WebVTT (vtt), optionally shifting every cue by shiftMs, and return the converted text with the detected source format, cue count, parse warnings (with line numbers) and timing issues (overlapping, zero-length or out-of-order cues). Pass the file contents, not a path. Malformed blocks are skipped with a warning instead of failing the whole file. ASS/SSA input is not supported here; the @prismposter/creator-tools package converts it. Errors when no cue could be parsed, the input is over 2 MB, or the shift is beyond one hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "The full SRT or WebVTT file contents as text.",
                "minLength": 1,
                "type": "string"
              },
              "shiftMs": {
                "description": "Move every cue by this many ms: positive is later, negative earlier.",
                "maximum": 3600000,
                "minimum": -3600000,
                "type": "integer"
              },
              "toFormat": {
                "description": "Format to convert to.",
                "enum": ["srt", "vtt"],
                "type": "string"
              }
            },
            "required": ["input", "toFormat"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cueCount": {
                "type": "integer"
              },
              "endMs": {
                "type": ["number", "null"]
              },
              "issues": {
                "items": {
                  "properties": {
                    "cue": {
                      "type": "integer"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "otherCue": {
                      "type": "integer"
                    }
                  },
                  "required": ["cue", "kind"],
                  "type": "object"
                },
                "type": "array"
              },
              "output": {
                "type": "string"
              },
              "referenceToolUrl": {
                "type": "string"
              },
              "shiftMs": {
                "type": "integer"
              },
              "sourceFormat": {
                "enum": ["srt", "vtt"],
                "type": "string"
              },
              "targetFormat": {
                "enum": ["srt", "vtt"],
                "type": "string"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "kind": {
                      "type": "string"
                    },
                    "line": {
                      "type": "integer"
                    }
                  },
                  "required": ["kind", "line"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["cueCount", "endMs", "issues", "output", "referenceToolUrl", "shiftMs", "sourceFormat", "targetFormat", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert subtitles between SRT and WebVTT"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9d9ae4026ec343ecb05384de9018b8e71109dfb8b5917e2f1f5af7a8a10758f"
        },
        {
          "name": "estimate_tempo",
          "title": "Estimate tempo, delay times and bar lengths",
          "description": "Tempo arithmetic for editing to music: pass tap timestamps (ms) to estimate BPM with a stability and confidence rating, or pass a known bpm. Either way it returns the beat length, a delay table (straight, dotted and triplet ms for each note value) and how many seconds a number of bars lasts in a time signature. It works on numbers you supply and does not analyse audio. Errors when neither input is given, the taps do not yield a tempo, bpm is outside 30-300, or the time signature is not one listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bars": {
                "default": 16,
                "description": "Number of bars to convert into seconds. Default 16.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bpm": {
                "description": "Known tempo in beats per minute. Used instead of the tap estimate when both are given.",
                "maximum": 300,
                "minimum": 30,
                "type": "number"
              },
              "timeSignature": {
                "default": "4/4",
                "description": "Time signature for the bar length. Default 4/4.",
                "enum": ["4/4", "3/4", "2/4", "6/8", "5/4", "7/8", "12/8"],
                "type": "string"
              },
              "timestampsMs": {
                "description": "Tap times in ms from a monotonic clock (performance.now()), in order.",
                "items": {
                  "type": "number"
                },
                "minItems": 2,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bars": {
                "type": "number"
              },
              "barsDurationSeconds": {
                "type": "number"
              },
              "bpm": {
                "type": "number"
              },
              "delaysMs": {
                "items": {
                  "properties": {
                    "beats": {
                      "type": "number"
                    },
                    "dotted": {
                      "type": "number"
                    },
                    "fraction": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "straight": {
                      "type": "number"
                    },
                    "triplet": {
                      "type": "number"
                    }
                  },
                  "required": ["beats", "dotted", "fraction", "id", "straight", "triplet"],
                  "type": "object"
                },
                "type": "array"
              },
              "quarterNoteMs": {
                "type": "number"
              },
              "referenceToolUrl": {
                "type": "string"
              },
              "tapAnalysis": {
                "anyOf": [
                  {
                    "properties": {
                      "bpm": {
                        "type": ["number", "null"]
                      },
                      "confidence": {
                        "enum": ["none", "low", "medium", "high"],
                        "type": "string"
                      },
                      "discarded": {
                        "type": "integer"
                      },
                      "intervalsUsed": {
                        "type": "integer"
                      },
                      "spreadMs": {
                        "type": "number"
                      },
                      "stability": {
                        "type": "number"
                      },
                      "taps": {
                        "type": "integer"
                      }
                    },
                    "required": ["bpm", "confidence", "discarded", "intervalsUsed", "spreadMs", "stability", "taps"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "timeSignature": {
                "type": "string"
              }
            },
            "required": ["bars", "barsDurationSeconds", "bpm", "delaysMs", "quarterNoteMs", "referenceToolUrl", "tapAnalysis", "timeSignature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate tempo, delay times and bar lengths"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9ebe045e5e2343e122ba17074789faa960b0b431bca51fdca7eef04fbc3b5a0"
        },
        {
          "name": "estimate_video_bitrate",
          "title": "Estimate video file size and bitrate",
          "description": "Video size and bitrate arithmetic for a clip of durationSec. Pass videoKbps to get the encoded file size (MB, GB, MiB, GiB); pass targetCapMb to get the highest video bitrate that fits that file size. Audio is added at audioKbps (default 192). Every answer also gives the highest video bitrate that fits Discord's 20 MB free upload limit. Kbps is decimal (1 kbps = 1000 bit/s) and MB is 1,000,000 bytes. Use it to plan an export or hit an upload cap; it does not inspect or encode files. Errors when neither videoKbps nor targetCapMb is given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audioKbps": {
                "default": 192,
                "description": "Audio track bitrate in kbps. Default 192; 0 for a silent clip.",
                "minimum": 0,
                "type": "number"
              },
              "durationSec": {
                "description": "Clip length in seconds.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "targetCapMb": {
                "description": "File-size ceiling in MB (decimal), to solve for the maximum video bitrate.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "videoKbps": {
                "description": "Video track bitrate in kbps, to estimate the file size.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["durationSec"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audioKbps": {
                "type": "number"
              },
              "discordFreeMaxVideoMbps": {
                "type": "number"
              },
              "discordFreeUploadCapMb": {
                "type": "number"
              },
              "durationSec": {
                "type": "number"
              },
              "estimatedSize": {
                "anyOf": [
                  {
                    "properties": {
                      "bytes": {
                        "type": "number"
                      },
                      "bytesPerMinute": {
                        "type": "number"
                      },
                      "gibibytes": {
                        "type": "number"
                      },
                      "gigabytes": {
                        "type": "number"
                      },
                      "mebibytes": {
                        "type": "number"
                      },
                      "megabytes": {
                        "type": "number"
                      },
                      "totalKbps": {
                        "type": "number"
                      }
                    },
                    "required": ["bytes", "bytesPerMinute", "gibibytes", "gigabytes", "mebibytes", "megabytes", "totalKbps"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "referenceToolUrl": {
                "type": "string"
              },
              "requiredBitrateForCap": {
                "anyOf": [
                  {
                    "properties": {
                      "audioKbps": {
                        "type": "number"
                      },
                      "audioOverBudget": {
                        "type": "boolean"
                      },
                      "totalKbps": {
                        "type": "number"
                      },
                      "videoKbps": {
                        "type": "number"
                      }
                    },
                    "required": ["audioKbps", "audioOverBudget", "totalKbps", "videoKbps"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "targetCapMb": {
                "type": ["number", "null"]
              },
              "videoKbps": {
                "type": ["number", "null"]
              }
            },
            "required": ["audioKbps", "discordFreeMaxVideoMbps", "discordFreeUploadCapMb", "durationSec", "estimatedSize", "referenceToolUrl", "requiredBitrateForCap", "targetCapMb", "videoKbps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
