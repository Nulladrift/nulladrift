{
  "lockfileVersion": 2,
  "subjects": {
    "com.blvigil/site-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blvigil.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Vigil site MCP",
        "version": "2026.09.15"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for blvigil.com: read the site, list what can be bought (list_products) and start a purchase (create_checkout, get_checkout). create_checkout never charges anything: it returns a continue_url where the buyer pays on the Stripe-hosted checkout page. No credentials. Rate limited; stay under one call per second. See https://blvigil.com/auth.md.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Start a purchase of one offer. Returns a continue_url: send the buyer there to pay on the Stripe-hosted checkout page. This tool does not charge anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "enum": ["vigil-mac", "vigil-windows", "vigil-node"],
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54f58d65f4a40c8683e29343fb2ef7b389b52fafe34918917f0a9d6b65955775"
        },
        {
          "name": "get_checkout",
          "description": "Read a checkout started with create_checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkout_id": {
                "type": "string"
              }
            },
            "required": ["checkout_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:740ff212a1f0a4e97c58fe1b537c71a72da98ca86d64c2d9d24862618dab69e5"
        },
        {
          "name": "list_products",
          "description": "Everything an agent can buy from Vigil, with Stripe-verified prices, billing terms, delivery and live availability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd21eb60266ee208fb0bbd2dff1aa1e4c9bffe5c91287bb3bd913ce3ace2cd7d"
        },
        {
          "name": "read_page",
          "description": "Read one https://blvigil.com page as Markdown (Cloudflare Markdown for Agents) or stripped text, up to 40,000 characters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b997b84713446990bd621a2ee1f731bc2e64e86e06c89a4c46c826e26da1441a"
        },
        {
          "name": "search_pages",
          "description": "Find pages on blvigil.com by words in their URL path (sitemap search). Returns URLs with a match score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
