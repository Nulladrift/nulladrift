      "instructions": "JobCrawls aggregates job listings in Finland in three languages: English (en), Finnish (fi) and Swedish (sv). Each language is a separate index with its own localized content and localized filter values: the values for field, jobType, remoteness, educationLevel and roleLevel are in English under \"en\", Finnish under \"fi\" and Swedish under \"sv\".\n\nLocales: every tool takes \"locale\" (\"fi\", \"sv\" or \"en\"). The locale that matches a user is the language of their own words, not of job titles, company names or place names: \"etsi React developer -töitä Espoosta\" is Finnish, so its locale is \"fi\". When \"locale\" is omitted, search_jobs and list_job_filters detect it from the query text. Tool results, the inline cards and the linked jobcrawls.com pages are in the requested locale. Finnish-market listings are most complete under \"fi\".\n\nFilters: filter values are localized, so a value returned by list_job_filters for one locale matches search_jobs \"filters\" only under that same locale. An English value such as \"Software Engineering\" does not match in the fi or sv index. Free-text \"query\" terms match best in the index's own language.\n\nNet salary: calculate_net_salary_finland takes a gross amount (monthly unless \"period\" is \"year\") or a target net, plus optional municipality, age and dependent children. It has no church membership or union fee inputs, since those are sensitive personal data; its result's pageUrl opens the same scenario on jobcrawls.com, where those options can be set in the user's own browser. The result includes the monthly net, the effective rate, the employer cost and the list of assumptions used.\n\nInline cards: search_jobs, get_job_details and calculate_net_salary_finland results come with an MCP App view (job cards with company logo, salary and a link to the posting; a job detail card; the tax iceberg for net salary). The cards are interactive: filter chips, a map of Finland's regions, a salary slider, a two-offer comparison and a requirements checklist. Card actions such as \"Ask about this\" or \"Help me apply\" arrive as an ordinary user message with the JobCrawls job id.\n\nData fields: salaryIsEstimate: true marks a JobCrawls market-based estimate rather than an employer-stated salary. employerGrade is the JobCrawls Employer Score letter grade (A best). marketSalary is what the role pays in the market (the JobCrawls salary pages' figures: Statistics Finland earnings raised to today where the occupation is covered, its source field says which), given only next to an employer-stated salary. isTyomarkkinatori: true marks a Job Market Finland listing, which carries a dataSource attribution required by Job Market Finland's terms of use. Each result's \"notes\" text spells out which of these apply to it.\n\nBeyond job search: pay for a role (pay_for_role, compare_pay, convert_hourly_pay, collective_agreement_minimum, list_collective_agreements), employers (get_company_profile, how_they_hire, get_company_hiring, get_company_hiring_now, get_company_language_profile, get_company_ad_profile, find_employers, get_employer_owners), career moves (explore_career_paths, roles_for_skills, skills_for_role), job market figures (get_labour_market_figures, get_locations_overview, get_pay_transparency) and Finnish employment rules (get_change_security_timeline, calculate_part_time_job, check_resign_or_refuse, check_degree_recognition, get_grace_period_plan, calculate_interview_travel_claim, build_wage_subsidy_paragraph). Every tool is read-only and uses public data only; none takes or stores personal data. companyId values come from search_jobs or get_job_details results.\n\nAccess and limits: this connector needs no account. Calls relayed by ChatGPT or Claude from their published addresses get 3000 tool calls an hour per relaying address; other clients get 60 an hour per address, with short bursts of 10. Signed-in JobCrawls users can connect the account connector instead (https://www.jobcrawls.com/connector), which adds their saved jobs, watchlist, alerts and profile tools within weekly limits.\n\nData use: every result carries a dataUse block. Aggregate figures JobCrawls computes (pay, counts, shares) are free to reuse, including commercially, with the credit \"Source: JobCrawls\" and a link to the jobcrawls.com page they came from. Individual job listings are not licensed for redistribution. Full terms, with every data source and its licence: https://www.jobcrawls.com/en/data-use",
      "tools": [
        {
          "name": "build_wage_subsidy_paragraph",
          "title": "Wage subsidy paragraph",
          "description": "A short paragraph a job seeker in Finland can give an employer to bring up a wage subsidy (palkkatuki), in Finnish, Swedish or English, with the reminder that the subsidy is agreed with the employment services before the contract is signed. eligible is false when the planned start date is today or earlier. The employment services decide the subsidy; the paragraph is not a promise. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "employerName": {
                "maxLength": 120,
                "type": "string"
              },
              "locale": {
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "roleTitle": {
                "maxLength": 120,
                "type": "string"
              },
              "startDate": {
                "description": "The planned start date of the job.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "basis": {
                "description": "Where the figures come from: source, as-of date and sample."
              },
              "data": {
                "description": "The tool result."
              },
              "dataUse": {
                "additionalProperties": false,
                "description": "What may be reused from this result and how to credit JobCrawls.",
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "howToCite": {
                    "type": "string"
                  },
                  "reuse": {
                    "type": "string"
                  },
                  "terms": {
                    "type": "string"
                  }
                },
                "required": ["attribution", "reuse", "terms"],
                "type": "object"
              },
              "limitReached": {
                "description": "Present when a weekly limit stopped the call: which limit, its size and when it resets."
              },
              "links": {
                "description": "JobCrawls pages for the jobs and companies mentioned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
