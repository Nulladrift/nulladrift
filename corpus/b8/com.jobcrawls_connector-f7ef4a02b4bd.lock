        {
          "name": "get_job_details",
          "title": "Get full job listing details",
          "description": "Returns the complete details of one JobCrawls listing by its id (the `id` field of a search_jobs result): full description, requirements, responsibilities, benefits, salary, company, location, application deadline and a direct link to the posting. Listings sourced from Job Market Finland (Työmarkkinatori) have isTyomarkkinatori: true and include a dataSource attribution required by Job Market Finland's terms of use. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The listing id (the `id` field returned by search_jobs). Required.",
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "Language of the user's message (fi for Finnish, sv for Swedish, en for English or any other language), including when job titles or place names in it are English. Language to return the listing content in: en = English, fi = Finnish, sv = Swedish, normally the locale of the search the id came from. This call has no query text to detect language from, so it defaults to en when omitted. If the listing is not available in that language the connector falls back to whichever language it exists in.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "applicationDeadline": {
                "description": "YYYY-MM-DD, or null when none is stated.",
                "type": ["string", "null"]
              },
              "benefits": {
                "$ref": "#/properties/field"
              },
              "brandColor": {
                "$ref": "#/properties/title"
              },
              "company": {
                "$ref": "#/properties/title"
              },
              "companyUrl": {
                "$ref": "#/properties/title"
              },
              "dataSource": {
                "description": "Present only when isTyomarkkinatori is true. Attribution required alongside the listing by Job Market Finland's terms of use.",
                "type": "string"
              },
              "description": {
                "$ref": "#/properties/title"
              },
              "educationLevel": {
                "$ref": "#/properties/field"
              },
              "employerGrade": {
                "anyOf": [
                  {
                    "enum": ["A", "B", "C", "D", "E"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "JobCrawls Employer Score as a letter grade (A best), or null when the employer is not scored."
              },
              "field": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "string"
                      }
                    ]
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "type": "string"
              },
              "isActive": {
                "type": ["boolean", "null"]
              },
              "isTyomarkkinatori": {
                "description": "True when the listing is sourced from Job Market Finland (Työmarkkinatori).",
                "type": "boolean"
              },
              "jobType": {
                "$ref": "#/properties/title"
              },
              "languagesRequired": {
                "$ref": "#/properties/field"
              },
              "locale": {
                "description": "Language index the listing was found in.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "location": {
                "anyOf": [
                  {
                    "$ref": "#/properties/field/anyOf/0"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "One location, or several for multi-location listings."
              },
              "logoUrl": {
                "$ref": "#/properties/title"
              },
              "marketSalary": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "currency": {
                        "type": "string"
                      },
                      "median": {
                        "type": "number"
                      },
                      "p25": {
                        "type": "number"
                      },
                      "p75": {
                        "type": "number"
                      },
                      "period": {
                        "type": "string"
                      },
                      "sampleSize": {
                        "description": "Number of comparable postings the band is based on (with source statistics_finland: the ads behind the place and level differences).",
                        "type": "number"
                      },
                      "source": {
                        "description": "statistics_finland: Statistics Finland earnings for the occupation raised to today, moved by job-ad differences (the JobCrawls salary pages figures). job_ads: stated pay in job ads.",
                        "enum": ["statistics_finland", "job_ads"],
                        "type": "string"
                      }
                    },
                    "required": ["currency", "median", "p25", "p75", "period", "sampleSize"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "What the role pays in the market (gross EUR per month, the JobCrawls salary pages figures), only next to an employer-stated salary; null otherwise."
              },
              "postedDate": {
                "description": "YYYY-MM-DD.",
                "type": ["string", "null"]
              },
              "remoteness": {
                "$ref": "#/properties/title"
              },
              "requirements": {
                "$ref": "#/properties/title"
              },
              "responsibilities": {
                "$ref": "#/properties/title"
              },
              "roleLevel": {
                "$ref": "#/properties/field"
              },
              "salary": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "currency": {
                        "description": "ISO currency code, e.g. \"EUR\".",
                        "type": "string"
                      },
                      "max": {
                        "description": "Upper bound of the advertised salary, or null when only a minimum is known.",
                        "type": ["number", "null"]
                      },
                      "min": {
                        "description": "Lower bound of the advertised salary, or null when only a maximum is known.",
                        "type": ["number", "null"]
                      },
                      "period": {
                        "description": "Pay period of min/max, e.g. \"month\", \"year\", \"hour\".",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["currency", "max", "min", "period"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Advertised salary range, or null when the listing states none."
              },
              "salaryIsEstimate": {
                "description": "True when `salary` is a JobCrawls market-based estimate rather than stated by the employer.",
                "type": "boolean"
              },
              "skills": {
                "$ref": "#/properties/field"
              },
              "title": {
                "type": ["string", "null"]
              },
              "url": {
                "description": "Direct link to the individual posting on jobcrawls.com (or the source posting).",
                "type": ["string", "null"]
              }
            },
            "required": ["applicationDeadline", "benefits", "brandColor", "company", "companyUrl", "description", "educationLevel", "employerGrade", "field", "id", "isActive", "isTyomarkkinatori", "jobType", "languagesRequired", "locale", "location", "logoUrl", "marketSalary", "postedDate", "remoteness", "requirements", "responsibilities", "roleLevel", "salary", "salaryIsEstimate", "skills", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get full job listing details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://jobcrawls/job-detail/v1.html",
            "ui": {
              "resourceUri": "ui://jobcrawls/job-detail/v1.html"
            }
          },
