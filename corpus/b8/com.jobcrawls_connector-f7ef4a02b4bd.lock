      "instructions": "JobCrawls aggregates job listings in Finland in three languages: English (en), Finnish (fi) and Swedish (sv). Each language is a separate index with its own localized content and localized filter values: the values for field, jobType, remoteness, educationLevel and roleLevel are in English under \"en\", Finnish under \"fi\" and Swedish under \"sv\".\n\nLocales: every tool takes \"locale\" (\"fi\", \"sv\" or \"en\"). The locale that matches a user is the language of their own words, not of job titles, company names or place names: \"etsi React developer -töitä Espoosta\" is Finnish, so its locale is \"fi\". When \"locale\" is omitted, search_jobs and list_job_filters detect it from the query text. Tool results, the inline cards and the linked jobcrawls.com pages are in the requested locale. Finnish-market listings are most complete under \"fi\".\n\nFilters: filter values are localized, so a value returned by list_job_filters for one locale matches search_jobs \"filters\" only under that same locale. An English value such as \"Software Engineering\" does not match in the fi or sv index. Free-text \"query\" terms match best in the index's own language.\n\nNet salary: calculate_net_salary_finland takes a gross amount (monthly unless \"period\" is \"year\") or a target net, plus optional municipality, age and dependent children. It has no church membership or union fee inputs, since those are sensitive personal data; its result's pageUrl opens the same scenario on jobcrawls.com, where those options can be set in the user's own browser. The result includes the monthly net, the effective rate, the employer cost and the list of assumptions used.\n\nInline cards: search_jobs, get_job_details and calculate_net_salary_finland results come with an MCP App view (job cards with company logo, salary and a link to the posting; a job detail card; the tax iceberg for net salary). The cards are interactive: filter chips, a map of Finland's regions, a salary slider, a two-offer comparison and a requirements checklist. Card actions such as \"Ask about this\" or \"Help me apply\" arrive as an ordinary user message with the JobCrawls job id.\n\nData fields: salaryIsEstimate: true marks a JobCrawls market-based estimate rather than an employer-stated salary. employerGrade is the JobCrawls Employer Score letter grade (A best). marketSalary is what the role pays in the market (the JobCrawls salary pages' figures: Statistics Finland earnings raised to today where the occupation is covered, its source field says which), given only next to an employer-stated salary. isTyomarkkinatori: true marks a Job Market Finland listing, which carries a dataSource attribution required by Job Market Finland's terms of use. Each result's \"notes\" text spells out which of these apply to it.\n\nAccess and limits: this connector needs no account. Calls relayed by ChatGPT or Claude from their published addresses get 3000 tool calls an hour per relaying address; other clients get 60 an hour per address, with short bursts of 10. Signed-in JobCrawls users can connect the account connector instead (https://www.jobcrawls.com/connector), which adds their saved jobs, watchlist, alerts and profile tools within weekly limits.\n\nData use: every result carries a dataUse block. Aggregate figures JobCrawls computes (pay, counts, shares) are free to reuse, including commercially, with the credit \"Source: JobCrawls\" and a link to the jobcrawls.com page they came from. Individual job listings are not licensed for redistribution. Full terms, with every data source and its licence: https://www.jobcrawls.com/en/data-use",
      "tools": [
        {
          "name": "calculate_net_salary_finland",
          "title": "Calculate net salary in Finland (gross to net, employer cost)",
          "description": "Gross-to-net salary calculator for Finland, from the JobCrawls tax iceberg calculator. Example queries: \"what is 4000 gross net in Finland\", \"paljonko jää käteen 4200 euron bruttopalkasta Helsingissä\", \"vad blir nettolönen på 3800 brutto i Helsingfors\". Inputs: a gross salary (EUR per month by default, or per year), or a target net to solve the gross it takes, and optionally the municipality, employer size, age, dependent children, commuting costs and investment income. Church membership and union fees are not inputs. The linked page is in the language detected from \"municipality\" when locale is omitted, else English, or in the given locale. Returns monthly and annual breakdowns: employee pension and unemployment contributions, state, municipal, church and Yle taxes, net pay, employer contributions and the true cost of employment, plus the effective tax rate, the assumptions used and a link to the same scenario on jobcrawls.com. Uses the current tax year's official Finnish parameters; an estimate, not tax advice. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age in years, affects pension and unemployment contributions.",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "capitalGains": {
                "description": "Capital gains net of acquisition cost in the same period.",
                "minimum": 0,
                "type": "number"
              },
              "commutingCosts": {
                "description": "Commuting costs in the same period; deductible above the own-liability share, capped.",
                "minimum": 0,
                "type": "number"
              },
              "dependentChildren": {
                "description": "Number of dependent children, affects the child tax deduction.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "dividends": {
                "description": "Listed-company dividends in the same period (capital income).",
                "minimum": 0,
                "type": "number"
              },
              "employerSize": {
                "description": "Employer payroll size for the unemployment-insurance rate (large = payroll above about EUR 2.5 million). Omit for a blended average.",
                "enum": ["small", "large"],
                "type": "string"
              },
              "gross": {
                "description": "Gross salary in euros, per month unless period is \"year\". Either gross or net is required.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "includeVat": {
                "description": "Also subtract the VAT paid when the net is spent (an estimate). Default false.",
                "type": "boolean"
              },
              "isSoleGuardian": {
                "description": "Single parent with dependent children (child deduction).",
                "type": "boolean"
              },
              "keyEmployee": {
                "description": "Key employee source tax (avainhenkilön lähdevero): 25% flat on gross from 2026 instead of progressive tax, for people who moved to Finland for expert work (at least EUR 5,800 a month, not resident in Finland in the previous 5 years, first 84 months). Default false.",
                "type": "boolean"
              },
              "locale": {
                "description": "Language of the user's message (fi for Finnish, sv for Swedish, en for English or any other language), including when job titles or place names in it are English. Language of the result notes, the inline card and the linked page. When omitted, detected from \"municipality\" if it is given in Finnish or Swedish form; otherwise defaults to en.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "municipality": {
                "description": "Finnish municipality, by its Finnish or Swedish name, e.g. \"Helsinki\", \"Helsingfors\" or \"Espoo\". Omit for the national-average municipal tax rate.",
                "maxLength": 60,
                "type": "string"
              },
              "net": {
                "description": "Target net pay in euros (same period): the tool solves the gross salary that leaves this in hand. Either gross or net is required.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "period": {
                "description": "Period of every money amount given. Default month.",
                "enum": ["month", "year"],
                "type": "string"
              },
              "unlistedDividends": {
                "description": "Dividends from the person's own unlisted company in the same period (8% yield rule).",
                "minimum": 0,
                "type": "number"
              },
              "unlistedNetAssets": {
                "description": "Mathematical value of the person's shares in that company, EUR (a stock, not per period).",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "annual": {
                "additionalProperties": true,
                "description": "Breakdown per year, EUR.",
                "properties": {
                  "deductionsApplied": {
                    "$ref": "#/properties/monthly/properties/deductionsApplied"
                  },
                  "employeeContributions": {
                    "$ref": "#/properties/monthly/properties/employeeContributions"
                  },
                  "employerContributions": {
                    "$ref": "#/properties/monthly/properties/employerContributions"
                  },
                  "gross": {
                    "$ref": "#/properties/monthly/properties/gross"
                  },
                  "net": {
                    "$ref": "#/properties/monthly/properties/net"
                  },
                  "netAfterVat": {
                    "$ref": "#/properties/monthly/properties/netAfterVat"
                  },
                  "taxes": {
                    "$ref": "#/properties/monthly/properties/taxes"
                  },
                  "trueEmployerCost": {
                    "$ref": "#/properties/monthly/properties/trueEmployerCost"
                  },
                  "vatOnSpending": {
                    "$ref": "#/properties/monthly/properties/vatOnSpending"
                  }
                },
                "required": ["deductionsApplied", "employeeContributions", "employerContributions", "gross", "net", "netAfterVat", "taxes", "trueEmployerCost", "vatOnSpending"],
                "type": "object"
              },
              "assumptions": {
                "additionalProperties": true,
                "properties": {
                  "churchTaxRatePct": {
                    "type": ["number", "null"]
                  },
                  "employerUnemploymentInsurance": {
                    "type": "string"
                  },
                  "isGenericEstimate": {
                    "type": "boolean"
                  },
                  "municipalTaxRatePct": {
                    "type": "number"
                  },
                  "municipalityUsed": {
                    "type": "string"
                  },
                  "notes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["churchTaxRatePct", "employerUnemploymentInsurance", "isGenericEstimate", "municipalTaxRatePct", "municipalityUsed", "notes"],
                "type": "object"
              },
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "destinations": {
                "description": "Where the taxes and contributions go, EUR per year.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "annual": {
                      "type": "number"
                    },
                    "key": {
                      "type": "string"
                    },
                    "sharePct": {
                      "type": "number"
                    }
                  },
                  "required": ["annual", "key", "sharePct"],
                  "type": "object"
                },
                "type": "array"
              },
              "icebergSvgUrl": {
                "description": "Image illustrating the breakdown.",
                "type": "string"
              },
              "input": {
                "additionalProperties": true,
                "description": "The inputs the calculation used, after defaults.",
                "properties": {
                  "gross": {
                    "type": "number"
                  },
                  "municipality": {
                    "type": ["string", "null"]
                  },
                  "period": {
                    "type": "string"
                  },
                  "targetNet": {
                    "description": "The target net when the gross was solved from one.",
                    "type": ["number", "null"]
                  }
                },
                "required": ["gross", "municipality", "period", "targetNet"],
                "type": "object"
              },
              "investments": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Capital income breakdown, or null when no investment income was given."
              },
              "locale": {
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "monthly": {
                "additionalProperties": true,
                "description": "Breakdown per month, EUR.",
                "properties": {
                  "deductionsApplied": {
                    "additionalProperties": true,
                    "properties": {
                      "commuting": {
                        "type": "number"
                      },
                      "earnedIncomeCredit": {
                        "type": "number"
                      },
                      "unionFees": {
                        "type": "number"
                      }
                    },
                    "required": ["commuting", "earnedIncomeCredit", "unionFees"],
                    "type": "object"
                  },
                  "employeeContributions": {
                    "additionalProperties": true,
                    "properties": {
                      "dailyAllowance": {
                        "type": "number"
                      },
                      "pension": {
                        "type": "number"
                      },
                      "total": {
                        "type": "number"
                      },
                      "unemployment": {
                        "type": "number"
                      }
                    },
                    "required": ["dailyAllowance", "pension", "total", "unemployment"],
                    "type": "object"
                  },
                  "employerContributions": {
                    "additionalProperties": true,
                    "properties": {
                      "accidentInsurance": {
                        "type": "number"
                      },
                      "groupLife": {
                        "type": "number"
                      },
                      "healthInsurance": {
                        "type": "number"
                      },
                      "total": {
                        "type": "number"
                      },
                      "tyel": {
                        "type": "number"
                      },
                      "unemploymentInsurance": {
                        "type": "number"
                      }
                    },
                    "required": ["accidentInsurance", "groupLife", "healthInsurance", "total", "tyel", "unemploymentInsurance"],
                    "type": "object"
                  },
                  "gross": {
                    "type": "number"
                  },
                  "net": {
                    "description": "Take-home pay.",
                    "type": "number"
                  },
                  "netAfterVat": {
                    "type": "number"
                  },
                  "taxes": {
                    "additionalProperties": true,
                    "properties": {
                      "church": {
                        "type": "number"
                      },
