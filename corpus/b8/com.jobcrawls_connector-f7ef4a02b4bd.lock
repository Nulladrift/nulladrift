        {
          "name": "list_job_filters",
          "title": "List available job filters and values",
          "description": "Returns the facet attributes jobs can be filtered by (for example field, location, job type, seniority level, skills and languages), with the values currently present in active listings and how many listings have each value. The values are the exact strings search_jobs accepts in its `filters` parameter for the same locale. An optional query scopes the values to matching listings. Values are in the language of that query when locale is omitted, or in the given locale. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the user's message (fi for Finnish, sv for Swedish, en for English or any other language), including when job titles or place names in it are English. Language index whose facet values to return: en = English, fi = Finnish, sv = Swedish. When omitted, the language of \"query\" (detected from it) is used. Values are localized and match search_jobs \"filters\" verbatim under the same locale.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "query": {
                "description": "Optional free-text query to scope the facet values to a subset of listings (e.g. only the facets present in \"nurse\" jobs). Leave empty for the whole active index.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "booleanFilters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Boolean search_jobs parameters and what they do.",
                "type": "object"
              },
              "facets": {
                "additionalProperties": {
                  "items": {
                    "additionalProperties": true,
                    "properties": {
                      "count": {
                        "type": "number"
                      },
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["count", "value"],
                    "type": "object"
                  },
                  "type": "array"
                },
                "description": "Values to pass verbatim in search_jobs \"filters\" with the same locale.",
                "type": "object"
              },
              "locale": {
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "numericFilters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Numeric search_jobs parameters and what they do.",
                "type": "object"
              },
              "query": {
                "type": ["string", "null"]
              }
            },
            "required": ["booleanFilters", "facets", "locale", "numericFilters", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List available job filters and values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f4368c2b1625fa0cf5c6b9e5416aad732067498163d9612aa5218e73ea020ed"
        },
        {
          "name": "search_jobs",
          "title": "Search Finnish job listings",
          "description": "Searches active job listings on JobCrawls, an aggregator of jobs in Finland. The index covers jobs located in Finland plus remote roles open to Finland, and has no listings for other countries. Example queries: \"find nurse jobs in Tampere\", \"onko Helsingissä avoimia etätyöpaikkoja ohjelmistokehittäjälle\", \"finns det lediga jobb som sjukskötare i Åbo\". Inputs: a free-text query, facet filters (field, location, job type, seniority, skills, languages, industry, education and more), a remote-only flag, a salary floor, sort order and paging. Results, filter values and job text are in the language of the query when locale is omitted, or in the given locale. Output: a paginated list, each result with title, company, location, remoteness, salary range when known and a direct link to the posting. Valid filter values come from list_job_filters; the full text of a result comes from get_job_details. Listings sourced from Job Market Finland (Työmarkkinatori) have isTyomarkkinatori: true and include a dataSource attribution required by Job Market Finland's terms of use. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "excludeFilters": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Negative facet filters keyed by attribute, same shape as `filters` but EXCLUDES listings matching any of the given values instead of requiring them, for jobs that do not have a given attribute value. Allowed keys: field, normalisedTitle, normalisedRoleLevel, location, companyIndustry, companyId, jobType, requiredLanguages, optionalLanguages, benefits, skillsAndTechnologies, educationLevel, peopleManagementTier, remoteness, regionTags, atsVendor. Same locale rules as `filters` apply. Example (en): { \"requiredLanguages\": [\"Finnish\"] } returns jobs that do not require Finnish. A key present in both `filters` and `excludeFilters` is invalid.",
                "type": "object"
              },
              "filters": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Facet filters keyed by attribute, each an array of allowed values (values within one attribute are OR-combined, with two exceptions: requiredLanguages takes the languages the user speaks and returns jobs that require no other language, so [\"English\", \"Finnish\"] means jobs needing only English, only Finnish, or both; benefits returns jobs with every listed benefit. Different attributes are AND-combined). Allowed keys: field, normalisedTitle, normalisedRoleLevel, location, companyIndustry, companyId, jobType, requiredLanguages, optionalLanguages, benefits, skillsAndTechnologies, educationLevel, peopleManagementTier, remoteness, regionTags, atsVendor. Values are case-sensitive and language-specific: they match only in the locale index list_job_filters returned them for (for example field is \"Software Engineering\" in en but its Finnish equivalent in fi). Example (en): { \"field\": [\"Software Engineering\"], \"location\": [\"Helsinki, Finland\"] }. regionTags takes the `placeId` of an entry in a previous result's `regions` (a Finnish region).",
                "type": "object"
              },
              "includeFacets": {
                "description": "When true, also return the facet values and counts for the current result set, plus `regions` (job counts per Finnish region). Default: false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Results per page (1–20). Default: 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the user's message (fi for Finnish, sv for Swedish, en for English or any other language), including when job titles or place names in it are English. Language index to search: en = English, fi = Finnish, sv = Swedish. When omitted, results, filter values and job text come back in the language of \"query\" (detected from it); pass locale explicitly to override. Listing content AND filter values are localized per language, so filter values from list_job_filters match only under the same locale. \"fi\" has the broadest coverage of jobs in Finland.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "minSalary": {
                "description": "Only listings whose minimum salary is at least this amount (listing currency, usually EUR).",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Page number, starting at 1. Default: 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search across job title, description, skills, company, and location. Example: \"senior software engineer\". Leave empty to browse the newest listings.",
                "type": "string"
              },
              "remoteOnly": {
                "description": "Shortcut for only fully remote positions (remoteness = Remote).",
                "type": "boolean"
              },
              "sort": {
                "description": "Ordering: relevance (default), date (newest first), or salary (highest minimum first).",
                "enum": ["relevance", "date", "salary"],
                "type": "string"
              },
              "titleOnly": {
                "description": "Match `query` against job titles only, not descriptions or skills, which counts ads that are for a role (\"product manager\" ads, not ads that mention products and managers). Default: false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "facets": {
                "additionalProperties": {
                  "items": {
                    "additionalProperties": true,
                    "properties": {
                      "count": {
                        "type": "number"
                      },
                      "value": {
                        "type": "string"
                      }
                    },
                    "required": ["count", "value"],
                    "type": "object"
                  },
                  "type": "array"
                },
                "description": "Present only when includeFacets was true.",
                "type": "object"
              },
              "hasMore": {
                "description": "True when a further page exists.",
                "type": "boolean"
              },
              "locale": {
                "description": "Language index that was searched.",
                "enum": ["en", "fi", "sv"],
                "type": "string"
              },
              "page": {
                "type": "number"
              },
              "pageSize": {
                "type": "number"
              },
              "query": {
                "description": "The free-text query used, or null when browsing without one.",
                "type": ["string", "null"]
              },
              "regions": {
                "description": "Present only when includeFacets was true: job counts per Finnish region (maakunta), largest first. Pass `placeId` in filters.regionTags to narrow to one region.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "count": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "placeId": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "count", "name", "placeId"],
                  "type": "object"
                },
                "type": "array"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "brandColor": {
                      "$ref": "#/properties/results/items/properties/companyId"
                    },
                    "company": {
                      "$ref": "#/properties/results/items/properties/companyId"
                    },
                    "companyId": {
                      "type": ["string", "null"]
                    },
                    "dataSource": {
                      "description": "Present only when isTyomarkkinatori is true. Attribution required alongside the listing by Job Market Finland's terms of use.",
                      "type": "string"
                    },
                    "employerGrade": {
                      "anyOf": [
                        {
                          "enum": ["A", "B", "C", "D", "E"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "JobCrawls Employer Score as a letter grade (A best), or null when the employer is not scored."
                    },
                    "field": {
                      "$ref": "#/properties/results/items/properties/roleLevel"
                    },
                    "id": {
                      "description": "Listing id; pass to get_job_details as jobId.",
                      "type": ["string", "null"]
                    },
                    "isTyomarkkinatori": {
                      "description": "True when the listing is sourced from Job Market Finland (Työmarkkinatori).",
                      "type": "boolean"
                    },
                    "jobType": {
                      "$ref": "#/properties/results/items/properties/companyId"
                    },
                    "languages": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/results/items/properties/skills/anyOf/0"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Languages the listing requires."
                    },
                    "location": {
                      "anyOf": [
                        {
                          "anyOf": [
                            {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            {
                              "type": "string"
                            }
                          ]
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One location, or several for multi-location listings."
                    },
                    "logoUrl": {
                      "$ref": "#/properties/results/items/properties/companyId"
                    },
                    "marketSalary": {
                      "anyOf": [
                        {
                          "additionalProperties": true,
                          "properties": {
                            "currency": {
                              "type": "string"
                            },
                            "median": {
                              "type": "number"
                            },
                            "p25": {
                              "type": "number"
                            },
                            "p75": {
                              "type": "number"
                            },
                            "period": {
                              "type": "string"
                            },
                            "sampleSize": {
                              "description": "Number of comparable postings the band is based on (with source statistics_finland: the ads behind the place and level differences).",
                              "type": "number"
                            },
                            "source": {
                              "description": "statistics_finland: Statistics Finland earnings for the occupation raised to today, moved by job-ad differences (the JobCrawls salary pages figures). job_ads: stated pay in job ads.",
                              "enum": ["statistics_finland", "job_ads"],
                              "type": "string"
                            }
                          },
                          "required": ["currency", "median", "p25", "p75", "period", "sampleSize"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "What the role pays in the market (gross EUR per month, the JobCrawls salary pages figures), only next to an employer-stated salary; null otherwise."
                    },
                    "postedDate": {
                      "description": "YYYY-MM-DD.",
                      "type": ["string", "null"]
                    },
                    "remoteness": {
                      "description": "Localized remoteness value, e.g. \"Remote\", \"Hybrid\", \"On-site\".",
                      "type": ["string", "null"]
                    },
                    "roleLevel": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/results/items/properties/location/anyOf/0"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "salary": {
                      "anyOf": [
                        {
                          "additionalProperties": true,
                          "properties": {
                            "currency": {
                              "description": "ISO currency code, e.g. \"EUR\".",
                              "type": "string"
                            },
                            "max": {
                              "description": "Upper bound of the advertised salary, or null when only a minimum is known.",
                              "type": ["number", "null"]
                            },
                            "min": {
                              "description": "Lower bound of the advertised salary, or null when only a maximum is known.",
                              "type": ["number", "null"]
                            },
                            "period": {
                              "description": "Pay period of min/max, e.g. \"month\", \"year\", \"hour\".",
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["currency", "max", "min", "period"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Advertised salary range, or null when the listing states none."
                    },
                    "salaryIsEstimate": {
                      "description": "True when `salary` is a JobCrawls market-based estimate rather than stated by the employer.",
                      "type": "boolean"
                    },
                    "skills": {
                      "anyOf": [
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "snippet": {
                      "description": "Start of the job description, whitespace-collapsed.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "$ref": "#/properties/results/items/properties/companyId"
                    },
                    "url": {
                      "description": "Direct link to the individual posting on jobcrawls.com (or the source posting).",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["brandColor", "company", "companyId", "employerGrade", "field", "id", "isTyomarkkinatori", "jobType", "languages", "location", "logoUrl", "marketSalary", "postedDate", "remoteness", "roleLevel", "salary", "salaryIsEstimate", "skills", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "Number of results in this page.",
                "type": "number"
              },
              "totalFound": {
                "description": "Total matching active listings.",
                "type": "number"
              }
            },
            "required": ["hasMore", "locale", "page", "pageSize", "query", "results", "returned", "totalFound"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Finnish job listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://jobcrawls/search-results/v1.html",
            "ui": {
              "resourceUri": "ui://jobcrawls/search-results/v1.html"
            }
