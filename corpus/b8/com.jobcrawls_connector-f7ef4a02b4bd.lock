        {
          "name": "calculate_interview_travel_claim",
          "title": "Interview travel claim",
          "description": "The interview travel costs an unemployed job seeker in Finland may claim: kilometre compensation above the share the claimant pays, capped, plus overnight stays, with the claim deadline and a reminder date. Takes the kilometres, the trip date and optionally nights, municipality and the job's length and hours. Reimbursement is discretionary and municipalities can set their own rules; the result gives the rules version. Reuse: figures may be quoted with a visible link to the jobcrawls.com page in the result (or \"JobCrawls (jobcrawls.com)\" where a link is impossible); each result repeats this in dataUse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "distanceKm": {
                "description": "Total kilometres claimed for the trip (both ways when the claim covers both).",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "jobHoursPerWeek": {
                "description": "Average hours a week.",
                "maximum": 80,
                "minimum": 0,
                "type": "number"
              },
              "jobWeeks": {
                "description": "How many weeks the job lasts.",
                "maximum": 520,
                "minimum": 0,
                "type": "number"
              },
              "municipality": {
                "description": "The claimant's municipality, for local caps.",
                "maxLength": 80,
                "type": "string"
              },
              "nights": {
                "description": "Overnight stays with receipts.",
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "tripDate": {
                "description": "A date as YYYY-MM-DD (Finnish calendar date).",
                "type": "string"
              }
            },
            "required": ["distanceKm", "tripDate"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
