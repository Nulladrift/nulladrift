{
  "lockfileVersion": 2,
  "subjects": {
    "com.datakoot/fx-currency-exchange-rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://market.datakoot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "market-intel",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Market Intel: live and historical foreign-exchange rates for AI agents (latest, convert, historical, time-series, currency list), sourced from European Central Bank reference rates. For crypto prices see Base Intel; for company financials see Filings Intel.",
      "tools": [
        {
          "name": "fx_convert",
          "title": "FX Convert",
          "description": "Convert an amount from one currency to another at the latest ECB reference rate. Returns the rate, the converted result, and the rate date.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount in the 'from' currency to convert. Send it as a number, not a string.",
                "type": "number"
              },
              "from": {
                "description": "Source 3-letter currency",
                "type": "string"
              },
              "to": {
                "description": "Target 3-letter currency",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "amount": {},
              "date": {},
              "from": {},
              "provenance": {
                "description": "Where this answer came from. served_at is when Datakoot answered (UTC); upstream lists the official sources consulted. Datakoot may serve a briefly cached copy, so the source's own observation can be older than served_at.",
                "properties": {
                  "may_be_cached": {
                    "type": "boolean"
                  },
                  "publisher": {
                    "type": "string"
                  },
                  "served_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "upstream": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "rate": {},
              "result": {},
              "source": {},
              "to": {}
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FX Convert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39d9d36735ef2d475ae15797976f852d61a3b607ca51b1505ae13e0bbfa53254"
        },
        {
          "name": "fx_currencies",
          "title": "FX Currencies",
          "description": "List the currencies supported for exchange-rate lookups, with their full names.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of supported currencies",
                "type": "integer"
              },
              "currencies": {
                "additionalProperties": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "ISO 4217 codes mapped to currency names",
                "maxProperties": 256,
                "minProperties": 1,
                "propertyNames": {
                  "pattern": "^[A-Z]{3}$"
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["count", "currencies", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FX Currencies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c408d6bb3ee8bf314f0017ad3c5e301c20a12de5a8860a3ad9cec877f2e6f40"
        },
        {
          "name": "fx_historical",
          "title": "FX Historical",
          "description": "Get foreign-exchange rates for a base currency on a specific past date (YYYY-MM-DD). ECB publishes rates on business days; a weekend/holiday date returns the most recent prior business day.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "3-letter base (default USD)",
                "type": "string"
              },
              "date": {
                "description": "The date to look up, YYYY-MM-DD (MM/DD/YYYY is also accepted). Weekends and holidays return the previous business day's ECB rates.",
                "type": "string"
              },
              "symbols": {
                "description": "Optional comma-separated targets",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "ISO 4217 base currency actually used",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "date": {
                "description": "ECB rate date actually used YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rates": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Quote currencies mapped to the ECB reference rate",
                "maxProperties": 256,
                "minProperties": 1,
                "propertyNames": {
                  "pattern": "^[A-Z]{3}$"
                },
                "type": "object"
              },
              "requested_date": {
                "description": "Caller-requested date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["base", "date", "rates", "requested_date", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FX Historical"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cfd4734580b86a3b56e535b9ddae47dbe4cf0806881fe5cf2b3adf81d477e88e"
        },
        {
          "name": "fx_rates",
          "title": "FX Rates",
          "description": "Get the latest foreign-exchange rates for a base currency (default USD), optionally limited to specific target currencies. Source: European Central Bank reference rates.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "3-letter base currency, e.g. USD, EUR (default USD)",
                "type": "string"
              },
              "symbols": {
                "description": "Optional comma-separated targets, e.g. EUR,GBP,JPY",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "ISO 4217 base currency actually used",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "date": {
                "description": "ECB rate date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rates": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Quote currencies mapped to the ECB reference rate",
                "maxProperties": 256,
                "minProperties": 1,
                "propertyNames": {
                  "pattern": "^[A-Z]{3}$"
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["base", "date", "rates", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FX Rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d2ef64c2838cc86c2cb811c27d55a869f56e1dcd7d0e49127bf36e89ef5b2705"
        },
        {
          "name": "fx_timeseries",
          "title": "FX Timeseries",
          "description": "Get a time series of exchange rates for a base currency over a date range (max ~1 year), useful for trend analysis. Provide start and end as YYYY-MM-DD and one or more target currencies.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "3-letter base (default USD)",
                "type": "string"
              },
              "end": {
                "description": "End date, YYYY-MM-DD (MM/DD/YYYY is also accepted).",
                "type": "string"
              },
              "start": {
                "description": "Start date, YYYY-MM-DD (MM/DD/YYYY is also accepted). Range up to about one year.",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated targets, e.g. EUR,GBP",
                "type": "string"
              }
            },
            "required": ["end", "start", "symbols"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "base": {},
              "end_date": {},
              "provenance": {
                "description": "Where this answer came from. served_at is when Datakoot answered (UTC); upstream lists the official sources consulted. Datakoot may serve a briefly cached copy, so the source's own observation can be older than served_at.",
                "properties": {
                  "may_be_cached": {
                    "type": "boolean"
                  },
                  "publisher": {
                    "type": "string"
                  },
                  "served_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "upstream": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "rates": {},
              "source": {},
              "start_date": {}
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FX Timeseries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b87af4a8b59297fd0add16fdd89806b41ba3b424cfc5635e9f5075e91688e2a"
        }
      ],
      "digest": "sha256:7a625d07c5e700301f8cecd4c83ce03a5a9e65a6913a93ce0cfdd623897bad73"
    }
  }
