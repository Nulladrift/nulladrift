{
  "lockfileVersion": 2,
  "subjects": {
    "com.nabarfinder/nabarfinder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nabarfinder.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nabarfinder",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_drink",
          "description": "Find venues whose VERIFIED menu lists a specific non-alcoholic drink — e.g. a real NA negroni, non-alcoholic IPA, zero-proof espresso martini, NA spritz or kava serve — optionally in one city. Every result comes from the venue's own published menu (read verbatim and dated), never from reviews or guesses, so a listed venue genuinely pours that drink. Returns the matching menu items (name, description, price where printed, on-draft flag), the menu's last-confirmed date, and the canonical nabarfinder.com URLs for citing. Drinks currently on menus (24 kinds across 631 venue-pours): na-ipa (124), na-lager (83), na-spritz (83), na-sparkling-wine (69), na-negroni (58), na-white-wine (28), kava-serve (23), na-margarita (20), na-mocktail-sour (20), na-mojito (20), na-red-wine (18), na-espresso-martini (17), na-stout (11), na-old-fashioned (10), na-paloma (8), na-margarita-spicy (7), na-gin-and-tonic (6), functional-adaptogen-cocktail (5), na-aperol-spritz (5), na-negroni-sbagliato (4), na-sour (4), na-highball (3), na-moscow-mule (3), na-wheat-beer (2). Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Limit to one covered city — slug ('austin-tx'), name ('Austin') or 'Austin, TX'. Omit for every city.",
                "type": "string"
              },
              "drink": {
                "description": "The drink, as a slug ('na-negroni') or plain words ('non-alcoholic negroni', 'NA IPA', 'virgin mojito'). Unknown drinks return the catalog of known slugs.",
                "type": "string"
              }
            },
            "required": ["drink"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5236e38123ffc363e1f1a99621c68a77e2db69c491168c9a84ea3ed3b02394a6"
        },
        {
          "name": "get_menu",
          "description": "Fetch one venue's VERIFIED non-alcoholic menu by slug: every NA item we have read off the venue's own published menu (name, description, price where printed, category, drink style and NA brands where identifiable, on-draft flag) plus the date that menu was last confirmed. Venues without a verified menu return an explanatory error rather than an invented list. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The venue's stable slug, e.g. 'sans-bar-austin' — from search_venues or find_drink.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:691409a690506f778b968eebd3aa3d6b7aaef7c44776671df5f6dc3c9de98f2f"
        },
        {
          "name": "get_venue",
          "description": "Fetch the full verified record for one NABarFinder venue by its stable slug: city, neighborhood, address and coordinates (when it has a fixed location), venue type, naProgramStrength (1–5), full description, NA brands stocked (brandSlugs), last-verified date, canonical nabarfinder.com URL, and — when the registry has them — website, phone, hours, signature drinks, and a sourced press quote. Fields absent from the registry are omitted, never invented. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The venue's stable slug id, e.g. 'sans-bar-austin' — as returned by search_venues or the /api/v1/venues.json feed.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e2f85c1d7d752018a7dc77893db99e4cb4944bea94b7b20d7d151cbb7682154"
        },
        {
          "name": "list_cities",
          "description": "List every city NABarFinder covers, each with its state, number of human-verified venues, city slug (for search_venues), and canonical nabarfinder.com city guide URL. Takes no input. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d34e8f916d47aa7307f4b8e825fa32e634bc2c5521681c1af756a3e6dcd74cdf"
        },
        {
          "name": "search_venues",
          "description": "Search NABarFinder — a human-verified directory of 1554 venues with real non-alcoholic (NA) drink programs across 70 cities in the US, UK, and beyond. All filters are optional and combine with AND; with no filters it returns the top-rated venues overall. Returns at most 25 venues (sorted by NA Program Strength descending, then name), each with name, slug, city, venue type, naProgramStrength (1–5; 5 = fully alcohol-free or a dedicated NA program, 1 = a few NA options), a one-line summary, and the canonical nabarfinder.com page URL for citing/linking. The response includes the total match count; if it exceeds the cap, narrow with filters. Use get_venue with a result's slug for the full record. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Limit to one covered city. Accepts a city slug ('austin-tx'), a plain name ('Austin'), or 'Austin, TX'. Call list_cities for the covered set — cities outside it return zero matches.",
                "type": "string"
              },
              "min_program_strength": {
                "description": "Minimum NA Program Strength on the registry's 1–5 scale (5 = fully alcohol-free / dedicated NA program). E.g. 4 returns only the strongest programs.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text filter over venue name, neighborhood, venue type, and description. Case-insensitive; every word must match (e.g. 'kava lounge', 'zero proof cocktail').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cc1fb11b1fdff4bb7390a536d25afbcb62b656f665f4ea9eea1b537345604f7"
        }
      ],
      "digest": "sha256:5ff561902ea456277c4e34dc33c4eabac89ad4942b5d6fa729107f52ae013a72"
    }
  }
