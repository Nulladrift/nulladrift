{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/date-math-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/datemath"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-datemath",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "datemath_add",
          "description": "Adds years/months/days to date. years/months are applied together with end-of-month clamping — e.g. 2026-01-31 + 1 month = 2026-02-28, not an overflowed 2026-03-03. days is then applied as plain calendar-day arithmetic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "months": {
                "type": "integer"
              },
              "years": {
                "type": "integer"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e6ea1ddc29e05ed73c82151b1ffaf44528fdc7bd6d667b5225bf06836ae5649"
        },
        {
          "name": "datemath_age",
          "description": "Age in whole years as of asOf (optional, defaults to the current UTC date). A Feb-29 birthDate is treated as falling on March 1 in a non-leap asOf year.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "YYYY-MM-DD, defaults to today",
                "type": "string"
              },
              "birthDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["birthDate"],
            "type": "object"
          },
          "outputSchema": {
            "type": "integer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:483b200c37adadbac23e327c26db87df71da89ba6b51e7ea79872d82971ae73c"
        },
        {
          "name": "datemath_businessdays",
          "description": "Counts days in [from, to] (inclusive on both ends) whose weekday is in weekdays (default mon-fri) and which aren't in holidays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "holidays": {
                "description": "YYYY-MM-DD dates to exclude",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "to": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "weekdays": {
                "description": "sun/mon/tue/wed/thu/fri/sat, default mon-fri",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "type": "integer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bdd2fb243d38e6f5af2277a2d46c72fd4dc7825e40ad73e24d6aa24fa007b5e6"
        },
        {
          "name": "datemath_dayofweek",
          "description": "Day of the week for date: both the weekday name and its ISO 8601 weekday number (1=Monday..7=Sunday).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "dayOfWeek": {
                "type": "string"
              },
              "isoWeekday": {
                "type": "integer"
              }
            },
            "required": ["dayOfWeek", "isoWeekday"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4ff850139ed4d70c627efb033aaa5c235af9811cb62722a0d1573963f89df34"
        },
        {
          "name": "datemath_diff",
          "description": "Day difference between two YYYY-MM-DD dates: to minus from, in whole days. Negative if to is before from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "type": "integer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f39dff8e6ad5969f1f2cc02d462f7e6cb7927cdde2bdeb22e0c8532d5412ff4"
        },
        {
          "name": "datemath_leapyear",
          "description": "Checks whether year is a leap year in the Gregorian calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "year": {
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "outputSchema": {
            "type": "boolean"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97d2f23eac85e488bfd42d084ebdf28f862ef8e4148ab6630f4c45015340eae5"
        }
      ],
      "digest": "sha256:7c7383a9204214f000a42e52a47b21e209ff8c9cd66ccf3160722671acab2c0d"
    }
  }
}
