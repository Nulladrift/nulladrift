          "description": "Without start: a service's free times, from the business's own inbox; nothing is sent. With start: ask the inbox to book that time for your person. A priced service first answers with its terms: show them to your person, and send terms_sha only after their yes. Only for a listed business with an inbox, only when your person asked you to contact it; the business answers by email, at the address your person agreed to give.",
