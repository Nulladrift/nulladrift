        {
          "name": "search_products",
          "title": "Find products",
          "description": "Find products businesses sell, by words or a barcode (GTIN, EAN, UPC, ISBN), brand and part number, place, price, currency and stock. Each comes with offers: one business's price as last checked, and its own door to order through. Prices are never converted. A barcode is one product per multipack: single units and a pack of them are apart, and a pack's offer gives its price per unit too. A business's variants of one product, when its catalogue groups them, are one product with one place (variants). Read the price at the business's door and order there; this server takes no orders or payments. Pages of up to 20: pass next_cursor as cursor.",
          "inputSchema": {
            "properties": {
              "availability": {
                "description": "Only offers with one of these: in_stock and on_sale (available, its stock not counted) when left out.",
                "items": {
                  "enum": ["in_stock", "out_of_stock", "on_sale"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "brand": {
                "description": "The maker's brand, with mpn: that exact part.",
                "maxLength": 70,
                "type": "string"
              },
              "condition": {
                "description": "Only offers in one of these conditions: any when left out.",
                "items": {
                  "enum": ["new", "used", "refurbished"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "country": {
                "description": "Only businesses in this country: ISO 3166-1 alpha-2.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "currency": {
                "description": "Only offers in this currency (ISO 4217, like EUR). Prices are never converted.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page, with the same arguments.",
                "maxLength": 512,
                "type": "string"
              },
              "domain": {
                "description": "Only this business's products: its domain.",
                "maxLength": 253,
                "type": "string"
              },
              "gtin": {
                "description": "A barcode: GTIN-8, -12, -13 or -14, EAN, UPC or ISBN, in any length or with (01) in front. Checked, and it replaces query.",
                "maxLength": 40,
                "type": "string"
              },
              "has_inbox": {
                "description": "Every offer here comes from a business's own inbox: false leaves nothing.",
                "type": "boolean"
              },
              "limit": {
                "description": "Up to 20; 10 when left out.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mpn": {
                "description": "The maker's part number, with brand.",
                "maxLength": 70,
                "type": "string"
              },
              "multipack": {
                "description": "Only products of this many identical units sold together: 1 for single units, 12 for packs of 12. Any when left out.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "Only offers of businesses within radius_km of this point, each with its distance.",
                "properties": {
                  "lat": {
                    "description": "The point's latitude.",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lng": {
                    "description": "The point's longitude.",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "radius_km": {
                    "description": "How far from the point, in kilometres: 10 when left out.",
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              },
              "order": {
                "description": "published (the default): each offer in its business's place in the directory's published order. price: lowest price as sold first (a pack's whole price), with currency. nearest: nearest first, with near.",
                "enum": ["published", "price", "nearest"],
                "type": "string"
              },
              "price_max": {
                "description": "At most this price as sold (a pack's whole price), in the currency's minor unit. Needs currency.",
                "minimum": 0,
                "type": "integer"
              },
              "price_min": {
                "description": "At least this price as sold (a pack's whole price, not its price per unit), in the currency's minor unit (cents for EUR, yen for JPY). Needs currency.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "A few words from the product's name, brand or description, like \"moka pot\". Every word must match, ignoring capitals and accents.",
                "maxLength": 80,
                "type": "string"
              },
              "ships_to": {
                "description": "Only businesses that say they deliver to this country: ISO 3166-1 alpha-2.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Every field is described in this tool's outputSchema at https://network.surfingdog.ai/.well-known/mcp/server-card.json.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ee4ac709c67b6073065e8ccd010be01e3316e3970a2cbd387aa048a46cecb75"
        },
        {
          "name": "start_inbox",
          "title": "Set up an agent inbox",
          "description": "For a business's own AI: the link where its owner sets up their own agent inbox, hosted by Surfing Dog at inbox.<domain>. Give the owner the link: they check the details and type their own email there; this tool signs no one up and takes no email. The open-source inbox to run themselves is named too. Once the DNS record is in, check_dns says whether agents reach it.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The business's own domain, like salon.example (a URL is read as its domain).",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Every field is described in this tool's outputSchema at https://network.surfingdog.ai/.well-known/mcp/server-card.json.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Set up an agent inbox"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0438dcd692b2566f1298b1d7461b4040ee753456e9fc504fa4fad24aef5200c"
        },
        {
          "name": "update_business",
          "title": "Change a business's listing",
          "description": "For a business's own AI: correct its listing (any field register_business takes), add or remove doors, turn it off or on, hide its score page, or opt out (list, crawl or all), with its claim_token or a proof as register_business asks. With no proof it removes only a listing nobody claimed.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "Given by a successful register_business: proof again for 90 days, for this listing only.",
                "pattern": "^sdc_[A-Za-z0-9_-]{43}$",
                "type": "string"
              },
              "domain": {
                "description": "The business's domain, as its listing has it, like bikes.example.",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "doors": {
                "description": "Doors to add and door URLs to remove; the listing's other doors stay.",
                "properties": {
                  "add": {
                    "description": "Doors to add, each as register_business's doors take one.",
                    "items": {
                      "properties": {
                        "kinds": {
                          "description": "Of ask, quote, book, order: what it answers.",
                          "items": {
                            "maxLength": 20,
                            "type": "string"
                          },
                          "maxItems": 4,
                          "type": "array"
                        },
                        "protocol": {
                          "description": "What it speaks, for type \"other\": like beckn or graphql.",
                          "maxLength": 40,
                          "type": "string"
                        },
                        "rate_limit": {
                          "description": "Requests a day this door takes, 1 to 20; it only lowers the network's own.",
                          "type": "integer"
                        },
                        "terms_url": {
                          "description": "The door's terms of use, https.",
                          "maxLength": 2048,
                          "type": "string"
                        },
                        "type": {
                          "description": "inbox, mcp, a2a, openapi, api, ucp, acp, nlweb, webhook, other, or platform:<name>. Mail, phone, messaging, forms and web pages are human channels and never doors.",
                          "maxLength": 60,
                          "type": "string"
                        },
                        "url": {
                          "description": "https, with no user in it.",
                          "maxLength": 2048,
                          "type": "string"
                        }
                      },
                      "required": ["type", "url"],
                      "type": "object"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "remove": {
                    "description": "Door URLs.",
                    "items": {
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "listing": {
                "description": "off hides it from search and keeps it in the index.",
                "enum": ["on", "off"],
                "type": "string"
              },
              "opt_out": {
                "description": "Stops the listing (list), the crawl (crawl) or both (all). Without a claim token or a proof it removes only an entry nobody claimed. A business that opted out comes back with a domain or key proof.",
                "properties": {
                  "scopes": {
                    "description": "One or more of list, crawl and all.",
                    "items": {
                      "enum": ["list", "crawl", "all"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["scopes"],
                "type": "object"
              },
              "proof": {
                "description": "Proof the domain is its own, answering the challenge a call without proof gets.",
                "properties": {
                  "challenge_id": {
                    "description": "The challenge's id, as the answer gave it; none for code.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "code": {
                    "description": "code: the 8 digits sent to that address.",
                    "pattern": "^[0-9]{8}$",
                    "type": "string"
                  },
                  "email": {
                    "description": "code: an address at exactly the business's own domain (not a subdomain), typed by the owner; never a public mail or internet provider's domain.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "kid": {
                    "description": "key: the key that signed.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "method": {
                    "description": "Which of the challenge's ways was used.",
                    "enum": ["well_known", "manifest", "dns", "key", "code"],
                    "type": "string"
                  },
                  "signature": {
                    "description": "key: base64url of the signature.",
                    "maxLength": 1024,
                    "type": "string"
                  }
                },
                "required": ["method"],
                "type": "object"
              },
              "score_page": {
                "description": "hidden takes the business's agentic score result page out of view, its ranks and leaderboards included; shown brings it back. It needs the claim token or a proof, as set does.",
                "enum": ["hidden", "shown"],
                "type": "string"
              },
              "set": {
                "description": "The fields to change: any field register_business takes, as its inputSchema describes it.",
                "type": "object"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Every field is described in this tool's outputSchema at https://network.surfingdog.ai/.well-known/mcp/server-card.json.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change a business's listing"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c8240edceb8a3589881e99fd1e9650e69e5ff497c6fc6cfdf841e1e870d491a1"
        }
      ],
      "digest": "sha256:2850e420792accd4f5ab148461125e5d99cfd7a7522fed658f85e0eaa1366e33"
    }
  }
