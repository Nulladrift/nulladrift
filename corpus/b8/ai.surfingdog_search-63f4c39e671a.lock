        {
          "name": "search_businesses",
          "title": "Find businesses",
          "description": "Find businesses AI agents can reach, by a few words in any language (query: \"florist\"), a place (near: a town or a point; country), category (list_categories) and filters (attributes and payments: list_attributes), each only leaving businesses out; software, API and AI companies only when asked for (category software-ai). Results come by how well they match (a whole word of its name first, only for one of the kind the words name when they name one, then the category all the words name together, then the rest, in the eight bands of GET /v1/ranking), then in the published order (order nearest: by distance first), which nobody can pay to change, each with the business's own doors; from rules version 12, a search with no match for every word near a place is run again with its kind's words, an answer to a search for more than its place with nobody near it names in note the nearest that match, and an empty answer with nothing left to try but other words says so first: tell your person, and use other sources rather than searching again with other words. Only agent-ready businesses are listed; a search for what a door does ('book a massage', 'order pizza') lists only those whose live doors take it (book, order or quote: the answer's action says which), and the asking word is no word a business must match.",
          "inputSchema": {
            "properties": {
              "accepts": {
                "description": "What its live doors take and what it accepts as payment, all of them: ask, quote, book, order, pay, or a payment from list_attributes like card or paypal.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "attributes": {
                "description": "Keys from list_attributes, like \"delivery\" or \"walk_ins\", or key=value for one with values; every one must hold.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "category": {
                "description": "A slug from list_categories (hair-beauty) or a place category id (hair_salon), with every category below it; its label or a synonym works too. Anything else is an error naming categories to try.",
                "maxLength": 60,
                "type": "string"
              },
              "country": {
                "description": "A two-letter country code (ISO 3166-1 alpha-2): a business located there, serving it or shipping there.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous answer, for the next page of the same search.",
                "maxLength": 512,
                "type": "string"
              },
              "door_type": {
                "description": "A live door of any of these types: inbox, mcp, a2a, openapi, api, ucp, acp, nlweb, other, \"platform\" for any platform, or platform:<name>.",
                "items": {
                  "anyOf": [
                    {
                      "pattern": "^(inbox|mcp|a2a|openapi|api|ucp|acp|nlweb|webhook|other|platform:[a-z0-9-]{1,40})$",
                      "type": "string"
                    },
                    {
                      "const": "platform",
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 5,
                "type": "array"
              },
              "has_inbox": {
                "description": "true: with an inbox door; false: without one.",
                "type": "boolean"
              },
              "item_type": {
                "description": "Only businesses whose inbox takes this; stay: a place to stay whose inbox takes stays.",
                "enum": ["booking", "order", "quote_request", "message", "stay"],
                "type": "string"
              },
              "language": {
                "description": "Only businesses that speak this language, as a tag like pt or en; pt also finds pt-br.",
                "maxLength": 12,
                "pattern": "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$",
                "type": "string"
              },
              "level": {
                "description": "At this readiness level or above: askable (an AI can ask), bookable or orderable (a door takes bookings or orders: one rung), payable. Nothing below askable is listed.",
                "enum": ["listed", "readable", "askable", "bookable", "orderable", "payable"],
                "type": "string"
              },
              "limit": {
                "description": "How many to return: 10 when left out.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "properties": {
                      "lat": {
                        "description": "The point's latitude.",
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      "lng": {
                        "description": "The point's longitude.",
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      },
                      "radius_km": {
                        "description": "How far from the point, in kilometres: 10 when left out.",
                        "exclusiveMinimum": 0,
                        "maximum": 1000,
                        "type": "number"
                      }
                    },
                    "required": ["lat", "lng"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "place": {
                        "description": "A town's name.",
                        "maxLength": 80,
                        "minLength": 1,
                        "type": "string"
                      },
                      "radius_km": {
                        "description": "How far from the town's centre, in kilometres: more for a larger town when left out.",
                        "exclusiveMinimum": 0,
                        "maximum": 1000,
                        "type": "number"
                      }
                    },
                    "required": ["place"],
                    "type": "object"
                  }
                ],
                "description": "Only businesses within radius_km of a place, each with its distance: a town's name, {place, radius_km}, or a point {lat, lng, radius_km}. Most businesses sell online and have no location yet: the answer says when none is there."
              },
              "open_now": {
                "description": "true: only businesses open right now by the hours they published. One that published no hours is left out.",
                "type": "boolean"
              },
              "order": {
                "description": "rank: the published order (the default); nearest: by distance, then the published order, however well each matches query, and it needs near.",
                "enum": ["rank", "nearest"],
                "type": "string"
              },
              "price_band": {
                "description": "1 (cheapest) to 4, as \"2\" or a range \"1-2\".",
                "pattern": "^[1-4](-[1-4])?$",
                "type": "string"
              },
              "q": {
                "description": "Another name for query (the REST API's); given both, query is the one searched.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "A few words about what the business does or where, in any language: \"florist\", \"bike repair\". Every word must match a whole word of its name, categories, services, tags, description or town (itself, its plural or its singular), or, for a word of four letters or more as written, the beginning of one (\"bake\" finds bakery), ignoring capitals and accents; in a script written without spaces (Chinese, Japanese, Thai), anywhere inside a text; a word naming a category matches its businesses. Unless near is given, or country names another country, a town after \"in\" or \"near\" becomes near, and a country after \"in\" becomes country. \"open\" belongs in open_now. How results are ordered, and when one is left out: https://surfingdog.ai/v1/ranking.",
                "maxLength": 80,
                "type": "string"
              },
              "radius_km": {
                "description": "Another name for near's radius_km, as GET /v1/businesses writes it: how far from near, or from a town query names, in kilometres. Give it once: near.radius_km or radius_km.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "requestable": {
                "description": "A live door that declared it answers this kind.",
                "enum": ["ask", "quote"],
                "type": "string"
              },
              "source": {
                "description": "member (through its inbox), registered (by the business), found (by this network on the business's own website); any of them.",
                "items": {
                  "enum": ["member", "registered", "found"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Every field is described in this tool's outputSchema at https://network.surfingdog.ai/.well-known/mcp/server-card.json.",
            "type": "object"
