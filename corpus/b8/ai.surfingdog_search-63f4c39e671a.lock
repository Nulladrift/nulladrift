        {
          "name": "report_door",
          "title": "Report how a door went",
          "description": "After you used a business's door (its inbox, MCP, A2A or API), record how it went: ok, refused, invalid (your own request's fault), failed, or info (needs a person); up to 100 uses a call. Private to the business: no person and nothing that was said, and nothing public changes by itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reports": {
                "description": "One report for each use of a door.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "at": {
                      "description": "When, in Unix seconds; the network keeps it to the minute.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "class": {
                      "description": "Why, from vocab/door-report-classes.json: required unless the result is ok, and absent when it is.",
                      "pattern": "^[a-z0-9_.]{1,64}$",
                      "type": "string"
                    },
                    "domain": {
                      "description": "The business's domain, as the network lists it.",
                      "pattern": "^[a-z0-9.-]{1,253}$",
                      "type": "string"
                    },
                    "door": {
                      "additionalProperties": false,
                      "description": "The door used, as the network shows it.",
                      "properties": {
                        "type": {
                          "description": "The door's type as the network shows it: inbox for a member's inbox; mcp, a2a, openapi, api, … or platform:<name>.",
                          "pattern": "^[a-z0-9:_-]{1,48}$",
                          "type": "string"
                        },
                        "url": {
                          "description": "The door's URL exactly as the network shows it; for an inbox, the address used: inbox.url, inbox.mcp or inbox.rest.",
                          "maxLength": 2048,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["type", "url"],
                      "type": "object"
                    },
                    "intent": {
                      "description": "8 to 32 base64url characters, one per attempt with all its retries: an attempt counts once.",
                      "pattern": "^[A-Za-z0-9_-]{8,32}$",
                      "type": "string"
                    },
                    "ms": {
                      "description": "How long the door took to answer, in milliseconds.",
                      "maximum": 600000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "op": {
                      "description": "What was attempted, from the capability vocabulary (vocab/capabilities.json): book, order, message, …",
                      "pattern": "^[a-z][a-z0-9_]{0,31}$",
                      "type": "string"
                    },
                    "result": {
                      "description": "How it went: ok, refused (it said no), invalid (your request's fault), fail (an error or no answer) or info (it needs a person).",
                      "enum": ["ok", "refused", "invalid", "fail", "info"],
                      "type": "string"
                    },
                    "token": {
                      "description": "The door's signed outcome token from its answer, when it gave one, as it came.",
                      "maxLength": 1024,
                      "pattern": "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
                      "type": "string"
                    },
                    "tool": {
                      "description": "The tool or operation called at the door, in lowercase.",
                      "pattern": "^[a-z0-9_.-]{1,64}$",
                      "type": "string"
                    }
                  },
                  "required": ["at", "domain", "door", "intent", "op", "result"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "v": {
                "const": 1,
                "description": "This form's version: always 1.",
                "type": "number"
              }
            },
            "required": ["reports", "v"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Every field is described in this tool's outputSchema at https://network.surfingdog.ai/.well-known/mcp/server-card.json.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Report how a door went"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
