        {
          "name": "register_business",
          "title": "Put a business in the directory",
          "description": "For a business's own AI: put the business in the directory with its doors (MCP, A2A, OpenAPI, an API, UCP, ACP, a platform's door) and its facts (name, category, where, languages), and agree to the listing terms (/bot#terms). When its proof is not in place yet, the answer gives a challenge (a file or DNS record on its domain, its inbox manifest, a key's signature, or a code mailed to its domain) and the next call proves it. Mail, phone, forms and web pages are never doors. Free, and the order cannot be bought. Not listed: adult services, gambling, weapons, tobacco, cannabis and vaping, payday loans, bail bonds.",
          "inputSchema": {
            "properties": {
              "agree": {
                "const": true,
                "description": "The business agrees to be listed by the network's published rules (GET /v1/ranking) and listing terms.",
                "type": "boolean"
              },
              "alternate_names": {
                "description": "Other names the business goes by; a name longer than the network keeps is dropped (the reference network keeps 60 characters and 4 words at most).",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "attributes": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "boolean"
                    },
                    {
                      "maxLength": 60,
                      "type": "string"
                    }
                  ]
                },
                "description": "Keys of list_attributes.",
                "propertyNames": {
                  "maxLength": 60,
                  "type": "string"
                },
                "type": "object"
              },
              "category": {
                "description": "What the business is: one category, and at most two more.",
                "properties": {
                  "alternates": {
                    "description": "Up to two more categories, as primary takes them.",
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 2,
                    "type": "array"
                  },
                  "primary": {
                    "description": "A place category id (GET /v1/categories?group=…) or a group slug.",
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "required": ["primary"],
                "type": "object"
              },
              "claim_token": {
                "description": "Given by a successful register_business: proof again for 90 days, for this listing only.",
                "pattern": "^sdc_[A-Za-z0-9_-]{43}$",
                "type": "string"
              },
              "currencies": {
                "description": "ISO 4217.",
                "items": {
                  "maxLength": 3,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "description": {
                "description": "One line on what it does; the first line is at most 160.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "The business's own website domain. A business without a website is not supported yet.",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "doors": {
                "description": "Its doors for AI agents; each counts only after this network's crawler has checked it.",
                "items": {
                  "properties": {
                    "kinds": {
                      "description": "Of ask, quote, book, order: what it answers.",
                      "items": {
                        "maxLength": 20,
                        "type": "string"
                      },
                      "maxItems": 4,
                      "type": "array"
                    },
                    "protocol": {
                      "description": "What it speaks, for type \"other\": like beckn or graphql.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "rate_limit": {
                      "description": "Requests a day this door takes, 1 to 20; it only lowers the network's own.",
                      "type": "integer"
                    },
                    "terms_url": {
                      "description": "The door's terms of use, https.",
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "type": {
                      "description": "inbox, mcp, a2a, openapi, api, ucp, acp, nlweb, webhook, other, or platform:<name>. Mail, phone, messaging, forms and web pages are human channels and never doors.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "url": {
                      "description": "https, with no user in it.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["type", "url"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "hours": {
                "description": "As a profile's hours: its time zone, its opening times by day of the week, and its closed dates.",
                "properties": {
                  "closures": {
                    "description": "Closed dates, each from and to, both included.",
                    "items": {
                      "properties": {
                        "from": {
                          "description": "First closed day, YYYY-MM-DD.",
                          "maxLength": 10,
                          "type": "string"
                        },
                        "to": {
                          "description": "Last closed day, YYYY-MM-DD.",
                          "maxLength": 10,
                          "type": "string"
                        }
                      },
                      "required": ["from", "to"],
                      "type": "object"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "timezone": {
                    "description": "A tz database zone, as Area/Location.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "weekly": {
                    "additionalProperties": {
                      "items": {
                        "items": {
                          "maxLength": 5,
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "type": "array"
                    },
                    "description": "Days mon to sun, each with [open, close] pairs in HH:MM; a day left out is closed.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "required": ["timezone", "weekly"],
                "type": "object"
              },
              "languages": {
                "description": "Language tags, like pt or fr-CA.",
                "items": {
                  "maxLength": 35,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "The language to answer in.",
                "maxLength": 35,
                "type": "string"
              },
              "name": {
                "description": "As the business writes it.",
                "maxLength": 200,
