                "description": "How many articles to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the prayer is for, in a few words, for example \"court case\" or \"sick mother\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["need"],
