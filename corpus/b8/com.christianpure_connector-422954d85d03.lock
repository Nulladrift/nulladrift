      "instructions": "Christian Pure (christianpure.com) publishes Christian articles on prayer, Bible verses, Bible study, names in the Bible and church history, plus free courses and a weekly email. Article results give each article's title, link, excerpt, summary points, topics, image and dates, not the full text, which is on christianpure.com. Excerpts and summary points are the article's own published words, so any Scripture in them appears as the article quotes it. Every tool is read-only and needs no account.",
      "tools": [
        {
          "name": "find_bible_verses",
          "title": "Find Bible verses",
          "description": "Find Bible verses on a subject, such as anxiety, hope, forgiveness, marriage, strength or loss. Returns Christian Pure articles that gather and explain the verses on that subject, each with an excerpt, summary points and a link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many articles to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "subject": {
                "description": "The subject, in a few words, for example \"anxiety\" or \"losing a parent\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Bible verses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://christianpure/cards-v1.html",
            "openai/toolInvocation/invoked": "Found Christian Pure articles",
            "openai/toolInvocation/invoking": "Searching Christian Pure",
            "ui": {
              "resourceUri": "ui://christianpure/cards-v1.html"
            }
          },
          "digest": "sha256:15c82d9d32fbf9935382bde27515a44c0e720da70997180cb92cb81dc92a0506"
        },
        {
