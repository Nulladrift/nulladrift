        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search Christian Pure's library of more than 3,500 articles on prayer, Bible verses, Bible study, the meaning of names in the Bible, church history, marriage, parenting and questions of faith. Pass a few plain keywords, for example \"anxiety\", \"Nathan name meaning\" or \"unforgivable sin\". Returns up to 10 articles, each with a title, a short excerpt, summary points, an image and a link to the full article on christianpure.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many articles to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords to search for.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "description": "Optional. Limit results to one subject, by slug (list_topics gives every slug and its article count).",
                "enum": ["christian-education", "prayers", "bible-verses", "bible-study", "bible-mysteries", "love-relationships", "christian-history", "biblical-debates", "facts-stats", "biblical-finance", "bible-metrics", "marriage", "islam", "parenting", "children", "quizzes"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
