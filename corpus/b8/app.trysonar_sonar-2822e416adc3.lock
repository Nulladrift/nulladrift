        {
          "name": "sonar_top_charts",
          "title": "Top Charts",
          "description": "Get a store top chart (free / paid / grossing, overall or by category) with day-over-day movement: per-app rank delta, apps new to the chart, biggest movers and apps that dropped out. Use to see what's rising in a market or category. Note: summary, movers and droppedApps always describe the full top 200 — `limit` truncates the returned entries only. Movement is empty on the first day a chart is requested (no previous snapshot yet). Answers within about 30 seconds: when a live refresh can't finish in time the newest stored chart is returned with `stale: true` and its `measuredAt` date. Compact by default (no icon URLs or numeric ids; fields: \"full\" adds them). Works without an API key (free tier, limited daily use per IP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "default": "overall",
                "description": "Category key; keys differ by store (e.g. iOS \"SOCIAL_NETWORKING\" / \"GAMES\", Android \"SOCIAL\" / \"GAME\"; \"HEALTH_AND_FITNESS\" exists on both). An unknown key is rejected with an error. Use \"overall\" (default) for the store-wide chart.",
                "type": "string"
              },
              "chart": {
                "default": "free",
                "description": "Chart type: \"free\", \"paid\" or \"grossing\". Default \"free\".",
                "enum": ["free", "paid", "grossing"],
                "type": "string"
              },
              "country": {
                "default": "us",
                "description": "Market as an ISO 3166-1 alpha-2 code (e.g. \"us\", \"gb\", \"de\", \"mt\"). Nearly every App Store storefront and Google Play market works; the few small storefronts that are not supported return an error naming them. Default \"us\".",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "fields": {
                "default": "compact",
