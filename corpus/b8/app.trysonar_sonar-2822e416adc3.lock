          "description": "WRITE tool — search a competitor's Facebook page (channel \"meta\") or TikTok account (channel \"tiktok\") and return ranked candidates; an unambiguous top match is flagged `best_match`. It never links: show the candidates and let the user confirm, then call sonar_ad_spy_link (the page mapping is shared by every Sonar account, so a wrong link misleads everyone). A Meta scan that found nothing in the last 24h replays for free (`cooldown: true`). Spends one of the account's daily Ad Spy lookups (today's usage comes back in `allowance` from sonar_ad_spy_competitors); re-opening the same page, account or ad the same day is free. Past the allowance a refresh returns the cached copy with `meta.stale` and a `meta.note` to relay. Requires an Indie or Agency plan (a trial counts) and an authorized Sonar account or an API key with the write scope.",
