                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor from a previous call's `next_cursor`. Omit for the first page.",
                "minLength": 1,
                "type": "string"
              },
              "days": {
                "description": "History window in days (1-365). Default 30.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "fields": {
                "default": "compact",
                "description": "\"compact\" (default): per keyword: rank + status + measured_at (latest day with a completed check or recorded rank), best_rank, positions_gained (oldest ranked day in the window minus the current rank; positive = moved up), and ranks — one entry per day, newest first starting at ranks_end: a number = the rank, \"unranked\" = a completed check did not find the app, null = no check that day (never report a null day as not ranked). About 7× smaller. \"full\": per keyword: the `history` array (positive ranks only) and the daily `observations` grid with status (ranked / not_found / not_observed) and results_count per day.",
                "enum": ["compact", "full"],
                "type": "string"
              },
