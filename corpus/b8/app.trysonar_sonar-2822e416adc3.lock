        {
          "name": "sonar_ad_spy_ads",
          "title": "Competitor Meta Ads",
          "description": "A Facebook page's cached Meta ads (Facebook, Instagram, Messenger, Audience Network): stats over every cached ad (active count, longest running, new in 30 days, format and placement mix, max variants), the ads matching the filters with copy, CTA, landing URL, placements, days running and a longevity tier (30d+/60d+/90d+), and daily history of active/new ads (creative velocity). No spend or impression data exists for ads outside the EU — longevity and variants are the signals. Compact by default (no expiring media links; fields: \"full\" adds them). Media URLs are expiring CDN links; always give users each ad's permanent `library_url`. `refresh_due: true` means the copy is over 24h old (sonar_ad_spy_refresh fetches it). Cached read. Requires an Indie or Agency plan (a trial counts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "advertiser_id": {
                "description": "Sonar advertiser id of a Facebook page (`advertiser_id` from sonar_ad_spy_competitors, or `advertiser.id` from sonar_ad_spy_open_page).",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "fields": {
                "default": "compact",
                "description": "\"compact\" (default): each ad without its expiring `media` links and `media_expires_at` — ids, the permanent `library_url`, dates, days running, longevity, format, copy, CTA, landing URL, placements, variants and EU reach stay (about 2.4× smaller). \"full\": adds each ad's `media` (video/image CDN links, which expire) and `media_expires_at` — only for downloading media right away.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "format": {
                "description": "Only ads in this format.",
                "enum": ["video", "image", "carousel", "text"],
                "type": "string"
              },
              "history_days": {
                "description": "Days of daily active/new-ad history (default 30).",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "include_hidden": {
                "description": "Include ads this account removed from its scans.",
                "type": "boolean"
              },
              "limit": {
                "description": "Ads to return (1-300, default 50).",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Only ads running at least this many days — longevity is the honest 'winner' signal (30/60/90).",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "description": "longest running (default), newest, or most variants.",
                "enum": ["longest", "newest", "variants"],
                "type": "string"
              },
              "status": {
                "description": "active (default) = running now; all = include stopped ads.",
                "enum": ["active", "all"],
                "type": "string"
              }
            },
            "required": ["advertiser_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Competitor Meta Ads"
