        {
          "name": "sonar_discovered_keywords",
          "title": "Discovered Keywords",
          "description": "Keywords Sonar's discovery engine surfaced for one of your tracked apps but that aren't tracked yet — ranked finds (the app already ranks, unnoticed), competitor gaps, and AI/autocomplete-sourced ideas — each with popularity, difficulty, AI relevance, and an opportunity score (0-100, best first). This is Sonar's \"what should I track next\" answer; rows can be tracked with sonar_track_keywords (by keyword text + country). Compact by default (no discovered-row id, store or timestamps; keyword_id stays; fields: \"full\" adds them). Requires an Indie plan (trial counts). `popularity` (5-100) is the value Sonar's dashboard shows: Apple's Search Popularity when Apple has a real reading; when Apple reports a keyword below its threshold (popularity_apple 5, about 20) it is Sonar's estimate (at most 18). `popularity_source` says which (apple | proxy), `popularity_apple` is Apple's own reading (null on Android), `popularity_proxy` is Sonar's estimate beside a floored reading.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app_id": {
                "description": "Sonar app UUID of one of your tracked apps — the `id` returned by sonar_list_apps or sonar_create_product. NOT a store id.",
                "minLength": 1,
                "type": "string"
              },
              "bucket": {
                "description": "Filter by classification: \"ranked\" = the app already ranks for it, \"gap\" = a competitor ranks but the app does not, \"idea\" = verified research suggestion with no rank evidence yet. Omit for all.",
                "enum": ["ranked", "gap", "idea"],
                "type": "string"
              },
              "country": {
                "description": "Filter to one market (ISO country code). Omit for all markets.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "fields": {
                "default": "compact",
                "description": "\"compact\" (default): keyword_id, keyword, country, rank, source, status, bucket, the four popularity fields, difficulty, ai_relevance, opportunity, competitor_rank, competitor_name. \"full\": adds the discovered-row id, store, discovered_at and ranks_checked_at.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "limit": {
                "description": "Max rows to return (1-500). Default 200.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_opportunity": {
                "description": "Only rows with an opportunity score at or above this value (0-100).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "min_relevance": {
                "description": "Only rows with AI relevance at or above this value (0-100).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "source": {
                "description": "Filter by how the keyword was discovered. Omit for all sources.",
                "enum": ["autocomplete", "metadata", "serp_scan", "competitor", "apple_ads", "ai"],
                "type": "string"
              },
              "status": {
                "description": "Filter by row status. Default \"new\" — the still-actionable suggestions; \"all\" includes rows already tracked or hidden.",
                "enum": ["new", "tracked", "hidden", "all"],
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Discovered Keywords"
