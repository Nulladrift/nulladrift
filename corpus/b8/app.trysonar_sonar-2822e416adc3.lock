        {
          "name": "sonar_app_rankings",
          "title": "App Rank History",
          "description": "Rank history for an app's tracked keywords over the requested window. Compact by default: each keyword's current rank and status, best rank, positions gained and a newest-first daily `ranks` list (a rank, \"unranked\" = checked but not found, null = no check that day). Pass fields: \"full\" for the per-day `observations` grid: ranked has a numeric rank; not_found means a completed search did not return the app (results_count is the returned search size); not_observed means no confirmed check, including legacy gaps. Never interpret an absent rank as a collection failure or assign a numeric rank to it. The legacy history array contains positive ranks only. Use this to check how rankings moved after a metadata change or to find keywords trending up or down. Cursor-paginated over keywords (default 50 per page). Requires an Indie plan (trial counts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app_id": {
                "description": "Sonar app UUID — the `id` returned by sonar_list_apps or sonar_create_product. NOT a store id.",
