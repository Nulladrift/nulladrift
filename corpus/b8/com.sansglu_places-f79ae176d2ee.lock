      "serverInfo": {
        "name": "sansglu",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sansglu covers gluten-free and celiac-friendly dining in cities worldwide. Use find_gluten_free_places when someone wants gluten-free or celiac-friendly restaurants, bakeries or cafés in a city, neighborhood or near them. Use check_place_gluten_free_status when they name one place. Each result shows what its source reports about gluten-free food. People with celiac disease should confirm with the place before eating. Both tools are read-only.",
      "tools": [
        {
          "name": "check_place_gluten_free_status",
          "title": "Check a place",
          "description": "Use this when someone asks about one named restaurant, bakery or café, like \"is Nami Nori gluten free?\", \"can I eat at this bakery with celiac?\" or \"does this place have a gluten-free menu?\". Returns Sansglu's gluten-free label and the place's own website as the source, or says Sansglu has no record. Do not use to find new places, and never for packaged foods, grocery products, brands or ingredients (cereal, sauces, beer).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What the person asked for and the area they named, in their words, for example \"dedicated gluten-free bakery in Austin\" or \"Nami Nori Williamsburg\". Never a street address or coordinates.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sansglu/places-v3.html",
            "openai/toolInvocation/invoked": "Checked Sansglu",
            "openai/toolInvocation/invoking": "Checking Sansglu…",
            "ui": {
              "resourceUri": "ui://sansglu/places-v3.html"
            },
            "ui/resourceUri": "ui://sansglu/places-v3.html"
          },
          "digest": "sha256:2cb968a994e15c9646802c7f70e91abef582cadd2b5ee2e9f449163032e70e4c"
        },
        {
          "name": "find_gluten_free_places",
          "title": "Find gluten-free places",
          "description": "Use this when someone asks where to eat gluten-free or with celiac disease, in a place they name or near them. People ask it like \"gluten free restaurants in Chicago\", \"where can I eat with celiac disease in Paris\", \"dedicated gluten-free bakery near me\", \"gluten free pizza in Brooklyn\", \"celiac friendly tacos in Austin\" or \"I'm celiac and visiting Tokyo next month, where should I eat?\". Returns places from Sansglu's gluten-free database on a map, each with its gluten-free label and its own website as the source. Do not use for recipes, packaged foods or grocery brands, ingredients, booking tables, hotels, symptoms or other medical questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "label_filter": {
                "description": "Use \"dedicated_gf\" only when the person asks for fully gluten-free (dedicated) places.",
                "enum": ["any", "dedicated_gf"],
                "type": "string"
              },
              "limit": {
                "description": "How many places to return. Use 8 for trip planning.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person asked for and the area they named, in their words, for example \"dedicated gluten-free bakery in Austin\" or \"Nami Nori Williamsburg\". Never a street address or coordinates.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find gluten-free places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sansglu/places-v3.html",
            "openai/toolInvocation/invoked": "Found gluten-free places",
            "openai/toolInvocation/invoking": "Finding gluten-free places…",
            "ui": {
              "resourceUri": "ui://sansglu/places-v3.html"
            },
            "ui/resourceUri": "ui://sansglu/places-v3.html"
          },
