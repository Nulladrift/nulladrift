          "description": "Adds a public comment to a post or event for the signed-in user; everyone can see it immediately.\npostId and postGeoHash come from a search result, get_post or create_post. To attach images, first call get_publishing_media_keys and pass the returned keys as medias.\nReturns the new comment's id with the post it belongs to. Velocity limit: 10 per 10 minutes and 200 per day.\nRetries: make up an idempotencyKey and resend it if the call fails or times out, so a retry cannot post twice.\n",
