        {
          "name": "create_event",
          "title": "Create event",
          "description": "Creates a public event pinned to a location for the signed-in user; everyone can see it immediately.\nstartAt must be before endAt and endAt must be in the future, both ISO-8601 UTC instants.\nHashtags are written inline in the message as #tag. To attach images, first call get_publishing_media_keys and pass the returned keys as medias.\nReturns the new event's id, geoHash and public url. Events share the post velocity limit: 5 per 10 minutes and 50 per day.\nRetries: make up an idempotencyKey and resend it if the call fails or times out, so a retry cannot post twice.\n",
          "inputSchema": {
            "properties": {
              "endAt": {
                "description": "Event end, ISO-8601 UTC instant after startAt and in the future. Example: 2026-10-30T12:00:00Z.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "A key you make up once and resend on retry, at most 128 characters: a repeat answers what the first call made instead of posting twice; a reused key with other arguments is refused.",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the event location, between -90 and 90. Example: 48.8566.",
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the event location, between -180 and 180. Example: 2.3522.",
                "type": "number"
              },
              "medias": {
                "description": "Media keys from get_publishing_media_keys, at most 7.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "Text of the event, at most 6000 characters, #hashtags inline.",
                "type": "string"
              },
              "startAt": {
                "description": "Event start, ISO-8601 UTC instant. Example: 2026-10-30T10:00:00Z.",
                "type": "string"
              }
            },
            "required": ["endAt", "latitude", "longitude", "startAt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "geoHash": {
                "description": "GeoHash of the new post.",
                "type": "string"
              },
