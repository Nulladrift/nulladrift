        {
          "name": "cancel_booking",
          "title": "Cancel booking",
          "description": "Cancels a booking and frees its time. This cannot be undone, so confirm with the user first.\nAs the customer: a PENDING request can always be withdrawn, a CONFIRMED booking only until its\ncancelAllowedUntil, and cancellations are limited per customer (per day, and per place per week).\nAs staff of the booking's place: any PENDING or CONFIRMED booking can be cancelled, the status reads\nCANCELLED_BY_STAFF, and the note stays internal to the staff. To refuse a PENDING request use decline_booking.\n",
