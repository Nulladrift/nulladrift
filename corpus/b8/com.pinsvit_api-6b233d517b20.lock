                  "properties": {
                    "date": {
                      "description": "Date, yyyy-MM-dd in the place's time zone.",
                      "type": "string"
                    },
                    "status": {
                      "description": "available, partial, fully_booked, closed, unavailable or exceeds_limits.",
                      "enum": ["available", "unavailable", "closed", "fully_booked", "partial", "exceeds_limits"],
