                          "lastStart": {
                            "description": "Latest bookable start in this window, ISO-8601 UTC; itself bookable.",
                            "type": "string"
                          },
                          "localFrom": {
                            "description": "Start on the place's clock, HH:mm.",
                            "type": "string"
                          },
                          "localLastStart": {
                            "description": "Latest start on the place's clock, HH:mm.",
                            "type": "string"
                          },
                          "streamIds": {
                            "description": "Streams free for this whole window; book any one of them, the first by default.",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "to": {
                            "description": "When a booking starting at lastStart ends, ISO-8601 UTC. A booking must fit inside one window.",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "windowsTruncated": {
                      "description": "True when the day held more windows than fit the answer; narrow timeFrom and timeTo to see the rest.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "durationMinutes": {
                "description": "Length these times are for, in minutes: the services' combined length, or the length asked for, capped at the place's maximum.",
                "type": "integer"
              },
              "geoHash": {
                "description": "GeoHash of that place, its other half of the key.",
                "type": "string"
              },
              "maxDurationMinutes": {
                "description": "Longest booking this place allows, in minutes; present with requiredDurationMinutes.",
                "type": "integer"
              },
              "minStartsAt": {
                "description": "Earliest start this place accepts from now, ISO-8601 UTC.",
                "type": "string"
              },
              "notes": {
                "description": "Plain sentences worth passing on to the user, e.g. where the length of these times came from.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "placeId": {
                "description": "Id of the place these times are for; pass it back to create_booking.",
