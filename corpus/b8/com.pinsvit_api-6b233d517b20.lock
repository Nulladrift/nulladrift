        {
          "name": "create_booking",
          "title": "Book a time",
          "description": "Books a time at a place: for the signed-in user, or, by staff of the place, for a customer.\nFirst confirm with the user the place, the time, the services and, when it matters, the stream (a table, a chair or a specialist).\nTake startsAt and streamIds from find_booking_times, and send either the durationMinutes it answered for or an\nendsAt; with services, book exactly one stream.\nThe result's status is CONFIRMED when the time is held, or PENDING when the business must accept it first — tell the user which.\nRetries: make up an idempotencyKey and resend it if the call fails or times out, so a retry cannot book twice.\nOn a CONFLICT saying a booking is already in progress, call list_my_bookings before retrying: the first\nattempt may have succeeded without answering.\nLimits: each customer is limited in open bookings and requests per place and per day, and in bookings per\n10 minutes and per day; a refusal names the limit.\nMoving a booking: book the new time with previousBookingId, then cancel the old one. The old booking still counts\nagainst those limits, and a new time overlapping it on the same stream is refused BOOKING_NOT_ALLOWED naming\nit, so if the new time is refused, ask the user before cancelling first.\nStaff booking for a walk-in (customerKey from find_place_customers, or customerName and customerContacts or\ncustomerEmail for someone without an account; any of them makes the booking the customer's, none makes it the\ncaller's own): CONFIRMED at once, skipping the minimum notice and the customer limits, after a search with\nforCustomer true; refused with BOOKING_NOT_ALLOWED unless the caller works at the place, or when the same\nrequest already booked them (the message names that booking; anyone else needs their own name or contact),\nand limited to 30 per 10 minutes and 300 per day per staff account.\n",
          "inputSchema": {
            "properties": {
              "customerContacts": {
                "description": "Staff only: other ways to reach the customer, e.g. a phone number; at most 10.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "customerEmail": {
                "description": "Staff only: the customer's email. An email with a Pinsvit account puts the booking in that user's bookings; any other email is kept as a contact.",
                "type": "string"
              },
              "customerKey": {
                "description": "Staff only: a customer from find_place_customers, so the booking is theirs; send it or customerEmail, never both.",
                "type": "string"
              },
              "customerName": {
                "description": "Staff only: the customer's name, at most 200 characters.",
                "type": "string"
              },
              "durationMinutes": {
                "description": "How long the booking lasts, when you send no endsAt; use the length the search answered for.",
                "type": "integer"
              },
              "endsAt": {
                "description": "End, ISO-8601 instant after startsAt; omit it and send durationMinutes instead.",
                "type": "string"
              },
              "geoHash": {
                "description": "geoHash of the place, as search_places, get_place and list_my_places return it.",
