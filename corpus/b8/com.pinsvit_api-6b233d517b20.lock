                "description": "True when the place takes bookings on Pinsvit; the booking tools work only then. False: tell the user how to reach the place instead.",
                "type": "boolean"
              },
              "categoryLabel": {
                "description": "Human-readable category, e.g. Coffee Shop.",
                "type": "string"
              },
              "contacts": {
                "description": "Contact lines: every one the business wrote (phone, email, website); a place nobody runs on Pinsvit carries web links only.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "countryCode": {
                "description": "ISO 3166-1 alpha-2 country code.",
                "type": "string"
              },
              "description": {
                "description": "Description written by the business; absent when none.",
                "type": "string"
              },
              "geoHash": {
                "description": "GeoHash of the place.",
                "type": "string"
              },
              "id": {
                "description": "Place id; identifies the place together with geoHash.",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude, WGS84 decimal degrees.",
                "type": "number"
              },
              "locality": {
                "description": "Town or city.",
                "type": "string"
              },
              "longitude": {
                "description": "Longitude, WGS84 decimal degrees.",
                "type": "number"
              },
              "medias": {
                "description": "Public URLs of the place's images.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Place name.",
                "type": "string"
              },
