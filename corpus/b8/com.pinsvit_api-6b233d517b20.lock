                },
                "type": "object"
              },
              "postcode": {
                "description": "Postal code.",
                "type": "string"
              },
              "region": {
                "description": "Region or state.",
                "type": "string"
              },
              "status": {
                "description": "The venue's operating status as imported, e.g. open or closed; absent when unknown.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone the opening hours are in, e.g. Europe/Kyiv; absent when unknown.",
                "type": "string"
              },
              "url": {
                "description": "Public page of the place; absent when it has none.",
                "type": "string"
