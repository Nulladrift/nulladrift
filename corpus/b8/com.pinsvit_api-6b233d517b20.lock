        {
          "name": "find_booking_times",
          "title": "Find bookable times",
          "description": "Finds the times a user can book at a place. Start here for any booking: only the place is required.\nThe answer lists, per date, windows of bookable starts. To book, pick a start from a window's from up to and\nincluding its lastStart, a whole number of stepMinutes after from (no stepMinutes means any minute), then send\nthat start, the answer's durationMinutes and one of the window's streamIds to create_booking.\nThe earliest time is the first window's from.\nWindows hold for one booking length, the answer's durationMinutes: set it with serviceIds or durationMinutes,\notherwise it is the place's shortest booking. For another length, search again rather than stretching a window.\nArguments use the place's local clock; answers are UTC.\nThe answer is advisory: create_booking checks again and names the nearest bookable starts when it refuses.\nStaff booking for a customer at their own place set forCustomer, so the answer matches the create_booking\nthey will send: the place's minimum notice does not apply to it.\n",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "First date to search, yyyy-MM-dd in the place's time zone; defaults to today there, and a past date is moved up to it. The last date searched may be at most 6 months ahead.",
                "type": "string"
              },
              "days": {
                "description": "How many dates to search from date onwards, 1 to 7; defaults to one when you name a date and 3 when you do not.",
                "type": "integer"
              },
              "durationMinutes": {
                "description": "Booking length in minutes when no service carries one; the place's shortest length by default, capped at its longest.",
                "type": "integer"
              },
              "forCustomer": {
                "description": "Staff only: true when the booking will be made for a customer with create_booking's customer arguments. Refused with BOOKING_NOT_ALLOWED unless the caller works at the place.",
                "type": "boolean"
              },
              "geoHash": {
                "description": "geoHash of the place, as search_places, get_place and list_my_places return it.",
                "type": "string"
              },
              "partySize": {
                "description": "Capacity wanted, e.g. the number of people; defaults to 1.",
                "type": "integer"
              },
              "placeId": {
                "description": "Id of the place.",
                "type": "string"
              },
              "serviceIds": {
                "description": "Services from get_place_services; their combined length is then the booking's length.",
