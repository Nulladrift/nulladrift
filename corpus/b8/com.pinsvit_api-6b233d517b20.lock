        {
          "name": "get_place",
          "title": "Get place",
          "description": "Returns one place by its geoHash and id, as returned by search_places: name, category, address, coordinates, contacts and whether it takes bookings on Pinsvit, plus opening hours, description and images when a business runs it there; no authentication.\nA bookable place is booked with get_place_services, find_booking_times and create_booking; for any other place give the user the address, web links and whatever hours the record holds.\ncontacts are every contact the business wrote; a place nobody runs on Pinsvit carries web links only. Not found means the place was removed or has just been claimed: search again.\n",
          "inputSchema": {
            "properties": {
              "geoHash": {
                "description": "geoHash of the place, returned next to its id by search_places.",
                "type": "string"
              },
              "placeId": {
                "description": "Id of the place.",
                "type": "string"
              }
            },
            "required": ["geoHash", "placeId"],
            "type": "object"
