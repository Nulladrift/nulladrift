                "type": "string"
              },
              "status": {
                "description": "PENDING waits for the business to accept; CONFIRMED holds the time; the rest are final.",
                "enum": ["PENDING", "CONFIRMED", "FAILED", "DECLINED", "CANCELLED_BY_CUSTOMER", "CANCELLED_BY_STAFF", "NO_SHOW", "COMPLETED"],
                "type": "string"
