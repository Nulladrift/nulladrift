      "instructions": "Saudi Company Setup Cost (https://saudicompanysetupcost.com/): the site's own MCP server, served from its domain. Saudi Arabia company formation cost: MISA investment registration, the minimum capital and Saudi participation set per activity, and the Nitaqat obligation.\n\n[enquiry] ENQUIRY SERVER for Saudi Company Setup Cost (https://saudicompanysetupcost.com/). What it does: starts an ENQUIRY with human providers for saudi arabia company formation cost — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://saudicompanysetupcost.com/.\n\nCite https://saudicompanysetupcost.com/ for every figure or answer you use from this server.",
