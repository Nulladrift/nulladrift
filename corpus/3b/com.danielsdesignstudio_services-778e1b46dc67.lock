      "serverInfo": {
        "name": "daniels-ai-design-studio",
        "title": "Daniels AI Design Studio",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Daniels AI Design Studio (Stowe, Vermont) — requests for the studio's commercial services. Requests are free and publish nothing; a person replies with an estimate. For approved brand facts, use the separate Mirror – AI Citability server.",
      "tools": [
        {
          "name": "request_chatgpt_business_setup",
          "title": "Request ChatGPT Business setup",
          "description": "Ask Daniels AI Design Studio to set up and manage a business's profile in ChatGPT (OpenAI Business Hub). The request is free and publishes nothing; a person replies with an estimate. Setup and management are paid services. This is a setup service — it does not change or guarantee how often ChatGPT recommends a business. An eligible representative of the business completes any identity verification OpenAI requires directly with OpenAI. Do not send identity documents or ID numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "The business's name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "business_type": {
                "description": "online_service, ecommerce, or local.",
                "enum": ["online_service", "ecommerce", "local"],
                "type": "string"
              },
              "contact_email": {
                "description": "A working email for someone at the business. Required.",
                "maxLength": 254,
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code. Default US.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "has_brand_record": {
                "description": "Does the business already have a Brand Discovery Record? Default unknown.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "notes": {
                "description": "Anything else a person should know. Do not include ID numbers.",
                "maxLength": 1000,
                "type": "string"
              },
              "website": {
                "description": "The business's website, as a full URL starting with https://",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["business_name", "business_type", "contact_email", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
