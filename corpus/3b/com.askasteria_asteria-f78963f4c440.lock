        {
          "name": "tarot_draw",
          "title": "Tarot reading (draw cards)",
          "description": "Draws 1 to 10 distinct cards at random from the 78-card tarot deck and returns the reading of each, in the order drawn: a card of the day, or a free spread whose positions you assign in that order. It returns the app's text for each card, not a synthesis: reading the draw as a whole for the person's question (each card in its position, the cards together) is left to the assistant, from these texts only.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many cards to draw (default 1).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "deck": {
                "description": "full: all 78 cards (default); majors: the 22 major arcana.",
                "enum": ["full", "majors"],
                "type": "string"
              },
              "detail": {
                "description": "full: each card's whole reading; short: its opening meaning, as in a spread (default: full up to 3 cards, short beyond).",
                "enum": ["full", "short"],
                "type": "string"
              },
              "language": {
                "description": "Language of the readings: en, fr, es, pt-BR, ja or de (default en). Use the language of the conversation.",
                "enum": ["en", "fr", "es", "pt-BR", "ja", "de"],
                "type": "string"
