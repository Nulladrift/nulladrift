        {
          "name": "ritual",
          "title": "Ritual (Kabbalah, Moon, protection)",
          "description": "Finds rituals in the Asteria app's catalogue and returns the ritual as the app writes it: when to do it (Moon phase, day), what you need, every step in order with the words to say and the verses each step has you say, then what it is, why do it and what makes it magic. Kabbalah comes first (the Kabbalistic Cross, the pentagram, the elements, the shield of David, the middle pillar). Search by intention (beginning, calm, clarity, cleansing, confidence, energy, gratitude, grief, home, love, money, protection, release, work), by Moon phase (\"today\" for the phase of the day), by family, or by name. With a birth date (and time), it returns the three guardian angels (genii) of that birth among the seventy-two, with the psalm verse said to each at its hour.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "Birth date, YYYY-MM-DD: returns the guardian angels (genii) of that birth.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Birth time on the local clock of the birth place, HH:MM: adds the angel of the hour of birth.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "family": {
                "description": "A family of rituals.",
                "enum": ["ceremony", "moon", "purification", "prayer", "psalm", "talisman", "fire", "offering"],
                "type": "string"
              },
              "intention": {
                "description": "What the ritual is for.",
                "enum": ["beginning", "calm", "clarity", "cleansing", "confidence", "energy", "gratitude", "grief", "home", "love", "money", "protection", "release", "work"],
                "type": "string"
              },
              "language": {
                "description": "Language of the readings: en, fr, es, pt-BR, ja or de (default en). Use the language of the conversation.",
                "enum": ["en", "fr", "es", "pt-BR", "ja", "de"],
                "type": "string"
              },
              "moon_phase": {
                "description": "A Moon phase, or \"today\" for the phase of the day.",
                "enum": ["new_moon", "waxing_crescent", "first_quarter", "waxing_gibbous", "full_moon", "waning_gibbous", "last_quarter", "waning_crescent", "today"],
                "type": "string"
              },
              "name": {
                "description": "A ritual's name or id, e.g. Kabbalistic Cross, qabalistic-cross.",
                "type": "string"
              },
              "offset": {
                "description": "A search lists 10 rituals at a time: the rank of the first to list (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "timezone": {
                "description": "IANA time zone used to cut the day for moon_phase \"today\" (default UTC).",
                "type": "string"
              }
            },
            "type": "object"
          },
