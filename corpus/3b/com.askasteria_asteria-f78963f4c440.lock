      },
      "instructions": "Astrology, tarot and rituals. Positions come from the astronomical engine of the Asteria app; readings, rituals and psalms are its own texts, returned as written: quote them as written, then, for a tarot draw, interpret the draw as a whole for the person's question, from those card texts only. A ritual's steps, words and verses are given in full and in order: never add, drop or change a step. Birth data is used for the answer only and never stored. In French, Spanish, Portuguese and German the readings are written for a woman, as in the app: keep the feminine forms when quoting or rephrasing them, and use the masculine only if the person has said they are a man.",
      "tools": [
        {
          "name": "birth_chart",
          "title": "Birth chart (natal chart)",
          "description": "Computes a natal chart from a birth date, with optional birth time and place: the sign and degree of the Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto, Chiron and the North Node, the major aspects between them, and, when the time, time zone and coordinates are given, the Ascendant (rising sign), Midheaven, the twelve Placidus houses and the house of each planet. Returns the full reading of the Sun, Moon and rising sign (the big three) and a one-line reading of every other placement. Use it for any question about someone's birth chart, big three, or planets in signs and houses.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the readings: en, fr, es, pt-BR, ja or de (default en). Use the language of the conversation.",
                "enum": ["en", "fr", "es", "pt-BR", "ja", "de"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the place of birth (where the person was born, never where the user is now), degrees, north positive.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the place of birth (where the person was born, never where the user is now), degrees, east positive.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Birth time on the local clock of the birth place, HH:MM (24-hour). Optional when unknown.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone of the birth place (e.g. Europe/Paris, America/New_York, America/Sao_Paulo). Required with a time.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Birth chart"
