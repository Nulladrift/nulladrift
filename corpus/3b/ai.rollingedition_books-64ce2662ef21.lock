              "edition": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Edition"
              },
              "section_id": {
                "title": "Section Id",
                "type": "string"
              }
