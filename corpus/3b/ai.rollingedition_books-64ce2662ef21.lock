          "title": "Search the books",
          "description": "Find the passages that best match `query`, by its words, across every book or within one (`book`, a slug). Each result has its book, edition, section ID and title, a snippet, and the citation block to cite it with. Read a whole result with get_section. `limit` is 5 unless you ask for up to 10.",
