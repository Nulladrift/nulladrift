          "title": "List the books",
          "description": "List Rolling Edition's books: each one's slug, title, summary, level, areas and skills, its current edition, the date its examples last passed, how many of its examples pass, and its link. Give `topic`, an area or skill ID such as \"data-engineering\" or \"large-language-models\", to list only the books on it.",
