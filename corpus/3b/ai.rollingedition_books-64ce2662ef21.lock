            "properties": {
              "book": {
                "title": "Book",
                "type": "string"
              },
              "since_edition": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Since Edition"
              },
              "to_edition": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "To Edition"
              }
            },
            "required": ["book"],
            "title": "get_changesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_changesDictOutput",
            "type": "object"
          },
          "annotations": {
