          "title": "A book's agent skill",
          "description": "A book's agent skill: its SKILL.md, in the Agent Skills format, with the methods the book teaches as procedures, each step linked to the section it comes from, and how to install the whole skill, with the chapters and examples, in Claude Code or any agent that reads the format. Read a step's section with get_section before acting on it. A book without one says so.",
