{
  "lockfileVersion": 2,
  "subjects": {
    "com.geopagespeed/scanner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geopagespeed.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "geopagespeed",
        "title": "GeoPageSpeed",
        "version": "1.0.0",
        "websiteUrl": "https://geopagespeed.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GeoPageSpeed checks whether AI answer engines (ChatGPT search, Claude, Perplexity, Google AI Overviews, Copilot) can reach a web page, read it without JavaScript, and quote it. It fetches the page once, applies fixed rules to the raw HTML, and returns a score with evidence for every result. It does not query AI engines and cannot measure citations. Use scan_page for a URL, explain_check for one result's rule and fix, and list_checks for the full rule set. Scans are rate limited per client IP.",
      "tools": [
        {
          "name": "explain_check",
          "title": "Explain a check",
          "description": "What one GeoPageSpeed check tests, its evidence tier, how it counts in the score, how to fix a failure, and its sources. Takes a check ID from a report, e.g. crawl.ai_search_bots_allowed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The check ID",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0eec6e33d8a67010916a8a4c30c525fbe9e14232ccdc324e7380c1254714a4ea"
        },
        {
          "name": "list_checks",
          "title": "List all checks",
          "description": "Every check GeoPageSpeed runs, grouped by module, with its ID, title and evidence tier.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:274fb18232031c1c6b4399c5a9c110a81049cf577065aac9fe784fd4e40efa8e"
        },
        {
          "name": "scan_page",
          "title": "Scan a page for AI search readiness",
          "description": "Fetch a public web page once (no JavaScript, like most AI crawlers) and return the GeoPageSpeed report in Markdown: the score, top fixes, AI crawler access, and every check with its status, evidence tier and fix. Takes about 5 seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page_type": {
                "description": "Override the detected page type. Leave out to detect it.",
                "enum": ["home", "article", "product", "docs", "listing", "other"],
                "type": "string"
              },
              "url": {
                "description": "The page to scan, e.g. https://example.com/pricing",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ba22171943744530e6f54bb0c1ac51fb6fbff8beb8693710b44f5e15a01bd71"
        }
      ],
      "digest": "sha256:01e1e28015a7d26f66cb76db2490744dcff7f38dcc3c8dce10f82003f90a56f8"
    }
  }
}
