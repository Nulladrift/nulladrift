      "instructions": "AI Data Finders Fee (https://aidatafindersfee.com/): the site's own MCP server, served from its domain. The AI data finders fee as AI data, compute and AI services firms publish it: 15 programmes, a median of 10%, each with the firm's own sentence.\n\n[enquiry] ENQUIRY SERVER for AI Data Finders Fee (https://aidatafindersfee.com/). What it does: starts an ENQUIRY with AI Data Finders Fee for ai data finders fee; the AI Data Finders Fee team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Finders Fee team until they click it. Cite https://aidatafindersfee.com/.\n\nCite https://aidatafindersfee.com/ for every figure or answer you use from this server.",
