      "instructions": "Cosmic Chemistry computes Vedic (sidereal, Lahiri, whole-sign houses) astrology: Vedic astrology, made fun and honest. Present results as tendencies the person can check against their life, never as predictions. No fear, no doom, no gemstone or puja remedies, no life-span or health readings. When a Western app gives a different sign or house, say both systems are valid and measure from different starting points. Use the birth place exactly as the user gave it; if the answer says which place was used, mention it so they can correct it. End with the page link, and for patterns the person keeps repeating, the reading link. The daily tools (the day’s panchang, festival and vrat dates, the Moon today, planetary hours, Mercury and Venus retrograde) need no birth details: use them for questions about today or a date, and give their times as clock times for the place used. Compatibility between two people has no score or verdict, on purpose: never invent a percentage or a guna count. The chart tools (birth chart, rising sign, nakshatra, D9 and D10, karakas, Manglik, raj yoga, Indu Lagna, the signs both ways) take any date from 1900 to 2100, a planned or future birth too. The dasha, Sade Sati, Saturn return and vehicle tools count from today and need a past birth. The birth chart tool also draws a chart card where the host can show one; then keep the words short (the rising sign, the Moon, the period running now, what to check): the card carries the table.",
      "tools": [
        {
          "name": "birth_chart_compatibility",
          "title": "Birth chart compatibility (Vedic synastry)",
          "description": "Use this when someone asks whether two people are compatible in Vedic astrology, for synastry, or to compare two birth charts (\"are we compatible\", \"compare my chart with my partner’s\", \"Vedic compatibility for me and my husband\"). Returns each person’s Moon, Venus and Mars signs (and rising sign with a time), how the two Moon signs sit to each other, where each person’s Sun, Moon, Mars and Venus land in the other’s houses, and the strongest links between their planets. It gives no score and no verdict, and it is not the 36-point guna milan of kundli matching: say so if asked for gunas. Needs both dates and towns of birth; times make it exact. The first person is usually the one asking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "person_a_birth_date": {
                "description": "The first person’s date of birth, YYYY-MM-DD.",
                "type": "string"
              },
              "person_a_birth_place": {
                "description": "The first person’s town or city of birth, with region or country if known.",
                "type": "string"
              },
              "person_a_birth_time": {
                "description": "The first person’s local clock time of birth, 24-hour HH:MM, if known.",
                "type": "string"
              },
              "person_b_birth_date": {
                "description": "The second person’s date of birth, YYYY-MM-DD.",
                "type": "string"
              },
              "person_b_birth_place": {
                "description": "The second person’s town or city of birth, with region or country if known.",
                "type": "string"
              },
              "person_b_birth_time": {
                "description": "The second person’s local clock time of birth, 24-hour HH:MM, if known.",
                "type": "string"
              }
            },
            "required": ["person_a_birth_date", "person_a_birth_place", "person_b_birth_date", "person_b_birth_place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Birth chart compatibility (Vedic synastry)"
