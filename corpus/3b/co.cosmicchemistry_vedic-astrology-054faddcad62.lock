        {
          "name": "divisional_chart",
          "title": "Navamsa (D9) or dashamsha (D10) chart",
          "description": "Use this when someone asks for their navamsa (D9) chart, read for marriage and inner strength, or their dashamsha (D10) chart, read for career (\"my navamsa chart\", \"D9 chart\", \"Venus in my navamsa\", \"D10 career chart\", \"my ishta devata\"). Set \"chart\" to d9 or d10. Returns the rising sign and every planet with its sign and house in that chart; the D9 adds the ishta and palana deities read from the karakamsha, the D10 the deity of each planet’s part. Needs birth date, time and town: the D9 rising sign moves on about every 13 minutes of birth time, the D10’s about every 12. Future dates to 2100 work too.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
