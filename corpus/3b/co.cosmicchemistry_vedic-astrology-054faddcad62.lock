        {
          "name": "chara_karakas",
          "title": "Atmakaraka, amatyakaraka and darakaraka",
          "description": "Use this when someone asks for their atmakaraka (soul planet), amatyakaraka (career planet), darakaraka (spouse or partner planet) or their seven chara karakas in Jaimini or Vedic astrology (\"what is my atmakaraka\", \"my darakaraka\", \"darakaraka in navamsa\", \"which planet is my career planet\"). Set \"which\" to the karaka asked about. Returns all seven karakas in order with sign, degree, nakshatra and navamsa sign, and with a birth time the house. Works from the birth date and town; without the time the answer can change during the birth day, and then each possibility comes with the hours it holds for. Future dates to 2100 work too.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "description": "Date of birth, YYYY-MM-DD, e.g. 1993-03-17.",
                "type": "string"
              },
              "birth_place": {
                "description": "Town or city of birth, with region or country if known, e.g. \"Chicago, Illinois, US\" or \"Pune, India\".",
                "type": "string"
              },
              "birth_time": {
                "description": "Local clock time of birth, 24-hour HH:MM, e.g. 13:35. As exact as possible (from a birth certificate).",
                "type": "string"
              },
              "which": {
                "description": "The karaka asked about. Leave out for the atmakaraka.",
                "enum": ["atmakaraka", "amatyakaraka", "darakaraka"],
                "type": "string"
              }
            },
            "required": ["birth_date", "birth_place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Atmakaraka, amatyakaraka and darakaraka"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20c4575f03dc7ed5bfa8bd748e08919772ccf523827bab384e9ef1f7eb6701dc"
        },
        {
          "name": "current_dasha",
          "title": "Current dasha (Vimshottari)",
          "description": "Use this when someone asks which mahadasha or antardasha they are running, their Vimshottari dasha timeline, when their next dasha begins, or when a dasha ends (\"when does my Rahu dasha end\", \"my current dasha lord\", \"which dasha was I in during 2019\", \"when is my Venus antardasha\"). Returns every mahadasha with dates, and the antardasha, pratyantar and sookshma running now. Set on_date for what was or will be running on another day; set mahadasha to list all nine antardashas of one mahadasha with dates. For what a dasha means in general, without birth details, use mahadasha_meaning. Needs birth date, time and town, and a past birth: it counts from today.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "description": "Date of birth, YYYY-MM-DD, e.g. 1993-03-17.",
                "type": "string"
              },
              "birth_place": {
                "description": "Town or city of birth, with region or country if known, e.g. \"Chicago, Illinois, US\" or \"Pune, India\".",
                "type": "string"
              },
              "birth_time": {
                "description": "Local clock time of birth, 24-hour HH:MM, e.g. 13:35. As exact as possible (from a birth certificate).",
                "type": "string"
              },
              "mahadasha": {
                "description": "Optional: one mahadasha lord, to list all nine antardashas of that mahadasha with dates, past, now or ahead.",
                "enum": ["sun", "moon", "mars", "mercury", "jupiter", "venus", "saturn", "rahu", "ketu"],
                "type": "string"
              },
              "on_date": {
                "description": "Optional: a day as YYYY-MM-DD, to see which periods were or will be running then. Leave out for today.",
                "type": "string"
              }
            },
            "required": ["birth_date", "birth_place", "birth_time"],
            "type": "object"
          },
