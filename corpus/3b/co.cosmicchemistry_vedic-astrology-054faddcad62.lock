        {
          "name": "planet_in_house_meaning",
          "title": "Planet in a house (Vedic meaning)",
          "description": "Use this when someone asks what a planet in a house means in Vedic astrology, e.g. \"Venus in the 8th house\", \"Saturn in 12th house meaning\", \"Sun in my 12th house\". Use this instead of vedic_birth_chart when the person names a planet and a house, even in the first person (\"my Venus is in my 8th\"); do not ask for birth details. Returns what the house holds, what the planet brings, our line for that planet in that house, how each tends to show in daily life, when it tends to work and when it strains, and our article when one exists. None of these tools cover daily horoscopes, gemstones, tarot or predictions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "house": {
                "description": "House number, 1 to 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
