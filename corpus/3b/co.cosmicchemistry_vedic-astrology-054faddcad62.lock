          "description": "Use this when someone asks whether they have raj yoga (raja yoga) or another yoga in their kundli or birth chart, how strong a yoga is, or when it will activate (\"do I have raj yoga\", \"raj yoga calculator\", \"Gaja Kesari yoga in my chart\", \"vipreet raj yoga\", \"neecha bhanga raja yoga\", \"Malavya yoga\", \"when will my raj yoga give results\"). Returns each classical yoga the chart holds: raja yogas from the lords of the angles and trines, Maha Raja yoga, the yogakaraka, Gaja Kesari, the five Mahapurusha yogas (Ruchaka, Bhadra, Hamsa, Malavya, Sasa), Lakshmi, Neecha Bhanga and Vipreet (Harsha, Sarala, Vimala), plus Budhaditya marked as a modern yoga. For each: how it forms in this chart, its strength on the classical scale (full, half or a quarter, from each planet’s shadbala against the strength the classical texts ask), whether its planets’ period is running now or the next dated window, and how common it is in our sample of 20,000 charts. Needs birth date, time and town; future dates to 2100 work too.",
