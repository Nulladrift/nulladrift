        {
          "name": "get_trial_eligibility",
          "title": "Get a trial's eligibility",
          "description": "Read who can take part in one public clinical trial: the registry's inclusion and exclusion criteria split into lists, plus age limits, sex and whether healthy volunteers are accepted. The wording is the registry's own, unedited and not explained; explain it to the person yourself and do not tell them whether they qualify. If the registry text has no inclusion and exclusion headings, unstructured is true and only criteriaText is filled. Send an NCT ID only. Not medical advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nctId": {
                "description": "ClinicalTrials.gov ID.",
                "pattern": "^[Nn][Cc][Tt]\\d{8}$",
                "type": "string"
              }
            },
            "required": ["nctId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "criteriaText": {
                "description": "The registry's full eligibility text.",
                "type": ["string", "null"]
              },
              "exclusion": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "healthyVolunteers": {
                "type": ["boolean", "null"]
              },
              "inclusion": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxAge": {
                "type": ["integer", "null"]
              },
              "minAge": {
                "type": ["integer", "null"]
              },
              "nctId": {
                "type": "string"
              },
              "sex": {
                "type": ["string", "null"]
              },
              "unstructured": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["exclusion", "inclusion", "nctId", "unstructured", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
