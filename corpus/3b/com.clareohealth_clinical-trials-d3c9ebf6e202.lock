        {
          "name": "get_recent_trial_changes",
          "title": "Find recently updated trials",
          "description": "Find public clinical trials the registry updated on or after a date, for a condition (query) or to check one trial (nctId). This uses the registry's last-update date only: it tells you a record changed, not what changed, so send a person to the trial page for the details. Give either query or nctId, plus since as YYYY-MM-DD. Paged like search_clinical_trials. Send conditions and places only, never a person's name, diagnosis history, medications or other health details. Not medical advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "nctId": {
                "description": "One trial to check. Use this or query.",
                "pattern": "^[Nn][Cc][Tt]\\d{8}$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Condition, treatment or sponsor. Use this or nctId.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "Date as YYYY-MM-DD; trials updated on or after it are kept.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "basis": {
                "description": "What \"changed\" means here.",
                "enum": ["lastUpdatePostDate"],
                "type": "string"
              },
              "hasMore": {
                "type": "boolean"
              },
              "nextPage": {
                "type": ["integer", "null"]
              },
              "page": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "properties": {
                    "briefTitle": {
                      "type": ["string", "null"]
                    },
                    "conditions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "distanceMiles": {
                      "description": "Miles to the nearest site, only when a zip or radius was searched.",
                      "type": "number"
                    },
                    "interventions": {
                      "items": {
                        "properties": {
                          "name": {
                            "type": ["string", "null"]
                          },
                          "type": {
                            "type": ["string", "null"]
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "lastUpdatePostDate": {
                      "description": "Date the registry last updated the record (YYYY-MM-DD).",
                      "type": ["string", "null"]
                    },
                    "leadSponsor": {
                      "type": ["string", "null"]
                    },
                    "locations": {
                      "description": "At most the first 10 sites. Use the trial page for all of them.",
                      "items": {
                        "properties": {
                          "city": {
                            "type": ["string", "null"]
                          },
                          "country": {
                            "type": ["string", "null"]
                          },
                          "facility": {
                            "type": ["string", "null"]
                          },
                          "state": {
                            "type": ["string", "null"]
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "maxAge": {
                      "description": "Maximum age in whole years, null when the registry gives none.",
                      "type": ["integer", "null"]
                    },
                    "minAge": {
                      "description": "Minimum age in whole years, null when the registry gives none.",
                      "type": ["integer", "null"]
                    },
                    "nctId": {
                      "description": "ClinicalTrials.gov ID, for example NCT01234567.",
                      "type": "string"
                    },
                    "overallStatus": {
                      "description": "Registry status, for example RECRUITING.",
                      "type": ["string", "null"]
                    },
                    "phase": {
                      "description": "Registry phases joined with a slash, for example PHASE2/PHASE3.",
                      "type": ["string", "null"]
                    },
                    "registryUrl": {
                      "description": "The trial's page on ClinicalTrials.gov.",
                      "type": "string"
                    },
                    "sex": {
