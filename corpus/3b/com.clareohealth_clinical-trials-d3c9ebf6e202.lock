        {
          "name": "search_clinical_trials",
          "title": "Search clinical trials",
          "description": "Search public clinical trials from ClinicalTrials.gov by condition, treatment or sponsor, optionally narrowed by place (city, state, country, or a ZIP code with a radius), status, phase, sex or age. Use this first when a person wants to find trials; use get_clinical_trial when you already have an NCT ID. Each result has public registry fields and a clareohealth.com link. Results are paged: when hasMore is true, call again with page set to nextPage. Send conditions and places only, never a person's name, diagnosis history, medications or other health details. Not medical advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City, for example \"Boston\". Combine with state or country to narrow it.",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "description": "Country, for example \"United States\".",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxAge": {
                "description": "Whole years. See minAge.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "minAge": {
                "description": "Whole years. With maxAge, keeps trials whose eligible ages overlap minAge to maxAge. Use the same number for both to match one age.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "phase": {
                "description": "Phases to keep, for example [\"PHASE2\",\"PHASE3\"].",
                "items": {
                  "enum": ["EARLY_PHASE1", "PHASE1", "PHASE2", "PHASE3", "PHASE4"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "query": {
                "description": "Condition, treatment or sponsor, for example \"breast cancer\" or \"type 1 diabetes\". A place in the text (\"asthma in Boston\") also works; city, state and country are clearer.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "radiusMiles": {
                "description": "Search radius in miles around zip, or around city with state. Defaults to 50 with a zip. Giving it with city and state searches around that US city instead of matching its name.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "recruitingOnly": {
                "description": "Only trials that are recruiting or enrolling by invitation. Ignored when status is set.",
                "type": "boolean"
              },
              "sex": {
                "description": "Keep trials open to this sex. \"all\" applies no filter.",
                "enum": ["all", "male", "female"],
                "type": "string"
              },
              "sortBy": {
                "default": "relevance",
                "description": "relevance is the registry's order with condition matches first. distance (needs zip, or city with state and radiusMiles) puts the nearest site first among the best 50 matches.",
                "enum": ["relevance", "distance", "lastUpdated", "startDate"],
                "type": "string"
              },
              "sortOrder": {
                "default": "desc",
                "description": "Used with lastUpdated or startDate.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "State or region, for example \"Massachusetts\".",
                "maxLength": 100,
