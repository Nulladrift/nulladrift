      "instructions": "Read-only search of public clinical trials from ClinicalTrials.gov, as shown on clareohealth.com/clinical-trials. Use it when a person wants to find trials by condition or place, or read one trial by its NCT ID. It returns public registry data only. It cannot sign anyone up, apply to a trial, or read anyone's health record. Do not send it a person's health details; search by condition and location only. It does not give medical advice.",
      "tools": [
        {
          "name": "compare_clinical_trials",
          "title": "Compare clinical trials",
          "description": "Read two to five public clinical trials by NCT ID in one call, with the fields that matter side by side: status, phase, conditions, interventions, sponsor, ages, sex, healthy volunteers, enrollment, dates and site count. Use it after search_clinical_trials when a person is choosing between trials. An ID the registry does not know comes back in notFound. Registry contacts are left out. Not medical advice; do not rank trials for a person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nctIds": {
                "description": "Two to five ClinicalTrials.gov IDs.",
                "items": {
                  "pattern": "^[Nn][Cc][Tt]\\d{8}$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["nctIds"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "notFound": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trials": {
                "items": {
                  "properties": {
                    "briefTitle": {
                      "type": ["string", "null"]
                    },
                    "completionDate": {
                      "type": ["string", "null"]
                    },
                    "conditions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "distanceMiles": {
                      "description": "Miles to the nearest site, only when a zip or radius was searched.",
                      "type": "number"
                    },
                    "enrollmentCount": {
                      "type": ["integer", "null"]
                    },
                    "healthyVolunteers": {
                      "type": ["boolean", "null"]
                    },
                    "interventions": {
                      "items": {
                        "properties": {
                          "name": {
                            "type": ["string", "null"]
                          },
                          "type": {
                            "type": ["string", "null"]
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "lastUpdatePostDate": {
                      "description": "Date the registry last updated the record (YYYY-MM-DD).",
                      "type": ["string", "null"]
                    },
                    "leadSponsor": {
                      "type": ["string", "null"]
                    },
                    "locations": {
                      "description": "At most the first 10 sites. Use the trial page for all of them.",
                      "items": {
                        "properties": {
                          "city": {
                            "type": ["string", "null"]
                          },
                          "country": {
                            "type": ["string", "null"]
                          },
                          "facility": {
                            "type": ["string", "null"]
                          },
                          "state": {
                            "type": ["string", "null"]
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "maxAge": {
                      "description": "Maximum age in whole years, null when the registry gives none.",
                      "type": ["integer", "null"]
                    },
                    "minAge": {
                      "description": "Minimum age in whole years, null when the registry gives none.",
                      "type": ["integer", "null"]
                    },
                    "nctId": {
                      "description": "ClinicalTrials.gov ID, for example NCT01234567.",
                      "type": "string"
                    },
                    "overallStatus": {
                      "description": "Registry status, for example RECRUITING.",
                      "type": ["string", "null"]
                    },
                    "phase": {
                      "description": "Registry phases joined with a slash, for example PHASE2/PHASE3.",
                      "type": ["string", "null"]
                    },
                    "registryUrl": {
                      "description": "The trial's page on ClinicalTrials.gov.",
                      "type": "string"
                    },
                    "sex": {
                      "description": "ALL, MALE or FEMALE.",
                      "type": ["string", "null"]
                    },
                    "siteCount": {
                      "type": "integer"
                    },
                    "startDate": {
                      "type": ["string", "null"]
                    },
                    "studyType": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "The trial's page on clareohealth.com.",
                      "type": "string"
                    }
                  },
                  "required": ["nctId", "registryUrl", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["notFound", "trials"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
