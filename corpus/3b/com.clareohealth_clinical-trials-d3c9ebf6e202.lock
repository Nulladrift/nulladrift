        {
          "name": "get_clinical_trial",
          "title": "Get a clinical trial",
          "description": "Read one public clinical trial by its NCT ID (for example NCT01234567): summary, status, phase, eligibility text, every site and links. Use it after search_clinical_trials, or when a person already has an NCT ID. Registry contacts are left out; the trial's page on clareohealth.com carries them. Not medical advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nctId": {
                "description": "ClinicalTrials.gov ID: NCT and 8 digits.",
                "pattern": "^[Nn][Cc][Tt]\\d{8}$",
                "type": "string"
              }
            },
            "required": ["nctId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "trial": {
                "properties": {
                  "briefSummary": {
                    "type": ["string", "null"]
                  },
                  "briefTitle": {
                    "type": ["string", "null"]
                  },
                  "completionDate": {
                    "type": ["string", "null"]
                  },
                  "conditions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "distanceMiles": {
                    "description": "Miles to the nearest site, only when a zip or radius was searched.",
                    "type": "number"
                  },
                  "eligibilityCriteria": {
                    "description": "The registry's inclusion and exclusion text, unedited.",
                    "type": ["string", "null"]
                  },
                  "enrollmentCount": {
                    "type": ["integer", "null"]
                  },
                  "healthyVolunteers": {
                    "type": ["boolean", "null"]
                  },
                  "interventions": {
                    "items": {
                      "properties": {
                        "name": {
                          "type": ["string", "null"]
                        },
                        "type": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "lastUpdatePostDate": {
                    "description": "Date the registry last updated the record (YYYY-MM-DD).",
                    "type": ["string", "null"]
                  },
                  "leadSponsor": {
                    "type": ["string", "null"]
                  },
                  "locations": {
                    "description": "Every site the registry lists.",
                    "items": {
                      "properties": {
                        "city": {
                          "type": ["string", "null"]
                        },
                        "country": {
                          "type": ["string", "null"]
                        },
                        "facility": {
                          "type": ["string", "null"]
                        },
                        "state": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "maxAge": {
                    "description": "Maximum age in whole years, null when the registry gives none.",
                    "type": ["integer", "null"]
                  },
                  "minAge": {
                    "description": "Minimum age in whole years, null when the registry gives none.",
                    "type": ["integer", "null"]
                  },
                  "nctId": {
                    "description": "ClinicalTrials.gov ID, for example NCT01234567.",
                    "type": "string"
                  },
                  "officialTitle": {
                    "type": ["string", "null"]
                  },
                  "overallStatus": {
                    "description": "Registry status, for example RECRUITING.",
                    "type": ["string", "null"]
                  },
                  "phase": {
                    "description": "Registry phases joined with a slash, for example PHASE2/PHASE3.",
                    "type": ["string", "null"]
                  },
                  "primaryCompletionDate": {
                    "type": ["string", "null"]
                  },
                  "registryUrl": {
                    "description": "The trial's page on ClinicalTrials.gov.",
                    "type": "string"
                  },
                  "sex": {
                    "description": "ALL, MALE or FEMALE.",
                    "type": ["string", "null"]
                  },
                  "startDate": {
                    "type": ["string", "null"]
                  },
                  "studyType": {
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "The trial's page on clareohealth.com.",
                    "type": "string"
                  }
                },
                "required": ["nctId", "registryUrl", "url"],
                "type": "object"
              }
