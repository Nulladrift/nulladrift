                "minimum": 1,
                "type": "integer"
              },
              "nctId": {
                "description": "ClinicalTrials.gov ID.",
                "pattern": "^[Nn][Cc][Tt]\\d{8}$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 50,
