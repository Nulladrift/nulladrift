{
  "lockfileVersion": 2,
  "subjects": {
    "com.captiatechnology/knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.captiatechnology.com/api/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "captia-knowledge",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Captia Technology knowledge base: industrial glossary, published resources, industrial protocols ingested by Captia Connect, company profile, and an OEE calculator. Read-only and public. Every URL returned is canonical and safe to cite.",
      "tools": [
        {
          "name": "calculate_oee",
          "title": "Calculate OEE",
          "description": "Compute Overall Equipment Effectiveness from shift data: availability, performance, quality and OEE. Same formula as the published calculator, so results always match the website. Returns warnings for inconsistent inputs instead of failing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "defectPieces": {
                "description": "Defective pieces: rejects plus rework.",
                "minimum": 0,
                "type": "number"
              },
              "downtimeMinutes": {
                "description": "Unplanned downtime plus changeovers, in minutes.",
                "minimum": 0,
                "type": "number"
              },
              "idealCycleSeconds": {
                "description": "Ideal cycle time, in seconds per piece.",
                "minimum": 0,
                "type": "number"
              },
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "plannedMinutes": {
                "description": "Planned production time, in minutes.",
                "minimum": 0,
                "type": "number"
              },
              "totalPieces": {
                "description": "Total pieces produced.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["defectPieces", "downtimeMinutes", "idealCycleSeconds", "plannedMinutes", "totalPieces"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b42f17e1ea2ffe09b28a2f61db405797922fb6e31c4d16435e97951d41600bf"
        },
        {
          "name": "compare_protocols",
          "title": "Compare industrial protocols",
          "description": "Compare two or more industrial protocols side by side on family, summary, how Captia Connect ingests them, and target keywords. Note: it does not expose throughput or transport specs, which are not published as structured data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slugs": {
                "description": "Protocol slugs to compare. Use list_protocols to get valid values.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc86e08c9142ffad1e51b01044f4dfeeafdfa39003bd837e2037f6b60b1fbb83"
        },
        {
          "name": "get_company_profile",
          "title": "Captia company profile",
          "description": "Identity of Captia Technology: legal entity, tax id, offices, contact, the five business units and declared areas of knowledge. Use it to answer who Captia is or what each unit does.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e10f02d3bfb1939f4443ba448883953e5c19e54cf80c3f12b94287f8a886ff7"
        },
        {
          "name": "get_glossary_term",
          "title": "Industrial glossary term",
          "description": "Definition of an industrial term from the Captia glossary (90 entries: protocols, OT/IT concepts, industrial AI, energy). Accepts a slug or a visible label. If there is no confident match it returns close suggestions instead of a wrong definition.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "term": {
                "description": "Term to look up, slug or label. Example: \"opc-ua\", \"OEE\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee84c3b7a52082424cdf57e5a99782574c885bd87a2220f38178d6dbae9750fe"
        },
        {
          "name": "list_protocols",
          "title": "List industrial protocols",
          "description": "The industrial protocols Captia Connect ingests from, with family and summary. Call it before compare_protocols to learn the valid slugs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5036ab8abf11daddc42c2eac6a282e4f2440212208bacd50111062180386850a"
        },
        {
          "name": "search_knowledge",
          "title": "Search Captia knowledge base",
          "description": "Full-text search across published editorial resources (guides, comparisons and technical articles on industrial data, OT/IT integration, industrial AI and energy) and glossary terms. Returns canonical URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, 1-20. Defaults to 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language. Defaults to Spanish, the site primary language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "query": {
                "description": "Search terms.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63001c463d7b939f32f57463f190eb8937008d3d2e5fb8ea8cc0ac4a749aad8a"
        }
      ],
      "digest": "sha256:ec8746de6ff62a58588ed5d6b42b2205bd990b585628247a0b43fbe67268319a"
    }
  }
}
