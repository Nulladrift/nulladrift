      "serverInfo": {
        "name": "Iconic CLS",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Iconic CLS is a private chauffeur and concierge house in Los Angeles. Call list_services for what the house runs and what each service needs, then quote_trip for a real price, then book_trip to place it. Every quote is one fixed all-in total: the Operations & Chauffeur Fee is already in the number, and there is no surge. Quotes returned here are estimates at standard rates. An account with negotiated rates, credit on file, or a purchased package prices differently. Booking needs no account. book_trip holds the car for 30 minutes and returns a payment link; the person you are helping opens it and pays the full fare, and the trip confirms itself the moment the money lands. You cannot complete that payment yourself. Give them the link and say what it is for. The rider is emailed and texted directly by us once it is paid. To change or cancel, text +1 424-487-4875 — the house's automated line, answered around the clock — or call +1 310-757-5588 to reach the live concierge. Cancelling is always allowed.",
      "tools": [
        {
          "name": "book_trip",
          "title": "Book a trip",
          "description": "Place a real booking with no account. The car is held for 30 minutes and a payment link comes back; the person you are helping opens it and pays the full fare, and the trip confirms itself the moment the money lands. You cannot complete the payment yourself, so hand them the link. Quote it first so you can tell them the price. To change or cancel afterwards, text +1 424-487-4875 — the house's automated line, answered around the clock — or call +1 310-757-5588 to reach the live concierge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addon": {
                "description": "Airport add-on. meetgreet is arrivals only, departure is departures only.",
                "enum": ["greeter", "meetgreet", "departure"],
                "type": "string"
              },
              "airport_code": {
                "description": "IATA code, e.g. \"BUR\" or \"VNY\". Assumed LAX for the lax service.",
                "type": "string"
              },
              "baggage_valet": {
                "description": "Bags collected and carried through. Arrivals only.",
                "type": "boolean"
              },
              "booster_seats": {
                "description": "Number of booster seats required.",
                "type": "integer"
              },
              "car_seats": {
                "description": "Number of child car seats required.",
                "type": "integer"
              },
              "date": {
                "description": "Date of travel, YYYY-MM-DD, Los Angeles time.",
                "type": "string"
              },
              "direction": {
                "description": "Required on any airport service.",
                "enum": ["arriving", "departing"],
                "type": "string"
              },
              "dropoff": {
                "description": "Street address the trip ends at. Omit for the airport end of a departure.",
                "type": "string"
              },
              "extra_stops": {
                "description": "Count of unaddressed extra stops on an hourly booking.",
                "type": "integer"
              },
              "flight_number": {
                "description": "Flight number, so the chauffeur can track the arrival.",
                "type": "string"
              },
              "hours": {
                "description": "Length of the block. Required for hourly and shuttle.",
                "type": "number"
              },
              "notes": {
                "description": "Anything the chauffeur should know. Passed through verbatim.",
                "type": "string"
              },
              "passenger_count": {
                "description": "How many people are riding.",
                "type": "integer"
              },
              "passenger_name": {
                "description": "Full name of the person riding. Required: it is the name on the trip and what the chauffeur asks for.",
                "type": "string"
              },
              "phone": {
                "description": "Mobile number for the rider, with a country code if it is not US. Required: the chauffeur has to be able to reach them, and the confirmation is texted here.",
                "type": "string"
              },
              "pickup": {
                "description": "Street address the trip starts from. Omit for the airport end of an arrival.",
                "type": "string"
              },
              "service": {
                "description": "Which service to price. Call list_services for what each one covers.",
                "enum": ["lax", "commercial_airport", "private_aviation", "point_to_point", "hourly", "shuttle"],
                "type": "string"
              },
              "stops": {
                "description": "Waypoint addresses, in order.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "time": {
                "description": "Pickup time, HH:MM, 24-hour, Los Angeles time.",
                "type": "string"
              }
            },
            "required": ["date", "passenger_name", "phone", "service", "time"],
            "type": "object"
          },
