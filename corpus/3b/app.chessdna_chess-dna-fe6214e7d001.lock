  "subjects": {
    "app.chessdna/chess-dna": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mhmwmgesyguaphniiedp.supabase.co/functions/v1/chess-dna-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "chess-dna",
        "title": "Chess DNA",
        "version": "1.0.0",
        "websiteUrl": "https://chessdna.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Chess DNA answers chess rating questions, calculates Elo changes, and summarizes any Chess.com or Lichess player's recent games. All tools are free and need no account.",
      "tools": [
        {
          "name": "elo_change",
          "title": "Elo rating change calculator",
          "description": "Calculates how many rating points a player wins or loses for a win, draw and loss against an opponent, using the Elo formula. Also returns the expected score.",
          "inputSchema": {
            "properties": {
              "k": {
                "description": "K-factor (default 20; FIDE uses 40 for new players, 20 normally, 10 above 2400)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "opponent": {
                "description": "The opponent's rating",
                "maximum": 3500,
                "minimum": 100,
                "type": "integer"
              },
              "rating": {
                "description": "The player's rating",
                "maximum": 3500,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["opponent", "rating"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bce871aa9a617f0a77cfa3423765de4af6b532a228fe776ea57959b65b99dec1"
        },
        {
          "name": "rating_meaning",
          "title": "What does a chess rating mean?",
          "description": "Explains what a chess rating (Elo, Chess.com or Lichess) means: whether it is good, where it sits among online players, and a link to the full guide for that level. Use for questions like \"is 1200 a good chess rating?\"",
          "inputSchema": {
            "properties": {
              "rating": {
                "description": "The rating, e.g. 1200",
                "maximum": 3500,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["rating"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbb17fe845a0099fdf674b1027b48bf81c3561424bc4dd243e20cff13abd6025"
        },
        {
          "name": "recent_games",
          "title": "A player's recent games",
          "description": "Summarizes a player's recent public games on Chess.com or Lichess: wins, draws and losses, rating trend, results by colour, and most played openings. Links to a free Chess DNA analysis of the player's strengths and weaknesses.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many recent games (default 30)",
                "maximum": 100,
                "minimum": 5,
                "type": "integer"
              },
              "site": {
                "description": "Which site (default chesscom)",
                "enum": ["chesscom", "lichess"],
                "type": "string"
              },
              "username": {
                "description": "Chess.com or Lichess username",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad5645461b8af719582a8a7741d324046b2e30a9c7fd8c1238147de0f5037d70"
        }
      ],
      "digest": "sha256:3237e57be1f80f8d38c8fd5716907f5a52fb0f58db3d72fb3b78543eec130dca"
    }
  }
