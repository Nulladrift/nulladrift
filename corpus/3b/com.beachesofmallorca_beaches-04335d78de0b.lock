{
  "lockfileVersion": 2,
  "subjects": {
    "com.beachesofmallorca/beaches": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://beachesofmallorca.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "beaches-of-mallorca",
        "title": "Beaches of Mallorca",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live swimming and family conditions and reviewed guides for Mallorca beaches, from beachesofmallorca.com. Conditions scores describe weather and sea conditions on a scale of 0 to 10. Seasonal crowd estimates are provisional and do not affect scores or ranking. They are not a safety check: currents, flags, jellyfish, water quality and lifeguards are not verified. Follow local flags and lifeguards. Cite https://beachesofmallorca.com when you use the data.",
      "tools": [
        {
          "name": "best_beaches_now",
          "title": "Best beaches right now",
          "description": "The Mallorca beaches ranked by conditions score, with provisional seasonal crowd estimates shown separately. Only beaches with a valid current forecast are included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of names and labels: en, de, es or ca. Default en.",
                "enum": ["en", "de", "es", "ca"],
                "type": "string"
              },
              "limit": {
                "description": "Upper bound, default 5. Good-fit selection can return fewer beaches.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Default swimming.",
                "enum": ["swimming", "family"],
                "type": "string"
              },
              "region": {
                "description": "Part of the island. Omit for all.",
                "enum": ["north", "east", "south", "west", "palma-bay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d9ed51b6127d1533f0716cbdbf4efe6af53070f71b045d26edc6ee6c9ce7235"
        },
        {
          "name": "get_beach_guide",
          "title": "Beach guide",
          "description": "The reviewed guide for one beach in Markdown: overview, access and parking, sand and water, facilities, crowds, wind, hazards and the official sources used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beach": {
                "description": "Beach slug or name, for example \"es-trenc\" or \"Cala Tuent\".",
                "type": "string"
              },
              "language": {
                "description": "Language of names and labels: en, de, es or ca. Default en.",
                "enum": ["en", "de", "es", "ca"],
                "type": "string"
              }
            },
            "required": ["beach"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e9d094df1f41cc10d5dc8be4a352125ab6d24f81e8ab247c413bc6d6bf288ff"
        },
        {
          "name": "get_conditions",
          "title": "Current beach conditions",
          "description": "Current swimming and family scores (0 to 10) with water temperature, wave height and wind for Mallorca beaches, from the hourly forecast and official AEMET warnings. Optionally filter to one beach or one region. Each answer states when it was generated and until when it is valid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beach": {
                "description": "Beach slug or name, for example \"es-trenc\" or \"Cala Tuent\".",
                "type": "string"
              },
              "language": {
                "description": "Language of names and labels: en, de, es or ca. Default en.",
                "enum": ["en", "de", "es", "ca"],
                "type": "string"
              },
              "region": {
                "description": "Part of the island. Omit for all.",
                "enum": ["north", "east", "south", "west", "palma-bay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8229c45dbd18497b93db420e44e99717b812f66f56817cf485b2237f8c67099b"
        },
        {
          "name": "list_beaches",
          "title": "List beaches",
          "description": "All beaches covered by the site, with slug, name, municipality and region. Use a slug with get_beach_guide or get_conditions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "Part of the island. Omit for all.",
                "enum": ["north", "east", "south", "west", "palma-bay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
