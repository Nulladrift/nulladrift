{
  "lockfileVersion": 2,
  "subjects": {
    "cards.getbrief/brief": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getbrief.cards/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "brief",
        "title": "Brief",
        "version": "0.1.0",
        "websiteUrl": "https://getbrief.cards/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Brief holds the reward rules of Indian credit cards: earn rates and caps, fees and waivers, forex, lounges, transfer partners, milestones, the statuses each card grants, and every dated change a bank has made to them.\n\nEvery figure carries grade, checked_on and source_url. Grades: official (read in the bank’s own terms or product page), verified (two or more independent card sites agree), community (one forum’s consensus), unverified. source_scope \"card\" means the row has no source of its own and the card’s source stands in.\n\nEvery result carries page_url, a page on getbrief.cards that shows the same figures. Cite it when you answer.\n\nrecommend ranks the cards a person holds for one spend, with the points, the ₹ value, the working and the transfer route. Month-to-date spend counts as zero unless you pass it, and the answer says so.\n\nSlugs come from search_cards. Nothing you send is stored.",
      "tools": [
        {
          "name": "get_card",
          "title": "One card, in full",
          "description": "Everything on record for one card: fees and the waiver, earn rules with their caps, payment rail (UPI or card) and validity, exclusions, transfer partners with ratios and times, lounges, milestones, the statuses it grants, and its dated change history. Every row carries its grade, check date and source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The card’s slug from search_cards, such as hdfc-infinia-metal.",
                "maxLength": 80,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b4ff27286ab6a5739869e59a251b6a6cc2c60b07f129ed305bb6d704415f8cd7"
        },
        {
          "name": "list_changes",
          "title": "Dated bank changes",
          "description": "Changes banks have made to card rules since a date: devaluations, fee changes, lounge gates, transfer partners added or removed, improvements. Newest first, upcoming ones included and marked. Each change carries the date it takes effect, the cards it touches, grade, check date, source and its own page on getbrief.cards.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "card": {
                "description": "Only changes touching this card.",
                "maxLength": 80,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "issuer": {
                "description": "One bank.",
                "enum": ["axis", "hdfc", "icici", "sbi", "amex", "idfc", "yes", "hsbc", "indusind", "kotak", "au", "bob", "rbl", "sc"],
                "type": "string"
              },
              "limit": {
                "description": "At most this many changes. 20 if unset.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "severity": {
                "description": "One kind of change: devaluation, fee_change, lounge_gating, partner_removed, partner_added, retention_rule, enhancement. enhancement is an improvement.",
                "enum": ["devaluation", "fee_change", "lounge_gating", "partner_removed", "partner_added", "retention_rule", "enhancement"],
                "type": "string"
              },
              "since": {
                "description": "Changes taking effect on or after this date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "until": {
                "description": "And on or before this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:26b9e06a8baa00cda754605c933324f29baa9705850e73084c149fbc5938b30e"
        },
        {
          "name": "recommend",
          "title": "Which card for this spend",
          "description": "Ranks the cards a person holds for one spend: a merchant (such as \"MakeMyTrip\", \"Swiggy\", \"amazon.in\") or a category, and an amount in rupees. Each card comes with the points, their ₹ value at Brief’s estimate and at the baseline its card page prints, the working, the rule and its source, any cap that bites, the transfer route the value assumes, and a cheaper channel (a bank’s travel portal) with the portal rule’s own condition, beside every portal rule weighed for that card (channels). When the order changes at baseline values, the answer says so. Month-to-date spend counts as zero unless wallet.month_to_date carries it, so a monthly cap reads as untouched; the answer says which. Nothing in the wallet is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount_inr": {
                "description": "The amount in rupees.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "category": {
                "description": "The spend category when there is no merchant, or to say how a multi-category merchant codes.",
                "enum": ["dining", "grocery", "fuel", "travel_air", "travel_hotel", "travel_ota", "travel_rail", "transport", "online_shopping", "department_store", "electronics", "apparel", "health", "utilities", "insurance", "rent", "education", "government", "entertainment", "streaming", "telecom", "beauty", "jewelry", "travel_car"],
                "type": "string"
              },
              "international": {
                "description": "Spent abroad or in a foreign currency. Forex markup and GST come off the value.",
                "type": "boolean"
              },
              "merchant": {
                "description": "Where the money goes: a merchant name or domain. A UPI handle also works.",
                "maxLength": 120,
                "type": "string"
              },
              "upi": {
                "description": "Paid by UPI. Only RuPay credit cards link to UPI, and some earn differently there.",
                "type": "boolean"
              },
              "wallet": {
                "description": "The cards held. Passed in each call; nothing is kept.",
                "properties": {
                  "cards": {
                    "description": "Slugs of the cards held, up to 12.",
                    "items": {
                      "maxLength": 80,
                      "minLength": 2,
                      "pattern": "^[a-z0-9-]+$",
                      "type": "string"
                    },
                    "maxItems": 12,
                    "minItems": 1,
                    "type": "array"
                  },
                  "month_to_date": {
                    "additionalProperties": {
                      "properties": {
                        "points": {
                          "description": "Points, or ₹ of cashback, already earned on this card this month, counted against monthly caps.",
                          "minimum": 0,
                          "type": "number"
                        },
                        "spend_inr": {
                          "description": "Rupees already spent on this card this month, for caps and minimums counted in spend.",
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "description": "Spend and points already on each card this month, keyed by slug. Cards left out count as zero.",
                    "propertyNames": {
                      "maxLength": 80,
                      "minLength": 2,
                      "pattern": "^[a-z0-9-]+$",
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "required": ["cards"],
                "type": "object"
              }
            },
            "required": ["amount_inr", "wallet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3862e147702ba279b67b142d1902a7e0081a43000c3298cafd3cd2cd95b85437"
        },
        {
          "name": "search_cards",
          "title": "Search Indian credit cards",
          "description": "Finds Indian credit cards by name, issuer, network, fee band and three filters: forex markup of 1% or under, lounge access, transfer partners. Each card comes with its slug, annual fee, base earn, one line of facts, grade, check date, source and its page on getbrief.cards. Cards no longer issued are left out unless include_discontinued is true. Use a slug from here in every other call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fee_band": {
                "description": "Annual fee band: free (Lifetime free), low (Up to ₹1,000), mid (Up to ₹5,000), high (Up to ₹15,000), top (Above ₹15,000).",
                "enum": ["free", "low", "mid", "high", "top"],
                "type": "string"
              },
              "forex_1pct_or_under": {
                "description": "Only cards whose forex markup is 1% or under.",
                "type": "boolean"
              },
              "include_discontinued": {
                "description": "Include cards no longer issued. Their rules stay on record as dated history.",
                "type": "boolean"
              },
              "issuer": {
                "description": "Issuer slug, such as axis, hdfc, icici, sbi, amex. A wrong slug answers with the full list.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "At most this many cards. 10 if unset.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lounge": {
                "description": "Only cards with lounge access on record.",
                "type": "boolean"
              },
              "network": {
                "description": "Card network: visa, mastercard, rupay, amex, diners.",
                "enum": ["visa", "mastercard", "rupay", "amex", "diners"],
                "type": "string"
              },
              "query": {
                "description": "Words from the card’s name, issuer or points currency, such as \"atlas\", \"infinia\", \"amex platinum\".",
                "maxLength": 80,
                "type": "string"
              },
              "transfers": {
                "description": "Only cards whose points transfer to an airline or hotel programme.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6c13b6f2a4851c44d6afcaf2d608e165883c876a5f3bbfc285636b3224496c4c"
        },
        {
          "name": "transfer_partners",
          "title": "Transfer partners and ratios",
          "description": "Where points can move, by programme or by card. A programme (\"Marriott Bonvoy\", \"KrisFlyer\", \"Axis EDGE Miles\", \"HDFC Reward Points\") returns the routes out of it and into it; a card slug returns the routes its points take. Each route carries the ratio as from:to, the transfer time, the minimum, any annual limit or card restriction, grade, check date, source and the transfer page on getbrief.cards.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "card": {
                "description": "A card slug. Its own transfer list, as its page shows it.",
                "maxLength": 80,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "include_closed": {
                "description": "Include routes a bank has closed, marked is_active false.",
                "type": "boolean"
              },
              "programme": {
                "description": "A points currency or loyalty programme by name or slug.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Transfer partners"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aad31469272fd8824314510dad10de25c7dde129ecb6e4473df328d02ee36b72"
        }
      ],
      "digest": "sha256:cb1eb133fa22c34f9e34679f3ab4a8fb358f2d82c4270e263baa89f626a8c29b"
    }
  }
}
