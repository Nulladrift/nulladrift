{
  "lockfileVersion": 2,
  "subjects": {
    "ai.com.nlp/open-model-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nlp.com.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "nlp-com-ai-open-model-catalog",
        "title": "NLP.COM.AI Open Model Catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search the curated NLP.COM.AI catalogue of downloadable open-weight text-to-text model and model-family releases. Results link to canonical catalogue pages and primary release sources.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get a complete open-weight model record",
          "description": "Return the complete curated record for one model or model-family release, addressed by the slug returned from search_models or recent_models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Exact canonical model slug.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "additionalProperties": false,
                "properties": {
                  "context_window": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "developer": {
                    "type": "string"
                  },
                  "key_features": {
                    "type": "string"
                  },
                  "license": {
                    "type": "string"
                  },
                  "links": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "page_url": {
                    "type": "string"
                  },
                  "paper_url": {
                    "type": "string"
                  },
                  "parameters": {
                    "type": "string"
                  },
                  "record_updated_at": {
                    "type": "string"
                  },
                  "release_date": {
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "type": "string"
                  },
                  "source_file": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["context_window", "date", "developer", "key_features", "license", "links", "name", "page_url", "paper_url", "parameters", "record_updated_at", "release_date", "slug", "source_file"],
                "type": "object"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:825f35a1ab4a4f96d6c1352233146f62d0cbe123909320abbcf4d2ddf1c429c4"
        },
        {
          "name": "recent_models",
          "title": "List recent open-weight model releases",
          "description": "Return the newest curated open-weight model release records, optionally limited to releases on or after an ISO 8601 date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Optional inclusive release date in YYYY-MM-DD form.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "context_window": {
                      "type": "string"
                    },
                    "developer": {
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "parameters": {
                      "type": "string"
                    },
                    "release_date": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["context_window", "developer", "license", "name", "page_url", "parameters", "release_date", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49d9a1bdadd11c0257fb89ba4879ddc2e8924ebb736c048fe5bdbf6742962f7d"
        },
        {
          "name": "search_models",
          "title": "Search open-weight model releases",
          "description": "Search curated open-weight model release records by model name, developer, license, parameter or context description, and technical features. Returns canonical NLP.COM.AI pages and primary sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that every matching record must contain.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "context_window": {
                      "type": "string"
                    },
                    "developer": {
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "parameters": {
                      "type": "string"
                    },
                    "release_date": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["context_window", "developer", "license", "name", "page_url", "parameters", "release_date", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbf1eb9a1de361674836d2f1110b416acb6f2088201114131747a7ff902c0b99"
        }
      ],
      "digest": "sha256:2856e2144b3f9a5ddfad56e91e5dc8c3e8b102d4b9dc6d2ab341c4537cb52217"
    }
  }
}
