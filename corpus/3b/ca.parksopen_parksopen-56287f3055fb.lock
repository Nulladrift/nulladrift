        {
          "name": "parksopen_park_availability_calendar",
          "title": "Park availability calendar (8 weeks)",
          "description": "Use this when the user asks 'when is X free', 'how busy is X', or 'which weekend should I try' for ONE named park. It returns nightly open counts for the next 8 weeks, whole-stay counts for four weekends, fill rate, and booking rules. For exact equipment fit or specific dates across many parks use parksopen_search_campsites.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "maximum": 92,
                "minimum": 7,
                "type": "integer"
