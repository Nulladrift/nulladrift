                      "park": {
                        "type": "string"
                      },
                      "source": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      },
                      "until": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["park", "source", "title", "until"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "equipment_class": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "nights": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "observed_at": {
                "type": ["string", "null"]
              },
              "resolved_park": {
                "type": ["string", "null"]
