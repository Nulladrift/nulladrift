        {
          "name": "parksopen_find_open_parks",
          "title": "Find parks with openings (ranked)",
          "description": "Use this when the user has not named a park and wants PARKS ranked by soonest opening or estimated drive time, such as 'where can I camp this weekend' or 'anything near Vancouver with space'. It uses the default tent-compatible inventory and can filter confirmed amenities. Do not use it when van, trailer, RV, or other equipment fit matters; use parksopen_search_campsites with equipment_class. For a named park use parksopen_search_campsites or parksopen_park_availability_calendar.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amenities": {
                "description": "ANDed site attributes (confirmed-only; the count is a floor)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "horizon_days": {
                "description": "how far ahead to look when no date is fixed; default 14",
                "maximum": 35,
                "minimum": 2,
                "type": "integer"
              },
              "limit": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "near_city": {
                "description": "rank by drive time from this city (Vancouver, Victoria, Nanaimo, Whistler, Kelowna, Kamloops, Cranbrook, Prince George, Fort St. John)",
                "type": "string"
              },
              "nights": {
                "description": "default 2 (weekend) or 1",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "province": {
                "description": "province code or URL prefix (bc, on, …) — an alternative to system.",
                "type": "string"
              },
              "region": {
                "description": "restrict to a region name as the site shows it, e.g. 'Vancouver Island'",
                "type": "string"
              },
              "start_date": {
                "description": "a specific arrival date; omit to find the soonest opening",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "system": {
                "description": "reservation system id, e.g. bc_parks. Omit for the default system.",
                "type": "string"
              },
              "weekend": {
                "description": "this coming weekend (Fri→Sun, 2 nights)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "amenities_applied": {
