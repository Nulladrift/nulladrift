        {
          "name": "parksopen_search_campsites",
          "title": "Search campsites by live availability",
          "description": "Use this when exact dates or equipment fit matter, for questions like 'is X available', 'find a site for the long weekend', or 'which parks have space for a 32 ft RV'. It reads observed campsite availability for BC Parks. Ontario collection is paused; Ontario live inventory and camping alerts are unavailable. Filters the official sites cannot: exact equipment fit, electrical, waterfront, shade, pets, privacy — across every park at once. Returns only sites observed open for EVERY requested night, with an absolute Parks Open page URL to cite, a booking link into the official reservation flow (we never book for the user), and observed_at for freshness; verify availability on the official site. Not for: fees, rules, facilities (use parksopen_park_info), weather (parksopen_check_weather), closures (parksopen_check_alerts), or dates beyond the provider's booking window.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amenities": {
                "description": "ANDed site attributes: electrical, waterfront, pets, some_shade, full_shade, double, near_restroom, walk_in, accessible, pull_through, private, big_rig",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "description": "booking category; default frontcountry (drive-in campsites)",
                "enum": ["frontcountry", "backcountry", "group", "cabin"],
                "type": "string"
              },
              "cursor": {
                "description": "opaque cursor from a previous page",
                "type": "string"
              },
              "end_date": {
                "description": "departure, YYYY-MM-DD (exclusive; nights = end − start)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "equipment_class": {
                "description": "canonical class (tent, tent2, tent3, van, trailer_18, rv_32, rv_32_plus) or free text like '30ft trailer'. Default tent.",
                "type": "string"
              },
              "limit": {
                "description": "page size, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_privacy": {
                "description": "'Good' or 'Excellent'",
                "type": "string"
              },
              "park": {
                "description": "park name — approximate is fine (partial, missing 'Provincial', misspelled). Omit to search every park. If it cannot be resolved you get a did-you-mean list.",
                "type": "string"
              },
              "province": {
                "description": "province code or URL prefix (bc, on, …) — an alternative to system.",
                "type": "string"
              },
              "start_date": {
                "description": "arrival, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "system": {
                "description": "reservation system id, e.g. bc_parks. Omit for every tracked system.",
                "type": "string"
              }
            },
            "required": ["end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
