                        },
                        "ferry": {
                          "type": "boolean"
                        },
                        "page": {
                          "type": "string"
                        },
                        "park": {
                          "type": "string"
                        },
                        "region": {
                          "type": ["string", "null"]
                        },
                        "sites_open": {
                          "type": "number"
                        }
                      },
                      "required": ["drive_min", "earliest_date", "earliest_offset_days", "ferry", "page", "park", "region", "sites_open"],
