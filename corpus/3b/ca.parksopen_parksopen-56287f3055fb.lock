            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["frontcountry", "backcountry", "group", "cabin"],
                "type": "string"
              },
              "end_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "equipment_class": {
                "description": "canonical class or free text; default tent",
                "type": "string"
              },
              "park": {
                "description": "park name — approximate is fine",
                "type": "string"
              },
              "province": {
                "description": "province code or prefix, e.g. bc",
                "type": "string"
              },
              "start_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "system": {
                "description": "reservation system id, e.g. bc_parks",
                "type": "string"
              }
            },
            "required": ["end_date", "park", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
