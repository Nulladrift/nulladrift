        {
          "name": "parksopen_get_booking_link",
          "title": "Booking link for a park and dates",
          "description": "Use this when a search is complete, or when the user already knows the park and dates, to create a deterministic official reservation link with park, dates, and equipment pre-filled. The user completes the booking there; Parks Open never books, holds sites, takes payment, or treats the link itself as proof of availability.",
