        {
          "name": "parksopen_check_day_passes",
          "title": "Check BC Parks day-pass availability",
          "description": "Use this when the user asks whether a BC Parks day-use pass is required, available, sold out, not released yet, or closed for a date, park, access area, or AM/PM slot. It returns the access areas currently covered by live checks across a three-day booking window, with explicit No pass needed versus Sold out states, freshness, coverage limits, the Parks Open comparison page, and the official BC Parks booking handoff. If live inventory is stale, incomplete, or conflicts with published rules, it fails closed and will not claim Available or Sold out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "visit date, YYYY-MM-DD. Omit for today in British Columbia.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "number of consecutive dates to compare, 1 to 3; default is the full 3-day booking window",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "parks": {
                "description": "optional park names, e.g. ['Golden Ears', 'Garibaldi']; omit to return every tracked day-pass park",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "booking_url": {
                "type": "string"
              },
              "coverage_through": {
                "type": ["string", "null"]
              },
              "freshness": {
                "enum": ["ok", "no-database", "no-data", "incomplete", "conflict", "stale", "unknown", "error"],
                "type": "string"
              },
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "live": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "observed_at": {
                "type": ["string", "null"]
              },
              "page": {
                "type": "string"
              },
              "parks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "access_areas": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "area": {
                            "type": "string"
                          },
                          "dates": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "checked_at": {
                                  "type": ["string", "null"]
                                },
                                "date": {
                                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                                  "type": "string"
                                },
                                "label": {
                                  "type": "string"
                                },
                                "quantity": {
                                  "type": ["number", "null"]
                                },
                                "release_at": {
                                  "type": ["string", "null"]
                                },
                                "source": {
                                  "enum": ["live_inventory", "published_rules", "unavailable"],
                                  "type": "string"
                                },
                                "status": {
                                  "enum": ["available", "sold_out", "not_released", "no_pass_needed", "closed", "expired", "live_inventory_unavailable"],
                                  "type": "string"
                                }
                              },
                              "required": ["checked_at", "date", "label", "quantity", "release_at", "source", "status"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "pass_type": {
                            "type": "string"
                          },
                          "slot": {
                            "type": "string"
                          }
                        },
                        "required": ["area", "dates", "pass_type", "slot"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "park": {
                      "type": "string"
                    },
                    "park_slug": {
                      "type": "string"
                    }
                  },
                  "required": ["access_areas", "park", "park_slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["booking_url", "coverage_through", "freshness", "from", "live", "note", "observed_at", "page", "parks", "suggestions", "to"],
            "type": "object"
          },
