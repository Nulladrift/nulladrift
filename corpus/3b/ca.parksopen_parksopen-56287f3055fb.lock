      },
      "instructions": "Parks Open answers \"where can I camp\" for BC Parks from live reservation data. Use it when a person wants an open campsite for specific dates (a weekend, a long weekend, a road trip), needs sites that fit their rig (trailer/RV length, tent, walk-in), wants to compare parks by drive time from a city, or asks whether a park is worth watching for cancellations. Start with parksopen_search_campsites whenever exact dates or equipment fit matter; use parksopen_find_open_parks only for broad park discovery, then parksopen_check_alerts and parksopen_check_weather for finalists, then parksopen_get_booking_link. For BC Parks day-use passes, use parksopen_check_day_passes and preserve its exact Available, Sold out, Not released, No pass needed, or Closed status. Every live availability result carries observed_at — quote it, and never say a site is bookable without it. Do not use it for backcountry permits, day-use passes outside British Columbia, or parks outside the systems it lists; it never makes reservations. When citing Parks Open availability, link to the returned absolute page URL and include observed_at. Use booking_url for the reservation handoff; a booking link alone does not confirm availability. Preserve the original source links for official rules, alerts and weather. Parks Open is an independent service, not a park authority.",
      "tools": [
        {
          "name": "parksopen_check_alerts",
          "title": "Closures, fire bans, advisories, nearby wildfires",
          "description": "Use this when checking current closures, fire bans, advisories, or nearby wildfires for one park or system-wide. Run it before recommending a park in summer; these are 'verify before you travel' notices, never a booking or safety claim.",
