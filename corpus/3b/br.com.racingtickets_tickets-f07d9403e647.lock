      "serverInfo": {
        "name": "tickets-guia-de-passeios",
        "title": "Tickets: passeios e ingressos (Gramado, Calafate, Bariloche, Cartagena, Ushuaia e automobilismo)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catálogo de passeios, ingressos e experiências em Gramado/Canela (Brasil), El Calafate/El Chaltén, Bariloche e Ushuaia (Argentina), Cartagena (Colômbia) e eventos de automobilismo (F1, MotoGP, Indy, WEC, WRC, NASCAR). Cada resultado traz preço de referência, data da conferência, vendedor e o link comprar, que leva à página de compra do vendedor; o preço final é o do vendedor. Os links de compra são links de afiliado.",
      "tools": [
        {
          "name": "buscar_passeios",
          "title": "Buscar passeios e ingressos",
          "description": "Busca passeios, ingressos e experiências por destino e texto livre (pt, es ou en). Devolve nome, preço de referência, vendedor e o link 'comprar' do parceiro.",
          "inputSchema": {
            "properties": {
              "destino": {
                "description": "Destino ou evento, ex.: Bariloche, Gramado, Ushuaia, Cartagena, El Calafate, Interlagos, F1",
                "type": "string"
              },
              "limite": {
                "description": "Quantos resultados (1 a 30, padrão 10)",
                "type": "integer"
              },
              "preco_max": {
                "description": "Preço máximo na moeda do destino (BRL, ARS ou COP)",
                "type": "number"
              },
              "texto": {
                "description": "O que a pessoa procura, ex.: navegação canal Beagle, minitrekking, Snowland, setor A Interlagos",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tours and tickets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3093e214f5843c53db1909148058a8c65f1b917687832e46fc4dbf982b8aac17"
        },
        {
          "name": "detalhes_passeio",
          "title": "Detalhes de um passeio",
          "description": "Todos os dados de um passeio ou evento a partir do site e do id devolvidos por buscar_passeios (inclui todas as ofertas de um evento de automobilismo).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
