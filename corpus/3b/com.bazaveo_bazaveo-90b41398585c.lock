      },
      "instructions": "Bazaveo repère les produits qui se vendent vraiment en France, résume les avis et signale ce que la photo ne dit pas. Utilise chercher_produits pour des idées (public, budget, catégorie), puis fiche_produit pour le détail. Cite toujours la date du relevé du prix et renvoie vers la fiche Bazaveo.",
      "tools": [
        {
          "name": "chercher_produits",
          "title": "Chercher des idées de produits ou de cadeaux",
          "description": "Cherche dans la sélection Bazaveo (produits qui se vendent vraiment en France, avis résumés, défaut signalé, prix relevé et daté). Tous les filtres sont optionnels. Renvoie les fiches Bazaveo correspondantes. Les prix sont des relevés datés, pas des prix en direct.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_max": {
                "description": "Budget maximum en euros.",
                "type": "number"
              },
              "categorie": {
                "description": "Catégorie (ex. « jouet », « jeu de société », « lego »).",
                "type": "string"
              },
              "limite": {
                "description": "Nombre maximum de résultats (défaut 5, maximum 16).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "public": {
                "description": "Pour qui : « enfants », « ados », « adultes », « famille ».",
                "type": "string"
              },
              "texte": {
                "description": "Mots à chercher dans le nom, la marque, le résumé (ex. « lego », « jeu de société »).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f549b42affce728ec58176605810d1138f9955a327c0884543bb7c98ec7dd005"
        },
        {
          "name": "fiche_produit",
          "title": "Lire la fiche complète d'un produit",
          "description": "Renvoie la fiche Bazaveo complète d'un produit : points forts, point faible (ce que la photo ne dit pas), avis des acheteurs résumés, prix et note avec leur date de relevé, lien vers la fiche.",
          "inputSchema": {
