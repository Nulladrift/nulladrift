    "com.princeofpost/label-maker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://princeofpost.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "princeofpost",
        "title": "Prince of Post",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prince of Post turns a Royal Mail QR code (the kind shown at a Post Office counter) into a printable 6x4 label. Use create_royal_mail_label. When the user has a screenshot, photo or PDF of the QR code, call it with no arguments: a panel lets them pick the file, which is read on their device. Never transcribe a QR code from an image. Pass qr_text only when you have the exact text a QR decoder returned.",
      "tools": [
        {
          "name": "create_royal_mail_label",
          "title": "Print a Royal Mail QR code as a label",
          "description": "Turns a Royal Mail QR code (the kind you show at a Post Office: Vinted digital labels, eBay Royal Mail QR codes, ASOS returns and other Royal Mail \"Labels to Go\" QR codes) into a 6x4 shipping label the user can print at home instead of queuing. If the user has an image or PDF of the QR code, call this with no arguments: a panel lets them pick the file, which is read on their device. Only pass qr_text if you already have the exact decoded text from a QR decoder. Never transcribe a QR code from an image.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "qr_text": {
                "description": "The exact text a QR decoder returned for the QR code, unchanged, including every space. It is fields like QRCode=..., 1DBarcode=... and SendersDetails=... separated by |. Omit this if you only have an image of the QR code.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "postBy": {
                "description": "The date to post the parcel by, dd/mm/yyyy.",
                "type": "string"
              },
              "postcode": {
                "description": "Last line of the delivery address, normally the postcode.",
                "type": "string"
              },
              "printUrl": {
                "description": "Opens the label on Prince of Post, ready to print at its true 6x4 size.",
                "type": "string"
              },
              "recipient": {
                "description": "First line of the delivery address.",
                "type": "string"
              },
              "siteUrl": {
                "description": "Prince of Post, where the user can drop their QR code if the panel does not appear.",
                "type": "string"
              },
              "status": {
                "description": "ready: the label was made from qr_text. needs_file: the user still has to pick their QR code in the panel.",
                "enum": ["ready", "needs_file"],
                "type": "string"
              },
              "trackingNumber": {
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://princeofpost/label-maker.html"
            },
            "ui/resourceUri": "ui://princeofpost/label-maker.html"
          },
          "digest": "sha256:538544cad7bf11a11ac8fc07120c4c70cb3f705e1d4286aae0b278610df5cc66"
        }
      ],
      "resources": [
