        {
          "name": "get_guide",
          "title": "What this server covers",
          "description": "What does this server cover, and how much of it? The tools; the venues by registry scope, venue type, status and credit class; the credit-state reading's coverage; the indicators served, retired and not published here; the series; and the lenses — every count read from the data when asked, each with a sentence saying what it counts. Also the two venue vocabularies (venue type and credit class), how absences are returned, and where the methodology is.\n\nCall this first when you need to say how much the Stack covers. It ranks nothing and describes no venue's quality.\n\nIt also routes the Stack's standard questions: with no argument it lists them (id, question, tool); with question (an id such as 'SQ-M1', or a few words) it returns the matching question whole: the call that answers it, what the answer means, the page that shows the same figure, and its limits. The match is a lookup in the published list, never a guess; words that match none return the list.\n\nStandard questions this tool answers (get_guide with question): SQ-S1, SQ-S5.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "A standard question's id (e.g. 'SQ-M1') or a few words from it",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:234e05b58878158a81f303c4fb59047eda3ede7e9ef51cbb8fd70d837bd1107e"
