        },
        {
          "name": "get_events",
          "title": "Credit-market events (dated facts)",
          "description": "Returns the credit-market events the Stack has recorded, newest first: a venue's debt, collateral or borrow rate moving past its rule from one daily reading to the next, a figure crossing a fixed level (each power of ten, and twice and five times it), a company filing a purchase, sale or total of the coin it holds, an indicator (bsbs, bcsi, the collateral share, the weekly matched change, a wrapper's reserve coverage) crossing a fixed level or moving past its threshold, and a venue first read or wound down. Each event: one sentence, the figures and their dates, the rule it met in words, and its source (the daily readings and their dates, or the filing with its link and the sentence that holds the figure). A change caused by coverage or method (a reader or pool change, a restatement, a price-only move) is not an event and is not returned. Bitcoin by default; collateral: 'eth' returns the ether events, never added to bitcoin's. Gavel's own book is included with its own-account disclosure. Descriptive: no cause, forecast or ranking. Paged: 20 events by default (limit up to 500); pass the returned `next` as cursor.\n\nStandard questions this tool answers (get_guide with question): SQ-M8.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collateral": {
                "description": "Events of credit secured by bitcoin (default) or by ether; never added together",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "cursor": {
                "description": "The `next` value of a previous page",
                "type": "string"
              },
              "limit": {
                "description": "Events per page (default 20)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Events dated on or after this day",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "subject": {
                "description": "A venue id (e.g. 'aave_v3_ethereum'), a tree node id or a corporate issuer id (e.g. 'strive')",
                "type": "string"
