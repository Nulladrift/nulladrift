        },
        {
          "name": "list_indicators",
          "title": "Indicator Catalogue",
          "description": "Returns the catalogue of Aletheia indicators measured across the Bitcoin-collateralised credit markets and the Bitcoin chain: id, name, family, units, description, and whether the indicator is currently live on this network.\n\nThree families: 'credit' (credit-market assessments), 'onchain' (commodity chain metrics such as MVRV and SOPR), and 'market' (external context — DeFi rates, stablecoin supply, macro).\n\nUse this to discover what is available, then call get_indicator with an id. This tool returns a catalogue; it does not rank indicators or advise which to use.\n\nIndicators anchored on a single venue's own rate are not served here; they are listed as withheld, with the server that serves them.\n\nStandard questions this tool answers (get_guide with question): SQ-I1.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
