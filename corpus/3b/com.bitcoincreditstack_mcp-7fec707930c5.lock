        {
          "name": "get_liquidation_map",
          "title": "Where bitcoin-secured debt is liquidated",
          "description": "How much bitcoin-secured dollar debt is liquidated at which bitcoin price, for the market, a class or a venue? An identity on observed positions: each bitcoin-only position at the price its OWN venue's rule liquidates it, summed into $1,000 buckets, with the debt within 10/20/30% of each venue's own mark, the debt already past its venue's test, and overflow.\n\nIt does not forecast what a fall in the price would do, it does not rank venues (they are listed by name) and it gives no verdict such as \"at risk\".\n\n⚠ Read coverage and not_bucketed first. Only venues read position by position are in the map (the pooled venues, Morpho on Ethereum and Base, Sky); every other venue with debt is named with its reason and is never scaled up. With history=true the bands come as a daily series: Sky from 2020-05-03, the rest from 2026-10-08 — a step there is coverage, not the market.\n\nStandard questions this tool answers (get_guide with question): SQ-M3.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_known_on": {
                "description": "With history: the bands as published at the end of that day (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date": {
                "description": "A day held; default the latest.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "With history: the first day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "history": {
                "description": "Return the bands through time instead of one day's buckets.",
                "type": "boolean"
              },
              "id": {
                "description": "A class id (algorithmic, minted, ...) or a venue id; required below the market.",
                "type": "string"
