        {
          "name": "get_indicator",
          "title": "Get an Indicator",
          "description": "Returns the current value of a single Aletheia indicator by id, with its methodology reference. This server serves the venue-independent indicator set; an indicator anchored on a single venue's own rate is served by that venue's own MCP and answers here with a pointer to it. Call list_indicators first to discover valid ids.\n\nOptionally returns the historical series instead of the current value (set include_history). History is free and unmetered on the same terms as the current value.\n\nThis is descriptive data; no recommendation is provided. An indicator that has no reading on this network says so explicitly rather than returning a null or a zero that could be mistaken for a value.\n\nWith as_known_on, an indicator kept by vintage (list_indicators marks it as_known_on: true) is returned as it was published at the end of that day (UTC), so a figure quoted then can be reproduced. An indicator recomputed when asked has no past vintage and refuses as_known_on.\n\nStandard questions this tool answers (get_guide with question): SQ-M6, SQ-M7, SQ-C4, SQ-I2, SQ-I3, SQ-I4, SQ-I5, SQ-I6, SQ-I7, SQ-Ch3, SQ-Ch5, SQ-Co2.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_known_on": {
                "description": "YYYY-MM-DD: the indicator as published at the end of that day (UTC). Only for indicators kept by vintage.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "History start, ISO 8601 date. Only meaningful with include_history.",
                "type": "string"
              },
              "id": {
                "description": "Indicator id from list_indicators, e.g. 'intermediation-spread', 'capital-stack', 'benchmark-curves'.",
                "type": "string"
              },
              "include_history": {
                "default": false,
                "description": "If true, return the historical series instead of the current value. Not every indicator has one.",
                "type": "boolean"
              },
              "series": {
                "description": "With include_history, one series of a measure (its `series[]` names them), e.g. 'cx.class.algorithmic.borrow_spread_over_ust_3m'. Default: the headline series",
                "type": "string"
              },
              "to": {
                "description": "History end, ISO 8601 date. Only meaningful with include_history.",
                "type": "string"
              },
              "wrapper": {
                "description": "With include_history on wrc, one wrapper's coverage history",
                "enum": ["wbtc", "tbtc", "kbtc", "cdcbtc"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
