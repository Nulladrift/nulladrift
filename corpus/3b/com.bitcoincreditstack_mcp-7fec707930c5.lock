        {
          "name": "get_market_composition",
          "title": "What this credit market is made of",
          "description": "What kinds of credit make up this market, and in what proportions? ⚠ These series are computed from MORPHO BLUE ONLY, on Ethereum and Base. They are not market-wide.\n\nComposition by rate type, recourse and instrument, reported as observed shares with the scope that produced them. There is no ranking of venues or instrument types and no judgement about which composition is preferable.\n\n⚠ The scope block names the contributing venues and states why the others are absent. Read it before quoting any share. A percentage from this tool describes one venue family, not Bitcoin-collateralised credit.\n\nBitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin. No ether composition series is served yet; with collateral: 'eth' this says so and points to the ether figures.",
