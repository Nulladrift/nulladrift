        {
          "name": "get_mvrv",
          "title": "Bitcoin MVRV Ratio",
          "description": "Returns the current Bitcoin MVRV ratio: market capitalisation divided by realised capitalisation, where realised cap values each coin at the price it last moved.\n\nMVRV is therefore an identity on observed chain data. It states the aggregate unrealised position of the supply — how far the market values coins above or below what was last paid for them — and nothing about what follows from that. This tool returns data; it does not advise, forecast, or characterise the market.\n\nComputed nightly from Aletheia's own full node and UTXO set. Since 2026-10-05 the current price and the creation prices from 2020-07-13 are Aletheia's own on-chain BTC fixing; coins created before 2020-07-13 are valued at the legacy daily price, from CoinGecko, CryptoCompare and Binance backfills: the supply and each coin's age are Aletheia's, those prices are not, so the ratio is free, attributed use only (its licence block says so). 'mvrv_z_score' is returned alongside it: the same numerator measured in standard deviations of the historical market-cap series.\n\nReturns: { value, mvrv_z_score, as_of, inputs: { market_cap_usd, realised_cap_usd, realised_price_usd, spot_price_usd }, methodology, attribution, licence, disclaimer }. 'attribution' carries the source credit for third-party figures; show it with them.\n\nStandard questions this tool answers (get_guide with question): SQ-Ch2.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "timestamp": {
                "description": "ISO 8601 date. Currently ignored: the upstream serves the latest computed row only. Historical MVRV, from 2009: get_chain_series with id 'chain.cohort.mvrv'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cdf3bb5c646ce76b16c20e82f8ec031f119ca93604411690ec4c9762a4ccf524"
        },
        {
          "name": "get_series",
          "title": "Series through time, with a chart plan",
          "description": "Returns 1 to 13 series (ids from list_series), each on its own dates, from Aletheia's vintage store: every value with its date and kind (an absence is a kind with its reason, never a zero), the unit, source, limitation and the vintages the values came from. Default window: the last 365 days to `to`; pass `from` for the full history. With as_known_on, each series is returned as the store held it at the end of that day (UTC), so a figure quoted then can be reproduced.\n\nWith the data comes a chart plan, as the site's explorer draws: panels by unit, two at most, a series joining the panel of its exact unit; a third unit is refused in the explorer's words; ether and bitcoin collateral are never drawn on one panel; each refusal names its reason. The plan carries the /explore link that draws the same chart on the site, and a text alternative per panel. plan: 'only' returns the plan without the values; plan: false the values without the plan.\n\nValues resting on the legacy daily price before 2020-07-13 (CoinGecko, CryptoCompare and Binance backfills) carry coingecko_share or price_today, and the answer's attribution names every source to credit: show them with the values. This tool returns data; it does not advise, forecast or characterise the market.\n\nStandard questions this tool answers (get_guide with question): SQ-M1, SQ-M2, SQ-M4, SQ-C1, SQ-C3, SQ-V4, SQ-S3.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_known_on": {
                "description": "YYYY-MM-DD: every series as the store held it at the end of that day (UTC)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "First date, YYYY-MM-DD (default: 365 days before `to`)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ids": {
                "description": "Series ids from list_series, e.g. ['cx.index.bsbs', 'cx.market.secured.borrow_spread_over_ust_3m']",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 13,
                "minItems": 1,
                "type": "array"
              },
              "plan": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "const": "only",
                    "type": "string"
                  }
                ],
                "description": "true (default): values and the chart plan; false: values only; 'only': the plan only"
              },
              "to": {
                "description": "Last date, YYYY-MM-DD (default: today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:321e5cf3e4aa1848d0c06991affb0d6d9fdf33a2349c95f911238fe3440ab02b"
        },
        {
          "name": "get_venue",
          "title": "One venue against the published criteria",
          "description": "What is known about this venue, criterion by criterion? The three pillars — Price, Quality, Composition — each cell with its value and the source it came from.\n\nThe criteria are published and versioned before any venue is measured against them, applied evenly to every row, and the spec version rides in this payload. There is no composite score, no stars and no reliability index: a reader weighs the criteria, and this server does not weigh them for the reader.\n\n⚠ 'unknown' is a value, not an omission — a criterion that cannot be established from public sources says so with its reason. A class-specific 'not_applicable' and an unresearched 'unknown' are different answers and are never conflated.\n\nBitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin. With collateral: 'eth' the criteria come with the venue's ether figures (the six tiles and books); a venue that does not take ether says so.\n\nStandard questions this tool answers (get_guide with question): SQ-V2, SQ-V3.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collateral": {
                "description": "Bitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin.",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "include": {
                "description": "Extras the venue page shows: 'axes' (where the venue sits on the market's measured axes) and 'headline' (its six figures as the headline reads them, with the books)",
                "items": {
                  "enum": ["axes", "headline"],
                  "type": "string"
                },
                "type": "array"
              },
              "venue_id": {
                "description": "Registry id, e.g. 'aave_v3_arbitrum'. Call list_venues to discover valid ids.",
                "type": "string"
              }
            },
            "required": ["venue_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:be56bf9a2b7ba468babc50c2b45c949cc603e692d5717218e98d5d2f39c45182"
        },
        {
          "name": "get_verification_bundle",
          "title": "Verification bundle",
          "description": "Covers one venue's contracts only: the registry's auction venue (venue_id 'gavel_arbitrum'), the one venue whose deployed contracts this dataset checks itself. It is served here as a source for that venue's quality criteria; no other venue has a bundle yet.\n\nWhat can be checked about the contracts, and what did the last check return? Observations with their block heights; the verdict is the reader's.\n\nContract addresses and their implementations, the bytecode hash of each, the upgradeability position, the privileged-function map with whether each can touch user funds, the audit reference, and five structural promises — each with the check that would falsify it and what that check returned.\n\n⚠ Read the fields, not the impression. 'match' is \"unchecked\" where Aletheia has not compared deployed bytecode against verified source; a promise that did not settle says so; and mainnet and testnet return different answers because they run different builds. There is no safety score, rating or verified badge in this payload, and none will be added.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "network": {
                "description": "Network. Default 'arbitrum-one' (mainnet). Use 'arbitrum-sepolia' for the testnet deployment, which carries a far deeper book — but note the two run different contract builds, so a testnet observation is not a mainnet fact.",
                "enum": ["arbitrum-one", "arbitrum-sepolia"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08b7fa24b0d1f8794a8ee338e4e76d698b0e024bc6826a82051fe3090e8b8414"
        },
        {
          "name": "list_chain_series",
          "title": "Chain, miner and price series (catalogue)",
          "description": "Lists every series served from Aletheia's vintage store: the chain series built from one pass over every Bitcoin block on Aletheia's own node (chain.cohort.*: supply, supply by age band, long- and short-term holder supply, BTC moved, coin-days destroyed, dormancy, realised cap and price, MVRV, SOPR, supply in profit and loss, cost-basis percentiles), the miner series (miner.*: blocks, transactions, subsidy, fees, difficulty, hashrate, hashprice), the on-chain BTC/ETH/TRX price fixings and staked-ether contract rates (price.*), and the Federal Reserve H.10 exchange rates (fx.*).\n\nReturns: { count, series: [{ id, dataset, unit, kinds, first, last, latest_vintage, licence }] }. licence 'free_attributed_only' marks series with values priced before 2020-07-13 from the legacy daily price (CoinGecko, CryptoCompare and Binance backfills).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
