        {
          "name": "list_venues",
          "title": "Credit venues covered",
          "description": "Which credit venues does this dataset cover, and what is known about each? Returns the registry rows matching the filters you supply.\n\nOne row per venue, each with its coverage state per pillar and how many of its criteria cells have been researched. Two vocabularies, never mixed: a venue TYPE says how the venue is built (an on-chain pool, an isolated or CDP market, a custodial desk, a broker, a corporate issuer, an auction), and a credit CLASS says how its rate is set (algorithmic, minted, posted-card, auction, corporate) — the classes the Stack's pages use. Filter by either. Rows are compact by default; detail: 'full' returns every registry field and the semantics blocks. get_guide counts the venues of each type and class. Does not rank, score or order by any rate: rows are returned in the registry's own order. All filters are optional and unspecified means no constraint.\n\n⚠ A venue's presence is not a statement about it. Coverage 'none' means nothing is ingested yet, which is a declared gap, not an observation about the venue.\n\nBitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin. With collateral: 'eth' only the venues that take ether as collateral are returned (a venue taking both appears under both).\n\nStandard questions this tool answers (get_guide with question): SQ-V1, SQ-V5.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain_id": {
                "description": "Restrict to venues on one EVM chain id.",
                "type": "integer"
              },
              "class": {
                "description": "Restrict to one credit class, as the Stack's pages and compare_venues use them.",
                "enum": ["algorithmic", "minted", "auction", "posted-card", "corporate"],
                "type": "string"
              },
              "collateral": {
                "description": "Bitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin.",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "complete_attributes_only": {
                "description": "Only venues with every criteria cell researched. Default false.",
                "type": "boolean"
              },
              "detail": {
                "description": "'compact' (the default): one short row per venue. 'full': every registry field, with the semantics blocks.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "limit": {
                "description": "Cap the rows returned. Default 50. The response always states the unfiltered total.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Restrict by registry status, e.g. 'live', 'ingesting', 'registered', 'defunct'. A value the registry does not serve is refused with the ones it does.",
                "type": "string"
              },
              "venue_type": {
                "description": "Restrict to one venue type, e.g. 'onchain_pooled', 'onchain_isolated', 'onchain_cdp', 'cefi_desk', 'broker', 'corporate_debt', 'auction'. A value the registry does not serve is refused with the ones it does.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
