      "serverInfo": {
        "name": "bitcoin-credit-stack-mcp",
        "version": "0.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server exposes The Bitcoin Credit Stack: Aletheia Analytics' measurements\nof the Bitcoin-collateralised credit markets — rate curves, chain indicators,\nand a registry of credit venues categorised against published, versioned\ncriteria. Every tool here returns observed data. There are no transaction tools\non this server: nothing here signs, submits, broadcasts or prepares a\ntransaction, and no tool takes custody of funds or receives a mandate.\n\nBitcoin is the default collateral. The same measurements are made for credit\nsecured by ether — ether, staking and restaking tokens, each at its own contract\nrate — and the two are never added together. Pass collateral: 'eth' on the credit\ntools to read the ether side; a venue that does not take ether says so.\n\nWhere the operator holds a position at a venue, that is disclosed on that\nvenue's own row rather than as a statement about this dataset — read the\nvenue's disclosure field.\n\nRead the provenance fields before treating any figure as a market reference.\nEach venue criterion carries the kind of source it came from, the source\nitself and an as-of date; a criterion that cannot be established from public\nsources is returned as unknown with the reason, never guessed and never\nomitted. Where a figure would be degenerate on the observed data, the response\nreturns a structured absence naming the threshold and the observed count\nrather than a zero.\n\nNothing here is advice. There is no composite score, no ranking, no default\nsort by rate and no safety verdict in any payload, and none will be added.\nTools that return catalogues do not rank their entries; tools that return\ndistributions report what was observed with the sample size, and do not\nforecast a fill, a rate, a time-to-fill or a return. A reader weighs the\ncriteria; this server does not weigh them for the reader.\n\nWhat this server covers, and how much of it, is counted from the data when\nasked: call get_guide. An argument a tool does not take is refused by name,\nnever ignored, and a failure answers as { error: { code, message, retryable } }.\n\nUse of this server is governed by the Terms of Use, the Data Licence and, for\npaid calls, the Terms of Sale, published with the price list at\nhttps://www.bitcoincreditstack.com/legal (terms, licence, terms-of-sale, pricing).",
      "tools": [
        {
          "name": "compare_venues",
          "title": "Credit cost across venues",
          "description": "What does credit at this tenor and LTV cost across every venue Aletheia covers? One row per venue in coverage-matrix order — no ranking, no default sort, no \"best\".\n\nStandard questions this tool answers (get_guide with question): SQ-C2.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Restrict to one credit class. The whole matrix is every venue in the registry; one class is a fraction of it.",
                "enum": ["algorithmic", "minted", "auction", "posted-card", "corporate"],
                "type": "string"
              },
              "collateral": {
                "description": "Bitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin.",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "ltv": {
                "description": "Loan-to-value as a decimal 0–1, not a percentage.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "side": {
                "description": "'borrow' (what a borrower pays, the default) or 'lend' (what a capital provider earns).",
                "enum": ["borrow", "lend"],
                "type": "string"
              },
              "tenor_days": {
                "description": "Loan term in days to compare at.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "venues": {
                "description": "Comma-separated registry ids to restrict the rows to, e.g. 'aave_v3_ethereum,cefi_ledn'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7ff0fea4a0195f3d9cf8b2aca644f5e4dad8f81ddddcedf1349e200c08cd6ead"
        },
        {
          "name": "get_balance_sheet",
          "title": "Balance sheet of the mined bitcoin",
          "description": "Who holds the mined bitcoin, as each holder states it, and how much of it is pledged, wrapped or lent out. One line per holder (companies, spot funds, wrapped-token reserves, custodians, exchanges, governments), each with its figure or a range, its date, its source and a grade (A stated units; B units by a stated rule; C the holder's own unchecked statement; D inferred outside primary sources), or an absence with its reason, never zero. A coin is counted once, at its owner: what a custodian holds for funds or wrapped tokens is taken out of its line, and fund shares or coins held for a victim are listed, not added. Three totals (holders that disclose; with custody for owners who do not; with governments) and the remainder not attributed to a disclosed holder, described by the age of its coins and the amount each address holds, never by who holds it. Pledged, wrapped and lent-out bitcoin is a second view, never added. Governments with a figure carry their debt beside GDP and beside the dollar value of that bitcoin. Nothing is ranked. Pass as_of (YYYY-MM-DD) for a written date, or quarter (YYYY-Qn) for a quarter's last day, which is fixed once that quarter's filings are in. Returns the route's payload as served.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "A date the sheet was written (YYYY-MM-DD); the latest by default",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "quarter": {
                "description": "A quarter (YYYY-Qn): the sheet of that quarter's last day",
                "pattern": "^\\d{4}-Q[1-4]$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d507610c18a9d944bd6dbe4ed3564548b48625fbc1ba408b023c7c1b8fbc8558"
        },
        {
          "name": "get_chain_series",
          "title": "One chain, miner or price series through time",
          "description": "Returns one series from Aletheia's vintage store, by id (see list_chain_series): every value with its date and kind, the series' unit, source and limitation, and the vintages the values came from. With as_known_on, returns the series exactly as the store held it at the end of that day (UTC), so a past answer can be reproduced.\n\nChain series reach back to 2009 and are day-granular. Priced values (realised value, MVRV, SOPR, hashprice in USD) value each coin at the price of the day it was created: Aletheia's on-chain fixing from 2020-07-13, the legacy daily price (CoinGecko, CryptoCompare and Binance backfills) before. Such points carry coingecko_share and price_today, and the response's licence block carries the attribution: show it with them. This tool returns data; it does not advise, forecast, or characterise the market.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_known_on": {
                "description": "YYYY-MM-DD: the series as the store held it at the end of that day (UTC)",
                "type": "string"
              },
              "from": {
                "description": "First date, YYYY-MM-DD",
                "type": "string"
              },
              "id": {
                "description": "Series id, e.g. chain.cohort.supply_btc, chain.cohort.mvrv, miner.hpx_btc, price.btc_in_basket, fx.eur",
                "type": "string"
              },
              "to": {
                "description": "Last date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e78cd82f539e19a21bc8e2f1f113069888132149dec58060c507f6f37e8dbdf8"
        },
        {
          "name": "get_chart",
          "title": "A chart of series, drawn in the house style",
          "description": "Draws the series get_series would return for the same request (ids from list_series, the same window and as_known_on) as an SVG image in the Stack's house style: exactly the chart plan's panels, one unit each; rate axes from zero; a refused series not drawn; an absence a gap, never a zero; coverage steps marked; the sources, span, number of values, any as-known-on date and every credit printed under the chart, with the link that draws it on the site. size: 'site' (default) or 'post' (a social-post format); log: 'upper' or 'lower' draws that panel on a log axis where the plan offers one; title adds a heading.\n\nReturns the SVG as an embedded resource (image/svg+xml) and the public URL that serves the same image, so it can be shown or linked. A request whose series the plan draws none of is refused with the plan's reasons. Show the credits with the chart. This tool draws data; it does not advise, forecast or characterise the market.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_known_on": {
                "description": "YYYY-MM-DD: every series as the store held it at the end of that day (UTC)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "First date, YYYY-MM-DD (default: a year before `to`)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ids": {
                "description": "Series ids from list_series, e.g. ['cx.index.bsbs', 'cx.market.secured.borrow_spread_over_ust_3m']",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 13,
                "minItems": 1,
                "type": "array"
              },
              "log": {
                "description": "Draw that panel on a log axis, where the plan offers one",
                "enum": ["upper", "lower"],
                "type": "string"
              },
              "size": {
                "description": "'site' (default) or 'post'",
                "enum": ["site", "post"],
                "type": "string"
              },
              "title": {
                "description": "A heading for the chart",
                "maxLength": 160,
                "type": "string"
              },
              "to": {
                "description": "Last date, YYYY-MM-DD (default: today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:93398c78c3cf4fa9e2a69d4c431eb8dfa41786879ea7755807de6363191bf43a"
        },
        {
          "name": "get_corporate_instruments",
          "title": "Corporate instruments (preferreds and debt)",
          "description": "Lists the instruments of the corporate issuers in the registry (convertible notes, credit facilities, bonds, perpetual preferreds), one row per instrument, as the site's /instruments pages show them: terms, seniority, the yield a holder receives where a last regular-session trade prices it, returns, and the issuer's bitcoin holdings. The holding is the latest-dated figure read from a filing; btc_holdings_derived, beside it, is the last read plus the purchases filed since (\"derived from filed purchases\"), display only, never in backing_ratio, and confirmed or corrected by the next read. Corporate lending, not bitcoin-backed credit: a holder lends to the issuer with no lien on its bitcoin, except where the issuer has pledged bitcoin against a facility.\n\nbtc_backing also carries the debt attributed to bitcoin, beside the filed debt: for each company holding at least 100 BTC (a subsidiary counted at its parent), bitcoin-pledged debt counts in full (no more than the pledged coins' value where the line states them), debt secured by other assets at zero, and unsecured debt and preferred stock at the company's unencumbered share of assets. It is a stated convention applied to filed figures, not a measurement; total assets, each debt line and its security are served beside it, and a company whose figure cannot be attributed says why. Income in the returns is what the terms accrue, not what was confirmed paid (returns_convention says so). Prices are IEX's, credited in the answer's attribution.\n\nWithout issuer, every instrument is returned and each company's attribution is summarised: its unencumbered share, total assets, the dates of its balance sheet and debt lines, and how many debt lines it has. Pass issuer (e.g. 'strategy') for that company's instruments and its full attribution, every debt line with its security and source.\n\nStandard questions this tool answers (get_guide with question): SQ-Co1.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "issuer": {
                "description": "A corporate issuer id (e.g. 'strategy'): its instruments and its full attribution, debt line by debt line",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29069983ef2322130e4c64d0d29528e6b55e387835f30a93c049114886b9e65e"
        },
        {
          "name": "get_cost_basis",
          "title": "Bitcoin supply by cost basis (one day)",
          "description": "Returns Bitcoin's supply alive at the end of one UTC day, grouped by the BTC price on the day each coin was created, in logarithmic price buckets of a chosen width (ratio, default 1.02: each bucket spans 2%). Built from Aletheia's own node, block by block; day-granular.\n\nCreation prices are Aletheia's on-chain fixing from 2020-07-13 and the legacy daily price (CoinGecko, CryptoCompare and Binance backfills) before; each bucket states how much of it is priced from the legacy price (coingecko_btc), and the licence block carries the attribution. Coins created before 2010-07-17 have no price and form one bucket at 0. This tool returns data; it does not advise, forecast, or characterise the market.\n\nReturns: { date, ratio, unit, buckets: [{ low_usd, high_usd, btc, coingecko_btc }], limitation, licence }.\n\nStandard questions this tool answers (get_guide with question): SQ-Ch4.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day, YYYY-MM-DD (a complete day: up to the day before the latest)",
                "type": "string"
              },
              "ratio": {
                "description": "Bucket width as a price ratio, 1.005 to 2 (default 1.02)",
                "type": "number"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:edd0b7042cbecb0b17d8529177719eb6d4b4fb65c1b386eda0d59af6364622fa"
        },
        {
          "name": "get_credit_state",
          "title": "The Bitcoin credit surface, now",
          "description": "What does Bitcoin-collateralised credit cost and how much of it is outstanding, across the venues this dataset covers? One reading aggregated over the venue universe, not any single venue's book.\n\nCarries the term structure, outstanding quantity, valuation, collateral mix and quality composition, with the coverage block stating how many venues contributed and naming the ones that did not. No venue is weighted up, floated or reported under its own heading.\n\n⚠ Read coverage before reading the figures. A venue absent from this reading is a declared gap, not a zero, and the rows it would have contributed are counted separately as unavailable.\n\nCorporate issuers' debt is not in this reading. get_corporate_instruments serves it, with the debt attributed to bitcoin: bitcoin-pledged debt in full, debt secured by other assets at zero, unsecured debt and preferred stock at each company's unencumbered share of assets, for companies holding at least 100 BTC (a subsidiary counted at its parent).\n\nBitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin. With collateral: 'eth' this returns the ether market: the same six figures at market and class level, books per loan currency (ether lent against ether is its own book, outside the headline).\n\nThe collateral mix's daily history by wrapper is long; it is left out unless collateral_mix_history is true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collateral": {
                "description": "Bitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin.",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "collateral_mix_history": {
                "description": "Include the collateral mix's daily history by wrapper (bitcoin only). Default false: the mix as it stands, without its history.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:64ca4319d70eb109ad1360cfbd71e05aeee874481a78e95366f549e9ea790f4a"
        },
        {
          "name": "get_credit_state_history",
          "title": "The Bitcoin credit surface over time",
          "description": "How has the Bitcoin credit surface moved? The same cross-venue reading as get_credit_state, as a daily series.\n\nEach point carries the coverage that produced it, so a change in the series and a change in which venues were observable can be told apart. This is descriptive data; it does not forecast and it does not characterise a trend.\n\n⚠ Coverage is not constant through the series. A move in a figure may be a move in the market or a venue entering or leaving observation — the per-point coverage is what distinguishes them.\n\nBitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin. The ether series covers the market, each class and each family from the first date the answer states (history_starts); points before the ether tree's first live snapshot are rebuilt from each venue's own contract reads. Pooled venues' debt is read once a month: between readings that figure is an absence with its reason, never a zero. The answer's steps and notes say where coverage changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collateral": {
                "description": "Bitcoin by default; pass collateral: 'eth' for credit secured by ether (ether, staking and restaking tokens at their own contract rates), measured the same way and never added to bitcoin.",
                "enum": ["btc", "eth"],
                "type": "string"
              },
              "days": {
                "description": "How many days of history. Default 365, capped at 3650.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38437a604d42fa68f9a972cbe8dd1270793710395d9ca7be2e3ef813ecda8f27"
        },
        {
          "name": "get_debt_by_collateral",
          "title": "How the dollar debt is backed",
          "description": "What backs the dollar debt against bitcoin, by collateral and by venue type (pools, isolated markets, vaults, the auction, corporate, posted cards), as the site's \"How these loans are backed\" panel shows it, with each observer named and the collateral rule stated. days (30 to 1500, default 30) sets the window of the series it carries. The corporate part carries the class totals; the rows for each company are get_corporate_instruments'.\n\nStandard questions this tool answers (get_guide with question): SQ-M5.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, 30 to 1500 (default 30)",
                "maximum": 1500,
                "minimum": 30,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:19aadd209c9a9855bb3b70fe73755d9989401622b077071595b7cd4fc752e75d"
        },
        {
          "name": "get_desk_rates",
          "title": "Posted rates of the custodial desks",
          "description": "Returns the rate cards the custodial lending desks post (bitcoin collateral), one row per product: the representative APR and its range, term, maximum LTV, custody and liquidation model, and the card's effective date and source. Administered rates, not market-cleared; a card older than the stated staleness is marked. Pass desk to read one desk's cards. Returns the route's payload as served.\n\nStandard questions this tool answers (get_guide with question): SQ-V6.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "desk": {
                "description": "A desk id as the payload names it, e.g. 'ledn', 'xapo'",
