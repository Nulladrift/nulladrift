        {
          "name": "list_series",
          "title": "Every chartable series (catalogue)",
          "description": "Lists the series the Stack serves, across every dataset: the credit tree at every level (market, class, family, venue) and figure, for bitcoin and, separately, for ether collateral; the liquidation map's bands; the credit x on-chain measures and their sub-series; the governed indices; wrapper reserve coverage; the chain, miner, on-chain price and FX series from Aletheia's own node; the Treasury curve (H.15); SOFR and the stablecoin total. Each row: id, label, unit, group, collateral, cadence, kinds, first and last date, licence, the site page that shows it, whether it can be charted (and why not), and whether the site's explorer draws it.\n\nPaged: 100 rows by default (limit up to 500); pass the returned `next` as cursor. Narrow with dataset, group, collateral, prefix (e.g. 'credit.class.algorithmic.') or q (a word in the id or label). Then fetch values with get_series.\n\nStandard questions this tool answers (get_guide with question): SQ-Ch1, SQ-S4.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chartable_only": {
                "description": "Leave out series that cannot be drawn on a time chart",
                "type": "boolean"
              },
