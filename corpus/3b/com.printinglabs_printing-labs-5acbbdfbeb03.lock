        {
          "name": "book-meeting",
          "description": "Book a consultation with the Printing Labs team: creates the Google Calendar event (with Meet link unless Phone Call), registers the meeting, and emails the requester confirm/reschedule/cancel links. The time must be one of get-meeting-slots' values for that date. Only book with the user's explicit consent and their real contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Meeting date, YYYY-MM-DD (IST)",
                "type": "string"
              },
              "email": {
                "description": "Requester's email (receives the invite + manage links)",
                "type": "string"
              },
              "firstName": {
                "description": "Requester's first name",
                "type": "string"
              },
              "guests": {
                "description": "Additional attendee emails",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lastName": {
                "description": "Requester's last name",
                "type": "string"
              },
              "mobile": {
                "description": "Phone / WhatsApp number with country code",
                "type": "string"
              },
              "mode": {
                "description": "Meeting mode",
                "enum": ["Google Meet", "Phone Call"],
                "type": "string"
              },
              "notes": {
                "description": "What the meeting is about",
                "type": "string"
              },
              "time": {
                "description": "A slot exactly as returned by get-meeting-slots, e.g. '3:30 PM'",
                "type": "string"
              }
            },
            "required": ["date", "email", "firstName", "mobile", "time"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:27776c4b4e105399cab4f6a42121f57a7b1679bb1d606df546a02a6f4bfe8978"
        },
        {
          "name": "calculate-bulk-price",
          "description": "Compute the effective bulk price for a given product and quantity: applies the product's quantity-discount tiers and GST, validates the minimum order quantity, and shows the next discount tier. Pass options to price a choice other than the default (e.g. UV printing, which can add an extra per unit). Indicative pricing — final quotes come from the sales team.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "options": {
                "description": "Optional choices from get-product-details options, e.g. [\"Print Type: UV\"] (or just [\"UV\"]). Omit for the defaults.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quantity": {
                "description": "Number of units",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Product permalink slug or id (from search-products)",
                "type": "string"
              }
            },
            "required": ["quantity", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
