        {
          "name": "create-onboarding-drop",
          "description": "HR/HRIS automation (requires an API key in the Authorization header — Bearer plk_…): turn new hires into welcome-kit claim links in one call. Creates a Swag Drop for the chosen kit, invites each employee by email, and returns the claim + HR dashboard links. Each employee picks their own size and delivery address; Printing Labs prints, packs and ships per recipient.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company name shown on the claim page (defaults to the API-key label)",
                "type": "string"
              },
              "employeeEmails": {
                "description": "New-hire email addresses (1–50); each receives a claim-link email",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "employeeNames": {
                "description": "Optional names, parallel to employeeEmails",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "kitProductSlug": {
                "description": "The product or preset-bundle slug to send (from search-products)",
                "type": "string"
              },
              "message": {
                "description": "Welcome message shown to employees on the claim page",
                "type": "string"
              },
              "notifyEmployees": {
                "description": "Email each employee their claim link immediately (default true)",
                "type": "boolean"
              }
            },
            "required": ["employeeEmails", "kitProductSlug"],
            "type": "object"
