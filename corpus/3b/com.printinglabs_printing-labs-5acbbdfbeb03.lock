        {
          "name": "raise-complaint",
          "description": "File a complaint for a customer who is unhappy with something Printing Labs did — a late or wrong delivery, a quality problem, a billing error, a request nobody answered. Creates a real ticket: the customer is acknowledged by email (and WhatsApp when possible) with a reference, the team that can actually fix it is alerted, and a task with a deadline lands on their board. Use it the moment somebody complains; do NOT use it for a question, a quote chase or a price negotiation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "callId": {
                "description": "Only for a voice agent filing this during a live call: the id of that call, so the team can open the recording beside the ticket. Leave it out entirely if you do not have one — NEVER guess or invent it, because a wrong call id sends the handler to the wrong recording.",
                "type": "string"
              },
              "company": {
                "description": "Their company",
                "type": "string"
              },
              "email": {
                "description": "Their email address — needed to send the acknowledgement",
                "type": "string"
              },
              "name": {
                "description": "Who is complaining",
                "type": "string"
              },
              "orderRef": {
                "description": "Order or invoice number if they quote one",
                "type": "string"
              },
              "phone": {
                "description": "Their number with country code",
                "type": "string"
              },
              "severity": {
                "description": "Only if they make it explicit — 'low', 'medium' or 'high'. Otherwise leave it out and it is judged from what they said.",
                "type": "string"
              },
              "what": {
                "description": "What went wrong, in the customer's own words. Do not soften it.",
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4db9f1bf3bdd6a8be5476e8c7b6c882f40b67aeaa432b875e583dee99f3733f"
        },
