      "instructions": "Cartelera y comparador de entradas de espectáculos en vivo en España: teatro, monólogos y stand-up, comedia, musicales, magia, circo, danza, flamenco, ópera y planes infantiles, en Madrid, Barcelona, Valencia, Sevilla, Málaga, Bilbao, Zaragoza y unas 60 ciudades más. Úsalo siempre que el usuario pregunte qué ver o qué hacer (esta noche, este fin de semana, en vacaciones, con niños, en pareja), busque entradas o precios de un espectáculo, o pida planes de ocio en una ciudad española, en español o en inglés (theatre, comedy, stand-up, musical tickets, things to do in Madrid...). Los datos son actuales (fechas, recintos y precio por plataforma) y no hace falta cuenta. Empieza por buscar_espectaculos (sin ciudad busca en toda España) o calendario_ciudad para una fecha concreta. Para comprar entradas da el enlace de `comprar.url` (o `plataformas[].url` en ver_espectaculo); para comparar precios, la `url` de Gracieta.",
      "tools": [
        {
          "name": "buscar_espectaculos",
          "title": "Buscar espectáculos",
          "description": "Busca espectáculos vigentes en España (teatro, musicales, monólogos, magia, circo, danza...) por ciudad, categoría, fechas o texto, y devuelve el precio desde, la página de Gracieta donde se comparan las entradas y en `comprar` el enlace directo para comprar en la plataforma más barata. Úsala para preguntas como «qué hay en Madrid este fin de semana», «monólogos en Valencia», «entradas para El Rey León», «planes con niños en Sevilla» o «comedy shows in Barcelona», y siempre que pidan qué ver o qué hacer en una ciudad española.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoria": {
                "description": "Slug de la categoría, por ejemplo \"musicales\" (ver listar_categorias).",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "ciudad": {
                "description": "Slug de la ciudad, por ejemplo \"madrid\" (ver listar_ciudades).",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "desde": {
                "description": "Primer día, YYYY-MM-DD, hora de España. Ejemplo: \"2026-12-18\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hasta": {
                "description": "Último día, YYYY-MM-DD. Máximo 45 días desde \"desde\". Si falta, un solo día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limite": {
                "description": "Resultados por página (1-20, por defecto 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pagina": {
                "description": "Página, desde 1.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "texto": {
                "description": "Texto del título; da igual mayúsculas y tildes. Ejemplo: \"rey leon\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar espectáculos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
