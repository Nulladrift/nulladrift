              "resourceUri": "ui://gracieta/cartelera-v2.html"
            },
            "ui/resourceUri": "ui://gracieta/cartelera-v2.html"
          },
          "digest": "sha256:d141943687cd519d9e65ce83091cd42e57a687681ae756269edb77e00a12e1b0"
        },
        {
          "name": "calendario_ciudad",
          "title": "Calendario de una ciudad",
          "description": "Agenda de una ciudad día a día para los próximos días (hasta 14): qué espectáculos hay cada jornada. Úsala para «qué hacer esta semana en Sevilla», «qué hay hoy en Madrid» o «planes para el sábado en Bilbao».",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoria": {
                "description": "Slug de categoría para filtrar.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "ciudad": {
                "description": "Slug de la ciudad. Ejemplo: \"madrid\".",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "desde": {
                "description": "Primer día, YYYY-MM-DD. Por defecto hoy en España.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dias": {
                "description": "Cuántos días mostrar (1-14, por defecto 7).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "limite": {
                "description": "Máximo de espectáculos (1-30, por defecto 20).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ciudad"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
