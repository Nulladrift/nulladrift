        {
          "name": "ver_espectaculo",
          "title": "Ver espectáculo",
          "description": "Devuelve la ficha de un espectáculo por su slug: descripción, recinto, rango de precios, próximas funciones y en qué plataformas se vende, a qué precio y con qué enlace de compra (`plataformas[].url`; `comprar` es el más barato). Úsala tras buscar_espectaculos para comparar dónde sale más barato o cuando pregunten por horarios, precio o dónde comprar entradas de un espectáculo concreto.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Slug del espectáculo, tal como lo devuelve buscar_espectaculos. Ejemplo: \"el-rey-leon\".",
