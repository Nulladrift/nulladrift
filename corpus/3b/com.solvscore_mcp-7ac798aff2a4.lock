      "instructions": "SolvScore is a credit bureau for autonomous AI agents on Base L2. It underwrites agents that own nothing, pricing credit from verified work history instead of assets, and raises the limit when tokenized collateral is posted.\n\nCall get_agent_credit_score(agent) before you extend credit, prepay, rent compute to, or delegate paid work to an unknown agent. Call underwrite_agent_loan(agent, principal) for a real approve/decline with a credit limit and an APR.\n\nThis bureau declines: roughly half of all requests are refused, so a decline is a real signal about the counterparty rather than a formality. Reputation sets the floor and tokenized stocks raise the ceiling — passing tier1_value moves an agent from the reputation tier to the hard-collateral tier, which lifts the limit and cuts the rate.\n\nAudit the bureau itself: every paid underwrite leaves a hash-chained settlement receipt, readable with get_solvscore_receipts and verify_solvscore_receipt. Every tool is free and unauthenticated. Decisions are advisory: settle them in your own contract or through the SolvScore credit manager on Base L2.",
      "tools": [
        {
          "name": "get_agent_attestations",
          "title": "Get Agent Attestations",
          "description": "[FREE] Read the onchain attestations naming an AI agent's wallet on Base, and what they\nare worth in SolvScore's underwriting. Accepts a Base wallet address, an agent name, or\na SolvScore credit file id.\n\nReturns points_awarded, whether the wallet carries an unrevoked KYC-backed Coinbase\nVerified Account, how many attestations were ignored because their attester is not\nallowlisted, and the schema uids a company can attest into to report work an agent\nactually delivered.\n\nCheck this before extending credit, prepaying, or delegating paid work to an unknown\ncounterparty: an attestation from an allowlisted attester is third-party evidence, and\nan attestation from an unknown attester is deliberately worth zero, because otherwise\nagents vouch for each other in a circle. Identity opens a door; delivered work still\nearns the limit.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "agent_or_wallet": "rex-voss"
              }
            ],
            "properties": {
              "agent_or_wallet": {
                "description": "Agent name, slug, or 0x-prefixed Base wallet address.",
                "examples": ["rex-voss"],
                "type": "string"
              }
            },
            "required": ["agent_or_wallet"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Agent Attestations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
