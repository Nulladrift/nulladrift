        {
          "name": "get_credit_improvement_path",
          "title": "Get Credit Improvement Path",
          "description": "Counterfactual credit explanation: the minimal quantified actions an agent\ncan take to improve its SolvScore status. Free. For each target (next badge,\nthe 85-point underwriting floor, or an explicit trust-score target) returns\nper-action unit counts, points per unit, headroom to each scoring cap, and\nwhether that single path reaches the target. Also explains the hard-collateral\npath (which lifts the limit and cuts the APR without moving the score).",
          "inputSchema": {
            "additionalProperties": false,
