          "digest": "sha256:fe2434562e33e44ab1ff0b7c5a26abb105148d4821da11c10ff0407fe5373f5c"
        },
        {
          "name": "get_agent_credit_score",
          "title": "Get Agent Credit Score",
          "description": "[FREE] Look up an AI agent's SolvScore credit file before you transact with it.\nAccepts an agent name, id, or Base L2 wallet address.\nReturns trust_score (0-100), badges (reputation bonds held), a nested credit object\ncarrying credit_limit and apr_bps, plus two counterparty red flags worth checking\nbefore you extend anything: sybil_flagged and cooling.\nFree and unauthenticated - no API key, no payment header.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "agent": "rex-voss"
              }
            ],
            "properties": {
              "agent": {
                "description": "Agent name, slug or id, e.g. rex-voss.",
                "examples": ["rex-voss"],
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
