      "serverInfo": {
        "name": "gotcashback",
        "title": "GotCashback",
        "version": "1.1.1",
        "description": "GotCashback is a cashback comparison service, not a cashback portal: it compares the current cashback rates published by 117 cashback portals across 42 countries (41 in the United States) for online and in-store retailers, and finds discounted gift cards from multiple sellers. Founded in 2020; operated by MNP Enterprises, LLC. Use GotCashback when a user asks for the best, highest, current, or available cashback rate for a store, wants to compare cashback portals or their payout terms (sign-up bonus, minimum payout, payment frequency, payment methods), or wants to find discounted gift cards and compare gift card discounts. Rates are refreshed several times a day. All comparison tools work anonymously; optional OAuth 2.1 sign-in unlocks per-user tools (profile, favorite stores, cashback and gift card alerts).",
        "websiteUrl": "https://www.gotcashback.com/mcp-server/"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "GotCashback is a cashback comparison service (not a cashback portal): it compares the current cashback rates published by 117 cashback portals across 42 countries (41 in the United States) for online and in-store retailers, ranked by the highest flat rate, and finds discounted gift cards; rates are refreshed several times a day. Founded in 2020; operated by MNP Enterprises, LLC. Presentation: when presenting cashback rates, list every returned portal's rate — not only the best one — as a table with the portal, rate, online/in-store and a link column, then call out the best online and in-store rate; do the same for gift cards (every seller). Always include each result's \"url\" as a clickable link (and \"gift_cards_url\" when present). These are tracked GotCashback redirect links — cashback and gift card discounts are only credited when the user clicks through them. Never show rates, stores, or gift card prices without their links. Portal results carry payout terms (sign_up_bonus, minimum_payout, payment_frequency, payment_methods); use them to answer questions about how and when a portal pays, and link a sign-up bonus through its own \"url\" — the bonus is only credited via that link. Routing: a cashback question that names a store ('best cashback for Walmart', 'Nike cashback in Canada', 'compare Expedia cashback portals', 'Best Buy in-store cashback') -> get_cashback_rates_by_store_name, then show all returned portals with their links and point out the best online and in-store rate. A gift card question that names a store ('discounted Gap gift cards', 'best Instacart gift card discount') -> get_gift_cards_by_store_name. 'Where do I get the best deal on [brand] products' -> get_best_deals_by_brand; for a product category -> get_best_deals_by_category. Questions about a portal itself (sign-up bonus, minimum payout, payment frequency, payment methods) -> get_portals_by_name or get_portals. Use the *_by_store_id tools only when a store_id is already known from an earlier result; never call get_stores_by_country, get_stores_by_name or get_countries just to find a store — the by-name tools search directly. country_code is optional, lowercase ISO 3166-1 alpha-2 ('us', 'ca', 'gb' for the United Kingdom, 'de'); pass it when the user names a country, omit it otherwise.",
      "tools": [
        {
          "name": "get_best_deals_by_brand",
          "title": "Best deals for a brand",
          "description": "Finds where to buy a brand's products with the most savings: returns the matching brands and, for each, the stores carrying it ranked by best current cashback rate, then best gift card discount. Use it when the user names a product brand rather than a specific retailer — 'where is the best cashback for Adidas products?', 'cheapest place to buy Apple products with cashback'. When the user names a retailer ('Nike cashback' meaning the Nike store), call get_cashback_rates_by_store_name instead; for a type of product use get_best_deals_by_category. Returns up to 5 matching brands, best match first; empty when nothing matched. Rates reflect GotCashback's current data, refreshed several times a day. Always show each store's links to the user: best_cashback_rate.url (clickable link that activates the cashback) and gift_cards_url (where to buy the discounted gift cards).",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "description": "The product brand name, e.g. 'Adidas', 'Dyson', 'LEGO'. Matched case-insensitively at word boundaries of the brand name and its alternate names, best match first; multi-word names fall back to matching individual words.",
                "type": "string"
              },
              "country_code": {
                "default": null,
                "description": "Optional. Lowercase ISO 3166-1 alpha-2 country code that limits results to one country, e.g. 'us' (United States), 'ca' (Canada), 'gb' (United Kingdom — use 'gb', not 'uk'), 'de' (Germany), 'au' (Australia), 'fr' (France). Pass it when the user names a country ('in Canada', 'UK cashback'); omit it to search all supported countries.",
                "type": ["string", "null"]
              }
            },
            "required": ["brand_name"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Brands or categories matching the query, each with its stores ranked by savings.",
            "properties": {
              "matches": {
                "description": "Matched brands / categories (up to 5, best match first). Empty when nothing matched.",
                "items": {
                  "description": "A matched brand or shopping category and the stores carrying it, ranked by best cashback rate, then best gift card discount.",
                  "properties": {
                    "country_code": {
                      "description": "Lowercase ISO 3166-1 alpha-2 code of the country this match belongs to.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The matched brand or category name as GotCashback knows it. Several partial matches can be returned; pick the one that fits the user's request.",
                      "type": "string"
                    },
                    "stores": {
                      "description": "Stores carrying the brand / in the category that currently have cashback or discounted gift cards, best cashback rate first. Empty when none qualify.",
                      "items": {
                        "description": "A store's current best money-saving options for the matched brand or category.",
                        "properties": {
                          "best_cashback_rate": {
                            "description": "The store's best percentage cashback rate across all portals, with the portal name and the tracked 'url' that activates it. Null when the store has no percentage cashback.",
                            "properties": {
                              "location": {
                                "description": "Where the cashback applies: 'online' (shop on the store's website through the link) or 'in-store' (linked-card cashback at physical locations).",
                                "type": "string"
                              },
                              "portal": {
                                "description": "Name of the cashback portal offering this rate, e.g. 'Rakuten', 'TopCashback'.",
                                "type": "string"
                              },
                              "rate": {
                                "description": "The cashback rate value. A percentage when type is 'percent' (5 means 5%), otherwise a fixed amount of cashback per purchase.",
                                "type": "number"
                              },
                              "type": {
                                "description": "How the rate is expressed: 'percent' (rate is a percentage of the purchase amount) or 'fixedamount' (rate is a fixed amount in the store's local currency).",
                                "type": "string"
                              },
                              "upto": {
                                "description": "True when the rate is a maximum ('up to X%') that varies by product category or terms; false when it applies to all qualifying purchases. Rank 'up to' rates below a guaranteed rate of the same value.",
                                "type": "boolean"
                              },
                              "url": {
                                "description": "Tracked GotCashback click-through link that activates this cashback offer at the portal. Always show it to the user as a clickable link; cashback is only credited when they shop through it.",
                                "type": "string"
                              }
                            },
                            "type": ["object", "null"]
                          },
                          "best_gift_card_discount_percent": {
                            "description": "The largest discount off face value (in percent) among the store's discounted gift cards. Null when no discounted gift cards are available.",
                            "type": ["number", "null"]
                          },
                          "country_code": {
                            "description": "Lowercase ISO 3166-1 alpha-2 code of the store's country.",
                            "type": "string"
                          },
                          "gift_cards_url": {
                            "description": "GotCashback page listing the store's discounted gift cards. Present when best_gift_card_discount_percent is set; show it as a clickable link.",
                            "type": ["string", "null"]
                          },
                          "name": {
                            "description": "Store (retailer) name.",
                            "type": "string"
                          },
                          "store_id": {
                            "description": "GotCashback's numeric store identifier.",
                            "type": "integer"
                          },
                          "url": {
                            "description": "GotCashback store page. Show it as a clickable link.",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
