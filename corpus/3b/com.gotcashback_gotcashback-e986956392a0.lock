              }
            },
            "required": ["country_code"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Stores matching the query, best match first, each with its current cashback rates.",
            "properties": {
              "stores": {
                "description": "Matching stores (one entry per country). Empty when nothing matched.",
                "items": {
                  "description": "A store (retailer) in one country, with its current cashback rates when returned by a cashback tool.",
                  "properties": {
                    "cashback_rates": {
                      "description": "Current cashback offers for this store, one per portal and location (online / in-store). Empty when no portal currently offers cashback here; null/absent for tools that return store identity only.",
                      "items": {
                        "description": "One cashback offer for the store from one cashback portal.",
                        "properties": {
                          "location": {
                            "description": "Where the cashback applies: 'online' (shop on the store's website through the link) or 'in-store' (linked-card cashback at physical locations).",
