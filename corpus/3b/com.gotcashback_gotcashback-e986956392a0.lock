          "name": "get_portals",
          "title": "List cashback portals",
          "description": "Returns the cashback portals GotCashback compares, optionally for one country, each with its payout terms. Use it to list the portals available in a country ('which cashback portals are there in Canada?') or to compare portals side by side — which pays fastest, has the lowest minimum payout, offers PayPal, or gives the biggest sign-up bonus. It does not return store rates: for 'which portal has the best cashback for [store]' call get_cashback_rates_by_store_name instead; for one named portal use get_portals_by_name. Each portal includes its payout terms for that country: 'sign_up_bonus' (amount and the url that grants it, null when none), 'minimum_payout' with 'minimum_payout_currency' (smallest balance paid out, null when not published, 0 means no minimum), 'payment_frequency' (how often it pays, e.g. 'On demand', 'Weekly', 'Monthly'), and 'payment_methods' (payout options, e.g. 'PayPal', 'Direct deposit', 'Check', 'Gift card'). Use these to answer questions about a portal's sign-up bonus, payout threshold, payment schedule and payment options. When mentioning a sign-up bonus, show its 'url' as a clickable link — the bonus is only credited when the user signs up through it.",
          "inputSchema": {
            "properties": {
              "country_code": {
                "default": null,
                "description": "Optional. Lowercase ISO 3166-1 alpha-2 country code that limits results to one country, e.g. 'us' (United States), 'ca' (Canada), 'gb' (United Kingdom — use 'gb', not 'uk'), 'de' (Germany), 'au' (Australia), 'fr' (France). Pass it when the user names a country ('in Canada', 'UK cashback'); omit it to search all supported countries.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Cashback portals with their payout terms, one entry per portal and country.",
            "properties": {
              "portals": {
                "items": {
                  "description": "A cashback portal in one country, with the payout terms it offers there.",
                  "properties": {
                    "country_code": {
                      "description": "Lowercase ISO 3166-1 alpha-2 code of the country these terms apply to. The same portal appears once per country.",
                      "type": "string"
                    },
                    "icon_url": {
                      "description": "Portal logo image URL.",
                      "type": "string"
                    },
                    "id": {
                      "description": "GotCashback's numeric identifier of this portal-in-country entry. Pass it as portal_id to get_portal_by_id.",
                      "type": "integer"
                    },
                    "minimum_payout": {
                      "description": "Smallest balance the portal pays out in this country, in minimum_payout_currency. Null when not published; 0 means there is no minimum.",
                      "type": ["number", "null"]
                    },
                    "minimum_payout_currency": {
                      "description": "ISO 4217 currency code of minimum_payout, e.g. 'USD', 'GBP'. Null when minimum_payout is null.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "Portal name, e.g. 'Rakuten', 'TopCashback'.",
                      "type": "string"
