                          "portal": {
                            "description": "Name of the cashback portal offering this rate, e.g. 'Rakuten', 'TopCashback'.",
                            "type": "string"
                          },
                          "rate": {
                            "description": "The cashback rate value. A percentage when type is 'percent' (5 means 5%), otherwise a fixed amount of cashback per purchase.",
                            "type": "number"
                          },
                          "type": {
                            "description": "How the rate is expressed: 'percent' (rate is a percentage of the purchase amount) or 'fixedamount' (rate is a fixed amount in the store's local currency).",
                            "type": "string"
                          },
                          "upto": {
                            "description": "True when the rate is a maximum ('up to X%') that varies by product category or terms; false when it applies to all qualifying purchases. Rank 'up to' rates below a guaranteed rate of the same value.",
                            "type": "boolean"
                          },
                          "url": {
                            "description": "Tracked GotCashback click-through link that activates this cashback offer at the portal. Always show it to the user as a clickable link; cashback is only credited when they shop through it.",
                            "type": "string"
                          }
                        },
                        "type": "object"
