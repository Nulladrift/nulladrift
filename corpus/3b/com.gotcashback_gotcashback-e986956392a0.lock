                    "payment_frequency": {
                      "description": "How often the portal pays out in this country, e.g. 'On demand', 'Weekly', 'Monthly', 'Quarterly'. Null when not published.",
                      "type": ["string", "null"]
                    },
                    "payment_methods": {
                      "description": "Payout methods offered in this country, e.g. 'PayPal', 'Direct deposit', 'Check', 'Gift card'. Null when none are published.",
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "sign_up_bonus": {
                      "description": "Sign-up bonus the portal currently offers new members in this country. Null when no active bonus is published.",
                      "properties": {
                        "amount": {
                          "description": "Bonus as the portal advertises it, e.g. '$10' or '£5 after your first purchase'.",
                          "type": "string"
                        },
                        "url": {
                          "description": "Link that grants the bonus. Always show it as a clickable link; the bonus is only credited when the user signs up through it.",
                          "type": "string"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "url": {
                      "description": "Link to join or open the portal (GotCashback's referral link when the portal has one). Show it as a clickable link.",
                      "type": "string"
                    }
                  },
                  "type": "object"
