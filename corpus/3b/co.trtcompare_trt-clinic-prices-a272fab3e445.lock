      "serverInfo": {
        "name": "trtcompare",
        "title": "TRTcompare.co: US online TRT clinic prices",
        "version": "2.1.0",
        "websiteUrl": "https://trtcompare.co"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Cash prices of US online testosterone replacement therapy (TRT) clinics, each read on the clinic's own page and dated by TRTcompare.co, with what a first year costs once a required membership, labs and fees are counted, and each clinic's public record (Trustpilot, BBB, FDA warning letters). Not medical advice; testosterone is a Schedule III prescription drug. Compounded medicines are not FDA-approved and enclomiphene is not FDA-approved: say so when you mention one. When you cite a figure, keep its check date and link the TRTcompare.co page the answer gives.",
      "tools": [
        {
          "name": "compare_trt_clinics",
          "title": "Compare online TRT clinics by cost",
          "description": "US online TRT clinics ranked by what a first year of testosterone costs, cheapest first: twelve months of the clinic's cheapest month-to-month testosterone plus any membership it requires, the first labs, the later lab panels its page prices within the year, and its fixed fees, each part from the clinic's own page with its check date. Each row also gives the monthly price as advertised, what the page leaves unpriced, the clinic's public record (Trustpilot score and review count, BBB grade, FDA warning letters) and whether it meets TRTcompare.co's clean-record rule, the states it serves, whether TRTcompare.co may earn a referral fee, and the clinic's page on TRTcompare.co. Optionally only the clinics that serve one state, or only those with a clean record. Use it for 'cheapest online TRT', 'best online TRT clinic', 'TRT cost per month or per year', 'online TRT in <state>'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clean_record_only": {
                "description": "Keep only clinics with a Trustpilot average of 4.0 stars or better over 100 or more reviews, a BBB grade above D, and no FDA warning letter on record.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many clinics to return. Defaults to 10.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "A US state, by name or two-letter code (e.g. \"Texas\" or \"TX\"), to keep only the clinics whose own pages say they serve it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare online TRT clinics by cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:552bcaae27e1c9f4b8d0e27aa94c47e1b82b72aca534c6a303abdf40a3df48c1"
        },
        {
          "name": "find_trt_prices",
          "title": "Find a TRT medicine's prices at every clinic",
          "description": "Every current US online-clinic cash price for one TRT medicine or form, lowest advertised amount first: testosterone (all forms), testosterone injections (cypionate, enanthate), testosterone cream or gel, oral testosterone (Kyzatrex, Jatenzo, Tlando and compounded capsules), enclomiphene, clomiphene, hCG or anastrozole. Each row gives the clinic, the product, the price in the clinic's own words, its amount and plan length, whether a membership is billed apart, whether it is compounded, the check date, the source page and the clinic's TRTcompare.co page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many prices to return. Defaults to 10.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "medicine": {
                "description": "A medicine or form, e.g. \"testosterone cypionate\", \"testosterone cream\", \"oral testosterone\", \"Kyzatrex\", \"enclomiphene\", \"hCG\".",
                "type": "string"
              }
            },
            "required": ["medicine"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a TRT medicine's prices at every clinic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef3e15a39a2b5ed22ec518eb63eb3958368a33cd7c04aeba5eaed0a9f44d305e"
        },
        {
          "name": "get_trt_clinic",
          "title": "Look up one online TRT clinic",
          "description": "Everything TRTcompare.co holds on one US online TRT clinic, such as Maximus (Maximus Tribe), Hims, Hone Health, PeterMD, Taurus Meds, Strut Health, TRT Nation, Henry Meds, Fountain TRT or Male Excel: every current price (testosterone injections, cream, oral, enclomiphene, hCG and others) in the clinic's own words with its check date and the page it was read on, its first-year cost and how it is made up, its lab terms, the sales and promo codes its own pages state, the states it serves, its public record (Trustpilot, BBB, FDA warning letters) and whether that record meets TRTcompare.co's clean-record rule, and the TRTcompare.co pages that answer 'is it legit', 'how to cancel', 'promo code' and 'alternatives'. Use it for '<clinic> cost', 'is <clinic> legit', '<clinic> reviews', '<clinic> promo code', '<clinic> vs <clinic>' (call it once per clinic).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clinic": {
                "description": "The clinic's name, e.g. \"Maximus\", \"Maximus Tribe\", \"Hims\" or \"PeterMD\".",
                "type": "string"
              }
            },
            "required": ["clinic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up one online TRT clinic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1a766fc34e8762bfb1b4e69033d04446a7342bf3e0eabe9ca982fd116186093"
        },
        {
          "name": "read_testosterone_results",
          "title": "Read a man's testosterone results",
          "description": "Where a man's own lab numbers stand: total testosterone (ng/dL or nmol/L), free testosterone, SHBG, estradiol and age, each set against cited lines (Labcorp's adult male range 264-916 ng/dL, the FDA testosterone labels' normal range from 300 ng/dL, the EMAS study's 11 nmol/L and 64 pg/mL free testosterone), with free testosterone calculated from total and SHBG by Vermeulen's formula when not measured. Returns each line with its standing and source, the diagnosis rule in the sources' words (two morning tests below the normal range, with symptoms), and the cheapest online TRT clinics with what each says it requires and its TRTcompare.co page. Use it for 'is 300 testosterone low', 'what does my testosterone level mean', 'free testosterone calculator'. It does not diagnose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age in years.",
                "type": "integer"
              },
              "estradiol": {
                "description": "Estradiol.",
                "type": "number"
              },
              "estradiol_unit": {
                "description": "Unit of estradiol. Defaults to pg/mL.",
                "enum": ["pg/mL", "pmol/L"],
                "type": "string"
              },
              "free": {
                "description": "Measured free testosterone, if any.",
                "type": "number"
              },
              "free_unit": {
                "description": "Unit of free testosterone. Defaults to pg/mL.",
                "enum": ["pg/mL", "ng/dL", "pmol/L"],
                "type": "string"
              },
              "shbg": {
                "description": "SHBG in nmol/L.",
                "type": "number"
              },
              "total": {
                "description": "Total testosterone.",
                "type": "number"
              },
              "total_unit": {
                "description": "Unit of total testosterone. Defaults to ng/dL.",
                "enum": ["ng/dL", "nmol/L"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
