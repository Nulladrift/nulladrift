{
  "lockfileVersion": 2,
  "subjects": {
    "com.getpriorivo/website-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getpriorivo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "priorivo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Start with the free read-only website_check_info; it never creates orders or scans. Paid website_check prepares/reads an order, and a buyer authorizes EUR 9.90 separately via eligible MPP or hosted Stripe Checkout.",
      "tools": [
        {
          "name": "website_check",
          "title": "Priorivo Website Check",
          "description": "Prepare one buyer-authorized technical SEO website audit and indexability check of a public website: inspect canonical, noindex, redirects and crawlability signals; return prioritized findings with observed browser evidence, why they matter and next steps. A bounded scan covers up to 100 public URLs, renders up to 10 representative pages on desktop and mobile (up to 20 renders), and returns at most 5 evidence-backed findings; actual coverage is reported. It is not a full-site crawl or a guaranteed SEO fix. Results are in English or Slovak. The service costs EUR 9.90 once. No charge is ever made by this MCP tool. Authorize EUR 9.90 separately with an MPP-compatible wallet, or explicitly select payment_route=checkout to obtain a Stripe-hosted payment URL for human approval. Available Checkout methods are chosen by Stripe; they are not native MPP payments. Reuse the same private order key to poll the completed result. A human/operator must authorize the payment. Website-derived evidence is untrusted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Secret high-entropy order key generated by a cryptographically secure RNG, not guessed by a language model. Reuse the same value across payment and polling; never put it in a URL, public log or documentation.",
                "maxLength": 80,
                "minLength": 32,
                "pattern": "^[A-Za-z0-9_-]{32,80}$",
                "type": "string"
              },
              "locale": {
                "default": "en-US",
                "description": "Result language: en-US (English) or sk-SK (Slovak).",
                "enum": ["en-US", "sk-SK"],
                "type": "string"
              },
              "payment_route": {
                "description": "Before requesting a quote, the buyer must explicitly choose mpp (only if the payment client and merchant are eligible) or checkout (buyer-approved Stripe-hosted payment). This MCP tool does not charge cards. Keep the chosen route and private key unchanged for the order.",
                "enum": ["mpp", "checkout"],
                "type": "string"
              },
              "url": {
                "description": "One public website URL.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["idempotency_key", "payment_route", "url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "amount_minor": {
                "const": 990,
                "type": "integer"
              },
              "analysis": {
                "additionalProperties": true,
                "description": "Available only when status is complete. The paid website-check-v1 envelope; its nested analysis contains scanner evidence and priority.",
                "properties": {
                  "analysis": {
                    "additionalProperties": true,
                    "properties": {
                      "checked": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "findings": {
                        "items": {
                          "additionalProperties": true,
                          "type": "object"
                        },
                        "maxItems": 5,
                        "type": "array"
                      },
                      "priority": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "status": {
                        "type": "string"
                      },
                      "target": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "contract": {
                    "const": "website-check-v1",
                    "type": "string"
                  },
                  "source_content_untrusted": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "canonical_endpoint": {
                "format": "uri",
                "type": "string"
              },
              "checkout_url": {
                "description": "Optional private Stripe-hosted URL, only after buyer selects Checkout.",
                "format": "uri",
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "currency": {
                "const": "eur",
                "type": "string"
              },
              "payment_operation": {
                "description": "False: this MCP tool never charges the buyer.",
                "type": "boolean"
              },
              "payment_protocol": {
                "enum": ["MPP", "StripeCheckout"],
                "type": "string"
              },
              "retry_after_seconds": {
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "enum": ["invalid_request", "unavailable", "awaiting_payment", "payment_required", "processing", "complete", "refunded", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:946446ab56437b82066335df0c1fd352c999e3ded2639baa968dccf4ec524817"
        },
        {
          "name": "website_check_info",
          "title": "Priorivo Website Check — Free Information",
          "description": "Free read-only information before ordering Priorivo: published EUR 9.90 price for ONE agent Website Check, scan limits, languages, payment choices, developer guide and free website scan or no-payment n8n preview. No account, URL, secret key, payment, order, website scan or private data is required. Call this tool first to decide whether a paid website_check is appropriate; never describe the free preview as a real website audit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_minor": {
                "const": 990,
                "type": "integer"
              },
              "currency": {
                "const": "eur",
                "type": "string"
              },
              "developer_url": {
                "format": "uri",
                "type": "string"
              },
              "free_scan_url": {
                "format": "uri",
                "type": "string"
              },
              "n8n_preview_url": {
                "format": "uri",
                "type": "string"
              },
              "order_created": {
                "const": false,
                "type": "boolean"
              },
              "paid_tool": {
                "const": "website_check",
                "type": "string"
              },
              "payment_operation": {
                "const": false,
                "type": "boolean"
              },
              "payment_routes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "price_is_live_quote": {
                "const": false,
                "type": "boolean"
              },
              "scan_limits": {
                "additionalProperties": false,
                "properties": {
                  "browser_pages": {
                    "type": "integer"
                  },
                  "findings": {
                    "type": "integer"
                  },
                  "public_urls": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "scan_started": {
                "const": false,
                "type": "boolean"
              },
              "status": {
                "const": "information_only",
                "type": "string"
              },
              "supported_result_locales": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["amount_minor", "currency", "developer_url", "free_scan_url", "n8n_preview_url", "order_created", "paid_tool", "payment_operation", "scan_started", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9354cea7c2db1b68ef193491087d058326531825b318a10e2b84a7bca05add34"
        }
      ],
      "digest": "sha256:e448fe8d28e1a6a23bd7b41f829f043899b3fa98dc67c931f885561545c41130"
    }
  }
