                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "natalChart": {
                "description": "Optional natal chart data to compare transits against",
                "properties": {
                  "date": {
                    "description": "Date in YYYY-MM-DD format. A single-digit month or day is accepted and zero-padded (2026-3-5 becomes 2026-03-05). Impossible calendar dates are rejected. Calculations that read planetary positions support 1550-01-02 to 2650-01-22; outside that span they answer 400 with code date_out_of_range, and a calculation that reads a window around the date (a sunrise search, a run of days) may answer the same 400 for a date within a few days of either end.",
                    "example": "1990-07-15",
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "description": "Natal birth latitude in decimal degrees, positive north. Sets the local sidereal time behind the natal Ascendant and house cusps that the transits are measured against.",
                    "example": 40.7128,
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Natal birth longitude in decimal degrees, positive east and negative west. Example: New York -74.0060, London -0.1276, Sydney 151.2093.",
                    "example": -74.006,
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "time": {
                    "description": "Time in 24-hour format. Seconds are optional and default to 00 (14:30 becomes 14:30:00); a single-digit hour is zero-padded. Out-of-range values are rejected.",
                    "example": "14:30:00",
                    "format": "time",
                    "type": "string"
                  },
                  "timezone": {
                    "anyOf": [
                      {
                        "maximum": 14,
                        "minimum": -14,
                        "type": "number"
