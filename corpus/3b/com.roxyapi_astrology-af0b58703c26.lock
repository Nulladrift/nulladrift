                "items": {
                  "enum": ["CONJUNCTION", "OPPOSITION", "TRINE", "SQUARE", "SEXTILE", "SEMI_SEXTILE", "QUINCUNX", "SEMI_SQUARE", "SESQUIQUADRATE"],
                  "type": "string"
                },
