          "name": "post_astrology_solar_arc",
          "title": "Solar arc directions calculator - directed chart at one degree per year",
          "description": "Calculate a solar arc directed chart for any birth moment and target date. The solar arc is the secondary-progressed Sun longitude minus the natal Sun longitude, about one degree for each year of life, and every natal point including the Ascendant and Midheaven is advanced forward by that same arc. Returns the solar arc, each directed point with its natal and directed longitude, zodiac sign, degree, and a plain language interpretation, for predictive astrology apps timing major life events. Built on accurate tropical chart positions, no astronomy expertise needed.",
          "inputSchema": {
            "examples": [
              {
                "date": "1990-07-15",
                "latitude": 40.7128,
                "longitude": -74.006,
                "targetDate": "2025-07-15",
                "time": "14:30:00",
