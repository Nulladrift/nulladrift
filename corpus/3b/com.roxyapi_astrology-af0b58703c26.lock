        {
          "name": "post_astrology_transit_aspects",
          "title": "Transit Aspects - Detailed transit-to-natal aspect analysis with interpretations",
          "description": "Calculate all transit-to-natal aspects with detailed interpretations, strength ratings, and timing guidance. Compares current (or future) planetary positions against your natal chart to identify active transits. Returns aspect type, orb, applying/separating status, narrative interpretation, impact rating, and practical guidance for each transit. Like /astrology/transits with a natalChart, returns summary, timing, impact, guidance, and keywords for each aspect. Adds planet, aspect-type, and minStrength filtering plus summary.strongest and summary.byType rollups. Transit aspects API, transit-to-natal analysis, predictive astrology, personalized transit forecast.",
          "inputSchema": {
            "examples": [
              {
                "natalChart": {
                  "date": "1990-07-15",
                  "latitude": 40.7128,
                  "longitude": -74.006,
                  "time": "14:30:00",
                  "timezone": "America/New_York"
                }
              }
            ],
            "properties": {
              "aspectTypes": {
                "description": "Filter to specific aspect types (conjunction, opposition, trine, square, sextile, etc.). Omit to include all aspect types.",
