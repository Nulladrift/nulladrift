{
  "lockfileVersion": 2,
  "subjects": {
    "com.craftedtrust/mcp-shield": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.craftedtrust.com/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "CraftedTrust",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_trust",
          "description": "Look up the trust score for any MCP server by URL or npm package name. Returns score, grade, findings summary, and certification status.",
          "inputSchema": {
            "properties": {
              "npm_name": {
                "description": "The npm package name to look up",
                "type": "string"
              },
              "server_url": {
                "description": "The MCP server URL to look up",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b37da13b499397982e165fa4c2095f7777675556ac62c9ed3fc7c54816694e6f"
        },
        {
          "name": "get_stats",
          "description": "Get CraftedTrust ecosystem statistics: total indexed servers, live verified count, average trust scores, flagged count, and more.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20347d5c043c69786a26cd4710d18e16e23a7c8f46c9e6a2bde1f6b1e298add8"
        },
        {
          "name": "scan_server",
          "description": "Trigger a live trust scan of an HTTP or HTTPS MCP server. Returns trust score, grade, and security findings.",
          "inputSchema": {
            "properties": {
              "server_url": {
                "description": "The HTTP/HTTPS MCP server URL to scan",
                "type": "string"
              }
            },
            "required": ["server_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f81a17daf5a4ada22609e6a375237e43b04b57235f0d999c2b3bdb5b8da1839e"
        },
        {
          "name": "search_registry",
          "description": "Search the CraftedTrust registry overlay for indexed MCP packages and servers. Filter by grade, certification, or scan type.",
          "inputSchema": {
            "properties": {
              "certified": {
                "description": "Filter to certified servers only. Default: show all",
                "enum": ["true", "standard", "premium"],
                "type": "string"
              },
              "grade": {
                "description": "Filter by letter grade. Default: show all",
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-50). Default: 10",
                "type": "number"
              },
              "query": {
                "description": "Search term (name, URL, publisher)",
                "type": "string"
              },
              "scan_type": {
                "description": "Filter by scan type. Default: all",
                "enum": ["live", "static", "combined", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc0d6d66094483150ea75636b4497a82b0f9c827b853fea1678af01f5435b62b"
        }
      ],
      "digest": "sha256:4506f22e33bddba503ee2a7dfe6b903379dcbb71706cb5789eafb465b2d88059"
    }
  }
}
