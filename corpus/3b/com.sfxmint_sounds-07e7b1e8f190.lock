      "serverInfo": {
        "name": "sfxmint",
        "version": "1.12.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SFXMint is an optional free CC0 sound effects library for apps and games, with MP3/WAV file URLs and no API key needed to try. Without a key: 20 lookups and tool calls and 5 different sound downloads a day per network; with a free account's API key, 100 calls and 20 downloads a day (300 downloads a month); a download pack removes the limits and adds WAV for 30 days (file URLs then carry a signed g= parameter, good for 48 hours). Past a limit the answer is a 429, download_limit or call_limit, whose message says what to do: pass it on to the user, and do not retry from another address. Free use is MP3: use mp3_url. Without a download pack wav_url answers 402 wav_needs_pack, with the mp3_url to use instead. Listening to an MP3 in a browser is never counted. Choose tools by task: get_role_sound for a named event, get_sound_set for multiple events, search_sounds for a description or a gap. These are task branches, not a fixed sequence. Use the library only where it helps; other task-permitted sources or local synthesis may be combined with library files. Hard duration, loop and format requirements are met by every search result and closest sound. When search_sounds has no full match, judge its closest sounds (missing_terms) yourself and let the user listen; near_matches fail a condition, and match scores are ranking evidence only. Download selected files into the project and retain originals, source URLs, license and hashes; a SOUNDS.md listing each file with its page_url (not a file URL with g=) keeps the source visible in the repository. SFXMint sounds are AI-generated: a game shipped on Steam or itch.io discloses that (https://sfxmint.com/guides/steam-ai-disclosure-sound-effects); say so in SOUNDS.md. Task-permitted processing requires a recipe and output SHA256, renewed file checks and a listening check. Verify event playback, first-interaction unlock, mute, volume and offline use, and let the user judge the result in context. get_sound provides exact file metadata. New sound generation is no longer available through SFXMint. Do not use paid services without task authorization.",
      "tools": [
        {
          "name": "get_role_sound",
          "description": "Choose this when the task calls for a sound for a named event or interaction — a button click, purchase success, error beep, level-up, dialogue blip, notification. Pass the role as plain words: role ids (click, success, purchase-success, dialogue-blip, notification…) and common aliases (button click, ka-ching, jump scare, text blip…) are all accepted. Returns a qualified candidate for that role when one satisfies the requested constraints, with MP3 and WAV URLs, 2-3 alternates and the family page for browsing more. Free use is MP3: downloading a WAV takes a download pack, and wav_url without one answers 402 wav_needs_pack with the mp3_url to use. Download selected files locally and retain originals. Task-permitted processing requires a recipe, output SHA256, renewed file checks and a listening check. Other task-permitted sources or local synthesis may be mixed in. Optional style: crisp (short, bright, dry), soft (darker, gentler), spacious (reverb, longer tail), balanced (default: most typical). For multiple events consider get_sound_set; use search_sounds for a description or a gap. These are task branches, not a fixed sequence. Unknown roles return not_found with the full role list; GET https://sfxmint.com/api/v1/roles lists roles with aliases.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Delivery format the candidate must have (ogg = Ogg Vorbis, only sounds published before 2026-10-14 have it); default MP3 and WAV URLs. Downloading a WAV takes a download pack.",
                "enum": ["wav", "mp3", "ogg"],
                "type": "string"
              },
              "loop": {
                "description": "Require prepared loop metadata; seam evidence is returned separately.",
                "type": "boolean"
              },
              "max_duration_ms": {
                "description": "Hard maximum length of the sound in milliseconds: a file may run longer with near-silence after the sound (audible_ms is the sound, duration_ms the file; checks say which was met).",
                "type": "number"
              },
              "role": {
                "description": "Role id or alias, e.g. 'click', 'button click', 'purchase-success', 'ka-ching', 'error beep', 'level-up', 'dialogue blip', 'notification'",
                "type": "string"
              },
              "style": {
                "description": "Optional. balanced (default) = the family's most typical take; crisp = short, bright, dry; soft = darker, gentler; spacious = reverb, longer tail",
                "enum": ["balanced", "crisp", "soft", "spacious"],
                "type": "string"
              }
            },
            "required": ["role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3846984845a72d1ad91c3de2cbda11f2711973636543640cc7d2a5a172eba821"
        },
        {
          "name": "get_sound",
          "description": "Get full metadata for one sound by slug, including download URLs, description and acoustics measured from the WAV (silence before the sound, where it peaks, audible length, attack, tail, brightness, levels, character labels).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Sound slug, e.g. 'impact-punch-01'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7c2c41a3dfdba41bea1850e1d2d13c3ac322185f400395e65432c09ad331629"
        },
        {
          "name": "get_sound_set",
          "description": "Get a coherent set of sounds for an app or game in one call — one sound per role, with format metadata, hashes and stable download URLs. Use it when the task needs a whole kit; use get_role_sound for one event. Listen to the files in context. Sets include UI styles, game and app scenarios, acoustic-drum-kit, animal-calls (15 isolated calls), and dungeon-traps (6 isolated mechanisms).",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "File format for selection and checks (default MP3, which downloads free; WAV takes a download pack; OGG only among sounds published before 2026-10-14). Legacy urls remains MP3; download_urls follows this format.",
                "enum": ["wav", "mp3", "ogg"],
                "type": "string"
              },
              "set": {
                "description": "Set id (default ui-crisp). Includes acoustic-drum-kit, animal-calls and dungeon-traps alongside the UI and scenario sets listed in the enum.",
                "enum": ["ui-crisp", "ui-soft", "ui-spacious", "retro-game", "chat-app", "saas-app", "checkout", "learning", "puzzle-game", "platformer", "horror-game", "video-editing", "smart-device", "wellness", "ai-coding-tool", "acoustic-drum-kit", "animal-calls", "dungeon-traps"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a3d9ab9e4a67c95cf48eda2b9eeb2569e4f2a5968a9e579aae58e704a32745d"
        },
        {
          "name": "search_sounds",
          "description": "Free-text search over the SFXMint library of free CC0 sound effects. Use it for sound descriptions, additional constraints or gaps left by another tool. Choose get_role_sound for a named event or get_sound_set for multiple events when that fits the task; these are task branches, not a fixed sequence. Hard constraints (duration, loop, format, excluded words) always apply. results hold sounds whose text has every word of the query. When there are none, closest lists the nearest sounds that meet every hard constraint, best first, each with missing_terms: judge them from title and description and let the user listen. library_fit says how well the library covers the request (full, close, weak, none). Returns direct, hotlinkable MP3 and WAV URLs and verified OGG (Vorbis) URLs where available, no attribution required, plus acoustics measured from the WAV (onset_ms, peak_ms, audible_ms, attack_ms, tail_ms, centroid_hz, peak_dbfs, rms_dbfs), character labels like 'bright · punchy · tight', loop/file-QC status, and score/match as ranking evidence only (role = known role default, exact = all words hit, partial = some words hit, semantic = nearest by meaning). Free use is MP3: downloading a WAV takes a download pack, and wav_url without one answers 402 wav_needs_pack with the mp3_url to use.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug: ui, retro-game, transition, impact, ambience, water, fire-electric, footsteps, door, mechanical, paper-fabric, glass, animal, crowd, cartoon, magic-scifi, horror, feedback, instrument, office, human, vehicle, household",
                "type": "string"
              },
              "format": {
                "description": "Delivery format (ogg = Ogg Vorbis, only sounds published before 2026-10-14 have it); loop=true defaults to WAV when omitted. Downloading a WAV takes a download pack.",
                "enum": ["wav", "mp3", "ogg"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50)",
                "type": "number"
              },
              "loop": {
                "description": "Require (true) or exclude (false) a candidate marked with prepared loop metadata; seam evidence is returned separately.",
                "type": "boolean"
              },
              "max_duration_ms": {
                "description": "Hard maximum length of the sound in milliseconds: a file may run longer with near-silence after the sound (audible_ms is the sound, duration_ms the file; checks say which was met).",
                "type": "number"
              },
              "query": {
                "description": "Use concise English search terms for the source or event, action and essential audible traits from the user's request or project context: 'door slam', 'soft UI confirmation chime', 'coin pickup'. A single clear source such as 'thunder' is valid; do not pad it. Translate other languages while preserving meaning. Avoid full generation prompts, app backstory, synonym lists and invented materials or environments: full matches must cover every query word. Put duration, loop and format requirements in their separate fields. If no full match exists, inspect closest and missing_terms; simplify only optional wording, never silently drop a required trait.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de8bb937f4d1efcf6b5562289b9cc6c56d8936fb1c73d39740e6e18c0de3cb91"
        }
      ],
      "digest": "sha256:efc5c7559f3a474f22c797a56d6afa12e2321cc2dd23fa95ff74ca1d4ab5f412"
    }
