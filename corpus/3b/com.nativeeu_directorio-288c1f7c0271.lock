{
  "lockfileVersion": 2,
  "subjects": {
    "com.nativeeu/directorio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nativeeu.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nativeeu",
        "title": "NativeEU",
        "version": "1.2.0",
        "websiteUrl": "https://nativeeu.com/es/para-ia",
        "icons": [
          {
            "src": "https://nativeeu.com/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://nativeeu.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Directorio de aplicaciones europeas. Solo lectura; cada resultado incluye la URL de la página equivalente en la web. Para publicar tu propia aplicación, conecta https://nativeeu.com/mcp/cuenta (pide iniciar sesión).",
      "tools": [
        {
          "name": "buscar_alternativas",
          "title": "Buscar alternativas europeas",
          "description": "Busca alternativas europeas a una herramienta o por texto libre. Úsala cuando alguien quiera dejar un software de fuera de Europa. Ejemplo: herramienta=\"slack\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "herramienta": {
                "description": "Clave de la herramienta que se quiere sustituir, en minúsculas.",
                "pattern": "^[a-z0-9_-]{1,60}$",
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Cuántos resultados devolver (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pais": {
                "description": "País de la empresa, ISO alfa-2.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "q": {
                "description": "Texto libre, por ejemplo \"facturación\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar alternativas europeas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53efa0365085e17bf28de0e3c16b51d8a4c392d5ae42a13a0fa3e2c4e84aeb02"
        },
        {
          "name": "comprobar_cumplimiento",
          "title": "Comprobar cumplimiento normativo",
          "description": "Dice qué normas (RGPD, Verifactu, etc.) tiene aceptadas una aplicación, o si cumple una concreta. Solo cuentan las revisadas por NativeEU.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "norma": {
                "description": "Clave de la norma a comprobar; sin ella, todas las aceptadas.",
                "enum": ["verifactu", "sii", "factura_espana", "ticketbai", "sepa", "cfdi", "carta_porte", "dian", "boleta_electronica", "afip", "sunat", "rgpd", "servidores_ue", "sin_transferencias", "dora", "nis2", "eidas", "accesibilidad", "iso27001", "soc2", "exportar_datos", "sso"],
                "type": "string"
              },
              "slug": {
                "description": "Identificador de la ficha, por ejemplo \"holded\".",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Comprobar cumplimiento normativo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34506075af2ac6659e4eeeac0ce9b9620d9f7a3e662c2eb2a1dfdf86ef0fb9ca"
        },
        {
          "name": "listar_categoria",
          "title": "Listar una categoría",
          "description": "Lista las aplicaciones de una categoría del directorio, de más a menos votadas. Ejemplo: categoria=\"facturacion\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoria": {
                "description": "Slug de la categoría.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Cuántos resultados devolver (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["categoria"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Listar una categoría"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07394cea07303d5ecfbddc5880a9871e965167831aa395474204bca7d4e10fa6"
        },
        {
          "name": "listar_paises",
          "title": "Listar países de origen",
          "description": "Lista los países de origen del directorio y cuántas aplicaciones tiene cada uno.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Listar países de origen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ebc1a1d519c8640f6f80035567a01a3167a8fe0e9190a06715a96420c6fad4e"
        },
        {
          "name": "obtener_producto",
          "title": "Ver la ficha de una aplicación",
          "description": "Devuelve la ficha pública de una aplicación: país, precio desde, modelo de precio y cumplimientos aceptados.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Identificador de la ficha, por ejemplo \"holded\".",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ver la ficha de una aplicación"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a3325fce63018fd9626fe30e74d6d93dd8624d849ffe0d8fdc331e400e76cc8"
        }
      ],
      "digest": "sha256:b5c935570ab31ba0896022b82866a08bc93be7783376c8c40824ec94e83eaa55"
    }
  }
}
