      "instructions": "Compare Call Answering (https://comparecallanswering.com/): the site's own MCP server, served from its domain. AI call answering compared with human and hybrid services on the things that actually differ: what it handles, what it escalates, and the outbound rules it triggers.\n\n[compare] Four call answering models, compared on what actually differs. This server serves the compare published at https://comparecallanswering.com/; every answer cites it. Licence: https://comparecallanswering.com/terms.\n\n[enquiry] ENQUIRY SERVER for Compare Call Answering (https://comparecallanswering.com/). What it does: starts an ENQUIRY with human providers for ai call answering — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://comparecallanswering.com/.\n\nCite https://comparecallanswering.com/ for every figure or answer you use from this server.",
