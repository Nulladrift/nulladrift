          "digest": "sha256:39ead0782046a6a26dc34bd34781bc20daa7ac885efe9bdc7dd13e14cefe602e"
        },
        {
          "name": "get_directions",
          "title": "Directions",
          "description": "Driving, walking or cycling directions between places: distance, travel time and turn-by-turn steps, with a link that opens the route on Mappit's map. Each end can be a town, a business or landmark (\"Pike Place Market\"), a street address, or \"lat,lon\". Routing © openrouteservice.org by HeiGIT; map data © OpenStreetMap contributors.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Where the trip starts: a place name, a business or landmark, a street address, or \"lat,lon\".",
                "type": "string"
              },
              "mode": {
                "default": null,
                "description": "One of: driving (default), walking, cycling.",
                "type": ["string", "null"]
              },
              "steps": {
                "default": null,
                "description": "How many turn-by-turn steps to return: default 25, at most 80; 0 for none.",
                "type": ["integer", "null"]
              },
              "to": {
                "description": "Where it ends, in any of the same forms.",
                "type": "string"
              },
              "via": {
                "default": null,
                "description": "Stops on the way, in order (at most 8), in any of the same forms.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Directions"
          },
