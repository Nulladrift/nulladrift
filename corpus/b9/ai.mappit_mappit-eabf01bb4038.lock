        {
          "name": "get_location",
          "title": "Place profile",
          "description": "A place's profile on Mappit, for what a place is and who covers it: its written overview (geography, economy, recent history), its five latest stories, the storylines active here in the last 72 hours, the publishers that covered it in the last 30 days, live news radio and TV nearby, S&P 500 companies headquartered there, and current conditions. Use for \"tell me about Fort Sumner\" or \"who covers the news in Boise?\". For what's happening there now (the ranked news), use whats_happening.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": null,
                "description": "\"brief\" (default: the overview clipped) or \"full\" (the whole overview).",
                "type": ["string", "null"]
              },
              "include": {
                "default": null,
                "description": "Sections to include, any of: about, stories, threads, sources, radio_tv, stocks, conditions. Default: about, stories, threads, sources.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "place": {
                "description": "The place: a name (\"Boise\", \"Portland, Maine\"), a place id, or \"lat,lon\" (the nearest Mappit place answers).",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Place profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6bdf51eaedf5c31f3c461bb907dedbf51b845075fe530c23ec37f7241c2537a"
        },
        {
          "name": "get_map_layer",
          "title": "Map layer",
          "description": "One of Mappit's live map layers, for a place or the whole world: earthquakes (USGS), wildfires (NASA FIRMS), air_quality and weather (Open-Meteo), history (events on this day in past years), stocks (S&P 500 companies by headquarters), events (public event pins) and radio_tv (live news radio and TV streams). For the whole world, air quality lists the worst readings first and weather the hottest.",
          "inputSchema": {
            "properties": {
              "date": {
                "default": null,
                "description": "For history and stocks: a date like \"2026-09-28\" (history uses its month and day). Default today.",
                "type": ["string", "null"]
              },
              "layer": {
                "description": "One of: earthquakes, wildfires, air_quality, weather, history, stocks, events, radio_tv.",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "How many: default 20, at most 50.",
                "type": ["integer", "null"]
              },
              "place": {
                "default": null,
                "description": "Where: a place name, place id, country or \"lat,lon\". Omit for the whole world.",
                "type": ["string", "null"]
              },
              "radius_km": {
                "default": null,
                "description": "Around a place, how far to look in km. Default 100.",
                "type": ["number", "null"]
              }
            },
            "required": ["layer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Map layer"
