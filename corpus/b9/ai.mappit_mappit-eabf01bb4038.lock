        {
          "name": "search_mappit",
          "title": "Search Mappit",
          "description": "Search Mappit by words or meaning. mode \"keyword\" (default) matches words in stories, storylines, places, businesses, public pins and public collections. mode \"semantic\" finds stories and storylines about an idea even when the words differ, e.g. \"tenants organizing against rent increases\". Reads the whole archive unless given a window; optionally limit to one place. For the latest news in a place, use whats_happening.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": null,
                "description": "Results per kind: default 10, at most 25.",
                "type": ["integer", "null"]
              },
              "mode": {
                "default": null,
                "description": "\"keyword\" (default) or \"semantic\" (by meaning; stories and storylines only).",
                "type": ["string", "null"]
              },
              "place": {
                "default": null,
                "description": "Only results at this place (a place name, id or \"lat,lon\").",
                "type": ["string", "null"]
              },
              "q": {
                "description": "What to look for.",
                "type": "string"
              },
              "types": {
                "default": null,
                "description": "Which kinds of result: any of \"stories\", \"threads\", \"locations\", \"places\" (businesses), \"pins\", \"collections\". Default: stories, threads and locations.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "window": {
                "default": null,
                "description": "How far back: \"24h\", \"72h\", \"7d\" or \"30d\" (any number of hours or days up to 30 days). Default: no limit (the whole archive).",
                "type": ["string", "null"]
              }
            },
            "required": ["q"],
            "type": "object"
          },
