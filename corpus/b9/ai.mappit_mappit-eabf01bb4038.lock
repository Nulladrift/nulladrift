        {
          "name": "list_stories",
          "title": "List stories",
          "description": "Page through Mappit's stories for a place, a country or the whole world, newest first (or sort \"trending\" for Mappit's ranking). Use for \"all the news from Kyiv this week\", \"more stories\" after whats_happening, or stories on one topic. Filters: time window, topic, language, and source \"crawler\" for stories Mappit's own crawler read from the publishers. Returns a cursor for the next page. To find stories by words or meaning, use search_mappit.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "default": null,
                "description": "The cursor from the previous page, exactly as returned.",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "ISO 639-1 language code, or omit for every language.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": null,
                "description": "Stories per page: default 20, at most 50.",
                "type": ["integer", "null"]
              },
              "place": {
                "default": null,
                "description": "Where: a place name, place id, country, US state or \"lat,lon\". Omit for the whole world.",
                "type": ["string", "null"]
              },
              "sort": {
                "default": null,
                "description": "\"newest\" (default) or \"trending\" (Mappit's ranking; no cursor).",
                "type": ["string", "null"]
              },
              "source": {
                "default": null,
                "description": "\"any\" (default) or \"crawler\" (only stories Mappit's crawler read from the publishers themselves).",
                "type": ["string", "null"]
              },
              "topic": {
                "default": null,
                "description": "A topic slug or name (\"science\", \"World & Conflict\"); several separated by commas.",
                "type": ["string", "null"]
              },
              "window": {
                "default": null,
                "description": "How far back: \"24h\", \"72h\", \"7d\" or \"30d\" (any number of hours or days up to 30 days). Default: 72h, as in whats_happening.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
