        {
          "name": "whats_happening",
          "title": "What's happening",
          "description": "Use first for the news in a place or the world: \"What's happening in Seattle?\", \"Any news near Lagos?\", \"What's the biggest news today?\", \"What's going on in France this week?\". Returns Mappit's ranking of the top stories (as on the map, each placed where it happened), the storylines running through the area, live conditions (earthquakes, air quality, weather) and a short profile of the place. Each story links to the publisher's article (source_url) and to Mappit (url). For what a place is rather than its news (its overview, publishers, radio and TV, companies), use get_location.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": null,
                "description": "\"brief\" (default: 8 stories, 5 storylines) or \"full\" (15 stories and 10 storylines, with summaries).",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "Only stories in this language (ISO 639-1, e.g. \"en\"). Default: every language.",
                "type": ["string", "null"]
              },
              "place": {
                "default": null,
                "description": "Where: a place name (\"Seattle\", \"Portland, Maine\", \"Washington State\"), a country (\"France\", \"FR\"), or \"lat,lon\" (e.g. \"47.61,-122.33\"). Omit for the whole world.",
                "type": ["string", "null"]
              },
              "radius_km": {
                "default": null,
                "description": "Around a place or point, how far to look in km. Default 40 (a state: the whole state).",
                "type": ["number", "null"]
              },
              "topic": {
                "default": null,
                "description": "Only stories on these topics: a topic slug or name such as \"world-conflict\" or \"Science\"; several separated by commas. get_mappit_info lists them.",
                "type": ["string", "null"]
              },
              "window": {
                "default": null,
                "description": "How far back: \"24h\", \"72h\", \"7d\" or \"30d\" (any number of hours or days up to 30 days). Default: 72h.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
