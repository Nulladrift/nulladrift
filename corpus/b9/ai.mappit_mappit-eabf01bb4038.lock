        {
          "name": "rank_regions",
          "title": "Rank regions",
          "description": "Countries, US states, US counties or congressional districts ranked by one indicator from Mappit's Map Apps data, for the latest or a given period, optionally within a country, a US state or a continent. Each value carries its period; the answer names the source and licence. Indicator codes come from list_map_apps; a news topic share is \"news_topic_share:<topic>\" (or pass topic).",
          "inputSchema": {
            "properties": {
              "indicator": {
                "description": "An indicator code from list_map_apps, e.g. \"unemployment_rate\" or \"news_topic_share:crime-safety\".",
                "type": "string"
              },
              "level": {
                "description": "One of: country, state, county, cd119, cd120 (congressional districts on the 2024 and 2026 lines).",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "How many: default 10, at most 50.",
                "type": ["integer", "null"]
              },
              "order": {
                "default": null,
                "description": "\"desc\" (highest first, the default) or \"asc\".",
                "type": ["string", "null"]
              },
              "period": {
                "default": null,
                "description": "A period like \"2024\", \"2026-08\" or \"2026-08-15\". Default: the latest.",
                "type": ["string", "null"]
              },
              "topic": {
                "default": null,
                "description": "For news_topic_share only: the topic slug from list_map_apps (\"crime-safety\"), when indicator does not carry it.",
                "type": ["string", "null"]
              },
              "within": {
                "default": null,
                "description": "Optional scope: a country (\"United States\"), a US state (for counties or districts) or a continent (\"Africa\").",
                "type": ["string", "null"]
              }
            },
            "required": ["indicator", "level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
