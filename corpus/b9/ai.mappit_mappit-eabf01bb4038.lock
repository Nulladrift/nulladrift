        {
          "name": "get_statistic",
          "title": "Statistic for a place",
          "description": "One statistic for one country, US state, US county or congressional district from Mappit's Map Apps data (World Bank, BLS, BEA, Census, CDC, UCDP, UNHCR, FEC, MIT Election Lab and more): the value with its period, its rank, the US figure, the source and licence, and the recent series. Indicator codes come from list_map_apps; a news topic share is \"news_topic_share:<topic>\" (or pass topic).",
          "inputSchema": {
            "properties": {
              "indicator": {
                "description": "An indicator code from list_map_apps, e.g. \"unemployment_rate\", \"gdp_per_capita_ppp\", \"pres_margin\", \"news_topic_share:world-conflict\".",
                "type": "string"
              },
              "period": {
                "default": null,
                "description": "A period like \"2024\", \"2026-08\" or \"2026-08-15\". Default: the latest.",
                "type": ["string", "null"]
              },
              "place": {
                "description": "A country, US state, US county (\"Travis County, TX\") or district (\"TX-07\"), or a region key (\"FR\", \"US-TX\").",
                "type": "string"
              },
              "topic": {
                "default": null,
                "description": "For news_topic_share only: the topic slug from list_map_apps (\"world-conflict\"), when indicator does not carry it.",
                "type": ["string", "null"]
              }
            },
            "required": ["indicator", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Statistic for a place"
