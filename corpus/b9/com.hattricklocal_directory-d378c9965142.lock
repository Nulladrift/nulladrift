      },
      "serverInfo": {
        "name": "com.hattricklocal/directory",
        "title": "Hat Trick Local Directory",
        "version": "1.0.1",
        "websiteUrl": "https://hattricklocal.com/developers",
        "icons": [
          {
            "src": "https://hattricklocal.com/brand/png/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://hattricklocal.com/brand/png/favicon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://hattricklocal.com/brand/svg/htl-icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hat Trick Local is a public directory of US youth sports clubs and local sports stores (Ohio and Pennsylvania first; the listings today are soccer clubs and soccer stores). Use search_clubs or search_stores to find listings (a vague or misspelled name returns candidates), get_club or get_store for one listing with its current registration windows, fees and tryouts and their sources, and list_registration_windows for what is open or opening in a state. Every fact says how and when it was verified: 'observed' means seen on the organization's own site, not confirmed by it; null means unknown. Cite: \"Youth soccer club data: Hat Trick Local - https://hattricklocal.com/soccer/directory-data\". The create_*_link tools return links to hand the person; never open them to submit, pay, register or claim for the person. No player, family, roster or order data is available here.",
      "tools": [
        {
          "name": "create_claim_link",
          "title": "Claim link",
          "description": "A link to hand a person who runs a club or store, so they can claim its free listing. Opening it changes nothing: the person fills in and sends the claim on the page. If the listing is already claimed, the person can still send a claim and Hat Trick Local reviews it. Never open the link to submit for the person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "org_key": {
                "description": "The club or store's org_key from a search (an older key or a plain slug also works).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["org_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Claim link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:395d9fa66f4f0b0bddd85bdb643d677f93deaf5daa93c57fd1ee772b024121f5"
        },
        {
          "name": "create_correction_link",
          "title": "Correction link",
          "description": "A link to hand a person who found something wrong in a listing. It opens the listing with the correction form open (field preselects what is wrong); the person writes and sends it, and Hat Trick Local reviews it before anything changes. Never submit for the person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "field": {
                "description": "What is wrong, so the form opens with it chosen.",
                "enum": ["name", "website", "city", "email_public", "phone_public", "description", "remove_listing"],
                "type": "string"
              },
              "org_key": {
                "description": "The listing's org_key from a search.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["org_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Correction link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd56fed6084a44bcce038509bba2cdef34d2d2b57ce73ff48dd5b0927f8e0019"
        },
        {
          "name": "create_shop_link",
          "title": "Shop link",
          "description": "A link to where a club or store sells online through Hat Trick Local (a club's team store or a store's online ordering). Many listings do not sell online; the answer then says so and gives the listing's page. The person chooses and pays there; never order or pay for them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "org_key": {
                "description": "The club or store's org_key from a search (an older key or a plain slug also works).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["org_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shop link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f0186a96c109395b1f3d7d812d56692420e30d52b0e0d17593219aad71debaa"
        },
        {
          "name": "get_club",
          "title": "Get a club",
          "description": "One club's full listing: contacts, programs, locations, and its current season records (registration windows, fees and tryouts, each with its source link and how it was verified), plus its club website, shop link and action links when it has them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "org_key": {
                "description": "The club's org_key from a search (an older key or a plain slug also works).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["org_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a club"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90a759f9e8ae710a4d2f4ad36c50f5d96cc7ab7e78b1dfac57351945ff3cb52d"
        },
        {
          "name": "get_store",
          "title": "Get a store",
          "description": "One store's full listing: address, phone, hours where listed, brands, whether it outfits teams, and its online ordering and action links when it has them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "org_key": {
                "description": "The store's org_key from a search (an older key or a plain slug also works).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["org_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e25e09d677f3822e8db635faf882497ae195fad5ebff4e13e32d9f1a2eeb25c"
        },
        {
          "name": "list_registration_windows",
          "title": "List registration windows",
          "description": "Registration windows on record across clubs, for questions like 'which clubs in Ohio have registration open now' or 'what opens in January'. Filter by state, town, club name words, status and dates. Each window has its opening and closing dates, season, source link and verification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Town or city name.",
                "maxLength": 80,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous answer, for the next page of the same search.",
                "type": "string"
              },
              "date": {
                "description": "Only windows that cover this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "Only windows overlapping from this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results (default 10, at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words of a club's name or town.",
                "maxLength": 100,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, for example OH or PA.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "status": {
                "description": "open (covers today) or upcoming (opens later).",
                "enum": ["open", "upcoming"],
                "type": "string"
              },
              "to": {
                "description": "Only windows overlapping up to this date (YYYY-MM-DD; a range is at most 400 days).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List registration windows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbf8af7bc9189125a774728ebc642648488328eab4e159343565d8e3bd9aa389"
        },
        {
          "name": "search_clubs",
          "title": "Search clubs",
          "description": "Find youth sports clubs in the Hat Trick Local directory by name, town, state or distance (the listings today are soccer clubs). Use it whenever a person names a club, even vaguely or misspelled: when no listing matches every word, the answer lists candidates with similar names. Each result has the club's org_key (for get_club and the link tools), its town, whether registration is open or upcoming with dates and source, its fee range and how its facts were verified. Coverage is Ohio and Pennsylvania first; no result elsewhere means not in this directory, not that no club exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Town or city name.",
                "maxLength": 80,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous answer, for the next page of the same search.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results (default 10, at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A 5-digit US ZIP code, or latitude,longitude, to search by distance. Results then carry distance_mi.",
                "type": "string"
              },
              "query": {
                "description": "Club name, part of a name or a town. Every word must match; when nothing does, similar names come back as candidates.",
                "maxLength": 100,
                "type": "string"
              },
              "radius_mi": {
                "description": "Miles around near (default 25).",
                "maximum": 250,
                "minimum": 1,
                "type": "number"
              },
              "registration_open": {
                "description": "true: only clubs whose registration is open today.",
                "type": "boolean"
              },
              "registration_status": {
                "description": "open (today), upcoming (a window starts later) or not_on_record.",
                "enum": ["open", "upcoming", "not_on_record"],
                "type": "string"
              },
              "sport": {
                "description": "soccer, lacrosse or hockey.",
                "maxLength": 30,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, for example OH or PA.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search clubs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df4fe3647a11836dc9d2fa33125ddc6d4168a675bcca8927c1ca0136d3506642"
        },
        {
          "name": "search_stores",
          "title": "Search sports stores",
          "description": "Find local sports stores (soccer stores today) by name, chain, town, state or distance, with address, phone, brands and whether they outfit teams. Each result has the store's org_key for get_store and the link tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Town or city name.",
                "maxLength": 80,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous answer, for the next page of the same search.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results (default 10, at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A 5-digit US ZIP code, or latitude,longitude, to search by distance. Results then carry distance_mi.",
                "type": "string"
              },
              "query": {
                "description": "Store name, chain or town. Every word must match; when nothing does, similar names come back as candidates.",
                "maxLength": 100,
                "type": "string"
              },
              "radius_mi": {
                "description": "Miles around near (default 25).",
                "maximum": 250,
                "minimum": 1,
                "type": "number"
              },
              "state": {
                "description": "Two-letter US state code, for example OH or PA.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "team_dealer": {
                "description": "true: only stores that outfit teams (uniforms for clubs).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sports stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28a198d7475c82c4230506c81deb6033d43fb59fbed18eaff53807b735cde6fe"
        }
      ],
      "digest": "sha256:dc3cb24be9d8b11b72b8b00ef3056adee6d0ac76245171a727b05fe38bef13a4"
    }
  }
