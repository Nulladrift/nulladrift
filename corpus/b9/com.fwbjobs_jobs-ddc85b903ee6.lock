                "enum": ["en", "de", "fr", "nl", "fi", "ar", "sv", "it"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many jobs a page holds at most: up to this many.",
                "enum": [5, 10, 20],
                "type": "integer"
              },
              "min_salary_eur": {
                "description": "Only jobs whose pay comes to at least this much a year in euros (rounded down to a thousand). Jobs without a pay in euros are left out.",
