{
  "lockfileVersion": 2,
  "subjects": {
    "com.ranomics/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ranomics.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ranomics-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "confirm_quote",
          "description": "Accept a quote. Moves the experiment from QuoteSent to WaitingForMaterials. Call after a human (or budget guard) has approved the total_usd from get_experiment_quote. Returns 409 quote_not_confirmable if status is not QuoteSent, or 409 quote_not_finalized if a price has not been posted yet (total_usd null). Fetch get_experiment_quote and wait for total_usd before confirming.",
          "inputSchema": {
            "properties": {
              "quote_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:760f46272965da033112a084a4e62e70a423276b71e6d4df378d9eeb1b17bec5"
        },
        {
          "name": "estimate_cost",
          "description": "Non-binding USD cost estimate for a hypothetical submission. Pass target_kind='catalog' + target_id for a calibrated band (requires_human_quote=false), or target_kind='custom' for a placeholder order-of-magnitude band (requires_human_quote=true). Call BEFORE submit_experiment when budgeting matters.",
          "inputSchema": {
            "properties": {
              "candidate_count": {
                "minimum": 0,
                "type": "integer"
              },
              "experiment_type": {
                "enum": ["yeast_display", "mammalian_display", "dms"],
                "type": "string"
              },
              "library_diversity": {
                "minimum": 0,
                "type": "integer"
              },
              "target_id": {
                "type": "string"
              },
              "target_kind": {
                "enum": ["catalog", "custom"],
                "type": "string"
              }
            },
            "required": ["experiment_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c791851606afd8d705ae7d05a1da5180fece2f050a6718ff0591ee88db144f41"
        },
        {
          "name": "get_experiment_quote",
          "description": "Fetch the quote for an experiment once status is QuoteSent. Returns quote_id, total_usd, currency (default USD), line_items, valid_until, and terms_url. If status is QuoteSent but the scoping team has not posted a price yet, total_usd is null and a 'note' field explains it is being finalised; poll again until total_usd populates. Pass the quote_id to confirm_quote to accept.",
          "inputSchema": {
            "properties": {
              "experiment_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["experiment_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4812a003de478f400040996949129aad845f9a8ab1e2d261d0a4a3835804a3c"
        },
        {
          "name": "get_experiment_results",
          "description": "Fetch results once results_status is 'partial' or 'all' (check via get_experiment_status first). Returns per-sequence pre/post counts, log2_enrichment, percentile, called_hit booleans, plus signed download URLs for the enrichment table CSV, hits FASTA, and (when opted in) raw FASTQ. Yeast-display result shape; mammalian and DMS use the same envelope.",
          "inputSchema": {
            "properties": {
              "experiment_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["experiment_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eae47e9cb8a2e93d4a334fa982f855f3ee42d2a2c9f29a8193c43f8f2ee42ee"
        },
        {
          "name": "get_experiment_status",
          "description": "Poll an experiment by id. Returns the current status (Draft/WaitingForConfirmation/QuoteSent/WaitingForMaterials/LibraryConstruction/Sorting/NGS/DataAnalysis/InReview/Done), the orthogonal results_status (none/partial/all), and the status_log. Cheap; safe to poll every few minutes. Webhooks are preferred for production agents.",
          "inputSchema": {
            "properties": {
              "experiment_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["experiment_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d078d8529ba3e191f2977d097e6906019f4d93081e57b4cf386326b40e18c67"
        },
        {
          "name": "list_targets",
          "description": "List the calibrated antigen catalogue. Each entry carries target_id, supported_experiment_types, and typical_campaign_range_usd. Use the target_id on submit_experiment to skip human scoping, or use the custom target shape for a one-off antigen.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3cfc9c95843d875b0aced03c112a872dd15f338ebdb491b1f8af3f3d108a0b5"
        },
        {
          "name": "submit_experiment",
          "description": "Submit a binder panel for wet-lab triage. The experiment_spec mirrors the curl /api/v1/experiments contract: experiment_type (yeast_display/mammalian_display/dms), target (target_id or custom), library_design, and sequences as {user_key: amino_acid_string} (use ':' as a multi-chain separator). Optional webhook_url receives signed POSTs on every status transition. Optional idempotency_key dedupes retries. Returns the created experiment with status WaitingForConfirmation and a status_log. Poll get_experiment_status to track progress, get_experiment_results when status_log shows Done.",
          "inputSchema": {
            "properties": {
              "experiment_spec": {
                "properties": {
                  "experiment_type": {
                    "enum": ["yeast_display", "mammalian_display", "dms"],
                    "type": "string"
                  },
                  "library_design": {
                    "properties": {
                      "diversity_estimate": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "mode": {
                        "type": "string"
                      },
                      "notes": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "sequences": {
                    "additionalProperties": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "target": {
                    "properties": {
                      "custom": {
                        "properties": {
                          "antigen_sequence": {
                            "type": "string"
                          },
                          "name": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "notes": {
                            "type": "string"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "target_id": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": ["experiment_type", "sequences", "target"],
                "type": "object"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "webhook_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["experiment_spec"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f3f735d003eb418c8b485bda2e7d0d5ae7056cf4ca9574efa74fc7c496b493c"
        }
      ],
      "digest": "sha256:0d917e501365fc87f88ee97277ee22238ff71a9c86d116c9e6cb60c97dae0479"
    }
  }
}
