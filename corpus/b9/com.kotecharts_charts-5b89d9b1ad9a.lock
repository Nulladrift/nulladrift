        "name": "kote-analytics",
        "title": "Kote Charts — Bitcoin on-chain analytics",
        "version": "1.1.2",
        "websiteUrl": "https://kotecharts.com/mcp",
        "icons": [
          {
            "src": "https://kotecharts.com/icon-512.png",
