      "instructions": "Searches for things that an answer said do not exist or cannot be done:\nproducts, apps, services, competitors, ways to do something (guides,\nworkarounds, open-source fixes, procedures), or evidence about a factual \"no\"\n(\"no study shows...\", \"that's not allowed\", \"you're not entitled to...\").\n\nSuited to questions such as \"is there an app / tool / service that...\",\n\"are there competitors to...\", \"is there a way to...\", \"does X exist in\nmy country / in my language / on Shopify\", or a factual or rights question whose\nanswer is \"no\".\n\nIt runs the given queries in parallel on the general web and, optionally,\ninside specific places: app stores (Apple App Store, Google Play, Chrome Web\nStore), plugin marketplaces (Shopify, WordPress), launch and startup sites\n(Product Hunt and others), social and business pages (LinkedIn, Facebook,\nInstagram), how-to sites and forums (Reddit, YouTube, GitHub, Stack Exchange,\nlocal-language forums), and facts / research / rights sources (Wikipedia,\nPubMed, arXiv, government and rights sites).\n\nParameters:\n- claim: the \"no\" being checked.\n- product_shape: what the product or method would do, for whom, through which\n  channel or device.\n- queries: 4-20 varied queries (synonyms, functional descriptions,\n  \"alternatives to X\", \"how to X\", \"X workaround\"), in English and the user's\n  language.\n- marketplace_queries: 3-5 short keyword phrases (2-5 words, English) run\n  inside each chosen place, e.g. \"memoir WhatsApp bot\".\n- places: only the places that fit the question (apps/tools -> app_stores,\n  plugin_marketplaces, launch_and_startup_sites, social_and_business_pages;\n  \"how to\" -> how_to_and_forums; laws, rights, research ->\n  facts_research_and_rights). Fewer places is faster and cheaper.\n\nReturns deduplicated results (title, URL, snippet, where found) and a coverage\nreport: queries run, places searched and skipped, hits per place. A result\nhas not been verified; \"not found\" in these places is not proof that\nsomething does not exist.\n",
      "tools": [
        {
          "name": "check_a_no",
          "title": "Check a 'no' from the AI: find products, apps, competitors, ways to do it or counter-evidence",
          "description": "Searches for things that an answer said do not exist or cannot be done:\nproducts, apps, services, competitors, ways to do something (guides,\nworkarounds, open-source fixes, procedures), or evidence about a factual \"no\"\n(\"no study shows...\", \"that's not allowed\", \"you're not entitled to...\").\n\nSuited to questions such as \"is there an app / tool / service that...\",\n\"are there competitors to...\", \"is there a way to...\", \"does X exist in\nmy country / in my language / on Shopify\", or a factual or rights question whose\nanswer is \"no\".\n\nIt runs the given queries in parallel on the general web and, optionally,\ninside specific places: app stores (Apple App Store, Google Play, Chrome Web\nStore), plugin marketplaces (Shopify, WordPress), launch and startup sites\n(Product Hunt and others), social and business pages (LinkedIn, Facebook,\nInstagram), how-to sites and forums (Reddit, YouTube, GitHub, Stack Exchange,\nlocal-language forums), and facts / research / rights sources (Wikipedia,\nPubMed, arXiv, government and rights sites).\n\nParameters:\n- claim: the \"no\" being checked.\n- product_shape: what the product or method would do, for whom, through which\n  channel or device.\n- queries: 4-20 varied queries (synonyms, functional descriptions,\n  \"alternatives to X\", \"how to X\", \"X workaround\"), in English and the user's\n  language.\n- marketplace_queries: 3-5 short keyword phrases (2-5 words, English) run\n  inside each chosen place, e.g. \"memoir WhatsApp bot\".\n- places: only the places that fit the question (apps/tools -> app_stores,\n  plugin_marketplaces, launch_and_startup_sites, social_and_business_pages;\n  \"how to\" -> how_to_and_forums; laws, rights, research ->\n  facts_research_and_rights). Fewer places is faster and cheaper.\n\nReturns deduplicated results (title, URL, snippet, where found) and a coverage\nreport: queries run, places searched and skipped, hits per place. A result\nhas not been verified; \"not found\" in these places is not proof that\nsomething does not exist.\n",
