                "type": "string"
              },
              "name": {
                "description": "Exact package name as published in that registry, e.g. express for npm, requests for pypi, serde for cargo.",
                "type": "string"
              },
              "version": {
                "description": "Optional; defaults to the latest/default version",
                "type": "string"
