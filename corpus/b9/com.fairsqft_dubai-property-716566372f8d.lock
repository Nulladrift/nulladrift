          "inputSchema": {
            "properties": {
              "area": {
                "description": "Optional: only look inside this area. Area name or slug: any of the Dubai areas from list_areas, e.g. \"Dubai Marina\", \"jumeirah-village-circle\", \"JVC\" or \"Jumeirah Park\".",
                "type": "string"
              },
              "kind": {
                "default": "any",
                "description": "Optional: area, project, building or any.",
                "enum": ["any", "area", "project", "building"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Optional: at most this many candidates.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The name to look up, as the user said it.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
