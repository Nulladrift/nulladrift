        {
          "name": "rent_renewal_check",
          "title": "Check a rent increase at renewal",
          "description": "Checks a Dubai rent renewal: the 90-day notice rule and the maximum increase under Decree 43 of 2013, with our median of new Ejari contracts as an approximate benchmark, every band as a scenario and the link to the official DLD Rental Index. Not legal advice.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Area name or slug: any of the Dubai areas from list_areas, e.g. \"Dubai Marina\", \"jumeirah-village-circle\", \"JVC\" or \"Jumeirah Park\".",
                "type": "string"
              },
              "bedrooms": {
                "description": "Bedrooms: 0-10, or \"studio\" (= 0).",
                "type": ["integer", "string"]
              },
              "building": {
                "description": "Building name as registered with DLD (apartments), e.g. \"Marina Gate 1\". Optional.",
                "type": "string"
              },
              "current_rent_aed": {
                "description": "Current annual rent in AED.",
                "type": "number"
              },
              "expiry_date": {
                "description": "Date the current contract ends, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "notice_date": {
                "description": "Optional: date the notice of the change was received, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "property_type": {
                "default": "apartment",
                "enum": ["apartment", "villa", "townhouse"],
                "type": "string"
              },
              "segment": {
                "description": "Optional: segment key from get_area_snapshot, instead of property_type and bedrooms.",
                "type": "string"
              }
            },
            "required": ["area", "bedrooms", "current_rent_aed", "expiry_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
