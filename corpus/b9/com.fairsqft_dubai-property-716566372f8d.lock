        {
          "name": "start_brief",
          "title": "Prepare a Brief Battle request",
          "description": "Prepares a Brief Battle request: brokers in the area compete for 72 hours with real units, ranked against DLD fair value. Returns a link the buyer opens to confirm and submit; nothing is sent until the buyer confirms.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Area name or slug: any of the Dubai areas from list_areas, e.g. \"Dubai Marina\", \"jumeirah-village-circle\", \"JVC\" or \"Jumeirah Park\". Brief Battle is open in every area.",
                "type": "string"
              },
              "bedrooms": {
                "description": "Minimum bedrooms: 0 (or \"studio\") to 7.",
                "type": ["integer", "string"]
              },
              "budget_aed": {
                "description": "Maximum budget in AED.",
                "maximum": 200000000,
                "minimum": 300000,
                "type": "integer"
              },
              "financing": {
                "enum": ["cash", "mortgage_preapproved", "mortgage_planned"],
                "type": "string"
              },
              "must_haves": {
                "description": "Free text for brokers. No emails, phone numbers or links.",
                "maxLength": 500,
                "type": "string"
              },
              "property_type": {
                "enum": ["apartment", "villa", "townhouse"],
                "type": "string"
              },
              "timeline": {
                "enum": ["asap", "3m", "6m", "12m"],
                "type": "string"
              }
            },
            "required": ["area", "bedrooms", "budget_aed", "property_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
