      "serverInfo": {
        "name": "fairsqft",
        "title": "FairSqft: Dubai property facts from DLD data",
        "version": "0.2.0",
        "websiteUrl": "https://fairsqft.com/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FairSqft answers questions about Dubai homes with Dubai Land Department (DLD) open data, for about 290 areas: fair price ranges from registered sales (apartments also by building), new Ejari rents, comparables, a quarterly sale and rent index and a 12-month forecast with a public backtest. Areas accept names or slugs (\"Dubai Marina\", \"JVC\"); get_area_snapshot lists the segments and top buildings of an area. Results abstain, with a reason, when the sample is too small: say so to the user instead of guessing. Show the as_of date and credit the DLD as in the `attribution` field (not endorsed by the DLD or the Government of Dubai). Each area has a public page (page_url) to share with the user. start_brief, in any area, only returns a link: the buyer confirms on fairsqft.com, nothing is sent before that. No listings, no personal data. Terms: https://fairsqft.com/developers/",
      "tools": [
        {
          "name": "check_price",
          "title": "Check an asking price or rent",
          "description": "Compares an asking price or rent against the fair range from real closed deals in the same segment.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Area name or slug: any of the Dubai areas from list_areas, e.g. \"Dubai Marina\", \"jumeirah-village-circle\", \"JVC\" or \"Jumeirah Park\".",
                "type": "string"
              },
              "bedrooms": {
                "description": "Bedrooms: 0-10, or \"studio\" (= 0). Give bedrooms or layout.",
                "type": ["integer", "string"]
              },
              "bua_sqft": {
                "description": "Built-up area in sqft (villas and townhouses).",
                "type": "number"
              },
              "building": {
                "description": "Building name as registered with DLD (apartments), e.g. \"Marina Gate 1\". Optional: compares with the building when DLD has 6+ ready sales of that type in it in 12 months.",
                "type": "string"
              },
              "intent": {
                "default": "buy",
                "enum": ["buy", "rent"],
                "type": "string"
              },
              "layout": {
                "description": "Segment key from get_area_snapshot. Give bedrooms or layout.",
                "type": "string"
              },
              "plot_sqft": {
                "description": "Plot size in sqft (villas and townhouses).",
                "type": "number"
              },
              "price_aed": {
                "description": "Asking price in AED, or annual rent in AED when intent is rent.",
                "type": "number"
              },
              "property_type": {
                "enum": ["apartment", "villa", "townhouse"],
                "type": "string"
              },
              "size_sqft": {
                "description": "Size in sqft: unit area for apartments, built-up area (BUA) for villas and townhouses.",
                "type": "number"
              }
            },
            "required": ["area", "price_aed", "property_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an asking price or rent"
          },
          "behavior": {
