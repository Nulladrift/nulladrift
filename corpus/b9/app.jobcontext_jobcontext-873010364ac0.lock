          },
          "digest": "sha256:fc3fe7bbde52954cd07b8cc944eec900286f5bb282e67b5a5a2989f16bb5c08c"
        },
        {
          "name": "job_search_guide",
          "title": "Usage guide",
          "description": "job_search_guide: the usage guide of this server. Call it before the first search and when unsure how to go on: asking the user, writing requests, choosing tools, reading results and notices, showing the shortlist, checking a company, what never to do. No topic: the overview and the list of topics; a topic: that section.",
