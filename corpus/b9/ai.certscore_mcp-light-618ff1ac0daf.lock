                "minimum": 5000,
                "type": "integer"
              },
              "maxFindings": {
                "description": "Maximum compact findings to return. Defaults to 5 for summary and 20 otherwise.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
