{
  "lockfileVersion": 2,
  "subjects": {
    "co.itseasy/easy-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.itseasy.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "easy-marketing-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public information about Easy (itseasy.co), the self-custodial payment platform by Easy Labs: use list_pages to see what exists, get_page for any page as markdown, and get_pricing_rates for published rates as JSON. No authentication, read-only, marketing/site content only — for a merchant's own payments data use the authenticated server at https://mcp.itseasy.co/mcp.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page as markdown",
          "description": "Fetches any itseasy.co page (e.g. /pricing, /faq, /developers, /legal/tos) rendered as markdown with title/description frontmatter. Paths come from list_pages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "Site-relative page path from list_pages, e.g. /pricing",
                "maxLength": 200,
                "pattern": "^\\/[a-z0-9\\-/]*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d3211fa05c46b4576dda3a6a57d2d604a879f0a0b3fc2888909a05d32b2fb3a"
        },
        {
          "name": "get_pricing_rates",
          "title": "Get Easy's published processing rates",
          "description": "Easy's flat-rate pricing per payment channel (cards, ACH, wallets, stablecoins) as structured JSON — the same numbers published on /pricing. No monthly or setup fees.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "Optional single channel; omit for all rates",
                "enum": ["card-domestic", "card-amex", "card-international", "card-keyed", "ach", "stablecoin"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d04392bc9856215532a4c2226bda0f4d8dea576294d5e7d1c98767b1df1a09bf"
        },
        {
          "name": "list_pages",
          "title": "List itseasy.co pages",
          "description": "The curated index of every page on itseasy.co (Easy — the self-custodial payment platform by Easy Labs), grouped by section, with titles and descriptions. Use get_page to read any of them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "section": {
                "description": "Optional section filter (case-insensitive), e.g. Core, Solutions, Comparisons, Company",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e153dcb5409719fb8ce50ff194414da72358922ab517f106b84d2d222c81152"
        }
      ],
      "digest": "sha256:da0c25fd8bf64a9c182978367d95c4b0ef2e8bcbe2371bff908071f469f17064"
    }
  }
}
