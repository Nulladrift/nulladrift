        {
          "name": "set_checkout",
          "title": "Set checkout",
          "description": "Fill in the checkout of the order in one call: invoice_address (an object: name, address, zipcode, city, country as a two-letter code, phone; state, companynr and vatnr when known), shipping_address when delivery goes elsewhere (or same_as_invoice), invoice_address_id or shipping_address_id from view_checkout when the shopper has saved addresses, shipping_method (an id from view_checkout), payment_method (a key from view_checkout), coupon, coupon_remove, newsletter (only when the shopper asks for it). Field errors name the field and how to fix it; postcodes follow the country's own format. Needs the order reference from start_order (Authorization: Bearer mo1_… or the ref argument). Send a fresh op_id (16 to 40 letters, digits, - or _) with each change: a repeat with the same op_id within 10 minutes answers the first result and never changes the order twice.",
          "inputSchema": {
            "properties": {
              "coupon": {
                "description": "A discount code the shopper gave",
                "type": "string"
              },
              "coupon_remove": {
                "type": "string"
              },
              "invoice_address": {
                "description": "The invoice address, stored on this order only",
                "properties": {
                  "address": {
                    "description": "Street and house number",
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "companynr": {
                    "description": "Chamber of commerce number, when known",
                    "type": "string"
                  },
                  "country": {
                    "description": "Two-letter country code (ISO 3166-1), e.g. NL, DE, FR",
                    "type": "string"
                  },
                  "name": {
                    "description": "Company or person name",
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "state": {
                    "description": "Province or state, where the country has them",
                    "type": "string"
                  },
                  "vatnr": {
                    "description": "VAT number, when known",
                    "type": "string"
                  },
                  "zipcode": {
                    "description": "Postcode in the format of the country",
                    "type": "string"
                  }
                },
                "required": ["address", "city", "country", "name", "phone", "zipcode"],
                "type": "object"
              },
              "invoice_address_id": {
                "description": "A saved address id from view_checkout (shoppers with an account)",
                "type": "integer"
              },
              "newsletter": {
                "description": "Only when the shopper asks for it",
                "type": "boolean"
              },
              "op_id": {
                "description": "A fresh id per change (16 to 40 letters, digits, - or _); repeating it within 10 minutes answers the first result without changing the order again",
                "type": "string"
              },
              "payment_method": {
                "description": "A key from view_checkout",
                "type": "string"
              },
              "ref": {
                "description": "Order reference (mo1_…) from start_order, only when the client cannot send it as Authorization: Bearer",
                "type": "string"
              },
              "same_as_invoice": {
                "description": "Deliver to the invoice address",
                "type": "boolean"
              },
              "shipping_address": {
                "description": "The delivery address when it differs from the invoice address",
                "properties": {
                  "address": {
                    "description": "Street and house number",
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "companynr": {
                    "description": "Chamber of commerce number, when known",
                    "type": "string"
                  },
                  "country": {
                    "description": "Two-letter country code (ISO 3166-1), e.g. NL, DE, FR",
                    "type": "string"
                  },
                  "name": {
                    "description": "Company or person name",
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "state": {
                    "description": "Province or state, where the country has them",
                    "type": "string"
                  },
                  "vatnr": {
                    "description": "VAT number, when known",
                    "type": "string"
                  },
                  "zipcode": {
                    "description": "Postcode in the format of the country",
                    "type": "string"
                  }
                },
                "required": ["address", "city", "country", "name", "phone", "zipcode"],
                "type": "object"
              },
              "shipping_address_id": {
                "description": "A saved address id, 0 = deliver to the invoice address",
