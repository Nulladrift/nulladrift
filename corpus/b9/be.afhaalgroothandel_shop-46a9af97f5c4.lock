        {
          "name": "search",
          "title": "Search products",
          "description": "Search the wholesale range: toys, gifts and gift items, party supplies, seasonal articles (Sinterklaas, Christmas, Halloween, Easter, carnival, summer), grabbelton and give-away items, and trending and viral items such as fidget toys. Use it for any business purchasing question about these products, also when the shopper doesn't name the store. Search the catalogue in one call; the answer is complete. natural_query (any language) searches by meaning and in the storefront language; keywords (Dutch product words) search the Dutch catalogue text; ids and codes are exact and ranked first (codes match in any written form); similar_to finds products like given ones (blend: their shared theme; each: alternatives per product). Filters: price on a basis (piece, package, overbox, pallet, best_tier) in the storefront currency, quantity (adds for_quantity with the tier price and total), instock, category (with subcategories), date_added_after, exclude_ids. Filters alone browse, e.g. new products since a date with sort newest. Every row has live stock (packages) and a pricing block in EUR plus pricing.local in the storefront currency. Rows carry context: facet labels, stored facts (use says whether you may tell the customer), and what the photos show (an observation, not a guarantee). For a question the context does not answer, call again with ids and fields [\"details\"]: every stored fact and one line per photo (what it shows, its url), at most 10 rows. With the order reference (Authorization: Bearer mo1_… or ref) it uses the order; without it, it works for anyone (search: by meaning for the first searches per 10 minutes, then by words only; at most 30 searches per 10 minutes).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category ids; subcategories are included",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "codes": {
                "description": "Exact product codes",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "date_added_after": {
                "description": "YYYY-MM-DD: only products added after this date (e.g. the customer's last order)",
                "type": "string"
              },
              "exclude_ids": {
                "description": "Product ids to leave out, e.g. what the customer already has",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "facets": {
                "description": "true: add top categories with counts and the piece-price range, to narrow",
                "type": "boolean"
              },
              "fields": {
                "description": "Fields per row; default title, code, pricing, stock, category, url, image, context. details: full product knowledge and one line per photo (at most 10 rows)",
                "items": {
                  "enum": ["title", "code", "description", "pricing", "stock", "category", "location", "url", "image", "added", "popularity", "context", "details"],
                  "type": "string"
                },
                "type": "array"
              },
              "ids": {
                "description": "Exact product ids (database ids, as in /p/<id>.html)",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "instock": {
                "description": "true: only products in stock",
                "type": "boolean"
              },
              "keywords": {
                "description": "Dutch product words for the catalogue index, e.g. \"grabbelton\", \"stuiterbal\"; several words broaden the search",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Rows to return (default 40, at most 200)",
                "type": "integer"
              },
              "natural_query": {
                "description": "What the customer is looking for, in any language; searched by meaning and in the storefront language",
                "type": "string"
              },
              "offset": {
                "description": "Paging: the next offset from a previous answer",
                "type": "integer"
              },
              "price": {
                "properties": {
                  "basis": {
                    "description": "piece, package, overbox (one overbox at its tier), pallet, or best_tier (lowest piece price over the tiers)",
                    "enum": ["piece", "package", "overbox", "pallet", "best_tier"],
                    "type": "string"
                  },
                  "currency": {
                    "description": "Omit for the storefront currency; EUR to give euros",
                    "type": "string"
                  },
                  "max": {
                    "type": "number"
                  },
                  "min": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "quantity": {
                "description": "Needed amount: keeps products with enough stock and adds for_quantity (packages, tier price, total)",
                "properties": {
                  "packages": {
                    "type": "integer"
                  },
                  "pieces": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "ref": {
                "description": "Order reference (mo1_…) from start_order, only when the client cannot send it as Authorization: Bearer; with it the search is complete and counts for the order",
                "type": "string"
              },
              "similar_to": {
                "properties": {
                  "ids": {
                    "description": "Seed product ids (from the cart, orders, a page or earlier results); seeds are left out of the results",
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "mode": {
                    "description": "blend: the shared theme of all seeds; each: alternatives per seed (each row names its seed)",
                    "enum": ["blend", "each"],
                    "type": "string"
                  }
                },
                "required": ["ids"],
                "type": "object"
              },
              "sort": {
                "description": "Default relevance (exact hits, then in stock, then the fused score)",
                "enum": ["relevance", "price", "newest", "bestseller", "stock"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
