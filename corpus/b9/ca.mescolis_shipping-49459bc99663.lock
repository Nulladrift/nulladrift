{
  "lockfileVersion": 2,
  "subjects": {
    "ca.mescolis/shipping": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mescolis.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mescolis-shipping",
        "title": "MesColis Shipping",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MesColis is a Canadian multi-carrier shipping service (mescolis.ca). Three tools need NO account: track_package (where is a parcel, by tracking number), get_shipping_quote (live prices from several carriers for one parcel) and find_drop_off_points (Canada Post, FedEx, UniUni and MesColis counters near a Canadian postal code). Prefer them for anyone who has not connected an account. The other tools read the connected account (its own rates, shipments and saved addresses) and ask the user to sign in the first time. Answer in the user's language; every public tool takes lang \"fr\" or \"en\". This server cannot buy labels, create shipments or change any data: labels are bought on the website, through the link each quote returns.",
      "tools": [
        {
          "name": "compare_shipping_rates",
          "title": "Compare shipping rates",
          "description": "Compare live shipping rates for one parcel across every carrier available on the SIGNED-IN account (Canada Post, Purolator, UPS, FedEx and others), at the prices of that account. Returns each carrier and service with its total price, currency and estimated transit days. Requires the user to connect their account; for someone without an account use get_shipping_quote, which needs no sign-in. Prices are live and account-specific; do not cache them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_country": {
                "description": "Origin country, ISO alpha-2. Defaults to \"CA\".",
                "type": "string"
              },
              "from_postal": {
                "description": "Origin postal or ZIP code, e.g. \"H2X 1Y1\".",
                "type": "string"
              },
              "height_cm": {
                "description": "Parcel height in centimetres.",
                "type": "number"
              },
              "length_cm": {
                "description": "Parcel length in centimetres.",
                "type": "number"
              },
              "residential": {
                "description": "True if delivering to a home address. Affects price on some carriers.",
                "type": "boolean"
              },
              "to_country": {
                "description": "Destination country, ISO alpha-2. Defaults to \"CA\".",
                "type": "string"
              },
              "to_postal": {
                "description": "Destination postal or ZIP code, e.g. \"M5V 2T6\".",
                "type": "string"
              },
              "weight_kg": {
                "description": "Parcel weight in kilograms. Must be greater than 0.",
                "type": "number"
              },
              "width_cm": {
                "description": "Parcel width in centimetres.",
                "type": "number"
              }
            },
            "required": ["from_postal", "height_cm", "length_cm", "to_postal", "weight_kg", "width_cm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["rates:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d3ed47cacc86445c54b7d75b65d64a368c9033e9f652a054bd26b5c73c16f7dd"
        },
        {
          "name": "find_drop_off_points",
          "title": "Find drop-off and pick-up points",
          "description": "Find places near a Canadian postal code where a parcel can be dropped off or picked up. No account needed. Covers Canada Post outlets, FedEx locations, UniUni drop-off points and MesColis counters, nearest first, with the address, distance, what can be done there and a map link. Optionally limit the search to one network. Opening hours vary, so suggest checking the map link before going.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer. Defaults to the user's locale, then to the site's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "max_per_network": {
                "description": "Points per network, 1 to 5. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "Limit to one network: canada_post, fedex, uniuni or mescolis. Defaults to \"any\".",
                "enum": ["any", "canada_post", "fedex", "uniuni", "mescolis"],
                "type": "string"
              },
              "postal_code": {
                "description": "A full Canadian postal code, e.g. \"H2X 1Y1\".",
                "type": "string"
              }
            },
            "required": ["postal_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:2e6a9da2820ef2963e020243005e181a852adf6abeb6492aaac2f730f88351ad"
        },
        {
          "name": "get_shipment",
          "title": "Get one shipment",
          "description": "Retrieve the full record of a single shipment by its ID, including addresses, carrier, service, cost and current status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The shipment ID, e.g. \"SHP-9FD8D9B5\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["shipments:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:36ae5423639ebf5d9bde4c90965fa16e156185e8a5ac36c0dab25d26beed7ece"
        },
        {
          "name": "get_shipping_quote",
          "title": "Get a shipping quote",
          "description": "Get live shipping prices for one parcel from several carriers (Canada Post, UPS, FedEx and others). No account needed. Give the origin and destination postal or ZIP codes and the weight in kilograms (convert pounds and inches first); the box size is optional and a 30 x 20 x 10 cm box is assumed when it is missing. Returns up to 6 of the cheapest services with price and estimated transit time, and a link that opens the same quote on the website, where the label can be bought. Prices are the public rates at the moment of the quote. If the user is signed in, compare_shipping_rates returns their own account prices instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_country": {
                "description": "Origin country, ISO alpha-2. Defaults to \"CA\".",
                "type": "string"
              },
              "from_postal": {
                "description": "Origin postal or ZIP code, e.g. \"H2X 1Y1\".",
                "type": "string"
              },
              "height_cm": {
                "description": "Optional. Box height in centimetres.",
                "type": "number"
              },
              "lang": {
                "description": "Language of the answer. Defaults to the user's locale, then to the site's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "length_cm": {
                "description": "Optional. Box length in centimetres.",
                "type": "number"
              },
              "to_country": {
                "description": "Destination country, ISO alpha-2. Defaults to \"CA\".",
                "type": "string"
              },
              "to_postal": {
                "description": "Destination postal or ZIP code, e.g. \"M5V 2T6\".",
                "type": "string"
              },
              "weight_kg": {
                "description": "Parcel weight in kilograms. Must be greater than 0.",
                "type": "number"
              },
              "width_cm": {
                "description": "Optional. Box width in centimetres.",
                "type": "number"
              }
            },
            "required": ["from_postal", "to_postal", "weight_kg"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:a5d54143ed726beae1690a7e4b3fbb4cfefaa53f54a96dddd9add7def1349e75"
        },
        {
          "name": "list_addresses",
          "title": "List saved addresses",
          "description": "List saved addresses from the account address book. Read-only — this server cannot create, change or delete addresses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to return. Max 100, default 50.",
                "type": "integer"
              },
              "offset": {
                "description": "How many to skip, for paging. Default 0.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["addresses:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:77205c7b928e8ae24c4a3e440689074244e72a1f5c9d1292d4639afbde23e313"
        },
        {
          "name": "list_shipments",
          "title": "List shipments",
          "description": "List shipments on the authenticated account, newest first. Supports paging and filtering by status (for example \"Delivered\" or \"In Transit\"). Use get_shipment for the full record of one shipment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to return. Max 100, default 20.",
                "type": "integer"
              },
              "offset": {
                "description": "How many to skip, for paging. Default 0.",
                "type": "integer"
              },
              "status": {
                "description": "Optional status filter, e.g. \"Delivered\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["shipments:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:50e3e14e6810da9731f437c3dc04525f52dbe08b1489e5806ff71d6fdd7b8837"
        },
        {
          "name": "track_package",
          "title": "Track a package",
          "description": "Track any parcel by its tracking number. No account needed. Works for parcels shipped through this service with any carrier, and for most Canadian carrier numbers (Canada Post, UPS, FedEx, Purolator, Nationex, GLS). Returns the current status, the estimated or actual delivery date and the carrier's latest scans, plus a link to the full tracking page. Use this whenever someone asks where a parcel is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer. Defaults to the user's locale, then to the site's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "tracking_number": {
                "description": "The carrier tracking number, e.g. \"1Z999AA10123456784\".",
                "type": "string"
              }
            },
            "required": ["tracking_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:febb5fa9dae895076ae29a639c787738bd6af79c276f63aa38d2c146610080a8"
        },
        {
          "name": "track_parcel",
          "title": "Track a parcel",
          "description": "Look up the live status and checkpoint history of a parcel on the SIGNED-IN account by its tracking number. Returns the current status, estimated delivery date, the shipment id and the full checkpoint list. Requires the user to connect their account; to track any parcel without signing in, use track_package. Supplying the carrier is optional but makes the lookup faster.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "description": "Optional carrier slug, e.g. \"ups\", \"purolator\", \"canada_post\".",
                "type": "string"
              },
              "tracking_number": {
                "description": "The carrier tracking number.",
                "type": "string"
              }
            },
            "required": ["tracking_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["track:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:9bcdf79127247cc6db68b2ca597c1841d04fceff1791451e4d4381604af5cbb8"
        }
      ],
      "digest": "sha256:b66ba47dcd74035d239197041ef7361fb60406b624af283749908f21c60fea40"
    }
  }
