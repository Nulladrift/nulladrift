      "serverInfo": {
        "name": "points-or-cash",
        "title": "Points or Cash",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Points or Cash helps decide whether to use credit card points or pay cash for travel.\n- transfer_options: which bank points (Amex, Chase, Capital One, Citi, Bilt, Wells Fargo, U.S. Bank, Rove Miles) reach an airline or hotel program, at what ratio, and whether the balances cover an award.\n- award_chart: typical one-way saver award prices by program, market (from the US or from Europe) and cabin, plus known sweet spots.\n- points_value: exact cents per point for an award vs the cash fare, in any currency, per bank point spent when transferring (uses the card's transfer ratio and any active bonus), counting cash back and points given up.\n- cashback_cards: earn rates for crypto and flat cash-back cards, to value paying cash.\n- lounges: lounges at an airport and which premium cards open them.\nAll data is researched and dated (see each result's as_of). Award prices are typical saver levels, not live availability: confirm seats on the program's site before transferring points, because transfers can't be undone. More: https://pointsorcash.app",
      "tools": [
        {
          "name": "award_chart",
          "title": "Award prices",
          "description": "Typical saver award prices (one-way) by program, market and cabin from a researched table, plus known sweet spots. Use when live award search is unavailable, to shortlist programs, or to judge whether a live price is good. Prices are estimates with an as_of date; dynamic programs vary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "enum": ["economy", "premium", "business", "first"],
                "type": "string"
              },
              "market": {
                "description": "us_ = from the US, eu_ = from Europe. *_north_asia = Japan/Korea/China/HK/Taiwan; eu_middle_east includes North and Central Africa; eu_africa = southern Africa",
                "enum": ["us_domestic", "us_europe", "us_japan_north_asia", "us_southeast_asia", "us_middle_east_india", "us_south_america", "us_hawaii", "us_caribbean_mexico", "eu_europe", "eu_north_america", "eu_caribbean_mexico", "eu_south_america", "eu_middle_east", "eu_africa", "eu_india", "eu_southeast_asia", "eu_north_asia", "eu_australia"],
                "type": "string"
              },
              "programs": {
                "description": "Program slugs to look up; empty array = all programs with a price for this market",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["cabin", "market", "programs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Award prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://points-or-cash/card.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Looking up award prices…",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://points-or-cash/card.html"
            }
          },
          "digest": "sha256:f04ca342e9a6f5afb91f72a7208567edd4fc8a43e14b0b1145ebfb05e86f3664"
        },
        {
          "name": "cashback_cards",
          "title": "Cash-back cards",
          "description": "Earn rates for crypto-cashback and flat-cashback cards (Coinbase One Card, Gemini, Crypto.com, Fold, Robinhood Gold, Citi Double Cash, Wells Fargo Active Cash and more): rate on airfare, hotels, travel portals and everything else, fees, caps and how rewards pay out. Use when the traveler pays cash with one of these cards, to value the cash option (cash back earned) and to pass cash_back_pct to points_value.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cards": {
                "description": "Card slugs or names, e.g. [\"coinbase_one_card\"]; empty array = all cards",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cash-back cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a886d29e63a6a634be7582145e193985d3668795138e364fe635dd13f9001d77"
        },
        {
          "name": "lounges",
          "title": "Lounge access",
          "description": "Airport lounges for a journey: the lounges at each airport (origin, connections, destination) and which ones the traveler can use with their cards, plus access rules by ticket and status (business class, oneworld/Star Alliance/SkyTeam elite). Covers 214 airports, including Brussels and the main European and Asian hubs, with access by ticket, status, Priority Pass and cards by issuing country. Use it when planning the full journey, after the flights are decided or when the traveler asks about lounges. Card rules change often; the data has an as_of date and verified flags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airports": {
                "description": "IATA codes in travel order, e.g. [\"SFO\",\"SEA\",\"HND\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cards": {
                "description": "Lounge-relevant cards the traveler holds, as slugs. US-issued: amex_platinum, amex_business_platinum, amex_centurion_card, chase_sapphire_reserve, capital_one_venture_x, citi_strata_elite, citi_aadvantage_executive, united_club_infinite, delta_reserve, bilt_palladium, priority_pass_network. Issued elsewhere: amex_platinum_be, amex_platinum_uk, amex_platinum_de, amex_platinum_nl, amex_platinum_fr, amex_platinum_au, revolut_ultra_be, bnp_fortis_mc_world_elite, belfius_private_mc_world_elite. Ask where a card was issued if it matters. Empty if unknown.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["airports", "cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lounge access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6179c4f9cb795bbc6ac547c0d4fcc97022b18dc6530937b82af717dc14137d95"
        },
        {
          "name": "points_value",
          "title": "Points or cash verdict",
          "description": "Exact cents-per-point for an award vs the cash fare, in the trip currency: (cash − award fees − what paying cash would earn) ÷ points × 100. When the award is paid by transferring bank points, pass bank + program: it applies the traveler's transfer ratio (e.g. Belgian Amex to Flying Blue is 2:1) and any active bonus, and judges the value per bank point spent. Call it for every award you compare, rather than doing the maths yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash_back_pct": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cash/crypto back % the traveler would earn paying cash (e.g. 4 for a 4% card). Null if unknown."
              },
              "currency": {
                "description": "Currency of all prices, e.g. \"EUR\", \"USD\", \"GBP\". Cash fare and award fees must be in the same currency; convert first if they differ.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "options": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "award_fees": {
                      "description": "Taxes, fees and surcharges paid on the award",
                      "minimum": 0,
                      "type": "number"
                    },
                    "bank": {
                      "anyOf": [
                        {
                          "enum": ["amex_mr", "chase_ur", "capital_one", "citi_ty", "bilt", "wells_fargo", "us_bank", "rove", "amex_mr_be", "amex_mr_nl", "amex_mr_uk", "amex_mr_fr", "amex_mr_de", "revolut_eu", "revolut_uk", "amex_mr_es", "amex_mr_it", "amex_mr_se", "amex_mr_ch", "amex_mr_ca", "rbc_avion_ca", "amex_mr_au", "anz_au", "westpac_au", "nab_au", "cba_au", "dbs_sg", "uob_sg", "citi_sg", "hsbc_sg", "amex_mr_sg", "hsbc_hk", "citi_hk", "amex_mr_hk", "scb_hk", "hdfc_in", "axis_in", "amex_mr_in", "icici_in", "enbd_ae", "amex_mr_ae", "mashreq_ae", "fab_ae"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Bank currency transferred to pay for it (same keys as transfer_options, e.g. amex_mr_be), or null if the miles are already in the program"
                    },
                    "bank_points": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Bank points spent if you already know it (overrides the ratio lookup); else null"
                    },
                    "cash_price": {
                      "description": "Cash fare for the same flight",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "label": {
                      "description": "e.g. \"Flying Blue business, 60k + €500\"",
                      "type": "string"
                    },
                    "miles": {
                      "description": "Miles/points the award costs in the airline or hotel program",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "miles_earned_paying_cash": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Airline miles the cash ticket would earn (award tickets usually earn none); null if unknown"
                    },
                    "program": {
                      "description": "Program slug the miles are in, e.g. \"flyingblue\", \"avios_ba\", \"aeroplan\"; needed with bank",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["award_fees", "bank", "bank_points", "cash_price", "label", "miles", "miles_earned_paying_cash", "program"],
                  "type": "object"
                },
                "type": "array"
              },
              "points_per_unit_paying_cash": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Card points earned per dollar/euro on the cash fare (e.g. 5 for Amex Platinum on flights). Null if unknown."
              }
            },
            "required": ["cash_back_pct", "currency", "options", "points_per_unit_paying_cash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Points or cash verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://points-or-cash/card.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Weighing points against cash…",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://points-or-cash/card.html"
            }
          },
          "digest": "sha256:5e64a735659f0c3a58b72f6b91eb758e939593e211672b5c1c4a8d3d292cfc58"
        },
        {
          "name": "transfer_options",
          "title": "Transfer options",
          "description": "Which of the traveler's bank points can become miles/points in a target loyalty program, at what ratio, and how many they would end up with. Based on a researched transfer-partner table (has an as_of date; ratios change and transfer bonuses are not included). Pass the traveler's balances.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balances": {
                "description": "The traveler's bank point balances, e.g. [{\"bank\":\"amex_mr\",\"points\":250000}]. amex_mr means a US-issued Amex; for an Amex issued elsewhere use the country key (amex_mr_be/_nl/_uk/_fr/_de/_es/_it/_se/_ch/_ca/_au/_sg/_hk/_in/_ae: different partners and ratios). Also Revolut RevPoints (revolut_eu, revolut_uk) and local banks (rbc_avion_ca, anz_au, westpac_au, nab_au, cba_au, dbs_sg, uob_sg, citi_sg, hsbc_sg, hsbc_hk, citi_hk, scb_hk, hdfc_in, axis_in, icici_in, enbd_ae, mashreq_ae, fab_ae). Ask which country issued the card if unclear.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bank": {
                      "enum": ["amex_mr", "chase_ur", "capital_one", "citi_ty", "bilt", "wells_fargo", "us_bank", "rove", "amex_mr_be", "amex_mr_nl", "amex_mr_uk", "amex_mr_fr", "amex_mr_de", "revolut_eu", "revolut_uk", "amex_mr_es", "amex_mr_it", "amex_mr_se", "amex_mr_ch", "amex_mr_ca", "rbc_avion_ca", "amex_mr_au", "anz_au", "westpac_au", "nab_au", "cba_au", "dbs_sg", "uob_sg", "citi_sg", "hsbc_sg", "amex_mr_sg", "hsbc_hk", "citi_hk", "amex_mr_hk", "scb_hk", "hdfc_in", "axis_in", "amex_mr_in", "icici_in", "enbd_ae", "amex_mr_ae", "mashreq_ae", "fab_ae"],
                      "type": "string"
                    },
                    "points": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["bank", "points"],
                  "type": "object"
                },
                "type": "array"
              },
              "miles_needed": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Miles the award costs, to check whether the balances cover it; null if unknown"
              },
              "target_programs": {
                "description": "Program slugs, e.g. [\"aeroplan\",\"flyingblue\",\"virginatlantic\",\"ana\",\"hyatt\"]. Empty array = list every partner reachable from the balances.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["balances", "miles_needed", "target_programs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Transfer options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:421c02c38fb3328c88f362b01bfee50c29379e419517afc5d18cecd1fbb7e899"
        }
