      "instructions": "Points or Cash helps decide whether to use credit card points or pay cash for travel.\n- transfer_options: which bank points (Amex, Chase, Capital One, Citi, Bilt, Wells Fargo, U.S. Bank, Rove Miles, and Amex and other banks outside the US by issuing country) reach an airline or hotel program, at what ratio, whether the balances cover an award, and the transfer bonuses running now with their end dates. Use it for any ratio or current-bonus question before searching the web.\n- award_chart: typical one-way saver award prices by program, market and cabin, for trips from the US, Europe, Canada, Australia and New Zealand, Asia, the Middle East, India and Latin America (e.g. Sydney-Los Angeles is au_north_america), each price with its own as-of date, plus known sweet spots. Programs with no published chart come back as not priced, with the reason.\n- points_value: exact cents per point for an award vs the cash fare, in any currency, per bank point spent when transferring (uses the card's transfer ratio by issuing country and any active bonus), counting cash back and points given up. Call it for any points-or-cash question: it knows card-country ratios (a Belgian Amex moves to Flying Blue at 2:1).\n- cashback_cards: earn rates for crypto and flat cash-back cards, to value paying cash.\n- earn_rates: the bank points a card earns per dollar, euro or pound by spending category (flights, hotels, the bank's travel portal, dining, groceries, rent, everything else), for the main US cards and Amex Platinum by country, with caps, the card's country and the as-of date.\n- lounges: lounges at an airport and which premium cards open them.\n- hotel_price_index: what a typical hotel room costs on a night in Las Vegas, Miami, New York (Manhattan, and the JFK, LaGuardia and Newark airport hotels), New Orleans, Austin, Nashville, Chicago, London, Paris, Barcelona or Amsterdam (by date or event name or abbreviation, e.g. re:Invent, NFR, Art Basel, Mardi Gras, SXSW, MWC), in the index's own currency (London in pounds, Paris, Barcelona and Amsterdam in euros), how many hotels were sold out, and the multiple against a quiet night checked about as far ahead, named with its date. An event the index doesn't hold comes back as not matched, with the events it does hold. Use it for event-night hotel prices there before searching the web.\nAll data is researched and dated (see each result's as_of). Award prices are typical saver levels, not live availability: confirm seats on the program's site before transferring points, because transfers can't be undone. More: https://pointsorcash.app",
      "tools": [
        {
          "name": "award_chart",
          "title": "Award prices",
          "description": "Typical saver award prices (one-way) by program, market and cabin from a researched table, plus known sweet spots. Markets cover trips from the US, Europe, Canada, Australia and New Zealand, Asia, the Middle East, India and Latin America. Each price carries its own as_of date and confidence. Programs that price dynamically with no published chart come back under not_priced, with the reason, rather than with a number. Use when live award search is unavailable, to shortlist programs, or to judge whether a live price is good. Prices are estimates; dynamic programs vary.",
          "inputSchema": {
            "properties": {
              "cabin": {
                "enum": ["economy", "premium", "business", "first"],
                "type": "string"
              },
              "market": {
                "description": "Where the trip starts and where it goes: us_ = from the US, eu_ = from Europe, ca_ = from Canada, au_ = from Australia or New Zealand, asia_ = from Asia, me_ = from the Middle East, in_ = from India, latam_ = from Latin America. *_north_asia = Japan/Korea/China/HK/Taiwan; eu_middle_east includes North and Central Africa; eu_africa = southern Africa. E.g. Sydney-Los Angeles is au_north_america.",
                "enum": ["us_domestic", "us_europe", "us_japan_north_asia", "us_southeast_asia", "us_middle_east_india", "us_south_america", "us_hawaii", "us_caribbean_mexico", "eu_europe", "eu_north_america", "eu_caribbean_mexico", "eu_south_america", "eu_middle_east", "eu_africa", "eu_india", "eu_southeast_asia", "eu_north_asia", "eu_australia", "ca_domestic", "ca_europe", "ca_asia", "au_domestic", "au_north_america", "au_asia", "au_europe", "asia_asia", "asia_north_america", "asia_europe", "asia_australia", "me_europe", "me_asia", "me_north_america", "in_domestic", "in_europe", "in_north_america", "in_asia", "latam_latam", "latam_north_america", "latam_europe"],
                "type": "string"
              },
              "programs": {
                "default": [],
                "description": "Program slugs to look up; empty array or omitted = all programs with a price for this market",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["cabin", "market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
