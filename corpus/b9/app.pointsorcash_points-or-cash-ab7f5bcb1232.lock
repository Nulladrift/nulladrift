        },
        {
          "name": "earn_rates",
          "title": "Card earn rates",
          "description": "Credit card earn rates: the bank points (or miles) a card earns per dollar, euro or pound, by spending category (flights and hotels booked direct or through the bank's travel portal, dining, groceries, rent, everything else), with the card's issuing country, caps and conditions, and the as_of date. Covers Amex Platinum and Gold (US), Amex Business Platinum, Chase Sapphire Reserve and Preferred, Capital One Venture X, Citi Strata Elite, Bilt Palladium, Amex Platinum in Belgium, the Netherlands, the UK, Germany and France, Revolut Ultra, and Miles & More co-brand cards in Germany and Switzerland. Use it for \"how many points does my card earn on X\", to pick the card to pay with, and to pass points_per_unit_paying_cash to points_value. For cash-back and crypto cards use cashback_cards.",
          "inputSchema": {
            "properties": {
              "card": {
                "default": null,
                "description": "Card slug or name, e.g. \"amex_gold_us\", \"Sapphire Reserve\", \"Amex Platinum\"; null = every card (filter by country)",
                "type": ["string", "null"]
              },
              "category": {
                "anyOf": [
                  {
                    "enum": ["flights", "hotels", "travel_portal_flights", "travel_portal_hotels", "travel_other", "dining", "groceries", "rent", "streaming", "everything_else"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Spending category; null = every rate the card has. A card with no bonus for the category returns its base rate (everything_else)."
              },
              "country": {
                "default": null,
                "description": "Country the card was issued in, ISO code (US, BE, NL, UK, DE, FR, CH); null = any. The same card name earns differently by country (Amex Platinum earns 5x on flights in the US, 1 point per euro in Belgium).",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Card earn rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de2f81f9e507f1c0b8ea6a162c94b4ba87ed626f7e62cfb00c8ed2e1d87b9dcb"
        },
        {
          "name": "hotel_price_index",
          "title": "Hotel price index",
          "description": "What a typical hotel room costs on a night in a Points or Cash Hotel Price Index city: las_vegas (Las Vegas: the Strip, 26 resorts), miami (Miami: Miami Beach, Brickell and Downtown, 23 hotels), amsterdam (Amsterdam: central Amsterdam, in euros), austin (Austin), barcelona (Barcelona: central Barcelona, in euros), chicago (Chicago: downtown Chicago), london (London: central London, in pounds sterling), nashville (Nashville), new_orleans (New Orleans), new_york_airports (New York airport hotels: JFK, LaGuardia and Newark), new_york (New York: Manhattan), paris (Paris: central Paris, in euros). The panel median, how many hotels were sold out (\"at least\" when half or more were), and the multiple against a quiet night checked about as far ahead (named with its own date), with the events on that night and their own dates, the index's currency, the as_of date and the page link. Ask by date (YYYY-MM-DD), a date range, or an event name or abbreviation (e.g. \"re:Invent\", \"NFR\", \"CES\", \"Art Basel\", \"Mardi Gras\", \"SXSW\", \"MWC\", \"New Year\"); an event the index does not hold comes back as not matched, with the list of events it does hold. Use it first for any question about what hotels cost on an event night or a big night in these cities, or how a night compares with a normal one; it is our own dated data, not a live search. Not a live rate for one hotel.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "las_vegas (the Strip, 26 resorts), miami (Miami Beach, Brickell and Downtown, 23 hotels), amsterdam (central Amsterdam), austin (Austin), barcelona (central Barcelona), chicago (downtown Chicago), london (central London), nashville (Nashville), new_orleans (New Orleans), new_york_airports (JFK, LaGuardia and Newark), new_york (Manhattan), paris (central Paris)",
                "enum": ["las_vegas", "miami", "amsterdam", "austin", "barcelona", "chicago", "london", "nashville", "new_orleans", "new_york_airports", "new_york", "paris"],
                "type": "string"
              },
              "date": {
                "default": null,
                "description": "The night asked, YYYY-MM-DD (the check-in night); null to look up by event",
                "type": ["string", "null"]
              },
              "end_date": {
                "default": null,
                "description": "Last night of a stay, YYYY-MM-DD, to list every checked night in between; null for one night",
                "type": ["string", "null"]
              },
              "event": {
                "default": null,
                "description": "Event name or abbreviation if the traveller named one (e.g. \"re:Invent\", \"NFR\", \"Art Basel\"); null otherwise",
                "type": ["string", "null"]
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hotel price index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:865d89c8a1ad597e5a13906367582f5b8acb4d206b7589bf3c88889ae7215cf0"
        },
        {
          "name": "lounges",
          "title": "Lounge access",
          "description": "Airport lounges for a journey: the lounges at each airport (origin, connections, destination) and which ones the traveler can use with their cards, plus access rules by ticket and status (business class, oneworld/Star Alliance/SkyTeam elite). Covers 214 airports, including Brussels and the main European and Asian hubs, with access by ticket, status, Priority Pass and cards by issuing country. Use it when planning the full journey, after the flights are decided or when the traveler asks about lounges. Card rules change often; the data has an as_of date and verified flags.",
          "inputSchema": {
            "properties": {
              "airports": {
                "description": "IATA codes in travel order, e.g. [\"SFO\",\"SEA\",\"HND\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cards": {
                "default": [],
                "description": "Lounge-relevant cards the traveler holds, as slugs. US-issued: amex_platinum (the US card), amex_business_platinum, amex_centurion_card, chase_sapphire_reserve, capital_one_venture_x, citi_strata_elite, citi_aadvantage_executive, united_club_infinite, delta_reserve, bilt_palladium, priority_pass_network. Issued elsewhere: amex_platinum_be, amex_platinum_uk, amex_platinum_de, amex_platinum_nl, amex_platinum_fr, amex_platinum_au, revolut_ultra_be, bnp_fortis_mc_world_elite, belfius_private_mc_world_elite. A generic slug (amex_platinum) is read as the country's card when issued_in is outside the US; pass both slugs to compare. Ask where a card was issued if it matters. Empty if unknown.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "issued_in": {
                "default": null,
                "description": "Country the cards were issued in (the wallet's \"Cards issued in\"), e.g. \"Belgium\" or \"BE\". With it, \"amex_platinum\" means that country's Platinum. Null if unknown or US.",
                "type": ["string", "null"]
              }
            },
            "required": ["airports"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lounge access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9741775a93ddd37193d489990ef768b0b96f11660228574d9c4dad37246627c8"
        },
        {
          "name": "points_value",
          "title": "Points or cash verdict",
          "description": "Exact cents-per-point for an award vs the cash fare, in the trip currency: (cash − award fees − what paying cash would earn) ÷ points × 100. When the award is paid by transferring bank points, pass bank + program: it applies the traveler's transfer ratio (e.g. Belgian Amex to Flying Blue is 2:1) and any active bonus, and judges the value per bank point spent. The bands are set in US cents: USD, EUR and GBP are judged in their own cents, other currencies after converting at a dated rate (the bands line names the currency and rate), and where a bank has its own cash-out floor in our data (HDFC SmartBuy at ₹1 a point) that floor is the line. Call it for every award you compare, rather than doing the maths yourself.",
          "inputSchema": {
            "properties": {
              "cash_back_pct": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cash/crypto back % the traveler would earn paying cash (e.g. 4 for a 4% card). Null if unknown."
              },
              "currency": {
                "default": "USD",
                "description": "Currency of all prices, e.g. \"EUR\", \"USD\", \"GBP\" (USD if omitted). Cash fare and award fees must be in the same currency; convert first if they differ.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "award_fees": {
                      "description": "Taxes, fees and surcharges paid on the award",
                      "minimum": 0,
                      "type": "number"
                    },
                    "bank": {
                      "anyOf": [
                        {
                          "enum": ["amex_mr", "chase_ur", "capital_one", "citi_ty", "bilt", "wells_fargo", "us_bank", "rove", "amex_mr_be", "amex_mr_nl", "amex_mr_uk", "amex_mr_fr", "amex_mr_de", "revolut_eu", "revolut_uk", "amex_mr_es", "amex_mr_it", "amex_mr_se", "amex_mr_ch", "amex_mr_ca", "rbc_avion_ca", "amex_mr_au", "anz_au", "westpac_au", "nab_au", "cba_au", "dbs_sg", "uob_sg", "citi_sg", "hsbc_sg", "amex_mr_sg", "hsbc_hk", "citi_hk", "amex_mr_hk", "scb_hk", "hdfc_in", "axis_in", "amex_mr_in", "icici_in", "enbd_ae", "amex_mr_ae", "mashreq_ae", "fab_ae"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Bank currency transferred to pay for it (same keys as transfer_options, e.g. amex_mr_be), or null if the miles are already in the program"
                    },
                    "bank_points": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Bank points spent if you already know it (overrides the ratio lookup); else null"
                    },
                    "cash_price": {
                      "description": "Cash fare for the same flight",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "label": {
                      "default": "",
                      "description": "e.g. \"Flying Blue business, 60k + €500\"; omitted = the miles and fees",
                      "type": "string"
                    },
                    "miles": {
                      "description": "Miles/points the award costs in the airline or hotel program",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "miles_earned_paying_cash": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Airline miles the cash ticket would earn (award tickets usually earn none); null if unknown"
                    },
                    "program": {
                      "default": null,
                      "description": "Program slug the miles are in, e.g. \"flyingblue\", \"avios_ba\", \"aeroplan\"; needed with bank",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["award_fees", "cash_price", "miles"],
                  "type": "object"
                },
                "type": "array"
              },
              "points_per_unit_paying_cash": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Card points earned per dollar/euro on the cash fare (e.g. 5 for Amex Platinum on flights). Null if unknown."
              }
            },
            "required": ["options"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Points or cash verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://points-or-cash/card-v2.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Weighing points against cash…",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://points-or-cash/card-v2.html"
            }
          },
          "digest": "sha256:27db7274ffe2ec5a445053ce6001e2326a3aa6f1341551796d2fe858805c4c23"
        },
        {
          "name": "transfer_options",
          "title": "Transfer options",
          "description": "Which of the traveler's bank points can become miles/points in a target loyalty program, at what ratio, and how many they would end up with. Also returns the transfer bonuses running now for those banks, with the bonus %, the ratio with the bonus and the end date (active_bonus on each path, active_bonuses_for_your_banks for every partner), so it answers \"is there a transfer bonus right now and when does it end\". Ratios come from a researched table, each bank dated by when it was checked (checked on each path; as_of_by_bank); ratios change. Pass the traveler's balances (any amount, e.g. 0, to ask about a ratio or bonus). Miles are whole partner points (floor of points x ratio), in the partner's minimum and steps where known, with what is left over. Where the ratio depends on the card, pass the cards they named or the wallet holds (cards): each path says which card its ratio is for (ratio_card, card_ratios). Partners a bank dropped come back in no_longer_partners with the date.",
          "inputSchema": {
            "properties": {
              "balances": {
                "description": "The traveler's bank point balances, e.g. [{\"bank\":\"amex_mr\",\"points\":250000}]. amex_mr means a US-issued Amex; for an Amex issued elsewhere use the country key (amex_mr_be/_nl/_uk/_fr/_de/_es/_it/_se/_ch/_ca/_au/_sg/_hk/_in/_ae: different partners and ratios). Also Revolut RevPoints (revolut_eu, revolut_uk) and local banks (rbc_avion_ca, anz_au, westpac_au, nab_au, cba_au, dbs_sg, uob_sg, citi_sg, hsbc_sg, hsbc_hk, citi_hk, scb_hk, hdfc_in, axis_in, icici_in, enbd_ae, mashreq_ae, fab_ae). Ask which country issued the card if unclear.",
                "items": {
                  "properties": {
                    "bank": {
                      "enum": ["amex_mr", "chase_ur", "capital_one", "citi_ty", "bilt", "wells_fargo", "us_bank", "rove", "amex_mr_be", "amex_mr_nl", "amex_mr_uk", "amex_mr_fr", "amex_mr_de", "revolut_eu", "revolut_uk", "amex_mr_es", "amex_mr_it", "amex_mr_se", "amex_mr_ch", "amex_mr_ca", "rbc_avion_ca", "amex_mr_au", "anz_au", "westpac_au", "nab_au", "cba_au", "dbs_sg", "uob_sg", "citi_sg", "hsbc_sg", "amex_mr_sg", "hsbc_hk", "citi_hk", "amex_mr_hk", "scb_hk", "hdfc_in", "axis_in", "amex_mr_in", "icici_in", "enbd_ae", "amex_mr_ae", "mashreq_ae", "fab_ae"],
                      "type": "string"
                    },
                    "points": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["bank", "points"],
                  "type": "object"
                },
                "type": "array"
              },
              "cards": {
                "default": [],
                "description": "Cards the traveller named or the wallet holds, e.g. [\"Sapphire Preferred\"], [\"HDFC Regalia Gold\"], [\"Axis Magnus\"], or wallet slugs like \"chase_sapphire_reserve\". Some partners have a ratio per card; empty if unknown.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "miles_needed": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Miles the award costs, to check whether the balances cover it; null if unknown"
              },
              "target_programs": {
                "default": [],
                "description": "Program slugs, e.g. [\"aeroplan\",\"flyingblue\",\"virginatlantic\",\"ana\",\"hyatt\"]. Empty array or omitted = list every partner reachable from the balances.",
                "items": {
                  "type": "string"
                },
                "type": "array"
