            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b90e9218eaaef236a1a5fe284d3e0473be16e726f1080c19bbb8c6a71dea6b6f"
        }
      ],
      "digest": "sha256:fad2621b0226148463d9aadcdd9dac7b2bdf160e65001ae6832616a2825ca3ec"
    }
  }
