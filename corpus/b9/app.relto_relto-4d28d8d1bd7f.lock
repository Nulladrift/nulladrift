{
  "lockfileVersion": 2,
  "subjects": {
    "app.relto/relto": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://relto.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "relto-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RELTO virtually stages empty real estate listing photos without changing the room, and looks up MLS disclosure rules for staged photos. To stage: call stage_room with a public https photo URL. It returns a jobId at once; a render takes about a minute. Then call get_staging_result with that jobId every few seconds until status is done, and give the user the staged photo link with the original photo link. For disclosure questions call get_mls_staging_rules; it is free. Limit: 5 stagings an hour per address.",
      "tools": [
        {
          "name": "get_mls_staging_rules",
          "title": "Look up MLS virtual staging rules",
          "description": "Look up what an MLS board or a US state requires of a virtually staged listing photo: the disclosure rule and where the disclosure must appear, what edits are permitted and prohibited, and penalties, with the rulebook quotes, sources and verification dates RELTO publishes at relto.app/mls-compliance. Use this before staging a listing photo, or whenever a user asks whether or how virtual staging must be disclosed. Pass \"board\" (for example \"Bright MLS\", \"HAR\" or \"CRMLS\") or \"state\" (a name or two-letter code); pass neither to list every board and state covered. Free, needs no account, and starts no staging job. A board or state RELTO has not researched is reported as not covered, never guessed. Informational only, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "board": {
                "description": "MLS board name or slug, for example \"Bright MLS\", \"bright-mls\", \"HAR\", \"NTREIS\" or \"Canopy MLS\".",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, for example \"Texas\" or \"TX\".",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06fb2f682edc799924fff22b888ef06e1be581e36ce4cf2072275cd7e045dcd7"
        },
        {
          "name": "get_staging_result",
          "title": "Get a RELTO staging result",
          "description": "Check a RELTO staging job by jobId and, when it is done, get the staged photo URL, the link to the original photo, and the RELTOLock™ verification summary (state, how many elements were measured, and any element lines that came back altered or inconclusive). RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools. If the job is still queued or processing, call again in a few seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The jobId returned by stage_room.",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4f12e45afdebdfc3ccf29e5551924addccc68ae7ae4636fc3239556bedabaf6"
        },
        {
          "name": "get_verification",
          "title": "Get the full RELTOLock™ verification evidence for a job",
          "description": "Fetch the full RELTOLock™ verification evidence recorded for a finished RELTO staging job: the structural checks run against the original photo and their outcomes. Use this when the summary from get_staging_result is not enough, for example to show exactly which windows and doors were measured and what each check found. RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The jobId returned by stage_room.",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2d6b76060a131bac703f8a74c2191aab1cf0612541bbfb89015379c71c67e75"
        },
        {
          "name": "stage_room",
          "title": "Stage a room photo with RELTO",
          "description": "Start a RELTO staging job for one empty room photo. RELTO furnishes the room and runs RELTOLock™ verification on its own output before delivering it. RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools. Returns immediately with a jobId and status \"queued\"; rendering takes about a minute. Then call get_staging_result with the jobId to collect the staged photo and its verification summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotencyKey": {
                "description": "Optional key so a retried call returns the same job instead of creating a duplicate.",
                "type": "string"
              },
              "image": {
                "description": "The empty room photo: a base64 string, a data URL (data:image/...;base64,...), or a public https URL.",
                "type": "string"
              },
              "roomType": {
                "default": "living-room",
                "description": "What the room is, which decides the furniture placed in it. Use \"general\" when the photo does not make it clear.",
                "enum": ["living-room", "bedroom", "kitchen", "bathroom", "dining-room", "home-office", "office", "nursery", "studio", "outdoor-patio", "general"],
                "type": "string"
              },
              "style": {
                "default": "Modern Minimalist",
                "description": "Furniture and decor style for the staged room.",
                "enum": ["Modern Minimalist", "Cozy Traditional", "Luxury Elegant", "Scandinavian", "Industrial Modern", "Coastal Beachy"],
                "type": "string"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
