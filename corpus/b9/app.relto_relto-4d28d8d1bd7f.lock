      "serverInfo": {
        "name": "relto-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_staging_result",
          "title": "Get a RELTO staging result",
          "description": "Check a RELTO staging job by jobId and, when it is done, get the staged photo URL, the link to the original photo, and the RELTOLock™ verification summary (state, how many elements were measured, and any element lines that came back altered or inconclusive). RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools. If the job is still queued or processing, call again in a few seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The jobId returned by stage_room.",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44255193122db43d5f4ee7a6cffcf13bd27c9e4dd97f7af821558a73d96a5baf"
        },
        {
          "name": "get_verification",
          "title": "Get the full RELTOLock™ verification evidence for a job",
          "description": "Fetch the full RELTOLock™ verification evidence recorded for a finished RELTO staging job: the structural checks run against the original photo and their outcomes. Use this when the summary from get_staging_result is not enough, for example to show exactly which windows and doors were measured and what each check found. RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The jobId returned by stage_room.",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:855ea7a0a18f5b81e502b9caaadc1680976dbd009822e6b70911c3af335ee11c"
        },
        {
          "name": "stage_room",
          "title": "Stage a room photo with RELTO",
          "description": "Start a RELTO staging job for one empty room photo. RELTO furnishes the room and runs RELTOLock™ verification on its own output before delivering it. RELTOLock™ verifies RELTO's own staged outputs against the original photo, window by window and door by door; the verification mark is withheld if anything moved. It does not scan or verify photos staged by other tools. Returns immediately with a jobId and status \"queued\"; rendering takes about a minute. Then call get_staging_result with the jobId to collect the staged photo and its verification summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotencyKey": {
                "description": "Optional key so a retried call returns the same job instead of creating a duplicate.",
                "type": "string"
              },
              "image": {
                "description": "The empty room photo: a base64 string, a data URL (data:image/...;base64,...), or a public https URL.",
                "type": "string"
              },
              "roomType": {
                "description": "Room type, for example \"living-room\" (the default), \"bedroom\", or \"kitchen\".",
                "type": "string"
              },
              "style": {
                "description": "Staging style, for example \"Modern Minimalist\" (the default) or \"Scandinavian\".",
                "type": "string"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db66874a2cf0ddf39e7f38c706d1ceb8604186baaa059a155726e1615f8a0b83"
        }
      ],
      "digest": "sha256:4effc2eafaacb6e619f7b4f713dd14c86f107219c57bea78cd6c5d697ae76a90"
    }
  }
