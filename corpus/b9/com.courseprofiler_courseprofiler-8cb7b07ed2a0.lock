        {
          "name": "assess_finish_time_goal",
          "title": "Assess an elapsed finish-time goal",
          "description": "Assess a positive elapsed goal including saved dwell using the existing nine intensity/shape combinations (5% shapes). Preserve reference-plan movement locks, stops, checkpoint windows, cutoffs and saved GAP settings. Requires current v3 course and runner artifact IDs. Defaults to load_response_evidence_v2 and allow_profile_preparation=false; experimental v3 and in-memory preparation require explicit user approval, never silently retry with permission. Returns canonical support/classifications and bounded diagnostics plus a private complete planning_report artifact, not an applied/exportable plan. No source replacement, evidence selection or Strava access. Budget confidence is not certainty of finishing. Use get_artifact with report_artifact_id for full diagnostics; preserve omission counts and preparation provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_profile_preparation": {
                "default": false,
                "description": "Explicit user permission for existing in-memory profile preparation when needed. Does not authorize source replacement.",
