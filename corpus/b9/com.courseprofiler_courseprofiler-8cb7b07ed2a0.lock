        {
          "name": "compare_pacing_strategies",
          "title": "Compare pacing strategies",
          "description": "Compare all nine existing intensity/shape combinations without an elapsed goal. split_percent defaults to 5, inclusive range 0-15. Preserve reference-plan locks, dwell, checkpoint windows, cutoffs and saved GAP settings. Requires current v3 course and runner artifact IDs. Defaults to load_response_evidence_v2 and allow_profile_preparation=false; experimental v3 and in-memory preparation require explicit user approval, never silently retry with permission. Returns bounded canonical alternatives and a private complete planning_report artifact, not an applied/exportable plan or chosen winner. No source replacement, evidence selection or Strava access. Use get_artifact with report_artifact_id for full diagnostics; preserve omission counts and preparation provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
