        {
          "name": "inspect_runner_profile",
          "title": "Inspect runner evidence",
          "description": "Read an existing USRProf or uploaded USRProf source artifact without reconstruction, scope replacement or model activation. For chat attachments without artifact IDs, first use import_profile_attachment with explicit upload permission if host file handoff is available; otherwise offer the browser upload page immediately. Do not substitute raw-file commentary for this canonical inspection. Required query: summary, quality, recency, course_fit, coverage or insights. Stored readiness is not current fitness or a new pacing gate. Course context is required for course_fit and optional for coverage only; selection is a preview, never applied. Paged queries default offset 0/limit 20, maximum 100. insights rejects offset, limit and course context and returns six bounded families: durability, uphill, GAP, run/hike, terrain mechanics and terrain-relative strength. Preserve their distinct age scopes, fitted/default provenance and extrapolation disclosures; defaults are not athlete limits. Run/hike above 1,000,000 eligible pairs is resource_limited without suppressing other families. Other rendered views are explicitly unavailable in MCP, not missing athlete evidence; experimental gates remain unchanged. Server owns as-of time. No raw source identities or full graph arrays; no Strava, writes, automatic upload or strategy application. Use goal/planning tools only when separately available, not these observational results as a finish-time prediction.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
