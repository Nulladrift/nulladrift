        {
          "name": "inspect_analysis",
          "title": "Inspect canonical analysis",
          "description": "Read an existing v3 CRSProf artifact without reanalysis or downloading source points. Query segments, splits, climbs, stops, range, or quality. Pages default to 20 rows (maximum 100); follow next_offset and total_matches. Distances are metres and times seconds. Climbs group existing UP movement rows, with dwell separate. Missing/UNKNOWN terrain uses the browser grade policy (gain-loss)/distance and saved flat_grade threshold (default zero); no smoothing or new segmentation. terrain_source distinguishes stored/derived/mixed/unavailable classification; terrain_classification_status and unavailable_terrain_segment_count distinguish missing evidence from no climbs. Stored source labels are preserved. Stop duration_metric distinguishes actual_elapsed, actual_nonmoving and planned_dwell. Split separate_boundary_* fields describe structural table separators, not detected stops; their distance/time stays separate from the table subtotal and separate_stop_* fields. Comparison ranges require explicit reference or execution axis; reference timestamps never stand in for planned time. Missing metrics and coverage limitations are explicit. GPX/FIT must first use analyze_activity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact_id": {
                "description": "Private v3 CRSProf or uploaded CRSProf artifact ID.",
                "type": "string"
              },
              "axis": {
                "description": "Range only; required for comparison artifacts.",
                "enum": ["reference", "execution"],
                "type": "string"
              },
              "duration_metric": {
                "default": "actual_elapsed",
                "description": "Stops only. Unknown durations are explicitly excluded when filtering.",
                "enum": ["actual_elapsed", "actual_nonmoving", "planned_dwell"],
                "type": "string"
              },
              "from_m": {
                "description": "Range start on the chosen source axis; required for range.",
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_duration_seconds": {
                "description": "Stops only; inclusive duration threshold.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "enum": ["segments", "splits", "climbs", "stops", "range", "quality"],
                "type": "string"
              },
              "sort": {
                "default": "course_order",
                "enum": ["course_order", "distance_desc", "gain_desc", "duration_desc"],
                "type": "string"
              },
              "to_m": {
                "description": "Range end, greater than from_m and within source coverage. Adjacent ranges own stationary boundary time once; final range includes terminal dwell.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["artifact_id", "query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
