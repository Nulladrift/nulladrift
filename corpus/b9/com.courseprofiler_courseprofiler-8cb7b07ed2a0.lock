        {
          "name": "analyze_activity",
          "title": "Analyze activity or route",
          "description": "Analyze supplied GPX/FIT directly with the browser's canonical pipeline; no catalog search or runner profile is needed. Accept inline course_file, URL, or artifact source. Existing CRSProf is preserved and summarized. Returns job plus a bounded structured summary, units, missing-data warnings and complete CRSProf artifact. Defaults: moving threshold 0.25 m/s, minimum stop 30 s, merge distance 60 m with combined-speed guard. Detected stop elapsed may include short moving portions; it is not total non-moving time. No timestamp means no invented pace/time. Hosted clients without file-byte access or direct upload connectivity should send the user to the fixed page https://courseprofiler.com/agent-upload.html. The page creates the private upload session; the user copies the returned artifact ID into chat. MCP does not create a session-specific browser link. Inspect job.status/errors; this call currently runs analysis synchronously. Optional idempotency {key, caller_token} requires the server feature enabled; API keys are optional. Persist the private caller/key before submission, use get_activity_submission to reconcile, and never switch to a fresh key to bypass an unresolved outcome.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course_file": {
                "additionalProperties": false,
                "description": "Inline GPX/FIT content or base64; use an artifact from agent-upload.html if the client cannot read bytes.",
                "properties": {
                  "base64": {
                    "description": "Base64-encoded file bytes for FIT or other binary files.",
                    "type": "string"
                  },
                  "content": {
                    "description": "Inline text file content for GPX/XML/JSON/USRProf.",
                    "type": "string"
                  },
                  "content_type": {
                    "description": "MIME type for the file.",
                    "type": "string"
                  },
                  "file_name": {
                    "description": "Original file name, e.g. course.gpx or runner.usrprof.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Original file name, e.g. course.gpx or runner.usrprof.",
                    "type": "string"
                  },
                  "url": {
                    "description": "Fetchable HTTPS URL to file bytes. Do not use file:// or bare local paths. ZIP is accepted only when it contains exactly one GPX file.",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "idempotency": {
                "additionalProperties": false,
                "properties": {
                  "caller_token": {
                    "description": "Anonymous callers: private stable 32-byte cryptographic random token, unpadded base64url. Preserve before submitting; never expose in URLs/logs. Omit for API-key identity.",
                    "pattern": "^[A-Za-z0-9_-]{43}$",
                    "type": "string",
                    "writeOnly": true
                  },
                  "key": {
                    "description": "Stable per-submission random key. Same caller/key/input replays; changed input conflicts. Never reuse expired keys.",
                    "pattern": "^[A-Za-z0-9._:-]{16,128}$",
                    "type": "string"
                  }
                },
                "required": ["key"],
                "type": "object"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "algorithm": {
                    "description": "Omitted: PACE_BASED for timestamped input, SLOPE_BASED for untimed routes, matching browser upload defaults.",
                    "enum": ["GREEDY", "SLOPE_BASED", "PACE_BASED"],
                    "type": "string"
                  },
                  "auto_stop_merge_distance": {
                    "default": 60,
                    "description": "Merge distance in metres; combined interval must remain below or at moving threshold.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "auto_stop_threshold": {
                    "default": 30,
                    "description": "Minimum detected stop seconds; zero disables detection.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "include_routes": {
                    "default": true,
                    "type": "boolean"
                  },
                  "moving_threshold": {
                    "default": 0.25,
                    "description": "Moving threshold in m/s.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": [],
                "type": "object"
              },
              "source": {
                "additionalProperties": true,
                "properties": {
                  "artifact_id": {
                    "description": "Existing CourseProfiler artifact ID, e.g. art_...",
                    "type": "string"
                  },
                  "base64": {
                    "description": "Base64-encoded file bytes for raw_file inputs, suitable for FIT or other binary files.",
                    "type": "string"
                  },
                  "content": {
                    "description": "Inline text file content for raw_file inputs, suitable for GPX/XML/JSON/USRProf.",
                    "type": "string"
                  },
                  "content_type": {
                    "description": "MIME type for inline raw_file content.",
                    "type": "string"
                  },
                  "file_name": {
                    "description": "File name for inline raw_file content, e.g. course.gpx or runner.usrprof.",
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["url", "artifact", "raw_json", "raw_file"],
                    "type": "string"
                  },
                  "payload": {
                    "additionalProperties": true,
                    "description": "Inline raw JSON payload for CRSProf/USRProf-compatible inputs.",
                    "type": "object"
