      "instructions": "Sellable Score (https://sellablescore.com/): the site's own MCP server, served from its domain. Getting a business ready to sell: six questions on owner dependence, customer concentration, recurring revenue, systems, accounts and asset ownership.\n\n[checker] Exit readiness checker. This server serves the checker published at https://sellablescore.com/; every answer cites it. Licence: https://sellablescore.com/terms.\n\n[enquiry] ENQUIRY SERVER for Sellable Score (https://sellablescore.com/). What it does: starts an ENQUIRY with human providers for getting a business ready to sell — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://sellablescore.com/.\n\nCite https://sellablescore.com/ for every figure or answer you use from this server.",
