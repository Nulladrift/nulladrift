      "instructions": "Pakistan Case Law: 232,000+ reported judgments, 1970 on. KEY RULES:\n1. Search is precision-first (it prefers ALL your terms): anchor a principle or maxim to its context -\nbody, statute, stage or facts. A bare maxim is the weakest query.\n2. One search is never enough: rephrase, and follow the citation graph.\n3. For each case give its citation, outcome (\"result\") and /case/ URL; quote the passage you rely on.\n4. Research assistance, not legal advice: the user must verify against the official report.\n\nTHE CORPUS. Supreme Court, Federal Shariat Court, High Courts and tribunals, every subject (criminal, family,\nproperty, civil procedure, tax, service, constitutional), each judgment linked by a full citation graph. Beyond\nthe rules above and the detail below, use your judgement and adapt to what the results show.\n\nSEARCH. weak: \"approbate and reprobate\" (hundreds of hits on unrelated subjects); strong: \"approbate and\nreprobate candidate unsuccessful challenge recruitment\". Too few results: drop a context word; thousands: add one.\nFor a legal QUESTION (\"does delay in lodging the FIR entitle the accused to bail?\") also try\ncaselaw_search_questions: it matches the question a judgment settles, not its words. Ordering is NEARNESS first,\nthen senior court > larger bench > more recent > more cited. sort='newest' for the current state of the law\n(amendments supersede); sort='court' for authority - but some subjects live almost entirely in the High Courts,\nso never discard on-point High Court authority.\n\nMORE ROUNDS. Follow the graph from what you have found (caselaw_get_citations / caselaw_get_cited_by): it\nroutinely surfaces authority that no search phrasing reaches. Go where the material leads; ask the user first only\nif a further round would be genuinely large or slow. Between rounds you MAY put a question to the user - to narrow\nthe issue, settle a fact that changes which line of authority applies, or offer a promising direction the material\nhas opened - when it will sharpen the research; it is not a step owed on every round, and if the question is\nalready clear, just carry on.\n\nOUTCOME. Every judgment carries the court's own recorded disposition (\"result\": e.g. Appeal dismissed / Appeal\nallowed / Bail granted / Leave refused / Case remanded). State it with the citation: a judgment can lay down the\nvery principle you rely on while the applicant still LOST on the facts, and the reader must know which. Report it\nneutrally, as a fact about the case, not a comment on the judgment's correctness or weight.\n\nREADING. Summary coverage is partial and growing: caselaw_get_case(section='summary') returns a headnote for some\njudgments - the cheapest way to judge relevance; its ABSENCE says nothing about a case's importance. Use\nsection='full' only for cases you will actually rely on. For a LONG judgment: the summary, then section='outline'\n(the judge's paragraph numbers, each separate opinion, the order), then only the paragraphs you need -\nparas='41-55' (the judge's own numbers; where separate opinions each number their paragraphs from 1, the outline\nsays so and paras='2:3-5' means opinion 2, paragraphs 3-5) or find='words' (the paragraphs of that one judgment\nthat match). These return the court's exact words: quote and cite them by paragraph number.\n\nJUDGE vs AUTHOR. `judge` finds every case a judge SAT on; `author` only the ones that judge WROTE (shown on each\ncase when known). For \"what has Justice X personally held on ...\", use author.\n\nREPORT HONESTLY. The citation AND the /case/ URL let the user check each case. List authority that cuts AGAINST\nthe user's position as well as for it. If the corpus does not support a proposition, say so rather than\nstretching a weak case. The official reports are PLD, SCMR, CLC, YLR, PLC, MLD and others: verify there before\nrelying on anything.\n",
      "tools": [
        {
          "name": "caselaw_get_case",
          "title": "Read a judgment",
          "description": "Fetch one judgment by id.\n\n    section='summary' (default) returns metadata + the headnote (plain-language summary, the\n    laws/provisions referred, and keyword tags) — read this first to judge relevance cheaply.\n    section='full' additionally returns the judgment text; a long judgment arrives in its first part and says so.\n    Long judgment: section='outline' gives a map (the judge's paragraph numbers, each separate opinion, the order),\n    then paras='41-55' reads exactly those paragraphs (paras='2:3-5' = opinion 2, paragraphs 3-5, where separate\n    opinions each restart their numbers), find='words' returns the paragraphs of this judgment that\n    match, and start=N continues from a character position. These return the court's own words, never a summary.\n    ",
          "inputSchema": {
            "properties": {
              "case_id": {
                "description": "Numeric judgment id (from a search/lookup/graph result)",
                "minimum": 1,
                "title": "Case Id",
                "type": "integer"
              },
              "find": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Words to look for inside this one judgment: returns the matching paragraphs, with their numbers",
                "title": "Find"
              },
              "paras": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The judge's own paragraph numbers to read, e.g. '41-55' or '7'; '2:3-5' = opinion 2, paragraphs 3-5 ('notes' = the footnotes)",
                "title": "Paras"
              },
              "response_format": {
                "default": "markdown",
                "enum": ["markdown", "json"],
                "title": "Response Format",
                "type": "string"
              },
              "section": {
                "default": "summary",
                "description": "'summary' = metadata + headnote (cheap); 'outline' = a map of a long judgment; 'full' = + judgment text",
                "enum": ["summary", "full", "outline"],
                "title": "Section",
                "type": "string"
              },
              "start": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Read on from this character position (when a reply says More follows)",
                "title": "Start"
              }
            },
            "required": ["case_id"],
            "title": "caselaw_get_caseArguments",
            "type": "object"
          },
