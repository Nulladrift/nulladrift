        {
          "name": "caselaw_search_questions",
          "title": "Search legal questions",
          "description": "Find judgments by the QUESTION they settle, rather than by words they contain.\n\n    Every judgment summary on this corpus records the questions that judgment actually decides — e.g.\n    \"Does delay in lodging the FIR by itself entitle the accused to bail?\" This searches those\n    questions, so it matches the shape a legal problem arrives in rather than the vocabulary a\n    1987 bench happened to use.\n\n    COVERAGE IS PARTIAL: only some judgments have a summary with questions yet (the response's\n    `coverage_note` gives the current live ratio, which keeps growing). An empty result means no\n    *summarised* judgment matched — it does NOT mean no such judgment exists. Fall back to\n    caselaw_search, which covers the whole corpus.\n\n    The questions are prepared from the judgment text. They are a finding aid, not a\n    holding: cite the judgment, never the question. Pass an id to caselaw_get_case to read it.\n    ",
          "inputSchema": {
            "properties": {
              "court": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
