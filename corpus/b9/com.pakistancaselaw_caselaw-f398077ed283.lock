        {
          "name": "caselaw_search",
          "title": "Search judgments",
          "description": "Full-text search of Pakistani judgments (Supreme Court, High Courts, Federal Shariat Court\n    and tribunals, 1970 onward), with optional filters by court, judge, author, law report and year.\n\n    Ranking follows how lawyers research: nearness to the legal point decides which cases are\n    returned; among comparably-near cases, more senior court > larger bench > more recent >\n    more cited. For the current state of the law, add year_from (e.g. 2025); use sort='court'\n    for the most authoritative first.\n\n    With no query, the filters list judgments newest first - e.g. court='Supreme Court' gives the\n    latest Supreme Court judgments, journal='PLD' with year_from=year_to=2024 gives that volume,\n    and sort='recently_added' alone shows what was added to the site most recently.\n\n    Returns cases with id, title, citation, court, year, outcome, author (the judge who wrote it, when\n    known) and the public URL; a keyword search also gives the number of judges on the bench and the\n    words of the judgment that matched. For an exact\n    report citation use caselaw_lookup_citation. To read a case, pass its id to caselaw_get_case.\n    ",
          "inputSchema": {
            "properties": {
              "author": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only judgments this judge WROTE (the author of the judgment, who also sat on its bench) - narrower than `judge`, which includes every case the judge sat on. Spelling-tolerant like `judge`.",
                "title": "Author"
              },
              "court": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this court: 'Supreme Court', 'Federal Constitutional Court' (or 'FCC'), 'Lahore High Court' (or 'LHC'), 'Sindh High Court', 'Peshawar High Court', 'Islamabad High Court', 'Balochistan High Court', 'Federal Shariat Court', or a tribunal's name",
                "title": "Court"
              },
              "journal": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only judgments reported in this law report: 'PLD', 'SCMR', 'CLC', 'YLR', 'PLC(CS)', 'PTD' ... With year_from/year_to it selects that volume, e.g. SCMR 2025.",
                "title": "Journal"
              },
              "judge": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only judgments where this judge sat on the bench. Spelling-tolerant: 'Asif Khosa', 'Qazi Faez Isa'. The reply names the judge it matched.",
                "title": "Judge"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keywords, e.g. 'bail murder 302' or 'khula dower'. May be left out when a filter is given.",
                "title": "Query"
              },
              "response_format": {
                "default": "markdown",
                "enum": ["markdown", "json"],
                "title": "Response Format",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "relevance (default: nearest on the point, then court/bench/recency/citations) | newest (the ~200 closest matches in strict date order) | court (most senior court first) | recently_added (newest additions to the site). For the CURRENT law on a point, keep relevance and set year_from (e.g. 2025): strict date order can surface judgments that only mention the point in passing.",
                "title": "Sort",
                "type": "string"
              },
              "year_from": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest year (inclusive)",
                "title": "Year From"
              },
              "year_to": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest year (inclusive)",
                "title": "Year To"
              }
            },
            "title": "caselaw_searchArguments",
            "type": "object"
