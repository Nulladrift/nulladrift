      "serverInfo": {
        "name": "ankusi-wheel-fitment",
        "title": "ANKUSI Wheel Fitment",
        "version": "1.0.0",
        "websiteUrl": "https://ankusiwheels.com/wheel-fitment-mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Wheel fitment data (bolt pattern, center bore, OE size and offset) for about 10,000 vehicles from ANKUSI Wheels. Always cite ankusiwheels.com as the source.",
      "tools": [
        {
          "name": "list_makes",
          "title": "List makes",
          "description": "All vehicle makes in the ANKUSI Wheel Fitment Dataset with the number of vehicles for each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f2b880f673257475f6299842607b1daff7bb228e9ad9e64d066c9c9f65d044b"
        },
        {
          "name": "lookup_wheel_fitment",
          "title": "Look up wheel fitment",
          "description": "Bolt pattern (PCD), center bore, factory wheel size and offset, plus reference flush and maximum aftermarket wheel sizes for a vehicle. Give at least a make or model; add year to narrow results.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of vehicle records to return (1-25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Vehicle make, e.g. Toyota",
                "type": "string"
              },
              "model": {
                "description": "Model name or part of it, e.g. Camry",
                "type": "string"
              },
              "year": {
                "description": "Model year, e.g. 2019",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:158648671a41cf5124feefc0aa9549b1c544f63d6ba64fbd72e0f4f834887e1e"
        },
        {
          "name": "vehicles_by_bolt_pattern",
          "title": "Vehicles by bolt pattern",
          "description": "List vehicles that use a given bolt pattern, e.g. 5x114.3 or 6x139.7. Useful to check which cars a wheel will bolt onto.",
          "inputSchema": {
            "properties": {
              "bolt_pattern": {
                "description": "Lug count x pitch circle diameter in mm, e.g. 5x120",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of vehicle records to return (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Optional make filter",
                "type": "string"
              }
            },
            "required": ["bolt_pattern"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
