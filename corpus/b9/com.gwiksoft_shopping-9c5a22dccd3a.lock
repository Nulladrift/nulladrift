        {
          "name": "request_visit",
          "title": "Request a visit or appointment",
          "description": "Requests a store visit or appointment on the day and time the customer chose. It reaches the business’s Appointments board as pending, and the team confirms it with the customer. Not for online-only stores. Only for businesses that take requests through AI assistants; others answer with their WhatsApp and chat links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
