        {
          "name": "search_products",
          "title": "Search the catalogue",
          "description": "Searches the business’s whole catalogue by the customer’s words, a budget, or both. Returns each product’s current price in INR, options, stock and link, plus the business’s live offers. next_cursor gives the next page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "The business id from find_businesses, e.g. \"carat-story\".",
                "maxLength": 100,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "collection": {
                "description": "A collection from list_collections, to narrow the search.",
                "maxLength": 100,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 2000,
                "type": "string"
              },
              "in_stock_only": {
                "description": "Leave out sold-out products.",
                "type": "boolean"
