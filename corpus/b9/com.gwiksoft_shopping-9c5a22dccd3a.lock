      "serverInfo": {
        "name": "gwiksoft",
        "title": "Gwiksoft",
        "version": "2.1.0",
        "websiteUrl": "https://gwiksoft.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Gwiksoft connects independent Indian businesses (jewellers, home and tiles, fashion, skincare, clinics and more) to AI assistants. find_businesses finds businesses that sell what the customer wants; every other tool takes the business id it returns. Prices are in INR and come from each business’s live catalogue. list_offers is the complete list of a business’s current offers. Online stores give a checkout link on their own website (start_checkout). Businesses that take visits and enquiries through AI assistants accept request_visit, create_lead and hand_off_to_team with the customer’s name and phone, shared by the customer to be contacted.",
      "tools": [
        {
          "name": "ask_business",
          "title": "Ask about policies",
          "description": "Answers delivery, returns, exchange, payment, warranty and care questions from what the business published: its FAQs, its website and, for Shopify stores, the store’s own policies. Says how to reach the team when it has no answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "The business id from find_businesses, e.g. \"carat-story\".",
                "maxLength": 100,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "question": {
                "description": "The customer’s question, e.g. \"Do you deliver to Delhi?\"",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["business", "question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["answer", "question", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["answers", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a0bd7bd915cd3468a5ea69439cba23f4c380aa11129991030a2b0bf956a2cc4"
        },
        {
          "name": "create_lead",
          "title": "Send an enquiry to the team",
          "description": "Sends the customer’s enquiry or call-back request, with their name and phone, to the business’s team, who contact them on WhatsApp or by phone. For when the customer has asked to be contacted. Only for businesses that take requests through AI assistants; others answer with their WhatsApp and chat links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "description": "The business id from find_businesses, e.g. \"carat-story\".",
                "maxLength": 100,
                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "call_back": {
                "description": "The customer asked to be called.",
                "type": "boolean"
              },
              "email": {
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "What the customer wants, in a sentence or two.",
                "maxLength": 2000,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "The customer’s phone or WhatsApp number with country code, e.g. +91 98765 43210, shared by the customer to be contacted.",
                "pattern": "^\\+?[\\d\\s()-]{8,20}$",
                "type": "string"
              },
              "product_id": {
                "maxLength": 120,
                "type": "string"
              },
              "product_title": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["business", "message", "phone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["next_step", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b3aee52b225eea9945bceb73d80038c301468b265a249d30bf5895805f0747fc"
        },
        {
          "name": "find_businesses",
          "title": "Find businesses",
          "description": "Finds Gwiksoft businesses that sell what the customer is looking for, optionally in a city, with a few matching products from each. Each result’s business id works with the other tools. Online stores deliver beyond their city.",
