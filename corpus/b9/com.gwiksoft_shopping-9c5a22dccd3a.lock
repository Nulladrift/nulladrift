                "minLength": 2,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "day": {
                "description": "YYYY-MM-DD, today or later.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
