            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "A city, e.g. \"Hyderabad\", to keep to businesses there and online stores.",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "What the customer wants, e.g. \"lab-grown diamond ring\" or \"wall-hung basin\". Empty lists businesses.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "businesses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "business": {
                      "type": "string"
                    },
                    "catalogue": {
                      "type": "string"
                    },
                    "chat_url": {
                      "type": "string"
                    },
                    "description": {
                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": ["string", "null"]
                    },
                    "matching_products": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "image": {
                            "type": ["string", "null"]
                          },
                          "price_label": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["id", "image", "price_label", "title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "online_checkout": {
                      "type": "boolean"
                    },
                    "sells": {
                      "type": "string"
                    },
                    "takes_visits": {
                      "type": "boolean"
                    }
                  },
                  "required": ["business", "catalogue", "chat_url", "description", "location", "matching_products", "name", "online_checkout", "sells", "takes_visits"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
