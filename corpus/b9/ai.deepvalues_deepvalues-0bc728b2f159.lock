      "instructions": "Read-only value-investing research tools: AI research briefings, fundamentals, intrinsic value, guru/smart-money holdings, macro indicators. Most tools work with no credentials for a small daily allowance per address. For more, the human either connects their DeepValues account (add this server as https://app.deepvalues.ai/api/mcp?login — a one-time browser sign-in, no key to paste) or sends Authorization: Bearer dv_sk_… (mint one with no account: POST https://app.deepvalues.ai/api/v1/keys, or the `keys_create` tool — same per-address limits). `pricing` lists every price and every way to pay, including x402 (USDC the agent pays itself, no human) when it is switched on. A failed call returns isError with a JSON payload whose `code` says why (`auth_required`, `quota_exceeded`, `payment_required`) and whose `checkoutUrl` / `connectUrl` / `keysEndpoint` / `x402` say what to do — show a payment link to the human rather than retrying. `keys_me` reports the balance. Missing a dataset, field, company or analysis? Call the `request_data` tool (or POST https://app.deepvalues.ai/api/v1/request-data) with what you wanted and why. It is free, needs no key, and the requests are read every week. Informational only — not investment advice.",
