        {
          "name": "as_filed",
          "title": "Point-in-time fundamentals: what was filed as of a date, before restatement",
          "description": "Call this when the question is about what was known on a past date (a backtest, an audit, \"what did the 10-K say at the time\"), not about the current restated figures. Returns, for each fiscal period filed on or before `date`, the value as it stood on that date (the original filing, or a later filing for the same period if it came before `date`), the filing date, the XBRL tag, a sec.gov link, and `restated_after_date` when a later filing changed it. Values are as printed, not split-adjusted. Inputs: `ticker` (path), `date` (YYYY-MM-DD, required), `metrics` (comma-separated snake_case names, default revenues,net_income,eps_diluted,operating_cash_flow,free_cash_flow,stockholders_equity,total_debt,shares_outstanding), `period` (annual|quarterly), `limit` (periods, default 4). Example: GET /as-filed/AAPL?date=2020-02-01&metrics=revenues,net_income. If the company had filed none of it by `date`, the answer has no periods, the flag `nothing_filed_by_date` and `earliest_filed` (the first filing date on record). A 503 `as-filed-unavailable` means there is no as-filed history for the company to answer from; it is not charged, and GET /fundamentals has the current figures. 0.01 credits. (GET https://app.deepvalues.ai/api/v1/as-filed/{ticker} — 0.01 credits per call; works with no credentials up to 5 call(s)/day per address)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day to look back from (YYYY-MM-DD, 2009-01-01 or later, not in the future).",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "How many of the most recent periods filed by `date` to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "metrics": {
                "description": "Comma-separated metric names (snake_case), at most 20.",
                "type": "string"
              },
              "period": {
                "default": "annual",
                "enum": ["annual", "quarterly"],
                "type": "string"
              },
              "ticker": {
                "pattern": "^[A-Z]{1,5}([.-][A-Z]{1,2})?$",
                "type": "string"
              }
            },
            "required": ["date", "ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Point-in-time fundamentals: what was filed as of a date, before restatement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e853475171fbf21908be5c7cbba5b98c2d0b7d2d342037af14646d566d8e9d10"
        },
        {
          "name": "brief",
          "title": "One-call valuation brief: intrinsic value, margin of safety, verdict, guru holders",
          "description": "Call this first when asked whether a listed company looks cheap or expensive, what it is worth, or which well-known investors own it: one call returns the intrinsic value per share (with each valuation method as an input), the owner-earnings value, the margin of safety against the current price, a deterministic verdict sentence about where the price sits against our value range, the top tracked 13F holders and their last move, and the company profile. Every number carries its unit, period, as-of date and a sec.gov source link, and `checks` lists the sanity checks it passed. A value built from statements filed in another currency and converted to USD carries `fx` (original currency, rate, rate date) and passes `currency_consistent`; when the currency is not known the flag `currency_unverified` says the check did not run. If the valuation fails a check (for example an intrinsic value more than 20x the price, or statements left in a currency other than the USD price), the valuation figures are withheld, `withheld` is true, `checks.failed` names the check, and the call is not charged. Input: `ticker` (path), e.g. GET /brief/KO. The first brief each UTC day is free per key and per keyless address; after that 0.30 credits. Data and analysis, not investment advice. (GET https://app.deepvalues.ai/api/v1/brief/{ticker} — 0.3 credits per call; works with no credentials up to 1 call(s)/day per address)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "US listing symbol, e.g. KO or BRK.B.",
                "pattern": "^[A-Z]{1,5}([.-][A-Z]{1,2})?$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "One-call valuation brief: intrinsic value, margin of safety, verdict, guru holders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
