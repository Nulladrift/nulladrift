        {
          "name": "as_filed",
          "title": "Point-in-time fundamentals: what was filed as of a date, before restatement",
          "description": "Call this when the question is about what was known on a past date (a backtest, an audit, \"what did the 10-K say at the time\"), not about the current restated figures. Returns, for each fiscal period filed on or before `date`, the value as it stood on that date (the original filing, or a later filing for the same period if it came before `date`), the filing date, the XBRL tag, a sec.gov link, and `restated_after_date` when a later filing changed it. Values are as printed, not split-adjusted. Inputs: `ticker` (path), `date` (YYYY-MM-DD, required), `metrics` (comma-separated snake_case names, default revenues,net_income,eps_diluted,operating_cash_flow,free_cash_flow,stockholders_equity,total_debt,shares_outstanding), `period` (annual|quarterly), `limit` (periods, default 4). Example: GET /as-filed/AAPL?date=2020-02-01&metrics=revenues,net_income. If the company had filed none of it by `date`, the answer has no periods, the flag `nothing_filed_by_date` and `earliest_filed` (the first filing date on record). A 503 `as-filed-unavailable` means there is no as-filed history for the company to answer from; it is not charged, and GET /fundamentals has the current figures. 0.02 credits. (GET https://app.deepvalues.ai/api/v1/as-filed/{ticker}, e.g. https://app.deepvalues.ai/api/v1/as-filed/AAPL?date=2020-02-01 — 0.02 credits per call; works with no credentials up to 5 call(s)/day per address) Missing data? Call `request_data`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day to look back from (YYYY-MM-DD, 2009-01-01 or later, not in the future).",
                "examples": ["2020-02-01"],
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "How many of the most recent periods filed by `date` to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "metrics": {
                "description": "Comma-separated metric names (snake_case), at most 20.",
                "examples": ["revenues,net_income,eps_diluted"],
                "type": "string"
              },
              "period": {
                "default": "annual",
                "enum": ["annual", "quarterly"],
                "type": "string"
              },
              "ticker": {
                "description": "The real ticker symbol, e.g. AAPL; share classes as BRK.B or BRK-B. Substitute it into the path (/fundamentals/AAPL), never the literal {ticker}.",
                "examples": ["AAPL"],
                "pattern": "^[A-Z]{1,5}([.-][A-Z]{1,2})?$",
                "type": "string"
              }
            },
            "required": ["date", "ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Point-in-time fundamentals: what was filed as of a date, before restatement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:feddc76532b8857862d30ef4248968bff7834cd8471eff0293b04f868f9ed231"
