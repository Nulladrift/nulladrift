        {
          "name": "app_tracker_lookup",
          "title": "Read one app or a few",
          "description": "Use this when the user asks about one competitor app, such as \"how many installs does this Play app have?\" or \"when was this app last updated?\". It returns no reviews or complaint themes (no allowed source carries store reviews): for complaints, ask the user to paste the reviews. Pass app (an App Store id or link, or a Google Play package or link) and country, or apps (up to 5) to compare in one call. Returns the price, rating, rating count, update date, an estimate and a Stale Winner score; for Google Play also exact installs, the rating split and the in-app price range. warnings names each part that is off: App Store IAP tiers, version history and privacy labels. With apps, the answer is reports (one per app, in the order asked) and failed (each app not read, with its error code).",
