        {
          "name": "app_tracker_estimate",
          "title": "Estimate an app's downloads",
          "description": "Use this when the user asks how many downloads an App Store app gets, such as \"how many downloads does Daily Themed Crossword get a month?\". Pass app (an App Store id or link). Returns downloads30d, a range (low, high, ratio) with method (rank_curve, rank_and_velocity, rating_velocity or rank_bound), confidence and basis lines, plus download growth over 7, 30 and 90 days (null until the history is that long). revenue30d is null and warnings says why: the grossing chart has no allowed source. Worldwide App Store, last 30 days. rank_bound means only an upper bound is known.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "app": "1197354394",
                "country": "gb"
              }
            ],
            "properties": {
