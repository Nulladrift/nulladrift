            "properties": {
              "country": {
                "description": "Two-letter store country, such as us, gb or jp. Default us.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "genre": {
                "description": "Apple genre id such as 6007 (Productivity) or a genre name. Default 6007.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "How many apps to return, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Only apps with no update for at least this many days. Default 365.",
                "maximum": 36500,
                "minimum": 365,
                "type": "integer"
              },
              "min_ratings": {
                "description": "Only apps with at least this many ratings. Default 100.",
                "maximum": 10000000,
                "minimum": 20,
                "type": "integer"
              }
            },
            "type": "object"
          },
