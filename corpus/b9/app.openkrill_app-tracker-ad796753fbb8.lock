              "country": {
                "description": "Two-letter store country used to find the app, such as us. The estimate is always worldwide. Default us.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
