        {
          "name": "app_tracker_charts",
          "title": "Read a top chart with movers",
          "description": "Use this when the user asks what is on or climbing the App Store top free or top paid chart, such as \"top free apps in the US\" or \"what is climbing the top paid chart?\". Pass country, chart (free or paid) and limit. Returns ranked entries with price, rating, rating count and change since an earlier snapshot, plus movers (gainers, losers, new entries, dropped) and apps released in the last 7 days. movers.since is the time of the snapshot compared against; null means there is none yet. Google Play, grossing and genre charts answer source_off: no allowed source publishes them.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "chart": "free",
                "country": "us",
                "limit": 5,
                "store": "apple"
              }
            ],
            "properties": {
              "chart": {
                "description": "Which top chart: free (default) or paid. grossing answers source_off: no allowed source publishes it.",
                "enum": ["free", "paid", "grossing"],
                "type": "string"
              },
              "country": {
                "description": "Two-letter store country, such as us, gb or jp. Default us.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "genre": {
                "description": "Omit for the overall chart. A genre answers source_off: no allowed source publishes genre charts.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 100. Default 25. The whole chart is always scanned.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "store": {
                "description": "apple (App Store, default). play answers source_off: Google Play charts load only through a path its robots.txt disallows.",
                "enum": ["apple", "play"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "chart": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "day": {
                "type": ["string", "null"]
              },
              "entries": {
                "items": {
                  "properties": {
                    "developer": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "fetchedAt": {
                "type": "string"
              },
              "genre": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "movers": {
                "properties": {
                  "dropped": {
                    "type": "array"
                  },
                  "gainers": {
                    "type": "array"
                  },
                  "losers": {
                    "type": "array"
                  },
                  "newEntries": {
                    "type": "array"
                  },
                  "since": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "newReleases": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "stale": {
                "description": "Present only when Apple's feed failed and the newest stored copy of the chart, up to 3 days old, was served instead. fetchedAt is that copy's time.",
                "properties": {
                  "reason": {
                    "type": "string"
                  },
                  "takenAt": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "store": {
                "type": "string"
              },
              "untrusted_source": {
                "type": "boolean"
              }
            },
            "required": ["as_of", "chart", "country", "entries", "movers", "note", "source", "store", "untrusted_source"],
            "type": "object"
          },
