                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "apps": {
                "description": "Up to 5 apps to tear down in one call, each in the same form as app, to compare competitors. All share country, store and reviews.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "country": {
                "description": "Two-letter store country, such as us, gb or jp. Default us.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "reviews": {
                "description": "No allowed source carries store reviews, so complaint themes are always empty. Default false; true only adds a warnings line saying reviews are off.",
                "type": "boolean"
