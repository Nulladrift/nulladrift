        {
          "name": "browse_community",
          "title": "Browse Community Strategies (leaderboard)",
          "description": "Browse the public community leaderboard of published strategies, ranked\n    by a composite performance score (best first). No signup or key needed.\n\n    Each entry's `id` is what `one_shot` takes as `community_id` to deploy a\n    live signal model running that exact strategy.\n\n    Args:\n      limit: How many top entries to return (default 20, max 200).\n      sort: Ranking metric, best-first — one of \"composite\" (default),\n        \"ret\" (total return), \"wr\" (win rate), \"sharpe\", \"n_trades\". Mirrors\n        the quantifyme.ai/community page's sortable columns. The sorted\n        entries keep their `id`, which one_shot(community_id=...) deploys.\n\n    Returns:\n      dict with:\n        - scripts (list[dict]): ranked entries, best first. Each has:\n            id (int — pass to one_shot as community_id), username, title,\n            description, created_at, score, and metrics {total_ret,\n            sharpe_strat, win_rate, n_trades, mdd, profit_factor}.\n        - count (int).\n        - metric (str): the sort key applied.\n    ",
