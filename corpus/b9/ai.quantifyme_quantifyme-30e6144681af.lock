          "name": "link_account",
          "title": "Link My QuantifyMe Account",
          "description": "Link this chat to the user's existing QuantifyMe account.\n\n    For a user who already has a QuantifyMe account, who wonders why their\n    models are missing here, or who wants what they deploy here to show up in\n    their own dashboard.\n\n    By default this connector works with NO signup: it mints an anonymous trial\n    account per MCP session, so models deployed here belong to that throwaway\n    identity rather than to the user's real one. This returns a short-lived URL;\n    once the user opens it and approves, every later call that carries the same\n    OAuth bearer or the same MCP session acts as their account and deploys land\n    in their own model list. A client that opens a new MCP session on every turn\n    must link again in that session; every answer's `acting_as` line says which\n    identity was used.\n\n    Returns `link_url`: the user opens it and approves; nothing else is\n    required from them. If the session is already linked, returns\n    already_linked:true and the account's username instead.\n    ",
