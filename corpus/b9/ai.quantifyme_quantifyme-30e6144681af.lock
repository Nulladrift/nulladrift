      "instructions": "QuantifyMe turns a trading strategy written in plain English into a backtested signal model for seven FX pairs. Each session gets an anonymous trial account automatically, with a small credit allowance; `link_account` connects an existing QuantifyMe account instead. `one_shot` takes the user's request as `prompt` (plus optional `symbol` and `timeframe`) and starts one deploy per call; each call creates a separate deploy and deploy card. The platform routes the request itself: a vague request ('deploy a 15min EURUSD model') deploys the best curated preset for that market, or a fresh build when there is none; a specific rule-based description ('buy when RSI < 30') generates a fresh strategy. A community strategy is another user's code: it deploys only after the user has seen its author and code (`get_strategy_code`) and picked it, by passing its `community_id` to `one_shot`. `one_shot` returns a `job_token` at once; `get_deploy_result(job_token)` waits for the deploy to finish and returns the out-of-sample stats, the live dashboard URL and the code source as text. Its `source` field says whether the code came from a curated preset, a fresh generation or a community strategy (with its author); a `suggestion` is a matching community strategy that was not deployed. `get_model_chart` returns a model's trades and stats for a chart. `list_models` and `list_deployed` show the account's models; `browse_community` and `find_strategy` search published community strategies; `get_quote` returns the latest price. QuantifyMe never places orders or moves money: it sends signals to a webhook or Telegram chat the user supplies. Backtests and signals are information, not financial advice; no performance is promised.",
