        {
          "name": "get_deploy_result",
          "title": "Get Deploy Result",
          "description": "Wait for a `one_shot` deploy to finish and return its final result.\n\n    `one_shot` returns a job_token immediately and the LIVE CARD already streams\n    progress and renders the interactive backtest chart itself. Call this ONCE with\n    the token to get the final numbers as TEXT so you can summarize them — it does\n    NOT render another card (no need for get_model_chart). It BLOCKS until the deploy\n    finishes (or ~2.5 min); on timeout it returns ok:false + pending:true — call it\n    again with the same token.\n\n    IMPORTANT: if `source == \"community\"`, the deploy used a PRE-EXISTING strategy by\n    `@author` (the user picked it) - tell the user that, share the `live_url` as the\n    Live dashboard link, and ask whether they'd like to GENERATE A CUSTOM strategy\n    instead. A `suggestion` is a community strategy that matched a vague request; it\n    was NOT deployed; offer it, and deploy it only after the user sees its author and\n    code and picks it. Use the `note` field as your guide.\n\n    Args:\n      job_token: the token returned by `one_shot`.\n\n    Returns:\n      dict with: ok, stem, model, live_url, symbol, timeframe, channels (list),\n      stats:{ret, wr, pf, n, mdd} (out-of-sample test-split metrics — SHOW THESE),\n      source (\"preset\" | \"generated\" | \"community\"), author (community username if\n      any), author_url + strategy_url (render @author and \"pre-existing strategy\" as\n      those Markdown links), community_id, suggest_custom (bool), suggestion\n      ({community_id, title, author} or null: offered, not deployed), and note (a\n      ready instruction - follow it). On failure: {ok:false, error} (or {pending:true}).\n    ",
          "inputSchema": {
