        {
          "name": "get_deploy_result",
          "title": "Get Deploy Result",
          "description": "Wait for a `one_shot` deploy to finish and return its final result as text.\n\n    Takes the job_token `one_shot` returned. Waits until the deploy finishes, up\n    to about 2.5 minutes; past that it returns ok:false with pending:true, and a\n    later call with the same token picks the same deploy up again. It renders no\n    card of its own: the one_shot deploy card is the visual, where the client\n    renders it.\n\n    `source == \"community\"` means the deploy used a pre-existing strategy by\n    `@author` that the user picked. A `suggestion` is a community strategy that\n    matched a vague request and was not deployed; it deploys only after the user\n    has seen its author and code and picked it.\n\n    Args:\n      job_token: the token returned by `one_shot`.\n\n    Returns:\n      dict with: ok, stem, model, live_url, symbol, timeframe, channels (list),\n      stats:{ret, wr, pf, n, mdd} (out-of-sample test-split metrics), source\n      (\"preset\" | \"generated\" | \"community\"), author (community username if any),\n      author_url + strategy_url (links for the author and the community strategy),\n      community_id, suggest_custom (bool), suggestion ({community_id, title,\n      author} or null: matched, not deployed), and note (a one-line summary of\n      the source). On failure: {ok:false, error} (or {pending:true}).\n    ",
          "inputSchema": {
