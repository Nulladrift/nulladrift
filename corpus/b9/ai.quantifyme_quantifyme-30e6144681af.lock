      "instructions": "QuantifyMe is a no-code quant trading platform. A trial API key is created automatically for this session — no signup. TO DEPLOY: call `one_shot` EXACTLY ONCE, passing the user's request as `prompt` (their words) plus `symbol`/`timeframe` if given. Do NOT pre-decide presets or community strategies, and do NOT ask the user 'existing or custom?' first — the platform routes automatically: a VAGUE request ('deploy a 15min EURUSD model', 'generate a strat') deploys the best curated preset for that market, or a fresh build when there is none; a SPECIFIC rule-based description ('buy when RSI < 30') generates a fresh one. A community strategy (another user's code) deploys only after you show the user its author and code (`get_strategy_code`) and the user picks it: then call one_shot with its `community_id`. NEVER call one_shot more than once for one request (extra calls create duplicate deploy cards). `one_shot` returns a job_token immediately and the LIVE CARD then streams progress and renders the backtest chart by itself. After it returns, call `get_deploy_result(job_token)` ONCE to get the final stats as text so you can summarize — you do NOT need `get_model_chart` (the live card already shows the chart). If `get_deploy_result` returns a `suggestion` (a matching community strategy), you may offer it; deploy it only if the user picks it after seeing its author and code. If it returns source='community' (the user picked one), tell the user it deployed a PRE-EXISTING strategy by @<author>, share the live_url as the Live dashboard link, and ASK whether they'd like to GENERATE A CUSTOM strategy instead (only then call one_shot again, with their rules as the prompt). Use `list_models` / `list_deployed` to inspect state; `find_strategy` is available if a user explicitly wants to browse for a match.",
      "tools": [
        {
          "name": "browse_community",
          "title": "Browse Community Strategies (leaderboard)",
          "description": "Browse the public community leaderboard of published strategies, ranked\n    by a composite performance score (best first). No signup or key needed.\n\n    Copy-trade flow: call this to find a top strategy, then pass its `id` to\n    `one_shot` as `community_id` to deploy a live signal model running that\n    exact strategy in one call.\n\n    Args:\n      limit: How many top entries to return (default 20, max 200).\n      sort: Ranking metric, best-first — one of \"composite\" (default),\n        \"ret\" (total return), \"wr\" (win rate), \"sharpe\", \"n_trades\". Mirrors\n        the quantifyme.ai/community page's sortable columns, so an agent can\n        pick the top strategy by the metric it cares about in one call. The\n        sorted entries keep their `id`, so the winner is directly deployable\n        via one_shot(community_id=...).\n\n    Returns:\n      dict with:\n        - scripts (list[dict]): ranked entries, best first. Each has:\n            id (int — pass to one_shot as community_id), username, title,\n            description, created_at, score, and metrics {total_ret,\n            sharpe_strat, win_rate, n_trades, mdd, profit_factor}. SHOW the\n            top few with their win_rate / total_ret so the user can pick one.\n        - count (int).\n        - metric (str): the sort key applied.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "sort": {
                "default": "composite",
                "title": "Sort",
                "type": "string"
              }
            },
            "title": "browse_communityArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "browse_communityDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse Community Strategies (leaderboard)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/qm-community-v3.html",
            "openai/widgetDescription": "Top community trading strategies, each with a one-click copy-and-deploy."
          },
          "digest": "sha256:674643ef30ce53de7b7075d63f280da835e03bcda4c4d80ed8bbc60396a9e9cc"
