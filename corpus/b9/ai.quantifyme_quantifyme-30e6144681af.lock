        {
          "name": "one_shot",
          "title": "Deploy Strategy (generate + backtest + go live)",
          "description": "End-to-end deploy: generate strategy → train → deploy live.\n\n    One of `prompt` (free-form NL), `preset` (curated winning strategy), or\n    `community_id` (copy a published community strategy) is required. If more\n    than one is passed, precedence is community_id > preset > prompt.\n\n    Args:\n      prompt: Natural-language strategy description (e.g. \"Buy when RSI < 30, sell > 70\").\n      symbol: Currency pair to backtest on. One of: EURUSD, USDJPY, GBPUSD,\n        USDCHF, USDCAD, AUDUSD, NZDUSD. Default EURUSD.\n      timeframe: Candle granularity. One of: 1min, 5min, 15min, 1h. Default 15min.\n      claude_model: Which Claude variant writes the code: \"sonnet\" (default, best\n        quality) or \"haiku\" (faster, cheaper). Generation is billed from the\n        account's credits. Ignored when `preset` is set (no generation needed).\n      preset: Curated winning-strategy slug. Skips Claude generation entirely\n        — deploys a pre-saved strategy known to backtest well on the chosen\n        symbol. Available slugs: ema_cross_fast, momentum, scalper_stack,\n        sma_only, trend_ema, volatility, bb_squeeze, all_mix, pivot_kid_ema.\n        Not every slug exists for every symbol; list_models shows what deployed.\n      community_id: Copy-trade a published community strategy. Pass the `id`\n        of an entry from `browse_community`. Loads that exact strategy code,\n        skips Claude generation, then trains + deploys it. `symbol`/`timeframe`\n        still apply to the backtest+deploy.\n      webhook_url: Optional webhook to receive live signals.\n      telegram_chat_id: Optional Telegram chat ID for signal delivery.\n\n    Returns at once (the deploy runs in the background so the live card can\n    stream progress) with:\n        - job_token (str): get_deploy_result(job_token) returns the final result.\n        - poll_url (str): the progress URL the live card polls.\n        - pending (bool): true; the deploy is still running.\n        - symbol, timeframe (str).\n\n    Each call starts one deploy and one deploy card, and is billed from the\n    account's credits. The server routes the request: a vague `prompt` deploys\n    the best curated preset for the market, or a fresh build when there is none;\n    specific rules generate a fresh strategy. A community strategy deploys only\n    after the user has seen its author and code (get_strategy_code) and picked\n    it, through its `community_id`.\n\n    get_deploy_result(job_token) waits for the deploy and returns the\n    out-of-sample stats, `stem`, `live_url` and `source`/`author` as text; its\n    `source` says when a pre-existing community strategy was used, and a\n    `suggestion` is a matching community strategy that was not deployed.\n    ",
          "inputSchema": {
            "properties": {
              "claude_model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Claude Model"
              },
              "community_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Community Id"
              },
              "preset": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Preset"
              },
              "prompt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Prompt"
