        {
          "name": "find_strategy",
          "title": "Find a Matching Strategy",
          "description": "Find a published community strategy that matches a plain-English idea.\n\n    Mirrors the quantifyme.ai landing page: \"Found <X> by @<author> (WR/PF):\n    use it, or generate fresh\". It is for browsing; a vague deploy request is\n    handled by one_shot(prompt=...) alone, which deploys the best curated preset\n    or a fresh build. A community strategy is another user's code, so it deploys\n    only after the user has seen its author and code (get_strategy_code with the\n    match's community_id) and picked it. The two outcomes:\n      - use the match: one_shot(community_id=<match.community_id>) deploys that\n        exact strategy, with no generation;\n      - generate fresh: one_shot(prompt=\"<their description>\") writes a new\n        custom strategy.\n    With no match, only the second applies.\n\n    Args:\n      description: the user's strategy idea in plain English (e.g. \"buy EURUSD\n        15min when RSI < 30, sell when RSI > 70\").\n      symbol: optional pair to constrain the match (EURUSD, USDJPY, GBPUSD,\n        USDCHF, USDCAD, AUDUSD, NZDUSD).\n      timeframe: optional granularity to constrain the match (1min/5min/15min/1h).\n\n    Returns:\n      dict with:\n        - match: the best existing strategy, or null. When present:\n            {community_id, title, username, wr, pf, ret, n_trades, symbol,\n             timeframe}. Pass community_id to one_shot to deploy it unchanged.\n        - description: echoed back; one_shot(prompt=...) with it generates fresh.\n        - suggestion: one sentence describing the match and the two outcomes.\n    ",
          "inputSchema": {
            "properties": {
              "description": {
                "title": "Description",
                "type": "string"
              },
              "symbol": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Symbol"
              },
              "timeframe": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Timeframe"
              }
            },
            "required": ["description"],
            "title": "find_strategyArguments",
            "type": "object"
          },
