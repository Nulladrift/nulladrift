                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "headline": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "suggested_section": {
                    "enum": ["world", "politics", "business", "economy", "technology", "ai", "science", "health", "climate", "security", "sports", "culture", "other"],
                    "type": "string"
                  },
                  "summary": {
                    "description": "One or two sentences: what happened and why it matters.",
                    "maxLength": 600,
                    "minLength": 1,
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                },
                "required": ["author_confidence", "body", "claims", "headline", "summary"],
                "type": "object"
              },
              "submission_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["article", "submission_id"],
            "type": "object"
          },
