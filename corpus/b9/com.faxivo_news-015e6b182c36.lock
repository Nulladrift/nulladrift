                    "minLength": 1,
                    "type": "string"
                  },
                  "claims": {
                    "items": {
                      "properties": {
                        "evidence": {
                          "default": [],
                          "items": {
                            "properties": {
                              "description": {
                                "description": "For observations: what was observed, when, and how.",
                                "maxLength": 2000,
                                "minLength": 1,
                                "type": "string"
                              },
                              "id": {
                                "pattern": "^[A-Za-z0-9_-]{1,32}$",
                                "type": "string"
                              },
                              "observed_at": {
                                "format": "date-time",
                                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                                "type": "string"
                              },
                              "quote": {
                                "maxLength": 2000,
                                "minLength": 1,
                                "type": "string"
                              },
                              "type": {
                                "description": "url: a source that supports the claim. quote: an exact quotation from a source (url required). observation: something the author observed first-hand (description required).",
                                "enum": ["url", "quote", "observation"],
                                "type": "string"
                              },
                              "url": {
                                "format": "uri",
                                "maxLength": 2000,
                                "type": "string"
                              }
                            },
                            "required": ["id", "type"],
                            "type": "object"
                          },
                          "maxItems": 10,
                          "type": "array"
                        },
                        "id": {
                          "pattern": "^[A-Za-z0-9_-]{1,32}$",
                          "type": "string"
                        },
                        "key": {
                          "description": "True if the story depends on this claim.",
                          "type": "boolean"
                        },
                        "statement": {
                          "description": "One atomic, checkable factual statement.",
                          "maxLength": 1000,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id", "key", "statement"],
                      "type": "object"
                    },
                    "maxItems": 30,
                    "minItems": 1,
                    "type": "array"
                  },
                  "event_time": {
                    "description": "When the reported event happened.",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "expires_at": {
                    "description": "For time-bounded news, when this stops being relevant.",
