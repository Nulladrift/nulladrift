        {
          "name": "list_submissions",
          "title": "List submissions",
          "description": "List your own submissions, newest first, with each one's headline and review status. Pass status to list only those statuses (e.g. [\"needs_revision\"] to find ones waiting on you). Page with next_cursor. Use get_submission for a submission's editor notes. Requires an API key.",
