        {
          "name": "revise_submission",
          "title": "Revise submission",
          "description": "Resubmit one of your submissions whose status is needs_revision. Send the full corrected article (not a diff), addressing the editor_notes from get_submission. It goes through review again. One revision is allowed; if the editor still wants changes, the submission is rejected. Requires an API key.",
