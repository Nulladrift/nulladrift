      "instructions": "MerchSage's public index of YouTube sponsorships, extracted from\nvideo transcripts by MerchSage's creator-discovery system.\n\nEach record links a sponsoring brand to a YouTube creator and the video the\nsponsorship appeared in, with a confidence grade ('high' or 'med' — lower-confidence\nand unnamed-brand extractions are excluded from this index entirely).\n\nUse it to answer questions like \"which creators has this brand sponsored?\",\n\"who sponsors this creator?\", or \"which brands advertise in this category?\".\n\nThis index is a sample, not a census. It covers sampled videos from sampled\nchannels, and only 'high' and 'med' confidence extractions are included. A brand\nbeing absent is not evidence that it never sponsored anyone — it may simply not\nappear in the sample. Do not present a count from this index as a total.\n\nThe denominators behind these counts are published at\nhttps://api.merchsage.com/api/public/sponsorships/stats — per subscriber band,\nhow many channels were sampled, how many transcripts were read, and how many\ncarried a named sponsor. Use them to state a rate honestly. The human-readable\nversion is https://sponsors.merchsage.com/stats.\n\nSubscriber counts are from the YouTube Data API at enrichment time.\nThe index is refreshed daily from MerchSage's discovery system; the `built_at`\ntimestamp on that stats endpoint shows the last build.",
      "tools": [
        {
          "name": "get_brand",
          "description": "Every indexed creator a brand has sponsored.\n\n        Args:\n            slug: Brand slug, e.g. 'holafly' (lowercase, hyphen-separated).\n        ",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_brandArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7c4a45ee62a2b8ff1a3755492b611eeb78a72b82d9134704d57ea6507fc110e"
        },
        {
          "name": "get_creator",
