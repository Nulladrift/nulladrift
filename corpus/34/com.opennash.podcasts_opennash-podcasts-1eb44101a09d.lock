                "description": "Keywords, matched literally (stemmed full-text search, not semantic). Best with 2-4 distinctive words such as names, companies or terms, e.g. \"Jensen Huang data centers\". Filler and question words are ignored; results matching every keyword come first, then results matching some of them.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
