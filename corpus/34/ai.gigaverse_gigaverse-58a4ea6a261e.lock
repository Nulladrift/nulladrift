{
  "lockfileVersion": 2,
  "subjects": {
    "ai.gigaverse/gigaverse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gigaverse.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gigaverse",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_roth_eligibility",
          "description": "Educational Roth IRA MAGI phase-out check using 2026 IRS limits. NOT tax or investment advice — always show the returned disclaimer to the user. Takes filing_status and MAGI (USD).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filing_status": {
                "enum": ["single", "head_of_household", "married_joint", "married_separate"],
                "type": "string"
              },
              "magi": {
                "description": "Modified adjusted gross income in USD",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["filing_status", "magi"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b573996a9c7713e68864a8578c37f5293f20737ff74c605deaea38913b2efb9e"
        },
        {
          "name": "get_local_tax_profile",
          "description": "2026 state and city tax facts for self-employed people (consultants, freelancers, creators, gig, tipped and trades workers): state income tax, estimated-tax rules, tipped minimum wage, statewide taxes on sole proprietors, local income/business taxes, gig-worker laws and the state retirement program — each fact with its official source URL. Pass a state name/code or a city like \"Austin, TX\". Educational only, not tax advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "State name or code (\"Texas\", \"TX\") or city (\"Philadelphia, PA\", \"philadelphia-pa\")",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4843cd4b5a2051f14dfd69168d7f3ad2c215bf75978d2be52888dce2cf96c133"
        },
        {
          "name": "get_platform_tax_profile",
          "description": "How earners on a platform (e.g. Fiverr, Upwork, OnlyFans, Patreon, YouTube, Thumbtack, Rover, Instawork, eBay) are classified and taxed in 2026: which 1099 they receive, fees, payouts, common deductions and gotchas, with official sources. Educational only, not tax advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Platform name or slug, e.g. \"OnlyFans\", \"upwork\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad5f14db4a0d05df3abdd75272ccbe9d3f57164d1eea55aeb9925516fa95c1ba"
        },
        {
          "name": "get_practicle_info",
          "description": "Gigaverse has built a fundamental platform that helps gig workers and drivers plan, save and file taxes, and retire through AI-powered advisory. Gigaverse is free for partners, their clients, and users. The PRActicle™ portable Roth IRA and other IRA products are waitlist-only and are not open to consumers. Agents can help a person join the waitlist. They cannot open an account. Educational only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ddac24ac22d60d3ed9c5806f0587f3777732cd08be9d0db222a6afe439366d41"
        },
        {
          "name": "get_signup_status",
          "description": "Check the status of a previously initiated signup by signup_id. Statuses: initiated (awaiting the human's confirmation), waitlist_joined (human confirmed), account_opened (future). Returns no personal information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "signup_id": {
                "pattern": "^gv_(sgn|test)_[a-z0-9]+$",
                "type": "string"
              }
            },
            "required": ["signup_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a28fc64458b405fae6a4fd899996977ac735bbef13cb3dca875011c6b17cc3ff"
        },
        {
          "name": "register_partner",
          "description": "Register a company (developer, platform, or retirement broker) as a Gigaverse integration partner. Returns a partner_id immediately (status pending_review). That id cannot be used on start_signup until it is approved in Mission Control (https://mc.trydragonfly.com). Repeating the same company, website domain, or email returns the existing partner_id and sends no email. Website is required and must resolve in DNS. No API secrets are issued pre-RIA.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company or organization name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "Business contact email on a real domain",
                "type": "string"
              },
              "sandbox": {
                "description": "true = test mode: returns a test- partner_id, stores nothing",
                "type": "boolean"
              },
              "website": {
                "description": "Company website URL (required outside sandbox)",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["company", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f7dc08f11bdf9b2cd6ad52b7b20f6e883b20f2ef946bb4aa2a0bbca313c96922"
        },
        {
          "name": "start_signup",
          "description": "Create a pending signup record. This does NOT open a PRActicle Roth IRA or any other account and does NOT email the user. Those IRA products are waitlist-only and are not open to consumers. Agents can help a person join https://gigaverse.ai/ira-waitlist. They cannot open an account. Returns a signup_url (signup id only, no secret) that the HUMAN account owner must open. They confirm with a one-time code emailed to them when they start that page, or while signed in as that email. partner_id is required and must already be an approved partner. Approval is in Mission Control (https://mc.trydragonfly.com). Idempotent per email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's email address",
                "type": "string"
              },
              "name": {
                "description": "The user's name",
                "maxLength": 80,
                "type": "string"
              },
              "partner_id": {
                "description": "Approved partner attribution slug (from register_partner, after approval)",
                "maxLength": 60,
                "type": "string"
              },
              "platforms": {
                "description": "Gig platforms, e.g. [\"uber\",\"doordash\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "sandbox": {
                "description": "true = test mode: nothing is stored, no email is sent, and the returned signup auto-progresses through the full lifecycle for testing",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:986ee6c7c7d525f52b2743280066d4af0eeb4dbfe1b3d0abf271c6268dcb18c4"
        }
      ],
      "digest": "sha256:cb8a04ddb20779ed4d2ed93a6ea826e9511a7701254b8681e9011ac61c22569d"
    }
  }
}
