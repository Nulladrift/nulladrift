      "tools": [
        {
          "name": "datasheetvend_build_component_twin",
          "title": "Extract a datasheet into a component twin",
          "description": "Extract a datasheet with DatasheetVend Fast Extraction and return its Unified Component Model (UCM) digital twin in one call. Fast Extraction runs once for every requested module, and the modules' facts combine into one twin, filed where they belong: pins, whole_part (temperatures, absolute limits, package, ordering code), interfaces_rails, registers and checks — every fact with a check ('passed', 'needs_review', 'disagrees', 'failed_sanity_check') and, where recorded, its datasheet page. Returns the same ucm_twin_v1 view as datasheetvend_get_component_twin, with every section unless you ask for sections, one pin or a search, plus an `extraction` block: the engine, `rescued_features` (modules Fast Extraction could not complete at turbo speed that the standard deep engine extracted instead, slower for just those modules -- still billed and still in the twin), the modules NEITHER engine could extract (no credits charged for those), the credits charged and stored=false. Treat facts that did not pass as unverified and cite their page. The twin is NOT saved to your account: datasheetvend_get_component_twin and the dashboard will not find it, and calling again extracts and bills again. Needs a DatasheetVend API key. Costs the requested modules' credits: pinout (1 credit), absolute_max (2 credits), pin_cautions (2 credits), logic_levels (2 credits), thermal (2 credits), timing (2 credits), register_map (3 credits), peripheral_matrix (2 credits), power_battery (1 credit), part_decoder (2 credits), cad_normalized (1 credit, extracted as footprint); all of them 20 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentPath": {
                "description": "https:// URL to the datasheet PDF. The remote /api/mcp endpoint accepts ONLY https:// URLs (it downloads them).",
                "minLength": 1,
                "type": "string"
              },
              "max_facts": {
                "description": "Cap on facts returned across the pin and sections (default 200). `truncated` says when it was reached.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "modules": {
                "description": "Twin modules to extract and combine: pinout, absolute_max, pin_cautions, logic_levels, thermal, timing, register_map, peripheral_matrix, power_battery, part_decoder, cad_normalized. Omit for all of them. Each costs its module credits.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "only_passed": {
                "description": "Only facts that passed every check. Default false: every fact comes with its check.",
                "type": "boolean"
              },
              "partName": {
                "description": "Optional part number / MPN to target in a datasheet that covers several parts.",
                "type": ["string", "null"]
              },
              "pin": {
                "description": "One pin by number, name or alternate function (for example '27', 'PC4' or 'SDA'): every fact that reaches it — its own and those of its rails and interfaces.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "search": {
                "description": "Only facts whose parameter, symbol, statement or node contains this text, case-insensitive (for example 'storage temperature' or 'TWCR'). With no sections given, searches pins, whole_part, interfaces_rails and registers.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "Parts of the twin to include besides the summary: pins, whole_part, interfaces_rails, registers, checks. Omit, with no pin or search, for every section — this twin is not stored, so there is no second read.",
                "items": {
                  "enum": ["pins", "whole_part", "interfaces_rails", "registers", "checks"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["documentPath"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "built_from": {
                "additionalProperties": false,
                "properties": {
                  "modules": {
                    "description": "Module ids combined into this twin",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "runs": {
                    "description": "Extraction runs the twin draws on",
                    "type": "number"
                  }
                },
                "required": ["modules", "runs"],
                "type": "object"
              },
              "checks": {
                "additionalProperties": false,
                "properties": {
                  "disagreements": {
                    "description": "Parameters holding more than one value",
                    "type": "number"
                  },
                  "disagrees": {
                    "type": "number"
                  },
                  "failed_sanity_check": {
                    "type": "number"
                  },
                  "needs_review": {
                    "type": "number"
                  },
                  "passed": {
                    "type": "number"
                  }
                },
                "required": ["disagreements", "disagrees", "failed_sanity_check", "needs_review", "passed"],
                "type": "object"
              },
              "contract": {
                "description": "Contract id: ucm_twin_v1",
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "facts": {
                    "type": "number"
                  },
                  "interfaces": {
                    "type": "number"
                  },
                  "pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  }
                },
                "required": ["facts", "interfaces", "pins", "rails", "registers"],
                "type": "object"
              },
              "datasheet": {
                "type": "string"
              },
              "extraction": {
                "additionalProperties": false,
                "description": "The Fast Extraction run behind this twin",
                "properties": {
                  "credits": {
                    "description": "Module credits this call costs an API-key caller",
                    "type": "number"
                  },
                  "engine": {
                    "additionalProperties": false,
                    "description": "Which engine produced this result",
                    "properties": {
                      "duration_ms": {
                        "description": "Wall time of the extraction in milliseconds",
                        "type": "number"
                      },
                      "failed_modules": {
                        "description": "Modules that came back without a result: Fast Extraction could not extract them, and neither could the per-module deep-engine rescue where one was attempted",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "lanes": {
                        "description": "How each module was answered, where the engine recorded it",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "lane": {
                              "description": "deterministic_primary, worker_with_deterministic_brain, deterministic_recovery, worker_only, or monolith_rescue",
                              "type": "string"
                            },
                            "module": {
                              "type": "string"
                            },
                            "reason": {
                              "type": "string"
                            }
                          },
                          "required": ["lane", "module", "reason"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "name": {
                        "description": "The engine the extraction started on: always \"fast_extraction\" (runtime says what answered)",
                        "type": "string"
                      },
                      "runtime": {
                        "description": "The runtime that answered: the Fast Extraction runtime, or \"monolith_rescue\" when the deep engine re-ran this module; null when no engine could run",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["duration_ms", "failed_modules", "lanes", "name", "runtime"],
                    "type": "object"
                  },
                  "extracted_features": {
                    "description": "The extraction features those modules needed",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "requested_modules": {
                    "description": "Twin modules this call asked Fast Extraction for",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rescued_features": {
                    "description": "Features Fast Extraction could not complete at turbo speed but the standard deep engine rescued; empty when every feature came from the fast lane",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "stored": {
                    "description": "Always false: the twin is not saved to the account",
                    "type": "boolean"
                  }
                },
                "required": ["credits", "engine", "extracted_features", "requested_modules", "rescued_features", "stored"],
                "type": "object"
              },
              "how_to_read": {
                "type": "string"
              },
              "part": {
                "additionalProperties": false,
                "properties": {
                  "family": {
                    "type": ["string", "null"]
                  },
                  "package": {
                    "type": ["string", "null"]
                  },
                  "package_pin_count": {
                    "type": ["number", "null"]
                  },
                  "part_number": {
                    "type": ["string", "null"]
                  },
                  "vendor": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["family", "package", "package_pin_count", "part_number", "vendor"],
                "type": "object"
              },
              "pin": {
                "description": "The requested pin with the facts that reach it, or null when no pin was asked for."
              },
              "places": {
                "additionalProperties": false,
                "properties": {
                  "interfaces": {
                    "type": "number"
                  },
                  "not_placed": {
                    "type": "number"
                  },
                  "on_pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  },
                  "whole_part": {
                    "type": "number"
                  }
                },
                "required": ["interfaces", "not_placed", "on_pins", "rails", "registers", "whole_part"],
                "type": "object"
              },
              "sections": {
                "additionalProperties": {},
                "description": "The requested sections: pins, whole_part, interfaces_rails, registers, checks — facts with their check and, where recorded, their page.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["built_from", "checks", "contract", "counts", "datasheet", "extraction", "how_to_read", "part", "pin", "places", "sections", "truncated", "warnings"],
            "type": "object"
          },
