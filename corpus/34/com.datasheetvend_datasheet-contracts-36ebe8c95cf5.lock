        {
          "name": "datasheetvend_extract_altium_bundle",
          "title": "Parse an Altium Designer ASCII footprint export",
          "description": "Parse an Altium Designer ASCII footprint export (a text file — NOT a binary .PcbLib/.SchLib) and extract the footprint name, per-pad copper geometry (designator, name, coordinates, size, shape), layer map, and this module's own review/audit verdict. This reads an EXISTING Altium file; it does not build one from a datasheet PDF (for that, see the Altium Assist output pack on a completed extraction job). No model call — deterministic parsing only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentPath": {
                "description": "https:// URL to an Altium ASCII footprint export (a text file, not a binary .PcbLib/.SchLib). The remote /api/mcp endpoint accepts ONLY https:// URLs (it downloads them); a local filesystem path works solely in local stdio mode (npm run mcp:serve)..",
                "minLength": 1,
                "type": "string"
              },
              "partName": {
                "description": "Optional component name / MPN.",
                "type": ["string", "null"]
              }
            },
            "required": ["documentPath"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contract": {
                "description": "Contract schema identifier: altium_evidence_v1",
                "type": "string"
              },
              "delivery_status": {
                "anyOf": [
                  {
                    "enum": ["approved", "approved_with_warnings", "blocked"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The module's own audit verdict for this file — the same one a REST/dashboard job would carry."
              },
              "footprint_name": {
                "description": "Extracted Altium footprint pattern name",
                "type": ["string", "null"]
              },
              "footprints_detected": {
                "description": "How many footprint blocks the file contained. Only one (the best match) is returned above.",
                "type": "number"
              },
              "layer_map": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "layer": {
                      "type": "string"
                    },
                    "line_count": {
                      "type": "number"
                    },
                    "pad_count": {
                      "type": "number"
                    },
                    "text_count": {
                      "type": "number"
                    }
                  },
                  "required": ["layer", "line_count", "pad_count", "text_count"],
                  "type": "object"
                },
                "type": "array"
              },
              "manufacturer_part_number": {
                "description": "The partName you sent, or the component name text found in the file — never the footprint's own name.",
                "type": ["string", "null"]
              },
              "other_footprint_names": {
                "description": "Names of the OTHER footprints in the file, not returned above — nothing is silently dropped.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pads": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "designator": {
                      "description": "Pad designator / pin number",
                      "type": "string"
                    },
                    "height": {
                      "description": "Pad copper height, exactly as written in the source file — see units. Never converted.",
                      "type": ["number", "null"]
                    },
                    "name": {
                      "description": "Pad signal name",
                      "type": ["string", "null"]
                    },
                    "shape": {
                      "description": "Pad shape (ROUND, RECTANGULAR, OCTAGONAL, SMD)",
                      "type": ["string", "null"]
                    },
                    "width": {
                      "description": "Pad copper width, exactly as written in the source file — see units. Never converted.",
                      "type": ["number", "null"]
                    },
                    "x": {
                      "description": "Pad center X, exactly as written in the source file — see units. Never converted.",
                      "type": ["number", "null"]
                    },
                    "y": {
                      "description": "Pad center Y, exactly as written in the source file — see units. Never converted.",
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["designator", "height", "name", "shape", "width", "x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "review": {
                "additionalProperties": false,
                "properties": {
                  "reasons": {
                    "description": "Review reasons if required",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "required": {
                    "description": "Whether human review is required",
                    "type": "boolean"
                  }
                },
                "required": ["reasons", "required"],
                "type": "object"
              },
              "source_format_detected": {
                "description": "line_block_ascii is the only format this tool actually reads.",
                "enum": ["line_block_ascii", "record_pipe_ascii", "ole_compound_binary", "unrecognized_text"],
                "type": "string"
              },
              "status": {
                "description": "FAILED means the credits for this call are refunded automatically: the file was unreadable, a recognized-but-unsupported format, or contained no footprint.",
                "enum": ["OK", "FAILED"],
                "type": "string"
              },
              "units": {
                "description": "Coordinate/size units exactly as the source file stated them. Values are NEVER converted — 'unknown' means the file did not state a unit, not that the numbers are millimetres.",
                "enum": ["mm", "mil", "inch", "unknown"],
                "type": "string"
              },
              "warning_details": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "review", "info"],
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "warnings": {
                "description": "Engineering warnings emitted",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["contract", "delivery_status", "footprint_name", "footprints_detected", "layer_map", "manufacturer_part_number", "other_footprint_names", "pads", "review", "source_format_detected", "status", "units", "warning_details", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
