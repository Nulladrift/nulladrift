        {
          "name": "datasheetvend_get_component_twin",
          "title": "Read a datasheet's component twin",
          "description": "Read the Unified Component Model (UCM) digital twin of one datasheet already extracted with DatasheetVend. Every fact comes with a check ('passed', 'needs_review', 'disagrees', 'failed_sanity_check') and, where the extraction recorded one, its datasheet page, filed where it belongs: pins, whole_part (temperatures, absolute limits, package, ordering code), interfaces_rails (I2C/SPI/clock/ADC requirements and supply-rail values), registers (the register map) and checks. Call it first with no options for the summary, then ask for `sections`, one `pin` (by number, name or alternate function) or a `search` term so the answer stays small. Treat facts that did not pass as unverified and cite their page. Reads stored results only: never extracts, never bills. Needs a DatasheetVend API key; find datasheet names with datasheetvend_list_component_twins. To twin a datasheet the account has not extracted, use datasheetvend_build_component_twin.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "datasheet": {
                "description": "The datasheet name exactly as datasheetvend_list_component_twins returns it. A unique part of the name also works.",
                "maxLength": 260,
                "minLength": 1,
                "type": "string"
              },
              "max_facts": {
                "description": "Cap on facts returned across the pin and sections (default 200). `truncated` says when it was reached.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "only_passed": {
                "description": "Only facts that passed every check. Default false: every fact comes with its check.",
                "type": "boolean"
              },
              "pin": {
                "description": "One pin by number, name or alternate function (for example '27', 'PC4' or 'SDA'): every fact that reaches it — its own and those of its rails and interfaces.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "search": {
                "description": "Only facts whose parameter, symbol, statement or node contains this text, case-insensitive (for example 'storage temperature' or 'TWCR'). With no sections given, searches pins, whole_part, interfaces_rails and registers.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "Parts of the twin to include besides the summary: pins (each pin's own facts), whole_part, interfaces_rails, registers, checks (disagreements, failed sanity checks, facts to review, facts that name no pin). Omit for the summary only.",
                "items": {
                  "enum": ["pins", "whole_part", "interfaces_rails", "registers", "checks"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["datasheet"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "built_from": {
                "additionalProperties": false,
                "properties": {
                  "modules": {
                    "description": "Module ids combined into this twin",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "runs": {
                    "description": "Extraction runs the twin draws on",
                    "type": "number"
                  }
                },
                "required": ["modules", "runs"],
                "type": "object"
              },
              "checks": {
                "additionalProperties": false,
                "properties": {
                  "disagreements": {
                    "description": "Parameters holding more than one value",
                    "type": "number"
                  },
                  "disagrees": {
                    "type": "number"
                  },
                  "failed_sanity_check": {
                    "type": "number"
                  },
                  "needs_review": {
                    "type": "number"
                  },
                  "passed": {
                    "type": "number"
                  }
                },
                "required": ["disagreements", "disagrees", "failed_sanity_check", "needs_review", "passed"],
                "type": "object"
              },
              "contract": {
                "description": "Contract id: ucm_twin_v1",
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "facts": {
                    "type": "number"
                  },
                  "interfaces": {
                    "type": "number"
                  },
                  "pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  }
                },
                "required": ["facts", "interfaces", "pins", "rails", "registers"],
                "type": "object"
              },
              "datasheet": {
                "type": "string"
              },
              "how_to_read": {
                "type": "string"
              },
              "part": {
                "additionalProperties": false,
                "properties": {
                  "family": {
                    "type": ["string", "null"]
                  },
                  "package": {
                    "type": ["string", "null"]
                  },
                  "package_pin_count": {
                    "type": ["number", "null"]
                  },
                  "part_number": {
                    "type": ["string", "null"]
                  },
                  "vendor": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["family", "package", "package_pin_count", "part_number", "vendor"],
                "type": "object"
              },
              "pin": {
                "description": "The requested pin with the facts that reach it, or null when no pin was asked for."
              },
              "places": {
                "additionalProperties": false,
                "properties": {
                  "interfaces": {
                    "type": "number"
                  },
                  "not_placed": {
                    "type": "number"
                  },
                  "on_pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  },
                  "whole_part": {
                    "type": "number"
                  }
                },
                "required": ["interfaces", "not_placed", "on_pins", "rails", "registers", "whole_part"],
                "type": "object"
              },
              "sections": {
                "additionalProperties": {},
                "description": "The requested sections: pins, whole_part, interfaces_rails, registers, checks — facts with their check and, where recorded, their page.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["built_from", "checks", "contract", "counts", "datasheet", "how_to_read", "part", "pin", "places", "sections", "truncated", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a datasheet's component twin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88197a43639f6432aef26f40f73af4f21e1b47bd0d37db525d9f43f9b490240a"
        },
        {
          "name": "datasheetvend_inspect_document_page",
          "title": "Inspect one mapped page (Tier-2 detail)",
          "description": "Tier-2 detail for ONE page of an already-mapped datasheet: the full measured anatomy (text metrics, MuPDF geometry census, structural geometry signals), the page's own headings and first lines, and which modules claim the page. Use it AFTER datasheetvend_extract_document_map, when the Tier-1 index says a page matters and its one-line summary is not enough. Pass the document.sha256 from the map (served free from cache). Set include_physical=true ONLY when you truly need the raw positioned tokens/vector paths — that payload can weigh hundreds of KB for one dense page. Read-only; never rebuilds, never bills.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentRef": {
                "description": "The document.sha256 from a prior datasheetvend_extract_document_map result (preferred), or the same document path/URL.",
                "minLength": 1,
                "type": "string"
              },
              "include_physical": {
                "description": "Include the raw MuPDF physical reconstruction (positioned tokens, vector paths). Heavy — default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Physical 1-based PDF page number to inspect.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["documentRef", "page"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cached": {
                "description": "Whether served from the Document Map cache",
                "type": "boolean"
              },
              "inspection": {
                "additionalProperties": {},
                "description": "status ok: document_map_page_inspection_v1 (page, form, headings, claimed_by_modules, anatomy, physical_map)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "page": {
                "description": "status page_out_of_range: the page that was asked for",
                "type": "number"
              },
              "status": {
                "description": "ok, or page_out_of_range when the map has no such page",
                "enum": ["ok", "page_out_of_range"],
                "type": "string"
              },
              "total_pages": {
                "description": "status page_out_of_range: the map's page count",
                "type": ["number", "null"]
              }
            },
            "required": ["cached", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect one mapped page (Tier-2 detail)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:253f14da8a48a32b8725b19deb2ef86b98dfc7980334a105e539c40646800280"
        },
        {
          "name": "datasheetvend_list_component_twins",
          "title": "List your datasheets that have a component twin",
          "description": "List the datasheets in your DatasheetVend account that have a Unified Component Model (UCM) digital twin: the facts DatasheetVend already extracted from each datasheet — pins, supply rails, interfaces, registers and whole-part limits — combined across the extraction runs stored for it. Returns each datasheet's exact name, the modules its twin draws on, how many runs it has and when it was last run. Reads stored results only: never extracts, never bills. Needs a DatasheetVend API key. Pass a returned name to datasheetvend_get_component_twin. To twin a datasheet the account has not extracted, use datasheetvend_build_component_twin.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many datasheets to return, newest run first. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Part of the datasheet's file name to filter by, case-insensitive (for example 'ATmega328P').",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contract": {
                "description": "Contract id: ucm_twin_list_v1",
                "type": "string"
              },
              "datasheets": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "datasheet": {
                      "description": "Exact datasheet name — pass it to the get tool",
                      "type": "string"
                    },
                    "last_run_at": {
                      "description": "ISO time of the newest run",
                      "type": "string"
                    },
                    "module_count": {
                      "type": "number"
                    },
                    "modules": {
                      "description": "Module ids with stored output for this datasheet",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "never_extracted": {
                      "description": "Twin-ready modules never extracted for this datasheet",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "runs": {
                      "description": "Extraction runs stored for this datasheet",
                      "type": "number"
                    }
                  },
                  "required": ["datasheet", "last_run_at", "module_count", "modules", "never_extracted", "runs"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_step": {
                "type": "string"
              },
              "total": {
                "description": "Datasheets with a twin that match, before the limit",
                "type": "number"
              }
            },
            "required": ["contract", "datasheets", "next_step", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List your datasheets that have a component twin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4b2e29b83bb5a3a7117821624e9e8937252b1817ebecc4e43cbb8720521e3f3"
        },
