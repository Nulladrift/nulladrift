        {
          "name": "datasheetvend_calculate_land_pattern",
          "title": "Estimate a land pattern (IPC-7351-style, generic)",
          "description": "Estimate a land pattern from package numbers: a generic IPC-7351-style pad width, pad length and courtyard for a perimeter package (QFN/DFN/SON leadless, or QFP/SOIC/SSOP/TSSOP/SOP gull-wing). This is a nominal estimate, NOT IPC-7351B's tolerance-stacked tables, NOT IPC-certified and NOT the datasheet's recommended land pattern: use the datasheet's own drawing when it prints one. It gives one pad size for every pad, no pad positions, no numbered pad map and no exposed (thermal) pad, so it cannot build a footprint on its own; for an official KiCad footprint use datasheetvend_match_kicad_footprint. Each value's origin is in inputs_used (given, derived from a standard outline, estimated from pitch, or formula), and caveats travel with every result. An unsupported family or a missing input is refused and named. Free, no API key, no model call, reads no account data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body_length_mm": {
                "description": "Body length, in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "body_width_mm": {
                "description": "Body width, in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "density_level": {
                "description": "Margin level: most (largest pads), nominal (default) or least. Nominal margins, not IPC levels A/B/C.",
                "enum": ["most", "nominal", "least"],
                "type": "string"
              },
              "package_type": {
                "description": "Package name as the datasheet prints it, for example 'QFN', 'LQFP', 'TSSOP', 'SOIC'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "pad_length_mm": {
                "description": "A pad length to use as given instead of the formula, in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "pad_width_mm": {
                "description": "A pad width to use as given instead of the 60%-of-pitch estimate, in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "pin_count": {
                "description": "Number of terminals. Only checked to be above 0.",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "integer"
              },
              "pitch_mm": {
                "description": "Terminal pitch, in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "span_x_mm": {
                "description": "Lead-tip span across the width (gull-wing only; give both spans or neither), in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "span_y_mm": {
                "description": "Lead-tip span across the length (gull-wing only; give both spans or neither), in millimetres",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              }
            },
            "required": ["body_length_mm", "body_width_mm", "package_type", "pin_count", "pitch_mm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a land pattern (IPC-7351-style, generic)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:199521b939a8a934eee2533e0f940f27d1f58c4af7db62ea2585c983f4132d83"
        },
        {
          "name": "datasheetvend_check_design_value",
          "title": "Check a design value against a datasheet's rules",
          "description": "Check one design value against every rule DatasheetVend extracted from a datasheet (its pin-cautions rulebook): for example a 4.7 kΩ pull-up, a 100 nF decoupling capacitor or a 3.6 V supply. Returns pass, fail or needs_review per rule that applies, with the rule's datasheet source, and a summary that counts EVERY rule, including the ones that could not be compared, so 0 failures never hides 'nothing was compared'. An unknown unit is refused, not passed. Pass the job_id of an extraction in your account that ran the pin_cautions module. Deterministic: runs DatasheetVend's checks in code, calls no model and extracts nothing. Costs no credits. Needs a DatasheetVend API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_id": {
                "description": "An extraction job in your account that ran the pin_cautions module.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "package": {
                "description": "The package the design uses (for example 'TQFP32'), so package-specific rules apply.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "unit": {
                "description": "Its unit, for example 'kohm', 'nF', 'V', 'mA'. An unrecognised unit is refused.",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "description": "The design value to check, for example 4.7",
                "type": "number"
              }
            },
            "required": ["job_id", "unit", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a design value against a datasheet's rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b011f759c82bf378495999d0284930a1be8e851331ac02f2673a659bc58eb861"
        },
        {
          "name": "datasheetvend_check_parts_compatibility",
          "title": "Check whether chips work together (draft wiring)",
          "description": "Will these chips work together? Ask before you have a netlist. Reads ONLY the extraction jobs you pass (2-12, from your account; repeats are removed, and two runs of one part are one part), drafts a starting wiring from pin names the way the DatasheetVend Workbench does (one elected microcontroller wired to each device over I2C or SPI), runs the electrical rules on it and answers per pair. The answer rests on that DRAFT wiring, never on your schematic: `basis` is 'draft_wiring', and to audit a real board use datasheetvend_crosscheck_netlist. Never a bare 'yes': each pair is CONFLICT, NO CONFLICT FOUND (nothing the bench could check failed, not 'they work together') or NOT CHECKED, with checks_ran of checks_total and what is missing. Device-to-device pairs are never wired, so they stay NOT CHECKED; with no part proven a microcontroller nothing is wired at all; UART and CAN are never drafted. Read the pair counts (conflict_pairs, no_conflict_pairs, not_checked_pairs), `verdict`, `rule_coverage` and the assumed-value counts before you repeat an answer. Findings are capped, with their total. A job whose outputs are gone is refused. Deterministic: runs DatasheetVend's checks in code, calls no model and extracts nothing. Costs no credits. Needs a DatasheetVend API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_ids": {
                "description": "2-12 extraction jobs in your account, one or more per part. Include each part's pinout and logic_levels runs.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 2,
                "type": "array"
              },
              "protocol": {
                "description": "Which bus the draft wires: AUTO (default) lets the bench choose per device, as the Workbench does.",
                "enum": ["AUTO", "I2C", "SPI"],
                "type": "string"
              },
              "system_voltage_v": {
                "description": "The bench's supply rail. Default 3.3.",
                "exclusiveMinimum": 0,
                "maximum": 60,
                "type": "number"
              }
            },
            "required": ["job_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether chips work together (draft wiring)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:61461573bc8a78255971853c03f5668e9db7a27fdaeb22ada712d030859bcbff"
        },
        {
          "name": "datasheetvend_compare_extractions",
          "title": "Compare one module across extractions",
          "description": "Compare the SAME module across 2-4 of your extraction jobs in one aligned table, instead of reading each job. Rows align on key_field (default: the pin or register identifier) and compare value_field (default: the name); pass `keys` for specific pins or registers. Parts are never merged: values are positional per job, and a key missing from one part is null there. A job whose outputs expired, whose module is empty or unreadable is listed with its problem, never dropped. Differences come first and differingRows counts every row, not only the returned page (totalRows beside it). Get job ids from datasheetvend_search_my_extractions. Reads the recorded state of your account's own jobs (owner, or TEAM-shared in your workspace; a refunded job is refused): nothing is extracted and no model is called. Costs no credits. Needs a DatasheetVend API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_ids": {
                "description": "2-4 extraction jobs in your account.",
                "items": {
                  "description": "An extraction job in your account.",
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "key_field": {
                "description": "Field to align rows on, for example 'pin_number'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "keys": {
                "description": "Only these keys, for example ['1','2','A1'].",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "limit": {
                "description": "Rows returned, differences first. Default 30.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "module": {
                "description": "The module to compare, for example pinout, register_map, absolute_max.",
                "enum": ["pinout", "footprint", "kicad", "altium", "cad_normalized", "thermal", "pin_cautions", "register_map", "c_header", "timing", "absolute_max", "analog_intelligence", "logic_levels", "part_decoder", "passive_bom", "peripheral_matrix", "power_battery"],
                "type": "string"
              },
              "value_field": {
                "description": "Field whose values are compared, for example 'pin_name'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["job_ids", "module"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare one module across extractions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
