        {
          "name": "datasheetvend_get_component_twin",
          "title": "Read a datasheet's component twin",
          "description": "Read the Unified Component Model (UCM) digital twin of one datasheet already extracted with DatasheetVend. Every fact comes with a check ('passed', 'needs_review', 'disagrees', 'failed_sanity_check') and, where the extraction recorded one, its datasheet page, filed where it belongs: pins, whole_part (temperatures, absolute limits, package, ordering code), interfaces_rails (I2C/SPI/clock/ADC requirements and supply-rail values), registers (the register map) and checks. Call it first with no options for the summary, then ask for `sections`, one `pin` (by number, name or alternate function) or a `search` term so the answer stays small. Treat facts that did not pass as unverified and cite their page. Reads stored results only: never extracts, never bills. Needs a DatasheetVend API key; find datasheet names with datasheetvend_list_component_twins. To twin a datasheet the account has not extracted, use datasheetvend_build_component_twin.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "datasheet": {
                "description": "The datasheet name exactly as datasheetvend_list_component_twins returns it. A unique part of the name also works.",
                "maxLength": 260,
                "minLength": 1,
                "type": "string"
              },
              "max_facts": {
                "description": "Cap on facts returned across the pin and sections (default 200). `truncated` says when it was reached.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "only_passed": {
                "description": "Only facts that passed every check. Default false: every fact comes with its check.",
                "type": "boolean"
              },
              "pin": {
                "description": "One pin by number, name or alternate function (for example '27', 'PC4' or 'SDA'): every fact that reaches it — its own and those of its rails and interfaces.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "search": {
                "description": "Only facts whose parameter, symbol, statement or node contains this text, case-insensitive (for example 'storage temperature' or 'TWCR'). With no sections given, searches pins, whole_part, interfaces_rails and registers.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "Parts of the twin to include besides the summary: pins (each pin's own facts), whole_part, interfaces_rails, registers, checks (disagreements, failed sanity checks, facts to review, facts that name no pin). Omit for the summary only.",
                "items": {
                  "enum": ["pins", "whole_part", "interfaces_rails", "registers", "checks"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["datasheet"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "built_from": {
                "additionalProperties": false,
                "properties": {
                  "modules": {
                    "description": "Module ids combined into this twin",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "runs": {
                    "description": "Extraction runs the twin draws on",
                    "type": "number"
                  }
                },
                "required": ["modules", "runs"],
                "type": "object"
              },
              "checks": {
                "additionalProperties": false,
                "properties": {
                  "disagreements": {
                    "description": "Parameters holding more than one value",
                    "type": "number"
                  },
                  "disagrees": {
                    "type": "number"
                  },
                  "failed_sanity_check": {
                    "type": "number"
                  },
                  "needs_review": {
                    "type": "number"
                  },
                  "passed": {
                    "type": "number"
                  }
                },
                "required": ["disagreements", "disagrees", "failed_sanity_check", "needs_review", "passed"],
                "type": "object"
              },
              "contract": {
                "description": "Contract id: ucm_twin_v1",
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "facts": {
                    "type": "number"
                  },
                  "interfaces": {
                    "type": "number"
                  },
                  "pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  }
                },
                "required": ["facts", "interfaces", "pins", "rails", "registers"],
                "type": "object"
              },
              "datasheet": {
                "type": "string"
              },
              "how_to_read": {
                "type": "string"
              },
              "part": {
                "additionalProperties": false,
                "properties": {
                  "family": {
                    "type": ["string", "null"]
                  },
                  "package": {
                    "type": ["string", "null"]
                  },
                  "package_pin_count": {
                    "type": ["number", "null"]
                  },
                  "part_number": {
                    "type": ["string", "null"]
                  },
                  "vendor": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["family", "package", "package_pin_count", "part_number", "vendor"],
                "type": "object"
              },
              "pin": {
                "description": "The requested pin with the facts that reach it, or null when no pin was asked for."
              },
              "places": {
                "additionalProperties": false,
                "properties": {
                  "interfaces": {
                    "type": "number"
                  },
                  "not_placed": {
                    "type": "number"
                  },
                  "on_pins": {
                    "type": "number"
                  },
                  "rails": {
                    "type": "number"
                  },
                  "registers": {
                    "type": "number"
                  },
                  "whole_part": {
                    "type": "number"
                  }
                },
                "required": ["interfaces", "not_placed", "on_pins", "rails", "registers", "whole_part"],
                "type": "object"
              },
              "sections": {
                "additionalProperties": {},
                "description": "The requested sections: pins, whole_part, interfaces_rails, registers, checks — facts with their check and, where recorded, their page.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["built_from", "checks", "contract", "counts", "datasheet", "how_to_read", "part", "pin", "places", "sections", "truncated", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a datasheet's component twin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cb5ed95b0e6cf7c3b0d00f47094b489496ea1967c63bc02b97867d1e77fab40b"
        },
        {
          "name": "datasheetvend_get_module_packet",
          "title": "Read one module's packet of an extraction job's datasheet",
          "description": "One extraction module's packet: the blocks of the parsed datasheet that module needs, in reading order, each with its reasons (which heading, caption or content tag put it there, from which block), table cells and drawings as a crop box plus the exact words inside them, each with its box. The header (sections with their block ids, coverage) comes whole; blocks come in windows (block_offset / next_block_offset, at most 200 blocks or about 80000 characters per answer). Deterministic: reads the job's stored parse (parsed_document_v1), calls no model and extracts nothing. Costs no credits. Needs a DatasheetVend API key; readable jobs are your own, your workspace's TEAM-shared jobs and PUBLIC jobs, as on the REST API. Refusals: NOT_PARSED / PARSE_FAILED (no usable parse stored for this job), PARSE_EXPIRED (past retention), DOCUMENT_TOO_LARGE (over 20,000 blocks). Every block, cell and word comes with its page, box ([x0, y0, x1, y1] in PDF points, origin top-left), quoted text and parse {document_sha256, parser_version, block_id, cell_id}; block ids are stable only within one parser_version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "block_limit": {
                "description": "Packet blocks to return. Default 40, at most 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "block_offset": {
                "description": "Skip this many packet blocks (from next_offset). Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "job_id": {
                "description": "An extraction job in your account (or shared with it).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "module": {
                "description": "The extraction module.",
                "enum": ["pinout", "absolute_max", "thermal", "logic_levels", "power_battery", "timing", "part_decoder", "register_map", "peripheral_matrix", "analog_intelligence", "passive_bom", "pin_cautions"],
                "type": "string"
              }
            },
            "required": ["job_id", "module"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one module's packet of an extraction job's datasheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2b074b7e5fe9f6313a24101b7fc2034b06c60e3871b116f29211077cd9843858"
        },
        {
