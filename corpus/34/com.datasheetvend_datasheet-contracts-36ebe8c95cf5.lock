        {
          "name": "datasheetvend_search_component_library",
          "title": "Search the component library",
          "description": "Search DatasheetVend's component library: parts from dozens of manufacturers whose manufacturer datasheet DatasheetVend stores. Search by part number, vendor, package, architecture or application words (for example 'STM32 QFN', 'ESP32', 'BLE wearable', 'Cortex-M4'), optionally filtered by vendor, package family, category, pin range or Verified Pack. Each result gives the part page, the stored datasheet PDF (often a family datasheet covering several ordering codes), the manufacturer's own URL when known, whether a curated Verified Pack exists, and the address of the part-pack manifest (a lookup that may answer 'no shelved pack'). A result is a stored datasheet, not extracted data: to extract it, pass its datasheet_pdf_url to an extraction tool. Any one search word can match a row; results are ranked, paged with offset, and do not report a total. Free, no API key, no model call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Part category as the library page files it.",
                "enum": ["MCUs & Processors", "Analog & Power", "Wireless & RF", "FPGA & Memory", "Sensors", "Discrete & Logic", "Interface", "Modules"],
                "type": "string"
              },
              "limit": {
                "description": "Results per page, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results (from next_offset).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "package_family": {
                "description": "Package family as the library page groups them.",
                "enum": ["QFP", "QFN", "SOP", "BGA", "DIP", "SOT", "Module", "Other"],
                "type": "string"
              },
              "pin_range": {
                "description": "low: up to 16 pins; mid: 17-64; high: 65-144; extreme: 145 or more.",
                "enum": ["low", "mid", "high", "extreme"],
                "type": "string"
              },
              "query": {
                "description": "Search words: part number, vendor, package, architecture or application, separated by spaces.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "vendor": {
                "description": "Vendor slug such as 'stmicroelectronics' or 'espressif', or part of the vendor's name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "verified_pack_only": {
                "description": "Only parts that have a curated Verified Pack.",
                "type": "boolean"
              }
