          "description": "Extract the register map: memory addresses, reset values, access permissions (RO/RW/W1C), and per-bit field definitions. canonical_output.value_checks labels each value by the check that reached it: verified means an outside source (OCR of the printed page, the vendor's register file) agreed; flagged values list both readings. No label claims a value is true of the chip. canonical_output.svd_coverage says how many registers and bit fields device.svd holds and lists each one left out with a reason code. canonical_output.svd_readiness says whether device.svd may be loaded into a debugger: debugger_ready, description_only (a register description, not for live debugging; always so for an I2C/SPI device) or not_ready, with the first reasons; a check that did not run is never a pass, and debugger_ready does not mean every value is true of the chip. Runs DatasheetVend Fast Extraction: a page scout routes targeted model reads and the module's own deterministic readers, then the same normalization and completion checks as a dashboard job finish the result, usually in seconds; `engine` names the engine on every result. If Fast Extraction cannot complete the module, the slower deep engine re-runs that module alone (engine.runtime is then `monolith_rescue`; the result says so, and it is billed as delivered). A rescue can take several minutes, so set a client timeout of 10 minutes. Only if the deep engine also cannot deliver does the module return status FAILED with the reason.",
