                "description": "One module id, for example 'pinout' or 'absolute_max'. Omit for every module.",
                "enum": ["pinout", "footprint", "absolute_max", "thermal", "logic_levels", "timing", "power_battery", "register_map", "peripheral_matrix", "pin_cautions", "analog_intelligence", "passive_bom", "part_decoder", "kicad", "altium", "cad_normalized", "firmware", "workbench"],
