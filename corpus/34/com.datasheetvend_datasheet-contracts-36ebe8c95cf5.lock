        {
          "name": "datasheetvend_decode_part_number",
          "title": "Decode manufacturer ordering part numbers",
          "description": "Decode the ordering nomenclature: per-position suffix meanings (temp grade, package, speed, packaging) and, where the datasheet's ordering information supports it, the enumerated orderable_part_numbers list — the direct answer to 'which/how many orderable part numbers'. Codes the document's ordering legend lists that the decode lacks come back as deterministic_harvest_only_rules, each with its source page: text-layer evidence to check, not decoded rules. Runs DatasheetVend Fast Extraction: a page scout routes targeted model reads and the module's own deterministic readers, then the same normalization and completion checks as a dashboard job finish the result, usually in seconds; `engine` names the engine on every result. If Fast Extraction cannot complete the module, the slower deep engine re-runs that module alone (engine.runtime is then `monolith_rescue`; the result says so, and it is billed as delivered). A rescue can take several minutes, so set a client timeout of 10 minutes. Only if the deep engine also cannot deliver does the module return status FAILED with the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentPath": {
                "description": "https:// URL to the datasheet PDF. The remote /api/mcp endpoint accepts ONLY https:// URLs (it downloads them); a local filesystem path works solely in local stdio mode (npm run mcp:serve).",
                "minLength": 1,
                "type": "string"
              },
              "partName": {
                "description": "Optional part number / MPN to disambiguate a multi-part datasheet.",
                "type": ["string", "null"]
              }
            },
            "required": ["documentPath"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canonical_output": {
                "description": "The module's canonical (CAD-ready normalized) output block."
              },
              "contract": {
                "description": "Contract id, e.g. thermal_evidence_v2",
                "type": "string"
              },
              "engine": {
                "additionalProperties": false,
                "description": "Which engine produced this result",
                "properties": {
                  "duration_ms": {
                    "description": "Wall time of the extraction in milliseconds",
                    "type": "number"
                  },
                  "failed_modules": {
                    "description": "Modules that came back without a result: Fast Extraction could not extract them, and neither could the per-module deep-engine rescue where one was attempted",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "lanes": {
                    "description": "How each module was answered, where the engine recorded it",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "lane": {
                          "description": "deterministic_primary, worker_with_deterministic_brain, deterministic_recovery, worker_only, or monolith_rescue",
                          "type": "string"
                        },
                        "module": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        }
                      },
                      "required": ["lane", "module", "reason"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "name": {
                    "description": "The engine the extraction started on: always \"fast_extraction\" (runtime says what answered)",
                    "type": "string"
                  },
                  "runtime": {
                    "description": "The runtime that answered: the Fast Extraction runtime, or \"monolith_rescue\" when the deep engine re-ran this module; null when no engine could run",
                    "type": ["string", "null"]
                  }
                },
                "required": ["duration_ms", "failed_modules", "lanes", "name", "runtime"],
                "type": "object"
              },
              "engineering_summary": {
                "description": "Concise human-readable engineering summary, when emitted.",
                "type": ["string", "null"]
              },
              "extracted_data": {
                "description": "The module's extraction after its own normalization — values with the datasheet page they came from (source_page, where one was recorded) and, where the module provides them, confidence_score and source_text_snippet."
              },
              "module_id": {
                "description": "Canonical module id",
                "type": "string"
              },
              "review": {
                "additionalProperties": false,
                "properties": {
                  "reasons": {
                    "description": "Why review is required, if it is",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "required": {
