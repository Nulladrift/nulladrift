        {
          "name": "datasheetvend_extract_logic_levels",
          "title": "Extract DC logic levels and operating conditions",
          "description": "Extract DC electrical characteristics: VIH/VIL/VOH/VOL thresholds, Schmitt hysteresis, AND the VCC/VDD operating supply voltage range. Use this for supply-range questions; extract_absolute_max gives never-exceed limits. Runs DatasheetVend Fast Extraction: a page scout routes targeted model reads and the module's own deterministic readers, then the same normalization and completion checks as a dashboard job finish the result, usually in seconds; `engine` names the engine on every result. If Fast Extraction cannot complete the module, the slower deep engine re-runs that module alone (engine.runtime is then `monolith_rescue`; the result says so, and it is billed as delivered). A rescue can take several minutes, so set a client timeout of 10 minutes. Only if the deep engine also cannot deliver does the module return status FAILED with the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentPath": {
                "description": "https:// URL to the datasheet PDF. The remote /api/mcp endpoint accepts ONLY https:// URLs (it downloads them); a local filesystem path works solely in local stdio mode (npm run mcp:serve).",
                "minLength": 1,
                "type": "string"
              },
              "partName": {
                "description": "Optional part number / MPN to disambiguate a multi-part datasheet.",
                "type": ["string", "null"]
              }
            },
            "required": ["documentPath"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canonical_output": {
                "description": "The module's canonical (CAD-ready normalized) output block."
              },
              "contract": {
                "description": "Contract id, e.g. thermal_evidence_v2",
                "type": "string"
              },
              "engine": {
                "additionalProperties": false,
                "description": "Which engine produced this result",
                "properties": {
                  "duration_ms": {
                    "description": "Wall time of the extraction in milliseconds",
                    "type": "number"
                  },
                  "failed_modules": {
                    "description": "Modules that came back without a result: Fast Extraction could not extract them, and neither could the per-module deep-engine rescue where one was attempted",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "lanes": {
                    "description": "How each module was answered, where the engine recorded it",
                    "items": {
