        {
          "name": "datasheetvend_search_document",
          "title": "Search the source datasheet of an extraction",
          "description": "Find where the source datasheet behind an extraction job says something: every text token containing the term, with its page and its box on the page in PDF points. Use it to check an extracted value against the document, or to find the page to read with datasheetvend_read_document_page. Counts are honest: total_hits with hits_returned, a per-page cap of 20 stated with dropped_hits, and fetch_truncated when the database fetch stopped at its cap. A token is one line of text, so a phrase across lines may not match. Three different refusals: DOCUMENT_MAP_UNAVAILABLE (this job has no document map), DOCUMENT_MAP_EXPIRED (the map passed its retention window: no hits does NOT mean the term is absent) and, for a real answer, zero hits. Deterministic: reads the stored document map, calls no model and extracts nothing. Costs no credits. Needs a DatasheetVend API key; readable jobs are your own, your workspace's TEAM-shared jobs and PUBLIC jobs, as on the REST API.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_id": {
                "description": "An extraction job in your account (or shared with it).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "max_hits": {
                "description": "Hits to return, in page order. Default 50, at most 300.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The term to find, 2-128 characters, for example 'VDDIO' or 'Absolute Maximum'.",
                "maxLength": 128,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["job_id", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the source datasheet of an extraction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c30822fa3032fd4e774a2ec0701c4a73f7b0d2e796bbef883ade5e174177dccc"
        },
        {
          "name": "datasheetvend_search_document_blocks",
          "title": "Search the parsed blocks of an extraction job's datasheet",
          "description": "Case-insensitive text search over the parsed blocks' text and table cells: each hit gives the block id, page, type, box and a snippet; a table hit also gives the cell's id, row, column and box. Scope it to a section (section_id, or heading_text) and to the job's target package; filter by pages and block types; paged (offset / next_offset, at most 100 hits). Unlike datasheetvend_search_document (raw text lines of the document map), hits here are typed blocks you can read whole with datasheetvend_read_document_block. Deterministic: reads the job's stored parse (parsed_document_v1), calls no model and extracts nothing. Costs no credits. Needs a DatasheetVend API key; readable jobs are your own, your workspace's TEAM-shared jobs and PUBLIC jobs, as on the REST API. Refusals: NOT_PARSED / PARSE_FAILED (no usable parse stored for this job), PARSE_EXPIRED (past retention), DOCUMENT_TOO_LARGE (over 20,000 blocks). Every block, cell and word comes with its page, box ([x0, y0, x1, y1] in PDF points, origin top-left), quoted text and parse {document_sha256, parser_version, block_id, cell_id}; block ids are stable only within one parser_version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "heading_text": {
                "description": "Only sections whose heading holds this text, and the sections below them (e.g. 'Pin Description').",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "job_id": {
                "description": "An extraction job in your account (or shared with it).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Hits to return. Default 20, at most 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many hits (from next_offset). Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "pages": {
                "description": "Only these physical 1-based pages (at most 50).",
                "items": {
                  "maximum": 100000,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 50,
                "type": "array"
              },
              "query": {
                "description": "The text to find, 2-120 characters (e.g. 'VDD', 'Absolute Maximum').",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "section_id": {
                "description": "Only this section and the sections below it.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "target_package_only": {
                "description": "Skip blocks printed for another package than the job's target part (the packets' own package scope). Default true; with no known target nothing is skipped and scope.package_scope says target_package_unknown.",
                "type": "boolean"
              },
              "types": {
                "description": "Only these block types.",
                "items": {
                  "enum": ["title", "heading", "paragraph", "list_item", "table", "figure", "caption", "footnote", "page_furniture", "unknown"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["job_id", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the parsed blocks of an extraction job's datasheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0f23d78ad4b1c2e9acec5d78430552a30ddd5220cc6027736b81d8ae4fca1b9e"
        },
        {
          "name": "datasheetvend_search_my_extractions",
          "title": "Search your extractions",
          "description": "Find your own (non-archived) extraction jobs by condition: filename words, a module that produced output, jobs with warnings, or jobs waiting on a decision. Returns job ids, status, warning counts and which modules hold output, never module data: pass an id to the other tools (datasheetvend_explain_warnings, datasheetvend_compare_extractions, datasheetvend_search_document) or read GET /api/v1/jobs/{id}/<module>. totalMatched is counted after every filter: exact when scanComplete is true, otherwise a stated floor over the newest jobs scanned (countingNote). An empty list is a real answer. Reads the recorded state of your account's own jobs (owner, or TEAM-shared in your workspace; a refunded job is refused): nothing is extracted and no model is called. Costs no credits. Needs a DatasheetVend API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
