      "transport": {
        "type": "http",
        "url": "https://designcheck.allthepossibles.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "designcheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_code",
          "title": "Check code comments",
          "description": "Check a source file or diff for AI 'tells' left in comments: narrating fulfilling a request instead of describing the code (\"as requested,\" \"I've added,\" \"here's the updated version\") and hedge words. These reveal there was a conversation behind the change that a later reader has no access to. Call this before committing or shipping code an agent wrote.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The source file or diff to check",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff208d7b41d0d292cc7ff11ff52f9e449b5277932825321b512e0b2b9f4a464f"
        },
        {
          "name": "check_copy",
          "title": "Check copy",
          "description": "Check marketing or outreach copy (an email, a landing-page draft, a pitch, a social post) for the tells that make it read as AI-generated: cliché vocabulary (delve, unlock, empower, seamlessly integrate, etc.), negative-parallel framing (\"not just X, but Y\"), hedge words, heavy em-dash use, and diagnosing a problem with no fix in the same breath. No page or markup needed, just the text. Call this before sending copy to a human.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The raw copy to check",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a750503e432667ffff1522d6eabf256e93618dd77fb7da2a10175cd3bfc5ca90"
        },
        {
          "name": "check_design",
          "title": "Check design",
          "description": "Check a page's HTML/CSS/copy/interaction for the patterns that make AI-generated work read as generic: default fonts, soft tech gradients, pill+arrow buttons, eyebrow labels, a composition with no real width/background variation across sections, uniform card grids, copy tells (AI vocabulary, negative-parallel framing, hedge words, heavy em-dash use), and experience gaps (a diagnosis with no next step, dead-end links). Every finding includes a concrete fix. Call this before presenting UI to a human.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "Raw HTML/CSS to check directly, if not fetching a URL",
                "type": "string"
              },
              "url": {
                "description": "Page to fetch and check",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f9020ab68cf077435f2932bb727bf94d830cb6468a3df9adbc15a96ba15a41fc"
        }
      ],
      "digest": "sha256:a815168fb9991c0e5009fb232a2b1689a714378101c7530c24266c1a63276338"
    }
  }
