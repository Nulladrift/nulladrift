{
  "lockfileVersion": 2,
  "subjects": {
    "com.filingfirehose/firehose": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://filingfirehose.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "filingfirehose",
        "version": "1.29.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Query parsed US SEC EDGAR filings: 8-K (with body-text item detection that flags suspected misclassifications under Item 8.01), Schedule 13D/G (with activist filer tagging — Saba, Bulldog, Karpus, Icahn, Elliott, Starboard, Pershing, +14 more), S-3 / 424B5 (with shelf size, ATM-offering detection, sales agent extraction). Free public tier returns the last 72 hours of filings; full archive requires a paid API key from filingfirehose.com.",
      "tools": [
        {
          "name": "get_filing",
          "description": "Fetch one filing by SEC accession number, regardless of recency.\n\n    Useful when an agent has an accession number from a citation or earlier\n    tool call and needs the parsed details.\n\n    Args:\n        accession_number: SEC accession in 'XXXXXXXXXX-YY-NNNNNN' format.\n\n    Returns:\n        JSON for the filing if found in our archive, or {\"found\": false}.\n    ",
          "inputSchema": {
            "properties": {
              "accession_number": {
                "title": "Accession Number",
                "type": "string"
              }
            },
            "required": ["accession_number"],
            "title": "get_filingArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_filingOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2fde6ee3b2d076ea258e4dc06279b4bf351cd8ca814269cb3bd32724f27cb46"
        },
        {
          "name": "search_13d_filings",
          "description": "Search recent SEC Schedule 13D / 13G filings from the past 72 hours.\n\n    Args:\n        activist: Filter to filings tagged with this activist filer name.\n            Substring match, case-insensitive. Examples: 'Saba', 'Starboard',\n            'Icahn', 'Elliott', 'Pershing'.\n        min_percent: Minimum percent of class disclosed.\n        include_amendments: Include 13D/A and 13G/A amendments. Default True.\n        include_passive_13g: Include passive Schedule 13G filings. Default False\n            (only active 13D / 13D/A returned).\n        limit: Max results (1-50, default 25).\n\n    Returns:\n        JSON list of filings with cusip, percent_of_class, aggregate_amount,\n        activist_filers, and an Item 4 purpose excerpt.\n    ",
          "inputSchema": {
            "properties": {
              "activist": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Activist"
              },
              "include_amendments": {
                "default": true,
                "title": "Include Amendments",
                "type": "boolean"
              },
              "include_passive_13g": {
                "default": false,
                "title": "Include Passive 13G",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "min_percent": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Min Percent"
              }
            },
            "title": "search_13d_filingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_13d_filingsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f225ccd48dd634f169c8167da6b600001673e239cad3784bea0a348a550eabd"
        },
        {
          "name": "search_8k_filings",
          "description": "Search recent SEC 8-K filings (current report) from the past 72 hours.\n\n    Args:\n        items: Comma-separated 8-K item codes to filter on. Examples: '1.05'\n            (cybersecurity), '5.02' (officer departure), '8.01' (other events),\n            '1.01' (material agreement). Leave None for all 8-Ks.\n        suspected_buried_only: If True, return only filings where our\n            body-text classifier flagged a suspected misclassification —\n            i.e. cyber language under Item 8.01 that should have been 1.05,\n            officer-departure language under 8.01 that should have been 5.02.\n        limit: Max results (1-50, default 25).\n\n    Returns:\n        JSON-formatted list of filings. Each includes: accession_number,\n        company_name, filed_at, filer_reported_items, detected_items,\n        discrepancy_items (in body but not reported), and\n        suspected_buried_events (map of reported→suspected).\n    ",
          "inputSchema": {
            "properties": {
              "items": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Items"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "suspected_buried_only": {
                "default": false,
                "title": "Suspected Buried Only",
                "type": "boolean"
              }
            },
            "title": "search_8k_filingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_8k_filingsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:caaf9bc53854c4f2acfe0be67d64703dfcf9282d91a0bd8c4f093f4df8b53e66"
        },
        {
          "name": "search_atm_offerings",
          "description": "Search recent SEC at-the-market (ATM) equity offerings from the past 72 hours.\n\n    Pulls from S-3 / 424B5 family filings where our parser flagged ATM-offering\n    indicators in the body language.\n\n    Args:\n        sales_agent: Filter by sales agent name (substring, case-insensitive).\n            Examples: 'Cantor Fitzgerald', 'Jefferies', 'Roth Capital',\n            'H.C. Wainwright'.\n        min_shelf_million_usd: Minimum shelf size in millions USD.\n        limit: Max results (1-50, default 25).\n\n    Returns:\n        JSON list with shelf_size_usd, is_atm, sales_agents, use_of_proceeds_excerpt.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "min_shelf_million_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Min Shelf Million Usd"
              },
              "sales_agent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sales Agent"
              }
            },
            "title": "search_atm_offeringsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_atm_offeringsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b17eb830ffb6ca03ef5c4a0cfbd0147a2d26870caefeffe0513baf852a507b0"
        }
      ],
      "digest": "sha256:60ca34233282ecbc142059fbc0d1e7ac58d7f255918f4989c41142a28017155f"
    }
  }
}
