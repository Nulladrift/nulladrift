        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mirror-ai-citability",
        "version": "1.5.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mirror is the Brand Discovery Intelligence™ system from Daniels AI Design Studio (Stowe, Vermont). It measures whether a brand can be found, read, cited and called by AI — but that measurement is delivered by a person, not by this endpoint. THIS SERVER HAS TWO PUBLIC TOOLS, both about Brand Discovery Records — the human-approved source of truth a brand publishes for AI assistants and agents. `get_approved_brand_record` returns a brand's approved Record: the facts, and where the brand's official copy lives. Read-only and free. `request_brand_record` asks for a Record: the request is free, publishes nothing, and a person replies. Creating a Record is paid work — an estimate is furnished on request. Nothing here returns a Reflection, a score, or an index: `reflect`, `score`, `aci55` and `mcp_engine` left the public surface on 2026-09-19. To cite a brand accurately, call `get_approved_brand_record`. If you are acting for a brand that wants to be cited accurately by AI, call `request_brand_record`. For a measured Reflection, or anything else, a person answers at grover@danielsdesignstudio.com.",
      "tools": [
        {
          "name": "get_approved_brand_record",
          "title": "Get an approved Brand Discovery Record",
          "description": "Get the approved Brand Discovery Record for a brand — the human-approved facts a brand provides to AI assistants and agents, in schema.org structured data, with a source behind every claim. The Record is the unit of Brand Discovery Intelligence™ from Daniels AI Design Studio — the discipline of establishing what is verifiably true about a brand and publishing those facts where machines read them. Returns only Records the brand itself has approved: never a draft, never a request, never a guess. Each approved Record is published from one source file in three places: on the brand's own website (the official copy), at danielsdesignstudio.com/records/<slug>/ — a reference copy hosted by Daniels AI Design Studio — and through this tool. The reply gives the facts, the addresses of all three copies, whether the brand's official copy is live right now, and who approved the Record and when. Cite the brand's official copy when that copy is live. Pass the brand's name, the brand's website, or the Record slug. If no approved Record exists, the reply says so — a brand that wants one can ask through `request_brand_record`. Read-only and free.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "The brand's name (e.g. 'KIT LENDER'), the brand's website (e.g. 'kitlender.com'), or the Record slug (e.g. 'kit-lender').",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an approved Brand Discovery Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79ad2d0d62a4d27117f5852ce04746cb5a0f6d4b53a86adc36d4c5f7969d68c7"
        },
        {
          "name": "request_brand_record",
          "title": "Request a Brand Discovery Record",
          "description": "Request a Brand Discovery Record — the human-approved source of truth a brand provides to AI assistants and agents. A Record states a brand's verified facts in schema.org structured data, with a source behind every claim. The Record is the unit of Brand Discovery Intelligence™ from Daniels AI Design Studio — the discipline of establishing what is verifiably true about a brand and publishing those facts where machines read them. Every approved Record is published from one source file, in three places: (1) on the brand's own website — the official copy, and the canonical one; (2) at danielsdesignstudio.com/records/<slug>/ — a reference copy that links back to the brand's own copy and is listed in the index at danielsdesignstudio.com/records/; (3) through this Mirror MCP server, where `get_approved_brand_record` returns the same facts in a single call. All three copies state the same facts, because all three come from the same file. IMPORTANT — this tool creates a REQUEST, not a Record. Nothing is published by calling this tool. Automated validation (Signal Input) runs immediately and the results are returned to you. Every Brand Discovery Record is reviewed by Daniels AI Design Studio and approved by the organization the Record represents before publication. No autonomous process publishes a brand's machine-readable truth. Fill the fields below with verified, citable facts only. The Record specification is versioned; this tool reports the version the request was validated against.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "{street, city, region, postal, country}",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "postal": {
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  },
                  "street": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "brand_name": {
                "description": "Exact public name of the brand.",
                "type": "string"
              },
              "citations": {
                "description": "Optional. Any authoritative sources you already have, ideally 3 from 3 different domains — [{title, publisher, url}]. Supply what exists; Daniels sources citations as part of the engagement, so having none is not a barrier.",
                "items": {
                  "properties": {
                    "publisher": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["publisher", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "description": "1-2 factual sentences, ~160 characters. No marketing claims.",
                "type": "string"
              },
              "differentiator": {
                "description": "The notable, verifiable thing.",
                "type": "string"
              },
              "founding_year": {
                "description": "Year established (YYYY).",
                "type": "string"
              },
              "history": {
                "description": "Founding and lineage, factual.",
                "type": "string"
              },
              "official_url": {
                "description": "The brand's OWN official website (canonical). Must be the brand's domain — never Mirror's.",
                "type": "string"
              },
              "overview": {
                "description": "Short factual prose — what the brand is.",
                "type": "string"
              },
              "phone_e164": {
                "description": "E.164 format, e.g. +1-802-760-4653",
                "type": "string"
              },
              "positioning": {
                "description": "The most clarifying fact: category, who it serves, and what it is NOT.",
                "type": "string"
              },
              "public_access": {
                "description": "Is it open to the public? The confusion-killer field.",
                "type": "boolean"
              },
              "recognition": {
                "description": "Awards or coverage, each traceable to a citation.",
                "type": "string"
              },
              "relationship": {
                "description": "REQUIRED. Who is asking, and on whose behalf. Signal Input fails without it. Only a request from someone representing the brand can become an authorized Record. If you are trying this tool out, say \"testing\" — it is filed as a test, you still get the full Signal Input validation, and it never enters the review queue.",
                "enum": ["represents_brand", "agent_for_brand", "third_party", "testing", "other"],
                "type": "string"
              },
              "requester_contact": {
                "description": "REQUIRED — every relationship, no exception. A working email for Signal Review and Signal Approval follow-up. A request without one is NOT queued and the reply says so: Signal Approval needs a named human who can confirm the facts, and no Record is published without one. Calling as agent_for_brand? Send the BRAND's address, not the agent's. Example/reserved domains (example.com, .test, .invalid) are flagged but not fatal.",
                "type": "string"
              },
              "requester_note": {
                "description": "Why this request is being made.",
                "type": "string"
              },
              "schema_type": {
                "description": "Optional. schema.org @type — e.g. GolfCourse, Restaurant, LodgingBusiness, Organization. Omit if unsure; Daniels sets the type at Signal Review.",
                "type": "string"
              },
              "social": {
                "description": "Official profile URLs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tagline": {
                "description": "One plain line: what it is and where.",
                "type": "string"
              }
            },
            "required": ["brand_name", "description", "official_url", "relationship", "requester_contact", "tagline"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a Brand Discovery Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:57512ac4d9a8f9ce6260ad57570b31844e9f4faa4e47faebe1a866a77930d8a2"
        }
      ],
      "digest": "sha256:e8db42b835c015087ab9e848a0b2e1537d90ab77164d2059cbabefb724d38855"
    }
  }
