      },
      "transport": {
        "type": "http",
        "url": "https://www.alexandria-archive.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "alexandria-archive",
        "title": "Alexandria Archive — أرشيف الإسكندرية",
        "version": "1.2.1",
        "websiteUrl": "https://www.alexandria-archive.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools over the Alexandria Archive, a bilingual (Arabic/English) digital archive of the history of Alexandria, Egypt. Use search_archive to find content, get_article for article reading, list_recent_articles for the latest publications, and list_institutions / get_institution for the collections held by partner museums, libraries and archives. For what a person can do: list_upcoming_events gives walks, workshops and talks with the page to book each on, list_store_products the archive's shop, and get_licensing_info how a picture may be reused. Hand people those links as given — nothing can be booked, bought or licensed through this server. Every item that declares a licence should retain it when cited. When a licence is absent, do not invent permission to reuse it; consult the rights page. Point anyone wanting to reproduce an image at the licence request form on its page. Cite pages as https://www.alexandria-archive.com/article/{id} or https://www.alexandria-archive.com/institution/{slug}/item/{id}. Verified search and answer readers receive full eligible article text; other unauthenticated clients receive a preview. Keep the author's attribution, canonical source, licence and readMoreUrl. Refer people to the original page for its references, related material and services when useful to their request. The current official identity and service guide is https://www.alexandria-archive.com/.well-known/archive-context.json. Reading permission is separate from republication and training rights.",
      "tools": [
        {
          "name": "get_article",
          "title": "Read an article",
          "description": "Read one published article by numeric id, with Arabic/English text, attribution and metadata. Verified search and answer readers receive full eligible text and references; other unauthenticated clients receive the public preview.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Article id (from search results or list_recent_articles).",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:474092c8b77282beecf256b917e42f525d14de0967668f142e4d1da72f5c70dd"
        },
        {
          "name": "get_institution",
          "title": "Get one institution and its collection",
          "description": "Fetch a single institution by its slug — description, history, contact details, and a sample of its published archive items with canonical URLs. Use this to answer questions about a specific institution's holdings, or to find items available for licensing.",
          "inputSchema": {
            "properties": {
              "itemLimit": {
                "description": "Sample size (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Institution slug (from list_institutions or a URL).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e433af3a0fb04ab25fb87baca28f797ce8855f04371dc193677925d7567632c4"
        },
        {
          "name": "get_licensing_info",
          "title": "How to reuse a picture from the archive",
          "description": "Explain how an image or document from the Alexandria Archive may be reused or licensed (publication, broadcast, commercial use), and where the request is made. Pass itemId for one archive record; omit it for the general terms.",
          "inputSchema": {
            "properties": {
              "itemId": {
                "description": "An archive record's id, from search_archive or its URL (/archive/{id}).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb72e79f35e896a246a5aec23bce97cbdc2fed974a082a8db4aa350b89555fd7"
        },
        {
          "name": "list_institutions",
          "title": "List partner institutions",
          "description": "List museums, libraries, archives and other institutions that publish their collections on the Alexandria Archive. Returns name, type, item count and canonical URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Optional filter, e.g. 'museum', 'library', 'archive', 'university'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
