          },
          "digest": "sha256:c70f05fdca81e7f51ce9b7c365293cc2f8e68ba2b3bfbb1e33b56ce9883e9d2c"
        },
        {
          "name": "list_recent_articles",
          "title": "List recent articles",
          "description": "List the most recently published articles (id, title, excerpt, date, URL).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
