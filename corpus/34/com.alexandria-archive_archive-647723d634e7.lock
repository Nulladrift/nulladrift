        },
        {
          "name": "list_upcoming_events",
          "title": "Upcoming events in Alexandria",
          "description": "List the Alexandria Archive's upcoming events — heritage walks, workshops, talks — soonest first, with date, place, price in Egyptian pounds (or free) and the page where a person books a seat. Use for questions like 'what is on in Alexandria this week' or 'a history walk in Alexandria'.",
          "inputSchema": {
