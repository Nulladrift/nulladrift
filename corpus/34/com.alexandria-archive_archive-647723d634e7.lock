        },
        {
          "name": "search_archive",
          "title": "Search the Alexandria Archive",
          "description": "Search historical photographs, documents, maps, articles, and events of the Alexandria Archive. Query can be Arabic or English (e.g. 'Stanley Bridge', 'كوم الدكة'). Returns titles and canonical URLs.",
          "inputSchema": {
