          "digest": "sha256:34e39766fad23073e75f8fd1dea4bd4e40167a722406968fb81755073355641a"
        },
        {
          "name": "get_context",
          "title": "Assemble context bundle",
          "description": "Assemble a markdown briefing of the concepts most relevant to a query and/or explicit ids, expanded through the graph and trimmed to a token budget. The briefing is self-contained, so it can be handed to another agent or pasted into a prompt as-is. The final JSON line reports which concept ids were included, whether the bundle was truncated, and its approximate token count. Provide at least one of `query` or `ids`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "depth": {
                "default": 1,
                "description": "Graph hops to expand from the seeds (default 1).",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "ids": {
                "description": "Explicit seed concept ids (kept first, in order).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "product": {
                "description": "Restrict expansion to concepts of this product.",
                "type": "string"
              },
              "query": {
                "description": "Search query used to pick seed concepts.",
                "type": "string"
              },
              "tokenBudget": {
                "default": 4000,
                "description": "Approximate token cap for the bundle (chars/4, default 4000).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Assemble context bundle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f49bbcaeae30ca967379d0eaa2360e792a42dd5d5620a477431658d9022665f0"
        },
        {
          "name": "get_related",
          "title": "Get related concepts",
          "description": "Walk the knowledge graph outward from a concept and return everything within `depth` hops, with distance and the edge path that reached it. Use to map the blast radius before changing a feature (what depends on it, what constrains it, which decisions apply) or to discover structure that keyword search misses. Filter by relation names (e.g. depends_on) to follow only one kind of edge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "depth": {
                "default": 1,
                "description": "How many hops to traverse (1-3, default 1).",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "Concept id to start from.",
                "type": "string"
              },
              "limit": {
                "description": "Max related nodes to return.",
                "minimum": 1,
                "type": "integer"
              },
              "relations": {
                "description": "Only follow edges with these relation names, e.g. [\"depends_on\", \"part_of\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get related concepts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:51ebc21a9b3cdcbdfd22b246c6bcabd778aaa51ee3f8a485975b8f39f8c470f9"
        },
        {
          "name": "link_concepts",
          "title": "Link concepts",
          "description": "Add a typed, directed edge between two existing concepts by editing the `from` note's frontmatter (e.g. lead-scoring depends_on contact-model). Use when you notice a relationship the vault is missing. Both concepts should already exist; use upsert_concept first if not.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
