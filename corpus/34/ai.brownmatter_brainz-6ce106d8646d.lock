        {
          "name": "upsert_concept",
          "title": "Create or update concept",
          "description": "Write a concept note into the vault (creates or overwrites the markdown file, then reindexes it). Use to capture new product knowledge discovered during a task — a decision made, a constraint hit, a pattern adopted — so future agents can find it. Omit `id` to derive a slug from the title; pass an existing id to update that note. Body is markdown; [[wiki-links]] to other concept ids create graph edges. Returns the saved concept's metadata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Markdown body. [[other-id]] wiki-links become graph edges.",
                "type": "string"
              },
              "codeAreas": {
                "description": "Rough codebase paths/globs where this knowledge lives, e.g. [\"packages/core/src/vault.ts\", \"apps/web/src/routes/**\"] — lets agents briefed by get_context know where to apply it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "doneAt": {
                "description": "For tasks: ISO timestamp when completed.",
                "type": "string"
              },
              "id": {
                "description": "Concept id (slug). Omit to derive from title; pass an existing id to update.",
                "type": "string"
              },
              "product": {
                "description": "Product grouping key.",
                "type": "string"
              },
              "relations": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Typed edges, e.g. {\"depends_on\": [\"auth-system\"]}. Conventions: part_of (feature/story/task → domain), realized_by (story → features), realizes (task → stories/features), governs (spec → what it constrains), governed_by (task → specs), depends_on, constrains, supersedes, related_to. For domain concepts, prefer linking to OTHER domains (related_to / depends_on) wherever they share a boundary or hand off responsibility — connected domains reveal how the product's areas overlap instead of floating as isolated islands.",
                "type": "object"
              },
              "status": {
                "description": "Lifecycle status (default \"active\").",
                "enum": ["active", "draft", "deprecated"],
                "type": "string"
              },
              "tags": {
                "description": "Tags for filtering.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "takenAt": {
                "description": "For tasks: ISO timestamp when claimed.",
                "type": "string"
              },
              "takenBy": {
                "description": "For tasks: label of the agent/orchestrator that claimed it.",
                "type": "string"
              },
              "taskStatus": {
                "description": "For type=\"task\" concepts: lifecycle \"open\" | \"taken\" | \"done\" (default \"open\"). Prefer the task tools (create_task / take_task / complete_task) over setting this directly.",
                "enum": ["open", "taken", "done"],
                "type": "string"
              },
              "title": {
                "description": "Human-readable title (required, non-empty).",
                "type": "string"
              },
              "type": {
                "description": "Concept type (default \"concept\"). The 11 built-in types are concept, domain, feature, story, spec, workflow, task, decision, constraint, pattern, glossary; a vault may also define custom types. An unknown type falls back to \"concept\".",
                "type": "string"
              }
            },
            "required": ["body", "title"],
            "type": "object"
          },
