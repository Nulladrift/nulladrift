        {
          "name": "delete_concept",
          "title": "Delete concept",
          "description": "Remove a concept from the vault and all of its outgoing edges. Use to clear a note that is wrong, obsolete, or junk (e.g. a probe or test node that shouldn't be in the graph). Idempotent: deleting an id that doesn't exist is a no-op success (deleted:false), not an error. Deletion is permanent — prefer upsert_concept to correct a note you want to keep. Returns { deleted, id }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Exact concept id (slug) to delete, e.g. \"lead-scoring\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete concept"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ca9b1177ac516cab2331c15dc05a99b6e21a0219b30a3e41a378310895b4a7e6"
        },
        {
          "name": "dream",
          "title": "Dream (nightly consolidation)",
          "description": "Dreaming: a scheduled consolidation sweep over this vault. Light stages what changed since the last dream (near-duplicate concepts, finished task outcomes, hygiene counts); REM asks an LLM for proposals; deep applies the ones that pass threshold gates: merges duplicates (edges redirected, the other tombstoned), promotes outcome knowledge into concepts, adds missing links, and files a task for each contradiction. A sweep that would touch too much of the vault is rejected; every applied dream keeps preimages and can be reverted. {action: \"status\"} shows schedule + last dream; {action: \"run\"} dreams now; {action: \"diary\"} reads the Dream Diary; {action: \"revert\", id} undoes one dream; {action: \"configure\", ...} sets the schedule, mode (apply, propose, light-only), phases, thresholds, caps, a stricter loss rail and the LLM choice; {action: \"apply\", id, proposals?} decides a proposed dream. Without an LLM only light runs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "\"status\" reports the settings, the last/next dream and any sweep in flight. \"run\" starts (or continues) a sweep NOW and advances it as far as one request allows. \"diary\" returns recent Dream Diary entries (newest first). \"revert\" undoes one dream via its preimages (requires `id`). \"configure\" changes this vault's dreaming settings. \"apply\" decides a proposed dream (propose mode): applies the listed `proposals` (all when omitted) and rejects the rest (requires `id`).",
                "enum": ["status", "run", "diary", "revert", "configure", "apply"],
                "type": "string"
              },
              "cadenceHours": {
                "description": "With \"configure\": Hours between dreams (default 24).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "caps": {
                "additionalProperties": false,
                "description": "With \"configure\": Most changes per dream: maxMerges 5 (1-20), maxPromotions 5 (1-20), maxLinks 10 (1-50), maxContradictions 3 (1-10).",
                "properties": {
                  "maxContradictions": {
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maxLinks": {
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maxMerges": {
                    "maximum": 20,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "maxPromotions": {
                    "maximum": 20,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "enabled": {
                "description": "With \"configure\": Turn scheduled dreaming on or off.",
                "type": "boolean"
              },
              "id": {
                "description": "With \"revert\" or \"apply\": the dream id (from \"diary\" or \"status\").",
                "type": "string"
              },
              "limit": {
                "description": "With \"diary\": how many entries to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "llm": {
                "additionalProperties": false,
                "description": "With \"configure\": Cloud: which LLM the REM step uses — \"auto\" (default), \"workers-ai\", or \"byok\" (only the account's own key) — and a model id for the account's own key; null clears it.",
                "properties": {
                  "model": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9._:/@-]+$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "provider": {
                    "enum": ["auto", "workers-ai", "byok"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "lossRail": {
                "additionalProperties": false,
                "description": "With \"configure\": How much of the vault one dream may modify: maxTouchFraction (0.01-0.2) and minTouchAllowance (0-3). Can only be made stricter than the defaults.",
                "properties": {
                  "maxTouchFraction": {
                    "maximum": 0.2,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  "minTouchAllowance": {
                    "maximum": 3,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "mode": {
                "description": "With \"configure\": \"apply\" writes the changes that pass the gates (default); \"propose\" holds them in the Dream Diary until approved with {action: \"apply\"}; \"light-only\" never calls an LLM.",
                "enum": ["apply", "propose", "light-only"],
                "type": "string"
              },
              "phases": {
                "additionalProperties": false,
                "description": "With \"configure\": Turn individual kinds of change on or off: merges, promotions, links, contradictions.",
                "properties": {
                  "contradictions": {
                    "type": "boolean"
                  },
                  "links": {
                    "type": "boolean"
                  },
                  "merges": {
                    "type": "boolean"
                  },
                  "promotions": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "proposals": {
                "description": "With \"apply\": the proposal numbers (`n`) to approve; omit for all, [] to reject all.",
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 200,
                "type": "array"
              },
              "runHourUtc": {
                "anyOf": [
                  {
                    "maximum": 23,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "With \"configure\": Preferred UTC hour for a dream when the cadence is 24h or more; null clears it."
              },
              "thresholds": {
                "additionalProperties": false,
                "description": "With \"configure\": Minimum confidence (0.5-1) per kind: merge 0.8, promote 0.7, link 0.7, contradiction 0.6 by default.",
                "properties": {
                  "contradiction": {
                    "$ref": "#/properties/thresholds/properties/merge"
                  },
                  "link": {
                    "$ref": "#/properties/thresholds/properties/merge"
                  },
                  "merge": {
                    "maximum": 1,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  "promote": {
                    "$ref": "#/properties/thresholds/properties/merge"
                  }
                },
                "type": "object"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Dream (nightly consolidation)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4012da4432890f752328b829bd2438a10ea94532b4377e66561ba1bae189de90"
        },
        {
          "name": "get_concept",
          "title": "Get concept",
          "description": "Fetch one concept by exact id: full markdown body, metadata, and its direct graph neighbors (each with the relation that connects it). Use after search_concepts or when another note wiki-links an id you need in full. The neighbors list tells you what to fetch next. If you don't know the id, use search_concepts instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Exact concept id (slug), e.g. \"lead-scoring\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get concept"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
