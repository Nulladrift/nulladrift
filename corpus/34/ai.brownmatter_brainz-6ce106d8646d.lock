      "instructions": "# Brainz — shared product knowledge graph\n\nThis server is one Brainz vault: a product's features, specs, decisions, constraints and tasks, stored as linked markdown concepts.\n\n- `search_concepts`, `list_concepts`, `get_concept` and `get_related` find and read concepts; `get_context` assembles a token-budgeted briefing on a topic; `vault_stats` summarizes the vault.\n- `upsert_concept`, `link_concepts` and `delete_concept` edit the graph.\n- `list_tasks`, `create_task`, `take_task` and `complete_task` manage the vault's task pile.\n- `onboard` and `sync` return playbooks for indexing a codebase into the vault; `dream` runs or configures the consolidation sweep.",
      "tools": [
        {
          "name": "complete_task",
          "title": "Complete a task",
          "description": "Mark a task done. Sets taskStatus=done + doneAt and appends `outcome` to the task body as an Outcome section. The result carries a one-line `reminder` that the rest of the graph is not updated automatically.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Id of the task to mark done.",
                "type": "string"
              },
              "outcome": {
                "description": "A short account of what was done — appended to the task body as an Outcome section.",
                "type": "string"
              }
            },
            "required": ["id", "outcome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Complete a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1a0ea5c247bd5bdd156b2d9341e7f10d93a385bb36888fe3e9651ee1e70e188c"
        },
        {
          "name": "create_task",
          "title": "Create a task",
          "description": "Turn a finding into first-class work: creates a `task`-type concept with taskStatus=open and the given relations — part_of a domain, `realizes` stories/features, `governed_by` specs — plus codeAreas pointing at where the work lands. Use when you discover work that isn't reflected in the codebase yet (a gap, a needed fix, a follow-up). The task then shows up in list_tasks / take_task and on the Kanban board.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Markdown description of the work. [[wiki-links]] become edges.",
                "type": "string"
              },
              "codeAreas": {
                "description": "Rough codebase paths/globs where the work lands.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "description": "Domain concept id this task is part_of.",
                "type": "string"
              },
              "governedBy": {
                "description": "Spec concept ids that govern this task (creates `governed_by` edges).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "realizes": {
                "description": "Story/feature concept ids this task realizes (creates `realizes` edges).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tags": {
                "description": "Tags, e.g. a priority tag like \"high\" or an area tag.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Human-readable task title (required, non-empty).",
                "type": "string"
              }
            },
            "required": ["body", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e73291fbda2f122bab8d9fbff36bf8bdabc329e85c62c50cff3923d4f08421fc"
        },
        {
          "name": "create_vault",
          "title": "Create a vault",
          "description": "Create a new, empty vault owned by you and add it to this connection. Returns the new vault and the vaults this connection can now use. Once a connection covers more than one vault, every vault tool takes a `vault` argument (a slug or id) and list_vaults lists the vaults. Each account has a vault limit and an hourly creation limit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
