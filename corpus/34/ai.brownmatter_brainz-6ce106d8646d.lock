              "relation": {
                "default": "related_to",
                "description": "Edge type, e.g. part_of | realized_by | governs | depends_on | constrains | supersedes | related_to (default). Domain→domain links (related_to / depends_on) are encouraged where two domains share a boundary, so the graph shows how areas overlap.",
                "type": "string"
              },
              "to": {
                "description": "Target concept id.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Link concepts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
