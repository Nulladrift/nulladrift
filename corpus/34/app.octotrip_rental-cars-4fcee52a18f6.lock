{
  "lockfileVersion": 2,
  "subjects": {
    "app.octotrip/rental-cars": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.octotrip.app/rental-cars/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "OctoTrip Rental Cars",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "search",
          "description": "Searches live rental-car offers for a pickup location and rental period, optionally with a different dropoff location, pickup/dropoff times, driver age, currency, and language. Use this when the user wants to compare available rental cars, prices, vendors, categories, or booking links for a specific trip. Do not use it for flights, hotels, public transport, or general travel planning unless the user has car-rental intent. The tool queries external provider APIs in real time, returns price-ranked results grouped by SIPP/category, and may include affiliate booking links. It does not book cars, modify reservations, charge users, or store user data.",
          "inputSchema": {
            "properties": {
              "age": {
                "default": 30,
                "description": "Driver age. Defaults to 30. Younger drivers may incur surcharges.",
                "minimum": 18,
                "title": "Age",
                "type": "integer"
              },
              "currency": {
                "default": "EUR",
                "description": "Preferred ISO 4217 currency code for prices, such as EUR, USD, or GBP. Defaults to EUR.",
                "title": "Currency",
                "type": "string"
              },
              "dropoff_date": {
                "description": "Dropoff date. Must be after the pickup date.",
                "title": "Dropoff Date",
                "type": "string"
              },
              "dropoff_location": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional different dropoff location. If omitted, the pickup location is used.",
                "title": "Dropoff Location"
              },
              "dropoff_time": {
                "default": "12:00",
                "description": "Dropoff time in 24-hour HH:MM format. Defaults to 12:00.",
                "title": "Dropoff Time",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Preferred response language code, such as en or de. Defaults to en.",
                "title": "Language",
                "type": "string"
              },
              "location": {
                "description": "Pickup location, such as a city, airport, station, address, or landmark.",
                "title": "Location",
                "type": "string"
              },
              "pickup_date": {
                "description": "Pickup date. Accepts common date formats such as YYYY-MM-DD, DD.MM.YYYY, or natural-language dates.",
                "title": "Pickup Date",
                "type": "string"
              },
              "pickup_time": {
                "default": "12:00",
                "description": "Pickup time in 24-hour HH:MM format. Defaults to 12:00.",
                "title": "Pickup Time",
                "type": "string"
              }
            },
            "required": ["dropoff_date", "location", "pickup_date"],
            "title": "searchArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "searchOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rental Car Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38b2606f63007f712a5efac288c3e32e7feb95d15696f7d3cb592021aea24a0d"
        }
      ],
      "digest": "sha256:6376288e0e7fee6cd9455c14de3a80269643306f07507a296764ae73dc590098"
    }
  }
