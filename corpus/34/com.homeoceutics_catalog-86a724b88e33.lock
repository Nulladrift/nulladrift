        "name": "homeoceutics-catalog",
        "title": "Catalogue Homeoceutics / Homeoceutics Catalog",
        "version": "1.1.0",
        "description": "FR : Consultation anonyme, en lecture seule, des titres et métadonnées du catalogue Homeoceutics. EN: Anonymous, read-only access to Homeoceutics catalog titles and metadata.",
        "websiteUrl": "https://homeoceutics.com/fr/mcp"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "search_fiches_information",
          "title": "Catalogue des fiches d'information / Information cards catalog",
          "description": "FR : Rechercher ou parcourir les titres des fiches d’information du catalogue public. EN: Search or browse information-card titles in the public catalog.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "FR : Paramètres de recherche ou de parcours du catalogue public. EN: Public catalog search or browse parameters.",
            "properties": {
              "categorie": {
                "description": "FR : Identifiant exact d’une catégorie, réutilisable depuis categories[].id. EN: Exact category identifier, reusable from categories[].id.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "FR : Taille de page. EN: Page size.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "fr",
                "description": "FR : Langue demandée ; les titres indisponibles sont repliés vers le français. EN: Requested language; unavailable titles fall back to French.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "FR : Décalage de page, à reprendre depuis pagination.next_offset. EN: Page offset, continued from pagination.next_offset.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "FR : Texte recherché dans la projection publique sûre ; omettre pour parcourir par titre. EN: Text searched in the safe public projection; omit to browse by title.",
                "maxLength": 200,
                "type": "string"
              },
              "statut": {
                "description": "FR : Statut de visibilité anonyme à filtrer. EN: Anonymous visibility status to filter by.",
                "enum": ["public", "subscription_basic", "subscription_premium", "subscription_pro"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "FR : Page structurée de titres et métadonnées du catalogue public. EN: Structured page of public catalog titles and metadata.",
            "properties": {
              "items": {
                "description": "FR : Titres et métadonnées uniquement. EN: Titles and metadata only.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acces_praticien_fsm_requis": {
                      "description": "FR : true exige un abonnement Pro actif et les déclarations praticien et formation FSM ; aucun achat du pack FSMPro n’est requis. EN: true requires an active Pro subscription plus practitioner and FSM-training declarations; no FSMPro pack purchase is required.",
                      "type": "boolean"
                    },
                    "categories": {
                      "description": "FR : Catégories publiques de l’entrée. EN: Public entry categories.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "description": "FR : Identifiant stable à utiliser dans le filtre categorie. EN: Stable identifier for the categorie filter.",
                            "type": "string"
                          },
                          "nom": {
                            "description": "FR : Libellé localisé de la catégorie. EN: Localized category label.",
                            "type": "string"
                          }
                        },
                        "required": ["id", "nom"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "description": "FR : Identifiant préfixé, unique entre les deux catalogues. EN: Prefixed identifier, unique across both catalogs.",
                      "type": "string"
                    },
                    "locale_titre": {
                      "description": "FR : Langue effective du titre après repli français. EN: Effective title language after French fallback.",
                      "enum": ["fr", "en"],
                      "type": "string"
                    },
                    "nom": {
                      "description": "FR : Titre localisé uniquement ; aucun contenu ni extrait. EN: Localized title only; no content or excerpt.",
                      "type": "string"
                    },
                    "statut": {
                      "description": "FR : Niveau d’accès public ou abonné. EN: Public or subscriber access tier.",
                      "enum": ["public", "subscription_basic", "subscription_premium", "subscription_pro"],
                      "type": "string"
                    },
                    "type": {
                      "description": "FR : Type stable de l’entrée. EN: Stable entry type.",
                      "enum": ["infoceutique", "fiche_information"],
                      "type": "string"
                    }
                  },
                  "required": ["acces_praticien_fsm_requis", "categories", "id", "locale_titre", "nom", "statut", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "description": "FR : Langue demandée pour cette page. EN: Locale requested for this page.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "pagination": {
                "additionalProperties": false,
                "description": "FR : Pagination déterministe par offset. EN: Deterministic offset pagination.",
                "properties": {
                  "limit": {
                    "description": "FR : Taille de page appliquée. EN: Applied page size.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "next_offset": {
                    "anyOf": [
                      {
                        "maximum": 100000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "FR : Décalage suivant, ou null en dernière page. EN: Next offset, or null on the last page."
                  },
                  "offset": {
                    "description": "FR : Décalage de cette page. EN: Offset for this page.",
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total": {
                    "description": "FR : Nombre exact de résultats. EN: Exact result count.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["limit", "next_offset", "offset", "total"],
                "type": "object"
              }
            },
            "required": ["items", "locale", "pagination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
