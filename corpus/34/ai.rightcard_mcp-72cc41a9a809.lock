{
  "lockfileVersion": 2,
  "subjects": {
    "ai.rightcard/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.rightcard.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rightcard",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RightCard answers 'which of these credit cards should pay here?' from bank-published, two-source-verified reward data. Pass the user's card ids (from search_cards) plus a store name or a category. Cash value is the default; ask for valuation='points' to value points at conservative per-program travel values. Every answer includes honest caveats: superstores/warehouse clubs that do not post grocery bonuses, rotating quarters that need activation, ties. RightCard never receives a bank login, balances, or transactions. This tool takes a list of card ids and a store name, returns an answer, and stores nothing.",
      "tools": [
        {
          "name": "best_card",
          "title": "Best card for a store or category",
          "description": "Which of the given cards earns the most at a store (merchant) or for a spend category, today. Returns the card, the honest rate, why, and caveats (merchant-code traps, activation, ties). Base rates + rotating bonuses + built-in card benefits only; a user's personal bank offers live on their phone and are not consulted here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Spend category when there is no specific store.",
                "enum": ["dining", "grocery", "travel", "gas", "online", "drugstore", "transit", "streaming", "entertainment", "phone_internet", "office_supply", "general"],
                "type": "string"
              },
              "chosen_categories": {
                "additionalProperties": {
                  "items": {
                    "enum": ["dining", "grocery", "travel", "gas", "online", "drugstore", "transit", "streaming", "entertainment", "phone_internet", "office_supply", "general"],
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "For choose-your-category cards (Citi Custom Cash, BofA Customized, Venmo): card id → the categories the person set.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "merchant": {
                "description": "Store name, e.g. 'Costco', 'Whole Foods', 'Uber'. Use this OR category.",
                "type": "string"
              },
              "on": {
                "description": "Date (YYYY-MM-DD, UTC) for rotating windows; defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "valuation": {
                "default": "cash",
                "description": "'cash' counts each point at up to 1¢, and hotel/airline points at their lower value (default). 'points' values points per program at conservative travel values.",
                "enum": ["cash", "points"],
                "type": "string"
              },
              "wallet": {
                "description": "Card ids the person holds (from search_cards).",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6fdb4e9a0ad091ed487ba220817d34b604c756e3644f0b6750f5c3822dd65eaa"
        },
        {
          "name": "card",
          "title": "A card's verified rates",
          "description": "Everything RightCard knows about one card: rates by category, base rate, currency, annual fee, verification status, live rotating windows, and the choose-your-category spec if it has one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9483a44a3ecef6d7fe4155fb6418f5f8e472444370eb3e17900fbf53c79b30a8"
        },
        {
          "name": "lookup_merchant",
          "title": "How a store is coded",
          "description": "The store's reward category as RightCard's directory files it, its merchant type, and the merchant-code caveat when a category bonus usually will not post there (superstores like Walmart/Target, warehouse clubs like Costco/Sam's). Same ranking the app uses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3bc4c1e1117b50c0c08f4d98518c8c2074efa8cb73d1d43700fdbe32f532dfd9"
        },
        {
          "name": "rotating_calendar",
          "title": "Rotating 5% windows",
          "description": "Live and upcoming rotating-category windows (Freedom Flex, Discover it, Citi Dividend…) and permanent merchant benefits, from the same verified data as the app. Optionally filter by card id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "card_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e5d415547458e326c386298ee27add7c4f203d3da729953eb86aa2d79d3564e"
        },
        {
          "name": "search_cards",
          "title": "Find card ids",
          "description": "Search RightCard's catalog by card or issuer name to get the ids to pass into best_card. Verified cards first; unverified cards are flagged, never hidden.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "issuer": {
                "type": "string"
              },
              "limit": {
                "default": 12,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9103723ad9d79e1750d82b18afbe5718f000287767adbfe107517b41a8764358"
        }
      ],
      "resources": [
        {
          "uri": "rightcard://catalog",
          "name": "catalog",
          "title": "Verified card catalog",
          "mimeType": "application/json",
          "digest": "sha256:1c2b49b2b53c749b3dc2ed0d9c1713e0df11ff2b4ce2f6e0c4ec2e6cdb5cd8b0"
        },
        {
          "uri": "rightcard://valuation",
          "name": "valuation",
          "title": "How points are valued",
          "mimeType": "application/json",
          "digest": "sha256:507194aeeb6024fbe74a575efa581d71544ccf7ba5514f698cc855d3828697be"
        }
      ],
      "prompts": [
        {
          "name": "which-card",
          "title": "Which card should I use here?",
          "description": "Ask RightCard for the best card at a store, given the cards you hold.",
          "arguments": [
            {
              "name": "cards",
              "description": "Your cards, in your own words",
              "required": true
            },
            {
              "name": "store",
              "description": "Where you're paying",
              "required": true
            }
          ],
          "digest": "sha256:cde1f6d9a1239b937b59dbf03f0d7d657c4f874360005931752ca71b0aa5f3b2"
        }
      ],
      "digest": "sha256:ef2160506cf98462548dc66b1ed1e65b94d4dfa3dd1d00261b43647806efa85e"
    }
  }
}
