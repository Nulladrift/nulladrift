                "type": "string"
              },
              "order_id": {
                "description": "Bank account application reference ID (e.g. BK-20261028-XXXXXX).",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
