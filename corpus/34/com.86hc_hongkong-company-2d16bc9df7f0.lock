        {
          "name": "create_filing_order",
          "description": "Create a paid order for an official Hong Kong Companies Registry (Cap. 622) / Business Registration Office (Cap. 310) statutory PDF document OR a 360° Commercial Credit & Due Diligence Report (`CREDIT_REPORT` HK$ 499 / `CREDIT_DEEP` HK$ 880) — ONLY call this after user confirmation. Works WITHOUT an API key! Payment routing is region-aware when `pay_method=\"auto\"`: overseas & ChatGPT users receive Stripe Checkout ONLY (`checkout_url` + `/en/` `web_cashier_url`); Mainland China users receive Alipay + 3-in-1 Web Cashier; Hong Kong users receive AlipayHK + `/tc/` Web Cashier. For ICRIS filings pass `barcode` OR `identifier` + `doc_code` (`NAR1`, `NNC1`, `A&A`, `ND2A`, `BRC`, `EBRE`); for due diligence reports pass `identifier` + `doc_code=\"CREDIT_REPORT\"` (or `\"CREDIT_DEEP\"`). Earn +10 bonus query credits automatically upon payment.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional 86hc.com MCP API key (format: hkq_live_xxxx). Omit or leave empty to use the automatic Guest IP Trial Mode (3 free company detail queries/day + direct Stripe filing orders without a key). Free API key with 20 daily company queries available at https://www.86hc.com/user",
                "type": "string"
              },
              "barcode": {
                "description": "Authentic ICRIS document barcode obtained from get_company_filings or batch_get_company_details. Omit when ordering CREDIT_REPORT / CREDIT_DEEP, or provide identifier + doc_code to auto-select the latest verified barcode.",
                "type": "string"
              },
              "company_name": {
                "description": "Name or CR number of the company.",
                "type": "string"
              },
              "doc_code": {
                "description": "Document or report code: NAR1 (Annual Return), NNC1 (Incorporation Form), ND2A (Change of Director/Secretary), A&A (Articles of Association), CI (Certificate of Incorporation), BRC (Duplicate of Valid Business Registration Certificate), EBRE (Electronic Extract of Business Register), CREDIT_REPORT (360° Commercial Credit & Due Diligence Report, HK$ 499), or CREDIT_DEEP (Comprehensive 4D Due Diligence Dossier, HK$ 880). Defaults to NAR1.",
                "type": "string"
              },
              "doc_name": {
                "description": "Document title or form code (e.g. NAR1 Annual Return or CREDIT_REPORT).",
                "type": "string"
              },
              "email": {
                "description": "Optional user email address to receive the official PDF download link.",
                "type": "string"
              },
              "identifier": {
                "description": "Company CR number, 8-digit BRN, or company name.",
                "type": "string"
              },
              "pay_method": {
                "default": "auto",
                "description": "Payment routing mode: auto (default — Stripe ONLY for overseas/ChatGPT, Alipay for Mainland China, AlipayHK for Hong Kong), or explicit stripe / alipay / alipay_hk.",
                "enum": ["auto", "stripe", "alipay", "alipay_hk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create Statutory Filing or Credit Report Order"
