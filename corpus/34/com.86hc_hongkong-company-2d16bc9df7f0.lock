        {
          "name": "search_companies",
          "description": "Search Hong Kong companies by Chinese/English name keyword, 7-digit CR number, or 8-digit Business Registration Number (BRN / UBI, mandatory for companies incorporated on or after 27 Dec 2023). Works WITHOUT an API key (15 free searches/day per user/IP; 50/day with free API key; 300/day for paid users). Returns matching list with legal names, CR number, active/dissolved status, incorporation date, entity type, and canonical 86hc.com dossier URLs.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional 86hc.com MCP API key (format: hkq_live_xxxx). Omit or leave empty to use the automatic Guest IP Trial Mode (3 free company detail queries/day + direct Stripe filing orders without a key). Free API key with 20 daily company queries available at https://www.86hc.com/user",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max number of results to return (1-20, default 5).",
                "type": "integer"
              },
              "query": {
                "description": "Company name keyword (Chinese or English, min 2 chars), 7-digit CR number, or 8-digit Business Registration Number (BRN / UBI).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Hong Kong Companies Registry"
          },
          "behavior": {
