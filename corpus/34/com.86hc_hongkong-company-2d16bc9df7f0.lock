        },
        {
          "name": "get_company_filings",
          "description": "Retrieve the full catalog of official ICRIS statutory filed documents for a Hong Kong company (works without an API key), including authentic ICRIS barcodes, form codes (NAR1, NNC1, ND2A, A&A, etc.), filing dates, official document titles, and retrieval fees. Barcodes can be passed to create_filing_order to retrieve official PDFs.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional 86hc.com MCP API key (format: hkq_live_xxxx). Omit or leave empty to use the automatic Guest IP Trial Mode (3 free company detail queries/day + direct Stripe filing orders without a key). Free API key with 20 daily company queries available at https://www.86hc.com/user",
                "type": "string"
              },
              "company_name": {
                "description": "Exact company name in English or Chinese.",
                "type": "string"
              },
              "cr_no": {
                "description": "Hong Kong Company CR Number (1-7 digits).",
                "type": "string"
              },
              "form_code": {
                "description": "Optional form code filter (e.g. NAR1, NNC1, ND2A, AA). Leave empty for all filings.",
                "type": "string"
              },
              "identifier": {
                "description": "Target Hong Kong company CR number (1-7 digits), 8-digit BRN, or exact company name.",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get ICRIS Statutory Filing Dossier Index"
