        {
          "name": "submit_bank_account_application",
          "description": "100% FREE Stage 1 KYC pre-screening (consumes 0 query credits; works directly WITH OR WITHOUT login/API key — only invoke after the user confirms `contact_name` and `contact_phone`). Submits a Hong Kong corporate bank account opening pre-screening application for HSBC Hong Kong (`hsbc`) or OCBC Bank Hong Kong (`ocbc`), resolves company details from 86hc.com's 3.9M+ registry, assigns a `BK-YYYYMMDD-XXXXXX` reference ID and verification token, notifies HC Business licensed TCSP (`TC006431`) compliance officers, and returns a Stage 2 secure continuation URL to upload statutory documents and complete Cap. 553 electronic signature.",
          "inputSchema": {
            "properties": {
              "agent_platform": {
                "description": "Optional name of the calling AI platform (e.g. ChatGPT, Claude, Coze, Doubao, Baidu Wenxin).",
                "type": "string"
              },
              "api_key": {
                "description": "Optional 86hc.com MCP API key (format: hkq_live_xxxx). Omit or leave empty to use the automatic Guest IP Trial Mode (3 free company detail queries/day + direct Stripe filing orders without a key). Free API key with 20 daily company queries available at https://www.86hc.com/user",
                "type": "string"
              },
              "applicant_role": {
                "default": "SHAREHOLDER_DIR",
                "description": "Role of the applicant in the Hong Kong company.",
                "enum": ["SHAREHOLDER_DIR", "DIRECTOR", "SHAREHOLDER", "AUTH_SIGNATORY", "AUTH_REPRESENTATIVE"],
                "type": "string"
              },
              "bank_target": {
                "default": "hsbc",
                "description": "Target bank: hsbc (HSBC Hong Kong), ocbc (OCBC Bank Hong Kong), or both.",
                "enum": ["hsbc", "ocbc", "both"],
                "type": "string"
              },
              "contact_email": {
                "description": "Applicant email address to receive the official application receipt and compliance review updates.",
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the applicant / director / authorized handler.",
                "type": "string"
              },
              "contact_phone": {
                "description": "Contact mobile phone number with country/region code (e.g. +86 13800138000 or +852 91234567).",
                "type": "string"
              },
              "contact_wechat": {
                "description": "Optional WeChat ID or WhatsApp number for 1-on-1 compliance officer liaison.",
                "type": "string"
              },
              "currencies": {
                "description": "Required settlement currencies (e.g. [\"USD\", \"HKD\", \"CNH\", \"EUR\", \"SGD\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "directors_shareholders": {
                "description": "Optional summary of directors and 25%+ Ultimate Beneficial Owners (UBO).",
                "type": "string"
              },
              "has_mainland_company": {
                "description": "Whether there is an affiliated Mainland China operating company.",
                "type": "boolean"
              },
              "identifier": {
                "description": "Hong Kong company name (Chinese or English), 7-digit CR number, or 8-digit BRN.",
                "type": "string"
              },
              "industry": {
                "description": "Industry sector (e.g. EXPORT_TRADE, ECOMMERCE_2C, ECOMMERCE_2B, IT_SOFTWARE, CONSULTING_SVC, STARTUP_COMPANY, LOGISTICS_SUPPLY).",
                "type": "string"
              },
              "mainland_company_name": {
