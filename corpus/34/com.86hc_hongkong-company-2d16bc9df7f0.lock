        {
          "name": "create_filing_order",
          "description": "Create a paid filing retrieval order for an official Hong Kong Companies Registry (Cap. 622) or Business Registration Office (Cap. 310) statutory document (ONLY call this when the user explicitly wants to purchase/retrieve an official PDF document). Works directly WITHOUT an API key! Returns both `web_cashier_url` (86hc.com 3-in-1 Web Cashier supporting Mainland Alipay 支付宝, AlipayHK 香港支付宝, and Stripe / Apple Pay) and `checkout_url` (direct Stripe / Alipay checkout link). Pass either an authentic ICRIS barcode OR pass identifier + doc_code (e.g. NAR1, NNC1, A&A, ND2A, BRC for Duplicate of Valid Business Registration Certificate, or EBRE for Electronic Extract of Business Register) and the server will automatically select the latest verified ICRIS barcode or 8-digit BRN. Upon payment completion, the user receives the official PDF download link and earns +10 bonus permanent company query credits.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional 86hc.com MCP API key (format: hkq_live_xxxx). Omit or leave empty to use the automatic Guest IP Trial Mode (3 free company detail queries/day + direct Stripe filing orders without a key). Free API key with 20 daily company queries available at https://www.86hc.com/user",
                "type": "string"
              },
              "barcode": {
                "description": "Authentic ICRIS document barcode obtained from get_company_filings or batch_get_company_details. If omitted, provide identifier + doc_code to auto-select the latest verified barcode.",
                "type": "string"
              },
              "company_name": {
                "description": "Name or CR number of the company.",
                "type": "string"
              },
              "doc_code": {
                "description": "Statutory form code: NAR1 (Annual Return), NNC1 (Incorporation Form), ND2A (Change of Director/Secretary), A&A (Articles of Association), CI (Certificate of Incorporation), BRC (Duplicate of Valid Business Registration Certificate 有效商业登记证核证复本), or EBRE (Electronic Extract of Business Register 商业登记册电子摘录). Defaults to NAR1.",
                "type": "string"
              },
              "doc_name": {
                "description": "Document title or form code (e.g. NAR1 Annual Return).",
                "type": "string"
              },
              "email": {
                "description": "Optional user email address to receive the official PDF download link.",
                "type": "string"
              },
              "identifier": {
                "description": "Company CR number, 8-digit BRN, or company name.",
                "type": "string"
              },
              "pay_method": {
                "default": "stripe",
                "description": "Preferred payment method: alipay (Mainland Alipay 支付宝), alipay_hk (AlipayHK 香港支付宝), or stripe (Visa / MasterCard / Apple Pay). Note: web_cashier_url always allows switching among all 3 methods.",
                "enum": ["alipay", "alipay_hk", "stripe"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create Statutory Filing Retrieval Order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
