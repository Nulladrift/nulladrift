        },
        {
          "name": "submit_bank_account_application",
          "description": "Submit an online Hong Kong corporate bank account opening pre-screening application (Stage 1 KYC dossier) for HSBC Hong Kong (hsbc) or OCBC Bank Hong Kong (ocbc). REQUIRES USER LOGIN (personal API Key hkq_live_... obtained after signing in at https://www.86hc.com/user, passed via X-API-Key header or api_key parameter). Automatically resolves the company from 86hc.com's 3.9M+ registry, binds the BK-YYYYMMDD-XXXXXX reference number to the user's account, notifies HC Business licensed TCSP (TC006431) compliance officers in real time, sends an official confirmation email, and returns a Stage 2 continuation URL where the logged-in user can upload statutory documents (CI, BRC, NNC1/NAR1, IDs) and complete Cap. 553 electronic signature.",
          "inputSchema": {
            "properties": {
              "agent_platform": {
                "description": "Optional name of the calling AI platform (e.g. ChatGPT, Claude, Coze, Doubao, Baidu Wenxin).",
                "type": "string"
              },
              "api_key": {
                "description": "Personal 86hc.com API Key (hkq_live_xxxx) obtained after signing in at https://www.86hc.com/user (required if X-API-Key header is not configured).",
                "type": "string"
              },
              "applicant_role": {
                "default": "SHAREHOLDER_DIR",
                "description": "Role of the applicant in the Hong Kong company.",
                "enum": ["SHAREHOLDER_DIR", "DIRECTOR", "SHAREHOLDER", "AUTH_SIGNATORY", "AUTH_REPRESENTATIVE"],
                "type": "string"
              },
              "bank_target": {
                "default": "hsbc",
                "description": "Target bank: hsbc (HSBC Hong Kong), ocbc (OCBC Bank Hong Kong), or both.",
                "enum": ["hsbc", "ocbc", "both"],
                "type": "string"
              },
              "contact_email": {
                "description": "Applicant email address to receive the official application receipt and compliance review updates.",
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the applicant / director / authorized handler.",
                "type": "string"
              },
              "contact_phone": {
                "description": "Contact mobile phone number with country/region code (e.g. +86 13800138000 or +852 91234567).",
                "type": "string"
              },
              "contact_wechat": {
                "description": "Optional WeChat ID or WhatsApp number for 1-on-1 compliance officer liaison.",
                "type": "string"
              },
              "currencies": {
                "description": "Required settlement currencies (e.g. [\"USD\", \"HKD\", \"CNH\", \"EUR\", \"SGD\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "directors_shareholders": {
                "description": "Optional summary of directors and 25%+ Ultimate Beneficial Owners (UBO).",
                "type": "string"
              },
              "has_mainland_company": {
                "description": "Whether there is an affiliated Mainland China operating company.",
                "type": "boolean"
              },
              "identifier": {
                "description": "Hong Kong company name (Chinese or English), 7-digit CR number, or 8-digit BRN.",
                "type": "string"
              },
              "industry": {
                "description": "Industry sector (e.g. EXPORT_TRADE, ECOMMERCE_2C, ECOMMERCE_2B, IT_SOFTWARE, CONSULTING_SVC, STARTUP_COMPANY, LOGISTICS_SUPPLY).",
                "type": "string"
              },
              "mainland_company_name": {
                "description": "Optional name of the affiliated Mainland China company.",
                "type": "string"
              },
              "products_services": {
                "description": "Specific goods traded or services rendered (e.g. Consumer electronics export, cross-border SaaS subscription).",
                "type": "string"
              },
              "signing_location": {
                "description": "Preferred signing mode (e.g. 赴港分行现场面签 or 内地指定城市分行视频见证).",
                "type": "string"
              },
              "top_clients": {
