      "instructions": "ForexDemo.com tools. The calculate_* tools run the same calculations as the calculator pages on forexdemo.com and return a one-paragraph answer, every figure, the inputs used and any assumption made. No live prices are fetched: when a price is left out, the page's dated example price is used and the answer says so. find_demo_accounts and get_demo_account return Forex demo account research taken from each broker's own website, with the date it was checked, the broker's demo sign-up page and the ForexDemo.com page for that broker. search and fetch cover the same calculators and research. Every result includes the address of the ForexDemo.com page it comes from. For education. Not financial advice. Check figures with your broker before trading.",
      "tools": [
        {
          "name": "calculate_account_survival",
          "title": "Account Survival Calculator",
          "description": "The chance that a trading account loses a set share of its money (risk of ruin) within a number of trades, from the win rate, the average win and the risk per trade. Same calculation as the Account Survival Calculator page at https://forexdemo.com/account-survival-calculator.html. Every input is optional unless marked required; left-out inputs use the page's defaults, which are listed in the reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reward": {
                "description": "Average win as a multiple of the risk, such as 1.5.",
                "type": "number"
              },
              "risk": {
                "default": 2,
                "description": "Risk per trade in percent. Give 2 for 2%.",
                "type": "number"
              },
              "riskBase": {
                "default": "current",
                "description": "current: risk is a share of the current balance. start: of the starting balance.",
                "enum": ["current", "start"],
                "type": "string"
              },
              "ruin": {
                "default": 30,
                "description": "Ruin level: the share of the account lost that counts as ruin. Give 2 for 2%.",
                "type": "number"
              },
              "ruinType": {
                "default": "start",
                "description": "Where the ruin level is measured from: start or peak.",
                "enum": ["start", "peak"],
                "type": "string"
              },
              "target": {
                "description": "Optional profit target in percent. Give 2 for 2%.",
                "type": "number"
              },
              "trades": {
                "default": 200,
                "description": "Number of trades to look ahead.",
                "type": "number"
              },
              "winRate": {
                "description": "Win rate in percent. Give 2 for 2%.",
                "type": "number"
              }
            },
            "required": ["reward", "winRate"],
            "type": "object"
          },
          "annotations": {
