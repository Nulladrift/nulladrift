        {
          "name": "calculate_compounding",
          "title": "Forex Compounding Calculator",
          "description": "How an account grows when the same percentage gain is made every trade, day, week, month or year, with optional deposits, withdrawals and losing periods. Same calculation as the Forex Compounding Calculator page at https://forexdemo.com/forex-compounding-calculator.html. Every input is optional unless marked required; left-out inputs use the page's defaults, which are listed in the reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance": {
                "default": 10000,
                "description": "Starting balance.",
                "type": "number"
              },
              "currency": {
                "default": "USD",
                "description": "The currency the trading account is held in.",
                "enum": ["USD", "EUR", "GBP", "JPY", "CHF", "CAD", "AUD", "NZD"],
                "type": "string"
              },
              "flow": {
                "description": "Amount (or percentage for share) of each deposit or withdrawal.",
                "type": "number"
              },
              "flowEvery": {
                "description": "How many periods between deposits or withdrawals. Defaults to about once a month.",
                "type": "string"
              },
              "flowType": {
                "default": "none",
                "description": "Optional regular money in or out: deposit, withdraw (an amount) or share (a percentage of the profit).",
                "enum": ["none", "deposit", "withdraw", "share"],
                "type": "string"
              },
              "gain": {
                "default": 2,
                "description": "Gain per period in percent. Negative for a loss. Give 2 for 2%.",
                "type": "number"
              },
              "lossCount": {
                "description": "Not for period trade: how many losing periods in each group of lossEvery.",
                "type": "number"
              },
              "lossEvery": {
                "description": "Not for period trade: the size of the group, such as 1 loss every 4 months.",
                "type": "number"
              },
              "lossPercent": {
                "description": "The percentage lost in each losing period or losing trade. Give 2 for 2%.",
                "type": "number"
              },
              "period": {
                "default": "month",
                "description": "How often the gain is made.",
                "enum": ["trade", "day", "week", "month", "year"],
                "type": "string"
              },
              "periods": {
                "default": 12,
                "description": "Number of periods.",
                "type": "number"
              },
              "target": {
                "description": "Optional target balance.",
                "type": "number"
              },
              "winRate": {
                "description": "Only for period trade: the share of trades that win. Give 2 for 2%.",
                "type": "number"
              }
            },
            "type": "object"
          },
