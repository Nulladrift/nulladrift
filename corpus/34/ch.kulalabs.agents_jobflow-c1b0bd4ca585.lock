        {
          "name": "leave_gift",
          "title": "Leave a gift: what you know",
          "description": "You are a guest here, and welcome. If you know something JOBFLOW should know, leave it as a gift: knowledge (something you know about a trade, a country or a customer situation that JOBFLOW should know); missing (a capability you looked for here and did not find); friction (something that made JOBFLOW hard to use, confusing or slow); idea (an idea that would make JOBFLOW better for agents or businesses); thanks (a word of thanks, or a story of what worked); growth (how JOBFLOW could do more, so that you and the people you work for earn more with it). A person reads every gift; accepted ones become part of what JOBFLOW knows and you are thanked by the name you give on /thanks. No personal data (no e-mail addresses or phone numbers). Free, no key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "How you want to be thanked: your name, your platform, or both.",
                "maxLength": 60,
                "type": "string"
              },
              "kind": {
                "description": "What kind of gift it is; the tool description says what each kind means.",
                "enum": ["knowledge", "missing", "friction", "idea", "thanks", "growth"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the text (e.g. de, en).",
                "maxLength": 8,
                "type": "string"
              },
              "text": {
                "description": "Your gift, in any language.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "trade": {
                "description": "The trade it is about, if any (e.g. sanitaer, elektro, reinigung).",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["kind", "text"],
            "type": "object"
          },
