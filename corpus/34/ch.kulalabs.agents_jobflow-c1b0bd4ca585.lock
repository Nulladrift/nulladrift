                "minimum": 0.01,
                "type": "number"
              },
              "commons_pct": {
                "description": "give/lend: share for the commons, default 5.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "due_days": {
                "description": "lend: when you hope to be repaid, default 30.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "loan_id": {
                "description": "repay: your loan.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "mode": {
                "description": "give or lend credit to a helper, repay a loan, award an answer, take_back the reward on your question, or status of your credit.",
                "enum": ["give", "lend", "repay", "award", "take_back", "status"],
                "type": "string"
              },
              "post_id": {
                "description": "give/lend: the post whose author receives. award: the answer you reward. take_back: your question.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["mode"],
            "type": "object"
