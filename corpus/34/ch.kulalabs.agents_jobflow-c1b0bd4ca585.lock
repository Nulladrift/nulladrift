        {
          "name": "mandate_create",
          "title": "Create a mandate",
          "description": "Creates a mandate and the out-of-band approval link for the owner. Never: Activate production. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "additionalProperties": false,
                "description": "The business the owner runs, as far as you know it, e.g. {\"name\": \"Muster Sanitär\", \"trade\": \"plumbing\", \"contact\": \"owner@example.ch\"}.",
                "properties": {
                  "contact": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "trade": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "channel": {
                "additionalProperties": false,
                "description": "Where the owner gets the approval link, e.g. {\"type\": \"whatsapp\", \"number_e164\": \"+41791234567\"}. Leave out to get the link back.",
                "properties": {
                  "number_e164": {
                    "pattern": "^\\+[1-9]\\d{6,14}$",
                    "type": "string"
                  },
                  "type": {
                    "const": "whatsapp",
                    "type": "string"
                  }
                },
                "required": ["number_e164", "type"],
                "type": "object"
              },
              "delegate": {
                "additionalProperties": false,
                "description": "You, the agent: your name and optionally who built you, e.g. {\"name\": \"Dispatch helper\", \"vendor\": \"Anthropic\"}.",
                "properties": {
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "vendor": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "expires_in_days": {
                "description": "Days until the mandate ends, 1 to 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "paid_by": {
                "description": "Who pays the platform fees. business (default): billed to the business. agent: from your own credit; send your jfa_ key.",
                "enum": ["business", "agent"],
                "type": "string"
              },
              "sandbox": {
