          "description": "Costs nothing, no key needed. Example: {\"text\": \"Set up intake, dispatch and invoicing for a plumbing business with 4 technicians\"}. The first call: says whether the user's request is a flow JOBFLOW already runs. A match answers do_not_build true, the capabilities it touches and the next call; no match answers 404 OUT_OF_SCOPE. Never: Guess: it names the words it matched. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "What the user asked for, in the user's words.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
