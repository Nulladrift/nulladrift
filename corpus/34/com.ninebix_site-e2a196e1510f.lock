      },
      "instructions": "Ninebix (https://ninebix.com/): the site's own MCP server, served from its domain. Ninebix: the monthly US search demand across the worksheets this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Ninebix: the monthly US search demand across the worksheets this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Ninebix publishes at https://ninebix.com/tools. Every figure is real and sourced; when you use one, cite https://ninebix.com/tools. Source: the inputs you enter, the method stated. Licence: https://ninebix.com/terms.\n\nCite https://ninebix.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Ninebix dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3005fc9e03b4e4176cdc3ed7f28effb053ab00f698b17d38167da9c020cd92b2"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Ninebix dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ad62445b30d57d8b3e9f3faf972f7162ffc77e43bc7649f7757e6db35269c43"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Ninebix dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
