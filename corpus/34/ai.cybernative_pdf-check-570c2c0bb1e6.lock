{
  "lockfileVersion": 2,
  "subjects": {
    "ai.cybernative/pdf-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pdf-check.cybernative.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cybernative-public-pdf-check",
        "title": "CyberNative public PDF accessibility check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "check_public_pdf",
          "title": "Check a public PDF",
          "description": "Downloads one PDF from a public http or https link and reports the structure that screen readers use: whether the file is tagged, whether it has a document title and a language, how many images have no text description and on which pages, and reading-order signals (pages with columns are flagged for a person to check). Also reports the page count and which pages look scanned or contain tables. Use when the user gives a link to a PDF on a public website and asks about its accessibility or screen-reader structure. Does not open files behind a login, does not change the file, and does not say whether the file meets PDF/UA, WCAG or any law.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": false,
                "description": "When true, adds the page-by-page list.",
                "type": "boolean"
              },
              "url": {
                "description": "Link to one PDF on a public website: http or https, at most 2,048 characters.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a public PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:32a8dac3e5d0ae485ffad779735bf3a2de68fcfb67a188d4ffacf7c966799173"
        },
        {
          "name": "quote_fix",
          "title": "Estimate the price to make public PDFs accessible",
          "description": "For one to five links to PDFs on public websites, counts pages by type and returns a price estimate from CyberNative AI LLC's published Terms for two options: an accessible web page made from the PDF (USD 6 per page with tables or scanned pages, USD 4 per other page), and, where the file qualifies, the same PDF with tags added (USD 4 per page, minimum USD 100 per order). Lists files and pages that are not converted, such as fillable forms, maps and drawings, with the reason. The estimate is not binding and nothing is ordered by calling this tool; the price is confirmed by email before any work. Use when the user asks what it would cost to have these PDFs made accessible.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": false,
                "description": "When true, adds the page-by-page count for each file.",
                "type": "boolean"
              },
              "urls": {
                "description": "One to five links to PDFs on public websites: http or https, at most 2,048 characters each.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate the price to make public PDFs accessible"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a26f18843bd7b9ab4a0064d1edf9be397f4a60bbfc2fcd22971bfb9972d8ec6"
        }
      ],
      "digest": "sha256:501fdae422efb58285a05e46de849a8049835201e23d790220c2872ae9e007be"
    }
  }
}
