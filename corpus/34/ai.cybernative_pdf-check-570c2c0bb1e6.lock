{
  "lockfileVersion": 2,
  "subjects": {
    "ai.cybernative/pdf-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pdf-check.cybernative.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cybernative-public-pdf-check",
        "title": "CyberNative public PDF accessibility check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "check_public_pdf",
          "title": "Check a public PDF",
          "description": "Downloads one PDF from a public http or https link and reports the structure that screen readers use: whether the file is tagged, whether it has a document title and a language, how many images have no text description and on which pages, and reading-order signals (pages with columns are flagged for a person to check). Also reports the page count and which pages look scanned or contain tables. Use when the user gives a link to a PDF on a public website and asks about its accessibility or screen-reader structure. Does not open files behind a login, does not change the file, and does not say whether the file meets PDF/UA, WCAG or any law.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": false,
                "description": "When true, adds the page-by-page list.",
                "type": "boolean"
              },
              "url": {
                "description": "Link to one PDF on a public website: http or https, at most 2,048 characters.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a public PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:32a8dac3e5d0ae485ffad779735bf3a2de68fcfb67a188d4ffacf7c966799173"
        },
        {
          "name": "quote_fix",
          "title": "Estimate the price to make public PDFs accessible",
          "description": "For one to five links to PDFs on public websites, checks whether each file qualifies and returns a price estimate from CyberNative AI LLC's published Terms for the same PDF with tags added: USD 4 per page, minimum USD 100 per order. Names each file that does not qualify, such as a scanned file, a fillable form, a map or drawing, or a file over 35 pages, with the reason, and does not price it. The estimate is not binding and nothing is ordered by calling this tool; the price is confirmed by email before any work. Use when the user asks what it would cost to have these PDFs made accessible.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": false,
                "description": "When true, adds the page-by-page price for each file that qualifies.",
                "type": "boolean"
              },
              "urls": {
                "description": "One to five links to PDFs on public websites: http or https, at most 2,048 characters each.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate the price to make public PDFs accessible"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67f57247ad8ce524d6a7e9ded0da2eff595d4bf42c6117f825cd09633bd79cbf"
        }
      ],
      "digest": "sha256:fdfb7a43e3b70b829068287f9fb9cdc3de10f7a520a4eede96e4113d8e98e613"
    }
  }
}
