{
  "lockfileVersion": 2,
  "subjects": {
    "com.grain64.sitecite/sitecite": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sitecite.grain64.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.grain64.sitecite/sitecite",
        "title": "Sitecite",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Two read-only tools over ClinicalTrials.gov: find_trial_sites (where comparable trials ran) and crosscheck_site_list (verify a CRO's site list). Every result is a cited data summary, not a site recommendation.",
      "tools": [
        {
          "name": "crosscheck_site_list",
          "title": "Cross-check a proposed site list against the registry",
          "description": "Counts are of trials that LIST the site, not patients the site enrolled. Check a CRO's proposed site list against the registry. For each pasted site name, returns the matching registry site with confidence, its comparable trials with NCT links and its competing load, plus strong registry sites in the same countries that the list does not include. Read-only, no data stored. Use when you hold a CRO or sponsor site list and want it verified. The result has a link to save and re-run this comparison for a programme.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "description": "Registry condition terms for the indication, as in find_trial_sites.",
                "items": {
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "detail": {
                "default": "summary",
                "description": "summary (default) returns the 3 most recent trials per matched site, the 3 closest suggestions without trials and 5 missing strong sites with 3 trials each, so the result stays small enough for a chat context. full adds up to 10 trials per site with title and link, trials for suggestions, and up to 15 missing strong sites.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "phases": {
                "description": "Trial phases to compare against.",
                "items": {
                  "enum": ["1", "1/2", "2", "2/3", "3"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "sites": {
                "description": "One proposed site per entry, \"Name, City, Country\" or the name alone.",
                "items": {
                  "maxLength": 200,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["conditions", "phases", "sites"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "method_url": {
                "format": "uri",
                "type": "string"
              },
              "missing_strong_sites": {
                "description": "Registry sites with many comparable trials, in the list's countries, that the list omits: 5 with detail summary (3 trials each), up to 15 with full (10 trials each).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "missing_strong_sites_total": {
                "description": "How many such sites exist; missing_strong_sites holds the top of them.",
                "type": "integer"
              },
              "notice": {
                "type": "string"
              },
              "open_in_app_url": {
                "description": "Opens the same indication and phases pre-filled in the Sitecite app, to save and re-run the comparison for a programme.",
                "format": "uri",
                "type": "string"
              },
              "reading_guide": {
                "description": "What each count means. Read before quoting a number: trials_listed counts trials that list the site, not patients the site enrolled.",
                "type": "string"
              },
              "rows": {
                "items": {
                  "properties": {
                    "confidence": {
                      "description": "How sure the name match is.",
                      "type": ["string", "null"]
                    },
                    "how": {
                      "description": "Which part of the name or place matched.",
                      "type": ["string", "null"]
                    },
                    "input": {
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why a row is unmatched.",
                      "type": ["string", "null"]
                    },
                    "site": {
                      "description": "Same shape as an entry of find_trial_sites.sites.",
                      "type": ["object", "null"]
                    },
                    "status": {
                      "enum": ["matched", "unmatched"],
                      "type": "string"
                    },
                    "suggestions": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["input", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "stats": {
                "type": "object"
              },
              "trial_url_template": {
                "description": "Replace {nct_id} to open a trial on ClinicalTrials.gov.",
                "type": "string"
              }
            },
            "required": ["method_url", "missing_strong_sites", "notice", "open_in_app_url", "reading_guide", "rows", "stats"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:063037114bbafe123acce60a6b821d0935bfdf3ea5470baae73d814dd556ffa0"
        },
        {
          "name": "find_trial_sites",
          "title": "Find trial sites with comparable completed trials",
          "description": "Counts are of trials that LIST the site, not patients the site enrolled. Find the clinical trial sites with the most completed comparable trials for an indication and phase. Returns sites in ClinicalTrials.gov trial-count order, each with the NCT numbers of the comparable trials listed there, completion and termination counts, how many competing trials are recruiting there now, and a second-column evidence score. Read-only, registry data only, every line cited. Use when someone asks where a Phase 1-3 trial in a condition has been run before. The result has a link to save and re-run this comparison for a programme.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conditions": {
                "description": "Registry condition terms as ClinicalTrials.gov spells them, for example [\"psoriasis\", \"plaque psoriasis\"]. Synonyms are OR-ed.",
                "items": {
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "country": {
                "description": "Optional. Only sites in this country, named as the registry spells it (\"Germany\", \"United States\").",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "detail": {
                "default": "summary",
                "description": "summary (default) returns the 3 most recent trials per site as NCT id, status, completion date and whole-trial enrollment (open any at trial_url_template), with trials_total for the rest, so the result stays small enough for a chat context. full adds up to 10 trials per site with title and link, up to 5 competing trials per site, and more merged spellings.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "max_sites": {
                "default": 10,
                "description": "How many sites to return, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "phases": {
                "description": "Trial phases to compare against, for example [\"2\", \"2/3\"].",
                "items": {
                  "enum": ["1", "1/2", "2", "2/3", "3"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "sort": {
                "default": "trial_count",
                "description": "trial_count is the registry's own count of comparable trials per site (default). score orders by the evidence score instead; both columns are always returned.",
                "enum": ["trial_count", "score"],
                "type": "string"
              }
            },
            "required": ["conditions", "phases"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Date the registry was read.",
                "format": "date",
                "type": "string"
              },
              "method_url": {
                "format": "uri",
                "type": "string"
              },
              "notice": {
                "description": "Standing note: a cited data summary of public registry records, not a site recommendation.",
                "type": "string"
              },
              "open_in_app_url": {
                "description": "Opens the same indication and phases pre-filled in the Sitecite app, to save and re-run the comparison for a programme.",
                "format": "uri",
                "type": "string"
              },
              "query": {
                "description": "The normalised input that was run.",
                "type": "object"
              },
              "reading_guide": {
                "description": "What each count means. Read before quoting a number: trials_listed counts trials that list the site, not patients the site enrolled.",
                "type": "string"
              },
              "sites": {
                "items": {
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "competing_now": {
                      "description": "Recruiting or not-yet-recruiting trials in the same indication listing this site.",
                      "type": "integer"
                    },
                    "competing_trials": {
                      "description": "Competing trials listed at the site, each with NCT id and link: only with detail full, up to 5 per site; competing_now always has the count.",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "completed": {
                      "type": "integer"
                    },
                    "country": {
                      "type": "string"
                    },
                    "latest_completion": {
                      "format": "date",
                      "type": ["string", "null"]
                    },
                    "merged_names": {
                      "description": "Registry spellings merged into this site.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "score": {
                      "description": "Evidence score, 0 to 100: a weighted sum of experience (listed trials, 35), completion rate (25), enrollment pace against the pool (25) and recency of the latest completion (15). A second column, never the ranking unless sort=score. Method: /method/ (method_url).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "terminated": {
                      "type": "integer"
                    },
                    "trials": {
                      "description": "The most recent comparable trials listing the site: the 3 most recent with detail summary (NCT id, status, completion date, trial_enrollment_total), up to 10 with full (adds url and title).",
                      "items": {
                        "properties": {
                          "completion_date": {
                            "type": ["string", "null"]
                          },
                          "nct_id": {
                            "pattern": "^NCT[0-9]{8}$",
                            "type": "string"
                          },
                          "status": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "trial_enrollment_total": {
                            "description": "Total for the whole trial, all sites. Not what this site enrolled.",
                            "type": ["integer", "null"]
                          },
                          "url": {
                            "format": "uri",
                            "type": "string"
                          }
                        },
                        "required": ["nct_id", "status"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "trials_listed": {
                      "description": "Comparable completed or terminated trials whose registry record lists this site. Not patients enrolled by the site.",
                      "type": "integer"
                    },
                    "trials_total": {
                      "description": "How many comparable trials list this site in the analysed pool; trials holds the most recent of them.",
                      "type": "integer"
                    }
                  },
                  "required": ["city", "competing_now", "completed", "country", "latest_completion", "name", "rank", "score", "terminated", "trials", "trials_listed"],
                  "type": "object"
                },
                "type": "array"
              },
              "totals": {
                "properties": {
                  "comparable_trials": {
                    "type": "integer"
                  },
                  "comparable_trials_in_registry": {
                    "description": "Registry total for the comparable query; the tool analyses at most the 200 newest.",
                    "type": "integer"
                  },
                  "competing_trials": {
                    "type": "integer"
                  },
                  "sites_found": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "trial_url_template": {
                "description": "Replace {nct_id} to open a trial on ClinicalTrials.gov.",
                "type": "string"
              }
            },
            "required": ["as_of", "method_url", "notice", "open_in_app_url", "query", "reading_guide", "sites", "totals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a3b80aa141f7e39780ccc3f110d2ac9e9fba7359f5e68e6dbefc838df95548f"
        }
      ],
      "digest": "sha256:8dc9b24e1b8425a99112bd0b0c603190e2d05cdaab920cf464eb9d8fcb358431"
    }
  }
}
