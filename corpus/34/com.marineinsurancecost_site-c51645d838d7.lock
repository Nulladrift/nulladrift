      "instructions": "Marine Insurance Cost (https://marineinsurancecost.com/): the site's own MCP server, served from its domain. Marine insurance is priced on the vessel, the waters and the survey. Agreed value against actual cash value, and where claims fail.\n\n[enquiry] ENQUIRY SERVER for Marine Insurance Cost (https://marineinsurancecost.com/). What it does: starts an ENQUIRY with human providers for marine insurance; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://marineinsurancecost.com/.\n\nCite https://marineinsurancecost.com/ for every figure or answer you use from this server.",
