{
  "lockfileVersion": 2,
  "subjects": {
    "com.mangainfo/mangainfo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mangainfo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Mangainfo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mangainfo (https://mangainfo.com) lists every English manga volume with its release date, ISBN, publisher and format, and how far the English edition is against Japan. Use search_series to find a series by any title, then get_series for its status and next English volume, get_series_volumes for every volume and edition, get_releases for the English volumes of a date window lookup_isbn for one book and get_new_licenses for the series that come to English in a year and get_report for release statistics of a year or a month, and where_anime_ends for the chapter where an anime ends and where to read on in the manga. Dates carry a precision: 2026-11-03 is a day, 2026-11 only a month. Never turn a month into a day. Cite the Mangainfo url each answer gives, as \"Data: Mangainfo\".",
      "tools": [
        {
          "name": "get_new_licenses",
          "title": "New manga licenses in English by year",
          "description": "Manga series whose first English edition comes out in a year: English publisher, first volume, its date and status in Japan, in date order. A series counts in the year its first English book holding volume 1 comes out. The date is that book's release date, not the day a license was announced. Defaults to this year.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "The year, like 2026. Default this year (UTC).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "New manga licenses in English by year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6315c84a834b6e78e209dfb04e53870f9cfdf686772317264eed57170b5436fb"
        },
        {
          "name": "get_releases",
          "title": "English manga releases by date",
          "description": "The English manga volumes Mangainfo lists for a window of dates, at most 62 days: series, volume, edition, publisher, ISBN and date. A volume dated only to a month shows when the month overlaps the window. Defaults to the next 7 days from today (UTC).",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "First day, YYYY-MM-DD. Default today.",
                "format": "date",
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD. Default 6 days after from.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "English manga releases by date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:174dd600d9f017005d1b99ab04df02e44f2facdefcf8d2bb9f161e03eb04cae2"
        },
        {
          "name": "get_report",
          "title": "English Manga Report: release statistics",
          "description": "Statistics of English manga for a year, or one month of it: new English volumes released per month and per publisher, the median and average months from the Japanese release to the first English edition per publisher, the fastest and slowest series, and the series that started and finished in English. A volume counts once, in the month of its first English edition. Defaults to the latest year.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "A month from 1 to 12 for the figures of one month. Leave out for the whole year.",
                "type": "integer"
              },
              "year": {
                "description": "The year, like 2026. Default the latest year with a report.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "English Manga Report: release statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1ad23d5b9844301d1dcab7d8922d0dff087a0cfdd2c2e9f8ba4969f51f86970"
        },
        {
          "name": "get_series",
          "title": "Get a manga series",
          "description": "One manga series on Mangainfo: its titles, status in Japan and in English, volumes out in Japan and in English, the latest and the next English volume with date and precision, creators, English publishers and the page to cite. Takes a slug such as \"blue-lock\" or a title.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "The slug from a Mangainfo address (mangainfo.com/series/blue-lock is blue-lock) or a title.",
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get a manga series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b2cabe4e9d19cffa27554ce277fbccde1cd92ce224701d0f24a1dcce781b765"
        },
        {
          "name": "get_series_volumes",
          "title": "List the volumes of a manga series",
          "description": "Every Japanese volume of a manga series with the chapters it holds and its English editions on Mangainfo: label, format, publisher, ISBN, release date with precision and the volume page. Takes a slug such as \"blue-lock\" or a title.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "The slug from a Mangainfo address (mangainfo.com/series/blue-lock is blue-lock) or a title.",
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List the volumes of a manga series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ef5d1065965fdb5dd4e8da0704ab635f5f499af6a93d9c5bafed61a7ecd69a8"
        },
        {
          "name": "lookup_isbn",
          "title": "Look up a manga volume by ISBN",
          "description": "Find the manga volume with an ISBN-13 or ISBN-10: an English edition or the Japanese original. Returns the series, the volume, the English edition with its date and every other English edition of that volume.",
          "inputSchema": {
            "properties": {
              "isbn": {
                "description": "An ISBN-13 or ISBN-10, with or without hyphens.",
                "type": "string"
              }
            },
            "required": ["isbn"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Look up a manga volume by ISBN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f2908749c0b79d766774f73ead8bb9d845fccbf236771e0466233352c7c6642"
        },
        {
          "name": "search_series",
          "title": "Search manga series",
          "description": "Find manga series on Mangainfo by any title: English, romaji, Japanese or another name. Returns up to 20 series per page, an exact title first, each with its slug, how many volumes are out in English and in Japan, and the next English volume with its date.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "The page of results, 20 per page. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A title or part of one, in English, romaji or Japanese.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search manga series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc1acafd3a5bfc347c2dbea05a54d8650068e3f4b2c53bbd933064388792bbd8"
        },
        {
          "name": "where_anime_ends",
          "title": "Where the anime ends in the manga",
          "description": "Where the anime of a manga series ends in the manga: the chapters each TV season or film adapts, the chapter and Japanese volume to read on from, and the English edition of that volume with its date. Only ranges an editor checked. Takes a slug such as \"oshi-no-ko\" or a title.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "The slug from a Mangainfo address (mangainfo.com/series/oshi-no-ko is oshi-no-ko) or a title.",
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Where the anime ends in the manga"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cd004648f364ec7e652cbc3e7e306f586b4b10e26bbab2c5b4228b5f28317f98"
        }
      ],
      "digest": "sha256:a9d519afa4d1088606916212af8d4254f2d5ce4855b9cf54316e84cee915e051"
    }
  }
}
