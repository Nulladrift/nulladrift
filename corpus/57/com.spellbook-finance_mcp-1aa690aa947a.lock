        {
          "name": "spellbook_ath_observations",
          "description": "Read retained Magic card-level high-price detector observations for seven explicit UTC dates and one finish. Use it for which Magic cards hit an all-time high this week. Returns reported USD values, percent-unit changes, catalog-checked Magic labels, publication dates, missing days and coverage limits. Defaults to seven dates ending today and regular finish. Stored ATH state is per oracleId and finish; the reported printing label does not establish which printing supplied the historical price. Read guideResourceUri through MCP for metric, date and identity interpretation. Observations are not independently verified market-wide lifetime highs or trade recommendations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "endDate": {
                "description": "Last inclusive UTC date, YYYY-MM-DD. Omit for today. Exactly six earlier dates are also requested; missing dates stay missing.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "priceType": {
                "default": "regular",
                "description": "Requested finish. Defaults to regular (nonfoil); foil is a separate read.",
                "enum": ["regular", "foil"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read Magic ATH observations for seven dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:838e542c95e43de8b5b725958009bb1d28d16fb7bbd69e18ceda0f5b022e045b"
        },
        {
          "name": "spellbook_below_floor_discovery_get",
          "description": "Read a bounded below-floor discovery summary or one section page with member stages, scheduled minimums, canonical pricing targets, observed asks and source freshness, admission-selection facts, sales facts, and restoration status. Call it to inspect a seller workspace's configured discovery lane or follow a returned cursor. Member admissionSelection explains the factual automatic or manual choice already saved; this tool does not return a ranked recommendation queue. Observed asks are sampled listings, not continuous exposure or evidence of demand; scheduled minimum, canonical target, observed ask, and sold item price are separate facts. Use spellbook_below_floor_discovery_set with dryRun true to preview a requested change, then read this tool again after an apply.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Restrict the read to one marketplace channel. Only combinations supported by the selected game are accepted.",
                "enum": ["tcg", "manapool"],
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "cursor": {
                "description": "Opaque nextCursor from the same section and workspace. Pass it unchanged to continue.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "game": {
                "description": "Restrict the read to one game. Only combinations supported by the seller lane are accepted.",
                "enum": ["mtg", "riftbound", "pokemon"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum rows returned on this page, within the bounded API page size.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "section": {
                "default": "summary",
                "description": "The bounded response section. Start with summary; use a named section to inspect members and pass its nextCursor to continue.",
                "enum": ["summary", "members", "waiting", "exhausted"],
                "type": "string"
              },
              "workspaceId": {
