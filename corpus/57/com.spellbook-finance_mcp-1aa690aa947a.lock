          },
          "meta": {
            "spellbook.finance/app-page": {
              "title": "Browse sealed deals",
              "url": "https://spellbook-finance.com/sealed-deals"
            }
          },
          "digest": "sha256:c47e3a9af976827b761b968b93913796ad7799177d97b9f653e0f6d51dc2d66a"
        },
