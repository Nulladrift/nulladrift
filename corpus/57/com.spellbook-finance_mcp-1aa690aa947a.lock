              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "fillWindowCents": {
                "description": "Whole cents.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "maxDrawUsd": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
