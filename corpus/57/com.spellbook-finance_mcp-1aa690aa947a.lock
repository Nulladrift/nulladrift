      "instructions": "SpellBook Finance gives an agent market facts and seller tools for Magic and Pokémon cards, plus one customer's own seller workspace. It is not a fintech, a bank, or a DeFi protocol. It never buys, holds money, or ships anything. Read a task's procedure with spellbook_skill before its first step: getting-started when a customer is new, buy-loop before advising a buy, collection-buying before work on any Pokémon lot or collection, physical-placement before a bin move, fulfilling-orders when an order arrives. Read spellbook_guides before answering a how-do-I question about selling, pricing, or marketplace onboarding. Name an exact printing with spellbook_printings_search before recording a card or forming a price. Marketplace write tools can publish or change listings. Follow destructive annotations and each tool's required preview or dry run. A queued job or exported file is not a confirmed live listing. Before advising a buy, record the thesis with spellbook_customer_evidence_record as a consideration, because spellbook_buy_outcome_report scores only those records. After cards or sealed product arrive, record them with spellbook_inventory_bin_ensure, spellbook_inventory_import_csv for a ManaBox or TCGplayer export, or spellbook_sealed_portfolio_record, then read it back with spellbook_inventory_holdings or spellbook_sealed_portfolio. Record a sale made outside SpellBook with spellbook_sale_record so holdings and the outcome report stop counting those copies. Sign-in with a new email creates a SpellBook account. A signed-in seller with no workspace gets one from spellbook_workspace_create. The agent drives marketplace connection: read the status, hand over the connect link (spellbook_manapool_connect_link for ManaPool), name the one step the person takes there, then read the status again. A missing ManaPool or eBay seller account is a step on that path, never a stop. Reach a person at https://discord.gg/BbbepYdsJ2 or support@spellbook-finance.com.",
      "tools": [
        {
          "name": "spellbook_agent_gap_report",
          "description": "After finishing the task, ask the person whether they consent to send one bounded capability-gap report to SpellBook. Call this tool only after an explicit yes for this report and set consentToShare to true. Use it when a needed field was null, you guessed a number because no tool supplied it, you wished a tool existed, or you abandoned a path. It returns no task data and fixes nothing. Generate a fresh ULID submissionId and reuse the exact request for retries within 24 hours. Field paths must be real SpellBook response paths. There is no free-text field: never describe the card, price, customer, or conversation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "abandonReason": {
                "description": "Why the task was abandoned. Required only when outcome is abandoned.",
                "enum": ["field_was_null", "data_too_stale", "no_matching_rows", "identity_ambiguous", "access_denied", "tool_error", "no_such_capability", "too_many_steps", "other"],
                "type": "string"
              },
              "consentToShare": {
                "const": true,
                "description": "True only after the person explicitly agreed to send this specific report.",
                "type": "boolean"
              },
              "guessedFields": {
                "description": "Real SpellBook response field paths the agent had to guess a value for because no tool supplied one. Omit when nothing was guessed.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "neededFields": {
                "description": "Real SpellBook response field paths that were null or missing when needed. Omit or send empty when none applied.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "occurredAt": {
                "description": "ISO-8601 timestamp of when the gap occurred. Required.",
                "format": "date-time",
                "maxLength": 30,
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                "type": "string"
              },
              "outcome": {
                "description": "What happened to the task: closed enum. Required.",
                "enum": ["completed", "completed_with_guess", "abandoned"],
                "type": "string"
              },
              "submissionId": {
                "description": "A fresh ULID for this report. Reuse the exact same value and request body to retry within 24 hours; a new value starts a new report.",
                "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$",
                "type": "string"
              },
              "taskCategory": {
                "description": "Which closed task category this gap happened in. Required.",
                "enum": ["valuation", "sell_decision", "portfolio_review", "acquisition", "inventory_placement", "other"],
                "type": "string"
              },
              "wishedCapability": {
                "additionalProperties": false,
                "description": "A capability the agent wished existed and did not find. Omit when no capability was missing.",
                "properties": {
                  "category": {
                    "description": "Which closed capability category was wished for. Required when wishedCapability is present.",
                    "enum": ["data_field", "filter_or_sort", "freshness", "coverage", "export", "write_action", "other"],
                    "type": "string"
                  },
                  "slug": {
                    "description": "A lowercase, underscore slug from the fixed capability vocabulary naming what was wished for.",
                    "pattern": "^[a-z_]{3,40}$",
                    "type": "string"
                  }
                },
                "required": ["category", "slug"],
                "type": "object"
              }
            },
            "required": ["consentToShare", "neededFields", "occurredAt", "outcome", "submissionId", "taskCategory"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report an agent gap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7ef475919e6647ff096c4619e0e5cd11c17dee28c2a07520567bb22f087864f5"
        },
