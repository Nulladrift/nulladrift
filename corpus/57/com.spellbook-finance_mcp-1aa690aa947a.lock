                "type": "string"
              },
              "dryRun": {
                "description": "true previews and saves nothing. false saves. Required.",
                "type": "boolean"
              },
              "previewFingerprint": {
                "description": "Optional and ignored. Older clients sent the previewFingerprint from a dry run here.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "priceBands": {
                "additionalProperties": {
                  "items": {
                    "additionalProperties": false,
                    "properties": {
                      "maxUsd": {
                        "anyOf": [
                          {
                            "exclusiveMinimum": 0,
                            "maximum": 1000000,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "minUsd": {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["maxUsd", "minUsd"],
                    "type": "object"
                  },
                  "maxItems": 10,
                  "type": "array"
                },
                "description": "Bands per game id, such as mtg, pokemon, or riftbound. Each band is {minUsd, maxUsd} in USD of market price, with maxUsd null for no upper limit. A copy stays when its market price is at or above minUsd and below maxUsd. A game with an empty list, or absent, has no restriction. This replaces every saved band, so send every game that should keep one. Required.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
