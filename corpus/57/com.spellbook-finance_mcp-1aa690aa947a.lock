        },
        {
          "name": "spellbook_card_prices",
          "description": "Read every price source SpellBook Finance holds for ONE printing, one row per source, each with its own label, price and timestamp. Sources can include TCGplayer Market, TCGplayer Low, Card Kingdom retail and buylist, CoolStuff, an eBay 90-day sold median, Cardmarket, ManaPool and CardTrader. Pokemon TCGplayer finish subtypes stay in separate rows. cardId is the exact printing id returned by spellbook_printings_search: a UUID for Magic, or a catalog product id for Riftbound or Pokemon. Rows come back in source order with their own timestamps; nothing is averaged, ranked, or chosen for you, and no listing link is returned. For Market-versus-dealer interpretation, find a guide with spellbook_guides topic buylist-and-exits. EUR rows include the conversion rate and its recorded date/source when available. Read the returned guideResourceUri for currency and source-metric context; MCP resource retrieval is an alternative if guideUrl cannot be fetched. It is discoverable with spellbook_guides topic pricing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cardId": {
                "description": "The exact printing id from spellbook_printings_search: a UUID for Magic, or the namespaced catalog product id for Riftbound or Pokemon. Required.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "finish": {
                "description": "Which finish of a Magic printing to price. Omit for nonfoil. Pass foil or etched when the copy in question is foil or etched, because a foil copy often sells at a different price. Riftbound and Pokemon ignore it and return every finish as its own rows.",
                "enum": ["nonfoil", "foil", "etched"],
                "type": "string"
              }
            },
            "required": ["cardId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read one card's prices"
          },
          "behavior": {
