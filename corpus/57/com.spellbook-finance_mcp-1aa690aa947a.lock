              },
              "marketplace": {
                "description": "Where the order was placed. Required. Use other for any marketplace not listed.",
                "enum": ["tcgplayer", "ebay", "manapool", "cardtrader", "other"],
                "type": "string"
              },
              "orderRef": {
                "description": "The marketplace's order number from the checkout confirmation. Required. The same order number groups every copy for receiving.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "rows": {
                "description": "The order's lines, one per exact printing, condition and finish. Required, at least one.",
