        {
          "name": "spellbook_japanese_sourcing",
          "description": "Read Japanese-market supply offers for the Japanese promo cohort from Mercari, Hareruya and Bigweb, each beside the comparison prices SpellBook holds on TCGplayer, ManaPool and eBay. Every row carries one exact supply offer with its printing identity, the merchant's own condition grade and its normalized equivalent, the native unit price with its currency, quantity, availability, and its own observedAt and staleAfter stamps; then every comparison reference with its kind and typed comparisonBasis, a deterministic selectedReference with the selectionRule that chose it, and a providerStatus row for each comparison source explaining why it is ok, missing, stale, failed or incompatible. grossDifferenceUsd is an asking spread and is null unless printing, language, finish, unit basis and condition equivalence all hold; netDifferenceUsd stays null because this read carries no costs. Rows come back in source order, and nothing is ranked, scored or recommended for you.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "buySources": {
                "description": "Which Japanese supply sources to read. Omit for all three. Narrow it only when the person named a merchant; a source you drop is simply absent, never proven empty.",
                "items": {
                  "enum": ["mercari", "hareruya", "bigweb"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "comparisonSources": {
                "description": "Which comparison price sources to attach to each offer. Omit for all three. Each requested source returns a providerStatus row even when it has no reference.",
                "items": {
                  "enum": ["tcgplayer", "manapool", "ebay"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "cursor": {
                "description": "The opaque nextCursor from the previous page, passed back unchanged. It is signed by the server; never construct, decode or edit one.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "includeStale": {
                "description": "True also returns offers whose staleAfter has already passed, with their stamps intact. Default false returns only offers still inside their freshness window.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum offers in this page. Page with cursor to traverse the rest; a short page is not proof the cohort ended.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
