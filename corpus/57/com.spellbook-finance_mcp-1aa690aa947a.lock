                "enum": ["mtg", "riftbound", "pokemon", "yugioh"],
                "type": "string"
              },
              "idempotencyKey": {
                "description": "A unique request key for this publish attempt, such as a new UUID. If the result is uncertain, preview current state before deciding on another submit. Required.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "kind": {
                "description": "The sealed kind, the kind on the same spellbook_sealed_portfolio row. Required, because units are counted by kind and boxId together.",
                "enum": ["box", "pack", "case"],
                "type": "string"
              },
              "language": {
                "default": "EN",
                "description": "The product language code, such as EN or JA. Defaults to EN.",
                "maxLength": 8,
                "minLength": 2,
                "type": "string"
              },
              "priceRule": {
                "description": "market asks the catalog market price. undercut sets the ask so the item plus the seller's own shipping lands one cent under the cheapest TCGplayer item plus shipping from another seller, never below the floor. Omit for market.",
                "enum": ["market", "undercut"],
                "type": "string"
              },
              "takeover": {
                "default": false,
                "description": "True adopts a listing on the selected marketplace that SpellBook did not create. Defaults to false; pass true only after the person agrees.",
