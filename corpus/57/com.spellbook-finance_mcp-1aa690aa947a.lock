        {
          "name": "spellbook_ebay_publish",
          "description": "Publish owned copies from one workspace as live eBay listings, priced by a stated rule. Pass itemIds to publish one exact card. ALWAYS call it once with dryRun true and show the person the counts and the preflight before calling it again with dryRun false, because a live run creates real listings a real buyer can buy. Pricing anchors on market price, never on what the seller paid: multiplier 0.96 lists at 96% of market, and floorUsd only ever raises a price. A live run returns a queued jobId, or the reason nothing published. A queued job has listed nothing yet, so call spellbook_ebay_job_status with that jobId before telling the person any card is live.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "batchSize": {
                "description": "Maximum copies to submit in this call. Omit for the default batch size.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "binId": {
                "description": "Restrict publishing to one exact bin. Omit to consider every owned copy.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "True previews the run with no live listings created. False publishes for real. Defaults to true; a live run needs an explicit false.",
                "type": "boolean"
              },
              "floorUsd": {
                "description": "A price floor in USD that only ever raises a computed price. Omit for no floor.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "itemIds": {
                "description": "Restrict publishing to these exact Item ids, from a prior spellbook_inventory_items_query. Pass one id to list one card. The owned-only rule still applies to each id. Omit to consider every owned copy.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "multiplier": {
                "description": "Price multiplier applied to each copy's market price, e.g. 0.96 lists at 96% of market. Required.",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "setCodes": {
                "description": "Restrict publishing to these set codes. Omit to consider every set.",
                "items": {
                  "maxLength": 20,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
