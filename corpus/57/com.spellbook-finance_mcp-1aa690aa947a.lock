                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "expectedIntentRevision": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "intentRevision from the preview. Pass it unchanged, null included."
