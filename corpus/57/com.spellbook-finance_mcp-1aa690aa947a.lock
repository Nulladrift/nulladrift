        {
          "name": "spellbook_inventory_incoming_receive",
          "description": "Mark every pending copy in the named orders or precon imports as received, which makes them owned inventory that can be listed and sold. Returns how many copies were received, their total cost and the bins they belong in. Call it when the customer says the package arrived and they counted the cards. Read spellbook_inventory_incoming first to get each acquisitionSource.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acquisitionSources": {
                "description": "The acquisitionSource of each order or import to receive, exactly as spellbook_inventory_incoming or spellbook_purchase_incoming_record returned it. Required, at least one.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
