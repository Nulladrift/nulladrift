                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum rows to return, 1 to 500. Omit for the default of 100.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "workspaceId": {
                "description": "The workspace to read holdings for. Required.",
