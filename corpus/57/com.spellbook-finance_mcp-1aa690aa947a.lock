                "pattern": "^\\d{1,12}$",
                "type": "string"
              },
              "cap": {
                "description": "The most units to offer at once. Omit to offer every eligible unit.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "channel": {
                "default": "manapool",
                "description": "Marketplace to submit to. Must match the preview. Defaults to manapool.",
