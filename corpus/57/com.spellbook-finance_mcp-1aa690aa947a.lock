                    }
                  },
                  "required": ["cardName", "collectorNumber", "condition", "finish", "quantity", "scryfallId", "setCode", "unitPriceUsd"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "sellerName": {
                "description": "The seller's store name on the marketplace, when the checkout shows one. Shown beside the order in the incoming list.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "workspaceId": {
                "description": "The workspace that bought the cards, from spellbook_workspaces_list. Required; writes only to this workspace.",
                "maxLength": 100,
                "minLength": 1,
