                  "additionalProperties": false,
                  "properties": {
                    "cardName": {
                      "description": "The card's name. Required.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "collectorNumber": {
                      "description": "The collector number of this exact printing. Required.",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    },
                    "condition": {
                      "description": "The condition the listing was sold as. Required.",
                      "enum": ["NM", "LP", "MP", "HP", "DMG"],
                      "type": "string"
                    },
                    "finish": {
                      "description": "The finish of these copies, using the values listed in this field. Required.",
                      "enum": ["nf", "fo", "etched", "surge", "rh", "1e", "1e-fo"],
                      "type": "string"
                    },
                    "quantity": {
                      "description": "How many copies of this printing, condition and finish the order bought. Required, at least 1.",
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "scryfallId": {
                      "description": "The exact printing id, from spellbook_printings_search. Required; a wrong id records the wrong card.",
