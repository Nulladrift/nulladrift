        {
          "name": "spellbook_screener",
          "description": "Screen Magic card printings by recorded US sales activity, native Cardmarket EUR, regular or foil price, foil/nonfoil premium, consecutive weekly price gains, price change and 20 day band statistics in one call. For unusually high foil premiums, use mode=both and sort=premium with a declared regular-price floor. Premium sorts the dimensionless foilPrice/price multiple; the response retains both USD inputs. Read the matching foil-premium guide via spellbook_guides topic pricing and its returned resource URI for identity and interpretation limits. Some snapshots also carry optional printingCount, lastPrintedAt and reserved facts; absent fields stay unknown. For reprint interpretation, use spellbook_guides topic reprint-risk and read the returned resource URI; these facts supply no calibrated set-risk ranking. Each row carries reported printing identity (scryfallId, name, setCode, rarity), price, and change7d, change30d and change90d in percent. Its band fields: ma20 is the mean of the last 20 daily closes. bbPos is where today's close sits inside the 20 day Bollinger band, 0 at the lower band and 100 at the upper, and below 0 or above 100 outside it. bbWidth is the band's width as a percent of ma20. z20 is today's close minus ma20, in 20 day standard deviations. squeeze and squeezeRecent say whether the Bollinger band sat inside the Keltner channel today, or on any of the last 5 days. flatDays counts the days since the price last changed. swing30d is the typical 30 day move: the median absolute 30 day change, in percent, over the last 90 daily closes. Call it to answer \"which cards sit near the bottom of their recent range\", \"which cards fell this month inside a 90 day rise\", \"which cards moved far past their usual size this month\" or \"which prices have gone quiet\", then call spellbook_card_prices for one printing's per-source prices. Rows come back in the sort the caller names. Nothing is scored, labeled or chosen for you.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "band_pos_max": {
                "description": "Highest bbPos a row may have. 100 is the upper band. Pass a low value such as 10 to keep cards near the bottom of their range. Omit for no ceiling.",
                "type": "number"
              },
              "band_pos_min": {
                "description": "Lowest bbPos a row may have. 0 is the lower band. Once any band or z-score bound is set, rows with a null bbPos are dropped. Omit for no floor.",
                "type": "number"
              },
              "band_width_max": {
                "description": "Widest bbWidth a row may have, in percent of ma20. A small value keeps cards whose price barely moved. Omit for no ceiling.",
                "minimum": 0,
                "type": "number"
              },
              "change30d_max": {
                "description": "Highest 30 day change a row may have, in percent. Pass a negative number to keep cards that fell. Rows with no 30 day change are dropped. Omit for no ceiling.",
                "type": "number"
              },
              "change90d_min": {
                "description": "Lowest 90 day change a row may have, in percent. Pair a positive value with change30d_max to keep cards that fell this month inside a 90 day rise. Rows with no 90 day change are dropped. Omit for no floor.",
                "type": "number"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "flat_days_min": {
                "description": "Fewest days since the price last changed. Use it for flat prices, which carry no band position. Omit for no floor.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "has_cardmarket": {
                "description": "Keep rows with a positive native Cardmarket EUR quote for the selected finish.",
                "type": "boolean"
              },
              "max_price": {
                "description": "Highest current price in USD. Omit for no ceiling.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest current price in USD. Omit for the default, which is 1, or 5 once any band or z-score bound is set, because cheap printings sit flat for weeks.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_transactions_30d": {
                "description": "Minimum recorded transactions in that same captured sales window; drops missing captures.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_units_30d": {
                "description": "Minimum recorded units in complete three-day buckets within 30 days before capture; drops missing captures. Read observedDays and capture dates for partial coverage.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "default": "nonfoil",
                "description": "Price mode. nonfoil uses regular prices for the price floor and ceiling; foil uses foil prices; both requires positive regular and foil inputs and uses the regular price bounds. Band and change30d_max/change90d_min/move_ratio_min fields remain regular-price statistics in every mode.",
                "enum": ["nonfoil", "foil", "both"],
                "type": "string"
              },
              "move_ratio_min": {
                "description": "Lowest ratio of the absolute change30d to swing30d a row may have. Pass 4 to keep cards whose 30 day move is at least 4 times their typical 30 day move, up or down. Rows with no swing30d, a zero swing30d, or a price under $1 thirty days back are dropped. Omit for no floor.",
                "minimum": 0,
                "type": "number"
              },
              "page": {
                "description": "Page number, from 1. Read totalPages on the response before paging. Omit for the first page.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 25,
                "description": "Rows per page, 1 to 50. Defaults to 25.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "90d",
                "description": "Which change window the changePct or foilChangePct sort reads. Defaults to 90d. Band fields always use the last 20 daily closes.",
                "enum": ["7d", "30d", "90d"],
                "type": "string"
              },
              "recorded_sales_only": {
                "description": "Keep rows with measured units, including measured zero; excludes missing or stale captures.",
                "type": "boolean"
              },
              "rising_weeks_min": {
                "description": "Keep printings whose last N consecutive seven-calendar-day price comparisons were strictly positive, 1 to 12. Missing dates fail the filter. Uses foil closes in foil mode, regular closes otherwise. weeklyChanges/foilWeeklyChanges retain each percent change newest first; weeklyTrendThrough dates the endpoint. This is a past-price pattern, not a prediction or a sales trend.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "changePct",
                "description": "Which field orders the rows. risingWeeks counts consecutive positive weekly price comparisons for the selected finish, with missing first comparisons last. units30d, transactions30d and listedUnits use salesActivity (foilSalesActivity in foil mode); cardmarketEur uses native EUR for that finish. Both uses regular activity and EUR like its price bounds. Missing activity and EUR sort last. premium sorts foilPrice/price, a multiple, with missing or nonpositive inputs last. Use mode=both for that comparison. price and changePct always read regular prices; foilPrice and foilChangePct read foil prices. Both change sorts use period. swing30d reads the typical regular-price move and ignores period. Missing change or swing values come last. Defaults to changePct.",
                "enum": ["changePct", "price", "name", "swing30d", "foilPrice", "foilChangePct", "premium", "units30d", "transactions30d", "listedUnits", "cardmarketEur", "risingWeeks"],
                "type": "string"
              },
              "sort_dir": {
                "default": "desc",
                "description": "Sort direction for `sort`. Defaults to desc, largest first. Pass asc with changePct to list the biggest falls first.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "squeeze_recent": {
                "description": "Pass true to keep only rows whose Bollinger band sat inside the Keltner channel on any of the last 5 days. Omit to keep every row.",
                "type": "boolean"
              },
              "zscore_max": {
                "description": "Highest z20 a row may have. A negative value such as -1.5 keeps cards priced below their 20 day mean. Omit for no ceiling.",
                "type": "number"
              },
              "zscore_min": {
                "description": "Lowest z20 a row may have. Omit for no floor.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Screen card prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "spellbook.finance/app-page": {
              "title": "Screen card prices",
              "url": "https://spellbook-finance.com/screener"
            }
          },
          "digest": "sha256:4a6cfcac0d8a797be9be3360cb0e7fcb30b05a21a5033b4d03c17832cb4636ca"
        },
        {
          "name": "spellbook_sealed_deal_board",
          "description": "Read the Sealed Deal Board: sealed boxes and decks that third-party stores list, one row per product. Each row carries the store, productUrl, retailerPriceUsd, marketPrice (the product's TCGplayer market price, USD), anchorPriceUsd with anchorSource, tcgProductId, shippingPolicy and age stamps: firstSeenAt (the day the board first carried that product), firstSeenBasis, priceBeatenAt with priceBeatenFromUsd (the day its cheapest price fell at least 5% and at least $10 under its own trailing 30-day low), and recencyEventAt, the later of the two, so you can answer \"what is new since <date>\" without diffing the whole board. Filter by game and productType (for example booster_display); results come in pages of limit rows with nextCursor, which is null on the last page. A caller with no account, or without Investor access, gets the public preview the website shows: a few rows per currency with entitled false. A caller with Investor access gets the full board. Call spellbook_sealed_product_offers with a row's tcgProductId for every store's offer and the sold comparables. Rows arrive in the board's order. Compare retailerPriceUsd with marketPrice yourself; this returns facts and ranks nothing by recency or discount. Each TCGplayer product id carries tcgplayerBuyUrl, a short SpellBook Finance affiliate link to that TCGplayer page. Say it is an affiliate link when you share it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "cursor": {
                "description": "Opaque nextCursor from the previous page, passed back unchanged with the same game and productType. Omit to start from the first page.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "game": {
                "description": "Restrict rows to one game: mtg, riftbound or pokemon. Omit to include all games.",
                "enum": ["mtg", "riftbound", "pokemon", "yugioh"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum deal rows per page, 1 to 50. Omit for the default of 15.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "productType": {
                "description": "Restrict rows to one sealed product type, for example booster_display for a booster box or collector_box. Omit to include every type.",
                "enum": ["box_set", "booster_display", "collector_box", "commander_deck", "theme_deck", "planeswalker_deck", "starter_kit", "challenger_deck", "precon", "bundle", "prerelease_kit", "jumpstart", "secret_lair"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read the sealed deal board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
