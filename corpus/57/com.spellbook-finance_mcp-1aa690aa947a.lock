        {
          "name": "spellbook_inventory_import_csv",
          "description": "Import a seller's own ManaBox export or TCGplayer inventory export into one workspace, the same import the SpellBook Finance web app runs. The server parses the CSV, resolves each row to an exact printing, preserves mapped location labels or assigns fallback bins, and creates one inventory copy per card. TCGplayer Pokémon and Riftbound rows require the catalog's exact game, provider product identity, finish, condition, and language; incomplete or mismatched rows are skipped with a repair reason and never default to Magic, English, or nonfoil. Sending the identical CSV again returns the first result with duplicate true and creates nothing. Returns the importId, how many copies were written, the bins used, and every row it could not parse or skipped.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "binName": {
                "description": "A human name for that one bin, 1 to 48 letters, digits, spaces, dashes or underscores. Honored only when oneBinPerUpload is true. A name another import already holds is refused.",
                "maxLength": 48,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 _-]+$",
                "type": "string"
              },
              "binPrefix": {
                "description": "One capital letter that starts fallback bin codes for copies without a mapped location, e.g. C gives C0001, C0002. Defaults to C.",
                "pattern": "^[A-Z]$",
                "type": "string"
              },
              "blankLocation": {
                "description": "For a blank cell in a selected location column: generate assigns a fallback bin; error refuses the whole import before writing copies. Defaults to generate. Has no effect without a selected column.",
                "enum": ["generate", "error"],
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "csv": {
                "description": "The full CSV text, header row included, exactly as the export produced it. Required. At most 200,000 characters.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "locationColumn": {
                "anyOf": [
                  {
                    "enum": ["auto", "none"],
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Location column: auto detects a single common location or bin header, none ignores source locations, or a zero-based original CSV column index selects it explicitly. Defaults to auto. Multiple matching headers require an explicit choice."
              },
              "oneBinPerUpload": {
                "description": "True puts the whole file in one fresh bin instead of packing 200 cards per bin across the rolling sequence. Defaults to false. Refused when any imported row has a mapped location.",
                "type": "boolean"
              },
              "source": {
                "description": "Which export this is: manabox for a ManaBox CSV (needs Scryfall ID, Quantity, Condition and Foil columns), tcg for a TCGplayer seller inventory export (needs the TCGplayer Id column). Required.",
                "enum": ["manabox", "tcg"],
                "type": "string"
              },
              "totalCost": {
                "description": "What the seller paid for the whole file in USD, split equally across every copy. Omit when the seller has not stated it; omitting records zero cost.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "workspaceId": {
                "description": "The workspace to import into. Required; writes only to this workspace.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["csv", "source", "workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Import a ManaBox or TCGplayer CSV"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "spellbook.finance/app-page": {
              "title": "Manage inventory",
              "url": "https://spellbook-finance.com/inventory"
            }
          },
          "digest": "sha256:9d2890da9b92e83355d6e4854c56fc22a4ecbe678e871261ea6174f4105e84f8"
        },
        {
          "name": "spellbook_inventory_incoming",
          "description": "Read what a workspace has bought or saved that has not arrived yet, one group per marketplace order or precon deck import. Each group carries its acquisitionSource, a readable title, the copy and card counts, the total cost, the date it was recorded and the bins its copies are assigned to. Call this to answer what is still on the way, or to find the acquisitionSource to receive. It reports pending groups; it does not track a package or say when one will arrive.",
