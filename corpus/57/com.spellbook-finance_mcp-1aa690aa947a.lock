        {
          "name": "spellbook_below_floor_discovery_set",
          "description": "Preview or apply an owner-requested below-floor discovery settings, printing membership, or off change. The default dry run returns exact entering, exiting and rejected rows plus the settings-only restoration effect. Call dryRun true first. If the owner asked only for a preview, stop there. If the owner explicitly authorized saving and the preview matches the requested change, apply with dryRun false and the same opaque expectedRevisionToken, previewId and change without asking for approval again. If apply returns stale, read spellbook_below_floor_discovery_get and request a new preview; never apply a refreshed selection automatically. Read the GET tool after a successful apply to confirm saved state and restoration status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "change": {
                "description": "Exact configuration, membership or off change to preview. Never substitute an unreviewed change during apply.",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "addPrintings": {
                        "default": [],
                        "description": "Exact printing identities to add; every identity is checked against the configured lane and admission guards.",
                        "items": {
                          "additionalProperties": false,
                          "description": "A printing identity to add to the selected configured lane.",
                          "properties": {
                            "finish": {
                              "description": "Exact supported finish for the game.",
                              "enum": ["nf", "fo", "etched", "surge", "rh", "1e", "1e-fo"],
                              "type": "string"
                            },
                            "game": {
                              "description": "Game for this exact printing.",
                              "enum": ["mtg", "riftbound", "pokemon"],
                              "type": "string"
                            },
                            "printingId": {
                              "description": "Exact catalog printing identifier; case is significant.",
                              "maxLength": 200,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["finish", "game", "printingId"],
                          "type": "object"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "kind": {
                        "const": "configure",
                        "description": "Save discovery settings and optional exact printing membership changes.",
                        "type": "string"
                      },
                      "removePrintings": {
                        "default": [],
                        "description": "Exact printing identities to remove. The preview reports affected members and reasons.",
                        "items": {
                          "additionalProperties": false,
                          "description": "A printing identity to remove from the selected configured lane.",
                          "properties": {
                            "finish": {
                              "description": "Exact supported finish for the game.",
                              "enum": ["nf", "fo", "etched", "surge", "rh", "1e", "1e-fo"],
                              "type": "string"
                            },
                            "game": {
                              "description": "Game for this exact printing.",
                              "enum": ["mtg", "riftbound", "pokemon"],
                              "type": "string"
                            },
                            "printingId": {
                              "description": "Exact catalog printing identifier; case is significant.",
                              "maxLength": 200,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["finish", "game", "printingId"],
                          "type": "object"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "settings": {
                        "additionalProperties": false,
                        "description": "Complete saved settings for this discovery configuration.",
                        "properties": {
                          "idleDaysBeforeEntry": {
