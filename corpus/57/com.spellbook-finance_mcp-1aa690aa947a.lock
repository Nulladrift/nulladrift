        {
          "name": "spellbook_ebay_reprice",
          "description": "Preview or reprice existing live eBay listings in one seller workspace using owner-accepted saved rules or a market multiplier and optional floor. Read spellbook_agent_pricing_protection first. A workspace in saved_rules_only mode requires pricing saved_rules; the server uses its accepted rules. This is a one-run marketplace override: it changes current eBay asks, creates no listing, and saves no pricing profile or durable override. Preview first with the default dryRun true. A preview with itemIds returns its counts at once. Any other preview returns state planning and a jobId, so read its counts with spellbook_ebay_job_status. An explicit dryRun false queues an async reprice job. Read that job with spellbook_ebay_job_status until each affected listing reaches its terminal state.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acquisitionSource": {
                "description": "Restrict the run to one exact acquisition source. Omit for every live eBay listing in the workspace.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "binId": {
                "description": "Restrict the run to one exact inventory bin. Omit for every live eBay listing in the workspace.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "True previews the listings and counts with no marketplace change. False queues the reprice job. Defaults to true; applying requires explicit false.",
                "type": "boolean"
              },
              "floorUsd": {
                "description": "Optional minimum ask in USD. Existing backend floors and locks can still raise the resulting ask.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "itemIds": {
                "description": "Restrict the run to these exact listed Item ids from spellbook_inventory_items_query. Omit for every live eBay listing in the workspace.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "multiplier": {
                "description": "Market multiplier such as 0.96. Required with pricing multiplier; omit with saved_rules.",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "pricing": {
                "default": "multiplier",
                "description": "Use saved_rules to run the owner's accepted eBay strategy without caller pricing overrides. multiplier applies a one-run override where delegated permissions allow it.",
                "enum": ["multiplier", "saved_rules"],
                "type": "string"
              },
              "setCodes": {
                "description": "Restrict the run to these set codes. Omit for every live eBay listing in the workspace.",
                "items": {
                  "maxLength": 20,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "skipIfWithinPercent": {
                "default": 2,
                "description": "Skip an existing ask already within this percentage of the target. Defaults to 2.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "workspaceId": {
                "description": "The workspace whose existing eBay listings to reprice. Required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
