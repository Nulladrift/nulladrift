        {
          "name": "spellbook_channel_lane_set",
          "description": "Set one workspace's lane mode for one channel-lane marketplace, the switch that decides whether SpellBook reads the marketplace or changes listings there, and set the Misprint ask floor. This changes public marketplace behavior for the workspace, only the workspace owner may call it, and the agent sets a mode or a floor only after the seller chose it. It returns the same lane state as spellbook_marketplace_onboarding. The modes: off: the lane is disabled and SpellBook neither reads nor changes the marketplace. observe: SpellBook reads the marketplace and records whether it matches SpellBook's desired state, and never changes a listing there. push: SpellBook creates, updates, and removes listings on the marketplace to match its desired state. askFloorUsd is the lowest ask SpellBook Finance sets on Misprint. Each Misprint ask is the TCGplayer ask for the same copies, raised to that floor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "askFloorUsd": {
                "description": "Misprint only. The lowest ask in US dollars the seller chose for any Misprint listing, such as 0.5, in whole cents. Omit it to keep the saved floor.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "marketplace": {
                "description": "The channel-lane marketplace whose mode to set. Required.",
                "enum": ["cardtrader", "ebay", "manapool", "misprint", "shopify"],
                "type": "string"
              },
              "mode": {
                "description": "The mode the seller chose: off, observe, or push. Send mode, askFloorUsd, or both.",
                "enum": ["off", "observe", "push"],
                "type": "string"
              },
              "workspaceId": {
                "description": "The workspace whose lane to set. The caller must own it. Required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["marketplace", "workspaceId"],
