        {
          "name": "spellbook_alert_create",
          "description": "Create one alert in a workspace and return the saved alert. alertType buylist_watch watches dealer buy offers for the whole inventory (buylistWatchScope inventory) or for one printing and finish (buylistWatchScope card); buylistWatchCondition crossed also needs direction and threshold in USD. Every other alertType watches one card or box and needs assetType, assetKey, assetName, isFoil, direction and threshold. Sending the same alert twice returns the first one with replayed true and creates nothing. Call spellbook_alerts_list first to see what exists.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alertType": {
                "description": "The kind of alert. buylist_watch watches dealer buy offers against inventory or one printing. Required.",
                "enum": ["price", "metagame", "supply_signal", "eu_spread", "buylist_spread", "buylist_vs_cost_basis", "spread_compression", "fair_value_divergence", "sealed_breakeven_positive", "restock", "buylist_watch"],
                "type": "string"
              },
              "assetKey": {
                "description": "The printing id for a card or the product id for a box. Required for every non-buylist_watch type.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "assetName": {
                "description": "A display name for the watched asset. Required for every non-buylist_watch type. Optional for buylist_watch.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "assetType": {
                "description": "Whether the alert watches a card or a sealed box. Required for every non-buylist_watch type.",
                "enum": ["card", "box"],
                "type": "string"
              },
              "buylistVendor": {
                "description": "For buylist_watch: the dealer to watch, as SpellBook stores the vendor name. Omit to watch Card Kingdom.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "buylistWatchCondition": {
                "description": "For buylist_watch: buying_again or crossed. crossed also needs direction and threshold. Required for buylist_watch.",
                "enum": ["buying_again", "crossed"],
                "type": "string"
              },
              "buylistWatchScope": {
                "description": "For buylist_watch: inventory watches every sellable item in the workspace, card watches one printing and finish. Required for buylist_watch.",
                "enum": ["inventory", "card"],
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "direction": {
                "description": "Whether the alert fires when the price is above or below threshold. Required for crossed and for every non-buylist_watch type.",
                "enum": ["above", "below"],
                "type": "string"
              },
              "finish": {
                "description": "The finish to watch, matching the finish codes spellbook_printings_search returns. Required for a buylist_watch with scope card.",
                "enum": ["nf", "fo", "etched", "surge", "rh", "1e", "1e-fo"],
                "type": "string"
              },
              "isFoil": {
                "description": "Whether the watched card is foil. Required for every non-buylist_watch type.",
                "type": "boolean"
              },
              "scryfallId": {
                "description": "The exact printing id from spellbook_printings_search. Required for a buylist_watch with scope card and for a card alert.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "threshold": {
                "description": "The USD price the alert compares against. Required for crossed and for every non-buylist_watch type.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "workspaceId": {
                "description": "The workspace the alert belongs to, from spellbook_workspaces_list. Required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["alertType", "workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an alert"
