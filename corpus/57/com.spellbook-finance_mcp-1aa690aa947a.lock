              "expectedStockRevision": {
                "description": "proposed.stockRevision from the preview. Required; a different value means stock moved and the call is refused.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "fixedPriceUsd": {
                "description": "A fixed ask in USD for every unit. Omit to list at the product's current market price. Cannot be combined with priceRule.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "floorMarketFraction": {
                "description": "undercut only. The floor as a fraction of catalog market, used when floorUsd is omitted. Defaults to 0.9.",
