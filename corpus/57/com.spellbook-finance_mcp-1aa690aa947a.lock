        {
          "name": "spellbook_box_ev_rankings",
          "description": "Read a named sealed product's modeled gross contents EV, or compare ranking rows, with totalEV, evRatio, pack standard deviation (packSD), N0 and breakEvenPct. For a named Collector Booster display, use q and box_type, then match boxId to the exact catalog product; a Collector's Edition Commander deck is a different product. Default order is highest evRatio first. Call it for \"how many packs until opening is likely profitable\" (N0), \"how swingy is this box\" (packSD, and swinginess, which is packSD divided by packEV) and \"what share of packs beat the pack price\" (breakEvenPct). N0 is the number of packs at which a normal approximation, treating packs as independent and identical, gives about a 97.7% modeled probability that summed card value under the selected valuation basis exceeds summed pack cost. It is null when required inputs are absent or matching edge or standard deviation is not positive. Pack cost is the returned packPrice: a separate stored pack reference when available, otherwise box marketPrice divided by packsPerBox. Preserve packPriceSource; a missing or unrecognized label leaves the reference origin unknown. This is not a caller-paid cost. Each N0 variant uses its own valuation basis, with its own pack SD and edge: n0Full uses full market value (packSD, fullEdge), n0LandAdjusted prices cheap lands at bulk rates (landAdjustedPackSD, landAdjustedEdge), and n0Sellable prices cards below a threshold at bulk buylist rates (sellablePackSD, sellableEdge). These valuations use their stated basis before selling fees, shipping and liquidity. breakEvenPct is the share of simulated single packs worth at least packPrice. It is not the probability of profit after N packs. Optional cardmarketEV carries native EUR retail singles EV, per-finish coverage, quote dates, missingFields and limitations. Its totalEV is null when coverage is incomplete. Existing top-level prices, ratios, filters and order retain their US basis; Cardmarket EV has no local sealed acquisition cost. Rows also carry exact product IDs, market prices, the acquirableFloorUsd and evRatioBasis behind the stored EV ratios when present, market-basis ratios, market-price spreads, shipping-aware ratios, per-pack metrics and row timestamps. evRatio is totalEV divided by max(marketPrice, the cheapest captured TCG listing price plus shipping) on rows with a known basis; evRatioMarketBasis preserves the market-price comparison. spreadUsd is totalEV minus marketPrice, so it is a separate comparison. typicalEV is the box EV with every card under typicalEvCutoffPerPack (a pull probability of 0.001 per pack) left out, and typicalEvExcludedCount is how many cards that dropped; typicalEV is null when the model cannot compute it, with typicalEvReason saying why. Sort by n0Full, n0LandAdjusted or n0Sellable to order boxes by packs needed. Call spellbook_sealed_product_offers with a row's boxId for store offers on that product. For valuation, product identity and source-clock context, read guideResourceUri through MCP; guideUrl is the same published page. A catalog entry is not its full guide body. This is modeled research evidence for a caller's decision, not a purchase instruction.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "box_type": {
                "description": "Exact box-type value from a ranking row, such as collector for Collector Boosters or commander for Commander decks. Omit to include every box type.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "cursor": {
                "description": "Opaque nextCursor from a previous page, passed back unchanged. Omit to start from the first page.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "game": {
                "description": "Restrict rankings to one game. Omit for the mixed supported-game ranking. A registered game without production EV returns an empty ranking plus sealedIntelligence.reason and missingFields.",
                "enum": ["mtg", "riftbound", "pokemon", "yugioh"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum rows to return, 1 to 150. Omit for the default of 50.",
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum market price a row may have to be returned. Omit for no ceiling.",
                "minimum": 0,
                "type": "number"
              },
              "min_ev_ratio": {
                "description": "Minimum stored evRatio a row must have to be returned. Rows with a null ratio are excluded. Omit for no floor.",
                "type": "number"
              },
              "q": {
                "description": "Product-name token filter, not a numeric product-id lookup. Broad collector searches may also match Collector's Edition Commander decks; use box_type and verify the returned boxId. Omit to include every product.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "evRatio",
                "description": "Which computed field ranks the rows. Defaults to evRatio, the stored totalEV ratio using acquirableFloorUsd when its basis is known; use spreadUsd for totalEV minus marketPrice. n0Full, n0LandAdjusted and n0Sellable rank by packs needed under that valuation basis. A null sort value, a preorder row and an unverified row come after the other rows in either direction.",
                "enum": ["evRatio", "totalEV", "spreadUsd", "marketPrice", "packEV", "packEvRatio", "packPrice", "n0Full", "n0Sellable", "n0LandAdjusted", "swinginess"],
                "type": "string"
              },
              "sort_dir": {
                "default": "desc",
                "description": "Sort direction for `sort`. Defaults to desc, highest first. Pass asc with an n0 sort to list the fewest packs first.",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read sealed product EV and pack risk"
