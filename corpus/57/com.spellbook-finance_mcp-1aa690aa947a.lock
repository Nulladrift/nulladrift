              },
              "marketplace": {
                "description": "Where the sale happened. in_person covers a store buy or a trade. buylist covers a sale to a dealer's buylist and needs buylistVendor. Required.",
                "enum": ["tcg", "manapool", "ebay", "in_person", "buylist", "unknown"],
                "type": "string"
              },
              "note": {
                "description": "A free-text note stored with the sale. Optional.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "occurredAt": {
                "description": "When the sale happened, as an ISO-8601 timestamp. Omit to use the time of this call.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                "type": "string"
              },
              "orderId": {
                "description": "A stable reference for this sale, such as the buyer's order number or a receipt number. Required. A second call with the same orderId for the same printing, finish and condition returns the first sale with replayed true and sells nothing.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "productId": {
                "description": "The exact printing id, from spellbook_printings_search or spellbook_inventory_holdings. Required; a wrong id sells the wrong card.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "qty": {
                "description": "How many copies sold. Required.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "salePricePerUnit": {
                "description": "Price received PER COPY in USD, before any fee. Not the order total. Required.",
                "minimum": 0,
                "type": "number"
              },
              "workspaceId": {
                "description": "The workspace that held the sold copies, from spellbook_workspaces_list. Required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["condition", "finish", "marketplace", "orderId", "productId", "qty", "salePricePerUnit", "workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
