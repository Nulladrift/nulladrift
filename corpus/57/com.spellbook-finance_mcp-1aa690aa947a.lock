        {
          "name": "spellbook_inventory_bin_ensure",
          "description": "Record physically confirmed cards into one inventory bin, by stating the DESIRED TOTAL quantity of each exact printing that belongs in that bin. Existing live copies count toward that total, so only a missing difference is created. Calling it twice with the same numbers creates nothing the second time. Use it for the first cards a seller enters by hand, with no CSV and no scanner. Returns the created item ids plus every candidate it refused and why.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "binId": {
                "description": "The bin these cards physically sit in. A bin id is a container letter plus an incrementing number, like B0001, where the letter names the physical box and the number names the bag inside it. Required.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "items": {
                "description": "Up to 200 exact printing rows to record in this bin. Required, at least one.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acquisitionPrice": {
                      "description": "Per-copy acquisition cost in USD. When it is omitted or zero, the server records an implied per-card cost from the set's box price instead. Pass the real cost when the person knows it.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "acquisitionSource": {
                      "default": "agent_intake",
                      "description": "Provenance tag for these rows. Defaults to agent_intake; omit unless a different source genuinely applies.",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "cardName": {
                      "description": "The card's name, echoed back in the response. Required.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "collectorNumber": {
                      "description": "The collector number of this exact printing. Required.",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    },
                    "condition": {
                      "description": "The physical condition of these copies. Required.",
                      "enum": ["NM", "LP", "MP", "HP", "DMG"],
                      "type": "string"
                    },
                    "finish": {
                      "description": "The finish of these copies, using the values listed in this field. Pokemon supports nf (Normal/Unlimited), fo (Holofoil), rh (Reverse Holofoil), 1e (1st Edition) and 1e-fo (1st Edition Holofoil); other games have their own valid finishes. Required.",
                      "enum": ["nf", "fo", "etched", "surge", "rh", "1e", "1e-fo"],
                      "type": "string"
                    },
                    "qty": {
                      "description": "The DESIRED TOTAL count of this exact printing, condition and finish in this bin, never an amount to add. Required.",
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "scryfallId": {
                      "description": "The exact printing id, from spellbook_printings_search. Required; a wrong id records the wrong card.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "setCode": {
                      "description": "The set code of this exact printing. Required.",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["cardName", "collectorNumber", "condition", "finish", "qty", "scryfallId", "setCode"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "physicallyConfirmed": {
                "const": true,
                "description": "Must be true, asserting a person has physically counted these cards. The call is refused when this is omitted or false.",
                "type": "boolean"
              },
              "workspaceId": {
                "description": "The workspace to record these cards into. Required; writes only to this workspace.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["binId", "items", "physicallyConfirmed", "workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record cards in a bin"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "spellbook.finance/app-page": {
              "title": "Manage inventory",
              "url": "https://spellbook-finance.com/inventory"
            }
          },
          "digest": "sha256:ee150d0c13a1442cc26ef88d09b5aa33984e32de7ffddcc1e17611ac2040f846"
        },
