        {
          "name": "spellbook_inventory_precon_import",
          "description": "Add opened Commander precon decks, displays or cases to inventory as individual cards, the same Add Commander deck flow the web app runs. The server reads the cached decklist for that TCGplayer product, splits a display or case into its decks, creates one inventory copy per card at the exact printing, assigns bins, and splits the price paid across the cards. Returns importId, copy count, and bin counts with deckName.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acquisitionDate": {
                "description": "The date the seller bought it, as YYYY-MM-DD. Required.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "binPrefix": {
                "description": "One capital letter that starts the auto-assigned bin codes, e.g. C gives C0001. Required.",
                "pattern": "^[A-Z]$",
                "type": "string"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "copyCount": {
                "description": "How many copies of the whole product were opened, 1 to 20. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "oneBinPerDeck": {
                "description": "True gives each deck its own fresh bin; send true for a display or case. Defaults to false, which packs cards into the rolling bin sequence.",
                "type": "boolean"
              },
              "overrideDuplicate": {
                "description": "True imports even when this seller already imported the same product. Set it only when the person confirms a second physical copy.",
                "type": "boolean"
              },
              "paidPriceUsd": {
                "description": "USD paid for ONE copy of tcgProductId: one deck, or the whole display or case. Required. Send 0 only when it cost nothing.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "tcgProductId": {
                "description": "Exact TCGplayer product id of a sealed precon deck, or a Commander display or case, from spellbook_sealed_product_search. Required. Set of N, Bundle of N or Collection of N names are refused.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "workspaceId": {
                "description": "The workspace to add the cards to, from spellbook_workspaces_list. Required; writes only to this workspace.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
