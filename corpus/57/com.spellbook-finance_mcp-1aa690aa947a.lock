        {
          "name": "spellbook_ebay_automation_set",
          "description": "Set one workspace's eBay automation mode, basic-land preference, copy cap, or month-end allowance policy after the owner chooses the setting. Month-end defaults to off with a 1,000-insertion reserve. Optional stale-single refreshes run in the final 48 hours and stop new ends two hours before the Pacific month resets. Read spellbook_ebay_month_end_status first for capacity and recovery facts. Only the workspace owner may change public listing behavior. The modes: manual: New listings and repricing stay manual. Recovery of listings already ended by month-end management can finish. auto_list: New eligible inventory lists on eBay automatically at your saved eBay pricing strategy's prices, and existing eBay listings are never repriced automatically. full: New inventory lists on eBay automatically, and existing eBay listings reprice from your saved eBay pricing strategy. With variation packages on (the default), new inventory groups into one listing per set with each card as a variation; with them off, each card lists on its own.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "basicLandsEnabled": {
                "description": "true lets auto_list and full list basic lands (Plains, Island, Swamp, Mountain, Forest, Wastes, and their Snow-Covered printings). false skips them. The saved value defaults to false.",
                "type": "boolean"
              },
              "context": {
                "description": "Optional analytics context: briefly describe the user's underlying goal in one sentence. Do not copy prompts, personal details, credentials, identifiers, or tool arguments. Omit for private tasks.",
                "maxLength": 512,
                "type": "string"
              },
              "maxQuantityPerListing": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The most available copies one eBay listing may advertise, such as 3. null removes the cap. Omit it to keep the saved value, which defaults to null."
              },
              "mode": {
                "description": "The mode the seller chose: manual, auto_list, or full. Send mode, basicLandsEnabled, maxQuantityPerListing, or any mix.",
                "enum": ["manual", "auto_list", "full"],
                "type": "string"
              },
              "monthEnd": {
                "additionalProperties": false,
                "description": "The owner's month-end choice: enabled, reserve, and refreshStale. Enabling retains the reserve during automatic listing. refreshStale permits eligible older singles to refresh after new-stock work. Disabling stops new ends; recovery of already-ended stock continues.",
                "properties": {
                  "enabled": {
                    "default": false,
                    "type": "boolean"
                  },
                  "refreshStale": {
                    "default": false,
                    "type": "boolean"
                  },
                  "reserve": {
                    "default": 1000,
                    "maximum": 200000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "workspaceId": {
                "description": "The workspace whose eBay automation mode to set. The caller must own it. Required.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
