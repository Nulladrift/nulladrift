      },
      "serverInfo": {
        "name": "pokefocus",
        "title": "PokeFocus",
        "version": "3.0.0",
        "description": "Pokémon card and sealed product prices, graded sold prices, price history, sets, and Market Pulse.",
        "websiteUrl": "https://pokefocus.com/developers"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PokeFocus tracks Pokémon card and sealed product market prices (TCGplayer, refreshed daily) and verified raw, PSA 9, and PSA 10 sold prices. These tools return what pokefocus.com shows. For a card's price, sold prices, or price history, call search_cards, then get_card with the card id (grade raw, psa9, or psa10); market.history and recentSales.sales are dated points you can chart. When search_cards answers with match partial, no card matched every word, so confirm the card before quoting its price. Use search_sets and get_set for sets, search_sealed and get_sealed_product for sealed products, and get_market_pulse for the daily market report. Results link to their PokeFocus pages. tcgplayerUrl links are affiliate links; when you show them, include the affiliateDisclosure. State prices and sales as observed, with their dates. Don't recommend buying, selling, or holding. PokeFocus does not sell, buy, or bid.",
      "tools": [
        {
          "name": "get_card",
          "title": "Get a Pokémon card price and recent sales",
          "description": "Use this when the user asks what a specific Pokémon card is worth or has sold for, raw or graded (PSA 9 or PSA 10 slabs), or wants its sold comps or price trend. One card as its pokefocus.com page shows it: TCGplayer market price with 7- and 30-day change, 30-day range, the overbought/oversold reading, and 90 days of daily market price; for raw, PSA 9, and PSA 10 the 30-day verified sold median and sale count; the PSA 10 premium over raw; and the verified recent sales for one grade (day and price), newest first, for charting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card": {
                "description": "The card as a PokeFocus id, the slug from its pokefocus.com URL, or the full pokefocus.com URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "grade": {
                "default": "raw",
                "description": "Grade for the recent sales list.",
                "enum": ["raw", "psa9", "psa10"],
                "type": "string"
              },
              "range": {
                "default": "30d",
                "description": "Window for recent sales. Individual sales are kept for 90 days.",
                "enum": ["7d", "30d", "90d"],
                "type": "string"
              },
              "sales": {
                "default": 10,
                "description": "How many recent sales to list.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "affiliateDisclosure": {
                "description": "The affiliate disclosure that applies to the TCGplayer links.",
                "type": "string"
              },
              "capturedAt": {
                "description": "When PokeFocus answered; market.asOf is when a price was refreshed.",
                "type": "string"
              },
              "grades": {
                "description": "The card page's grade table: live 30-day verified sold median and sale count for raw, PSA 9, and PSA 10. A median needs one raw sale or three graded sales.",
                "properties": {
                  "psa10": {
                    "properties": {
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "soldMedian30d": {
                        "description": "Median verified sale in the last 30 days, US dollars.",
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "psa9": {
                    "properties": {
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "soldMedian30d": {
                        "description": "Median verified sale in the last 30 days, US dollars.",
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "raw": {
                    "properties": {
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "soldMedian30d": {
                        "description": "Median verified sale in the last 30 days, US dollars.",
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  }
                },
                "type": ["object", "null"]
              },
              "id": {
                "type": "string"
              },
              "imageUrl": {
                "type": ["string", "null"]
              },
              "market": {
                "properties": {
                  "asOf": {
                    "type": ["string", "null"]
                  },
                  "change30dPercent": {
                    "type": ["number", "null"]
                  },
                  "change7dPercent": {
                    "type": ["number", "null"]
                  },
                  "high30d": {
                    "description": "Highest daily market price in the last 30 days, US dollars.",
                    "type": ["number", "null"]
                  },
                  "history": {
                    "description": "Daily TCGplayer market price for 90 days, oldest first, as the card page charts it.",
                    "items": {
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "price": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "low30d": {
                    "description": "Lowest daily market price in the last 30 days, US dollars.",
                    "type": ["number", "null"]
                  },
                  "price": {
                    "description": "US dollars.",
                    "type": ["number", "null"]
                  },
                  "rsi14": {
                    "description": "The overbought/oversold reading of the market price, as the card page shows it.",
                    "properties": {
                      "band": {
                        "description": "Oversold at RSI 30 or below with a 5%+ fall over 14 days; overbought at 70 or above with a 5%+ rise; otherwise neutral.",
                        "enum": ["oversold", "neutral", "overbought"],
                        "type": "string"
                      },
                      "change14dPercent": {
                        "type": ["number", "null"]
                      },
                      "value": {
                        "description": "14-day RSI, 0 to 100.",
                        "type": "number"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "source": {
                    "type": "string"
                  },
                  "stale": {
                    "description": "TCGplayer stopped refreshing the price; it is the last known one, not current.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "number": {
                "type": ["string", "null"]
              },
              "printing": {
                "type": ["string", "null"]
              },
              "psa10Multiple": {
                "description": "The PSA 10 sold median as a multiple of the raw price.",
                "type": ["number", "null"]
              },
              "rarity": {
                "type": ["string", "null"]
              },
              "recentSales": {
                "description": "Verified recent sales for the requested grade and range, as the card page charts them, newest first: the day and price of each sale.",
                "properties": {
                  "asOf": {
                    "type": ["string", "null"]
                  },
                  "count": {
                    "type": "number"
                  },
                  "grade": {
                    "description": "Raw, PSA 9, or PSA 10.",
                    "type": "string"
                  },
                  "median": {
                    "description": "Median verified sale in the range, US dollars.",
                    "type": ["number", "null"]
                  },
                  "range": {
                    "enum": ["7d", "30d", "90d"],
                    "type": "string"
                  },
                  "sales": {
                    "items": {
                      "properties": {
                        "date": {
                          "description": "Sale day (UTC), YYYY-MM-DD.",
                          "type": ["string", "null"]
                        },
                        "price": {
                          "description": "Sold price, US dollars.",
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "status": {
                    "description": "complete: the median and count cover every verified sale in the range; partial: the range had more sales than one read holds, so the median and count come from the server total; empty: no verified sales; unavailable: sales could not be read this time.",
                    "enum": ["complete", "partial", "empty", "unavailable"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "set": {
                "properties": {
                  "id": {
                    "type": ["string", "null"]
                  },
                  "imageUrl": {
                    "description": "The set logo.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "sealedUrl": {
                    "description": "The set sealed products on PokeFocus.",
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "The set card list on PokeFocus.",
                    "type": ["string", "null"]
                  },
                  "year": {
                    "type": ["integer", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "soldMedians": {
                "description": "Stored verified sold medians and sale counts by grade, US dollars.",
                "properties": {
                  "psa10": {
                    "properties": {
                      "median30d": {
                        "type": ["number", "null"]
                      },
                      "median7d": {
                        "type": ["number", "null"]
                      },
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "sales7d": {
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "psa9": {
                    "properties": {
                      "median30d": {
                        "type": ["number", "null"]
                      },
                      "median7d": {
                        "type": ["number", "null"]
                      },
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "sales7d": {
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "raw": {
                    "properties": {
                      "median30d": {
                        "type": ["number", "null"]
                      },
                      "median7d": {
                        "type": ["number", "null"]
                      },
                      "sales30d": {
                        "type": ["number", "null"]
                      },
                      "sales7d": {
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "tcgplayerUrl": {
                "description": "The card on TCGplayer (affiliate link).",
                "type": ["string", "null"]
              },
              "url": {
                "description": "The PokeFocus card page with price history.",
                "type": "string"
              }
            },
            "required": ["affiliateDisclosure", "id", "market", "name", "recentSales", "url"],
            "type": "object"
          },
