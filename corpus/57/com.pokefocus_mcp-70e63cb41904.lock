        {
          "name": "get_market_pulse",
          "title": "Get the Pokémon card Market Pulse report",
          "description": "Use this when the user asks how the Pokémon card market is moving, which cards or sets are up or down, or for today's market report. PokeFocus Market Pulse, the daily Pokémon card market report: headline, 7-day direction, cards up and down, and each section's summary with the cards or sealed products it highlights (price, 7-day change, sales) and its ranked set and sealed tables. Also lists recent reports.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Report date (YYYY-MM-DD). Leave empty for the latest report.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "capturedAt": {
                "description": "When PokeFocus answered; market.asOf is when a price was refreshed.",
                "type": "string"
              },
              "recentReports": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "title": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "report": {
                "properties": {
                  "cardsDown": {
                    "type": ["number", "null"]
                  },
                  "cardsTracked": {
                    "type": ["number", "null"]
                  },
                  "cardsUp": {
                    "type": ["number", "null"]
                  },
                  "date": {
                    "description": "Report date, YYYY-MM-DD.",
                    "type": "string"
                  },
                  "publishedAt": {
                    "type": ["string", "null"]
                  },
                  "sections": {
                    "items": {
                      "properties": {
                        "heading": {
                          "type": "string"
                        },
                        "items": {
                          "description": "The cards or sealed products the section highlights.",
                          "items": {
                            "properties": {
                              "change7dPercent": {
                                "type": ["number", "null"]
                              },
                              "id": {
                                "type": ["string", "null"]
                              },
                              "imageUrl": {
                                "type": ["string", "null"]
                              },
                              "kind": {
                                "enum": ["card", "sealed"],
                                "type": "string"
                              },
                              "name": {
                                "type": ["string", "null"]
                              },
                              "number": {
                                "type": ["string", "null"]
                              },
                              "price": {
                                "description": "US dollars.",
                                "type": ["number", "null"]
                              },
                              "sales30d": {
                                "type": ["number", "null"]
                              },
                              "sales7d": {
                                "type": ["number", "null"]
                              },
                              "set": {
                                "type": ["string", "null"]
                              },
                              "url": {
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "summary": {
                          "type": "string"
                        },
                        "tables": {
                          "description": "Ranked tables (sets, sealed products) as the report shows them.",
                          "items": {
                            "properties": {
                              "label": {
                                "type": "string"
                              },
                              "rows": {
                                "items": {
                                  "type": "object"
                                },
                                "type": "array"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "sentiment": {
                    "description": "The report's 7-day direction: More cards up, More cards down, or Mixed.",
                    "type": ["string", "null"]
