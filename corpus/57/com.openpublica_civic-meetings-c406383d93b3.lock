      "instructions": "OpenPublica makes US local-government meetings searchable. It tracks city\ncouncils and boards (Sacramento, San Francisco, Los Angeles, Minneapolis, and\nmore), transcribes each meeting, and generates a structured AI summary.\n\nA good way to narrow down to the right meetings:\n1. WHERE — resolve the government: `find_governments_by_name` (\"Sacramento\"),\n   `find_governments_by_zip` (\"95814\"), or `find_local_governments` (lat/lon).\n   Each returns an `account_id` used to scope the other tools.\n2. WHAT KIND — `discover_meeting_vocabulary` lists the valid `category_tag`s and\n   `topic`s to filter by. `category_tag` is an opaque UUID — never guess it; get it here.\n3. SEARCH — search_meeting_content searches summaries and stored transcript text\n   with one meeting-level ranking and native next/previous cursors. Use\n   search_meetings_semantic for meaning, or list_recent_meetings to browse.\n4. TRIAGE — read the meeting summary preview and matching evidence.\n5. DRILL IN — get_meeting returns the full summary and topics.\n6. QUOTE — search.transcript_preview is current text, not a verified timestamp.\n   Missing previews do not imply no search match. Retrieve full source explicitly\n   with get_meeting(include_transcript=true) when timing or more context is needed.\n\nDates passed as filters use MM-DD-YYYY. Cite returned source/meeting URLs, label\nAI summaries, and preserve conflicts with source text. Missing matches do not\nprove a discussion never happened. Stored totals do not establish completeness\nor freshness; this corpus does not provide reliable advance-hearing alerts.\n",
      "tools": [
        {
          "name": "discover_meeting_vocabulary",
          "title": "Discover category and topic filters",
          "description": "Discover the valid category and topic filter values before filtering a search.\n\n    Meeting `category_tag`s are opaque UUIDs and topics have no fixed list, so you\n    cannot guess them. Call this first to get the real values, then pass a returned\n    `category_tag` (from `categories[].tags`) or `topic` string into\n    `search_meetings_semantic` / `list_recent_meetings`. Scope with a government\n    and/or date range; calls without explicit dates default to a recent window\n    (returned as `default_window_days`).\n    ",
          "inputSchema": {
            "properties": {
              "end_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional latest date, MM-DD-YYYY.",
                "title": "End Date"
              },
              "government_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional account_id to scope the vocabulary to one government.",
                "title": "Government Id"
              },
              "government_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional list of account_ids to scope to several governments. Overrides government_id.",
                "title": "Government Ids"
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional earliest date, MM-DD-YYYY.",
                "title": "Start Date"
              },
              "topic_limit": {
                "default": 50,
                "description": "Max topics to return, most common first (1-200).",
                "maximum": 200,
                "minimum": 1,
                "title": "Topic Limit",
                "type": "integer"
              }
            },
            "title": "discover_meeting_vocabularyArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "discover_meeting_vocabularyDictOutput",
            "type": "object"
