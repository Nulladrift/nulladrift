        {
          "name": "list_government_documents",
          "title": "List government documents",
          "description": "List a government's adopted plan and budget documents.\n\n    Each entry carries `covers` — every general-plan element that document\n    answers for. A city that publishes one bound general plan satisfies all\n    eight with the same PDF, so do not conclude an element is unpublished\n    because no entry is named after it.\n\n    `status` says what the entry offers: `converted` is searchable and readable;\n    `superseded` is a retired edition, still stored but not searchable; and\n    **`failed` means we hold this document and could not read it — it is not\n    evidence the city published nothing.** Cite `source_url` in that case; it is\n    always the city's own copy.\n\n    An `availability` block appears ONLY when something is wrong with a\n    document, and `availability.reason` says what. No `availability` key means\n    there is nothing to report.\n    ",
          "inputSchema": {
            "properties": {
              "government_id": {
                "description": "account_id from find_local_governments.",
                "title": "Government Id",
                "type": "string"
              },
              "include_superseded": {
                "default": false,
                "description": "Also include prior editions retired by a newer document.",
                "title": "Include Superseded",
                "type": "boolean"
              }
            },
            "required": ["government_id"],
            "title": "list_government_documentsArguments",
            "type": "object"
          },
