        {
          "name": "read_document_pages",
          "title": "Read document pages",
          "description": "Read a page range of a document as markdown.\n\n    Pages are transcribed from rendered pixels, so tables and scanned text come\n    through as text. A page that could not be transcribed appears as a marked\n    hole rather than being silently dropped — if you see one, say so instead of\n    reading past it.\n\n    Text is assembled from page windows, so `covered` may be slightly wider than\n    what you asked for; cite the page numbers in `covered`, not `requested`.\n    ",
          "inputSchema": {
            "properties": {
              "document_id": {
                "description": "Document id from list_government_documents or search_documents.",
                "title": "Document Id",
                "type": "string"
              },
              "first_page": {
                "description": "First page to read (1-based, as the PDF renders).",
                "minimum": 1,
                "title": "First Page",
                "type": "integer"
              },
              "last_page": {
                "description": "Last page to read. Spans longer than 40 pages are clamped to 40 from first_page.",
                "minimum": 1,
                "title": "Last Page",
                "type": "integer"
              }
            },
            "required": ["document_id", "first_page", "last_page"],
            "title": "read_document_pagesArguments",
