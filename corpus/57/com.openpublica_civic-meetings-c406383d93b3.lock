        {
          "name": "search_documents",
          "title": "Search documents",
          "description": "Search adopted plan and budget documents, returning page-cited excerpts.\n\n    Each hit's `text` is a short passage around the match, not the full page —\n    call read_document_pages with the hit's `first_page` to read it in context.\n\n    Every hit carries `first_page`/`last_page` and `source_url`. Quote those\n    when citing: the page number is what makes the claim checkable against the\n    city's own copy.\n\n    This is word matching, not semantic search — try the terms a plan would\n    actually use. Only currently-served documents are searchable, so an empty\n    result is not evidence the government has no such policy; check\n    list_government_documents for what is held and what could not be read.\n\n    A hit with `document_complete: false` comes from a document with\n    transcription findings. Verify it against `source_url` before quoting a\n    number from it.\n    ",
          "inputSchema": {
            "properties": {
              "government_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional account_id to restrict the search to one government.",
