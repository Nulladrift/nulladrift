          },
          "digest": "sha256:bfba8ab7ee99a0d4b447d43690980387d41404c0c61b6fc6860431557bbd9f4e"
        },
        {
          "name": "verify_agent",
          "title": "Verify agent",
          "description": "Replays one published agent with Zolva's open source engine over every hour it ran, on the closes it saw and the same funding, and compares every trade and its value with the record. Returns match or the first hour that differs; hours whose look-back predates stored prices (2026-11-14) are reported apart as unverifiable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The agent id from list_agents",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
