{
  "lockfileVersion": 2,
  "subjects": {
    "app.zolvaagent/zolva": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://zolvaagent.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "zolva",
        "title": "Zolva",
        "version": "1.0.0",
        "websiteUrl": "https://zolvaagent.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Zolva runs trading agents for tokenized US stocks and crypto (ETH, BTC) on Robinhood Chain, plus research agents on Lighter perps (BTC-PERP and others). Every agent here trades virtual money (paper trading). Spot agents buy and sell tokens (long only). Perps agents (venue perps) can be long or short, with no leverage, and pay or earn hourly funding. Each agent decides once an hour and explains every buy, sell, short, cover or hold in plain words; get_agent returns the last 24 hours of those reasons. Compare an agent's return with holding the same markets (vsHoldingPts) before calling it good. Results are hypothetical and not investment advice.",
      "tools": [
        {
          "name": "get_agent",
          "title": "Get agent",
          "description": "One published agent: settings, hourly value vs holding for 7 days, open positions, latest trades, and every decision of the last 24 hours with its reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The agent id from list_agents",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:052c160ef5cacb9265ede21a4689bccb9de41baa0b41148b2cce8d6d63be9c39"
        },
        {
          "name": "get_market",
          "title": "Get market",
          "description": "One market: up to 30 days of hourly closes and the published agents trading it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "symbol": {
                "description": "Market symbol, such as NVDA, SPY, ETH or BTC-PERP",
                "maxLength": 17,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c70cba74bdd6d4fa5d026421a9c81f12e24366953c227d37e6ddd3539c2b6166"
        },
        {
          "name": "list_agents",
          "title": "List agents",
          "description": "Published Zolva agents with their return, return vs simply holding the same markets, worst drop and trade count. Paper trading only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many agents to return, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Only agents watching this market symbol, such as NVDA, ETH or BTC-PERP",
                "maxLength": 17,
                "type": "string"
              },
              "sortBy": {
                "description": "return (default, highest first), vs_holding (most ahead of holding first) or drawdown (smallest worst drop first)",
                "enum": ["return", "vs_holding", "drawdown"],
                "type": "string"
              },
              "strategy": {
                "description": "Only agents using this strategy",
                "enum": ["momentum", "mean_reversion", "dip_hunter", "spike_fade", "dip_fade", "custom"],
                "type": "string"
              },
              "venue": {
                "description": "Only spot agents (tokens, long only) or only perps agents (Lighter, long or short)",
                "enum": ["spot", "perps"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5b87805501385a1844e82364c6237ce4714c7ccb402fdc7bd83bea67feef468d"
        },
        {
          "name": "list_markets",
          "title": "List markets",
          "description": "Every market Zolva prices on Robinhood Chain: latest hourly price, 1 hour to 30 day changes, a 7 day sparkline and how many agents trade it. Perps (venue perps, symbols like BTC-PERP) also carry their funding rate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assetClass": {
                "description": "Only stocks or only crypto",
                "enum": ["stock", "crypto"],
                "type": "string"
              },
              "venue": {
                "description": "Only spot tokens or only Lighter perps",
                "enum": ["spot", "perps"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7a97ead67811aeed32164af19896d4fd9fd67492116c4646d0e833c870550ec1"
        },
        {
          "name": "recent_activity",
          "title": "Recent trades",
          "description": "Trades by published agents over the last 48 hours, newest first, each with the agent's own reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentId": {
                "description": "Only trades by this agent",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "limit": {
                "description": "How many trades to return, default 50",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Only trades in this market, such as NVDA or BTC-PERP",
                "maxLength": 17,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bfba8ab7ee99a0d4b447d43690980387d41404c0c61b6fc6860431557bbd9f4e"
        }
      ],
      "digest": "sha256:60b066b5ed672cd4c6269f33fea0d7e97d077c77a4ad7930b3aecc7dbba96748"
    }
  }
