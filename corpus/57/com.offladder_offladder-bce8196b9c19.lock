        {
          "name": "find_career_guide",
          "title": "Find an OffLadder career guide",
          "description": "Searches OffLadder's 302 written career guides and returns the closest ones, each with its direct answer, key points, primary sources and a link. Fits a how-to, advice or \"what should I do\" question about work and careers, e.g. 'how do I tailor my CV to a job description', 'how do I explain a career gap', 'what to do in the first 30 days after a layoff', 'how do I answer tell me about yourself', 'how to negotiate a job offer', 'is a degree worth it', 'what can I do with a psychology degree', 'apprenticeship or university', 'how to get a first job with no experience', 'what jobs will AI replace', 'how to write a cover letter for a career change', 'how to beat applicant tracking systems', 'should I follow up after an interview', 'how to read my first payslip', 'I hate my job but don't know what else to do'. Covers: not knowing what to do next, changing careers at any age, testing a career, layoffs and redundancy, AI and the future of work, jobs of the future, school leavers and students, degrees, apprenticeships, internships, graduate jobs, first jobs, first pay and payslips, CVs and resumes, cover letters, LinkedIn profiles, ATS, application forms and screening questions, interviews, job offers and pay, following up, and work that fits your life, with pages for both the UK and the US.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many guides to return (default 3).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The person's question, in their words.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cv_extension_url": {
                "description": "OffLadder's free CV extension, for questions about applying; otherwise null.",
                "type": ["string", "null"]
              },
              "guides": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "description": "The guide's direct answer.",
                      "type": "string"
                    },
                    "key_points": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "path": {
                      "description": "The guide's path on offladder.com, e.g. '/answers/tailor-cv-to-job-description'.",
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "sources": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
