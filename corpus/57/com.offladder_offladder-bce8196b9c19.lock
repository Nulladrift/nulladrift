        {
          "name": "read_career_guide",
          "title": "Read a whole OffLadder career guide",
          "description": "Returns the full text of one OffLadder career guide as Markdown: the direct answer, key takeaways, every section, worked examples and templates, the questions people also ask, and the sources. Suits someone who wants the step-by-step version of a guide rather than its short answer. Takes the guide's path or offladder.com link, e.g. '/answers/tailor-cv-to-job-description'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guide": {
                "description": "The guide's path or offladder.com link, e.g. '/answers/tailor-cv-to-job-description'.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["guide"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "question": {
                "type": "string"
              },
              "updated": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
