        {
          "name": "check_career_change_facts",
          "title": "Check career change facts with sources",
          "description": "Answers factual questions about changing jobs or careers, e.g. 'is it too late to change careers at 40', 'is 50 too old to switch careers', 'how many jobs does the average person have in a lifetime', 'how long do people stay with one employer', 'how many different careers are there', 'will AI make my skills outdated', 'how fast are job skills changing'. Returns exact quotes from primary sources (U.S. Bureau of Labor Statistics, O*NET, World Economic Forum) with links, or says plainly that no checked figure exists. Never returns an estimate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The person's question, in their words.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "continue_url": {
                "description": "The same link, as the suggested next step.",
                "type": "string"
              },
              "cta_label": {
                "description": "A short label for that link.",
                "type": "string"
              },
              "exact_match": {
                "description": "False when OffLadder holds no checked figure for the question.",
                "type": "boolean"
              },
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "publisher": {
                      "type": "string"
                    },
                    "quote": {
                      "description": "The source's own words, quoted exactly.",
                      "type": "string"
                    },
                    "related_guide": {
                      "description": "An offladder.com link.",
                      "type": "string"
                    },
                    "source_title": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["publisher", "quote", "related_guide", "source_title", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "start_url": {
                "description": "OffLadder's short onboarding, with a starting world picked if one was clear.",
                "type": "string"
              }
            },
            "required": ["continue_url", "cta_label", "exact_match", "facts", "start_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check career change facts with sources"
          },
          "behavior": {
