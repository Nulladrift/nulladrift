      "serverInfo": {
        "name": "offladder",
        "title": "OffLadder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OffLadder is a career-change coach that helps people test a career with small real-world experiments instead of personality labels. Its tools read OffLadder's published library: find_career_experiment for testing a named career, explore_career_directions for kinds of work that might suit someone's interests, check_career_change_facts for sourced figures about changing careers, find_career_guide for written guides on career changes, layoffs, AI and jobs, CVs and resumes, cover letters, applications and interviews, read_career_guide for the full text of one guide, browse_career_guides to list the guides on one subject, get_career_direction for the full write-up of one of OffLadder's emerging directions of work (or the list of all of them), and start_my_reading for a link to OffLadder's short onboarding when someone feels stuck. Results are possibilities to test, not a match or a verdict. None of the tools needs an account, and nothing sent to them is stored.",
      "tools": [
        {
          "name": "browse_career_guides",
          "title": "Browse OffLadder's career guides by topic",
          "description": "Lists every OffLadder career guide on one subject, as questions with links, so someone can see what there is to read before picking one, e.g. 'show me everything on interviews', 'what guides do you have for students', 'reading list for after a layoff', 'what do you have on AI and jobs'. Shelves: stuck (Not sure what to do next), career-change (Changing careers), layoffs (After a layoff), ai (AI, jobs and the future of work), applying (CVs, resumes and applications), interviews (Interviews, offers and pay), students (Students, graduates and first jobs). Without a topic it lists the shelves with how many guides each holds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "A shelf id such as 'applying' or 'layoffs', or a few words about the subject.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guides": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "url": {
                      "description": "An offladder.com link.",
                      "type": "string"
                    }
                  },
                  "required": ["path", "question", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "library_url": {
                "type": "string"
              },
              "shelves": {
                "description": "Every shelf, when no topic was given.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "guides": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["guides", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "topic": {
                "description": "The shelf listed, or null for a free-text match.",
                "type": ["string", "null"]
              }
            },
            "required": ["library_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
