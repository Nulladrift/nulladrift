          "description": "Finds a small way to try, test or get a feel for a career, job, trade or field before committing to it, for someone weighing whether to quit, retrain or switch into it, e.g. 'how do I know if I'd like UX design', 'try nursing before going back to school', 'test a career change this weekend', 'is product management right for me', 'a cheap way to see if I'd enjoy teaching', 'should I quit my job to become a data analyst', 'how can I try coding before a bootcamp', 'what's it really like to be an electrician'. Works for any named career. Returns one small real-world experiment that can be finished in an evening or a weekend, what is worth noticing, and a link to carry on with OffLadder's coach.",
