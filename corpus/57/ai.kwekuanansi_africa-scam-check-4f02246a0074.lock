{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/africa-scam-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/africa-scam-check"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-africa-scam-check",
        "title": "Africa Scam Check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Africa Scam Check compares a message or call about money with fraud patterns that banks, networks and public bodies in Kenya or Nigeria have described, and gives their reporting channels, each with its source. It does not judge a message: say so, never call a message fine, and never ask for a PIN or code. It cannot trace or recover money.",
      "tools": [
        {
          "name": "africa_scams.check_message",
          "title": "Check a message against known scam patterns in Kenya or Nigeria",
          "description": "Use this when someone in Kenya or Nigeria shares a text, a WhatsApp message, an email or an account of a phone call about mobile money, a bank, a prize, a job, an investment, a loan or a request for money, and wants to know which known fraud patterns it resembles. It returns the patterns the wording resembles, what the bodies that describe them say to do, and where to report, each with its source. It does not judge the message: say so, and never tell someone a message is fine because nothing matched. Do not use it for other countries, for legal advice, or to decide whether to pay. Leave any PIN, password or one-time code out of what you pass to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the message or call is about: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "message": {
                "description": "The message as received, or a short account of the call. Leave out any PIN, password or one-time code.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["country", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "read_on": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "resembles": {
                "type": "array"
              },
              "standing_advice": {
                "type": "array"
              },
              "warning_signs": {
                "type": "array"
              }
            },
            "required": ["country", "limits", "read_on", "report_to", "resembles", "standing_advice", "warning_signs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09a910f05979d7fdff747bbb22910879483816afd04e74b34820a29f893b4784"
        },
        {
          "name": "africa_scams.list_patterns",
          "title": "Common scams described in Kenya or Nigeria",
          "description": "Use this when someone asks which frauds the banks, mobile networks and public bodies of Kenya or Nigeria have described, or how a named one works (for example a fake reversal instruction, a one-ring call from abroad, or a message about your BVN). Do not use it for other countries, and do not present the list as complete: it covers patterns that were found described on the bodies' own pages. Do not use it to decide whether a message is fine.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the message or call is about: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "pattern": {
                "description": "One pattern's id, for its full description. Leave out for the list. Ids for kenya: bank_secret_request, bank_link_sms, sim_swap, cheap_goods_deal, advance_fee_payout, fake_payment_or_overpayment, one_ring_foreign_call, safaricom_impersonation, fake_reversal_instructions, win_or_cash_offer, threat_or_paid_information, fake_emergency_send_money, job_fee, kra_officer_bribe, fake_money_transfer_receipt, unlicensed_investment. Ids for nigeria: bvn_messages, bank_card_pin_otp_request, bank_verify_email_link, sim_swap, relative_name_money, unregistered_investment, loan_app_harassment, cloned_page_donation.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "patterns": {
                "type": "array"
              },
              "read_on": {
                "type": "string"
              },
              "standing_rules": {
                "type": "array"
              }
            },
            "required": ["country", "limits", "patterns", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd55c749271dc501ce9dfa6cf9e6eb991c0a562995531cf09dc0b385fe6dbe24"
        },
        {
          "name": "africa_scams.where_to_report",
          "title": "Where to report fraud in Kenya or Nigeria",
          "description": "Use this when someone in Kenya or Nigeria asks where to report fraud on a phone, a bank account or mobile money, or what the banks and authorities say to do after money or details have gone to a fraudster. It gives the reporting channels the bodies publish and the steps they give, each with its source. Do not use it for other countries or for legal advice, do not suggest that money will be recovered, and leave any PIN, password or one-time code out of what you pass to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the message or call is about: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "money_already_sent": {
                "description": "true if money or account details have already gone to the fraudster.",
                "type": "boolean"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "read_on": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "steps": {
                "type": "array"
              }
            },
            "required": ["country", "limits", "read_on", "report_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edad25c8f8d734057a1ae94473f78dcc0f4374600fc7e94fdbe0969f04002893"
        }
      ],
      "digest": "sha256:16f79d4b9d9bde8f3a9f436aa8e0ad409456688a185eb275189dd15d259a4333"
    }
  }
}
