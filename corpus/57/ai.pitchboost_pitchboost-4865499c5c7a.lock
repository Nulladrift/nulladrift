{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pitchboost/pitchboost": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.pitchboost.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pitchboost",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PitchBoost makes presentations: lessons and lectures, class and thesis presentations, reports, talks, and personalized, on-brand pitch decks, in any language. Use rebuild_deck to improve or redesign a deck the user already has (pass its slide text), or create_deck to generate one from a prompt; list_decks and get_deck to read your team's decks. Plans, upgrades and credits are managed at https://app.pitchboost.ai/dashboard/settings; give the user that link (not another path) when they ask to upgrade.",
      "tools": [
        {
          "name": "create_deck",
          "description": "Make a presentation in the user's PitchBoost account from a prompt: a lesson or lecture, a class or thesis presentation, a report or update, a talk or workshop, or a sales or investor pitch, in any language. Returns a shareable link. Generation takes up to ~60 seconds.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Deck type. Defaults to pitch_deck, a slide presentation for any purpose.",
                "enum": ["pitch_deck", "one_sheeter", "faq"],
                "type": "string"
              },
              "prompt": {
                "description": "What the presentation is about, who will see it, and what it should achieve. For a pitch, include the company, the offer and the prospect.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:586b028e9b1358db2839cf88b953e71956a505d7eb7255b45ec36eba95507d76"
        },
        {
          "name": "create_sample_deck",
          "title": "Create a sample deck (no account)",
          "description": "Make a hosted, shareable presentation from a short prompt with no PitchBoost account: a lesson or lecture, a class or thesis presentation, a report or update, a talk, or a sales or investor pitch, in any language. The deck carries a small PitchBoost badge and the response includes a single-use claim token the user can enter after signing in to move the deck into their own account. Use this when the user has not connected PitchBoost. Generation takes up to a minute.",
          "inputSchema": {
            "properties": {
              "prompt": {
                "description": "What the presentation is about, who will see it, and what it should achieve. For a pitch, include the company, the offer and the prospect. Up to 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a sample deck (no account)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:465dc2c483c87ead67af5148c9482aee8874b05e7005a58fda47bf879f80b0d0"
        },
        {
          "name": "get_deck",
          "description": "Get a single deck by its numeric id, including its shareable link and metadata.",
          "inputSchema": {
            "properties": {
              "deck_id": {
                "description": "The deck id.",
                "type": "number"
              }
            },
            "required": ["deck_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa8976ddbaf2521e34b9d9c5223025683b43240c998e2e93a5b572ac52c1372b"
        },
        {
          "name": "get_rebuild_status",
          "title": "Check a rebuild",
          "description": "Check whether a rebuild started with rebuild_deck has finished. Returns the shareable link and editor link when the deck is ready, or how long it has been running.",
          "inputSchema": {
            "properties": {
              "deal_id": {
                "description": "The deal_id returned by rebuild_deck.",
                "type": "number"
              }
            },
            "required": ["deal_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a rebuild"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55ac55f64d34dd67fd1ef287dc1f2e8bcb8717778c94ea5a6d091a5795ef531c"
        },
        {
          "name": "list_decks",
          "description": "List the most recent published decks for your team, each with its shareable link.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many to return (1-50, default 20).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List recent decks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70831b86a5b9db7a9ba996200cf662c454f362d2d78e39d4898e8ed6f70b5e6a"
        },
        {
          "name": "publish_deck",
          "title": "Publish a deck",
          "description": "Turn a deck's shareable link on. Rebuilt and generated decks go live at their share_url as soon as they are finished; use this when the user made one private and wants the link back. Not destructive and safe to repeat.",
          "inputSchema": {
            "properties": {
              "deck_id": {
                "description": "The deck id (from get_rebuild_status, list_decks or get_deck).",
                "type": "number"
              }
            },
            "required": ["deck_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Publish a deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e56836f5e9e7019b8b2984d903d0b5d9a7975af5cbcebca296ca827389cae83d"
        },
        {
          "name": "rebuild_deck",
          "title": "Rebuild an existing deck",
          "description": "Improve, redesign, polish or rebrand an existing presentation of any kind (coursework, a lecture, a report, a pitch) in any language. Pass the text of every slide of the user's uploaded PowerPoint, Google Slides or Keynote deck (title and body, in order). PitchBoost keeps the content and figures, rebuilds every slide with professional layout in the user's brand, checks every number against the source, and returns a shareable link (the PowerPoint and PDF download from the web app). Generation runs in the background for 2 to 4 minutes: this call returns a deal_id at once; call get_rebuild_status with it to get the link when ready.",
          "inputSchema": {
            "properties": {
              "deal_name": {
                "description": "Optional name for the deck in the user's dashboard. Defaults to the first slide title.",
                "maxLength": 80,
                "type": "string"
              },
              "instructions": {
                "description": "Optional guidance from the user, for example the audience, tone, or slides to emphasise. Up to 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              },
              "mode": {
                "description": "preserve (default) keeps one slide per source slide; condense compresses a long deck to about 10 to 15 slides.",
                "enum": ["preserve", "condense"],
                "type": "string"
              },
              "slides": {
                "description": "The source deck, one entry per slide in order. Extract these from the user's uploaded file: title is the slide heading if any, body is all other text on the slide.",
                "items": {
                  "properties": {
                    "body": {
                      "description": "All other text on the slide, including bullet points and chart labels.",
                      "maxLength": 3000,
                      "type": "string"
                    },
                    "title": {
                      "description": "Slide heading, if any.",
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["body"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slides"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Rebuild an existing deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5489a4183c7d6961b9c6d08b2a0da1b2e4314a466ef662689a895109692bd307"
        }
      ],
      "digest": "sha256:19df384167fc6e10f60986826b47acf2f46b476c9ed8b176c128e2c788137d77"
    }
  }
}
