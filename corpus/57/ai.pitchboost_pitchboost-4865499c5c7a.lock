          },
          "digest": "sha256:70831b86a5b9db7a9ba996200cf662c454f362d2d78e39d4898e8ed6f70b5e6a"
        },
        {
          "name": "publish_deck",
          "title": "Publish a deck",
          "description": "Turn a deck's shareable link on. Rebuilt and generated decks go live at their share_url as soon as they are finished; use this when the user made one private and wants the link back. Not destructive and safe to repeat.",
          "inputSchema": {
            "properties": {
              "deck_id": {
                "description": "The deck id (from get_rebuild_status, list_decks or get_deck).",
                "type": "number"
              }
            },
            "required": ["deck_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a9d4dd924fc9f35ace21cb9f62023f59dd6368eef10eeb59352b21dc6c8888e"
        },
        {
          "name": "rebuild_deck",
          "title": "Redesign an uploaded presentation",
          "description": "Use this when the user shares a presentation they already have (a PowerPoint, Google Slides or Keynote file) and wants it redesigned, improved, polished or put in their own brand. Pass the text of every slide in order (title and body). PitchBoost keeps the content and rebuilds each slide with a new layout, in the brand saved in the user's PitchBoost account or, when none is saved, in the logo, colors and fonts read from the address in website. Only the slide text is sent: pictures in the uploaded file are not carried over. The redesign runs in the background for a few minutes: this call returns a deal_id at once, and get_rebuild_status returns the share link when the deck is ready. If the deck is for a business, the account has no saved brand and no website was given, the first call starts nothing and returns one question to put to the user (their company's website, which they can skip); call again with the answer. PowerPoint, PDF and Google Slides versions come from the PitchBoost web app, depending on the account's plan. To make a new deck from a prompt, use create_deck.",
          "inputSchema": {
            "properties": {
              "deal_name": {
                "description": "Optional name for the deck in the user's dashboard. Defaults to the first slide title.",
                "maxLength": 80,
                "type": "string"
              },
              "instructions": {
                "description": "Optional guidance from the user, for example the audience, tone, or slides to emphasise. Up to 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              },
              "mode": {
                "description": "preserve (default) keeps one slide per source slide; condense compresses a long deck to about 10 to 15 slides.",
                "enum": ["preserve", "condense"],
                "type": "string"
              },
              "skip_website": {
                "description": "Set to true only when the user was asked for their website and chose to skip, or said they have none. The deck is then designed without a brand read from a website.",
                "type": "boolean"
              },
              "slides": {
                "description": "The source deck, one entry per slide in order. Extract these from the user's uploaded file: title is the slide heading if any, body is all other text on the slide.",
                "items": {
                  "properties": {
                    "body": {
                      "description": "All other text on the slide, including bullet points and chart labels.",
                      "maxLength": 3000,
                      "type": "string"
                    },
                    "title": {
                      "description": "Slide heading, if any.",
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["body"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "website": {
                "description": "The website of the business or organization presenting the deck (the user's own), for example acme.com. PitchBoost reads its logo, colors and fonts so the deck is in that brand. Pass only an address the user gave. Never a customer's, a prospect's or a source's website, and never a guess.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["slides"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Redesign an uploaded presentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0321a1d5e6e49daffe09c4d6bdb9824a6dafc122b87f1eb0f5456da6048f7e63"
        }
      ],
