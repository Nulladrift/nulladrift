      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PitchBoost generates personalized, on-brand pitch decks and sales presentations. Use rebuild_deck to improve or redesign a deck the user already has (pass its slide text), or create_deck to generate one from a prompt; list_decks and get_deck to read your team's decks.",
      "tools": [
        {
          "name": "create_deck",
          "title": "Make a new presentation",
          "description": "Use this when the user wants a new presentation made from a prompt in their connected PitchBoost account: a sales or investor pitch, a proposal, a report or update, a talk, or a lesson or class presentation, in any language. It is designed in the brand saved in the account or, when none is saved, in the logo, colors and fonts read from the address in website. It returns a share link at once: the deck is written in the background over a few minutes, and the link shows a progress page until it is ready. If the deck is for a business, the account has no saved brand and no website was given, the first call makes nothing and returns one question to put to the user (their company's website, which they can skip); call again with the answer. If the user has not connected a PitchBoost account, or declines to connect one, use create_sample_deck instead: it makes the same kind of deck with no account. To redesign a deck the user already has, use rebuild_deck.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Deck type. Defaults to pitch_deck, a slide presentation for any purpose.",
                "enum": ["pitch_deck", "one_sheeter", "faq"],
                "type": "string"
              },
              "prompt": {
                "description": "What the presentation is about, who will see it, and what it should achieve. For a pitch, include the company, the offer and the audience.",
                "maxLength": 4000,
                "type": "string"
              },
              "skip_website": {
                "description": "Set to true only when the user was asked for their website and chose to skip, or said they have none. The deck is then designed without a brand read from a website.",
                "type": "boolean"
              },
              "website": {
                "description": "The website of the business or organization presenting the deck (the user's own), for example acme.com. PitchBoost reads its logo, colors and fonts so the deck is in that brand. Pass only an address the user gave. Never a customer's, a prospect's or a source's website, and never a guess.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Make a new presentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1303c3f769d614f6e500450360c5a1d2b00b5bfe2f9d61ec78d8ef1ec393dde2"
        },
        {
          "name": "create_sample_deck",
          "title": "Make a presentation without an account",
          "description": "Use this when the user wants a new presentation made from a prompt and has not connected a PitchBoost account, or has declined to connect one: a sales or investor pitch, a proposal, a report or update, a talk, or a lesson or class presentation, in any language. It needs no sign-in. It returns a share link at once: the deck is written in the background over a few minutes, and the link shows a progress page until it is ready. With a website, the deck is designed in the logo, colors and fonts read from it. If the deck is for a business and no website was given, the first call makes nothing and returns one question to put to the user (their company's website, which they can skip); call again with the answer. The deck carries a small PitchBoost badge, and the response includes a single-use claim token the user can enter after signing in to move the deck into their own account. Redesigning a deck the user already has needs a connected account and rebuild_deck.",
          "inputSchema": {
            "properties": {
              "prompt": {
                "description": "What the presentation is about, who will see it, and what it should achieve. For a pitch, include the company, the offer and the audience. Up to 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              },
              "skip_website": {
                "description": "Set to true only when the user was asked for their website and chose to skip, or said they have none. The deck is then designed without a brand read from a website.",
                "type": "boolean"
              },
              "website": {
                "description": "The website of the business or organization presenting the deck (the user's own), for example acme.com. PitchBoost reads its logo, colors and fonts so the deck is in that brand. Pass only an address the user gave. Never a customer's, a prospect's or a source's website, and never a guess.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Make a presentation without an account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c63ea62b46f0facef576fb4eb60d279c0c473fc3acc9c79b97f1aeb34edf9658"
        },
        {
          "name": "get_deck",
          "description": "Get a single deck by its numeric id, including its shareable link and metadata.",
          "inputSchema": {
            "properties": {
              "deck_id": {
                "description": "The deck id.",
                "type": "number"
