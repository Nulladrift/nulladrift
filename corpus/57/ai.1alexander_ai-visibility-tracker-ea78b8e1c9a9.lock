        {
          "name": "get_prompt_answers",
          "title": "Get prompt answers",
          "description": "Read stored answers with named brands, deduplicated citations and answer text up to 4,000 characters by default. The truncated flag indicates clipped text. Set detail to full for complete text, stored citation rows and official citation annotations. Use list_engines to see which engines are available in the workspace. This tool never runs a model.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand_id": {
                "description": "Workspace brand ID, exact name, or domain.",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "detail": {
                "default": "compact",
                "description": "Use full for complete answer text and stored citation details.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "engine": {
                "description": "Filter to answers from this engine.",
                "enum": ["chatgpt", "gemini", "perplexity", "google_aio", "grok"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of results to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of results to skip.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "prompt_id": {
                "description": "Filter to this tracked prompt ID.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
