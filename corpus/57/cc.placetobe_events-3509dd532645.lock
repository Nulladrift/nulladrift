{
  "lockfileVersion": 2,
  "subjects": {
    "cc.placetobe/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://placetobe.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "cc.placetobe/events",
        "title": "Place to Be",
        "version": "1.0.0",
        "description": "Live, ranked events worldwide: what's on tonight, this weekend and this week in hundreds of cities.",
        "websiteUrl": "https://placetobe.cc"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Place to Be is a live, ranked listing of upcoming events worldwide: concerts, sport, festivals, nightlife, culture and city moments, merged from ticketing, sports and open-data feeds and refreshed daily. Each event carries a 0-100 score for how big a moment it is (expected crowd and timing) and a one-line reason. search_events answers what's-on questions for a city, a country or worldwide (now, tonight, this weekend, this week or later); list_cities shows which cities have listings; get_event returns one event in full. Times are local to each event, and time_announced is false when only the date is known. Every event has a page on placetobe.cc with its details and ticket links.",
      "tools": [
        {
          "name": "get_event",
          "title": "Get event details",
          "description": "Get one event in full: description, venue and address, coordinates, local start and end, score with its reason, and the ticketing or official source page. Pass an id from search_events, or an event URL from placetobe.cc.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The event id, or its placetobe.cc/place/... URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "type": ["string", "null"]
              },
              "area": {
                "description": "Neighbourhood or area of the venue.",
                "type": ["string", "null"]
              },
              "attribution": {
                "type": ["string", "null"]
              },
              "category": {
                "enum": ["music", "nightlife", "festival", "sports", "culture", "food", "community", "other"],
                "type": "string"
              },
              "city": {
                "type": ["string", "null"]
              },
              "country": {
                "type": ["string", "null"]
              },
              "description": {
                "description": "The source's description, trimmed.",
                "type": ["string", "null"]
              },
              "ends_at": {
                "description": "End, ISO 8601, when published.",
                "type": ["string", "null"]
              },
              "id": {
                "description": "Stable event id (use with get_event).",
                "type": "string"
              },
              "image": {
                "type": ["string", "null"]
              },
              "lat": {
                "type": ["number", "null"]
              },
              "lng": {
                "type": ["number", "null"]
              },
              "reason": {
                "description": "One line on why it scores as it does.",
                "type": ["string", "null"]
              },
              "score": {
                "description": "How big a moment it is (expected crowd and timing).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "source_url": {
                "description": "The ticketing or official page the listing came from.",
                "type": ["string", "null"]
              },
              "starts_at": {
                "description": "Start, ISO 8601.",
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["live", "soon", "upcoming", "ongoing", "ended"],
                "type": "string"
              },
              "subtitle": {
                "type": ["string", "null"]
              },
              "tier": {
                "description": "The score as a word: Legendary, Hot right now, Rising, Notable or On the radar.",
                "type": "string"
              },
              "time_announced": {
                "description": "False when the source published a date but no start time.",
                "type": "boolean"
              },
              "timezone": {
                "description": "IANA time zone of the venue.",
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The event's page on placetobe.cc.",
                "type": "string"
              },
              "venue": {
                "type": ["string", "null"]
              },
              "when": {
                "description": "Local date and time at the event, e.g. 'Sat 3 Oct, 20:00'.",
                "type": "string"
              }
            },
            "required": ["address", "area", "attribution", "category", "city", "country", "description", "ends_at", "id", "image", "lat", "lng", "reason", "score", "source_url", "starts_at", "status", "subtitle", "tier", "time_announced", "timezone", "title", "url", "venue", "when"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get event details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4eaf1218ad0264572cf8a1195a2127653a514b99b889a72cc8d4802e9f327c10"
        },
        {
          "name": "list_cities",
          "title": "List covered cities",
          "description": "List the cities that currently have a live events board, with how many upcoming events each holds, biggest first. Filter by part of a name or by country. Use it to check coverage or to find the exact city name before calling search_events.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "English country name or ISO 3166-1 alpha-2 code.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a city name, e.g. \"san\" or \"York\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "description": "ISO 3166-1 alpha-2.",
                      "type": ["string", "null"]
                    },
                    "country_name": {
                      "type": ["string", "null"]
                    },
                    "events": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["city", "country", "country_name", "events", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "total_cities": {
                "description": "Cities with a live board, before filtering.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["cities", "count", "total_cities"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:118de734b6b3c1926111774e71fb275e96ddeb6b6ac7448519bc27798f0f1e10"
        },
        {
          "name": "search_events",
          "title": "Find events",
          "description": "Find the events worth going to in a city, a country or worldwide, ranked by how big a moment each is (a 0-100 score from expected crowd and timing) or by start time, optionally only those matching a name (an artist, team, show or venue). Covers concerts, sport, festivals, nightlife, culture and city moments, merged from ticketing, sports and open-data feeds and refreshed daily. Use it for questions like \"what's on in Lisbon this weekend\", \"biggest concerts in London this week\", \"when are Arsenal at home\" or \"is Coldplay playing in Europe\". Each result has the local date and time, venue, score with a one-line reason, and a link to the event's page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Only these kinds of events. Omit for all.",
                "items": {
                  "enum": ["music", "nightlife", "festival", "sports", "culture", "food", "community", "other"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "city": {
                "description": "City name in English, e.g. \"London\", \"New York\", \"Mexico City\". Add the country after a comma when a name is shared (\"Paris, France\"). Omit city and country for worldwide. For the major cities, results also include the big events just outside the city line (SoFi Stadium in Inglewood for Los Angeles, MetLife Stadium for New York); each result names its own town.",
                "type": "string"
              },
              "country": {
                "description": "A whole country instead of one city: English name or ISO 3166-1 alpha-2 code (\"Netherlands\", \"NL\"). Ignored when city is given.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many events, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Only events whose title or venue contains this text: an artist, team, show or venue name, e.g. \"Coldplay\", \"Arsenal\", \"Madison Square Garden\". At least 2 characters.",
                "type": "string"
              },
              "sort": {
                "default": "biggest",
                "description": "biggest: highest score first. soonest: earliest start first.",
                "enum": ["biggest", "soonest"],
                "type": "string"
              },
              "when": {
                "default": "upcoming",
                "description": "now: on right now. tonight: the rest of today, local time. this_weekend: Friday 17:00 to Sunday night, local time. this_week: the next 7 days. upcoming: the next 160 days.",
                "enum": ["now", "tonight", "this_weekend", "this_week", "upcoming"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": ["string", "null"]
              },
              "board_url": {
                "description": "The live board for this place on placetobe.cc.",
                "type": "string"
              },
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "events": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "description": "Neighbourhood or area of the venue.",
                      "type": ["string", "null"]
                    },
                    "category": {
                      "enum": ["music", "nightlife", "festival", "sports", "culture", "food", "community", "other"],
                      "type": "string"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "ends_at": {
                      "description": "End, ISO 8601, when published.",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Stable event id (use with get_event).",
                      "type": "string"
                    },
                    "reason": {
                      "description": "One line on why it scores as it does.",
                      "type": ["string", "null"]
                    },
                    "score": {
                      "description": "How big a moment it is (expected crowd and timing).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "source_url": {
                      "description": "The ticketing or official page the listing came from.",
                      "type": ["string", "null"]
                    },
                    "starts_at": {
                      "description": "Start, ISO 8601.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "enum": ["live", "soon", "upcoming", "ongoing", "ended"],
                      "type": "string"
                    },
                    "tier": {
                      "description": "The score as a word: Legendary, Hot right now, Rising, Notable or On the radar.",
                      "type": "string"
                    },
                    "time_announced": {
                      "description": "False when the source published a date but no start time.",
                      "type": "boolean"
                    },
                    "timezone": {
                      "description": "IANA time zone of the venue.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The event's page on placetobe.cc.",
                      "type": "string"
                    },
                    "venue": {
                      "type": ["string", "null"]
                    },
                    "when": {
                      "description": "Local date and time at the event, e.g. 'Sat 3 Oct, 20:00'.",
                      "type": "string"
                    }
                  },
                  "required": ["area", "category", "city", "country", "ends_at", "id", "reason", "score", "source_url", "starts_at", "status", "tier", "time_announced", "timezone", "title", "url", "venue", "when"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "description": "The name filter, when one was given.",
                "type": ["string", "null"]
              },
              "scope": {
                "description": "Where: a city, a country, or 'worldwide'.",
                "type": "string"
              },
              "sort": {
                "enum": ["biggest", "soonest"],
                "type": "string"
              },
              "when": {
                "enum": ["now", "tonight", "this_weekend", "this_week", "upcoming"],
                "type": "string"
              }
            },
            "required": ["attribution", "board_url", "count", "events", "query", "scope", "sort", "when"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4102f31e22e539d683f36dbb242a0139e8f24fa1eb0501b4bda05fde6173d473"
        }
      ],
      "digest": "sha256:96431795ea1191957ada6cb75182471f4ff16f448105cd027a02b77b67f210d7"
    }
  }
