            "readOnly": true
          },
          "digest": "sha256:e459c58d67938318535be8163eafe0a2e7c798ade9b6304c51536a53fed33f2c"
        },
        {
          "name": "submit_sourcing_request",
          "title": "Submit a sourcing request for a person",
          "description": "Create a real request for a person who wants to buy and receive goods. Use ONLY with the person's permission and their real contact details: our team will contact them. Returns a reference and a PRIVATE tracking key: give both to the person and keep them private.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Your assistant's name, e.g. 'claude' or 'chatgpt' (shown to our team)",
                "maxLength": 30,
                "type": "string"
              },
              "budget": {
                "description": "e.g. 'US$2,000' or 'UGX 7,000,000'",
                "maxLength": 60,
                "type": "string"
              },
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "country": {
                "description": "Delivery country (Uganda is live; others go to route review)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "maxLength": 120,
                "type": "string"
              },
              "lane": {
                "description": "Optional preferred route for Uganda",
                "enum": ["cn-ug-air", "cn-ug-sea"],
                "type": "string"
              },
              "links": {
                "description": "Optional product links (https)",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "name": {
                "description": "The person's name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "person_consent": {
                "description": "true = the person agreed to be contacted by Galactic Bridge about this request",
                "type": "boolean"
              },
              "phone": {
                "description": "With country code, e.g. +256…",
                "maxLength": 30,
                "type": "string"
              },
              "product": {
                "description": "What they need: product, specifications, quality, any brand or model",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "quantity": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["country", "name", "person_consent", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
