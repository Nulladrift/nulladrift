          "digest": "sha256:472dae11c00b636ece9b537dd50c84fccd7542dde81af79e38d6fecab99037a2"
        },
        {
          "name": "track_request",
          "title": "Status of a request",
          "description": "Current status, next step, quote (if sent), amount due and shipment steps of a request, using its reference and private key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "private_key": {
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              },
              "reference": {
                "pattern": "^GB-[0-9A-F]{6}$",
                "type": "string"
              }
            },
            "required": ["private_key", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
