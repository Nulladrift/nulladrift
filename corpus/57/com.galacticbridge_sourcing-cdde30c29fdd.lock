{
  "lockfileVersion": 2,
  "subjects": {
    "com.galacticbridge/sourcing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://galacticbridge.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.galacticbridge/sourcing",
        "title": "Galactic Bridge: sourcing and delivery to Africa",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Galactic Bridge finds products in the world's markets (mainly China and India; cars from Japan, the UK, South Africa and Thailand), checks the supplier and the goods, ships, clears customs and delivers, for one price that includes freight, insurance and all import taxes. Delivery is live to Uganda; other destinations are recorded for route review and are not quoted yet. Use estimate_delivered_cost for planning prices, submit_sourcing_request ONLY with the person's permission and contact details, then track_request with the private key you receive. The person (not the agent) accepts a quote; payment goes only to the company through get_payment_options / create_payment_link. Suppliers, forwarders and clearing agents can apply with apply_as_supplier; the company confirms by email and is verified by two team members before it receives work.",
      "tools": [
        {
          "name": "apply_as_supplier",
          "title": "Apply as a supplier or logistics partner",
          "description": "For a company (factory, sourcing agent, freight forwarder, clearing agent, insurer, inspection company) that wants to receive matching buyer requests. Use only for a company you represent, with its real business email. The company confirms by a link sent to that email, completes its details, and two team members verify the evidence before any request is sent. Free; orders are not guaranteed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "maxLength": 30,
                "type": "string"
              },
              "business_email": {
                "description": "The company's own business email",
                "maxLength": 120,
                "type": "string"
              },
              "company_consent": {
                "description": "true = the company agreed to receive relevant quotation requests by email",
                "type": "boolean"
              },
              "company_name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "contact_person": {
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "2-letter registration country",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "legal_name": {
                "description": "Registered company name",
                "maxLength": 160,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "products_or_services": {
                "description": "What you supply, or for logistics: routes, clearing, inland delivery, insurance, inspection",
                "maxLength": 1200,
                "minLength": 3,
                "type": "string"
              },
              "registration_number": {
                "maxLength": 80,
                "type": "string"
              },
              "registry_url": {
                "description": "https:// link to the official company register entry",
                "maxLength": 400,
                "type": "string"
              },
              "type": {
                "enum": ["manufacturer", "agent", "forwarder", "clearing", "insurer", "inspector"],
                "type": "string"
              },
              "website": {
                "description": "https:// address",
                "maxLength": 400,
                "type": "string"
              }
            },
            "required": ["business_email", "company_consent", "company_name", "country", "products_or_services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14b703fc48423b64d8f222770583770f02879eb5079c3d43e0e15417d3f92a4a"
        },
        {
          "name": "classify_product",
          "title": "Tariff code and import rules (Uganda)",
          "description": "Find the East African Community tariff code, the Uganda duty and the import checks (standards, permits) for a product description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the product is, in plain words (e.g. '10W solar lantern with USB')",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "origin_country": {
                "description": "2-letter country of origin, default CN",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fe72aab9fe92c633c9774bc894bdd6c4b5a3d9a06bcb11fb57a733ebcf1f0f5"
        },
        {
          "name": "create_payment_link",
          "title": "Secure payment link (card / mobile money)",
          "description": "Create a secure Flutterwave payment page for the amount still due (UGX: MTN, Airtel or card; USD: card). Use only with the person's instruction. Payment is confirmed with Flutterwave before it counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "enum": ["UGX", "USD"],
                "type": "string"
              },
              "private_key": {
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              },
              "reference": {
                "pattern": "^GB-[0-9A-F]{6}$",
                "type": "string"
              }
            },
            "required": ["private_key", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5ae052c6497f312688fd2e4f07a1b6a460fc11c7e94a4228baa0bcb65515297"
        },
        {
          "name": "estimate_delivered_cost",
          "title": "Delivered-cost estimate to Uganda",
          "description": "Planning estimate of the full delivered price in Uganda: goods, freight, insurance, import duty, VAT, levies and our fee. It is NOT a final quote: final quotes need written supplier and shipping prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Duty band; use classify_product for the exact code",
                "enum": ["raw", "intermediate", "finished", "unsure"],
                "type": "string"
              },
              "cbm": {
                "description": "Volume in cubic metres (needed for sea)",
                "minimum": 0,
                "type": "number"
              },
              "goods_usd": {
                "description": "Goods value at the factory in US$",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "inspection": {
                "description": "Add a factory inspection before shipping",
                "type": "boolean"
              },
              "lane": {
                "description": "China to Uganda by air or by sea",
                "enum": ["cn-ug-air", "cn-ug-sea"],
                "type": "string"
              },
              "weight_kg": {
                "description": "Air: actual weight in kg",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["goods_usd", "lane"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1546ce20d40c07aff5e6423dd10748dc1f2a2545a9a654e221e2536f673701bb"
        },
        {
          "name": "get_payment_options",
          "title": "How to pay for a request",
          "description": "Amount still due, the order reference to quote, and the company's payment accounts (only accounts in the company's registered name). Pay only these.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "private_key": {
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              },
              "reference": {
                "pattern": "^GB-[0-9A-F]{6}$",
                "type": "string"
              }
            },
            "required": ["private_key", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32860fe302b59b74a7c266d59ebe9cbf0fb785bf4f59d85350aabbc1d5ac4ae7"
        },
        {
          "name": "get_service_info",
          "title": "What Galactic Bridge does",
          "description": "Scope, destinations, how ordering and payment work, safety rules and contacts. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64a65ad07836afb793b6d76b6679a122e51a15b752d54fce3e5124b52f3650a2"
        },
        {
          "name": "list_routes",
          "title": "Routes and their status",
          "description": "Shipping routes (lanes) with mode and status. Only lanes with status 'accepting' can be estimated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
