{
  "lockfileVersion": 2,
  "subjects": {
    "com.humanslikestuff/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.humanslikestuff.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "HumansLikeStuff",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use request only for a new outcome-shaped US physical request that needs HLS sourcing, personalization, multi-recipient handling, or coordination. If a known SKU and merchant make direct checkout straightforward, use the direct merchant instead. Before request, ask the human for their real contact email; never invent one. Save the returned request_id and use status with that exact ID. Humans approve payments; agents never authorize charges. Wait on manual work instead of creating duplicates.",
      "tools": [
        {
          "name": "request",
          "title": "Create an HLS request",
          "description": "Create one new HLS request to the human-operated service for a safe US physical outcome that benefits from sourcing, personalization, multiple recipients, or coordination—not general advice. Ask the human for a real contact_email and never fabricate one. Human contact and human payment approval are required; HLS may review and fulfill manually and never autonomously charges. If the exact SKU and merchant are known and direct agent checkout is straightforward, prefer direct merchant execution. Generate one idempotency_key per intended new request and reuse it only to retry that same intent after an uncertain response.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "additional_constraints": {
                "description": "Optional material, quantity, timing, packaging, or coordination constraints supplied by the human.",
                "maxLength": 4000,
                "type": "string"
              },
              "arrival_deadline": {
                "description": "Optional requested US arrival date; a constraint, not a delivery promise.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "artwork_references": {
                "description": "Optional artwork-reference URLs; HLS records them but does not fetch them during request intake.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "branding_or_personalization": {
                "description": "Optional human-provided branding or personalization requirements.",
                "maxLength": 4000,
                "type": "string"
              },
              "budget_cents": {
                "description": "Optional human-provided total budget in US cents; not a quote or authorization.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "contact_email": {
                "description": "Ask the human for their real contact email for questions, quote approval, and payment instructions. Never invent, infer, or substitute an agent email.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Client-generated canonical UUID v4 for one intended new request. Reuse only to retry that same intent after an uncertain response.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "message": {
                "description": "Optional human-provided recipient message.",
                "maxLength": 2000,
                "type": "string"
              },
              "outcome": {
                "description": "Describe the desired safe US physical outcome, especially sourcing, personalization, multiple recipients, or coordination—not general advice or a known-SKU checkout.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "payment_approval_context": {
                "description": "Optional human approval context only. Never include card, bank-account, password, or secret data.",
                "maxLength": 1000,
                "type": "string"
              },
              "recipient_count": {
                "description": "Optional number of human recipients, from 1 through 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "shipping_addresses": {
                "description": "Optional exact US shipping destinations supplied by the human.",
                "items": {
                  "additionalProperties": false,
                  "description": "One complete US shipping destination supplied by the human.",
                  "properties": {
                    "address_line_1": {
                      "description": "Primary street-address line for this US destination.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "address_line_2": {
                      "description": "Optional secondary address line, such as a suite or unit.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "city": {
                      "description": "US destination city.",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "company": {
                      "description": "Optional company or organization at this US destination.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "postal_code": {
                      "description": "Five-digit or ZIP+4 US postal code.",
                      "pattern": "^\\d{5}(?:-\\d{4})?$",
                      "type": "string"
                    },
                    "recipient_name": {
                      "description": "Human recipient name for this US destination.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "state": {
                      "description": "Two-letter US state code.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["address_line_1", "city", "postal_code", "recipient_name", "state"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "shipping_country": {
                "const": "US",
                "description": "HLS v0 ships only within the United States; use exactly US.",
                "type": "string"
              }
            },
            "required": ["contact_email", "idempotency_key", "outcome", "shipping_country"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accepted": {
                "description": "True means the request was recorded without automatic decline; it is not a fulfillment promise.",
                "type": "boolean"
              },
              "agent_authorized_charge": {
                "const": false,
                "description": "Always false; an agent cannot authorize payment.",
                "type": "boolean"
              },
              "external_payment_available": {
                "description": "True only when this exact request exposes a usable live human-payment path.",
                "type": "boolean"
              },
              "human_action_required": {
                "description": "True only when the requesting human must answer a question or approve an available live payment.",
                "type": "boolean"
              },
              "next_action": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Bounded human-readable next-step guidance."
              },
              "next_action_code": {
                "description": "Stable machine-readable code for the next supported action.",
                "type": "string"
              },
              "payment_mode": {
                "description": "Configured Stripe mode for this response.",
                "enum": ["test", "live"],
                "type": "string"
              },
              "request_id": {
                "description": "Opaque HLS request ID to save for exact-ID status checks.",
                "type": "string"
              },
              "state": {
                "description": "Current durable HLS request state.",
                "enum": ["received", "needs_information", "quoting", "awaiting_payment", "paid", "fulfilling", "shipped", "delivered", "manual_review", "exception", "cancelled", "declined"],
                "type": "string"
              },
              "terminal": {
                "description": "True only when no further lifecycle change is expected.",
                "type": "boolean"
              }
            },
            "required": ["accepted", "agent_authorized_charge", "external_payment_available", "human_action_required", "next_action", "next_action_code", "payment_mode", "request_id", "state", "terminal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an HLS request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b77cde5561131839a0c6afd85c0c6e7d68d954117f9c341562408e2ff961ab2"
        },
        {
          "name": "status",
          "title": "Check an HLS request",
          "description": "Existing exact HLS request ID only: read-only lifecycle lookup. It does not create or modify a request/order or authorize payment. For long-running or manual work, check status or wait rather than creating another request. Returns only bounded public state, question, quote/payment instruction, fulfillment/shipping update, and next action; it does not list or search requests.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "Exact opaque request_id previously returned by HLS; no list, search, or email lookup is available.",
                "pattern": "^req_[A-Za-z0-9_-]{32}$",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fulfillment_notes": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "human_action_required": {
                "description": "True only when the requesting human must answer a question or approve an available live payment.",
                "type": "boolean"
              },
              "next_action": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "next_action_code": {
                "description": "Stable machine-readable code for the next supported action.",
                "type": "string"
              },
              "open_question": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "payment": {
                "additionalProperties": false,
                "properties": {
                  "agent_authorized_charge": {
                    "const": false,
                    "type": "boolean"
                  },
                  "approval": {
                    "const": "human_only",
                    "type": "string"
                  },
                  "external_payment_available": {
                    "description": "True only when this exact request exposes a usable live human-payment path.",
                    "type": "boolean"
                  },
                  "mode": {
                    "description": "Configured Stripe mode for this status response.",
                    "enum": ["test", "live"],
                    "type": "string"
                  },
                  "required": {
                    "type": "boolean"
                  },
                  "status": {
                    "anyOf": [
                      {
                        "enum": ["unpaid", "failed", "paid", "refund_pending", "refunded", "refund_failed", "cancelled", "expired"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["agent_authorized_charge", "approval", "external_payment_available", "mode", "required", "status", "url"],
                "type": "object"
              },
              "quote": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "execution_fee_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "expires_at": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "merchandise_fulfillment_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "shipping_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "tax_fees_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "total_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["currency", "execution_fee_cents", "expires_at", "merchandise_fulfillment_cents", "shipping_cents", "tax_fees_cents", "total_cents"],
                "type": "object"
              },
              "request_id": {
                "description": "Exact opaque HLS request ID supplied by the caller.",
                "type": "string"
              },
              "shipping": {
                "additionalProperties": false,
                "properties": {
                  "carrier": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "tracking_number": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "tracking_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["carrier", "tracking_number", "tracking_url"],
                "type": "object"
              },
              "state": {
                "description": "Current durable HLS request state.",
                "enum": ["received", "needs_information", "quoting", "awaiting_payment", "paid", "fulfilling", "shipped", "delivered", "manual_review", "exception", "cancelled", "declined"],
                "type": "string"
              },
              "terminal": {
                "description": "True only when no further lifecycle change is expected.",
                "type": "boolean"
              },
              "updated_at": {
                "type": "string"
              }
            },
            "required": ["fulfillment_notes", "human_action_required", "next_action", "next_action_code", "open_question", "payment", "quote", "request_id", "shipping", "state", "terminal", "updated_at"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an HLS request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:808280bfaf2af546c973ac068106a0d75592d7ba824e4f14d9b23698af70fe6c"
        }
      ],
      "digest": "sha256:019407dd81ca9ccdc3aeb367be0ca2d9ecdd92c0d86ce0e44aecaeb69136f9f5"
    }
  }
