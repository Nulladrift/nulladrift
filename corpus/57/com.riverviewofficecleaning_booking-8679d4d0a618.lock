        },
        {
          "name": "list_walkthrough_slots",
          "title": "List walkthrough times",
          "description": "Open start times for a free 45-minute on-site walkthrough, in America/New_York time. Times are bookable from 24 hours from now up to 21 days out.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days to look across. Defaults to 7.",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "First day to look at, YYYY-MM-DD. Defaults to the earliest bookable day.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
