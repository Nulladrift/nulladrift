      "serverInfo": {
        "name": "riverview-office-cleaning",
        "title": "Riverview Office Cleaning",
        "version": "1.0.1",
        "websiteUrl": "https://www.riverviewofficecleaning.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Riverview Office Cleaning cleans small offices in Cuyahoga County, Ohio and Summit County, Ohio. Use these tools to answer questions about the business and to book a free on-site walkthrough. Never quote a price: quotes are only given after the walkthrough. Before book_walkthrough, confirm the time and contact details with the person you are helping.",
      "tools": [
        {
          "name": "book_walkthrough",
          "title": "Book a walkthrough",
          "description": "Books a free on-site walkthrough at a time from list_walkthrough_slots, on behalf of the person you are helping. Confirm the time and every detail with them before calling. The office is emailed, and a confirmation goes to the email given. Status \"booked\" means it is on the calendar; \"requested\" means the office will call to confirm; \"unavailable\" means pick another slot.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Office street address.",
                "type": "string"
              },
              "approx_sqft": {
                "description": "Approximate office size in square feet, if known.",
                "minimum": 1,
                "type": "integer"
              },
              "city": {
                "description": "Office city; must be in the service area.",
                "type": "string"
              },
              "company": {
                "description": "Business name, if any.",
                "type": "string"
              },
              "email": {
                "description": "Contact email; the confirmation is sent here.",
                "format": "email",
                "type": "string"
              },
              "name": {
                "description": "Contact person's full name.",
                "type": "string"
              },
              "notes": {
                "description": "Anything the crew should know: cleaning frequency wanted, access, special areas.",
                "type": "string"
              },
              "phone": {
                "description": "Contact phone number.",
                "type": "string"
              },
              "slot_start": {
                "description": "The exact \"start\" value of a slot from list_walkthrough_slots.",
                "type": "string"
              }
            },
            "required": ["address", "city", "email", "name", "phone", "slot_start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f062b5428fea8568053703a78c88e2e16df4ec065c7a8ebdfe2dd39a41d12e6"
        },
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Whether Riverview regularly serves a city. Walkthroughs can only be booked online for cities in the service area.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, e.g. \"Solon\" or \"Solon, OH\".",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
