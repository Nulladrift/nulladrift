        },
        {
          "name": "get_business_info",
          "title": "Business info",
          "description": "Riverview Office Cleaning's services, contact details, hours, service area, and how pricing works. Prices are only quoted after a free on-site walkthrough; the published per-square-foot range is a guide, not a quote.",
          "inputSchema": {
            "properties": {},
            "type": "object"
