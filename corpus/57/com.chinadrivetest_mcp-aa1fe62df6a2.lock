        {
          "name": "generate_dmv_license_translation_and_class_map",
          "title": "Chinese Driver License Translation Sheet & Vehicle Class Mapper",
          "description": "Convert overseas license categories to PRC C1, C2, or E/D equivalents, deterministically synthesize an official 3-character Chinese applicant name, and output a structured DMV filing dossier.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "foreignLicenseClass": {
                "description": "License class printed on home license (e.g., \"Class C\", \"Automatic only\", \"Class M Motorcycle\").",
                "type": "string"
              },
              "fullName": {
                "description": "Applicant full Latin name exactly as shown on foreign passport (e.g., \"John David Smith\").",
                "type": "string"
              },
              "gender": {
                "description": "Preferred naming character pool when synthesizing the 3-character Chinese name.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "issuingCountry": {
                "description": "Country/state that issued the original driver license.",
                "type": "string"
              },
              "nationality": {
                "description": "Passport nationality for translation form header.",
                "type": "string"
              },
              "originalLicenseNumber": {
                "description": "Alphanumeric license number printed on the foreign driving permit.",
                "type": "string"
              }
            },
            "required": ["fullName"],
            "type": "object"
