      "instructions": "Query 2,545 bilingual China Subject 1 driving exam questions, SM-2 spaced repetition, MPS Order No. 172 foreign license mutual swap rules, 9 airport 15-minute permit counters, and 5 municipal DMV guides. Source: https://chinadrivetest.com",
      "tools": [
        {
          "name": "evaluate_foreign_license_conversion_and_mutual_swap",
          "title": "MPS Order No. 172 Mutual Recognition & Permit vs 6-Year License Evaluator",
          "description": "Determine whether an overseas driver qualifies for a zero-exam bilateral swap across 6 treaty jurisdictions, a 15-minute airport tourist permit, or a 6-year C1/C2 conversion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "applicantAge": {
                "description": "Driver age in years; checks C1/C2 zero upper age ceiling and age 70+ cognitive Three Abilities test under Order No. 172.",
                "type": "number"
              },
              "holdsChinaResidencePermit": {
                "description": "Whether the applicant holds a Chinese Work, Study, or Family Residence Permit valid for 90+ days.",
                "type": "boolean"
              },
              "issuingJurisdiction": {
                "description": "Country or SAR issuing the current valid foreign license (e.g., \"France\", \"Belgium\", \"UAE\", \"Serbia\", \"Hong Kong\", \"Macau\", \"USA\", \"UK\").",
                "type": "string"
              },
              "stayDurationDays": {
                "description": "Planned stay duration in Mainland China measured in days (temporary permit covers up to 90 days per entry).",
                "type": "number"
              }
            },
            "required": ["issuingJurisdiction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "MPS Order No. 172 Mutual Recognition & Permit vs 6-Year License Evaluator"
