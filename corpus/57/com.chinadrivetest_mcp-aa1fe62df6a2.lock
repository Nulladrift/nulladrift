        {
          "name": "grade_mock_exam_and_sm2_schedule",
          "title": "Subject 1 Mock Exam Grader & SuperMemo-2 Spaced Repetition Engine",
          "description": "Score candidate answer sheets against the 90/100 statutory pass cutoff while computing updated SuperMemo-2 review intervals, or generate a weighted practice drill sheet by chapter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chapterSlug": {
                "description": "Optional syllabus chapter filter when generating a fresh practice quiz sheet.",
                "enum": ["all", "traffic-signs", "speed-limits", "point-deduction-rules", "police-hand-signals", "alcohol-drunk-driving", "expressway-rules", "accident-procedures", "ev-green-plate-rules", "general-laws"],
                "type": "string"
              },
              "generateDrillCount": {
                "description": "When submissions are omitted, number of high-trap questions to emit for a timed drill (5 to 25).",
                "type": "number"
              },
              "includeAnswerKey": {
                "description": "Whether freshly generated drill questions include answers and explanations immediately.",
                "type": "boolean"
              },
              "submissions": {
                "description": "Candidate answers to grade against the 2,545-question official answer key with optional prior SM-2 card state.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currentEase": {
                      "description": "Prior SM-2 ease factor between 1.3 and 3.0 (defaults to 2.5).",
                      "type": "number"
                    },
                    "currentInterval": {
                      "description": "Prior SM-2 spacing interval in days before this attempt (defaults to 0).",
                      "type": "number"
                    },
                    "currentReps": {
                      "description": "Prior consecutive correct repetitions for this SM-2 card (defaults to 0).",
                      "type": "number"
                    },
                    "questionId": {
                      "description": "Question ID string or numeric question index (1-2545) from the Subject 1 bank.",
                      "type": "string"
                    },
                    "selectedAnswer": {
                      "description": "Candidate choice letter (\"A\", \"B\", \"C\", or \"D\").",
                      "type": "string"
                    }
                  },
                  "required": ["questionId", "selectedAnswer"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
