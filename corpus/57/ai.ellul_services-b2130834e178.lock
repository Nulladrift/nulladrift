{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ellul/services": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ellul.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ellul.ai",
        "title": "ellul.ai services and agency prices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ellul.ai is an agency that does technical work for businesses at fixed prices. Use search_services to find what a business needs, get_service for the full detail and price, get_market_prices for what other agencies publish, and how_to_get_a_quote for the page where the person asks. If the person asks you to request a quote for them, request_quote emails them a confirmation; nothing is requested until they press it.",
      "tools": [
        {
          "name": "get_market_prices",
          "title": "What agencies publish as their price",
          "description": "What agencies publish as their price for a kind of work (for example 'seo', 'ppc', 'web-design'): the median, the middle half and every published price with the agency's page it was read from. Call with no service to list the kinds of work covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "The market id, e.g. 'seo'. Omit to list them.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8174e1d62f10c8870483394e89703415791c5e52eab92b5cde72bfeafd8e573"
        },
        {
          "name": "get_service",
          "title": "Get one service in full",
          "description": "One ellul.ai service in full, as markdown: its fixed price and term, what is included, the buyer's questions answered (cost, who offers it at a fixed price, contract, how to get a quote), what other providers publish for the same work with sources, what is paid separately, what the buyer supplies, the limits and the rules that apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The service id from search_services, e.g. 'hacked-website-repair'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ea0e91d96b900bde60236f801438d9270e2a2e0ca451871aaade49c7b0ad4a6"
        },
        {
          "name": "how_to_get_a_quote",
          "title": "How to ask for a quote",
          "description": "How a business asks ellul.ai for a written fixed quote for a service: the page to ask on, what it asks for and what comes back. This tool sends nothing; the person asks on the page themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The service id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:986dbb9b3540f99ce818e10766c08be33d208efea1e2fb9ec3aa7a2cf79dd1e5"
        },
        {
          "name": "request_quote",
          "title": "Send a quote request for the person to confirm",
          "description": "Ask ellul.ai for a written fixed quote on a person's behalf. Use ONLY when the person has asked you to request the quote and has given you their own name and email. This sends ONE email to that person asking them to confirm; nothing reaches ellul.ai and nothing is requested until they press the link in it, so always tell them to check their inbox. One request to an address a day. If they would rather ask themselves, use how_to_get_a_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Their business name, if given",
                "type": "string"
              },
              "email": {
                "description": "The person's own email address; the confirmation is sent here",
                "type": "string"
              },
              "name": {
                "description": "The person's own name",
                "type": "string"
              },
              "note": {
                "description": "What they need, in their words (up to 1,000 characters)",
                "type": "string"
              },
              "person_asked": {
                "description": "Must be true: the person asked you to send this request and gave you these details",
                "type": "boolean"
              },
              "phone": {
                "description": "Their phone number, if they gave one",
                "type": "string"
              },
              "services": {
                "description": "Service ids from search_services",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["email", "name", "person_asked", "services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d5a3233d688dafd7443eda3b56a49e4c77ea62922bcc0037908f5997761a777"
        },
        {
          "name": "search_services",
          "title": "Search ellul.ai services",
          "description": "Find ellul.ai services by what a business needs (for example 'hacked website', 'suspended Google Business Profile', 'CRM migration'). Returns each match's fixed price in GBP, how it is charged, how long it takes and its page. ellul.ai is an agency that does the work in-house for a fixed price agreed in writing; it is for businesses buying a service, not a job board.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the business needs, in plain words",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e03bc9bcbcc52784772b215c29532b82b3380979ae48931992deaa9b476a2d02"
        }
      ],
      "digest": "sha256:17d1cdfdc23b7dc07c99f1fd4f0966027c851522f875a7678cf25a5d6b289f96"
    }
  }
}
