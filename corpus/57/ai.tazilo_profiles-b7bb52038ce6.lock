{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tazilo/profiles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tazilo.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tazilo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tazilo hosts verified professional profiles at tazilo.ai/@handle. Pass the handle or the whole profile URL - \"sathishgs\", \"@sathishgs\" and \"https://tazilo.ai/@sathishgs\" all work; there is no search, so you need the link from a resume, a message or the person. Use get_profile to read the profile (optionally only some sections), and ask for one short factual question, such as their leadership experience. Everything returned is what the person chose to publish.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask about a Tazilo profile",
          "description": "Ask one short factual question about a person's professional background - e.g. their leadership experience, a launch they shipped or the tools they use - by Tazilo profile URL or handle. Answers come only from what they published.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "handle": {
                "description": "The person's Tazilo profile URL or handle: 'https://tazilo.ai/@sathishgs', 'tazilo.ai/@sathishgs', '@sathishgs' or 'sathishgs'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "question": {
                "description": "One short factual question about their professional background (max 300 characters).",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["handle", "question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:163755b0a89f26f6fd1cf6093115a0aa8a65b827141b381439b40bf069400ac0"
        },
        {
          "name": "get_profile",
          "title": "Get a Tazilo profile",
          "description": "Get a person's verified professional profile - headline, summary, employment history with highlights, skills and education - from their Tazilo profile URL or handle. Returns markdown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "handle": {
                "description": "The person's Tazilo profile URL or handle: 'https://tazilo.ai/@sathishgs', 'tazilo.ai/@sathishgs', '@sathishgs' or 'sathishgs'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "Only these sections. Omit for the whole profile.",
                "items": {
                  "enum": ["summary", "experience", "skills", "education", "context"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1542f3168835ce7c44a27b9c31bd304e3ad9ecdfe56488610aee87087c7af9f3"
        }
      ],
      "digest": "sha256:f7fc27f6877a560e53f632c273c7260b1c9047a53ca388a5211d5ced03d4e356"
    }
  }
}
