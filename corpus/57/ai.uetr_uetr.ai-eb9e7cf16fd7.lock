        {
          "name": "list_transfers",
          "title": "List transfers",
          "description": "List the transfers in this account with their current status, newest first (the dashboard's default order), one page at a time. Paid transfers come in the full view and the rest in the free view, as the dashboard shows them. Archived transfers are left out unless asked for. Pass next_cursor as cursor until it is null. The list holds no bank report times: last_checked_at is when the transfer was last checked, not when a bank last reported; get_transfer gives the newest bank report time. Reading changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "archived": {
                "default": "exclude",
                "description": "exclude (default): active transfers. include: all. only: archived transfers.",
                "enum": ["exclude", "include", "only"],
                "type": "string"
              },
              "cursor": {
                "description": "The next_cursor of the previous page.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Transfers per page, 1 to 100. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "next_cursor": {
                "description": "Pass as cursor for the next page; null on the last.",
                "type": ["string", "null"]
              },
              "transfers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "added_at": {
                      "description": "When the transfer was added.",
                      "format": "date-time",
                      "type": "string"
                    },
                    "amount": {
                      "additionalProperties": false,
                      "description": "The amount entered for the search, as last corrected by the account owner. bank_reported_amount is what a bank reported.",
                      "properties": {
                        "currency": {
                          "description": "ISO 4217 currency code.",
                          "type": "string"
                        },
                        "value": {
                          "description": "The amount in the supplied currency's major units, not minor units. For example, 129600 USD means USD 129,600.00.",
                          "type": "number"
                        }
                      },
                      "required": ["currency", "value"],
                      "type": "object"
                    },
                    "archived": {
                      "description": "True when the transfer is archived.",
                      "type": "boolean"
                    },
                    "bank_reported_amount": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "currency": {
                              "description": "ISO 4217 currency code.",
                              "type": "string"
                            },
                            "payment_date": {
                              "type": ["string", "null"]
                            },
                            "value": {
                              "description": "The amount in the supplied currency's major units, not minor units. For example, 129600 USD means USD 129,600.00.",
                              "type": "number"
                            }
                          },
                          "required": ["currency", "payment_date", "value"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The latest amount a bank reported, with its value date. When no bank stated a currency, the currency is the one entered for the search. A free transfer's figure is the one its free tracker shows, from the reports revealed so far."
                    },
                    "check_frequency_minutes": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "How often this transfer's own checks run, in the full view; null when it has none scheduled."
                    },
                    "checks_finished": {
                      "description": "True when no automatic check is scheduled: a final outcome, an archived transfer, or a closed monitoring window. list_transfers judges the transfer's own entry, as the dashboard shows it; get_transfer judges every lookup of the UETR, as the timeline does.",
                      "type": "boolean"
                    },
                    "id": {
                      "description": "The transfer's id in this account.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "label": {
                      "description": "The account's own label for the transfer.",
                      "type": ["string", "null"]
                    },
                    "last_checked_at": {
                      "description": "When the transfer was last checked, within this account's own monitoring of it: never before added_at, and never after its checks ended.",
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "monitoring_until": {
                      "description": "When this transfer's monitoring window ends or ended (at archiving, if earlier): the paid window, or for a free transfer its free checking window. Checks can finish before it, and a paid transfer still inside its free checking window keeps free checks after it; checks_finished says whether any is scheduled.",
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "payment_date": {
                      "description": "The payment date entered for the search, as last corrected by the account owner.",
                      "type": "string"
                    },
                    "position_sentence": {
                      "description": "get_transfer only, in the full view: the payment position from its status and verified route. A reporting bank alone never establishes a position. list_transfers and webhook events leave it out.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "The transfer's current status.",
                      "enum": ["searching", "not_found", "check_failed", "in_transit", "on_hold", "credited", "rejected", "returned", "cancelled"],
                      "type": "string"
                    },
                    "status_code": {
                      "description": "The latest ISO 20022 status code, in the full view only: the one the transfer's timeline shows as its status, the same in get_transfer, list_transfers and webhook events. In get_transfer it is the code of the last event that carries one, unless a final outcome is kept after its report is no longer listed.",
                      "type": ["string", "null"]
                    },
                    "status_explanation": {
                      "description": "What the status code means, in plain English.",
                      "type": ["string", "null"]
                    },
                    "uetr": {
                      "description": "The Unique End-to-end Transaction Reference.",
                      "type": "string"
                    },
                    "view": {
                      "description": "full: every report as the paid timeline shows it. free: the free tracker view.",
                      "enum": ["full", "free"],
                      "type": "string"
                    }
                  },
                  "required": ["added_at", "amount", "archived", "bank_reported_amount", "check_frequency_minutes", "checks_finished", "id", "label", "last_checked_at", "monitoring_until", "payment_date", "status", "status_code", "status_explanation", "uetr", "view"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["next_cursor", "transfers"],
            "type": "object"
          },
