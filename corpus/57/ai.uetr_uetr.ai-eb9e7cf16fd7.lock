        {
          "name": "share_payment_record",
          "title": "Share a payment record",
          "description": "Ask for the payment record link of a paid transfer, to share its bank reports. The account owner must confirm the request on the website before the link is shared: until then the caller does not receive it. The owner sees the request on the website and is normally notified by email. Once confirmed, list_pending_access returns the link. Asking again for the same transfer with the same settings returns the open request; with different settings, the new request replaces it. Only the account owner's API keys and connected apps can ask.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "show_commentary": {
                "description": "Show uetr.ai's plain-language explanations on the record. Leave out to keep the current setting.",
                "type": "boolean"
              },
              "show_fees": {
                "description": "Show bank fees on the record. Leave out to keep the current setting.",
                "type": "boolean"
              },
              "uetr": {
                "description": "The transfer's UETR.",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["uetr"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "description": "Plain English to pass on to the person behind the request.",
                "type": "string"
              },
              "request": {
                "additionalProperties": false,
                "properties": {
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "decided_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "endpoint_url": {
                    "type": ["string", "null"]
                  },
                  "expires_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "id": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "invite_email": {
                    "type": ["string", "null"]
                  },
                  "kind": {
                    "enum": ["team_invite", "record_share", "webhook_endpoint"],
                    "type": "string"
                  },
                  "record_url": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "enum": ["pending", "confirmed", "declined", "expired", "withdrawn"],
                    "type": "string"
                  },
                  "uetr": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["created_at", "decided_at", "endpoint_url", "expires_at", "id", "invite_email", "kind", "record_url", "status", "uetr"],
