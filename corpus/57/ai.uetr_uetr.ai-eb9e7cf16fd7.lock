                      "type": "integer"
                    },
                    "created_at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "event_id": {
                      "description": "The webhook-id header the receiver saw.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "event_type": {
                      "enum": ["status_changed", "final_state", "checks_ended", "test"],
                      "type": "string"
                    },
                    "id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "last_attempt_at": {
                      "format": "date-time",
