                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The receiver's last HTTP status code, or null if it never answered."
                    },
                    "status": {
                      "description": "pending: waiting to be sent or retried. delivered: the receiver answered with a 2xx status. failed: every attempt failed; a test event is tried once and never retried. dropped: removed before sending, for example after an address change.",
                      "enum": ["pending", "delivered", "failed", "dropped"],
                      "type": "string"
                    }
                  },
                  "required": ["attempts", "created_at", "event_id", "event_type", "id", "last_attempt_at", "last_status_code", "status"],
