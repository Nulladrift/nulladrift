        {
          "name": "update_transfer",
          "title": "Correct a transfer's details",
          "description": "Corrects the amount, currency or payment date entered for a transfer. Bank-reported figures never change. After a bank has reported, the owner can make up to 3 corrections. The owner's corrections on the website count toward the same limit. Give all three details as they should stand; a correction replaces them together, as the website's form does. After a bank has reported, sending the details every copy of this transfer in the account already holds changes nothing and uses no correction; if an older copy holds other details, the save aligns it and counts as one correction. Before a report, every save checks the transfer again. The UETR cannot be changed: it identifies the payment. A correction is refused once the transfer is archived, or when its checks ended before any bank reported on it. Only the account owner's API keys and connected apps can correct details. Returns the transfer, the outcome and the corrections left.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "additionalProperties": false,
                "description": "The amount sent and its currency. The currency is a three-letter code in any letter case, one of USD, EUR, GBP, JPY, CHF, CAD, AUD, AED, BDT, BRL, CNY, HKD, IDR, ILS, INR, JOD, MAD, MXN, MYR, NZD, PHP, PKR, PLN, QAR, SAR, SGD, SZL, THB, TRY, TWD, TZS, XAF, XOF, ZAR. The value can have at most 2 decimal places, or none for JPY, XAF and XOF.",
                "properties": {
                  "currency": {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "value": {
                    "description": "The amount in the supplied currency's major units, not minor units. For example, 129600 USD means USD 129,600.00.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["currency", "value"],
                "type": "object"
              },
              "payment_date": {
                "description": "The date the payment was sent. A changed date can be no earlier than 2000-01-01 and no later than the next calendar day in UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "uetr": {
                "description": "The transfer's UETR.",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["amount", "payment_date", "uetr"],
            "type": "object"
          },
