        {
          "name": "restore_transfer",
          "title": "Restore an archived transfer",
          "description": "Restore an archived transfer so its monitoring resumes. Restoring needs an active subscription and a free active transfer place. A restored transfer is monitored until the plan's current period ends: the end of the subscription's billing period, the end date of a courtesy grant, or 30 days from the restore for a courtesy grant with no end date. Its checks run every 5 minutes, which set_check_frequency can change. Restoring an active transfer changes nothing. Returns the transfer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "uetr": {
                "description": "The transfer's UETR.",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["uetr"],
            "type": "object"
