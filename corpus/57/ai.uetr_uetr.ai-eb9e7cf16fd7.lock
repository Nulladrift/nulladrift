        {
          "name": "rotate_webhook_secret",
          "title": "Rotate a webhook signing secret",
          "description": "Replace a webhook endpoint's signing secret, for example after it was exposed. The new secret is returned once, here. For the next 24 hours every delivery carries two signatures, one with the new secret and one with the previous secret, so the receiver keeps accepting requests while it is updated; after that only the new secret signs. Rotating again within those 24 hours ends the oldest secret at once: only the secret in use at that moment keeps signing beside the new one. The address, events and status do not change. Only the account owner's API keys and connected apps can rotate a secret.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The webhook endpoint's id.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "additionalProperties": false,
                "properties": {
                  "api_version": {
                    "type": "string"
                  },
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "created_by": {
                    "enum": ["website", "api"],
                    "type": "string"
                  },
                  "destination": {
                    "enum": ["json", "slack", "teams"],
                    "type": "string"
                  },
                  "events": {
                    "items": {
                      "enum": ["status_changed", "final_state", "checks_ended"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "id": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "paused_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "enum": ["pending", "active", "paused"],
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["api_version", "created_at", "created_by", "destination", "events", "id", "paused_at", "status", "url"],
                "type": "object"
              },
              "previous_secret_expires_at": {
                "description": "When the previous secret stops signing deliveries: 24 hours after the rotation.",
                "format": "date-time",
                "type": "string"
              },
              "signing_secret": {
                "description": "The new secret that signs every delivery, starting whsec_. It is shown only now: store it in the receiver's secret settings.",
                "type": "string"
              }
            },
            "required": ["endpoint", "previous_secret_expires_at", "signing_secret"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
