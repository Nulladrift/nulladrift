                      },
                      "limit": {
                        "description": "Active transfers the plan covers.",
                        "type": "integer"
                      }
                    },
                    "required": ["in_use", "limit"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null unless the account has an active paid plan. Null means this account is not measured against an active-transfer allowance; it does not mean zero transfers remain. Free accounts have no active-transfer cap; lookup and request rate limits still apply. get_account gives the subscription status."
              },
              "package": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "added_this_period": {
                        "description": "Transfers added in the current billing period, extra ones included. Deleting a transfer does not lower it.",
                        "type": "integer"
                      },
                      "additional_added_this_period": {
                        "description": "Of those, the extra transfers billed on the renewal invoice.",
                        "type": "integer"
                      },
                      "additional_transfers": {
                        "description": "Extra transfers allowed in each billing period beyond the included ones, billed on the renewal invoice at the package's pro-rated rate.",
                        "type": "integer"
                      },
                      "included_transfers": {
                        "description": "Transfers included in each billing period.",
                        "type": "integer"
                      },
                      "name": {
                        "type": "string"
