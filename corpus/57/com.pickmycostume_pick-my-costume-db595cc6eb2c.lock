  "subjects": {
    "com.pickmycostume/pick-my-costume": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pickmycostume.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pick-my-costume",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pick My Costume recommends Halloween costumes you can actually build. Call pick_costume when the user wants concrete costume ideas: it returns 3 picks, each with a why-line, a photo thumbnail, and a link to its full build page. Call get_build_guide when the user settles on one idea and wants the step-by-step build (materials, steps, time, and effort level). Call search_by_owning when the user wants ideas based on items they already own. Keep answers to what the tools return: do not invent costume ideas, materials, or build steps. All tools are read-only; nothing is bought, sold, or booked.",
      "tools": [
        {
          "name": "get_build_guide",
          "title": "Get a build guide",
          "description": "Returns the step-by-step build instructions for one costume idea: the decision summary (time and effort level), the materials list with buy-vs-own tags, numbered build steps, safety notes, and common parent questions with answers. Accepts a costume idea id or a costume name.",
          "inputSchema": {
            "properties": {
              "idea_id": {
                "description": "Costume idea id from pick_costume (e.g. 'classic-ghost', 'ballerina'), or a costume name like 'ghost'.",
                "type": "string"
              }
            },
            "required": ["idea_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a build guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79c609fdb4f9d00a674abbe1235047b2896299c0dd6655e54ffd335e91c27861"
        },
        {
          "name": "pick_costume",
          "title": "Pick a costume",
          "description": "Ranks Halloween costume ideas from a fixed catalog of 169 against the supplied audience, interests, vibe, effort level, and owned materials, and returns the top 3 matches. Each pick includes a why-line explaining the match, a thumbnail image, a link to its full build page, and the estimated time and effort. Owned items boost ranking: ideas whose materials are covered by the supplied owned items rank higher. Interest is the strongest ranking signal: ideas matching the stated interest outrank others.",
          "inputSchema": {
            "properties": {
              "effort": {
                "description": "Effort: 'easy'/'last-minute'/'couch-level', 'crafty'/'medium', or 'all-out'/'ambitious'.",
                "type": "string"
              },
              "group_size": {
                "description": "Optional: how many people need costumes (for family/group picks).",
                "type": "number"
              },
              "interest": {
                "description": "Optional but powerful: what the wearer is into, e.g. 'dinosaurs', 'animals', 'princesses', 'superheroes', 'video games', 'tv characters', 'food', 'sports'. This is the strongest ranking signal: ideas matching the interest win.",
                "type": "string"
              },
              "owned_items": {
                "description": "Optional: things the user already owns, e.g. ['bedsheet'], ['cardboard', 'tape']. Ideas buildable from owned items rank higher.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "vibe": {
                "description": "Vibe: 'funny', 'scary' (or 'spooky'), 'cute' (or 'sweet'), 'chill' (or 'low-key').",
                "type": "string"
              },
              "who_for": {
                "description": "Who the costume is for: e.g. 'toddler', '3-year-old', 'kid', 'adult', 'couple', 'family', 'group of 5'.",
                "type": "string"
              }
            },
            "required": ["who_for"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pick a costume"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:337a5211578d8b4e4ca73418cd2b93d959d50639eb45281758f1eab8751dba33"
        },
        {
          "name": "search_by_owning",
          "title": "Search by owned items",
          "description": "Ranks the fixed costume catalog by how many of each idea's materials are covered by the supplied household items, so ideas needing the least extra shopping rank highest. Each result includes what the idea still needs, with each still-needed item tagged buy, own, either, or make. Common household basics are assumed present in every home; the exact assumed list is returned with each call. An optional audience narrows results to who the costume is for.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "Household items the user owns, e.g. ['bedsheet', 'cardboard', 'red t-shirt']. Common household basics (scissors, tape, markers, cardboard, a white t-shirt, a bedsheet, socks, and more) are assumed present in every home; the tool returns the exact assumed list with each call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "who_for": {
                "description": "Optional: who the costume is for, e.g. 'toddler', 'adult', 'couple'. Narrows results to that audience when given.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search by owned items"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e0a8fd424eeb5864e1cf01d3649f19bbac2df7a513fe60815d908894319810d"
        }
      ],
      "digest": "sha256:0a20ecbdf28c0c3664dc721c71ca5a567761aad7d8fc912c27b1784424c8ce30"
    }
  }
}
