{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/akan-proverbs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/akan-proverbs"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-akan-proverbs",
        "title": "Akan Proverbs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Akan Proverbs gives proverbs of the Akan of Ghana in Twi with an English translation, by topic, by word or one for the day. The Twi is the 1879 print (older spelling); the English is the 1916 translation. Say so, and quote both exactly as given. It does not translate new text and does not rule on what a proverb means in a given community.",
      "tools": [
        {
          "name": "proverbs.find",
          "title": "Find Akan proverbs",
          "description": "Use this when someone wants an Akan (Twi) proverb from Ghana about a topic or containing a word: for a speech, a toast, a lesson, a piece of writing or to understand the tradition. Each result has the Twi as printed in 1879 and the English translation of 1916. Do not use it to translate a new sentence into Twi, to explain what a proverb means in a particular family or town, or for proverbs of peoples other than the Akan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "A topic or a word, for example \"patience\", \"elders\", \"money\" or \"elephant\".",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 3).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page 2 and onward give further matches.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["about"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "matches": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "proverbs": {
                "items": {
                  "properties": {
                    "english": {
                      "type": "string"
                    },
                    "number": {
                      "type": "integer"
                    },
                    "topics": {
                      "type": "array"
                    },
                    "twi": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["about", "matches", "note", "proverbs", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0fea415c37e37559c1b1c137adcf57246f53ab1dc0ffd79fde32ca5c603c90f"
        },
        {
          "name": "proverbs.of_the_day",
          "title": "Akan proverb of the day",
          "description": "Use this when someone asks for an Akan (Twi) proverb without naming a topic, or for a proverb of the day. The same date always gives the same proverb. Do not use it when a topic or a word is given (use proverbs.find), or as a horoscope or a prediction about the day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day, as YYYY-MM-DD. Leave out for today.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "date": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "proverb": {
                "properties": {
                  "english": {
                    "type": "string"
                  },
                  "number": {
                    "type": "integer"
                  },
                  "topics": {
                    "type": "array"
                  },
                  "twi": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["date", "note", "proverb", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b8a68c0d11d06da6e03c0ba408d26eb099b4e27fc1e0e8838c0883b91464350"
        },
        {
          "name": "proverbs.topics",
          "title": "List proverb topics",
          "description": "Use this when you need to know which topics the Akan proverb collection covers and how many proverbs each has, before searching it. Do not use it to fetch proverbs themselves: use proverbs.find for that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "proverbs": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "topics": {
                "type": "array"
              }
            },
            "required": ["proverbs", "source", "topics"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf85735f0f11575f0d4d5743d356ae51ac0027250b524053c89b5fde7ac5936c"
        }
      ],
      "digest": "sha256:645ee144f39814b201c02b073dfa86e0e7a948298de56b67bdfec65d12823b61"
    }
  }
}
