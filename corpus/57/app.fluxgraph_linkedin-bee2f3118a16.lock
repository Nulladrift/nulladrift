      "instructions": "Flux is LinkedIn intelligence: your own posts and audience, plus live LinkedIn research.\n\nEvery tool description starts with a layer tag:\n- [Acquire · <cost>] pulls LinkedIn (or another paid upstream) and spends credits; results are saved to your library.\n- [Read · free] queries what is already in your library. No LinkedIn call. ([Read · 5 credits] = suggest_angles, which calls OpenAI.)\n- [Act · writes] changes your state (segments, collections, campaigns, streams); \"destructive\" marks removals.\n- [Meta · free] account, credits and self-description.\n\nTerms and data:\n- An \"engager\" is someone who reacted to or commented on a post in your library: your own posts, or posts you pulled (tracked/external profiles, collections, post searches). Warmth toward YOU means engagement with your own posts; engaging with a competitor's post is not warmth. In map_constellation, the engager pool means people who engage with the TARGET's posts.\n- Position-based tools (get_outreach_path, get_alumni_engagers, get_company_engagement_overlap, smart segments) need job history. Engagers from reaction/comment pulls usually lack it (stored only when LinkedIn's payload includes it, which is rare). Check the result's coverage (and empty_reason or _meta.interpretation where present) before buying enrich_people; don't enrich blindly.\n- When a result carries _meta.next_step or _meta.next_steps, follow it: it names the exact tool and arguments for the next call.\n\nCredits:\n- Before any run that could exceed 25 credits, call get_cost_estimate with the planned arguments and confirm with the user.\n- map_constellation's lead search is billed at a bundled 1 credit (a deliberate discount); linkedin_people_search costs 5 credits per page.\n\nRecipes:\n- Own-content analytics: list_profiles → get_profile_summary → get_posting_insights.\n- Budget: get_credit_balance, then get_cost_estimate before paid calls.\n- Monthly client report (prompt monthly-client-report, Pulse and Edge): list_profiles → get_profile_summary → get_engagement_trends → get_posts → get_posting_insights → get_topic_insights.\n- Research a prospect (prompt research-a-prospect, Edge): get_target_warmth_brief → enrich_people (3 credits) → linkedin_profile_posts (5 credits/page) → get_engagement_brief; optional get_outreach_path.\n- Triage LinkedIn URLs (prompt triage-linkedin-urls, Edge): get_outreach_queue(linkedin_urls) → get_target_warmth_brief for the warm ones → get_outreach_path for the best cold fits → enrich_people where data is missing (3 credits each, confirm) → create_segment + add_to_segment.\n- Warm path to a person (prompt warm-path-to, Edge): get_outreach_path → enrich_people for the people it names (3 credits each, confirm) → get_outreach_path again → get_target_warmth_brief.\n- Warm way into an account (prompt warm-way-into-account, Edge): linkedin_company_info → create_campaign → add_campaign_accounts → get_cost_estimate → map_constellation (1 + 3 credits/target, confirm) → get_outreach_queue → get_outreach_path for the top targets → log_outcome.\n- What to post more of (prompt what-to-post-more-of, Pulse and Edge): get_posting_insights → get_topic_insights → get_posts; on Edge add find_similar_posts, suggest_angles (5 credits) and score_draft.\n- Who at a company engages (prompt who-at-company-engages, Edge): get_alumni_engagers (company name, LinkedIn id or URL) → linkedin_company_info if Flux lacks the company (1 credit) → enrich_people for the gaps (3 credits each, confirm) → get_company_engagement_overlap for two accounts.\n- Who engaged (prompt who-engaged, Edge): One post: linkedin_post_reactions + linkedin_post_comments → get_post_engagers_by_company. Many posts: get_cost_estimate → get_post_set_engagers → get_target_warmth_brief for the top people (Edge).",
      "tools": [
        {
          "name": "add_campaign_accounts",
          "title": "Add Campaign Accounts",
          "description": "[Act · writes] Add one or more target companies to a Constellation campaign. Each account is a company you want to reach; map_constellation is then run per-account. Accounts already in the campaign (same linkedin_company_id, or same case-insensitive trimmed company_name) and repeats within the same call are not re-added; they are returned under `skipped`. Free — costs 0 credits.",
