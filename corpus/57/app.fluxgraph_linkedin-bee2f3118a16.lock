            "properties": {
              "description": {
                "description": "Optional longer description",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "User-facing campaign name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
