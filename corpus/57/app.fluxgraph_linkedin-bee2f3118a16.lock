        {
          "name": "create_campaign",
          "title": "Create Campaign",
          "description": "Create a Constellation outreach campaign. A campaign groups target accounts, the people you care about at those accounts, and the warm connections you could approach to reach them. Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
