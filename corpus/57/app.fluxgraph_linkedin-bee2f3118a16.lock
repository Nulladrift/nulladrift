        {
          "name": "add_campaign_accounts",
          "title": "Add Campaign Accounts",
          "description": "Add one or more target companies to a Constellation campaign. Each account is a company you want to reach; map_constellation is then run per-account. Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accounts": {
                "description": "Array of companies to add (1-500 per call)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company_name": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "employee_count": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "linkedin_company_id": {
                      "type": "string"
                    },
                    "tier": {
                      "maximum": 3,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["company_name"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "campaign_id": {
                "description": "Target campaign id",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["accounts", "campaign_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b09274269dc1b47ab9e307d3f7309aee0d71238e17af15659edea96712a2edc"
        },
        {
          "name": "add_to_collection",
          "title": "Add Posts to Collection",
          "description": "Pin one or more posts (by post_id) into a collection you own — works on any collection type. On a 'manual' collection this is the only membership mechanism; on a 'smart' collection it adds the posts as extras alongside whatever the rule already matches (resolve_collection returns the union). Existing members are silently ignored. Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collection_id": {
                "description": "Target collection id from list_collections",
                "format": "uuid",
                "type": "string"
              },
              "post_ids": {
                "description": "post_ids to add (1-1000 per call)",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["collection_id", "post_ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d56312da281e8d9183ad96f1b8bfcdb4fb610d1cde91cd689bfbea2411deb49"
        },
        {
