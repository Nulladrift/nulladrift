        {
          "name": "create_segment",
          "title": "Create Audience Segment",
          "description": "[Act · writes] Create a new audience segment (named group of people) for the authenticated user. Set type='manual' for a hand-curated list (use add_to_segment to populate it), type='smart' with a `config` predicate (e.g. {title_contains:['VP','Chief']}) to define a dynamic segment resolved on-demand by resolve_segment, or pass `template` to pre-fill `config` from a built-in template (type defaults to 'smart'). Smart segments only match people connected to you: people who engaged with posts you can see in Flux (your own profile, tracked/monitored profiles, and posts you collected) and people in your campaigns' constellations. Smart segment membership is computed, so add_to_segment / remove_from_segment do not apply to it. Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config": {
                "additionalProperties": {},
                "description": "Predicate object for smart segments. Supported keys: title_contains, company_contains. Each takes a non-empty string or an array of 1-20 non-empty strings (case-insensitive substring match; an array matches if ANY term matches, e.g. {title_contains:['procurement','logistics','supply chain']}). Different keys are AND-combined. Any other key is rejected. Required when type='smart' and no template is supplied.",
                "type": "object"
              },
              "description": {
                "description": "Optional longer description",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "User-facing segment name. Optional when `template` is supplied — the template's default name is used.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "source_stream_id": {
                "description": "Optional stream that produced this segment (for traceability)",
                "format": "uuid",
                "type": "string"
              },
              "template": {
                "description": "Optional pre-built template id. Available: 'vp_plus' (VP+ decision-makers), 'c_suite' (C-suite executives), 'heads_of' ('Head of' leaders), 'founders' (Founders & co-founders), 'fintech_leaders' (Fintech leaders), 'agency_owners' (Agency owners). Pre-fills `config` and defaults `type` to 'smart'. Explicit `config` overrides template values on collision.",
                "enum": ["vp_plus", "c_suite", "heads_of", "founders", "fintech_leaders", "agency_owners"],
                "type": "string"
              },
              "type": {
                "description": "Segment type. 'manual' = hand-curated person list. 'smart' = dynamic predicate (requires `config`). 'auto_stream' = system-managed from a stream. Defaults to 'smart' when `template` is provided.",
                "enum": ["manual", "smart", "auto_stream"],
                "type": "string"
              }
            },
            "type": "object"
          },
