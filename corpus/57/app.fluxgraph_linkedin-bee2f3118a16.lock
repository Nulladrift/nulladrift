        {
          "name": "run_stream_now",
          "title": "Run Stream Now",
          "description": "Trigger an immediate run of an active stream, bypassing its schedule. The run is fire-and-forget — the response confirms the dispatch but post collection happens asynchronously. Credits are charged for pages actually walked, not pages requested: one page is taken upfront and the rest settled when the run finishes, so a run that stops early (or fails) costs less than max_pages implies. Paused streams must be resumed first. Use list_streams or get_stream_feed to see results once the run completes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "history_days": {
                "description": "How far back this run should reach, in days. Bounds the walk by TIME where max_pages bounds it by COST — it stops at whichever limit it hits first, so pair a deep window with enough pages to reach it. Honoured for external_profile, company and person_interests; the search types ignore it. Applies to this run alone; it is never saved on the stream. Combines with resume: 'go further back, but only as far as this'.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "max_pages": {
                "description": "Upper bound on pages for this run (1-5, default 1) — a budget, not a price. Honoured for external_profile, company and person_interests. You are billed only for pages actually walked; a person_interests stream stops as soon as it reaches engagement it already has, so a deep budget usually costs one page. A page is ~50 posts for profile/company feeds and ~100 engagement events for person_interests, where one page means one reactions call plus one comments call. Other stream types ignore this — their sources aren't paginated.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "resume": {
                "description": "Continue a person_interests backfill from where the deepest previous run stopped, instead of re-walking the newest pages. Use this for 'pull more history' — without it you re-fetch and re-pay for content you already have. No effect on a stream that has never been walked.",
                "type": "boolean"
              },
              "stream_id": {
                "description": "Stream ID from list_streams",
                "type": "string"
              }
            },
            "required": ["stream_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
