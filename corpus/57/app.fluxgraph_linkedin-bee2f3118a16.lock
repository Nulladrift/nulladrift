        {
          "name": "get_post_set_engagers",
          "title": "Get Post-Set Engagers",
          "description": "[Acquire · 1 credit/page + 3/person enriched] Pull from LinkedIn (costs credits) and return the consolidated, deduped people who reacted to or commented on a SET of posts — one tracked profile's posts (profile_id), a post collection (collection_id), or an explicit list of up to 50 posts (post_ids and/or post_urls, e.g. the post_ids linkedin_post_search returns; a URL not yet in Flux is stubbed for free, no save_post needed). Fetches only posts not synced within freshness_days, walks up to max_pages_per_post pages (100 people/page) of reactions and of comments per post, includes comment replies, and enriches (title/company via a profile lookup) only never-seen people, up to max_enrich. Costs 1 credit per page fetched (a page is up to 100 people; a post with under 100 reactions and under 100 comments = 2 credits; the most a post can cost is 2 × max_pages_per_post) + 3 per person enriched; cached posts and cached pages are free. The balance must cover the worst case (posts × 2 × max_pages_per_post + max_enrich × 3) before anything runs (get_cost_estimate with these params returns the same number); you are charged only for pages actually fetched. When the balance is short, the insufficient_credits error spells out what the worst case assumed and lists `suggestions` (smaller max_pages_per_post / max_posts / max_enrich, each with its resulting max) that fit the balance. Per-post reactions_fetched / reactions_total / comments_total / truncated tell you when a post had more engagers than were fetched.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collection_id": {
                "description": "post_collections.id — engagers across this collection's posts",
                "type": "string"
              },
              "force": {
                "default": false,
                "description": "Re-sync posts even if within the freshness window",
                "type": "boolean"
              },
              "freshness_days": {
                "default": 30,
                "description": "Skip posts whose engagers were synced within this many days",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "max_enrich": {
                "default": 0,
                "description": "Max never-seen engagers to enrich via /linkedin/profile (0-100, default 0)",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "max_pages_per_post": {
                "default": 10,
                "description": "Max pages (100 people each) to walk per endpoint per post (1-20, default 10). Each page costs 1 credit.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_posts": {
                "description": "Max posts to sync this call (1-100). Default 25; with post_ids/post_urls the default is the list length.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "post_ids": {
                "description": "posts.id values (e.g. from linkedin_post_search results) — engagers across exactly these posts. Combine with post_urls; 50 total max. Each must be a post you can read.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "post_urls": {
