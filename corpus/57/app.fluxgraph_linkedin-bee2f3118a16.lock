        {
          "name": "find_similar_posts",
          "title": "Find Similar Posts",
          "description": "[Read · free] Find persisted posts whose embeddings are nearest to a free-text query — pgvector cosine over the local post library, no LinkedIn pull, free. Use when you have a *block of text* (a draft, a paragraph, a competitor's post) and want similar posts you've already collected. For keyword search prefer `search_posts`; for fresh LinkedIn keyword pulls use `linkedin_post_search`. Pass `profile_id` to scope to a tracked profile, `collection_id` to scope to a collection, or neither to search the entire library.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collection_id": {
                "description": "Optional post_collections.id (scopes search to this collection's members)",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max results to return (1-50, default 5)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "profile_id": {
                "description": "Optional tracked profile ID from list_profiles (scopes search to this profile's posts)",
                "type": "string"
              },
              "text": {
                "description": "Text to find similar posts for",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Similar Posts"
