            "additionalProperties": false,
            "properties": {
              "accounts": {
                "description": "Array of companies to add (1-500 per call)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company_name": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "employee_count": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "linkedin_company_id": {
                      "type": "string"
                    },
                    "tier": {
                      "maximum": 3,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["company_name"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "campaign_id": {
                "description": "Target campaign id",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["accounts", "campaign_id"],
            "type": "object"
          },
