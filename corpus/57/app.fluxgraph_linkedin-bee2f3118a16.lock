        {
          "name": "enrich_people",
          "title": "Enrich People (job history)",
          "description": "[Acquire · 3 credits/person enriched] Look up full LinkedIn profiles for up to 100 people and store their current title, company, headline and job history (every position). Job history is what get_outreach_path (coworker / alumni paths) and get_alumni_engagers search, and engagers collected from reactions/comments have none until enriched — when those tools report missing coverage they return a _meta.next_step with the exact person_ids to pass here. Pass person_ids (people.id from any engager / path tool) and/or linkedin_urls. Costs 3 credits per person successfully enriched. People you already have (connected to you: they engaged with your posts, are in your campaigns or segments, or you pulled or enriched them) who were enriched in the last 90 days are skipped for free unless refresh=true; anyone else is looked up and charged normally; failed or not-found lookups are free. The balance must cover 3 × the people to be looked up (after skips and max_credits) before anything runs; you are charged only for successes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "linkedin_urls": {
                "description": "LinkedIn profile URLs to enrich; people not yet in the graph are added",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "max_credits": {
                "description": "Spend cap. At most floor(max_credits / 3) people are looked up; the rest come back skipped_budget.",
                "minimum": 0,
                "type": "integer"
              },
              "person_ids": {
                "description": "people.id UUIDs to enrich (1-100)",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "refresh": {
                "default": false,
                "description": "Re-enrich people enriched within the last 90 days (bypasses the cache)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
