        {
          "name": "log_outcome",
          "title": "Log Outcome",
          "description": "[Act · writes] Record an outcome by hand. Two kinds.\n• Outbound (campaign outreach): action sent_request | accepted | replied | no_response with campaign_id and exactly one of person_id or linkedin_url (any profile URL form). The person must be connected to you (in one of your campaigns or segments, engaged with posts you can see in Flux, or pulled by you); anyone else returns not-found with a next_step to pull their profile via linkedin_profile_info. A person outside this campaign's mapped constellation is still logged (with a `warning`) and get_campaign_stats counts it under `unattributed`.\n• Inbound (results your own posting brought in): action inbound_dm | lead | client with profile_id (your tracked profile from list_profiles, whose posts it counts against). No campaign. When the user pastes a LinkedIn DM conversation, pass the whole paste as message_text and set occurred_at to the date of its first message (ISO 8601; omit only if the paste has no date). The sender's linkedin_url is optional and never triggers a paid lookup. Flux matches the outcome to the post that most likely prompted it: post_url if given, else for a lead or client the post already credited for this person's earlier inbound outcome, else the conversation's opening text and timing against your posts from the 30 days before. The result says the method (explicit | inherited | matched | recency | none) and lists up to three candidate posts. When nothing was matched and candidates exist, show them to the user and ask which post it was; then call again with outcome_id and that post_url to correct it. get_inbound_attribution reports which posts bring in DMs, leads and clients.\nFree — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Outbound: sent_request | accepted | replied | no_response. Inbound: inbound_dm | lead | client",
                "enum": ["sent_request", "accepted", "replied", "no_response", "inbound_dm", "lead", "client"],
                "type": "string"
              },
              "campaign_id": {
                "description": "Outbound only, required there: campaign id",
                "format": "uuid",
                "type": "string"
