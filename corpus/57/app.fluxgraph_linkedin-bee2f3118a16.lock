        {
          "name": "create_collection",
          "title": "Create Post Collection",
          "description": "Create a new post collection for the authenticated user. Set type='manual' to hand-curate posts with add_to_collection, or type='smart' with a `config` predicate (e.g. {format:'video',min_likes:50}) to define a dynamic collection resolved on-demand by resolve_collection. Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config": {
                "additionalProperties": {},
                "description": "Predicate for smart collections. Supported keys: format, min_likes, min_comments, date_after, date_before, topic_contains, author_profile_id, profile_ids (array — posts whose profile_id is in the set; use to group several tracked profiles/streams into one live collection), source_type. Required when type='smart'.",
                "type": "object"
              },
              "description": {
                "description": "Optional longer description",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "User-facing collection name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "'manual' = hand-curated post list. 'smart' = dynamic predicate (requires `config`).",
                "enum": ["manual", "smart"],
                "type": "string"
              }
            },
            "required": ["name", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eba0f57d4b6cfff7ae999fbbee17d8ba2510b538b303a9cfe027e0246640d80"
        },
        {
          "name": "create_segment",
          "title": "Create Audience Segment",
          "description": "Create a new audience segment (named group of people) for the authenticated user. Set type='manual' for a hand-curated list (use add_to_segment to populate it), type='smart' with a `config` predicate (e.g. {title_contains:'VP'}) to define a dynamic segment resolved on-demand by resolve_segment, or pass `template` to pre-fill `config` from a built-in template (type defaults to 'smart'). Free — costs 0 credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config": {
                "additionalProperties": {},
                "description": "Predicate object for smart segments. Supported keys: title_contains, company_contains, company_industry, engaged_with_topics. Required when type='smart' and no template is supplied.",
                "type": "object"
              },
              "description": {
                "description": "Optional longer description",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "User-facing segment name. Optional when `template` is supplied — the template's default name is used.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "source_stream_id": {
                "description": "Optional stream that produced this segment (for traceability)",
                "format": "uuid",
                "type": "string"
              },
              "template": {
                "description": "Optional pre-built template id. Available: 'vp_plus' (VP+ decision-makers), 'c_suite' (C-suite executives), 'heads_of' ('Head of' leaders), 'founders' (Founders & co-founders), 'fintech_leaders' (Fintech leaders), 'agency_owners' (Agency owners). Pre-fills `config` and defaults `type` to 'smart'. Explicit `config` overrides template values on collision.",
                "enum": ["vp_plus", "c_suite", "heads_of", "founders", "fintech_leaders", "agency_owners"],
                "type": "string"
              },
              "type": {
                "description": "Segment type. 'manual' = hand-curated person list. 'smart' = dynamic predicate (requires `config`). 'auto_stream' = system-managed from a stream. Defaults to 'smart' when `template` is provided.",
                "enum": ["manual", "smart", "auto_stream"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:764d5ddcb553601cbadceb3b01798fa4bfca55c233198b3d47b0bcfbaee111ee"
        },
        {
          "name": "create_stream",
          "title": "Create Stream",
          "description": "Create a new research stream (external profile, company, topic, person interests, hiring signals, or ad watch). Running the stream on its schedule costs credits (see get_cost_estimate for the per-type cost). own_profile streams are not created here — they come from subscription checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "history_days": {
                "description": "How far back the first run should reach, in days. Bounds the walk by TIME where initial_max_pages bounds it by COST — the run stops at whichever limit it hits first, so pair a window with enough pages to reach it. Honoured for external_profile, company and person_interests; the search types ignore it. Applies to this pull alone and is never saved on the stream, so scheduled runs keep topping up from where the last one stopped rather than re-fetching the window.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "initial_max_pages": {
                "description": "Opt-in deep first-run for external_profile, company and person_interests streams (1-5, default 1). A budget, not a price — you are billed for pages actually walked. A page is ~50 posts for profile/company feeds and ~100 engagement events for person_interests. Other stream types ignore this. Later scheduled runs pull one page in the steady state; a person_interests stream may walk further to close a gap after a missed tick, and is billed only for what it walks.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "User-facing label for this stream",
                "type": "string"
              },
              "params": {
                "additionalProperties": {},
                "description": "Type-specific config: topic uses {query, authorsIndustryId?, contentType?, postedLimit?, sortBy?}; hiring_signals/ad_watch use {company?, keywords?, ...}",
                "type": "object"
              },
              "schedule": {
                "description": "Run schedule. Defaults to 'weekly'. 'monthly' runs every 30 days — the cheapest recurring cadence, and the usual choice for client profiles reported on monthly.",
                "enum": ["once", "daily", "weekly", "monthly", "manual"],
                "type": "string"
              },
              "source_url": {
                "description": "LinkedIn URL for external_profile / company / person_interests streams",
                "type": "string"
              },
              "type": {
                "description": "Stream type",
                "enum": ["external_profile", "company", "topic", "person_interests", "hiring_signals", "ad_watch"],
                "type": "string"
              }
            },
            "required": ["name", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63cc30ef42f6b1fc37569f71316fe892456a6f4da7c8f2737995085e88ad790c"
        },
        {
          "name": "delete_stream",
          "title": "Delete Stream",
          "description": "Delete a stream and its stream_runs. Posts collected by the stream stay in your library (stream_id is set to NULL via ON DELETE SET NULL) so historical data isn't lost. Auto-collection is deleted with the stream. own_profile streams cannot be deleted through this tool; the own profile is managed from Settings and billing.",
