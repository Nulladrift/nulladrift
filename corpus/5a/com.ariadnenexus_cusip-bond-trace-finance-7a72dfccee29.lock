      "instructions": "Ariadne Nexus Fixed-Income CUSIP, Bond & FINRA TRACE Finance MCP Server. Tool selection guide: Use get_cusip_valuation for single-bond YTM/duration/convexity/DV01, get_debt_radar for FINRA TRACE spreads & zero-cost collars, run_portfolio_stress_test for multi-bond VaR/CVaR shocks, calculate_clearing_fee for free RWA clearing math, provision_agent_key for $10/mo Builder Pass or $195 CUSIP Dossier checkout links, and redeem_checkout_session to claim your live nexus_live_... API key immediately after Stripe Checkout.",
