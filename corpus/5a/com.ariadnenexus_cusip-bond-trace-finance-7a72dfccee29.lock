        {
          "name": "run_portfolio_stress_test",
          "title": "Multi-Bond Portfolio Macro Shock, VaR/CVaR & Treasury Futures Immunization",
          "description": "Executes multi-position fixed-income portfolio stress testing across customizable macroeconomic rate shocks (parallel benchmark shifts in bps, rating-weighted credit spread widening in bps, yield curve twists: PARALLEL/STEEPENER/FLATTENER/INVERSION, and liquidity haircuts), computing aggregate portfolio DV01, 1-year 95%/99% parametric Value-at-Risk (VaR), 99% Expected Shortfall (CVaR), position-level P&L attribution, 10-Year Treasury Note futures (ZN) short hedge ratios, and portfolio-wide zero-cost European collar strikes. Use when: stress-testing a multi-bond portfolio under interest-rate or credit-spread shocks, calculating portfolio VaR/CVaR, or sizing 10Y Treasury futures duration hedges. Do not use when: pricing a single bond CUSIP without a macro shock scenario (use get_cusip_valuation instead) or checking single-CUSIP FINRA TRACE dealer prints (use get_debt_radar instead). Behavior: Read-only, deterministic portfolio simulation ($2.50 USD per call via HTTP header x-api-key or x-payment-token; defaults to a 3-bond institutional benchmark portfolio if portfolio array is omitted; returns an x402/MPP paymentChallenge without charging if credentials are omitted).",
          "inputSchema": {
            "properties": {
              "portfolio": {
                "description": "Array of fixed-income bond positions to stress test (1 to 100 positions). If omitted or empty, defaults to a 3-position $10M institutional benchmark portfolio (UST 5Y, AAPL, GS).",
                "items": {
                  "properties": {
                    "coupon_rate_pct": {
                      "description": "Annual coupon rate as a percentage (e.g., 4.25).",
                      "type": "number"
                    },
                    "credit_rating": {
                      "description": "Composite credit rating governing spread shock beta (\"AAA\", \"AA\", \"A\", \"BBB\", \"BB\", \"B\", \"CCC\", \"NR\").",
                      "type": "string"
                    },
                    "cusip": {
                      "description": "9-character CUSIP identifier for the position (e.g., \"912828ZG2\").",
                      "type": "string"
                    },
                    "face_value_usd": {
                      "description": "Par notional face value of the position in USD (e.g., 5000000).",
                      "type": "number"
                    },
                    "issuer": {
                      "description": "Issuer legal or display name (e.g., \"U.S. Treasury 5Y\", \"Apple Inc.\").",
                      "type": "string"
                    },
                    "market_price_pct": {
                      "description": "Current clean market price as a percentage of par (e.g., 98.50).",
                      "type": "number"
                    },
                    "maturity_years": {
                      "description": "Remaining maturity in years (minimum 0.25, e.g., 4.8).",
                      "type": "number"
                    },
                    "sector": {
                      "description": "Industry or asset sector classification (e.g., \"GOVERNMENT\", \"TECHNOLOGY\", \"FINANCIALS\").",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "scenario": {
                "description": "Macroeconomic stress scenario parameters applied across the portfolio. Defaults to a +100 bps parallel rate shock and +75 bps credit spread widening if omitted.",
                "properties": {
                  "benchmark_rate_shock_bps": {
                    "default": 100,
                    "description": "Parallel risk-free benchmark interest rate shift in basis points (e.g., 100 for +100 bps hike, -50 for -50 bps cut; default: 100).",
                    "type": "number"
                  },
                  "credit_spread_widening_bps": {
                    "default": 75,
                    "description": "Baseline BBB credit spread widening shock in basis points, scaled by rating beta (default: 75).",
                    "type": "number"
                  },
                  "curve_twist": {
                    "default": "PARALLEL",
                    "description": "Yield curve shape regime applied across maturities (\"PARALLEL\", \"STEEPENER\", \"FLATTENER\", or \"INVERSION\"; default: \"PARALLEL\").",
                    "enum": ["PARALLEL", "STEEPENER", "FLATTENER", "INVERSION"],
                    "type": "string"
                  },
                  "liquidity_haircut_pct": {
                    "default": 1.5,
                    "description": "Bid-side market illiquidity haircut percentage deducted from post-shock value (e.g., 1.5 for 1.5%; default: 1.5).",
                    "type": "number"
                  },
                  "name": {
                    "default": "HAWKISH_RATE_SHOCK_100BPS",
                    "description": "Descriptive scenario identifier (default: \"HAWKISH_RATE_SHOCK_100BPS\").",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "immunization_and_hedging": {
                "description": "Actionable 10Y Treasury Note futures (ZN) duration hedge and zero-cost option collar structure.",
                "type": "object"
              },
              "macro_scenario_applied": {
                "description": "Normalized macro shock parameters applied.",
                "type": "object"
              },
              "portfolio_summary": {
                "description": "Pre-shock aggregate portfolio valuation and duration metrics.",
                "properties": {
                  "portfolio_convexity": {
                    "description": "Market-value-weighted convexity.",
                    "type": "number"
                  },
                  "portfolio_modified_duration_years": {
                    "description": "Market-value-weighted modified duration in years.",
                    "type": "number"
                  },
                  "portfolio_total_dv01_usd": {
                    "description": "Total portfolio dollar duration (DV01) in USD per 1bp shift.",
                    "type": "number"
                  },
                  "total_face_value_usd": {
                    "description": "Aggregate par value in USD.",
                    "type": "number"
                  },
                  "total_market_value_usd": {
                    "description": "Aggregate pre-shock market value in USD.",
                    "type": "number"
                  },
                  "total_positions": {
                    "description": "Number of bond positions evaluated.",
                    "type": "number"
                  },
                  "weighted_ytm_pct": {
                    "description": "Market-value-weighted portfolio yield-to-maturity %.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "position_level_breakdown": {
                "description": "Per-CUSIP pre-shock and post-shock valuation and P&L attribution array.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "receipt": {
                "description": "Cryptographic payment or API key settlement receipt ID.",
                "type": "string"
              },
              "stress_test_results": {
                "description": "Post-shock portfolio valuation, P&L loss, and resilience status.",
                "properties": {
                  "capital_preservation_status": {
                    "description": "Risk threshold classification.",
                    "enum": ["RESILIENT", "VULNERABLE_DURATION_EXP"],
                    "type": "string"
                  },
                  "portfolio_loss_pct": {
                    "description": "Percentage change in portfolio market value.",
                    "type": "number"
                  },
                  "portfolio_pnl_usd": {
                    "description": "Net dollar profit/loss under the stress shock in USD.",
                    "type": "number"
                  },
                  "post_shock_market_value_usd": {
                    "description": "Aggregate post-shock market value in USD.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "tool": {
                "description": "Executed tool identifier (\"run_portfolio_stress_test\").",
                "type": "string"
              },
              "value_at_risk": {
                "description": "Parametric 1-year Value-at-Risk (95% and 99%) and Conditional VaR (99% Expected Shortfall) in USD.",
                "properties": {
                  "annualized_portfolio_volatility_pct": {
                    "description": "Annualized portfolio return volatility percentage.",
                    "type": "number"
                  },
                  "conditional_var_cvar_99_usd": {
                    "description": "99% Conditional VaR (Expected Shortfall) in USD.",
                    "type": "number"
                  },
                  "parametric_var_95_1y_usd": {
                    "description": "95% confidence 1-year parametric VaR in USD.",
                    "type": "number"
                  },
                  "parametric_var_99_1y_usd": {
                    "description": "99% confidence 1-year parametric VaR in USD.",
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["immunization_and_hedging", "portfolio_summary", "position_level_breakdown", "stress_test_results", "tool", "value_at_risk"],
            "type": "object"
          },
