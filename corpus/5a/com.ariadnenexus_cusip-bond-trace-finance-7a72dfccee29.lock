        {
          "name": "redeem_checkout_session",
          "title": "Instant Post-Checkout API Key & IDE Credential Redeemer",
          "description": "Verifies a completed Stripe Checkout session (`cs_...`) directly against Ariadne Nexus billing and deterministically returns the buyer’s live HMAC-signed `nexus_live_...` API key, monthly quota, and 1-click Cursor / VS Code / Claude Code installation links. Use when: a user has just completed payment at Stripe Checkout and wants to immediately claim and activate their `nexus_live_...` API key inside Claude, Cursor, VS Code, or an autonomous agent without waiting for email delivery. Do not use when: the user has not yet paid or needs a checkout link first (use provision_agent_key instead). Behavior: Free, read-only, deterministic verification and HMAC credential derivation ($0.00 USD; idempotent across repeated invocations for the same paid `cs_...` session ID).",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Optional billing email address used during Stripe Checkout (required when re-redeeming sessions older than 24 hours).",
                "type": "string"
              },
              "session_id": {
                "description": "Paid Stripe Checkout Session identifier starting with \"cs_\" (e.g., \"cs_live_...\" from the /billing/success redirect URL or Stripe receipt).",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_paid_usd": {
                "description": "Total settled USD amount.",
                "type": "number"
              },
              "api_key": {
                "description": "Live HMAC-signed Ariadne Nexus API key (\"nexus_live_...\").",
                "type": "string"
              },
              "deliverable_unlock_url": {
                "description": "Direct URL to any unlocked closing certificate, CUSIP vault, or forensic workpaper.",
                "type": "string"
              },
              "error": {
                "description": "Diagnostic message if session is unpaid or invalid.",
                "type": "string"
