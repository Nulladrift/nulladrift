        {
          "name": "get_cusip_valuation",
          "title": "Single-Bond CUSIP Valuation & Jump-Diffusion Analytics",
          "description": "Computes deterministic fair market value (USD), yield-to-maturity (approximate and exact cashflow YTM %), Macaulay and modified duration (years), convexity, DV01 (USD per 1bp shift), and Merton jump-diffusion 95% confidence bounds for a single corporate, sovereign, or RWA fixed-income security. Use when: pricing or analyzing an individual bond CUSIP/ticker given par value, coupon, maturity, and clean market price. Do not use when: scanning FINRA TRACE secondary dealer prints or structuring single-security option collars (use get_debt_radar instead), or running multi-position portfolio macro shocks and VaR/CVaR (use run_portfolio_stress_test instead). Behavior: Read-only, deterministic, side-effect-free calculation ($0.50 USD per call via HTTP header x-api-key or x-payment-token; returns an x402/MPP paymentChallenge without charging if credentials are omitted).",
          "inputSchema": {
            "properties": {
              "asset_type": {
                "default": "CORPORATE_BOND",
                "description": "Fixed-income instrument classification governing jump-diffusion volatility calibration (default: \"CORPORATE_BOND\").",
                "enum": ["CORPORATE_BOND", "PRIVATE_CREDIT", "AEROSPACE_RWA", "STRUCTURED_NOTE"],
                "type": "string"
              },
              "coupon_rate": {
                "default": 6.25,
                "description": "Annualized stated coupon rate as a percentage (e.g., 6.25 for 6.25% paid semi-annually; default: resolved from security master or 6.25).",
                "type": "number"
              },
              "cusip": {
                "default": "912828ZG2",
                "description": "9-character alphanumeric CUSIP security identifier (e.g., \"912828ZG2\", \"037833EK1\", \"38141GZX8\"). Defaults to \"912828ZG2\" if omitted.",
                "type": "string"
              },
              "face_value": {
                "default": 1000000,
                "description": "Par / notional principal face value in USD (positive number, e.g., 1000000 for $1M par; default: 1000000).",
                "type": "number"
              },
              "market_price": {
                "default": 93.5,
                "description": "Current clean market trading price expressed as a percentage of par (e.g., 93.50 for 93.50% of par; default: 93.50).",
                "type": "number"
              },
              "maturity_years": {
                "default": 5,
                "description": "Remaining time to stated maturity in years (minimum 0.5, e.g., 5.0 for 5 years; default: 5.0).",
                "type": "number"
              },
              "ticker": {
                "description": "Optional issuer ticker symbol used as fallback lookup when CUSIP is omitted (e.g., \"UST-5Y\", \"AAPL\", \"GS\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "convexity": {
                "description": "Approximate second-order rate sensitivity convexity.",
                "type": "number"
              },
              "credit_rating": {
                "description": "Composite institutional credit rating (e.g., AAA, AA, BBB).",
                "type": "string"
              },
              "cusip": {
                "description": "Resolved 9-character CUSIP identifier.",
                "type": "string"
              },
              "dv01_usd": {
                "description": "Dollar value of a 1 basis point (0.01%) parallel yield shift in USD.",
                "type": "number"
              },
              "exact_cashflow_ytm_pct": {
                "description": "Exact Newton-Raphson semi-annual cashflow yield-to-maturity percentage.",
                "type": "number"
              },
              "exact_convexity": {
                "description": "Exact semi-annual cashflow convexity.",
                "type": "number"
              },
              "exact_modified_duration_years": {
                "description": "Exact semi-annual cashflow modified duration in years.",
                "type": "number"
              },
              "issuer_name": {
                "description": "Legal name of the issuing entity.",
                "type": "string"
              },
              "jump_diffusion_95_bounds_usd": {
                "description": "Merton jump-diffusion 1-year 95% confidence interval bounds in USD.",
                "properties": {
                  "annual_total_volatility_pct": {
                    "description": "Combined diffusive and Poisson jump annualized volatility %.",
                    "type": "number"
                  },
                  "lower_bound_usd": {
                    "description": "95% downside tail valuation bound in USD.",
                    "type": "number"
                  },
                  "upper_bound_usd": {
                    "description": "95% upside valuation bound in USD.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "macaulay_duration_years": {
                "description": "Cashflow-weighted Macaulay duration in years.",
                "type": "number"
              },
              "market_value_usd": {
                "description": "Current mark-to-market position value in USD.",
                "type": "number"
              },
              "modified_duration_years": {
                "description": "Approximate interest-rate sensitivity modified duration in years.",
                "type": "number"
              },
              "receipt": {
                "description": "Cryptographic payment or API key settlement receipt ID.",
                "type": "string"
              },
              "recommendation": {
                "description": "Deterministic relative-value signal based on clean price vs. par.",
                "enum": ["DEEP_DISCOUNT_BUY", "ACCUMULATE", "HOLD_PAR"],
                "type": "string"
              },
              "security_name": {
                "description": "Descriptive bond issue title.",
                "type": "string"
              },
              "tool": {
                "description": "Executed tool identifier (\"get_cusip_valuation\").",
                "type": "string"
              },
              "yield_to_maturity_pct": {
                "description": "Approximate annualized yield-to-maturity percentage.",
                "type": "number"
              }
            },
            "required": ["cusip", "dv01_usd", "market_value_usd", "modified_duration_years", "recommendation", "tool", "yield_to_maturity_pct"],
            "type": "object"
          },
