        {
          "name": "get_research",
          "title": "Get research result",
          "description": "Status and result of a research job created by request_research. status: queued / running / answered / partly_answered / still_unknown / failed; phase: queued | running | retry_scheduled | completed_answer | completed_unknown | failed. Poll no more often than poll_after_seconds — polling is free and never repeats the work. result: answer (yes/no/partly/unknown), short_answer, evidence per claim (quote, URL, observed date; file path and revision for repositories; element for pricing-page buttons), facts assessed separately (e.g. Dockerfile vs published image vs Helm chart), conflicts and what remains unresolved.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job_id from request_research (rj_ + 12 hex).",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
