        {
          "name": "create_custom_benchmark",
          "title": "Create custom benchmark",
          "description": "Use when someone wants to keep watching the prices of products they choose (e.g. five named writing tools). Creates a PRIVATE custom benchmark (a saved, calculated peer cohort) over Agentery's data — no account needed. Two modes: (A) explicit members: pass `members` (a list of exact handles; product names/domains resolve where unambiguous). (B) fork a market: pass `base_niche` (its slug) plus optional `remove`/`add`. Returns a one-time secret `benchmark_id` (cb_… token) — store it; it's your only key. Use it later in get/update/delete and in market_report/get_price_index/get_price_index_history. Ambiguous names are returned as candidates, never silently resolved; unresolved inputs block creation unless allow_partial:true. All prices/history are computed from Agentery's immutable observations; canonical market data is never changed.",
          "inputSchema": {
            "properties": {
              "add": {
                "description": "members to add",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "allow_partial": {
                "description": "Create with only the resolved members when some inputs don't resolve (default false)",
                "type": "boolean"
              },
              "base_niche": {
                "description": "Mode B: slug of the canonical market to fork",
                "type": "string"
              },
              "members": {
                "description": "Mode A: exact handles (preferred), product names or domains",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Optional private label",
                "type": "string"
              },
              "remove": {
                "description": "Mode B: members to drop from the forked market",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
