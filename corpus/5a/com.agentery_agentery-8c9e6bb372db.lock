      "instructions": "Use Agentery (agentery.com) when someone is choosing an AI product, AI agent, MCP server or API for a task, comparing their prices, checking a quote against comparable offers, or tracking how AI tool prices change. For a new selection request, start with search_providers. Inspect promising candidates with get_provider_profile, then compare the shortlist with compare_providers. Use the returned provider IDs (handles). Check task fit, delivery type (provider / MCP server / API / platform), available pricing and billing units before recommending a product. Missing prices are unknown, not zero; contact-sales pricing is not a numeric quote; a related search result is a candidate to assess, not proof it fulfils every requirement. Use market_report or price_benchmark when market context is needed (price_benchmark takes `query`). research_capability is an optional combined research route (market + pricing context + shortlist in one call). get_price_index / get_price_index_history return the Agent Economy Price Index — an index level, never a market price; pass provider_type=agent|mcp for one delivery type. Demand tools (demand_signals, market_gaps) describe limited evidence from Agentery's own traffic and are not prerequisites for product selection. suggest_alternatives finds substitutes for one known provider (cheaper_only only when a valid price comparison exists). Use report_outcome only after actually using a listed provider. Which tool when: a task and no product names, search_providers; one named product, get_provider_profile (get_provider is only the short directory card); two to six named products, compare_providers; substitutes for one product, suggest_alternatives; whether a price or quote is fair for a type of product, get_group_fair_price; a price range for a capability split by agent and MCP, price_benchmark; the market behind a task, find_market or market_report; a question the catalogue cannot answer yet, request_research, then get_research with its job_id. If a call fails, the error carries code, fix and retryable: apply the fix rather than guessing. Worked examples: https://agentery.com/connect#examples. Public tools are rate-limited to 30 calls/min per IP (60 for outcome contributors). rank_providers_for_workflow is partner-only (Bearer key). Integration guidance and worked examples: https://agentery.com/connect",
      "tools": [
        {
          "name": "compare_providers",
          "title": "Compare providers",
          "description": "Use to compare 2–6 shortlisted listings side by side — plan-level prices (e.g. the Pro tier), capabilities, deployment, licence and how to connect — or to check a quote against alternatives. Inputs resolve to real listings by exact handle, then exact name, never a silent fuzzy swap: unknown inputs come back in unresolved_inputs with suggested_matches and a corrected_call; if only one input is real it is compared with its nearest market peers (comparison_status says so); if none resolve, comparison_status is insufficient_valid_providers. Mixed delivery types are flagged: a hosted agent and an MCP server are not directly equivalent, so compare hosted prices with hosted prices. Over-budget or weak matches get suggested_alternatives. Returns a concise decision view by default (fit, observed plans and prices with source and date, job cost, requirement verdicts, unknowns); pass detail:\"full\" for every field. Accepts `provider_ids` (aliases: handles, ids, or a comma-separated string).",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "Optional. concise (default): the decision view. full: the complete comparison (all plan lines, evidence checks, deployment, licence, how to connect, requirement evidence excerpts).",
                "enum": ["concise", "full"],
                "type": "string"
              },
              "optional": {
                "description": "Optional preferences: reported in service_view but never gating.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "provider_ids": {
                "description": "2-6 provider handles from search_providers/market_gaps, e.g. [\"openhands\",\"lexaclaw\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "request_ref": {
                "description": "Optional task reference (rq_ + 12 hex) from an earlier answer. Continues that task: its remembered facts (quantities, budget, requirements, benchmark selection) apply to this call, and the answer keeps the same request_ref.",
                "type": "string"
              },
              "requirements": {
                "description": "Optional. Mandatory requirements as plain phrases (e.g. \"sanctions screening\", \"documented MCP interface\"). Adds an ADDITIVE service_view: per-provider evidence matrix from stored first-party page text — supported / not_supported / unknown with the excerpt and observation date; unknown never means unsupported.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "service": {
                "description": "Optional. A service recipe whose fixed requirements and evidence fields are applied (see service_view.requirements).",
                "enum": ["supplier-verification", "contract-review", "developer-capabilities", "cheaper-alternatives"],
                "type": "string"
              },
              "task": {
                "description": "Optional. The buyer's job in plain words; used as the service_view heading.",
                "type": "string"
              }
            },
            "required": ["provider_ids"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b536c2690bec09d16f191f5d938a6a98f3311da13228a5bfcf3202b05557c928"
