                "type": "number"
              },
              "query": {
                "description": "Natural-language capability or market, e.g. 'customer support chatbot' or 'ai phishing detection'.",
                "type": "string"
              },
              "request_ref": {
                "description": "Optional task reference (rq_ + 12 hex) from an earlier answer. Continues that task: its remembered facts (quantities, budget, requirements, benchmark selection) apply to this call, and the answer keeps the same request_ref.",
                "type": "string"
              },
              "response_mode": {
                "description": "'summary' (DEFAULT): neighbourhood counts, per-type/per-tier price cohorts and the top 12 providers. 'full' (1.17.0): EVERY member of the neighbourhood, paged with offset / limit, each with its price reading (plan, unit, currency, source, observed date).",
