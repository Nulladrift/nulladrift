        {
          "name": "get_price_index",
          "title": "Get price index",
          "description": "Use when asked whether prices of AI agents, tools or MCP servers are rising or falling overall. Returns the current Agent Economy Price Index (AEPI), a chained quoted-price index of observed agent and MCP pricing in US dollars (changes in the publicly quoted price of the same product and offer; base 100 = 30 Jun 2026; an index level, not a price), with 1-, 7- and 30-day change, plus the same for the four buyer tiers (Individual, Pro, Team/SME, Enterprise). Every response names its release_id, reference_currency and methodology_revision; response_mode=full adds fx_attribution (exact native-price and exchange-rate contributions per window: log changes add, level factors multiply) and currency_evidence. provider_type=agent|mcp gives the standalone index for that delivery type; tier narrows to one tier. For the trend over time use get_price_index_history; for what a particular kind of product costs use get_group_fair_price or price_benchmark.",
          "inputSchema": {
            "properties": {
              "benchmark_id": {
                "description": "Optional: a private custom benchmark token (cb_…) from create_custom_benchmark — returns that cohort's current index instead of the economy index. Cannot be combined with niche.",
                "type": "string"
              },
              "provider_type": {
                "description": "'all' (default) = the combined whole-economy index; 'agent' or 'mcp' = the standalone index over just that delivery type (own base 100); 'payg' = the standalone pay-as-you-go sub-index (usage rates purchasable without a subscription, engine v2). Agents and MCPs price and move differently, so an MCP buyer should read the 'mcp' index and an agent buyer the 'agent' index.",
                "enum": ["all", "agent", "mcp", "subscription", "hybrid", "one_off", "payg"],
                "type": "string"
              },
              "response_mode": {
                "description": "'summary' (default) or 'full' (adds exact native / FX / combined contributions for the 1d, 7d and 30d windows with their from/to days and units, the currency-evidence split of the index weight, and the full methodology revision note).",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "tier": {
                "description": "Filter to one buyer tier ('team' = Team/SME). Default 'all'.",
                "enum": ["all", "individual", "pro", "team", "enterprise"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03a6c2464fb80157f885f86864778f1e597520dfdd2b9bd845701dcff4ae9458"
        },
        {
          "name": "get_price_index_history",
          "title": "Get price index history",
          "description": "Use to show how AI agent and MCP prices have moved over time: the dated Agent Economy Price Index series, the same chained quoted-price series (US dollars, base 100 = 30 Jun 2026) agentery.com/aepi charts. Points are index levels, never prices; calendar days with no published observation are listed in gaps with their reason, never interpolated. Whole-economy series by default; `tier` for one buyer tier; provider_type agent|mcp for one delivery type (own base 100); `period` 30d (default) / 90d / all; response_mode summary (default) or full (adds per-day native / FX / combined components and the window's exact attribution). Thin data returns insufficient_history, never an invented series. For what one capability costs use price_benchmark or market_report. Also reads a private custom benchmark's history via benchmark_id.",
          "inputSchema": {
            "properties": {
              "benchmark_id": {
                "description": "Optional: a private custom benchmark token (cb_…) — returns that cohort's dated series instead of the economy series. Cannot be combined with niche.",
                "type": "string"
              },
              "period": {
                "description": "History window. Default '30d'.",
                "enum": ["30d", "90d", "all"],
                "type": "string"
              },
              "provider_type": {
                "description": "'all' (default) = the combined whole-economy series, or the standalone 'agent' / 'mcp' / 'subscription' / 'hybrid' / 'one_off' / 'payg' = the billing-LENS series (they cut across provider/mcp; a rate sits in one delivery type AND one lens; own base 100) — 'payg' (pay-as-you-go, engine v2) series (own base 100).",
                "enum": ["all", "agent", "mcp", "subscription", "hybrid", "one_off", "payg"],
                "type": "string"
              },
              "response_mode": {
                "description": "'summary' (default, compact) or 'full' (adds per-day native / FX / combined log changes and levels, the window's exact attribution and the currency-evidence split).",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "since": {
                "description": "Optional, for providers that poll: the `cursor` (or `next_cursor`) from your previous call, or an ISO timestamp of your last check. Returns only what changed since then: new_points (newly published days), corrected_points (earlier days whose published level changed, with previous_level) and withdrawn_points, plus next_cursor for the next call. status 'no_changes' when nothing changed. Omit for the full history.",
                "type": "string"
              },
              "tier": {
                "description": "Return one buyer tier's series ('team' = Team/SME). Default 'all' = the headline series.",
                "enum": ["all", "individual", "pro", "team", "enterprise"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price index history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a827d24b49522b106886549ce17ebe54d78b911da1aee5249b4ac033f5254308"
