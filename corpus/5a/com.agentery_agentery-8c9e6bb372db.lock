        {
          "name": "price_benchmark",
          "title": "Benchmark a price",
          "description": "Judges a specific price or quote against the closest comparable products by what they do (no fixed categories), in the buyer's tier and pricing unit. Use this when asked whether a price is fair or what a capability typically costs, e.g. 'Is $49/month reasonable for an AI SDR for a small team?'. Pass the capability as `query` (aliases: task, niche). Returns observed prices of comparable products — median, p25/p75, range, mean, stdev and n — split by delivery type (agent | mcp) and buyer tier (individual / pro / team_sme / enterprise), never blended across incompatible pricing units. A benchmark describes an observed sample; it is not a quote and not evidence of willingness to pay. Set provider_type and buyer_tier when known. If nothing priced is close it returns resolved:false with a note, never an invented figure. Use get_group_fair_price instead for a broad group-wide guide; find_market for who competes.",
          "inputSchema": {
            "properties": {
              "buyer_tier": {
                "description": "Buyer tier being priced. Set when the user describes who is buying (an individual, a professional, a team/SME, or an enterprise). An individual licence must never be represented by the SME or enterprise price.",
                "enum": ["individual", "pro", "team_sme", "enterprise", "all"],
                "type": "string"
              },
              "cohort_ref": {
                "description": "Optional (1.17.0): reuse the exact set of comparable providers selected by an earlier price_benchmark / market_report / research_capability call (its cohort_ref), instead of re-selecting the market from new wording.",
                "type": "string"
              },
              "commitment": {
                "description": "Billing commitment of proposed_price (default monthly).",
                "enum": ["monthly", "annual"],
                "type": "string"
              },
              "currency": {
                "description": "Currency of proposed_price (ISO code, default USD).",
                "type": "string"
              },
              "limit": {
                "description": "Observations per page in full mode (1–100, default 50).",
                "type": "number"
              },
              "niche": {
                "description": "Legacy alias of `query`, kept for older clients — prefer `query`.",
                "type": "string"
              },
              "offset": {
                "description": "Paging offset over the selected observations in full mode.",
                "type": "number"
              },
              "pricing_unit": {
                "description": "Billing unit the benchmark is FOR (1.17.0: honoured). Selects the comparable observations; units are never converted into one another, and a thin unit returns its observations and the gap — never a flat-monthly substitute. A query such as 'cost per support ticket' sets it when omitted.",
                "enum": ["flat", "per_seat", "per_agent", "per_call", "per_ticket", "per_conversation", "per_resolution", "per_transaction", "per_invoice", "per_document", "per_page", "per_minute", "per_message", "per_email", "per_credit", "per_token", "percent_of_spend"],
                "type": "string"
              },
              "proposed_price": {
                "description": "Optional (sellers): a proposed price to position against the selected comparable offers (same unit; currency below). Returns where it sits in the observed range; a percentile only with ≥5 comparable providers. A market reference, not an optimal price.",
                "type": "number"
              },
              "provider_type": {
                "description": "Delivery type being priced. Set when the user says provider, MCP or API. Omit (or 'all') to get the per-type matrix instead of a blended figure. 'api' is recognised but not yet a separate commercial cohort (folded into provider).",
                "enum": ["agent", "mcp", "api", "all"],
                "type": "string"
              },
              "query": {
                "description": "The capability to benchmark, in natural language, e.g. 'AI code review' or 'supplier invoice reconciliation'. Preferred input.",
                "type": "string"
              },
              "request_ref": {
                "description": "Optional task reference (rq_ + 12 hex) from an earlier answer. Continues that task: its remembered facts (quantities, budget, requirements, benchmark selection) apply to this call, and the answer keeps the same request_ref.",
                "type": "string"
              },
              "response_mode": {
                "description": "'summary' (default): the selected benchmark with its top observations. 'full': every included observation (paged), with plan, native price, unit, commitment, source and observed date.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "sector": {
                "description": "Sector name, e.g. 'legal' (ignored if a query is given)",
                "type": "string"
              },
              "task": {
                "description": "Alias of `query` (same text).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
