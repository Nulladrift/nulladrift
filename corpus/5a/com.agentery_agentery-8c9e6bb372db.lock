        {
          "name": "demand_signals",
          "title": "View demand signals",
          "description": "Lists searches that found nothing good: queries by external callers in the last 90 days that returned no provider or only weak matches (best relevance below 0.62). Use this when you want searches Agentery could not answer well, as generalised job labels ranked by distinct callers. Most entries come from a single caller: treat those as leads. These are limited coverage signals from Agentery's own callers — not proof that a product does not exist, and not proof that a market has paying demand. Not a prerequisite for choosing a product. Empty args ({}) return the current list; an empty response means insufficient qualifying evidence (status insufficient_evidence + next_step) — it is never filled from search popularity, page views or trending queries. Use market_gaps instead for jobs that few paid products serve.",
          "inputSchema": {
            "properties": {
              "include_own": {
                "description": "Also list signals that come ONLY from your own searches (default false; counted in your_own_only_excluded)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max signals (1-50, default 20)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "View demand signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7438cd920098081911ab89b604d11109cc0c23f220eabb2da278a1ed6efd91e6"
        },
        {
          "name": "find_market",
          "title": "Find a market",
          "description": "Maps a task to its market: who competes there, how many are priced, and the price level per buyer tier. Use this when someone asks who competes in a space or what a kind of product costs, e.g. 'tools that monitor competitor pricing'. Returns the market label (nearest providers by meaning, no fixed categories), provider and priced counts, the nearest providers with observed prices, and pricing_by_tier (median, p25/p75, range and n per buyer tier). When nothing is close it returns no_match or thin_coverage and withholds pricing rather than invent a market. Use market_report instead for the full measured breakdown; research_capability for market plus shortlist in one call; price_benchmark to judge a specific price.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Alias for task (back-compat only) — prefer task",
                "type": "string"
              },
              "task": {
                "description": "REQUIRED. A natural-language task, capability or service in plain words, e.g. 'reconcile supplier invoices'. Call as {\"task\": \"…\"}; an empty call returns status needs_input with an example and searches nothing.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "JSON result; identical to the text content block.",
            "type": "object"
          },
