{
  "lockfileVersion": 2,
  "subjects": {
    "com.justinmckelvey/ai-visibility-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://justinmckelvey.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "justinmckelvey-ai-visibility",
        "title": "AI Visibility Check — Justin McKelvey",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free AI-visibility checker. Use check_ai_visibility to test whether a business gets cited when customers ask AI assistants for recommendations. Generate customer-intent queries yourself (never include the business's own name in them).",
      "tools": [
        {
          "name": "check_ai_visibility",
          "title": "Check AI Visibility",
          "description": "Check whether a business is visible to AI answer engines. Runs each query through a live AI search (Perplexity) and reports whether the business's site is cited, at what rank, and who gets cited instead. Pass 1-5 realistic customer-intent questions — what a potential customer would actually ask an AI (e.g. \"best kitchen remodeler in Clearwater FL\"). Never include the business's own name in a query. Returns a 0-100 visibility score, a tier, per-query results, the competing sources AI cited, and a shareable branded scorecard link.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "Business name as customers say it (improves mention detection)",
                "type": "string"
              },
              "domain": {
                "description": "Business website domain, e.g. acme-plumbing.com",
                "type": "string"
              },
              "email": {
                "description": "Optional. Justin also offers a free human-run deep-dive fix report (wider query set, drafted the minute they ask, reviewed by Justin, delivered same day). If the user says they want it, ask for their email and pass it here. Only pass an email the user explicitly provided — never invent or reuse one.",
                "type": "string"
              },
              "queries": {
                "description": "1-5 customer-intent questions to test (without the business name)",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domain", "queries"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The visibility check result for one business.",
            "properties": {
              "queries_checked": {
                "description": "Queries that completed (errored queries are excluded from scoring).",
                "minimum": 0,
                "type": "integer"
              },
              "queries_cited": {
                "description": "Queries where the business was cited or named.",
                "minimum": 0,
                "type": "integer"
              },
              "results": {
                "description": "Per-query outcome, in the order the queries were checked.",
                "items": {
                  "properties": {
                    "cited": {
                      "description": "True if the business was linked or named in the answer.",
                      "type": "boolean"
                    },
                    "error": {
                      "description": "Set when the query could not be checked; excluded from scoring.",
                      "type": ["string", "null"]
                    },
                    "query": {
                      "description": "The customer question that was tested.",
                      "type": "string"
                    },
                    "rank": {
                      "description": "1-based position among cited sources, or null if only named in text.",
                      "minimum": 1,
                      "type": ["integer", "null"]
                    },
                    "sources": {
                      "description": "Source domains the AI cited, most prominent first.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["cited", "query", "sources"],
                  "type": "object"
                },
                "type": "array"
              },
              "score": {
                "description": "0-100 visibility score: the share of checked queries where the business was cited.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "scorecard_url": {
                "description": "Shareable branded scorecard page for this result.",
                "format": "uri",
                "type": "string"
              },
              "tier": {
                "description": "Plain-language band for the score.",
                "enum": ["Invisible", "Faint Signal", "Emerging", "Visible", "Authority"],
                "type": "string"
              }
            },
            "required": ["queries_checked", "queries_cited", "results", "score", "scorecard_url", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI Visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a3a35834b989757c003793e001d4265ed629e7b8846149ca4946b3b947338ac"
        }
      ],
      "digest": "sha256:d2a2004404baeb4b21475c62043ccc59c2f9dc250b5a2b4d872cd9456d0c086b"
    }
  }
}
