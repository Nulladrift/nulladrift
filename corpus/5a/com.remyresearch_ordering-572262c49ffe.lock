      "serverInfo": {
        "name": "com.remyresearch/ordering",
        "title": "Remy Research MCP",
        "version": "1.2.0",
        "websiteUrl": "https://remyresearch.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Remy Research UAE catalogue: search_products finds products, quote_basket prices a basket and returns the checkout link when it is ready, prepare_checkout adds optional buyer prefill to that link. The buyer finishes on the website; no tool submits an order. Both basket tools (quote_basket, prepare_checkout): Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. UAE only. Public catalogue and basket preparation; no order submission or payment tool. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Send the checkoutUrl to the buyer for their own review and confirmation. Never claim a prepared basket is an order. Do not send personal data to search_products or quote_basket. Only prepare_checkout accepts optional buyer name, phone, email and address for prefill; use supplied values as-is and never infer or invent them. Do not turn catalogue facts into health, treatment or dosage advice. Reading replies: a refusal has isError true with error, message, field and nextAction (plus blockers, unavailableItems or remainingItems when they apply). A priced basket that cannot be ordered yet is not an error: it has readyForReview false and a blockers list with the amounts and a nextAction. catalogExpiresAt is this server’s cache clock, not a deadline: a checkout link does not expire and the order page rechecks stock and prices when the buyer opens it.",
      "tools": [
        {
          "name": "prepare_checkout",
          "description": "Build the buyer’s checkout link with optional prefill of the name, phone, email and address the buyer gave you. Use it only when there are details to prefill; without them the checkoutUrl from quote_basket is the same link. The server does not store or log buyer details: they exist only inside the returned link, which is not encrypted, so share it only with the buyer. Creates NO order. The buyer opens the link, reviews or corrects details, accepts terms and personally confirms. Card payment link follows by WhatsApp. A basket with blockers is refused with the same blockers and amounts quote_basket reports. Both basket tools (quote_basket, prepare_checkout): Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Reading replies: a refusal has isError true with error, message, field and nextAction (plus blockers, unavailableItems or remainingItems when they apply). A priced basket that cannot be ordered yet is not an error: it has readyForReview false and a blockers list with the amounts and a nextAction. catalogExpiresAt is this server’s cache clock, not a deadline: a checkout link does not expire and the order page rechecks stock and prices when the buyer opens it. Send these fields inside tools/call params.arguments. Both basket tools are stateless: send the complete basket again, combining duplicate IDs. Do not send prices, totals, consent or approval flags. If a call returns INVALID_ARGUMENTS, follow missingFields (when present) and nextAction; correct invalid values or collect missing information before retrying with the complete basket. Dubai and qty 1 are examples, not defaults; replace them with the buyer-selected emirate and quantity, and replace PRODUCT_ID_FROM_SEARCH with an orderable id from search. No cart, session or quote ID is accepted. Buyer prefill is optional and must be nested inside buyer. Example arguments: {\"country\":\"AE\",\"emirate\":\"Dubai\",\"items\":[{\"id\":\"PRODUCT_ID_FROM_SEARCH\",\"qty\":1}]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "additionalProperties": false,
                "description": "Optional buyer-supplied prefill, accepted only by prepare_checkout. Omit if not supplied. No payment, consent or approval fields. The server does not store or log these details; they exist only inside the returned link, which is not encrypted, so share it only with the buyer.",
                "properties": {
                  "address": {
                    "description": "Optional buyer-supplied address, up to 500 characters; do not invent missing delivery details.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "email": {
                    "description": "Optional buyer-supplied email, up to 254 characters; use the supplied value as-is.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "description": "Optional buyer-supplied name, up to 120 characters; do not infer or invent it.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Optional buyer-supplied phone, up to 40 characters; use the supplied value as-is.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "country": {
                "const": "AE",
                "description": "Required delivery country code: AE means United Arab Emirates.",
                "type": "string"
              },
              "emirate": {
                "description": "Required buyer-selected destination. Use an exact listed emirate; ask the buyer if unknown, never assume Dubai.",
                "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                "type": "string"
              },
              "items": {
                "description": "Required COMPLETE desired basket of 1–20 distinct variant IDs. Combine the same ID into one line; send the entire updated basket on every call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Required exact id from the latest search_products result, not sku, product name or URL. Select an orderable variant.",
                      "maxLength": 150,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Required buyer-selected quantity as a JSON integer from 1 to 10, for example 2, not \"2\". The field is qty, not quantity. Ask the buyer if unknown; there is no default quantity.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "qty"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "promoCode": {
                "description": "Optional buyer-supplied promotion code, up to 24 letters or digits. Omit when absent; do not invent one.",
                "pattern": "^[a-zA-Z0-9]{0,24}$",
                "type": "string"
              }
            },
            "required": ["country", "emirate", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:211a319e8e2890983be27280d3efca734356a315641bb44205238ed47548e8b0"
        },
        {
          "name": "quote_basket",
          "description": "Price a complete UAE basket: line prices, discount, delivery fee and estimate for the buyer’s emirate, the payment methods the checkout will offer, and any blocker with the amount needed to fix it. When the basket is ready the reply already contains checkoutUrl, the link the buyer opens to finish, so no second call is needed unless the buyer wants details prefilled. Add/remove/change items and call again. Both basket tools (quote_basket, prepare_checkout): Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. UAE only. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Does not store or submit an order. Reading replies: a refusal has isError true with error, message, field and nextAction (plus blockers, unavailableItems or remainingItems when they apply). A priced basket that cannot be ordered yet is not an error: it has readyForReview false and a blockers list with the amounts and a nextAction. catalogExpiresAt is this server’s cache clock, not a deadline: a checkout link does not expire and the order page rechecks stock and prices when the buyer opens it. Send these fields inside tools/call params.arguments. Both basket tools are stateless: send the complete basket again, combining duplicate IDs. Do not send prices, totals, consent or approval flags. If a call returns INVALID_ARGUMENTS, follow missingFields (when present) and nextAction; correct invalid values or collect missing information before retrying with the complete basket. Dubai and qty 1 are examples, not defaults; replace them with the buyer-selected emirate and quantity, and replace PRODUCT_ID_FROM_SEARCH with an orderable id from search. Do not send buyer details to quote_basket. Example arguments: {\"country\":\"AE\",\"emirate\":\"Dubai\",\"items\":[{\"id\":\"PRODUCT_ID_FROM_SEARCH\",\"qty\":1}]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "const": "AE",
                "description": "Required delivery country code: AE means United Arab Emirates.",
                "type": "string"
              },
              "emirate": {
                "description": "Required buyer-selected destination. Use an exact listed emirate; ask the buyer if unknown, never assume Dubai.",
                "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                "type": "string"
              },
              "items": {
                "description": "Required COMPLETE desired basket of 1–20 distinct variant IDs. Combine the same ID into one line; send the entire updated basket on every call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Required exact id from the latest search_products result, not sku, product name or URL. Select an orderable variant.",
                      "maxLength": 150,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Required buyer-selected quantity as a JSON integer from 1 to 10, for example 2, not \"2\". The field is qty, not quantity. Ask the buyer if unknown; there is no default quantity.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "qty"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "promoCode": {
                "description": "Optional buyer-supplied promotion code, up to 24 letters or digits. Omit when absent; do not invent one.",
                "pattern": "^[a-zA-Z0-9]{0,24}$",
                "type": "string"
              }
            },
            "required": ["country", "emirate", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f28bbc5ca19896b0997492e01f1e7be0d1a95ef76db889bdead762322c577bf"
        },
        {
          "name": "search_products",
          "description": "Search public product variants by query, compound, format, brand, inStockOnly and inclusive single-unit AED price bounds. Results rank exact matches first and include strength, volume, storage guidance and batch-report evidence with unknowns explicit. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Return exact id values to the basket tools; sku, name and URL are not basket IDs. No personal information required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Exact catalogue brand name, case-insensitive, e.g. ProPeptide.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "compound": {
                "description": "Exact compound name, ID or documented alias, e.g. BPC-157 or bpc157. Includes blends containing that compound.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "Product format. vial includes vial kits; kit amounts remain explicit in strength.label.",
                "enum": ["vial", "pen"],
                "type": "string"
              },
              "inStockOnly": {
                "description": "Return only currently orderable, in-stock variants. Defaults to false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum products returned, 1–50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceAed": {
                "description": "Inclusive maximum single-unit AED price, before discounts/delivery.",
                "minimum": 0,
                "type": "number"
              },
              "minPriceAed": {
                "description": "Inclusive minimum single-unit AED price, before discounts/delivery.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "description": "Start at 0 or use nextOffset. Keep filters unchanged across pages.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional product text or compound alias. Exact IDs/names rank first. Never include personal information.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
