      "serverInfo": {
        "name": "com.remyresearch/ordering",
        "title": "Remy Research MCP",
        "version": "1.1.0",
        "websiteUrl": "https://remyresearch.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "For quote_basket and prepare_checkout only. Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. UAE only. Public catalogue and basket preparation; no order submission or payment tool. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Send the checkoutUrl to the buyer for their own review and confirmation. Never claim a prepared basket is an order. Do not send personal data to search_products or quote_basket. Only prepare_checkout accepts optional buyer name, phone, email and address for prefill; use supplied values as-is and never infer or invent them. Do not turn catalogue facts into health, treatment or dosage advice.",
      "tools": [
        {
          "name": "prepare_checkout",
          "description": "For quote_basket and prepare_checkout only. Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. Return a buyer review link for a valid UAE basket. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Optional buyer name, phone, email and address may be supplied for prefill only. The link contains those details and must be shared only with the buyer. Creates NO order. Buyer must open the link, review or correct details, accept terms and personally confirm. Card payment link follows by WhatsApp. Send these fields inside tools/call params.arguments. Both basket tools are stateless: send the complete basket again, combining duplicate IDs. Do not send prices, totals, consent or approval flags. If a call returns INVALID_ARGUMENTS, follow missingFields (when present) and nextAction; correct invalid values or collect missing information before retrying with the complete basket. Dubai and qty 1 are examples, not defaults; replace them with the buyer-selected emirate and quantity, and replace PRODUCT_ID_FROM_SEARCH with an orderable id from search. Quote first and resolve blockers, then send the same complete basket here. No cart, session or quote ID is accepted. Buyer prefill is optional and must be nested inside buyer. Example arguments: {\"country\":\"AE\",\"emirate\":\"Dubai\",\"items\":[{\"id\":\"PRODUCT_ID_FROM_SEARCH\",\"qty\":1}]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "additionalProperties": false,
                "description": "Optional buyer-supplied prefill, accepted only by prepare_checkout. Omit if not supplied. No payment, consent or approval fields. The resulting link contains these details and is not encrypted; share only with the buyer.",
                "properties": {
                  "address": {
                    "description": "Optional buyer-supplied address, up to 500 characters; do not invent missing delivery details.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "email": {
                    "description": "Optional buyer-supplied email, up to 254 characters; use the supplied value as-is.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "description": "Optional buyer-supplied name, up to 120 characters; do not infer or invent it.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Optional buyer-supplied phone, up to 40 characters; use the supplied value as-is.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "country": {
                "const": "AE",
                "description": "Required delivery country code: AE means United Arab Emirates.",
                "type": "string"
              },
              "emirate": {
                "description": "Required buyer-selected destination. Use an exact listed emirate; ask the buyer if unknown, never assume Dubai.",
                "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                "type": "string"
              },
              "items": {
                "description": "Required COMPLETE desired basket of 1–20 distinct variant IDs. Combine the same ID into one line; send the entire updated basket on every call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Required exact id from the latest search_products result, not sku, product name or URL. Select an orderable variant.",
                      "maxLength": 150,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Required buyer-selected quantity as a JSON integer from 1 to 10, for example 2, not \"2\". The field is qty, not quantity. Ask the buyer if unknown; there is no default quantity.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "qty"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "promoCode": {
                "description": "Optional buyer-supplied promotion code, up to 24 letters or digits. Omit when absent; do not invent one.",
                "pattern": "^[a-zA-Z0-9]{0,24}$",
                "type": "string"
              }
            },
            "required": ["country", "emirate", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87aaf229d0bcb0e3e36260b59904a6d9ffd9350314f5d2474541ec3b16f98ad8"
        },
        {
          "name": "quote_basket",
          "description": "For quote_basket and prepare_checkout only. Required on every call: country (AE), emirate (buyer-selected destination) and items (the complete basket). Each item requires id and qty. Ask the buyer for any missing destination or quantity before calling; use search_products to resolve exact orderable product IDs. Never guess missing values. Create or update a quote by supplying the COMPLETE desired basket. Add/remove/change items in that list and call again. UAE only. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Includes the selected emirate’s delivery estimate, cutoff and fee explanation. Does not store or submit an order. Send these fields inside tools/call params.arguments. Both basket tools are stateless: send the complete basket again, combining duplicate IDs. Do not send prices, totals, consent or approval flags. If a call returns INVALID_ARGUMENTS, follow missingFields (when present) and nextAction; correct invalid values or collect missing information before retrying with the complete basket. Dubai and qty 1 are examples, not defaults; replace them with the buyer-selected emirate and quantity, and replace PRODUCT_ID_FROM_SEARCH with an orderable id from search. Do not send buyer details to quote_basket. Example arguments: {\"country\":\"AE\",\"emirate\":\"Dubai\",\"items\":[{\"id\":\"PRODUCT_ID_FROM_SEARCH\",\"qty\":1}]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "const": "AE",
                "description": "Required delivery country code: AE means United Arab Emirates.",
                "type": "string"
              },
              "emirate": {
                "description": "Required buyer-selected destination. Use an exact listed emirate; ask the buyer if unknown, never assume Dubai.",
                "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                "type": "string"
              },
              "items": {
                "description": "Required COMPLETE desired basket of 1–20 distinct variant IDs. Combine the same ID into one line; send the entire updated basket on every call.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Required exact id from the latest search_products result, not sku, product name or URL. Select an orderable variant.",
                      "maxLength": 150,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Required buyer-selected quantity as a JSON integer from 1 to 10, for example 2, not \"2\". The field is qty, not quantity. Ask the buyer if unknown; there is no default quantity.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "qty"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "promoCode": {
                "description": "Optional buyer-supplied promotion code, up to 24 letters or digits. Omit when absent; do not invent one.",
                "pattern": "^[a-zA-Z0-9]{0,24}$",
                "type": "string"
              }
            },
            "required": ["country", "emirate", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22fea989ba319b1ccca6dda0b390f68834cc88cb6da7fcdda04ce6a92801148c"
        },
        {
          "name": "search_products",
          "description": "Search public product variants by query, compound, format, brand, inStockOnly and inclusive single-unit AED price bounds. Results rank exact matches first and include strength, volume, storage guidance and batch-report evidence with unknowns explicit. For Research Use Only. This research-use-only catalogue is for buyers 21+ years of age and is supplied for research purposes only. Not for human or veterinary use. Return exact id values to the basket tools; sku, name and URL are not basket IDs. No personal information required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Exact catalogue brand name, case-insensitive, e.g. ProPeptide.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "compound": {
                "description": "Exact compound name, ID or documented alias, e.g. BPC-157 or bpc157. Includes blends containing that compound.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "Product format. vial includes vial kits; kit amounts remain explicit in strength.label.",
                "enum": ["vial", "pen"],
                "type": "string"
              },
              "inStockOnly": {
                "description": "Return only currently orderable, in-stock variants. Defaults to false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum products returned, 1–50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceAed": {
                "description": "Inclusive maximum single-unit AED price, before discounts/delivery.",
                "minimum": 0,
                "type": "number"
              },
              "minPriceAed": {
                "description": "Inclusive minimum single-unit AED price, before discounts/delivery.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "description": "Start at 0 or use nextOffset. Keep filters unchanged across pages.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional product text or compound alias. Exact IDs/names rank first. Never include personal information.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7ab225be971f947ec20b8a6734ec116c3aebd24ed74236f2160ba428a0930d0"
        }
      ],
      "digest": "sha256:69248ddded67ab44000174f183f7d27d6a6f4021e132001d682bc9f03e8d848a"
    }
  }
