          "description": "Atomically add a study text, related links and ordered learning trail near similar map posts.\n\nFirst call find_related_map_topics. Put selected existing topic IDs in learning order;\nthe new post is appended as the last trail step. The server infers a category and position.\nA stable idempotency_key makes retries safe. Contributors create drafts for review.\n",
