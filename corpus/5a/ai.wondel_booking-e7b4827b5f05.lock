{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/booking/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Booking",
        "title": "Booking MCP",
        "version": "1.0.0",
        "description": "Experimental Booking.com hotel search: nightly price, rating, stars and booking link.",
        "websiteUrl": "https://mcps.wondel.ai/servers/booking/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Booking.com (https://www.booking.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "booking_search_hotels",
          "title": "Search Booking.com hotels (experimental)",
          "description": "EXPERIMENTAL: hotels on Booking.com for a location and stay window, scraped from the search-results page: name, nightly price, review score + count, star class, image and a direct booking link per property. Booking sits behind AWS WAF, so the call may return a blocked error — google_hotels_search is the reliable alternative (and covers Booking's prices among OTAs). Result shape: { source, fetchedAt, experimental, query, search_url, location, checkin, checkout, currency, count, hotels: [...] } — the list key is `hotels`. Each hotel: { name, price_per_night, currency, rating, reviews, hotel_class, booking_url, thumbnail } (fields are null when Booking omits them).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 2.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency for prices (e.g. 'PLN', 'EUR'). Omit for Booking's default for the region.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "description": "Max hotels to return (default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Free-text location, e.g. 'Warsaw' or 'Zakopane, Poland'.",
                "minLength": 1,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh Booking.com fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "rooms": {
                "description": "Number of rooms. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["checkin", "checkout", "location"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "checkin": {
                "type": "string"
              },
              "checkout": {
                "type": "string"
              },
              "count": {
                "type": "number"
              },
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "experimental": {
                "const": true,
                "type": "boolean"
              },
              "fetchedAt": {
                "type": "string"
              },
              "hotels": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "booking_url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "hotel_class": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_per_night": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "rating": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "reviews": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "thumbnail": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["booking_url", "currency", "hotel_class", "name", "price_per_night", "rating", "reviews", "thumbnail"],
                  "type": "object"
                },
                "type": "array"
              },
              "location": {
                "type": "string"
              },
              "query": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "search_url": {
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "count", "currency", "experimental", "fetchedAt", "hotels", "location", "query", "search_url", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d91f2425e8eeadacea9b221bd169993fe165da100cdebe46dddf1ff99d756fdf"
        }
      ],
      "digest": "sha256:1f62abffc8ce06148466028488eb91d0eabd5753f2a656bb1ebd7b7bdb38b892"
    }
  }
}
