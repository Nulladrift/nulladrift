        {
          "name": "get_place",
          "title": "Get place details",
          "description": "Read one China Footnotes place by id (from search_places). For a practical question, pass sections:[\"practical\",\"notices\"] and only the fields needed; fields apply when sections includes \"practical\" or is omitted. Use sections:[\"intro\"] for an overview; omit both for the full entry. Available content: why go, what to do, opening hours with weekday and seasonal rules, ticket prices, booking channels and whether passports work, last entry, metro and taxi directions, notices in effect, current and upcoming events (temporary festivals, exhibitions and shows), what was searched but not found, traveler tips, many of them firsthand reports from Chinese travelers and locals (routes, timing and crowds, entrances, food nearby, scams, what to expect), photos, and every source with its link. Optional fields/sections select complete facts with sources. Tips default to 3 eligible entries after the shared quality ordering; tipLimit (0–50) and tipOffset page through them, with totals, per-topic counts of all eligible tips before pagination, and nextOffset. includeTravelerTips:false excludes community tips. Practical rules are not truncated by tipLimit. Returns the canonical page link, field sources and the page interactions available (pageFeatures). visitDate adds a conservative stored-rule check in Asia/Shanghai. Each practical field carries its status and actual check date; this is not live confirmation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Practical fields to return; omit for all. Applies when sections includes \"practical\" or is omitted.",
                "items": {
                  "enum": ["hours", "admission", "booking", "lastAdmission", "foreignVisitors", "transport"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "id": {
                "description": "Place id from search_places, e.g. \"yuyuan-garden\".",
                "maxLength": 100,
                "type": "string"
              },
              "includeTravelerTips": {
                "default": true,
                "description": "false leaves community traveler tips out.",
                "type": "boolean"
              },
              "sections": {
                "description": "Parts of the entry to return; omit for the full entry. intro: overview; practical: the fields with sources; gaps: what was searched but not found.",
                "items": {
                  "enum": ["intro", "practical", "notices", "events", "tips", "gaps", "photos"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "tipLimit": {
                "default": 3,
                "description": "Traveler tips to return (0–50, default 3).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "tipOffset": {
                "default": 0,
                "description": "Traveler tips to skip; pass nextOffset from the previous call.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "visitDate": {
                "description": "Date in Asia/Shanghai, YYYY-MM-DD. Stored rules only; not live availability.",
                "maxLength": 10,
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
