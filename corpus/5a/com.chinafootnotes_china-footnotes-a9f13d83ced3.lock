        {
          "name": "search_places",
          "title": "Search places",
          "description": "Search China Footnotes for sights and neighbourhoods in the Chinese cities it covers. Matches English or Chinese names, aliases, district, type and tags. Suited to questions about what to see or do in a city, and to finding a place's id from its name. With no arguments it lists places and the city ids covered; asked about a city it does not cover, it says so rather than returning unrelated places. Returns short summaries with ids and page links, best match first; matchedAll is false when no place matched the whole query and the results only share some words with it. Opening hours, tickets, booking and traveler tips come from get_place.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Lowercase city id, as listed in cities when search_places is called with no arguments. Omit for all cities.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum places to return (1–50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in English or Chinese (translate names from other languages first), e.g. \"Yu Garden\", \"豫园\", \"art museum\", \"night view\". Leave empty to list places.",
                "maxLength": 200,
                "type": "string"
              },
              "tag": {
                "description": "Tag, e.g. free, paid, rainy-day, indoor, night-view, family, history, art, booking-required, closed-mon, day-trip.",
                "maxLength": 60,
                "type": "string"
              },
              "type": {
                "description": "Place type.",
                "enum": ["open_district", "water_town", "museum", "observation_deck", "ticketed_attraction", "classical_garden", "park", "temple"],
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
