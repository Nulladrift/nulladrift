      },
      "instructions": "Public GTA 6 information from gta6hunter.com. All tools are read-only. Link users to the returned page URLs for full details.",
      "tools": [
        {
          "name": "find_map_place",
          "title": "Find a place on the GTA 6 map",
          "description": "Look up landmarks, shops, homes and other places on the GTA 6 Leonida map by name or area. Returns the area, category, real-life inspiration and a map link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Place or area name, e.g. \"Vice Beach\" or \"hotel\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
