      },
      "instructions": "Catalogue des logements neufs des promoteurs partenaires de M2 : programmes, lots, prix, disponibilités, livraison et dispositifs (PTZ, TVA réduite, LMNP). Données transmises directement par les promoteurs et horodatées.\n\nFonctionnalités : recherche de logements par critères, villes disponibles, détail d'un logement ou d'un programme, comparaison de 2 à 4 logements avec formulaire de mise en relation, statut de disponibilité, liste des promoteurs et transmission d'une demande de contact (pour les lots et promoteurs dont `accepts_leads` vaut true).\n\nLes logements présentés proviennent uniquement de ces données. Le champ `reliability` indique la fraîcheur d'un statut (`low` : statut ancien). Les prix sont TTC, en euros.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Vérifier la disponibilité",
          "description": "Vérifie le statut commercial actuel (`available` disponible, `on_hold` optionné, `reserved` réservé, `sold` vendu) d'un ou plusieurs lots, avec la date de dernière mise à jour transmise par le promoteur et un indice de fiabilité (`high` < 24 h, `medium` < 72 h, `low` au-delà).",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à vérifier.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Vérifier la disponibilité"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d247ae3e70bb8d297683c5fab1962fc504782b24d389ae00200cec308c85a9b"
        },
        {
          "name": "compare_lots",
          "title": "Comparer des logements",
          "description": "Affiche un tableau comparatif de 2 à 4 lots (prix, surface, extérieur, étage, livraison, points forts, statut et fraîcheur).\n`recommended_lot_id` met en évidence un lot dans le tableau, accompagné de 2 à 4 justifications courtes (`reasons`) fondées uniquement sur les données des lots comparés.\nSi au moins un lot provient d'un promoteur avec mise en relation disponible (`accepts_leads`), le tableau se termine par un formulaire de mise en relation (logement, nom, e-mail, téléphone) limité à ces lots, qui transmet directement la demande au conseiller. Sinon, aucun formulaire n'est affiché.\nLe tableau est affiché directement à l'utilisateur.",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à comparer, dans l'ordre d'affichage.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "reasons": {
                "description": "Raisons courtes justifiant la recommandation, ex. « Un bon équilibre entre prix, surface et terrasse ».",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "recommended_lot_id": {
                "description": "Identifiant du lot recommandé pour le projet de l'acquéreur (optionnel).",
                "type": "integer"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Comparer des logements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/lots-comparison-app?v=28bf6878",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:d62855f32f80fdacae266a309d668448e65eec59a8d84c08fd72db2d99e4484b"
        },
        {
          "name": "create_lead",
          "title": "Demander une mise en relation",
          "description": "Transmet une demande de mise en relation avec un conseiller commercial du promoteur, à propos d'un lot, d'un programme ou, pour une demande diverse, d'un promoteur seul (sans lot ni programme).\nRequiert l'accord explicite de l'acquéreur et les coordonnées qu'il a lui-même fournies. Le conseiller recontacte l'acquéreur ; aucun rendez-vous n'est confirmé.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Budget d'achat TTC en euros, s'il a été exprimé par l'acquéreur.",
                "type": "integer"
              },
              "channel": {
                "description": "Origine de la demande : `conversation` (défaut) ou `comparison_form` (formulaire du comparatif).",
                "enum": ["comparison_form", "conversation"],
                "type": "string"
              },
              "email": {
                "description": "E-mail de l'acquéreur.",
                "format": "email",
                "type": "string"
              },
              "incentive": {
                "description": "Dispositif envisagé par l'acquéreur (PTZ, TVA réduite, LMNP), s'il l'a mentionné.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "lot_id": {
                "description": "Lot concerné. Omettre pour une demande diverse (sans lot ni programme).",
                "type": "integer"
              },
              "message": {
                "description": "Contexte utile au conseiller (critères, questions, financement…).",
                "type": "string"
              },
              "name": {
                "description": "Nom et prénom de l'acquéreur.",
                "type": "string"
              },
              "phone": {
                "description": "Téléphone de l'acquéreur.",
                "type": "string"
              },
              "preferred_callback_time": {
                "description": "Disponibilités de l'acquéreur pour être rappelé, ex. « mardi après-midi ».",
                "type": "string"
              },
              "program_id": {
                "description": "Programme concerné. Omettre pour une demande diverse (sans lot ni programme).",
                "type": "integer"
              },
              "promoter_id": {
                "description": "Promoteur concerné, pour une demande diverse sur le catalogue M2. Ignoré sur un catalogue promoteur.",
                "type": "integer"
              },
              "purpose": {
                "description": "Nature du projet d'achat.",
                "enum": ["primary_residence", "secondary_residence", "investment"],
                "type": "string"
              },
              "search_id": {
                "description": "Identifiant `search_id` renvoyé avec les résultats d'une recherche de lots, si la demande fait suite à cette recherche.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Demander une mise en relation"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/widgetAccessible": true,
