        {
          "name": "get_lot",
          "title": "Détail d'un lot",
          "description": "Renvoie la fiche complète d'un lot : surface, étage, extérieur, orientation, parking, plan (`floor_plan_url`, lien à donner à l'acquéreur quand il le demande ; absent si le promoteur n'en a pas publié), prix, statut et fraîcheur de la donnée, ainsi que le programme (adresse, livraison, prestations, points forts, dispositifs éligibles).\nUtiliser quand l'acquéreur veut « voir le détail » d'un logement.",
          "inputSchema": {
            "properties": {
