      "serverInfo": {
        "name": "Offres Neuf by M2",
        "version": "0.1.1"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue des logements neufs des promoteurs partenaires de M2 : programmes, lots, prix, disponibilités, livraison et dispositifs (PTZ, TVA réduite, LMNP). Données transmises directement par les promoteurs et horodatées.\n\nParcours type :\n1. search_lots pour proposer des logements correspondant au projet de l'acquéreur (list_promoters si un promoteur est cité).\n2. get_lot ou get_program quand l'acquéreur veut le détail d'un logement ou d'une résidence.\n3. compare_lots pour comparer 2 à 4 logements ; renseigner la recommandation quand l'acquéreur demande lequel choisir. Le comparatif intègre un formulaire de mise en relation : pour être recontacté, inviter l'acquéreur à le remplir plutôt que de lui demander ses coordonnées dans la conversation.\n4. check_availability avant toute recommandation ferme ou mise en relation.\n5. create_lead uniquement avec l'accord explicite de l'acquéreur et ses propres coordonnées, lorsqu'aucun formulaire n'est affiché.\n\nRègles : ne présenter que des logements renvoyés par ces outils, sans inventer de prix, de surface ni de disponibilité. Si la fiabilité d'un statut (`reliability`) vaut `low`, le signaler. Les prix sont TTC, en euros. Si une recherche ne renvoie rien, ne pas élargir les critères sans l'accord de l'acquéreur : présenter les pistes proposées. Après une proposition, suggérer les suites possibles : détail d'un programme, comparaison, mise en relation avec un conseiller.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Vérifier la disponibilité",
          "description": "Vérifie le statut commercial actuel (`available` disponible, `on_hold` optionné, `reserved` réservé, `sold` vendu) d'un ou plusieurs lots, avec la date de dernière mise à jour transmise par le promoteur et un indice de fiabilité (`high` < 24 h, `medium` < 72 h, `low` au-delà).\nUtiliser avant de recommander un lot ou de proposer une mise en relation, et quand l'acquéreur demande si un logement est toujours disponible.",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à vérifier.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Vérifier la disponibilité"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:68d4d6f358f7af5e736a30a727ab7efd6a8e492bf572c7430341fec84bed7601"
        },
        {
          "name": "compare_lots",
          "title": "Comparer des logements",
          "description": "Affiche un tableau comparatif de 2 à 4 lots (prix, surface, extérieur, étage, livraison, points forts, statut et fraîcheur).\nPour formuler une recommandation, renseigner `recommended_lot_id` avec le lot le plus adapté au projet exprimé par l'acquéreur (résidence principale, investissement, budget…) et `reasons` avec 2 à 4 justifications courtes, fondées uniquement sur les données des lots comparés. La recommandation est mise en évidence dans le tableau.\nLe tableau se termine par un formulaire de mise en relation (logement, nom, e-mail, téléphone) qui transmet directement la demande au conseiller : ne pas redemander ces informations dans la conversation, inviter l'acquéreur à utiliser le formulaire.\nLe tableau est affiché directement à l'utilisateur : ne pas le recopier dans la réponse.",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à comparer, dans l'ordre d'affichage.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "reasons": {
                "description": "Raisons courtes justifiant la recommandation, ex. « Un bon équilibre entre prix, surface et terrasse ».",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "recommended_lot_id": {
                "description": "Identifiant du lot recommandé pour le projet de l'acquéreur (optionnel).",
                "type": "integer"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Comparer des logements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/lots-comparison-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:2220fcf32c1d4967742ca73147a019c739562f496dfcfca219aecce15d0dbe52"
        },
        {
          "name": "create_lead",
          "title": "Demander une mise en relation",
          "description": "Transmet une demande de mise en relation avec un conseiller commercial du promoteur, à propos d'un lot ou d'un programme.\nN'appeler qu'après accord explicite de l'acquéreur, avec les coordonnées qu'il a lui-même fournies dans la conversation (ne jamais les inventer). Le conseiller recontacte l'acquéreur ; aucun rendez-vous n'est confirmé par cet outil.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Budget d'achat TTC en euros, s'il a été exprimé par l'acquéreur.",
                "type": "integer"
              },
              "channel": {
                "description": "Origine de la demande : `conversation` (défaut) ou `comparison_form` (formulaire du comparatif).",
                "enum": ["comparison_form", "conversation"],
                "type": "string"
              },
              "email": {
                "description": "E-mail de l'acquéreur.",
                "format": "email",
                "type": "string"
              },
              "incentive": {
                "description": "Dispositif envisagé par l'acquéreur (PTZ, TVA réduite, LMNP), s'il l'a mentionné.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "lot_id": {
                "description": "Lot concerné. Requis si program_id est absent.",
                "type": "integer"
              },
              "message": {
                "description": "Contexte utile au conseiller (critères, questions, financement…).",
                "type": "string"
              },
              "name": {
                "description": "Nom et prénom de l'acquéreur.",
                "type": "string"
              },
              "phone": {
                "description": "Téléphone de l'acquéreur.",
                "type": "string"
              },
              "preferred_callback_time": {
                "description": "Disponibilités de l'acquéreur pour être rappelé, ex. « mardi après-midi ».",
                "type": "string"
              },
              "program_id": {
                "description": "Programme concerné. Requis si lot_id est absent.",
                "type": "integer"
              },
              "purpose": {
                "description": "Nature du projet d'achat.",
                "enum": ["primary_residence", "secondary_residence", "investment"],
                "type": "string"
              },
              "search_id": {
                "description": "Identifiant `search_id` renvoyé par search_lots, si la demande fait suite à une recherche.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Demander une mise en relation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47d9cf12afac3cc3e3336461844e40bc12cf21ed136f6e1b826b883cd65b4561"
        },
        {
          "name": "get_lot",
          "title": "Détail d'un lot",
          "description": "Renvoie la fiche complète d'un lot : surface, étage, extérieur, orientation, parking, plan, prix, statut et fraîcheur de la donnée, ainsi que le programme (adresse, livraison, prestations, points forts, dispositifs éligibles).\nUtiliser quand l'acquéreur veut « voir le détail » d'un logement.",
          "inputSchema": {
            "properties": {
              "lot_id": {
                "description": "Identifiant du lot (champ `id` renvoyé par search_lots).",
                "type": "integer"
              }
            },
            "required": ["lot_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Détail d'un lot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee4ec9508d3180fa88dcf6940a375a40ed25bee23b22b6e1da2cade85a8eb644"
        },
        {
          "name": "get_program",
          "title": "Détail d'un programme",
          "description": "Renvoie la présentation d'un programme immobilier neuf (promoteur, localisation, description, livraison, prestations, points forts, dispositifs éligibles) et la liste de ses lots disponibles.\nUtiliser quand l'acquéreur s'intéresse à une résidence dans son ensemble plutôt qu'à un lot précis.",
          "inputSchema": {
            "properties": {
              "program_id": {
                "description": "Identifiant du programme (champ `program.id` d'un lot).",
                "type": "integer"
              }
            },
            "required": ["program_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Détail d'un programme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eed110d6f7cc9b83501bcd9362fc3b046ed5b86b51824f02c65c254bf7a0a3f3"
        },
        {
          "name": "list_promoters",
          "title": "Lister les promoteurs",
          "description": "Liste les promoteurs partenaires de M2 présents dans le catalogue, avec leur nombre de programmes et de lots disponibles. Utiliser pour identifier un promoteur cité par l'acquéreur avant de filtrer search_lots.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Lister les promoteurs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5c8e865091c759cdcece42fafcfbbf6de1e4b0135e75c7d2b1afee15914c39d"
        },
        {
          "name": "search_lots",
          "title": "Rechercher des logements neufs",
          "description": "Recherche des logements neufs (lots) dans le catalogue des programmes partenaires de M2, et les affiche sous forme de liste.\nUtiliser dès qu'un acquéreur décrit un projet : ville, typologie (T2, T3...), budget, surface, extérieur (terrasse, balcon...), date de livraison, promoteur.\nPar défaut seuls les lots disponibles sont renvoyés, triés par prix croissant. Chaque lot porte un indicateur de fraîcheur : si `reliability` vaut `low`, prévenir l'utilisateur que la disponibilité doit être confirmée (check_availability).\nNe jamais inventer de logement absent des résultats.\nNe jamais retirer ni assouplir un critère de l'acquéreur de sa propre initiative : en l'absence de résultat, présenter les pistes d'élargissement renvoyées (`relaxations`) et laisser l'acquéreur choisir.\nRenvoie un `search_id` : si l'acquéreur demande ensuite une mise en relation, le repasser à create_lead pour rattacher la demande à cette recherche.\nLa liste est affichée directement à l'utilisateur, sans bouton d'action : ne pas la recopier dans la réponse, mais proposer explicitement la suite : le détail d'un logement (get_lot), la comparaison de 2 à 4 logements (compare_lots, en demandant lesquels comparer) ou une mise en relation.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Ville recherchée, ex. « Lyon ».",
                "type": "string"
              },
              "district": {
                "description": "Arrondissement (Paris, Lyon, Marseille), ex. 7 pour Lyon 7e.",
                "type": "integer"
              },
              "incentive": {
                "description": "Dispositif d'aide ou fiscal éligible.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "include_unavailable": {
                "description": "Inclure les lots optionnés, réservés ou vendus. Faux par défaut.",
                "type": "boolean"
              },
              "latest_delivery_date": {
                "description": "Date de livraison maximale (AAAA-MM-JJ). « Livrable en 2027 » → 2027-12-31.",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "description": "Nombre maximum de lots renvoyés (1 à 20, 6 par défaut).",
                "type": "integer"
              },
              "max_price": {
                "description": "Prix TTC maximum en euros (budget).",
                "type": "integer"
              },
              "min_area": {
                "description": "Surface habitable minimum en m².",
                "type": "number"
              },
              "min_outdoor_area": {
                "description": "Surface minimum de l'extérieur en m².",
                "type": "number"
              },
              "min_price": {
                "description": "Prix TTC minimum en euros.",
                "type": "integer"
              },
              "outdoor_spaces": {
                "description": "Types d'extérieur acceptés.",
                "items": {
                  "enum": ["terrace", "balcony", "loggia", "garden"],
                  "type": "string"
                },
                "type": "array"
              },
              "promoter": {
                "description": "Nom ou identifiant (`slug`) du promoteur, ex. « LNC ». Voir list_promoters.",
                "type": "string"
              },
              "unit_types": {
                "description": "Typologies acceptées.",
                "items": {
                  "enum": ["studio", "T1", "T2", "T3", "T4", "T5", "house"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Rechercher des logements neufs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
