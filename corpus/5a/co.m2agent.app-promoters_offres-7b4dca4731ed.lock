        {
          "name": "search_lots",
          "title": "Rechercher des logements neufs",
          "description": "Recherche des logements neufs (lots) dans le catalogue des programmes partenaires de M2, et les affiche sous forme de liste.\nCritères : ville, typologie (T2, T3...), budget, surface, extérieur (terrasse, balcon...), date de livraison, promoteur.\nPar défaut seuls les lots disponibles sont renvoyés, triés par prix croissant. `reliability` indique la fraîcheur du statut (`low` : statut ancien).\nSans résultat, les critères ne sont pas modifiés : des pistes d'élargissement sont proposées dans `relaxations`.\nRenvoie un `search_id` identifiant la recherche.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Ville recherchée, ex. « Lyon ».",
                "type": "string"
              },
              "district": {
                "description": "Arrondissement (Paris, Lyon, Marseille), ex. 7 pour Lyon 7e.",
                "type": "integer"
              },
              "incentive": {
                "description": "Dispositif d'aide ou fiscal éligible.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "include_unavailable": {
                "description": "Inclure les lots optionnés, réservés ou vendus. Faux par défaut.",
                "type": "boolean"
              },
              "latest_delivery_date": {
                "description": "Date de livraison maximale (AAAA-MM-JJ). « Livrable en 2027 » → 2027-12-31.",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "description": "Nombre maximum de lots renvoyés (1 à 20, 6 par défaut).",
                "type": "integer"
              },
              "max_price": {
                "description": "Prix TTC maximum en euros (budget).",
                "type": "integer"
              },
              "min_area": {
                "description": "Surface habitable minimum en m².",
                "type": "number"
              },
              "min_outdoor_area": {
                "description": "Surface minimum de l'extérieur en m².",
                "type": "number"
              },
              "min_price": {
                "description": "Prix TTC minimum en euros.",
                "type": "integer"
              },
              "outdoor_spaces": {
                "description": "Types d'extérieur acceptés.",
                "items": {
                  "enum": ["terrace", "balcony", "loggia", "garden"],
                  "type": "string"
                },
                "type": "array"
              },
              "promoter": {
                "description": "Nom ou identifiant (`slug`) du promoteur, ex. « LNC ». Voir la liste des promoteurs partenaires.",
                "type": "string"
              },
              "unit_types": {
                "description": "Typologies acceptées.",
                "items": {
                  "enum": ["studio", "T1", "T2", "T3", "T4", "T5", "house"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
