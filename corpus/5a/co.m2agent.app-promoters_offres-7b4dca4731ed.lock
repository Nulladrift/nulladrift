            }
          },
          "digest": "sha256:6e6b21e8b6a45435351ddc41d96042dfbe45a54bd24b83a573412bc6717aa7df"
        },
        {
          "name": "get_lot",
          "title": "Détail d'un lot",
          "description": "Renvoie la fiche complète d'un lot : surface, étage, extérieur, orientation, parking, plan (`floor_plan_url`, lien vers le plan ; absent si le promoteur n'en a pas publié), prix, statut et fraîcheur de la donnée, ainsi que le programme (adresse, livraison, prestations, points forts, dispositifs éligibles).\nLes photos du programme sont dans `program.photo_urls` (`program.image_url` est la première) : ce sont les mêmes que celles des cartes.",
          "inputSchema": {
            "properties": {
              "lot_id": {
                "description": "Identifiant du lot (champ `id` des résultats de recherche de lots).",
                "type": "integer"
              }
            },
            "required": ["lot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Détail d'un lot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:067b7a43c3b0d6ebbdfa5c89a50592d2b255a7088d61fed4f7cd9b8d150714dd"
        },
        {
          "name": "get_program",
          "title": "Détail d'un programme",
          "description": "Renvoie la présentation d'un programme immobilier neuf (promoteur, localisation, description, livraison, prestations, points forts, dispositifs éligibles) et la liste de ses lots disponibles.",
          "inputSchema": {
            "properties": {
              "program_id": {
                "description": "Identifiant du programme (champ `program.id` d'un lot).",
                "type": "integer"
              }
            },
            "required": ["program_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Détail d'un programme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3a34ee4fc2ac7498b4fedabe2ed8b389a0bc7bbbf15d7f0d40c93e2a0993760"
        },
        {
          "name": "list_cities",
          "title": "Lister les villes avec des logements",
          "description": "Liste les villes du catalogue où des logements disponibles correspondent aux critères (typologie, budget, surface, extérieur, livraison, dispositif, promoteur), avec leur département, leur nombre de programmes et de lots et leur prix minimum.\nLe paramètre `departments` restreint la liste à des départements (ex. [\"13\", \"83\", \"84\"] pour la Provence).",
          "inputSchema": {
            "properties": {
              "departments": {
                "description": "Codes département à cibler, ex. [\"13\", \"83\"]. Absent : toute la France.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "incentive": {
                "description": "Dispositif d'aide ou fiscal éligible.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "latest_delivery_date": {
                "description": "Date de livraison maximale (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "max_price": {
                "description": "Prix TTC maximum en euros (budget).",
                "type": "integer"
              },
              "min_area": {
                "description": "Surface habitable minimum en m².",
                "type": "number"
              },
              "min_outdoor_area": {
                "description": "Surface minimum de l'extérieur en m².",
                "type": "number"
              },
              "min_price": {
                "description": "Prix TTC minimum en euros.",
                "type": "integer"
              },
              "outdoor_spaces": {
                "description": "Types d'extérieur acceptés.",
                "items": {
                  "enum": ["terrace", "balcony", "loggia", "garden"],
                  "type": "string"
                },
                "type": "array"
              },
              "promoter": {
                "description": "Nom ou identifiant (`slug`) du promoteur. Voir la liste des promoteurs partenaires.",
                "type": "string"
              },
              "unit_types": {
                "description": "Typologies acceptées.",
                "items": {
                  "enum": ["studio", "T1", "T2", "T3", "T4", "T5", "house"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
