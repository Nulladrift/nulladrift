      "instructions": "Catalogue des logements neufs des promoteurs partenaires de M2 : programmes, lots, prix, disponibilités, livraison et dispositifs (PTZ, TVA réduite, LMNP). Données transmises directement par les promoteurs et horodatées.\n\nParcours type :\n1. list_cities si la zone est large (région, « le Sud ») ou la ville incertaine, pour ne chercher que là où le catalogue a des logements, puis search_lots pour proposer des logements correspondant au projet de l'acquéreur (list_promoters si un promoteur est cité).\n2. get_lot ou get_program quand l'acquéreur veut le détail d'un logement ou d'une résidence.\n3. compare_lots pour comparer 2 à 4 logements ; renseigner la recommandation quand l'acquéreur demande lequel choisir. Le comparatif intègre un formulaire de mise en relation : pour être recontacté, inviter l'acquéreur à le remplir plutôt que de lui demander ses coordonnées dans la conversation.\n4. check_availability avant toute recommandation ferme ou mise en relation.\n5. create_lead uniquement avec l'accord explicite de l'acquéreur et ses propres coordonnées, lorsqu'aucun formulaire n'est affiché, et seulement pour un lot ou un promoteur dont `accepts_leads` vaut true (sinon, ne pas proposer de mise en relation).\n\nRègles : ne présenter que des logements renvoyés par ces outils, sans inventer de prix, de surface ni de disponibilité. Si la fiabilité d'un statut (`reliability`) vaut `low`, le signaler. Les prix sont TTC, en euros. Si une recherche ne renvoie rien, ne pas élargir les critères sans l'accord de l'acquéreur : présenter les pistes proposées. Après une proposition, suggérer les suites possibles : détail d'un programme, comparaison, mise en relation avec un conseiller.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Vérifier la disponibilité",
          "description": "Vérifie le statut commercial actuel (`available` disponible, `on_hold` optionné, `reserved` réservé, `sold` vendu) d'un ou plusieurs lots, avec la date de dernière mise à jour transmise par le promoteur et un indice de fiabilité (`high` < 24 h, `medium` < 72 h, `low` au-delà).\nUtiliser avant de recommander un lot ou de proposer une mise en relation, et quand l'acquéreur demande si un logement est toujours disponible.",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à vérifier.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Vérifier la disponibilité"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:68d4d6f358f7af5e736a30a727ab7efd6a8e492bf572c7430341fec84bed7601"
        },
        {
          "name": "compare_lots",
          "title": "Comparer des logements",
          "description": "Affiche un tableau comparatif de 2 à 4 lots (prix, surface, extérieur, étage, livraison, points forts, statut et fraîcheur).\nPour formuler une recommandation, renseigner `recommended_lot_id` avec le lot le plus adapté au projet exprimé par l'acquéreur (résidence principale, investissement, budget…) et `reasons` avec 2 à 4 justifications courtes, fondées uniquement sur les données des lots comparés. La recommandation est mise en évidence dans le tableau.\nSi au moins un lot provient d'un promoteur avec mise en relation disponible (`accepts_leads`), le tableau se termine par un formulaire de mise en relation (logement, nom, e-mail, téléphone) limité à ces lots, qui transmet directement la demande au conseiller : ne pas redemander ces informations dans la conversation, inviter l'acquéreur à utiliser le formulaire. Sinon, aucun formulaire n'est affiché : ne pas proposer de mise en relation pour ces lots.\nLe tableau est affiché directement à l'utilisateur : ne pas le recopier dans la réponse.",
          "inputSchema": {
            "properties": {
              "lot_ids": {
                "description": "Identifiants des lots à comparer, dans l'ordre d'affichage.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "reasons": {
                "description": "Raisons courtes justifiant la recommandation, ex. « Un bon équilibre entre prix, surface et terrasse ».",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "recommended_lot_id": {
                "description": "Identifiant du lot recommandé pour le projet de l'acquéreur (optionnel).",
                "type": "integer"
              }
            },
            "required": ["lot_ids"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Comparer des logements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/lots-comparison-app?v=28bf6878",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:9f82237d78b010b8329d847c4252854a20a8c07b9d60819bcdf2e40f38282b5f"
        },
        {
          "name": "create_lead",
          "title": "Demander une mise en relation",
          "description": "Transmet une demande de mise en relation avec un conseiller commercial du promoteur, à propos d'un lot, d'un programme ou, pour une demande diverse, d'un promoteur seul (sans lot ni programme).\nN'appeler qu'après accord explicite de l'acquéreur, avec les coordonnées qu'il a lui-même fournies dans la conversation (ne jamais les inventer). Le conseiller recontacte l'acquéreur ; aucun rendez-vous n'est confirmé par cet outil.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Budget d'achat TTC en euros, s'il a été exprimé par l'acquéreur.",
                "type": "integer"
              },
              "channel": {
                "description": "Origine de la demande : `conversation` (défaut) ou `comparison_form` (formulaire du comparatif).",
                "enum": ["comparison_form", "conversation"],
                "type": "string"
              },
              "email": {
                "description": "E-mail de l'acquéreur.",
                "format": "email",
                "type": "string"
              },
              "incentive": {
                "description": "Dispositif envisagé par l'acquéreur (PTZ, TVA réduite, LMNP), s'il l'a mentionné.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "lot_id": {
                "description": "Lot concerné. Omettre pour une demande diverse (sans lot ni programme).",
                "type": "integer"
              },
              "message": {
                "description": "Contexte utile au conseiller (critères, questions, financement…).",
                "type": "string"
              },
              "name": {
                "description": "Nom et prénom de l'acquéreur.",
                "type": "string"
              },
              "phone": {
                "description": "Téléphone de l'acquéreur.",
                "type": "string"
              },
              "preferred_callback_time": {
                "description": "Disponibilités de l'acquéreur pour être rappelé, ex. « mardi après-midi ».",
                "type": "string"
              },
              "program_id": {
                "description": "Programme concerné. Omettre pour une demande diverse (sans lot ni programme).",
                "type": "integer"
              },
              "promoter_id": {
                "description": "Promoteur concerné, pour une demande diverse sur le catalogue M2. Ignoré sur un catalogue promoteur.",
                "type": "integer"
              },
              "purpose": {
                "description": "Nature du projet d'achat.",
                "enum": ["primary_residence", "secondary_residence", "investment"],
                "type": "string"
              },
              "search_id": {
                "description": "Identifiant `search_id` renvoyé par search_lots, si la demande fait suite à une recherche.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Demander une mise en relation"
