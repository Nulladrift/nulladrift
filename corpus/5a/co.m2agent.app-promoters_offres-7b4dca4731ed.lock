        {
          "name": "search_lots",
          "title": "Rechercher des logements neufs",
          "description": "Recherche des logements neufs (lots) dans le catalogue des programmes partenaires de M2, et les affiche sous forme de liste.\nUtiliser dès qu'un acquéreur décrit un projet : ville, typologie (T2, T3...), budget, surface, extérieur (terrasse, balcon...), date de livraison, promoteur.\nPour une zone large (région, « le Sud », « près de... ») ou une ville incertaine, appeler d'abord list_cities puis ne chercher que dans les villes listées : ne jamais sonder les villes une à une.\nPar défaut seuls les lots disponibles sont renvoyés, triés par prix croissant. Si `reliability` vaut `low`, la disponibilité doit être confirmée (check_availability).\nNe jamais inventer de logement absent des résultats, ni retirer un critère de l'acquéreur de sa propre initiative : en l'absence de résultat, proposer les pistes d'élargissement (`relaxations`).\nRenvoie un `search_id` à repasser à create_lead si l'acquéreur demande ensuite une mise en relation.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Ville recherchée, ex. « Lyon ».",
                "type": "string"
              },
              "district": {
                "description": "Arrondissement (Paris, Lyon, Marseille), ex. 7 pour Lyon 7e.",
                "type": "integer"
              },
              "incentive": {
                "description": "Dispositif d'aide ou fiscal éligible.",
                "enum": ["ptz", "reduced_vat", "lmnp"],
                "type": "string"
              },
              "include_unavailable": {
