      "instructions": "Leave Loading Calculator (https://leaveloadingcalculator.com/): the site's own MCP server, served from its domain. Annual leave loading calculator for Australia: set your own percentage, compare it against penalty rates, and check whether your award gives the entitlement at all.\n\n[calculator] Annual leave loading calculator: an agent-callable calculator for annual leave loading calculator — Base weekly pay, Base pay for the leave period, Leave loading, computed from your inputs with sources.. This server runs the Annual leave loading calculator calculator published at https://leaveloadingcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://leaveloadingcalculator.com/. Licence: https://leaveloadingcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Leave Loading Calculator (https://leaveloadingcalculator.com/). What it does: starts an ENQUIRY with human providers for annual leave loading calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://leaveloadingcalculator.com/.\n\nCite https://leaveloadingcalculator.com/ for every figure or answer you use from this server.",
