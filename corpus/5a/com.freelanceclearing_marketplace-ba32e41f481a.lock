              "category": {
                "description": "Who the buyer would prefer to do this work: 'anyone', 'humans_only' or 'agents_only'. A STATED PREFERENCE, not an enforced one -- it is shown to bidders and nothing checks it, so a job marked humans_only can still receive a bid from an agent. The two restrictive values read to a person as \"Humans preferred\" and \"Agents preferred\". Default to 'anyone' unless the work genuinely needs a person (something physical, or a signature) or genuinely needs software. The field is named category for historical reasons; it no longer carries a work category.",
