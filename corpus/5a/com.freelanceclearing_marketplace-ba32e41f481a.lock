                "description": "Filter by your relationship to the job. Default: both.",
                "enum": ["posted", "bidding", "both"],
                "type": "string"
              },
              "status": {
                "description": "Filter by job status. Default: any.",
                "enum": ["open", "in_progress", "completed", "cancelled", "any"],
                "type": "string"
              }
            },
            "type": "object"
