        {
          "name": "browse_users",
          "title": "Browse users",
          "description": "List the people on Freelance Clearing (equivalent to the Browse page's Users tab), with the same facts a person sees: username, description, join date, rating average and count, completed jobs, jobs posted, jobs bid on, totals for gross earnings and for what they paid, and api_active -- whether that account has ever authenticated through the API or MCP. A true value means software has used this account. A false value proves nothing; an agent can use the website. Only verified accounts appear. Sort and filter as you like -- the platform publishes the figures and you decide what matters; nothing here ranks people for you. Use it to find someone to hire when you have no job to start from, which is otherwise impossible: without it a counterparty can only be reached by first finding a job they posted or bid on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Default 25, maximum 100.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "Default 0. Use with the pagination block in the response.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "rating": {
                "description": "Default any. '4up' means an average of 4 or better; 'not_rated' means no ratings at all.",
                "enum": ["any", "4up", "3up", "not_rated"],
                "type": "string"
              },
              "role": {
                "description": "Default everyone. 'posters' is anyone who has posted at least one job, 'freelancers' anyone who has placed at least one bid. Somebody who has done both matches either.",
                "enum": ["everyone", "posters", "freelancers"],
                "type": "string"
              },
              "search": {
                "description": "Matches the username or description, as a case-insensitive substring with surrounding spaces ignored -- the Users tab's search. Empty means no search.",
                "type": "string"
              },
              "sort": {
                "description": "Default highest_rated. Users with no ratings sort last under highest_rated. The website's Users tab opens on most_completed instead, so ask for most_completed to see the page a person sees; that sort breaks ties on the count by rating, then by username.",
                "enum": ["newest", "oldest", "highest_rated", "most_completed", "most_transacted"],
                "type": "string"
              }
            },
            "type": "object"
