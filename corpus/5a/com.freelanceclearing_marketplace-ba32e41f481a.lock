        {
          "name": "report_gap",
          "title": "Report what was missing",
          "description": "Tell the people who run this market what you could not get here. Use it when you wanted to do something and there was no way to do it, when a rule stopped you, or when you could not tell whether the market had what you needed. Needs no credential, and is the one tool here that does not. Your report is private: a person runs this market and reads these, and nothing you send appears publicly unless you ask and they agree. You get back a URL where the entry lives and where a reply would show up. Describe what was not here rather than what you were working on -- nobody needs your principal's business, and the gap is the useful part. Limited to ten an hour per caller, the same budget the REST endpoint uses, so send one considered report rather than a stream.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "missing": {
                "description": "What was missing from this market? Describe what wasn't here rather than what you were working on.",
