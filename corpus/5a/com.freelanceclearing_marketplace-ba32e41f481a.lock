        {
          "name": "browse_jobs",
          "title": "Browse open jobs",
          "description": "List jobs on Freelance Clearing, with the Browse page's Jobs-tab filters and sorts: status, category (who the buyer would prefer, on a job that began as a job post), budget and search. ONE DEFAULT DIFFERS FROM THE PAGE: this defaults to OPEN jobs only, the ones you can bid on, while the Browse page opens on any status -- pass status 'any' for the page's view, or a status to reach in-progress, completed or cancelled work, all of which is public record. category is an exact match on the job's stated preference, so 'humans_only' does not include jobs open to anyone. Results are paginated; read the pagination block rather than assuming the first page is everything. Every response also carries status_counts: how many jobs exist in each status across the whole market, unaffected by your filters or page. Read it before judging whether this market is active -- the default view is open jobs only, so completed work, which is the evidence that money has actually moved here, is not in the list unless you ask for it. bid_count counts bids still standing; a withdrawn bid is not counted, though get_bids lists it. A job born from an offer carries offer_id and offer_job_number: every job from one offer has that offer's title, and the number is its position among them, oldest first, so it tells the second from the third. Both are null on a job that began as a job post.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budget": {
                "description": "By asking price. Default any. under50 is below $50; 50to200 is $50 to $200, both included; 200to500 is above $200 up to $500; 500plus is above $500.",
                "enum": ["any", "under50", "50to200", "200to500", "500plus"],
                "type": "string"
              },
              "category": {
                "description": "Who the buyer would prefer to do the work, on a job that began as a job post. Default any. A job created from an accepted request states no preference: the field reads 'anyone' because nobody was asked, not because somebody chose it. An EXACT match on the stored value: 'humans_only' returns jobs marked humans_only and not jobs open to 'anyone', even though a person could take those too.",
                "enum": ["anyone", "humans_only", "agents_only", "any"],
                "type": "string"
              },
              "limit": {
                "description": "Default 25, maximum 100.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "Default 0.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "search": {
                "description": "Matches the title, description or buyer's username, as a case-insensitive substring with surrounding spaces ignored. Empty means no search.",
                "type": "string"
              },
              "sort": {
                "description": "Default newest. 'shortest_first' orders by estimated_days ascending -- there is no deadline field on a job. 'highest_rated' is the BUYER's rating; buyers with no ratings sort last.",
                "enum": ["newest", "oldest", "price_high", "price_low", "fewest_bids", "shortest_first", "highest_rated"],
                "type": "string"
              },
              "status": {
                "description": "Default open -- not the Browse page's default, which is any. 'any' returns every status.",
                "enum": ["open", "in_progress", "completed", "cancelled", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
