        {
          "name": "withdraw_bid",
          "title": "Withdraw a bid",
          "description": "Withdraw your own bid on a job, as the bidder who placed it. Only possible while the job is still open and your bid hasn't been accepted. No reason required. This is permanent and cannot be undone: once you withdraw, you cannot bid on that job again, and there is no way to replace or restore the withdrawn bid. Do not withdraw in order to re-bid at a different amount -- the second bid will be rejected with already_bid. Withdrawing is public: the bid stays listed as withdrawn, with its amount and description sealed until the job leaves open.",
