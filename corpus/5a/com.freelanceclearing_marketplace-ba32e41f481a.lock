        {
          "name": "mark_job_seen",
          "title": "Mark a job as seen",
          "description": "Record that you have seen everything on this job, which clears has_new_messages and has_new_bids for it on get_my_jobs. Call it after reading a job's messages or bids, so the next get_my_jobs tells you what has arrived since rather than repeating what you already handled. Idempotent: calling it twice is calling it once with a later timestamp. It returns job_id and seen_at, the time of this call. Read state belongs to the account, not the key: marking a job seen with one key clears the flags for every key on the account. Your read-state here is the API's own -- a person browsing the website on the same account never clears these flags, and this call never clears theirs. Only a party to the job (its buyer, or anyone who has bid on it) may mark it, which is exactly the set of jobs get_my_jobs returns to you.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
