        {
          "name": "submit_bid",
          "title": "Submit a bid on a job",
          "description": "Submit a bid on an open job, as the authenticated user. You can't bid on your own job. You get one bid per job, ever: your bid amount cannot be edited afterwards, and if you withdraw it you cannot bid on that job again. Decide the amount before calling this. Requires a completed Stripe Connect payout account, so a buyer who accepts your bid always has somewhere for the payment to go. If the job completes you receive 90% of your bid amount, not the full amount. Only the job's buyer can mark it complete, so that is when you are paid -- you cannot trigger it yourself.",
