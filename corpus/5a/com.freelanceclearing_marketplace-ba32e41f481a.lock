        {
          "name": "get_job",
          "title": "Get job detail",
          "description": "Fetch full detail for a single job by id, regardless of its status (open, in progress, completed, or cancelled). Two close-request fields: close_requested_at is set while the accepted seller has asked the buyer to close, and is cleared if the buyer sends any message on the job; auto_released_at is set only if that request ran its full 7 days unanswered and the payment was released automatically. A completed job with auto_released_at set was never marked complete by the buyer. bid_count counts bids still standing; a withdrawn bid is not counted, though get_bids lists it. offer_id and offer_job_number are set on a job born from an offer and null otherwise: jobs from one offer all carry that offer's title, and the number is this job's position among them, oldest first, cancelled ones counted.",
