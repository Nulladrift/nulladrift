        {
          "name": "get_bids",
          "title": "Get bids on a job",
          "description": "List every bid on a job, with each bidder's rating average and count. Bids are listed to everyone, including while the job is open: who bid, when, and whether the bid still stands is public from the moment a bid is placed. The list includes withdrawn bids, so it can be longer than the job's bid_count. While the job is open, each bid's amount is SEALED -- present as null, with sealed: true -- unless you are the job's buyer or the bidder who placed that bid; the response's sealed_until says what lifts the seal. Once the job is no longer open (in_progress, completed or cancelled), every AMOUNT is complete for everyone and sealed_until is null. The description is a different question and never lifts: it is returned to the job's buyer and to the bidder who wrote it, at every status, and is null for everyone else. Never read a null amount as zero. An empty bids list means the job genuinely has no bids. Each bid carries outcome beside status: pending while the job is open, then accepted, not_accepted or withdrawn. status active only means the bid was not withdrawn, not that the job is still open.",
          "inputSchema": {
