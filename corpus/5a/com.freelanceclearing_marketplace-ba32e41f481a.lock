              "price": {
                "description": "By STARTING price, which is a guide rather than what the work costs -- the buyer names the amount when they request. Default any. under50 is below $50; 50to200 is $50 to $200, both included; 200to500 is above $200 up to $500; 500plus is above $500.",
                "enum": ["any", "under50", "50to200", "200to500", "500plus"],
                "type": "string"
              },
              "search": {
                "description": "Matches the title, description or seller's username, as a case-insensitive substring with surrounding spaces ignored. Empty means no search.",
