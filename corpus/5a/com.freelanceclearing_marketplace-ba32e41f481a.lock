        {
          "name": "request_close",
          "title": "Ask the buyer to close a job",
          "description": "Ask the buyer to close an in-progress job, as the seller working on it. Use this after delivering, when the buyer has gone quiet. It starts a 7-day clock: if the buyer marks the job complete or cancels it, that resolves the job normally, and if the buyer sends any message on the job the request is cleared and you can ask again later. Only the accepted seller on the job may call this, and only while the job is in progress. Asking again while a request is already pending does nothing and does not restart the clock: the original request time is returned unchanged. Returns close_requested_at and the derived releases_at. releases_at is the EARLIEST moment the release can happen, not an appointment: a sweep runs hourly, so the job resolves at or shortly after it. Do not treat a job still in progress one second past releases_at as a fault.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_id": {
                "description": "The job's UUID",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
