      "serverInfo": {
        "name": "distress-abc",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "abc_asset_map",
          "description": "Build the full WIND-DOWN ASSET / COLLATERAL MAP for one ABC/receivership case. Pass the notice `link` (from abc_distress_feed/abc_find_notices) and/or the assignor `entity` name. Joins the failing entity to FREE-STATE UCC-encumbered collateral + secured parties (Colorado SOS, live keyless) and the county-recorder real-property lookout, then returns the collateral inventory + buyer actions per role (assignee/liquidator, distressed-asset/IP buyer, creditor). The map the assignee needs to actually run the wind-down — and the map a buyer needs to bid first. Multi-hop parse is hand-verifiable; verify before acting. [x402: full map settles $0.50 USDC on Base mainnet, keyless; free preview included.]",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "Assignor / distressed entity name (use if no link, or to override the parse).",
                "type": "string"
              },
              "link": {
                "description": "Notice page URL (preferred — we parse the assignor + case).",
                "type": "string"
              },
              "state": {
                "description": "US state 2-letter code (record header / recorder lookout).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cb4776a4b45b079bedac1f4dd7ad9406f60ac371210b961229fa423cd16caf3"
        },
        {
          "name": "abc_distress_feed",
          "description": "FREE: live feed of state ASSIGNMENT-FOR-BENEFIT-OF-CREDITORS (ABC) and RECEIVERSHIP public legal notices — the wind-down firehose with NO PACER. Each notice: type (receivership/abc/asset-auction/lien-foreclosure), the assignor/distressed entity where parseable, case number, claim/sale date, and link. Beachhead state: WA (a notice-publishing state); FL/NY/DE link-out, CA/TX are dark. Wind-downs move fast — this is the clock.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max notices to return (default 40).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3fcf58c213ccb6b45ed844bcb4c794d9562dde13cf57b9b599aae58d9a7f82e"
        },
        {
          "name": "abc_find_notices",
          "description": "FREE: keyword-search the wind-down legal-notice archive (e.g. 'receivership', 'assignment for benefit of creditors', 'assignee', a company name). Returns matching notice headers + links you can feed into abc_asset_map.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Search term (required).",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 15).",
                "type": "number"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d83c0eea14557c454d5007c94290256eb4cb76077e6bdbecda8ed4a59287329"
        },
        {
          "name": "warn_liquidation_map",
          "description": "Build the LIQUIDATOR-facing ASSET / COLLATERAL MAP for a WARN-Act plant-death entity (the failing employer). Joins that entity to FREE-STATE UCC-encumbered collateral + secured parties (Colorado SOS, live keyless) + the county-recorder real-property lookout, and returns the encumbered-collateral inventory + liquidator/auctioneer/assignee actions. Buyers: distressed-asset liquidators, auctioneers, and the assignee running the wind-down — they NEED the collateral map to know what can sell free vs. what's locked by a perfected lien. Pass an `entity` (employer name) for the full map, or omit it for the recent plant-death TRIAGE feed (each with a CO-UCC collateral count). HONEST: WARN index is CA, UCC join is CO — a CA plant-death maps to CO collateral only for multi-state operators (honest null otherwise). Hand-verifiable at this volume; verify before bidding. [x402: full map settles $0.50 USDC on Base mainnet, keyless; free preview included.]",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "Failing employer / plant-death entity name (omit for the triage feed).",
                "type": "string"
              },
              "limit": {
                "description": "Triage-feed size when no entity (default 12).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b81cc5972ce49d89638200526ea9056fa903299d0bc360926347ec8d229d7304"
        },
        {
          "name": "warn_plant_deaths",
          "description": "FREE: recent WARN-Act PLANT-DEATH events (mass layoffs / plant closures) — the SECOND distress-event lane feeding the same liquidation map. Each is a failing employer the day its plant is dying, with whether it has a live Colorado UCC collateral map (so a liquidator can triage which dying plant has filed collateral worth chasing). Live keyless index = CA EDD detailed WARN report; the CO UCC join is the collateral overlay (honest null where the firm's collateral is in a state not yet covered keyless). Feed an employer into warn_liquidation_map for the full collateral inventory.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max plant-death events (default 25).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5dec4d0a153b14bc4bcf933d94a8bc51e97a9f209d6045c9fc65f21f0fc55961"
        }
      ],
      "digest": "sha256:b478443e39a90b20cfc2b0c2e10fcc34a9ed3d9b9234c44b85df69a66aa00f8a"
    }
  }
