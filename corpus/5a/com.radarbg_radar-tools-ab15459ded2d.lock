        {
          "name": "business_check",
          "title": "Business Check - EU VAT, company address, domain age, risk flags",
          "description": "One-call KYB check of a company: EU VAT number validated in the official VIES register (company name and registered address), the address geocoded by the national geocoder, the website domain's age and registrar (RDAP), its email authentication score, and plain risk flags (invalid VAT, domain younger than 180 days, name not matching the domain, spoofable email). ~1-2 s. Free: 25 calls/day per IP. Paid: $0.01 per call via x402 at https://radarbg.com/x402/business-check.",
          "inputSchema": {
            "examples": [
              {
                "domain": "google.com",
                "vatNumber": "IE6388047V"
              }
            ],
            "properties": {
              "address": {
                "description": "Optional address to geocode instead of the registered one",
                "type": "string"
              },
              "domain": {
                "description": "Company website or e-mail domain, e.g. google.com",
                "type": "string"
              },
              "vatNumber": {
                "description": "EU VAT number with country prefix, e.g. IE6388047V (also NO/CH/GB formats)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
