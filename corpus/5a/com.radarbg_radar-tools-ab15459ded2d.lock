          "title": "Airport Report - live flights, delays, weather and airport data",
          "description": "One call for one airport: airport record (IATA/ICAO, location, time zone), planes arriving and departing right now with airline and route, FAA delays and delay risk for US airports, METAR/TAF weather elsewhere. ~1-3 s. Free: 25 calls/day per IP. Paid: $0.01 per call via x402 at https://radarbg.com/x402/airport-report.",
          "inputSchema": {
            "examples": [
              {
                "airport": "JFK",
                "maxFlights": 10
              }
            ],
            "properties": {
              "airport": {
                "description": "IATA or ICAO code, e.g. JFK or EGLL",
                "type": "string"
              },
              "maxFlights": {
                "default": 20,
                "description": "Max live flights",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc763d8701ff81330f38ae5f93c3a2431be6e0cc2ad7d048fe1f9d50235dda29"
