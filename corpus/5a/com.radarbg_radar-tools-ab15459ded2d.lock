      },
      "instructions": "Fast lookups from official open sources: web page to Markdown, domain RDAP/DNS/TLS, US Federal Register, ClinicalTrials.gov, OSV.dev vulnerabilities, scholarly literature (OpenAlex/Crossref), email SPF/DKIM/DMARC checks. Each tool's inputSchema lists required fields and an example. 25 free calls per day per IP; for more, call the same tool over x402 (USDC pay per call).",
      "tools": [
        {
          "name": "age_calculator",
          "title": "Age Calculator API - exact age in years, months, days",
          "description": "Exact age from a birth date on today or any date: years, months, days, total days and next birthday. Runs on our server, files are deleted right after the call, nothing stored. Free: 25 calls/day per IP. Paid: $0.001 per call via x402 at https://radarbg.com/x402/age-calculator.",
          "inputSchema": {
            "examples": [
              {
                "dateOfBirth": "1990-05-17"
              }
            ],
            "properties": {
              "asOf": {
                "description": "Age on this date (default today)",
                "type": "string"
              },
              "dateOfBirth": {
                "description": "Date of birth YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["dateOfBirth"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
