        {
          "name": "barcode_generator",
          "title": "Barcode Generator - EAN-13, EAN-8, UPC-A, Code 128, Code 39, ISBN",
          "description": "Draw a print-ready barcode as PNG (base64) and SVG: EAN-13, EAN-8, UPC-A, ISBN-13 (check digit computed or verified), Code 128 and Code 39 for any text. Wrong length or check digit -> clear 400 error. Runs on our server, < 0.2 s. Free: 25 calls/day per IP. Paid: $0.001 per call via x402 at https://radarbg.com/x402/barcode-generator.",
          "inputSchema": {
            "examples": [
              {
                "type": "ean13",
                "value": "590123412345"
              }
            ],
            "properties": {
              "type": {
                "default": "ean13",
                "description": "ean13, ean8, upca, code128, code39 or isbn13",
                "enum": ["ean13", "ean8", "upca", "code128", "code39", "isbn13"],
                "type": "string"
              },
              "value": {
                "description": "The number or text to encode, e.g. 590123412345",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
