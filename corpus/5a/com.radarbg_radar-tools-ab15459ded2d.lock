        {
          "name": "business_days",
          "title": "Business Days Calculator API - add working days, count between dates",
          "description": "Working-day maths with each country's (and state's) public holidays: add or subtract N business days to a date (payment terms, delivery, legal deadlines), or count business days between two dates. Custom weekend (e.g. Fri-Sat). Returns the holidays that were skipped. < 50 ms. Free: 25 calls/day per IP. Paid: $0.001 per call via x402 at https://radarbg.com/x402/business-days.",
          "inputSchema": {
            "examples": [
              {
                "add": 5,
                "country": "DE",
                "start": "2026-12-22"
              }
            ],
            "properties": {
              "add": {
                "description": "Business days to add (negative = back)",
                "type": "integer"
              },
              "country": {
                "description": "ISO 3166 alpha-2 code, e.g. DE, BG, US",
                "type": "string"
              },
              "end": {
                "description": "Or an end date YYYY-MM-DD to count business days between",
                "type": "string"
              },
              "start": {
                "description": "Start date YYYY-MM-DD (default today)",
                "type": "string"
              },
              "subdivision": {
                "description": "State/region code (optional)",
                "type": "string"
              },
              "weekend": {
                "description": "Weekend weekdays, 0=Mon..6=Sun, default 5,6",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
