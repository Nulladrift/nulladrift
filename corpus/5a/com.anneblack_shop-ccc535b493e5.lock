      },
      "instructions": "anne black is a danish design studio making handmade porcelain: cabinet knobs and wall hooks, vases, flowerpots, tableware and porcelain jewellery. designed in copenhagen, made by hand in bat trang, vietnam.\n\nhow to use this server:\n- pick a store: \"com\" (english, EUR, default), \"dk\" (danish, DKK) or a language code (de, fr, nl, sv, it, es, pl, pt, fi, cs, sk, hu, ro, bg, el, hr, sl, et, lv, lt — all EUR). use the store that matches the customer's language and country; customers in denmark normally use \"dk\".\n- search_products → get_product (variants: colour, size, price, stock) → create_cart_link.\n- create_cart_link returns a url for the customer. they open it, add the items to the basket in one click and pay themselves in the normal checkout. you cannot place orders or pay through this server.\n- prices include vat. stock shows only whether an item can be bought now.\n- brand and product names are written in lower case. glaze colour names (e.g. \"mustard\", \"dusty blue\") are the same in every language.",
