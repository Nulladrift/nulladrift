{
  "lockfileVersion": 2,
  "subjects": {
    "com.jirventures/knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiagent.jirventures.com/brain/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "open-brain",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch Open Brain Thought",
          "description": "Fetch one Open Brain thought by ID after using search. Use this read-only compatibility tool to retrieve the full text and metadata for citation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The Open Brain thought ID returned by the search tool",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7db4b9f0a9b638f4b5e3186cc32d656c1d3b509e5680032c0fd49250014116f2"
        },
        {
          "name": "list_thoughts",
          "title": "List Recent Thoughts",
          "description": "List recently captured thoughts with optional filters by type, topic, person, or time range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Only thoughts from the last N days",
                "type": "number"
              },
              "limit": {
                "default": 10,
                "type": "number"
              },
              "person": {
                "description": "Filter by person mentioned",
                "type": "string"
              },
              "topic": {
                "description": "Filter by topic tag",
                "type": "string"
              },
              "type": {
                "description": "Filter by type: observation, task, idea, reference, person_note",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fe1314a2054d6e80642402951083557dc309aab5ae1beeb44fba76056fb238ef"
        },
        {
          "name": "search",
          "title": "Search Open Brain",
          "description": "Search Open Brain memories by meaning. Use this read-only compatibility tool when ChatGPT needs search/fetch-style access to stored thoughts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "The search query to run against Open Brain thoughts",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df3d413c74e3905d914cb08c0dd0400c5bce5b36bb785930ece5a721faea4e89"
        },
        {
          "name": "search_thoughts",
          "title": "Search Thoughts",
          "description": "Search captured thoughts by meaning. Use this when the user asks about a topic, person, or idea they've previously captured.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "type": "number"
              },
              "query": {
                "description": "What to search for",
                "type": "string"
              },
              "threshold": {
                "default": 0.5,
                "type": "number"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ed7f57060f5f2fb190c5b409a3a441279177b3c82cd9fcbb58a8aab81d9f89a"
        },
        {
          "name": "thought_stats",
          "title": "Thought Statistics",
          "description": "Get a summary of all captured thoughts: totals, types, top topics, and people.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d4b96aaadfe02b46b5b163de91bca592e9176f9b751463c5e1fb16f3b434037"
        }
      ],
      "digest": "sha256:32556b943dab10f168e716eb4f339292c56d159621fad707df3db6f41379637b"
    }
  }
}
