      "serverInfo": {
        "name": "open-brain",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch Open Brain Thought",
          "description": "Fetch one Open Brain thought by ID after using search. Use this read-only compatibility tool to retrieve the full text and metadata for citation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The Open Brain thought ID returned by the search tool",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4d094e5cedf72243a0de17a51b76126d68c7e968fca3c3340527708650b12cb"
        },
        {
          "name": "list_thoughts",
          "title": "List Recent Thoughts",
          "description": "List recently captured thoughts with optional filters by type, topic, person, or time range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Only thoughts from the last N days",
                "type": "number"
              },
              "limit": {
                "default": 10,
                "type": "number"
              },
              "person": {
                "description": "Filter by person mentioned",
                "type": "string"
              },
              "topic": {
                "description": "Filter by topic tag",
                "type": "string"
              },
              "type": {
                "description": "Filter by type: observation, task, idea, reference, person_note",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:51e2d3798472d38bbef0a0ceb99b6a35a704a3f3a85ab0e8e968aa7202f503f6"
        },
        {
          "name": "search",
          "title": "Search Open Brain",
          "description": "Search Open Brain memories by meaning. Use this read-only compatibility tool when ChatGPT needs search/fetch-style access to stored thoughts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "The search query to run against Open Brain thoughts",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:15a7d955134bafb6ca20bbcf63be2926836e5280d9707d0d9448795b472b0755"
        },
        {
          "name": "search_thoughts",
          "title": "Search Thoughts",
          "description": "Search captured thoughts by meaning. Use this when the user asks about a topic, person, or idea they've previously captured.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "type": "number"
              },
              "query": {
                "description": "What to search for",
                "type": "string"
              },
              "threshold": {
                "default": 0.5,
                "type": "number"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
