          "digest": "sha256:fe14f8208043afe80f1b66eb35a5dd8e3fa57486c76fdd643e8701c9dde91b25"
        },
        {
          "name": "get_pipeline_stats",
          "title": "Pipeline stats",
          "description": "How the pipeline stands: how many prospects, how many carry signals, enrichment state, how many have an email address, how many were contacted, what was added in the last 7 days, the most common signal types, and the remaining plan quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
