            "readOnly": true
          },
          "digest": "sha256:44102ab8e8bc89a59934cece1a6803dc22c4f4d6c901b843ac4c2ef9e39450e4"
        },
        {
          "name": "get_prospect",
          "title": "Get one prospect",
          "description": "Everything known about one prospect: role, company, location, language, every detected signal with the verbatim quote from its source and the LinkedIn URL it came from, any existing email or LinkedIn draft, and outreach state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "linkedinUrl": {
                "description": "Their LinkedIn profile URL, if the id is unknown",
                "type": "string"
              },
              "prospectId": {
                "description": "The prospect id from list_prospects",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
