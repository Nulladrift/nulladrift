        {
          "name": "get_sample_pipeline",
          "title": "Sample pipeline (no account needed)",
          "description": "A fictional pipeline in exactly the shapes the real tools return: an ICP, the signal definitions, pipeline stats and six prospects with their signals, verbatim quotes and drafts. Works without any credential, so an agent can show what Getcleed produces before an account exists. Nothing in it is a real person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
