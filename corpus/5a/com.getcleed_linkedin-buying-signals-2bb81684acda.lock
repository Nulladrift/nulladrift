        {
          "name": "create_sequence",
          "title": "Create a sequence",
          "description": "Create an outreach sequence. approach \"signal\": a connection request, then an opener Getcleed writes for each lead from their own signals and two follow-ups (the default, and what the product is for). \"simple\": four short generic messages. \"own\": fixed messages you pass, sent to everyone with {{first_name}} and {{company|your team}} filled in (write a fallback after | for company). The sequence is created stopped and empty: nothing is sent until leads are added and start_sequence is confirmed. Does not need LinkedIn connected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "approach": {
                "default": "signal",
                "enum": ["signal", "simple", "own"],
                "type": "string"
              },
              "dailyLimit": {
                "default": 20,
                "description": "Most leads started per day",
                "type": "integer"
              },
              "messages": {
                "description": "For approach \"own\": the messages in order. The first goes out the day after they accept the connection request.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "reviewBeforeSend": {
                "default": false,
                "description": "true: every message waits for an approval before it is sent. false (the product default): messages go out on schedule.",
                "type": "boolean"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
