        },
        {
          "name": "list_prospects",
          "title": "List prospects",
          "description": "Search the saved prospects in the account. Filter by company, industry, job title, country, signal type, minimum number of signals, whether an email address is known, enrichment state, or whether they have been contacted. Ordered by signal count, then most recently saved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "enrichmentStatus": {
                "enum": ["pending", "enriched", "failed"],
                "type": "string"
              },
              "hasEmail": {
                "type": "boolean"
              },
              "industry": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many to return (max 50)",
                "type": "integer"
              },
              "minSignals": {
                "description": "Only prospects with at least this many signals",
                "type": "integer"
              },
              "notContacted": {
                "description": "Only prospects with no email sent yet",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "type": "integer"
              },
              "search": {
                "description": "Free text matched against first name, last name, company and title",
                "type": "string"
              },
              "signalType": {
                "description": "Only prospects carrying a signal of this type (see list_signals)",
                "type": "string"
              },
              "title": {
                "description": "Job title contains this text",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
