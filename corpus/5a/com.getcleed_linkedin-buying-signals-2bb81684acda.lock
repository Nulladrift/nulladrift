      "instructions": "getcleed finds B2B prospects showing buying signals on LinkedIn and runs the outreach to them. The daily work of the web app can be done here; the user only opens it to sign in to LinkedIn or a mailbox, and for billing.\n\nWithout an account, get_sample_pipeline returns a fictional pipeline in the real shapes, so you can show the user what Getcleed produces before they connect. On an account, start with get_account_status: it says what is set up, what is missing and gives the link for the steps only the user can do in a browser.\n\nThe daily loop:\n1. Find: find_leads searches for people matching the targeting (get_icp, update_targeting) and puts them in a review queue. It runs in the background; get_search_status follows it.\n2. Review: list_search_results shows who was found with a fit level. approve_leads saves people as leads and can add them to a sequence; reject_leads hides them, and add_exclusion stops similar people from coming back.\n3. Reach out: create_sequence, then start_sequence. list_sequence_messages shows what each lead will receive; update_sequence_lead edits or approves one message.\n4. Answer: list_replies, get_conversation, send_reply.\n\nlist_prospects and get_prospect read saved leads; every signal carries the verbatim quote from the post it came from, so quote that rather than paraphrasing. analyze_prospects detects signals on leads that have none.\n\nSending is real. start_sequence, approve_leads or add_leads_to_sequence into a running sequence, approving a message with update_sequence_lead, and turning sending on with update_sending_settings make connection requests and messages go out from the user's own LinkedIn account. They first answer with what will happen and act only when called again with confirm: true. Setting confirm is your statement that the user read that answer and agreed; never set it on your own. send_reply, send_email and send_linkedin_message reach a person immediately and cannot be undone: show the user the exact text and get their agreement before calling them.\n\nWhen a value is missing from an answer, leave it out rather than telling the user it could not be found.",
      "tools": [
        {
          "name": "add_exclusion",
          "title": "Exclude a kind of lead",
          "description": "Save an exclusion in the account targeting so later searches skip matching people: a job title keyword, an industry, or a company size limit. With candidateId (a result just rejected), matching people still waiting in that same search are removed too. The user can see and remove exclusions with get_icp and remove_exclusion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidateId": {
                "description": "A result from the search whose queue should also be cleared of matching people",
                "type": "string"
              },
              "direction": {
                "description": "For size: exclude companies over or under that many employees",
                "enum": ["over", "under"],
                "type": "string"
              },
              "kind": {
                "description": "title = a word in the job title, industry = a company industry, size = a company headcount limit",
                "enum": ["title", "industry", "size"],
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "The title keyword (at least 5 characters: it hides every title containing it), the industry name, or the number of employees"
              }
            },
            "required": ["kind", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
