        {
          "name": "import_sourced_leads",
          "title": "Import sourced leads",
          "description": "Save candidates returned by find_leads_from_signals. They arrive already enriched and with the signal attached, including the verbatim quote from the post that surfaced them. Counts against the import quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listId": {
                "type": "string"
              },
              "signalType": {
                "description": "The signalType returned by find_leads_from_signals",
                "type": "string"
              },
              "tokens": {
                "description": "The token values of the candidates to import",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["signalType", "tokens"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
