{
  "lockfileVersion": 2,
  "subjects": {
    "com.getcleed/linkedin-buying-signals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.getcleed.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "getcleed",
        "title": "getcleed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "getcleed finds B2B prospects showing buying signals on LinkedIn and drafts the outreach.\n\nWithout an account, get_sample_pipeline returns a fictional pipeline in the real shapes, so you can show the user what Getcleed produces before they connect. On an account, start with get_pipeline_stats for the lay of the land, list_signals to see what this account treats as a buying signal, and get_icp for who it targets. list_prospects and get_prospect read the pipeline; every signal carries the verbatim quote from the post it came from, so quote that rather than paraphrasing.\n\nTo grow the pipeline: find_leads_from_signals searches recent LinkedIn posts on the account's own signal topics and returns ICP-matching people (nothing is saved until import_sourced_leads), add_leads_from_urls saves specific profiles, and analyze_prospects detects signals on prospects that have none.\n\nsend_email and send_linkedin_message reach real people immediately and cannot be undone. Show the user the draft and get their agreement before calling them.",
      "tools": [
        {
          "name": "add_leads_from_urls",
          "title": "Add leads from LinkedIn URLs",
          "description": "Save LinkedIn profiles as prospects and enrich them (name, role, company, industry, location, language). Skips anyone already saved. Counts against the import quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "linkedinUrls": {
                "description": "LinkedIn profile URLs",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "listId": {
                "description": "Optional list to add them to (see get_icp for list ids)",
                "type": "string"
              }
            },
            "required": ["linkedinUrls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa7d9174c92c3b01add1d0a5e1096dfbefce037bda53c46ca00ecfbb4ce586a8"
        },
        {
          "name": "analyze_prospects",
          "title": "Analyze prospects",
          "description": "Run the signal pipeline on prospects: enrich anyone missing company data, read their recent LinkedIn activity, and detect buying signals. Every signal kept must quote its source verbatim. Counts against the monthly analysis quota. Slow: expect up to a few minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Cap when prospectIds is omitted",
                "type": "integer"
              },
              "prospectIds": {
                "description": "Which prospects to analyze; omit to take those with no signals yet",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74fd7a21fed4b7a074e63dac5370e0fa32b1df59f4b144b682aa6d0d27e90f26"
        },
        {
          "name": "create_custom_signal",
          "title": "Create a custom signal",
          "description": "Teach the account a new buying signal to look for, described in plain language (for example \"people complaining their onboarding takes too long\"). Future analyses and sourcing will use it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detects": {
                "description": "What to look for, in plain language",
                "type": "string"
              },
              "exampleDetail": {
                "type": "string"
              },
              "exampleTitle": {
                "type": "string"
              },
              "name": {
                "description": "Short display name",
                "type": "string"
              }
            },
            "required": ["detects", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1930160557b1a448950129ade6b8a9676a75e31cb3a990d27f89737d14c22e77"
        },
        {
          "name": "draft_email",
          "title": "Draft an email",
          "description": "Write a personalised email for a prospect, built from their detected signals, in their language. Saves the draft on the prospect and returns it. Does not send.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["english", "french"],
                "type": "string"
              },
              "linkedinUrl": {
                "type": "string"
              },
              "prospectId": {
                "type": "string"
              },
              "regenerate": {
                "default": false,
                "description": "Ignore any cached draft",
                "type": "boolean"
              },
              "signalIndex": {
                "default": 0,
                "description": "Which signal to lead with",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f61c4646889d6e95f4ff40bc2c80a44cfd6c6c77ff62f03b372639a55460718"
        },
        {
          "name": "draft_linkedin_message",
          "title": "Draft a LinkedIn message",
          "description": "Write a short LinkedIn connection note for a prospect from their detected signals, in their language. Saves the draft and returns it. Does not send. Drafts follow the house rules (one fact about them, one question, no pitch, under 200 characters) and so must any note passed to send_linkedin_message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["english", "french"],
                "type": "string"
              },
              "linkedinUrl": {
                "type": "string"
              },
              "prospectId": {
                "type": "string"
              },
              "regenerate": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3ae8a0726842fe6ada02ed1693a3d53b399ed6a00b5cdd575d9904f59e1f528"
        },
        {
          "name": "find_leads_from_signals",
          "title": "Find new leads from signal topics",
          "description": "Search recent LinkedIn posts on the topics of this account's own signal definitions, keep only posts a check can prove are on topic, and return the people who wrote, commented on or reacted to them, filtered against the ICP (role, industry, country) and ranked. Nothing is saved: pass the returned candidates to import_sourced_leads. Spends a little of the monthly sourcing budget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "postsPerSignal": {
                "default": 3,
                "type": "integer"
              },
              "signalType": {
                "description": "Which signal to source for; omit to use the first enabled one (see list_signals)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c251172cf5946afafc6e7555b26de723ba8b8b65c35321265012eac4bad9a6e0"
        },
        {
          "name": "get_icp",
          "title": "Get the ideal customer profile",
          "description": "The active ICP: target roles, industries, countries, company sizes, relevant keywords and any exclusions. This is what sourcing and scoring filter against.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
