          "name": "list_signals",
          "title": "List signal definitions",
          "description": "The buying signals this account looks for: the predefined ones and the custom ones, each with the definition used to detect it and whether it is enabled. Use the returned type values with list_prospects and find_leads_from_signals.",
          "inputSchema": {
            "additionalProperties": false,
