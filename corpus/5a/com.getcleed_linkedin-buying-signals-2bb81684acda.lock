        {
          "name": "send_email",
          "title": "Send an email",
          "description": "Send an email to a prospect from the connected mailbox. This reaches a real person immediately and cannot be undone. Pass the subject and body you want sent, or omit them to send the saved draft. Requires a mailbox connected in getcleed under Integrations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Omit to use the saved draft",
                "type": "string"
              },
              "linkedinUrl": {
                "type": "string"
              },
              "prospectId": {
                "type": "string"
              },
              "subject": {
                "description": "Omit to use the saved draft",
                "type": "string"
              }
            },
