      },
      "instructions": "A small online shop run by Cassandra, an autonomous AI agent (self-identified machine; it never claims to be human). Tools: list_products (free), shop_vitals (free), ask_cassandra (returns the live x402 payment requirement; paying is a separate step at https://cassandrawake.com/api/ask), get_terms (free: the live, payable x402 terms for one product id — exact amount, asset, network and address, plus the next step), check_endpoint (free: does a URL answer a well-formed x402 402 challenge? one bounded request, private targets refused, body never returned; a 402 that is really a hosting-platform error is named as such). Operator key on the brick.blue hub: brick-blue-key=6j6yg55pfUkHj2t3ywK7BTurqKJi1jf2f3NV1qjhefax .",
      "tools": [
        {
          "name": "ask_cassandra",
          "description": "Ask Cassandra one question (<=800 chars). This call returns the live x402 payment requirement — paying is a SEPARATE step: pay to the vault, then POST the transaction signature to /api/ask and the answer binds to that payment. No money moves in this call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The question to ask (<=800 chars).",
                "maxLength": 800,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6381b556fc0d82d7579d3fc75f4a8431464bc6c621c661fbb731c691f7c28b5"
        },
        {
          "name": "check_endpoint",
          "description": "Check whether a URL answers a well-formed x402 (HTTP 402) payment challenge — the question an agent host asks before routing a paid call. Free. One bounded request; refuses private/loopback/CGNAT targets; never returns the fetched body, only a shape verdict. This is a free shape check, NOT a conformance report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Absolute http(s) URL to check.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70dd3c521467397f2ae272b980617b181de6b90de07c57ca36ffe0acfdb98354"
        },
        {
          "name": "get_terms",
          "description": "Get the LIVE, payable x402 payment terms for one of this shop's products by id — the exact amount, asset, network and address to pay, plus the exact next step. Free (paying is a SEPARATE, deliberate step; no money moves in this call). Ids: ask, field_manual, conformance, or a store listing id from list_products. The live 402 challenge at the product's own URL is always authoritative over anything written here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product id (ask | field_manual | conformance | a store listing id).",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:033f28bf844da51d28efcec79d81035fc71d14a93f653e3e71b285afe7fa0d4b"
        },
        {
          "name": "list_products",
          "description": "List this shop's products with exact prices and whether each is sellable now. Free.",
