  "subjects": {
    "com.getwigoo/wigoo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.getwigoo.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "wigoo",
        "title": "Wigoo",
        "version": "1.0.0",
        "description": "Wigoo, the AI travel companion. Today: travel eSIMs for 190+ countries and regions, with networks, data, validity, prices in the traveler's currency and a link to buy. Trip planning and more travel services are coming to the same server.",
        "websiteUrl": "https://getwigoo.com",
        "icons": [
          {
            "src": "https://getwigoo.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://getwigoo.com/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Wigoo sells travel eSIMs for 190+ countries and regions. To help a traveler: search_destinations, then list_plans or get_destination, then get_quote for the buy link. Prices are list prices in the buyer's currency; the final amount is calculated at checkout. Purchases happen on getwigoo.com through the buy link; this server does not place orders. No account is needed to buy: an email is enough, and get_quote explains the steps.",
      "tools": [
        {
          "name": "get_destination",
          "title": "Destination facts",
          "description": "What a destination offers: networks, data sizes, validity options, whether unlimited day passes and top ups exist, the starting price, and what the traveler needs to know.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "ISO 4217 code for prices, e.g. EUR, GBP, JPY. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "destination_id": {
                "description": "Destination id from search_destinations, e.g. \"jp\" or \"eu-42\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the buy link and of region names: en, it, es, fr, de, pl, pt, tr. Defaults to en.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["destination_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destination facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83e29f79f01c84be551f94042e1533efb06f47384f67588c8c1c9acc70e336db"
        },
        {
          "name": "get_quote",
          "title": "Quote and buy link",
          "description": "The price of one plan in the requested currency, and the link where the traveler buys it on getwigoo.com. This tool does not place an order: the purchase happens on the site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "ISO 4217 code for prices, e.g. EUR, GBP, JPY. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "destination_id": {
                "description": "Destination id from search_destinations, e.g. \"jp\" or \"eu-42\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the buy link and of region names: en, it, es, fr, de, pl, pt, tr. Defaults to en.",
                "maxLength": 10,
                "type": "string"
              },
              "plan_id": {
                "description": "Plan id from list_plans.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "description": "How many eSIMs to buy, each for one phone. From 1 to 10, 1 if omitted.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["destination_id", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote and buy link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64624ee1db586819372ea98aad0f2d2b06fc140ed94cf08d6d7b6fcc459ca5d2"
        },
        {
          "name": "list_plans",
          "title": "List eSIM plans",
          "description": "The plans on sale for a destination, with data, validity, networks and price in the requested currency. Unlimited plans give a daily amount at full speed, then a reduced speed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "ISO 4217 code for prices, e.g. EUR, GBP, JPY. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "destination_id": {
                "description": "Destination id from search_destinations, e.g. \"jp\" or \"eu-42\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the buy link and of region names: en, it, es, fr, de, pl, pt, tr. Defaults to en.",
                "maxLength": 10,
                "type": "string"
              },
              "type": {
                "description": "Only fixed data plans, only unlimited day passes, or all. Defaults to all.",
                "enum": ["all", "fixed", "unlimited"],
                "type": "string"
              }
            },
            "required": ["destination_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0a29530f1db6fec81ba608af932c418a320bbac580bf9594a95bb97fee461ba"
        },
        {
          "name": "search_destinations",
          "title": "Search eSIM destinations",
          "description": "Find the countries and regions Wigoo sells travel eSIMs for, with the starting price and a buy link. Search by country or region name in English, or by ISO country code. Without a query it returns the popular destinations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "ISO 4217 code for prices, e.g. EUR, GBP, JPY. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the buy link and of region names: en, it, es, fr, de, pl, pt, tr. Defaults to en.",
                "maxLength": 10,
                "type": "string"
              },
              "query": {
                "description": "Country or region name in English, or ISO code: \"Japan\", \"JP\", \"Europe\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search eSIM destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1d2627cdf4752ff89a49c32d6a67f310b660fb1bfc4ca4a1962ea9a43757305"
        }
      ],
      "digest": "sha256:d57059d6d73e2ea57cc54608eca12767054b8e68c9b46c5ba992379a7d925342"
    }
