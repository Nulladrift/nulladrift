      "serverInfo": {
        "name": "gtinfetch",
        "title": "gtinfetch – Agentic Commerce",
        "version": "1.6.0-estate2",
        "description": "gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it. 84M GTINs, retail grocery.",
        "websiteUrl": "https://gtinfetch.ai",
        "icons": [
          {
            "src": "https://gtinfetch.ai/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://gtinfetch.ai/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it. 84M GTINs, retail grocery.\nOne tool: fetch_gtin(gtin, market?). Every field carries its source pages and the date read; status unknown means no observation — never a guess. Can it be sold here is the hub's gate, not this door's. Read-only, no auth.",
      "tools": [
        {
          "name": "fetch_gtin",
          "title": "Fetch GTIN",
          "description": "What is this GTIN? Returns the signed record for a GTIN-8/12/13/14: product, brand, maker, category and pack where a source page states them, each with the pages it was read from and the date it was read; seen_in markets and banners; confidence confirmed (two or more independent domains agree) or seen (one). A GTIN with no observation answers status unknown with no fields — never a guess. Pass market (hub market code; UK accepted for GB) to tag the ask with the market: a miss is queued as a lead for that market. Can it be sold there is the hub's gate, not this door's.",
          "inputSchema": {
            "properties": {
              "gtin": {
                "description": "8, 12, 13 or 14 digits",
                "pattern": "^[0-9]{8,14}$",
                "type": "string"
              },
              "market": {
                "description": "optional hub market code, e.g. UK, US, FR",
                "type": "string"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "confidence": {
                "type": "string"
              },
              "fields": {
                "type": "object"
              },
              "gtin14": {
                "type": "string"
              },
              "signature": {
                "type": "object"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["gtin14", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc14682a367f8900a0649fb59a5be81804ed41b6ac39c4c45d9bdb7888fd636e"
        }
