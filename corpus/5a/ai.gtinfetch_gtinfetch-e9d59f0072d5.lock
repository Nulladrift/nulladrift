{
  "lockfileVersion": 2,
  "subjects": {
    "ai.gtinfetch/gtinfetch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gtinfetch.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gtinfetch",
        "title": "gtinfetch – Agentic Commerce",
        "version": "1.7.0-fbw01",
        "description": "gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it. 84M GTINs, retail grocery.",
        "websiteUrl": "https://gtinfetch.ai",
        "icons": [
          {
            "src": "https://gtinfetch.ai/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://gtinfetch.ai/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it. 84M GTINs, retail grocery.\nMCP addresses: https://mcp.gtinfetch.ai/mcp and https://gtinfetch.ai/mcp (the same door).\nOne tool: fetch_gtin(gtin, market?, believes?, receipt?). Every answer carries answer (verified, not verified or unknown, by the published rule), reason, rule_version and region; receipt: true writes a signed receipt in the same call at https://rco.wefetch.ai/. Every field carries its source pages and the date read; status unknown means no observation — never a guess. Can it be sold here is the hub's gate, not this door's. Read-only, no auth.",
      "tools": [
        {
          "name": "fetch_gtin",
          "title": "Fetch GTIN",
          "description": "What is this GTIN? Returns the signed record for a GTIN-8/12/13/14: product, brand, maker, category and pack where a source page states them, each with the pages it was read from and the date it was read; seen_in markets and banners; confidence confirmed (two or more independent domains agree) or seen (one). A GTIN with no observation answers status unknown with no fields — never a guess. Pass market (hub market code; UK accepted for GB) to tag the ask with the market: a miss is queued as a lead for that market. Can it be sold there is the hub's gate, not this door's. Extended 2026-11-13: every answer also carries answer (verified · not verified · unknown, by the published rule at https://gtinfetch.ai/rule.json), reason, facts with the variant facts (size, pack count, type), facts_compared, sources_read (each source with its last-read date), rule_version and region. Optional inputs: market (used for the recall check), believes {brand, product, size} (what you believe you are buying), receipt (true writes a signed receipt of the check in the same call at https://rco.wefetch.ai/; anyone can check it at https://rco-barcodeverified.org/verify). A barcode-only call returns everything it returned before, with the new fields beside the old.",
          "inputSchema": {
            "properties": {
              "believes": {
                "description": "optional: what the agent believes it is buying, as the agent holds it. Checked against the record; facts_compared says what was checked and what could not be.",
                "properties": {
                  "brand": {
                    "type": "string"
                  },
                  "product": {
                    "description": "product name",
                    "type": "string"
                  },
                  "size": {
                    "description": "e.g. 400 g, 6 x 330 ml, 12 ct",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "gtin": {
                "description": "8, 12, 13 or 14 digits",
                "pattern": "^[0-9]{8,14}$",
                "type": "string"
              },
              "market": {
                "description": "optional hub market code, e.g. UK, US, FR",
                "type": "string"
              },
              "receipt": {
                "description": "optional: true writes a signed receipt of this check in the same call, at https://rco.wefetch.ai/. The answer is always given; the receipt is what is paid for.",
                "type": "boolean"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "description": "the firm answer, by the published rule. verified: the barcode is on record with at least one source and no conflict. not verified: the sources conflict with each other, or a recall or correction stands against the record. unknown: the barcode is not on record; it is added to the sourcing queue. On verified, go ahead; on not verified, stop and correct, or ask your principal; on unknown, treat as unchecked.",
                "enum": ["verified", "not verified", "unknown"],
                "type": "string"
              },
              "as_of": {
                "type": "string"
              },
              "confidence": {
                "type": "string"
              },
              "facts": {
                "description": "brand, product, maker, category and the variant facts the record holds: size, pack count, type",
                "type": "object"
              },
              "facts_compared": {
                "description": "which of the agent's stated facts were checked against the record (checked[]), and which could not be (not_checked[])",
                "type": "object"
              },
              "fields": {
                "type": "object"
              },
              "gtin14": {
                "type": "string"
              },
              "reason": {
                "description": "one plain sentence saying why; always present. On verified it states the number of sources that hold the barcode.",
                "type": "string"
              },
              "receipt": {
                "description": "present if a receipt was asked for: number, state (signed | pending), and where to check it",
                "type": "object"
              },
              "region": {
                "description": "which region answered",
                "type": "string"
              },
              "rule_version": {
                "description": "the version of the published rule that produced the answer (https://gtinfetch.ai/rule.json)",
                "type": "string"
              },
              "signature": {
                "type": "object"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources_read": {
                "description": "each source behind the record with the date it was last read",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["gtin14", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7746d66d9f5ef9f8fdb807a1aeff542f9d491280002256c4ff50fe4d71649a35"
        }
      ],
      "digest": "sha256:3b7d50f50a5aef65244706fdeca73a99bd99264bf6cba30a8f1580df03d110a2"
    }
  }
}
