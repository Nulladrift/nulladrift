      "serverInfo": {
        "name": "gtinfetch",
        "title": "gtinfetch – Agentic Commerce",
        "version": "1.8.0-wf2027",
        "description": "84M GTINs on the gtinfetch record. gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it.",
        "websiteUrl": "https://gtinfetch.ai",
        "icons": [
          {
            "src": "https://gtinfetch.ai/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://gtinfetch.ai/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "84M GTINs on the gtinfetch record. gtinfetch.ai is the resolver — the who, what, where of GTINs for agentic commerce. The GTIN fact checker for AI agents: any barcode, one call, the page under it.\nMCP addresses: https://mcp.gtinfetch.ai/mcp and https://gtinfetch.ai/mcp (the same door).\nFive calls, one for each need. Resolve: match_product(words, country) when you hold words, not a barcode. Verify: fetch_gtin(gtin) for the signed record of a barcode. Locate: locate(gtin) for the banners and markets where it is on the record as sold; never price or stock. Identify: identify(gtin) for the maker and the banners behind it, each with its page on identifyfetch.ai and its status (listed, claimed or verified). Prove: verify_receipt(id) to check a receipt; receipt: true on fetch_gtin, locate or identify writes one in the same call.\nfetch_gtin(gtin, market?, believes?, receipt?): every answer carries answer (verified, not verified or unknown, by the published rule), reason, rule_version and region; receipt: true writes a signed receipt in the same call at https://rco.wefetch.ai/. Every field carries its source pages and the date read; status unknown means no observation — never a guess. Can it be sold here is the hub's gate, not this door's. Read-only, no auth.",
      "tools": [
        {
          "name": "fetch_gtin",
          "title": "Fetch GTIN",
          "description": "What is this GTIN? Returns the signed record for a GTIN-8/12/13/14: product, brand, maker, category and pack where a source page states them, each with the pages it was read from and the date it was read; seen_in markets and banners; confidence confirmed (two or more independent domains agree) or seen (one). A GTIN with no observation answers status unknown with no fields — never a guess. Pass market (hub market code; UK accepted for GB) to tag the ask with the market: a miss is queued as a lead for that market. Can it be sold there is the hub's gate, not this door's. Extended 2026-11-13: every answer also carries answer (verified · not verified · unknown, by the published rule at https://gtinfetch.ai/rule.json), reason, facts with the variant facts (size, pack count, type), facts_compared, sources_read (each source with its last-read date), rule_version and region. Optional inputs: market (used for the recall check), believes {brand, product, size} (what you believe you are buying), receipt (true writes a signed receipt of the check in the same call at https://rco.wefetch.ai/; anyone can check it at https://rco-barcodeverified.org/verify). A barcode-only call returns everything it returned before, with the new fields beside the old.",
          "inputSchema": {
            "properties": {
              "believes": {
                "description": "optional: what the agent believes it is buying, as the agent holds it. Checked against the record; facts_compared says what was checked and what could not be.",
                "properties": {
                  "brand": {
                    "type": "string"
                  },
                  "product": {
                    "description": "product name",
                    "type": "string"
                  },
                  "size": {
                    "description": "e.g. 400 g, 6 x 330 ml, 12 ct",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "gtin": {
                "description": "8, 12, 13 or 14 digits",
                "pattern": "^[0-9]{8,14}$",
                "type": "string"
              },
              "market": {
                "description": "optional hub market code, e.g. UK, US, FR",
                "type": "string"
              },
              "receipt": {
                "description": "optional: true writes a signed receipt of this check in the same call, at https://rco.wefetch.ai/. The answer is always given; the receipt is what is paid for.",
                "type": "boolean"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "description": "the firm answer, by the published rule. verified: the barcode is on record with at least one source and no conflict. not verified: the sources conflict with each other, or a recall or correction stands against the record. unknown: the barcode is not on record; it is added to the sourcing queue. On verified, go ahead; on not verified, stop and correct, or ask your principal; on unknown, treat as unchecked.",
                "enum": ["verified", "not verified", "unknown"],
                "type": "string"
              },
              "as_of": {
                "type": "string"
              },
              "confidence": {
                "type": "string"
              },
              "facts": {
                "description": "brand, product, maker, category and the variant facts the record holds: size, pack count, type",
                "type": "object"
              },
              "facts_compared": {
                "description": "which of the agent's stated facts were checked against the record (checked[]), and which could not be (not_checked[])",
                "type": "object"
              },
              "fields": {
                "type": "object"
              },
              "gtin14": {
                "type": "string"
              },
              "reason": {
                "description": "one plain sentence saying why; always present. On verified it states the number of sources that hold the barcode.",
                "type": "string"
              },
              "receipt": {
                "description": "present if a receipt was asked for: number, state (signed | pending), and where to check it",
                "type": "object"
              },
              "region": {
                "description": "which region answered",
                "type": "string"
              },
              "rule_version": {
                "description": "the version of the published rule that produced the answer (https://gtinfetch.ai/rule.json)",
                "type": "string"
              },
              "signature": {
                "type": "object"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources_read": {
                "description": "each source behind the record with the date it was last read",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["gtin14", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7746d66d9f5ef9f8fdb807a1aeff542f9d491280002256c4ff50fe4d71649a35"
        },
        {
          "name": "identify",
          "title": "Identify: who is behind a barcode",
          "description": "Identify. Call this when you hold a barcode and need to know which company is behind it: who makes it, who sells it, and whether the company has claimed its record. Returns the maker as the record names it and the retail banners that sell it, each with its page on identifyfetch.ai and its status: listed (on the record from public sources), claimed (the company's agent has proved control of the company's own domain) or verified. Companies only: no person is named. Where the record names no maker, maker is null and the brand is given; a brand is not a company. Read from the same signed record as fetch_gtin.",
          "inputSchema": {
            "properties": {
              "gtin": {
                "description": "the barcode: 8, 12, 13 or 14 digits",
                "pattern": "^[0-9]{8,14}$",
                "type": "string"
              },
              "market": {
                "description": "optional market code, e.g. UK, US, FR",
                "type": "string"
              },
              "receipt": {
                "description": "optional: true writes a signed receipt of this check in the same call, at https://rco.wefetch.ai/",
                "type": "boolean"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "gtin14": {
                "type": "string"
              },
              "maker": {
                "type": ["object", "null"]
              },
              "on_record": {
                "type": "boolean"
              },
              "signature": {
                "type": "object"
              },
              "sold_by": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": ["string", "null"]
              }
            },
            "required": ["gtin14", "on_record"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b2b3e2d76b2c73bc6c9bd58b3652d80c9c548888f8a67b7b7419d4e375ee3e3f"
        },
        {
          "name": "locate",
          "title": "Locate: where a barcode is sold",
          "description": "Locate. Call this when you hold a barcode and need to know where the product is sold. Returns the retail banners and the markets where the barcode is on the record as sold, each with the source page it was read on (where the record holds one) and the date it was read, and each banner's page on identifyfetch.ai. Never price, never stock: for those, ask the retailer. An empty list means the record holds no place of sale, not that the product is not sold. Read from the same signed record as fetch_gtin.",
          "inputSchema": {
            "properties": {
              "gtin": {
                "description": "the barcode: 8, 12, 13 or 14 digits",
                "pattern": "^[0-9]{8,14}$",
                "type": "string"
              },
              "market": {
                "description": "optional market code, e.g. UK, US, FR: used for the recall check and to tag the ask",
                "type": "string"
              },
              "receipt": {
                "description": "optional: true writes a signed receipt of this check in the same call, at https://rco.wefetch.ai/",
                "type": "boolean"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "type": "string"
              },
              "banners": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "gtin14": {
                "type": "string"
              },
              "markets": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "on_record": {
                "type": "boolean"
              },
              "signature": {
                "type": "object"
              }
            },
            "required": ["gtin14", "on_record"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ebf940b8f076763373dc1ed33144a06dd3eee6d666a4b3df34fbfdfccccbbcd"
        },
        {
          "name": "match_product",
          "title": "Resolve: words to a barcode",
          "description": "Resolve. Call this when you hold words, not a barcode: a shopper's phrase (\"the big jar of Nutella\") or a merchant's offer line, and a country. Returns one barcode (Global Trade Item Number, GTIN) with a confidence when the record holds exactly one product for the words, otherwise the candidates, otherwise unknown. Never a guess. This is the matcher at matchfetch.ai, answered here under its own name; issue_receipt: true writes a signed receipt. Once you hold the barcode, call fetch_gtin to verify it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "two-letter country, e.g. UK, FR, DE, US",
                "type": "string"
              },
              "issue_receipt": {
                "default": false,
                "type": "boolean"
              },
              "kind": {
                "default": "phrase",
                "description": "phrase (default) or offer",
                "type": "string"
              },
              "words": {
                "description": "the phrase or the offer line",
                "type": "string"
              }
            },
            "required": ["country", "words"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e9575e270731cbac5e613ded03ded1cc32b8735c1e0429f6b417fc28b6d39ce"
        },
        {
          "name": "verify_receipt",
          "title": "Prove: check a receipt",
          "description": "Prove. Call this when you hold a receipt number or id (rc_… or pm_…) for a check and need the record that it was made: the receipt, its hash, its signature and its place in the chain, checked in public. This is the receipts door at rco.wefetch.ai, answered here under its own name. To have a receipt written, pass receipt: true on fetch_gtin, locate or identify (issue_receipt: true on match_product).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "the receipt id (pm_…) or number (rc_…)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:03fa1bff451067e5e0f8a0a94274db48d8ce9a799840fa6ea34252d23176bf32"
        }
      ],
      "digest": "sha256:0bef72dde9e937da9405f57072ee71860947cd9e2121489f284f84e14a112fa0"
    }
